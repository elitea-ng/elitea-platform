[project]
name = "elitea-runtime-proto"
version = "0.1.0"
description = "Generated Elitea runtime v1 Protocol Buffer bindings"
requires-python = ">=3.12"
dependencies = [
  "grpcio==1.85.0",
  "protobuf==7.36.2",
]

[project.optional-dependencies]
generate = [
  "grpcio-tools==1.85.0",
  "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen/python/elitea"]
