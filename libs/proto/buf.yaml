version: v2

modules:
  - path: .
    name: buf.build/elitea/runtime

lint:
  use:
    - STANDARD
  except:
    # Runtime protocol messages keep an explicit V1 suffix even though the
    # package is versioned; this makes persisted/generated type names
    # unambiguous when several protocol generations coexist.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
  except:
    # go_package is the Go import path of the generated stubs, not part of
    # the wire format: an old and a new peer still exchange the same bytes.
    # Every consumer is in this repository and is regenerated in the same
    # change, so a module move (EliteaAI -> elitea-ng, #1406) is not a
    # break that a rolling deploy can see.
    - FILE_SAME_GO_PACKAGE
