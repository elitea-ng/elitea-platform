syntax = "proto3";

package elitea.subapp.v1;

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/subapp/v1;subappv1";

// PlatformOperations are the operations a sub-application host (ADR-0023)
// offers the platform itself, as opposed to the toolkit tools it offers users
// through the provider SPI. They are not a user's to run, so the service is
// served on its own mutual-TLS listener and authorised by ONE thing: the
// verified client certificate of the platform service (elitea-main), matched
// against the host's allowlist of certificate identities. An identity
// signature, a metadata entry or a request field authorises nothing.
//
// This is the internal service-to-service transport AGENTS.md prescribes
// (gRPC over mTLS); the SPI's HTTP surface carries user traffic only.
//
// buf:lint:ignore SERVICE_SUFFIX
service PlatformOperations {
  // DeleteProject removes everything the application holds for one project:
  // for DeepWiki, the search index of every wiki of the project; for
  // Inventory, every graph of the project. It is idempotent: a project with
  // nothing left answers an empty success.
  //
  // It stops the project's running generations (DeepWiki) or ingests
  // (Inventory) first and waits a bounded time for them to end. When one is
  // still running after that wait it answers FAILED_PRECONDITION ("a
  // generation is still running; retry" / "an ingest is still running;
  // retry") and deletes NOTHING: that code always means nothing was deleted.
  // When a publish holds a wiki past the bounded wait it answers ABORTED
  // ("being published; retry").
  //
  // A deletion that went ahead but could not take everything (Inventory: a
  // toolkit's graph held by an ingest that started meanwhile or runs on
  // another replica; DeepWiki: a build whose heartbeat is live) is NOT a
  // failure: it answers OK with `complete = false`, what it deleted, and what
  // it left (`busy_toolkit_ids`, `live_builds`). The caller records that and
  // calls again later; the call is idempotent.
  //
  // It deletes the application's own data only; the project's artifacts
  // belong to the platform's project deletion.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // DeleteToolkit removes what the application holds for ONE toolkit of a
  // project: for Inventory, that toolkit's graph, when the toolkit is
  // deleted. It is idempotent: a toolkit with no graph answers an empty
  // success (deleted = false).
  //
  // It stops the toolkit's running ingests first and waits a bounded time;
  // an ingest still running answers FAILED_PRECONDITION ("an ingest is still
  // running; retry") and deletes nothing.
  //
  // An application with nothing per toolkit to delete (DeepWiki: its index is
  // per wiki, and a wiki is deleted by its own tool) answers UNIMPLEMENTED.
  rpc DeleteToolkit(DeleteToolkitRequest) returns (DeleteToolkitResponse);
}

message DeleteProjectRequest {
  // The platform project id; a positive integer.
  int32 project_id = 1;
}

message DeleteProjectResponse {
  int32 project_id = 1;
  // What was removed from each wiki that had an index, in deletion order.
  repeated WikiDeletion wikis = 2;
  // Builds in progress (staged rows of generations that have not published)
  // that were left alone because their heartbeat is live.
  int64 live_builds = 3;
  // Stale builds that were removed.
  int64 stale_builds_removed = 4;
  // Problems that did not stop the deletion, one human-readable line each.
  // Empty on a clean deletion.
  repeated string errors = 5;
  // Inventory: the toolkits whose graph was deleted, and what the deletion
  // removed in all. Empty for an application that has no graphs.
  repeated int64 graph_toolkit_ids = 6;
  GraphDeletion graphs = 7;
  // True when nothing of the project is left in the application. False when
  // something was left alone: a toolkit's graph an ingest holds
  // (busy_toolkit_ids) or a build whose heartbeat is live (live_builds). What
  // was deleted stays deleted; call again once they end.
  bool complete = 8;
  // Inventory: the toolkits whose graph was NOT deleted because an ingest
  // (or another write) holds it. Empty when complete.
  repeated int64 busy_toolkit_ids = 9;
  // Inventory: what each deleted toolkit's graph held, in deletion order;
  // `graphs` is their sum.
  repeated ToolkitGraphDeletion toolkit_graphs = 10;
}

// ToolkitGraphDeletion is what the deletion of one toolkit's Inventory graph
// removed, within a project deletion.
message ToolkitGraphDeletion {
  int64 toolkit_id = 1;
  GraphDeletion removed = 2;
}

message DeleteToolkitRequest {
  // The platform project id; a positive integer.
  int32 project_id = 1;
  // The toolkit (application) id within the project; a positive integer.
  int32 toolkit_id = 2;
}

message DeleteToolkitResponse {
  int32 project_id = 1;
  int32 toolkit_id = 2;
  // False when the toolkit had no graph, so there was nothing to delete.
  bool deleted = 3;
  GraphDeletion removed = 4;
}

// GraphDeletion is what the deletion of Inventory graphs removed.
message GraphDeletion {
  int64 entities = 1;
  int64 relations = 2;
  int64 sources = 3;
  int64 documents = 4;
}

// WikiDeletion is what one wiki's deletion removed.
message WikiDeletion {
  string wiki_id = 1;
  int64 nodes = 2;
  int64 edges = 3;
  int64 embeddings = 4;
  int64 statistics = 5;
}
