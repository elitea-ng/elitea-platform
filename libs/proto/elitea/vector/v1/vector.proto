syntax = "proto3";

// elitea.vector.v1 is the contract of elitea-vector, the only client of the
// platform's Qdrant (ADR-0031 decision 1).
//
// AUTHENTICATION. A caller sends one of these:
//
//   * gRPC metadata `authorization: Bearer <token>`, where the token is a
//     short-lived, project-bound token minted by elitea-main (a worker claim
//     token or an engine callback token). elitea-vector verifies it through
//     elitea.vector.v1.TokenIntrospectionService and caches the answer until
//     the token expires.
//   * No token, over an mTLS connection whose client certificate identity is
//     in elitea-vector's administrator list (elitea-main). This path admits
//     only Delete, DropProject, Count and ListIndexes.
//
// Anything else is refused with UNAUTHENTICATED. elitea-vector fails closed
// when elitea-main is unreachable.
//
// SCOPE. elitea-vector injects the verified project as a `must` condition
// into every read, write, count and delete. A request can narrow that scope
// with its own filter but never widen it. Each request has a `project_id`
// field: a token caller can leave it 0; a non-zero value that differs from
// the token's project is refused with PERMISSION_DENIED. An administrator
// caller must set it.
//
// LAYOUT (ADR-0031 decision 2). One Qdrant collection per embedding space,
// named `emb_<model_slug>_<dimension>`. Points carry the payload keys
// `project_id`, `source`, `namespace_id`, `generation` (optional),
// `document_key`, `document_version`, `parent_id`, `chunk_id`, `chunk_type`,
// `acl`, `text` and `metadata`. A point id is UUIDv5, under namespace_id, of
// (project_id, source, generation, document_key, chunk_id), so writes are
// idempotent and never overwrite another project's or another source's
// points.

package elitea.vector.v1;

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/vector/v1;vectorv1";

// VectorService is served by elitea-vector over mTLS.
service VectorService {
  // Upsert writes points into one namespace. The first message is a header;
  // every later message is a batch. The stream is one unit of
  // authentication and scope, not one transaction: batches already written
  // stay written when a later batch fails.
  rpc Upsert(stream UpsertRequest) returns (UpsertResponse);
  // Delete removes points of one namespace: all of them, those of some
  // documents, or those of some generations.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // DropProject removes every point of one project, in every collection and
  // for every source. Only an administrator caller can use it.
  rpc DropProject(DropProjectRequest) returns (DropProjectResponse);
  // Search is a dense nearest-neighbour search by cosine similarity.
  rpc Search(SearchRequest) returns (SearchResponse);
  // HybridSearch fuses a dense search and a BM25 search over `text` by
  // weighted reciprocal rank fusion. Each point also carries its dense
  // cosine score.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse);
  // Count counts the points that match a scope and a filter.
  rpc Count(CountRequest) returns (CountResponse);
  // ListIndexes lists the namespaces of one project, per embedding space.
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
  // ListDocuments lists the documents of one namespace as the store holds
  // them: each (document_key, document_version) with its chunk count, in
  // pages. An incremental indexer (ADR-0030 decision 3) reads it to skip
  // unchanged documents and delete vanished ones; the store, not a mirror,
  // is what was written.
  rpc ListDocuments(ListDocumentsRequest) returns (stream ListDocumentsResponse);
}

// Source names the consumer that owns a namespace (payload key `source`).
enum Source {
  SOURCE_UNSPECIFIED = 0;
  // A toolkit index (ADR-0030); namespace_id is the index_registry UUID.
  SOURCE_TOOLKIT_INDEX = 1;
  // A DeepWiki wiki; namespace_id is UUIDv5 of (project, wiki id).
  SOURCE_DEEPWIKI = 2;
  // Reserved for Inventory (ADR-0031 decision 7). Refused in V0.
  SOURCE_INVENTORY = 3;
}

// EmbeddingSpace selects the collection `emb_<model_slug>_<dimension>`.
message EmbeddingSpace {
  // model_slug matches ^[a-z0-9][a-z0-9-]{0,62}$. The caller makes the slug
  // from the model name; elitea-vector does not change it.
  string model_slug = 1;
  // dimension is the vector length, 1 to 65536.
  uint32 dimension = 2;
}

// Namespace is the unit every operation works in.
message Namespace {
  Source source = 1;
  // namespace_id is a UUID in canonical, lower-case text form.
  string namespace_id = 2;
  // generation is a build id for consumers that publish whole builds
  // atomically (ADR-0031 decision 3). Empty means "no generation".
  string generation = 3;
}

// Point is one chunk to write. project_id, source, namespace_id and
// generation come from the Upsert header, never from the point.
message Point {
  string document_key = 1;
  string document_version = 2;
  string parent_id = 3;
  string chunk_id = 4;
  string chunk_type = 5;
  // acl is written now and filtered later (ADR-0028).
  repeated string acl = 6;
  // text is the chunk text. It feeds the BM25 index of HybridSearch.
  string text = 7;
  // metadata_json is a JSON object returned in search output. It is not
  // indexed. Empty means {}.
  string metadata_json = 8;
  // vector has exactly the dimension of the header's embedding space.
  repeated float vector = 9;
}

// UpsertHeader is the first message of an Upsert stream.
message UpsertHeader {
  int64 project_id = 1;
  EmbeddingSpace space = 2;
  Namespace namespace = 3;
}

// UpsertBatch is one group of points. A batch holds at most 512 points.
message UpsertBatch {
  repeated Point points = 1;
}

message UpsertRequest {
  oneof message {
    UpsertHeader header = 1;
    UpsertBatch batch = 2;
  }
}

message UpsertResponse {
  // upserted is the number of points written.
  uint64 upserted = 1;
  // collection is the Qdrant collection the points went into.
  string collection = 2;
}

// DocumentKeys selects the points of some documents.
message DocumentKeys {
  repeated string document_keys = 1;
}

// Generations selects the points of some generations.
message Generations {
  repeated string generations = 1;
}

// GenerationsExcept selects the points of every generation but one: the
// lazy clean-up after a publish (ADR-0031 decision 3).
message GenerationsExcept {
  string keep = 1;
}

// WholeNamespace selects every point of the namespace.
message WholeNamespace {}

message DeleteRequest {
  int64 project_id = 1;
  // space is optional. Without it, the delete applies to every collection.
  EmbeddingSpace space = 2;
  // namespace.generation is ignored here; use the selector.
  Namespace namespace = 3;
  oneof selector {
    WholeNamespace whole_namespace = 4;
    DocumentKeys documents = 5;
    Generations generations = 6;
    GenerationsExcept generations_except = 7;
  }
}

message DeleteResponse {
  // collections is the number of collections the delete was applied to.
  uint32 collections = 1;
}

message DropProjectRequest {
  int64 project_id = 1;
}

message DropProjectResponse {
  uint32 collections = 1;
}

// StringList is a list of keyword values.
message StringList {
  repeated string values = 1;
}

// Condition is one match on a payload key, or a nested filter.
//
// key is one of `document_key`, `document_version`, `parent_id`, `chunk_id`,
// `chunk_type`, `acl`, or `metadata.<path>` where `<path>` matches
// ^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$. Every other key, `project_id`
// included, is refused with INVALID_ARGUMENT, at any nesting depth. A
// `filter` condition has no key (key must be empty).
message Condition {
  string key = 1;
  oneof match {
    string keyword = 2;
    StringList any = 3;
    int64 integer = 4;
    bool boolean = 5;
    // range compares a number. Only `metadata.<path>` keys take it: the
    // point fields are keywords.
    Range range = 6;
    // is_empty matches when the key is missing, null or an empty array.
    IsEmpty is_empty = 7;
    // is_null matches when the key is present and null.
    IsNull is_null = 8;
    // filter is a nested filter: it matches when the whole filter does.
    Filter filter = 9;
  }
}

// Range bounds a number. At least one bound is set; every bound is finite.
message Range {
  optional double gt = 1;
  optional double gte = 2;
  optional double lt = 3;
  optional double lte = 4;
}

// IsEmpty selects a presence check: missing, null or [].
message IsEmpty {}

// IsNull selects a null check: present and null.
message IsNull {}

// Filter narrows a scope. elitea-vector adds it to the injected scope; it
// never replaces the scope.
//
// A filter may nest other filters through Condition.filter, at most 8
// levels deep counting this one, with at most 64 conditions per list and
// at most 1024 conditions in the whole tree (nested filter conditions
// included). An empty nested filter is refused; an empty top-level filter
// narrows nothing.
message Filter {
  repeated Condition must = 1;
  repeated Condition should = 2;
  repeated Condition must_not = 3;
}

// ActiveGeneration pins one namespace of a read to its published build.
message ActiveGeneration {
  // namespace_id is one of the scope's namespace_ids.
  string namespace_id = 1;
  // generation is the namespace's active build id.
  string generation = 2;
}

// Scope selects the namespaces a read works in.
message Scope {
  int64 project_id = 1;
  Source source = 2;
  // namespace_ids holds 1 to 64 UUIDs.
  repeated string namespace_ids = 3;
  // generation, when set, narrows the read to one generation.
  string generation = 4;
  // active_generations narrows some namespaces to their active build: a
  // point of a listed namespace matches when its generation is the listed
  // one, or when it was written without a generation (an incremental
  // index). A build in progress (another generation) is excluded. At most
  // one entry per namespace; it cannot be combined with `generation`.
  repeated ActiveGeneration active_generations = 5;
}

message ScoredPoint {
  // id is the point's UUID.
  string id = 1;
  float score = 2;
  int64 project_id = 3;
  Source source = 4;
  string namespace_id = 5;
  string generation = 6;
  string document_key = 7;
  string document_version = 8;
  string parent_id = 9;
  string chunk_id = 10;
  string chunk_type = 11;
  repeated string acl = 12;
  string text = 13;
  string metadata_json = 14;
  // dense_score is the point's cosine similarity to the query vector. In
  // Search it equals score; in HybridSearch score is the fused score and
  // this is the dense side's, for every returned point.
  optional float dense_score = 15;
}

message SearchRequest {
  Scope scope = 1;
  EmbeddingSpace space = 2;
  // vector has exactly the collection's dimension.
  repeated float vector = 3;
  Filter filter = 4;
  // limit is 1 to 1000.
  uint32 limit = 5;
  // score_threshold, when set, drops results with a lower cosine similarity.
  optional float score_threshold = 6;
}

message SearchResponse {
  repeated ScoredPoint points = 1;
}

message HybridSearchRequest {
  Scope scope = 1;
  EmbeddingSpace space = 2;
  repeated float vector = 3;
  // text is the BM25 query.
  string text = 4;
  Filter filter = 5;
  uint32 limit = 6;
  // dense_weight and text_weight weight the reciprocal ranks. Both zero
  // means the ADR-0031 defaults: 0.7 dense, 0.3 text.
  float dense_weight = 7;
  float text_weight = 8;
  // prefetch_limit is how many candidates each side returns before fusion.
  // Zero means 4 x limit, at most 1000.
  uint32 prefetch_limit = 9;
  // score_threshold applies to the dense side only, before fusion.
  optional float score_threshold = 10;
}

message HybridSearchResponse {
  // points are ordered by fused score; ScoredPoint.score is the fused score
  // and ScoredPoint.dense_score the cosine similarity (read by a second,
  // exact dense query over the fused points' ids).
  repeated ScoredPoint points = 1;
}

message CountRequest {
  Scope scope = 1;
  // space is optional. Without it, the count is summed over every
  // collection.
  EmbeddingSpace space = 2;
  Filter filter = 3;
}

message CountResponse {
  uint64 count = 1;
}

message ListIndexesRequest {
  int64 project_id = 1;
  // source, when set, narrows the list to one source.
  Source source = 2;
}

message IndexInfo {
  EmbeddingSpace space = 1;
  string collection = 2;
  Source source = 3;
  string namespace_id = 4;
  uint64 point_count = 5;
}

message ListIndexesResponse {
  repeated IndexInfo indexes = 1;
}

message ListDocumentsRequest {
  int64 project_id = 1;
  // namespace names the points to list. Its generation, when set, narrows
  // the listing to one build; empty lists every generation of the
  // namespace.
  Namespace namespace = 2;
  // space is optional. Without it every collection is read.
  EmbeddingSpace space = 3;
  // max_documents bounds the server's work: the listing is refused with
  // RESOURCE_EXHAUSTED as soon as the distinct (document_key,
  // document_version) pairs read exceed it, before anything is paged out.
  // 0 leaves only the service's own point bound. An incremental indexer sets
  // it to what one run can handle, so an index that outgrew the indexer costs
  // the store no more than that.
  uint64 max_documents = 4;
}

// IndexedDocument is one (document_key, document_version) pair the store
// holds, with the number of its chunks (points).
message IndexedDocument {
  string document_key = 1;
  string document_version = 2;
  uint64 chunk_count = 3;
}

message ListDocumentsResponse {
  // documents is one page, at most 1024 entries, ordered by document_key
  // within the whole stream.
  repeated IndexedDocument documents = 1;
}
