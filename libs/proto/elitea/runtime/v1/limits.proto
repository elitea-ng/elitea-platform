syntax = "proto3";

package elitea.runtime.v1;

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// ProtocolLimitsV1 is selected by revision during admission. Every producer
// measures the complete encoded representation before transport, and every
// consumer applies the same or a stricter limit before decoding.
message ProtocolLimitsV1 {
  string limits_revision = 1;
  uint64 max_worker_command_bytes = 2;
  uint64 max_signed_envelope_bytes = 3;
  // The command-bus transport bounds (ADR-0010 amendment: NATS JetStream).
  // max_transport_payload_bytes bounds the message body, which is exactly the
  // SignedWorkerCommandEnvelopeV1 bytes. max_transport_message_bytes bounds the
  // whole message the server stores (body plus headers) and is the stream's
  // MaxMsgSize. Before limits revision conformance.v3 these were
  // max_redis_field_bytes and max_redis_entry_bytes; the field numbers and
  // wire encoding are unchanged.
  uint64 max_transport_payload_bytes = 4;
  uint64 max_transport_message_bytes = 5;
  uint64 max_input_manifest_bytes = 6;
  uint32 max_input_entries = 7;
  uint64 max_input_content_bytes = 8;
  uint64 max_output_frame_bytes = 9;
  uint32 max_validation_issues = 10;
  uint32 max_safe_string_bytes = 11;
  // Authority timing is part of the selected limits revision. Runtimes may
  // poll more frequently but must never admit a slower interval.
  uint64 claim_lease_ttl_millis = 12;
  uint64 max_lease_poll_interval_millis = 13;
  // Whole serialized protobuf message limits for worker-to-server requests
  // and server-to-worker responses. The response bound is deliberately larger
  // than max_input_manifest_bytes because ClaimCommandResponseV1 nests the
  // manifest inside an authenticated claim receipt.
  uint64 max_grpc_request_bytes = 14;
  uint64 max_grpc_response_bytes = 15;
  reserved 16 to 31;
}
