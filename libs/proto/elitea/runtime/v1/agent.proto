syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// AgentExecutionCommandV1 is shared by the two current execution semantics:
// agent.execute.application.v1 and agent.execute.adhoc.v1. The capability ID
// and WorkerCommandTypeV1 select the semantic entry point; this message only
// identifies its immutable data-plane input and browser correlation fields.
// Prompts, tools, model settings, credentials and resume values are forbidden
// here and are fetched only after an authorized claim.
message AgentExecutionCommandV1 {
  string request_entry_id = 1;
  string client_stream_id = 2;
  string client_message_id = 3;
  string sio_event = 4;
  reserved 5 to 15;
}

// AgentExecutionInputV1 is the language-neutral form of the current
// indexer_agent/indexer_predict_agent kwargs. Dynamic SDK-owned documents stay
// as one complete UTF-8 JSON value per semantic field so their exact integer,
// null and arbitrary toolkit shapes survive cross-language transport. They are
// data-plane content and must never be embedded in WorkerCommandV1.
message AgentExecutionInputV1 {
  string schema_revision = 1;
  bytes llm = 2;
  bytes chat_history = 3;
  bytes user_input = 4;
  optional string thread_id = 5;
  optional string checkpoint_id = 6;
  bool debug = 7;
  bytes tools = 8;
  bytes application = 9;
  bytes internal_tools = 10;
  optional int32 steps_limit = 11;
  bytes mcp_tokens = 12;
  bytes ignored_mcp_servers = 13;
  bytes user_declined_mcp_servers = 14;
  bool should_continue = 15;
  bool hitl_resume = 16;
  optional string hitl_action = 17;
  optional string hitl_value = 18;
  bytes hitl_decisions = 19;
  optional string execution_generation = 20;
  bool is_regenerate = 21;
  bytes meta = 22;
  optional string conversation_id = 23;
  string persona = 24;
  bytes context_settings = 25;
  bool supports_vision = 26;
  bool return_chat_history = 27;
  bytes invoked_skills = 28;
  bytes applied_skills = 29;
  bool auto_approve_sensitive_actions = 30;
  bytes attached_skills = 31;
  bytes input_attachments = 32;
  bytes parallel_reconcile = 33;
  bytes parallel_terminal_errors = 34;
  optional bool exception_handling_enabled = 35;
  optional bool debug_mode = 36;
  // A bounded, non-secret snapshot of the current live guardrail. The Go
  // admission path resolves this policy before dispatch; the worker never
  // reads Pylon configuration directly and treats suggestion generation as a
  // best-effort post-response side effect.
  bytes next_input_suggestion = 37;
  // The platform-wide toolkit guardrails, as one bounded, non-secret JSON
  // object: `sensitive_tools`, `blocked_toolkits`, `blocked_tools` and the two
  // authorization-dialog copy fields.
  //
  // It travels with the RUN rather than with the container. The worker's
  // guardrail middleware reads process-global state configured from
  // `ELITEA_SENSITIVE_TOOLS`-style environment variables, which means a policy
  // change needs a redeploy and every tenant on a worker pool shares one answer.
  // The admin Configuration page writes this policy per platform and expects it
  // to take effect on the next call, so the resolved policy is stamped here at
  // admission and applied by the worker before it builds the agent.
  //
  // ABSENT is meaningful and is not the same as empty: an absent field leaves
  // the worker on its environment configuration exactly as before, which is what
  // keeps existing deployments working. An empty object means the platform
  // resolved a policy and it is empty.
  //
  // Guardrail identifiers only — never credentials. The tool and toolkit names
  // here are the same public identifiers the toolkit catalogue already serves.
  bytes toolkit_guardrails = 38;
  // Visible assistant text from a root response that ended on the provider's
  // output-token limit. It is present only when `should_continue` means an
  // output continuation, never for HITL, delegated authorization, Printer, or
  // graph-checkpoint resume. Keeping this visible-only value explicit prevents
  // hidden reasoning from leaking into the continuation prompt and gives every
  // language the same unambiguous continuation discriminator.
  bytes truncated_content = 39;
  reserved 40 to 63;
  // Main resolves and freezes this project-owned content after authorization.
  // Absence disables Project Context for this independent turn.
  ProjectContextSnapshotV1 project_context = 64;
}

// ProjectContextSnapshotV1 remains in the immutable input data plane.
// Empty activation_description selects the legacy eager instruction mode.
message ProjectContextSnapshotV1 {
  string id = 1;
  // Lowercase SHA-256 of the exact UTF-8 content bytes.
  string revision = 2;
  string scope = 3;
  string content = 4;
  string activation_description = 5;
  reserved 6 to 15;
}

enum AgentExecutionTerminalStateV1 {
  AGENT_EXECUTION_TERMINAL_STATE_V1_UNSPECIFIED = 0;
  AGENT_EXECUTION_TERMINAL_STATE_V1_COMPLETED = 1;
  AGENT_EXECUTION_TERMINAL_STATE_V1_PAUSED_HITL = 2;
  AGENT_EXECUTION_TERMINAL_STATE_V1_PAUSED_MCP_AUTH = 3;
  AGENT_EXECUTION_TERMINAL_STATE_V1_PARKED_CHILDREN = 4;
}

message AgentExecutionArtifactReferenceV1 {
  string artifact_id = 1;
  string immutable_version = 2;
  string media_type = 3;
  uint64 byte_length = 4;
  DigestV1 digest = 5;
  string classification = 6;
  reserved 7 to 15;
}

// AgentExecutionAttachmentContentV1 returns ONE attachment item's enriched
// content so the platform can persist what the worker extracted (#607).
//
// Pylon extracts a document's text once, at message-persist time, and stores
// it: rpc/chat_all.py:344-377 reads the files through the SDK artifact toolkit
// and appends the text as a second `{"type": "text"}` chunk of the item's
// `content`, with `flag_modified(item, "content")` at :376. Every later turn is
// then pure DB — utils/chat_history.py:67-73 extends the stored chunks straight
// into the message and re-reads nothing.
//
// Here the two halves live in different services: only the worker can reach the
// artifact toolkit, and only elitea-main can write `chat_messages_attachment`.
// This message is the seam. The worker fills it for the attachments it actually
// enriched; elitea-main writes `content` onto the named row on the terminal
// path it already owns. Without it, a file attached two turns ago is invisible
// to the model and every turn re-pays the extraction.
message AgentExecutionAttachmentContentV1 {
  // The `chat_message_items` row to write, taken from the `item_id` the
  // admission scaffold stamps into the chunk's `elitea_attachment` marker
  // (attachments.go, attachmentContentScaffold).
  //
  // NOT (bucket, name). The same file attached twice in one conversation is an
  // ordinary thing for a user to do and produces two rows with identical bucket
  // and name, so a (bucket, name) match would silently write one file's text
  // onto the other's row. The item id is exact.
  string item_id = 1;
  // One complete UTF-8 JSON ARRAY of LangChain content chunks: exactly the
  // value `chat_messages_attachment.content` is to hold, not a delta. It is the
  // admission scaffold's own header chunk — marker included, byte-for-byte —
  // followed by the extracted text as a second `{"type": "text"}` chunk, which
  // is the shape pylon's extraction step leaves behind and the shape the
  // worker's own reader recognises as "already extracted".
  bytes content = 2;
  reserved 3 to 15;
}

// AgentExecutionResultV1 references the exact current task result. Thinking,
// token, tool, HITL, MCP and child events are separate non-terminal NodeEventV1
// frames; a large final task result is never materialized on Redis or gRPC.
message AgentExecutionResultV1 {
  string input_bundle_id = 1;
  DigestV1 input_bundle_digest = 2;
  string request_entry_id = 3;
  string request_immutable_version = 4;
  DigestV1 request_content_digest = 5;
  AgentExecutionTerminalStateV1 terminal_state = 6;
  AgentExecutionArtifactReferenceV1 result_artifact = 7;
  reserved 8 to 15;
  // Enriched attachment content to persist, one entry per attachment whose text
  // this turn actually read (#607). Absent for every turn that carried no
  // document, and absent for a document whose read failed — a failed read has
  // no text to persist and must leave the row as admission wrote it.
  //
  // INLINE, and deliberately so. The two candidate carriers were measured:
  //
  //   * This frame. `max_output_frame_bytes` is 64 KiB
  //     (runtimecomposition/composition.go's maxOutputFrameBytes, and the
  //     worker's own _V1_OUTPUT_FRAME_BYTES); a terminal
  //     AgentExecutionResultV1 frame measures ~1 KiB today, so ~62 KiB is free.
  //   * `result_artifact`, which is not an object-store blob but the terminal
  //     NodeEventV1 itself — elitea-main re-reads its bytes from
  //     `agent_execution_node_events` and checks them against the digest here
  //     (repos/agent_execution_results.go, loadCurrentAgentTerminal). That event
  //     is capped at 60 KiB of JSON (worker protocol/node_event.py), so it is
  //     no roomier than this frame. It was REJECTED for two other reasons: it
  //     is the browser-facing `full_message` event, so riding it would ship
  //     every attached file's full text to the UI on every turn; and an
  //     over-size event RAISES, which would turn a large attachment into a
  //     failed turn.
  //
  // So neither carrier is large, and the honest consequence is a cap rather
  // than a pretence that a whole PDF fits. The worker measures this list before
  // it builds the frame and DROPS whole entries that do not fit
  // (agents/attachments.py, MAX_ATTACHMENT_CONTENT_WRITEBACK_BYTES). A dropped
  // entry degrades exactly to today's behaviour: the turn still succeeds, the
  // model still sees the text this turn, and only the persistence is skipped.
  // An entry is never truncated — a partial chunk that still claims to be the
  // file is worse than no chunk, because nothing downstream can tell.
  repeated AgentExecutionAttachmentContentV1 attachment_contents = 16;
  reserved 17 to 31;
}
