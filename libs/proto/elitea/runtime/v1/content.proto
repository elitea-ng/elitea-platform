syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";
import "elitea/runtime/v1/credential.proto";
import "elitea/runtime/v1/toolkit.proto";

option go_package = "github.com/elitea-ng/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// RuntimeContentService is elitea-main's runtime content plane (#1359 U4):
// the claim-bound data a running execution reads and writes, and the sandbox
// package/snapshot/workspace content a sandbox supervisor moves. It is served
// on Main's private content listener (ELITEA_RUNTIME_CONTENT_ADDRESS, :9445):
// gRPC only, TLS 1.3, a runtime-CA client certificate required at the
// handshake. It replaced the claim-bound HTTPS routes of that port.
//
// AUTHORIZATION. The listener's grpcauth policy admits any verified runtime
// workload identity to the service; every RPC then binds its own authority to
// that identity, exactly as the HTTPS routes did:
//
//   - Execution-bound RPCs (every request that carries a RuntimeContentScopeV1)
//     are made under a live claim. The claim id and the 32-byte fence token
//     travel as gRPC metadata, never in the message:
//       elitea-claim-id         the accepted claim's id (one value)
//       elitea-claim-fence-bin  the raw 32-byte fence token (binary metadata)
//     Main binds the claim, the fence, the generation and the verified peer
//     certificate to the durable execution state before anything is read or
//     written.
//   - Sandbox content RPCs (bundles, compiled snapshots, workspace reads) carry
//     a Main-signed sandbox grant whose audience must be the verified peer.
//
// JSON DOCUMENTS. Many requests and responses carry a JSON document as bytes
// (`*_json`). Those are the versioned runtime documents the HTTPS routes
// carried as bodies (schema names inside them, strict unknown-field refusal on
// both sides); gRPC is their transport, not their schema.
//
// STATUS CODES. One mapping replaces the HTTP statuses:
//   InvalidArgument     malformed request (was 400)
//   Unauthenticated     no verified peer, missing or malformed claim (401)
//   PermissionDenied    the claim, fence, grant or identity is refused (403)
//   NotFound            the named content does not exist (404)
//   Aborted             a conflict with the durable state (409)
//   ResourceExhausted   the content exceeds its limit (413)
//   FailedPrecondition  the document cannot be served or stored as written (422)
//   DeadlineExceeded    the transfer was interrupted (408)
//   Unavailable         overload or a dependency is unavailable; retry (503/502)
//   Internal            the stored content failed verification (500)
//   Unimplemented       this deployment does not serve the RPC (a route the
//                       HTTPS listener left unregistered)
service RuntimeContentService {
  // One claim-bound, source-verified agent input: one header, then chunks.
  rpc GetInput(GetInputRequestV1) returns (stream GetInputResponseV1);

  // The Elitea client-token runtime context of the claimed execution.
  rpc GetEliteaClientToken(GetEliteaClientTokenRequestV1) returns (GetEliteaClientTokenResponseV1);
  // The credential material for one bound tool invocation of a governed run
  // (#1118). Not served (Unimplemented) unless credential governance is on.
  rpc RedeemCredential(RedeemCredentialRequestV1) returns (RedeemCredentialResponseV1);
  // One frozen nested (agent-as-tool) application version.
  rpc GetApplicationVersion(GetApplicationVersionRequestV1) returns (GetApplicationVersionResponseV1);
  // One stored chat attachment's text.
  rpc GetAttachmentObject(GetAttachmentObjectRequestV1) returns (GetAttachmentObjectResponseV1);
  // One claim-scoped HTTP action invocation.
  rpc ExecuteHTTPAction(ExecuteHTTPActionRequestV1) returns (ExecuteHTTPActionResponseV1);
  // The two chat-authored builder writes (#940 A8).
  rpc WriteSkill(WriteSkillRequestV1) returns (WriteSkillResponseV1);
  rpc WriteProjectContext(WriteProjectContextRequestV1) returns (WriteProjectContextResponseV1);
  // The `artifact` toolkit family (#906).
  rpc ListArtifacts(ListArtifactsRequestV1) returns (ListArtifactsResponseV1);
  rpc ReadArtifact(ReadArtifactRequestV1) returns (ReadArtifactResponseV1);
  rpc WriteArtifact(WriteArtifactRequestV1) returns (WriteArtifactResponseV1);
  rpc DeleteArtifact(DeleteArtifactRequestV1) returns (DeleteArtifactResponseV1);

  // The Code workspace manifest of the claimed execution.
  rpc ResolveCodeWorkspace(ResolveCodeWorkspaceRequestV1) returns (ResolveCodeWorkspaceResponseV1);
  // Code debug artifacts: admit a visit, then commit its snapshot.
  rpc AdmitCodeDebug(AdmitCodeDebugRequestV1) returns (AdmitCodeDebugResponseV1);
  rpc CommitCodeDebug(CommitCodeDebugRequestV1) returns (CommitCodeDebugResponseV1);
  // The Code platform pump: one step, and the read-only effects question.
  rpc StepCodePlatform(StepCodePlatformRequestV1) returns (StepCodePlatformResponseV1);
  rpc ReadCodePlatformEffects(ReadCodePlatformEffectsRequestV1) returns (ReadCodePlatformEffectsResponseV1);
  // Node recovery control, acknowledgement and recovered results.
  rpc PollNodeRecovery(PollNodeRecoveryRequestV1) returns (PollNodeRecoveryResponseV1);
  rpc AcknowledgeNodeRecovery(AcknowledgeNodeRecoveryRequestV1) returns (AcknowledgeNodeRecoveryResponseV1);
  rpc ReadNodeRecoveryResult(ReadNodeRecoveryResultRequestV1) returns (ReadNodeRecoveryResultResponseV1);
  // The original Code sandbox visit and intent registrations.
  rpc RegisterCodeVisit(RegisterCodeVisitRequestV1) returns (RegisterCodeVisitResponseV1);
  rpc RegisterCodeIntent(RegisterCodeIntentRequestV1) returns (RegisterCodeIntentResponseV1);
  // The immutable toolkit available-tools result of one admitted input.
  rpc PutToolkitDiscoveryResult(PutToolkitDiscoveryResultRequestV1) returns (PutToolkitDiscoveryResultResponseV1);
  rpc GetToolkitDiscoveryResult(GetToolkitDiscoveryResultRequestV1) returns (GetToolkitDiscoveryResultResponseV1);

  // Sandbox workspace content, under a signed workspace-read proof.
  rpc ReadSandboxWorkspaceManifest(ReadSandboxWorkspaceManifestRequestV1) returns (ReadSandboxWorkspaceManifestResponseV1);
  rpc ReadSandboxWorkspaceFile(ReadSandboxWorkspaceFileRequestV1) returns (ReadSandboxWorkspaceFileResponseV1);

  // Shared sandbox dependency bundles (Python and native), under a signed
  // sandbox grant. Metadata is published last.
  rpc GetSandboxBundle(GetSandboxBundleRequestV1) returns (GetSandboxBundleResponseV1);
  rpc PublishSandboxBundle(PublishSandboxBundleRequestV1) returns (PublishSandboxBundleResponseV1);
  // One bundle file: one header, then chunks.
  rpc FetchSandboxBundleFile(FetchSandboxBundleFileRequestV1) returns (stream FetchSandboxBundleFileResponseV1);
  // One bundle file: one header, then chunks.
  rpc UploadSandboxBundleFile(stream UploadSandboxBundleFileRequestV1) returns (UploadSandboxBundleFileResponseV1);

  // Rust compiled snapshots, under a signed read or publish grant.
  rpc GetCompiledSnapshot(GetCompiledSnapshotRequestV1) returns (GetCompiledSnapshotResponseV1);
  rpc PublishCompiledSnapshot(PublishCompiledSnapshotRequestV1) returns (PublishCompiledSnapshotResponseV1);
  rpc FetchCompiledSnapshotFile(FetchCompiledSnapshotFileRequestV1) returns (stream FetchCompiledSnapshotFileResponseV1);
  rpc UploadCompiledSnapshotFile(stream UploadCompiledSnapshotFileRequestV1) returns (UploadCompiledSnapshotFileResponseV1);
}

// RuntimeContentScopeV1 names the execution and generation a claim-bound call
// is made under. The claim id and fence ride in metadata (see the service).
message RuntimeContentScopeV1 {
  string execution_id = 1;
  uint64 generation = 2;
  reserved 3 to 15;
}

message GetInputRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string content_id = 2;
  string immutable_version = 3;
  reserved 4 to 15;
}

// InputContentHeaderV1 is the first message of a GetInput stream. The source
// fields restate the admitted descriptor; the client checks them before it
// trusts a byte.
message InputContentHeaderV1 {
  string media_type = 1;
  // The materialized response: its exact length and SHA-256 (32 bytes).
  uint64 length = 2;
  bytes sha256 = 3;
  // The immutable source the response was materialized from.
  bytes source_sha256 = 4;
  uint64 source_length = 5;
  string source_immutable_version = 6;
  reserved 7 to 15;
}

message GetInputResponseV1 {
  oneof part {
    InputContentHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message GetEliteaClientTokenRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  // The OPTIONAL runtime-context fields this worker can read
  // ("secrets-header-value", "workspace"), one name per entry. Main also
  // splits an entry on commas, so a comma-joined entry reads as a list. An
  // unknown name is ignored; a field not named is never served.
  repeated string accept_fields = 2;
  reserved 3 to 15;
}

message GetEliteaClientTokenResponseV1 {
  bytes context_json = 1;
  reserved 2 to 15;
}

message RedeemCredentialRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  BoundToolInvocationV1 invocation = 2;
  // Must equal the digest of the command's security context reference
  // (WorkerCommandV1 field 65).
  DigestV1 security_context_digest = 3;
  reserved 4 to 15;
}

message RedeemCredentialResponseV1 {
  oneof result {
    CredentialEnvelopeV1 envelope = 1;
    CredentialRedeemDenialV1 denial = 2;
  }
  reserved 3 to 15;
}

message GetApplicationVersionRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  uint64 application_id = 2;
  uint64 version_id = 3;
  reserved 4 to 15;
}

message GetApplicationVersionResponseV1 {
  bytes version_json = 1;
  reserved 2 to 15;
}

message GetAttachmentObjectRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string bucket = 2;
  // The object key, `{conversationUUID}/{filename}`.
  string name = 3;
  reserved 4 to 15;
}

// A missing object is NotFound. A stored object with no text this RPC can
// serve is a successful call that names why (unreadable_reason, the
// elitea.runtime.attachment-unreadable.v1 reasons): the file is what it claims
// to be and will never be readable here, which is not a failure of the turn.
message GetAttachmentObjectResponseV1 {
  oneof outcome {
    bytes document_json = 1;
    string unreadable_reason = 2;
  }
  reserved 3 to 15;
}

message ExecuteHTTPActionRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes invocation_json = 2;
  reserved 3 to 15;
}

message ExecuteHTTPActionResponseV1 {
  bytes receipt_json = 1;
  reserved 2 to 15;
}

message WriteSkillRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message WriteSkillResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message WriteProjectContextRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message WriteProjectContextResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message ListArtifactsRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message ListArtifactsResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message ReadArtifactRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message ReadArtifactResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message WriteArtifactRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message WriteArtifactResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message DeleteArtifactRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message DeleteArtifactResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message ResolveCodeWorkspaceRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

// A refused workspace bound is FailedPrecondition whose message names the
// bound (`max_file_bytes`, ...) and its operator number, nothing else.
message ResolveCodeWorkspaceResponseV1 {
  bytes manifest_json = 1;
  // The manifest's root digest.
  string workspace_root = 2;
  reserved 3 to 15;
}

message AdmitCodeDebugRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes admission_json = 2;
  reserved 3 to 15;
}

message AdmitCodeDebugResponseV1 {
  reserved 1 to 15;
}

message CommitCodeDebugRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string visit_id = 2;
  bytes snapshot_json = 3;
  reserved 4 to 15;
}

message CommitCodeDebugResponseV1 {
  bytes reference_json = 1;
  reserved 2 to 15;
}

message StepCodePlatformRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message StepCodePlatformResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message ReadCodePlatformEffectsRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes request_json = 2;
  reserved 3 to 15;
}

message ReadCodePlatformEffectsResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message PollNodeRecoveryRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  reserved 2 to 15;
}

message PollNodeRecoveryResponseV1 {
  bytes control_json = 1;
  reserved 2 to 15;
}

message AcknowledgeNodeRecoveryRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes ack_json = 2;
  reserved 3 to 15;
}

message AcknowledgeNodeRecoveryResponseV1 {
  bytes outcome_json = 1;
  reserved 2 to 15;
}

message ReadNodeRecoveryResultRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string content_id = 2;
  // The result's lowercase hex SHA-256, which is also its version.
  string version = 3;
  reserved 4 to 15;
}

message ReadNodeRecoveryResultResponseV1 {
  bytes result_json = 1;
  reserved 2 to 15;
}

message RegisterCodeVisitRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes visit_json = 2;
  reserved 3 to 15;
}

message RegisterCodeVisitResponseV1 {
  bytes visit_json = 1;
  reserved 2 to 15;
}

message RegisterCodeIntentRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  bytes intent_json = 2;
  reserved 3 to 15;
}

message RegisterCodeIntentResponseV1 {
  bytes response_json = 1;
  reserved 2 to 15;
}

message PutToolkitDiscoveryResultRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string content_id = 2;
  string immutable_version = 3;
  // application/vnd.elitea.toolkit-available-tools.v1+json, at most 1 MiB.
  bytes result_json = 4;
  reserved 5 to 15;
}

message PutToolkitDiscoveryResultResponseV1 {
  ToolkitAvailableToolsArtifactReferenceV1 reference = 1;
  reserved 2 to 15;
}

message GetToolkitDiscoveryResultRequestV1 {
  RuntimeContentScopeV1 scope = 1;
  string content_id = 2;
  string immutable_version = 3;
  reserved 4 to 15;
}

message GetToolkitDiscoveryResultResponseV1 {
  bytes result_json = 1;
  reserved 2 to 15;
}

message ReadSandboxWorkspaceManifestRequestV1 {
  // Lowercase hex SHA-256 of the workspace manifest.
  string manifest_sha256 = 1;
  // elitea.sandbox.workspace-content-read.v1: the signed grant, the prepared
  // job and the optional original Code intent, canonical JSON.
  bytes request_json = 2;
  reserved 3 to 15;
}

message ReadSandboxWorkspaceManifestResponseV1 {
  bytes manifest_json = 1;
  reserved 2 to 15;
}

message ReadSandboxWorkspaceFileRequestV1 {
  string manifest_sha256 = 1;
  // Lowercase hex SHA-256 of the file's content.
  string content_sha256 = 2;
  bytes request_json = 3;
  reserved 4 to 15;
}

// One workspace file is at most 4 MiB (the workspace policy ceiling), so it is
// one message.
message ReadSandboxWorkspaceFileResponseV1 {
  bytes content = 1;
  reserved 2 to 15;
}

enum SandboxBundleKindV1 {
  SANDBOX_BUNDLE_KIND_V1_UNSPECIFIED = 0;
  SANDBOX_BUNDLE_KIND_V1_PYTHON = 1;
  SANDBOX_BUNDLE_KIND_V1_NATIVE = 2;
}

// SandboxContentFileHeaderV1 is the first message of a file stream: the exact
// length and SHA-256 (32 bytes) the chunks that follow must add up to.
message SandboxContentFileHeaderV1 {
  uint64 length = 1;
  bytes sha256 = 2;
  reserved 3 to 15;
}

message GetSandboxBundleRequestV1 {
  SandboxBundleKindV1 kind = 1;
  // Lowercase hex SHA-256 of the bundle.
  string root = 2;
  // Protobuf encoding of the SignedSandboxJobGrantV1.
  bytes signed_grant = 3;
  reserved 4 to 15;
}

message GetSandboxBundleResponseV1 {
  bytes bundle_json = 1;
  reserved 2 to 15;
}

message PublishSandboxBundleRequestV1 {
  SandboxBundleKindV1 kind = 1;
  string root = 2;
  bytes signed_grant = 3;
  bytes bundle_json = 4;
  reserved 5 to 15;
}

message PublishSandboxBundleResponseV1 {
  reserved 1 to 15;
}

message FetchSandboxBundleFileRequestV1 {
  SandboxBundleKindV1 kind = 1;
  string root = 2;
  string name = 3;
  bytes signed_grant = 4;
  reserved 5 to 15;
}

message FetchSandboxBundleFileResponseV1 {
  oneof part {
    SandboxContentFileHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message UploadSandboxBundleFileHeaderV1 {
  SandboxBundleKindV1 kind = 1;
  string root = 2;
  string name = 3;
  bytes signed_grant = 4;
  // The bundle record the file belongs to; it names the file's length and
  // digest, which the stored bytes must match.
  bytes bundle_json = 5;
  reserved 6 to 15;
}

// The first message is the header, every later one a chunk.
message UploadSandboxBundleFileRequestV1 {
  oneof part {
    UploadSandboxBundleFileHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message UploadSandboxBundleFileResponseV1 {
  reserved 1 to 15;
}

message GetCompiledSnapshotRequestV1 {
  // Lowercase hex SHA-256 of the snapshot descriptor.
  string root = 1;
  // Protobuf encoding of the SignedSandboxJobGrantV1 (read purpose).
  bytes signed_grant = 2;
  reserved 3 to 15;
}

message GetCompiledSnapshotResponseV1 {
  bytes descriptor_json = 1;
  reserved 2 to 15;
}

message PublishCompiledSnapshotRequestV1 {
  string root = 1;
  // Protobuf encoding of the SignedSandboxJobGrantV1 (publish purpose).
  bytes signed_grant = 2;
  bytes descriptor_json = 3;
  reserved 4 to 15;
}

message PublishCompiledSnapshotResponseV1 {
  reserved 1 to 15;
}

message FetchCompiledSnapshotFileRequestV1 {
  string root = 1;
  string name = 2;
  bytes signed_grant = 3;
  reserved 4 to 15;
}

message FetchCompiledSnapshotFileResponseV1 {
  oneof part {
    SandboxContentFileHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message UploadCompiledSnapshotFileHeaderV1 {
  string root = 1;
  string name = 2;
  bytes signed_grant = 3;
  bytes descriptor_json = 4;
  reserved 5 to 15;
}

message UploadCompiledSnapshotFileRequestV1 {
  oneof part {
    UploadCompiledSnapshotFileHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message UploadCompiledSnapshotFileResponseV1 {
  reserved 1 to 15;
}
