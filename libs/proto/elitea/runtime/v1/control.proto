syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";
import "elitea/runtime/v1/compiled_code.proto";
import "elitea/runtime/v1/egress_audit.proto";
import "elitea/runtime/v1/envelope.proto";
import "elitea/runtime/v1/errors.proto";
import "elitea/runtime/v1/input.proto";
import "elitea/runtime/v1/output.proto";
import "elitea/runtime/v1/run_step.proto";
import "elitea/runtime/v1/sandbox.proto";

option go_package = "github.com/elitea-ng/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

enum ClaimDispositionV1 {
  CLAIM_DISPOSITION_V1_UNSPECIFIED = 0;
  CLAIM_DISPOSITION_V1_ACCEPTED = 1;
  CLAIM_DISPOSITION_V1_RECOVER_TERMINAL_ACK = 2;
  CLAIM_DISPOSITION_V1_RECOVER_SETTLEMENT = 3;
  CLAIM_DISPOSITION_V1_SETTLED_ACK = 4;
  CLAIM_DISPOSITION_V1_OBSOLETE_ACK = 5;
  CLAIM_DISPOSITION_V1_ACTIVE_LEASE_NOACK = 6;
  CLAIM_DISPOSITION_V1_RETRY_LATER_NOACK = 7;
  CLAIM_DISPOSITION_V1_RETIRED_ACK = 8;
  CLAIM_DISPOSITION_V1_RECOVER_RUNNING_NOACK = 9;
  // The prior lease durably crossed the invocation fence but left no terminal
  // output. The worker may reconcile output only; it must never invoke the SDK.
  CLAIM_DISPOSITION_V1_RECOVER_AMBIGUOUS_INVOCATION_NOACK = 10;
  // Input and checkpoint inspection only. Ordinary invocation authorization
  // remains forbidden. The worker must validate its durable model checkpoint.
  CLAIM_DISPOSITION_V1_RECOVER_AGENT_MODEL_CHECKPOINT = 11;
  // Inspect one stored recovery visit. Consume an authorized journal action first.
  CLAIM_DISPOSITION_V1_RECOVER_NODE_VISIT = 12;
}

enum BeginExecutionDispositionV1 {
  BEGIN_EXECUTION_DISPOSITION_V1_UNSPECIFIED = 0;
  BEGIN_EXECUTION_DISPOSITION_V1_STARTED_NOW = 1;
  BEGIN_EXECUTION_DISPOSITION_V1_ALREADY_STARTED = 2;
}

enum AuthorizeInvocationDispositionV1 {
  AUTHORIZE_INVOCATION_DISPOSITION_V1_UNSPECIFIED = 0;
  AUTHORIZE_INVOCATION_DISPOSITION_V1_AUTHORIZED_NOW = 1;
  AUTHORIZE_INVOCATION_DISPOSITION_V1_ALREADY_AUTHORIZED = 2;
}

message ClaimCommandRequestV1 {
  string workload_session_id = 1;
  string producer_id = 2;
  SignedWorkerCommandEnvelopeV1 signed_command = 3;
  reserved 4 to 15;
  // Opt in only when the worker implements explicit model checkpoint recovery.
  bool agent_model_checkpoint_recovery = 16;
  bool node_recovery = 17;
  // Opt in only when the worker fetches and verifies
  // ExecutionSecurityContextV1 (ADR-0039, #1115). A governed command claimed
  // without it is refused with GOVERNED_WORKER_REQUIRED.
  bool governed_security_context_v1 = 18;
  // Opt in only when the worker implements the per-interrupt fan-out decision
  // contract (libs/proto/contracts/fanout-interrupt-decisions-v1.md v1.1):
  // agent_interrupt_pending cards, the claim-fenced interrupts fetch/ack
  // routes, and the fanout_wake continuation, whose input carries
  // meta.fanout_wake_v1 and no decisions. Main never grants a fanout_wake job
  // to a claim without this opt-in; the claim is answered retry-later, so an
  // older worker cannot run a wake as a fresh turn.
  bool fanout_interrupt_decisions = 19;
}

// SettlementRecoveryV1 carries only durable recovery material. A worker must
// never reconstruct these values or rerun business logic after redelivery.
// RECOVER_TERMINAL_ACK requires proposal, proposal_digest and idempotency_key.
// RECOVER_SETTLEMENT requires settlement_receipt_id and outcome.
message SettlementRecoveryV1 {
  SettlementProposalV1 proposal = 1;
  DigestV1 proposal_digest = 2;
  string idempotency_key = 3;
  string settlement_receipt_id = 4;
  ExecutionOutcomeV1 outcome = 5;
  reserved 6 to 15;
}

message ClaimReceiptV1 {
  ClaimDispositionV1 disposition = 1;
  ExecutionIdentityV1 identity = 2;
  ExecutionFenceV1 fence = 3;
  int64 lease_expires_at_unix_millis = 4;
  ExecutionInputBundleReferenceV1 input_bundle_ref = 5;
  ExecutionInputBundleV1 input_bundle = 6;
  DesiredExecutionStateV1 desired_state = 7;
  uint64 claim_handoff_watermark = 8;
  string claim_id = 9;
  SettlementRecoveryV1 settlement_recovery = 10;
  RuntimeErrorV1 retirement = 11;
  // Database-authored creation instant for a fresh accepted claim. This is
  // carried only by ACCEPTED receipts so a separate execution-state database
  // can order stale-writer takeover without reading Main's business tables.
  int64 claim_started_at_unix_micros = 12;
  // Exact strict JSON owned by node-recovery-v1.md, never caller metadata.
  bytes node_recovery_receipt_json = 16;
  reserved 13 to 15;
  // A bearer for elitea-vector, minted for this claim (ADR-0031 decision 1).
  // Carried only by ACCEPTED, RECOVER_AGENT_MODEL_CHECKPOINT and
  // RECOVER_NODE_VISIT receipts of a capability that may use vectors, and
  // only where Main serves vector token introspection. Absent otherwise.
  VectorClaimTokenV1 vector_token = 17;
  // Main reads the typed tool-run refusals of a toolkit.call_tool.v1 result
  // (TOOLKIT_CALL_TOOL_STATUS_V1_EFFECT_REFUSED / _POLICY_REFUSED, and the
  // AUTHORIZATION_FAILED run-credentials sentence). Set only on ACCEPTED
  // receipts of that capability. A worker that does not see it (an older Main)
  // sends the older shapes: UNKNOWN_TOOL with the fixed refusal sentence, and
  // the generic authorization sentence.
  bool toolkit_typed_refusals = 18;
}

// VectorClaimTokenV1 is a short-lived bearer bound to one claim: its
// execution, the execution's resource project and actor, and the vector
// sources it may read and write. Main stores only its SHA-256. Introspection
// answers it inactive as soon as the claim is released (settled, aborted or
// taken over), its lease lapses, the execution is settling or terminal, or
// its desired state is no longer RUNNING. The worker keeps it in memory
// only; it never logs or spools it, and sends it only to elitea-vector.
message VectorClaimTokenV1 {
  // The bearer string: "elvc_" followed by 43 base64url characters.
  string bearer = 1;
  // The latest instant it can be valid: the command deadline, capped.
  int64 expires_at_unix_millis = 2;
  // The vector sources it is admitted for, by payload keyword
  // ("toolkit_index").
  repeated string allowed_sources = 3;
  reserved 4 to 15;
}

message ClaimCommandResponseV1 {
  ClaimReceiptV1 receipt = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

// BeginExecution is the durable side-effect fence between an admitted local
// executor slot and business execution. It carries no business inputs.
message BeginExecutionRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  reserved 3 to 15;
}

message BeginExecutionResponseV1 {
  BeginExecutionDispositionV1 disposition = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

// AuthorizeInvocation is the last durable fence before the synchronous SDK
// callable may be submitted. AUTHORIZED_NOW is the only disposition that
// permits submission; ALREADY_AUTHORIZED means the prior callable may have
// started and therefore must never be invoked again.
message AuthorizeInvocationRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  reserved 3 to 15;
}

message AuthorizeInvocationResponseV1 {
  AuthorizeInvocationDispositionV1 disposition = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

// The authenticated recovery worker attests that this digest identifies its
// validated pending model checkpoint. It never authorizes replay of a tool.
message AuthorizeAgentModelCheckpointRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  DigestV1 checkpoint_digest = 3;
  reserved 4 to 15;
}

message AuthorizeAgentModelCheckpointResponseV1 {
  AuthorizeInvocationDispositionV1 disposition = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

message RenewLeaseRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  string idempotency_key = 3;
  reserved 4 to 15;
}

message RenewLeaseResponseV1 {
  int64 lease_expires_at_unix_millis = 1;
  DesiredExecutionStateV1 desired_state = 2;
  RuntimeErrorV1 rejection = 3;
  // ADR-0034: the execution is a cloud turn whose thread the desktop is
  // taking back (reclaim_pending). The worker wraps the turn up gracefully:
  // the tool call in flight finishes (a long run_command is stopped after a
  // short bound), the work is committed and published, and the turn ends
  // with a note. The desired state stays RUNNING; Main's 60 s grace and hard
  // cancel remain the fallback. Rides the same lease poll as cancellation.
  bool workspace_wrap_up = 4;
  reserved 5 to 15;
}

message ObserveDesiredStateRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  reserved 3 to 15;
}

message ObserveDesiredStateResponseV1 {
  DesiredExecutionStateV1 desired_state = 1;
  RuntimeErrorV1 rejection = 2;
  // As RenewLeaseResponseV1.workspace_wrap_up.
  bool workspace_wrap_up = 3;
  reserved 4 to 15;
}

message PrepareSettlementRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  SettlementProposalV1 proposal = 3;
  DigestV1 proposal_digest = 4;
  string idempotency_key = 5;
  reserved 6 to 15;
}

message PrepareSettlementResponseV1 {
  string settlement_receipt_id = 1;
  ExecutionOutcomeV1 outcome = 2;
  RuntimeErrorV1 rejection = 3;
  reserved 4 to 15;
}

// RemoveIndex runs elitea-main's index delete flow for one index of a toolkit
// the claimed execution carries (the `remove_index` tool of the indexing
// families, ADR-0030 I1). Main is the only writer of the index registry
// (ADR-0031), so the worker never deletes an index's vectors itself: it asks,
// under its live claim, and Main checks the run's principal may delete the
// toolkit's indexes, tombstones the registry row and deletes the vectors
// through its usual path (or its sweeper). The project is the claimed
// execution's, never the request's; the toolkit and the index are named by the
// request and must belong to that project.
message RemoveIndexRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  // The accepted claim's id, which the context authorizer requires beside
  // the fence.
  string claim_id = 3;
  // The frozen toolkit's id.
  int64 toolkit_id = 4;
  // The index name the model asked for, from the frozen catalog.
  string index_name = 5;
  // Required. The frozen catalog's registry id of that index (the worker
  // names an index from the catalog, so it always has one): Main refuses a
  // name that no longer resolves to it (NOT_FOUND), so a recreated index is
  // not deleted under a stale name. A request without it is malformed.
  string index_id = 6;
  reserved 7 to 15;
}

enum RemoveIndexDispositionV1 {
  REMOVE_INDEX_DISPOSITION_V1_UNSPECIFIED = 0;
  // The registry row is tombstoned; the vectors are deleted or left to the
  // sweeper.
  REMOVE_INDEX_DISPOSITION_V1_REMOVED = 1;
  // No live index of that name and id in the claimed project's toolkit.
  REMOVE_INDEX_DISPOSITION_V1_NOT_FOUND = 2;
  // The run's principal may not delete this toolkit's indexes.
  REMOVE_INDEX_DISPOSITION_V1_FORBIDDEN = 3;
  // The index's run is still active; it cannot be deleted yet.
  REMOVE_INDEX_DISPOSITION_V1_ACTIVE_RUN = 4;
  // The claim's conversation read personal memory: a shared index is not
  // changed from it (worker unit M9). An older worker reads this as a
  // malformed disposition and removes nothing.
  REMOVE_INDEX_DISPOSITION_V1_SHARED_WRITE_REFUSED = 5;
}

message RemoveIndexResponseV1 {
  RemoveIndexDispositionV1 disposition = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

// ClaimSteeringMessages hands the worker the steering messages queued
// against the running turn of this claim, oldest first. The worker calls it at
// each safe point of an ordinary agent loop: after the tool results of a step
// and before the next model request. It adds the messages to the model
// request as user messages. A pipeline turn never calls it.
//
// It has two steps, so a worker that stops between them loses nothing:
// - CLAIM: Main records the returned messages as claimed by this lease epoch.
//   It also returns again every claimed message that is not acknowledged,
//   of this lease epoch or an earlier one: a lost answer loses nothing. The
//   worker ignores the ids it already holds.
// - ACKNOWLEDGE: when the model checkpoint that holds a message is persisted,
//   the worker names it in `acknowledged_steering_ids` (on its next call, or
//   at once with `acknowledge_only`). Main then writes it as a conversation
//   message, marks it injected and emits `steer.injected`. A replacement claim
//   acknowledges the ids of its restored checkpoint, so they are not returned
//   again. An id that is not claimed is ignored.
// An empty list is the ordinary answer.
message ClaimSteeringMessagesRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  // At most 64 steering ids (canonical lowercase UUIDs), handled before the
  // claim.
  repeated string acknowledged_steering_ids = 3;
  // Acknowledge only: claim no new message.
  bool acknowledge_only = 4;
  reserved 5 to 15;
}

message SteeringMessageV1 {
  string steering_id = 1;
  // The user's text, at most 16 KiB of UTF-8.
  string content = 2;
  int64 queued_at_unix_millis = 3;
  reserved 4 to 15;
}

message ClaimSteeringMessagesResponseV1 {
  repeated SteeringMessageV1 messages = 1;
  RuntimeErrorV1 rejection = 2;
  reserved 3 to 15;
}

// ReportEgressSummary records the public hosts the worker's own HTTP clients
// reached and refused for one claimed execution (ADR-0044 decision 2,
// #1490), beside the egress proxy's reports for sandbox runs. It is sent under
// the live claim, before PrepareSettlement. A report is a CUMULATIVE snapshot
// of this worker's view of the execution, so a retried or repeated report
// replaces the previous one. Best effort: a failed report never fails the
// run. Main stores it as the run's `worker` row in egress_run_summaries.
message ReportEgressSummaryRequestV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  // At most 256 hosts in each list; the rest are counted in other_hosts.
  repeated EgressHostReachedV1 hosts_reached = 3;
  repeated EgressHostRefusedV1 hosts_refused = 4;
  int64 other_hosts = 5;
  reserved 6 to 15;
}

message ReportEgressSummaryResponseV1 {
  RuntimeErrorV1 rejection = 1;
  reserved 2 to 10;
}

service RuntimeControlService {
  rpc AuthorizeSandboxJob(AuthorizeSandboxJobRequestV1) returns (AuthorizeSandboxJobResponseV1);
  rpc AuthorizeRustCompiledSnapshot(AuthorizeRustCompiledSnapshotRequestV1) returns (AuthorizeRustCompiledSnapshotResponseV1);
  rpc ClaimCommand(ClaimCommandRequestV1) returns (ClaimCommandResponseV1);
  rpc BeginExecution(BeginExecutionRequestV1) returns (BeginExecutionResponseV1);
  rpc AuthorizeInvocation(AuthorizeInvocationRequestV1) returns (AuthorizeInvocationResponseV1);
  rpc AuthorizeAgentModelCheckpoint(AuthorizeAgentModelCheckpointRequestV1) returns (AuthorizeAgentModelCheckpointResponseV1);
  rpc RenewLease(RenewLeaseRequestV1) returns (RenewLeaseResponseV1);
  rpc ObserveDesiredState(ObserveDesiredStateRequestV1) returns (ObserveDesiredStateResponseV1);
  rpc PrepareSettlement(PrepareSettlementRequestV1) returns (PrepareSettlementResponseV1);
  rpc RemoveIndex(RemoveIndexRequestV1) returns (RemoveIndexResponseV1);
  rpc ClaimSteeringMessages(ClaimSteeringMessagesRequestV1) returns (ClaimSteeringMessagesResponseV1);
  rpc ReportEgressSummary(ReportEgressSummaryRequestV1) returns (ReportEgressSummaryResponseV1);
  rpc ReportRunSteps(ReportRunStepsRequestV1) returns (ReportRunStepsResponseV1);
}
