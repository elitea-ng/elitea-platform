syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/agent.proto";
import "elitea/runtime/v1/indexing.proto";
import "elitea/runtime/v1/input.proto";
import "elitea/runtime/v1/toolkit.proto";
import "elitea/runtime/v1/validation.proto";

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

enum WorkerCommandTypeV1 {
  WORKER_COMMAND_TYPE_V1_UNSPECIFIED = 0;
  WORKER_COMMAND_TYPE_V1_START = 1;
  WORKER_COMMAND_TYPE_V1_RESUME = 2;
  WORKER_COMMAND_TYPE_V1_RETRY = 3;
  WORKER_COMMAND_TYPE_V1_RECONCILE = 4;
  WORKER_COMMAND_TYPE_V1_CONFIGURATION_VALIDATE = 5;
  WORKER_COMMAND_TYPE_V1_TOOLKIT_AVAILABLE_TOOLS = 6;
  WORKER_COMMAND_TYPE_V1_INDEX_INGEST = 7;
  WORKER_COMMAND_TYPE_V1_AGENT_EXECUTE_APPLICATION = 8;
  WORKER_COMMAND_TYPE_V1_AGENT_EXECUTE_ADHOC = 9;
  WORKER_COMMAND_TYPE_V1_TOOLKIT_CALL_TOOL = 10;
}

// WorkerCommandV1 is the immutable, reference-only command body allowed on a
// Redis Stream. It must never contain settings, prompts, files, results,
// credentials, grant material, exceptions, or other bulk/protected content.
// Protocol-v1 consumers reject unknown tags and duplicate singular/oneof tags
// at the bounded wire layer; ordinary protobuf last-value-wins parsing is not
// sufficient for an authenticated command.
message WorkerCommandV1 {
  string protocol_revision = 1;
  string command_id = 2;
  string idempotency_key = 3;
  WorkerCommandTypeV1 command_type = 4;
  string execution_id = 5;
  uint64 generation = 6;
  uint64 dispatch_ordinal = 7;
  string root_execution_id = 8;
  string parent_execution_id = 9;
  string parent_call_id = 10;
  string tenant_id = 11;
  string resource_project_id = 12;
  string projection_project_id = 13;
  string principal_ref = 14;
  ExecutionInputBundleReferenceV1 input_bundle_ref = 16;
  string capability_id = 17;
  string capability_version = 18;
  string resource_class = 19;
  string isolation_class = 20;
  uint32 priority = 21;
  int64 deadline_unix_millis = 22;
  string traceparent = 23;
  string tracestate = 24;
  string limits_revision = 25;

  oneof capability_command {
    ConfigurationValidationCommandV1 configuration_validation = 32;
    ToolkitAvailableToolsCommandV1 toolkit_available_tools = 33;
    IndexIngestCommandV1 index_ingest = 34;
    AgentExecutionCommandV1 agent_execution = 35;
    ToolkitCallToolCommandV1 toolkit_call_tool = 36;
  }

  reserved 15, 26 to 31;
  reserved "grant_template_id";
  reserved 37 to 63;
}
