syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/agent.proto";
import "elitea/runtime/v1/indexing.proto";
import "elitea/runtime/v1/input.proto";
import "elitea/runtime/v1/security_context.proto";
import "elitea/runtime/v1/toolkit.proto";
import "elitea/runtime/v1/validation.proto";

option go_package = "github.com/elitea-ng/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

enum WorkerCommandTypeV1 {
  WORKER_COMMAND_TYPE_V1_UNSPECIFIED = 0;
  WORKER_COMMAND_TYPE_V1_START = 1;
  WORKER_COMMAND_TYPE_V1_RESUME = 2;
  WORKER_COMMAND_TYPE_V1_RETRY = 3;
  WORKER_COMMAND_TYPE_V1_RECONCILE = 4;
  WORKER_COMMAND_TYPE_V1_CONFIGURATION_VALIDATE = 5;
  WORKER_COMMAND_TYPE_V1_TOOLKIT_AVAILABLE_TOOLS = 6;
  WORKER_COMMAND_TYPE_V1_INDEX_INGEST = 7;
  WORKER_COMMAND_TYPE_V1_AGENT_EXECUTE_APPLICATION = 8;
  WORKER_COMMAND_TYPE_V1_AGENT_EXECUTE_ADHOC = 9;
  WORKER_COMMAND_TYPE_V1_TOOLKIT_CALL_TOOL = 10;
  WORKER_COMMAND_TYPE_V1_TOOLKIT_EXECUTE_READ = 11;
}

// WorkerCommandV1 is the immutable, reference-only command body allowed on the
// command bus. It must never contain settings, prompts, files, results,
// credentials, grant material, exceptions, or other bulk/protected content.
// Protocol-v1 consumers reject unknown tags and duplicate singular/oneof tags
// at the bounded wire layer; ordinary protobuf last-value-wins parsing is not
// sufficient for an authenticated command.
message WorkerCommandV1 {
  string protocol_revision = 1;
  string command_id = 2;
  string idempotency_key = 3;
  WorkerCommandTypeV1 command_type = 4;
  string execution_id = 5;
  uint64 generation = 6;
  uint64 dispatch_ordinal = 7;
  string root_execution_id = 8;
  string parent_execution_id = 9;
  string parent_call_id = 10;
  string tenant_id = 11;
  string resource_project_id = 12;
  string projection_project_id = 13;
  string principal_ref = 14;
  ExecutionInputBundleReferenceV1 input_bundle_ref = 16;
  string capability_id = 17;
  string capability_version = 18;
  string resource_class = 19;
  string isolation_class = 20;
  uint32 priority = 21;
  int64 deadline_unix_millis = 22;
  string traceparent = 23;
  string tracestate = 24;
  string limits_revision = 25;

  oneof capability_command {
    ConfigurationValidationCommandV1 configuration_validation = 32;
    ToolkitAvailableToolsCommandV1 toolkit_available_tools = 33;
    IndexIngestCommandV1 index_ingest = 34;
    AgentExecutionCommandV1 agent_execution = 35;
    ToolkitCallToolCommandV1 toolkit_call_tool = 36;
    ToolkitExecuteReadCommandV1 toolkit_execute_read = 64;
  }

  // Set only on a governed command (ADR-0039, #1115). A command with this
  // field is published on the governed subject and claimed only by a worker
  // that sets ClaimCommandRequestV1.governed_security_context_v1. Never set
  // while the credential governance flag is off, so legacy bytes are
  // unchanged.
  ExecutionSecurityContextReferenceV1 security_context_ref = 65;

  // The public egress policy for this command's outbound HTTP (ADR-0044
  // decision 2, #1490). Absent means open: public hosts are unrestricted.
  // Main omits it while the platform's worker_egress mode is open, so
  // commands are unchanged byte for byte.
  WorkerEgressPolicyV1 egress_policy = 66;

  // The delegation policy of an agent run (ADR-0044 decision 3, #1501).
  // Absent means the defaults: a maximum delegation depth of 4, narrowing
  // enforced, and no root data classes. Main omits it while every value is
  // the default, so commands are unchanged byte for byte.
  WorkerDelegationPolicyV1 delegation_policy = 67;

  // The approval policy of an agent run (ADR-0041 decision 5, #1498): the
  // root agent's risk tier and the tool categories that need an approval
  // at that tier. Absent means no category rule: only the platform's
  // sensitive action tools need an approval. Main omits it until an
  // administrator saves the `approval_policy` section, so commands are
  // unchanged byte for byte while workers from an earlier release run.
  WorkerApprovalPolicyV1 approval_policy = 68;

  reserved 15, 26 to 31;
  reserved "grant_template_id";
  reserved 37 to 63;
}

// How a worker treats public hosts (ADR-0044 decision 2). The policy narrows
// which HOSTS a run may reach; it never widens the SSRF rule. Where the SSRF
// guard applies (web_fetch and every redirect hop), private, link-local,
// metadata and reserved addresses stay refused in every mode. Toolkit
// clients (Jira, Confluence, GitHub, ...) never had the SSRF guard, because
// they reach operator-approved on-prem hosts; for them this policy is the
// only egress check. Endpoints the operator configured for the worker itself
// (web-search provider origins admitted by ELITEA_WEB_EGRESS_ALLOWLIST) are
// not judged by this policy, since Main cannot list them, but they are still
// reported as reached.
enum WorkerEgressModeV1 {
  WORKER_EGRESS_MODE_V1_UNSPECIFIED = 0;
  // Any public host. The same as an absent policy.
  WORKER_EGRESS_MODE_V1_OPEN = 1;
  // Only hosts matching `allow`. A refused host is the tool error
  // `egress_host_not_allowed`, never a silent failure.
  WORKER_EGRESS_MODE_V1_ALLOWLIST = 2;
}

// The run's public egress policy, assembled by Main from the platform's
// entries, the project's entries, the approved hosts of the connectors in
// use and each toolkit instance's base URL. It travels inside the signed
// command, so a worker cannot widen it.
message WorkerEgressPolicyV1 {
  WorkerEgressModeV1 mode = 1;
  // The egresslib grammar (`libs/go/egresslib`): host, host:port, *.domain,
  // *.domain:port or a CIDR block. At most 1024 entries; a malformed entry
  // fails the command closed.
  repeated string allow = 2;
  reserved 3 to 10;
}

// How grant narrowing treats a callee that needs a grant its caller lacks.
enum WorkerDelegationModeV1 {
  // The same as ENFORCE.
  WORKER_DELEGATION_MODE_V1_UNSPECIFIED = 0;
  // The delegation is refused with DELEGATION_GRANT_MISSING.
  WORKER_DELEGATION_MODE_V1_ENFORCE = 1;
  // The missing grant is recorded on the delegation step and the callee
  // runs. The depth cap is enforced in both modes.
  WORKER_DELEGATION_MODE_V1_REPORT = 2;
}

// A run's delegation policy (ADR-0044 decision 3). When an agent calls a
// saved agent or pipeline, a pipeline node runs one, or an agent starts a
// sub-agent, the callee runs with the intersection of its own grants and its
// caller's. The depth counts every kind of delegation together; the root is
// depth 0.
message WorkerDelegationPolicyV1 {
  // 1 to 16; 0 means the default (4).
  uint32 max_depth = 1;
  WorkerDelegationModeV1 mode = 2;
  // The root agent's declared data classes (its agent registry row), in the
  // registry's grammar (^[a-z0-9][a-z0-9_.-]{0,63}$), at most 32. Empty
  // imposes no data class constraint.
  repeated string root_data_classes = 3;
  reserved 4 to 10;
}

// A run's approval policy (ADR-0041 decision 5). A tool call needs a
// human approval when the platform's sensitive action tools name the tool,
// or when the tool's category is in approval_categories. An author setting
// cannot remove either rule. Nested callees use the root agent's tier.
message WorkerApprovalPolicyV1 {
  // low, medium, high or critical: the root agent's agent registry tier.
  string risk_tier = 1;
  // read, write, delete, external_send, payment or code_execution, each at
  // most once. Empty: no category needs an approval at this tier.
  repeated string approval_categories = 2;
  reserved 3 to 10;
}
