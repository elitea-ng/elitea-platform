syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";
import "elitea/runtime/v1/errors.proto";

option go_package = "github.com/elitea-ng/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// The cloud executor's workspace-store calls (ADR-0034 decisions 9 and 14).
//
// The worker, never the sandbox, moves a handed-off thread's segments. It
// calls these on Main's private control listener, which already requires a
// verified client certificate. Every request carries the live claim: Main
// authenticates the workload, verifies the fence, and only then resolves the
// claim to its handoff thread. The thread and the project are the CLAIM's,
// never the request's: thread_uuid and epoch only state what the worker
// believes, and Main refuses a request whose belief is stale.
//
// No presigned URL, storage key or token crosses this service. Segment bytes
// ride the streams below in bounded chunks, so the per-message bounds of the
// control listener (64 KiB request, 80 KiB response) are not raised.

// WorkspaceClaimV1 binds one request to the live claim of a cloud turn.
message WorkspaceClaimV1 {
  ExecutionIdentityV1 identity = 1;
  ExecutionFenceV1 fence = 2;
  // The accepted claim's id, which the context authorizer requires beside
  // the fence.
  string claim_id = 3;
  // The handed-off thread (conversation uuid) the runtime context named.
  string thread_uuid = 4;
  // The handoff epoch the runtime context named. A stale epoch is refused
  // with WORKSPACE_REFUSAL_CODE_V1_STALE_EPOCH.
  uint64 epoch = 5;
  reserved 6 to 15;
}

// WorkspaceRefV1 is one store ref and its commit (40 lowercase hex).
message WorkspaceRefV1 {
  string name = 1;
  string sha = 2;
  reserved 3 to 15;
}

// WorkspaceRefUpdateV1 is one compare-and-set: the ref moves from old to new
// or nothing moves. An absent old means the ref must not exist yet.
message WorkspaceRefUpdateV1 {
  string name = 1;
  optional string old = 2;
  string new = 3;
  reserved 4 to 15;
}

enum WorkspaceRefusalCodeV1 {
  WORKSPACE_REFUSAL_CODE_V1_UNSPECIFIED = 0;
  // The claim's execution is not a cloud turn of a handed-off thread.
  WORKSPACE_REFUSAL_CODE_V1_NOT_A_WORKSPACE_TURN = 1;
  // The thread moved on: another epoch owns it now (take back, erase).
  WORKSPACE_REFUSAL_CODE_V1_STALE_EPOCH = 2;
  // A ref's expected old value is not its current value.
  WORKSPACE_REFUSAL_CODE_V1_REF_CONFLICT = 3;
  // The executor may write only refs/elitea/cloud.
  WORKSPACE_REFUSAL_CODE_V1_REF_NOT_ALLOWED = 4;
  // Publish named a segment that was never uploaded.
  WORKSPACE_REFUSAL_CODE_V1_SEGMENT_MISSING = 5;
  // The stored object's size or SHA-256 is not the declared one.
  WORKSPACE_REFUSAL_CODE_V1_CHECKSUM_MISMATCH = 6;
  WORKSPACE_REFUSAL_CODE_V1_UNSUPPORTED_OBJECT_FORMAT = 7;
  WORKSPACE_REFUSAL_CODE_V1_SEGMENT_TOO_LARGE = 8;
  WORKSPACE_REFUSAL_CODE_V1_QUOTA_EXCEEDED = 9;
  // 10-13 were the pull-request diff's refusals: the worker computes that
  // diff from its own unpacked repository now (Main reads no git pack).
  reserved 10 to 13;
  reserved "WORKSPACE_REFUSAL_CODE_V1_NO_UPSTREAM", "WORKSPACE_REFUSAL_CODE_V1_DIFF_TOO_LARGE", "WORKSPACE_REFUSAL_CODE_V1_DIFF_BINARY", "WORKSPACE_REFUSAL_CODE_V1_DIFF_EMPTY";
  // The thread's owner chose no pull-request credential (or it no longer
  // resolves to a GitHub configuration).
  WORKSPACE_REFUSAL_CODE_V1_NO_FORGE_CREDENTIAL = 14;
  // The effective policy does not allow pull requests from the cloud.
  WORKSPACE_REFUSAL_CODE_V1_PULL_REQUESTS_DISABLED = 15;
}

// WorkspaceRefusalV1 is a typed business refusal; rejection (RuntimeErrorV1)
// stays for transport, authentication and fence failures.
message WorkspaceRefusalV1 {
  WorkspaceRefusalCodeV1 code = 1;
  // REF_CONFLICT: the refs as they are now.
  repeated WorkspaceRefV1 current = 2;
  reserved 3 to 15;
}

// WorkspaceSegmentV1 describes one stored segment of a fetch plan.
message WorkspaceSegmentV1 {
  uint64 seq = 1;
  // "COMPACT" (full, no prerequisites) or "PUSH" (incremental).
  string kind = 2;
  // The content address: lowercase hex SHA-256 of the file bytes.
  string sha256 = 3;
  uint64 bytes = 4;
  repeated string prerequisites = 5;
  // The refs the segment carries, exactly.
  repeated WorkspaceRefV1 refs = 6;
  reserved 7 to 15;
}

message WorkspaceFetchPlanRequestV1 {
  WorkspaceClaimV1 claim = 1;
  uint64 since_seq = 2;
  reserved 3 to 15;
}

message WorkspaceFetchPlanV1 {
  uint64 head_seq = 1;
  // The thread's live refs.
  repeated WorkspaceRefV1 refs = 2;
  // The minimal chain, oldest first: the newest COMPACT, then every later
  // PUSH; only PUSH segments when since_seq is past the COMPACT.
  repeated WorkspaceSegmentV1 segments = 3;
  reserved 4 to 15;
}

// WorkspaceSegmentEndV1 closes one segment's chunks: the worker compares the
// received bytes with the plan before it reads them.
message WorkspaceSegmentEndV1 {
  string sha256 = 1;
  uint64 bytes = 2;
  reserved 3 to 15;
}

// The fetch stream: one plan frame first, then for each planned segment its
// chunks (at most 32 KiB each) and one end frame. A refusal or rejection is
// the only frame of a refused stream.
message WorkspaceFetchFrameV1 {
  oneof frame {
    WorkspaceFetchPlanV1 plan = 1;
    bytes segment_chunk = 2;
    WorkspaceSegmentEndV1 segment_end = 3;
    WorkspaceRefusalV1 refusal = 4;
    RuntimeErrorV1 rejection = 5;
  }
  reserved 6 to 15;
}

message WorkspaceUploadHeaderV1 {
  WorkspaceClaimV1 claim = 1;
  string sha256 = 2;
  uint64 bytes = 3;
  reserved 4 to 15;
}

// The upload stream: one header frame, then the segment's chunks (at most
// 32 KiB each). Main stores the object only when the received bytes match the
// header's size and SHA-256.
message WorkspaceUploadFrameV1 {
  oneof frame {
    WorkspaceUploadHeaderV1 header = 1;
    bytes chunk = 2;
  }
  reserved 3 to 15;
}

message WorkspaceUploadResponseV1 {
  // True when that digest was already stored for this thread; the chunks
  // were read and discarded.
  bool exists = 1;
  WorkspaceRefusalV1 refusal = 2;
  RuntimeErrorV1 rejection = 3;
  reserved 4 to 15;
}

message WorkspacePublishRequestV1 {
  WorkspaceClaimV1 claim = 1;
  string kind = 2;
  string segment_sha256 = 3;
  uint64 bytes = 4;
  repeated string prerequisites = 5;
  repeated WorkspaceRefUpdateV1 refs = 6;
  string object_format = 7;
  reserved 8 to 15;
}

message WorkspacePublishResponseV1 {
  uint64 seq = 1;
  repeated WorkspaceRefV1 refs = 2;
  WorkspaceRefusalV1 refusal = 3;
  RuntimeErrorV1 rejection = 4;
  reserved 5 to 15;
}

message WorkspaceEnvSecretRequestV1 {
  WorkspaceClaimV1 claim = 1;
  reserved 2 to 15;
}

// One harvested environment variable (ADR-0034 decision 5 amendment). The
// worker keeps the value in memory only, injects it into the run_command
// environment of the sandbox and nothing else, and redacts it from every
// tool result, transcript and trace frame.
message WorkspaceEnvVarV1 {
  string name = 1;
  string value = 2;
  reserved 3 to 15;
}

// The env stream: frames of variables (each frame under the control
// listener's 80 KiB response bound), then one end frame with the count. A
// refusal or rejection is the only frame of a refused stream. A thread with
// no stored env answers an end frame with count 0.
message WorkspaceEnvSecretFrameV1 {
  oneof frame {
    WorkspaceEnvVarsV1 vars = 1;
    uint32 end_count = 2;
    WorkspaceRefusalV1 refusal = 3;
    RuntimeErrorV1 rejection = 4;
  }
  reserved 5 to 15;
}

message WorkspaceEnvVarsV1 {
  repeated WorkspaceEnvVarV1 vars = 1;
  reserved 2 to 15;
}

message WorkspaceForgeCredentialRequestV1 {
  WorkspaceClaimV1 claim = 1;
  reserved 2 to 15;
}

// The thread's forge credential (ADR-0034 decision 10, amended
// 2026-10-26): the GitHub or GitLab configuration its owner chose, redeemed.
// Main answers it only for the running cloud turn of the thread, and only
// while the policy allows pull requests. The worker keeps it in memory for
// one git_push or open_pull_request call, outside the sandbox, uses it only
// in that call's own HTTPS requests, and never logs it.
message WorkspaceForgeCredentialResponseV1 {
  // The configuration's data as one JSON object (exactly as a toolkit's
  // `github_configuration` or `gitlab_configuration` setting holds it after
  // expansion), at most 32 KiB. Empty on a refusal or a rejection.
  string configuration_json = 1;
  WorkspaceRefusalV1 refusal = 2;
  RuntimeErrorV1 rejection = 3;
  // The configuration's type: `github` or `gitlab`. Empty on a refusal or a
  // rejection.
  string forge = 4;
  reserved 5 to 15;
}

// The audit events only the executor observes (ADR-0034 decision 12). The
// fields are the ones Main records and nothing else: no field can carry a
// path or file content.
enum WorkspaceExecutorEventKindV1 {
  WORKSPACE_EXECUTOR_EVENT_KIND_V1_UNSPECIFIED = 0;
  // handoff.scan_blocked: the hydrated tree held credential-shaped content.
  WORKSPACE_EXECUTOR_EVENT_KIND_V1_SCAN_BLOCKED = 1;
  // pull_request.opened: open_pull_request opened one (a GitHub pull
  // request or a GitLab merge request).
  WORKSPACE_EXECUTOR_EVENT_KIND_V1_PULL_REQUEST_OPENED = 2;
  // branch.pushed: git_push (or open_pull_request) pushed the thread's
  // commits to a new branch of the upstream remote.
  WORKSPACE_EXECUTOR_EVENT_KIND_V1_BRANCH_PUSHED = 3;
}

message WorkspaceRecordEventRequestV1 {
  WorkspaceClaimV1 claim = 1;
  WorkspaceExecutorEventKindV1 kind = 2;
  // scan_blocked: how many findings, and the distinct rule ids.
  uint32 findings = 3;
  repeated string rules = 4;
  // pull_request.opened: the toolkit, the branches, the number, its URL and
  // how many files it changes. branch.pushed: the toolkit, the new branch,
  // the upstream branch it starts from, the branch's URL and how many
  // commits it carries.
  string toolkit = 5;
  string branch = 6;
  string base = 7;
  uint64 number = 8;
  string url = 9;
  uint32 files = 10;
  uint32 commits = 11;
  reserved 12 to 15;
}

message WorkspaceRecordEventResponseV1 {
  bool recorded = 1;
  WorkspaceRefusalV1 refusal = 2;
  RuntimeErrorV1 rejection = 3;
  reserved 4 to 15;
}

// The files a cloud turn changed (ADR-0034 Phase 2: the web "Files changed"
// view). The worker computes them from its own repository right after the
// publish, outside the sandbox: the TURN set (the parent's tree to the
// commit's tree) and the CUMULATIVE set (the handoff snapshot's tree to the
// commit's tree). Main reads no git pack: it keeps what the worker sends,
// bounded, drops every path the thread's exclusions or path deny list
// match (an explicitly included excluded file stays, as at the send; never
// a path deny one), and serves the rest to the conversation's readers.
enum WorkspaceChangeStatusV1 {
  WORKSPACE_CHANGE_STATUS_V1_UNSPECIFIED = 0;
  WORKSPACE_CHANGE_STATUS_V1_ADDED = 1;
  WORKSPACE_CHANGE_STATUS_V1_MODIFIED = 2;
  WORKSPACE_CHANGE_STATUS_V1_DELETED = 3;
  // An exact rename: the same blob left from_path and arrived at path.
  WORKSPACE_CHANGE_STATUS_V1_RENAMED = 4;
}

enum WorkspaceChangeScopeV1 {
  WORKSPACE_CHANGE_SCOPE_V1_UNSPECIFIED = 0;
  // What this turn changed.
  WORKSPACE_CHANGE_SCOPE_V1_TURN = 1;
  // What every cloud turn so far changed, since the handoff snapshot.
  WORKSPACE_CHANGE_SCOPE_V1_CUMULATIVE = 2;
}

// One changed file of one scope. The frame stays under the control
// listener's 64 KiB request bound: path and from_path at most 4096 bytes
// each, diff at most 48 KiB.
message WorkspaceChangedFileV1 {
  WorkspaceChangeScopeV1 scope = 1;
  string path = 2;
  // RENAMED only: the path before.
  string from_path = 3;
  WorkspaceChangeStatusV1 status = 4;
  // The +/- line counts; absent for a binary file, a symlink, or a text
  // file too large to count.
  optional uint32 additions = 5;
  optional uint32 deletions = 6;
  bool binary = 7;
  // Too large to count or to keep a diff of.
  bool too_large = 8;
  // The file's unified diff (git's format, 3 lines of context); empty when
  // none is kept (binary, too large, or past the scope's diff budget).
  string diff = 9;
  reserved 10 to 15;
}

message WorkspaceChangesHeaderV1 {
  WorkspaceClaimV1 claim = 1;
  // The turn's published commit (refs/elitea/cloud now), its parent, and
  // the handoff snapshot the cumulative set is measured from (40 hex each).
  string commit = 2;
  string parent = 3;
  string base = 4;
  // Changed files past each scope's file bound, counted and not listed.
  uint32 turn_omitted = 5;
  uint32 cumulative_omitted = 6;
  // The commit's turn number: how many commits the parent walk from it takes
  // to reach the handoff snapshot (1: the first cloud turn). 0: unknown.
  uint32 depth = 7;
  reserved 8 to 15;
}

// The record stream: one header frame, then one frame per changed file.
message WorkspaceChangesFrameV1 {
  oneof frame {
    WorkspaceChangesHeaderV1 header = 1;
    WorkspaceChangedFileV1 file = 2;
  }
  reserved 3 to 15;
}

message WorkspaceRecordChangesResponseV1 {
  bool recorded = 1;
  // REF_CONFLICT: commit is not the thread's refs/elitea/cloud, or base is
  // not its handoff snapshot.
  WorkspaceRefusalV1 refusal = 2;
  RuntimeErrorV1 rejection = 3;
  reserved 4 to 15;
}

service WorkspaceStoreService {
  rpc WorkspaceFetchPlan(WorkspaceFetchPlanRequestV1) returns (stream WorkspaceFetchFrameV1);
  rpc WorkspaceUpload(stream WorkspaceUploadFrameV1) returns (WorkspaceUploadResponseV1);
  rpc WorkspacePublish(WorkspacePublishRequestV1) returns (WorkspacePublishResponseV1);
  // The thread's harvested env, as a claim-bound runtime secret: only when the
  // runtime context's `workspace.env_secret` is true.
  rpc WorkspaceEnvSecret(WorkspaceEnvSecretRequestV1) returns (stream WorkspaceEnvSecretFrameV1);
  // An executor audit event of the running turn, bound to its claim and
  // fence like every call here.
  rpc WorkspaceRecordEvent(WorkspaceRecordEventRequestV1) returns (WorkspaceRecordEventResponseV1);
  // The files the running turn's published commit changed, best effort: a
  // turn whose record fails is published all the same.
  rpc WorkspaceRecordChanges(stream WorkspaceChangesFrameV1) returns (WorkspaceRecordChangesResponseV1);
  // The thread's pull-request credential, as a claim-bound runtime secret:
  // only when the runtime context's `workspace.pull_request_credential` is
  // true, and only right before an open_pull_request call writes.
  rpc WorkspaceForgeCredential(WorkspaceForgeCredentialRequestV1) returns (WorkspaceForgeCredentialResponseV1);
}
