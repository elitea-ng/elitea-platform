syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";

option go_package = "github.com/elitea-ng/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// Governed credential redemption (ADR-0039 decision 10, issue #1118). A
// governed worker redeems the material for ONE bound tool invocation through
// RuntimeContentService.RedeemCredential, under the run's live claim (claim id
// and fence in metadata, as every claim-bound content RPC). Main authorizes the
// invocation against the stored ExecutionSecurityContextV1, records the
// decision in the security audit outbox and only then reads or exchanges
// material. Material is minted for the invocation and never stored.

// BoundToolInvocationV1 names one tool call and the one operation it performs.
message BoundToolInvocationV1 {
  // UUID v7 from the worker; unique per (execution, generation). A replay of
  // the same id with any other field changed is refused.
  string invocation_id = 1;
  string tool_call_id = 2;
  int64 toolkit_id = 3;
  // Canonical operation id, for example "jira.issue.read".
  string operation_id = 4;
  // Canonical resource, for example "jira:project/KEY".
  string resource_ref = 5;
  // sha256 over the tool call's canonical JSON arguments.
  DigestV1 arguments_digest = 6;
  string credential_reference_id = 7;
  reserved 8 to 15;
}

enum CredentialEnvelopeKindV1 {
  CREDENTIAL_ENVELOPE_KIND_V1_UNSPECIFIED = 0;
  CREDENTIAL_ENVELOPE_KIND_V1_STATIC = 1;
  CREDENTIAL_ENVELOPE_KIND_V1_OAUTH_ACCESS = 2;
  CREDENTIAL_ENVELOPE_KIND_V1_DYNAMIC_LEASE = 3;
}

// CredentialEnvelopeV1 is the material for one invocation. The worker holds
// it in memory for that call only and never logs, persists or forwards it.
message CredentialEnvelopeV1 {
  string redemption_id = 1;
  CredentialEnvelopeKindV1 kind = 2;
  // Adapter-defined keys (the provider descriptor's material keys for the
  // credential class); never logged.
  map<string, string> material = 3;
  // min(material expiry, lease expiry, policy maximum).
  int64 not_after_unix_millis = 4;
  // The canonical target the material is valid for (for example the site
  // base URL). The worker refuses to use it against any other target.
  string target_identity = 5;
  repeated string obligations = 6;
  string decision_id = 7;
  reserved 8 to 15;
}

// CredentialRedeemDenialV1 is a refusal with a safe, stable code. It is
// returned in the response (not as a gRPC status) so the worker can tell a
// policy refusal from a transport failure. Transport and binding failures
// (claim, fence, peer) stay gRPC statuses.
message CredentialRedeemDenialV1 {
  // One of DENIED, INVOCATION_MISMATCH, CLASS_NOT_SUPPORTED,
  // BACKEND_UNAVAILABLE, AUTHORIZATION_REQUIRED, CONTEXT_MISMATCH,
  // NOT_GOVERNED.
  string code = 1;
  // The decision id when a decision was made.
  string decision_id = 2;
  // Opaque reference for AUTHORIZATION_REQUIRED (#1117); empty otherwise.
  string authorization_reference = 3;
  reserved 4 to 15;
}
