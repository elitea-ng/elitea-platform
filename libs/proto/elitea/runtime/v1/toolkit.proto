syntax = "proto3";

package elitea.runtime.v1;

import "elitea/runtime/v1/common.proto";

option go_package = "github.com/EliteaAI/elitea-platform/libs/proto/gen/go/elitea/runtime/v1;runtimev1";

// ToolkitAvailableToolsCommandV1 is the bounded control-plane command for
// toolkit.available_tools.v1. The potentially large and credential-bearing
// settings object is an entry in WorkerCommandV1.input_bundle_ref; it is never
// embedded in this message or published through Redis.
message ToolkitAvailableToolsCommandV1 {
  string toolkit_type = 1;
  string settings_entry_id = 2;
  reserved 3 to 15;
}

// ToolkitAvailableToolsArtifactReferenceV1 identifies the immutable canonical
// JSON result. It contains no URI, bearer token, credential, or inline result
// body. The caller must fetch it through an independently authorized data-plane
// endpoint scoped by the execution identity on the enclosing output frame.
message ToolkitAvailableToolsArtifactReferenceV1 {
  string artifact_id = 1;
  string immutable_version = 2;
  string media_type = 3;
  uint64 byte_length = 4;
  DigestV1 digest = 5;
  string classification = 6;
  reserved 7 to 15;
}

// ToolkitAvailableToolsResultV1 binds the off-Redis result artifact to the
// exact settings content consumed by the legacy-compatible SDK adapter.
message ToolkitAvailableToolsResultV1 {
  string toolkit_type = 1;
  string input_bundle_id = 2;
  DigestV1 input_bundle_digest = 3;
  string settings_entry_id = 4;
  string settings_entry_version = 5;
  DigestV1 settings_content_digest = 6;
  ToolkitAvailableToolsArtifactReferenceV1 result_artifact = 7;
  reserved 8 to 15;
}

// ToolkitExecuteReadCommandV1 binds the reference-only Redis command to one
// immutable direct-call request in the input data plane.
message ToolkitExecuteReadCommandV1 {
  string request_entry_id = 1;
  reserved 2 to 15;
}

// ToolkitExecuteReadInputV1 is assembled by Main after a fresh project-scoped
// toolkit lookup. Toolkit settings contain only frozen references here;
// claim-time materialization is the first boundary allowed to redeem secrets.
message ToolkitExecuteReadInputV1 {
  string schema_revision = 1;
  bytes toolkit = 2;
  string toolkit_type = 3;
  string toolkit_name = 4;
  string tool_name = 5;
  bytes arguments = 6;
  bytes toolkit_guardrails = 7;
  reserved 8 to 15;
}

// ToolkitExecuteReadResultV1 is intentionally inline and bounded below one
// output frame. Larger read responses use the artifact-backed result path in a
// later capability revision rather than weakening the 64 KiB frame contract.
message ToolkitExecuteReadResultV1 {
  string input_bundle_id = 1;
  DigestV1 input_bundle_digest = 2;
  string request_entry_id = 3;
  string request_entry_version = 4;
  DigestV1 request_content_digest = 5;
  bytes result_json = 6;
  string toolkit_type = 7;
  string toolkit_name = 8;
  string tool_name = 9;
  reserved 10 to 15;
}
