# Rust crates shared by the platform's Rust services (ADR-0027).
#
# This is a workspace of LIBRARIES only. Each service keeps its own crate,
# Cargo.lock and image, and takes these as path dependencies, so an image
# copies `libs/rust` plus its own tree and nothing else. That is deliberate:
# one root workspace would put every Rust service in every image build and
# every lock bump in every Rust CI job.
#
# Dependency requirements here are caret ranges at the version the services
# lock, not exact pins: two services resolve them independently, and an
# exact pin in a shared crate would force every consumer to move together.
# The services' own manifests keep their exact pins.
#
# This lock file exists for this workspace's own tests; it is not what any
# service builds against.
[workspace]
resolver = "3"
members = ["adk-gateway", "agent-runtime", "code-parsers", "connectors", "content-source", "conversation", "doc-chunk", "doc-extract", "egress-guard", "engine-core", "engine-sidecar", "graph-algos", "inventory-core", "llm-wire", "local-embed", "local-index", "local-tools", "model-client", "model-rpc", "office-core", "platform-rpc", "pg-migrate", "repo-ingest", "vector-index", "workspace-runner", "workspace-store"]
# Vendored crates are path dependencies, never members: their own tests,
# benches and dev-dependencies are not built or resolved (vendor/README.md).
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# The patched adk 2.3.0 crates (vendor/README.md), applied here exactly as in
# services/elitea-worker-rust/Cargo.toml so elitea-agent-runtime's own tests
# run the agent loop the worker ships. Every host that links the runtime
# carries the same lines. `vendor/adk-sandbox` is patched only where the
# worker's `sandbox-supervisor` links it: nothing here does, and Cargo warns
# on an unused patch.
[patch.crates-io]
adk-agent = { path = "vendor/adk-agent" }
adk-runner = { path = "vendor/adk-runner" }
# Zavora-slide fixes (vendor/README.md): tables added to an opened slide
# survive a save, and renders and PDFs use the bundled fonts only (ADR-0032
# Risks).
# Exact version kept (=0.1.1): the office-core isolation test asserts it.
zavora-slide = { path = "vendor/zavora-slide" }
zavora-slide-render = { path = "vendor/zavora-slide-render" }
zavora-slide-pdf = { path = "vendor/zavora-slide-pdf" }
# Zip 9 security fixes (vendor/README.md). The published crates require zip 2
# or zip 8. Those ranges resolve zip 2.4.2 and zip 8.6.0, which carry
# CVE-2026-115905, CVE-2026-115907, CVE-2026-115908 and CVE-2026-115909. Each
# copy moves to zip 9.1.3, the version every direct declaration here pins.
# Keep the versions: the office-core isolation test asserts them. `calamine`
# is 0.36.2, which stays inside the `^0.36.1` range that xberg requires.
calamine = { path = "vendor/calamine" }
zavora-xlsx = { path = "vendor/zavora-xlsx" }
zavora-docx-opc = { path = "vendor/zavora-docx-opc" }
zavora-slide-opc = { path = "vendor/zavora-slide-opc" }
zavora-slide-xlsx = { path = "vendor/zavora-slide-xlsx" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
