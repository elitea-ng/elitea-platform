[package]
name = "elitea-conversation"
description = "An agent's conversation and its summarisation (LangChain's SummarizationMiddleware), shared by the engines' tool-calling loops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
elitea-engine-core = { path = "../engine-core" }
elitea-model-client = { path = "../model-client" }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
