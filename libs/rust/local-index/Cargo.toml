[package]
name = "elitea-local-index"
description = "The desktop's local workspace index (ADR-0029 decision 7): a workspace folder as a content source, the Inventory graph kept in an owner-only SQLite file, and the read-only index tools the local agent calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Tilde, like agent-runtime and local-tools: adk breaks its API between
# minors. The index tools are adk `Tool`s in one `Toolset`.
adk-core = { version = "~2.2.0", default-features = false }
async-trait = "0.1.92"
elitea-agent-runtime = { path = "../agent-runtime" }
# The parsers' thread cap (`set_parser_threads`).
elitea-code-parsers = { path = "../code-parsers" }
elitea-content-source = { path = "../content-source" }
# The progress context and stop flag ingestion reports through, and
# Python-compatible text the entity lookup shares with the cloud tools.
elitea-engine-core = { path = "../engine-core" }
elitea-inventory-core = { path = "../inventory-core" }
# The confined workspace (openat / O_NOFOLLOW reads, `path_deny`) and the
# walk every local tool lists a folder with.
elitea-local-tools = { path = "../local-tools" }
# The same line as the desktop host (`bundled`: the SQLite the app ships
# with) and as sqlx here: one libsqlite3-sys in every lockfile.
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
# Default features only: the desktop host links this crate and must not
# build serde_json with `preserve_order` (ADR-0029 decision 2).
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
# A refresh runs on the blocking pool, on its own current-thread runtime.
tokio = { version = "1.53.1", features = ["rt", "sync"] }

# The owner check on the database and its sidecars (geteuid), without
# `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[dev-dependencies]
elitea-inventory-core = { path = "../inventory-core", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
