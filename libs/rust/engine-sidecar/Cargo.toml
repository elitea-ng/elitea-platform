[package]
name = "elitea-engine-sidecar"
description = "The engine sidecar's Unix-socket NDJSON server, container probe and cgroup reader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["server", "telemetry"]
# The NDJSON protocol server (`server`, `Engine`) and the container probe
# (`healthcheck`): axum and hyper. Off, the crate is the socket binder and
# the cgroup reader alone, for a sidecar that speaks another protocol over
# the socket (elitea-doc-extractor: gRPC) and must link no HTTP client.
server = ["dep:axum", "dep:elitea-engine-core", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:serde_json", "dep:tokio-stream", "tokio/macros", "tokio/sync", "tokio/time"]
# Span export over OTLP (`telemetry`): the OpenTelemetry SDK and its reqwest
# 0.13 HTTP client. Off, a process has stderr log lines and nothing that can
# open a network connection.
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:reqwest", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "tokio/rt"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
elitea-engine-core = { path = "../engine-core", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"], optional = true }
# Span export, the agent worker's versions and switches (telemetry.rs). The
# OTLP exporter's HTTP client is reqwest 0.13 with rustls, the engines' own.
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"], optional = true }
tokio = { version = "1.53.1", features = ["net"] }
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
