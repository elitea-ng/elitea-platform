[package]
name = "elitea-repo-ingest"
description = "Repository ingest for the engines: admitted shallow git clones, artifact-folder downloads, file discovery and limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# TEST ONLY. In a debug build, a `repo_config` base URL of
# `http://127.0.0.1:<port>` or `http://localhost:<port>` clones over plain
# http, so end-to-end tests can serve a repository with `git http-backend`.
# A release build ignores the feature: the clone URL is always `https://`.
loopback-git-http = []

[dependencies]
base64 = "0.23.1"
elitea-engine-core = { path = "../engine-core" }
# The shared host allowlist rule only (`egress::HostAllowlist`); no provider
# client, no reqwest.
elitea-connectors = { path = "../connectors", default-features = false }
# The project artifact store over elitea-main's platform listener
# (`ArtifactObjectService`, #1359 U5): an artifact-folder source.
elitea-platform-rpc = { path = "../platform-rpc" }
# HTTPS shallow clone in process, no git binary. The minimal feature set:
# the blocking reqwest transport with rustls, checkout, SHA-1, and the
# parallel pack resolution. The ssh and file transports compile in with
# the blocking client but are unreachable: a CloneTarget holds only http(s).
gix = { version = "0.90.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "sha1", "max-performance"] }
regex = "1.13.1"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
tonic = { version = "0.14.6", default-features = false }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
elitea-platform-rpc = { path = "../platform-rpc", features = ["testing"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
