# Vendored agent-desktop-windows 1.2.0 (vercel-labs/agent-desktop at
# b43ac4f6e892ef608f8851428613c4009f0e84c7, Apache-2.0). Cargo.toml.orig is
# the upstream manifest. This one spells out the `workspace = true` keys with
# the values of the upstream workspace root, takes core by path, and drops
# the upstream lint table. Every change is listed in libs/rust/vendor/README.md
# ("agent-desktop"). elitea-desktop-control depends on this crate only under
# `cfg(target_os = "windows")`.
[package]
name = "agent-desktop-windows"
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
# The upstream unit tests are not vendored (vendor/README.md).
test = false
doctest = false

[dependencies]
agent-desktop-core = { path = "../core" }
png = { version = "=0.18.1", default-features = false }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = [
  "control",
  "input",
] }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  # Elitea patch (src/elitea_ext.rs, window_facts): the shell's folder
  # windows (IShellWindows, IWebBrowserApp) and the VARIANT index they take.
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  # Elitea patch (src/elitea_ext.rs): the session and input-desktop reads.
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
