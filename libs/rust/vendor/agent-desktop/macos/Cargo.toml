# Vendored agent-desktop-macos 1.2.0 (vercel-labs/agent-desktop at
# b43ac4f6e892ef608f8851428613c4009f0e84c7, Apache-2.0). Cargo.toml.orig is
# the upstream manifest. This one spells out the `workspace = true` keys with
# the values of the upstream workspace root, takes core by path, and drops
# the helper binary, the example and the upstream lint table. Every change is listed in libs/rust/vendor/README.md
# ("agent-desktop").
[package]
name = "agent-desktop-macos"
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

# Kept from upstream so its `cfg(feature = ...)` lines stay known; nothing
# vendored uses them (the example and the interactive tests are not copied).
[features]
dev-tools = []
interactive-tests = []

[lib]
# The upstream unit tests are not vendored (vendor/README.md).
test = false
doctest = false

[dependencies]
agent-desktop-core = { path = "../core" }
smallvec = { version = "1.13", features = ["serde", "union"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tracing = "0.1"
base64 = "0.23"
rustc-hash = "2.1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }
