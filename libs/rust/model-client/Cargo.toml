[package]
name = "elitea-model-client"
description = "A small OpenAI-compatible client for the platform gateway: embeddings, chat, streaming, token counting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
elitea-engine-core = { path = "../engine-core" }
# rustls with the platform verifier and HTTP/2; no native-tls, no cookies,
# no decompression. `Response::chunk` reads SSE, so `stream` is not needed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The o200k_base and cl100k_base BPEs are compiled in: no runtime download.
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# A throwaway CA and server certificate per test run, for the TLS CA file
# test: macOS refuses a leaf valid for more than 825 days, so a committed
# fixture would need rotating.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
