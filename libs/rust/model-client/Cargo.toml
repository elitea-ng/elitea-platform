[package]
name = "elitea-model-client"
description = "A small OpenAI-compatible client for the platform gateway: embeddings, chat, streaming, token counting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
elitea-engine-core = { path = "../engine-core" }
# The /llm caller contract the agent worker shares: routes, headers,
# refusal codes, the SSE splitter, usage and tool-call assembly.
elitea-llm-wire = { path = "../llm-wire" }
# The model calls: elitea.llm.v1.ModelService over a tonic mTLS channel
# (#1359), on aws-lc like reqwest's rustls below.
elitea-model-rpc = { path = "../model-rpc" }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-aws-lc"] }
# The artifact API only (`Transport::http_client`): rustls with the platform
# verifier and HTTP/2; no native-tls, no cookies, no decompression. Model calls
# never use it.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
# The o200k_base and cl100k_base BPEs are compiled in: no runtime download.
tiktoken-rs = "0.12.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
# The test gateway serves its HTTP handlers as ModelService (#1359).
elitea-model-rpc = { path = "../model-rpc", features = ["testing"] }
# A throwaway CA and server certificate per test run, for the TLS CA file
# test: macOS refuses a leaf valid for more than 825 days, so a committed
# fixture would need rotating.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
# An HTTP/2 server that sends GOAWAY at a connection's age and lets its
# streams finish, as elitea-main's platform listener does. tonic's own
# max_connection_age cannot: without a grace it panics re-polling its timer,
# with one it never sends GOAWAY before the forced close.
hyper = { version = "1.12.0", default-features = false, features = ["http2", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["service", "tokio"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
