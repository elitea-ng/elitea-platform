[package]
name = "elitea-office-core"
description = "The one crate that names a zavora type: bounded, typed open/edit/render of pptx, docx and xlsx (ADR-0032 decisions 2 and 3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The three authoring libraries, pinned exactly (ADR-0032 decision 5): a bump is
# a reviewed change that reruns the hostile corpus. Only this crate names them.
zavora-slide = "=0.1.1"
zavora-docx = "=0.1.4"
# No features: `cffi`, `mmap`, `crypto`, `async-tokio`, `ods`, `xls`, `xlsb`,
# `serde-support` and `wasm` all stay off (the 27 lines of unsafe live in two).
zavora-xlsx = { version = "=0.1.2", default-features = false }
# The platform's own zip (services/elitea-doc-extractor pins the same version).
# `deflate` is what the lock already resolves for it (flate2 + zlib-rs).
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
# Decode and downscale for render copies only. The same png/jpeg/gif feature
# set the renderers (svg2pdf) already link, so the lock does not change.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
thiserror = "2.0.21"
# The rasteriser the pptx renderer already links (zavora-slide-render), named
# directly for `svg_to_png` (ADR-0033). Text only: no raster-image decoders and
# no system fonts, so the lock does not change.
resvg = { version = "0.49.0", default-features = false, features = ["text"] }

[dev-dependencies]
# A safe-to-use counting allocator for the hostile-corpus memory ceiling
# (the crate and its tests forbid `unsafe`, so the tests cannot write one).
peak_alloc = "0.3.0"

[lints]
workspace = true
