[package]
name = "elitea-local-tools"
description = "The desktop host's local tool family (ADR-0029 decision 4): a confined workspace, file, shell, git and document tools, the OS sandbox, checkpoints and the approval rules, handed to the agent runtime through its ToolProvider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Text from PDF, Office, e-mail and HTML through doc-extract's extractor.
# Off by default: it links xberg, which is large.
documents = ["elitea-doc-extract/documents"]
# The desktop ⇄ cloud handoff (ADR-0034): snapshot, exclusions, secret
# scan and take-back over the workspace store. Off by default: it links
# gix's object and pack crates.
handoff = ["dep:elitea-workspace-store", "dep:regex"]

[dependencies]
# Tilde, like agent-runtime: adk breaks its API between minors and the
# runtime pins the same line.
adk-core = { version = "~2.3.0", default-features = false }
async-trait = "0.1.92"
base64 = "0.23.1"
elitea-agent-runtime = { path = "../agent-runtime" }
elitea-content-source = { path = "../content-source" }
elitea-doc-extract = { path = "../doc-extract" }
elitea-workspace-store = { path = "../workspace-store", optional = true }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
# Images the model can see (`picture`): sniffed from the bytes, decoded and
# re-encoded to the size limits. No default features: no rayon, no serde, no
# format beyond the four the providers take (MIT OR Apache-2.0).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# find_files' fuzzy ranking: the matcher nucleo 0.5 re-exports (MPL-2.0,
# linked unmodified; no serde_json, no threads), as Codex's file search uses.
nucleo-matcher = "0.3.1"
# The language servers' protocol types (`lsp`, #1236; MIT, with
# fluent-uri MIT and serde_repr MIT OR Apache-2.0). The JSON-RPC framing is
# the crate's own: async-lsp 0.2.4 links lsp-types 0.95 and futures' I/O
# traits, not tokio's pipes.
lsp-types = "0.97.0"
# The stdio MCP client (`mcp`, #1230): the same rmcp the runtime links
# through adk-tool, over the child's pipes (MIT; no new crate).
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-async-rw"] }
# Background processes on a pseudo-terminal (`process`, #1223): wezterm's
# PTY spawn for macOS and Linux (MIT; no serde, no TLS).
portable-pty = "0.9.0"
# run_tests' junit reports (pytest, Surefire, Gradle). No default features:
# no serde, no encoding; it expands no DTD entity.
quick-xml = { version = "0.42.0", default-features = false }
# The handoff's secret rules (shipped as data, `src/handoff/secret_rules.json`).
regex = { version = "1.13.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
# Path comparisons the way APFS makes them (NFC/NFD-insensitive).
unicode-normalization = "0.1.25"
# A terminal process's rendered screen, what the model reads of an
# interactive program (`process`; MIT, no serde).
vt100 = "0.18.1"

# Every file operation walks the workspace from a directory descriptor with
# O_NOFOLLOW (openat/mkdirat/renameat), so a symlink swapped in mid-call
# cannot redirect it; process groups are killed on timeout. Unix only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
elitea-workspace-store = { path = "../workspace-store" }
encoding_rs = "0.8.42"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
