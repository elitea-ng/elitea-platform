[package]
name = "elitea-doc-extract"
description = "Document bytes to text for the engines: text decoded as it is, other formats (PDF, Office, HTML, email) through a document extractor behind a feature (ADR-0028)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# PDF, Office, e-mail and e-book extraction through xberg (ADR-0028 D4).
documents = ["dep:xberg", "dep:tokio"]
# HTML to markdown through html-to-markdown-rs (`ExtractOptions::html_to_markdown`).
# Off by default: only the indexing consumers convert pages.
html = ["dep:html-to-markdown-rs"]

[dependencies]
elitea-content-source = { path = "../content-source" }
# Legacy text encodings (ADR-0030 decision 4): sniffed with chardetng, decoded
# with encoding_rs. Both are already locked through xberg.
chardetng = "1.0.0"
encoding_rs = "0.8.42"
# HTML to markdown, as the SDK's `markdownify` does. Defaults off: no metadata
# pass, no image codecs. The version agent-runtime locks.
html-to-markdown-rs = { version = "3.17.2", default-features = false, optional = true }
tokio = { version = "1.53.1", features = ["rt"], optional = true }
# Pinned exactly, like the grammars (libs/rust/README.md): extraction output
# is a function of the version, and the crate moves fast. Only the formats
# below: pure-Rust PDF (no PDFium), Office (DOCX/PPTX/ODT/RTF/EPUB, legacy
# DOC/PPT), spreadsheets, e-mail, HTML. No OCR, no models, no network —
# measured: no HTTP/TLS crate in the graph, libc only at runtime.
xberg = { version = "=1.3.6", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel", "email", "html"], optional = true }

[lints]
workspace = true
