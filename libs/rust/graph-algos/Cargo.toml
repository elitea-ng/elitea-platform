[package]
name = "elitea-graph-algos"
description = "Graph algorithms the engines share: seeded Leiden community detection over the vendored leiden-rs, and personalized PageRank (the repo map)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Leiden pulls the vendored leiden-rs (and its rand); the desktop's repo map
# needs only PageRank, which has no dependency, so inventory-core turns this
# off.
default = ["leiden"]
leiden = ["dep:leiden-rs"]

[dependencies]
# Vendored (see ../vendor/README.md): a single-author crate hosted on
# gitcode. No default features: no CLI, no rayon (one thread, so a seed
# gives one result on every machine), no gryf.
leiden-rs = { path = "../vendor/leiden-rs", version = "=0.8.1", default-features = false, optional = true }

[dev-dependencies]
# The networkx fixture (tests/pagerank.rs) is JSON.
serde_json = "1.0.154"

[lints]
workspace = true
