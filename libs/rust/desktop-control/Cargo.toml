[package]
name = "elitea-desktop-control"
description = "Desktop computer use (ADR-0047 decision 1): the DesktopDriver trait over the person's other applications — apps and windows, budgeted accessibility snapshots with snapshot-scoped refs, actions on refs, typing, key chords, capture and waits. macOS through the vendored agent-desktop adapters; every other OS compiles to the Unsupported driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.21"

# macOS only. The vendored agent-desktop 1.2.0 adapters (Apache-2.0,
# ../vendor/README.md, "agent-desktop"): the AX tree, ref resolution,
# semantic actions and CGEvent input. No vendor type leaves this crate.
[target.'cfg(target_os = "macos")'.dependencies]
agent-desktop-core = { path = "../vendor/agent-desktop/core", version = "=1.2.0" }
agent-desktop-macos = { path = "../vendor/agent-desktop/macos", version = "=1.2.0" }
# Cropping a display capture to a region and re-encoding it. PNG only, no
# default features (MIT OR Apache-2.0); local-tools pins the same line.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The user-active guard's listen-only event tap (ADR-0047 decision 6,
# src/macos_input.rs), through these crates' safe API. Both are already in
# every lock through the vendored adapter, at these versions (MIT OR
# Apache-2.0).
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }

[lints]
workspace = true
