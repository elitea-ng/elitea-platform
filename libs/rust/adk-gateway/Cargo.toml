[package]
name = "elitea-adk-gateway"
description = "An adk-rust model (adk_core::Llm) over the platform gateway client (elitea-model-client): the engines' agents run on adk's agent and runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Tilde, not caret: adk breaks its API between minors, and the worker pins
# =2.2.0 with patches of its own (services/elitea-worker-rust/vendor).
adk-core = { version = "~2.2.0", default-features = false }
elitea-engine-core = { path = "../engine-core" }
elitea-model-client = { path = "../model-client" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
