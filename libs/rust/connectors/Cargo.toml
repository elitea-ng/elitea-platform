[package]
name = "elitea-connectors"
description = "One HTTP client per source provider, shared by the agent-runtime toolkit families and the indexing connectors (ADR-0027 decision 8, ADR-0030 decision 3). TLS-agnostic: every request goes through a Transport the host binary supplies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["providers"]
# The provider clients (configuration, wire layer, request building and
# authentication). Off only for a crate that wants the egress rule alone
# (elitea-repo-ingest), so it does not link the provider dependencies.
providers = [
    "dep:base64",
    "dep:chrono",
    "dep:percent-encoding",
    "dep:ring",
    "dep:serde_json",
    "dep:tokio",
    "dep:zeroize",
]
# `ContentSource` implementations over the provider clients (list with
# pagination and 429 backoff, fetch under a separate size cap).
content-source = ["providers", "dep:elitea-content-source"]
# A `Transport` over a host-built reqwest 0.12 client (the agent worker and
# the desktop host). No TLS feature is named here: the binary's own reqwest
# features pick the TLS stack, and Cargo unifies them.
reqwest-012 = ["dep:reqwest012"]
# The same adapter over reqwest 0.13 (the engines).
reqwest-013 = ["dep:reqwest013"]
# Fixture constructors for the hosts' own test suites. Never enabled by a
# production build.
test-support = []

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
http = "1.5.0"
thiserror = "2.0.20"
url = "2.5.8"

base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"], optional = true }
elitea-content-source = { path = "../content-source", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
# RS256 for the GitHub App JWT only; it is not a TLS provider.
ring = { version = "0.17.14", optional = true }
# Default features only: nothing here may depend on map order or number
# representation (the worker builds serde_json with `arbitrary_precision`,
# the engines with `preserve_order`).
serde_json = { version = "1.0.151", optional = true }
tokio = { version = "1.53.1", default-features = false, features = ["sync", "time"], optional = true }
zeroize = { version = "1.9.0", optional = true }

reqwest012 = { package = "reqwest", version = "0.12.28", default-features = false, optional = true }
reqwest013 = { package = "reqwest", version = "0.13.4", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
