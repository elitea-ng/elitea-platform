name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contract, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Contract pin (sha256 of the upstream copy)
        run: npm run contract:verify

      - name: Generated client matches contract/
        run: npm run contract:check

      - name: Typecheck
        run: npm run typecheck

      # Locally Expo writes expo-env.d.ts (git-ignored), which pulls in the
      # web-widened style types: check that variant too so both agree (#30).
      - name: Typecheck with Expo's env types
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (script tests + jest)
        run: npm test -- --ci

      - name: Release config has no developer sign-in switch
        run: npm run check:release-config
