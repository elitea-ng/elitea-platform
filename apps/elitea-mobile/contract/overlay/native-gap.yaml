# Agent Zefir native-gap overlay.
#
# Written by the Agent Zefir authors (not copied from any Elitea file). It
# describes the REST operations the app needs that the pinned upstream
# document (contract/elitea-v2.yaml @ e7585fee2) does not define yet. Each
# shape was learned by observing the server's wire behaviour and is recorded
# per operation in `x-zefir-source`.
#
# The ADR-0025 native-client operations (discovery, brand pack JSON, native
# token and revoke) were written against the server branch
# `feat/adr-0025-native-client-support` at commit
# 398985cdc882c4d35c0f13ff607f1212b3b1c2ab (WP1-WP4 committed, not yet on
# main). Their shapes were read from that commit's handlers; the branch spec
# is NOT pinned here. When the pin moves to a release that defines them, the
# build fails on each one by design and they are deleted from this file.
#
# Rules enforced by scripts/contract.mjs build:
#   - an operation (path + method) that upstream already defines is a hard
#     error ("upstream now defines X; delete it from the overlay"), so the
#     overlay can never shadow the real definition once ADR-0025 WP5 ships;
#   - a component name that upstream already defines is a hard error;
#   - every operation must carry `operationId`, `x-zefir-source` and
#     `x-zefir-until`.
#
# Server-sent-event endpoints are NOT described here (OpenAPI 3.0 cannot model
# text/event-stream usefully); they are typed by hand in src/api/sse/.
#
# The overlay may $ref upstream components (ProjectId, ErrorResponse, the
# shared 401/403/404/500 responses); references resolve after the merge.
#
# Incremental sync (ADR-0025 WP6, `changes_since` cursors and tombstones) was
# written against the same server branch at commit
# 7665eb30f1d4b88eaac2eccb71af5fb6b72c53ae (WP6) and its documentation commit
# 04cab926be210784d9147f3753eb5ffe43241795 (WP5, client contract). On an
# upstream operation (listConversations) and an upstream schema
# (ConversationListing) the additions go through `x-zefir-extend`, which may
# only ADD a parameter, a status or a property and fails the build once
# upstream defines the same one.
openapi: 3.0.3
info:
  title: Agent Zefir native-gap overlay
  version: 0.1.0

x-zefir-extend:
  operations:
    listConversations:
      x-zefir-source: 'observed: elitea-main conversations List handler delta mode (changes.go listChanges), server commit 7665eb30f, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: changes_since
          in: query
          required: false
          description: >-
            Incremental sync. Absent: the legacy page. Empty or `0`: a full
            sync in delta shape. Otherwise the `next_cursor` of an earlier
            delta of the SAME list (same project and same source,
            entity_name, entity_meta_id, mine and hidden values; another
            list's cursor is a 400). `offset` is ignored; `limit` defaults to
            100 and bounds rows and tombstones each. Losing access to the
            whole project is a 403, not a tombstone.
          schema: { type: string, maxLength: 1024 }
      responses:
        '400': { $ref: '#/components/responses/SyncCursorRefused' }
        '410': { $ref: '#/components/responses/SyncCursorExpired' }
  schemas:
    ConversationListing:
      x-zefir-source: 'observed: elitea-main ConversationChanges (changes.go), server commit 7665eb30f, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      properties:
        tombstones:
          type: array
          description: Delta mode only. Conversations deleted or gone from this list for the caller since the cursor.
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          type: string
          description: >-
            Delta mode only. Opaque; send it as the next `changes_since`. It
            never passes the server clock minus a 5 s settle window, so
            recently changed rows are returned again (upsert by id).
        has_more:
          type: boolean
          description: Delta mode only. The page was cut short by `limit`; call again at once with `next_cursor`.

paths:
  /elitea_core/conversations/prompt_lib/{project_id}:
    post:
      operationId: createConversation
      summary: Create a conversation in a project
      tags: [chat]
      x-zefir-source: 'observed: elitea-main conversations Create handler (POST /api/v2/elitea_core/conversations/prompt_lib/{projectID}), 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: The created conversation (without participants or messages).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/conversation/prompt_lib/{project_id}/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        description: The conversation's numeric id or its uuid; the server accepts either.
        schema: { type: string }
    get:
      operationId: getConversation
      summary: Read one conversation, optionally with its latest message groups
      tags: [chat]
      x-zefir-source: 'observed: elitea-main conversations Get handler (GET /api/v2/elitea_core/conversation/prompt_lib/{projectID}/{conversationID}), 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: messages_limit
          in: query
          required: false
          description: When > 0, embeds up to this many message groups as `message_groups`.
          schema: { type: integer, minimum: 0 }
        - name: sort_order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      operationId: deleteConversation
      summary: Delete a conversation and its messages
      tags: [chat]
      x-zefir-source: 'observed: elitea-main conversations Delete handler (DELETE /api/v2/elitea_core/conversation/prompt_lib/{projectID}/{conversationID}), 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/messages/prompt_lib/{project_id}/{conversation_uuid}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_uuid
        in: path
        required: true
        description: The conversation's uuid (a send takes the uuid only; the list also takes the numeric id).
        schema: { type: string }
    get:
      operationId: listConversationMessages
      summary: A conversation's transcript, paged or as a delta
      description: |
        Legacy mode pages message groups newest first (`limit`, `offset`).
        With `changes_since` it answers the groups changed since the cursor,
        oldest change first, the tombstones of deleted groups and the next
        cursor. A group still streaming changes again when it settles, so a
        delta can return it twice; upsert by `id`. The cursor is bound to the
        conversation's numeric id, whichever spelling the path used.
      tags: [chat]
      x-zefir-source: 'observed: elitea-main conversations ListMessages handler and its delta (changes.go MessageChanges), server commit 7665eb30f, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: limit
          in: query
          required: false
          description: At most 100 (default 10; 100 in delta mode, for rows and tombstones each).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
        - name: changes_since
          in: query
          required: false
          description: Empty or `0` is a full sync; otherwise the `next_cursor` of an earlier delta of this transcript.
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: The transcript page or delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageListing'
        '400': { $ref: '#/components/responses/SyncCursorRefused' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '410': { $ref: '#/components/responses/SyncCursorExpired' }
        '500': { $ref: '#/components/responses/500' }
    post:
      operationId: startApplicationTurn
      summary: Send a user message to the conversation's agent or model and start its execution
      description: |
        Idempotent per `question_id`: re-sending the byte-identical body
        returns the original execution with `created: false`; a different body
        with the same `question_id` is a 409. The response's `events_url` is a
        same-origin absolute path to the execution's event stream.

        `agent.execute.application.v1` addresses the conversation's agent
        (`application` participant). `agent.execute.adhoc.v1` is a plain model
        turn: `participant_id` is the conversation's `dummy` participant, or
        0 when it has none, and `llm_settings.model_name` is required (the
        server does not read the model from the participant: without
        `llm_settings` it answers 422 `unsupported_agent_execution`).
      tags: [chat]
      x-zefir-source: 'observed: elitea-main agentexecution current application start route (POST /api/v2/elitea_core/messages/prompt_lib/{projectID}/{conversationID}?execution_contract=agent.execute.application.v1), 2026-10-04; adhoc contract observed against elitea-main e2cfe7703 (participant_id 0 and dummy, with and without llm_settings) and elitea-web buildStartBody, 2026-10-05'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: execution_contract
          in: query
          required: true
          schema:
            type: string
            enum: [agent.execute.application.v1, agent.execute.adhoc.v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationTurnRequest'
      responses:
        '200':
          description: The execution was started (or an identical earlier send was found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTurnStarted'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStartError'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: The question_id was already used with a different body, or the turn conflicts with server state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStartError'
        '415':
          description: The request was not application/json.
        '422':
          description: The participant cannot be executed through this contract (`unsupported_agent_execution`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStartError'
        '503':
          description: The server is busy; retry after the `Retry-After` header.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnStartError'

  /notifications/notifications/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listNotifications
      summary: List the caller's notifications, paged or as a delta
      description: |
        With `changes_since` it answers the caller's notifications changed
        since the cursor, oldest change first, plus tombstones. Combining it
        with `offset`, `only_new`, `only_total`, `search`, `event_type`,
        `sort_by` or `sort_order` is a 400 `invalid_sync_request`.
      tags: [notifications]
      x-zefir-source: 'observed: elitea-main notifications REST route (GET /api/v2/notifications/notifications/prompt_lib/{projectID}), 2026-10-04; delta mode (api.go listChanges) at server commit 7665eb30f'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 10 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: only_new
          in: query
          required: false
          schema: { type: boolean }
        - name: only_total
          in: query
          required: false
          schema: { type: boolean }
        - name: sort_by
          in: query
          required: false
          schema: { type: string }
        - name: sort_order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc] }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: changes_since
          in: query
          required: false
          description: Empty or `0` is a full sync; otherwise the `next_cursor` of an earlier notification delta of the same user.
          schema: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: One page of notifications (with only_total=true, `rows` is absent), or a delta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/SyncCursorRefused' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '410': { $ref: '#/components/responses/SyncCursorExpired' }
        '500': { $ref: '#/components/responses/500' }
    put:
      operationId: updateNotifications
      summary: Mark notifications seen or unseen
      tags: [notifications]
      x-zefir-source: 'observed: elitea-main notifications REST route (PUT /api/v2/notifications/notifications/prompt_lib/{projectID}), 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSeenUpdate'
      responses:
        '200':
          description: The number of notifications changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSeenUpdated'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /.well-known/elitea-client:
    # Served at the origin root (RFC 8615), not under the /api/v2 base.
    servers:
      - url: /
    get:
      operationId: getClientDiscovery
      summary: Anonymous discovery document a client reads before signing in
      tags: [discovery]
      security: []
      x-zefir-source: 'observed: elitea-main discovery handler (GET /.well-known/elitea-client), server commit 398985cdc, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      responses:
        '200':
          description: The document. Strong ETag; If-None-Match answers 304.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'
        '304':
          description: Unchanged since the presented entity tag.
        '503':
          description: A source of the document is unavailable; retry later.

  /branding/pack.json:
    get:
      operationId: getBrandingPackJSON
      summary: The deployment's resolved brand pack, with absolute asset URLs
      tags: [branding]
      security: []
      x-zefir-source: 'observed: elitea-main branding PackJSON handler (GET /api/v2/branding/pack.json), server commit 398985cdc, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: v
          in: query
          required: false
          description: Content version (the unquoted ETag) as the discovery document's brand_pack_url carries it.
          schema: { type: string }
      responses:
        '200':
          description: >-
            The pack (the upstream BrandPack schema, asset references made
            absolute). Header X-Elitea-Brand-Layers lists the contributing
            layers (default, file, db); `default` alone means the product
            default rather than a deployment brand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPack'
        '302':
          description: A stale `v`; redirects to the current one (same origin, same path).
        '304':
          description: Unchanged since the presented entity tag.

  /auth/native/token:
    post:
      operationId: exchangeNativeToken
      summary: Exchange an authorization code or a refresh token (native public client)
      description: >-
        Form-encoded, no client authentication (an Authorization header is
        refused). The refresh token rotates on every use; re-presenting the
        immediately previous one within the server's re-delivery window
        (default 30 s) returns the same successor pair, any other reuse
        revokes the device session. Below the client's minimum version the
        answer is 426 before anything is consumed.
      tags: [auth]
      security: []
      x-zefir-source: 'observed: elitea-main nativeauth token handler (POST /api/v2/auth/native/token), server commit 398985cdc, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      parameters:
        - name: X-Client-Version
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NativeTokenRequest'
      responses:
        '200':
          description: A new token pair and the full client policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTokenResponse'
        '400':
          description: invalid_request, unsupported_grant_type or invalid_grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'
        '401':
          description: invalid_client, or the flat device_revoked body (the app wipes).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NativeOAuthError'
                  - $ref: '#/components/schemas/DeviceRevokedError'
        '404':
          description: No native client is registered on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'
        '426':
          description: This app version is below the minimum; header X-Min-Client-Version repeats it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientUpgradeRequiredError'
        '429':
          description: Too many failed requests; see Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'
        '503':
          description: temporarily_unavailable; see Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'

  /auth/native/revoke:
    post:
      operationId: revokeNativeToken
      summary: Revoke the device session a native token belongs to (RFC 7009)
      description: >-
        Revokes the whole device session. Unknown or already revoked tokens
        also answer 200, so the answer reveals nothing. Never refused for an
        old client version.
      tags: [auth]
      security: []
      x-zefir-source: 'observed: elitea-main nativeauth revoke handler (POST /api/v2/auth/native/revoke), server commit 398985cdc, 2026-10-04'
      x-zefir-until: ADR-0025 WP5
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NativeRevokeRequest'
      responses:
        '200':
          description: Revoked, or nothing to revoke. No body.
        '400':
          description: invalid_request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'
        '401':
          description: invalid_client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOAuthError'

components:
  responses:
    SyncCursorRefused:
      description: >-
        400. For a delta request, `error` is `invalid_sync_cursor` (the cursor
        does not decode or belongs to another list, scope or filter: discard
        it and resync from `0`), `invalid_limit`, or (notifications)
        `invalid_sync_request`. A legacy request's 400 uses the same `error`
        key with a message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncCursorError'
    SyncCursorExpired:
      description: >-
        410 Gone, `error` = `sync_cursor_expired`: the cursor is older than
        the server's tombstone retention (97 days). Discard this list's cache
        and resync with `changes_since=0`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncCursorError'

  schemas:
    SyncTombstone:
      type: object
      description: One removal in a `changes_since` delta.
      required: [id, uuid, reason, deleted_at]
      properties:
        id:
          type: integer
          format: int64
          description: The removed item's integer id (for a message, the message group id).
        uuid:
          type: string
          nullable: true
          description: The removed item's uuid; null only where the server stored none.
        reason:
          type: string
          description: >-
            `deleted`, or `access_lost` (the item left this list for the
            caller: made private, the caller removed as a participant, or no
            longer matching the list filter). Unknown reasons are removals too.
          enum: [deleted, access_lost]
        deleted_at:
          type: string
          format: date-time

    SyncCursorError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }

    ConversationMessage:
      type: object
      description: One message group of a transcript; delta rows use the same shape.
      required: [id, uid, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
          description: The message group's numeric id AS A STRING (tombstones carry it as an integer).
        uid:
          type: string
          description: The group's uuid; for an answer, the `response_message_id` of the send.
        conversation_id: { type: string }
        role:
          type: string
          description: '`user` or `assistant`.'
        content: { type: string }
        content_type: { type: string }
        author_participant_id: { type: integer }
        sent_to_id: { type: integer }
        reply_to_id: { type: integer }
        metadata:
          type: object
          additionalProperties: true
        message_items:
          type: array
          description: Attachment items only; omitted for a group without attachments.
          items:
            type: object
            additionalProperties: true
        is_streaming:
          type: boolean
          description: Present (true) only while the turn is in flight.
        task_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the group was last rewritten; omitted when never.

    ConversationMessageListing:
      type: object
      description: >-
        Legacy mode: `items`, `total`, `page`, `page_size`, `total_pages`.
        Delta mode: `items` (changed groups, oldest change first), `total`
        (groups in the conversation now), `tombstones`, `next_cursor`,
        `has_more`.
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMessage'
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
        tombstones:
          type: array
          description: Delta mode only. Message groups deleted since the cursor (`id` is the group id).
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          type: string
          description: Delta mode only. See ConversationListing.next_cursor.
        has_more:
          type: boolean
          description: Delta mode only. See ConversationListing.has_more.

    ConversationParticipant:
      type: object
      required: [id, entity_name]
      properties:
        id:
          type: integer
          description: The participant row id (what a send's `participant_id` names).
        entity_name:
          type: string
          description: '`user`, `application`, `toolkit`, `llm`, ... (open set).'
        entity_meta:
          type: object
          nullable: true
          additionalProperties: true
        entity_settings:
          type: object
          nullable: true
          additionalProperties: true
        meta:
          type: object
          nullable: true
          additionalProperties: true

    MessageItem:
      type: object
      required: [id, item_type, order_index]
      properties:
        id: { type: integer }
        item_type:
          type: string
          description: '`text_message`, `attachment_message`, `canvas_message`, ... (open set; unknown types are skipped).'
        order_index: { type: integer }
        item_details:
          type: object
          nullable: true
          additionalProperties: true
          description: "For `text_message`, `{content: string}`."
      additionalProperties: true

    MessageGroup:
      type: object
      required: [id, uuid, author_participant_id, is_streaming, created_at, message_items]
      properties:
        id: { type: integer }
        uuid: { type: string }
        author_participant_id: { type: integer }
        sent_to_id: { type: integer }
        reply_to_id: { type: integer }
        is_streaming: { type: boolean }
        created_at:
          type: string
          description: Server-local timestamp without zone, e.g. `2026-10-04 12:00:00.123456`.
        updated_at: { type: string }
        task_id: { type: string }
        content:
          type: string
          description: The text items joined with newlines (convenience projection).
        meta:
          type: object
          nullable: true
          additionalProperties: true
        message_items:
          type: array
          items:
            $ref: '#/components/schemas/MessageItem'
      additionalProperties: true

    ConversationDetail:
      type: object
      required: [id, project_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          description: Numeric id, serialised as a string by this endpoint.
        uuid: { type: string }
        project_id:
          type: string
          description: Numeric id, serialised as a string by this endpoint.
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string }
        message_count: { type: integer }
        is_private: { type: boolean }
        folder_id: { type: string, nullable: true }
        source: { type: string }
        instructions: { type: string }
        meta:
          type: object
          additionalProperties: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ConversationParticipant'
        message_groups:
          type: array
          description: Present only when `messages_limit` > 0 was requested.
          items:
            $ref: '#/components/schemas/MessageGroup'
      additionalProperties: true

    CreateConversationRequest:
      type: object
      properties:
        name: { type: string }
        is_private: { type: boolean }
        meta:
          type: object
          additionalProperties: true
        participants:
          type: array
          maxItems: 100
          items:
            type: object
            required: [entity_name, entity_meta]
            properties:
              entity_name: { type: string }
              entity_meta:
                type: object
                additionalProperties: true
              entity_settings:
                type: object
                additionalProperties: true
            additionalProperties: true

    ApplicationTurnRequest:
      type: object
      description: |
        `llm_settings` must be absent for `agent.execute.application.v1` and
        present for `agent.execute.adhoc.v1`; `attachments_info` absent or
        empty. The whole body must stay at or under 512 KiB.
      required: [payload, project_id, participant_id, conversation_uuid, question_id]
      properties:
        payload:
          type: object
          required: [user_input]
          properties:
            user_input: { type: string }
        project_id:
          type: integer
          description: Must equal the path's project id.
        participant_id:
          type: integer
          minimum: 0
          description: |
            The agent participant's row id (application contract, at least 1),
            or the `dummy` participant's row id or 0 (adhoc contract).
        conversation_uuid:
          type: string
          description: Must equal the path's conversation uuid.
        question_id:
          type: string
          description: Client-generated LOWERCASE canonical UUID; the idempotency key of the turn.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        llm_settings:
          type: object
          description: The model of an adhoc turn; absent on an application turn.
          required: [model_name]
          properties:
            model_name: { type: string }
            model_project_id:
              type: integer
              description: The project the model belongs to, when it is shared from another project.
            stream: { type: boolean }
          additionalProperties: true

    ApplicationTurnStarted:
      type: object
      required: [task_id, execution_id, command_id, response_message_id, events_url, created]
      properties:
        task_id: { type: string }
        execution_id: { type: string }
        command_id: { type: string }
        response_message_id: { type: string }
        events_url:
          type: string
          description: Same-origin absolute path, `/api/v2/executions/{project_id}/{execution_id}/events`.
        created:
          type: boolean
          description: False when an identical earlier send was replayed.

    TurnStartError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        retryable: { type: boolean }

    Notification:
      type: object
      required: [id, uuid, is_seen, project_id, user_id, created_at, event_type]
      properties:
        id: { type: integer }
        uuid: { type: string }
        is_seen: { type: boolean }
        project_id: { type: integer }
        user_id: { type: integer }
        meta:
          nullable: true
          description: Event-specific JSON value.
        created_at: { type: string }
        updated_at: { type: string, nullable: true }
        event_type: { type: string }

    NotificationPage:
      type: object
      description: With `changes_since`, `total` counts all of the caller's notifications and the delta fields are added.
      required: [total]
      properties:
        total: { type: integer }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        tombstones:
          type: array
          description: Delta mode only. Notifications deleted since the cursor.
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          type: string
          description: Delta mode only. See ConversationListing.next_cursor.
        has_more:
          type: boolean
          description: Delta mode only. See ConversationListing.has_more.

    NotificationSeenUpdate:
      type: object
      required: [ids, is_seen]
      properties:
        ids:
          description: Notification ids, or the string `all`.
          oneOf:
            - type: array
              items: { type: integer }
            - type: string
              enum: [all]
        is_seen: { type: boolean }

    NotificationSeenUpdated:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }

    DiscoveryDocument:
      type: object
      description: >-
        What a deployment tells a client before sign-in. A key is never
        renamed or removed within one client_contract major version.
      required: [server_version, client_contract, deployment_kind, display_name, brand_pack_url, native_auth, client_policy, min_client_version]
      properties:
        server_version:
          type: string
          description: '`major.minor`, or `dev` for an unversioned build.'
        client_contract:
          type: string
          description: Client contract version, `major.minor`.
        deployment_kind:
          type: string
          enum: [saas, self_hosted]
        display_name:
          type: string
          description: Product name from the deployment's brand pack.
        brand_pack_url:
          type: string
          description: Absolute URL of the brand pack JSON, content-addressed with `?v=`.
        native_auth:
          nullable: true
          description: Null while the deployment has no registered native client.
          allOf:
            - $ref: '#/components/schemas/NativeAuthEndpoints'
        client_policy:
          $ref: '#/components/schemas/ClientPublicPolicy'
        min_client_version:
          type: object
          description: Client id to its effective minimum version; a client without an entry falls back to client_policy.min_client_version.
          additionalProperties: { type: string }
    NativeAuthEndpoints:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, revocation_endpoint, code_challenge_methods_supported]
      properties:
        issuer:
          type: string
          description: The deployment origin; equals the `iss` parameter of an authorization response.
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        revocation_endpoint: { type: string }
        code_challenge_methods_supported:
          type: array
          items: { type: string }
    ClientPublicPolicy:
      type: object
      description: The part of the native client policy published before sign-in.
      required: [require_device_lock, offline_enabled, min_client_version]
      properties:
        require_device_lock: { type: boolean }
        offline_enabled: { type: boolean }
        min_client_version:
          type: string
          description: Deployment-wide minimum client version; empty for none.
    NativeTokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        client_id: { type: string }
        code: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string, description: PKCE verifier, 43 to 128 unreserved characters. }
        refresh_token: { type: string }
        client_version: { type: string, description: Recorded on the device (refresh grant). }
    NativeTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_token_expires_in, device_id]
      properties:
        access_token: { type: string, description: Opaque bearer token. }
        token_type: { type: string, description: Bearer. }
        expires_in: { type: integer, format: int64, description: Seconds until the access token expires. }
        refresh_token: { type: string, description: Opaque; rotated on every use. }
        refresh_token_expires_in: { type: integer, format: int64, description: Idle seconds before the device must sign in again. }
        device_id: { type: string, description: The device session id. }
        client_policy:
          description: Present on every 200 unless the server could not read its policy; the client then keeps the last one.
          allOf:
            - $ref: '#/components/schemas/NativeClientPolicy'
    NativeClientPolicy:
      type: object
      required: [require_device_lock, idle_lock_seconds, allow_screenshots, offline_retention_days, offline_max_mb, offline_attachments, min_client_version]
      properties:
        require_device_lock: { type: boolean }
        idle_lock_seconds:
          type: integer
          format: int64
          description: Seconds in the background before the app locks again; 0 means it never relocks on resume. 0 to 86400.
        allow_screenshots: { type: boolean }
        offline_retention_days: { type: integer, format: int64, description: 0 disables offline storage. }
        offline_max_mb: { type: integer, format: int64 }
        offline_attachments: { type: boolean }
        min_client_version: { type: string, description: Effective minimum for this client; empty for none. }
    NativeOAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }
    DeviceRevokedError:
      type: object
      description: Flat (error is a string), unlike the nested API error envelope.
      required: [error]
      properties:
        error: { type: string, enum: [device_revoked] }
        error_description: { type: string }
    ClientUpgradeRequiredError:
      type: object
      required: [error, min_client_version]
      properties:
        error: { type: string, enum: [client_upgrade_required] }
        error_description: { type: string }
        min_client_version: { type: string }
    NativeRevokeRequest:
      type: object
      required: [token, client_id]
      properties:
        token: { type: string }
        token_type_hint: { type: string }
        client_id: { type: string }
