[package]
name = "elitea-desktop"
version = "0.1.0"
description = "The desktop client: a Tauri host around the elitea-web desktop build (ADR-0029)"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# The host and its browser drivers share one lock: browser-driver-dom (the
# safe webview driver core, macOS and Linux), and the two crates allowed
# the FFI this crate forbids for itself, browser-driver-macos (WebKit) and
# browser-driver-windows (WebView2 COM). `cargo test` here tests the host
# only; CI tests the drivers with `-p`.
[workspace]
members = [".", "browser-driver-dom", "browser-driver-linux", "browser-driver-macos", "browser-driver-windows"]

[lib]
name = "elitea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable`: `Window::add_child`, the browser pane's child webview
# (src/browser_pane.rs, ADR-0048). With it the main window's own webview is
# a child of its window too, so the window is no longer a `WebviewWindow`
# once a browser pane is open: the host reaches it by label
# (`window::main_window`, `window::main_webview`), never through
# `get_webview_window("main")`.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
sha2 = "0.11"
# The per-turn keyed digest of typed text (computer use, ADR-0047 decision 9).
hmac = "0.13.0"
base64 = "0.23"
bytes = "1"
percent-encoding = "2"
rand = "0.10"
# `io-std`: the ACP agent mode's stdio transport (src/acp).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
# The one HTTP client (src/net.rs): host calls and the webview's fetch share its pool.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
# The cloud browser view's WebSocket (src/view_socket.rs): the framing only.
# The upgrade itself goes through reqwest (its TLS and roots), so no TLS or
# connect feature. Already in the platform's locks (elitea-worker-rust).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tauri-plugin-dialog = "2"
# Turn notifications when the window is not focused (src/attention.rs);
# Rust-side only, no webview permission is granted.
tauri-plugin-notification = "2"
async-trait = "0.1.92"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
similar = { version = "3", default-features = false, features = ["text"] }
shlex = "2"
# The D0 local agent turn (ADR-0029, src/d0): the shared runtime's host
# interface and instruction authority, the local tool family, and the /llm
# caller contract. Nothing linked here may turn on serde_json
# `preserve_order` (decision 2; the `serde_json_preserve_order_is_off` test
# asserts it), so model-client, adk-gateway and the other crates that do are
# left out. engine-core and code-parsers ARE linked, through local-index
# below: that is safe because they no longer turn `preserve_order` (or
# `float_roundtrip`) on in their normal dependencies, only in their
# dev-dependencies and in each engine binary's own manifest. CI guards it
# (ci-deepwiki-engine.yml, "Engine core and code parsers — normal build
# without preserve_order": a `cargo tree` of their normal features).
elitea-agent-runtime = { path = "../../../libs/rust/agent-runtime" }
# `handoff`: the desktop ⇄ cloud handoff (ADR-0034, src/handoff.rs).
elitea-local-tools = { path = "../../../libs/rust/local-tools", features = ["handoff"] }
# The workspace store client of the handoff and its REST transport, on
# the app's one reqwest 0.12 client. serde_json default features only.
elitea-workspace-store = { path = "../../../libs/rust/workspace-store", features = ["rest"] }
# The local workspace index (decision 7): the folder source, its owner-only
# SQLite store and the index tools. It brings engine-core, code-parsers and
# inventory-core, all order-free in their normal builds (see above).
elitea-local-index = { path = "../../../libs/rust/local-index" }
# Embeddings for the local index, off by default: the pinned model
# catalogue, the owner-only model cache with verified resumable downloads,
# and candle running the chosen model (Metal on Apple silicon).
elitea-local-embed = { path = "../../../libs/rust/local-embed", features = ["candle", "download"] }
elitea-llm-wire = { path = "../../../libs/rust/llm-wire" }
# The browser pane's navigation guard judges an address literal as the
# agent's web fetch does (src/browser_pane.rs, ADR-0048 decision 2).
elitea-egress-guard = { path = "../../../libs/rust/egress-guard" }
# The browser tool contract (ADR-0048 decision 3): the toolset the agent
# drives the pane with (src/browser_tools.rs). No engine, no runtime.
elitea-browser-tools = { path = "../../../libs/rust/browser-tools" }
# Desktop computer use (ADR-0047): the driver the `computer` toolset
# (src/computer_tools.rs) operates the person's other apps through.
elitea-desktop-control = { path = "../../../libs/rust/desktop-control" }
# Tilde, like the runtime: adk breaks its API between minors. adk-agent and
# adk-runner are PATCHED (below); the runtime refuses to compile without it.
adk-agent = { version = "~2.3.0", default-features = false }
adk-core = { version = "~2.3.0", default-features = false }
# The in-memory checkpointer of `sessions::DesktopStateStore` (until pipelines run locally); the runtime links the same crate.
adk-graph = { version = "~2.3.0", default-features = false }
adk-runner = { version = "~2.3.0", default-features = false, features = ["context-compaction"] }
adk-session = { version = "~2.3.0", default-features = false }
adk-tool = { version = "~2.3.0", default-features = false }
tauri-plugin-log = "2"
log = "0.4"
# The local thread history (src/history.rs). `bundled`: the SQLite the app
# ships with, not whatever the OS has; the same libsqlite3-sys line sqlx
# already pins in libs/rust.
rusqlite = { version = "0.32", features = ["bundled"] }
# The app's directories in ACP agent mode (src/acp), resolved as Tauri's
# path resolver does without starting Tauri. Already in the tree through
# tauri (MIT OR Apache-2.0).
dirs = "=7.0.0"
# The browser pane's download names drop Unicode format characters
# (general category Cf: bidi overrides, zero-width marks). Already in the
# tree through elitea-agent-runtime (Apache-2.0).
unicode-general-category = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
# Window size, position and maximized state across launches (src/window.rs).
tauri-plugin-window-state = "2"
# The OS power assertion while a local turn runs (src/keep_awake.rs,
# ADR-0045 decision 7): IOPMAssertion on macOS, SetThreadExecutionState on
# Windows, a logind inhibitor on Linux. Its own deps (objc2-io-kit,
# windows, zbus, derive_builder) are already in the tree; it keeps the
# FFI `unsafe` out of this crate.
keepawake = { version = "=0.6.1", default-features = false }

# The app's own preferences domain (src/window.rs: the input-source
# indicator). Already in the tree through tauri/tao; safe bindings only.
[target.'cfg(target_os = "macos")'.dependencies]
# The pane's WKWebView driver (ADR-0048 decision 6): its scripts in a
# private WKContentWorld, CGEvent trusted input. Its own crate because it is
# FFI, which this crate forbids.
elitea-browser-driver-macos = { path = "browser-driver-macos", features = ["tauri"] }
# `NSProcessInfo`: the macOS version, which picks the browser pane's data
# store (src/browser_pane.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSProcessInfo"] }
# The origin of a browser pane download (`com.apple.metadata:kMDItemWhereFroms`,
# a binary plist). Already in the tree through tauri-codegen (MIT); `Value`
# only, no serde.
plist = { version = "1.10", default-features = false }

# The pane's Windows driver (ADR-0048 decision 6, #1593): the cloud
# browser's CDP driver (elitea-browser-session, the #1594 mapping) over
# WebView2's own CDP, which browser-driver-windows (COM FFI, its own crate
# because this one forbids `unsafe`) turns into a CDP stream. The dom crate
# gives the input reporter and its matcher.
[target.'cfg(windows)'.dependencies]
elitea-browser-driver-windows = { path = "browser-driver-windows" }
elitea-browser-driver-dom = { path = "browser-driver-dom" }
elitea-browser-session = { path = "../../../libs/rust/browser-session" }
# The toast AUMID of the MSIX build (src/aumid.rs, #1828): the package
# identity through WinRT (safe projections), and the toast the notification
# plugin shows, under that id. Both lines are already in the tree through
# tauri-plugin-notification.
windows = { version = "0.62.2", features = ["ApplicationModel"] }
tauri-winrt-notification = "0.8.1"

# The pane's Linux driver (ADR-0048 decision 6, #1593): the shared page
# script and WebDriver over WebKitGTK, in browser-driver-linux (safe Rust,
# its own crate so its WebKitGTK run can own `main`).
[target.'cfg(target_os = "linux")'.dependencies]
elitea-browser-driver-linux = { path = "browser-driver-linux", features = ["tauri"] }

# The credentials file's owner check (geteuid) and O_NOFOLLOW, without
# `unsafe` (src/credentials_file.rs). Already in the tree through tauri.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
# Paused time: the approval waits (30 and 15 minutes) are tested without waiting.
tokio = { version = "1", features = ["test-util"] }
# The opener plugin's own matcher, so the capability's URL globs are tested as the plugin reads them.
glob = "0.3"
# The browser pane's content-rule patterns (WebKit's regex subset) are
# checked against sample URLs. Already in the tree.
regex = "1"

# The runtime's patched-adk guard (libs/rust/agent-runtime/src/lib.rs) needs
# the same patches every workspace that links it applies
# (libs/rust/vendor/README.md).
[patch.crates-io]
adk-agent = { path = "../../../libs/rust/vendor/adk-agent" }
adk-runner = { path = "../../../libs/rust/vendor/adk-runner" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
