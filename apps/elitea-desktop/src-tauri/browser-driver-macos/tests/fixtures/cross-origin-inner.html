<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget</title>
</head>
<body>
  <label for="code">Coupon</label>
  <input id="code">
  <button id="apply" onclick="document.getElementById('out').textContent = 'Applied ' + document.getElementById('code').value">Apply</button>
  <p id="out">Not applied</p>
</body>
</html>
