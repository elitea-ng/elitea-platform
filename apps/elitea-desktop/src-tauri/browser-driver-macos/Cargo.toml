[package]
name = "elitea-browser-driver-macos"
version = "0.1.0"
description = "The desktop browser pane's macOS driver (ADR-0048 decisions 5 and 6): the browser tool contract over WKWebView, with its scripts in a private WKContentWorld."
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# A crate of its own because the WebKit, AppKit and CoreGraphics calls are
# FFI (`unsafe`), which the desktop host forbids for itself
# (`unsafe_code = "forbid"`). One of the TWO first-party crates allowed
# `unsafe` (owner decisions on #1634 and #1593, recorded in the repo-root
# AGENTS.md): `unsafe_code = "deny"`, each unsafe fn or block opted in with
# `#[allow(unsafe_code)]` and explained by a `// SAFETY:` comment, and only
# safe functions exported. Everything that is not FFI (the page script, the
# snapshot reader, the reply parser, `WebDriver`) is the safe crate
# elitea-browser-driver-dom, shared with the Linux driver.

[features]
default = []
# `attach`: a Tauri child webview's WKWebView (the desktop host).
tauri = ["dep:tauri"]

[dependencies]
elitea-browser-driver-dom = { path = "../browser-driver-dom" }
elitea-browser-tools = { path = "../../../../libs/rust/browser-tools" }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sync` and `time`: the main thread answers on a oneshot; waits poll.
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }

# Every one of these is already in the desktop's tree through tauri, tao
# and wry (same versions); this crate turns on the features it calls.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData", "NSValue", "NSError", "NSGeometry", "NSURL", "NSURLRequest", "NSArray", "NSObject", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSWindow", "NSScreen", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKContentWorld", "WKFrameInfo", "WKUserScript", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKSnapshotConfiguration", "WKNavigation", "WKSecurityOrigin", "WKContentRuleList", "WKContentRuleListStore"] }
libc = "0.2"
tauri = { version = "2.12", default-features = false, features = ["wry"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFRunLoop", "CFString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebsiteDataStore"] }

# The WebKit conformance and isolation runs: they need the main thread for
# AppKit's run loop, so they own `main` (no libtest harness). Ignored unless
# asked for with `-- --ignored` (README in tests/webkit.rs).
[[test]]
name = "webkit"
harness = false

[lints.rust]
# Not `forbid` (every other first-party crate): FFI here is opted in per
# item with `#[allow(unsafe_code)]` and a `// SAFETY:` comment (AGENTS.md).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
