[package]
name = "elitea-doc-extract-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "The desktop app's document extractor: PDF and Office bytes on stdin, page-by-page text as JSON on stdout, one request per process (ADR-0029 decision 4)."

# Its OWN workspace and lockfile, deliberately. The extractor (xberg) turns on
# serde_json `preserve_order`, which ADR-0029 decision 2 keeps out of the
# desktop host's link; a separate binary keeps it out, and puts the parsing of
# untrusted files in a process the host can sandbox and kill. Not a member of
# apps/elitea-desktop/src-tauri, which must never enable `documents` on
# elitea-doc-extract or elitea-local-tools.
[workspace]

[dependencies]
# The extractor with the formats behind `documents` (xberg: PDF, Office,
# spreadsheets, e-mail, e-books). No `html`: HTML is text to the host.
elitea-doc-extract = { path = "../../../libs/rust/doc-extract", features = ["documents"] }
# The answer. Plain serde: key order does not matter to the host.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Linux address-space limit (`setrlimit`), without `unsafe`. Already in
# the lock through xberg's dependencies.
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = "s"
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false

# Zip 9 security fix (../../../libs/rust/vendor/README.md). `xberg` pulls
# `calamine` 0.36.1, which requires zip 8 and resolves zip 8.6.0. That version
# carries CVE-2026-115905, CVE-2026-115907, CVE-2026-115908 and
# CVE-2026-115909. The copy moves to zip 9.1.3. `xberg` requires
# `calamine ^0.36.1`, so the copy keeps version 0.36.2.
[patch.crates-io]
calamine = { path = "../../../libs/rust/vendor/calamine" }
