<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elitea — Maintenance</title>
    <link rel="icon" type="image/svg+xml" href="../../../public/brand/favicon.svg" />
    <!-- Brand pack, delivery channel C (ADR-0024 WP5): the same blocking tag
         the app shell carries, so a rebranded deployment's splash carries the
         brand too. When elitea-main itself is down the request fails and the
         page renders the compiled default — a failed classic script does not
         stop the document. -->
    <script src="/api/v2/branding/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <script>
      // Auto-reload: poll every 60s and reload if page is older than 120s
      (function () {
        const start = Date.now();
        const interval = setInterval(() => {
          if (Date.now() - start > 120_000) {
            clearInterval(interval);
            window.location.reload();
          }
        }, 60_000);
      })();
    </script>
  </body>
</html>
