<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elitea AI Docs</title>
    <meta name="description" content="Elitea AI documentation: guides and reference for the Elitea AI platform." />
    <!-- Favicon: the generated LE-03 icon in public/brand/. This entry has
         no publicDir (vite.config.ts), so Vite treats the relative href as a
         normal asset: it emits or inlines the file and writes the URL under
         the build base (/docs/ or DOCS_BASE). -->
    <link rel="icon" type="image/svg+xml" href="../../../public/brand/favicon.svg" />
    <!-- Browser chrome colour: Paper (light) and Ink (dark) canvas tokens. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B18" />
    <!-- First-paint theme (mirrors the main app's anti-flash script in
         apps/elitea-web/index.html, and the same 'system' -> matchMedia
         fallback): 'data-docs-theme' is what styles.css keys its palette
         off, and Mermaid.tsx reads it directly from the DOM. -->
    <script>
      {
        let mode = null;
        try {
          const stored = localStorage.getItem('docs-theme');
          if (stored === 'light' || stored === 'dark') mode = stored;
        } catch {
          // Storage unavailable: fall through to `prefers-color-scheme`
          // (styles.css's @media block), which needs no attribute at all.
        }
        if (mode !== null) {
          document.documentElement.setAttribute('data-docs-theme', mode);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
