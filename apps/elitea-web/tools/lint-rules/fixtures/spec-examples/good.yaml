# check-spec-examples GREEN: every example satisfies its schema.
openapi: "3.0.3"
info: { title: fixture, version: "1" }
paths:
  /users/{id}:
    get:
      operationId: getUser
      responses:
        '200':
          description: One user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: 1, name: Ada, team: null }
components:
  schemas:
    User:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Ada }
        team: { type: string, nullable: true }
