<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elitea</title>
    <!-- Default favicon: the compiled brand mark, `./`-relative like config.js
         (contract C4); nginx resolves it from any depth (spa.conf brand alias).
         `app/providers/BrandDocumentHead.tsx` swaps the href at runtime when
         the served pack states a custom `assets.favicon`. -->
    <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg" />
    <!-- First-paint colour scheme (ADR-0024 WP3; spec §4.2). MUI's
         InitColorSchemeScript never emits under createRoot (see
         BrandThemeProvider.tsx), so this static inline script is the ONE real
         anti-flash mechanism. The body is the same as
         src/entries/admin/public/assets/scheme-init.js; the admin entry loads
         it as a file because its CSP hash-pins one inline script; nginx pins
         THIS script by hash in nginx/security-headers.conf, so editing it means
         re-hashing it there. src/app/schemeInit.test.ts pins the two bodies
         equal. -->
    <script>
      {
        let mode = "dark";
        try {
          const stored = localStorage.getItem("el-mode");
          if (stored === "light" || stored === "dark") {
            mode = stored;
          } else if (stored === "system") {
            mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        } catch {
          // Storage or matchMedia unavailable: keep the default.
        }
        document.documentElement.setAttribute("data-el-scheme", mode);
      }
    </script>
    <style>
      /* Skeleton-only system font stack; brand-pack fonts are self-hosted by T1/S1 (§3.7). */
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
    <!-- Runtime config (contract C5): nginx serves /app/config.js from the container;
         the relative src survives deep links via the depth-tolerant alias (contract C8). -->
    <script src="./config.js" vite-ignore></script>
    <!-- Brand pack, delivery channel C (spec §4.3): elitea-main serves
         `window.elitea_brand = {...};` at this exact path, PUBLIC and
         unauthenticated on purpose ("The UI loads branding before a browser
         session exists", internal/api/router.go). Root-absolute, not
         `./`-relative like config.js above: this one is an API route, not a
         file the SPA container serves, so the depth-tolerant nginx alias
         (contract C8) does not and should not apply to it.

         Blocking, and NOT `defer`/`type="module"`: `shared/brand/channelC.ts`
         reads the global while the provider tree mounts, so it has to be set
         before the bundle below evaluates. A failure to load is a handled
         outcome, not a break — the app falls back to the compiled-in default
         pack (channel A). Without this tag the served pack was unreachable
         and channel C was server-only (issue #136 C). -->
    <script src="/api/v2/branding/bootstrap.js" vite-ignore></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
