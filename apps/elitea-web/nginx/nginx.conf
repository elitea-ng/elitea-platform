# Main nginx config for the elitea-web image (#2954). It replaces the stock
# /etc/nginx/nginx.conf so the server runs as the unprivileged `nginx` user
# (uid 101) on a read-only root filesystem:
#   - no `user` directive: the image's USER is already unprivileged;
#   - the pid file and every temp path live under /tmp, the one writable
#     directory (an emptyDir in the chart);
#   - spa.conf listens on 8080, so no capability is needed to bind.
# Everything else is what the stock file sets.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
