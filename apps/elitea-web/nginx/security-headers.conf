# Response hardening for every elitea-web location.
#
# WHY A SEPARATE FILE. nginx `add_header` does not merge across levels: a
# `location` that declares one `add_header` of its own drops EVERY inherited
# `add_header` from the enclosing `server`. All five locations in spa.conf set a
# Cache-Control header, so a server-level block would reach none of them. This
# file is included by each location instead, so the set cannot drift apart.
#
# WHAT THIS FIXES. The SPA shell held the session cookie and ran all of the
# application JavaScript with no security headers at all, while the login pages
# that elitea-main serves carried a full Content-Security-Policy. Measured on a
# live deployment: `curl -I https://<host>/app/` returned only accept-ranges,
# cache-control, content-type, date, etag, last-modified and server.
#
# THE POLICY. Every directive below was derived from what the built app does,
# not from a template; `src/app/securityHeadersConf.test.ts` pins
# each one and fails when an inline script changes without its hash here.
#
#   default-src 'self'      anything not named below is same-origin only.
#   script-src              'self' plus the sha256 of each INLINE script the
#                           nginx-served HTML carries: the first-paint colour
#                           scheme script in index.html (/app/) and the
#                           first-paint theme script in
#                           src/entries/docs/index.html (/docs/). There are no
#                           others. NO 'unsafe-inline', NO 'unsafe-eval': the
#                           production bundles contain no eval/new Function
#                           and no WebAssembly. A hash is over the exact bytes
#                           between the tags, so editing either script means
#                           re-hashing it here; the test above computes both
#                           from the source files (and from dist/ when a build
#                           exists) and fails until they match.
#                           A worklet module is governed by script-src, so the
#                           microphone AudioWorklet is a same-origin file
#                           (audioChunkProcessor.worklet.js, a Vite
#                           `?url&no-inline` asset), never a blob: or data: URL.
#   style-src               'unsafe-inline' is required and is for styles only:
#                           Emotion (MUI) injects <style> elements at runtime
#                           and a static nginx config has no per-response nonce.
#   img-src                 same-origin avatars/icons, data: (brand logos are
#                           data URIs), blob: (decoded attachments), and https:
#                           because markdown in chat and agent output may embed
#                           an image from any host. Dropping https: would change
#                           what users see; narrow it if that trade is wanted.
#   font-src                brand-pack fonts are same-origin paths (refused
#                           otherwise by shared/brand/fontFaces.ts); data: for
#                           inlined font assets.
#   connect-src 'self'      the API (`vite_server_url`) is `/api/v2` in every
#                           shipped deployment (compose files and the Helm
#                           chart), and the socket client is a no-op unless
#                           `vite_socket_server` is set. A deployment that
#                           points either at ANOTHER origin must add that
#                           origin here, or the browser refuses the request.
#   media-src, worker-src   same-origin (+ blob:/data: for audio playback).
#                           The app starts no Worker; the microphone capture
#                           AudioWorklet is governed by script-src (see above).
#   frame-src 'none'        the app embeds no frame.
#   base-uri 'self'         stops an injected <base> from re-pointing every
#                           relative asset and API path.
#   object-src 'none'       removes the <object>/<embed> plugin surface.
#   frame-ancestors 'none'  blocks clickjacking of an authenticated session.
#   form-action 'self'      keeps a form POST on this origin.
#
# The admin console and the login pages are served by elitea-main with their
# own policy (services/elitea-main/internal/api/adminui); keep the two in step.
#
# CROSS-ORIGIN-OPENER-POLICY IS NOT HERE. It lives in `opener-isolation.conf`,
# because the two OAuth popup landing pages must not carry it. That file
# records the measurement.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-VPWLU+wMUzS9OQh7I/MqQ4p9NgIvxIH6LCvPbvLe+ZY=' 'sha256-LQKRktsRmjgF6YfJn6BauPZ2T8CcRaSFbfJNj1CKEHM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; worker-src 'self'; frame-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

# X-Frame-Options repeats frame-ancestors for user agents that do not implement
# CSP level 2. The two never disagree.
add_header X-Frame-Options "DENY" always;

# The SPA serves user-supplied artifact names and brand assets. nosniff stops a
# response typed text/plain from being executed as script.
add_header X-Content-Type-Options "nosniff" always;

# Application URLs carry conversation, project and toolkit identifiers in the
# query string. no-referrer keeps them out of third-party logs. The login pages
# elitea-main serves already set this value.
add_header Referrer-Policy "no-referrer" always;

# The voice features need the microphone, so microphone is deliberately absent
# from this list. The application asks for none of the capabilities below.
add_header Permissions-Policy "geolocation=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
