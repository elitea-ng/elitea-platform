# Response headers for the docs site at /docs/ in the web image
# (apps/elitea-web/nginx/spa.conf includes this from
# /etc/nginx/snippets/docs-security-headers.conf).
#
# The same policy as the app's security-headers.conf, with two differences:
#   script-src  lists the hashes of Starlight's inline scripts (theme, sidebar
#               and search bootstrap). scripts/check-dist.mjs computes them from
#               the build and fails when this list and the build differ; run it
#               with --write-csp to rewrite the list after a Starlight upgrade.
#               'wasm-unsafe-eval' admits WebAssembly compilation only, for
#               Pagefind's search index; it does not admit eval().
#   connect-src 'self' covers the Pagefind index fragments under /docs/pagefind/.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-7eCV4jtsr4t4knb3c4FCRPeu7GGZeOUGE3XvWix0XOQ=' 'sha256-GkZBRnvSuhtx/cvzvukVkX2JJZW+DdPlVr7BX8Tefqo=' 'sha256-MARsJFfxttyLZ2i9EDBZqmNpnW27sBwwPiF0Gj1oAfc=' 'sha256-VWo5Wp4aqSj6nSgMpeAp9cKieaoIfwFUAunAVugI5gA=' 'sha256-VgrgcKBvIM3XpiLJ6fEv1Vy6YHBwlKLkYtFdfBMouTo=' 'sha256-f/zAUE74ucc3JYp4r4QQvkJofoQdkOIhHYK+jeZ6eko=' 'sha256-hP48sUywTAXyg22qvpdOC/cYIA8MfPdKEbPC/mvGk4M=' 'sha256-nVO98WGdJA5yup1/MAdukGqUlS6Psuf7JJFF5ikWqbQ=' 'sha256-ucPfdYc9FPIvbmnn9ECv3eLKYLt8/heMPFQ+hNTn6jY=' 'sha256-wX2yOADeV+NMngflD5uYi3vl50SHC4sfM1EmylVjlX4=' 'sha256-xP4TLKzB6hcrCLQfQrTEg8qxfZ1b3HlE1OWO+7uZf1o='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
