# nginx config for the elitea-web SPA image (spec §7.1).
# Reproduces the five location blocks of the old inline conf
# (deploy/docker/Containerfile.elitea-ui:23-38) as a real, reviewable file
# (fixes defect D2), plus the D3 cache rules:
#   - index.html and config.js: Cache-Control no-store (a deploy must never
#     serve a stale shell against new hashed assets)
#   - /app/assets/*: public, max-age=31536000, immutable (hashed filenames)

server {
    listen 80;

    # Runtime config (contract C5) — written by docker-entrypoint.sh at start.
    location = /app/config.js {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets. No `always` on these add_header directives: the
    # immutable header must only ever attach to 2xx/3xx responses — an
    # immutable-cached 404 would poison shared caches for a year on a
    # deploy race.
    location /app/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/spa/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Depth-tolerant asset alias (contract C8): relative asset URLs requested
    # from a deep link, e.g. /app/agents/my/assets/index-abc123.js.
    location ~ ^/app/.+/assets/(.+)$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/spa/assets/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Depth-tolerant config.js alias (contracts C5/C8): the relative
    # ./config.js script tag resolved from a deep link.
    location ~ ^/app/.+/config\.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Depth-tolerant brand-asset alias (contract C8; ADR-0024 WP3): the
    # default pack's `./brand/*.svg` paths and index.html's `./brand/favicon.svg`
    # are `./`-relative like config.js, so a deep link asks for
    # /app/agents/my/brand/favicon.svg. Without this block that request fell
    # through to the SPA shell below and the tab icon was index.html.
    location ~ ^/app/.+/brand/(.+)$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/spa/brand/$1;
        add_header Cache-Control "no-store" always;
    }

    # The two OAuth popup landing pages, served WITHOUT
    # `opener-isolation.conf`. A popup reaches either one after a hop through
    # another origin, and a Cross-Origin-Opener-Policy on the response severs
    # the opener link. The popup then stays on screen, and
    # `shared/api/auth/popup.ts` reports a completed login as `popup_closed`.
    # `nginx/opener-isolation.conf` carries the measurement.
    #
    # `alias` to the shell file directly, not `try_files`: the fallback in the
    # block below re-enters that location, which would apply its headers.
    #
    # `default_type text/html` because nginx types a response from the REQUEST
    # URI, and neither path has an extension. Without it the answer is
    # `application/octet-stream`, which `nosniff` turns into a download.
    #
    # Exact matches, so the paths below are the ONLY two that lose the header.
    # Add a location here when you add a popup landing route; do not widen
    # either pattern.
    location = /app/auth-callback {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/spa/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location = /app/mcp-auth-callback {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/spa/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # SPA shell with history fallback (contract C9). Everything served here
    # (index.html above all) is no-store per D3; hashed assets never hit this
    # block — they are matched by the asset locations above.
    location /app/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/opener-isolation.conf;
        alias /usr/share/nginx/html/spa/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-store" always;
    }

    # Embedded docs SPA (embedded-docs programme decision 5). `vite build
    # --mode docs` (apps/elitea-web/vite.config.ts) emits hashed assets under
    # `assets/`, same convention as the main SPA above, so this repeats that
    # shape one level down: hashed assets get their own `location` with
    # `immutable`, ahead of the history-fallback block, so the fallback never
    # answers an asset request with the (no-store) shell.
    #
    # No opener-isolation.conf here: the docs SPA has no OAuth popup landing
    # page (it has no auth at all), so `opener-isolation.conf`'s
    # `same-origin-allow-popups` COOP value would be a needless weakening —
    # plain `security-headers.conf` is the full header set this location needs.
    location /docs/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/docs/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The docs shell, history-fallback routed exactly like /app/ above:
    # `index.html` (and `404.html`, only ever fetched by GitHub Pages, not by
    # this server) are no-store so a deploy never serves a stale shell
    # against new hashed assets; everything else under /docs/ falls back to
    # `index.html`, and the docs SPA's own router (src/entries/docs/router.ts)
    # reads the real requested path from `window.location` and renders that
    # page — the same client-side-routing contract `try_files` gives /app/.
    location /docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ /docs/index.html;
        add_header Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
