syntax = "proto3";

package elitea.core.v1;

option go_package = "elitea/core/v1;corev1";

// ToolkitUpdatedEvent is published (via the NATS event bus) when
// a toolkit's configuration or tool list has changed. elitea-indexer subscribes
// to invalidate its in-process toolkit cache.
message ToolkitUpdatedEvent {
  // toolkit_id is the unique identifier of the changed toolkit.
  string toolkit_id = 1;

  // project_id scopes the event to a tenant project.
  string project_id = 2;

  // updated_at is a Unix timestamp (seconds) of the change.
  int64 updated_at = 3;

  // UpdateType classifies what changed.
  enum UpdateType {
    UPDATE_TYPE_UNSPECIFIED = 0;
    UPDATE_TYPE_CONFIG = 1;   // Configuration parameters changed
    UPDATE_TYPE_TOOLS = 2;    // Tool list changed (add/remove/rename)
    UPDATE_TYPE_SECRETS = 3;  // Associated secrets rotated
  }

  UpdateType update_type = 4;
}

// ToolkitDeletedEvent is published when a toolkit is permanently removed.
// Subscribers should evict all cached state for this toolkit.
message ToolkitDeletedEvent {
  // toolkit_id is the unique identifier of the deleted toolkit.
  string toolkit_id = 1;

  // project_id scopes the event to a tenant project.
  string project_id = 2;

  // deleted_at is a Unix timestamp (seconds) of the deletion.
  int64 deleted_at = 3;
}
