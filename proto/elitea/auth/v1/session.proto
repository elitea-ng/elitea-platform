syntax = "proto3";

package elitea.auth.v1;

option go_package = "elitea/auth/v1;authv1";

// AuthContext is the resolved identity injected into downstream gRPC metadata
// after a successful Authorize call. Propagated as x-auth-* headers inside
// the service mesh.
message AuthContext {
  // user_id is the canonical platform user identifier (UUID).
  string user_id = 1;

  // email is the user's primary email address.
  string email = 2;

  // auth_type is the credential kind used in this request.
  string auth_type = 3;

  // project_id is the tenant project this context is scoped to.
  string project_id = 4;

  // roles holds the resolved role set for the user in this project.
  RoleSet roles = 5;

  // session_id is populated for session-based auth flows.
  string session_id = 6;
}

// RoleSet represents a user's resolved permission roles within a project.
message RoleSet {
  // role_names is the list of named roles (e.g. "admin", "engineer", "viewer").
  repeated string role_names = 1;

  // is_admin indicates whether the user has platform-wide admin privileges.
  bool is_admin = 2;

  // is_project_admin indicates project-level admin rights.
  bool is_project_admin = 3;
}

// SessionResolveRequest asks the auth service to hydrate an AuthContext from
// an opaque session reference (e.g., a server-side session key).
message SessionResolveRequest {
  // session_ref is the opaque session identifier from the cookie or session store.
  string session_ref = 1;

  // project_id scopes the resolution to a specific tenant project.
  string project_id = 2;
}

// SessionResolveResponse carries the fully hydrated AuthContext.
message SessionResolveResponse {
  AuthContext context = 1;

  // found is false when the session reference does not exist or has expired.
  bool found = 2;
}
