apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nats-bootstrap.fullname" . }}
  labels:
    {{- include "nats-bootstrap.labels" . | nindent 4 }}
  annotations:
    # Runs after NATS is up (post-install/upgrade); idempotent so re-runs on
    # every upgrade are safe. Deleted before the next hook so the Job name is
    # reusable across releases.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  # Bounded so a wedged Job (e.g. NATS never comes up) does not hang the release.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "nats-bootstrap.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: nats-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            # Connection and identity. bootstrap.sh builds the nats CLI's
            # --server/--tls*/--inbox-prefix flags from these, and refuses a
            # half-configured set.
            - name: NATS_URL
              value: {{ .Values.natsUrl | quote }}
            - name: NATS_TLS_CA_FILE
              value: "{{ .Values.tls.mountPath }}/ca.crt"
            - name: NATS_TLS_CERT_FILE
              value: "{{ .Values.tls.mountPath }}/tls.crt"
            - name: NATS_TLS_KEY_FILE
              value: "{{ .Values.tls.mountPath }}/tls.key"
            # The permission table lets this identity subscribe to its own
            # inbox prefix only.
            - name: NATS_INBOX_PREFIX
              value: "_INBOX_elitea-nats-bootstrap"
            - name: NATS_ARGS
              value: {{ .Values.extraNatsArgs | quote }}
            - name: NATS_REPLICAS
              value: {{ .Values.replicas | quote }}
            - name: NATS_ALERT_COOLDOWN
              value: {{ .Values.alertCooldown | quote }}
            - name: NATS_BUDGET_DUPE_WINDOW
              value: {{ .Values.budget.duplicateWindow | quote }}
            - name: NATS_RATELIMIT_MAX_AGE
              value: {{ .Values.rateLimit.maxAge | quote }}
            - name: NATS_DELTAS_DUPE_WINDOW
              value: {{ .Values.deltas.duplicateWindow | quote }}
            - name: NATS_DELTAS_MAX_AGE
              value: {{ .Values.deltas.maxAge | quote }}
            - name: NATS_DELTAS_MAX_BYTES
              value: {{ .Values.deltas.maxBytes | quote }}
            - name: NATS_DELTAS_MAX_MSGS
              value: {{ .Values.deltas.maxMsgs | quote }}
            - name: NATS_PRESENCE_TTL
              value: {{ .Values.presence.ttl | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: nats-client-tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "nats-bootstrap.fullname" . }}
            defaultMode: 0755
        # The bootstrap identity's certificate (templates/certificate.yaml).
        # The pod waits in ContainerCreating until cert-manager has written it.
        - name: nats-client-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
