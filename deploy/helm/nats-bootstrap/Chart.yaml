apiVersion: v2
name: nats-bootstrap
description: >-
  Hook Job that creates and reconciles every elitea JetStream asset
  (GATEWAY_BUDGET and GATEWAY_RATELIMIT counter streams, GATEWAY_BUDGET_DELTAS,
  GATEWAY_ALERT_COOLDOWN and ELITEA_CANVAS_PRESENCE KV buckets) at a replicas
  count matching the NATS profile. The only NATS identity allowed to
  administer streams (#1076); connects over mTLS with its own certificate.
type: application
version: 0.1.0
appVersion: "2.12.0"
