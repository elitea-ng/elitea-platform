# scale-1 profile (design §8.1.1): a single NATS node, JetStream file storage,
# KV buckets + stream created at replicas=1. HA is intentionally waived — no
# RAFT quorum. Valid and sufficient for a single-gateway-replica deployment.
#
# Pair with the gateway's LLM_BUDGET_EXPECTED_REPLICAS=1 and run the
# nats-bootstrap Job with --replicas=1 (its default).
#
# Values nest under `nats:` because the upstream chart is a dependency named
# `nats` (see Chart.yaml).
nats:
  config:
    # File-backed JetStream — the write-behind stream + KV working set must
    # survive a pod restart (design §8.1.1, §9.5 "File storage").
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 10Gi
      # In-memory store disabled: budget counters + write-behind deltas are
      # durable state, not ephemeral.
      memoryStore:
        enabled: false
    # Single node — no clustering, no RAFT. Adding a second node without
    # replicas>=3 buys no HA (see values-ha.yaml).
    cluster:
      enabled: false

  # NATS Server 2.12.0+ is REQUIRED for Nats-Incr (design §8.1.1). Pin it here
  # so a chart-default bump can never silently drop below 2.12.
  container:
    image:
      repository: nats
      tag: "2.12.0"
    merge:
      # A single-node JetStream store loses its un-persisted tail on restart;
      # give it a moment to flush and keep memory modest.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

  # Single replica — the StatefulSet runs one NATS pod.
  statefulSet:
    replicas: 1

  # Internal ClusterIP client service; the gateway + scheduler reach NATS here.
  service:
    enabled: true

  # NatsBox is a debug pod — keep it off in the coordination substrate.
  natsBox:
    enabled: false

  # Prometheus exporter for JetStream + connection metrics (consumer lag, KV op
  # errors surface here — design §9.5, §10).
  promExporter:
    enabled: true
    podMonitor:
      enabled: true
