# HA profile (design §8.1.1): 3 NATS nodes, JetStream file storage, KV buckets +
# stream created at replicas=3 so every write is RAFT-quorum-replicated and
# survives any single-node loss. A 1-replica store has no quorum, so multi-node
# HA REQUIRES replicas>=3 (odd count for quorum; use 5 for larger fault
# tolerance).
#
# HA operators MUST ALSO:
#   - set the gateway's LLM_BUDGET_EXPECTED_REPLICAS to the real gateway replica
#     count (NOT 1) — it bounds the degraded per-replica cap (design §8.5);
#   - run the nats-bootstrap Job with --replicas=3 so the KV buckets + stream
#     are themselves quorum-replicated (a replicas=1 asset on a 3-node cluster
#     still has no quorum).
#
# Values nest under `nats:` because the upstream chart is a dependency named
# `nats` (see Chart.yaml).
nats:
  config:
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 20Gi
      memoryStore:
        enabled: false
    # 3-node RAFT cluster — quorum survives any single-node failure. Use 5 for
    # higher fault tolerance (odd count only).
    cluster:
      enabled: true
      replicas: 3
      # Routes are TLS with mutual verification (#1076): each server presents
      # the server certificate (it carries `client auth` and a
      # *.<headless> SAN) and verifies its peer against the NATS CA. Without
      # this, every message crosses the cluster network in plaintext and any
      # pod that reaches 6222 could join as a route. templates/guards.yaml
      # refuses a clustered render without it.
      tls:
        enabled: true
        secretName: elitea-nats-server-tls
        merge:
          verify: true
          timeout: 3

  container:
    image:
      repository: nats
      tag: "2.12.0-alpine"
    merge:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi

  statefulSet:
    replicas: 3

  # Spread the quorum across nodes so a single node loss cannot take two
  # replicas (which would break quorum).
  podTemplate:
    topologySpreadConstraints:
      kubernetes.io/hostname:
        maxSkew: 1
        whenUnsatisfiable: DoNotSchedule

  service:
    enabled: true

  natsBox:
    enabled: false

  promExporter:
    enabled: true
    podMonitor:
      enabled: true
