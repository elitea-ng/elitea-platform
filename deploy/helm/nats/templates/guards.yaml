{{- /*
Render-time refusals (#1076). The chart has no "security off" switch, so a
values file that turns a piece of it off is a mistake, and an install that
renders anyway runs a NATS any pod can read and write. Each refusal names the
value and says why.
*/ -}}
{{- $n := .Values.nats -}}
{{- if not $n.config.nats.tls.enabled -}}
{{- fail "nats.config.nats.tls.enabled is false. This chart serves NATS to a cluster, where TLS with client certificates is the identity every client is authorised by (#1076). The plaintext posture is compose's (deploy/docker-compose.yml), not this chart's." -}}
{{- end -}}
{{- if not $n.config.nats.tls.secretName -}}
{{- fail "nats.config.nats.tls.secretName is empty; templates/server-certificate.yaml writes the server certificate into it and the server mounts it." -}}
{{- end -}}
{{- if ne (toString (get ($n.config.nats.tls.merge | default dict) "verify_and_map")) "true" -}}
{{- fail "nats.config.nats.tls.merge.verify_and_map must be true: it is what maps a client certificate's URI SAN to a user in the permission table. Without it every client is anonymous." -}}
{{- end -}}
{{- if not (and $n.tlsCA.enabled (eq $n.tlsCA.secretName $n.config.nats.tls.secretName)) -}}
{{- fail "nats.tlsCA must be enabled and name the server certificate's Secret (nats.config.nats.tls.secretName): its ca.crt is the NATS CA client certificates are verified against." -}}
{{- end -}}
{{- $merge := $n.config.merge | default dict -}}
{{- range $k := list "no_auth_user" "allow_non_tls" "authorization" -}}
{{- if hasKey $merge $k -}}
{{- fail (printf "nats.config.merge.%s is set. no_auth_user and allow_non_tls let a connection in without a mapped certificate, and a top-level authorization block puts users in the global account, outside the per-plane accounts that keep one plane's streams out of another's reach (#1076). Users belong in nats.config.merge.accounts.<MAIN|GATEWAY|RUNTIME>.users." $k) -}}
{{- end -}}
{{- end -}}
{{- /* The three planes, each its own account (#1076 F1). */ -}}
{{- $accounts := dict -}}
{{- range $k, $v := (get $merge "accounts" | default dict) -}}
{{- if $v }}{{ $_ := set $accounts $k $v }}{{ end -}}
{{- end -}}
{{- $want := list "GATEWAY" "MAIN" "RUNTIME" -}}
{{- if ne (keys $accounts | sortAlpha | join ",") ($want | join ",") -}}
{{- fail (printf "nats.config.merge.accounts must declare exactly MAIN, GATEWAY and RUNTIME, and declares [%s]. Each plane is its own account so that a consumer's deliver subject (which the server does not check against permissions) can only land inside its creator's own plane (#1076)." (keys $accounts | sortAlpha | join ", ")) -}}
{{- end -}}
{{- $seen := dict -}}
{{- range $acct := $want -}}
{{- $a := get $accounts $acct | default dict -}}
{{- if ne (toString (get $a "jetstream")) "enabled" -}}
{{- fail (printf "nats.config.merge.accounts.%s.jetstream must be \"enabled\": every plane keeps its streams in its own account's JetStream." $acct) -}}
{{- end -}}
{{- $users := get $a "users" | default list -}}
{{- $bootstrap := printf "/nats/elitea-nats-bootstrap-%s" (lower $acct) -}}
{{- $bootstraps := 0 -}}
{{- range $u := $users -}}
{{- $name := $u.user | toString -}}
{{- if not (hasPrefix "spiffe://" $name) -}}
{{- fail (printf "account %s user %q is not a URI SAN (spiffe://...). Users are certificate identities; a name or password user would be a second, unmanaged credential." $acct $name) -}}
{{- end -}}
{{- range $k := list "password" "nkey" "token" -}}
{{- if hasKey $u $k -}}
{{- fail (printf "account %s user %q carries a %s. Identity is the client certificate." $acct $name $k) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $seen $name -}}
{{- fail (printf "user %q is declared in accounts %s and %s. An identity belongs to exactly one plane." $name (get $seen $name) $acct) -}}
{{- end -}}
{{- $_ := set $seen $name $acct -}}
{{- $isBootstrap := hasSuffix $bootstrap $name -}}
{{- if $isBootstrap }}{{ $bootstraps = add1 $bootstraps }}{{ end -}}
{{- if and (contains "/nats/elitea-nats-bootstrap" $name) (not $isBootstrap) -}}
{{- fail (printf "user %q is a bootstrap identity in account %s, whose bootstrap is ...%s. Each account's assets are administered by that account's own bootstrap only." $name $acct $bootstrap) -}}
{{- end -}}
{{- $sub := (($u.permissions | default dict).subscribe | default dict).allow | default list -}}
{{- range $s := $sub -}}
{{- if or (eq $s ">") (hasPrefix "_INBOX." $s) (eq $s "_INBOX.>") (hasPrefix "$JS.API" $s) -}}
{{- fail (printf "user %q may subscribe to %q: every client subscribes to its own _INBOX_<identity> prefix only, so it cannot read another client's replies." $name $s) -}}
{{- end -}}
{{- end -}}
{{- $pub := (($u.permissions | default dict).publish | default dict).allow | default list -}}
{{- range $p := $pub -}}
{{- if or (eq $p ">") (eq $p "$JS.API.>") (eq $p "$JS.API.STREAM.>") (hasPrefix "$JS.API.STREAM.DELETE" $p) (hasPrefix "$JS.API.STREAM.PURGE" $p) (hasPrefix "$JS.API.STREAM.MSG.DELETE" $p) (hasPrefix "$JS.API.ACCOUNT.PURGE" $p) -}}
{{- fail (printf "user %q may publish %q. Nobody deletes or purges a stream, and no identity gets the whole JetStream API (#1076)." $name $p) -}}
{{- end -}}
{{- $watcher := and (hasSuffix "/nats/elitea-main" $name) (hasPrefix "$JS.API.CONSUMER.CREATE.KV_ELITEA_CANVAS_PRESENCE." $p) -}}
{{- if and (not $isBootstrap) (not $watcher) (or (hasPrefix "$JS.API.CONSUMER.CREATE" $p) (hasPrefix "$JS.API.CONSUMER.DURABLE.CREATE" $p) (eq $p "$JS.API.CONSUMER.>")) -}}
{{- fail (printf "user %q may publish %q. A consumer-create grant is also the right to point a push consumer's deliveries at any subject in the account (the server does not check a deliver subject against permissions), so only the account's bootstrap creates consumers; the one exception is elitea-main's presence watcher on its own bucket (#1076)." $name $p) -}}
{{- end -}}
{{- if and (not $isBootstrap) (or (hasPrefix "$JS.API.STREAM.CREATE" $p) (hasPrefix "$JS.API.STREAM.UPDATE" $p)) -}}
{{- fail (printf "user %q may publish %q. Only the account's bootstrap identity (...%s) creates or updates a stream (#1076)." $name $p $bootstrap) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if ne $bootstraps 1 -}}
{{- fail (printf "account %s must have exactly one bootstrap user (spiffe://<trust domain>%s) and has %d: the bootstrap Job connects to each account as that account's own identity." $acct $bootstrap $bootstraps) -}}
{{- end -}}
{{- end -}}
{{- /* The one cross-account flow: GATEWAY's soft alerts, exported to MAIN only. */ -}}
{{- $alerts := "gateway.events.project.*.events" -}}
{{- range $acct := list "MAIN" "RUNTIME" -}}
{{- if get (get $accounts $acct) "exports" -}}
{{- fail (printf "account %s exports subjects. The only export is GATEWAY's %s to MAIN; any other turns a plane boundary back into a shared subject space (#1076)." $acct $alerts) -}}
{{- end -}}
{{- end -}}
{{- range $acct := list "GATEWAY" "RUNTIME" -}}
{{- if get (get $accounts $acct) "imports" -}}
{{- fail (printf "account %s imports subjects. The only import is MAIN's of GATEWAY's %s (#1076)." $acct $alerts) -}}
{{- end -}}
{{- end -}}
{{- $exports := get (get $accounts "GATEWAY") "exports" | default list -}}
{{- range $e := $exports -}}
{{- if or (hasKey $e "service") (ne (toString (get $e "stream")) $alerts) (ne ((get $e "accounts") | default list | join ",") "MAIN") -}}
{{- fail (printf "GATEWAY export %v is not the soft-alert stream %s to accounts [MAIN]. A service export, another subject or an unrestricted export would let another plane reach the gateway's subjects (#1076)." $e $alerts) -}}
{{- end -}}
{{- end -}}
{{- $imports := get (get $accounts "MAIN") "imports" | default list -}}
{{- range $i := $imports -}}
{{- $st := get $i "stream" | default dict -}}
{{- if or (hasKey $i "service") (ne (toString (get $st "account")) "GATEWAY") (ne (toString (get $st "subject")) $alerts) (hasKey $st "to") (hasKey $i "to") -}}
{{- fail (printf "MAIN import %v is not GATEWAY's soft-alert stream %s, unmapped. Anything else widens what MAIN receives from another plane (#1076)." $i $alerts) -}}
{{- end -}}
{{- end -}}
{{- if dig "config" "cluster" "enabled" false $n -}}
{{- if not (dig "config" "cluster" "tls" "enabled" false $n) -}}
{{- fail "nats.config.cluster.enabled with cluster.tls.enabled false: the routes between servers would carry every message in plaintext. values-ha.yaml enables it." -}}
{{- end -}}
{{- /* The route identity (#1076 F5): its own Secret, verified against its own CA. */ -}}
{{- $rtls := dig "config" "cluster" "tls" dict $n -}}
{{- if or (not $rtls.secretName) (eq $rtls.secretName $n.config.nats.tls.secretName) -}}
{{- fail "nats.config.cluster.tls.secretName must name the ROUTE certificate's own Secret (values-ha.yaml: elitea-nats-route-tls), not the client-port certificate's. Routes have their own identity, from their own CA." -}}
{{- end -}}
{{- $rmerge := $rtls.merge | default dict -}}
{{- if ne (toString (get $rmerge "verify")) "true" -}}
{{- fail "nats.config.cluster.tls.merge.verify must be true: a route that does not verify its peer's certificate accepts any TLS client as a cluster peer." -}}
{{- end -}}
{{- if ne (toString (get $rmerge "ca_file")) "/etc/nats-certs/cluster/ca.crt" -}}
{{- fail "nats.config.cluster.tls.merge.ca_file must be /etc/nats-certs/cluster/ca.crt, the ROUTE CA cert-manager writes into the route certificate's Secret. Without it the upstream chart verifies routes against nats.tlsCA — the CLIENT CA — and any service's client certificate joins the cluster as a peer (#1076)." -}}
{{- end -}}
{{- if and (not .Values.security.ca.create) (eq .Values.security.routeIssuerRef.name .Values.security.issuerRef.name) -}}
{{- fail "security.routeIssuerRef names the same issuer as security.issuerRef. The route CA must be a different CA from the one that signs client identities, or a client certificate can join the cluster as a peer." -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.networkPolicy.enabled) (not .Values.networkPolicy.externallyManaged) -}}
{{- fail "networkPolicy.enabled is false. The ingress policy is the half of #1076 that keeps pods without a NATS identity off the port; mTLS alone still lets any pod hold a connection open to the TLS handshake. If your own policy already does this, say so with networkPolicy.externallyManaged=true." -}}
{{- end -}}
