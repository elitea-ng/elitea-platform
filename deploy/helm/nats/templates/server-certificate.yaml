{{- $svc := include "elitea-nats.serviceName" . -}}
{{- $headless := include "elitea-nats.headlessServiceName" . -}}
{{- $ns := include "elitea-nats.namespace" . -}}
# The NATS server certificate (#1076). The Secret it writes holds tls.crt,
# tls.key and ca.crt; values.yaml mounts it as the client-port certificate and
# as the CA clients are verified against. The upstream config reloader watches
# the mount, so a renewal is applied without a restart.
#
# `client auth` is in the usages because the HA profile's cluster routes are
# TLS with `verify`: each server presents this certificate to its peers.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "elitea-nats.fullname" . }}-server
  namespace: {{ $ns }}
  labels:
    {{- include "elitea-nats.labels" . | nindent 4 }}
spec:
  secretName: {{ dig "config" "nats" "tls" "secretName" "" .Values.nats | required "nats.config.nats.tls.secretName is required (values.yaml sets it)" }}
  duration: {{ .Values.security.serverCertificate.duration }}
  renewBefore: {{ .Values.security.serverCertificate.renewBefore }}
  isCA: false
  usages:
    - server auth
    - client auth
  commonName: {{ $svc }}
  dnsNames:
    # The client URL: tls://{{ $svc }}.{{ $ns }}.svc.cluster.local:4222
    - {{ $svc }}
    - {{ $svc }}.{{ $ns }}
    - {{ $svc }}.{{ $ns }}.svc
    - {{ $svc }}.{{ $ns }}.svc.cluster.local
    {{- if dig "config" "cluster" "enabled" false .Values.nats }}
    # Cluster routes dial each pod by its headless name.
    - "*.{{ $headless }}"
    - "*.{{ $headless }}.{{ $ns }}"
    - "*.{{ $headless }}.{{ $ns }}.svc"
    - "*.{{ $headless }}.{{ $ns }}.svc.cluster.local"
    {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    {{- include "elitea-nats.issuerRef" . | nindent 4 }}
