{{- if and .Values.alerts.enabled (dig "promExporter" "enabled" false .Values.nats) (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Alerts on the runtime command bus (docs/runtime-command-bus.md). Rendered
# only where the Prometheus Operator serves PrometheusRule; elsewhere the
# workers' ERROR log line `worker_command.dead_lettered` is the signal.
#
# The exporter sidecar runs with -jsz=all -prefix=nats, so every stream's
# message count is nats_stream_total_messages{stream_name=...}; a KV bucket
# is the stream KV_<bucket>.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "elitea-nats.fullname" . }}-command-bus
  namespace: {{ include "elitea-nats.namespace" . }}
  labels:
    {{- include "elitea-nats.labels" . | nindent 4 }}
spec:
  groups:
    - name: elitea-runtime-command-bus
      rules:
        # A worker could not verify or decode a command and recorded it in
        # ELITEA_RT_V1_DEADLETTER (then terminated it, or parked it with a
        # 24h nak). Nothing retries it into success: an operator reads the
        # record (route, stream sequence, reason) and decides.
        #
        # On NEW records, not on the bucket being non-empty: `nats kv del`
        # writes a delete marker that nats_stream_total_messages keeps
        # counting until the bucket's 7-day TTL, so "non-empty" kept firing
        # for a week after the operator had handled the record. Any write
        # moves the bucket's last sequence; an operator's delete moves it
        # once too, so the alert can echo for at most the window below.
        - alert: EliteaRuntimeCommandDeadLettered
          expr: max(increase(nats_stream_last_seq{stream_name="KV_ELITEA_RT_V1_DEADLETTER"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "A runtime command was dead-lettered in the last hour"
            description: "ELITEA_RT_V1_DEADLETTER took {{ "{{" }} $value {{ "}}" }} new write(s) in the last hour. `nats kv ls ELITEA_RT_V1_DEADLETTER` (as elitea-nats-bootstrap-worker) lists the current records; each key is <route>.<sha256(delivery_id)>. A worker that could not write a record logs worker_command.dead_letter_write_failed instead and retries on the next delivery."
        # A command stream near its MaxMsgs: dispatch is about to backpressure
        # (commands wait in the PostgreSQL outbox).
        - alert: EliteaRuntimeCommandStreamNearlyFull
          expr: max by (stream_name) (nats_stream_total_messages{stream_name=~"ELITEA_RT_V1_(VALIDATE|AGENT|INDEX)"}) > {{ .Values.alerts.streamFullMessages }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Runtime command stream {{ "{{" }} $labels.stream_name {{ "}}" }} is nearly full"
            description: "Live commands are near the stream's capacity; new dispatch backpressures into the outbox. Check the worker fleet and its consumer lag."
{{- end }}
