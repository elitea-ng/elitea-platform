{{- if .Values.scheduler.enabled }}
{{- if .Values.scheduler.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-scheduler.serviceAccountName" . }}
  labels:
    {{- include "elitea-scheduler.labels" . | nindent 4 }}
  {{- with .Values.scheduler.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "elitea.automountToken" .Values.scheduler.serviceAccount }}
{{- end }}
{{- end }}
