{{- if .Values.scheduler.enabled }}
{{- /*
  Shared connection addresses, computed once from the top-level `nats`
  block and namespace-relative by default. An explicit env entry
  under this component still wins. These are the settings that drifted when
  each chart carried its own default.
*/ -}}
{{- $env := .Values.scheduler.env | default dict }}
{{- if not (get $env "GATEWAY_NATS_URL") }}{{- $env = merge (deepCopy $env) (dict "GATEWAY_NATS_URL" (include "elitea.natsUrl" $)) }}{{- end }}
{{- /* The chart owns GATEWAY_NATS_TLS_* when it mounts the certificate (data below). */ -}}
{{- if .Values.nats.tls.enabled }}{{- $env = omit $env "GATEWAY_NATS_TLS_CA_FILE" "GATEWAY_NATS_TLS_CERT_FILE" "GATEWAY_NATS_TLS_KEY_FILE" }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-scheduler.fullname" . }}-config
  labels:
    {{- include "elitea-scheduler.labels" . | nindent 4 }}
data:
  # The WHOLE .Values.scheduler.env map is rendered (same reasoning as
  # templates/main/configmap.yaml): a fixed key list means an
  # operator cannot set an env var the chart author did not anticipate, and code
  # paths gated on such a var stay silently inert in every Helm deployment.
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.nats.tls.enabled }}
  # The scheduler's NATS identity (#1076), mounted by deployment.yaml.
  GATEWAY_NATS_TLS_CA_FILE: {{ include "elitea.natsClientFile" (dict "file" "ca.crt" "ctx" $) }}
  GATEWAY_NATS_TLS_CERT_FILE: {{ include "elitea.natsClientFile" (dict "file" "tls.crt" "ctx" $) }}
  GATEWAY_NATS_TLS_KEY_FILE: {{ include "elitea.natsClientFile" (dict "file" "tls.key" "ctx" $) }}
  {{- end }}
{{- end }}
