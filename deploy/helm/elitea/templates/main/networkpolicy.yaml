{{- if and .Values.main.enabled .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $worker := .Values.worker.enabled }}
{{- /* The providers reach elitea-main only over gRPC on the platform
       listener (#1359 U2/U5): their hosts' artifact calls and their engines'
       model, artifact and source-tool calls. No provider pod is admitted on
       8080. */ -}}
{{- $deepwikiPlatform := and .Values.main.runtime.enabled .Values.deepwiki.enabled }}
{{- $inventoryPlatform := and .Values.main.runtime.enabled .Values.inventory.enabled }}
{{- $runtimePeers := and .Values.main.runtime.enabled $worker }}
{{- $platformPeers := or $runtimePeers $deepwikiPlatform $inventoryPlatform }}
{{- $vectorPeers := and .Values.main.runtime.enabled .Values.vector.enabled }}
{{- $egressAuditPeers := and .Values.main.runtime.enabled (include "elitea-egress-proxy.auditEnabled" .) }}
{{- $httpPeers := or $np.main.ingressFrom $np.main.extraIngressFrom $np.probeFrom }}
{{- $metricsPeers := $np.main.metricsFrom }}
# Ingress to the elitea-main pods. Only the sources listed here may open a
# connection; every other in-cluster source is refused.
#
#   8080 (HTTP)  networkPolicies.main.ingressFrom / extraIngressFrom (the
#                gateway or ingress controller) and networkPolicies.probeFrom.
#                No provider pod: DeepWiki and Inventory reach elitea-main only
#                on the platform listener (#1359 U5).
#   runtime      the worker pods only, on the control / output / content
#                listeners, when the runtime plane is composed.
#   platform     the worker pods, DeepWiki and Inventory, on the platform
#                listener (#1359; it replaced platform-edge): gRPC only —
#                ModelService, ArtifactObjectService, InternalToolService.
#   control      elitea-vector, on the control listener only, for token
#                introspection (ADR-0031), when vector is enabled.
#   audit metrics networkPolicies.main.metricsFrom, on main.auditExport.metrics
#                .port only: the scraper of the SIEM audit export's /metrics.
#
# Kubelet probes are not subject to the policy on the CNIs this chart is tested
# with; networkPolicies.probeFrom is for those that apply it to them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elitea-main.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "elitea-main.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or $httpPeers $runtimePeers $platformPeers $vectorPeers $egressAuditPeers $metricsPeers }}
  ingress:
  {{- end }}
    {{- if $httpPeers }}
    - ports:
        - port: 8080
          protocol: TCP
      from:
        {{- with $np.main.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $np.main.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $np.probeFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    {{- end }}
    {{- if $runtimePeers }}
    - ports:
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.controlAddress }}
          protocol: TCP
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.outputAddress }}
          protocol: TCP
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.contentAddress }}
          protocol: TCP
      from:
        {{- include "elitea.netpol.workerPeer" . | nindent 8 }}
    {{- end }}
    {{- if and .Values.main.runtime.enabled $platformPeers }}
    - ports:
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.platformAddress }}
          protocol: TCP
      from:
        {{- if $runtimePeers }}
        {{- include "elitea.netpol.workerPeer" . | nindent 8 }}
        {{- end }}
        {{- if $deepwikiPlatform }}
        {{- include "elitea.netpol.providerPeer" (dict "ctx" . "provider" "deepwiki") | nindent 8 }}
        {{- end }}
        {{- if $inventoryPlatform }}
        {{- include "elitea.netpol.providerPeer" (dict "ctx" . "provider" "inventory") | nindent 8 }}
        {{- end }}
    {{- end }}
    {{- if $vectorPeers }}
    - ports:
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.controlAddress }}
          protocol: TCP
      from:
        {{- include "elitea.netpol.peer" (dict "ctx" . "labels" (include "elitea-vector.selectorLabels" .)) | nindent 8 }}
    {{- end }}
    {{- if $metricsPeers }}
    - ports:
        - port: {{ .Values.main.auditExport.metrics.port }}
          protocol: TCP
      from:
        {{- toYaml $metricsPeers | nindent 8 }}
    {{- end }}
    {{- if $egressAuditPeers }}
    # The egress proxy, on the control listener only, for its run summaries
    # (EgressAuditService, ADR-0034 decision 9).
    - ports:
        - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.controlAddress }}
          protocol: TCP
      from:
        {{- include "elitea.netpol.peer" (dict "ctx" . "labels" (include "elitea-egress-proxy.selectorLabels" .)) | nindent 8 }}
    {{- end }}
{{- end }}
