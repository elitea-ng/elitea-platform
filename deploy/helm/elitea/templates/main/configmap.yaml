{{- if .Values.main.enabled }}
{{- /*
  Shared connection addresses, computed once from the top-level `nats`
  block and namespace-relative by default. An explicit env entry under this
  component still wins. These are the settings that drifted when each chart
  carried its own default. The live-update plane dials the SAME effective NATS
  the gateway uses (elitea.eventsNatsUrl: an explicit
  llmGateway.env.GATEWAY_NATS_URL first, then the `nats` block), so one broker
  serves all three; nothing naming a NATS leaves it unset (no live-update
  plane). A main.secrets entry for it wins and nothing is rendered here.
*/ -}}
{{- include "elitea-main.validateEventsNats" . }}
{{- $env := .Values.main.env | default dict }}
{{- $eventsNatsUrl := include "elitea.eventsNatsUrl" . }}
{{- if and (not (get $env "ELITEA_EVENTS_NATS_URL")) (not (hasKey (.Values.main.secrets | default dict) "ELITEA_EVENTS_NATS_URL")) $eventsNatsUrl }}{{- $env = merge (deepCopy $env) (dict "ELITEA_EVENTS_NATS_URL" $eventsNatsUrl) }}{{- end }}
{{- if hasKey (.Values.main.secrets | default dict) "ELITEA_EVENTS_NATS_URL" }}{{- $env = omit $env "ELITEA_EVENTS_NATS_URL" }}{{- end }}
{{- /* The chart owns ELITEA_EVENTS_NATS_TLS_* when it mounts the certificate (data below). */ -}}
{{- $mainNatsTLS := and .Values.nats.tls.enabled (include "elitea-main.usesNats" .) }}
{{- if $mainNatsTLS }}{{- $env = omit $env "ELITEA_EVENTS_NATS_TLS_CA_FILE" "ELITEA_EVENTS_NATS_TLS_CERT_FILE" "ELITEA_EVENTS_NATS_TLS_KEY_FILE" }}{{- end }}
{{- /*
  The public project, from the ONE place an operator sets it. Filled only when
  something names a project: with the Configurations plane off, elitea-main
  refuses to start when this variable is PRESENT at all, so a chart that always
  wrote a value here would stop a default install. See elitea.aiProjectId.
*/ -}}
{{- /*
  The DeepWiki callback origin through platform-edge (ADR-0027), when
  deepwiki.callbackViaPlatformEdge fills it in; an explicit value wins.
*/ -}}
{{- $deepwikiCallback := include "elitea-deepwiki.callbackBaseUrl" . }}
{{- if and $deepwikiCallback (not (get $env "ELITEA_DEEPWIKI_CALLBACK_BASE_URL")) }}{{- $env = merge (deepCopy $env) (dict "ELITEA_DEEPWIKI_CALLBACK_BASE_URL" $deepwikiCallback) }}{{- end }}
{{- $aiProjectId := include "elitea.aiProjectId" . }}
{{- if and $aiProjectId (not (get $env "ELITEA_AI_PROJECT_ID")) }}{{- $env = merge (deepCopy $env) (dict "ELITEA_AI_PROJECT_ID" $aiProjectId) }}{{- end }}
{{- /*
  ELITEA_CONFIGURATIONS_ENABLED is DERIVED when the operator states nothing.
  values.yaml ships it empty, which means "follow this deployment": the plane
  comes on for an install that has authentication and a public project id, and
  stays off otherwise. A stated "true" or "false" always wins.

  The whole map is rendered verbatim below, so the derived value is merged in
  HERE rather than computed at the point of use. Every capability guard in
  _helpers.tpl reads the same helper, so the manifest and the guards cannot
  disagree about whether the plane is on.
*/ -}}
{{- $env = set (deepCopy $env) "ELITEA_CONFIGURATIONS_ENABLED" (include "elitea-main.configurationsEnabled" $) }}
{{- /*
  Which worker image this release runs, from the ONE place an operator states
  it. elitea-main serves a toolkit type as creatable only when the running
  worker can build it, and the two workers can build different sets: the Python
  image imports 39 of the 52 SDK toolkits and the native worker materializes 22
  families. Nothing else tells this process which one is deployed. This
  chart's default (python, #865/#866) now agrees with elitea-main's own
  built-in default, but an unstated value would still under-serve a release
  that overrides worker.implementation to rust without this template
  running — so the value is always written explicitly, never left implicit.

  An explicit env entry still wins, for the release that pins
  worker.image.repository directly and so does not follow worker.implementation.
*/ -}}
{{- if not (get $env "ELITEA_WORKER_IMPLEMENTATION") }}
{{- $env = merge (deepCopy $env) (dict "ELITEA_WORKER_IMPLEMENTATION" $.Values.worker.implementation) }}
{{- end }}
{{- /*
  ELITEA_INDEXING_RUNTIME (ADR-0030 decision 6, ADR-0031 V1) is stated the same
  way, from worker.indexingRuntime, so elitea-main never guesses which store its
  index routes read: the per-project pgvector index_meta rows (python) or the
  elitea_runtime.index_registry table (rust). An explicit env entry still wins.
*/ -}}
{{- if not (get $env "ELITEA_INDEXING_RUNTIME") }}
{{- $env = merge (deepCopy $env) (dict "ELITEA_INDEXING_RUNTIME" $.Values.worker.indexingRuntime) }}
{{- end }}
{{- /*
  The application engines' platform gRPC targets (#1243, #1244): where
  elitea-main deletes a project's (and a toolkit's) data in DeepWiki and
  Inventory. DERIVED from the engine's own values — <service name>:<platformGrpc
  port> — whenever the engine is rendered WITH its platform service on
  (platformGrpc.clients non-empty) and the matching facade is on here, because
  the three are one feature: an engine that serves the deletion with no caller
  configured keeps the data exactly as before. An explicit env entry wins, and
  one set beside a facade that is off is refused (elitea-main.validateDeepWiki /
  validateInventory), as cmd/elitea-main refuses it at boot.
*/ -}}
{{- $deepwikiTarget := include "elitea-deepwiki.platformGrpcTarget" . }}
{{- if and $deepwikiTarget (not (get $env "ELITEA_DEEPWIKI_PLATFORM_GRPC_TARGET")) (has (lower (get $env "ELITEA_DEEPWIKI_ENABLED" | toString)) (list "1" "true" "yes" "on")) }}
{{- $env = merge (deepCopy $env) (dict "ELITEA_DEEPWIKI_PLATFORM_GRPC_TARGET" $deepwikiTarget) }}
{{- end }}
{{- $inventoryTarget := include "elitea-inventory.platformGrpcTarget" . }}
{{- if and $inventoryTarget (not (get $env "ELITEA_INVENTORY_PLATFORM_GRPC_TARGET")) (has (lower (get $env "ELITEA_INVENTORY_ENABLED" | toString)) (list "1" "true" "yes" "on")) }}
{{- $env = merge (deepCopy $env) (dict "ELITEA_INVENTORY_PLATFORM_GRPC_TARGET" $inventoryTarget) }}
{{- end }}
{{- /*
  elitea-main's elitea-vector client (ADR-0031 decision 4): the target and the
  three file paths of the administrator certificate vector.mainClient issues
  and mounts, DERIVED whenever this chart's elitea-vector is on with
  mainClient enabled. An explicit env entry wins (an elitea-vector elsewhere,
  with fileConfig.vectorClientMaterial), and the mix of the two is refused by
  elitea-main.validateVectorClient.
*/ -}}
{{- if and (include "elitea-vector.mainClientEnabled" .) (not (get $env "ELITEA_VECTOR_GRPC_TARGET")) }}
{{- $mount := .Values.vector.mainClient.mountPath }}
{{- $env = merge (deepCopy $env) (dict
      "ELITEA_VECTOR_GRPC_TARGET" (include "elitea-vector.grpcTarget" .)
      "ELITEA_VECTOR_GRPC_CLIENT_CERT_FILE" (printf "%s/tls.crt" $mount)
      "ELITEA_VECTOR_GRPC_CLIENT_KEY_FILE" (printf "%s/tls.key" $mount)
      "ELITEA_VECTOR_GRPC_CA_FILE" (printf "%s/ca.crt" $mount)) }}
{{- end }}
{{- /*
  values.yaml ships the five entries (and the ELITEA_VECTOR_CLEANUP_ABANDON
  switch) empty so an operator sees them; an empty one is "unset" to
  elitea-main (vector_client_config.go) and is not rendered, so a deployment
  without a vector store carries no ELITEA_VECTOR_* at all.
*/ -}}
{{- range $key := list "ELITEA_VECTOR_GRPC_TARGET" "ELITEA_VECTOR_GRPC_CLIENT_CERT_FILE" "ELITEA_VECTOR_GRPC_CLIENT_KEY_FILE" "ELITEA_VECTOR_GRPC_CA_FILE" "ELITEA_VECTOR_GRPC_SERVER_NAME" "ELITEA_VECTOR_CLEANUP_ABANDON" }}
{{- if and (hasKey $env $key) (eq (get $env $key | toString) "") }}{{- $env = omit $env $key }}{{- end }}
{{- end }}
{{- /*
  ELITEA_INDEX_TYPES_ENABLED and ELITEA_APPLICATION_SKILLS_ENABLED are DERIVED
  the same way (issues #394 and #395). Each route is now the ONLY handler for
  its path — the prototype fallbacks in internal/api/router.go are deleted — so
  a shipped "false" is a 404 on a path the published contract declares, and a
  shipped "true" stops an install that has no authentication. Empty means
  "follow this deployment": on where the install authenticates, off otherwise.
*/ -}}
{{- $env = set (deepCopy $env) "ELITEA_INDEX_TYPES_ENABLED" (include "elitea-main.indexTypesEnabled" $) }}
{{- $env = set (deepCopy $env) "ELITEA_APPLICATION_SKILLS_ENABLED" (include "elitea-main.applicationSkillsEnabled" $) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-main.fullname" . }}-config
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
data:
  # Render the WHOLE .Values.main.env map (mirrors the `llmGateway:` block's
  # deployment.yaml `range`), instead of a fixed key list. A fixed list meant an
  # operator could not set any env var the chart author had not anticipated, so
  # code paths gated on such a var (e.g. the §2.6 SELF_REFERENTIAL_CREDENTIAL
  # guard, which reads ELITEA_SELF_LLM_ORIGINS / DEPLOYMENT_URL) were silently
  # inert in every Helm deployment. Every key previously rendered here is still
  # rendered — they are the defaults in values.yaml's `env` map.
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if $mainNatsTLS }}
  # The live-update plane's NATS identity (#1076), mounted by deployment.yaml.
  ELITEA_EVENTS_NATS_TLS_CA_FILE: {{ include "elitea.natsClientFile" (dict "file" "ca.crt" "ctx" $) }}
  ELITEA_EVENTS_NATS_TLS_CERT_FILE: {{ include "elitea.natsClientFile" (dict "file" "tls.crt" "ctx" $) }}
  ELITEA_EVENTS_NATS_TLS_KEY_FILE: {{ include "elitea.natsClientFile" (dict "file" "tls.key" "ctx" $) }}
  {{- end }}
  {{/*
    Capability prerequisites are checked HERE, and this ConfigMap always
    renders, so `helm template` runs every check on every values file (issue
    #382). Read elitea-main.validateCapabilities in _helpers.tpl for what each
    check protects and which Go source refuses the same thing at boot.
  */}}
  {{- include "elitea-main.validateCapabilities" . }}
  {{- with (include "elitea-main.runtimeEnv" .) }}
  # --- Runtime plane (issue #382) --------------------------------------------
  # All-or-nothing. internal/runtimecomposition/config.go requires this whole
  # set at once, so the chart writes all of it or none of it. The names come
  # from the runtime: block in values.yaml, never from the env map above.
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
