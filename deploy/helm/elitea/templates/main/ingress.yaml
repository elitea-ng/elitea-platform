{{- /*
  The browser edge: ONE `/` rule to elitea-main, as an HTTPRoute or an Ingress
  (#1359 P3). elitea-main itself redirects `/` to `/app/`, relays `/app…` and
  `/docs…` to elitea-web (ELITEA_WEB_UPSTREAM) and keeps the MCP server and its
  file servers under `/app`, so no rule names elitea-web and none needs a
  RegularExpression match.
*/ -}}
{{- if .Values.main.enabled }}
{{- if .Values.main.ingress.enabled }}
{{- if .Values.main.ingress.gatewayApi }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
  {{- with .Values.main.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.main.ingress.gateway.name }}
      {{- if .Values.main.ingress.gateway.namespace }}
      namespace: {{ .Values.main.ingress.gateway.namespace }}
      {{- end }}
      {{- if .Values.main.ingress.gateway.sectionName }}
      sectionName: {{ .Values.main.ingress.gateway.sectionName }}
      {{- end }}
  {{- with .Values.main.ingress.hosts }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            {{- /* main.ingress.pathType is the networking.k8s.io spelling
                   (Prefix), which Gateway API spells PathPrefix; the
                   HTTPRoute used to render `Prefix`, which no Gateway
                   accepts. Exact is the same word in both. */}}
            type: {{ eq .Values.main.ingress.pathType "Prefix" | ternary "PathPrefix" .Values.main.ingress.pathType }}
            value: {{ .Values.main.ingress.path }}
      # Remove client-supplied identity headers on the way in (#326). Defence
      # in depth since #1359: elitea-main deletes the same names itself before
      # any route runs (apimw.StripClientIdentityHeaders) and reads no X-Auth-*
      # name as an identity. Kept because it costs nothing and keeps a
      # caller-chosen value out of anything between the Gateway and the pod.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              {{- range .Values.main.ingress.stripIdentityHeaders }}
              - {{ . | quote }}
              {{- end }}
      backendRefs:
        - name: {{ include "elitea-main.fullname" . }}
          port: {{ .Values.main.service.port }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
  {{- with include "elitea-main.ingressAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with include "elitea-main.ingressClassName" . }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.main.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.main.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.main.ingress.path }}
            pathType: {{ $.Values.main.ingress.pathType }}
            backend:
              service:
                name: {{ include "elitea-main.fullname" $ }}
                port:
                  number: {{ $.Values.main.service.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
