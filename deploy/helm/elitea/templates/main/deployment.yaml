{{- if .Values.main.enabled }}
{{- /*
  The database secret, resolved once for every component that reads it.
  An explicit `secrets.DATABASE_URL` under this component wins and is taken
  WHOLE — `hasKey` rather than a field-wise merge, so an entry that names a
  secret can never be completed with a key from somewhere else and end up
  pointing at a database nobody chose.
*/ -}}
{{- $secrets := .Values.main.secrets | default dict }}
{{- $pg := .Values.postgresql | default dict }}
{{- if and $pg.existingSecret (not (hasKey $secrets "DATABASE_URL")) }}
{{- $secrets = merge (deepCopy $secrets) (dict "DATABASE_URL" (dict "secretName" $pg.existingSecret "key" (required "postgresql.key is required when postgresql.existingSecret is set" $pg.key))) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
spec:
  {{- if not .Values.main.autoscaling.enabled }}
  replicas: {{ .Values.main.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "elitea-main.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-main.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.main.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      {{- with .Values.main.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elitea-main.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      {{- $runtimeMaterialInit := and .Values.main.runtime.enabled .Values.main.runtime.material.secretName }}
      {{- $authMaterialInit := and .Values.main.fileConfig.authConfig.enabled .Values.main.fileConfig.authConfig.material.secretName }}
      {{- if or $runtimeMaterialInit $authMaterialInit }}
      initContainers:
      {{- end }}
      {{- if $runtimeMaterialInit }}
        # Install the runtime material where securefile can read it (issue
        # #404). internal/security/securefile refuses a path that resolves
        # through a symlink, and it requires owner-only bits on private
        # material. A Kubernetes Secret volume gives neither: mounted whole it
        # is a symlink farm, and mounted per file with subPath its files belong
        # to root while this pod runs as nonroot.
        #
        # So this container copies. It runs the SAME IMAGE as the service and
        # the SAME USER, so every file it writes belongs to the user that then
        # reads it. It reads the same ConfigMap, so the destination comes from
        # the same ELITEA_RUNTIME_*_FILE names the service opens — there is no
        # second list to keep in step.
        #
        # It also reads every installed file back through securefile before it
        # exits. A missing Secret key or a wrong mode therefore stops the pod
        # HERE, with a message, instead of in a restart loop of the service.
        #
        # The compose stack solves the same problem in the same way; read
        # deploy/runtime/install-material.sh.
        - name: runtime-material
          image: "{{ .Values.main.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.main.image.pullPolicy }}
          command: ["/elitea-runtime-material"]
          args: ["-source", "{{ include "elitea-main.runtimeMaterialSourcePath" . }}"]
          {{- with .Values.main.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "elitea-main.fullname" . }}-config
          resources:
            # The service's own request, deliberately. An init container's
            # request is compared with the application containers' requests
            # rather than added to them, so reusing this block leaves the pod's
            # effective request exactly where it was.
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-material-source
              mountPath: {{ include "elitea-main.runtimeMaterialSourcePath" . }}
              readOnly: true
            - name: runtime-material
              mountPath: {{ .Values.main.runtime.material.mountPath }}
      {{- end }}
      {{- if $authMaterialInit }}
        # Install the AUTHENTICATION material where securefile can read it
        # (issue #444). internal/authcomposition/material.go opens five files:
        # the Auth Redis password, the Auth Redis CA, the browser-attempt key,
        # the PAT signing key and the Form users JSON.
        #
        # Same defect as the runtime material above, so the SAME mechanism.
        # There is one copy engine, internal/security/materialinstall, and both
        # commands call it.
        #
        # One difference, and it decides the arguments below. The chart owns
        # every runtime file NAME, so the runtime command derives its whole
        # destination from the ConfigMap. The five authentication paths belong
        # to the operator's authentication document instead. So this command
        # READS THAT DOCUMENT: -config gives it the very file the service reads,
        # and it derives the five paths and their directory from it. -mount
        # states what the pod mounts, and the command refuses a disagreement by
        # name. Neither value can drift into silence.
        - name: auth-material
          image: "{{ .Values.main.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.main.image.pullPolicy }}
          command: ["/elitea-auth-material"]
          args:
            - "-config"
            - "{{ .Values.main.fileConfig.authConfig.mountPath }}"
            - "-source"
            - "{{ include "elitea-main.authMaterialSourcePath" . }}"
            - "-mount"
            - "{{ .Values.main.fileConfig.authConfig.material.mountPath }}"
          {{- with .Values.main.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            # The service's own request, deliberately. An init container's
            # request is compared with the application containers' requests
            # rather than added to them, so reusing this block leaves the pod's
            # effective request exactly where it was.
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            # The same ConfigMap, the same key and the same path the service
            # reads. A subPath mount gives a real file rather than a symlink,
            # which is why securefile accepts it here and refuses the Secret.
            - name: auth-config
              mountPath: {{ .Values.main.fileConfig.authConfig.mountPath }}
              subPath: {{ .Values.main.fileConfig.authConfig.key }}
              readOnly: true
            - name: auth-material-source
              mountPath: {{ include "elitea-main.authMaterialSourcePath" . }}
              readOnly: true
            - name: auth-material
              mountPath: {{ .Values.main.fileConfig.authConfig.material.mountPath }}
      {{- end }}
      containers:
        - name: elitea-main
          image: "{{ .Values.main.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.main.image.pullPolicy }}
          {{- with .Values.main.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.main.runtime.enabled }}
            # The runtime plane's three listeners (issue #382). The agent
            # worker dials all three, so they must be reachable on the Service
            # as well as declared here.
            - name: runtime-control
              containerPort: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.controlAddress }}
              protocol: TCP
            - name: runtime-output
              containerPort: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.outputAddress }}
              protocol: TCP
            - name: runtime-content
              containerPort: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.contentAddress }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "elitea-main.fullname" . }}-config
          env:
            {{- range $name, $ref := $secrets }}
            # Sensitive vars from Kubernetes Secrets (never plaintext in the
            # ConfigMap above) — S17, mirrors elitea-llm-gateway's deployment.yaml.
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
                  optional: {{ $ref.optional | default false }}
            {{- end }}
            {{- if .Values.main.fileConfig.authConfig.enabled }}
            # ELITEA_AUTH_CONFIG_FILE has no entry in the ConfigMap above (it
            # is unset by default); this sets it. Env entries win over
            # envFrom on name clash, same mechanism BRAND_PACK_PATH below
            # relies on to override its ConfigMap default.
            - name: ELITEA_AUTH_CONFIG_FILE
              value: {{ .Values.main.fileConfig.authConfig.mountPath }}
            {{- end }}
            {{- if .Values.main.fileConfig.brandPack.enabled }}
            - name: BRAND_PACK_PATH
              value: {{ .Values.main.fileConfig.brandPack.mountPath }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.main.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.main.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.main.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.main.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.main.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.main.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.main.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.main.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.main.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.main.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp (Go's os.CreateTemp
            # default dir, crypto/tls session cache, etc.) even though this
            # binary has no application-level temp-file writes today.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.main.fileConfig.authConfig.enabled }}
            - name: auth-config
              mountPath: {{ .Values.main.fileConfig.authConfig.mountPath }}
              subPath: {{ .Values.main.fileConfig.authConfig.key }}
              readOnly: true
            # The five files that the authentication configuration above names
            # (issue #444): the Auth Redis password, the Auth Redis CA, the
            # browser-attempt key, the PAT signing key and the Form users JSON.
            # A WHOLE-DIRECTORY mount, deliberately, for the same reason as the
            # runtime material below: securefile refuses a path that resolves
            # through a symlink, so the five must be real files in one
            # directory.
            #
            # This container never mounts the raw Secret. With
            # fileConfig.authConfig.material.secretName the init container above
            # reads the Secret and this mount holds its copies; with
            # fileConfig.authConfig.material.volume it holds the volume you
            # supply. Read-only in both shapes.
            - name: auth-material
              mountPath: {{ .Values.main.fileConfig.authConfig.material.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.main.fileConfig.llmGatewayClientMaterial.enabled }}
            # The /llm hop's client material. A whole-directory mount, not
            # subPath: internal/llmproxy/proxy.go reads these with
            # tls.LoadX509KeyPair / os.ReadFile and applies no permission or
            # symlink contract, so the Secret volume's `..data` symlink farm is
            # fine here — unlike the runtime and authentication material, which
            # securefile refuses in exactly that shape.
            - name: llm-gateway-client-material
              mountPath: {{ .Values.main.fileConfig.llmGatewayClientMaterial.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.main.fileConfig.deepwikiClientMaterial.enabled }}
            # The DeepWiki hop's client material. A whole-directory mount for
            # the same reason as the /llm hop's: internal/llmproxy's transport
            # builder reads these with tls.LoadX509KeyPair / os.ReadFile and
            # applies no symlink contract, so the Secret volume's `..data`
            # symlink farm is fine here.
            - name: deepwiki-client-material
              mountPath: {{ .Values.main.fileConfig.deepwikiClientMaterial.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.main.fileConfig.inventoryClientMaterial.enabled }}
            # The Inventory hop's client material. A SEPARATE mount from
            # DeepWiki's, from a separate Secret: one provider's certificate
            # must be revocable without touching the other's.
            - name: inventory-client-material
              mountPath: {{ .Values.main.fileConfig.inventoryClientMaterial.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.main.fileConfig.brandPack.enabled }}
            # BRAND_PACK_PATH is "one pack file per deployment" (branding
            # package doc), read with os.ReadFile — a subPath mount, same as
            # auth-config above, not a whole-ConfigMap directory mount.
            - name: brand-pack
              mountPath: {{ .Values.main.fileConfig.brandPack.mountPath }}
              subPath: {{ .Values.main.fileConfig.brandPack.key }}
              readOnly: true
            {{- end }}
            {{- if .Values.main.runtime.enabled }}
            # The runtime material (issue #382): signing key, verification
            # keyring, Redis password, Redis CA and the three server keypairs.
            # A WHOLE-DIRECTORY mount, deliberately — not the per-file subPath
            # mounts used above. internal/security/securefile also rejects any
            # path that resolves through a symlink, and the file names are
            # fixed by deploy/scripts/gen-runtime-certs.sh, so the source must
            # present all of them under one directory.
            #
            # This container never mounts the raw Secret. With
            # runtime.material.secretName the init container above reads the
            # Secret and this mount holds its copies; with
            # runtime.material.volume it holds the volume you supply.
            #
            # Read-only in BOTH shapes. A volumeMount is per container, so the
            # init container can still write the copies while the service can
            # only read them.
            - name: runtime-material
              mountPath: {{ .Values.main.runtime.material.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.main.runtime.enabled }}
        - name: runtime-material
          {{- if .Values.main.runtime.material.secretName }}
          # Memory-backed, so the copies never reach node storage, and they
          # disappear with the pod. The init container fills it; the service
          # reads it.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.main.runtime.material.sizeLimit | quote }}
          {{- else }}
          {{- toYaml .Values.main.runtime.material.volume | nindent 10 }}
          {{- end }}
        {{- if .Values.main.runtime.material.secretName }}
        - name: runtime-material-source
          secret:
            secretName: {{ .Values.main.runtime.material.secretName }}
            # The kubelet owns these files as root. Without a pod fsGroup, the
            # read bit for other users is the only one that reaches this pod's
            # nonroot user, and the init container has to read them. The bits
            # are scoped to this pod's own mount namespace: no other pod sees
            # this tmpfs, and the copies the service reads are owner-only.
            # With podSecurityContext.fsGroup set, 0440 is enough.
            defaultMode: {{ .Values.main.runtime.material.secretDefaultMode }}
        {{- end }}
        {{- end }}
        {{- if .Values.main.fileConfig.authConfig.enabled }}
        - name: auth-config
          configMap:
            # Rendered by templates/auth-config.yaml from
            # fileConfig.authConfig.document, or supplied by you through
            # fileConfig.authConfig.configMapName.
            name: {{ include "elitea-main.authConfigMapName" . }}
        - name: auth-material
          {{- if .Values.main.fileConfig.authConfig.material.secretName }}
          # Memory-backed, so the copies never reach node storage, and they
          # disappear with the pod. The init container fills it; the service
          # reads it.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.main.fileConfig.authConfig.material.sizeLimit | quote }}
          {{- else }}
          {{- toYaml .Values.main.fileConfig.authConfig.material.volume | nindent 10 }}
          {{- end }}
        {{- if .Values.main.fileConfig.authConfig.material.secretName }}
        - name: auth-material-source
          secret:
            secretName: {{ .Values.main.fileConfig.authConfig.material.secretName }}
            # The kubelet owns these files as root. Without a pod fsGroup, the
            # read bit for other users is the only one that reaches this pod's
            # nonroot user, and the init container has to read them. The bits
            # are scoped to this pod's own mount namespace: no other pod sees
            # this tmpfs, and the copies the service reads are owner-only.
            # With podSecurityContext.fsGroup set, 0440 is enough.
            defaultMode: {{ .Values.main.fileConfig.authConfig.material.secretDefaultMode }}
        {{- end }}
        {{- end }}
        {{- if .Values.main.fileConfig.llmGatewayClientMaterial.enabled }}
        - name: llm-gateway-client-material
          {{- with .Values.main.fileConfig.llmGatewayClientMaterial.volume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          secret:
            secretName: {{ required "fileConfig.llmGatewayClientMaterial.enabled=true needs secretName or volume" .Values.main.fileConfig.llmGatewayClientMaterial.secretName }}
            defaultMode: {{ .Values.main.fileConfig.llmGatewayClientMaterial.defaultMode }}
          {{- end }}
        {{- end }}
        {{- if .Values.main.fileConfig.deepwikiClientMaterial.enabled }}
        - name: deepwiki-client-material
          {{- with .Values.main.fileConfig.deepwikiClientMaterial.volume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          secret:
            secretName: {{ required "fileConfig.deepwikiClientMaterial.enabled=true needs secretName or volume" .Values.main.fileConfig.deepwikiClientMaterial.secretName }}
            defaultMode: {{ .Values.main.fileConfig.deepwikiClientMaterial.defaultMode }}
          {{- end }}
        {{- end }}
        {{- if .Values.main.fileConfig.inventoryClientMaterial.enabled }}
        - name: inventory-client-material
          {{- with .Values.main.fileConfig.inventoryClientMaterial.volume }}
          {{- toYaml . | nindent 10 }}
          {{- else }}
          secret:
            secretName: {{ required "fileConfig.inventoryClientMaterial.enabled=true needs secretName or volume" .Values.main.fileConfig.inventoryClientMaterial.secretName }}
            defaultMode: {{ .Values.main.fileConfig.inventoryClientMaterial.defaultMode }}
          {{- end }}
        {{- end }}
        {{- if .Values.main.fileConfig.brandPack.enabled }}
        - name: brand-pack
          configMap:
            name: {{ required "fileConfig.brandPack.configMapName is required when fileConfig.brandPack.enabled=true" .Values.main.fileConfig.brandPack.configMapName }}
        {{- end }}
      {{- with .Values.main.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
