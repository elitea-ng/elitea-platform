{{- if .Values.main.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elitea-main.fullname" . }}
  labels:
    {{- include "elitea-main.labels" . | nindent 4 }}
spec:
  type: {{ .Values.main.service.type }}
  ports:
    - port: {{ .Values.main.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.main.runtime.enabled }}
    # The runtime plane's listeners (issue #382). The agent worker dials them
    # through this Service, so the server certificates in the runtime material
    # must carry this Service name.
    - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.controlAddress }}
      targetPort: runtime-control
      protocol: TCP
      name: runtime-control
    - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.outputAddress }}
      targetPort: runtime-output
      protocol: TCP
      name: runtime-output
    - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.contentAddress }}
      targetPort: runtime-content
      protocol: TCP
      name: runtime-content
    # The platform listener (#1359), which replaced the platform-edge Service.
    - port: {{ include "elitea-main.runtimePort" .Values.main.runtime.listeners.platformAddress }}
      targetPort: runtime-plat
      protocol: TCP
      name: runtime-plat
    {{- end }}
  selector:
    {{- include "elitea-main.selectorLabels" . | nindent 4 }}
{{- end }}
