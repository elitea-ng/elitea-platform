{{- if .Values.worker.enabled }}
{{- if .Values.worker.autoscaling.enabled }}
{{/*
  Queue-depth autoscaling for the agent worker.

  WHY KEDA AND NOT A THIRD NATIVE HPA. The three HPAs in this chart scale on
  CPU and memory. Those are the wrong signal for this workload: an agent
  execution spends most of its life waiting on a model, so a backlog of
  thousands of unclaimed commands raises neither. The signal that matters is
  the lag of the worker's JetStream durable consumer, and no native HPA can
  read it. Every replica pulls from one durable, so scaling out divides the
  work by construction.

  THE GUARD BELOW IS THE POINT OF THIS FILE.

  This chart has already shipped one autoscaler that could not work: the
  gateway's HPA named a metric the gateway never published, so enabling it
  produced ScalingActive=False and pinned the deployment at minReplicas with
  nothing saying why. A ScaledObject applied to a cluster with no KEDA fails
  the same way and worse — the API rejects an unknown kind, or, if a stale CRD
  is present, the object is created and no controller ever reads it.

  `.Capabilities.APIVersions` is the cluster's OWN list of served API groups.
  Asking it turns "KEDA is not installed" from a silent no-op into a failed
  install with a message. For `helm template`, which has no cluster to ask,
  pass `--api-versions keda.sh/v1alpha1` — deploy/helm/tests/render-worker-
  autoscaling.sh does exactly that, and also checks that WITHOUT it the render
  is refused.
*/}}
{{- if not (.Capabilities.APIVersions.Has "keda.sh/v1alpha1") }}
{{- fail "worker.autoscaling.enabled=true needs KEDA, and this cluster does not serve keda.sh/v1alpha1. The worker scales on JetStream consumer lag, which no native HorizontalPodAutoscaler can read, so there is no degraded mode to fall back to: a ScaledObject applied without KEDA is an object no controller reads. Install KEDA (https://keda.sh), or set worker.autoscaling.enabled=false and size worker.replicaCount by hand. For `helm template`, pass --api-versions keda.sh/v1alpha1." }}
{{- end }}
{{- $a := .Values.worker.autoscaling }}
{{- if lt (int $a.maxReplicas) (int $a.minReplicas) }}
{{- fail (printf "worker.autoscaling.maxReplicas (%d) is below minReplicas (%d)." (int $a.maxReplicas) (int $a.minReplicas)) }}
{{- end }}
{{- /*
  The monitoring endpoint defaults to the NATS chart's HEADLESS service. On a
  single server either name works. On the HA cluster the scaler must reach the
  CONSUMER LEADER's /jsz (a follower reports its own, stale view): it reads
  /varz connect_urls and queries each advertised node, and when a server
  advertises none it falls back to <server_name>.<endpoint host> — a pod DNS
  name that resolves only under the headless service (KEDA
  pkg/scalers/nats_jetstream_scaler.go getNATSJetStreamMonitoringNodeURLByNode).
*/}}
{{- $headless := dict "service" (printf "%s-headless" .Values.nats.service) "namespace" .Values.nats.namespace -}}
{{- $endpoint := $a.natsMonitoringEndpoint | default (printf "%s:8222" (include "elitea.serviceHost" (dict "svc" $headless "ctx" .))) }}
{{- /*
  The target per replica. KEDA's metric is num_pending + num_ack_pending of
  the durable (KEDA v2.10 through v2.21, getMaxMsgLag): the backlog PLUS every
  command a replica has pulled and not yet acked. A worker pulls only for its
  free delivery slots plus at most nats_fetch_batch of prefetch, so one
  replica's share of that metric is about delivery_max_concurrency; that is
  the default threshold, and the fleet KEDA asks for is "enough replicas to
  run everything that is waiting or running". A threshold above what one
  replica can hold means the backlog waits while KEDA thinks it is covered.
*/}}
{{- $limits := .Values.worker.runtime.limits -}}
{{- $perReplica := add (int $limits.delivery_max_concurrency) (int $limits.nats_fetch_batch) -}}
{{- $lag := int ($a.lagThreshold | default $limits.delivery_max_concurrency) -}}
{{- if or (lt $lag 1) (gt $lag (int $perReplica)) }}
{{- fail (printf "worker.autoscaling.lagThreshold (%d) must be between 1 and what one replica holds in flight, delivery_max_concurrency + nats_fetch_batch (%d). KEDA's metric counts pulled-but-unacked commands too, so a higher threshold leaves a backlog waiting while the fleet looks sized." $lag (int $perReplica)) }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "elitea-worker-python.fullname" . }}
  minReplicaCount: {{ $a.minReplicas }}
  maxReplicaCount: {{ $a.maxReplicas }}
  pollingInterval: {{ $a.pollingIntervalSeconds }}
  # A LONG cooldown, deliberately. An agent execution can run for minutes, and
  # KEDA scales down by removing pods. The worker drains on SIGTERM, but a
  # cooldown shorter than a typical execution turns every quiet moment into a
  # round of terminations that each have to wait out an in-flight turn.
  cooldownPeriod: {{ $a.cooldownSeconds }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Match the cooldown. Without this, KEDA's generated HPA uses the
          # Kubernetes default of 300s, and the cooldown above governs only the
          # scale-to-zero transition.
          stabilizationWindowSeconds: {{ $a.cooldownSeconds }}
  triggers:
    # The worker's own durable consumer on the command bus
    # (docs/runtime-command-bus.md). The scaler reads /jsz (and, on a
    # cluster, /varz) on the NATS monitoring port — plain HTTP, no credential, so no
    # TriggerAuthentication; deploy/helm/nats admits the KEDA operator there
    # (networkPolicy.monitoringFrom).
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $endpoint | quote }}
        # The NATS account holding the command bus streams.
        account: {{ $a.natsAccount | quote }}
        # Both names come from the worker's own configuration, so the scaler
        # cannot watch a different stream or durable than the fleet pulls.
        stream: {{ .Values.worker.runtime.natsStream | quote }}
        consumer: {{ .Values.worker.runtime.natsConsumer | quote }}
        # KEDA's metric is num_pending + num_ack_pending: commands waiting
        # AND commands a replica holds (running, or in its small prefetch).
        # The threshold is one replica's in-flight capacity (see above).
        lagThreshold: {{ $lag | toString | quote }}
        activationLagThreshold: {{ $a.activationLagThreshold | quote }}
        useHttps: "false"
{{- end }}
{{- end }}
