{{- if .Values.worker.enabled }}
# The worker's one configuration document. Its shape is fixed by
# elitea_worker/config.py — one JSON config, no env-var settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}-runtime
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
data:
  # WHY consumer_id CARRIES A PLACEHOLDER
  # consumer_id carries a per-POD placeholder, and the init container
  # substitutes it. See the "Per-replica consumer identity" block in
  # deployment.yaml for the whole mechanism and the failure it prevents.
  #
  # The short version: it is the worker's NATS connection NAME (what
  # `nats server report connections` shows), one per pod so an operator can
  # tell replicas apart. Every replica pulls from the SAME durable consumer;
  # JetStream tracks each delivery itself, so the name carries no
  # correctness. It is NOT a security identity — those are
  # workload_session_id, producer_id, the runtime client certificate and the
  # elitea-worker NATS certificate.
  runtime.json: |
    {{- $r := .Values.worker.runtime }}
    {{- $material := "/run/elitea-runtime" }}
    {{- $config := dict
      "schema_version" "elitea.runtime-deploy.v1"
      "limits_revision" "elitea.runtime.limits.conformance.v3"
      "workload_session_id" $r.workloadSessionId
      "producer_id" $r.producerId
      "consumer_id" (printf "%s-__ELITEA_POD_NAME__" $r.consumerId)
      "nats_url" ($r.natsUrl | default (include "elitea.natsUrl" .))
      "nats_stream" $r.natsStream
      "nats_consumer" $r.natsConsumer
      "control_target" $r.controlTarget
      "output_target" $r.outputTarget
      "content_origin" $r.contentOrigin
      "platform_origin" $r.platformOrigin
      "ca_path" (printf "%s/runtime-ca.crt" $material)
      "certificate_path" (printf "%s/agent-worker-client.crt" $material)
      "private_key_path" (printf "%s/agent-worker-client.key" $material)
      "ed25519_keyring_path" (printf "%s/command-signing-keyring.json" $material)
      "spool_root" $r.spoolRoot
      "spool_key_path" (printf "%s/worker-output-spool-key" $material)
      "agent_checkpoint_connection_path" (printf "%s/agent-checkpoint-connection" $material)
      "limits" $r.limits
    }}
    {{- /* The deployment's PUBLIC base URL, for links the Rust worker puts in an
    answer (a chart's Markdown image): platformOrigin is the in-cluster edge,
    which a browser cannot open. Written only when set, and only for the Rust
    worker (the Python worker's config refuses unknown keys), so the default
    runtime.json stays identical for both implementations (render-worker.sh).
    Links are root-relative without it. */}}
    {{- if $r.publicBaseUrl }}
    {{- if ne (include "elitea-worker.isRust" .) "true" }}
    {{- fail "worker.runtime.publicBaseUrl requires the Rust worker" }}
    {{- end }}
    {{- $_ := set $config "public_base_url" $r.publicBaseUrl }}
    {{- end }}
    {{- if .Values.nats.tls.enabled }}
    {{- $_ := set $config "nats_ca_path" (printf "%s/ca.crt" (trimSuffix "/" .Values.nats.tls.mountPath)) }}
    {{- $_ := set $config "nats_certificate_path" (printf "%s/tls.crt" (trimSuffix "/" .Values.nats.tls.mountPath)) }}
    {{- $_ := set $config "nats_private_key_path" (printf "%s/tls.key" (trimSuffix "/" .Values.nats.tls.mountPath)) }}
    {{- end }}
    {{- $pairs := dict "ELITEA_RT_V1_VALIDATE" "elitea-configuration-worker-v1" "ELITEA_RT_V1_AGENT" "elitea-agent-worker-v1" "ELITEA_RT_V1_INDEX" "elitea-index-worker-v1" }}
    {{- if ne (get $pairs ($r.natsStream | toString)) ($r.natsConsumer | toString) }}
    {{- fail (printf "worker.runtime.natsStream %q with natsConsumer %q is not a command bus route. The streams and their durables are fixed (docs/runtime-command-bus.md): %v." ($r.natsStream | toString) ($r.natsConsumer | toString) $pairs) }}
    {{- end }}
    {{- /* The recovery switches are booleans and nothing else: a string
    "false" is truthy in a template and would turn recovery on without a word.
    Each key is written only when true: false is the Rust worker's own default,
    and leaving it out keeps the default runtime.json identical for both
    implementations (render-worker.sh). */}}
    {{- range $key := list "agentModelCheckpointRecovery" "agentNodeRecovery" }}
    {{- if not (kindIs "bool" (get $r $key)) }}
    {{- fail (printf "worker.runtime.%s must be true or false, not %v" $key (get $r $key)) }}
    {{- end }}
    {{- end }}
    {{- if or $r.agentModelCheckpointRecovery $r.agentNodeRecovery (gt (len $r.sandboxRuntimes) 0) }}
    {{- if ne (include "elitea-worker.isRust" .) "true" }}
    {{- fail "worker.runtime agentModelCheckpointRecovery, agentNodeRecovery and sandbox profiles require the Rust worker" }}
    {{- end }}
    {{- end }}
    {{- if $r.agentModelCheckpointRecovery }}
    {{- $_ := set $config "agent_model_checkpoint_recovery" true }}
    {{- end }}
    {{- if $r.agentNodeRecovery }}
    {{- $_ := set $config "agent_node_recovery" true }}
    {{- end }}
    {{- if gt (len $r.sandboxRuntimes) 0 }}
    {{- $_ := set $config "sandbox_runtimes" $r.sandboxRuntimes }}
    {{- end }}
    {{- /* The vector store (ADR-0030 I1, ADR-0031): written only under
    indexingRuntime=rust, so the python-indexing runtime.json stays identical
    for both implementations (render-worker.sh). The worker reaches
    elitea-vector with its runtime mTLS identity; nothing else is mounted. The
    guard in guards.yaml has already refused rust indexing with no target. */}}
    {{- if eq (include "elitea.indexingRuntime" .) "rust" }}
    {{- $target := $r.vectorTarget | default (printf "%s:%v" .Values.vector.service.name .Values.vector.service.port) }}
    {{- $_ := set $config "vector_target" $target }}
    {{- if $r.indexEgressAllowlist }}
    {{- $_ := set $config "index_egress_allowlist" $r.indexEgressAllowlist }}
    {{- end }}
    {{- /* The model calls one index run may make (ADR-0030 I4). Written only
    when set, and only under the Rust indexing runtime, so the Python
    runtime.json stays identical; the worker's default is the chart default. */}}
    {{- /* Validated, never defaulted by accident: 0 is falsy in a template and
    would otherwise vanish into the worker's default. */}}
    {{- if hasKey $r "indexModelCallCap" }}
    {{- $cap := $r.indexModelCallCap }}
    {{- if not (kindIs "invalid" $cap) }}
    {{- if not (or (kindIs "float64" $cap) (kindIs "int64" $cap) (kindIs "int" $cap)) }}
    {{- fail (printf "worker.runtime.indexModelCallCap must be an integer of at least 1, not %v (%s). It bounds the model calls one index run may make; to avoid model calls set the chunker to a non-model one." $cap (kindOf $cap)) }}
    {{- end }}
    {{- $f := float64 $cap }}
    {{- if or (lt $f 1.0) (ne $f (floor $f)) (gt $f 4294967295.0) }}
    {{- fail (printf "worker.runtime.indexModelCallCap must be an integer between 1 and 4294967295, not %v. Use 1 or more: 0 does not mean \"no model calls\"; set the chunker to a non-model one (markdown, text, ...) to avoid calls." $cap) }}
    {{- end }}
    {{- $_ := set $config "index_model_call_cap" (int64 $cap) }}
    {{- end }}
    {{- end }}
    {{- /* The document extraction sidecar (ADR-0030 I1): the worker streams
    PDF and Office documents to this socket, in the emptyDir the Deployment
    shares between the two containers. Written only while the sidecar renders
    (guards.yaml refuses it outside the Rust indexing runtime), so the
    runtime.json of every other deployment is unchanged. */}}
    {{- if (.Values.worker.extractor | default dict).enabled }}
    {{- $_ := set $config "extractor_socket" (printf "%s/extractor.sock" (trimSuffix "/" .Values.worker.extractor.socketDir)) }}
    {{- end }}
    {{- end }}
    {{ toJson $config }}
  {{- if eq (include "elitea-worker.isRust" .) "true" }}
  # The Rust worker's second mandatory file. It carries the rule the Python
  # worker reads from ELITEA_SENSITIVE_TOOLS, so `sensitiveTools` stays the one
  # place an operator writes it for either implementation.
  #
  # `fromJson` is what makes that possible: the value is a JSON STRING because
  # an environment variable can hold nothing else, and this file needs the
  # decoded object. A malformed string fails the render here, which is where an
  # operator can still see it — the Rust worker would instead reject the file at
  # startup and CrashLoopBackOff.
  #
  # The `toolkit_security` key must be present even when it is empty: the
  # worker refuses a document without it (execution/production.rs). Its own
  # accepted keys are a closed set — blocked_toolkits, blocked_tools,
  # sensitive_tools, sensitive_action_company_name,
  # sensitive_action_message_template — and anything else is rejected, so this
  # writes only what the operator actually set.
  toolkit-security.json: |
    {{ toJson (dict "toolkit_security" (dict "sensitive_tools" (fromJson $r.sensitiveTools))) }}
  {{- end }}
{{- end }}
