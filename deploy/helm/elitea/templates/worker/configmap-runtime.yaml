{{- if .Values.worker.enabled }}
# The worker's configuration document (runtime.json) and its toolkit security
# file. The shape of runtime.json is fixed by the Rust worker's config struct
# (services/elitea-worker-rust/src/config.rs, deny_unknown_fields).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-worker.fullname" . }}-runtime
  labels:
    {{- include "elitea-worker.labels" . | nindent 4 }}
data:
  # WHY consumer_id CARRIES A PLACEHOLDER
  # consumer_id carries a per-POD placeholder, and the init container
  # substitutes it. See the "Per-replica consumer identity" block in
  # deployment.yaml for the whole mechanism and the failure it prevents.
  #
  # The short version: it is the worker's NATS connection NAME (what
  # `nats server report connections` shows), one per pod so an operator can
  # tell replicas apart. Every replica pulls from the SAME durable consumer;
  # JetStream tracks each delivery itself, so the name carries no
  # correctness. It is NOT a security identity — those are
  # workload_session_id, producer_id, the runtime client certificate and the
  # elitea-worker NATS certificate.
  runtime.json: |
    {{- $r := .Values.worker.runtime }}
    {{- $material := "/run/elitea-runtime" }}
    {{- $config := dict
      "schema_version" "elitea.runtime-deploy.v1"
      "limits_revision" "elitea.runtime.limits.conformance.v3"
      "workload_session_id" $r.workloadSessionId
      "producer_id" $r.producerId
      "consumer_id" (printf "%s-__ELITEA_POD_NAME__" $r.consumerId)
      "nats_url" ($r.natsUrl | default (include "elitea.natsUrl" .))
      "nats_stream" $r.natsStream
      "nats_consumer" $r.natsConsumer
      "control_target" $r.controlTarget
      "output_target" $r.outputTarget
      "content_origin" $r.contentOrigin
      "platform_origin" $r.platformOrigin
      "ca_path" (printf "%s/runtime-ca.crt" $material)
      "certificate_path" (printf "%s/agent-worker-client.crt" $material)
      "private_key_path" (printf "%s/agent-worker-client.key" $material)
      "ed25519_keyring_path" (printf "%s/command-signing-keyring.json" $material)
      "spool_root" $r.spoolRoot
      "spool_key_path" (printf "%s/worker-output-spool-key" $material)
      "agent_checkpoint_connection_path" (printf "%s/agent-checkpoint-connection" $material)
      "limits" $r.limits
    }}
    {{- /* The deployment's PUBLIC base URL, for links the Rust worker puts in an
    answer (a chart's Markdown image): platformOrigin is elitea-main's in-cluster platform listener,
    which a browser cannot open. Written only when set. Links are
    root-relative without it. */}}
    {{- if $r.publicBaseUrl }}
    {{- $_ := set $config "public_base_url" $r.publicBaseUrl }}
    {{- end }}
    {{- /* The image generation model (#1969): global.imageGenerationModel feeds
    this and elitea-main's ELITEA_IMAGE_GENERATION_MODEL. Written only when
    set; unset, the worker offers no image_generation tool. */}}
    {{- if $r.imageGenerationModel }}
    {{- $_ := set $config "image_generation_model" $r.imageGenerationModel }}
    {{- end }}
    {{- /* The egress allowlist of the web toolkits' provider calls (#1238).
    Written only when set; the worker then allows every provider origin its
    registry declares. */}}
    {{- if $r.webEgressAllowlist }}
    {{- $_ := set $config "web_egress_allowlist" $r.webEgressAllowlist }}
    {{- end }}
    {{- if .Values.natsClient.tls.enabled }}
    {{- $_ := set $config "nats_ca_path" (printf "%s/ca.crt" (trimSuffix "/" .Values.natsClient.tls.mountPath)) }}
    {{- $_ := set $config "nats_certificate_path" (printf "%s/tls.crt" (trimSuffix "/" .Values.natsClient.tls.mountPath)) }}
    {{- $_ := set $config "nats_private_key_path" (printf "%s/tls.key" (trimSuffix "/" .Values.natsClient.tls.mountPath)) }}
    {{- end }}
    {{- $pairs := dict "ELITEA_RT_V1_VALIDATE" "elitea-configuration-worker-v1" "ELITEA_RT_V1_AGENT" "elitea-agent-worker-v1" "ELITEA_RT_V1_INDEX" "elitea-index-worker-v1" }}
    {{- if ne (get $pairs ($r.natsStream | toString)) ($r.natsConsumer | toString) }}
    {{- fail (printf "worker.runtime.natsStream %q with natsConsumer %q is not a command bus route. The streams and their durables are fixed (docs/runtime-command-bus.md): %v." ($r.natsStream | toString) ($r.natsConsumer | toString) $pairs) }}
    {{- end }}
    {{- /* The recovery switches are booleans and nothing else: a string
    "false" is truthy in a template and would turn recovery on without a word.
    Each key is written only when true: false is the Rust worker's own default,
    and leaving it out keeps the default runtime.json minimal (render-worker.sh). */}}
    {{- range $key := list "agentModelCheckpointRecovery" "agentNodeRecovery" }}
    {{- if not (kindIs "bool" (get $r $key)) }}
    {{- fail (printf "worker.runtime.%s must be true or false, not %v" $key (get $r $key)) }}
    {{- end }}
    {{- end }}
    {{- if $r.agentModelCheckpointRecovery }}
    {{- $_ := set $config "agent_model_checkpoint_recovery" true }}
    {{- end }}
    {{- if $r.agentNodeRecovery }}
    {{- $_ := set $config "agent_node_recovery" true }}
    {{- end }}
    {{- if gt (len $r.sandboxRuntimes) 0 }}
    {{- /* W3-1: codeSlots, the Code attempts this worker runs at once on the
    entry's supervisor target, is written as code_slots only when set (the
    worker's default is 4, the shipped supervisor concurrency). A whole number
    from 1 to 1024; the worker refuses entries on one supervisor that
    disagree. */}}
    {{- $runtimes := list }}
    {{- range $index, $profile := $r.sandboxRuntimes }}
    {{- $entry := omit $profile "codeSlots" }}
    {{- if hasKey $profile "codeSlots" }}
    {{- $slots := $profile.codeSlots }}
    {{- if not (or (kindIs "float64" $slots) (kindIs "int" $slots) (kindIs "int64" $slots)) }}
    {{- fail (printf "worker.runtime.sandboxRuntimes[%d].codeSlots must be a whole number from 1 to 1024 (the supervisor's concurrency), not %v" $index $slots) }}
    {{- end }}
    {{- if or (ne (float64 $slots) (float64 (int64 $slots))) (lt (int64 $slots) 1) (gt (int64 $slots) 1024) }}
    {{- fail (printf "worker.runtime.sandboxRuntimes[%d].codeSlots must be a whole number from 1 to 1024 (the supervisor's concurrency), not %v" $index $slots) }}
    {{- end }}
    {{- $_ := set $entry "code_slots" (int64 $slots) }}
    {{- end }}
    {{- $runtimes = append $runtimes $entry }}
    {{- end }}
    {{- $_ := set $config "sandbox_runtimes" $runtimes }}
    {{- end }}
    {{- /* ADR-0034: the cloud executor's workspace runs. */}}
    {{- with ($r.workspaceRuns | default dict) }}
    {{- range $key := list "target" "audience" "scratch_root" "cpu_millis" "memory_bytes" "max_disk_bytes" "turn_wall_seconds" }}
    {{- if not (hasKey $.Values.worker.runtime.workspaceRuns $key) }}
    {{- fail (printf "worker.runtime.workspaceRuns.%s is required" $key) }}
    {{- end }}
    {{- end }}
    {{- if not (has .audience ($.Values.main.runtime.sandboxAudiences | default list)) }}
    {{- fail "worker.runtime.workspaceRuns.audience must be in main.runtime.sandboxAudiences" }}
    {{- end }}
    {{- $_ := set $config "workspace_runs" (dict "target" .target "audience" .audience "scratch_root" .scratch_root "cpu_millis" (int64 .cpu_millis) "memory_bytes" (int64 .memory_bytes) "max_disk_bytes" (int64 .max_disk_bytes) "turn_wall_seconds" (int64 .turn_wall_seconds)) }}
    {{- end }}
    {{- /* ADR-0049: the cloud browser sessions. */}}
    {{- with ($r.browserSessions | default dict) }}
    {{- range $key := list "target" "audience" "cpu_millis" "memory_bytes" "wall_seconds" "max_pages" }}
    {{- /* absent and null (--set key=null keeps the key on some Helm versions) are both missing */}}
    {{- if or (not (hasKey $.Values.worker.runtime.browserSessions $key)) (kindIs "invalid" (index $.Values.worker.runtime.browserSessions $key)) }}
    {{- fail (printf "worker.runtime.browserSessions.%s is required" $key) }}
    {{- end }}
    {{- end }}
    {{- if not (has .audience ($.Values.main.runtime.sandboxAudiences | default list)) }}
    {{- fail "worker.runtime.browserSessions.audience must be in main.runtime.sandboxAudiences" }}
    {{- end }}
    {{- $sessions := dict "target" .target "audience" .audience "cpu_millis" (int64 .cpu_millis) "memory_bytes" (int64 .memory_bytes) "wall_seconds" (int64 .wall_seconds) "max_pages" (int64 .max_pages) }}
    {{- /* The lite session size (#1599): both or neither; null is unset. */}}
    {{- $liteSet := list }}
    {{- range $key := list "lite_cpu_millis" "lite_memory_bytes" }}
    {{- if and (hasKey $.Values.worker.runtime.browserSessions $key) (not (kindIs "invalid" (index $.Values.worker.runtime.browserSessions $key))) }}
    {{- $liteSet = append $liteSet $key }}
    {{- end }}
    {{- end }}
    {{- if eq (len $liteSet) 1 }}
    {{- fail "worker.runtime.browserSessions.lite_cpu_millis and lite_memory_bytes are both or neither" }}
    {{- end }}
    {{- if eq (len $liteSet) 2 }}
    {{- $_ := set $sessions "lite_cpu_millis" (int64 .lite_cpu_millis) }}
    {{- $_ := set $sessions "lite_memory_bytes" (int64 .lite_memory_bytes) }}
    {{- end }}
    {{- $_ := set $config "browser_sessions" $sessions }}
    {{- end }}
    {{- /* The model completions one claim's toolkits may make in total (the
    step-back index tools, the Office prompts, image generation). Written
    only when set; unset, the worker's default (200) applies. Validated like
    indexModelCallCap: 0 is refused. */}}
    {{- if and (hasKey $r "toolkitModelCallCap") (not (kindIs "invalid" $r.toolkitModelCallCap)) (ne (toString $r.toolkitModelCallCap) "") }}
    {{- $cap := $r.toolkitModelCallCap }}
    {{- if not (or (kindIs "float64" $cap) (kindIs "int64" $cap) (kindIs "int" $cap)) }}
    {{- fail (printf "worker.runtime.toolkitModelCallCap must be an integer of at least 1, not %v (%s)" $cap (kindOf $cap)) }}
    {{- end }}
    {{- $f := float64 $cap }}
    {{- if or (lt $f 1.0) (ne $f (floor $f)) (gt $f 4294967295.0) }}
    {{- fail (printf "worker.runtime.toolkitModelCallCap must be an integer between 1 and 4294967295, not %v" $cap) }}
    {{- end }}
    {{- $_ := set $config "toolkit_model_call_cap" (int64 $cap) }}
    {{- end }}
    {{- /* The vector store (ADR-0030 I1, ADR-0031): written only while the
    release indexes (main.runtime.indexIngestDispatch.enabled), so a
    deployment without indexing keeps the minimal runtime.json
    (render-worker.sh). The worker reaches elitea-vector with its runtime mTLS
    identity; nothing else is mounted. The guard in guards.yaml has already
    refused indexing with no target. */}}
    {{- if include "elitea.indexingEnabled" . }}
    {{- $target := $r.vectorTarget | default (printf "%s:%v" .Values.vector.service.name .Values.vector.service.port) }}
    {{- $_ := set $config "vector_target" $target }}
    {{- if $r.indexEgressAllowlist }}
    {{- $_ := set $config "index_egress_allowlist" $r.indexEgressAllowlist }}
    {{- end }}
    {{- /* The `memory` toolkit's embedding model (worker unit M9). Written only
    when set, and only while the release indexes (the claim's vector token
    and the worker's vector_target exist only there; guards.yaml refuses the
    value elsewhere), so the other runtime.json documents are unchanged. */}}
    {{- if $r.memoryEmbeddingModel }}
    {{- $_ := set $config "memory_embedding_model" ($r.memoryEmbeddingModel | toString) }}
    {{- end }}
    {{- /* The model calls one index run may make (ADR-0030 I4). Written only
    when set, and only while the release indexes; the worker's default is the
    chart default. */}}
    {{- /* Validated, never defaulted by accident: 0 is falsy in a template and
    would otherwise vanish into the worker's default. */}}
    {{- if hasKey $r "indexModelCallCap" }}
    {{- $cap := $r.indexModelCallCap }}
    {{- if not (kindIs "invalid" $cap) }}
    {{- if not (or (kindIs "float64" $cap) (kindIs "int64" $cap) (kindIs "int" $cap)) }}
    {{- fail (printf "worker.runtime.indexModelCallCap must be an integer of at least 1, not %v (%s). It bounds the model calls one index run may make; to avoid model calls set the chunker to a non-model one." $cap (kindOf $cap)) }}
    {{- end }}
    {{- $f := float64 $cap }}
    {{- if or (lt $f 1.0) (ne $f (floor $f)) (gt $f 4294967295.0) }}
    {{- fail (printf "worker.runtime.indexModelCallCap must be an integer between 1 and 4294967295, not %v. Use 1 or more: 0 does not mean \"no model calls\"; set the chunker to a non-model one (markdown, text, ...) to avoid calls." $cap) }}
    {{- end }}
    {{- $_ := set $config "index_model_call_cap" (int64 $cap) }}
    {{- end }}
    {{- end }}
    {{- /* The document extraction sidecar (ADR-0030 I1): the worker streams
    PDF and Office documents to this socket, in the emptyDir the Deployment
    shares between the two containers. Written only while the sidecar renders
    (guards.yaml refuses it without indexing), so the
    runtime.json of every other deployment is unchanged. */}}
    {{- if (.Values.worker.extractor | default dict).enabled }}
    {{- $_ := set $config "extractor_socket" (printf "%s/extractor.sock" (trimSuffix "/" .Values.worker.extractor.socketDir)) }}
    {{- end }}
    {{- end }}
    {{ toJson $config }}
  # The Rust worker's second mandatory file. It carries `sensitiveTools`.
  #
  # The value is a JSON STRING (it used to be an environment variable for the
  # retired Python worker) and `fromJson` decodes it into the object this file
  # needs. A malformed string fails the render here, which is where an
  # operator can still see it — the Rust worker would instead reject the file at
  # startup and CrashLoopBackOff.
  #
  # The `toolkit_security` key must be present even when it is empty: the
  # worker refuses a document without it (execution/production.rs). Its own
  # accepted keys are a closed set — blocked_toolkits, blocked_tools,
  # sensitive_tools, sensitive_action_company_name,
  # sensitive_action_message_template — and anything else is rejected, so this
  # writes only what the operator actually set.
  toolkit-security.json: |
    {{ toJson (dict "toolkit_security" (dict "sensitive_tools" (fromJson $r.sensitiveTools))) }}
{{- end }}
