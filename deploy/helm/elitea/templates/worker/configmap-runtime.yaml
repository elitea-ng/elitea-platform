{{- if .Values.worker.enabled }}
# The worker's one configuration document. Its shape is fixed by
# elitea_worker/config.py — one JSON config, no env-var settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}-runtime
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
data:
  # WHY consumer_id CARRIES A PLACEHOLDER
  # consumer_id carries a per-POD placeholder, and the init container
  # substitutes it. See the "Per-replica consumer identity" block in
  # deployment.yaml for the whole mechanism and the failure it prevents.
  #
  # The short version: this is the Redis consumer-group consumer NAME, and
  # two processes sharing one name are one consumer as far as Redis is
  # concerned. It is NOT a security identity — those are
  # workload_session_id, producer_id and the client certificate, and all
  # three stay shared, because the database enforces mutual exclusion per
  # EXECUTION rather than per producer.
  runtime.json: |
    {{- $r := .Values.worker.runtime }}
    {{- $material := "/run/elitea-runtime" }}
    {{ toJson (dict
      "schema_version" "elitea.runtime-deploy.v1"
      "limits_revision" "elitea.runtime.limits.conformance.v2"
      "workload_session_id" $r.workloadSessionId
      "producer_id" $r.producerId
      "consumer_id" (printf "%s-__ELITEA_POD_NAME__" $r.consumerId)
      "redis_url" $r.redisUrl
      "redis_password_path" (printf "%s/redis-worker-password" $material)
      "redis_stream" $r.redisStream
      "redis_group" $r.redisGroup
      "control_target" $r.controlTarget
      "output_target" $r.outputTarget
      "content_origin" $r.contentOrigin
      "platform_origin" $r.platformOrigin
      "ca_path" (printf "%s/runtime-ca.crt" $material)
      "certificate_path" (printf "%s/agent-worker-client.crt" $material)
      "private_key_path" (printf "%s/agent-worker-client.key" $material)
      "ed25519_keyring_path" (printf "%s/command-signing-keyring.json" $material)
      "spool_root" $r.spoolRoot
      "spool_key_path" (printf "%s/worker-output-spool-key" $material)
      "agent_checkpoint_connection_path" (printf "%s/agent-checkpoint-connection" $material)
      "limits" $r.limits
    ) }}
  {{- if eq (include "elitea-worker.isRust" .) "true" }}
  # The Rust worker's second mandatory file. It carries the rule the Python
  # worker reads from ELITEA_SENSITIVE_TOOLS, so `sensitiveTools` stays the one
  # place an operator writes it for either implementation.
  #
  # `fromJson` is what makes that possible: the value is a JSON STRING because
  # an environment variable can hold nothing else, and this file needs the
  # decoded object. A malformed string fails the render here, which is where an
  # operator can still see it — the Rust worker would instead reject the file at
  # startup and CrashLoopBackOff.
  #
  # The `toolkit_security` key must be present even when it is empty: the
  # worker refuses a document without it (execution/production.rs). Its own
  # accepted keys are a closed set — blocked_toolkits, blocked_tools,
  # sensitive_tools, sensitive_action_company_name,
  # sensitive_action_message_template — and anything else is rejected, so this
  # writes only what the operator actually set.
  toolkit-security.json: |
    {{ toJson (dict "toolkit_security" (dict "sensitive_tools" (fromJson $r.sensitiveTools))) }}
  {{- end }}
{{- end }}
