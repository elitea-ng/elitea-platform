{{- if and .Values.worker.enabled .Values.worker.platformEdge.enabled .Values.networkPolicies.enabled }}
{{- $edge := .Values.worker.platformEdge }}
# The platform edge terminates TLS for the worker (and, when the callback hop
# goes through it, DeepWiki) and forwards to elitea-main over HTTP.
#
#   ingress  443 from the worker pods, elitea-main, DeepWiki when
#            deepwiki.callbackViaPlatformEdge is set, and probeFrom.
#   egress   elitea-main's HTTP port and cluster DNS, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $edge.serviceName }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-edge
spec:
  podSelector:
    matchLabels:
      {{- include "elitea-worker-python.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform-edge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 443
          protocol: TCP
      from:
        {{- include "elitea.netpol.workerPeer" . | nindent 8 }}
        {{- include "elitea.netpol.mainPeer" . | nindent 8 }}
        {{- if and .Values.deepwiki.enabled .Values.deepwiki.callbackViaPlatformEdge }}
        {{- include "elitea.netpol.providerPeer" (dict "ctx" . "provider" "deepwiki") | nindent 8 }}
        {{- end }}
        {{- with .Values.networkPolicies.probeFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  egress:
    # elitea-main's HTTP container port (the Service port maps onto it).
    - ports:
        - port: 8080
          protocol: TCP
      to:
        {{- include "elitea.netpol.mainPeer" . | nindent 8 }}
    {{- include "elitea.netpol.dnsEgress" . | nindent 4 }}
{{- end }}
