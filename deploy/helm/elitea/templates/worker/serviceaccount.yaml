{{- if and .Values.worker.enabled .Values.worker.serviceAccount.create }}
# The worker's own ServiceAccount (#2953): before it the worker ran as the
# namespace's `default` account. No Role is bound to it, and its token is not
# mounted (worker.serviceAccount.automountToken).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-worker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elitea-worker.labels" . | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "elitea.automountToken" .Values.worker.serviceAccount }}
{{- end }}
