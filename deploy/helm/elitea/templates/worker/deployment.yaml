{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-worker-python.fullname" . }}
  labels:
    {{- include "elitea-worker-python.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- else }}
  # replicas is OMITTED, not set, while KEDA owns this Deployment.
  #
  # A `replicas:` field here is not inert: every `helm upgrade` writes it back,
  # so the fleet snaps to worker.replicaCount and KEDA scales it out again. The
  # visible symptom is a burst of terminations at each deploy, each one waiting
  # out an in-flight agent execution.
  {{- end }}
  # RollingUpdate, and the identity work that makes it correct is described in
  # the "Per-replica consumer identity" block below.
  #
  # This was Recreate, with a comment saying every replica shared one
  # consumer_id and that scaling out would need a workload session row per
  # replica as well. The first half was true. The second half was not, and it
  # is the reason the whole thing looked harder than it is — see that block for
  # the three database facts that decide it.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "elitea-worker-python.selectorLabels" . | nindent 6 }}
      # The component label is part of the SELECTOR, not decoration: the
      # platform-edge pods carry the same name/instance labels, so without it
      # this Deployment's selector is a subset of theirs and the two overlap —
      # which Kubernetes documents as undefined behaviour.
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "elitea-worker-python.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/runtime: {{ include (print $.Template.BasePath "/worker/configmap-runtime.yaml") . | sha256sum }}
    spec:
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.worker.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Runs as root because it must chown: the emptyDirs arrive owned by
        # root, and the worker's permission check rejects anything the running
        # uid does not own at 0600. It exits before the worker starts, and the
        # worker container itself never runs as root.
        - name: material
          image: {{ .Values.worker.materialInit.image }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          env:
            - name: MATERIAL_FILES
              value: {{ include "elitea-worker-python.materialFiles" . | quote }}
            - name: OWNER
              value: "{{ .Values.worker.runAsUser }}:{{ .Values.worker.runAsGroup }}"
            # The pod's own name, which is what makes this replica's Redis
            # consumer name different from its siblings'. The downward API is
            # the only source that is unique per pod, stable for the pod's
            # life, and available before the worker starts.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -ec
            - |
              # Copy each expected key, and nothing else. A key the Secret does
              # not carry stops the pod HERE, with the file name in the message,
              # rather than in a restart loop of the worker.
              for name in $MATERIAL_FILES; do
                if [ ! -f "/src/$name" ]; then
                  echo "ERROR: material Secret has no key '$name'" >&2
                  exit 1
                fi
                cp "/src/$name" "/dst/$name"
                chmod 600 "/dst/$name"
                chown "$OWNER" "/dst/$name"
              done

              # The trust bundle the worker PROCESS uses: the runtime CA plus
              # the public roots. SSL_CERT_FILE and REQUESTS_CA_BUNDLE apply to
              # every TLS connection the process makes, not only to the four
              # platform hops, so a runtime-CA-only bundle also decides what
              # happens when an agent tool dials GitHub, Jira or an HTTPS MCP
              # server — it fails the certificate check. The private CA alone
              # is right for compose, whose only egress is the /llm proxy.
              cat /dst/runtime-ca.crt /etc/ssl/certs/ca-certificates.crt \
                > /dst/trust-bundle.crt
              chmod 644 /dst/trust-bundle.crt
              chown "$OWNER" /dst/trust-bundle.crt

              # Remove anything the Secret does not carry: a stale file left in
              # a reused volume is material nobody provisioned.
              for existing in /dst/*; do
                [ -e "$existing" ] || continue
                base="$(basename "$existing")"
                keep=0
                for name in $MATERIAL_FILES trust-bundle.crt; do
                  [ "$base" = "$name" ] && keep=1
                done
                [ "$keep" -eq 1 ] || rm -f "$existing"
              done

              # ---------------------------------------------------------
              # Per-replica connection name.
              #
              # consumer_id is the worker's NATS connection NAME, one per pod,
              # so `nats server report connections` tells replicas apart.
              # Every replica pulls from the SAME durable consumer and
              # JetStream tracks each delivery itself (+WPI heartbeats, acks,
              # AckWait redelivery), so the name carries no correctness — it
              # used to be the Redis consumer NAME, whose sharing made one
              # replica refresh another's pending entries.
              #
              # The security identities — workload_session_id, producer_id,
              # the runtime client certificate and the elitea-worker NATS
              # certificate — stay SHARED: the database enforces one live
              # claim per execution, whoever asks.
              #
              # sed on one unmistakable token, not a templating language: the
              # document is strict-parsed by the worker and a general
              # substitution pass over JSON is a way to produce a file that
              # parses and means something else.
              if ! grep -q '__ELITEA_POD_NAME__' /src-runtime/runtime.json; then
                echo "ERROR: runtime.json carries no __ELITEA_POD_NAME__ placeholder;" >&2
                echo "       every replica would share one NATS connection name." >&2
                exit 1
              fi
              sed "s/__ELITEA_POD_NAME__/${POD_NAME}/g" \
                /src-runtime/runtime.json > /rendered/runtime.json
              if grep -q '__ELITEA_POD_NAME__' /rendered/runtime.json; then
                echo "ERROR: the placeholder survived substitution." >&2
                exit 1
              fi
              chmod 600 /rendered/runtime.json
              chown "$OWNER" /rendered/runtime.json

              # The output spool root must be private and owned by the worker:
              # serve.py validates it as a private directory on every start.
              chown "$OWNER" /spool
              chmod 700 /spool
              echo "runtime material installed"
          volumeMounts:
            - name: material-source
              mountPath: /src
              readOnly: true
            - name: material
              mountPath: /dst
            - name: runtime-config
              mountPath: /src-runtime
              readOnly: true
            - name: runtime-rendered
              mountPath: /rendered
            - name: spool
              mountPath: /spool
      containers:
        - name: worker
          image: "{{ include "elitea-worker.imageRepository" . }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.worker.runAsUser }}
            runAsGroup: {{ .Values.worker.runAsGroup }}
            {{- with .Values.worker.securityContext }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq (include "elitea-worker.isRust" .) "true" }}
          # The Rust worker's argument list is matched as an EXACT five-token
          # slice (services/elitea-worker-rust/src/lib.rs). Both paths must be
          # absolute, and a four-token `serve --config <path>` — the Python
          # shape below — is not a degraded mode: it is
          # `worker_serve.invalid_configuration` and an immediate exit.
          args:
            - serve
            - --config
            - /run/elitea/runtime.json
            - --toolkit-security-config
            - /run/elitea/toolkit-security.json
          {{- else }}
          # The only supported command shape: one JSON config, no env-var
          # settings. Capabilities are compiled in, and the Go side decides
          # which of them it will accept.
          args: ["serve", "--config", "/run/elitea/runtime.json"]
          {{- end }}
          env:
            {{- if eq (include "elitea-worker.isRust" .) "true" }}
            # The Rust worker hands the runtime CA to every internal client
            # EXPLICITLY in code, so the process-wide trust store governs
            # exactly one client: the remote-MCP one, which is reqwest/rustls
            # and resolves to SSL_CERT_FILE on Linux.
            #
            # It must stay the BUNDLE the init container built — the runtime CA
            # AND the public roots. This variable REPLACES the platform trust
            # store rather than adding to it, so a private-CA-only value would
            # strip the public roots that every outbound toolkit verifies
            # against, and each one would fail as
            # `native_agent.dependency_unavailable` — indistinguishable from
            # the remote server being down.
            - name: SSL_CERT_FILE
              value: /run/elitea-runtime/trust-bundle.crt
            # ELITEA_DISABLE_SYSTEM_CA and REQUESTS_CA_BUNDLE are deliberately
            # absent: both are SDK settings, and nothing in the Rust worker
            # reads either name.
            - name: ELITEA_RUST_LOG
              value: {{ .Values.worker.logLevel | quote }}
            - name: ELITEA_RUST_TRACE
              value: {{ .Values.worker.traceLevel | quote }}
            {{- else }}
            # TLS trust for platform_origin. The SDK routes verification
            # through the OS trust store on import, which cannot contain a CA
            # minted for this cluster, so that injection is disabled and the
            # two variables below cover both HTTP stacks the SDK uses:
            # `requests` for /api/v2 and httpx/openai for the model call.
            #
            # The bundle the init container built: the runtime CA AND the
            # public roots. The runtime CA alone would be tighter for the four
            # platform hops — and it is still the only thing runtime.json's
            # ca_path trusts for them — but these two variables are
            # process-wide, so a private-CA-only bundle also governs what an
            # agent tool sees when it dials a public HTTPS endpoint.
            - name: ELITEA_DISABLE_SYSTEM_CA
              value: "1"
            - name: REQUESTS_CA_BUNDLE
              value: /run/elitea-runtime/trust-bundle.crt
            - name: SSL_CERT_FILE
              value: /run/elitea-runtime/trust-bundle.crt
            # The one environment variable the worker itself reads. The Rust
            # worker carries the same rule in its toolkit-security file
            # instead; see the ConfigMap.
            - name: ELITEA_SENSITIVE_TOOLS
              value: {{ .Values.worker.runtime.sensitiveTools | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            # The RENDERED document, not the ConfigMap. The ConfigMap's copy
            # still carries the __ELITEA_POD_NAME__ placeholder; mounting it
            # here would give the worker a consumer name containing that
            # literal, identical on every replica.
            - name: runtime-rendered
              mountPath: /run/elitea/runtime.json
              subPath: runtime.json
              readOnly: true
            {{- if eq (include "elitea-worker.isRust" .) "true" }}
            - name: runtime-config
              mountPath: /run/elitea/toolkit-security.json
              subPath: toolkit-security.json
              readOnly: true
            {{- end }}
            - name: material
              mountPath: /run/elitea-runtime
              {{- if (.Values.main.runtime.rustCompiledSnapshots | default dict).enabled }}
              readOnly: true
              {{- end }}
            {{- if .Values.nats.tls.enabled }}
            # The elitea-worker NATS identity (templates/natsClient.yaml),
            # read on every reconnect so a cert-manager renewal is picked up.
            {{- include "elitea.natsClientVolumeMount" . | nindent 12 }}
            {{- end }}
            - name: spool
              mountPath: {{ .Values.worker.runtime.spoolRoot }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "elitea-worker-python.fullname" . }}-runtime
        - name: material-source
          secret:
            secretName: {{ required "materialSecretName is required" .Values.worker.materialSecretName }}
            # The init container reads these as root, so the kubelet's default
            # root ownership is enough; the copies it writes are 0600 and owned
            # by the worker.
            defaultMode: 0400
        - name: material
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.worker.materialInit.sizeLimit }}
        # Where the init container writes this pod's own runtime.json. Memory
        # backed like `material`, and for the same reason: it holds the
        # document that names this replica's identities, and it should not
        # reach a node disk.
        - name: runtime-rendered
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.worker.materialInit.sizeLimit }}
        {{- if .Values.nats.tls.enabled }}
        {{- include "elitea.natsClientVolume" (dict "secretName" (printf "%s-nats-client-tls" (include "elitea-worker-python.fullname" .))) | nindent 8 }}
        {{- end }}
        - name: spool
          emptyDir:
            sizeLimit: {{ .Values.worker.runtime.spoolSizeLimit }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
