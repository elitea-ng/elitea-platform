{{- if .Values.worker.enabled }}
{{- if .Values.worker.runtimeSession.enabled }}
# Authorizes the worker's certificate identity, by upserting the row
# elitea_runtime.workload_sessions that every runtime control-plane call is
# checked against.
#
# ORDERING IS LOAD-BEARING, and pre- rather than post- is the whole point.
# Helm creates a release's resources FIRST and runs post-install hooks after,
# so a post-install hook would let the worker start, consume commands and be
# refused before its row existed. Those refusals do not heal: a non-retryable
# rejection is written to a durable quarantine under {spool_root}/quarantine.v1
# which is seeded before intake on the next start, so the commands stay parked
# across restarts and the turns they carried are lost. A mis-ordered install
# therefore breaks chat permanently rather than briefly.
#
# BOTH hook dialects are declared because this chart is installed both ways.
# ArgoCD is the release manager on the reference deployment and reads its own
# annotation (taking precedence over Helm's); a plain `helm install` reads
# Helm's. Dropping either would leave the hook inert in one of the two worlds
# — inert in exactly the silent, hard-to-see way this Job exists to prevent.
#
# THIS ONLY RUNS ONCE, AT INSTALL/UPGRADE. Nothing else re-stamps expires_at,
# so see runtime-session-renew-cronjob.yaml in this directory for the recurring
# half of this authorization — a cluster left un-upgraded for `runtimeSession.
# ttl` goes dark with exactly this Job's absence-shaped failure otherwise. The
# two share their upsert-and-verify logic via _runtime-session.tpl so they
# cannot silently drift apart.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elitea-worker.fullname" . }}-runtime-session
  labels:
    {{- include "elitea-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-session
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # AFTER elitea-main's migration, which is weight 0 in the same pre-install
    # phase and creates the table this Job writes to. Helm runs hooks in weight
    # order and blocks on each, so a negative weight here deadlocks a fresh
    # umbrella install: this Job would sit waiting for a table whose migration
    # cannot start until it exits. It is harmless in a standalone install of
    # this chart — there is no migration hook to order against — which is
    # exactly why it survived until the two shipped in one release.
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    # ArgoCD reads its own annotations and ignores helm.sh/hook-weight, so the
    # ordering above would not hold under the release manager this chart is
    # actually deployed by. A later wave than elitea-main's migration (wave 0)
    # states the same dependency in the dialect Argo obeys.
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "elitea-worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime-session
    spec:
      restartPolicy: Never
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.worker.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.worker.runAsUser }}
        runAsGroup: {{ .Values.worker.runAsGroup }}
        fsGroup: {{ .Values.worker.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- include "elitea-worker.runtimeSessionContainer" . | nindent 8 }}
      volumes:
        {{- include "elitea-worker.runtimeSessionVolumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
