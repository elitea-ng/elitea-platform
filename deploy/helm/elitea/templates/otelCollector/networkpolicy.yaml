{{- if and .Values.otelCollector.enabled .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $senders := include "elitea.netpol.namesPeer" (dict "ctx" . "components" (list "main" "scheduler" "llmGateway" "worker" "deepwiki" "inventory" "vector")) }}
# Ingress to the bundled OTel collector (#2952). The OTLP ports
# ({{ .Values.otelCollector.service.grpcPort }} gRPC, {{ .Values.otelCollector.service.httpPort }} HTTP) admit the chart's own pods that export
# traces, each while it runs: elitea-main (which also relays the browser's
# traces), the scheduler, the LLM gateway, the worker, DeepWiki, Inventory and
# elitea-vector; and networkPolicies.otelCollector.extraIngressFrom.
# Egress is not restricted here: the exporter's sink is the operator's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "otel-collector.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- /* A rule with an empty `from` admits every source. */}}
  {{- if or $senders $np.otelCollector.extraIngressFrom }}
  ingress:
    - ports:
        - port: {{ .Values.otelCollector.service.grpcPort }}
          protocol: TCP
        - port: {{ .Values.otelCollector.service.httpPort }}
          protocol: TCP
      from:
        {{- with $senders }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $np.otelCollector.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- end }}
{{- end }}
