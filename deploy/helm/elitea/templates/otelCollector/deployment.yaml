{{- if .Values.otelCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otel-collector.fullname" . }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  {{- /* No replicas while the HPA owns the count (templates/otelCollector/hpa.yaml). */}}
  {{- if not (include "elitea.scaling.autoscaled" .Values.otelCollector) }}
  replicas: {{ .Values.otelCollector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the collector config changes — the binary reads
        # its pipeline config once at start, same reasoning as
        # templates/scheduler/deployment.yaml's checksum
        # annotation.
        checksum/config: {{ include (print $.Template.BasePath "/otelCollector/configmap.yaml") . | sha256sum }}
        {{- with .Values.otelCollector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "otel-collector.serviceAccountName" . }}
      {{- include "elitea.scaling.topologySpread" (dict "ctx" . "v" .Values.otelCollector "selector" (include "otel-collector.selectorLabels" .)) | nindent 6 }}
      {{- /*
        On SIGTERM the collector stops its receivers and flushes the batch
        processor through the exporters; the preStop sleep first takes the pod
        out of the Service so no new span lands on a receiver that closed.
      */}}
      {{- $preStop := int (dig "preStop" "sleepSeconds" 0 .Values.otelCollector) }}
      {{- include "elitea.scaling.validateGrace" (dict "field" "otelCollector" "grace" .Values.otelCollector.terminationGracePeriodSeconds "parts" (list (list "preStop.sleepSeconds" $preStop) (list "batch flush" 10))) }}
      terminationGracePeriodSeconds: {{ int .Values.otelCollector.terminationGracePeriodSeconds }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.otelCollector.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          args:
            - "--config=/etc/otel-collector-config.yaml"
          {{- include "elitea.scaling.preStop" $preStop | nindent 10 }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
              readOnly: true
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "otel-collector.fullname" . }}-config
      {{- with .Values.otelCollector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.otelCollector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.otelCollector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
