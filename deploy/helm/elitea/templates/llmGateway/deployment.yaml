{{- if .Values.llmGateway.enabled }}
{{- /*
  Shared connection addresses, computed once from the top-level `nats` block and
  namespace-relative by default. An explicit env entry still wins. The gateway
  and the scheduler MUST name the same NATS — budget counters are shared state,
  and two components on two clusters of one counter enforce nothing.
*/ -}}
{{- $env := .Values.llmGateway.env | default dict }}
{{- if not (get $env "GATEWAY_NATS_URL") }}{{- $env = merge (deepCopy $env) (dict "GATEWAY_NATS_URL" (printf "nats://%s" (include "elitea.serviceAddr" (dict "svc" $.Values.nats "ctx" $)))) }}{{- end }}
{{- /*
  The public project, from the ONE place an operator sets it — the same value
  elitea-main gets. Set on one side only, the picker offers shared models the
  gateway cannot resolve; that is issue #316's inert state, and it was the
  DEFAULT shape whenever an operator set the main key and forgot this one.
  Empty stays empty: it keeps the old project-local behaviour, and an id naming
  a schema that does not exist would fail every credential read.
*/ -}}
{{- $aiProjectId := include "elitea.aiProjectId" . }}
{{- if and $aiProjectId (not (get $env "ELITEA_AI_PROJECT_ID")) }}{{- $env = merge (deepCopy $env) (dict "ELITEA_AI_PROJECT_ID" $aiProjectId) }}{{- end }}
{{- /*
  The database secret, resolved once for every component that reads it.
  An explicit `secrets.DATABASE_URL` under this component wins and is taken
  WHOLE — `hasKey` rather than a field-wise merge, so an entry that names a
  secret can never be completed with a key from somewhere else and end up
  pointing at a database nobody chose.
*/ -}}
{{- $secrets := .Values.llmGateway.secrets | default dict }}
{{- $pg := .Values.postgresql | default dict }}
{{- if and $pg.existingSecret (not (hasKey $secrets "DATABASE_URL")) }}
{{- $secrets = merge (deepCopy $secrets) (dict "DATABASE_URL" (dict "secretName" $pg.existingSecret "key" (required "postgresql.key is required when postgresql.existingSecret is set" $pg.key))) }}
{{- end }}
{{/*
  Guard prerequisites are checked HERE, and this Deployment always renders, so
  `helm template` runs every check on every values file (issue #467). Read
  elitea-llm-gateway.validateGuards in _helpers.tpl for what each guard protects
  and which Go source reads it.
*/}}
{{- include "elitea-llm-gateway.validateGuards" . -}}
{{/*
  Migration ordering, checked and recorded here rather than added.

  The gateway reads gateway.governance_config once at boot and enforces the
  compiled result on every request. `gateway` is a SHARED schema, created by
  migrations/shared/0067_gateway_budget_schema.sql, which templates/main/
  migrate-job.yaml applies.

  That Job is a `helm.sh/hook: pre-install,pre-upgrade`. Helm applies and AWAITS
  every pre-install/pre-upgrade hook before it touches any of the release's
  normal manifests, and this Deployment is a normal manifest. ArgoCD maps the
  same annotation to a PreSync hook, which likewise completes before Sync. So
  this Deployment cannot start before the migration completes, and it needs no
  init container or ordering annotation of its own.

  A restart LATER — an eviction, a scale-up, a node failure — can still find the
  database briefly unreachable. That is not an ordering problem and no chart
  edge would fix it, so the gateway retries its first governance load on a short
  backoff instead. See the initialLoad* constants in
  services/elitea-llm-gateway/internal/policy/store.go.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.llmGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "elitea-llm-gateway.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-llm-gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.llmGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elitea-llm-gateway.serviceAccountName" . }}
      # §9.5: >=150s so in-flight LLM streams (up to ~120s) drain on rolling
      # deploys instead of being truncated. Rises together with the gateway's
      # srv.Shutdown() context (GATEWAY_SHUTDOWN_TIMEOUT).
      terminationGracePeriodSeconds: {{ .Values.llmGateway.terminationGracePeriodSeconds }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.llmGateway.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: elitea-llm-gateway
          image: "{{ .Values.llmGateway.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.llmGateway.image.pullPolicy }}
          {{- with .Values.llmGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            {{- range $key, $value := $env }}
            {{- if not (hasKey $secrets $key) }}
            # Skipped when the same name is secret-backed below: emitting both
            # put one name twice in this list, and only ordering decided which won.
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.llmGateway.mtls.enabled }}
            # FIX 1 (HIGH): inject TLS paths so the server calls ListenAndServeTLS
            # (TLS) or ListenAndServeTLS+RequireAndVerifyClientCert (mTLS when
            # GATEWAY_TLS_CA_FILE is set). Paths mirror the volumeMount below.
            # Without these the binary sees empty vars and stays on plain HTTP
            # even though the cert secret is mounted (design §9.1, FIX #10).
            - name: GATEWAY_TLS_CERT_FILE
              value: {{ .Values.llmGateway.mtls.mountPath }}/tls.crt
            - name: GATEWAY_TLS_KEY_FILE
              value: {{ .Values.llmGateway.mtls.mountPath }}/tls.key
            - name: GATEWAY_TLS_CA_FILE
              value: {{ .Values.llmGateway.mtls.mountPath }}/ca.crt
            {{- end }}
            {{- range $name, $ref := $secrets }}
            # Sensitive vars from Kubernetes Secrets (never plaintext in env map).
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.key }}
                  optional: {{ $ref.optional | default false }}
            {{- end }}
          {{- if .Values.llmGateway.preStop.enabled }}
          lifecycle:
            preStop:
              # Quiet window so endpoints deregister before SIGTERM; keeps new
              # connections off a draining pod (§9.5). The command must be
              # runnable by the deployed image (distroless/static has no shell).
              exec:
                command:
                  {{- toYaml .Values.llmGateway.preStop.command | nindent 18 }}
          {{- end }}
          {{- if .Values.llmGateway.mtls.enabled }}
          # tcpSocket, not httpGet, and this is not a style preference.
          #
          # With mtls.enabled the server calls ListenAndServeTLS on THIS port
          # and sets ClientAuth = RequireAndVerifyClientCert
          # (internal/server/server.go). An httpGet probe speaks cleartext to
          # that listener, so every probe fails with "client sent an HTTP
          # request to an HTTPS server". Readiness never passes — and because
          # the LIVENESS probe fails with it, the kubelet restarts a process
          # that is working correctly. A default install of this chart
          # CrashLoopBackOffs a healthy gateway; that is what it did on the
          # first cluster that ran it.
          #
          # `scheme: HTTPS` is not the fix either: the kubelet presents no
          # client certificate, and this server requires and verifies one.
          #
          # So the probe asserts what can be asserted without a credential —
          # the listener accepts connections. /healthz and /readyz still exist
          # and still answer; reaching them from a probe needs either a second,
          # cleartext listener for them or a probe that can present a client
          # certificate, and both are larger changes than this file.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.llmGateway.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.llmGateway.probes.liveness.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.llmGateway.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.llmGateway.probes.readiness.failureThreshold }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: {{ .Values.llmGateway.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.llmGateway.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.llmGateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.llmGateway.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.llmGateway.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.llmGateway.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.llmGateway.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp even though this
            # binary has no application-level temp-file writes today.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.llmGateway.mtls.enabled }}
            # Server cert (tls.crt/tls.key) + CA bundle (ca.crt) for the mTLS
            # listener; the gateway requires-and-verifies the edge client cert
            # against ca.crt (design §9.1).
            - name: mtls
              mountPath: {{ .Values.llmGateway.mtls.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.llmGateway.mtls.enabled }}
        - name: mtls
          secret:
            secretName: {{ .Values.llmGateway.mtls.serverSecretName }}
        {{- end }}
      {{- with .Values.llmGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llmGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
