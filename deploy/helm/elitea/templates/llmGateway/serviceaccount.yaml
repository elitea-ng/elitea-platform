{{- if .Values.llmGateway.enabled }}
{{- if .Values.llmGateway.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-llm-gateway.serviceAccountName" . }}
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.llmGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
