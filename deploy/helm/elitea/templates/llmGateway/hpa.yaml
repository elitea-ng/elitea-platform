{{- if .Values.llmGateway.enabled }}
{{- if .Values.llmGateway.autoscaling.enabled }}
{{- /*
  The gateway's autoscaler. ONE of three renders, chosen by
  elitea.scaling.gatewaySource (templates/_scaling.tpl) from what the cluster
  and this release provide; this file renders the two HPA shapes, and
  keda-scaledobject.yaml the KEDA one.
*/ -}}
{{- $source := include "elitea.scaling.gatewaySource" . | trim }}
{{- $a := .Values.llmGateway.autoscaling }}
{{- if ne $source "keda-prometheus" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "elitea-llm-gateway.fullname" . }}
  labels:
    {{- include "elitea-llm-gateway.labels" . | nindent 4 }}
  annotations:
    # Which source rendered this HPA (llmGateway.autoscaling.source).
    elitea.ai/autoscaling-source: {{ $source }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "elitea-llm-gateway.fullname" . }}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    {{- if eq $source "adapter" }}
    # Concurrent /llm SSE streams per pod, through custom.metrics.k8s.io
    # (prometheusAdapter's one rule, or the cluster's adapter). Scale out when
    # the average approaches the tuned provider concurrency budget
    # (GATEWAY_PROVIDER_CONCURRENCY=50). A GAUGE: averaged, never rated.
    - type: Pods
      pods:
        metric:
          name: {{ $a.sseConnectionMetric }}
        target:
          type: AverageValue
          averageValue: {{ $a.targetSSEConnectionsPerPod | quote }}
    {{- else }}
    # CPU, the fallback: no KEDA prometheus trigger and no custom metrics API
    # is available. A poor signal for I/O-bound streaming (a replica full of
    # waiting streams can sit at low CPU), so it scales late; it is still a
    # signal that exists, unlike a Pods metric nothing serves.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage | default 70 }}
    {{- end }}
  behavior:
    scaleUp:
      # React quickly to connection surges but avoid thrash.
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Long window: in-flight LLM streams can run ~120s; do not scale a pod away
      # from under active streams. Aligns with terminationGracePeriodSeconds.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
{{- end }}
{{- end }}
{{- end }}
