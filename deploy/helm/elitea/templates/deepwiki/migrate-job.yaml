{{- if .Values.deepwiki.enabled }}
{{- if .Values.deepwiki.migrate.enabled }}
{{- /*
  The SAME resolution the Deployment does, from the same define. It has to be
  the same: a migration Job that reads a different database URL from the
  Deployment migrates a database the service does not use, successfully, with
  nothing to report.
*/ -}}
{{- $secrets := fromJson (include "elitea.provider.databaseSecret" (dict "ctx" . "provider" "deepwiki" "urlKey" "ELITEA_DEEPWIKI_DATABASE_URL")) }}
{{- $native := eq (.Values.deepwiki.engine.runner | toString) "native" }}
# The service's own migrations (ADR-0022 decision 3).
#
# A JOB, not a startup step, and not a second responsibility of the platform's
# elitea-migrate. Two reasons, and they point the same way:
#
#   * Two replicas starting together would both migrate. The second would race
#     the first, or find the work done and have to decide whether that is an
#     error. A Job runs once and Kubernetes already knows how to order it.
#   * The service OWNS this schema. elitea-migrate owns the product schema and
#     has never issued DDL for anything else; giving it a second corpus would
#     make one binary the owner of two things that version independently —
#     the shape shared/0064 and 0065 both describe from the other direction.
#
# The image is the service's own, so the migrations are exactly the ones the
# running code expects. They travel INSIDE the package (they used to be
# resolved relative to the source tree, which is a path that does not exist in
# an installed layout — the published image carried none at all).
#
# WHICH IMAGE (ADR-0026 phase 7). With deepwiki.engine.runner: native the Job
# runs the NATIVE image's `migrate` subcommand, so a native install pulls no
# Python image at all. It is not a second schema: the binary embeds the same
# SQL files (from the Python package's directory, at build time) and writes
# the same schema_migrations ledger with the same SHA-256 checksums
# (tests/storage_migrate.rs compares them with migrate.py's), so either runner
# can migrate a database the other one migrated, and switching runner back to
# legacy needs no migration step. It also takes an advisory lock the Python
# runner does not. Every other runner keeps the Python image's entry point.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "elitea-deepwiki.fullname" . }}-migrate
  labels:
    {{- include "elitea-deepwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: deepwiki-migrate
  annotations:
    {{- include "elitea.provider.migrateJobAnnotations" . | trim | nindent 4 }}
spec:
  backoffLimit: {{ .Values.deepwiki.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "elitea-deepwiki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: deepwiki-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.deepwiki.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # DELIBERATELY the namespace default ServiceAccount, not this component's
      # own. This Job is a pre-install HOOK and templates/deepwiki/
      # serviceaccount.yaml is an ordinary release object, so on a FIRST
      # install the hook runs before that object exists and every attempt is
      # refused with `serviceaccount "elitea-deepwiki" not found` — the Job
      # never creates a pod, and `helm install --wait` sits until it times out
      # with nothing in any pod log to read. Measured on a fresh kind install.
      # main/migrations.serviceAccountName records the same trap from the other
      # direction (values.yaml: "the chart's own ServiceAccount cannot be used
      # here"). The migration needs no Kubernetes API access — it opens
      # ELITEA_DEEPWIKI_DATABASE_URL and nothing else.
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.deepwiki.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: migrate
          {{- if $native }}
          # The native engine embeds the migrations; the host image has none.
          image: "{{ .Values.deepwiki.engine.native.image.repository }}:{{ include "elitea-deepwiki.nativeTag" . }}"
          imagePullPolicy: {{ .Values.deepwiki.engine.native.image.pullPolicy }}
          {{- else }}
          # The migrations are the Python package's; the host image has none.
          image: "{{ .Values.deepwiki.engine.image.repository }}:{{ include "elitea-deepwiki.engineTag" . }}"
          imagePullPolicy: {{ .Values.deepwiki.image.pullPolicy }}
          {{- end }}
          {{- with .Values.deepwiki.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $native }}
          # The image's ENTRYPOINT is the binary; its default CMD (`serve`)
          # starts the sidecar, so the argument replaces it. It reads only
          # ELITEA_DEEPWIKI_DATABASE_URL and exits 0 at the newest migration.
          args: ["migrate"]
          {{- else }}
          # Overrides the image's ENTRYPOINT, which starts the server.
          command: ["python", "-m", "elitea_deepwiki.storage"]
          {{- end }}
          env:
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $secrets) | trim) }}{{- . | nindent 12 }}{{- end }}
          resources:
            {{- toYaml .Values.deepwiki.migrate.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.deepwiki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deepwiki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
