{{- if .Values.deepwiki.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Named explicitly, not from the release: the server certificate's DNS SANs
  # name this Service and elitea-main verifies exactly that SAN.
  name: {{ .Values.deepwiki.service.name }}
  labels:
    {{- include "elitea-deepwiki.labels" . | nindent 4 }}
  {{- with .Values.deepwiki.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP only. The provider refuses non-mTLS traffic and elitea-main is
  # the only door (ADR-0022 decision 5) — do not switch to LoadBalancer or
  # NodePort, which would put a service that trusts its client certificate on
  # a network where anyone can attempt the handshake.
  type: ClusterIP
  ports:
    # The one port (#1359): the provider SPI and the platform operations,
    # gRPC over mutual TLS. The server certificate's SANs name this Service;
    # the NetworkPolicy admits elitea-main only.
    - name: platform-grpc
      port: {{ .Values.deepwiki.platformGrpc.port }}
      targetPort: platform-grpc
      protocol: TCP
  selector:
    {{- include "elitea-deepwiki.selectorLabels" . | nindent 4 }}
{{- end }}
