{{- if .Values.deepwiki.enabled }}
{{- $env := .Values.deepwiki.env | default dict }}
{{- /*
  The database secret, resolved once, in the same shape every other component
  in this chart uses. An explicit `secrets.ELITEA_DEEPWIKI_DATABASE_URL` under
  this component wins and is taken WHOLE — `hasKey` rather than a field-wise
  merge, so an entry that names a secret can never be completed with a key from
  somewhere else and end up pointing at a database nobody chose.

  NOTE this is the SERVICE's own database (ADR-0022 decision 3): its wiki index
  and its invocation rows. It may be the platform database, and the default
  below makes it so, but it is a separate setting because it is separate
  ownership — the service migrates it and the platform does not.
*/ -}}
{{- $secrets := fromJson (include "elitea.provider.databaseSecret" (dict "ctx" . "provider" "deepwiki" "urlKey" "ELITEA_DEEPWIKI_DATABASE_URL")) }}
{{- include "elitea-deepwiki.validateGuards" . -}}
{{- $sidecar := include "elitea-deepwiki.sidecar" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-deepwiki.fullname" . }}
  labels:
    {{- include "elitea-deepwiki.labels" . | nindent 4 }}
spec:
  {{- include "elitea.scaling.validateRange" (dict "v" .Values.deepwiki "field" "deepwiki") }}
  {{- if not (include "elitea.scaling.autoscaled" .Values.deepwiki) }}
  replicas: {{ .Values.deepwiki.replicaCount }}
  {{- end }}
  {{- /* No `replicas:` while an HPA or ScaledObject owns the Deployment (autoscaling.yaml). */}}
  selector:
    matchLabels:
      {{- include "elitea-deepwiki.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-deepwiki.selectorLabels" . | nindent 8 }}
      {{- with (include "elitea.scaling.scrapeAnnotations" (dict "v" .Values.deepwiki "port" .Values.deepwiki.admin.port "path" "/metrics") | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.deepwiki.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elitea-deepwiki.serviceAccountName" . }}
      # Long enough for an in-flight invocation to be recorded as terminal
      # before the process goes. It does not have to outlast a GENERATION:
      # invocations are durable (PostgreSQL), and a restarted service
      # reconciles rows left running by a previous owner into a terminal error
      # the caller can act on. Draining forever would be the wrong trade.
      #
      # The host stops its gRPC listener (up to 10s), waits for running
      # invocations for ELITEA_DEEPWIKI_DRAIN_TIMEOUT_SECONDS, then cancels and records
      # what is left; 10s more for the store and NATS to close.
      {{- $drain := include "elitea.integer" (dict "field" "deepwiki.env.ELITEA_DEEPWIKI_DRAIN_TIMEOUT_SECONDS" "value" (get $env "ELITEA_DEEPWIKI_DRAIN_TIMEOUT_SECONDS" | default "30" | toString) "min" 0) | int }}
      {{- include "elitea.scaling.validateGrace" (dict "field" "deepwiki" "grace" .Values.deepwiki.terminationGracePeriodSeconds "parts" (list (list "gRPC stop" 10) (list "ELITEA_DEEPWIKI_DRAIN_TIMEOUT_SECONDS" $drain) (list "store and NATS close" 10))) }}
      terminationGracePeriodSeconds: {{ int .Values.deepwiki.terminationGracePeriodSeconds }}
      {{- include "elitea.scaling.topologySpread" (dict "ctx" . "v" .Values.deepwiki "selector" (include "elitea-deepwiki.selectorLabels" .)) | nindent 6 }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.deepwiki.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: elitea-deepwiki
          image: "{{ .Values.deepwiki.image.repository }}:{{ .Values.deepwiki.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.deepwiki.image.pullPolicy }}
          {{- with .Values.deepwiki.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # The one listener (#1359): the provider SPI
            # (elitea.subapp.v1.ProviderService, elitea-main's facade) and the
            # platform operations, both gRPC behind the mTLS terminus below.
            - name: platform-grpc
              containerPort: {{ .Values.deepwiki.platformGrpc.port }}
              protocol: TCP
            # The admin port: /healthz and /readyz, plain HTTP, for the probes.
            - name: admin
              containerPort: {{ .Values.deepwiki.admin.port }}
              protocol: TCP
          env:
            {{- range $key, $value := $env }}
            {{- if not (hasKey $secrets $key) }}
            # Skipped when the same name is secret-backed below: emitting both
            # puts one name twice in this list, and only ordering decides which
            # wins.
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.deepwiki.mtls.enabled }}
            # The mTLS terminus. Without these the service serves plain HTTP,
            # and its own refusal of non-mTLS traffic has nothing to enforce —
            # the same shape the gateway's FIX #10 records.
            - name: ELITEA_DEEPWIKI_TLS_CERTFILE
              value: {{ .Values.deepwiki.mtls.mountPath }}/tls.crt
            - name: ELITEA_DEEPWIKI_TLS_KEYFILE
              value: {{ .Values.deepwiki.mtls.mountPath }}/tls.key
            - name: ELITEA_DEEPWIKI_TLS_CA_FILE
              value: {{ .Values.deepwiki.mtls.mountPath }}/ca.crt
            {{- end }}
            # The listener's allowlist: only the identities listed may call
            # it, by their verified client certificate (elitea-main's facade
            # client certificate, by default).
            - name: ELITEA_DEEPWIKI_PLATFORM_CLIENTS
              value: {{ join "," .Values.deepwiki.platformGrpc.clients | quote }}
            - name: ELITEA_DEEPWIKI_PLATFORM_GRPC_ADDR
              value: {{ printf ":%d" (.Values.deepwiki.platformGrpc.port | int) | quote }}
            - name: ELITEA_DEEPWIKI_ADMIN_ADDR
              value: {{ printf ":%d" (.Values.deepwiki.admin.port | int) | quote }}
            {{- if not (hasKey $env "ELITEA_DEEPWIKI_NATS_URL") }}
            # The cancellation fan-out (#1359): a cancel that lands on one
            # replica stops the run on the replica that holds it. Core NATS,
            # the SUBAPP account, this application's subjects only.
            - name: ELITEA_DEEPWIKI_NATS_URL
              value: {{ include "elitea.natsUrl" . | quote }}
            {{- end }}
            {{- if .Values.natsClient.tls.enabled }}
            # Its NATS identity, elitea-deepwiki (templates/natsClient.yaml).
            - name: ELITEA_DEEPWIKI_NATS_TLS_CA_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "ca.crt" "ctx" $) }}
            - name: ELITEA_DEEPWIKI_NATS_TLS_CERT_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "tls.crt" "ctx" $) }}
            - name: ELITEA_DEEPWIKI_NATS_TLS_KEY_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "tls.key" "ctx" $) }}
            {{- end }}
            # The artifact hop (#1359 U5): wiki uploads and reads go over
            # elitea.runtime.v1.ArtifactObjectService on elitea-main's platform
            # listener: trust the runtime CA there, apart from the provider's
            # own client CA, and present the callback client identity
            # (dns:elitea-subapp-callback).
            - name: ELITEA_DEEPWIKI_ARTIFACT_SERVICE_URL
              value: {{ include "elitea-main.modelServiceOrigin" . | quote }}
            - name: ELITEA_DEEPWIKI_CALLBACK_CA_FILE
              value: {{ include "elitea-deepwiki.runtimeCaPath" . }}/runtime-ca.crt
            - name: ELITEA_DEEPWIKI_CALLBACK_CERT_FILE
              value: {{ include "elitea-deepwiki.callbackClientPath" . }}/tls.crt
            - name: ELITEA_DEEPWIKI_CALLBACK_KEY_FILE
              value: {{ include "elitea-deepwiki.callbackClientPath" . }}/tls.key
            # Sensitive vars from Kubernetes Secrets, never plaintext in the
            # env map above.
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $secrets) | trim) }}{{- . | nindent 12 }}{{- end }}
          # httpGet on the admin port: the gRPC listener requires and verifies a
          # client certificate, and the kubelet presents none. Liveness is
          # /healthz (the process is up); readiness is /readyz, which fails
          # while this replica does not hold its invocation-store owner claim
          # (#1359), so a replica that refuses new invocations leaves the
          # Service instead of receiving them.
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: {{ .Values.deepwiki.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.deepwiki.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: {{ .Values.deepwiki.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.deepwiki.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.deepwiki.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: engine-socket
              mountPath: {{ .Values.deepwiki.engine.socketDir }}
            {{- with (include "elitea.provider.mtlsVolumeMount" (dict "ctx" . "provider" "deepwiki") | trim) }}{{- . | nindent 12 }}{{- end }}
            {{- if .Values.natsClient.tls.enabled }}
            {{- include "elitea.natsClientVolumeMount" . | nindent 12 }}
            {{- end }}
            - name: runtime-ca
              mountPath: {{ include "elitea-deepwiki.runtimeCaPath" . }}
              readOnly: true
            - name: callback-client
              mountPath: {{ include "elitea-deepwiki.callbackClientPath" . }}
              readOnly: true
        {{- if eq $sidecar "native" }}
        # The engine sidecar (ADR-0023 H2, ADR-0026): the Rust-native engine,
        # reached by the host over the shared socket. No port, no TLS, no
        # identity — the socket directory is the only way in. One distroless
        # binary: the image's own ENTRYPOINT/CMD (`elitea-deepwiki-engine
        # serve`) is the sidecar, so no command is set. Its runner is
        # deepwiki.engine.runner: native, or fixture (canned results, no
        # database read).
        - name: engine
          image: "{{ .Values.deepwiki.engine.native.image.repository }}:{{ include "elitea-deepwiki.nativeTag" . }}"
          imagePullPolicy: {{ .Values.deepwiki.engine.native.image.pullPolicy }}
          {{- with .Values.deepwiki.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $nativeEnv := merge (dict
                  "ELITEA_DEEPWIKI_RUNNER" (.Values.deepwiki.engine.runner | toString)
                  "ELITEA_DEEPWIKI_WORKER_MEMORY_BYTES" (include "elitea-deepwiki.nativeWorkerMemoryBytes" .)
                  "ELITEA_DEEPWIKI_WORKER_CPU_SECONDS" (.Values.deepwiki.engine.native.workerCpuSeconds | int64 | toString)
                ) (omit $env "ELITEA_DEEPWIKI_BUILD_OWNER") }}
            {{- range $key, $value := $nativeEnv }}
            {{- if not (hasKey $secrets $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            # The build-space owner: the POD name. The startup reconciliation
            # deletes this owner's builds from earlier runs, so the owner must
            # differ between replicas and survive a restart of the container;
            # the engine refuses the shared default when a database is set.
            # A replaced pod's builds are left to the stale sweep
            # (ELITEA_DEEPWIKI_BUILD_STALE_SECONDS).
            - name: ELITEA_DEEPWIKI_BUILD_OWNER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if include "elitea-deepwiki.callbackMaterial" . }}
            # The engine reaches elitea-main only over gRPC on the platform
            # listener: model calls (ModelService, #1359 U2) and artifact-folder
            # reads (ArtifactObjectService, #1359 U5), both at this URL, which
            # the native engine requires. llm_settings.api_base is a fixed route
            # name and is never dialed. The runtime CA signs the listener's
            # certificate, and the listener admits the callback client identity
            # (dns:elitea-subapp-callback).
            - name: ELITEA_DEEPWIKI_MODEL_SERVICE_URL
              value: {{ include "elitea-main.modelServiceOrigin" . | quote }}
            - name: ELITEA_DEEPWIKI_CALLBACK_CA_FILE
              value: {{ include "elitea-deepwiki.runtimeCaPath" . }}/runtime-ca.crt
            - name: ELITEA_DEEPWIKI_CALLBACK_CERT_FILE
              value: {{ include "elitea-deepwiki.callbackClientPath" . }}/tls.crt
            - name: ELITEA_DEEPWIKI_CALLBACK_KEY_FILE
              value: {{ include "elitea-deepwiki.callbackClientPath" . }}/tls.key
            {{- end }}
            {{- if and (include "elitea-deepwiki.modelCalls" .) .Values.vector.enabled (not (hasKey $nativeEnv "ELITEA_DEEPWIKI_VECTOR_URL")) }}
            # The native runner's dense vectors (ADR-0031): this chart's
            # elitea-vector, with the invocation's callback token over the
            # callback material above. The runtime CA signs elitea-vector's
            # certificate, and elitea-vector trusts it for the callback client
            # identity. The native runner refuses to start without it
            # (elitea-deepwiki.validateGuards refuses the render first).
            - name: ELITEA_DEEPWIKI_VECTOR_URL
              value: {{ include "elitea-vector.origin" . | quote }}
            {{- end }}
            # ELITEA_DEEPWIKI_DATABASE_URL, from the secret the migrate Job
            # reads (validateGuards refuses a native runner without one).
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $secrets) | trim) }}{{- . | nindent 12 }}{{- end }}
          # Distroless: no shell, no python. The binary connects to its own
          # socket and calls the engine's gRPC Health (elitea.engine.v1).
          livenessProbe:
            exec:
              command: ["/usr/local/bin/elitea-deepwiki-engine", "healthcheck"]
            periodSeconds: {{ .Values.deepwiki.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.deepwiki.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/elitea-deepwiki-engine", "healthcheck"]
            periodSeconds: {{ .Values.deepwiki.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.deepwiki.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.deepwiki.engine.native.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Clones and the worker's job directories (mode 0700, removed when
            # the worker ends). Ephemeral by design: an index lives in
            # PostgreSQL, never here.
            - name: scratch
              mountPath: {{ .Values.deepwiki.scratch.mountPath }}
            - name: engine-socket
              mountPath: {{ .Values.deepwiki.engine.socketDir }}
            {{- if include "elitea-deepwiki.callbackMaterial" . }}
            - name: runtime-ca
              mountPath: {{ include "elitea-deepwiki.runtimeCaPath" . }}
              readOnly: true
            - name: callback-client
              mountPath: {{ include "elitea-deepwiki.callbackClientPath" . }}
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.deepwiki.scratch.sizeLimit | quote }}
        - name: engine-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if include "elitea-deepwiki.callbackMaterial" . }}
        # ONLY the runtime CA from the worker's material Secret: the Secret
        # also holds the worker's client key and signing keys, none of which
        # this pod may read.
        - name: runtime-ca
          secret:
            secretName: {{ .Values.worker.materialSecretName }}
            items:
              - key: runtime-ca.crt
                path: runtime-ca.crt
        # The callback hop's own client identity, which the platform listener
        # requires: a runtime-CA certificate that is NOT the worker's.
        - name: callback-client
          secret:
            secretName: {{ .Values.deepwiki.callbackClient.secretName }}
            defaultMode: {{ .Values.deepwiki.callbackClient.defaultMode }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- with (include "elitea.provider.mtlsVolume" (dict "ctx" . "provider" "deepwiki") | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- if .Values.natsClient.tls.enabled }}
        {{- include "elitea.natsClientVolume" (dict "secretName" (printf "%s-nats-client-tls" (include "elitea-deepwiki.fullname" .))) | nindent 8 }}
        {{- end }}
      {{- with .Values.deepwiki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deepwiki.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deepwiki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
