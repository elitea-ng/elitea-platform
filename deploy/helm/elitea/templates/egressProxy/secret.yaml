{{- if and .Values.egressProxy.enabled (not .Values.egressProxy.publicKeys.existingSecret) }}
# The run-token PUBLIC keys, one PEM file per key. Public keys are not
# secret; a Secret keeps them in the same rotation procedure as elitea-main's
# signing-key Secret (services/elitea-egress-proxy/README.md). The private
# signing key belongs to elitea-main only and never appears in these values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elitea-egress-proxy.keysSecretName" . }}
  labels:
    {{- include "elitea-egress-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $pem := .Values.egressProxy.publicKeys.keys }}
  {{ $name }}: |
    {{- $pem | toString | trim | nindent 4 }}
  {{- end }}
{{- end }}
