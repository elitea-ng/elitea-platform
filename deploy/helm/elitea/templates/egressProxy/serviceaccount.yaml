{{- if and .Values.egressProxy.enabled .Values.egressProxy.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elitea-egress-proxy.serviceAccountName" . }}
  labels:
    {{- include "elitea-egress-proxy.labels" . | nindent 4 }}
  {{- with .Values.egressProxy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
