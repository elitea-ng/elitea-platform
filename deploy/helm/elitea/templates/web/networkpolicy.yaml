{{- if and .Values.web.enabled .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# Ingress to the elitea-web pods (#1359 P3). elitea-main is the browser edge and
# relays `/app…` and `/docs…` here (ELITEA_WEB_UPSTREAM), so it is the only
# in-chart peer that needs this port. The Ingress or HTTPRoute names
# elitea-main alone, so the gateway or ingress controller is NOT admitted: a
# browser that reached the SPA directly would skip the edge's MCP carve-out and
# root redirect.
#
#   80 (http)  elitea-main, networkPolicies.web.extraIngressFrom and
#              networkPolicies.probeFrom.
#
# Kubelet probes are not subject to the policy on the CNIs this chart is tested
# with; networkPolicies.probeFrom is for those that apply it to them. Egress is
# not restricted here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elitea-web.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elitea-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "elitea-web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.main.enabled $np.web.extraIngressFrom $np.probeFrom }}
  ingress:
    - ports:
        # The container port: a NetworkPolicy matches the pod's port, not the
        # Service's, and the image's nginx listens on 80 whatever
        # web.service.port says.
        - port: http
          protocol: TCP
      from:
        {{- if .Values.main.enabled }}
        {{- include "elitea.netpol.mainPeer" . | nindent 8 }}
        {{- end }}
        {{- with $np.web.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $np.probeFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- end }}
{{- end }}
