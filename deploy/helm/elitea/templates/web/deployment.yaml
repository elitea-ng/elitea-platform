{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-web.fullname" . }}
  labels:
    {{- include "elitea-web.labels" . | nindent 4 }}
spec:
  {{- include "elitea.scaling.validateRange" (dict "v" .Values.web "field" "web") }}
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "elitea-web.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-web.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the runtime SPA config changes. config.js is
        # written by the entrypoint at container START from these env vars, so
        # without this a ConfigMap edit leaves every running pod serving the
        # old config indefinitely — the browser would keep getting stale
        # VITE_SERVER_URL with no visible sign anything was applied.
        checksum/config: {{ include (print $.Template.BasePath "/web/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "elitea-web.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- include "elitea.scaling.topologySpread" (dict "ctx" . "v" .Values.web "selector" (include "elitea-web.selectorLabels" .)) | nindent 6 }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.web.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: elitea-web
          image: "{{ .Values.web.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "elitea-web.fullname" . }}-config
          {{- if .Values.web.preStop.enabled }}
          lifecycle:
            preStop:
              # Runs BEFORE SIGTERM: lets endpoints deregister, then stops
              # nginx gracefully (SIGTERM alone is nginx's FAST shutdown and
              # aborts in-flight requests). See values.yaml.
              exec:
                command:
                  {{- toYaml .Values.web.preStop.command | nindent 18 }}
          {{- end }}
          livenessProbe:
            httpGet:
              # /app/index.html, not "/": spa.conf has no `location /`, so the
              # container root 404s on a perfectly healthy pod.
              path: {{ .Values.web.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
