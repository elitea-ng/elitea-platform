{{- /*
  Combinations this chart refuses to install, checked here so `helm template`
  runs every one of them on every values file.

  These are not style checks. Each names a configuration that installs cleanly,
  reports every pod Ready, and then fails silently at the first chat turn — the
  failure mode this chart was consolidated to remove. A refusal at render time
  costs an operator one message; the alternative costs them a debugging session
  against a system that looks healthy.
*/ -}}

{{- include "elitea.compiledSnapshots.validate" . }}
{{- include "elitea.codeNodes.validateWorker" . }}
{{- /*
  The runtime Redis (`runtimeRedis`: Deployment, Service, ConfigMap, PVC and
  the elitea-runtime-redis-material Secret) is removed. Nothing has read it
  since the command bus moved to NATS JetStream and the Form sign-in state
  moved to PostgreSQL. A values file that still carries the block — even with
  enabled=false — is refused rather than silently ignored, so the operator
  sees the removal and deletes the leftover objects (docs/UPGRADING.md).
*/ -}}
{{- if hasKey .Values "runtimeRedis" }}
{{- fail "runtimeRedis is removed: the platform runs without Redis (the runtime command bus is NATS JetStream, Form sign-in state is in PostgreSQL). Delete the runtimeRedis block from your values, then delete the leftover elitea-runtime-redis Deployment, Service, ConfigMap, PVC and the elitea-runtime-redis-material Secret. See docs/UPGRADING.md, \"runtime-redis removed\"." }}
{{- end }}

{{- if and (not .Values.networkPolicies.enabled) (not .Values.networkPolicies.externallyManaged) }}
{{- fail "networkPolicies.enabled is false. The chart's NetworkPolicies are what keep pods without a role off elitea-main, the platform edge, the worker and the sandbox supervisors. If your own NetworkPolicy already does this, say so with networkPolicies.externallyManaged=true." }}
{{- end }}

{{- if and .Values.networkPolicies.enabled .Values.main.enabled (not .Values.networkPolicies.main.ingressFrom) (not .Values.networkPolicies.main.extraIngressFrom) (not .Values.networkPolicies.main.noExternalIngress) }}
{{- fail "networkPolicies.enabled=true needs an explicit decision about who may reach elitea-main:8080 from outside this chart. List the Gateway API gateway or ingress controller as NetworkPolicyPeer entries in networkPolicies.main.ingressFrom (or networkPolicies.main.extraIngressFrom) - this includes a Gateway API HTTPRoute applied outside the chart, such as deploy/gateway-api/httproute.yaml - or set networkPolicies.main.noExternalIngress=true when only this chart's own pods reach elitea-main (for example access by kubectl port-forward only). Alternatively set networkPolicies.enabled=false together with networkPolicies.externallyManaged=true if your own policy covers elitea-main." }}
{{- end }}

{{- if and .Values.networkPolicies.enabled .Values.main.enabled .Values.main.ingress.enabled (not .Values.networkPolicies.main.ingressFrom) }}
{{- fail "main.ingress.enabled=true with networkPolicies.enabled=true needs networkPolicies.main.ingressFrom: the policy on elitea-main admits only the listed peers, and the chart cannot see the labels or namespace of your Gateway API gateway or ingress controller. List them as NetworkPolicyPeer entries, or set networkPolicies.enabled=false together with networkPolicies.externallyManaged=true if your own policy covers elitea-main." }}
{{- end }}

{{- range $key := list "ingressFrom" "extraIngressFrom" }}
{{- range $peer := (index $.Values.networkPolicies.main $key) }}
{{- range $label, $value := (dig "namespaceSelector" "matchLabels" dict $peer) }}
{{- if eq (toString $value) "" }}
{{- fail (printf "networkPolicies.main.%s has a namespaceSelector label %q with an empty value, which selects no namespace: the entry is an unfilled placeholder. Give it the gateway's namespace, or remove it." $key $label) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.networkPolicies.enabled .Values.worker.enabled .Values.worker.platformEdge.enabled (ne .Values.worker.platformEdge.mainService (include "elitea-main.fullname" .)) }}
{{- fail (printf "worker.platformEdge.mainService is %q, but the platform edge NetworkPolicy admits egress only to this chart's elitea-main pods (Service %q). Point the edge at that Service, or set networkPolicies.enabled=false together with networkPolicies.externallyManaged=true and admit the edge's real upstream in your own policy." .Values.worker.platformEdge.mainService (include "elitea-main.fullname" .)) }}
{{- end }}

{{- if and .Values.networkPolicies.main.noExternalIngress .Values.main.enabled .Values.main.ingress.enabled }}
{{- fail "networkPolicies.main.noExternalIngress=true contradicts main.ingress.enabled=true: the Ingress or HTTPRoute exists to carry outside traffic to elitea-main. Set one of them to false, or keep noExternalIngress=false and list the gateway in networkPolicies.main.ingressFrom." }}
{{- end }}

{{- if and .Values.main.enabled .Values.main.ingress.enabled (not .Values.main.ingress.gatewayApi) .Values.main.fileConfig.authConfig.enabled (not .Values.main.ingress.identityHeadersStrippedByController) }}
{{- fail "main.ingress.enabled=true with main.ingress.gatewayApi=false renders a plain networking.k8s.io/v1 Ingress, which has no portable way to remove inbound identity headers, while main.fileConfig.authConfig.enabled=true makes elitea-main read the X-Auth-* projection. Either use main.ingress.gatewayApi=true (the HTTPRoute removes main.ingress.stripIdentityHeaders), or configure the ingress controller to delete X-Auth-Type, X-Auth-ID, X-Auth-User-ID, X-Auth-Reference, X-Auth-Signature and the other names in main.ingress.stripIdentityHeaders from inbound requests and then set main.ingress.identityHeadersStrippedByController=true." }}
{{- end }}

{{- if and .Values.main.enabled .Values.main.ingress.enabled .Values.main.ingress.gatewayApi }}
{{- $stripped := list }}
{{- range .Values.main.ingress.stripIdentityHeaders }}{{- $stripped = append $stripped (lower .) }}{{- end }}
{{- range $required := list "X-Auth-Type" "X-Auth-ID" "X-Auth-User-ID" "X-Auth-Signature" }}
{{- if not (has (lower $required) $stripped) }}
{{- fail (printf "main.ingress.stripIdentityHeaders must name %s: the HTTPRoute removes only the headers listed there, and a name left out reaches elitea-main exactly as the caller sent it. Extend the list; do not shorten it." $required) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.main.runtime.enabled) }}
{{- fail "worker.enabled=true needs main.runtime.enabled=true. The worker dials elitea-main's control, output and content listeners, and those exist only when the runtime plane is composed. Without them every chat turn is admitted over HTTP, never claimed, and durably quarantined by the worker — with nothing logged on either side. Set main.runtime.enabled=true (and its fileConfig.authConfig), or set worker.enabled=false." }}
{{- end }}

{{- if and .Values.worker.enabled (not (has .Values.worker.implementation (list "python" "rust"))) }}
{{- fail (printf "worker.implementation must be \"python\" or \"rust\", got %q. It is not a free-form label: it selects the image, the argument list and the environment, and every value other than these two would silently render the Python shape — a Rust image started with the Python argument list exits immediately with worker_serve.invalid_configuration, which reads as a crash-looping worker rather than as a typo in a values file." .Values.worker.implementation) }}
{{- end }}

{{- /*
  Guarded, and this one is easy to get wrong from a values file that predates
  the Rust worker: the log levels are only read when `implementation: rust`,
  and the worker refuses an unrecognised level at startup rather than defaulting.
  A pod that will not start because of a typo'd log level is the least
  informative failure in this chart.
*/ -}}
{{- if and .Values.worker.enabled (eq .Values.worker.implementation "rust") }}
{{- range $key := list "logLevel" "traceLevel" }}
{{- $level := index $.Values.worker $key }}
{{- if not (has $level (list "off" "error" "warn" "info" "debug" "trace")) }}
{{- fail (printf "worker.%s must be one of off, error, warn, info, debug, trace, got %q. The Rust worker validates this at startup and exits; it does not fall back to a default." $key $level) }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.worker.enabled }}
{{- range $legacy := list "redisUrl" "redisStream" "redisGroup" }}
{{- if hasKey $.Values.worker.runtime $legacy }}
{{- fail (printf "worker.runtime.%s is gone: the worker reads its commands from the NATS JetStream command bus (docs/runtime-command-bus.md). Use worker.runtime.natsUrl (empty: the top-level nats block), natsStream and natsConsumer." $legacy) }}
{{- end }}
{{- end }}
{{- range $legacy := list "redis_read_batch" "redis_block_millis" "redis_reclaim_idle_millis" "redis_reclaim_interval_millis" }}
{{- if hasKey ($.Values.worker.runtime.limits | default dict) $legacy }}
{{- fail (printf "worker.runtime.limits.%s is gone with the Redis command bus; the worker refuses unknown limits. Use nats_fetch_batch, nats_fetch_expires_millis, nats_in_progress_interval_millis and nats_retry_delay_millis." $legacy) }}
{{- end }}
{{- end }}
{{- if not (or .Values.worker.runtime.natsUrl .Values.nats.service) }}
{{- fail "worker.enabled=true needs a NATS: worker.runtime.natsUrl, or the top-level nats.service. The worker reads its commands from the JetStream command bus and nothing else; with no bus it starts, reports Ready, and consumes nothing forever." }}
{{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.dbInit.enabled) (not .Values.dbInit.externallyManaged) }}
{{- fail "worker.enabled=true with dbInit.enabled=false needs dbInit.externallyManaged=true. templates/dbInit/job.yaml is what creates the agent-state database (dbInit.agentStateDatabase) and the vector extension the worker's LangGraph checkpointer opens; with it disabled and no evidence the database exists some other way, the release installs cleanly, every pod reports Ready, and the worker fails per-execution with \"The durable agent checkpoint store is unavailable\" — an install-green-fail-later shape identical to the ones the other guards above exist to remove. Set dbInit.enabled=true, or set dbInit.externallyManaged=true after confirming the database and extension already exist." }}
{{- end }}

{{- /*
  NOT guarded: main.runtime.enabled with worker.enabled=false.
  That combination looks like the one above but is a supported topology — an
  agent worker running outside this release, authorized against
  elitea_runtime.workload_sessions by something other than this chart's hook.
  Refusing it would block a real deployment shape to catch a mistake the
  operator has to make deliberately, and it broke this repo's own render tests,
  which exercise elitea-main's runtime configuration on its own.
*/ -}}

{{- /*
  The workload session expires, and only a CronJob stops it.

  elitea_runtime.workload_sessions.expires_at is NOT NULL, and NOTHING in the
  product writes that column — VerifyActiveSession only reads it
  (repos/workload_sessions.go), and it requires
  `issued_at <= now() < expires_at AND revoked_at IS NULL`. The pre-install
  hook stamps it at install and upgrade; the renew CronJob re-stamps it on a
  schedule. Turn the CronJob off on a cluster that then goes a full ttl without
  a `helm upgrade`, and every ClaimCommand is refused — the worker starts,
  reports Ready, and consumes nothing. That signature is IDENTICAL to never
  having provisioned the row at all, which is the outage the whole Job exists
  to prevent.
*/ -}}
{{- if and .Values.worker.enabled .Values.worker.runtimeSession.enabled }}
{{- $rs := .Values.worker.runtimeSession }}
{{- if not $rs.renew.enabled }}
{{- if not $rs.renew.acknowledgeManualRenewal }}
{{- fail (printf "worker.runtimeSession.renew.enabled=false leaves elitea_runtime.workload_sessions.expires_at renewed by nothing but `helm upgrade`. The row expires %s after the last one, and every agent execution is then refused with the worker still reporting Ready — the same signature as never having been provisioned. Re-enable the CronJob, or set worker.runtimeSession.renew.acknowledgeManualRenewal=true to state that something outside this chart re-stamps the row." $rs.ttl) }}
{{- end }}
{{- end }}

{{- /*
  ttl and schedule are two halves of one interval, and values.yaml says so:
  "If you change `ttl`, re-derive this alongside it; the two are not linked
  automatically." This links them for the one schedule shape that can be read,
  which is the shape the chart ships.

  Only a day-of-month step field (a star, a slash, then N) is parsed. Any
  other cron expression is left alone rather
  than guessed at — a guard that mis-parses a schedule and refuses a correct
  one is worse than no guard.
*/ -}}
{{- if $rs.renew.enabled }}
{{- $fields := splitList " " (trim $rs.renew.schedule) }}
{{- if eq (len $fields) 5 }}
{{- $dom := index $fields 2 }}
{{- if hasPrefix "*/" $dom }}
{{- $everyDays := atoi (trimPrefix "*/" $dom) }}
{{- $ttlHours := atoi (trimSuffix "h" $rs.ttl) }}
{{- if and (gt $everyDays 0) (gt $ttlHours 0) }}
{{/*
  Two renewal windows must fit inside the ttl. Not one: a single missed run —
  an image pull failure, node pressure — would otherwise be the difference
  between a live cluster and a dark one, and the values comment already says
  the schedule "errs toward MORE frequent than a bare ttl/3 would need" for
  exactly that reason.
*/}}
{{- if lt $ttlHours (mul $everyDays 48) }}
{{- fail (printf "worker.runtimeSession.ttl is %s but renew.schedule runs every %d days, so a single missed run can outlive the session. expires_at is NOT NULL and nothing in the product re-stamps it, so an expiry refuses every agent execution while the worker still reports Ready. Give the ttl room for two renewal windows (at least %dh here), or shorten the schedule." $rs.ttl $everyDays (mul $everyDays 48)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}


{{- if .Values.worker.enabled }}
{{/*
  The consumer name must still fit after the pod's own name is appended.

  The worker bounds every identity in its deployment document at 256 bytes
  (MAX_IDENTITY_BYTES, services/elitea-worker-rust/src/config.rs:23) and
  refuses the whole document when one is longer. consumer_id is no longer just
  the configured value: the init container appends "-" and the pod name, which
  Kubernetes bounds at 63 characters.

  Without this guard an over-long consumerId is not a render error. It is a
  worker that starts, reads its config, refuses it, and exits — reported as
  `worker_serve.invalid_configuration`, which names no field. The operator sees
  a CrashLoopBackOff and a message that does not say which of the twenty-odd
  values caused it.

  192 = 256 - 63 - 1, so the check is exact rather than a margin.
*/}}
{{- $consumer := .Values.worker.runtime.consumerId | default "" }}
{{- if gt (len $consumer) 192 }}
{{- fail (printf "worker.runtime.consumerId is %d characters. Each replica's consumer name is this value plus \"-\" plus the pod name, and a pod name can be 63 characters, so the worker's 256-byte identity bound is exceeded and it refuses its whole configuration at startup with no field named. Use at most 192 characters." (len $consumer)) }}
{{- end }}
{{- end }}

{{- /*
   The pooler validates itself here, in a file that renders for every values
   file, because a half-filled pgbouncer block with pgbouncer.enabled=false is
   exactly the "looks configured and does nothing" state this file exists to
   refuse. The component's own templates would never run to check it.
*/ -}}
{{- include "elitea-pgbouncer.validate" . }}

{{- /*
   The public project must be named ONCE.

  elitea.aiProjectId reads all four places the id can be set and fails the
  render when two of them disagree. It is called HERE as well as from the three
  component templates, because a disagreement is a property of the VALUES FILE
  and must be caught even for a render that disables the components — an
  operator who templates only the gateway today installs the whole release
  tomorrow with the same file.

  The `_ :=` discards the value: this line is called for the refusal it can
  raise, not for what it returns.
*/ -}}
{{- $_ := include "elitea.aiProjectId" . }}
