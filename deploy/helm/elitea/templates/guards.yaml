{{- /*
  Combinations this chart refuses to install, checked here so `helm template`
  runs every one of them on every values file.

  These are not style checks. Each names a configuration that installs cleanly,
  reports every pod Ready, and then fails silently at the first chat turn — the
  failure mode this chart was consolidated to remove. A refusal at render time
  costs an operator one message; the alternative costs them a debugging session
  against a system that looks healthy.
*/ -}}

{{- include "elitea.applyFeatureSwitches" . }}{{- /* idempotent; see _feature-switches.tpl */}}
{{- include "elitea.compiledSnapshots.validate" . }}
{{- include "elitea.codeNodes.validateWorker" . }}
{{- include "elitea.scaling.validateClusterAddons" . }}{{- /* KEDA / prometheus-adapter: one per cluster; see _scaling.tpl */}}
{{- /*
  The runtime Redis (`runtimeRedis`: Deployment, Service, ConfigMap, PVC and
  the elitea-runtime-redis-material Secret) is removed. Nothing has read it
  since the command bus moved to NATS JetStream and the Form sign-in state
  moved to PostgreSQL. A values file that still carries the block — even with
  enabled=false — is refused rather than silently ignored, so the operator
  sees the removal and deletes the leftover objects (docs/UPGRADING.md).
*/ -}}
{{- if hasKey .Values "runtimeRedis" }}
{{- fail "runtimeRedis is removed: the platform runs without Redis (the runtime command bus is NATS JetStream, Form sign-in state is in PostgreSQL). Delete the runtimeRedis block from your values, then delete the leftover elitea-runtime-redis Deployment, Service, ConfigMap, PVC and the elitea-runtime-redis-material Secret. See docs/UPGRADING.md, \"runtime-redis removed\"." }}
{{- end }}

{{- /*
  The NATS client block was `nats` until the server was bundled into this
  chart; `nats` is now the bundled server's (the upstream nats chart's values)
  and the client contract is `natsClient`. A values file that still states the
  old client keys under `nats` would otherwise have them handed to the
  upstream chart, where `service` is a map and the rest mean nothing — the
  components would silently dial the default instead of the NATS it names.
*/ -}}
{{- $legacyNats := list -}}
{{- if kindIs "string" (get .Values.nats "service") }}{{ $legacyNats = append $legacyNats "service" }}{{ end -}}
{{- range $k := list "port" "namespace" "tls" "networkPolicyClientNamesManaged" -}}
{{- if hasKey $.Values.nats $k }}{{ $legacyNats = append $legacyNats $k }}{{ end -}}
{{- end -}}
{{- if $legacyNats }}
{{- fail (printf "nats.%s: the NATS client settings moved to natsClient (natsClient.service, .port, .namespace, .tls, .networkPolicyClientNamesManaged). `nats` now configures the NATS server this chart bundles (nats.enabled, default true). Move those keys under natsClient; for a NATS you run yourself also set nats.enabled=false. See docs/UPGRADING.md, \"One chart: NATS bundled\"." (join ", nats." $legacyNats)) }}
{{- end }}

{{- if and (not .Values.networkPolicies.enabled) (not .Values.networkPolicies.externallyManaged) }}
{{- fail "networkPolicies.enabled is false. The chart's NetworkPolicies are what keep pods without a role off elitea-main, the worker and the sandbox supervisors. If your own NetworkPolicy already does this, say so with networkPolicies.externallyManaged=true." }}
{{- end }}

{{- if and .Values.networkPolicies.enabled .Values.main.enabled (not .Values.networkPolicies.main.ingressFrom) (not .Values.networkPolicies.main.extraIngressFrom) (not .Values.networkPolicies.main.noExternalIngress) }}
{{- fail "networkPolicies.enabled=true needs an explicit decision about who may reach elitea-main:8080 from outside this chart. List the Gateway API gateway or ingress controller as NetworkPolicyPeer entries in networkPolicies.main.ingressFrom (or networkPolicies.main.extraIngressFrom) - this includes a Gateway API HTTPRoute applied outside the chart, such as deploy/gateway-api/httproute.yaml - or set networkPolicies.main.noExternalIngress=true when only this chart's own pods reach elitea-main (for example access by kubectl port-forward only). Alternatively set networkPolicies.enabled=false together with networkPolicies.externallyManaged=true if your own policy covers elitea-main." }}
{{- end }}

{{- if and .Values.networkPolicies.enabled .Values.main.enabled .Values.main.ingress.enabled (not .Values.networkPolicies.main.ingressFrom) }}
{{- fail "main.ingress.enabled=true with networkPolicies.enabled=true needs networkPolicies.main.ingressFrom: the policy on elitea-main admits only the listed peers, and the chart cannot see the labels or namespace of your Gateway API gateway or ingress controller. List them as NetworkPolicyPeer entries, or set networkPolicies.enabled=false together with networkPolicies.externallyManaged=true if your own policy covers elitea-main." }}
{{- end }}

{{- range $key := list "ingressFrom" "extraIngressFrom" }}
{{- range $peer := (index $.Values.networkPolicies.main $key) }}
{{- range $label, $value := (dig "namespaceSelector" "matchLabels" dict $peer) }}
{{- if eq (toString $value) "" }}
{{- fail (printf "networkPolicies.main.%s has a namespaceSelector label %q with an empty value, which selects no namespace: the entry is an unfilled placeholder. Give it the gateway's namespace, or remove it." $key $label) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
  worker.platformEdge is gone (#1359): elitea-main serves the worker's
  platform_origin itself, on main.runtime.listeners.platformAddress, with mTLS.
  A values file that still turns the edge on would otherwise render nothing
  for it and leave platformOrigin pointing at a Service that no longer exists.
*/ -}}
{{- if and .Values.worker.platformEdge .Values.worker.platformEdge.enabled }}
{{- fail "worker.platformEdge was removed (#1359). elitea-main now serves the worker's platform_origin on its own mTLS platform listener (main.runtime.listeners.platformAddress, default :9446). Remove worker.platformEdge, set worker.runtime.platformOrigin to https://elitea-main:9446, delete the elitea-platform-edge-tls Secret, and see docs/UPGRADING.md." }}
{{- end }}
{{- if and .Values.worker.enabled (contains "elitea-platform-edge" (.Values.worker.runtime.platformOrigin | toString)) }}
{{- fail (printf "worker.runtime.platformOrigin is %q, but the platform-edge Service was removed (#1359). Point it at elitea-main's platform listener: https://elitea-main:9446 (main.runtime.listeners.platformAddress)." .Values.worker.runtime.platformOrigin) }}
{{- end }}

{{- if and .Values.networkPolicies.main.noExternalIngress .Values.main.enabled .Values.main.ingress.enabled }}
{{- fail "networkPolicies.main.noExternalIngress=true contradicts main.ingress.enabled=true: the Ingress or HTTPRoute exists to carry outside traffic to elitea-main. Set one of them to false, or keep noExternalIngress=false and list the gateway in networkPolicies.main.ingressFrom." }}
{{- end }}

{{- /*
  No guard on a plain Ingress any more (#1359 P3). One used to refuse a
  networking.k8s.io Ingress while Form sign-in was on unless the operator
  stated that the controller removed the X-Auth-* identity headers, because
  elitea-main once trusted them from a proxy address. It reads none of them now
  and deletes every one itself (apimw.StripClientIdentityHeaders, mounted
  first in internal/api/router.go, ahead of the relay to elitea-web, so neither
  elitea-main's routes nor /app and /docs see them), so a plain Ingress is as
  safe as the HTTPRoute.

  The browser edge's exec probes (templates/main/deployment.yaml) run
  `elitea-main -healthcheck <path>`, which reads only the three probe paths;
  any other path would leave the pod never Ready.
*/ -}}
{{- /*
  main.ingress.gke wires a GKE Ingress (BackendConfig, FrontendConfig, NEG).
  None of it applies to an HTTPRoute — a GKE Gateway takes GCPBackendPolicy and
  GCPGatewayPolicy instead — so the combination would render an edge with none
  of the timeouts the streams need.
*/ -}}
{{- if and .Values.main.enabled .Values.main.ingress.enabled .Values.main.ingress.gatewayApi .Values.main.ingress.gke.enabled }}
{{- fail "main.ingress.gke.enabled=true needs main.ingress.gatewayApi=false: BackendConfig and FrontendConfig attach to a GKE Ingress, not to an HTTPRoute. For a GKE Gateway, attach a GCPBackendPolicy with a long timeoutSec to the elitea-main Service yourself." }}
{{- end }}
{{- if and .Values.main.ingress.certManager.issuer .Values.main.ingress.certManager.clusterIssuer }}
{{- fail "main.ingress.certManager: set issuer or clusterIssuer, not both. cert-manager's ingress-shim reads one of them." }}
{{- end }}
{{- if and .Values.main.enabled (include "elitea-main.webUpstream" .) }}
{{- range $probe := list "startup" "readiness" }}
{{- $path := (index $.Values.main.probes $probe).path }}
{{- if not (has $path (list "/readyz" "/startupz" "/healthz")) }}
{{- fail (printf "main.probes.%s.path is %q, but with web.enabled=true elitea-main is the browser edge and the %s probe runs `elitea-main -healthcheck <path>`, which reads only /readyz, /startupz or /healthz (the edge refuses /readyz and /startupz to a kubelet httpGet from the node)." $probe $path $probe) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.main.enabled .Values.main.ingress.enabled .Values.main.ingress.gatewayApi }}
{{- $stripped := list }}
{{- range .Values.main.ingress.stripIdentityHeaders }}{{- $stripped = append $stripped (lower .) }}{{- end }}
{{- range $required := list "X-Auth-Type" "X-Auth-ID" "X-Auth-User-ID" "X-Auth-Signature" }}
{{- if not (has (lower $required) $stripped) }}
{{- fail (printf "main.ingress.stripIdentityHeaders must name %s: the HTTPRoute removes only the headers listed there, and a name left out reaches elitea-main exactly as the caller sent it. Extend the list; do not shorten it." $required) }}
{{- end }}
{{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.main.runtime.enabled) }}
{{- fail "worker.enabled=true needs main.runtime.enabled=true. The worker dials elitea-main's control, output and content listeners, and those exist only when the runtime plane is composed. Without them every chat turn is admitted over HTTP, never claimed, and durably quarantined by the worker — with nothing logged on either side. Set main.runtime.enabled=true (and its fileConfig.authConfig), or set worker.enabled=false." }}
{{- end }}

{{- /*
  The Python worker was removed: the Rust worker is the only implementation,
  and Rust the only indexing runtime. A values file that still names the
  retired choice is refused with what to do, rather than silently rendering a
  different worker or index store than the one it asks for.
*/ -}}
{{- if and (hasKey .Values.worker "implementation") (ne (toString .Values.worker.implementation) "rust") }}
{{- fail (printf "worker.implementation=%v is no longer supported: the Python worker was removed and the Rust worker is the only one. Remove worker.implementation from your values (or set it to rust)." .Values.worker.implementation) }}
{{- end }}
{{- if not (has (toString (default "" .Values.worker.indexingRuntime)) (list "" "rust")) }}
{{- fail (printf "worker.indexingRuntime=%v is no longer supported: the Python indexing runtime was removed with the Python worker, and rust (the default) is the only one. Remove the override; indexes created under python are not migrated and are created again (ADR-0030, ADR-0031)." .Values.worker.indexingRuntime) }}
{{- end }}
{{- $rustMissing := include "elitea.rustIndexingMissing" . }}
{{- if and .Values.worker.enabled (include "elitea.indexingEnabled" .) $rustMissing }}
{{- fail (printf "the worker indexes (main.runtime.indexIngestDispatch.enabled=true) and is missing: %s. Index runs go to the Rust indexing runtime (ADR-0030, ADR-0031); set every value above, or set main.runtime.indexIngestDispatch.enabled=false to run without indexing." (replace "\n" "; " $rustMissing)) }}
{{- end }}
{{- $indexingOverride := get (.Values.main.env | default dict) "ELITEA_INDEXING_RUNTIME" }}
{{- if and $indexingOverride (ne (toString $indexingOverride) (include "elitea.indexingRuntime" .)) }}
{{- fail (printf "main.env.ELITEA_INDEXING_RUNTIME=%s disagrees with worker.indexingRuntime, which resolves to %s: elitea-main and the worker would index in different places. Set worker.indexingRuntime and remove the override." $indexingOverride (include "elitea.indexingRuntime" .)) }}
{{- end }}
{{- if and ((.Values.worker.runtime | default dict).memoryEmbeddingModel) (not (include "elitea.indexingEnabled" .)) }}
{{- fail "worker.runtime.memoryEmbeddingModel needs indexing (main.runtime.enabled=true and main.runtime.indexIngestDispatch.enabled=true, with a vector store). The Rust worker's memory toolkit keeps its memories in elitea-vector and reaches it with the claim's vector token, which exists only while the deployment indexes (worker unit M9)." }}
{{- end }}
{{- if and ((.Values.worker.extractor | default dict).enabled) (not (include "elitea.indexingEnabled" .)) }}
{{- fail "worker.extractor.enabled needs indexing (main.runtime.enabled=true and main.runtime.indexIngestDispatch.enabled=true, with a vector store). The document extraction sidecar (elitea-doc-extractor, ADR-0030 I1) is dialled by the Rust worker's index runs over a socket in the worker pod and by nothing else." }}
{{- end }}

{{- /*
  Guarded, and this one is easy to get wrong from a values file that predates
  the Rust worker: the worker refuses an unrecognised level at startup rather
  than defaulting.
  A pod that will not start because of a typo'd log level is the least
  informative failure in this chart.
*/ -}}
{{- if .Values.worker.enabled }}
{{- range $key := list "logLevel" "traceLevel" }}
{{- $level := index $.Values.worker $key }}
{{- if not (has $level (list "off" "error" "warn" "info" "debug" "trace")) }}
{{- fail (printf "worker.%s must be one of off, error, warn, info, debug, trace, got %q. The Rust worker validates this at startup and exits; it does not fall back to a default." $key $level) }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.worker.enabled }}
{{- range $legacy := list "redisUrl" "redisStream" "redisGroup" }}
{{- if hasKey $.Values.worker.runtime $legacy }}
{{- fail (printf "worker.runtime.%s is gone: the worker reads its commands from the NATS JetStream command bus (docs/runtime-command-bus.md). Use worker.runtime.natsUrl (empty: the top-level nats block), natsStream and natsConsumer." $legacy) }}
{{- end }}
{{- end }}
{{- range $legacy := list "redis_read_batch" "redis_block_millis" "redis_reclaim_idle_millis" "redis_reclaim_interval_millis" }}
{{- if hasKey ($.Values.worker.runtime.limits | default dict) $legacy }}
{{- fail (printf "worker.runtime.limits.%s is gone with the Redis command bus; the worker refuses unknown limits. Use nats_fetch_batch, nats_fetch_expires_millis, nats_in_progress_interval_millis and nats_retry_delay_millis." $legacy) }}
{{- end }}
{{- end }}
{{- if not (or .Values.worker.runtime.natsUrl .Values.natsClient.service) }}
{{- fail "worker.enabled=true needs a NATS: worker.runtime.natsUrl, or natsClient.service. The worker reads its commands from the JetStream command bus and nothing else; with no bus it starts, reports Ready, and consumes nothing forever." }}
{{- end }}
{{- end }}

{{- if and .Values.worker.enabled (not .Values.dbInit.enabled) (not .Values.dbInit.externallyManaged) }}
{{- fail "worker.enabled=true with dbInit.enabled=false needs dbInit.externallyManaged=true. templates/dbInit/job.yaml is what creates the agent-state database (dbInit.agentStateDatabase) the worker's LangGraph checkpointer opens; with it disabled and no evidence the database exists some other way, the release installs cleanly, every pod reports Ready, and the worker fails per-execution with \"The durable agent checkpoint store is unavailable\" — an install-green-fail-later shape identical to the ones the other guards above exist to remove. Set dbInit.enabled=true, or set dbInit.externallyManaged=true after confirming the database already exists." }}
{{- end }}

{{- /*
  NOT guarded: main.runtime.enabled with worker.enabled=false.
  That combination looks like the one above but is a supported topology — an
  agent worker running outside this release, authorized against
  elitea_runtime.workload_sessions by something other than this chart's hook.
  Refusing it would block a real deployment shape to catch a mistake the
  operator has to make deliberately, and it broke this repo's own render tests,
  which exercise elitea-main's runtime configuration on its own.
*/ -}}

{{- /*
  The workload session expires, and only a CronJob stops it.

  elitea_runtime.workload_sessions.expires_at is NOT NULL, and NOTHING in the
  product writes that column — VerifyActiveSession only reads it
  (repos/workload_sessions.go), and it requires
  `issued_at <= now() < expires_at AND revoked_at IS NULL`. The pre-install
  hook stamps it at install and upgrade; the renew CronJob re-stamps it on a
  schedule. Turn the CronJob off on a cluster that then goes a full ttl without
  a `helm upgrade`, and every ClaimCommand is refused — the worker starts,
  reports Ready, and consumes nothing. That signature is IDENTICAL to never
  having provisioned the row at all, which is the outage the whole Job exists
  to prevent.
*/ -}}
{{- if and .Values.worker.enabled .Values.worker.runtimeSession.enabled }}
{{- $rs := .Values.worker.runtimeSession }}
{{- if not $rs.renew.enabled }}
{{- if not $rs.renew.acknowledgeManualRenewal }}
{{- fail (printf "worker.runtimeSession.renew.enabled=false leaves elitea_runtime.workload_sessions.expires_at renewed by nothing but `helm upgrade`. The row expires %s after the last one, and every agent execution is then refused with the worker still reporting Ready — the same signature as never having been provisioned. Re-enable the CronJob, or set worker.runtimeSession.renew.acknowledgeManualRenewal=true to state that something outside this chart re-stamps the row." $rs.ttl) }}
{{- end }}
{{- end }}

{{- /*
  ttl and schedule are two halves of one interval, and values.yaml says so:
  "If you change `ttl`, re-derive this alongside it; the two are not linked
  automatically." This links them for the one schedule shape that can be read,
  which is the shape the chart ships.

  Only a day-of-month step field (a star, a slash, then N) is parsed. Any
  other cron expression is left alone rather
  than guessed at — a guard that mis-parses a schedule and refuses a correct
  one is worse than no guard.
*/ -}}
{{- if $rs.renew.enabled }}
{{- $fields := splitList " " (trim $rs.renew.schedule) }}
{{- if eq (len $fields) 5 }}
{{- $dom := index $fields 2 }}
{{- if hasPrefix "*/" $dom }}
{{- $everyDays := atoi (trimPrefix "*/" $dom) }}
{{- $ttlHours := atoi (trimSuffix "h" $rs.ttl) }}
{{- if and (gt $everyDays 0) (gt $ttlHours 0) }}
{{/*
  Two renewal windows must fit inside the ttl. Not one: a single missed run —
  an image pull failure, node pressure — would otherwise be the difference
  between a live cluster and a dark one, and the values comment already says
  the schedule "errs toward MORE frequent than a bare ttl/3 would need" for
  exactly that reason.
*/}}
{{- if lt $ttlHours (mul $everyDays 48) }}
{{- fail (printf "worker.runtimeSession.ttl is %s but renew.schedule runs every %d days, so a single missed run can outlive the session. expires_at is NOT NULL and nothing in the product re-stamps it, so an expiry refuses every agent execution while the worker still reports Ready. Give the ttl room for two renewal windows (at least %dh here), or shorten the schedule." $rs.ttl $everyDays (mul $everyDays 48)) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}


{{- if .Values.worker.enabled }}
{{/*
  The consumer name must still fit after the pod's own name is appended.

  The worker bounds every identity in its deployment document at 256 bytes
  (MAX_IDENTITY_BYTES, services/elitea-worker-rust/src/config.rs:23) and
  refuses the whole document when one is longer. consumer_id is no longer just
  the configured value: the init container appends "-" and the pod name, which
  Kubernetes bounds at 63 characters.

  Without this guard an over-long consumerId is not a render error. It is a
  worker that starts, reads its config, refuses it, and exits — reported as
  `worker_serve.invalid_configuration`, which names no field. The operator sees
  a CrashLoopBackOff and a message that does not say which of the twenty-odd
  values caused it.

  192 = 256 - 63 - 1, so the check is exact rather than a margin.
*/}}
{{- $consumer := .Values.worker.runtime.consumerId | default "" }}
{{- if gt (len $consumer) 192 }}
{{- fail (printf "worker.runtime.consumerId is %d characters. Each replica's consumer name is this value plus \"-\" plus the pod name, and a pod name can be 63 characters, so the worker's 256-byte identity bound is exceeded and it refuses its whole configuration at startup with no field named. Use at most 192 characters." (len $consumer)) }}
{{- end }}
{{- end }}

{{- /*
   The pooler validates itself here, in a file that renders for every values
   file, because a half-filled pgbouncer block with pgbouncer.enabled=false is
   exactly the "looks configured and does nothing" state this file exists to
   refuse. The component's own templates would never run to check it.
*/ -}}
{{- include "elitea-pgbouncer.validate" . }}

{{- /*
   The public project must be named ONCE.

  elitea.aiProjectId reads all four places the id can be set and fails the
  render when two of them disagree. It is called HERE as well as from the three
  component templates, because a disagreement is a property of the VALUES FILE
  and must be caught even for a render that disables the components — an
  operator who templates only the gateway today installs the whole release
  tomorrow with the same file.

  The `_ :=` discards the value: this line is called for the refusal it can
  raise, not for what it returns.
*/ -}}
{{- $_ := include "elitea.aiProjectId" . }}

{{- /*
  ADR-0034 decision 9: elitea-main's run-token signing key without the egress
  proxy signs tokens nothing verifies, and an allowlist turn is refused anyway.
  Refused, so the operator sees the half-configuration.
*/ -}}
{{- if and (not .Values.egressProxy.enabled) .Values.egressProxy.signingKey.existingSecret }}
{{- fail "egressProxy.signingKey.existingSecret is set but egressProxy.enabled is false: enable the proxy, or remove the signing key" }}
{{- end }}

{{- /*
  GCS, keyless (Workload Identity). elitea-main is the ONLY workload that
  opens the object store — the worker and the DeepWiki / Inventory hosts reach
  artifacts through its ArtifactObjectService over gRPC — so its Kubernetes
  service account is the only one that needs a Google service account.

  Without the iam.gke.io/gcp-service-account annotation the Google client
  library does not fail: Application Default Credentials fall through to the
  NODE's service account, and if that account can reach the bucket the pod
  starts, passes its readiness probe and writes every artifact under an
  identity nobody chose. That is a silent wrong answer, so it is refused here.
  GCS_ENDPOINT set (an emulator) needs no identity; main.serviceAccount.create
  false means you bring the service account, annotation included.
*/ -}}
{{- $mainEnv := .Values.main.env | default dict }}
{{- $storageBackend := get $mainEnv "STORAGE_BACKEND" | toString }}
{{- if and .Values.main.enabled (eq $storageBackend "gcs") (not (get $mainEnv "GCS_ENDPOINT")) .Values.main.serviceAccount.create (not (get (.Values.main.serviceAccount.annotations | default dict) "iam.gke.io/gcp-service-account")) }}
{{- fail "main.env.STORAGE_BACKEND is \"gcs\" with no main.serviceAccount.annotations.\"iam.gke.io/gcp-service-account\": elitea-main would reach the bucket as the NODE's service account (Application Default Credentials fall through to it). Annotate the service account with the Google service account that holds roles/storage.admin on the bucket (object access plus storage.buckets.get/update: elitea-main rewrites the bucket lifecycle at boot and exits if it cannot) and is bound to this KSA with roles/iam.workloadIdentityUser, or set main.serviceAccount.create=false and bring an annotated one." }}
{{- end }}

{{- /*
  objectInit creates an S3-compatible bucket with static keys. On GCS and Azure
  the bucket (container) is the operator's precondition, like the database: an
  application identity able to create buckets is more privilege than this
  release should hold. The Job refuses those backends when it RUNS; refused
  here so the mistake is a render error instead of a failed hook.
*/ -}}
{{- if and .Values.objectInit.enabled (has $storageBackend (list "gcs" "azure")) }}
{{- fail (printf "objectInit.enabled is true with main.env.STORAGE_BACKEND=%q: objectInit creates S3-compatible buckets only. Create the bucket/container yourself before the install and set objectInit.enabled=false." $storageBackend) }}
{{- end }}
