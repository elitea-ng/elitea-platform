{{- if .Values.runtimeRedis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-runtime-redis.fullname" . }}
  labels:
    {{- include "elitea-runtime-redis.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The dispatch streams are single-primary by contract. Recreate, not
  # RollingUpdate: two pods behind one Service would split them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "elitea-runtime-redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elitea-runtime-redis.selectorLabels" . | nindent 8 }}
      annotations:
        # The pod reads redis.conf once, at start. Without this a config edit
        # would leave every running pod serving the old file with no sign of it.
        checksum/config: {{ include (print $.Template.BasePath "/runtimeRedis/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.runtimeRedis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.runtimeRedis.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: redis
          image: "{{ .Values.runtimeRedis.image.repository }}:{{ .Values.runtimeRedis.image.tag }}"
          imagePullPolicy: {{ .Values.runtimeRedis.image.pullPolicy }}
          command: ["redis-server", "/etc/redis/redis.conf"]
          {{- with .Values.runtimeRedis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: rediss
              containerPort: {{ .Values.runtimeRedis.tlsPort }}
              protocol: TCP
          # `redis-cli ping` cannot work here: cleartext is off and the default
          # user is disabled, so the probe must speak TLS and AUTH as a real ACL
          # user. A PONG therefore proves the certificate, the ACL file and the
          # TLS listener are all good — which is exactly what dependents need.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  redis-cli --tls
                  --cacert /etc/elitea-runtime/runtime-ca.crt
                  -h 127.0.0.1 -p {{ .Values.runtimeRedis.tlsPort }}
                  --user bootstrap
                  --pass "$(cat /etc/elitea-runtime/redis-bootstrap-password)"
                  --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: rediss
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.runtimeRedis.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: material
              mountPath: /etc/elitea-runtime
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "elitea-runtime-redis.fullname" . }}-config
        - name: material
          secret:
            secretName: {{ required "materialSecretName is required" .Values.runtimeRedis.materialSecretName }}
            # 0440 with the pod's fsGroup: the official image starts as root and
            # drops to uid 999 through gosu, so the read bit has to survive that.
            defaultMode: 0440
        - name: data
          {{- if .Values.runtimeRedis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "elitea-runtime-redis.fullname" . }}-data
          {{- else }}
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          {{- end }}
      {{- with .Values.runtimeRedis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeRedis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeRedis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
