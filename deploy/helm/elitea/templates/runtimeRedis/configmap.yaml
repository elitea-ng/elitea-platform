{{- if .Values.runtimeRedis.enabled }}
# redis.conf, transcribed from deploy/runtime/redis.conf in the platform repo.
# Read that file for why each line is here; the reasons are identical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elitea-runtime-redis.fullname" . }}-config
  labels:
    {{- include "elitea-runtime-redis.labels" . | nindent 4 }}
data:
  redis.conf: |
    # Cleartext off. TLS only.
    port 0
    tls-port {{ .Values.runtimeRedis.tlsPort }}

    tls-cert-file /etc/elitea-runtime/redis-server.crt
    tls-key-file /etc/elitea-runtime/redis-server.key
    tls-ca-cert-file /etc/elitea-runtime/runtime-ca.crt

    # Clients authenticate as ACL users with a password, not with certificates:
    # go-redis builds its TLS config from a CA pool only and presents no client
    # certificate (runtimecomposition/redis.go).
    # Requiring one here would fail every dial with a handshake error that
    # reads like a trust problem.
    tls-auth-clients no

    # The Go client pins MinVersion TLS 1.3.
    tls-protocols "TLSv1.3"

    aclfile /etc/elitea-runtime/redis-users.acl

    {{- if .Values.runtimeRedis.persistence.enabled }}
    # AOF, because the keys here are NOT disposable on this deployment: the
    # in-flight dispatch commands live in this instance, and a restart without
    # an AOF loses them. RDB snapshots
    # stay off — the AOF is the durable record, and a periodic dump would only
    # add a second copy of the same secrets on the same volume.
    save ""
    appendonly yes
    appendfsync {{ .Values.runtimeRedis.persistence.appendfsync }}
    dir /data
    {{- else }}
    # Explicitly ephemeral: a restart logs out every session and strands every
    # unacknowledged dispatch command.
    save ""
    appendonly no
    {{- end }}
{{- end }}
