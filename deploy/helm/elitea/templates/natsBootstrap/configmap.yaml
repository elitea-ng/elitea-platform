{{- if .Values.natsBootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nats-bootstrap.fullname" . }}
  labels:
    {{- include "nats-bootstrap.labels" . | nindent 4 }}
  annotations:
    # Recreate before the Job runs; delete after so the CM tracks each release.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    # Argo CD maps pre-install to PreSync: it exists before the Sync-phase Job.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  bootstrap.sh: |-
{{ .Files.Get "files/nats-bootstrap.sh" | indent 4 }}
  {{- if .Values.natsBootstrap.tls.certificate.create }}
  # The Job's init container (issuer.yaml, job.yaml) creates these
  # Certificates; the chart never applies them itself.
  issue.sh: |-
{{ .Files.Get "files/nats-bootstrap-issue.sh" | indent 4 }}
  {{- range $acct := .Values.natsBootstrap.accounts }}
  certificate-{{ $acct }}.json: {{ include "nats-bootstrap.certificate" (dict "account" $acct "ctx" $) | fromYaml | toJson | quote }}
  {{- end }}
  {{- end }}
{{- end }}
