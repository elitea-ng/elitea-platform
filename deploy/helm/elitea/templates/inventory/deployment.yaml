{{- if .Values.inventory.enabled }}
{{- $env := .Values.inventory.env | default dict }}
{{- /*
  Sensitive values, resolved in the shape every other component in this chart
  uses. The HOST container gets inventory.secrets (the identity key) and the
  database URL; the ENGINE sidecar gets only the database URL (from
  inventory.secrets.ELITEA_INVENTORY_DATABASE_URL, else postgresql.
  existingSecret, the same resolution the migrate Job uses) and never the
  identity key. The database is the engine's own (ADR-0027): the graph lives in
  the inventory_graph schema, migrated by the engine image's `migrate`.

  The host reads the same database for its invocation store
  (inventory_graph.invocations, engine migration 0009): every replica shares
  it, so a poll, a cancel or a deletion is served by any replica (scaling).
*/ -}}
{{- $secrets := omit (.Values.inventory.secrets | default dict) "ELITEA_INVENTORY_DATABASE_URL" }}
{{- $dbSecrets := fromJson (include "elitea-inventory.databaseSecrets" .) }}
{{- include "elitea-inventory.validateGuards" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elitea-inventory.fullname" . }}
  labels:
    {{- include "elitea-inventory.labels" . | nindent 4 }}
spec:
  {{- include "elitea.scaling.validateRange" (dict "v" .Values.inventory "field" "inventory") }}
  {{- if not (include "elitea.scaling.autoscaled" .Values.inventory) }}
  replicas: {{ .Values.inventory.replicaCount }}
  {{- end }}
  {{- /* No `replicas:` while an HPA or ScaledObject owns the Deployment (autoscaling.yaml). */}}
  selector:
    matchLabels:
      {{- include "elitea-inventory.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "elitea-inventory.selectorLabels" . | nindent 8 }}
      {{- with (include "elitea.scaling.scrapeAnnotations" (dict "v" .Values.inventory "port" .Values.inventory.admin.port "path" "/metrics") | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.inventory.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "elitea-inventory.serviceAccountName" . }}
      # Long enough for a running ingestion to FINISH on this replica
      # (scaling). On SIGTERM the host leaves the Services, stops admitting
      # new invocations, and waits up to
      # ELITEA_INVENTORY_DRAIN_TIMEOUT_SECONDS (default 3600) for its invocations;
      # the engine sidecar keeps serving until it is idle too. A poll or a
      # cancel for them reaches a sibling, which reads the shared store. What
      # is left at the deadline is cancelled and recorded terminal.
      #
      # One clock: the preStop sleep, the gRPC listener's stop (up to 10s), the
      # drain, then 10s for the store and NATS to close.
      {{- $preStop := int (dig "preStop" "sleepSeconds" 0 .Values.inventory) }}
      {{- $drain := include "elitea.integer" (dict "field" "inventory.env.ELITEA_INVENTORY_DRAIN_TIMEOUT_SECONDS" "value" (get $env "ELITEA_INVENTORY_DRAIN_TIMEOUT_SECONDS" | default "30" | toString) "min" 0) | int }}
      {{- include "elitea.scaling.validateGrace" (dict "field" "inventory" "grace" .Values.inventory.terminationGracePeriodSeconds "parts" (list (list "preStop.sleepSeconds" $preStop) (list "gRPC stop" 10) (list "ELITEA_INVENTORY_DRAIN_TIMEOUT_SECONDS" $drain) (list "store and NATS close" 10))) }}
      terminationGracePeriodSeconds: {{ int .Values.inventory.terminationGracePeriodSeconds }}
      {{- include "elitea.scaling.topologySpread" (dict "ctx" . "v" .Values.inventory "selector" (include "elitea-inventory.selectorLabels" .)) | nindent 6 }}
      {{- include "elitea.imagePullSecrets" (dict "local" .Values.inventory.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      containers:
        - name: elitea-inventory
          image: "{{ .Values.inventory.image.repository }}:{{ .Values.inventory.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.inventory.image.pullPolicy }}
          {{- with .Values.inventory.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # The one listener (#1359): the provider SPI
            # (elitea.subapp.v1.ProviderService, elitea-main's facade) and the
            # platform operations, both gRPC behind the mTLS terminus below.
            - name: platform-grpc
              containerPort: {{ .Values.inventory.platformGrpc.port }}
              protocol: TCP
            # The admin port: /healthz and /readyz, plain HTTP, for the probes.
            - name: admin
              containerPort: {{ .Values.inventory.admin.port }}
              protocol: TCP
          env:
            {{- range $key, $value := $env }}
            {{- if not (or (hasKey $secrets $key) (hasKey $dbSecrets $key)) }}
            # Skipped when the same name is secret-backed below: emitting both
            # puts one name twice in this list, and only ordering decides which
            # wins.
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.inventory.mtls.enabled }}
            # The mTLS terminus. Without these the service serves plain HTTP,
            # and its own refusal of non-mTLS traffic has nothing to enforce.
            - name: ELITEA_INVENTORY_TLS_CERTFILE
              value: {{ .Values.inventory.mtls.mountPath }}/tls.crt
            - name: ELITEA_INVENTORY_TLS_KEYFILE
              value: {{ .Values.inventory.mtls.mountPath }}/tls.key
            - name: ELITEA_INVENTORY_TLS_CA_FILE
              value: {{ .Values.inventory.mtls.mountPath }}/ca.crt
            {{- end }}
            # The listener's allowlist: only the identities listed may call
            # it, by their verified client certificate (elitea-main's facade
            # client certificate, by default).
            - name: ELITEA_INVENTORY_PLATFORM_CLIENTS
              value: {{ join "," .Values.inventory.platformGrpc.clients | quote }}
            - name: ELITEA_INVENTORY_PLATFORM_GRPC_ADDR
              value: {{ printf ":%d" (.Values.inventory.platformGrpc.port | int) | quote }}
            - name: ELITEA_INVENTORY_ADMIN_ADDR
              value: {{ printf ":%d" (.Values.inventory.admin.port | int) | quote }}
            {{- if not (hasKey $env "ELITEA_INVENTORY_NATS_URL") }}
            # The cancellation fan-out (#1359): a cancel that lands on one
            # replica stops the run on the replica that holds it. Core NATS,
            # the SUBAPP account, this application's subjects only.
            - name: ELITEA_INVENTORY_NATS_URL
              value: {{ include "elitea.natsUrl" . | quote }}
            {{- end }}
            {{- if .Values.natsClient.tls.enabled }}
            # Its NATS identity, elitea-inventory (templates/natsClient.yaml).
            - name: ELITEA_INVENTORY_NATS_TLS_CA_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "ca.crt" "ctx" $) }}
            - name: ELITEA_INVENTORY_NATS_TLS_CERT_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "tls.crt" "ctx" $) }}
            - name: ELITEA_INVENTORY_NATS_TLS_KEY_FILE
              value: {{ include "elitea.natsClientFile" (dict "file" "tls.key" "ctx" $) }}
            {{- end }}
            # The artifact hop (#1359 U5): graph uploads and reads go over
            # elitea.runtime.v1.ArtifactObjectService on elitea-main's platform
            # listener, trusting the runtime CA and presenting the callback
            # client identity (dns:elitea-subapp-callback).
            - name: ELITEA_INVENTORY_ARTIFACT_SERVICE_URL
              value: {{ include "elitea-main.modelServiceOrigin" . | quote }}
            - name: ELITEA_INVENTORY_CALLBACK_CA_FILE
              value: {{ include "elitea-inventory.runtimeCaPath" . }}/runtime-ca.crt
            - name: ELITEA_INVENTORY_CALLBACK_CERT_FILE
              value: {{ include "elitea-inventory.callbackClientPath" . }}/tls.crt
            - name: ELITEA_INVENTORY_CALLBACK_KEY_FILE
              value: {{ include "elitea-inventory.callbackClientPath" . }}/tls.key
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $secrets) | trim) }}{{- . | nindent 12 }}{{- end }}
            # The invocation store (inventory_graph.invocations): the engine's
            # database, from the same secret the engine and the migrate Job read.
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $dbSecrets) | trim) }}{{- . | nindent 12 }}{{- end }}
          # The native sleep (Kubernetes 1.30+): DNS and the endpoints drop this
          # replica before the host stops its listener, so elitea-main's
          # round_robin sends no new call to a process that stopped taking them.
          {{- include "elitea.scaling.preStop" $preStop | nindent 10 }}
          # httpGet on the admin port: the gRPC listener requires and verifies a
          # client certificate, and the kubelet presents none. Liveness is
          # /healthz (the process is up); readiness is /readyz, which fails
          # while this replica does not hold its invocation-store owner claim
          # (#1359), so a replica that refuses new invocations leaves the
          # Service instead of receiving them.
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: {{ .Values.inventory.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.inventory.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: {{ .Values.inventory.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.inventory.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.inventory.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: engine-socket
              mountPath: {{ .Values.inventory.engine.socketDir }}
            {{- with (include "elitea.provider.mtlsVolumeMount" (dict "ctx" . "provider" "inventory") | trim) }}{{- . | nindent 12 }}{{- end }}
            {{- if .Values.natsClient.tls.enabled }}
            {{- include "elitea.natsClientVolumeMount" . | nindent 12 }}
            {{- end }}
            - name: runtime-ca
              mountPath: {{ include "elitea-inventory.runtimeCaPath" . }}
              readOnly: true
            - name: callback-client
              mountPath: {{ include "elitea-inventory.callbackClientPath" . }}
              readOnly: true
        {{- if include "elitea-inventory.sidecar" . }}
        # The engine sidecar (ADR-0023 H2, ADR-0027): the Rust-native engine,
        # reached by the host over the shared socket. No port, no TLS, no
        # identity — the socket directory is the only way in. One distroless
        # binary: the image's own ENTRYPOINT/CMD (`elitea-inventory-engine
        # serve`) is the sidecar, so no command is set. Its runner is
        # inventory.engine.runner: native, or fixture (canned graph, no
        # database read).
        - name: engine
          image: "{{ .Values.inventory.engine.image.repository }}:{{ include "elitea-inventory.engineTag" . }}"
          imagePullPolicy: {{ .Values.inventory.engine.image.pullPolicy }}
          {{- /*
            The kubelet sends SIGTERM to every container of the pod at once
            (after each container's own preStop). The engine counts only its
            own open streams, and the host still admits calls during its
            preStop sleep and its gRPC stop. So the engine sleeps through
            both (preStop.sleepSeconds + 15) before its drain starts: a call
            the host admits in that window finds the engine still serving.
            The host's grace check (preStop + 10 + drain + 10) covers this
            one (preStop + 15 + drain). Then the engine drains up to ELITEA_INVENTORY_DRAIN_TIMEOUT_SECONDS.
          */}}
          {{- $enginePreStop := add $preStop 15 }}
          {{- include "elitea.scaling.preStop" $enginePreStop | nindent 10 }}
          {{- with .Values.inventory.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $engineEnv := merge (dict "ELITEA_INVENTORY_RUNNER" (.Values.inventory.engine.runner | toString)) (omit $env "ELITEA_INVENTORY_IDENTITY_SECRET" "ELITEA_INVENTORY_RUNNER") }}
            {{- range $key, $value := $engineEnv }}
            {{- if not (hasKey $dbSecrets $key) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if include "elitea-inventory.modelCalls" . }}
            # The engine reaches elitea-main only over gRPC on the platform
            # listener: model calls (ModelService, #1359 U2), artifact-folder
            # reads (ArtifactObjectService) and investigate source-tool calls
            # (#1359 U5). llm_settings.api_base is a fixed route name and is
            # never dialed. The runtime CA signs the listener's certificate,
            # and the listener admits the callback client identity
            # (dns:elitea-subapp-callback).
            - name: ELITEA_INVENTORY_MODEL_SERVICE_URL
              value: {{ include "elitea-main.modelServiceOrigin" . | quote }}
            - name: ELITEA_INVENTORY_CALLBACK_CA_FILE
              value: {{ include "elitea-inventory.runtimeCaPath" . }}/runtime-ca.crt
            - name: ELITEA_INVENTORY_CALLBACK_CERT_FILE
              value: {{ include "elitea-inventory.callbackClientPath" . }}/tls.crt
            - name: ELITEA_INVENTORY_CALLBACK_KEY_FILE
              value: {{ include "elitea-inventory.callbackClientPath" . }}/tls.key
            {{- if and .Values.vector.enabled (not (hasKey $engineEnv "ELITEA_INVENTORY_VECTOR_URL")) }}
            # The native runner's entity vectors (ADR-0031): this chart's
            # elitea-vector, with the invocation's callback token over the
            # callback material above (runtime CA both ways). The native
            # runner refuses to start without it
            # (elitea-inventory.validateGuards refuses the render first).
            - name: ELITEA_INVENTORY_VECTOR_URL
              value: {{ include "elitea-vector.origin" . | quote }}
            {{- end }}
            {{- end }}
            # ELITEA_INVENTORY_DATABASE_URL, from the secret the migrate Job
            # reads (validateGuards refuses a native runner without one).
            {{- with (include "elitea.provider.secretEnv" (dict "secrets" $dbSecrets) | trim) }}{{- . | nindent 12 }}{{- end }}
          # Distroless: no shell, no python. The binary connects to its own
          # socket and asks it for its health.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/elitea-inventory-engine", "healthcheck"]
            periodSeconds: {{ .Values.inventory.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.inventory.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/local/bin/elitea-inventory-engine", "healthcheck"]
            periodSeconds: {{ .Values.inventory.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.inventory.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.inventory.engine.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Shallow clones of the repositories being ingested (removed after
            # each run). Ephemeral by design: the graph lives in PostgreSQL,
            # never here, and a replica that dies mid-ingestion loses only
            # work that is being redone anyway.
            - name: scratch
              mountPath: {{ .Values.inventory.scratch.mountPath }}
            - name: engine-socket
              mountPath: {{ .Values.inventory.engine.socketDir }}
            {{- if include "elitea-inventory.modelCalls" . }}
            - name: runtime-ca
              mountPath: {{ include "elitea-inventory.runtimeCaPath" . }}
              readOnly: true
            - name: callback-client
              mountPath: {{ include "elitea-inventory.callbackClientPath" . }}
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.inventory.scratch.sizeLimit | quote }}
        - name: engine-socket
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if include "elitea-inventory.callbackMaterial" . }}
        # ONLY the runtime CA from the worker's material Secret: the Secret
        # also holds the worker's client key and signing keys, none of which
        # this pod may read.
        - name: runtime-ca
          secret:
            secretName: {{ .Values.worker.materialSecretName }}
            items:
              - key: runtime-ca.crt
                path: runtime-ca.crt
        # The host's and the engine's client identity on the platform
        # listener: a runtime-CA certificate that is NOT the worker's.
        - name: callback-client
          secret:
            secretName: {{ .Values.inventory.callbackClient.secretName }}
            defaultMode: {{ .Values.inventory.callbackClient.defaultMode }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- with (include "elitea.provider.mtlsVolume" (dict "ctx" . "provider" "inventory") | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- if .Values.natsClient.tls.enabled }}
        {{- include "elitea.natsClientVolume" (dict "secretName" (printf "%s-nats-client-tls" (include "elitea-inventory.fullname" .))) | nindent 8 }}
        {{- end }}
      {{- with .Values.inventory.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
