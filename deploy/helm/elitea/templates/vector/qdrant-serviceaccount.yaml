{{- if and .Values.qdrant.enabled (not .Values.qdrant.serviceAccount.create) .Values.qdrant.serviceAccount.name }}
# The bundled Qdrant's ServiceAccount, rendered here rather than by the
# upstream qdrant subchart: the subchart's has no automountServiceAccountToken
# setting, and Qdrant never calls the Kubernetes API, so its pods must not
# carry a token. The subchart names this account (values.yaml
# `qdrant.serviceAccount`, create: false) and its pod spec sets no automount
# of its own, so the account's `false` holds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.qdrant.serviceAccount.name }}
  labels:
    {{- include "elitea-vector.qdrantLabels" . | nindent 4 }}
  annotations:
    {{- include "elitea-vector.syncWave" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
