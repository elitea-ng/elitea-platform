{{- /*
NATS client identities and the render gates for NATS URLs (#1076).

The NATS server requires TLS and maps each client certificate's URI SAN to a
user with subject-level permissions (nats.config.merge.accounts in values.yaml). This file
issues one certificate per component that dials NATS, from the NATS
CA, and refuses the URL shapes that would either fail every handshake or put
a credential into a ConfigMap.
*/ -}}
{{- $tls := .Values.natsClient.tls -}}
{{- /* ── Which components dial NATS, and the URLs this chart renders ── */ -}}
{{- $clients := list -}}
{{- $urls := dict -}}
{{- if and .Values.main.enabled (include "elitea-main.usesNats" .) -}}
{{- $clients = append $clients (dict "identity" "elitea-main" "name" (include "elitea-main.name" .) "fullname" (include "elitea-main.fullname" .) "labels" (include "elitea-main.labels" .)) -}}
{{- with get (.Values.main.env | default dict) "ELITEA_EVENTS_NATS_URL" }}{{ $_ := set $urls "main.env.ELITEA_EVENTS_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- /* elitea-main's runtime plane: the command bus producer, its own identity
       (elitea-main-runtime) in the same pod, with its own Secret and mount. */ -}}
{{- if and .Values.main.enabled (.Values.main.runtime | default dict).enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-main-runtime" "policyName" "elitea-main" "name" (include "elitea-main.name" .) "fullname" (printf "%s-runtime" (include "elitea-main.fullname" .)) "labels" (include "elitea-main.labels" .)) -}}
{{- $_ := set $urls "main.runtime.nats.url (or the `natsClient` block)" (include "elitea-main.runtimeNatsUrl" .) -}}
{{- end -}}
{{- /* The worker: the command bus consumer. */ -}}
{{- if .Values.worker.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-worker" "policyName" "elitea-worker-python" "name" (include "elitea-worker.name" .) "fullname" (include "elitea-worker.fullname" .) "labels" (include "elitea-worker.labels" .)) -}}
{{- $_ := set $urls "worker.runtime.natsUrl (or the `natsClient` block)" (.Values.worker.runtime.natsUrl | default (include "elitea.natsUrl" .)) -}}
{{- end -}}
{{- if .Values.llmGateway.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-llm-gateway" "name" (include "elitea-llm-gateway.name" .) "fullname" (include "elitea-llm-gateway.fullname" .) "labels" (include "elitea-llm-gateway.labels" .)) -}}
{{- with get (.Values.llmGateway.env | default dict) "GATEWAY_NATS_URL" }}{{ $_ := set $urls "llmGateway.env.GATEWAY_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- if .Values.scheduler.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-scheduler" "name" (include "elitea-scheduler.name" .) "fullname" (include "elitea-scheduler.fullname" .) "labels" (include "elitea-scheduler.labels" .)) -}}
{{- with get (.Values.scheduler.env | default dict) "GATEWAY_NATS_URL" }}{{ $_ := set $urls "scheduler.env.GATEWAY_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- /* The sub-application hosts: the cancellation fan-out (#1359), SUBAPP. */ -}}
{{- if .Values.deepwiki.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-deepwiki" "name" (include "elitea-deepwiki.name" .) "fullname" (include "elitea-deepwiki.fullname" .) "labels" (include "elitea-deepwiki.labels" .)) -}}
{{- with get (.Values.deepwiki.env | default dict) "ELITEA_DEEPWIKI_NATS_URL" }}{{ $_ := set $urls "deepwiki.env.ELITEA_DEEPWIKI_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- if .Values.inventory.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-inventory" "name" (include "elitea-inventory.name" .) "fullname" (include "elitea-inventory.fullname" .) "labels" (include "elitea-inventory.labels" .)) -}}
{{- with get (.Values.inventory.env | default dict) "ELITEA_INVENTORY_NATS_URL" }}{{ $_ := set $urls "inventory.env.ELITEA_INVENTORY_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- if and $clients .Values.natsClient.service -}}
{{- $_ := set $urls "the `natsClient` block (derived)" (include "elitea.natsUrl" .) -}}
{{- end -}}

{{- /* ── Gate 1: plaintext only on purpose ── */ -}}
{{- if and $clients (not $tls.enabled) (not $tls.allowPlaintext) -}}
{{- fail "natsClient.tls.enabled is false while elitea-main, its runtime plane, the LLM gateway or the scheduler dials NATS. The NATS server (the bundled `nats`, or yours) requires TLS and a client certificate, so these components would fail every connection; a plaintext NATS lets any pod read every tenant's events and reset budget counters (#1076). Keep natsClient.tls.enabled, or — for a NATS you run plaintext on purpose — also set natsClient.tls.allowPlaintext=true." -}}
{{- end -}}

{{- /* ── Gate 1b: a namespaced issuer signs only in its own namespace ── */ -}}
{{- $natsNs := .Values.natsClient.namespace | default .Release.Namespace -}}
{{- if and $clients $tls.enabled (eq ($tls.issuerRef.kind | default "Issuer") "Issuer") (ne $natsNs .Release.Namespace) -}}
{{- fail (printf "natsClient.namespace is %q but this release installs into %q, and natsClient.tls.issuerRef is a namespaced Issuer (%s). The bundled NATS CA Issuer lives in this release's namespace and signs only there, so the client Certificates this chart creates in %q would never be issued and every pod would wait for its Secret forever. Install the platform into %q, or back a ClusterIssuer with a CA used for NATS only and set natsClient.tls.issuerRef.kind=ClusterIssuer (NATS.md)." $natsNs .Release.Namespace $tls.issuerRef.name .Release.Namespace $natsNs) -}}
{{- end -}}

{{- /* ── Gate 1c: the NATS NetworkPolicy admits these pods by name ── */ -}}
{{- /*
templates/nats/networkpolicy.yaml admits 4222 from pods labelled
app.kubernetes.io/name=<identity> (its networkPolicy.clients; a second
identity in the same pod, elitea-main-runtime, and the worker, whose pods keep
the historical elitea-worker-python name (see worker/_helpers.tpl), are admitted by their pod's
name, policyName). A nameOverride
here changes that label, and the pod is then dropped at the NATS port: a
connect timeout, with nothing naming the override. So a renamed NATS client
is refused unless the operator states that nats.networkPolicy.clients says the
same (natsClient.networkPolicyClientNamesManaged).
*/ -}}
{{- if not .Values.natsClient.networkPolicyClientNamesManaged -}}
{{- range $c := $clients -}}
{{- $listed := $c.policyName | default $c.identity -}}
{{- if ne $c.name $listed -}}
{{- fail (printf "%s's pods are labelled app.kubernetes.io/name=%s (a nameOverride), but the NATS NetworkPolicy admits NATS clients by name and lists %q (nats.networkPolicy.clients, or your own NATS's policy). The pods would be dropped at the NATS port. Add %q to that list (or drop the override), then set natsClient.networkPolicyClientNamesManaged=true here to say so." $c.identity $c.name $listed $c.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* ── Gate 2: every rendered URL agrees with the posture, and carries no credential ── */ -}}
{{- range $where, $raw := $urls -}}
{{- range $one := splitList "," ($raw | toString) -}}
{{- $one = trim $one -}}
{{- if $one -}}
{{- if contains "@" $one -}}
{{- fail (printf "%s carries user information (user:password@ or token@). It is rendered into a ConfigMap, and with mTLS the client certificate is the identity. Remove the credential; an externally managed NATS URL that must stay private goes in main.secrets / llmGateway.secrets / scheduler.secrets." $where) -}}
{{- end -}}
{{- if and $tls.enabled (not (hasPrefix "tls://" $one)) -}}
{{- fail (printf "%s is %q, not tls://. natsClient.tls.enabled mounts a client certificate, and the NATS server requires TLS (#1076); a nats:// URL beside it reads as plaintext to every reviewer, and the service refuses it at boot." $where $one) -}}
{{- end -}}
{{- if and (not $tls.enabled) (hasPrefix "tls://" $one) -}}
{{- fail (printf "%s is tls:// but natsClient.tls.enabled is false, so no client certificate is mounted and the service refuses the URL at boot." $where) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* ── The certificates ── */ -}}
{{- if $tls.enabled -}}
{{- range $c := $clients }}
---
# {{ $c.identity }}'s NATS identity (#1076): its URI SAN is the user the NATS
# server's permission table names. Issued by the NATS CA, never by
# elitea-internal-ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $c.fullname }}-nats-client
  labels:
    {{- $c.labels | nindent 4 }}
spec:
  secretName: {{ $c.fullname }}-nats-client-tls
  duration: {{ $tls.duration }}
  renewBefore: {{ $tls.renewBefore }}
  isCA: false
  usages:
    - client auth
  commonName: {{ $c.identity }}
  uris:
    - spiffe://{{ $tls.trustDomain }}/nats/{{ $c.identity }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ required "natsClient.tls.issuerRef.name names the NATS CA issuer" $tls.issuerRef.name }}
    kind: {{ $tls.issuerRef.kind | default "Issuer" }}
    group: cert-manager.io
{{- end }}
{{- end }}
