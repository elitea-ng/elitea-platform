{{- /*
NATS client identities and the render gates for NATS URLs (#1076).

The NATS server requires TLS and maps each client certificate's URI SAN to a
user with subject-level permissions (deploy/helm/nats/values.yaml). This file
issues one certificate per component that dials NATS, from the NATS
CA, and refuses the URL shapes that would either fail every handshake or put
a credential into a ConfigMap.
*/ -}}
{{- $tls := .Values.nats.tls -}}
{{- /* ── Which components dial NATS, and the URLs this chart renders ── */ -}}
{{- $clients := list -}}
{{- $urls := dict -}}
{{- if and .Values.main.enabled (include "elitea-main.usesNats" .) -}}
{{- $clients = append $clients (dict "identity" "elitea-main" "name" (include "elitea-main.name" .) "fullname" (include "elitea-main.fullname" .) "labels" (include "elitea-main.labels" .)) -}}
{{- with get (.Values.main.env | default dict) "ELITEA_EVENTS_NATS_URL" }}{{ $_ := set $urls "main.env.ELITEA_EVENTS_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- /* elitea-main's runtime plane: the command bus producer, its own identity
       (elitea-main-runtime) in the same pod, with its own Secret and mount. */ -}}
{{- if and .Values.main.enabled (.Values.main.runtime | default dict).enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-main-runtime" "policyName" "elitea-main" "name" (include "elitea-main.name" .) "fullname" (printf "%s-runtime" (include "elitea-main.fullname" .)) "labels" (include "elitea-main.labels" .)) -}}
{{- $_ := set $urls "main.runtime.nats.url (or the `nats` block)" (include "elitea-main.runtimeNatsUrl" .) -}}
{{- end -}}
{{- /* The worker (Rust or Python image): the command bus consumer. */ -}}
{{- if .Values.worker.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-worker" "policyName" "elitea-worker-python" "name" (include "elitea-worker-python.name" .) "fullname" (include "elitea-worker-python.fullname" .) "labels" (include "elitea-worker-python.labels" .)) -}}
{{- $_ := set $urls "worker.runtime.natsUrl (or the `nats` block)" (.Values.worker.runtime.natsUrl | default (include "elitea.natsUrl" .)) -}}
{{- end -}}
{{- if .Values.llmGateway.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-llm-gateway" "name" (include "elitea-llm-gateway.name" .) "fullname" (include "elitea-llm-gateway.fullname" .) "labels" (include "elitea-llm-gateway.labels" .)) -}}
{{- with get (.Values.llmGateway.env | default dict) "GATEWAY_NATS_URL" }}{{ $_ := set $urls "llmGateway.env.GATEWAY_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- if .Values.scheduler.enabled -}}
{{- $clients = append $clients (dict "identity" "elitea-scheduler" "name" (include "elitea-scheduler.name" .) "fullname" (include "elitea-scheduler.fullname" .) "labels" (include "elitea-scheduler.labels" .)) -}}
{{- with get (.Values.scheduler.env | default dict) "GATEWAY_NATS_URL" }}{{ $_ := set $urls "scheduler.env.GATEWAY_NATS_URL" . }}{{ end -}}
{{- end -}}
{{- if and $clients .Values.nats.service -}}
{{- $_ := set $urls "the `nats` block (derived)" (include "elitea.natsUrl" .) -}}
{{- end -}}

{{- /* ── Gate 1: plaintext only on purpose ── */ -}}
{{- if and $clients (not $tls.enabled) (not $tls.allowPlaintext) -}}
{{- fail "nats.tls.enabled is false while elitea-main, its runtime plane, the LLM gateway or the scheduler dials NATS. The NATS chart (deploy/helm/nats) requires TLS and a client certificate, so these components would fail every connection; a plaintext NATS lets any pod read every tenant's events and reset budget counters (#1076). Keep nats.tls.enabled, or — for a NATS you run plaintext on purpose — also set nats.tls.allowPlaintext=true." -}}
{{- end -}}

{{- /* ── Gate 1b: a namespaced issuer signs only in its own namespace ── */ -}}
{{- $natsNs := .Values.nats.namespace | default .Release.Namespace -}}
{{- if and $clients $tls.enabled (eq ($tls.issuerRef.kind | default "Issuer") "Issuer") (ne $natsNs .Release.Namespace) -}}
{{- fail (printf "nats.namespace is %q but this release installs into %q, and nats.tls.issuerRef is a namespaced Issuer (%s). The NATS chart's CA Issuer lives in the NATS namespace and signs only there, so the client Certificates this chart creates in %q would never be issued and every pod would wait for its Secret forever. Install the platform into %q, or back a ClusterIssuer with a CA used for NATS only and set nats.tls.issuerRef.kind=ClusterIssuer (deploy/helm/nats README)." $natsNs .Release.Namespace $tls.issuerRef.name .Release.Namespace $natsNs) -}}
{{- end -}}

{{- /* ── Gate 1c: the NATS NetworkPolicy admits these pods by name ── */ -}}
{{- /*
deploy/helm/nats/templates/networkpolicy.yaml admits 4222 from pods labelled
app.kubernetes.io/name=<identity> (its networkPolicy.clients; a second
identity in the same pod, elitea-main-runtime, and the worker, whose pods keep
the elitea-worker-python name for either image, are admitted by their pod's
name, policyName). A nameOverride
here changes that label, and the pod is then dropped at the NATS port: a
connect timeout, with nothing naming the override. So a renamed NATS client
is refused unless the operator states that the NATS chart's list says the
same (nats.networkPolicyClientNamesManaged).
*/ -}}
{{- if not .Values.nats.networkPolicyClientNamesManaged -}}
{{- range $c := $clients -}}
{{- $listed := $c.policyName | default $c.identity -}}
{{- if ne $c.name $listed -}}
{{- fail (printf "%s's pods are labelled app.kubernetes.io/name=%s (a nameOverride), but the NATS chart's NetworkPolicy admits NATS clients by name and lists %q (deploy/helm/nats networkPolicy.clients). The pods would be dropped at the NATS port. Add %q to that list (or drop the override), then set nats.networkPolicyClientNamesManaged=true here to say so." $c.identity $c.name $listed $c.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* ── Gate 2: every rendered URL agrees with the posture, and carries no credential ── */ -}}
{{- range $where, $raw := $urls -}}
{{- range $one := splitList "," ($raw | toString) -}}
{{- $one = trim $one -}}
{{- if $one -}}
{{- if contains "@" $one -}}
{{- fail (printf "%s carries user information (user:password@ or token@). It is rendered into a ConfigMap, and with mTLS the client certificate is the identity. Remove the credential; an externally managed NATS URL that must stay private goes in main.secrets / llmGateway.secrets / scheduler.secrets." $where) -}}
{{- end -}}
{{- if and $tls.enabled (not (hasPrefix "tls://" $one)) -}}
{{- fail (printf "%s is %q, not tls://. nats.tls.enabled mounts a client certificate, and the NATS server requires TLS (#1076); a nats:// URL beside it reads as plaintext to every reviewer, and the service refuses it at boot." $where $one) -}}
{{- end -}}
{{- if and (not $tls.enabled) (hasPrefix "tls://" $one) -}}
{{- fail (printf "%s is tls:// but nats.tls.enabled is false, so no client certificate is mounted and the service refuses the URL at boot." $where) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* ── The certificates ── */ -}}
{{- if $tls.enabled -}}
{{- range $c := $clients }}
---
# {{ $c.identity }}'s NATS identity (#1076): its URI SAN is the user the NATS
# server's permission table names. Issued by the NATS CA, never by
# elitea-internal-ca.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $c.fullname }}-nats-client
  labels:
    {{- $c.labels | nindent 4 }}
spec:
  secretName: {{ $c.fullname }}-nats-client-tls
  duration: {{ $tls.duration }}
  renewBefore: {{ $tls.renewBefore }}
  isCA: false
  usages:
    - client auth
  commonName: {{ $c.identity }}
  uris:
    - spiffe://{{ $tls.trustDomain }}/nats/{{ $c.identity }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ required "nats.tls.issuerRef.name names the NATS CA issuer" $tls.issuerRef.name }}
    kind: {{ $tls.issuerRef.kind | default "Issuer" }}
    group: cert-manager.io
{{- end }}
{{- end }}
