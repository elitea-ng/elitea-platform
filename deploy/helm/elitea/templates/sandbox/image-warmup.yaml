{{- if and .Values.sandboxImageWarmup.enabled (include "elitea.sandbox.kubernetes" .) }}
{{- $w := .Values.sandboxImageWarmup }}
{{- /* Code Pods run the runner images with imagePullPolicy Never, so the
  sandbox nodes must hold them. Empty images: the two runner images;
  empty nodeSelector: the Code Pods' own (sandboxKubernetes.nodeSelector). */}}
{{- $images := $w.images | default list }}
{{- if not $images }}
{{- $byImage := dict }}
{{- range $runner := list "deno" "rust" }}
{{- $image := include "elitea.sandbox.runnerImage" (dict "ctx" $ "runner" $runner) }}
{{- if not (hasKey $byImage $image) }}
{{- $_ := set $byImage $image true }}
{{- $images = append $images (dict "name" (printf "runner-%s" $runner) "image" $image) }}
{{- end }}
{{- end }}
{{- end }}
{{- $nodeSelector := $w.nodeSelector | default .Values.sandboxKubernetes.nodeSelector }}
{{- if not $nodeSelector }}{{ fail "sandboxImageWarmup.nodeSelector must select sandbox nodes explicitly" }}{{ end }}
{{- $seen := dict }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elitea-sandbox-image-warmup
  labels:
    {{- include "elitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-image-warmup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: sandbox-image-warmup
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sandbox-image-warmup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- include "elitea.imagePullSecrets" (dict "local" $w.imagePullSecrets "global" .Values.image.pullSecrets) | nindent 6 }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- range $images }}
        {{- if not (regexMatch "^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$" .name) }}{{ fail "sandbox warmup image name must be a DNS label" }}{{ end }}
        {{- if hasKey $seen .name }}{{ fail "sandbox warmup image names must be unique" }}{{ end }}
        {{- $_ := set $seen .name true }}
        {{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .image) }}{{ fail "sandbox warmup images must use registry SHA-256 digests" }}{{ end }}
        - name: {{ .name }}
          image: {{ .image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 25m
              memory: 16Mi
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elitea-sandbox-image-warmup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sandbox-image-warmup
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
{{- end }}
