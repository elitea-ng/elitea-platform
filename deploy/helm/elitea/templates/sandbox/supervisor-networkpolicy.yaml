{{- $s := .Values.sandboxKubernetes }}
{{- if and $s.supervisor.enabled .Values.networkPolicies.enabled }}
# Ingress to the sandbox supervisor pods: each profile port admits the worker
# pods and elitea-main (code-owner recovery), and probeFrom. Nothing else in
# the cluster may open a connection.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elitea-sandbox-supervisor-netpol
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "elitea-sandbox-supervisor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range $s.supervisor.profiles }}
        - port: {{ .port }}
          protocol: TCP
        {{- end }}
      from:
        {{- include "elitea.netpol.workerPeer" . | nindent 8 }}
        {{- include "elitea.netpol.mainPeer" . | nindent 8 }}
        {{- with .Values.networkPolicies.probeFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
