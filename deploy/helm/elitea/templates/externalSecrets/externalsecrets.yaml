{{- include "elitea.applyFeatureSwitches" . }}{{- /* idempotent; see _feature-switches.tpl */}}
{{- /*
  One external-secrets.io/v1 ExternalSecret per Secret in the inventory
  (templates/externalSecrets/_inventory.tpl), producing EXACTLY the name and the
  keys the pods reference. See the `externalSecrets` block in values.yaml for
  the three ways a key finds its remote value.
*/ -}}
{{- $es := .Values.externalSecrets | default dict }}
{{- if $es.enabled }}
{{- include "elitea.externalSecrets.validate" . }}
{{- $inv := fromJson (include "elitea.externalSecrets.inventory" .) }}
{{- $mapped := $es.secrets | default dict }}
{{- /* Operator-declared extras: Secrets no pod in this chart reads but the
       install needs (the runtime CA keypair a cert-manager Issuer outside the
       chart signs from). validate has checked each declares its keys. */ -}}
{{- range $name, $m := $mapped }}
{{- if and $m (kindIs "map" $m) $m.extra (ne (toString $m.enabled) "false") }}
{{- $_ := set $inv $name (dict "keys" (keys ($m.keys | default dict) | sortAlpha) "open" false "consumers" (list "externalSecrets.secrets (extra)")) }}
{{- end }}
{{- end }}
{{- range $name := keys $inv | sortAlpha }}
{{- $entry := get $inv $name }}
{{- $m := get $mapped $name | default dict }}
{{- if ne (toString $m.enabled) "false" }}
{{- $explicit := $m.keys | default dict }}
{{- /* An open Secret's keys are the operator's: the listed ones, or, with
       neither listed, the whole remote secret extracted (validate refused
       an open Secret with no per-secret remoteKey). */ -}}
{{- $keys := $entry.keys }}
{{- if $entry.open }}{{- $keys = keys $explicit | sortAlpha }}{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "elitea.labels" $ | nindent 4 }}
    app.kubernetes.io/component: external-secret
  annotations:
    # Who reads it, so `kubectl get externalsecret -o yaml` answers "can I
    # delete this" without a search through the chart.
    elitea.ai/consumers: {{ join ", " $entry.consumers | quote }}
    # BEFORE every Job that reads a Secret. The db-init (-20), migrate (0, 5)
    # and workload-session (10) Jobs are pre-install hooks, and Helm runs hooks
    # before it creates ANY ordinary resource — so an ordinary ExternalSecret
    # would not exist yet on the first install, and the first Job would wait
    # forever on a Secret nothing fills. Argo waits for a hook's health, and
    # its built-in ExternalSecret health check is the Ready condition, so
    # under Argo the Jobs start only once the Secrets are synced.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-30"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  refreshInterval: {{ $m.refreshInterval | default $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $name }}
    # Orphan, not Owner: a hook is deleted and recreated on every upgrade
    # (before-hook-creation), and an owned Secret would be garbage-collected
    # with it — every running pod's Secret volume emptied for the seconds the
    # new ExternalSecret takes to sync. The Secret outlives the hook, and the
    # next ExternalSecret takes it over by name.
    creationPolicy: Orphan
    deletionPolicy: Retain
    {{- with $m.type }}
    template:
      type: {{ . }}
    {{- end }}
  {{- if $keys }}
  data:
    {{- range $key := $keys }}
    {{- $ref := fromJson (include "elitea.externalSecrets.remoteRef" (dict "es" $es "mapped" $m "secret" $name "key" $key)) }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $m.remoteKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
