# Nested under `main:` — this file configured the elitea-main chart when the
# platform shipped as eight charts; it configures the same component here.
#
# The CORE API only: no authentication document here, so none of the
# features that stand on the runtime plane. values.yaml turns them on by
# default (S10); this file states each one off by its own switch.
main:
  replicaCount: 1

  runtime:
    enabled: false

  image:
    tag: "shadow-v0.1"

  # The memory limit covers attachment text extraction; see values.yaml.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 1Gi

  env:
    DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

# This profile ships no edge in front of elitea-main, so nothing outside the
# chart's own pods is admitted to elitea-main:8080. A deployment that fronts it
# with an out-of-chart Gateway API HTTPRoute (deploy/gateway-api/httproute.yaml)
# or an ingress controller lists that peer in networkPolicies.main.ingressFrom
# and sets noExternalIngress back to false.
networkPolicies:
  main:
    noExternalIngress: true

# Off: each needs the runtime plane, which needs production authentication
# this overlay does not configure.
worker:
  enabled: false
vector:
  enabled: false
# The bundled Qdrant is elitea-vector's store; with vector off it is a second
# switch the render asks for by name.
qdrant:
  enabled: false
deepwiki:
  enabled: false
inventory:
  enabled: false
