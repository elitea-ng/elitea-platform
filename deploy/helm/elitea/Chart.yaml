apiVersion: v2
name: elitea
description: >-
  EliteA, as one chart. Installs the whole first-party platform — API, web,
  scheduler, LLM gateway, agent worker, vector store, the runtime dispatch bus
  (NATS JetStream, bundled by default) and the telemetry collector — from a
  single values file, and externalizes PostgreSQL and object storage behind
  one connection contract.
type: application

# THREE dependencies, fetched by `helm dependency build` from Chart.lock (all
# pinned). charts/ is never committed (.gitignore).
#
# NATS JetStream is bundled (`nats`, `nats.enabled: true` by default): the
# upstream nats chart, pinned below, with this chart's own mTLS material
# (templates/nats/) and the JetStream bootstrap Job (templates/natsBootstrap/)
# beside it, so one release is the whole platform. `nats.enabled: false` keeps
# the bring-your-own-NATS contract (`natsClient`).
#
# Qdrant is bundled the same way (`qdrant`, `qdrant.enabled: true` by
# default): the upstream qdrant chart, pinned below, behind elitea-vector. Its
# TLS certificate and NetworkPolicy are this chart's own (templates/vector/),
# because a subchart cannot read this chart's helpers. `qdrant.enabled: false`
# keeps the bring-your-own-Qdrant contract (`vector.qdrant.external`).
#
# The sandbox runtime installer (`sandboxRuntime`, off by default) is OUR
# chart, deploy/helm/elitea-sandbox-runtime, referenced by file:// so it has
# one source and is still published on its own. k3s and EKS turn it on; GKE
# leaves it off (GKE Sandbox ships the gvisor RuntimeClass).
#
# How each install path gets them:
#   * the published OCI chart carries all three as .tgz (helm package includes
#     charts/): nothing to do. This is the recommended path.
#   * Argo CD with a git source runs `helm dependency build` itself; a
#     restricted AppProject must list the nats AND qdrant repositories in
#     sourceRepos.
#   * `helm install` from a clone: deploy/helm/elitea/build-deps.sh first.
#   * air-gapped: mirror the OCI chart.
# deploy/helm/tests/render-nats-bundled.sh fails when Chart.lock and
# Chart.yaml disagree or a dependency does not resolve. To bump nats or
# qdrant: change `version` below, `helm dependency update deploy/helm/elitea`,
# commit Chart.lock.
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: nats
    # Pinned upstream chart that ships a NATS Server 2.12.x-capable layout;
    # the server image itself is pinned in values.yaml (nats.container.image).
    version: "1.3.9"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: qdrant
    # The vector store behind elitea-vector (ADR-0031). The server image is
    # pinned in values.yaml (qdrant.image.tag) to this chart's appVersion.
    version: "1.19.2"
    repository: "https://qdrant.github.io/qdrant-helm"
    condition: qdrant.enabled
  - name: elitea-sandbox-runtime
    # The node-level gVisor installer: a privileged DaemonSet and the
    # cluster-scoped `gvisor` RuntimeClass. values.yaml `sandboxRuntime`.
    alias: sandboxRuntime
    version: "0.1.0"
    repository: "file://../elitea-sandbox-runtime"
    condition: sandboxRuntime.enabled
