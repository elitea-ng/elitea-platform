apiVersion: v2
name: elitea
description: >-
  EliteA, as one chart. Installs the whole first-party platform — API, web,
  scheduler, LLM gateway, agent worker, vector store, the runtime dispatch bus
  (NATS JetStream, bundled by default) and the telemetry collector — from a
  single values file, and externalizes PostgreSQL and object storage behind
  one connection contract.
type: application

# TWO dependencies, both in charts/ so nothing is built at install time.
#
# NATS JetStream is bundled (`nats`,
# `nats.enabled: true` by default): the upstream nats chart, pinned below,
# with this chart's own mTLS material (templates/nats/) and the JetStream
# bootstrap Job (templates/natsBootstrap/) beside it, so one release is the
# whole platform. `nats.enabled: false` keeps the bring-your-own-NATS
# contract (`natsClient`).
#
# The subchart is committed UNPACKED in charts/nats/ (plain text, so
# scripts/no-binaries-check.sh stays green), next to Chart.lock. That is the
# reliable choice for every way this chart is installed:
#   * `helm install` from a clone needs no `helm dependency build`;
#   * the published OCI chart carries it (helm package includes charts/);
#   * Argo CD with a git source renders it as is. Argo CD only runs
#     `helm dependency build` when a render fails for a MISSING dependency,
#     which would also need the upstream repository allowed in the AppProject
#     and reachable from the repo-server — an air-gapped cluster has neither.
# deploy/helm/tests/render-nats-bundled.sh fails when charts/nats/ and the
# pinned version disagree. To bump: change `version` below, then
# deploy/helm/elitea/vendor-nats.sh.
#
# The sandbox runtime installer (`sandboxRuntime`, off by default) is OUR
# chart, deploy/helm/elitea-sandbox-runtime: charts/elitea-sandbox-runtime is
# a symlink to it, so it has one source and is still published on its own.
# Helm follows the link on render and copies the files on `helm package`;
# Argo CD accepts it because it stays inside the repository. k3s and EKS turn
# it on; GKE leaves it off (GKE Sandbox ships the gvisor RuntimeClass).
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: nats
    # Pinned upstream chart that ships a NATS Server 2.12.x-capable layout;
    # the server image itself is pinned in values.yaml (nats.container.image).
    version: "1.3.9"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled
  - name: elitea-sandbox-runtime
    # The node-level gVisor installer: a privileged DaemonSet and the
    # cluster-scoped `gvisor` RuntimeClass. values.yaml `sandboxRuntime`.
    alias: sandboxRuntime
    version: "0.1.0"
    repository: "file://../elitea-sandbox-runtime"
    condition: sandboxRuntime.enabled
