# EliteA — the whole platform, one chart.
#
# There are no subcharts and no dependencies. Every component lives in
# templates/<component>/ and is configured under its own key below, so a setting
# is where you would look for it and there is exactly one file to read.
#
# The keys at the top are the ones MORE THAN ONE component must agree about.
# Those are the settings that drifted while this was eight separate releases —
# one chart defaulting REDIS_URL to "" and another to "redis:6379", two
# different NATS URLs, the database secret named in four places. Stating them
# once is most of the reason this chart exists.

# ── What this chart does NOT create ─────────────────────────────────────────
#
# Checked against deploy/docker-compose.standalone-full.yml, the reference
# pylon-free stack. Every service in it is now covered by this chart except the
# ones below, which are deliberately the operator's:
#
#   PostgreSQL          `postgresql` names its secret. The operator's lifecycle
#                       is not this application's — see that block.
#   Redis, NATS         `redis` / `nats` name them. Commodity infrastructure.
#   Object storage      An S3-compatible endpoint, configured under `main.env`.
#   Ingress             The cluster's own edge. `worker.platformEdge` is NOT it:
#                       that one is internal, has no route from any gateway, and
#                       exists only because the worker refuses a plaintext
#                       platform_origin.
#
# THE ARTIFACT BUCKET MUST EXIST BEFORE THE FIRST SYNC, and this one bites
# early, but NOT the way it looks at first read. The readiness probe
# (objectStoreReadinessProbe, cmd/elitea-main/main.go) tolerates a missing
# bucket — mapS3Error maps NoSuchBucket/NotFound the same way HeadObject on a
# genuinely-missing object does, so the probe PASSES. What actually fails is
# the very next boot step, configureObjectStoreRetentionLifecycle, whose
# PutBucketLifecycleConfiguration call has no such tolerance. And it is the
# elitea-main DEPLOYMENT that fails, not the migration Job: /elitea-migrate is
# a different binary that never touches object storage, so the migration Job
# and the Helm release both report success — only the Deployment starts
# crash-looping, AFTER the install already looked green.
#
# The compose stack creates the bucket (`rustfs-bucket-init`); this chart can
# do the same for a self-hosted S3-compatible endpoint via `objectInit`
# (off by default — see that block for why). On a managed object store,
# creating it remains a console/terraform/IaC step outside this chart: the
# scoped credential a pod is handed there routinely lacks CreateBucket rights,
# even when it can read/write objects. Whichever way it is created, it must be
# named by `main.env.STORAGE_CONTAINER` before the first sync.
#
# GONE, and not only from this chart: pylon-indexer. Index ingest is served by
# the Go runtime plane through the agent worker, on the same command stream and
# consumer group as agent execution, so one worker serves both capabilities.
# Issue #339 deleted the service, its Containerfile, its bake target and its
# publish entry, so there is no longer an image to deploy anywhere.

# ── Images ──────────────────────────────────────────────────────────────────
#
# ONE tag for the whole platform. Every first-party image is built, signed and
# pushed by a single semantic-release run, so a per-component tag could only
# ever express a mistake. The release stamps this field; the working tree keeps
# the placeholder.
#
# Third-party images (the runtime Redis, the OTel collector) keep their own
# deliberate pins under their component keys — a release number means nothing
# to those registries.
image:
  tag: "latest"
  # Applied to every component's pod spec.
  pullSecrets: []

# ── PostgreSQL ──────────────────────────────────────────────────────────────
#
# A SECRET REFERENCE, not a URL: the DSN carries a password, and a password in
# a values file is a password in a ConfigMap. elitea-main, its migration, the
# scheduler, the LLM gateway and the workload-session provisioner all read the
# same database; before this block they named the secret separately.
#
# Externalized, with no embedded mode. CloudNativePG installs cluster-scoped
# CRDs and a controller whose lifecycle is not this application's, so bundling
# it would let `helm uninstall` reach the database. Run the operator and its
# Cluster as their own release and point this at the secret it publishes.
postgresql:
  existingSecret: "elitea-main-db"
  key: "database-url"

  # ── The connection budget ──────────────────────────────────────────────────
  #
  # WHY THIS EXISTS. elitea-main opens SIX isolated runtime-plane pools per
  # replica when main.runtime.enabled is true — Admission 10, Control 8,
  # Output 8, Replay 4, TerminalEffects 2, Content 4 = 36
  # (internal/runtimecomposition/database_pools.go), and
  # validateDependencies FORBIDS them sharing capacity — plus the primary
  # pool on top. At main.autoscaling.maxReplicas: 10 that is roughly 400
  # connections against a stock PostgreSQL's max_connections of 100, and the
  # chart set no limit at all.
  #
  # Measured on the E2E stack with the runtime plane OFF: 6 connections for one
  # replica. The runtime pools are the whole of the problem, which is why the
  # guard below counts them only when that plane is on.
  #
  # HOW IT FAILS WITHOUT THIS. Exhaustion surfaces as
  # `FATAL: sorry, too many clients already` on whichever component connects
  # NEXT — typically a migration Job or the scheduler, not the replica whose
  # scale-up consumed the last slot. The cause and the symptom land in
  # different pods.
  #
  # The chart cannot read `max_connections` off the server, so the operator
  # states it and elitea-main.validateConnectionBudget refuses to render a
  # topology that would exceed it.
  maxConnections: 100
  #
  # A CONNECTION POOLER IS NOT THE ANSWER TO THIS TODAY, and the reason is
  # measured rather than assumed (2026-09-01). pgbouncer in front of this
  # deployment was tried against elitea-main's own Postgres integration tests:
  #
  #   direct connection                                        PASS
  #   pgbouncer transaction mode, max_prepared_statements = 0   FAIL. pgx caches
  #     named prepared statements per connection and no code here sets
  #     DefaultQueryExecMode, so a shared backend answers 42P05 "prepared
  #     statement already exists". The worst of it is the shape: the secrets
  #     backfill LOGS the failure and continues, leaving projects on the
  #     guessable X-SECRET default. It degrades quietly rather than crashing.
  #   pgbouncer transaction mode, max_prepared_statements = 200 FAIL. The 42P05
  #     errors go, and a deeper one appears: the backfill's session-scoped
  #     advisory lock stops serialising, because a transaction-mode pooler hands
  #     the backend to another client between statements. Every replica runs the
  #     backfill — the defect the lock exists to close.
  #   pgbouncer session mode                                    PASS, and buys
  #     almost nothing: each client connection pins a server connection for its
  #     life, and the clients here are pgxpools that hold MaxConns open.
  #
  # So the ceiling below is the control, not a stopgap for a pooler that is
  # coming. A pooler becomes available after the session-scoped advisory locks
  # are replaced — a locks table taken with SELECT ... FOR UPDATE, or moving the
  # backfill out of the boot path into a Job.

  # Connections to leave for everything this chart does not model: interactive
  # psql, backup tooling, the migration and dbInit Jobs, and whatever else
  # shares the server. Subtracted from maxConnections before the check.
  reservedConnections: 25

# ── NATS ────────────────────────────────────────────────────────────────────
#
# The gateway's budget counters and the scheduler both dial it, and they MUST
# name the same one: two components on two clusters of a shared counter enforce
# nothing. Externalized — commodity infrastructure.
#
# `namespace` empty means this release's own namespace. Do not hardcode a
# namespace here: a chart installable anywhere that names one silently couples
# every other install to it.
nats:
  service: "elitea-nats"
  namespace: ""
  port: 4222

# ── Redis (general purpose) ─────────────────────────────────────────────────
#
# Sessions, project SSE, scheduler coordination. Plaintext, and NOT the same
# instance as the runtime dispatch bus under `worker`/`runtimeRedis` — that one
# is mutually authenticated with an ACL user and a file-backed password, and
# merging the two would be a security regression, not a simplification.
#
# A host/port pair rather than a string because both consumers want bare
# host:port — the value goes straight to goredis Options.Addr, not to a URL
# parser. The two charts previously defaulted it to "" and to "redis:6379",
# neither of which resolves in a real namespace.
redis:
  service: "elitea-valkey"
  namespace: ""
  port: 6379

# ── Database preparation ────────────────────────────────────────────────────
#
# The two things elitea-migrate cannot do for itself, because both need rights
# the migrating role does not have: CREATE DATABASE for the agent-state store
# the worker's checkpointer opens, and CREATE EXTENSION vector for the index
# plane's unqualified DDL.
#
# The pylon-era schema is NOT here. elitea-migrate embeds 001_initial.sql and
# applies it itself when the database does not carry it, so a fresh install
# migrates from empty with no external step — and the objects end up owned by
# the migrating role, which is what the histories need in order to ALTER them.
dbInit:
  enabled: true

  # Set true ONLY when the agent-state database named by `agentStateDatabase`
  # below (and the `vector` extension) were already created by something
  # outside this chart, and you are turning `enabled` off to avoid redoing it.
  # This is the guard's escape hatch (templates/guards.yaml): worker.enabled
  # with dbInit.enabled=false and this still false is refused at render time,
  # because that combination installs cleanly and fails later, per-execution,
  # with "The durable agent checkpoint store is unavailable" — no different
  # from the database never having been created. There is no way for the chart
  # to check the database itself at render time, so this is a statement, not a
  # probe: it exists to make the operator say the words instead of the chart
  # silently assuming them.
  externallyManaged: false

  # Needs CREATE DATABASE and CREATE EXTENSION, which the application role
  # usually lacks — hence its own secret rather than reusing `postgresql`.
  # Point it at the operator's superuser DSN for the PLATFORM database; the
  # agent-state database is created beside it on the same server.
  database:
    existingSecret: "elitea-postgres-cluster-superuser"
    key: "uri"

  # The LangGraph checkpoint store the worker opens. A separate DATABASE, not a
  # schema, because that is the connection-string shape the checkpointer uses.
  # Without it the worker claims an execution, runs the agent, and then fails
  # delivery with "The durable agent checkpoint store is unavailable" — it must
  # match the database in the worker's agent-checkpoint-connection material.
  agentStateDatabase: "elitea_v2_agentstate"

  # The role that OWNS the agent-state database created below — normally the
  # same role elitea-main connects as. Empty creates it owned by the admin.
  appRole: "elitea_v2"

  image:
    repository: docker.io/library/postgres
    tag: "17"
    pullPolicy: IfNotPresent

  imagePullSecrets: []
  backoffLimit: 3
  waitAttempts: 60
  waitIntervalSeconds: 5
  runAsUser: 999
  runAsGroup: 999
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

# ── Artifact bucket preparation ─────────────────────────────────────────────
#
# Mirrors compose's `rustfs-bucket-init`: creates the bucket named by
# `main.env.STORAGE_CONTAINER` if it does not already exist, before elitea-main
# starts. See the header comment above for why an install can look green and
# then crash-loop on this — the readiness probe tolerates a missing bucket,
# configureObjectStoreRetentionLifecycle does not.
#
# DEFAULT IS OFF, DELIBERATELY. This chart cannot know, for an arbitrary S3,
# Azure or GCS account, whether the credential it has been handed can create a
# bucket/container — CreateBucket (S3) and its equivalents are commonly
# withheld even from credentials that can freely Get/Put/List objects, because
# bucket creation is an account-level, sometimes billing-relevant action that
# platform teams keep out of application-scoped IAM. A default-on Job would
# therefore either (a) silently do nothing useful on most managed clouds
# because it lacks the rights, discovered only when it fails — the same
# install-green-fail-later shape this fix exists to remove — or worse,
# (b) succeed unexpectedly, having used more ambient privilege than the
# operator intended to grant this release. A self-hosted S3-compatible
# endpoint the operator administers directly (RustFS, MinIO — the standalone
# stack's own topology) is exactly the case where turning this on is safe and
# useful, so it is opt-in per install rather than assumed.
#
# Backend support: S3-compatible only (the same `mc` tool compose uses).
# Azure/GCS container creation is not implemented here; enabling this with
# main.env.STORAGE_BACKEND set to "azure" or "gcs" fails the Job on purpose
# rather than silently skipping, so a mis-set flag is caught at install time.
objectInit:
  enabled: false

  image:
    repository: docker.io/minio/mc
    tag: "latest"
    pullPolicy: IfNotPresent

  # Credentials for the `mc alias set` used to create the bucket. Static keys
  # only — `mc` does not perform the ambient workload-identity credential
  # chains internal/infra/storage/s3 falls back to, so a cluster running S3
  # via workload identity (no S3_ACCESS_KEY/S3_SECRET_KEY Secret) cannot use
  # this Job and must pre-create the bucket out-of-band instead.
  credentials:
    secretName: elitea-main-storage-secrets
    accessKeyKey: s3-access-key
    secretKeyKey: s3-secret-key

  imagePullSecrets: []
  backoffLimit: 3
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: "1"
      memory: 128Mi
  nodeSelector: {}
  tolerations: []

# Apply the native ADK history to the separate agent-state database.
# Keep this credential separate from the main database credential.
agentStateMigrations:
  enabled: false
  serviceAccountName: ""
  databaseSecret:
    name: ""
    key: "AGENTSTATE_DATABASE_URL"
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi


# Settings that belong to the DEPLOYMENT rather than to any one component.
platform:
  # The platform's PUBLIC ("shared") project — the project whose `shared = true`
  # configurations every other project may use.
  #
  # SET IT HERE, ONCE. Three components need it and used to take it separately:
  # `main.env.ELITEA_AI_PROJECT_ID`, `llmGateway.env.ELITEA_AI_PROJECT_ID` and
  # `web.env.VITE_PUBLIC_PROJECT_ID`. Nothing checked that the three agreed, and
  # a disagreement produces no error: elitea-main writes a shared credential
  # into `p_<one id>`, the gateway resolves it out of `p_<another>`, and the SPA
  # decides which project is public with a third copy. The credential is stored,
  # listed and reported healthy, and resolves for nobody.
  #
  # This value fills every component key that is empty. A values file that still
  # sets a component key keeps working while the values AGREE; two that disagree
  # stop `helm template` — see `elitea.aiProjectId` in templates/_helpers.tpl.
  #
  # It must name a project that EXISTS: it becomes the PostgreSQL schema name
  # `p_<id>`, so an id with no schema fails every shared-credential read.
  #
  # EMPTY by default, and empty is a real state rather than a missing one. With
  # `ELITEA_CONFIGURATIONS_ENABLED` off, elitea-main REFUSES to start when
  # `ELITEA_AI_PROJECT_ID` is present at all
  # (cmd/elitea-main/configurations_config.go), so a default that invented "1"
  # would stop a default install. The SPA still falls back to "1" when nothing
  # names a project, which is what every reference deployment here uses.
  aiProjectId: ""


main:
  # The API. Everything else is optional next to it.
  enabled: true
  # PROTOTYPE VALUES ONLY. This chart does not yet define NetworkPolicy,
  # split database principals, or production secret delivery. An opt-in
  # Ingress/HTTPRoute exists (ingress.enabled) but ships with no TLS secret
  # or hostname configured — see ingress.tls / ingress.hosts below.
  #
  # CAPABILITY FLAGS (issue #382). cmd/elitea-main gates whole capabilities on
  # environment variables, and this file sets every one of them. It did not
  # before, so the same image served the pylon-free configuration on compose and
  # served none of it on Kubernetes. Read the "Capability flags" block in the env
  # map below, and the runtime: block further down.
  #
  # These defaults are for a DEFAULT install, which has no production
  # authentication, so most capabilities ship off. values-standalone.yaml is the
  # values file whose capability set matches the standalone compose stack.
  # Prerequisites are checked while the chart renders, so a wrong combination
  # fails `helm template` rather than the pod.
  replicaCount: 2

  # Pull secrets for a registry that needs credentials. ghcr.io/elitea-ng/elitea-main
  # is a PRIVATE package today — an anonymous pull is refused, unlike
  # elitea-web's — so a cluster without an entry here cannot start this service
  # at all: both the Deployment and the migration hook Job stop at
  # ImagePullBackOff. A Kubernetes pull secret has no effect until something
  # references it, and nothing in this chart did.
  #
  #   imagePullSecrets:
  #     - name: ghcr-pull
  imagePullSecrets: []

  image:
    repository: ghcr.io/elitea-ng/elitea-main
    # tag comes from the single top-level image.tag
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  # Legacy-parity hardening (issue #241): the shipped image is already a
  # distroless nonroot build, so runAsNonRoot/readOnlyRootFilesystem cost
  # nothing here — no application-level temp-file writes were found (grepped
  # for os.CreateTemp/os.TempDir); the container still gets a writable /tmp
  # emptyDir (templates/deployment.yaml) for anything the Go runtime itself
  # wants there.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Opt-in external reachability (issue #241; legacy parity with
  # legacy/deploy/charts/charts/pylon's templates/httproute.yaml). Both the
  # standard Ingress and the Gateway API HTTPRoute path are OFF by default —
  # this chart cannot know your ingress controller / Gateway, hostnames, or
  # TLS secret names. Set ingress.gatewayApi: true to render an HTTPRoute
  # instead of a networking.k8s.io/v1 Ingress; the two are mutually exclusive.
  #
  # THIS IS NOT THE CLUSTER'S BROWSER EDGE. The HTTPRoute below renders ONE `/`
  # rule with elitea-main as the only backend, which suits an install that
  # publishes elitea-main alone. A deployment that also serves the web app from
  # `/app` needs a rule per root-mounted Go route, or the SPA backend swallows
  # them: deploy/gateway-api/httproute.yaml is that edge, and
  # services/elitea-main/tests/deployedge/edge_gateway_api_test.go walks the
  # real Go router against it (#568).
  ingress:
    enabled: false
    gatewayApi: false
    className: ""
    annotations: {}
    path: /
    pathType: Prefix
    hosts: []
    # TLS termination for the standard Ingress path only — ignored when
    # gatewayApi: true (HTTPRoute TLS termination is the Gateway's own concern).
    tls: []
      # - secretName: elitea-main-tls
      #   hosts:
      #     - dev.elitea.ai
    # Client-supplied identity headers stripped on the way in (#326). elitea-main
    # treats X-Auth-Type + X-Auth-Id from a trusted-proxy source address as a
    # finished identity, and in a cluster the whole pod network is typically
    # inside trusted_proxy_cidrs — so anything reaching the Service with these
    # headers set by the CALLER is an impersonation. Emptying this list re-opens
    # that; extend it, do not shorten it.
    #
    # APPLIES TO THE HTTPRoute PATH ONLY (ingress.gatewayApi: true), where it
    # renders a RequestHeaderModifier filter. A networking.k8s.io/v1 Ingress has
    # no portable header-removal field, so on that path the strip MUST be
    # configured on the ingress controller itself (ingress-nginx:
    # `more_clear_input_headers` in a configuration-snippet, which many clusters
    # disallow) or by fronting elitea-main with a Gateway. Do not assume the
    # plain-Ingress path is covered by this chart.
    #
    # X-Elitea-Llm-Hop IS DELIBERATELY ABSENT, and a gate fails if it appears.
    # It is the LLM gateway's hop marker (#164): the gateway stamps it on every
    # outbound provider request and refuses a request that arrives already
    # carrying this deployment's own value, which contains a circular route on
    # its first re-entry. An edge that removes it disarms that detection. The
    # marker is not identity — it grants nothing, and recognising it only
    # refuses the caller's own request. Both traefik edges carry the same
    # exception, and edge_identity_strip_test.go holds them together.
    stripIdentityHeaders:
      - X-Auth-Type
      - X-Auth-Id
      - X-Auth-User-Id
      - X-Auth-Reference
      - X-Auth-Avatar
      - X-Auth-Avatar-State
      - X-Auth-Session-Id
      - X-Auth-Session-Name
      - X-Auth-Session-Endpoint
      - X-Elitea-Identity-Signature
      - X-Elitea-Project-Id
      - X-Elitea-User-Id
      - X-Elitea-Tenant-Id
      # The runtime execution a /llm call was made from (shared migration 0100).
      # Legitimate from the runtime worker, which does not pass this edge; never
      # from a browser.
      - X-Elitea-Execution-Id
    # Only consulted when gatewayApi: true — the pre-existing Gateway this
    # HTTPRoute attaches to (not created by this chart).
    gateway:
      name: ""
      namespace: ""
      sectionName: ""

  # Optional file-based config mounts (issue #241), OFF by default. The chart
  # does not build these ConfigMaps for you — point configMapName at a
  # ConfigMap you provision out-of-band (kubectl create configmap / kustomize /
  # a GitOps overlay) and the chart wires the volume + volumeMount + env var
  # pointing at the mounted path. See cmd/elitea-main/brand_pack_config.go
  # (BRAND_PACK_PATH) and cmd/elitea-main/main.go (ELITEA_AUTH_CONFIG_FILE).
  fileConfig:
    authConfig:
      enabled: false

      # THE AUTHENTICATION CONFIGURATION ITSELF (issue #444).
      #
      # internal/authcomposition/material.go opens FIVE files, and their paths
      # come from this document. Before issue #444 the document was always
      # external — the chart knew a ConfigMap name and nothing more — so the
      # chart could not know the five paths, rendered no volume for them, and
      # every Kubernetes install of the runtime plane had to place the files by
      # some other method.
      #
      # Put the document here and the chart:
      #   * renders the ConfigMap for you;
      #   * checks that all five paths sit in material.mountPath below, while it
      #     renders, and names the offending path when one does not;
      #   * mounts the material where the service opens it.
      #
      # Leave it empty and set configMapName instead to keep the document
      # outside the chart. The chart then cannot see the five paths, and
      # cmd/elitea-auth-material is the only gate: it reads the same document in
      # the init container and stops the pod when the paths and the mount
      # disagree.
      #
      # Set exactly one of document and configMapName.
      #
      # Read internal/authcomposition/config.go for the schema, and
      # deploy/runtime/auth.form.yml for a complete example with comments.
      document: {}

      configMapName: ""
      key: auth-config.json
      mountPath: /etc/elitea/auth-config.json

      # The five files that the document names: the Auth Redis password, the
      # Auth Redis CA, the browser-attempt key, the PAT signing key and the Form
      # users JSON.
      #
      # THE KEY NAMES ARE THE OPERATOR'S. Unlike the runtime material, the chart
      # does not fix them: each name is the last component of a path in the
      # document above. The Secret must carry one key for each of those names.
      material:
        # Where the service reads the five files. Every path in the document must
        # sit in this directory, because one volume mount serves one directory.
        #
        # It must differ from runtime.material.mountPath. Each install container
        # removes anything in its own directory that its own Secret does not
        # carry, so one shared directory would make the two delete each other's
        # files.
        mountPath: /run/elitea-auth

        # A Kubernetes Secret whose keys are the five file names, for example:
        #
        #   kubectl create secret generic elitea-main-auth-material \
        #     --from-file=redis-auth-password --from-file=auth-redis-ca.crt ...
        #
        # The chart cannot mount that Secret straight at mountPath.
        # internal/security/securefile refuses a path that resolves through a
        # symlink and requires owner-only bits on private material, and a Secret
        # volume gives neither: mounted whole it is a symlink farm, and mounted
        # per file with subPath its files belong to root while this pod runs as
        # nonroot. So the chart adds an init container, exactly as issue #404
        # does for the runtime material. It runs the same image and the same
        # user, copies each key into a memory-backed emptyDir at mode 0600, and
        # reads every file back through securefile before it exits. A missing key
        # stops the pod there, with a message.
        secretName: ""

        # The mode the kubelet gives each key of that Secret. The init container
        # has to read them, and the kubelet owns them as root, so without a pod
        # fsGroup the read bit for other users is the only one that reaches this
        # pod's user. It applies inside this pod's own mount namespace only, and
        # the copies that the service reads are owner-only. Set
        # podSecurityContext.fsGroup and lower this to 0440 to tighten it.
        secretDefaultMode: 0444

        # The bound on the emptyDir that holds the copies.
        sizeLimit: 8Mi

        # An alternative source, for a deployment whose material is ALREADY real,
        # owner-owned files at mountPath — a CSI secret driver, for example. It
        # takes a Kubernetes volume specification without its `name`; the chart
        # adds the name and mounts it read-only. Mutually exclusive with
        # secretName, and no init container renders with it.
        volume: {}
    # The mTLS client material for the /llm hop (issue #463 left this half
    # done: it moved LLM_GATEWAY_CLIENT_CERT / _KEY / LLM_GATEWAY_CA_FILE from
    # secretKeyRef entries to file paths, and no volume ever served those paths).
    #
    # Nothing here goes through internal/security/securefile —
    # internal/llmproxy/proxy.go calls tls.LoadX509KeyPair and os.ReadFile
    # directly — so a plain Secret volume is enough and no init container copy is
    # needed. That is the whole difference from runtime.material.
    #
    # `secretName` is the usual shape: a cert-manager Certificate issued INTO
    # THIS namespace produces a Secret with tls.crt / tls.key / ca.crt, which are
    # the default keys below. Point env.LLM_GATEWAY_CLIENT_CERT and its two
    # siblings at mountPath/<key>.
    #
    # `volume` is the alternative for material that already exists as files (a
    # CSI secret driver, for example) and is mutually exclusive with secretName.
    llmGatewayClientMaterial:
      enabled: false
      secretName: ""
      mountPath: /run/elitea-llm-gateway
      # 0444, for the same reason runtime.material and the authentication
      # material default to it: the kubelet owns these files as root, this pod
      # runs as nonroot, and podSecurityContext sets no fsGroup — so the
      # other-read bit is the only one that reaches the user that must read them.
      #
      # This shipped as 0440 and could not work: elitea-main reached
      # "production runtime enabled" and then died with
      #   compose llm gateway proxy: llmproxy: build mTLS transport:
      #   load client cert: open /run/elitea-llm-gateway/tls.crt: permission denied
      # on the first cluster that mounted it.
      #
      # Set podSecurityContext.fsGroup and lower this to 0440 to tighten it,
      # exactly as the two blocks above document.
      defaultMode: 0444
      volume: {}
    # The DeepWiki hop's client material (ADR-0022 P3). Same shape and same
    # 0444 reasoning as llmGatewayClientMaterial above: the kubelet owns these
    # files as root, this pod runs as nonroot, and podSecurityContext sets no
    # fsGroup, so the other-read bit is the only one that reaches the user
    # that must read them.
    #
    # secretName is normally deepwiki.mtls.clientSecretName — the Secret the
    # deepwiki subtree's facade-client Certificate issues. A Secret is
    # namespace-scoped, so a split-namespace install needs a second
    # Certificate or the replication described in deploy/README.md.
    deepwikiClientMaterial:
      enabled: false
      secretName: ""
      mountPath: /run/elitea-deepwiki
      defaultMode: 0444
      volume: {}
    # The Inventory hop's client material (ADR-0023 H4c). Same shape, same
    # 0444 reasoning, and a SEPARATE mount from DeepWiki's: a deployment may
    # run one provider and not the other, and each hop's material must be
    # revocable on its own.
    #
    # secretName is normally inventory.mtls.clientSecretName — the Secret the
    # inventory subtree's facade-client Certificate issues.
    inventoryClientMaterial:
      enabled: false
      secretName: ""
      mountPath: /run/elitea-inventory
      defaultMode: 0444
      volume: {}
    brandPack:
      enabled: false
      configMapName: ""
      # BRAND_PACK_PATH is one pack file per deployment (branding package doc,
      # internal/api/v2/branding/pack.go's LoadPack does os.ReadFile) — mounted
      # via subPath, like authConfig above, not a whole-ConfigMap directory.
      key: brand-pack.json
      mountPath: /etc/elitea/brand-pack.json

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Arbitrary env vars for the elitea-main container. The whole map is rendered
  # into the ConfigMap (templates/configmap.yaml) and consumed via envFrom, so
  # adding a key here is all that is needed to set a new env var.
  env:
    DATABASE_URL: ""

    # Production keeps the provider-neutral Go object-store capability enabled
    # and therefore fail-closed on missing storage configuration. Mixed Centry
    # deployments explicitly set this to "false" while the current artifacts
    # plugin remains authoritative.
    ELITEA_ARTIFACTS_ENABLED: "true"

    # --- Capability flags (issue #382) -----------------------------------------
    # cmd/elitea-main gates whole capabilities on these names. Each one makes the
    # composition root build a dependency, and the router registers a route group
    # only when that dependency exists. Before issue #382 this chart set none of
    # them, so a Kubernetes install served none of those route groups while the
    # same image on compose served all of them.
    #
    # They ship "false" here, not "true". Two reasons, and both are about the
    # DEFAULT install:
    #   1. Most of them need production authentication, which this chart builds
    #      only from fileConfig.authConfig (off by default). Shipping "true" with
    #      authentication off would turn a working default install into a
    #      CrashLoopBackOff.
    #   2. An operator must choose a public project id and a Redis endpoint. The
    #      chart cannot guess either.
    #
    # Read values-standalone.yaml for the values file that turns the set on. The
    # chart checks every prerequisite at `helm template` time, so a wrong
    # combination fails on the terminal, not in a restarting pod.

    # The Configurations plane: eight configuration and model-catalogue routes,
    # and the dependency that agent dispatch and index ingest both compose
    # through.
    #
    # EMPTY MEANS "FOLLOW THIS DEPLOYMENT", not "off". templates/main/
    # _helpers.tpl's elitea-main.configurationsEnabled renders "true" when the
    # install has the two prerequisites the chart can see — authentication
    # (fileConfig.authConfig OR env.OIDC_ISSUER_URL) and ELITEA_AI_PROJECT_ID
    # below — and "false" otherwise. State "true" or "false" here to decide it
    # yourself; a stated value always wins.
    #
    # It used to ship a literal "false", and an install could not turn it on
    # without the Form authentication document: cmd/elitea-main tested the
    # FormGraph, which only ELITEA_AUTH_CONFIG_FILE builds. An install with
    # real corporate single sign-on therefore got NO credential routes, NO
    # model catalogue and no project vector store, and every LLM setup step
    # fell back to deploy/scripts/seed-llm-api.py or raw SQL. The composition
    # root now asks for a credential plane instead, and either plane answers.
    #
    # It does not ship a literal "true" either. This file states no
    # authentication and no public project id, so a literal would make
    # `helm template` fail with no overrides and, past that, CrashLoopBackOff.
    ELITEA_CONFIGURATIONS_ENABLED: ""

    # A SECOND set of three configuration WRITE routes. Needs
    # ELITEA_CONFIGURATIONS_ENABLED and runtime.enabled; this file has neither.
    #
    # The reason recorded here before — "demands the LiteLLM lifecycle facade" —
    # is stale (#460). The lifecycle takes no LLM transport now. The flag stays
    # off for two reasons that are true: the chart refuses it without the two
    # prerequisites above, and it is not what makes a saved credential usable.
    # The routes it composes WIN the path from the compatibility routes that
    # every install serves — see
    # TestConfigurationWriteRouteWinnerDependsOnTheMutationComposition — and they
    # take a different request shape from the one apps/elitea-web sends. Turning
    # this on is a cutover with its own web-client work.
    ELITEA_CONFIGURATIONS_MUTATION_ENABLED: "false"

    # The project-information route. NEEDS production authentication.
    #
    # With this off, the project-information path falls through to the prototype
    # handler, which never counts teammates and always reports a null icon. The
    # project screen reads exactly those two fields, so it shows zero teammates
    # and no project icon — at 200, which is why nothing looked broken.
    ELITEA_PROJECT_INFO_ENABLED: "false"

    # The project whose configurations are PUBLIC and merge into every other
    # project's option lookups. Read only when ELITEA_CONFIGURATIONS_ENABLED is
    # on, and it must name a project that EXISTS: the model catalogue lists that
    # project's configurations and propagates the failure, so a missing id fails
    # every agent turn rather than yielding an empty public set.
    #
    # SET `platform.aiProjectId` INSTEAD. It fills this key, the identically
    # named key in the `llmGateway:` block, and the SPA's
    # `VITE_PUBLIC_PROJECT_ID` — three copies of one project id that used to be
    # set by hand and that nothing compared. A value here still works and still
    # wins for this component; `helm template` refuses a render whose copies
    # disagree (`elitea.aiProjectId` in templates/_helpers.tpl).
    #
    # Empty EVERYWHERE leaves shared models unreachable: the picker offers them
    # and the request then finds no credential.
    ELITEA_AI_PROJECT_ID: ""

    # Whether a project may define its own LLM credentials.
    #
    # STATED, never empty. This ConfigMap renders every key in this map, so an
    # empty value here does not mean "unset" — the variable reaches the container
    # PRESENT and empty. cmd/elitea-main/configurations_config.go:101 tests
    # presence and then accepts only "true" or "false", so the empty value this
    # chart used to ship stopped elitea-main at boot with
    # "ELITEA_ALLOW_PROJECT_OWN_LLMS must be true or false" — and only once
    # ELITEA_CONFIGURATIONS_ENABLED was on, which is why a default install never
    # saw it and the first configured install died on it.
    #
    # "true" is the binary's own default (configurations_config.go:100), so this
    # states the existing behaviour rather than changing it.
    #
    # Do NOT set ELITEA_LITELLM_ALLOW_PROJECT_OWN_LLMS: that is the old name, and
    # cmd/elitea-main refuses to start when it is present, because silently
    # ignoring it would fail open.
    ELITEA_ALLOW_PROJECT_OWN_LLMS: "true"

    # Path to the secret-vault master key. Empty means the vault key column holds
    # the Fernet key itself; set means that column holds the key WRAPPED under
    # this master key. The two readings are incompatible, so a deployment whose
    # vault rows are unwrapped must leave this empty or every credential read
    # fails, several layers away from anything that names a vault.
    ELITEA_VAULT_MASTER_KEY_FILE: ""

    # --- Capabilities DERIVED from this deployment -----------------------------
    # ELITEA_INDEX_TYPES_ENABLED and ELITEA_APPLICATION_SKILLS_ENABLED are EMPTY
    # here, and empty means "follow this deployment". The ConfigMap fills each
    # one from elitea-main.indexTypesEnabled / elitea-main.applicationSkillsEnabled:
    # "true" when the install authenticates (Form document or OIDC issuer),
    # "false" when it does not. A value stated here always wins.
    #
    # Neither flag has a contract problem any more. The index-types read answers
    # the published DocumentLoadersResponse keys (items, total) beside the Pylon
    # keys (document_types, image_types, code_types). The attached-skills read
    # answers the published SkillsList keys (items, total, page, page_size,
    # total_pages) beside the Pylon keys (skills, max_skills). Both shipped
    # clients accept one body (#394, #395).
    #
    # These used to ship "false", and that is no longer a safe default. #394 and
    # #395 deleted the prototype fallbacks from internal/api/router.go, so each
    # reviewed route is the ONLY handler for its path. "false" is a 404 on a path
    # the published contract declares, not a degraded answer.
    #
    # A literal "true" is equally wrong here: the default values file builds no
    # authentication, and cmd/elitea-main refuses to start with
    # "ELITEA_INDEX_TYPES_ENABLED requires an authenticated deployment".
    # elitea-main.validateCapabilities refuses the same pair while the chart
    # renders, so an operator reads the reason on the terminal.
    ELITEA_INDEX_TYPES_ENABLED: ""
    ELITEA_APPLICATION_SKILLS_ENABLED: ""

    # --- Project event stream (#152) -------------------------------------------
    # Transport for GET /api/v2/events/prompt_lib/{projectID}. The router has a
    # two-arm fallback and BOTH arms were unassigned in this chart, so the route
    # was never registered and answered 404 — indistinguishable from a typo.
    #
    # Host:port of the general-purpose Redis, e.g. "elitea-redis-master:6379".
    # This is NOT the runtime plane's Redis: that one is separate, mutually
    # authenticated, and configured under runtime.redis below.
    REDIS_URL: ""
    REDIS_USERNAME: ""

    # --- Admin console ---------------------------------------------------------
    # Directory the admin single-page application is served from. The published
    # image bakes this path and ships the bundle at it, so the value here matches
    # the image and the standalone compose stack.
    #
    # CAUTION: an EMPTY value turns the admin console off, because the
    # composition root builds the admin configuration only for a non-empty path —
    # and this ConfigMap entry OVERRIDES the image's own setting. So clearing
    # this key is a switch, not a no-op. Set it to "/nonexistent" when you deploy
    # the `hybrid` image variant, which ships no admin bundle.
    ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"

    # --- circular-routing guard #1, upsert time (spec §2.6) --------------------
    # Comma-separated list of the platform's OWN /llm origins, e.g.
    #   "https://dev.elitea.ai/llm/v1,http://elitea-main:8080/llm/v1"
    # A credential whose api_base resolves to one of these is rejected at save
    # time with SELF_REFERENTIAL_CREDENTIAL (the gateway's Account-side check is
    # the request-time backstop).
    # IMPORTANT: when BOTH this and DEPLOYMENT_URL below are empty, the resolved
    # self-origin list is empty and guard #1 is INERT — every credential passes
    # the check. elitea-main logs a one-time WARN at first use in that case.
    ELITEA_SELF_LLM_ORIGINS: ""

    # Public base URL of this deployment (e.g. "https://dev.elitea.ai"). When set,
    # it is additionally treated as a self origin with "/llm" appended, so the
    # common single-domain deployment is guarded with no extra configuration.
    # Empty here leaves that convenience path off; see the note above — with
    # ELITEA_SELF_LLM_ORIGINS also empty, §2.6 guard #1 is inert.
    DEPLOYMENT_URL: ""

    # --- OIDC email policy ------------------------------------------------------
    # Set "true" to REFUSE one class of OIDC login. The login joins an existing
    # account by email. The identity provider does not state
    # `"email_verified": true`.
    #
    # The knob applies to ONE path: a provider subject with no link here that asks
    # to adopt an account by its address (internal/api/v2/auth/oidc.go,
    # joinAccountByEmail). A subject that already owns an account is never held to
    # it, because the subject decides that account.
    #
    # Empty (the default) leaves the rule OFF, and that matches the code default.
    # Many identity providers omit the claim, so "true" stops a working login on
    # those. An explicit `"email_verified": false` is refused whatever this says.
    # Turn it on when your provider always sends the claim.
    OIDC_REQUIRE_EMAIL_VERIFIED: ""

    # --- Browser session lifetimes (shared migration 0117) ----------------------
    # The `elitea_session` cookie now carries an opaque identifier and nothing
    # else. The SESSION is a row in `elitea_auth.browser_sessions`, so a logout
    # revokes it, an operator can end it, and it has two deadlines instead of
    # one. See services/elitea-main/docs/browser-sessions.md.
    #
    # ELITEA_SESSION_IDLE_TIMEOUT is measured from the last request. A browser
    # left alone for longer must sign in again. Empty means 8h. "0" turns the
    # idle deadline off and leaves only the absolute one.
    ELITEA_SESSION_IDLE_TIMEOUT: ""

    # ELITEA_SESSION_ABSOLUTE_LIFETIME is measured from the sign-in and never
    # moves, whatever the user does. Empty means 168h (7 days). It must be at
    # least 1m and at least as long as the idle timeout; a value that fails
    # either rule stops the boot with a message that names the variable.
    ELITEA_SESSION_ABSOLUTE_LIFETIME: ""

    # ELITEA_SESSION_REJECT_LEGACY_COOKIES ends the upgrade window.
    #
    # A deployment that upgrades to this release holds signed, self-contained
    # `elitea_session` cookies that were issued by the previous one. They stay
    # readable so the upgrade does not sign every active user out at the moment
    # the new pods start. They cannot be revoked and they carry no idle
    # deadline, so an operator who would rather force one re-login than keep
    # them alive sets this to "true". The longest such a cookie survives on its
    # own is 24 hours.
    ELITEA_SESSION_REJECT_LEGACY_COOKIES: ""

    # --- The first administrator, on a single-sign-on-only deployment -----------
    # Comma-separated provider references that are granted the administration
    # super_admin role the first time they sign in
    # (internal/api/v2/auth/first_login.go).
    #
    # This is the ENVIRONMENT fallback. A deployment that carries an
    # authentication configuration document (ELITEA_AUTH_CONFIG_FILE) states the
    # same list as `identity.initial_global_admins` there, and that document
    # wins — one list, one meaning, whichever browser plane ends up mounted.
    # This variable exists because an SSO-only deployment has no such document,
    # and it is exactly the shape that otherwise has no way to name its first
    # administrator except an INSERT into auth_core__user_role.
    #
    # THE LIST APPLIES TO OIDC AND TO SAML LOGINS, since v1.39.0. An entry
    # takes one of three shapes:
    #
    #   oidc:<sub>            the OIDC subject, as stored
    #   saml:<nameid>         the SAML NameID, as stored
    #   email:<address>       a VERIFIED e-mail address (see below)
    #
    # A reference may also be written BARE (`8f3c...`), with no namespace. The
    # namespaced spelling is what the database holds, so prefer it.
    #
    # READ YOUR OWN REFERENCE WITHOUT psql. Sign in once, then call
    # `GET /api/v2/social/author` with that session. The `provider_refs` field
    # holds the exact values this list accepts. That removes the old procedure
    # of a SELECT against the production database, which was unavoidable with
    # Azure AD or Okta: their OIDC `sub` is an opaque identifier nobody can
    # know in advance.
    #
    # `email:` MATCHES A VERIFIED ADDRESS ONLY. The comparison ignores case. It
    # applies to an OIDC login whose id_token carries `"email_verified": true`,
    # and to nothing else. A provider that OMITS the claim cannot be matched
    # this way — and OIDC_REQUIRE_EMAIL_VERIFIED above does not change that,
    # because it gates account ADOPTION and not account creation. SAML carries
    # no verified-address statement at all, so a SAML deployment names its
    # first administrator by `saml:<nameid>`, which is often the address
    # already. An identity provider that merely asserts an address can never
    # assert its way into the role.
    #
    # The grant is one-shot per account: someone who already holds any
    # administration-mode role is left as the operator left them, so a demotion
    # is never undone by the next login. Empty grants nobody.
    #
    # A malformed entry WARNS at start-up and is ignored. The pod logs how many
    # entries are reference-shaped and how many are address-shaped, so a
    # misspelling is visible at boot instead of at somebody's first sign-in.
    ELITEA_INITIAL_GLOBAL_ADMINS: ""

    # Filesystem path to a brand pack FILE — the middle of the three brand
    # layers (ADR-0024): product default ← this file ← the admin Branding
    # section in the database. Empty means no file layer; the admin section
    # still brands the deployment at runtime. Read in
    # cmd/elitea-main/brand_pack_config.go; mounted by fileConfig.brandPack
    # above. Discovered unwired while verifying S17's env-drift gate.
    BRAND_PACK_PATH: ""

    # --- Outbound e-mail (ADR-0024 WP7; gap G7) ---------------------------------
    # These are the BOOTSTRAP DEFAULTS, not the whole configuration. Since gap
    # G7 the relay is administered at Admin > E-mail, which stores the settings
    # in centry.platform_config and seals the password in the platform vault.
    # The two layers merge FIELD BY FIELD on every send, with the admin page
    # winning, so a value set here is the default an administrator may override
    # and a value set there needs no redeploy.
    #
    # Leaving all of them empty is now a supported install: an administrator
    # configures the relay from the console. Leaving SOME of them set is also
    # supported — the pod no longer refuses to start on a partial set, because
    # completeness is decided on the merged document at send time and an
    # incomplete merge reports invitation_delivered: false with the field to
    # fix. A value that is WRONG (a port that is not a number, an address that
    # is not an address) still refuses to start.
    #
    # SMTP_PASSWORD is a Secret (secrets: block below). SMTP_TLS: starttls
    # (default, port 587) | tls, also spelled implicit (port 465) | none
    # (in-cluster relay only). ELITEA_EMAIL_SUPPRESS "true" renders but never
    # sends — the setting for a shadow or staging deployment that must produce
    # no user-visible side effect. Suppression outranks the admin page.
    SMTP_HOST: ""
    SMTP_PORT: ""
    SMTP_USERNAME: ""
    SMTP_TLS: ""
    EMAIL_FROM: ""
    EMAIL_REPLY_TO: ""
    PUBLIC_BASE_URL: ""
    ELITEA_EMAIL_SUPPRESS: ""

    # --- Object storage (S17; ADR-0016) -----------------------------------------
    # STORAGE_BACKEND has no code default — ConfigFromEnv fails closed with no
    # object store configured until this is explicitly one of "s3"/"azure"/"gcs".
    # Never leave this empty in a real deployment; it is empty here only because
    # the chart cannot know which backend an environment uses.
    STORAGE_BACKEND: ""
    # Physical bucket/container name. Required by ConfigFromEnv for every backend.
    STORAGE_CONTAINER: ""
    # Optional key prefix under which every object this deployment writes is
    # scoped (multi-environment sharing of one bucket/container).
    STORAGE_KEY_PREFIX: ""
    # S3-only. Leave S3_ENDPOINT_URL empty for real AWS S3; set it for an
    # S3-compatible endpoint (RustFS, MinIO, etc.). S3_ACCESS_KEY/S3_SECRET_KEY
    # are NOT here — see the secrets: block below.
    S3_ENDPOINT_URL: ""
    S3_REGION: ""
    S3_FORCE_PATH_STYLE: ""
    # Azure-only. AZURE_STORAGE_KEY is NOT here — see the secrets: block below;
    # leaving it unset (empty string, the Secret's `optional: true`) makes the
    # backend use workload identity via serviceAccount.annotations instead of a
    # static shared key.
    AZURE_STORAGE_ACCOUNT: ""
    AZURE_STORAGE_ENDPOINT: ""
    # GCS-only. Leave empty for real GCS with workload identity (the normal
    # production path — GOOGLE_APPLICATION_CREDENTIALS is deliberately not
    # wired here; see env-drift-allowlist.txt). Set for an emulator endpoint.
    GCS_ENDPOINT: ""
    # Per-object upload size cap (bytes). Empty means "no override" — the
    # handler falls back to its own default (S12).
    ARTIFACT_MAX_OBJECT_BYTES: ""
    # Chat attachment bucket retention, in days (S20a). Empty means "no
    # override" — the handler falls back to its own default (365 days).
    ARTIFACT_ATTACHMENT_RETENTION_DAYS: ""

    # --- LLM gateway proxy (BF0.9c; issue #463) ---------------------------------
    # URL of the elitea-llm-gateway service. Empty composes no GatewayProxy, and
    # the /llm path then answers 503 llm_gateway_not_configured.
    #
    # WHY THERE IS NO DEFAULT VALUE HERE, and why that is not the old defect.
    #
    # The old defect was that an empty value made /llm answer 404, which is the
    # same answer a misspelt path gets. That is fixed in the CODE, not here:
    # internal/api/router.go now registers the path and answers 503 with the code
    # llm_gateway_not_configured and the name of this variable. So the empty
    # value is now a stated posture instead of a silent one.
    #
    # A default URL cannot be correct, and would be worse than the empty value:
    #   1. internal/llmproxy/proxy.go ALWAYS builds an mTLS transport. With no
    #      readable client certificate, tls.LoadX509KeyPair fails, llmproxy.New
    #      returns an error, and cmd/elitea-main turns that into a FATAL boot
    #      error. A default URL with no certificates is a crash loop, not a
    #      working /llm path.
    #   2. The certificates arrive through
    #      fileConfig.llmGatewayClientMaterial above, which mounts a Secret at
    #      the directory these three paths live in. That Secret must exist in
    #      THIS namespace: the gateway chart's cert-manager Certificate issues
    #      one into `elitea-gateway`, and a Secret is namespace-scoped, so a
    #      split-namespace install needs the second Certificate or the
    #      replication described in the "Cross-namespace Secrets" section of
    #      deploy/README.md.
    # So the chart refuses the half-configured combination instead: set this URL
    # and the three file paths below together, or set none of them.
    # elitea-main.validateLLMGateway in _helpers.tpl performs that check at
    # `helm template` time, so the terminal that ran the command shows the reason.
    #
    # Cross-namespace: this must be an FQDN when the gateway is in another
    # namespace, e.g.
    #   https://elitea-llm-gateway-svc.elitea-gateway.svc.cluster.local:8083
    LLM_GATEWAY_URL: ""

    # The mTLS material for the hop above. These three are FILE PATHS, not the
    # certificate text: internal/llmproxy/proxy.go passes them to
    # tls.LoadX509KeyPair and os.ReadFile.
    #
    # They were previously declared in the `secrets:` block as secretKeyRef
    # entries. That shape cannot work: a secretKeyRef sets the variable to the
    # CONTENT of the Secret key, so the process then tried to open a file whose
    # name was a PEM block. Mount the material as a volume and put the paths
    # here.
    LLM_GATEWAY_CLIENT_CERT: ""
    LLM_GATEWAY_CLIENT_KEY: ""
    LLM_GATEWAY_CA_FILE: ""

    # --- Tracing / observability (issue #250) -----------------------------------
    # OTLP/HTTP collector base URL. Read by both libs/go/observability (elitea-main's
    # own span export) and internal/api/v2/tracing's otlp proxy target — one var
    # controls both paths. Empty defers to the OTLP exporter's own env handling
    # (effectively localhost, i.e. no-op in a cluster) and to tracing's own
    # "http://otel-collector:4318" default, which only resolves if a service by
    # that name exists in this namespace (see the otel-collector chart/values).
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    # Standard OTel SDK kill switch (https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/).
    # Set to "true" to disable span export and make the tracing ingest routes
    # answer "disabled" instead of forwarding — e.g. an environment with no
    # collector deployed at all.
    OTEL_SDK_DISABLED: ""

    # --- DeepWiki facade (ADR-0022 P2) -------------------------------------
    #
    # Off by default: a deployment that does not run the elitea-deepwiki
    # provider must not register the four /api/v2/deepwiki routes at all.
    # Turning this on WITHOUT the three mTLS files below is a startup failure,
    # not a degraded mount — the provider terminates mTLS with CERT_REQUIRED
    # and would refuse every request, so a facade that came up anyway would be
    # four routes answering 503 while the flag says the feature is on.
    ELITEA_DEEPWIKI_ENABLED: ""
    # The provider's origin. Must be https: it serves nothing over plain HTTP.
    ELITEA_DEEPWIKI_BASE_URL: ""
    # Client certificate material for the hop, mounted from a Secret by the
    # operator (see mTLS mounts for the gateway hop, which these mirror).
    # These are PATHS, not key material, so they belong in env and not in
    # `secrets:` below.
    ELITEA_DEEPWIKI_CLIENT_CERT_FILE: ""
    ELITEA_DEEPWIKI_CLIENT_KEY_FILE: ""
    ELITEA_DEEPWIKI_CA_FILE: ""
    # Overrides the SNI/verification name when the Service DNS name differs
    # from the certificate's subject. Empty means "use the base URL's host",
    # which is right whenever the certificate was issued for that name.
    ELITEA_DEEPWIKI_SERVER_NAME: ""
    ELITEA_DEEPWIKI_TIMEOUT_SECONDS: ""
    # The origin the PROVIDER calls back to for artifacts and models. Required
    # whenever the facade is on: the engine derives the artifact API base by
    # stripping `/llm/v1` off the api_base it is handed, so this one value is
    # both, and configuring them apart is not expressible. Set it to the
    # in-cluster origin of elitea-main, e.g. http://elitea-main:8080.
    ELITEA_DEEPWIKI_CALLBACK_BASE_URL: ""
    # How long a minted callback bearer lives. It must outlast the longest
    # generation this deployment expects: a token that dies mid-run makes the
    # engine fail its artifact upload after doing all the work. Default 120.
    ELITEA_DEEPWIKI_CALLBACK_TOKEN_TTL_MINUTES: ""
    # The git hosts a repository may be cloned from. FAIL-CLOSED: unset refuses
    # every clone, and `*` disables the control explicitly.
    #
    # The SAME variable is read by the provider service, deliberately. The
    # facade checks it before opening the vault (so a host nobody allowed never
    # causes a decrypt) and the provider checks it before building a clone URL
    # (so the credential is never written into one). Two allowlists that could
    # disagree would mean an invocation that starts and then fails.
    ELITEA_DEEPWIKI_GIT_ALLOWLIST: ""

    # --- Inventory facade (ADR-0023 H4c) -----------------------------------
    #
    # Off by default, like DeepWiki's and for the same reason: a deployment
    # that does not run the elitea-inventory provider must not register the
    # three /api/v2/inventory routes at all. Turning this on WITHOUT the three
    # mTLS files below is a startup failure, not a degraded mount — the
    # provider terminates mTLS with CERT_REQUIRED and would refuse every
    # request, so a facade that came up anyway would be three routes answering
    # 503 while the flag says the feature is on.
    ELITEA_INVENTORY_ENABLED: ""
    # The provider's origin. Must be https: it serves nothing over plain HTTP.
    ELITEA_INVENTORY_BASE_URL: ""
    # Client certificate material for the hop, mounted from a Secret by
    # fileConfig.inventoryClientMaterial above. These are PATHS, not key
    # material, so they belong in env and not in `secrets:` below.
    ELITEA_INVENTORY_CLIENT_CERT_FILE: ""
    ELITEA_INVENTORY_CLIENT_KEY_FILE: ""
    ELITEA_INVENTORY_CA_FILE: ""
    # Overrides the SNI/verification name when the Service DNS name differs
    # from the certificate's subject. Empty means "use the base URL's host".
    ELITEA_INVENTORY_SERVER_NAME: ""
    ELITEA_INVENTORY_TIMEOUT_SECONDS: ""

    # --- The Inventory facade's source expansion (ADR-0023 H4c I2) ---
    #
    # ONE ALLOWLIST VARIABLE PER APP, not one shared with DeepWiki. The two
    # facades clone from different things for different reasons — DeepWiki from
    # the repository a wiki documents, Inventory from every repository a
    # knowledge graph ingests — and a deployment that wants one and not the
    # other has to be able to say so. Fail-closed in exactly the same way:
    # unset refuses every source, and `*` disables the control explicitly.
    ELITEA_INVENTORY_GIT_ALLOWLIST: ""

    # --- The toolkit credential connection check (#319, toolkit half) ---
    #
    # The hosts a "test connection" on a TOOLKIT credential (github, gitlab,
    # bitbucket, jira, confluence) may reach, for the one authenticated metadata
    # GET that check makes. The base URL is tenant-authored (#13), so it is
    # checked before the dial, with the same matching rules the two facades
    # above use: hostnames, case-insensitive, `*.` for DIRECT subdomains only,
    # a bare `*` to disable the control out loud.
    #
    # UNSET IS NOT FAIL-CLOSED HERE, and that is the difference from the two
    # allowlists above. A clone reaches a URL somebody typed into a request; this
    # check reaches the endpoint of a credential the platform itself ships a
    # toolkit for, so an empty value falls back to the five vendors' PUBLIC API
    # hosts (api.github.com, github.com, gitlab.com, api.bitbucket.org,
    # bitbucket.org, *.atlassian.net). Set it to reach a self-hosted GitLab or
    # Jira — the value REPLACES that default, it does not extend it.
    ELITEA_TOOLKIT_CHECK_ALLOWLIST: ""
    # The origin the Inventory provider calls back to for artifacts and models.
    # EMPTY DISABLES SOURCE EXPANSION rather than failing the boot: the eight
    # Inventory tools that only read an existing graph still work, and the
    # three that name a source get the provider's own refusal. Set it to the
    # platform's own external origin (the same value DeepWiki's takes).
    ELITEA_INVENTORY_CALLBACK_BASE_URL: ""
    # How long that bearer lives. Default 120 minutes; it must outlast the
    # longest ingestion this deployment expects.
    ELITEA_INVENTORY_CALLBACK_TOKEN_TTL_MINUTES: ""
    # Which source toolkit types may be expanded. Empty means the default,
    # "github,ado_repos". It can only SUBTRACT: a type with no field
    # projection in internal/api/v2/inventory (gitlab, bitbucket today) cannot
    # be admitted by configuration, because admitting it would mean sending
    # fields nobody enumerated.
    ELITEA_INVENTORY_SOURCE_TYPES: ""

    # What this deployment does with a provider the admission plane records
    # but has not put in force (migration 0107, internal/providerhost/admission).
    #
    #   record  — the DEFAULT. An `inactive` provider is invoked normally; a
    #             REVOKED one is refused, in either posture, because a
    #             revocation is a decision somebody made and the
    #             administration surface's one action must not be advisory.
    #   enforce — only an `active` provider may be invoked.
    #
    # RECORD HAS TO BE THE DEFAULT, and that is not timidity. Nothing in this
    # deployment can reach `active`: activation requires a policy overlay no
    # issuer exists for, and migration 0107 enforces that as a CHECK
    # constraint (provider_admitted_revision_active_needs_overlay). Setting
    # `enforce` today therefore refuses EVERY provider — a deliberate lockout,
    # not a hardening step, until an overlay issuer ships.
    #
    # Empty is record. Anything else is a BOOT FAILURE rather than a quiet
    # fall back, so `enfroce` cannot leave an operator believing they are
    # enforcing while everything is admitted.
    ELITEA_PROVIDER_ADMISSION: "record"

    # The primary pgxpool size, per elitea-main replica.
    #
    # The chart set NOTHING here, and cmd/elitea-main/database_pool.go returns
    # early when it is unset — so pgx applied max(4, numCPU), a number that
    # varied with the node the pod landed on and that no operator could read
    # off a values file.
    #
    # 6 is measured, not guessed: one replica with the runtime plane OFF uses 6
    # connections against the E2E stack. It also has to satisfy the budget at
    # autoscaling.maxReplicas — 6 x 10 = 60, inside the 75 that
    # postgresql.maxConnections minus reservedConnections leaves.
    #
    # Turning the runtime plane ON adds 36 per replica, which does NOT fit at
    # ten replicas. That is not a defect in this default: it is the arithmetic
    # elitea-main.validateConnectionBudget exists to make visible, and the
    # deployment has to answer it with a bigger server or fewer replicas.
    ELITEA_DATABASE_MAX_CONNS: "6"

  # secrets: sensitive env vars sourced from Kubernetes Secrets (rendered as
  # valueFrom.secretKeyRef in deployment.yaml), NOT plaintext in the env map
  # above — mirrors this file's `llmGateway:` block `secrets:`
  # block. Each entry maps the ENV VAR NAME the binary reads -> the Secret
  # name + key. `optional: true` lets the pod start when the Secret or key is
  # absent — correct here because only one storage backend is active per
  # STORAGE_BACKEND value, so e.g. AZURE_STORAGE_KEY is simply irrelevant
  # when STORAGE_BACKEND=s3, and S3/Azure can each run credential-less via
  # workload identity (serviceAccount.annotations) instead of a static key.
  #
  # CAUTION (found by adversarial review, S17): "credential-less" here does
  # NOT mean "fails until configured" — it means the Go backend falls through
  # to the cloud SDK's own ambient-credential chain (AWS's LoadDefaultConfig /
  # Azure's NewDefaultAzureCredential / GCP's Application Default Credentials;
  # see internal/infra/storage/{s3,azure,gcs}/backend.go). On a cluster whose
  # NODES already carry some IAM role/managed identity with storage access
  # (common when nodes also run logging/monitoring DaemonSets), an operator
  # who forgets BOTH the Secret above AND serviceAccount.annotations gets a
  # pod that starts, passes objectStoreReadinessProbe, and silently runs
  # under whatever ambient node identity it happened to inherit — not the
  # clear startup failure an operator would expect and could quickly
  # diagnose. Set exactly one of (this Secret) or (serviceAccount.annotations)
  # per backend deliberately; do not rely on "it started, so it must be
  # configured right."
  #
  # Provision the referenced Secret out-of-band (kubectl create secret /
  # external-secrets operator / sealed-secrets), e.g.:
  #   kubectl create secret generic elitea-main-storage-secrets \
  #     --from-literal=s3-access-key=... --from-literal=s3-secret-key=... \
  #     --from-literal=azure-storage-key=...
  secrets:
    # The DeepWiki identity secret. It signs the X-Elitea-* headers the
    # provider verifies and must hold the SAME value on both sides, exactly as
    # GATEWAY_IDENTITY_SECRET does for the /llm hop. `optional: true` because
    # a deployment with ELITEA_DEEPWIKI_ENABLED off has no provider to sign
    # for; when the facade IS on, an absent secret means unsigned identity
    # headers, and the provider then has only the mTLS hop to go on.
    ELITEA_DEEPWIKI_IDENTITY_SECRET:
      secretName: elitea-deepwiki-secrets
      key: identity-secret
      optional: true
    # The Inventory identity secret. The same rule and its own value: it signs
    # the headers the Inventory provider verifies and must hold the SAME value
    # on both sides. A shared secret between the two providers would let one
    # provider's compromised key sign for the other.
    ELITEA_INVENTORY_IDENTITY_SECRET:
      secretName: elitea-inventory-secrets
      key: identity-secret
      optional: true
    # Outbound e-mail relay password (ADR-0024 WP7). Optional: a deployment
    # without SMTP never reads it; one with SMTP_USERNAME set refuses to start
    # without it (username and password must be set together).
    SMTP_PASSWORD:
      secretName: elitea-main-mail-secrets
      key: smtp-password
      optional: true
    S3_ACCESS_KEY:
      secretName: elitea-main-storage-secrets
      key: s3-access-key
      optional: true
    S3_SECRET_KEY:
      secretName: elitea-main-storage-secrets
      key: s3-secret-key
      optional: true
    AZURE_STORAGE_KEY:
      secretName: elitea-main-storage-secrets
      key: azure-storage-key
      optional: true
    # Issue #11: the gateway now REFUSES TO START without this secret, and it must
    # hold the SAME value on both sides — the edge signs the X-Elitea-* identity
    # headers the gateway verifies. Leaving the edge unsigned while the gateway
    # verifies makes every /llm request fail verification, so this side is
    # non-optional too. Provision before install/upgrade.
    GATEWAY_IDENTITY_SECRET:
      secretName: elitea-main-llm-gateway-secrets
      key: gateway-identity-secret
      optional: false
    # LLM_GATEWAY_CLIENT_CERT, LLM_GATEWAY_CLIENT_KEY and LLM_GATEWAY_CA_FILE were
    # here as secretKeyRef entries. They are removed (issue #463), because that
    # shape cannot work: internal/llmproxy/proxy.go reads all three as FILE PATHS,
    # and a secretKeyRef sets the variable to the CONTENT of the Secret key. The
    # pod then tried to open a file whose name was a PEM block. They are now plain
    # path entries in the `env:` map above; mount the material as a volume.
    # Password for the general-purpose Redis named by env.REDIS_URL above — the
    # project event stream's transport (issue #382). Optional, because a Redis
    # with no authentication needs no password and the pod must still start.
    REDIS_PASSWORD:
      secretName: elitea-main-redis-secrets
      key: redis-password
      optional: true

  # --- Runtime plane (issue #382) ----------------------------------------------
  # Agent execution, the execution-events stream, index ingest, index scheduling
  # and configuration validation. This is the biggest capability the chart left
  # dark, and it is the one that decides whether a Kubernetes install can run
  # without pylon at all.
  #
  # ALL-OR-NOTHING. internal/runtimecomposition/config.go builds this
  # configuration with a `required()` helper: every name must be present and
  # non-empty, or the process exits at boot. It also REFUSES a setting whose
  # dispatch plane is not explicitly enabled. So there is no "turn on half of
  # it". The chart checks the whole set at `helm template` time and names the
  # missing field, so a partial values file fails on the terminal.
  #
  # PREREQUISITE: production authentication. cmd/elitea-main refuses to compose
  # the runtime without a principal validator and a forwarded-identity verifier,
  # and this chart builds both only from fileConfig.authConfig. Set
  # fileConfig.authConfig.enabled=true as well.
  #
  # WHAT STILL BLOCKS A KUBERNETES INSTALL — read this before you set
  # enabled: true. The runtime reads its keys, passwords and certificates through
  # internal/security/securefile, which applies three rules:
  #   1. The path must be canonical and its final component must NOT be a
  #      symlink.
  #   2. Private material (command-signing-key.pem, redis-producer-password and
  #      the three server .key files) must carry OWNER BITS ONLY — at most 0600.
  #   3. The file must be readable by the process owner.
  # A plain Kubernetes `secret:` volume breaks rule 1: it is a symlink farm, so
  # every path resolves through a ..data/ symlink and securefile refuses it. A
  # per-file `subPath` mount fixes rule 1 and then breaks rules 2 and 3 together:
  # the file is owned by root, this pod runs as nonroot, and the only modes that
  # let a nonroot process read a root-owned file (0440 with fsGroup, or 0444)
  # carry group or other bits that rule 2 rejects.
  #
  # So the runtime plane needs a material source that writes REAL files owned by
  # the pod's own user with mode 0600 — a CSI driver or a sidecar that
  # materialises them into an emptyDir. That mechanism is issue #382's declared
  # out-of-scope ("secret delivery"), so the chart does not choose one for you:
  # runtime.material.volume takes the volume specification and the chart wires
  # every file path under runtime.material.mountPath.
  #
  # deploy/scripts/gen-runtime-certs.sh mints the material and its FILE NAMES are
  # the contract — the chart derives every path from them, so whatever supplies
  # the volume must present exactly these names:
  #   runtime-ca.crt                 command-signing-key.pem
  #   control-server.crt             command-signing-keyring.json
  #   control-server.key             redis-producer-password
  #   output-server.crt              content-server.crt
  #   output-server.key              content-server.key
  runtime:
    # OFF by default, because turning it on requires production Form
    # authentication, and that needs `fileConfig.authConfig.document.public_origin`
    # — an address only the operator knows, which no chart can default.
    #
    # It cannot be turned on ALONE, and it cannot be left off while the worker
    # runs. The worker dials control/output/content on elitea-main, so either
    # half without the other admits every chat turn over HTTP and then answers
    # none of it — silently, with nothing in any log. templates/guards.yaml
    # refuses that combination at render time rather than letting it install.
    #
    # To turn chat on, set all three together:
    #   main.runtime.enabled, worker.enabled, runtimeRedis.enabled
    # plus fileConfig.authConfig (see below).
    enabled: false

    # The base plane: configuration validation. Always required when enabled.
    # The stream name must differ from every dispatch stream below.
    commandStream: ""
    maxOutstanding: 64
    streamMaxEntries: 1024

    # The four agent turn routes — the chat send path.
    agentExecutionDispatch:
      enabled: false
      commandStream: ""
      consumerGroup: ""
      streamMaxEntries: 1024
      # OPTIONAL. The origin elitea-main calls for the next-input-suggestion
      # policy. Empty is the normal value: the call is a SELF call and this
      # process serves cleartext, so the origin is derived from its own listener
      # (http://127.0.0.1:<port of ELITEA_HTTP_ADDRESS>).
      #
      # Set it only where another server answers that path — centry-hybrid aims
      # it at the edge, which routes the path to legacy Centry. It must then be
      # an https ORIGIN, with no path, query or fragment, on an address that
      # TERMINATES TLS. An https origin on elitea-main's own cleartext port is
      # refused at boot.
      currentMainBaseUrl: ""

    # Index start, index cancel and index metadata. NEEDS
    # env.ELITEA_CONFIGURATIONS_ENABLED="true": the handlers compose through the
    # Configurations dependency, and the embedding binding resolves from the same
    # configuration rows.
    #
    # Giving this the SAME commandStream AND the SAME consumerGroup as
    # agentExecutionDispatch is supported, and it is what the standalone compose
    # stack does: one worker then serves both capabilities, because the worker
    # dispatches on the command's capability id rather than on its stream. Doing
    # that costs no second worker, no second consumer group and no extra Redis
    # ACL grant. Sharing the stream with a DIFFERENT group is refused.
    indexIngestDispatch:
      # The SAME stream and group as agentExecutionDispatch on purpose: the
      # worker dispatches on the command's capability id, not on its stream, so
      # one worker serves both and this costs no second consumer group and no
      # extra Redis ACL grant.
      enabled: false
      commandStream: ""
      consumerGroup: ""
      streamMaxEntries: 1024

    # The index schedule write and delete routes. NEEDS indexIngestDispatch.
    indexScheduling:
      enabled: false
      # Lowercase letters, digits, dot, underscore and hyphen; it must start with
      # a letter or a digit.
      instanceId: ""

    # The runtime's OWN Redis — mutually authenticated, and separate from the
    # general-purpose Redis in env.REDIS_URL above.
    redis:
      # Must be a rediss:// URL that carries an ACL USERNAME and NO password, and
      # it must select database zero explicitly, e.g.
      #   "rediss://producer@elitea-runtime-redis:6380/0"
      # The password comes from the redis-producer-password file in the material
      # volume, never from the URL.
      url: ""
      poolSize: 8

    # Must equal the key id inside command-signing-keyring.json. The composition
    # cross-checks the two and refuses to start on a mismatch.
    signingKeyId: ""

    # Three listeners, three DISTINCT addresses. The agent worker dials all three
    # on this Service, so the server certificates must carry the Service name.
    # The chart opens the ports on the container and the Service when the runtime
    # is enabled.
    listeners:
      controlAddress: ":9443"
      outputAddress: ":9444"
      contentAddress: ":9445"

    # Where the runtime keys, passwords and certificates come from, and where the
    # service reads them.
    #
    # THE KEY NAMES ARE THE CONTRACT. The chart derives every ELITEA_RUNTIME_*
    # file path from mountPath plus one of these names, and they are the names
    # deploy/scripts/gen-runtime-certs.sh writes:
    #
    #   runtime-ca.crt                the trust root: the Redis CA, and the
    #                                 client CA of all three listeners
    #   command-signing-key.pem       Ed25519 PKCS#8, signs dispatch envelopes
    #   command-signing-keyring.json  its public half, keyed by signingKeyId
    #   redis-producer-password       the runtime Redis ACL password
    #   control-server.crt / .key     the control listener keypair
    #   output-server.crt / .key      the output listener keypair
    #   content-server.crt / .key     the content listener keypair
    #
    # The server certificates must carry the Service name, because the agent
    # worker dials all three listeners on this Service.
    material:
      mountPath: /run/elitea-runtime

      # A Kubernetes Secret whose keys are the names above. This is the supported
      # source, and it is how every other secret in this platform arrives:
      #
      #   kubectl create secret generic elitea-runtime-material \
      #     --from-file=runtime-ca.crt --from-file=command-signing-key.pem ...
      #
      # The chart cannot mount that Secret straight at mountPath.
      # internal/security/securefile refuses a path that resolves through a
      # symlink and requires owner-only bits on private material, and a Secret
      # volume gives neither: mounted whole it is a symlink farm, and mounted per
      # file with subPath its files belong to root while this pod runs as
      # nonroot. So the chart adds an init container (issue #404). It runs the
      # same image and the same user, copies each key into a memory-backed
      # emptyDir at mode 0600, and reads every file back through securefile
      # before it exits. A missing key stops the pod there, with a message.
      secretName: ""

      # The mode the kubelet gives each key of that Secret. The init container
      # has to read them, and the kubelet owns them as root, so without a pod
      # fsGroup the read bit for other users is the only one that reaches this
      # pod's user. It applies inside this pod's own mount namespace only, and
      # the copies that the service reads are owner-only. Set
      # podSecurityContext.fsGroup and lower this to 0440 to tighten it.
      secretDefaultMode: 0444

      # The bound on the emptyDir that holds the copies. The whole material is a
      # few kilobytes; the rest is headroom for a large CA bundle.
      sizeLimit: 8Mi

      # An alternative source, for a deployment whose material is ALREADY real,
      # owner-owned files at mountPath — a CSI secret driver, for example. It
      # takes a Kubernetes volume specification without its `name`; the chart
      # adds the name and mounts it read-only. Mutually exclusive with
      # secretName, and no init container renders with it.
      #
      #   volume:
      #     csi:
      #       driver: secrets-store.csi.k8s.io
      #       readOnly: true
      #       volumeAttributes:
      #         secretProviderClass: elitea-runtime-material
      volume: {}

  # Kubernetes execution path for the versioned migration corpus
  # (services/elitea-main/migrations/{shared,tenant}, applied by the separate
  # cmd/elitea-migrate binary already built into this chart's image) — distinct
  # from the dev-only boot bootstrap (bootstrapLegacySchema /
  # ELITEA_DEV_BOOTSTRAP_LEGACY_SCHEMA in cmd/elitea-main, which this does NOT
  # touch or replace). Runs as a pre-install/pre-upgrade Helm hook Job so it
  # completes — or the release aborts — before any Deployment pods roll; see
  # templates/migrate-job.yaml for the full ordering-guarantee explanation.
  migrations:
    enabled: true
    # Empty means the namespace default ServiceAccount. The chart's own
    # ServiceAccount cannot be used here: this Job is a pre-install hook and that
    # object is created later in the release, so naming it makes a FIRST install
    # fail with "error looking up service account ... not found". Set this only
    # when the database credential comes from a bound identity (cloud IAM auth),
    # and provision that ServiceAccount outside this chart so it exists when the
    # hook runs.
    serviceAccountName: ""
    # -all-tenants mirrors deploy/centry-hybrid/pov-compose.yml's elitea-migrate
    # invocation: apply the shared history, then the tenant history for every
    # existing legacy project. Both cmd/elitea-migrate flags are idempotent —
    # already-applied migration files are skipped — so re-running on every
    # upgrade is safe.
    args:
      - -all-tenants
    image:
      # Empty means "use .Values.image.repository/.tag" (the Deployment's own
      # image) — the normal case, since cmd/elitea-migrate ships in that same
      # image. Only set these to pin the migration step to a different tag.
      repository: ""
      tag: ""
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi

  probes:
    startup:
      path: /startupz
      initialDelaySeconds: 2
      periodSeconds: 3
      failureThreshold: 10
    liveness:
      path: /healthz
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      failureThreshold: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  serviceAccount:
    create: true
    name: ""
    # IRSA (eks.amazonaws.com/role-arn) or Azure Workload Identity
    # (azure.workload.identity/client-id) go here (S17) — credential-less
    # access to the object store backend, an alternative to the static keys
    # in the secrets: block above. Empty by default: static keys remain the
    # baseline until an environment opts into workload identity.
    annotations: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

web:
  # The browser app.
  enabled: true
  # elitea-web: the SPA image (apps/elitea-web/Containerfile) — nginx serving
  # pre-built static assets under /app/, with config.js written at container start
  # from the VITE_* env vars below (apps/elitea-web/docker-entrypoint.sh).
  #
  # Stateless, so replicas are free and a rollout is safe at any time.
  replicaCount: 2

  image:
    # Published by .github/workflows/publish.yml (matrix entry `elitea-web`,
    # context `.`, dockerfile apps/elitea-web/Containerfile). Issue #240 was
    # filed while that entry did not exist yet; it does now, so this repository
    # is real. Pin `tag` to a release in production — `latest` plus
    # IfNotPresent means a node that already cached an older `latest` layer
    # keeps serving it.
    repository: ghcr.io/elitea-ng/elitea-web
    # tag comes from the single top-level image.tag
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    # The container's nginx listens on 80 (apps/elitea-web/nginx/spa.conf).
    port: 80

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: "200m"
      memory: 128Mi

  # nginx treats SIGTERM as *fast* shutdown — it aborts in-flight connections
  # rather than draining them (graceful is SIGQUIT). The grace period alone
  # therefore drains nothing; the preStop hook below is what does.
  terminationGracePeriodSeconds: 30

  # preStop drain. Kubernetes runs this BEFORE SIGTERM, so:
  #   1. the sleep gives kube-proxy/ingress time to remove this pod from the
  #      endpoints list (removal is asynchronous — with maxUnavailable: 0 a
  #      rolling upgrade otherwise resets requests still being routed here,
  #      surfacing as intermittent 502s on index.html/asset fetches);
  #   2. `nginx -s quit` is the GRACEFUL stop, finishing in-flight requests.
  # The container normally exits during the hook, so SIGTERM's fast shutdown is
  # never reached. Must stay well under terminationGracePeriodSeconds above.
  # The nginx alpine runtime has a shell, unlike the gateway's distroless
  # image where the equivalent hook has to stay disabled.
  preStop:
    enabled: true
    command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit"]

  # Runtime SPA configuration. docker-entrypoint.sh honours EXACTLY these five
  # keys and writes them into window.elitea_ui_config; anything else added here
  # reaches the container's environment but is never emitted to the browser.
  #
  # The two dev-mode auth keys from the old elitea-ui chain are deliberately
  # absent (contract C7b / defect D10): a static bearer credential must never
  # land in a world-readable config.js.
  env:
    # Path the SPA calls the API on. Relative, so it is resolved against the
    # origin the browser loaded the app from — i.e. this assumes an ingress or
    # gateway fronts both this Service and elitea-main on one host. If they are
    # on different origins, set an absolute URL AND arrange CORS on elitea-main.
    VITE_SERVER_URL: "/api/v2"
    # Must stay in step with the nginx location blocks in the image, which are
    # hardcoded to /app/. Changing this alone moves the SPA's router base without
    # moving what nginx serves, producing 404s on every deep link.
    VITE_BASE_URI: "/app/"
    VITE_SOCKET_SERVER: ""
    VITE_SOCKET_PATH: "/socket.io"
    # DERIVED from `platform.aiProjectId`, and "1" when nothing names a project.
    # Empty here is not a safe placeholder: the SPA decides "is this the public
    # project?" by string comparison against this value
    # (entities/project/model/selectors.ts, routes/-guards/publicProject.ts), so
    # "" makes every such check false: the public-project route guard never
    # matches, `include_shared` inverts, public agent listing goes dark — with
    # no error and no failing probe. "1" is what every other reference
    # deployment uses (deploy/docker-compose.yml's elitea-ui).
    #
    # UNSET here rather than "1", so `platform.aiProjectId` can fill it. Stating
    # "1" in the chart's own defaults would make every deployment whose public
    # project is not 1 a disagreement the operator has to resolve by editing two
    # places — which is the problem this key was one of three copies of.
    # templates/web/configmap.yaml renders "1" when nothing names a project, so
    # the rendered default is unchanged.
    #
    # The SPA now PREFERS the id elitea-main publishes on `platform_settings`
    # and keeps this as the fallback for a deployment too old to send that key
    # (shared/lib/hooks/usePublicProjectId.ts).
    VITE_PUBLIC_PROJECT_ID: ""

  probes:
    # There is no /healthz in this image and no `location /` in spa.conf, so the
    # container root returns 404 — probing "/" would fail a perfectly healthy
    # pod. /app/index.html is served by the SPA-shell location block.
    liveness:
      path: /app/index.html
      periodSeconds: 20
      failureThreshold: 3
    readiness:
      path: /app/index.html
      periodSeconds: 10
      failureThreshold: 3

  # CPU-based HPA is meaningful here (unlike the gateway's I/O-bound streaming or
  # the scheduler's serialised workers): serving static assets is CPU/network
  # work that scales linearly with replicas. Off by default so a cluster without
  # metrics-server does not get a permanently-degraded HPA object.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

scheduler:
  # Scheduled runs and price sync.
  enabled: true
  # elitea-scheduler — headless worker. There is no ingress and (by default) no
  # Service: nothing calls in, the process polls and consumes.
  #
  # READ services/elitea-scheduler/RETIREMENT.md AND THIS CHART'S README BEFORE
  # INSTALLING. In short: this binary carries FOUR independent responsibilities
  # and the three that matter are not the scheduler loop —
  #   1. the legacy centry.schedule poller (NOT the owner of product schedule
  #      occurrences; elitea-main's scheduling kernel is). It starts
  #      UNCONDITIONALLY — there is no env flag to turn it off (main.go always
  #      calls sched.Run). Which jobs it acts on is decided by DATA: the enabled
  #      flag on centry.schedule rows. Installing this chart against a database
  #      whose rows for a job elitea-main also registers are still enabled gives
  #      you TWO CLOCKS for that job, which RETIREMENT.md forbids.
  #   2. the price-catalog sync worker (PRICE_SYNC_ENABLED, off by default);
  #   3. the budget write-back consumer (BUDGET_WRITEBACK_ENABLED, off by
  #      default) that drains GATEWAY_BUDGET_DELTAS into
  #      gateway.llm_budget_accumulators;
  #   4. the audit-event retention sweep (AUDIT_RETENTION_DAYS, ON by default),
  #      which is the ONLY bound on the growth of centry.audit_events. It is not
  #      a centry.schedule row and cannot make a second clock — see
  #      RETIREMENT.md.
  # (2), (3) and (4) are the reason the image cannot simply be deleted; they
  # have no relocation decision yet.

  # Single replica. The poller's mutual exclusion is a Redis tick lock, so extra
  # replicas are not incorrect, but they buy nothing: every tick is executed once
  # regardless, and the price-sync/write-back workers are likewise
  # single-consumer shaped. The retention sweep takes no lock at all — its
  # batches use FOR UPDATE SKIP LOCKED, so two sweepers take disjoint rows.
  # Scale out only with a specific measured reason.
  replicaCount: 1

  image:
    repository: ghcr.io/elitea-ng/elitea-scheduler
    # tag comes from the single top-level image.tag
    pullPolicy: IfNotPresent

  # Recreate, not RollingUpdate: two generations overlapping during a rollout
  # would both hold pollers contending for the same Redis tick lock and the same
  # durable NATS consumer. A few seconds of no scheduler is cheaper than that.
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

  # The scheduler's shutdown path cancels the run context and closes the pool;
  # there are no long-lived client streams to drain, unlike the gateway.
  terminationGracePeriodSeconds: 30

  # Rendered into the ConfigMap and consumed via envFrom, mirroring
  # this chart's `main:` block. Names and defaults are
  # services/elitea-scheduler/internal/config/config.go; the values below match
  # deploy/docker-compose.yml's elitea-scheduler service where it sets them.
  env:
    # Empty means the binary's own default (localhost) — never correct in a
    # cluster. Set this.
    DATABASE_URL: ""
    # host:port, NOT a redis:// URL — the value is passed straight to
    # goredis.Options.Addr.
    # Empty means the top-level `redis` block, resolved in this namespace.
    REDIS_URL: ""
    RPC_CHANNEL: "elitea_rpc"
    # Must match .Values.healthPort below; the chart does not derive one from the
    # other so that an operator changing one and not the other fails loudly at
    # probe time rather than silently listening on the wrong port.
    HTTP_ADDR: ":8081"

    # Price-catalog sync (design §8.8). ON by default since issue #464.
    #
    # It was off, and it was off in the code too, so nothing ever filled
    # gateway.gateway_models. With no prices the cost calculator values every call
    # at zero. A budget whose spend is always zero never reaches its soft alert
    # and never reaches its hard limit, so the whole budget feature was inert
    # rather than merely unreported.
    #
    # The old reason for "off" was that enabling it against a database without
    # gateway.gateway_models does nothing useful. That table is created by
    # services/elitea-main/migrations/shared/0067_gateway_budget_schema.sql, which
    # this chart's elitea-main sibling applies as a pre-install hook, so the table
    # is present in every deployment that has the budget routes at all.
    #
    # PRICE_SYNC_SEED below carries a built-in catalogue, so this needs NO network
    # access to be useful. PRICE_SYNC_LITELLM adds the public catalogue on top; a
    # deployment with no egress can set that one to "false" and keep the seed.
    PRICE_SYNC_ENABLED: "true"
    PRICE_SYNC_INTERVAL: "24h"
    PRICE_SYNC_LITELLM: "true"
    PRICE_SYNC_SEED: "true"
    PRICE_SYNC_LITELLM_URL: ""

    # Budget write-back consumer (design §8.6). Requires BOTH the flag AND
    # GATEWAY_NATS_URL; with either unset the consumer never starts.
    #
    # CROSS-NAMESPACE: NATS is installed by deploy/helm/nats into the
    # `elitea-gateway` namespace (deploy/argocd/applications/nats.yaml) while this
    # chart's ArgoCD Application targets `elitea`. The short name `nats` does NOT
    # resolve across namespaces — use the FQDN below if you enable this.
    # ON by default since issue #464, with the FQDN filled in.
    #
    # WHY THIS IS NOT AN OPTIONAL EXTRA. gateway.llm_budget_accumulators is not
    # only the table the budget screens read. The gateway's fail-mode FSM reads it
    # as the Postgres DURABLE TIER: internal/failmode/store.go selects acc_found
    # and age_seconds from it, and the shipped LLM_BUDGET_NATS_FAIL_MODE is
    # "tiered_hybrid", which decides whether to allow or refuse a call from that
    # snapshot's freshness while NATS is down.
    #
    # With no consumer, the ONLY writer of that table is the gateway's own outage
    # UPSERT. So the durable tier was filled during outages and never during
    # healthy traffic — exactly backwards. The snapshot the degraded path consults
    # was permanently absent or stale, and every budget route reported no data.
    #
    # If you turn this off, turn it off knowingly: the budget screens then report
    # spend_available=false, which is the honest "no figure was collected" signal
    # rather than a zero.
    BUDGET_WRITEBACK_ENABLED: "true"
    # CROSS-NAMESPACE, so this is an FQDN and not the short name `nats`. NATS is
    # installed by deploy/helm/nats into `elitea-gateway`
    # (deploy/argocd/applications/nats.yaml) while this chart's Application
    # targets `elitea`. Change it if your topology differs.
    #
    # A NATS that does not answer is NOT fatal: cmd/elitea-scheduler logs
    # "budget write-back: NATS connect failed; consumer disabled" and keeps
    # running its other jobs. So this default degrades loudly instead of
    # preventing a deployment that has no NATS from starting.
    # Empty means the top-level `nats` block, resolved in this namespace.
    GATEWAY_NATS_URL: ""
    BUDGET_WRITEBACK_BATCH_SIZE: "500"
    BUDGET_WRITEBACK_ACK_WAIT: "30s"
    BUDGET_WRITEBACK_MAX_DELIVER: "10"

    # Audit-event retention sweep (issue #619).
    #
    # `centry.audit_events` received its first product writer in issue #615 —
    # an audit middleware that emits for administrative and security-relevant
    # requests — and no bound on its growth. This is that bound: bounded,
    # batched DELETEs of rows older than the window, run by
    # services/elitea-scheduler/internal/auditretention.
    #
    # ON by default. A retention sweeper that ships disabled is a retention
    # sweeper that does not exist, and this chart has carried flags no
    # deployment sets before (issues #394 and #395).
    #
    # AUDIT_RETENTION_DAYS is the only knob most operators touch, and it is also
    # the OFF switch: 0 or less disables the sweep, which the daemon reports at
    # WARN so that "this table is unbounded" is a line in the log rather than an
    # absence from it. There is no separate enable flag, because two settings
    # that must agree are two settings that can disagree.
    #
    # 365 days, because the window has to outlast the longest question an
    # operator asks of an audit trail. A shorter default would destroy evidence
    # on the first upgrade in every deployment that did not read the release
    # note.
    #
    # A POSITIVE window below 7 days is REFUSED, not applied: the sweeper logs
    # at ERROR and does not start. A one-day window is far more likely to be a
    # typo than a policy, and acting on the typo destroys a trail that no later
    # edit of this file brings back.
    AUDIT_RETENTION_DAYS: "365"
    # How often a pass starts. One pass is bounded by the two settings below, so
    # a shorter interval only means the bound is met sooner.
    AUDIT_RETENTION_INTERVAL: "1h"
    # Rows per DELETE statement, so no single statement locks an unbounded
    # number of rows. `ix_audit_events_timestamp` supports the scan.
    AUDIT_RETENTION_BATCH_SIZE: "1000"
    # Statements per pass — 50 × 1000 = 50 000 rows per hour. The ceiling exists
    # so the FIRST pass on a deployment that has never swept cannot spend hours
    # inside the database; the remainder goes on the next pass, and the log says
    # the pass did not drain. Raise it if that warning repeats for days. If it
    # keeps repeating with the ceiling raised, the next step is monthly RANGE
    # partitioning of the table on `timestamp` — not a bigger number here.
    AUDIT_RETENTION_MAX_BATCHES: "50"

    # Tracing (issue #250): same OTLP collector endpoint and kill switch as
    # the `main.env` map — see that chart's values.yaml for the
    # full rationale. Read by libs/go/observability.
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    OTEL_SDK_DISABLED: ""

  # Sensitive vars from Kubernetes Secrets (rendered as valueFrom.secretKeyRef),
  # never plaintext in the ConfigMap above — same shape as
  # the `llmGateway:` block and this chart's `main:` block.
  #
  # RPC_HMAC_KEY signs the Pylon/Arbiter RPC payloads the poller publishes on
  # RPC_CHANNEL. `optional: true` because the binary tolerates an empty key (it
  # then publishes unsigned) — which is exactly why you should set it: an absent
  # Secret does not fail, it downgrades.
  #
  #   kubectl create secret generic elitea-scheduler-secrets \
  #     --from-literal=rpc-hmac-key=...
  secrets:
    RPC_HMAC_KEY:
      secretName: elitea-scheduler-secrets
      key: rpc-hmac-key
      optional: true

  # Port the in-process health server listens on (must equal the port in
  # env.HTTP_ADDR above).
  healthPort: 8081

  # Optional ClusterIP over the health port. Off by default: kubelet probes reach
  # the container directly, so a Service is only needed if something external
  # (a Prometheus blackbox probe, an operator running curl) has to reach /healthz.
  service:
    enabled: false
    type: ClusterIP
    port: 8081
    annotations: {}

  probes:
    # /healthz PINGS THE DATABASE (internal/health/health.go) — it is a readiness
    # signal, not a liveness one. Wiring it to livenessProbe would restart this
    # pod every time Postgres hiccups, which is the trap issue #242 fixed for the
    # gateway. Liveness here is therefore a dependency-free TCP check that the
    # health server is still accepting connections.
    liveness:
      enabled: true
      periodSeconds: 20
      failureThreshold: 3
    # OFF by default, on purpose, and the reason is the sync waves rather than
    # the probe itself. With service.enabled=false nothing routes to this pod, so
    # readiness gates no traffic — but it still gates Deployment availability. A
    # Postgres outage AFTER boot (an outage at boot exits the process instead)
    # would flip /healthz to 503, take the pod NotReady, hold this wave-2
    # Application at Progressing/Degraded, and block the wave-3 elitea-web sync —
    # a frontend release stopped by a database blip in a worker nothing calls.
    # Turn this on together with service.enabled, where the probe earns its
    # keep by controlling endpoints.
    readiness:
      enabled: false
      path: /healthz
      periodSeconds: 10
      failureThreshold: 3

  # No HorizontalPodAutoscaler template in this chart, deliberately. Every unit of
  # work here is serialised behind a Redis tick lock or a single durable consumer,
  # so added replicas raise cost and lock contention without raising throughput —
  # an HPA would be a control that cannot help. Set replicaCount by hand if a
  # measured reason ever appears.

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

llmGateway:
  # The model hop. Chat and every embedding call go through it.
  enabled: true
  # scale-1 profile (design §8.1.1): a single gateway replica. HA operators
  # override replicaCount and LLM_BUDGET_EXPECTED_REPLICAS to the real count.
  replicaCount: 1

  image:
    repository: ghcr.io/elitea-ng/elitea-llm-gateway
    # tag comes from the single top-level image.tag
    pullPolicy: IfNotPresent

  # §9.5: gateway memory must be >=1Gi — provider streaming buffers plus the
  # bifrost object pools inflate the process well beyond the edge's footprint.
  # Legacy-parity hardening (issue #241): the shipped image is distroless
  # nonroot already, so runAsNonRoot/readOnlyRootFilesystem cost nothing — no
  # application-level temp-file writes were found (grepped for os.CreateTemp/
  # os.TempDir/os.Create). templates/deployment.yaml adds a writable /tmp
  # emptyDir regardless.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  # §9.5: provider LLM streams can run up to ~120s. A short grace period truncates
  # in-flight streams on every rolling deploy, so terminationGracePeriodSeconds
  # MUST be >=150 and rise together with the gateway's srv.Shutdown() context
  # (GATEWAY_SHUTDOWN_TIMEOUT).
  # 150s of HTTP drain (GATEWAY_SHUTDOWN_TIMEOUT) PLUS headroom for the phases
  # that run after it: the billing drain, the governance persist drain and the
  # NATS close (see shutdownSequence). With no headroom SIGKILL lands the instant
  # the HTTP drain uses its full budget, and the billing drain never executes —
  # silently dropping the very spend the drain exists to preserve.
  terminationGracePeriodSeconds: 180

  # preStop hook (§9.5). The primary drain mechanism is the gateway's own
  # SIGTERM-driven graceful shutdown (GATEWAY_SHUTDOWN_TIMEOUT, >=150s); the
  # preStop hook adds a quiet window so kube-proxy/ingress endpoints deregister
  # before SIGTERM, keeping new connections off a draining pod.
  #
  # NOTE: the runtime image is distroless/static, which has NO shell or sleep
  # binary — an `exec` sleep would fail. `enabled: false` by default; enable it
  # only with a `command` that the deployed image can actually run (e.g. the real
  # BF0.2b image bundling a sleep binary, or an httpGet variant). When disabled,
  # the app's graceful shutdown alone drains in-flight streams.
  preStop:
    enabled: false
    # Rendered verbatim under container.lifecycle.preStop when enabled.
    command: ["/bin/sleep", "15"]

  env:
    DATABASE_URL: ""
    # §9.5: keep the SSE write deadline disabled and pools tuned. These mirror the
    # config.go defaults; set explicitly so the deployment is self-documenting.
    GATEWAY_SHUTDOWN_TIMEOUT: "150s"
    GATEWAY_INITIAL_POOL_SIZE: "100"
    GATEWAY_PROVIDER_CONCURRENCY: "50"
    GATEWAY_LOG_LEVEL: "info"
    # NATS budget-path circuit breaker (§8.5). Trip after N consecutive failures;
    # probe again after the open-duration. Mirror config.go defaults.
    LLM_BUDGET_CB_FAILURE_THRESHOLD: "3"
    LLM_BUDGET_CB_OPEN_DURATION_SEC: "10"
    # Stream-disconnect billing (issue #9, DECISIONS.md 2026-08-05). When a
    # streaming client vanishes mid-response the gateway keeps the PROVIDER
    # stream alive this long so the authoritative usage trailer can still arrive
    # and be billed; if it does not arrive nothing is billed and a
    # budget.unbilled_stream event is emitted. Clamped to 15000 in code; "0"
    # disables the mechanism (early exits then bill nothing at all).
    # The trade-off: a client that hits Stop may be billed for up to this much
    # further generation, charged to its own project credential.
    LLM_STREAM_GRACE_MS: "5000"
    # Ceiling on concurrently-detained streams; each holds a goroutine and an
    # open provider socket for up to LLM_STREAM_GRACE_MS.
    LLM_STREAM_DRAIN_MAX_INFLIGHT: "256"
    # Realtime WebSocket sessions (/llm/v1/realtime).
    #
    # How often a LIVE session re-asks the budget gate. This is the ONLY thing
    # that bounds a session's spend: an HTTP request is gated once because it
    # ends, and a session does not end. bifrost reports a turn start for two
    # events the pylon relay never sends, so a re-check armed on turn start alone
    # would never fire at all. Lower it to cut the spend that can follow an
    # exhausted budget; raise it to cut budget reads. A non-positive or
    # unparsable value keeps the 15 s default.
    LLM_REALTIME_BUDGET_RECHECK_SEC: "15"
    # How often the gateway re-reads the authored governance definitions from
    # gateway.governance_config (issue #218). It is the bound on how long an
    # operator waits between saving a definition on /admin/gateway/governance and
    # this gateway enforcing it.
    #
    # There is NO event-driven reload. The poll is the only path, on purpose: a
    # replica that missed an event because it was starting, or because NATS was
    # down, must still converge. Lower it to shorten the wait; raise it to cut one
    # small SELECT per replica per interval. A non-positive or unparsable value
    # keeps the 30 s default.
    #
    # GET /governance/status on the internal listener reports the snapshot's
    # loaded_at, every row the gateway REJECTED, and every row that loaded but can
    # match nothing. Read it before concluding a rule is not working.
    LLM_GOVERNANCE_REFRESH_SEC: "30"
    # Ceiling on concurrent realtime sessions per replica; the per-project cap is
    # this divided by 8 (floor 1). Each session pins four goroutines and two open
    # sockets for as long as the caller talks, and a hijacked connection has its
    # deadlines cleared, so no server timeout can ever reap one.
    LLM_REALTIME_MAX_SESSIONS: "128"
    # Browser origins that may open /llm/v1/realtime, comma-separated
    # (e.g. "https://dev.elitea.ai"). EMPTY IS THE SECURE DEFAULT and it is not
    # "no policy": a WebSocket handshake is NOT subject to CORS, so without an
    # origin check any page could open this route with the user's ambient
    # credentials. Empty admits only a handshake whose Origin matches the
    # gateway's own host, or one with no Origin at all — which is every
    # non-browser client, including the SDK worker this route exists for
    # (pylon-indexer was that client until #339 deleted it). Name a browser
    # origin only on purpose; the startup log states which
    # mode is armed.
    LLM_REALTIME_ALLOWED_ORIGINS: ""
    # scale-1 default; HA operators MUST override to the real replica count.
    LLM_BUDGET_EXPECTED_REPLICAS: "1"
    # NATS JetStream coordination substrate (design §8.1.1). Points at the NATS
    # client ClusterIP service provisioned by deploy/helm/nats.
    # Must match the env var name the binary reads: GATEWAY_NATS_URL (config.go).
    # Empty means the top-level `nats` block, resolved in this namespace.
    GATEWAY_NATS_URL: ""
    # GATEWAY_IDENTITY_SECRET (HMAC key, §5.3) and SECRETS_MASTER_KEY (Fernet vault
    # master key) are SENSITIVE — they are NOT set here as plaintext. They are wired
    # from Kubernetes Secrets via the `secrets:` block below (rendered as
    # valueFrom.secretKeyRef in deployment.yaml). Setting them here too would
    # produce duplicate env keys.
    #
    # NOTE: GATEWAY_TLS_CERT_FILE / GATEWAY_TLS_KEY_FILE / GATEWAY_TLS_CA_FILE are
    # NOT configured here. When mtls.enabled=true the chart injects these env vars
    # automatically (deployment.yaml) pointing at the mtls.mountPath volume. Keeping
    # them out of this map avoids duplicates and prevents operators from accidentally
    # supplying conflicting paths.

    # FIX 2 (MEDIUM): budget/NATS operational env vars — absent from round-1/round-2,
    # so operators couldn't configure them and they silently took code defaults.
    # Values below mirror config.go defaults (§8.5); override as needed.
    #
    # Platform-baseline NATS-failure policy (§8.5).
    # "tiered_hybrid" (default) | "fail_open" | "fail_closed".
    # A per-project gateway.project_budget.nats_fail_mode overrides this at runtime.
    LLM_BUDGET_NATS_FAIL_MODE: "tiered_hybrid"
    # How old (integer minutes) the Postgres snapshot may be before the tiered-hybrid
    # fallback degrades to 503 (NATS_DOWN_PG_STALE). Default: 5.
    LLM_BUDGET_PG_FRESHNESS_MIN: "5"
    # Absolute per-replica degraded-window overspend cap in USD (§8.5).
    # 0 = use 10 % of the project hard_limit_usd instead of a fixed cap.
    LLM_BUDGET_NATS_DEGRADED_CAP_USD: "0"
    # Continuous NATS outage ceiling (integer minutes). Once NATS has been down longer
    # than this the FSM forces closed (503) regardless of snapshot freshness. Default: 10.
    LLM_BUDGET_NATS_DEGRADED_MAX_DURATION_MIN: "10"

    # ISSUE #304 — what the process does at STARTUP when the budget gate could
    # not be wired. It is not a fourth fail mode: LLM_BUDGET_NATS_FAIL_MODE
    # above decides what a RUNNING gateway does when NATS breaks, and it can
    # only act on a connection that once succeeded.
    #
    #   auto (default)  Refuse to start when GATEWAY_NATS_URL is empty AND the
    #                   database holds an enforcing budget row. That state
    #                   cannot recover — nothing re-dials a URL that was never
    #                   given — and /readyz reports ready, so nothing else
    #                   reports it. A CONFIGURED NATS that did not answer keeps
    #                   the current behaviour: /readyz reports not ready and the
    #                   background loop re-dials (issue #315).
    #   on              Refuse to start whenever the budget gate is not wired.
    #                   Choose this when the deployment must never serve one
    #                   unmetered request, and accept a CrashLoopBackOff for as
    #                   long as NATS is down.
    #   off             Never refuse. It needs llmGateway.acknowledgeUnenforcedBudgets
    #                   below, because it accepts unmetered spend.
    #
    # The binary reads any OTHER value as "auto"; the chart refuses to render
    # one, so a values file cannot say "false" and mean "off".
    LLM_BUDGET_REQUIRE_ENFORCEMENT: "auto"

    # BFF.6 — circular-routing guard #1 (spec §2.6): the platform's own /llm
    # origins, comma-separated. Any credential api_base matching one of these is
    # rejected with SELF_REFERENTIAL_CREDENTIAL at request time. MUST list every
    # public and in-cluster origin that reaches the /llm surface; empty leaves
    # the request-time guard inert (the elitea-main upsert-time guard remains).
    # e.g. "https://dev.elitea.ai/llm/v1,http://elitea-main:8080/llm/v1"
    #
    # ISSUE #467: this MUST be set. The chart refuses to render while it is empty
    # (elitea-llm-gateway.validateGuards in templates/_helpers.tpl), because an
    # empty value makes the guard admit every credential and the process then
    # writes one warning line and serves anyway. There is no default: only the
    # operator knows the origins, and a guessed origin would guard a name nobody
    # uses while leaving the real one open.
    GATEWAY_SELF_LLM_ORIGINS: ""

    # Issue #13 — egress allowlist for TENANT-AUTHORED credential `api_base`
    # values. Comma-separated `host`, `host:port`, `*.domain`, `*.domain:port`
    # or a CIDR block. An unparsable entry is FATAL at startup (a typo must not
    # silently narrow or widen the policy).
    #
    # GAP G6: this key is the BOOTSTRAP FLOOR, not the whole policy. The gateway
    # also reads `egress_allowlist` rows from gateway.governance_config, written
    # in Admin > LLM Proxy > Governance, and it enforces the UNION. An authored
    # row can only ADD a destination: nothing an admin authors withdraws a host
    # this key names, because the chart and the admin console are different
    # authorities. Set this for the hosts that must work before anybody can log
    # in, and author the rest.
    #
    # Two modes, and there is deliberately no third:
    #   ""       (default) api_base hosts are unrestricted UNTIL an admin
    #            authors the first row, and bifrost's SSRF-safe dialer stays ON
    #            for every provider — so no tenant can steer the gateway at an
    #            RFC-1918 address. Self-hosted vLLM / Ollama on a private
    #            network does NOT work in this mode.
    #   non-empty  every credential api_base must match an entry (checked BEFORE
    #            the Fernet vault decrypts its api_key, so a non-allowlisted
    #            destination never receives a resolved secret).
    #
    # PRIVATE DESTINATIONS NEED AN EXPLICIT ENTRY. The dialer is relaxed for the
    # self-hosted classes only when an entry NAMES a private address or block —
    # `192.168.29.60:8000` or `192.168.29.0/24`. A hostname alone does not
    # unlock it: the gateway never resolves a name to make this decision,
    # because resolving here and dialing later is the DNS-rebinding race a name
    # allowlist avoids. To reach a private endpoint behind a name, list both.
    # This is narrower than the pre-G6 rule, which relaxed the dialer whenever
    # ANY entry was set. An install that reaches a private endpoint through a
    # hostname must add its block.
    #
    # Pin the port where you can. Setting this is also the only way to stop a
    # tenant shipping its own vault secrets to an arbitrary PUBLIC host as a
    # Bearer token — leaving it empty accepts that risk until a row is authored.
    # e.g. "vllm.ml.svc.cluster.local:8000,10.0.0.0/8"
    #
    # ISSUE #467: this key is governed by `egressPosture` at the bottom of this
    # file. The chart refuses to render until that posture is stated, because the
    # empty value is permissive and restrictive AT THE SAME TIME — it accepts any
    # PUBLIC host and refuses every PRIVATE one — and an operator who did not
    # choose it has almost certainly not understood which half applies to them.
    GATEWAY_EGRESS_ALLOWLIST: ""

    # Issue #316 — the platform's SHARED ("public") project. Elitea has always had
    # two sources of models for a project: the project's own configurations, and
    # the public project's `shared = true` rows that the operator publishes for
    # everyone. The gateway read the caller's project only, so every shared model
    # was unreachable: the model picker offered it, and the request then found no
    # credential. With ELITEA_ALLOW_PROJECT_OWN_LLMS=false — the mode where
    # projects are meant to use platform models ONLY — that left no usable model.
    #
    # SET `platform.aiProjectId` INSTEAD; it fills this key. A value here still
    # works and still wins for this component, and `helm template` refuses a
    # render whose copies disagree (`elitea.aiProjectId` in
    # templates/_helpers.tpl). The two services must name the same project or
    # the gateway will serve a different model set from the one the UI offers.
    #
    # Leaving THIS key empty while elitea-main names a project is the state that
    # keeps issue #316 inert on Kubernetes: the UI offers the shared models and
    # the gateway then finds no credential for them. Set both or neither.
    #
    # Empty (the default) keeps the old project-local behaviour: no shared models.
    # It is empty rather than "1" on purpose — an id naming a schema that does not
    # exist would make every credential read fail.
    #
    # The caller's own rows always win over a shared row of the same name, and the
    # public project is read ONLY for rows flagged shared = true.
    ELITEA_AI_PROJECT_ID: ""

    # Issue #12 — per-(project_id, model) AMPLIFICATION BACKSTOP. Shipped as
    # "circular-routing guard #2" (spec §2.6) at a hardcoded 5 requests / 1 s /
    # 30 s lockout, but it performs NO hop detection: it counts requests. At those
    # numbers it was a 5 req/s rate limiter armed in production — a 50-VU run
    # against one tuple measured 99.96% HTTP 429.
    #
    # No rate threshold can separate a routing loop from real traffic here: both
    # are bounded by the same provider worker pool. The real anti-circular-routing
    # mechanism is hop-marker detection, tracked separately. These numbers make
    # the layer an honest backstop in the meantime.
    #
    # Threshold derivation: one replica's ceiling for a tuple is the provider
    # worker pool (GATEWAY_PROVIDER_CONCURRENCY=50) over the fastest realistic
    # call latency (~50 ms embeddings) = 1000 req/s. Above that, arrivals can
    # never be served; below it, rejecting them is pure availability loss.
    # A NEGATIVE threshold disarms the backstop entirely. Whichever mode results,
    # the gateway logs it once at startup ("LOOP BREAKER ARMED"/"DISARMED").
    LLM_LOOP_BREAKER_THRESHOLD: "1000"
    LLM_LOOP_BREAKER_WINDOW_MS: "1000"
    # Lockout after a trip. Reduced from the shipped 30 s: a 30 s lockout on a
    # false positive is a small outage for that tuple.
    LLM_LOOP_BREAKER_OPEN_SEC: "5"

  # secrets: sensitive env vars sourced from Kubernetes Secrets (rendered as
  # valueFrom.secretKeyRef in deployment.yaml), NOT plaintext in the env map above.
  # Each entry maps the ENV VAR NAME the binary reads → the Secret name + key.
  # `optional: true` lets the pod start when the Secret is absent (e.g. local/dev,
  # or SECRETS_MASTER_KEY unset → provider credentials are stored in the database
  # UNWRAPPED, see that entry below); set false to make the Secret mandatory in
  # production.
  #
  # Provision the referenced Secret out-of-band (kubectl create secret / external-
  # secrets operator / sealed-secrets), e.g.:
  #   kubectl create secret generic elitea-llm-gateway-secrets \
  #     --from-literal=identity-secret=... --from-literal=secrets-master-key=...
  #
  # BREAKING (issue #11, 2026-08-09): GATEWAY_IDENTITY_SECRET is now REQUIRED —
  # `optional: false`. An empty secret disables identity verification, and the
  # gateway then takes X-Elitea-Project-Id at face value to select which tenant's
  # provider credentials it decrypts out of the Fernet vault. The binary refuses
  # to start (FATAL) in that state, so a pod without the Secret would crash-loop;
  # `optional: false` moves the failure earlier and makes it legible
  # (CreateContainerConfigError naming the missing Secret key) instead.
  #
  # OPERATIONAL CONSEQUENCE: `helm install` with no
  # `elitea-llm-gateway-secrets/identity-secret` no longer produces a running pod.
  # Provision the Secret BEFORE installing/upgrading, and set the SAME value on
  # elitea-main (`secrets.GATEWAY_IDENTITY_SECRET`, also non-optional) — the edge
  # signs the identity headers the gateway verifies, so a mismatched or one-sided
  # secret makes every /llm request fail verification.
  secrets:
    GATEWAY_IDENTITY_SECRET:
      secretName: elitea-llm-gateway-secrets
      key: identity-secret
      optional: false   # issue #11 — empty secret ⇒ any caller picks any tenant's credentials
    SECRETS_MASTER_KEY:
      secretName: elitea-llm-gateway-secrets
      key: secrets-master-key
      # optional: true, and this is a DECISION rather than an oversight.
      #
      # WHAT UNSETTING IT ACTUALLY DOES, in an operator's terms: every project's
      # provider credentials are written to the database with no master-key
      # wrapping. internal/account/vault.go:34 stores the project key
      # unwrapped. The previous wording here — "Fernet vault degraded
      # single-level mode" — described the mechanism and not the consequence,
      # and it was read twice during audits as a performance or feature note.
      #
      # WHY IT STAYS OPTIONAL. The database is trusted infrastructure in this
      # deployment's threat model, so unwrapped project keys inside it are
      # accepted. The precedent for the other choice is right above:
      # GATEWAY_IDENTITY_SECRET was made non-optional as a deliberate breaking
      # change (#11) because an empty value there lets ANY caller pick ANY
      # tenant's credentials — a different class of failure, reachable from
      # outside the database.
      #
      # Recorded here so the next audit finds the decision rather than
      # rediscovering the condition. Revisit it if the database stops being
      # trusted infrastructure — a managed service with an operator who is not
      # the tenant, or a backup that leaves the trust boundary.
      optional: true
    # GATEWAY_HOP_SECRET keys the hop marker (issue #164), the anti-circular-
    # routing mechanism. It is DEDICATED key material: never GATEWAY_IDENTITY_
    # SECRET and never derived from it, so marker rotation stays independent of
    # identity rotation.
    #
    # Set the SAME value on every replica. The marker is a pure function of the
    # key, so a loop that leaves through one replica is then recognised on any
    # other.
    #
    # `optional: true` because an empty secret is SAFE, unlike
    # GATEWAY_IDENTITY_SECRET. The gateway boots loudly unarmed and logs
    # "HOP DETECTION UNARMED", and no request is refused on that account.
    # Provision it to turn the mechanism on.
    GATEWAY_HOP_SECRET:
      secretName: elitea-llm-gateway-secrets
      key: hop-secret
      optional: true    # unset ⇒ hop detection unarmed, logged loudly at boot

  # networkPolicy: egress containment, defence in depth for issue #13 (the
  # tenant-authored api_base SSRF). The in-process control is
  # GATEWAY_EGRESS_ALLOWLIST above; this is the second layer, for the case where
  # that one is bypassed or a future carve-out widens it.
  #
  # OPT-IN, because attaching ANY egress rule to a pod denies everything not
  # listed, and this chart cannot know where your Postgres, NATS and OTLP
  # collector live. Enable it only after filling in `egress` below — otherwise the
  # gateway loses its own dependencies. Requires a CNI that enforces
  # NetworkPolicy; on one that does not, the object renders but does nothing.
  # egressPosture — issue #467. Which egress policy this deployment runs.
  #
  # The chart REFUSES TO RENDER until this names one of the two values below.
  # That is deliberate. The alternative was the shipped default, an empty
  # GATEWAY_EGRESS_ALLOWLIST, which no operator had chosen and which behaves in
  # two opposite ways at once.
  #
  # Read internal/account/egress.go and libs/go/egresslib. The posture states
  # what THIS CHART contributes; gap G6 added a second contributor, the
  # `egress_allowlist` governance rows, and the gateway enforces the union.
  #
  #   "allowlist"            env.GATEWAY_EGRESS_ALLOWLIST names the hosts a
  #                          tenant may put in api_base. The host check runs
  #                          BEFORE the Fernet vault decrypts the api_key, so a
  #                          host that is not on the list never receives a
  #                          resolved secret. Add a private address or CIDR to
  #                          reach a self-hosted model on a private network.
  #
  #   "public-unrestricted"  env.GATEWAY_EGRESS_ALLOWLIST stays empty. A tenant
  #                          may name ANY public host in api_base, and the
  #                          gateway then sends that tenant's credential to it,
  #                          UNTIL an admin authors the first egress_allowlist
  #                          row — the first entry from either source turns the
  #                          restriction on. bifrost's SSRF-safe dialer stays
  #                          armed, so no tenant can steer the gateway at a
  #                          private address. Choose this only when every model
  #                          is a public provider AND you accept that a tenant
  #                          may ship its own vault secret to an address of its
  #                          choosing.
  #
  # There is deliberately no mode in which a tenant reaches an arbitrary private
  # address. Private reachability follows from an entry that NAMES a private
  # host or block, and never from the mere presence of an allowlist.
  egressPosture: ""

  # acknowledgeUnenforcedBudgets — issue #304. It is read ONLY when
  # env.LLM_BUDGET_REQUIRE_ENFORCEMENT above is "off".
  #
  # "off" removes the binary's own startup refusal, so the gateway starts and
  # serves /llm even when it can enforce no ceiling and record no spend. That is
  # a supported posture — a bootstrap install, or a deployment that runs no
  # budgets — and it is not one an operator should reach by copying a values
  # file. This key is the statement that the spend is accepted.
  acknowledgeUnenforcedBudgets: false

  networkPolicy:
    enabled: false
    # allowPublicEgress opens 0.0.0.0/0 minus every private/link-local range, so
    # cloud provider APIs work but nothing in-cluster is reachable. Set false only
    # for an install that talks exclusively to self-hosted models.
    allowPublicEgress: true
    publicEgressPorts:
      - protocol: TCP
        port: 443
    # In-cluster dependencies, rendered verbatim under spec.egress. Worked
    # example — replace the selectors and ports with your own topology, and add
    # an entry for every self-hosted model host GATEWAY_EGRESS_ALLOWLIST names:
    #
    # egress:
    #   - to:
    #       - podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: postgresql
    #     ports:
    #       - protocol: TCP
    #         port: 5432
    #   - to:
    #       - podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: nats
    #     ports:
    #       - protocol: TCP
    #         port: 4222
    #   - to:
    #       - podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: vllm
    #     ports:
    #       - protocol: TCP
    #         port: 8000
    egress: []

  # elitea-llm-gateway-svc: mTLS-only ClusterIP (NOT public), port 8083 (design
  # §9.1). Named explicitly so the edge/runbook references resolve.
  service:
    name: elitea-llm-gateway-svc
    port: 8083
    annotations: {}

  # HPA on a custom /llm SSE-connection metric (design §9.5) — CPU/memory is a poor
  # signal for I/O-bound streaming. Requires the Prometheus Adapter to surface the
  # metric; disable if that adapter is not installed (falls back to replicaCount).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    # Pods-metric name the Prometheus Adapter must expose (concurrent /llm SSE
    # connections per pod).
    #
    # The gateway DOES emit this now. It did not when this HPA was written —
    # the comment here claimed BF0.4/§10 published it, and nothing did: the
    # /metrics surface is an explicit allowlist and no entry produced the
    # gauge. Enabling autoscaling therefore gave ScalingActive=False /
    # FailedGetPodsMetric, which neither scales nor complains, so the
    # deployment silently pinned at minReplicas.
    #
    # It is a GAUGE and the only one on that surface; every other gateway
    # metric is a counter. A Prometheus Adapter rule that rate()s it produces a
    # number unrelated to concurrent streams.
    sseConnectionMetric: gateway_llm_sse_active_connections
    # Scale out when average concurrent streams per pod approaches the tuned
    # provider Concurrency budget (GATEWAY_PROVIDER_CONCURRENCY=50).
    targetSSEConnectionsPerPod: "40"

  # mTLS for the elitea-main -> gateway hop (design §9.1). cert-manager issues a
  # server cert (this Deployment mounts it) and an edge client cert (elitea-main
  # mounts it) from a shared internal CA issuer.
  mtls:
    enabled: true
    serverSecretName: elitea-llm-gateway-server-tls
    clientSecretName: elitea-main-gateway-client-tls
    duration: 2160h    # 90d
    renewBefore: 360h  # 15d
    issuerRef:
      # A cluster-shared internal (private-CA) issuer — NOT created by this chart.
      name: elitea-internal-ca
      kind: ClusterIssuer
    # Where the server cert secret is mounted in the gateway container. The
    # gateway serves TLS from tls.crt/tls.key and verifies client certs against
    # ca.crt (mTLS require-and-verify).
    mountPath: /etc/gateway/tls

  # probes: with mtls.enabled (the default) the paths below are NOT used — the
  # listener requires a verified client certificate, which a kubelet probe cannot
  # present, so templates/deployment.yaml probes the socket instead. The paths
  # apply when mtls.enabled is false.
  probes:
    liveness:
      # Process liveness only (no dependency calls) — issue #242: a NATS blip
      # must not restart the pod, only /readyz should pull it out of rotation.
      path: /healthz
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      failureThreshold: 2

  serviceAccount:
    create: true
    name: ""

  # OFF by default: this chart's own scale-1 profile (replicaCount: 1 above)
  # means minAvailable: 1 against a single replica would block every voluntary
  # eviction (kubectl drain, node scale-down) forever. HA operators who raise
  # replicaCount should turn this on.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # Opt-in external reachability (issue #241; legacy parity), OFF by default.
  # CAUTION: the gateway is mTLS-internal by design (service.yaml — "NEVER
  # public", §9.1); enabling this exposes /llm outside the mTLS-only path the
  # rest of this chart assumes. Only turn it on if your ingress
  # controller/Gateway itself terminates and re-verifies mTLS equivalent to
  # what elitea-main does today — templates/ingress.yaml refuses to render
  # (helm `fail`) unless acknowledgeMTLSBypass is also set to true, so that
  # confirmation can't be skipped by accident. Set ingress.gatewayApi: true to
  # render an HTTPRoute instead of a networking.k8s.io/v1 Ingress; the two are
  # mutually exclusive.
  ingress:
    enabled: false
    acknowledgeMTLSBypass: false
    gatewayApi: false
    className: ""
    annotations: {}
    path: /
    pathType: Prefix
    hosts: []
    tls: []
      # - secretName: elitea-llm-gateway-tls
      #   hosts:
      #     - gateway.dev.elitea.ai
    gateway:
      name: ""
      namespace: ""
      sectionName: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── DeepWiki provider service (ADR-0022) ─────────────────────────────────────
#
# OFF by default, and that is the honest default rather than a cautious one:
# the published image carries the engine SOURCE but not its ~92-package
# closure, so a deployment that turns this on without also setting an -engine
# image tag gets a service that serves the whole SPI and refuses every tool.
# It says so in GET /health rather than pretending, but it is not what an
# operator flipping `enabled` expects.
#
# Turning it on is TWO settings, not one: this block, and
# main.env.ELITEA_DEEPWIKI_ENABLED with its base URL, callback origin and the
# three client-certificate paths. elitea-main is the only door (decision 5), so
# a provider nobody can reach is a Deployment doing nothing.
deepwiki:
  enabled: false
  replicaCount: 1

  # The provider pod is TWO containers (ADR-0023 H2): the Go sub-application
  # host, which serves the SPI, composes and uploads, and the Python engine
  # sidecar, which runs the analysis engine for it over a Unix socket the two
  # share. `image` is the host; `engine.image` is the Python image, which
  # must be the `-engine` variant for the legacy runner to run anything.
  image:
    repository: ghcr.io/elitea-ng/elitea-subapp-host
    # Empty means the chart-wide image.tag.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  engine:
    image:
      repository: ghcr.io/elitea-ng/elitea-deepwiki
      # Empty means the chart-wide image.tag with `-engine` appended — the
      # image that carries the engine's dependency closure. The guard in
      # _helpers.tpl refuses a runner=legacy install whose engine tag lacks
      # that suffix: the plain image carries the engine SOURCE only and every
      # tool would fail at invocation time.
      tag: ""
      pullPolicy: IfNotPresent
    # What the SIDECAR runs: legacy (the engine) or fixture (canned results,
    # for a stack that proves the hop without the engine).
    runner: legacy
    socketDir: /run/deepwiki
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 4Gi

  service:
    # Named explicitly, not release-derived: the server certificate's SANs name
    # this Service and elitea-main verifies exactly that name.
    name: elitea-deepwiki-svc
    port: 8443
    annotations: {}

  env:
    # FAIL-CLOSED, and the chart refuses to render while it is empty — see
    # elitea-deepwiki.validateGuards. The SAME value belongs in
    # main.env.ELITEA_DEEPWIKI_GIT_ALLOWLIST: the facade checks it before
    # opening the vault, this service checks it before building a clone URL,
    # and two allowlists that disagree mean an invocation that starts and then
    # fails. Example: "github.com,*.github.com".
    ELITEA_DEEPWIKI_GIT_ALLOWLIST: ""
    # Hosts the engine may reach to download models. A DIFFERENT trust decision
    # from the git allowlist — a deployment may well allow an internal model
    # mirror and no public git host — and fail-closed in the same way.
    ELITEA_DEEPWIKI_MODEL_ALLOWLIST: ""
    # "unavailable" (the default) refuses every tool and says so; "legacy" runs
    # the ported engine and needs the -engine image tag above.
    # The host's runner: legacy reaches the engine sidecar over the socket
    # below; unavailable refuses every tool (no sidecar is rendered then).
    ELITEA_DEEPWIKI_RUNNER: "legacy"
    ELITEA_DEEPWIKI_ENGINE_SOCKET: /run/deepwiki/engine.sock
    ELITEA_SUBAPP: deepwiki
    # "subprocess" for compose and small installs, Kubernetes Jobs for scale.
    # Jobs mode needs cluster access this chart's ServiceAccount does not grant
    # by default; grant it deliberately before turning it on.
    ELITEA_DEEPWIKI_SLOTS_MODE: "false"
    ELITEA_DEEPWIKI_MAX_PARALLEL_WORKERS: "1"
    ELITEA_DEEPWIKI_SCRATCH_PATH: /var/scratch/deepwiki
    # The origin elitea-main proxies to. Must agree with
    # main.env.ELITEA_DEEPWIKI_BASE_URL.
    ELITEA_DEEPWIKI_SERVICE_LOCATION_URL: https://elitea-deepwiki-svc:8443

  # Sensitive values from Kubernetes Secrets. ELITEA_DEEPWIKI_DATABASE_URL
  # defaults to the chart-wide postgresql secret when one is set, exactly as
  # every other component's database URL does.
  secrets:
    # The HMAC key that verifies the identity headers elitea-main signs. It
    # must hold the SAME value as main's ELITEA_DEEPWIKI_IDENTITY_SECRET —
    # this side verifies what that side signs, and a mismatch fails every
    # request with a signature error.
    ELITEA_DEEPWIKI_IDENTITY_SECRET:
      secretName: elitea-deepwiki-secrets
      key: identity-secret
      optional: true

  # The service's own migrations, run as a pre-install/pre-upgrade Job from the
  # service's own image. See templates/deepwiki/migrate-job.yaml for why this
  # is not part of elitea-migrate.
  migrate:
    enabled: true
    backoffLimit: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  # Ephemeral clone and index space (decision 4). Nothing durable lives here:
  # a wiki is published to PostgreSQL, and a replica that dies mid-generation
  # loses only work that is being redone anyway. Size it for the largest
  # repository this deployment expects to clone.
  scratch:
    mountPath: /var/scratch/deepwiki
    sizeLimit: 8Gi

  # mTLS for the elitea-main -> deepwiki hop (decision 5). cert-manager issues
  # a server cert (this Deployment mounts it) and a facade client cert
  # (elitea-main mounts it) from a shared internal CA issuer.
  mtls:
    enabled: true
    serverSecretName: elitea-deepwiki-server-tls
    clientSecretName: elitea-main-deepwiki-client-tls
    duration: 2160h    # 90d
    renewBefore: 360h  # 15d
    issuerRef:
      # A cluster-shared internal (private-CA) issuer — NOT created by this
      # chart. The same issuer the llmGateway hop uses.
      name: elitea-internal-ca
      kind: ClusterIssuer
    mountPath: /etc/deepwiki/tls

  # probes: with mtls.enabled (the default) these paths are NOT used — the
  # listener requires a verified client certificate, which a kubelet probe
  # cannot present, so the Deployment probes the socket instead.
  probes:
    liveness:
      path: /health
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /ready
      periodSeconds: 5
      failureThreshold: 2

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  terminationGracePeriodSeconds: 60

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      # No CPU limit, deliberately, as elsewhere in this chart: throttling an
      # indexing pass makes a generation slow rather than making it fail, and
      # the memory limit is what actually bounds the blast radius.
      memory: 4Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  nodeSelector: {}
  tolerations: []
  affinity: {}

# The Inventory provider service (ADR-0023 H4c) — the knowledge-graph builder
# and retriever. Enable it beside main.env.ELITEA_INVENTORY_ENABLED with its
# base URL, callback origin and the three client-certificate paths; the chart
# refuses a half-configured install rather than rendering one that boots and
# then fails.
#
# It has NO database of its own, unlike DeepWiki: there is no storage package,
# no migrations and no migrate Job. A graph's home is the platform artifact
# bucket, reached with the callback bearer the facade mints per invocation.
inventory:
  enabled: false
  replicaCount: 1

  # The provider pod is up to TWO containers (ADR-0023 H2): the Go
  # sub-application host, which serves the SPI, composes and uploads, and — for
  # runner=legacy — the Python engine sidecar, which runs the knowledge-graph
  # engine for it over a Unix socket the two share. `image` is the host;
  # `engine.image` is the Python image, which must be the `-engine` variant for
  # the legacy runner to run anything.
  image:
    repository: ghcr.io/elitea-ng/elitea-subapp-host
    # Empty means the chart-wide image.tag.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  engine:
    image:
      repository: ghcr.io/elitea-ng/elitea-inventory
      # Empty means the chart-wide image.tag with `-engine` appended — the
      # image that carries the engine's dependency closure. The guard in
      # _helpers.tpl refuses a runner=legacy install whose engine tag lacks
      # that suffix: the plain image carries the engine SOURCE and its FIXTURE
      # runner only, and every engine tool would fail at invocation time.
      tag: ""
      pullPolicy: IfNotPresent
    # What the SIDECAR runs: legacy (the engine) or fixture (a canned
    # knowledge graph, for a stack that proves the hop without the engine).
    runner: legacy
    socketDir: /run/inventory
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 4Gi

  service:
    # Named explicitly, not release-derived: the server certificate's SANs name
    # this Service and elitea-main verifies exactly that name.
    name: elitea-inventory-svc
    port: 8443
    annotations: {}

  env:
    ELITEA_SUBAPP: inventory
    # The HOST's runner. `legacy` reaches the engine sidecar over the socket
    # below and renders that sidecar; `fixture` serves the host's OWN canned
    # knowledge graph in one container, which is what a stack that only needs
    # deterministic results wants; `unavailable` refuses every tool and says
    # so. The guard refuses `legacy` with no socket and a socket with no
    # `legacy`, because either is a service that looks healthy and serves
    # nothing.
    ELITEA_INVENTORY_RUNNER: "legacy"
    ELITEA_INVENTORY_ENGINE_SOCKET: /run/inventory/engine.sock
    ELITEA_INVENTORY_SCRATCH_PATH: /var/scratch/inventory
    # The origin elitea-main proxies to. Must agree with
    # main.env.ELITEA_INVENTORY_BASE_URL.
    ELITEA_INVENTORY_SERVICE_LOCATION_URL: https://elitea-inventory-svc:8443

  # NO git allowlist here, and that is a difference from DeepWiki rather than
  # an omission. DeepWiki CLONES from a URL in the request, so the destination
  # is the provider's to allow or refuse as well as the facade's. Inventory
  # reads its source through the ELITEA SDK's toolkit, whose destination is the
  # toolkit's stored configuration — expanded by the facade, from a toolkit the
  # caller can already see. There is no request-supplied clone URL for a
  # provider-side allowlist to check, and one that always passed would look
  # like an egress control while being none. main.env.
  # ELITEA_INVENTORY_GIT_ALLOWLIST is the real one, checked before the vault is
  # opened.

  # Sensitive values from Kubernetes Secrets.
  secrets:
    # The HMAC key that verifies the identity headers elitea-main signs. It
    # must hold the SAME value as main's ELITEA_INVENTORY_IDENTITY_SECRET —
    # this side verifies what that side signs, and a mismatch fails every
    # request with a signature error.
    ELITEA_INVENTORY_IDENTITY_SECRET:
      secretName: elitea-inventory-secrets
      key: identity-secret
      optional: true

  # Ephemeral source-read and graph-build space. Nothing durable lives here:
  # the graph is uploaded to the artifact bucket, and a replica that dies
  # mid-ingestion loses only work that is being redone anyway. Size it for the
  # largest repository set this deployment expects to ingest.
  scratch:
    mountPath: /var/scratch/inventory
    sizeLimit: 8Gi

  # mTLS for the elitea-main -> inventory hop. cert-manager issues a server
  # cert (this Deployment mounts it) and a facade client cert (elitea-main
  # mounts it) from the SAME internal CA issuer the DeepWiki hop uses — one
  # trust root out of elitea-main, two certificates that rotate on their own.
  mtls:
    enabled: true
    serverSecretName: elitea-inventory-server-tls
    clientSecretName: elitea-main-inventory-client-tls
    duration: 2160h    # 90d
    renewBefore: 360h  # 15d
    issuerRef:
      # A cluster-shared internal (private-CA) issuer — NOT created by this
      # chart. The same issuer the llmGateway and DeepWiki hops use.
      name: elitea-internal-ca
      kind: ClusterIssuer
    mountPath: /etc/inventory/tls

  # probes: with mtls.enabled (the default) these paths are NOT used — the
  # listener requires a verified client certificate, which a kubelet probe
  # cannot present, so the Deployment probes the socket instead.
  probes:
    liveness:
      path: /health
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /ready
      periodSeconds: 5
      failureThreshold: 2

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  terminationGracePeriodSeconds: 60

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      # No CPU limit, deliberately, as elsewhere in this chart: throttling an
      # ingestion pass makes it slow rather than making it fail, and the memory
      # limit is what actually bounds the blast radius.
      memory: 4Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  # The agent worker: the ONLY producer of an answer. Requires main.runtime.enabled.
  enabled: false
  # The agent worker. Without it an admitted execution streams nothing and ends
  # in a terminal failure: Go admits and projects executions but has no
  # agent-token producer of its own.

  # Which worker this release runs: `rust` (default) or `python`.
  #
  # NOT named `runtime` — that key is taken, by the deployment configuration
  # block further down that becomes the worker's runtime.json.
  #
  # The two are not interchangeable at the values level, and the chart handles
  # the differences rather than leaving them to the operator:
  #
  #   * The Rust worker REQUIRES `--toolkit-security-config`. Its argument
  #     parser matches an exact five-token command line and exits
  #     `worker_serve.invalid_configuration` on anything else, so a Rust image
  #     started with the Python worker's argument list CrashLoopBackOffs
  #     immediately. The chart writes that second file and passes the flag.
  #   * `sensitiveTools` below reaches Python as the ELITEA_SENSITIVE_TOOLS
  #     environment variable and Rust as `toolkit_security.sensitive_tools`
  #     inside that file. One value, two carriers.
  #   * ELITEA_DISABLE_SYSTEM_CA and REQUESTS_CA_BUNDLE are SDK settings with
  #     no reader in the Rust worker, and are omitted for it.
  #
  # runtime.json itself is identical for both: its 21 fields and 21 `limits`
  # entries are the same set on either side, and the Rust struct is
  # deny_unknown_fields, so any drift fails at startup rather than silently.
  implementation: rust

  image:
    # Built, signed and published by this repository's own release workflow
    # (.github/workflows/publish.yml), and public, so no pull secret is needed.
    # The tag is stamped to the release version at package time — the default
    # here only applies to a chart installed straight from the working tree.
    #
    # Empty derives the repository from `implementation` above. Setting it wins
    # over `implementation`, and is how you pin an image by digest or run the
    # worker from a mirror. To stay on the Python worker, either set
    # `implementation: python` or pin this to
    # `ghcr.io/elitea-ng/elitea-worker-python`.
    repository: ""
    # tag comes from the single top-level image.tag
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Rust worker only (ELITEA_RUST_LOG / ELITEA_RUST_TRACE). Each must be one of
  # off, error, warn, info, debug, trace — the worker refuses anything else at
  # startup rather than falling back to a default. Ignored by the Python worker,
  # which takes no log level from the environment.
  logLevel: info
  traceLevel: info

  # Scale-out is now CORRECT, and this stays at 1 because correct is not the
  # same as needed.
  #
  # Each replica gets its own Redis consumer name — the init container
  # substitutes the pod's own name into consumer_id, see
  # templates/worker/deployment.yaml. Everything else stays shared: one
  # workload session row, one producer_id, one client certificate. That is not
  # an economy, it is what the database already enforces —
  # `execution_claims_active_idx` is UNIQUE on (execution_id, generation) while
  # the claim is live, so two replicas cannot run one execution however they
  # identify themselves.
  #
  # Raise this, or put an autoscaler on it, with a measured reason. The bound
  # to measure first is the Redis consumer group's read rate, not CPU.
  #
  # IGNORED when autoscaling below is on: the Deployment then omits `replicas`
  # entirely, because a value there is rewritten on every `helm upgrade` and
  # would fight the autoscaler.
  replicaCount: 1

  # Queue-depth autoscaling, through KEDA.
  #
  # OFF by default, and enabling it requires KEDA in the cluster. The chart
  # REFUSES to install rather than creating an object no controller reads —
  # this chart has already shipped one autoscaler that silently did nothing
  # (the gateway HPA named a metric that was never published), and that is the
  # failure the refusal exists to prevent.
  #
  # WHY NOT A NATIVE HPA. The other three autoscalers in this chart scale on
  # CPU and memory. An agent execution spends most of its life waiting on a
  # model, so a backlog of thousands of unclaimed commands raises neither. The
  # depth of the Redis consumer group is the signal, and no native HPA reads
  # it.
  #
  # BEFORE YOU ENABLE IT: the runtime Redis uses a private CA, and KEDA
  # verifies against the operator pod's own trust store. Install the KEDA
  # operator with that CA mounted, or the scaler cannot connect — and a scaler
  # that cannot connect reports no depth, which scales the fleet DOWN while the
  # backlog grows. The chart cannot check this for you.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10

    # Entries pending in the consumer group, per replica. KEDA divides the
    # observed depth by this to get a replica count.
    #
    # 4 rather than 1: a worker claims a small batch at a time
    # (limits.redis_read_batch is 4 in values-standalone), so a target of 1
    # would add a replica for a backlog one existing replica is already about
    # to take.
    targetPendingEntries: 4

    pollingIntervalSeconds: 15

    # LONG, deliberately. An agent execution runs for minutes and scale-down
    # removes pods. The worker drains on SIGTERM, but a cooldown shorter than a
    # typical execution turns every quiet moment into a round of terminations
    # that each wait out an in-flight turn.
    cooldownSeconds: 300

  # One Secret carrying every file the worker reads. Keys:
  #   runtime-ca.crt                 agent-worker-client.crt
  #   agent-worker-client.key        command-signing-keyring.json
  #   redis-worker-password          worker-output-spool-key
  #   agent-checkpoint-connection
  materialSecretName: elitea-worker-material

  # elitea_worker/config.py applies the same permission contract as the Go side:
  # a private file must be 0600-or-tighter and no file may be group/other
  # writable. A Secret volume cannot satisfy that (root-owned, or a symlink
  # farm), so an init container copies each key into a memory-backed emptyDir at
  # 0600 owned by the worker's uid — the same answer issue #404 gave elitea-main.
  materialInit:
    image: docker.io/library/alpine:3.20
    sizeLimit: 8Mi

  # uid/gid 10001 is the `elitea` user baked into the worker image.
  runAsUser: 10001
  runAsGroup: 10001

  # Authorizes this worker's certificate against the control plane, by writing
  # the row every runtime call is checked against.
  #
  # WHY THIS IS THE CHART'S JOB. WorkloadSessionsRepository "exposes no
  # process-local registration or fallback allowlist" — a worker can never mint
  # its own authority, which is correct and must stay that way. It says instead
  # that "sessions are provisioned and revoked by the deployment control plane
  # before a worker connects". For a Helm deployment the chart IS that control
  # plane; nothing else in the release is. Without this the whole plane fails
  # closed and SILENTLY: every ClaimCommand is refused, elitea-main logs nothing,
  # and each refused turn is durably quarantined by the worker and permanently
  # lost. See deploy/runtime/README.md.
  #
  # The check is one query over THREE values — workload_identity, session id and
  # producer id — so a mismatch in any of them is an indistinguishable
  # "unauthorized". Two of the three come from runtime.* below, and the third is
  # read out of the worker's own certificate rather than restated as a value, so
  # the row cannot describe an identity the worker does not actually present.
  runtimeSession:
    enabled: true

    # How the provisioning Job reaches PostgreSQL. Point this at the same secret
    # and key elitea-main reads DATABASE_URL from: the row lands in the shared
    # elitea_runtime schema that service owns and migrates.
    database:
      secretName: elitea-main-db
      key: database-url

    # psql to write the row, openssl to read the certificate's SPIFFE URI.
    # postgres:17 (Debian) rather than :17-alpine, which ships no openssl.
    image:
      repository: docker.io/library/postgres
      tag: "17"
      pullPolicy: IfNotPresent

    # Re-stamped on every install and upgrade, which is the point: expires_at is
    # mandatory and NOTHING in the product renews it, so a cluster that is never
    # upgraded eventually goes dark with the same silent signature as never
    # having been provisioned at all.
    ttl: "2160h"

    # Optional assertion, not an input. When set, the Job fails if the identity
    # it reads out of the worker's certificate is not this exact string — useful
    # when the certificate is minted by a pipeline this chart does not own and a
    # silent re-issue under a different SPIFFE ID would otherwise just work.
    expectedIdentity: ""

    # The schema arrives with elitea-main's migration, which on a fresh install
    # may still be running when this hook fires. The Job waits for the table
    # rather than racing it.
    waitAttempts: 60
    waitIntervalSeconds: 5

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

    # Renews the row on a schedule, because nothing else does. The pre-install
    # hook above only ever runs at install/upgrade time — a cluster that never
    # gets a `helm upgrade` for `ttl` (default 90 days) goes dark with exactly
    # the signature of never having been provisioned, and that failure looks
    # identical to the outage this whole Job exists to prevent.
    renew:
      enabled: true

      # Set true ONLY when something outside this chart re-stamps
      # workload_sessions.expires_at. With renew.enabled=false and this unset,
      # templates/guards.yaml refuses the release: the row would then be
      # renewed by nothing but `helm upgrade`, and an expiry refuses every
      # agent execution while the worker still reports Ready.
      acknowledgeManualRenewal: false

      # Roughly ttl/3 (default ttl is 2160h = 90 days, so every ~10 days here),
      # not exactly a third: Kubernetes CronJob schedules are calendar cron, not
      # a duration offset from install time, so a day-of-month step value is the
      # closest expression of "every N days" and this errs toward MORE frequent
      # than a bare ttl/3 would need — cheap insurance against a single missed
      # run (image pull failure, node pressure) actually costing an expiry.
      # If you change `ttl`, re-derive this alongside it; the two are not
      # linked automatically.
      schedule: "0 3 */10 * *"

      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 3600
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3

  runtime:
    # These two are half of the authorization tuple; runtimeSession above reads
    # the third out of the certificate and writes all three as one row. Changing
    # either here changes what gets provisioned, so the two can never disagree.
    workloadSessionId: elitea-agent-worker-1
    producerId: elitea-agent-worker-1
    consumerId: elitea-agent-worker-1-consumer
    # rediss:// with an ACL username and NO password in the URL — the password
    # comes from redis_password_path. The database must be spelled out.
    redisUrl: "rediss://worker@elitea-runtime-redis:6380/0"
    redisStream: "commands.v1.agent.execute.agent.shared.1.0"
    redisGroup: "elitea-agent-worker-v1"
    # The three mTLS listeners, dialled through elitea-main's Service. These
    # names must appear as SANs on control/output/content-server.crt.
    controlTarget: "elitea-main:9443"
    outputTarget: "elitea-main:9444"
    contentOrigin: "https://elitea-main:9445"
    # The SDK refuses a plaintext platform origin (config.py:187), and
    # elitea-main serves its product API over cleartext HTTP inside the cluster.
    # platformEdge below bridges that.
    platformOrigin: "https://elitea-platform-edge"
    spoolRoot: /var/lib/elitea-worker/output-spool
    spoolSizeLimit: 2Gi
    # Broader than the current `artifact.delete_file` rule, so metadata drift
    # cannot bypass approval.
    sensitiveTools: '{"*":["delete_file"]}'
    limits:
      redis_read_batch: 4
      redis_block_millis: 1000
      redis_reclaim_idle_millis: 60000
      redis_reclaim_interval_millis: 5000
      dependency_retry_millis: 250
      delivery_max_concurrency: 2
      delivery_queue_capacity: 4
      sync_max_workers: 2
      sync_max_in_flight: 2
      admission_timeout_millis: 5000
      grpc_deadline_millis: 5000
      content_timeout_millis: 15000
      http_max_connections: 8
      http_max_keepalive_connections: 4
      output_max_queued_frames: 2
      output_max_queued_bytes: 131072
      output_max_sessions: 2
      output_ack_timeout_millis: 15000
      output_stream_deadline_millis: 300000
      lease_poll_interval_millis: 10000
      shutdown_timeout_millis: 30000

  # The worker's platform_origin. A one-route Traefik whose only job is to
  # terminate TLS with a certificate the worker trusts (the runtime CA) and
  # forward to elitea-main, plus forward-auth on the execution-events stream —
  # the one route that accepts no credential a client can present.
  #
  # It is NOT the public edge. It has no route from the Gateway and is reachable
  # only in-cluster.
  platformEdge:
    enabled: true
    image:
      repository: docker.io/library/traefik
      tag: "v3.4"
      pullPolicy: IfNotPresent
    # Service name AND the only SAN on platform-edge.crt. Both must match
    # runtime.platformOrigin.
    serviceName: elitea-platform-edge
    # Secret with keys tls.crt / tls.key — the runtime CA's platform-edge pair.
    tlsSecretName: elitea-platform-edge-tls
    mainService: elitea-main
    mainPort: 8080
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  nodeSelector: {}
  tolerations: []
  affinity: {}

runtimeRedis:
  # The runtime dispatch bus the worker reads. Pairs with worker.
  enabled: false
  # TLS Redis for the runtime dispatch plane and production Form authentication.
  #
  # This is a SECOND Redis, deliberately separate from `elitea-valkey`, which
  # stays plaintext and keeps serving elitea-main's REDIS_URL (sessions, project
  # SSE). It exists because two consumers accept nothing else:
  #
  #   - internal/runtimecomposition/config.go  — rediss:// only, ACL username,
  #     file-backed password, dialled at MinVersion TLS 1.3
  #   - internal/authcomposition/config.go:469 — the same, for the auth session
  #     store
  #
  # Cleartext is off entirely (`port 0`). A runtime plane reachable without TLS
  # would let anything on the pod network XADD signed-envelope commands.

  image:
    repository: docker.io/library/redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  # Server certificate, CA and the ACL file all arrive in ONE Secret, minted by
  # deploy/scripts/gen-runtime-certs.sh (the only material-minting script this
  # repo ships). Keys: runtime-ca.crt, redis-server.crt, redis-server.key,
  # redis-users.acl, redis-bootstrap-password.
  #
  # Unlike elitea-main's material, redis enforces no permission bits of its own,
  # so a plain Secret volume is enough — no copy-into-emptyDir init container.
  materialSecretName: elitea-runtime-redis-material

  tlsPort: 6380

  service:
    # The name is load-bearing: it is the host in every rediss:// URL, and
    # deploy/scripts/gen-runtime-certs.sh bakes it in as a SAN on
    # redis-server.crt alongside the compose service name `runtime-redis` (so
    # the same material serves both stacks). Renaming it away from what the
    # script issues silently breaks the TLS handshake with a message that
    # reads like a trust problem.
    name: elitea-runtime-redis

  # XGROUP CREATE ... MKSTREAM for the dispatch streams, run as a Helm hook on
  # every install and upgrade. Idempotent: BUSYGROUP means a previous run did it.
  #
  # The worker's ACL user deliberately has no XGROUP: a consumer that can create
  # its own group can, after losing one, recreate it at the stream head and
  # silently skip every command in flight. So the group is created here, from
  # 0-0, by a bootstrap user that can do nothing else.
  bootstrap:
    enabled: true
    agentStream: "commands.v1.agent.execute.agent.shared.1.0"
    agentGroup: "elitea-agent-worker-v1"
    configurationStream: "commands.v1.configuration.validate.v1.validation-small.shared-credential-free.1.0"
    configurationGroup: "elitea-configuration-worker-v1"

  # Persistence. The compose stack turns this off and calls the keys disposable,
  # which is true of a laptop stack and false here: this instance keeps browser
  # SESSIONS under the auth key prefix and in-flight DISPATCH COMMANDS in the
  # streams. Without an AOF a pod restart — a drain, an image bump, an OOM —
  # logs every user out and strands every command that was XADDed but not yet
  # acknowledged, silently, because the consumer groups themselves come back
  # from the bootstrap Job.
  #
  # Set enabled=false to accept that, on a stack where losing both is cheap.
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ceph-rbd
    # everysec, not always: the fsync-per-write cost is not worth it for a
    # dispatch bus whose worst case is one second of commands, and `always`
    # would put an fsync in the path of every XADD.
    appendfsync: everysec

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # uid/gid 999 is the `redis` user in the official image. fsGroup makes the
  # Secret volume readable after the entrypoint drops privileges.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  nodeSelector: {}
  tolerations: []
  affinity: {}

otelCollector:
  # Telemetry. Safe to disable.
  enabled: true
  # otel-collector — receives OTLP traces from elitea-main, elitea-scheduler
  # (libs/go/observability) and elitea-main's tracing ingest proxy
  # (internal/api/v2/tracing). See Chart.yaml / deploy/otel-collector-config.yaml
  # for the debug/file-exporter scope boundary (issue #250): swap `config` below
  # for a real sink (otlp/otlphttp exporter to Tempo, a vendor backend, ...) when
  # an environment needs traces to outlive the pod.

  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.114.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Service DNS name every other chart's OTEL_EXPORTER_OTLP_ENDPOINT should
  # point at: "http://<fullname>.<namespace>.svc.cluster.local:4318" or, within
  # the same namespace, simply "http://<fullname>:4318" (matches the compose
  # service name "otel-collector" the dev stack's env vars use).
  service:
    type: ClusterIP
    grpcPort: 4317
    httpPort: 4318

  # The collector's own config (mounted at /etc/otel-collector-config.yaml).
  # Identical in shape to deploy/otel-collector-config.yaml so the compose and
  # Helm paths stay in sync; kept as an inline string here (rather than a
  # `.Files.Get` reference to that file) because Helm charts must be
  # self-contained artifacts independent of the monorepo layout they happen to
  # ship from.
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      # debug only — see deploy/otel-collector-config.yaml for why the file
      # exporter was dropped (it needs its target file to pre-exist, and this
      # distroless image has no shell to create one from).
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
