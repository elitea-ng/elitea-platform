# The values a DEFAULT install needs that only the operator can supply (S10):
# exactly the list templates/guards/required/values.yaml prints when they are
# missing, and nothing else. Every feature stays at its values.yaml default
# (the runtime plane, the worker, elitea-vector with Qdrant, DeepWiki and
# Inventory all on), every Secret at its fixed default name. Render tests
# layer their own switches on top of this file; render-default-on.sh renders
# it alone. Render-only values: `.invalid` is reserved (RFC 2606).
platform:
  aiProjectId: "1"

networkPolicies:
  main:
    # Access by kubectl port-forward only; a real install lists its ingress
    # controller in networkPolicies.main.ingressFrom instead.
    noExternalIngress: true

main:
  env:
    DEPLOYMENT_URL: "https://elitea.example.invalid"
  fileConfig:
    authConfig:
      enabled: true
      material:
        secretName: elitea-main-auth-material
      document:
        schema_version: elitea.auth.form.v2
        public_origin: https://elitea.example.invalid
        trusted_proxy_cidrs: ["10.0.0.0/8"]
        redirects:
          direct_access_denied: /app/
          main_access_denied: /auth/login
          default_login: /app/
          default_logout: /app/
        cookie:
          name: elitea_browser_auth
          same_site: lax
          lifetime_seconds: 86400
        credentials:
          attempt_key_file: /run/elitea-auth/auth-attempt-key
          pat_signing_key_file: /run/elitea-auth/auth-pat-signing-key
          credential_headers: []
        mappers:
          contract: elitea.auth_mappers.tracked.v1
        authorization:
          main_configured_public_rules: []
        identity:
          initial_global_admins: []
        provider:
          kind: form
          form:
            users_json_file: /run/elitea-auth/auth-form-users.json

worker:
  runtimeSession:
    expectedIdentity: "spiffe://elitea.standalone/ns/default/sa/agent-worker"

deepwiki:
  env:
    ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"

inventory:
  env:
    ELITEA_INVENTORY_GIT_ALLOWLIST: "github.com,*.github.com"

llmGateway:
  egressPosture: public-unrestricted
  env:
    GATEWAY_SELF_LLM_ORIGINS: "https://elitea.example.invalid/llm/v1,http://elitea-main:8080/llm/v1"
