apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elitea-sandbox-runtime.labels" . | nindent 4 }}
data:
  install.sh: |-
{{ .Files.Get "files/install.sh" | indent 4 }}
  check.sh: |-
{{ .Files.Get "files/check.sh" | indent 4 }}
