{{- if .Values.runtimeClass.create }}
# handler runsc: the containerd runtime name the installer registers. The
# elitea supervisor accepts it (runsc, gvisor or kata*) and refuses runc.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "elitea-sandbox-runtime.labels" . | nindent 4 }}
handler: runsc
scheduling:
  nodeSelector:
    {{- toYaml .Values.nodeSelector | nindent 4 }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.runtimeClass.overhead }}
overhead:
  podFixed:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
