; elitea-main's Postgres pooler (issue #964).
;
; The standalone stack mounts this at /etc/pgbouncer/pgbouncer.ini, and the
; edoburu/pgbouncer entrypoint uses the file as-is when it exists. The Helm
; chart renders the same settings from its pgbouncer values block.
;
; Transaction mode: elitea-main's client connections are NOT one per server
; connection. They share the server pool below, so the read plane stops
; pinning Postgres at max_connections as main replicas grow. The connection
; math is in deploy/README.md.
;
; It is safe for this deployment only because the two multi-statement
; serialisation locks in elitea-main (the secrets backfill,
; internal/api/v2/secrets; personal project provisioning,
; internal/application/personalproject) are transaction-scoped locks held in a
; transaction the pooler keeps pinned to one backend. A session-scoped lock
; would stop serialising here, measured 2026-09-01; the record lives in
; deploy/helm/elitea/values.yaml.
;
; Direct consumers keep their direct connections by design: the migration
; jobs, db-init, the LLM gateway, and the one-shots reach Postgres without
; this pooler, and their connections are counted in the same math.

[databases]
elitea = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; The client authenticates with SCRAM against the userlist at deploy/
; runtime/pgbouncer-userlist.txt (the stack's dev credential, committed with
; the compose file that states the same password on postgres). The userlist
; carries the password rather than a verifier because pgbouncer needs the
; password to authenticate to Postgres, whose elitea role stores a SCRAM
; verifier: a verifier-only userlist would check the client but could not log
; in to the server.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

; Client side: every elitea-main replica's pools (product pool plus the six
; runtime pools) connect here. 1024 leaves headroom far past the standalone
; stack's replica count; it bounds nothing server-side.
max_client_conn = 1024

; Server side: the shared pool. 48 steady server connections serve every main
; replica; a short burst may take up to 4 more from the reserve for up to 5
; seconds before it queues.
default_pool_size = 48
min_pool_size = 8
reserve_pool_size = 4
reserve_pool_timeout = 5

; A hard cap on this pooler's server-side connections for the elitea
; database: pool plus reserve. The cap keeps the pooler itself from ever
; driving Postgres past its budget, whatever the client side does.
max_db_connections = 52

; pgx caches named prepared statements per client connection. Track them so a
; backend reassignment re-prepares instead of answering 42P05. Measured
; 2026-09-01: the 42P05s go away once this is set.
max_prepared_statements = 1000

; A server connection returns to the pool between transactions. Drop whatever
; session state the previous client left on it: settings, prepared
; statements, temp tables.
server_reset_query = DISCARD ALL

; Recycle server connections so no idle backend holds a slot forever.
server_idle_timeout = 300
server_lifetime = 3600

; Ignore extra_float_digits at connect time; pgx sets it to 13 by default.
ignore_startup_parameters = extra_float_digits

; Operator console on the same port: psql -h pgbouncer -p 6432 -U elitea, then
; SHOW POOLS / SHOW SERVERS / SHOW CLIENTS.
admin_users = elitea
stats_users = elitea
