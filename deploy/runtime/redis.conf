# TLS Redis for the standalone stack's runtime plane.
#
# This is a SECOND Redis, deliberately separate from the plaintext `redis`
# service the rest of the stack uses for sessions and the project SSE stream.
# It exists because runtimecomposition/config.go accepts only a `rediss://` URL
# with an ACL username and a file-backed password, and dials it with
# MinVersion: TLS 1.3 — none of which the plaintext instance can serve.
#
# Cleartext is off entirely (`port 0`): a runtime plane reachable without TLS
# would let anything on the compose network XADD signed-envelope commands.
port 0
tls-port 6380

tls-cert-file /run/elitea-runtime/redis-server.crt
tls-key-file /run/elitea-runtime/redis-server.key
tls-ca-cert-file /run/elitea-runtime/runtime-ca.crt

# Clients authenticate as ACL users with a password, not with certificates:
# go-redis builds its TLS config from a CA pool only and presents no client
# certificate (runtimecomposition/redis.go, authcomposition/redis.go). Requiring
# one here would fail every dial with a handshake error that reads like a trust
# problem.
tls-auth-clients no

# Both Go clients pin MinVersion TLS 1.3. Saying so explicitly turns a silent
# downgrade-then-fail into a startup-visible configuration statement.
tls-protocols "TLSv1.3"

# The ACL file is generated by deploy/scripts/gen-runtime-certs.sh: one user per
# role, `user default off` at the top so an un-AUTHed client gets nothing.
aclfile /run/elitea-runtime/redis-users.acl

# Keep runtime streams, delivery indexes, groups and sessions across restart.
# Match the Helm runtimeRedis policy: AOF every second, with no RDB copy.
# The standalone runtime data volume is separate from credential material.
save ""
appendonly yes
appendfsync everysec
dir /data
