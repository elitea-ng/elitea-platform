# Traefik DYNAMIC config for the worker's platform_origin.
#
# One route, no carve-outs: everything the SDK asks for is forwarded to
# elitea-main as-is. That is deliberately unlike the retired deploy/centry-hybrid, where the
# equivalent edge split worker traffic between Go and pylon —
# `tools_list`, `application`/`version` and the artifact APIs are routed to
# pylon there because Go does not serve them (Go's tools_list is a different
# path and answers 501 by design). This stack has no pylon, so an agent that
# needs any of those will fail inside the worker; a plain adhoc turn does not
# touch them.
#
# The certificate is the runtime CA's `platform-edge`, whose only SAN is
# DNS:elitea-platform-edge — the exact host in worker-runtime.json's
# platform_origin. The worker's TLS trust for this hop is the runtime CA alone
# (REQUESTS_CA_BUNDLE / SSL_CERT_FILE on the worker service), so a certificate
# from any other issuer fails closed.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /run/elitea-runtime/platform-edge.crt
        keyFile: /run/elitea-runtime/platform-edge.key

http:
  routers:
    # The execution-events SSE stream (#289). It has its own router because it
    # runs the auth edge: runtime-auth authenticates the caller's credential
    # and projects a signed identity (X-Auth-Signature), which
    # internal/api/production_runtime.go accepts alongside a bearer or session
    # cookie it validates itself. strip-caller-auth-context runs first, so only
    # the edge's own projection reaches elitea-main.
    #
    # Scoped to this exact path rather than applied to the catch-all: every
    # other route through this edge authenticates the worker's bearer directly,
    # and putting an authenticating edge in front of them would change how
    # requests that already work are authorized.
    platform-execution-events:
      rule: PathRegexp(`^/api/v2/executions/[0-9]+/[^/]+/events$`)
      priority: 100
      entryPoints:
        - platform
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - runtime-auth
      service: elitea-main

    # Everything else the SDK asks for. It carries the strip middleware so no
    # identity header a caller sets reaches elitea-main on any route, and it
    # does not match elitea-main's internal address space (/internal), which
    # holds the auth edge's own endpoint: the worker never calls it through
    # this origin, and it is reachable only by the edge's forwardAuth.
    platform:
      rule: PathPrefix(`/`) && !PathPrefix(`/internal`)
      entryPoints:
        - platform
      tls: {}
      middlewares:
        - strip-caller-auth-context
      service: elitea-main

  middlewares:
    # MUST run before the edge-auth call, and its absence would be an
    # authentication bypass rather than an inconvenience: elitea-main trusts
    # X-Auth-* from a trusted proxy, so a caller that could set them itself
    # would choose its own identity. Traefik deletes a header whose
    # customRequestHeaders value is empty.
    #
    # X-Elitea-Execution-Id IS DELIBERATELY ABSENT: the runtime worker's model
    # calls use this origin as their base URL and tag each call with the
    # execution it was made from (cost attribution in the LLM gateway). The
    # worker authenticates on that route with its own bearer, and elitea-main
    # re-signs the value. Every other identity name of the browser edges'
    # floor is deleted here.
    # tests/deployedge/edge_platform_identity_test.go holds this list to that
    # floor.
    strip-caller-auth-context:
      headers:
        customRequestHeaders:
          X-Auth-Type: ""
          X-Auth-ID: ""
          X-Auth-User-ID: ""
          X-Auth-Reference: ""
          X-Auth-Signature: ""
          X-Auth-Avatar: ""
          X-Auth-Avatar-State: ""
          X-Auth-Session-Id: ""
          X-Auth-Session-Name: ""
          X-Auth-Session-Endpoint: ""
          X-Elitea-Identity-Signature: ""
          X-Elitea-Project-Id: ""
          X-Elitea-User-Id: ""
          X-Elitea-Tenant-Id: ""

    # The internal address, never a product route. It authenticates the
    # request's own credential (bearer PAT or browser-auth session, via
    # edgeauth.Kernel) and answers with the identity projection below;
    # authResponseHeaders is what copies that projection onto the forwarded
    # request, and anything not listed there does not reach elitea-main.
    runtime-auth:
      forwardAuth:
        address: "http://elitea-main:8080/internal/auth/main"
        authResponseHeaders:
          - X-Auth-Type
          - X-Auth-ID
          - X-Auth-User-ID
          - X-Auth-Reference
          - X-Auth-Signature

  services:
    elitea-main:
      loadBalancer:
        servers:
          # Cleartext on the compose network. The edge terminates TLS for the
          # worker; it does not re-originate it, and elitea-main cannot accept
          # it on this port anyway.
          - url: "http://elitea-main:8080"
