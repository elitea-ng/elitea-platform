services:
  postgres:
    # pgvector, not plain postgres:18: elitea-deepwiki-migrate's first
    # migration creates the `vector` extension (the wiki index lives in this
    # database), and the platform's index plane needs it too. The same image
    # docker-compose.standalone-full.yml runs. Same PostgreSQL major, and
    # Debian 13 like postgres:18, so an existing postgres_data volume is
    # reused as it is.
    image: pgvector/pgvector:0.8.1-pg18-trixie
    shm_size: '2g'
    environment:
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
      # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker. Mounting an
      # empty volume at the parent leaves the image's own directory tree visible,
      # so the entrypoint decides the data dir "appears to contain a database",
      # skips initdb, and never creates POSTGRES_USER/POSTGRES_DB. Pin PGDATA and
      # mount the volume exactly at it.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitea"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The live-update plane (elitea-main's ELITEA_EVENTS_NATS_URL): the project
  # SSE stream and canvas presence (its publish and its JetStream KV
  # bucket); domain events go to webhooks only. It replaced the plain Redis
  # that sat at REDIS_URL. JetStream (-js)
  # is required — elitea-main refuses to start without it; -m serves the
  # monitoring port nats-health probes. Not published to the host: only elitea-main dials it.
  #
  # `nats:2.12.0` is the scratch image: the server binary and nothing else, so
  # no healthcheck can run inside it, and nats-server has no probe mode. The
  # readiness probe is the `nats-health` sidecar below, which reads /healthz
  # on the monitoring port from outside. Wait on `nats-health`, not on `nats`.
  nats:
    image: nats:2.12.0
    command: ["-c", "/etc/nats-config/nats.conf"]
    volumes:
      - ./runtime/nats-local.conf:/etc/nats-config/nats.conf:ro
      - nats_data:/data

  # The NATS readiness probe, from outside the scratch server container. It
  # idles, and its healthcheck reads http://nats:8222/healthz with JetStream
  # required, which is the check the server's own container used to run.
  # python:3.12.14-slim-trixie because it is already in this stack's image set
  # and its standard library carries an HTTP client (trixie-slim has no curl or
  # wget). SIGINT stops it at once: Python handles SIGINT, not SIGTERM, as PID 1.
  nats-health:
    image: docker.io/library/python:3.12.14-slim-trixie
    command: ["python3", "-c", "import time; time.sleep(1 << 30)"]
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://nats:8222/healthz?js-enabled-only=true', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      nats:
        condition: service_started

  # Creates every JetStream asset, with the same script the cluster's
  # nats-bootstrap hook Job runs (deploy/helm/nats-bootstrap/files/bootstrap.sh).
  # elitea-main only BINDS to its presence bucket and refuses to start when it
  # is missing (#1076), so it waits for this to complete. Plaintext and no
  # client identity, like the server above: compose's posture. The secured
  # posture is the opt-in overlay docker-compose.nats-secure.yml.
  nats-bootstrap:
    image: docker.io/natsio/nats-box:0.19.7
    command: ["sh", "/bootstrap/bootstrap.sh"]
    environment:
      NATS_URL: "nats://nats:4222"
    volumes:
      - ./helm/nats-bootstrap/files/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      nats-health:
        condition: service_healthy

  # S3-compatible local object store (see docs/plans/storage-migration-plan.md
  # S4/S17): elitea-main's artifact store (STORAGE_BACKEND / S3_* on that
  # service), the bucket created by rustfs-bucket-init below.
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: elitea
      RUSTFS_SECRET_KEY: elitea-dev-secret
    volumes:
      - rustfs_data:/data
    healthcheck:
      # Neither this image nor its dependents below ship curl — only wget —
      # and wget's exit code doesn't distinguish "reachable but responded
      # 4xx" (403 here, unauthenticated root) from "connection refused."
      # Treat a captured "server returned error" message as reachable.
      test: ["CMD-SHELL", "out=$$(wget -q -O /dev/null http://127.0.0.1:9000/ 2>&1); [ $$? -eq 0 ] || echo \"$$out\" | grep -q 'server returned error'"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs-bucket-init:
    image: rustfs/rc:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        rc alias set rustfs http://rustfs:9000 elitea elitea-dev-secret &&
        rc mb --ignore-existing rustfs/elitea-artifacts
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # Local OIDC mock (issue #245) — same pattern as
  # docker-compose.e2e-standalone.yml. The dev stack previously pointed at a
  # remote `oidc-mock.technicaldomain.xyz` host with a committed client
  # secret; that violated AGENTS.md's no-committed-secrets guardrail and made
  # `task up` depend on an external host. The `oidc.localhost` alias is
  # required, not cosmetic: the mock derives its issuer and every discovery
  # endpoint from the request's Host header, and that host is what the
  # BROWSER is later redirected to — so it must resolve both inside the
  # compose network (to this container) and from the host machine (to
  # loopback, via the OS's `*.localhost` → 127.0.0.1 mapping, RFC 6761). See
  # docker-compose.e2e-standalone.yml's oidc-mock service for the full
  # writeup.
  oidc-mock:
    image: ghcr.io/geigerzaehler/oidc-provider-mock:latest
    command: ["--port", "9400"]
    networks:
      default:
        aliases:
          - oidc.localhost
    ports:
      - "9400:9400"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/.well-known/openid-configuration')\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # OTEL collector (issue #250): receives OTLP spans from elitea-main and
  # elitea-scheduler's own instrumentation (libs/go/observability) and from
  # elitea-main's tracing ingest routes (internal/api/v2/tracing), which
  # proxy browser/worker collect/otlp traffic here. debug exporter only —
  # see otel-collector-config.yaml for the scope-boundary rationale.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # Installs elitea-main's platform-listener material into a named volume
  # (#1359 U5), the same step docker-compose.e2e-standalone.yml runs.
  # securefile requires a private key to carry owner-only bits AND be readable
  # by the reading uid (distroless nonroot, 65532); the generated
  # deploy/certs/platform-server.key is 0644 for the hosts' sake, and a bind
  # mount cannot change owner or mode per consumer
  # (deploy/runtime/install-material.sh explains the same split for the
  # standalone stack). The image is nats-health's, already pulled.
  #
  # NOT profiled, because elitea-main waits for it, and an unprofiled service
  # cannot wait for a profiled one. It installs nothing and exits 0 while
  # ELITEA_RUNTIME_PLATFORM_ADDRESS is unset, so the default stack needs no
  # platform-listener certificates; with the address set, a missing file
  # fails it and elitea-main does not start.
  platform-material:
    image: docker.io/library/python:3.12.14-slim-trixie
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      PLATFORM_ADDRESS: "${ELITEA_RUNTIME_PLATFORM_ADDRESS:-}"
    command:
      - |
        if [ -z "$$PLATFORM_ADDRESS" ]; then
          echo "ELITEA_RUNTIME_PLATFORM_ADDRESS is unset: the platform listener stays closed, nothing to install"
          exit 0
        fi
        for f in platform-server.key platform-server.crt ca.crt; do
          [ -f "/src/$$f" ] || {
            echo "deploy/certs/$$f is missing: run deploy/scripts/gen-deepwiki-certs.sh, then deploy/scripts/gen-platform-listener-certs.sh" >&2
            exit 1
          }
        done
        install -o 65532 -g 65532 -m 0600 /src/platform-server.key /dst/platform-server.key
        install -o 0 -g 0 -m 0644 /src/platform-server.crt /dst/platform-server.crt
        install -o 0 -g 0 -m 0644 /src/ca.crt /dst/ca.crt
    volumes:
      - ./certs:/src:ro
      - platform_main:/dst
    restart: "no"

  elitea-main:
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      target: final
    image: ghcr.io/elitea-ng/elitea-main:dev
    # elitea-main IS the browser edge of this stack (#1359 P2): the browser
    # origin is http://localhost:8080, the port the deleted Traefik published.
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      ELITEA_EVENTS_NATS_URL: "nats://nats:4222"
      # Relay /app and /docs to the SPA container and redirect `/` to /app/
      # (internal/api/webedge). Compose only: a cluster's Gateway API
      # HTTPRoute does this routing, and the chart never sets it.
      ELITEA_WEB_UPSTREAM: "http://elitea-ui:80"
      ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"
      APPLICATION_SECRET_KEY: "changeme"
      SKIP_MIGRATIONS: "1"
      # The centry vault key (issue #418). elitea-main and elitea-llm-gateway
      # share centry.secrets_key and centry.secrets_data. Each one wraps the
      # project key when it holds this value and stores it in the clear when it
      # does not, so one stack must give EVERY reader of that table the SAME
      # value. That is why this is required rather than defaulted: a default
      # here would be a second key source, and a committed one.
      #
      # pylon-indexer was the third reader. #339 deleted it, so this stack now
      # has one fewer place for the two answers of #418 to disagree.
      #
      # Make a key with:
      #   export SECRETS_MASTER_KEY=$(python3 -c \
      #     'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
      #
      # Changing the key later makes the rows written under the old key
      # unreadable. Run `task down:clean` to drop the volume, or convert the
      # rows — see deploy/scripts/rewrap-centry-vault.py.
      SECRETS_MASTER_KEY: "${SECRETS_MASTER_KEY:?set in your environment; see the note on the elitea-main service in deploy/docker-compose.yml}"
      # Local mock (see the oidc-mock service above) — no real credentials,
      # the mock accepts any client_id/client_secret.
      OIDC_ISSUER_URL: "http://oidc.localhost:9400"
      OIDC_CLIENT_ID: "elitea-dev-client"
      OIDC_CLIENT_SECRET: "elitea-dev-secret"
      OIDC_REDIRECT_URI: "http://localhost:8080/auth/oidc/callback"
      # Object storage: the local rustfs store above, as on the e2e and
      # standalone stacks. Required: elitea-main refuses to start with
      # STORAGE_BACKEND unset (the S5 storage factory), and every artifact,
      # DeepWiki's pages included, lands here.
      STORAGE_BACKEND: "s3"
      STORAGE_CONTAINER: "elitea-artifacts"
      S3_ENDPOINT_URL: "http://rustfs:9000"
      S3_ACCESS_KEY: "elitea"
      S3_SECRET_KEY: "elitea-dev-secret"
      S3_REGION: "us-east-1"
      S3_FORCE_PATH_STYLE: "true"
      # First-login administrator grant (v2auth.InitialGlobalAdminsFromEnv,
      # cmd/elitea-main/main.go). This stack has no authentication
      # configuration document, so its `initial_global_admins` list is always
      # empty and this environment variable is the ONLY way to name one — with
      # it unset, nobody who logs in ever becomes a global administrator.
      # Comma-separated entries, each `oidc:<sub>` or `saml:<nameid>` (the
      # provider-prefixed form the federated login planes store; see
      # matchesInitialGlobalAdmin in internal/api/v2/auth/first_login.go for
      # why the prefix matters). Empty by default so a fresh clone stays
      # unprivileged until an operator opts in.
      ELITEA_INITIAL_GLOBAL_ADMINS: "${ELITEA_INITIAL_GLOBAL_ADMINS-}"
      # Browser session lifetimes (shared migration 0117). The
      # `elitea_session` cookie carries an opaque identifier; the session is a
      # row, so a logout revokes it and it has an idle deadline as well as an
      # absolute one. Defaults are 8h idle and 168h absolute; both are stated
      # here so a developer can see the knobs without reading the chart. See
      # services/elitea-main/docs/browser-sessions.md.
      ELITEA_SESSION_IDLE_TIMEOUT: "${ELITEA_SESSION_IDLE_TIMEOUT:-8h}"
      ELITEA_SESSION_ABSOLUTE_LIFETIME: "${ELITEA_SESSION_ABSOLUTE_LIFETIME:-168h}"
      # Set to "true" to refuse the pre-0117 signed cookie outright. Leave it
      # off through an upgrade, or every active browser is signed out the
      # moment the new image starts.
      ELITEA_SESSION_REJECT_LEGACY_COOKIES: "${ELITEA_SESSION_REJECT_LEGACY_COOKIES-}"
      # Tracing ingest (issue #250): both elitea-main's own OTLP span export
      # (libs/go/observability) and internal/api/v2/tracing's otlp proxy
      # target point at the collector below.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # The DeepWiki facade (ADR-0022). OFF unless the `deepwiki` profile is
      # up — an enabled facade with no provider behind it is four routes that
      # 503, and the value is read strictly, so "" is off and a typo is a boot
      # failure rather than a quiet disable.
      #
      # Turn the whole thing on with:
      #     bash deploy/scripts/gen-deepwiki-certs.sh
      #     bash deploy/scripts/gen-platform-listener-certs.sh
      #     ELITEA_DEEPWIKI_ENABLED=true \
      #     ELITEA_DEEPWIKI_PLATFORM_GRPC_TARGET=elitea-deepwiki:9443 \
      #     ELITEA_RUNTIME_PLATFORM_ADDRESS=:9446 \
      #     podman compose --profile deepwiki up -d
      ELITEA_DEEPWIKI_ENABLED: "${ELITEA_DEEPWIKI_ENABLED:-false}"
      ELITEA_DEEPWIKI_CLIENT_CERT_FILE: /certs/client.crt
      ELITEA_DEEPWIKI_CLIENT_KEY_FILE: /certs/client.key
      ELITEA_DEEPWIKI_CA_FILE: /certs/ca.crt

      # No ELITEA_DEEPWIKI_CALLBACK_BASE_URL (#1359 U5; elitea-main refuses
      # it): the provider's model and artifact calls are gRPC on elitea-main's
      # platform listener below.
      ELITEA_DEEPWIKI_IDENTITY_SECRET: "changeme"
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      # The provider's gRPC listener (#1359): the facade's SPI calls and the
      # project deletion (#1243) both go there, over mutual TLS with the
      # client material above. Set it to elitea-deepwiki:9443 TOGETHER with
      # ELITEA_DEEPWIKI_ENABLED=true (see above): an enabled facade without it
      # refuses to boot, and a target beside a disabled facade is a boot error.
      # The server certificate's SANs name elitea-deepwiki
      # (gen-deepwiki-certs.sh), which is what this verifies.
      ELITEA_DEEPWIKI_PLATFORM_GRPC_TARGET: "${ELITEA_DEEPWIKI_PLATFORM_GRPC_TARGET:-}"
      # The platform listener (#1359): elitea-main's internal gRPC port, where
      # the DeepWiki host stores its artifacts (elitea.runtime.v1.
      # ArtifactObjectService, U5) and the engine makes its model calls
      # (elitea.llm.v1.ModelService, U2) and reads artifact folders. This
      # stack has no runtime plane and the listener needs none: it opens
      # whenever the address is set, with material from
      # deploy/scripts/gen-platform-listener-certs.sh off the provider CA.
      # Set it to :9446 TOGETHER with the DeepWiki pair above. Not published
      # to the host: only the providers dial it.
      #
      # Unset (the default) the listener stays closed and the three TLS files
      # render empty, because elitea-main refuses a TLS file beside no
      # address. The allowlists below are read only when the listener opens.
      ELITEA_RUNTIME_PLATFORM_ADDRESS: "${ELITEA_RUNTIME_PLATFORM_ADDRESS:-}"
      # Installed by platform-material (owner 65532, key 0600).
      ELITEA_RUNTIME_PLATFORM_TLS_CERT_FILE: "${ELITEA_RUNTIME_PLATFORM_ADDRESS:+/run/elitea-platform/platform-server.crt}"
      ELITEA_RUNTIME_PLATFORM_TLS_KEY_FILE: "${ELITEA_RUNTIME_PLATFORM_ADDRESS:+/run/elitea-platform/platform-server.key}"
      ELITEA_RUNTIME_PLATFORM_TLS_CLIENT_CA_FILE: "${ELITEA_RUNTIME_PLATFORM_ADDRESS:+/run/elitea-platform/ca.crt}"
      # Who may call each service there: the sub-application callback
      # identity (subapp-callback.crt, DNS:elitea-subapp-callback) that the
      # DeepWiki host and engine present. ModelService is required whenever
      # the listener opens. No ELITEA_INTERNAL_TOOL_SERVICE_CLIENTS: only the
      # Inventory engine calls InternalToolService, and this stack has no
      # Inventory.
      ELITEA_MODEL_SERVICE_CLIENTS: "dns:elitea-subapp-callback"
      ELITEA_ARTIFACT_SERVICE_CLIENTS: "dns:elitea-subapp-callback"
      # The toolkit-deletion reconciler (#1244): drains centry.toolkit_deletions,
      # the engine-side deletion an Inventory toolkit's delete owes. On by
      # default (its own flag, apart from ELITEA_PROJECT_DELETION_RECONCILER_
      # ENABLED); "false" stops the loop on this replica.
      ELITEA_TOOLKIT_DELETION_RECONCILER_ENABLED: "${ELITEA_TOOLKIT_DELETION_RECONCILER_ENABLED:-true}"
    volumes:
      # Read-only, and shared with the gateway hop: one dev CA signs both, and
      # `CN=elitea-main` is the same client on both.
      - ./certs:/certs:ro
      - platform_main:/run/elitea-platform:ro
    depends_on:
      platform-material:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      nats-health:
        condition: service_healthy
      nats-bootstrap:
        condition: service_completed_successfully
      oidc-mock:
        condition: service_healthy
      otel-collector:
        condition: service_started
      rustfs-bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── DeepWiki provider service (ADR-0022) ───────────────────────────────────
  #
  # OPT-IN: `podman compose --profile deepwiki up -d`. Out of the default stack
  # because it needs certificates generated first, and because the engine
  # image compiles ~420 crates on its first build.
  #
  # BEFORE the first run:
  #     bash deploy/scripts/gen-deepwiki-certs.sh
  #     bash deploy/scripts/gen-platform-listener-certs.sh
  # then bring it up with elitea-main's three variables (its "Turn the whole
  # thing on" note): the provider's way back to elitea-main is that
  # service's platform listener, which stays closed without them.
  #
  # There is no plaintext mode on either side and that is deliberate — read the
  # script's header. A dev-only relaxation in the production code path is how a
  # deployment ends up serving without mTLS while believing it has it.
  #
  # The shape the chart ships (ADR-0023 H2): the Go sub-application host
  # serves the SPI and reaches the Rust-native engine (ADR-0026) over a Unix
  # socket the two share. The engine runs its `native` runner (generation
  # through the invocation's llm_settings, every index in PostgreSQL; see the
  # engine's note below: this stack has no LLM gateway);
  # DEEPWIKI_NATIVE_RUNNER=fixture gives canned results instead, and
  # =unavailable refuses every tool.
  elitea-deepwiki:
    profiles: ["deepwiki"]
    build:
      context: ..
      dockerfile: services/elitea-subapp-host/Containerfile
    image: ghcr.io/elitea-ng/elitea-subapp-host:dev
    environment:
      ELITEA_SUBAPP: deepwiki
      # The host dials the engine sidecar over the shared socket, whichever
      # runner the engine serves.
      ELITEA_DEEPWIKI_RUNNER: "native"
      ELITEA_DEEPWIKI_ENGINE_SOCKET: /run/deepwiki/engine.sock
      # The service's OWN storage (decision 3): its invocation rows here, its
      # wiki index in the engine. The same database as the platform, because
      # a dev stack has one; the ownership is still separate, and the migrate
      # service below is what applies its schema.
      ELITEA_DEEPWIKI_DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      ELITEA_DEEPWIKI_TLS_CERTFILE: /certs/deepwiki-server.crt
      ELITEA_DEEPWIKI_TLS_KEYFILE: /certs/deepwiki-server.key
      # Setting the CA is what turns mutual authentication ON. Without it the
      # service would serve TLS and accept any client.
      ELITEA_DEEPWIKI_TLS_CA_FILE: /certs/ca.crt
      # Must hold the SAME value as elitea-main's ELITEA_DEEPWIKI_IDENTITY_SECRET:
      # this side verifies what that side signs.
      ELITEA_DEEPWIKI_IDENTITY_SECRET: "changeme"
      # FAIL-CLOSED on both sides. This dev value allows GitHub and nothing
      # else; elitea-main carries the same string, and two that disagree mean
      # an invocation that starts and then fails.
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      ELITEA_DEEPWIKI_SCRATCH_PATH: /tmp/deepwiki
      ELITEA_DEEPWIKI_SERVICE_LOCATION_URL: "grpcs://elitea-deepwiki:9443"
      # The provider service (elitea.subapp.v1.ProviderService, the SPI) and
      # the platform service (elitea.subapp.v1.PlatformOperations) on ONE gRPC
      # listener with mutual TLS (#1359), authorised by the verified client
      # certificate against PLATFORM_CLIENTS — which is required: the host
      # serves nothing without it. The certificate elitea-main presents is
      # CN=elitea-main. Reachable on the compose network only.
      ELITEA_DEEPWIKI_PLATFORM_CLIENTS: "elitea-main"
      ELITEA_DEEPWIKI_PLATFORM_GRPC_ADDR: ":9443"
      # /healthz and /readyz, plain HTTP, for the healthcheck below.
      ELITEA_DEEPWIKI_ADMIN_ADDR: ":9090"
      # Cancellation fan-out between replicas (core NATS,
      # elitea.subapp.deepwiki.cancel.<id>): a cancel that lands on a replica
      # not running the invocation reaches the one that is. Plaintext like the
      # rest of compose's NATS; docker-compose.nats-secure.yml presents the
      # elitea-deepwiki identity instead.
      ELITEA_DEEPWIKI_NATS_URL: "nats://nats:4222"
      # Artifact uploads and reads (#1359 U5): elitea.runtime.v1.
      # ArtifactObjectService on elitea-main's platform listener
      # (ELITEA_RUNTIME_PLATFORM_ADDRESS on elitea-main), trusting the
      # provider CA and presenting the sub-application callback identity,
      # which elitea-main admits through ELITEA_ARTIFACT_SERVICE_CLIENTS. From
      # deploy/scripts/gen-platform-listener-certs.sh.
      ELITEA_DEEPWIKI_ARTIFACT_SERVICE_URL: "https://elitea-main:9446"
      ELITEA_DEEPWIKI_CALLBACK_CA_FILE: /certs/ca.crt
      ELITEA_DEEPWIKI_CALLBACK_CERT_FILE: /certs/subapp-callback.crt
      ELITEA_DEEPWIKI_CALLBACK_KEY_FILE: /certs/subapp-callback.key
    expose:
      - "9443"
    volumes:
      - ./certs:/certs:ro
      - deepwiki-engine-sock:/run/deepwiki
    depends_on:
      elitea-deepwiki-engine:
        condition: service_healthy
      nats-health:
        condition: service_healthy
    healthcheck:
      # Distroless; the binary probes its own admin port's /readyz, which
      # fails while the replica does not hold its owner claim (#1359).
      test: ["CMD", "/elitea-subapp-host", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The engine sidecar: one distroless binary on the socket the host dials.
  # No port, no TLS, no identity — the shared volume is the only way in.
  #
  # Its OUTBOUND calls go to elitea-main's platform listener (#1359): model
  # calls over elitea.llm.v1.ModelService (U2) and artifact-folder reads over
  # ArtifactObjectService (U5), presenting the sub-application callback
  # identity. The native runner refuses to start without
  # ELITEA_DEEPWIKI_MODEL_SERVICE_URL, so elitea-main must run with
  # ELITEA_RUNTIME_PLATFORM_ADDRESS=:9446 (see its "Turn the whole thing on"
  # note).
  #
  # THIS STACK HAS NO LLM GATEWAY, and never had one: elitea-main mounts its
  # /llm surface, which ModelService runs in process, only with
  # LLM_GATEWAY_URL set. The transport works and artifacts work; a model call
  # still fails at elitea-main, with `llm_gateway_not_configured` ("LLM_GATEWAY_URL
  # is empty") in the refusal the engine reports. Generating a wiki with a model needs
  # docker-compose.standalone-full.yml, which runs elitea-llm-gateway.
  # DEEPWIKI_NATIVE_RUNNER=fixture gives canned results with no model.
  elitea-deepwiki-engine:
    profiles: ["deepwiki"]
    build:
      context: ..
      dockerfile: services/elitea-deepwiki-engine/Containerfile
    image: ghcr.io/elitea-ng/elitea-deepwiki-engine-native:dev
    # The image's own ENTRYPOINT/CMD: `elitea-deepwiki-engine serve`.
    environment:
      ELITEA_DEEPWIKI_RUNNER: "${DEEPWIKI_NATIVE_RUNNER:-native}"
      ELITEA_DEEPWIKI_ENGINE_SOCKET: /run/deepwiki/engine.sock
      # Directly, not through a pooler: the migration and the publish hold
      # session-level advisory locks.
      ELITEA_DEEPWIKI_DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      # A container's hostname changes on every recreate, and the startup
      # reconciliation deletes this owner's earlier builds, so the owner is
      # a fixed name. (Helm uses the pod name.)
      ELITEA_DEEPWIKI_BUILD_OWNER: "dev-deepwiki-engine"
      # The engine checks the same allowlist again before it clones.
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      ELITEA_DEEPWIKI_SCRATCH_PATH: /tmp/deepwiki
      # The platform listener (see above), trusting the provider CA and
      # presenting the callback identity elitea-main admits through
      # ELITEA_MODEL_SERVICE_CLIENTS. The fixture runner calls no model and
      # ignores them.
      ELITEA_DEEPWIKI_MODEL_SERVICE_URL: "https://elitea-main:9446"
      ELITEA_DEEPWIKI_CALLBACK_CA_FILE: /certs/ca.crt
      ELITEA_DEEPWIKI_CALLBACK_CERT_FILE: /certs/subapp-callback.crt
      ELITEA_DEEPWIKI_CALLBACK_KEY_FILE: /certs/subapp-callback.key
    volumes:
      - deepwiki-engine-sock:/run/deepwiki
      # A bind mount, like the host's: the engine (uid 10001) reads the 0644
      # callback key as it is; only elitea-main's securefile needs the
      # owner-only copy that platform-material makes.
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      elitea-deepwiki-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Distroless: no shell. The binary probes its own socket.
      test: ["CMD", "/usr/local/bin/elitea-deepwiki-engine", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The service's own migrations, run once before the engine starts, from the
  # engine's image (the binary embeds them). Separate from the platform's own
  # migrations for the reason the chart's Job header gives: the service owns
  # this schema and versions it independently.
  elitea-deepwiki-migrate:
    profiles: ["deepwiki"]
    build:
      context: ..
      dockerfile: services/elitea-deepwiki-engine/Containerfile
    image: ghcr.io/elitea-ng/elitea-deepwiki-engine-native:dev
    # The image's ENTRYPOINT is the binary; this replaces its CMD (`serve`).
    command: ["migrate"]
    environment:
      ELITEA_DEEPWIKI_DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  elitea-ui:
    build:
      context: ..
      dockerfile: deploy/docker/Containerfile.elitea-ui
    image: ghcr.io/elitea-ng/elitea-ui:dev
    environment:
      VITE_SERVER_URL: "/api/v2"
      VITE_BASE_URI: "/app/"
      VITE_SOCKET_SERVER: ""
      VITE_SOCKET_PATH: "/socket.io"
      VITE_PUBLIC_PROJECT_ID: "1"
      DEV: ""
    depends_on:
      - elitea-main

  elitea-scheduler:
    build:
      # Repo root, not services/elitea-scheduler: the Containerfile COPYs
      # libs/go/observability (issue #250's local replace target) from there.
      context: ..
      dockerfile: services/elitea-scheduler/Containerfile
    image: ghcr.io/elitea-ng/elitea-scheduler:dev
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      HTTP_ADDR: ":8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # Audit-event retention sweep (issue #619). centry.audit_events gained a
      # product writer in issue #615 and no bound on its growth; this is the
      # bound. Same names, meanings and defaults as
      # deploy/helm/elitea/values.yaml's scheduler.env block — read that block
      # for why the window is 365 days, why 0 is the off switch, and why a
      # positive window under 7 days is refused rather than applied.
      AUDIT_RETENTION_DAYS: "365"
      AUDIT_RETENTION_INTERVAL: "1h"
      AUDIT_RETENTION_BATCH_SIZE: "1000"
      AUDIT_RETENTION_MAX_BATCHES: "50"
      # ADR-0025 WP6: sync tombstone retention; 97 days is the floor.
      SYNC_TOMBSTONE_RETENTION_DAYS: "97"
    # No migrate dependency here: this stack runs elitea-main with
    # SKIP_MIGRATIONS=1 and has no elitea-migrate service (the schema is applied
    # outside it), and it does not enable the budget write-back. The stack that
    # does, docker-compose.standalone-full.yml, starts the scheduler only after
    # elitea-migrate completes. A write-back that starts before its tables exist
    # gets SQLSTATE class 42, which is deferred and never dropped ([human
    # decision] 2026-10-16, "Drop only 22/23, retry 42").
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # No container healthcheck: the image is distroless (no shell/wget/curl) and the
    # binary has no -healthcheck flag. Liveness is via /healthz on :8081 — use a k8s
    # httpGet probe in production (see deploy/helm).
    restart: unless-stopped

volumes:
  postgres_data:
  # The DeepWiki engine sidecar's Unix socket, shared by the host and the
  # engine only.
  deepwiki-engine-sock:
  # elitea-main's platform-listener material, written by platform-material
  # (empty while the listener is off).
  platform_main:
  rustfs_data:
  nats_data:
