# app-of-apps root (issue #240). This is the ONLY object you apply by hand:
#
#   kubectl apply -f deploy/argocd/app-of-apps.yaml
#
# It renders every Application under deploy/argocd/applications/ and syncs them
# in sync-wave order. `kubectl apply -f deploy/argocd/` reaches only this file
# (kubectl does not recurse into subdirectories without -R), which is the
# intended behaviour — the children come from here, not from a second apply.
#
# Deliberately NOT in applications/: a root that enumerated itself would manage
# its own lifecycle, so a mistake in the root could prune the root.
#
# COMPOSITION DECISION: this replaces the never-built umbrella Helm chart that
# was scaffolded at deploy/helm/elitea-platform/ (an empty .gitkeep, removed in
# the same change). One composition mechanism, not two — see deploy/README.md.
#
# EXTERNAL PREREQUISITES this root does NOT install: PostgreSQL, and the
# runtime's TLS Redis (`runtimeRedis`, the chat runtime's command/output
# streams — only when chat is on). No chart in deploy/helm provisions them, so
# the wave-1 elitea-main migration hook will fail against a cluster where they
# do not already exist and where each Application's values have not been
# pointed at them. The plain Redis this root once listed is gone.
#
# NATS WITH JETSTREAM is installed HERE (applications/nats.yaml, wave -2, plus
# its bootstrap at -1) in the platform's `elitea` namespace. The gateway's
# budget counters, the scheduler and elitea-main's live-update plane (project
# SSE stream, canvas presence KV) all dial it over mTLS (#1076), with client
# certificates from the NATS chart's namespaced elitea-nats-ca Issuer — which
# is why it shares the platform's namespace. cert-manager is a prerequisite.
# A NATS you bring yourself must run JetStream, require the same client
# identities, and have the bootstrap's assets, or elitea-main refuses to start.
# Moving NATS here from `elitea-gateway` starts it on an EMPTY JetStream
# volume — budget counters reset for the current period (docs/UPGRADING.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/elitea-ng/elitea-platform
    targetRevision: main
    path: deploy/argocd/applications
    directory:
      # Flat directory of Application manifests; no nesting to descend into.
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    # Applications are cluster-scoped objects living in argocd's namespace —
    # NOT where the workloads land. Each child sets its own workload namespace.
    namespace: argocd
  syncPolicy:
    automated:
      # prune: deleting a child manifest from git deletes that Application, and
      # its resources-finalizer cascades to the workloads it manages. That is
      # the point of GitOps here, but it means removing a file from
      # applications/ is a production deletion — review those diffs as such.
      prune: true
      selfHeal: true
