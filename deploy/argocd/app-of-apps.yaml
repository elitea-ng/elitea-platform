# app-of-apps root (issue #240). This is the ONLY object you apply by hand:
#
#   kubectl apply -f deploy/argocd/app-of-apps.yaml
#
# It renders every Application under deploy/argocd/applications/ — today one,
# the elitea chart. `kubectl apply -f deploy/argocd/` reaches only this file
# (kubectl does not recurse into subdirectories without -R), which is the
# intended behaviour — the children come from here, not from a second apply.
#
# Deliberately NOT in applications/: a root that enumerated itself would manage
# its own lifecycle, so a mistake in the root could prune the root.
#
# COMPOSITION DECISION: this replaces the never-built umbrella Helm chart that
# was scaffolded at deploy/helm/elitea-platform/ (an empty .gitkeep, removed in
# the same change). One composition mechanism, not two — see deploy/README.md.
#
# EXTERNAL PREREQUISITE this root does NOT install: PostgreSQL. No chart in
# deploy/helm provisions it, so the elitea-main migration hook (PreSync) will fail
# against a cluster where it does not already exist and where each
# Application's values have not been pointed at it. The platform needs no
# Redis: Form authentication keeps its state in PostgreSQL and the chat
# runtime's commands travel on NATS JetStream.
#
# NATS WITH JETSTREAM is part of the elitea chart (`nats`, bundled by default,
# with its JetStream bootstrap), so there is one child Application. The
# gateway's budget counters, the scheduler and elitea-main's live-update plane
# (project SSE stream, canvas presence KV) dial it over mTLS (#1076), with
# client certificates from the chart's namespaced elitea-nats-ca Issuer.
# cert-manager is a prerequisite. A NATS you bring yourself (nats.enabled:
# false) must run JetStream, require the same client identities, and have the
# bootstrap's assets, or elitea-main refuses to start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/elitea-ng/elitea-platform
    targetRevision: main
    path: deploy/argocd/applications
    directory:
      # Flat directory of Application manifests; no nesting to descend into.
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    # Applications are cluster-scoped objects living in argocd's namespace —
    # NOT where the workloads land. Each child sets its own workload namespace.
    namespace: argocd
  syncPolicy:
    automated:
      # prune: deleting a child manifest from git deletes that Application, and
      # its resources-finalizer cascades to the workloads it manages. That is
      # the point of GitOps here, but it means removing a file from
      # applications/ is a production deletion — review those diffs as such.
      prune: true
      selfHeal: true
