# EXAMPLE — a ClusterSecretStore on Google Secret Manager, for the elitea
# chart's `externalSecrets` block. Optional: any store your External Secrets
# Operator (ESO) already has works; the chart only names it
# (externalSecrets.secretStoreRef).
#
# Keyless: there is no `auth` block, so ESO authenticates as its controller's
# own Kubernetes service account through GKE Workload Identity. Before you
# apply it, link that service account to a Google service account that may
# read the platform's secrets (and nothing else):
#
#   gcloud iam service-accounts create external-secrets
#   for s in elitea-platform elitea-database-url; do
#     gcloud secrets add-iam-policy-binding "$s" \
#       --member "serviceAccount:external-secrets@<PROJECT_ID>.iam.gserviceaccount.com" \
#       --role roles/secretmanager.secretAccessor
#   done
#   gcloud iam service-accounts add-iam-policy-binding \
#     external-secrets@<PROJECT_ID>.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:<PROJECT_ID>.svc.id.goog[external-secrets/external-secrets]"
#   kubectl -n external-secrets annotate serviceaccount external-secrets \
#     iam.gke.io/gcp-service-account=external-secrets@<PROJECT_ID>.iam.gserviceaccount.com
#
# (external-secrets/external-secrets is the namespace and service account of
# ESO's own Helm chart with its defaults; use yours.) Then:
#
#   kubectl apply -f bootstrap/cluster-secret-store.yaml
#   kubectl get clustersecretstore gcp-secret-manager   # READY True
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: <PROJECT_ID>
  # Only the platform's namespace may read through this store.
  conditions:
    - namespaces:
        - elitea
