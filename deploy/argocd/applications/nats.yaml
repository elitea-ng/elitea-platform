# ArgoCD Application: NATS JetStream shared by elitea-main, the LLM gateway and
# the scheduler (BF0.2b; secured by #1076).
# Sync-wave -2 so NATS is healthy before the bootstrap Job (-1) and the platform
# (0). Defaults to the scale-1 profile; HA deployments swap the values file to
# values-ha.yaml and set nats-bootstrap replicas=3.
#
# SECURED (#1076): TLS with client certificates only, every client mapped to a
# user in the chart's permission table, and an ingress NetworkPolicy. The chart
# renders its own DEDICATED CA as a NAMESPACED cert-manager Issuer
# (elitea-nats-ca), which signs only in this namespace — so NATS, its bootstrap
# and the platform all install into `elitea`. cert-manager must be installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-nats
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/elitea-ng/elitea-platform
    targetRevision: main
    path: deploy/helm/nats
    helm:
      valueFiles:
        # scale-1 profile (design §8.1.1). HA: swap to values-ha.yaml.
        - values-scale1.yaml
  destination:
    server: https://kubernetes.default.svc
    # The platform's namespace: the NATS CA Issuer is namespaced, and the
    # elitea Application's client Certificates are issued by it.
    namespace: elitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The upstream nats chart is a dependency; ArgoCD must build it.
      - ServerSideApply=true
