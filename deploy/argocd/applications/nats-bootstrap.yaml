# ArgoCD Application: JetStream asset bootstrap (KV buckets + write-behind
# stream), BF0.2b. Sync-wave -1 so it runs after NATS (-2) is healthy and before
# the gateway (0). The Helm hook Job inside is idempotent — safe on every sync.
# HA operators MUST set replicas=3 to match the HA NATS profile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elitea-nats-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/elitea-ng/elitea-platform
    targetRevision: main
    path: deploy/helm/nats-bootstrap
    helm:
      parameters:
        # applications/nats.yaml installs NATS as release `elitea-nats`, so its
        # Service is elitea-nats (the upstream chart names it after a release
        # name that contains "nats"), in this same elitea-gateway namespace.
        - name: natsUrl
          value: "nats://elitea-nats:4222"
        # scale-1 default. HA: set to "3" (or "5") to match values-ha.yaml.
        - name: replicas
          value: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: elitea-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
