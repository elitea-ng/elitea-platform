# The REAL-ENGINE journey (DWIKI-014) on the Rust-native DeepWiki engine
# (ADR-0026). An overlay for docker-compose.standalone-full.yml, which
# already runs the native engine sidecar and its migration:
#
#   STANDALONE_OVERLAY=deploy/docker-compose.deepwiki-native-real-engine.yml \
#     DEEPWIKI_ENGINE_IMAGE=ghcr.io/eliteaai/elitea-deepwiki-engine-native:local \
#     deploy/scripts/standalone-stack.sh up
#
# apps/elitea-web/scripts/deepwiki-real-engine.sh assembles that and runs
# the `deepwiki-real-engine` Playwright project against it.
#
# What it changes on top of the base file:
#
#   * the migration and the engine run a PREBUILT native image (the bake
#     target `elitea-deepwiki-engine-native`, or the runner script's own
#     build) and never a compose build: `build:` is reset on both;
#   * the engine runs the `native` runner whatever DEEPWIKI_NATIVE_RUNNER
#     says, so this overlay can never run the fixture by accident;
#   * the platform's LLM mock is replaced by a deterministic stub
#     (services/elitea-deepwiki-engine/testdata/llm_stub.py), at the mock's
#     hostname and port, so the gateway's egress allowlist and the seeded
#     credential need no change.
#
# What it does NOT have, on purpose: no git daemon and no `insteadOf`
# rewrite. The native clone opens the repository isolated (no environment
# git configuration), speaks HTTPS only and follows no redirect, so the
# repository under analysis is a real public one on github.com
# (ELITEA_DEEPWIKI_GIT_ALLOWLIST, from the base file). The runner needs
# internet access.
services:
  elitea-deepwiki-migrate:
    image: ${DEEPWIKI_ENGINE_IMAGE:-ghcr.io/eliteaai/elitea-deepwiki-engine-native:local}
    build: !reset null

  elitea-deepwiki-engine:
    image: ${DEEPWIKI_ENGINE_IMAGE:-ghcr.io/eliteaai/elitea-deepwiki-engine-native:local}
    build: !reset null
    environment:
      ELITEA_DEEPWIKI_RUNNER: "native"

  # The stub in the mock's place: same hostname, same port, so the gateway's
  # GATEWAY_EGRESS_ALLOWLIST (`llm-mock:8090`) and the seeded credential's
  # api_base need no change. Any model name is accepted.
  llm-mock:
    image: docker.io/library/python:3.12-slim
    build: !reset null
    entrypoint: ["python", "/opt/llm_stub.py"]
    environment:
      LLM_STUB_HOST: "0.0.0.0"
      LLM_STUB_PORT: "8090"
    volumes:
      - ../services/elitea-deepwiki-engine/testdata/llm_stub.py:/opt/llm_stub.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/models', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
