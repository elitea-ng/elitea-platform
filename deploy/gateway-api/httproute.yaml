# THE GATEWAY-API BROWSER EDGE (#568, one route since #1359 P3).
#
# WHAT THIS FILE IS.
#
# The reviewed HTTPRoute for a cluster whose Gateway is managed outside the
# chart. The chart renders the same shape itself when
# `main.ingress.gatewayApi: true` (templates/main/ingress.yaml); use this copy
# only when the route has to live with the Gateway rather than with the
# release.
#
# ONE RULE, ONE BACKEND.
#
# Everything a browser requests goes to elitea-main on `/`. elitea-main is the
# browser edge (internal/api/webedge, turned on by ELITEA_WEB_UPSTREAM, which
# the chart sets to the elitea-web Service): it redirects `/` to `/app/`,
# relays `/app…` and `/docs…` to elitea-web, keeps the MCP server at
# `/app/<numeric project id>/mcp[/…]` and its own `/app` file servers, and
# refuses `/readyz` and `/startupz` to anything but a loopback probe.
#
# This file used to be a rule per root-mounted Go route plus a second route for
# the SPA, and it could not carry the MCP carve-out at all: that needs a path
# regular expression, which Gateway API leaves implementation-specific. Twice a
# route family reached one edge and not the other (#568). The decision now
# lives in Go, in one place, and services/elitea-main/tests/deployedge drives
# it through the real router.
#
# WHAT GATES IT.
#
# services/elitea-main/tests/deployedge/edge_gateway_api_test.go reads this
# file. It fails unless there is exactly one rule, a PathPrefix `/` to
# elitea-main, with no RegularExpression match, no SPA backend and the
# identity-header removal below.
#
# HOW TO APPLY IT.
#
# Set the `parentRefs` name to the Gateway of the cluster, and add the
# `hostnames` of that deployment. Both are deployment-local, so this copy
# leaves them minimal on purpose. The backend name needs no edit: the chart
# names the Service release-independently (templates/main/_helpers.tpl),
# because the runtime certificates carry it as a DNS SAN.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: elitea-main
  labels:
    app.kubernetes.io/name: elitea-main
    app.kubernetes.io/component: browser-edge
spec:
  parentRefs:
    # The Gateway of the deployment. Add `namespace:` and `sectionName:` when
    # the deployment needs them.
    - name: elitea
  # `hostnames:` is deployment-local and stays out of this copy. An HTTPRoute
  # with no hostname attaches to every hostname the Gateway listener serves.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # DEFENCE IN DEPTH, NOT THE CONTROL.
      #
      # elitea-main deletes these names itself, before any route runs
      # (apimw.StripClientIdentityHeaders, #1359; X-Elitea-Execution-Id is the
      # one exception, below), and no code reads X-Auth-* as an identity any
      # more. The removal stays because it costs
      # nothing and keeps a caller-chosen value out of anything that sits
      # between this Gateway and elitea-main.
      #
      # Names must be enumerated. Gateway API has no prefix wildcard. Extend
      # this list; never shorten it.
      #
      # X-Elitea-Llm-Hop IS DELIBERATELY ABSENT, and the gate fails if it
      # appears. It is the LLM gateway's hop marker (#164). The gateway stamps
      # it on every outbound provider request and refuses a request that
      # arrives already carrying this deployment's own value, which contains a
      # circular route on its first re-entry. That route comes back in through
      # this very edge, so an edge that deleted the marker would leave hop
      # detection armed in the code and dead on the wire. The marker is not
      # identity: it grants nothing, and recognising it only REFUSES a request.
      # elitea-main's own strip (apimw.ClientIdentityHeaders) carries the same
      # exception, and tests/deployedge holds the two edges to it together.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Auth-Type
              - X-Auth-ID
              - X-Auth-User-ID
              - X-Auth-Reference
              - X-Auth-Signature
              - X-Auth-Avatar
              - X-Auth-Avatar-State
              - X-Auth-Session-Id
              - X-Auth-Session-Name
              - X-Auth-Session-Endpoint
              - X-Elitea-Identity-Signature
              - X-Elitea-Project-Id
              - X-Elitea-User-Id
              - X-Elitea-Tenant-Id
              # The runtime execution a /llm call was made from. Legitimate from
              # the runtime worker, which does not pass this edge; never from a
              # browser. elitea-main itself KEEPS this one name (the desktop
              # sends it on /llm; see apimw.StripClientIdentityHeaders), so
              # this removal is the only one here that changes behaviour.
              - X-Elitea-Execution-Id
      backendRefs:
        - name: elitea-main
          port: 8080
