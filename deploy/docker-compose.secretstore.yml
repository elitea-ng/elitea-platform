# OpenBao in dev mode with TLS, for the secretstore integration tests ONLY
# (issue #1113). Never referenced by a production chart or compose file: dev
# mode keeps everything in memory and starts unsealed with a fixed root token.
#
#   podman compose -f deploy/docker-compose.secretstore.yml up -d
#   export ELITEA_TEST_OPENBAO_ADDR=https://127.0.0.1:8210
#   export ELITEA_TEST_OPENBAO_CA_FILE=$HOME/.cache/elitea-secretstore-tls/vault-ca.pem
#   export ELITEA_TEST_OPENBAO_ROOT_TOKEN=elitea-secretstore-it-root
#   cd services/elitea-main && go test -race -run OpenBao ./internal/secretstore/vault/
#
# -dev-tls generates vault-ca.pem and a server certificate (SANs localhost
# and 127.0.0.1) into ELITEA_SECRETSTORE_TLS_DIR, which is outside the
# repository by default. The test provisions its own KV v2 mounts (with and
# without cas_required), JWT auth method, policy and role through the root
# token, so this file needs no init step.
services:
  openbao:
    image: quay.io/openbao/openbao:2.4.1
    # bao itself, as in ci-go.yml's secretstore-openbao service: the image's
    # entrypoint script drops to the openbao user, which cannot write a
    # host directory it does not own.
    entrypoint: ["bao"]
    command:
      - server
      - -dev
      - -dev-tls
      - -dev-tls-cert-dir=/tls
      - -dev-listen-address=0.0.0.0:8200
      - -dev-root-token-id=elitea-secretstore-it-root
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8210:8200"
    volumes:
      - ${ELITEA_SECRETSTORE_TLS_DIR:-${HOME}/.cache/elitea-secretstore-tls}:/tls:z
