# Full mixed PoV overlay. Apply this file after Centry's current Compose,
# hybrid Auth overlay and indexing checkpoint. All paths are supplied by
# deploy/centry-hybrid/compose.sh and resolve to tracked inputs or ignored
# branch-local runtime material.
services:
  elitea-litellm:
    build:
      context: ${ELITEA_CENTRY_DIR:?set ELITEA_CENTRY_DIR}/hybrid_auth
      dockerfile: Containerfile.litellm
    image: eliteaai/elitea-litellm:pov

  pylon_main:
    volumes:
      - ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}/deploy/centry-hybrid/runtime-interface-litellm.yml:/data/configs/runtime_interface_litellm.yml:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/pylon-main-shared.yml:/data/configs/shared.yml:ro
    depends_on:
      elitea-litellm:
        condition: service_healthy

  # ── pylon_indexer is retired (#339) ────────────────────────────────────────
  #
  # The index plane runs on the Go runtime plane and the Python agent worker,
  # on the version-2 command stream and consumer group configured on
  # elitea-main below. That path is proven with no pylon in the stack: the
  # index DoD journey runs it in CI, and `standalone-stack.sh seed-index`
  # records a run that indexes real documents.
  #
  # THE SERVICE IS DECLARED AND NOT STARTED, which is deliberate. Centry's own
  # Compose model declares pylon_indexer and that model is not in this
  # repository, so this overlay cannot delete the service — Compose has no
  # directive for that. A profile is Compose's own mechanism for "declared,
  # not started": `compose.sh` renders and starts with `--profile runtime`
  # only, so this service is absent from the model it renders and from the
  # stack it brings up. `compose.sh config` asserts that absence.
  #
  # Its four plugins are covered or dropped, and neither is a guess:
  #   indexer_worker        -> services/elitea-worker-python (the agent worker
  #                            serves index ingest on the same stream)
  #   provider_worker       -> ADR-0012 P3; the Go successor owns provider
  #                            descriptors, and no hybrid route reaches this
  #   worker_core           -> the worker's own runtime, replaced with it
  #   runtime_engine_litellm-> DROPPED for this checkpoint already (#323). The
  #                            configuration it read now lives beside the
  #                            rollback overlay that would need it.
  #
  # ROLLBACK: apply deploy/centry-hybrid/rollback/index-v1.yml as a further
  # overlay and add `--profile index-v1`. It is a tracked file carrying the
  # exact mounts, health check and dependency this service had, so a reversal
  # is one command and not git archaeology.
  #
  # ORDER MATTERS. deploy/INDEX_V2_CUTOVER.md holds the drain rule and the
  # preflight. Stopping this service before the version-1 drain completes
  # strands work that no version-2 process will accept, and that document says
  # binary rollback is prohibited once a version-2 command has been admitted.
  pylon_indexer:
    profiles: [index-v1]

  elitea-main:
    build:
      context: ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}
      dockerfile: services/elitea-main/Containerfile
      target: hybrid
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    environment:
      # ── Artifacts (#337) ───────────────────────────────────────────────────
      # The Go artifact plane is authoritative in the mixed deployment. Every
      # artifact route in traefik/index-routes.yml resolves to elitea-main, so
      # this flag and that route file are one decision: turn the flag off again
      # and the routes still point here, at a service that composes no object
      # store and answers 404 on every artifact path.
      #
      # The store is a SEPARATE endpoint from Centry's libcloud directory, and
      # deliberately so. libcloud LOCAL is a directory tree of base64-encoded
      # names on pylon_main's own disk (ADR-0016 SS8); it is not an S3, Azure or
      # GCS endpoint, so no configuration of elitea-main can read it in place.
      # The existing objects move once, with deploy/ARTIFACT_CUTOVER.md and
      # centry-hybrid/scripts/migrate-artifacts.sh. Nothing reads the old tree
      # after that copy, and nothing writes to it.
      ELITEA_ARTIFACTS_ENABLED: "true"
      STORAGE_BACKEND: "s3"
      STORAGE_CONTAINER: "elitea-artifacts"
      S3_ENDPOINT_URL: "http://runtime-artifacts:9000"
      S3_ACCESS_KEY: "elitea"
      S3_SECRET_KEY: "elitea-dev-secret"
      S3_REGION: "us-east-1"
      S3_FORCE_PATH_STYLE: "true"
      ELITEA_RUNTIME_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_SCHEDULING_ENABLED: "true"
      ELITEA_RUNTIME_SCHEDULER_INSTANCE_ID: elitea-main-pov-1
      ELITEA_RUNTIME_INDEX_INGEST_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.2.0
      ELITEA_RUNTIME_INDEX_INGEST_CONSUMER_GROUP: elitea-indexer-worker-v2
      ELITEA_RUNTIME_INDEX_INGEST_STREAM_MAX_ENTRIES: "16"
      # Agent and index commands are reference-only envelopes consumed by the
      # same existing SDK worker pool. Payloads and outputs remain off Redis.
      ELITEA_RUNTIME_AGENT_EXECUTION_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_AGENT_EXECUTION_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.2.0
      ELITEA_RUNTIME_AGENT_EXECUTION_CONSUMER_GROUP: elitea-indexer-worker-v2
      ELITEA_RUNTIME_AGENT_EXECUTION_STREAM_MAX_ENTRIES: "16"
      # Hybrid-only capacity budget. Standalone Go deployments retain the
      # compiled phase-one defaults.
      ELITEA_RUNTIME_DB_ADMISSION_MAX_CONNS: "3"
      ELITEA_RUNTIME_DB_CONTROL_MAX_CONNS: "2"
      ELITEA_RUNTIME_DB_OUTPUT_MAX_CONNS: "2"
      ELITEA_RUNTIME_DB_REPLAY_MAX_CONNS: "1"
      ELITEA_RUNTIME_DB_TERMINAL_MAX_CONNS: "1"
      ELITEA_RUNTIME_DB_CONTENT_MAX_CONNS: "1"
      ELITEA_DATABASE_MAX_CONNS: "4"
      # Optional, live current-platform policy lookup for next-input suggestions.
      # The exact actor PAT crosses only the private gateway route below; lookup
      # failure suppresses the suggestion and never blocks the primary turn.
      ELITEA_RUNTIME_CURRENT_MAIN_BASE_URL: https://elitea-gateway
    depends_on:
      runtime-index-v2-bootstrap:
        condition: service_completed_successfully
      # The bucket must exist before the first PUT. elitea-main probes the
      # store at boot (objectStoreReadinessProbe) and refuses to start on a
      # missing container, so this is a start ORDER requirement and not a
      # convenience.
      runtime-artifacts-bucket-init:
        condition: service_completed_successfully
    networks:
      - runtime_gateway

  pylon_auth:
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/pylon-auth-core.yml:/data/configs/auth_core.yml:ro

  elitea-migrate:
    # Main is the single build owner for this shared image tag.
    build: !reset null
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    pull_policy: never

  elitea-worker:
    # The indexer service builds the common capability image once.
    build: !reset null
    image: ${ELITEA_WORKER_IMAGE:?set ELITEA_WORKER_IMAGE}
    pull_policy: never

  elitea-indexer-worker:
    build:
      context: ${ELITEA_PLATFORM_DIR:?set ELITEA_PLATFORM_DIR}
      dockerfile: services/elitea-worker-python/Containerfile
    image: ${ELITEA_INDEXER_WORKER_IMAGE:?set ELITEA_INDEXER_WORKER_IMAGE}
    environment:
      # PoV-only, fail-safe snapshot of the current indexer_worker admin
      # configuration. The wildcard is intentionally broader than the current
      # `artifact.delete_file` rule so metadata drift cannot bypass approval in
      # this focused HITL proof. The completed admin port must replace this with
      # an exact, versioned worker-policy snapshot.
      ELITEA_SENSITIVE_TOOLS: '{"*":["delete_file"]}'
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/indexer-runtime-v2.json:/run/elitea-runtime/indexer-runtime.json:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/agent-checkpoint-connection:/run/elitea-runtime/agent-checkpoint-connection:ro
      - runtime-indexer-worker-v2-spool:/var/lib/elitea-indexer-worker/output-spool
    depends_on:
      runtime-index-v2-bootstrap:
        condition: service_completed_successfully

  runtime_redis:
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-users-v2.acl:/run/elitea-runtime/redis-users.acl:ro

  # A fresh named volume starts 0755. The runtime worker contract requires a
  # private spool root, so make the local PoV volume private before the
  # observational v1 drain check. Existing spool contents are not modified.
  runtime-index-v1-spool-bootstrap:
    profiles: [runtime]
    image: redis:8.2.4-alpine
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - chmod 700 /spool
    restart: "no"
    volumes:
      - runtime-indexer-worker-spool:/spool

  index-v1-cutover-preflight:
    profiles: [runtime]
    build: !reset null
    image: ${ELITEA_MAIN_IMAGE:?set ELITEA_MAIN_IMAGE}
    pull_policy: never
    user: "0:0"
    entrypoint: [/index-v2-preflight]
    command:
      - --spool-root
      - /mnt/index-worker-v1/output-spool
    read_only: true
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      ELITEA_RUNTIME_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_COMMAND_STREAM: commands.v1.index.ingest.indexing.shared.1.0
      ELITEA_RUNTIME_INDEX_INGEST_CONSUMER_GROUP: elitea-indexer-worker-v1
      ELITEA_RUNTIME_REDIS_URL: rediss://health@runtime-redis:6380/0
      ELITEA_RUNTIME_REDIS_PASSWORD_FILE: /run/elitea-runtime/redis-health-password
      ELITEA_RUNTIME_REDIS_CA_FILE: /run/elitea-runtime/runtime-ca.crt
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-health-password:/run/elitea-runtime/redis-health-password:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/runtime-ca.crt:/run/elitea-runtime/runtime-ca.crt:ro
      - runtime-indexer-worker-spool:/mnt/index-worker-v1/output-spool:ro
    depends_on:
      elitea-migrate:
        condition: service_completed_successfully
      runtime_redis:
        condition: service_healthy
      runtime-control-bootstrap:
        condition: service_completed_successfully
      runtime-index-v1-spool-bootstrap:
        condition: service_completed_successfully
    networks:
      - centry
      - runtime_control

  runtime-index-v2-bootstrap:
    profiles: [runtime]
    image: redis:8.2.4-alpine
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - >-
        export REDISCLI_AUTH="$$(cat /run/elitea-runtime/redis-bootstrap-password)";
        result="$$(redis-cli --user bootstrap --tls
        --cacert /run/elitea-runtime/runtime-ca.crt
        -h runtime-redis -p 6380 XGROUP CREATE
        commands.v1.index.ingest.indexing.shared.2.0
        elitea-indexer-worker-v2 0-0 MKSTREAM 2>&1)" ||
        { case "$$result" in *BUSYGROUP*) ;; *)
        echo "runtime index v2 Redis group bootstrap failed" >&2; exit 1;; esac; };
        redis-cli --user bootstrap --tls
        --cacert /run/elitea-runtime/runtime-ca.crt
        -h runtime-redis -p 6380 XINFO GROUPS
        commands.v1.index.ingest.indexing.shared.2.0
        | grep -q elitea-indexer-worker-v2
    restart: "no"
    volumes:
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/runtime-ca.crt:/run/elitea-runtime/runtime-ca.crt:ro
      - ${ELITEA_AUTH_POV_RUNTIME_DIR:?set ELITEA_AUTH_POV_RUNTIME_DIR}/runtime/redis-bootstrap-password:/run/elitea-runtime/redis-bootstrap-password:ro
    depends_on:
      index-v1-cutover-preflight:
        condition: service_completed_successfully
    networks:
      - runtime_control

  # ── The hybrid object store (#337) ─────────────────────────────────────────
  #
  # The same image, keys and bucket name as the standalone stack
  # (deploy/docker-compose.standalone-full.yml), so an operator who knows one
  # stack knows this one. It is named runtime-artifacts rather than rustfs
  # because this overlay merges into Centry's Compose model, where a short
  # generic name is more likely to collide with a service somebody adds there.
  #
  # It carries the objects the copy in deploy/ARTIFACT_CUTOVER.md writes, and
  # every object written after the cutover.
  runtime-artifacts:
    image: docker.io/rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: elitea
      RUSTFS_SECRET_KEY: elitea-dev-secret
    volumes:
      - runtime-artifacts-data:/data
    healthcheck:
      # Neither this image nor its dependents ship curl — only wget — and
      # wget's exit code does not distinguish "reachable but 403" from
      # "refused". Treat a captured "server returned error" as reachable.
      # Kept in step with the identical block in
      # deploy/docker-compose.standalone-full.yml.
      test: ["CMD-SHELL", "out=$$(wget -q -O /dev/null http://127.0.0.1:9000/ 2>&1); [ $$? -eq 0 ] || echo \"$$out\" | grep -q 'server returned error'"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - centry

  runtime-artifacts-bucket-init:
    image: docker.io/minio/mc:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set runtime-artifacts http://runtime-artifacts:9000 elitea elitea-dev-secret &&
        mc mb --ignore-existing runtime-artifacts/elitea-artifacts
    depends_on:
      runtime-artifacts:
        condition: service_healthy
    restart: "no"
    networks:
      - centry

volumes:
  runtime-indexer-worker-v2-spool:
  runtime-artifacts-data:
