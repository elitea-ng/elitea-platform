http:
  routers:
    go-current-index-runtime:
      rule: >-
        (PathRegexp(`^/api/v2/elitea_core/test_toolkit_tool/prompt_lib/[1-9][0-9]*$`) && Method(`POST`) && Query(`execution_contract`, `index.ingest.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/messages/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`POST`) && Query(`execution_contract`, `agent.execute.application.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/messages/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`POST`) && Query(`execution_contract`, `agent.execute.adhoc.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/regenerate/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`POST`) && Query(`execution_contract`, `agent.regenerate.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/continue_predict/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`POST`) && Query(`execution_contract`, `agent.continue.hitl.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/continue_predict/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`POST`) && Query(`execution_contract`, `agent.continue.authorization.v1`)) ||
        (PathRegexp(`^/api/v2/elitea_core/task/prompt_lib/[1-9][0-9]*/[^/]+$`) && Method(`DELETE`)) ||
        (PathRegexp(`^/api/v2/elitea_core/index_cancel/prompt_lib/[1-9][0-9]*/[1-9][0-9]*/[^/]+/[0-9a-f]{32}$`) && Method(`DELETE`)) ||
        (PathRegexp(`^/api/v2/elitea_core/index_meta/prompt_lib/[1-9][0-9]*/[1-9][0-9]*$`) && Method(`GET`)) ||
        (PathRegexp(`^/api/v2/elitea_core/index_meta/prompt_lib/[1-9][0-9]*/[1-9][0-9]*/[^/]+$`) && Method(`DELETE`)) ||
        (PathRegexp(`^/api/v2/elitea_core/index_meta/prompt_lib/[1-9][0-9]*/[1-9][0-9]*/[^/]+$`) && Method(`PATCH`)) ||
        (PathRegexp(`^/api/v2/elitea_core/index_schedule/prompt_lib/[1-9][0-9]*/[1-9][0-9]*/[^/]+$`) && Method(`DELETE`)) ||
        (PathRegexp(`^/api/v2/executions/[1-9][0-9]*/[^/]+/events$`) && Method(`GET`))
      priority: 90
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: elitea-main

    go-current-notification-events:
      rule: >-
        PathRegexp(`^/api/v2/notifications/events/prompt_lib/[1-9][0-9]*$`) &&
        Method(`GET`)
      priority: 90
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: elitea-main

    go-current-notifications:
      rule: >-
        (PathRegexp(`^/api/v2/notifications/notifications/prompt_lib/[1-9][0-9]*$`) && (Method(`GET`) || Method(`PUT`) || Method(`DELETE`))) ||
        (PathRegexp(`^/api/v2/notifications/notification/prompt_lib/[1-9][0-9]*/[1-9][0-9]*$`) && (Method(`GET`) || Method(`PUT`) || Method(`DELETE`)))
      priority: 90
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: elitea-main

    runtime-worker-current-tools-list:
      rule: >-
        Host(`elitea-gateway`) &&
        PathRegexp(`^/api/v2/elitea_core/tools_list/[1-9][0-9]*$`) &&
        Method(`GET`)
      priority: 85
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: current-main

    # The Python execution worker resolves the effective low-tier model through
    # the current SDK configurations client. Route that exact read-only API to
    # the Go compatibility implementation through the same workload-token
    # ForwardAuth boundary as the other worker-owned current reads. Without
    # this route the private gateway fallback rejects the worker PAT before the
    # request reaches either implementation, while browser-cookie reads still
    # succeed and hide the deployment drift.
    runtime-worker-go-current-models:
      rule: >-
        Host(`elitea-gateway`) &&
        PathRegexp(`^/api/v2/configurations/models/[1-9][0-9]*$`) &&
        Method(`GET`)
      priority: 85
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: elitea-main

    # elitea-main resolves the current project-scoped suggestion policy with
    # the exact execution actor PAT. Keep this optional compatibility lookup on
    # the private gateway and retain current Main's RBAC/project-membership
    # checks while that settings surface remains current-platform owned.
    runtime-go-current-next-input-suggestion-policy:
      rule: >-
        Host(`elitea-gateway`) &&
        PathRegexp(`^/api/v2/elitea_core/next_input_suggestion_config/prompt_lib/[1-9][0-9]*$`) &&
        Method(`GET`)
      priority: 85
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: current-main

    # SDK 0.9.6 resolves an admitted nested application by reference. Keep the
    # current application/version handlers and RBAC semantics during hybrid
    # operation, while making the worker PAT pass through the same trusted
    # forward-auth boundary as the already-supported tools-list lookup.
    runtime-worker-current-application-reference:
      rule: >-
        Host(`elitea-gateway`) &&
        ((PathRegexp(`^/api/v2/elitea_core/application/prompt_lib/[1-9][0-9]*/[1-9][0-9]*$`) && Method(`GET`)) ||
        (PathRegexp(`^/api/v2/elitea_core/version/prompt_lib/[1-9][0-9]*/[1-9][0-9]*/[1-9][0-9]*$`) && Method(`PATCH`)))
      priority: 85
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: current-main

    # ── Artifacts (#337) ──────────────────────────────────────────────────────
    #
    # ONE router, and no Host guard, because the artifact plane has ONE owner
    # now. Before this change the S3 surface was routed to pylon behind a
    # Host(`elitea-gateway`) guard for the worker, and browser artifact traffic
    # fell through base.yml's PathPrefix(`/`) catch-all to pylon as well. Two
    # doors to one store is the state that made a cutover a two-step change; a
    # single router is the state that makes it one.
    #
    # elitea-main serves every path below (services/elitea-main/internal/api/
    # router.go: the /api/v2/artifacts bucket, object and grant routes, and the
    # root-mounted /artifacts/s3 surface the pinned SDK speaks). The Go object
    # store is composed in this stack: pov-compose.yml sets
    # ELITEA_ARTIFACTS_ENABLED and the S3_* variables that name it.
    #
    # THE FLAG AND THIS ROUTER ARE ONE DECISION. Setting
    # ELITEA_ARTIFACTS_ENABLED back to "false" without reverting this router
    # leaves every artifact path resolving to a service that composes no object
    # store. The rollback is therefore both edits, and deploy/
    # ARTIFACT_CUTOVER.md states it as one step.
    #
    # PRIORITY 90 matches the other browser-reachable Go routers in this file.
    # 85 is the band for the worker-only routers that keep a Host guard, and
    # this one no longer has a guard to justify sitting there.
    #
    # /artifacts/s3 is deliberately NOT under /api/v2. The SDK appends
    # "/artifacts/s3" to a platform origin validated to carry no path, so the
    # request arrives at the root and the edge forwards it verbatim.
    go-artifacts:
      rule: >-
        (PathRegexp(`^/api/v2/artifacts/buckets/[1-9][0-9]*(/[^/]+)?$`) && (Method(`GET`) || Method(`POST`) || Method(`PATCH`) || Method(`DELETE`))) ||
        (PathRegexp(`^/api/v2/artifacts/objects/[1-9][0-9]*/[^/]+(/.*)?$`) && (Method(`GET`) || Method(`POST`) || Method(`DELETE`) || Method(`HEAD`))) ||
        (PathRegexp(`^/api/v2/artifacts/grants/[1-9][0-9]*/.*$`) && Method(`POST`)) ||
        (PathRegexp(`^/artifacts/s3/[^/]+(/.*)?$`) && (Method(`GET`) || Method(`PUT`) || Method(`DELETE`) || Method(`HEAD`)))
      priority: 90
      entryPoints: [websecure]
      tls: {}
      middlewares:
        - strip-caller-auth-context
        - normalize-runtime-public-authority
        - go-main-forward-auth
      service: elitea-main
