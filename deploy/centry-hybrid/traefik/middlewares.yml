# Middleware definitions for the hybrid edge (#338).
#
# Every router in index-routes.yml names these three middlewares. Before this
# file existed, no configuration in this repository defined them, and the
# failure was silent rather than loud:
#
#   * Traefik drops a router that names an unknown middleware. It logs
#     `middleware "go-main-auth@file" does not exist` and then removes
#     the router.
#   * base.yml keeps `current-platform` on `PathPrefix("/")` at priority 1.
#     That router absorbs every path the dropped routers were to serve.
#   * The caller gets HTTP 200 from pylon. It does not get 503. Nothing in the
#     response shows that the Go route is absent.
#   * `strip-caller-auth-context` is dropped with the router that names it.
#     Client-supplied `X-Auth-*` and `X-Elitea-*` headers then reach the
#     backend unchanged, which is the bypass issue #326 closed for the
#     standalone edge.
#
# services/elitea-main/tests/deployedge/edge_middlewares_test.go fails when a
# router names a middleware that no file in the same Traefik configuration set
# defines. Run it with `task deploy:check-edge`. The No Binaries workflow runs
# it on every pull request, because ci-go.yml is path-filtered and does not
# select deploy/centry-hybrid/**.
#
# SCOPE. deploy/centry-hybrid/docker-compose.yml mounts this file and base.yml
# into the foundation stack. It does NOT mount index-routes.yml there, because
# the foundation stack registers no edge-auth endpoint (#378). No router in
# the foundation stack names these three middlewares today. Traefik accepts a
# definition that no router names, and it never calls it. The definitions stay
# loaded so that a future foundation route needs one edit and not two.
#
# The full PoV stack in compose.sh mounts only index-routes.yml, as
# /etc/traefik/dynamic/index.yml, and takes its base and middleware definitions
# from the private centry repository instead. This file therefore never
# collides with the private definitions. See README.md.
#
# PROVENANCE. The private definitions are not readable from this repository.
# These definitions come from three in-repo sources:
#   1. deploy/runtime/platform-edge-dynamic.yml, the working standalone edge,
#      which uses the same strip-then-edge-auth shape.
#   2. The assertions in
#      services/elitea-main/tests/system/index_issue_5681_production_scale_test.go,
#      which pin the edge-auth address path, `trustForwardHeader: false`,
#      `forwardBody: false`, `preserveRequestMethod: false`, and the
#      `Host: localhost:18443` value.
#   3. deploy/traefik/dynamic.yml, which holds the full #326 header list.
http:
  middlewares:
    # INGRESS-ONLY header removal, and an authentication control rather than
    # hygiene (#326).
    #
    # This middleware MUST run before go-main-auth. elitea-main accepts
    # X-Auth-Type/X-Auth-ID as a finished identity when the request arrives
    # from a trusted proxy CIDR (internal/api/middleware/auth.go
    # tryTrustedProxyHeaders + isFromTrustedProxy). This edge is on that
    # network. Without this middleware any caller selects its own identity by
    # sending the header.
    #
    # Direction matters and is easy to get backwards. `customRequestHeaders`
    # rewrites the REQUEST on its way in, so an empty value deletes what the
    # CLIENT sent. It does not delete what go-main-auth later ADDS,
    # because forwardAuth applies authResponseHeaders after the middleware
    # chain runs. Stripping a name here and projecting the same name below is
    # therefore correct, not contradictory.
    #
    # Traefik has no prefix wildcard, so each name is listed. This is the same
    # list as `strip-client-identity` in deploy/traefik/dynamic.yml. It is
    # wider than the six names the standalone runtime edge strips, and wider
    # than the three names the system test pins. A wider list cannot widen what
    # reaches the backend; it only deletes more client input. Callers on these
    # routes present a bearer PAT or a session cookie, never an X-Auth-* header,
    # so no legitimate caller loses input here.
    #
    # Deliberately NOT listed: X-Elitea-Claim-Id / -Fence / -Source-* , which
    # belong to the runtime content server's own mTLS listener (:9445) and
    # never traverse this edge.
    strip-caller-auth-context:
      headers:
        customRequestHeaders:
          X-Auth-Type: ""
          X-Auth-ID: ""
          X-Auth-User-ID: ""
          X-Auth-Reference: ""
          X-Auth-Avatar: ""
          X-Auth-Avatar-State: ""
          X-Auth-Session-Id: ""
          X-Auth-Session-Name: ""
          X-Auth-Session-Endpoint: ""
          X-Elitea-Identity-Signature: ""
          X-Elitea-Project-Id: ""
          X-Elitea-User-Id: ""
          X-Elitea-Tenant-Id: ""

    # This middleware exists because go-main-auth sets
    # `trustForwardHeader: false`. With that setting Traefik derives
    # X-Forwarded-Host from the request's own Host header, and it ignores any
    # X-Forwarded-Host the caller sent. That is the safe setting, and it makes
    # the request Host decide whether authentication succeeds.
    #
    # The authenticator fails closed on a Host it does not expect.
    # TrustedProxyResolver.Resolve in
    # internal/api/browserauth/forwarded.go compares X-Forwarded-Host against
    # the configured public_origin host with strings.EqualFold, and answers
    # 403 on a mismatch, before it reads the credential. The 403 names no
    # header, so the cause is hard to find. deploy/runtime/auth.form.yml
    # records the same failure from a real deployment.
    #
    # The Python worker reaches this edge as `https://elitea-gateway`. That
    # value is ELITEA_RUNTIME_CURRENT_MAIN_BASE_URL in pov-compose.yml and
    # platform_origin in prepare-runtime.sh, and five routers in
    # index-routes.yml match Host(`elitea-gateway`). Browsers reach the same
    # edge as `https://localhost:18443`, which is the public origin. Worker
    # traffic would therefore 403 without this rewrite.
    #
    # Routing already happened when this middleware runs, so the
    # Host(`elitea-gateway`) rules still select correctly. For browser traffic
    # the value is already `localhost:18443` and the rewrite changes nothing.
    #
    # The standalone edge needs no equivalent middleware, because
    # deploy/runtime/platform-edge.yml sets public_origin to the edge's own
    # hostname. That is why deploy/runtime/platform-edge-dynamic.yml chains two
    # middlewares and this file defines three.
    #
    # ORDER MATTERS. This middleware must run after strip-caller-auth-context
    # and before go-main-auth. index-routes.yml lists the three in that
    # order on every router.
    #
    # The value is a literal because the Traefik file provider does not expand
    # environment variables. It matches the default of
    # ELITEA_HYBRID_HTTPS_PORT in docker-compose.yml and the public URL in
    # README.md. CHANGE BOTH TOGETHER: a deployment that overrides
    # ELITEA_HYBRID_HTTPS_PORT must edit this value as well.
    #
    # services/elitea-main/tests/deployedge/edge_services_test.go compares the
    # port below with that compose default and fails when they differ (#379).
    normalize-runtime-public-authority:
      headers:
        customRequestHeaders:
          Host: localhost:18443

    # The internal address, never a product route. It authenticates the
    # request's own credential (bearer PAT or browser session, through
    # edgeauth.Kernel) and answers with the identity projection below.
    # authResponseHeaders is what copies that projection onto the forwarded
    # request. A name that is absent from that list does not reach the backend,
    # which is what makes strip-caller-auth-context above effective.
    #
    # The address names `elitea-main`, the service in
    # deploy/centry-hybrid/docker-compose.yml. The private PoV stack points the
    # same middleware at its own `elitea-main-auth` service. Do not copy that
    # name here; this stack has no such service and the middleware would fail
    # closed on every request.
    #
    # trustForwardHeader: false stops a caller from choosing the X-Forwarded-*
    # values the authenticator sees. It also makes
    # normalize-runtime-public-authority necessary; read that comment before
    # you change either one.
    #
    # forwardBody: false keeps request bodies away from the authenticator.
    #
    # preserveRequestMethod: false is required, not a preference.
    # production_router.go registers this path with http.MethodGet only. A
    # value of true replays the original POST, DELETE or PATCH, and every
    # mutating route then fails on a 405.
    #
    # X-Auth-User-ID is load-bearing in this list. When X-Auth-Type is `token`,
    # tryTraefikHeaders in internal/api/middleware/auth.go rejects the request
    # unless X-Auth-User-ID is present and valid. Removing that one name breaks
    # every worker PAT while browser sessions keep working, which hides the
    # fault.
    #
    # The handler also sets X-Auth-Avatar and X-Auth-Avatar-State. They are
    # left out of this list on purpose: nothing behind this edge reads them,
    # and strip-caller-auth-context above deletes the caller's copies, so they
    # reach the backend from no source at all. deploy/runtime/platform-edge-dynamic.yml
    # projects the same four names.
    go-main-auth:
      forwardAuth:
        address: http://elitea-main:8080/internal/auth/main
        trustForwardHeader: false
        forwardBody: false
        preserveRequestMethod: false
        authResponseHeaders:
          - X-Auth-Type
          - X-Auth-ID
          - X-Auth-User-ID
          - X-Auth-Reference
