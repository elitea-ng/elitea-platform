# Apply this file after the current Centry compose model:
#
#   docker compose \
#     --project-directory ../centry \
#     --env-file ../centry/envs/default.env \
#     --env-file ../centry/envs/override.env \
#     -f ../centry/docker-compose.yml \
#     -f ./deploy/centry-hybrid/docker-compose.yml \
#     config --quiet
#
# Relative paths are intentionally avoided for platform-owned inputs. Set
# ELITEA_PLATFORM_DIR to this repository root when the checkout is not the
# normal sibling of Centry.
services:
  pylon_main:
    # Current Main remains the fallback owner but is no longer directly
    # reachable from the host or the ordinary Compose network. The gateway
    # sidecar shares this namespace and reaches the listener over loopback.
    command:
      - bash
      - -ec
      - >-
        grep -q '^  host: "0.0.0.0"' /data/pylon.yml;
        sed 's/^  host: "0.0.0.0"/  host: "127.0.0.1"/'
        /data/pylon.yml > /run/pylon-main-hybrid.yml;
        export PYLON_CONFIG_SEED=file:/run/pylon-main-hybrid.yml;
        exec bash /usr/local/sbin/entrypoint.sh
    ports: !override
      - "127.0.0.1:${ELITEA_HYBRID_HTTPS_PORT:-18443}:443"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 2 http://127.0.0.1:8080/readyz >/dev/null
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  elitea-main:
    build:
      context: ${ELITEA_PLATFORM_DIR:-../elitea-platform}
      dockerfile: services/elitea-main/Containerfile
      target: hybrid
    image: ghcr.io/elitea-ng/elitea-main:pov-integration
    restart: on-failure
    environment:
      DATABASE_URL: >-
        postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis:${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Centry remains the schema/migration owner in this coexistence slice.
      SKIP_MIGRATIONS: "1"
      # Empty keeps current pylon_auth as the authorization authority over the
      # authenticated Redis RPC until the reviewed Go Auth slice is selected.
      APPLICATION_SECRET_KEY: ""
      ADMIN_UI_STATIC_DIR: "/nonexistent"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      pylon_auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - centry

  elitea-hybrid-gateway:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --accesslog=true
      - --log.level=INFO
    # MOUNT EACH FILE, AND NOT THE DIRECTORY (#378).
    #
    # traefik/index-routes.yml is deliberately absent from this list. Every
    # router in that file names the `go-main-forward-auth` middleware, and that
    # middleware calls http://elitea-main:8080/internal/forward-auth/main. The
    # elitea-main service above does NOT set ELITEA_AUTH_CONFIG_FILE, so it
    # composes no production authentication and it registers no such path.
    # Traefik then returns the authenticator's non-2xx answer to the caller.
    # Three of those routers carry no Host(`elitea-gateway`) guard and sit at
    # priority 90, so a browser reaches them and the notification API fails.
    #
    # A directory mount put those routers into this stack as a side effect of a
    # file that was added for the full PoV stack. Each file is now named, so a
    # new file cannot join this stack without an edit here.
    #
    # traefik/middlewares.yml stays mounted. Traefik accepts a middleware
    # definition that no router names, and it never calls it. Keeping the
    # definitions loaded means a future Go route needs one edit and not two,
    # which is how the missing definitions of #338 happened.
    #
    # services/elitea-main/tests/deployedge/edge_forward_auth_test.go reads the
    # volume list below and fails when it stops matching the configuration set
    # the edge gate checks. Run it with `task deploy:check-edge`.
    volumes:
      - >-
        ${ELITEA_PLATFORM_DIR:-../elitea-platform}/deploy/centry-hybrid/traefik/base.yml:/etc/traefik/dynamic/base.yml:ro
      - >-
        ${ELITEA_PLATFORM_DIR:-../elitea-platform}/deploy/centry-hybrid/traefik/middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro
    depends_on:
      elitea-main:
        condition: service_healthy
      pylon_main:
        condition: service_healthy
    network_mode: service:pylon_main
