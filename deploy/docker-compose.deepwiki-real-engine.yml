# The REAL DeepWiki engine on the standalone stack (ADR-0023, acceptance).
#
# An overlay for docker-compose.standalone-full.yml (STANDALONE_OVERLAY, see
# deploy/scripts/standalone-stack.sh) that turns the fixture run into the
# real thing without touching the seeds or the facade:
#
#   * the engine sidecar runs the `-engine` image — the copied analysis engine
#     with its full dependency closure — with ELITEA_DEEPWIKI_RUNNER=legacy;
#   * a git daemon serves the conformance sample repository as
#     `acme/e2e-generated`, the repository the seeded toolkit names. The
#     engine builds `https://<token>@github.com/acme/e2e-generated.git` from
#     the seeded GitHub toolkit; git's url.<base>.insteadOf, set through the
#     process-scoped GIT_CONFIG_* variables, rewrites both spellings to
#     `git://deepwiki-git/` so the clone stays on the compose network and
#     every allowlist (facade and host: github.com) sees what it expects;
#   * the platform's LLM mock is replaced, at the SAME hostname and port the
#     gateway's egress allowlist names, by the deterministic prompt-aware stub
#     from services/elitea-deepwiki/e2e/llm_stub.py: a well-formed wiki
#     structure when asked for one, canned markdown for pages, fixed-length
#     embeddings. Nothing leaves the machine; a run is reproducible.
#
#   STANDALONE_OVERLAY=deploy/docker-compose.deepwiki-real-engine.yml \
#     DEEPWIKI_ENGINE_IMAGE=ghcr.io/elitea-ng/elitea-deepwiki:local-engine \
#     deploy/scripts/standalone-stack.sh up
#
# apps/elitea-web/scripts/deepwiki-real-engine.sh drives the whole thing and
# runs the `deepwiki-real-engine` Playwright project against it.
services:
  elitea-deepwiki-engine:
    # Image only, no `build:` — the base file's build section is reset so a
    # `compose build` does not rebuild the 2 GB engine image on every run; the
    # runner script builds it once when the tag is absent.
    image: ${DEEPWIKI_ENGINE_IMAGE:-ghcr.io/elitea-ng/elitea-deepwiki:local-engine}
    build: !reset null
    environment:
      ELITEA_DEEPWIKI_RUNNER: "legacy"
      ELITEA_DEEPWIKI_ENGINE_SOCKET: /run/deepwiki/engine.sock
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      # The engine builds its embeddings through the platform's /llm/v1 (the
      # stub answers them); no model is downloaded, and none may be.
      ELITEA_DEEPWIKI_MODEL_ALLOWLIST: ""
      ELITEA_DEEPWIKI_SCRATCH_PATH: /tmp/deepwiki
      # Clone destination rewrite, process-scoped (no global git config):
      # `url.<base>.insteadOf` is multi-valued, so both the tokened and the
      # anonymous spelling of the seeded repository's URL land on the daemon.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: "url.git://deepwiki-git/.insteadOf"
      GIT_CONFIG_VALUE_0: "https://e2e-not-a-real-token@github.com/"
      GIT_CONFIG_KEY_1: "url.git://deepwiki-git/.insteadOf"
      GIT_CONFIG_VALUE_1: "https://github.com/"
    depends_on:
      deepwiki-git:
        condition: service_healthy

  # `git daemon` over the sample repository from the conformance fixtures,
  # committed on first start. Plain debian:trixie-slim (Debian 13, like every
  # image in this stack) plus `apt-get install git` at start: Debian's `git`
  # package carries `git daemon`. The healthcheck probes the port with bash's
  # /dev/tcp, because trixie-slim ships no `nc`.
  deepwiki-git:
    image: docker.io/library/debian:trixie-slim
    entrypoint: ["/bin/sh", "/opt/deepwiki-git-daemon.sh"]
    environment:
      DEEPWIKI_GIT_REPOSITORY: acme/e2e-generated
    volumes:
      - ./scripts/deepwiki-git-daemon.sh:/opt/deepwiki-git-daemon.sh:ro
      - ../conformance/provider/fixtures/deepwiki/retrieval/sample-repo/corpus:/corpus:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /repos/.ready && exec 3<>/dev/tcp/127.0.0.1/9418"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # The stub in the mock's place: same hostname, same port, so the gateway's
  # GATEWAY_EGRESS_ALLOWLIST (`llm-mock:8090`) and the seeded credential's
  # api_base need no change. Any model name is accepted.
  llm-mock:
    image: docker.io/library/python:3.12.14-slim-trixie
    build: !reset null
    entrypoint: ["python", "/opt/llm_stub.py"]
    environment:
      LLM_STUB_HOST: "0.0.0.0"
      LLM_STUB_PORT: "8090"
    volumes:
      - ../services/elitea-deepwiki/e2e/llm_stub.py:/opt/llm_stub.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/models', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
