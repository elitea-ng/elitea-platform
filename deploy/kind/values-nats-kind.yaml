# The kind stack's NATS (deploy/helm/nats), layered on values-scale1.yaml.
# elitea-main's runtime plane needs a JetStream command bus, and the DeepWiki
# host's cancellation fan-out a NATS client (#1359). Only what a throwaway
# cluster cannot provide changes here.
nats:
  config:
    jetstream:
      fileStore:
        pvc:
          size: 1Gi
  promExporter:
    # No Prometheus Operator in kind, so no PodMonitor CRD. The exporter stays
    # on: the chart's guards tie the command-bus alerts to it, and the
    # PrometheusRule renders only where the CRD exists anyway.
    podMonitor:
      enabled: false
