# Standalone E2E compose (issue #60, unit V1).
#
# A COMPLETE, self-contained stack — NOT an overlay.
# Use this instead of layering on docker-compose.yml when local ports conflict
# (e.g. centry's pylon_main already holds 8080).
#
# Ports used (all non-default to avoid clashing with centry/dev stacks):
#   8082 → traefik (E2E entry point)  — set via E2E_PORT env (default 8082)
#   9400 → oidc-provider-mock
#   15432 → postgres                  (separate from centry's 5432)
#   16379 → redis                     (separate from centry's 6379)
#
# `E2E_IMAGE_TAG` (default `e2e`) names the two application images. It exists so
# a second stack can run beside the first without the two sharing a mutable tag:
# `E2E_PROJECT`, `E2E_PORT`, `E2E_PG_PORT`, `E2E_REDIS_PORT` and `E2E_OIDC_PORT`
# already isolate the containers and their ports, but with a hardcoded `:e2e`
# both stacks' `build:` writes landed on the SAME tag, so whichever built last
# silently owned what the other would get on its next restart. CI sets none of
# these and keeps building `:e2e` exactly as before.
#
# Usage:
#   E2E_PORT=8082 podman compose -f deploy/docker-compose.e2e-standalone.yml \
#     -p elitea-e2e up -d
#   E2E_PORT=8082 PLAYWRIGHT_BASE_URL=http://localhost:8082 npx playwright test
#
# In CI (ubuntu-latest, no conflicting stack):
#   E2E_PORT=8080 COMPOSE_BIN="docker compose" … up -d
#   PLAYWRIGHT_BASE_URL=http://localhost:8080 npx playwright test
#
# The postgres/redis/rustfs/rustfs-bucket-init/oidc-mock blocks below are
# hand-duplicated (not layered) in docker-compose.standalone-full.yml — see
# that file's header for why. A shared-behaviour fix here (a healthcheck
# workaround, a volume fix) belongs in both files.

name: elitea-e2e

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:18
    shm_size: '2g'
    environment:
      POSTGRES_USER: elitea
      POSTGRES_PASSWORD: elitea
      POSTGRES_DB: elitea
    ports:
      - "${E2E_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: docker.io/rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: elitea
      RUSTFS_SECRET_KEY: elitea-dev-secret
    healthcheck:
      # Neither this image nor its dependents ship curl — only wget — and wget's
      # exit code does not distinguish "reachable but 403" from "refused". Treat
      # a captured "server returned error" as reachable. Kept in sync with the
      # identical block in docker-compose.standalone-full.yml.
      test: ["CMD-SHELL", "out=$$(wget -q -O /dev/null http://127.0.0.1:9000/ 2>&1); [ $$? -eq 0 ] || echo \"$$out\" | grep -q 'server returned error'"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs-bucket-init:
    image: docker.io/minio/mc:latest
    entrypoint: ["sh", "-c"]
    command:
      - |
        mc alias set rustfs http://rustfs:9000 elitea elitea-dev-secret &&
        mc mb --ignore-existing rustfs/elitea-artifacts
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  # ── OIDC mock ───────────────────────────────────────────────────────────────
  # https://github.com/geigerzaehler/oidc-provider-mock
  # Accept any client_id/secret; users provisioned via PUT /users/{email}
  #
  # The `oidc.localhost` alias is what makes the provider addressable by ONE
  # URL from BOTH sides, which the browser-driven journeys require:
  #
  #   * elitea-main resolves it through the compose network to this container;
  #   * the HOST browser resolves it to 127.0.0.1 (RFC 6761: the OS maps every
  #     `*.localhost` name to loopback — measured on this machine, and it is an
  #     OS-level answer, so WebKit gets it as well as Chromium), reaching the
  #     published port below.
  #
  # Why it matters: the mock derives its issuer and every endpoint in its
  # discovery document from the request's Host header (measured), so whatever
  # host elitea-main discovers it under is the host the BROWSER is then
  # redirected to. With `OIDC_ISSUER_URL: http://oidc-mock:9400` that was a
  # compose-internal name the host browser cannot resolve, so every
  # browser-initiated OIDC navigation died on ERR_NAME_NOT_RESOLVED. Tests that
  # drive the login endpoint THEMSELVES papered over it by string-rewriting the
  # hostname (`e2e/auth.setup.ts`), but a redirect the browser follows on its
  # own — J3's re-auth popup, J4's post-logout hand-off — cannot be rewritten
  # from the test side.
  #
  # The port is PARAMETERISED but the host and container sides must stay EQUAL
  # (`${E2E_OIDC_PORT}:${E2E_OIDC_PORT}`), for the same reason the hostname must:
  # the issuer string below is resolved by both elitea-main inside the network
  # and the browser on the host, and they can only agree if the port is the same
  # number on both sides. It is a variable at all so two E2E stacks can run at
  # once — every other published port here was already parameterised, and 9400
  # being the one hardcoded value is what made two concurrent agents collide on
  # this stack. The default is unchanged, so CI sees exactly what it saw before.
  oidc-mock:
    image: ghcr.io/geigerzaehler/oidc-provider-mock:latest
    # The image entrypoint is `oidc-provider-mock --host 0.0.0.0`; this appends
    # the port, which it defaults to 9400 on its own.
    command: ["--port", "${E2E_OIDC_PORT:-9400}"]
    networks:
      default:
        aliases:
          - oidc.localhost
    ports:
      - "${E2E_OIDC_PORT:-9400}:${E2E_OIDC_PORT:-9400}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${E2E_OIDC_PORT:-9400}/.well-known/openid-configuration')\""]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Application services ────────────────────────────────────────────────────

  elitea-main:
    image: ghcr.io/eliteaai/elitea-main:${E2E_IMAGE_TAG:-e2e}
    # `image:` alone made compose PULL when the tag was absent locally, and the
    # tag has never been published — so CI died at bring-up with
    # `Head https://ghcr.io/v2/eliteaai/elitea-main/manifests/e2e: denied`
    # (issue #154). With `build:` present compose builds the missing tag from
    # this very commit instead of reaching for a registry, so the local and CI
    # paths are identical and no `:e2e` tag ever has to be published. An image
    # that IS already present is still reused as before — compose does not
    # rebuild without `--build`.
    #
    # Context is `..` because build contexts resolve relative to THIS file's
    # directory (deploy/), and both Containerfiles expect the repo root.
    build:
      context: ..
      dockerfile: services/elitea-main/Containerfile
      # `e2e` is byte-identical to the shipping `final` stage (`final` derives
      # from it), so the admin journeys run against the artefact that ships.
      target: e2e
    environment:
      DATABASE_URL: "postgres://elitea:elitea@postgres:5432/elitea?sslmode=disable"
      REDIS_URL: "redis:6379"
      # The brand pack's FILE layer (ADR-0024); empty means the journeys brand
      # from the database layer over the product default, as a fresh install
      # does. See docker-compose.standalone-full.yml for the mount recipe.
      BRAND_PACK_PATH: "${BRAND_PACK_PATH:-}"
      ADMIN_UI_STATIC_DIR: "/data/admin_ui/static/dist"
      APPLICATION_SECRET_KEY: "changeme-e2e"
      SKIP_MIGRATIONS: "1"
      # Reachable under this exact name from the container AND from the host
      # browser — see the oidc-mock service's comment for why that symmetry is
      # a hard requirement and not a convenience.
      OIDC_ISSUER_URL: "http://oidc.localhost:${E2E_OIDC_PORT:-9400}"
      OIDC_CLIENT_ID: "elitea-e2e-client"
      OIDC_CLIENT_SECRET: "elitea-e2e-secret"
      OIDC_REDIRECT_URI: "http://localhost:${E2E_PORT:-8082}/forward-auth/auth_oidc/callback"
      COOKIE_SECURE: "false"
      # First-login administrator grant (v2auth.InitialGlobalAdminsFromEnv,
      # cmd/elitea-main/main.go). Empty by default: this stack's E2E seeder
      # (apps/elitea-web/scripts/e2e-stack.sh) grants its admin fixture
      # directly against centry's RBAC tables rather than through first login,
      # so it does not need this variable set. It exists here for the same
      # reason it exists on every stack — an operator who runs this compose
      # file WITHOUT the seeder still needs a way to make the first account a
      # global administrator. Comma-separated `oidc:<sub>` / `saml:<nameid>`
      # entries; see the note on the elitea-main service in
      # docker-compose.yml for the full contract.
      ELITEA_INITIAL_GLOBAL_ADMINS: "${ELITEA_INITIAL_GLOBAL_ADMINS-}"
      # Object storage: point at the local rustfs S3-compatible store
      STORAGE_BACKEND: "s3"
      STORAGE_CONTAINER: "elitea-artifacts"
      S3_ENDPOINT_URL: "http://rustfs:9000"
      S3_ACCESS_KEY: "elitea"
      S3_SECRET_KEY: "elitea-dev-secret"
      S3_REGION: "us-east-1"
      S3_FORCE_PATH_STYLE: "true"
      # ── Current index types and attached skills (issues #394, #395) ─────
      # ON, and this stack is where the widened gate is proved. Both routes
      # used to demand a Form authentication document; this stack has none, so
      # they could not be enabled here at all. #394 and #395 changed the gate
      # to productionAuthenticationComposed — one reader of the caller's
      # credential plus a PrincipalValidator — which the OIDC session plane
      # above supplies.
      #
      # They are ON rather than OFF because each reviewed route is now the ONLY
      # handler for its path: the prototype fallbacks are deleted from
      # internal/api/router.go. With these off, the skill-mention dropdowns
      # (src/features/chat-input/lib/hooks/useChatSkillMention.ts) read a 404.
      ELITEA_INDEX_TYPES_ENABLED: "true"
      ELITEA_APPLICATION_SKILLS_ENABLED: "true"
      # ── The DeepWiki facade, on the OIDC-only stack (ADR-0023 H0) ────────
      # The facade takes the API group's credential set, and under OIDC-only
      # auth that carries the LocalValidator for APPLICATION_SECRET_KEY-signed
      # tokens — which is how the provider's callback bearer is read back on
      # its upload. Everything on this side is the production path; the
      # provider below runs its fixture engine.
      ELITEA_DEEPWIKI_ENABLED: "true"
      ELITEA_DEEPWIKI_BASE_URL: "https://elitea-deepwiki:8080"
      ELITEA_DEEPWIKI_SERVER_NAME: "elitea-deepwiki"
      ELITEA_DEEPWIKI_CLIENT_CERT_FILE: /certs/client.crt
      ELITEA_DEEPWIKI_CLIENT_KEY_FILE: /certs/client.key
      ELITEA_DEEPWIKI_CA_FILE: /certs/ca.crt
      ELITEA_DEEPWIKI_IDENTITY_SECRET: "e2e-deepwiki-identity"
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      ELITEA_DEEPWIKI_CALLBACK_BASE_URL: "http://elitea-main:8080"
      # ── The Inventory facade, on the same OIDC-only stack ────────────────
      # Same credential set, same reasoning: the API group's LocalValidator
      # reads back the APPLICATION_SECRET_KEY-signed callback bearer the
      # provider presents on its graph upload.
      ELITEA_INVENTORY_ENABLED: "true"
      ELITEA_INVENTORY_BASE_URL: "https://elitea-inventory:8080"
      ELITEA_INVENTORY_SERVER_NAME: "elitea-inventory"
      ELITEA_INVENTORY_CLIENT_CERT_FILE: /certs/client.crt
      ELITEA_INVENTORY_CLIENT_KEY_FILE: /certs/client.key
      ELITEA_INVENTORY_CA_FILE: /certs/ca.crt
      ELITEA_INVENTORY_IDENTITY_SECRET: "e2e-inventory-identity"
      ELITEA_INVENTORY_GIT_ALLOWLIST: "github.com,*.github.com"
      ELITEA_INVENTORY_CALLBACK_BASE_URL: "http://elitea-main:8080"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oidc-mock:
        condition: service_healthy
      rustfs-bucket-init:
        condition: service_completed_successfully
      elitea-deepwiki:
        condition: service_healthy
      elitea-inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/elitea-main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── The DeepWiki provider, SPI shell over the FIXTURE runner ─────────────
  # The same service the standalone stack runs (see its comment there):
  # the real runner with canned tool results, mTLS from
  # deploy/scripts/gen-deepwiki-certs.sh, invocations in memory.
  elitea-deepwiki:
    # The Go sub-application host (ADR-0023 H1.1) serving DeepWiki's SPI in
    # the Python shell's place: same ELITEA_DEEPWIKI_* settings, same fixture
    # runner, one static binary. ELITEA_SUBAPP names the application.
    image: ghcr.io/eliteaai/elitea-subapp-host:${E2E_IMAGE_TAG:-e2e}
    build:
      context: ..
      dockerfile: services/elitea-subapp-host/Containerfile
    environment:
      ELITEA_SUBAPP: deepwiki
      ELITEA_DEEPWIKI_RUNNER: "fixture"
      ELITEA_DEEPWIKI_FIXTURE_STEP_SECONDS: "1"
      ELITEA_DEEPWIKI_TLS_CERTFILE: /certs/deepwiki-server.crt
      ELITEA_DEEPWIKI_TLS_KEYFILE: /certs/deepwiki-server.key
      ELITEA_DEEPWIKI_TLS_CA_FILE: /certs/ca.crt
      ELITEA_DEEPWIKI_IDENTITY_SECRET: "e2e-deepwiki-identity"
      ELITEA_DEEPWIKI_GIT_ALLOWLIST: "github.com,*.github.com"
      ELITEA_DEEPWIKI_SCRATCH_PATH: /tmp/deepwiki
      ELITEA_DEEPWIKI_SERVICE_LOCATION_URL: "https://elitea-deepwiki:8080"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/elitea-subapp-host", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ── The Inventory provider, the SPI over the GO fixture runner ───────────
  # The same binary as the service above under a different ELITEA_SUBAPP, and
  # ONE container rather than two: RUNNER=fixture is the host's own canned
  # knowledge graph, so this stack needs no engine image at all. That is what
  # this arm buys over the standalone stack's host-plus-sidecar pair — a
  # browser journey reaches a deterministic Inventory result with nothing
  # Python in the picture.
  #
  # The two fixture runners (this one, and the Python one the standalone
  # stack's sidecar serves) are kept in step BY HAND.
  elitea-inventory:
    image: ghcr.io/eliteaai/elitea-subapp-host:${E2E_IMAGE_TAG:-e2e}
    build:
      context: ..
      dockerfile: services/elitea-subapp-host/Containerfile
    environment:
      ELITEA_SUBAPP: inventory
      ELITEA_INVENTORY_RUNNER: "fixture"
      ELITEA_INVENTORY_FIXTURE_STEP_SECONDS: "1"
      ELITEA_INVENTORY_TLS_CERTFILE: /certs/inventory-server.crt
      ELITEA_INVENTORY_TLS_KEYFILE: /certs/inventory-server.key
      ELITEA_INVENTORY_TLS_CA_FILE: /certs/ca.crt
      ELITEA_INVENTORY_IDENTITY_SECRET: "e2e-inventory-identity"
      ELITEA_INVENTORY_SCRATCH_PATH: /tmp/inventory
      ELITEA_INVENTORY_SERVICE_LOCATION_URL: "https://elitea-inventory:8080"
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/elitea-subapp-host", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  elitea-web:
    image: ghcr.io/eliteaai/elitea-web:${E2E_IMAGE_TAG:-e2e}
    # See the elitea-main `build:` comment above (issue #154).
    build:
      context: ..
      dockerfile: apps/elitea-web/Containerfile
    environment:
      VITE_SERVER_URL: "/api/v2"
      VITE_BASE_URI: "/app/"
      VITE_SOCKET_SERVER: ""
      VITE_SOCKET_PATH: "/socket.io"
      # NOT "1". The seeded working project is id 1 (scripts/e2e-stack.sh), and
      # `isPublicAgentsProject` compares the selected project against this value
      # — so setting both to 1 made every agents/pipelines/skills page render the
      # PUBLIC view (Latest/MyLiked/Trending, backed by
      # /elitea_core/public_applications) and made the private list
      # unreachable. J14 created an agent successfully and then could not find
      # it, because the tab it looked at can only ever show public rows.
      # 99 is an id no fixture creates, so project 1 behaves as an ordinary
      # private project and the public surface stays addressable for a journey
      # that wants to test it.
      VITE_PUBLIC_PROJECT_ID: "99"
    depends_on:
      elitea-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/app/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Traefik: routes /app → elitea-web, /api → elitea-main ──────────────────
  traefik:
    image: traefik:v3.4
    ports:
      - "${E2E_PORT:-8082}:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.e2e.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      elitea-main:
        condition: service_healthy
      elitea-web:
        condition: service_healthy
