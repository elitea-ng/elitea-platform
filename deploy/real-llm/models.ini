; base-image: ghcr.io/elitea-ng/elitea-e2e-llm:v0.1.0@sha256:1b11aa30481ffee8c8e823aeae712b7926a3422f689e1c49f45f5c208329b843
; (scripts/ci/check-real-llm-preset.mjs fails when the compose file pins another
; image: re-take the preset from the new one, re-apply the override, update this line.)
;
; OVERRIDE of the image's own /models/models.ini (mounted over it by the
; `llm-real` service in docker-compose.standalone-full.yml). Everything is the
; image's preset (elitea-e2e-llm v0.1.0) except the chat model's context:
;
;   c = 4096, np = 2  ->  2048 tokens per slot (image)
;   c = 32768, np = 2 -> 16384 tokens per slot (here)
;
; Why: an agent with every internal tool on binds 26 tools, which the model
; sees as ~10.9k prompt tokens (llama.cpp: "request (10902 tokens) exceeds the
; available context size (2048 tokens)", HTTP 400, every night since the
; tool-schema normaliser fixed the earlier grammar failure, #2155). A 2048-token
; slot cannot hold the platform's own tool surface, so the
; chat.agent-tools journey measured the image's sizing, not the product.
; KV cache at 32768 positions is ~3.7 GB for this model (28 layers x 8 KV
; heads x 128 dims, f16); the runner has 16 GB.
;
; llama-server router presets. Section names are the model ids on the wire
; (`"model": "qwen3-0.6b"` in the request body); keys are llama-server flags
; without the leading dashes. Absolute paths on purpose.
version = 1

[*]
; Sized for a 4 vCPU / 16 GB GitHub-hosted runner shared with the rest of the
; stack. Threads are left on auto (-1) so a bigger box is used when present.
load-on-startup = true
jinja = true

[qwen3-0.6b]
model = /models/qwen3-0.6b-q8_0.gguf
c = 32768
np = 2
; No thinking. `reasoning = off` is the template-level switch at this
; llama.cpp revision (the older enable_thinking kwarg is deprecated and, at
; b10752, still let an empty <think></think> block through into content —
; the smoke test's "<think>" assertion caught that). reasoning-format is left
; on its default (auto) so any stray thought tags land in reasoning_content,
; never in content. A 0.6B model spending tokens on reasoning is what makes
; CI turns slow.
reasoning = off
reasoning-budget = 0
; Qwen's documented non-thinking defaults. Do not set temperature 0: the model
; card warns greedy decoding produces endless repetitions, and a spec must not
; rely on exact text anyway.
temp = 0.7
top-p = 0.8
top-k = 20
; Bound every turn. The platform can lower this per model row; it cannot raise
; it above what the slot context allows.
n-predict = 256

[nomic-embed-text-v1.5]
model = /models/nomic-embed-text-v1.5-q8_0.gguf
embedding = true
pooling = mean
; Non-causal embedding models need the batch to cover the whole input.
c = 2048
b = 2048
ub = 2048
