# Apply this overlay to run the Rust agent runtime, with indexing on the Rust
# path (ADR-0030 I1): index.ingest.v1 is dispatched on the AGENT stream the one
# native worker consumes, elitea-main keeps index metadata in its registry
# (ELITEA_INDEXING_RUNTIME=rust) and vectors go to Qdrant through elitea-vector.
#
# docker compose \
#   -f deploy/docker-compose.standalone-full.yml \
#   -f deploy/docker-compose.standalone-rust-agent.yml config
services:
  llm-mock:
    environment:
      MOCK_LLM_TOOL_BASE_URL: "https://llm-mock:8090/tool"

  elitea-main:
    environment:
      # Index runs ride the agent stream, as the base stack does (one worker,
      # one durable); the native worker serves them from this change on.
      ELITEA_RUNTIME_INDEX_INGEST_DISPATCH_ENABLED: "true"
      ELITEA_RUNTIME_INDEX_INGEST_COMMAND_STREAM: "ELITEA_RT_V1_AGENT"
      # The registry, not the per-project pgvector index_meta rows, holds
      # index metadata (ADR-0031 V1); nothing is migrated, indexes created
      # under the Python path are not visible here, and new projects get no
      # project_pgvector database.
      ELITEA_INDEXING_RUNTIME: "rust"
      # This overlay is what selects the native worker, so it is also what tells
      # elitea-main which toolkit types the running worker can build. The native
      # worker materializes 22 families and SKIPS anything else with a warning,
      # so without this the create page would offer tiles that attach to an
      # agent and then quietly do nothing.
      ELITEA_WORKER_IMPLEMENTATION: "rust"

  elitea-worker:
    image: ghcr.io/elitea-ng/elitea-worker-rust:standalone
    build:
      context: ..
      dockerfile: services/elitea-worker-rust/Containerfile
    command:
      - serve
      - --config
      - /run/elitea/runtime.json
      - --toolkit-security-config
      - /run/elitea/toolkit-security.json
    environment:
      ELITEA_DISABLE_SYSTEM_CA: !reset null
      REQUESTS_CA_BUNDLE: !reset null
      ELITEA_SENSITIVE_TOOLS: !reset null

      # TLS trust for the REMOTE MCP client, and for nothing else.
      #
      # The Python worker points this at the runtime CA alone. The Rust worker
      # cannot: every internal destination it dials — control, output, content,
      # the model gateway — is handed the runtime CA EXPLICITLY in code
      # (src/security.rs:136 `private_ca()`, fanned out at src/bootstrap.rs:122-142),
      # so the process-wide trust store governs exactly one client, the MCP one.
      # That client is `reqwest-mcp` (reqwest 0.13 with the `rustls` feature),
      # which resolves to `rustls-platform-verifier` → `rustls-native-certs`
      # → `SSL_CERT_FILE` on Linux.
      #
      # It must be the BUNDLE, not mcp-mock's certificate alone: this variable
      # REPLACES the platform trust store rather than adding to it
      # (rustls-native-certs-0.8.4/src/lib.rs:50-57), and pointing it at a
      # single self-signed certificate would strip the public roots that the
      # reqwest-0.12 toolkit families (github, slack, …) verify against.
      #
      # Left unset — as it was before the MCP journey — the worker falls back
      # to the distroless image's own `SSL_CERT_FILE`, mcp-mock's certificate
      # is untrusted, and the MCP leg fails as `native_agent.dependency_unavailable`:
      # a connection error indistinguishable from the server being down.
      SSL_CERT_FILE: /run/elitea-mcp-trust/mcp-mock-ca-bundle.pem

      ELITEA_RUST_LOG: "info"
      ELITEA_RUST_TRACE: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    volumes:
      # Same deployment as ./runtime/worker-runtime.json plus the Rust-only
      # `agent_node_recovery` journal, which effectful pipeline direct tool nodes
      # require. The Python worker forbids unknown keys, so the shared file stays
      # without it. Keep the two files identical apart from that key.
      - ./runtime/worker-runtime.rust.json:/run/elitea/runtime.json:ro
      - ./runtime/worker-toolkit-security.json:/run/elitea/toolkit-security.json:ro
      - standalone_mcp_mock_trust:/run/elitea-mcp-trust:ro
    depends_on:
      elitea-agentstate-migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      # The index runs' vector store (worker-runtime.rust.json `vector_target`).
      elitea-vector:
        condition: service_healthy
      # The bundle SSL_CERT_FILE names must exist before the worker's first MCP
      # connection. `rustls-native-certs` reads it lazily, per client build, so
      # a late file would only break the runs that raced it — the worst kind of
      # flake. Waiting on the one-shot removes the race outright.
      mcp-mock-trust:
        condition: service_completed_successfully
      mcp-mock:
        condition: service_healthy
