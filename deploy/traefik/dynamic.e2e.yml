# E2E-only traefik dynamic config (issue #60).
# Replaces deploy/traefik/dynamic.yml at runtime — mounted by docker-compose.e2e.yml.
# Only change from the original: the `app` router service → elitea-web (not elitea-ui),
# and the `root-redirect` router service → elitea-web.
http:
  routers:
    # `/icons/` and `/avatars/` are root-mounted in the Go router
    # (internal/api/router.go: DownloadIcon and DownloadAvatar) and must stay on
    # this list. An uploaded project icon is stored and returned as
    # `/icons/<projectID>/<file>`. A browser <img src="..."> sends no
    # Authorization header, so both reads are public by design. Without the two
    # prefixes below no router matches them, and traefik answers its own 404.
    # Every uploaded icon and avatar then renders as a broken image. They keep
    # the strip-client-identity middleware of this router.
    #
    # /healthz IS here, and it is PUBLIC on both layers (#569): this rule
    # forwards it, and internal/api/main_public_rules.go admits it without a
    # session (go.health.healthz). The cluster edge consults that policy
    # before it forwards, and a liveness path that is routed but not public
    # answers a probe with a 302 to the login form. The body is the minimal
    # {"status":"ok"}. tests/deployedge/edge_public_policy_test.go holds the
    # two layers together.
    #
    # /readyz and /startupz are deliberately NOT here. Nothing probes them
    # through an edge. The Helm probes hit the pod, and the compose healthcheck
    # curls 127.0.0.1 in the container. The readiness body names each
    # dependency's state, which is not for a public browser entrypoint.
    #
    # The two /app static prefixes are Go file servers, not SPA paths
    # (internal/api/router.go: application_icon and application_tool_icon).
    # apps/elitea-web builds those URLs in entities/toolkit/model/toolForm.ts,
    # so the `app` router below sent every tool icon to the SPA container.
    #
    # /llm is the OpenAI-compatible surface. The settings page shows
    # `<origin>/llm/v1` for the user to copy, so the edge must forward it.
    #
    # services/elitea-main/tests/deployedge/edge_root_routes_test.go walks the
    # real Go router. It fails if a route the router serves matches no rule
    # here and no entry in its `notAtTheBrowserEdge` list.
    #
    # THIS RULE HAS A SIBLING. The cluster runs a Gateway API edge, not
    # traefik, and it carries the same list of paths in a different language:
    # deploy/gateway-api/httproute.yaml. Widen this rule alone and the cluster
    # stays a release behind, which is exactly what #568 measured — icons and
    # avatars broken there while every compose test stayed green. Change both
    # files. edge_gateway_api_test.go walks the same router against that file.
    api:
      rule: "PathPrefix(`/api/`) || PathPrefix(`/forward-auth/`) || Path(`/auth`) || Path(`/healthz`) || PathPrefix(`/icons/`) || PathPrefix(`/avatars/`) || PathPrefix(`/artifacts/`) || PathPrefix(`/admin/app`) || PathPrefix(`/app/application_icon/`) || PathPrefix(`/app/application_tool_icon/`) || PathPrefix(`/llm/`)"
      service: elitea-main
      entryPoints:
        - web
      middlewares:
        - strip-client-identity
    # The MCP SERVER (issue 252) shares the /app prefix with the SPA but is
    # served by elitea-main: pylon serves it from the app blueprint, and the
    # internal-toolkit URLs already written into projects hardcode
    # `.../app/{project_id}/mcp/...`, so the path is not ours to move. Without
    # this router the `app` rule below swallows it and an MCP client gets the
    # SPA's nginx 405.
    #
    # Explicit priority because traefik ranks by rule length and PathPrefix(`/app`)
    # would otherwise be able to win.
    #
    # This CARVES A HOLE in the SPA's own namespace: `/app/<numeric>/<rest>` is
    # its project-switch deep link (apps/elitea-web/src/routes/$projectId.$.tsx),
    # so a first segment of exactly `mcp` no longer reaches the app. Nothing
    # collides today (`mcps`, `mcp-auth-callback`), and
    # apps/elitea-web/src/routes/__tests__/mcpPathReservation.test.ts fails if a
    # route ever claims it — narrow this rule before deleting that test.
    mcp:
      rule: "PathRegexp(`^/app/[0-9]+/mcp(/.*)?$`)"
      priority: 100
      service: elitea-main
      entryPoints:
        - web
      middlewares:
        - strip-client-identity
    app:
      rule: "PathPrefix(`/app`)"
      service: elitea-web
      entryPoints:
        - web
    # Embedded docs SPA (embedded-docs programme decision 5) — mirrors
    # dynamic.yml's `docs` router, service swapped to `elitea-web` for the
    # same reason the `app` router above is (this file replaces dynamic.yml
    # at runtime in the e2e and standalone-full stacks; see the file header).
    docs:
      rule: "PathPrefix(`/docs`)"
      service: elitea-web
      entryPoints:
        - web
    root-redirect:
      rule: "Path(`/`)"
      service: elitea-web
      entryPoints:
        - web
      middlewares:
        - redirect-to-app
      priority: 1

  middlewares:
    # Identical to deploy/traefik/dynamic.yml's copy — see the reasoning there.
    # This file REPLACES that one at runtime in the e2e and standalone-full
    # stacks, so the strip has to be duplicated here; a fix in only one of the
    # two leaves whichever stack mounts the other wide open (#326).
    #
    # INGRESS-only: `customRequestHeaders` with an empty value deletes what the
    # CLIENT sent. This edge runs no forwardAuth, so no identity header here is
    # ever legitimate input.
    strip-client-identity:
      headers:
        customRequestHeaders:
          X-Auth-Type: ""
          X-Auth-ID: ""
          X-Auth-User-ID: ""
          X-Auth-Reference: ""
          X-Auth-Avatar: ""
          X-Auth-Avatar-State: ""
          X-Auth-Session-Id: ""
          X-Auth-Session-Name: ""
          X-Auth-Session-Endpoint: ""
          X-Elitea-Identity-Signature: ""
          X-Elitea-Project-Id: ""
          X-Elitea-User-Id: ""
          X-Elitea-Tenant-Id: ""
          # The runtime execution a /llm call was made from. It is a legitimate
          # header from the RUNTIME WORKER, which does not pass this edge, and
          # never from a browser: this edge runs no forwardAuth, so nothing
          # arriving here has been authenticated when the strip happens.
          #
          # elitea-main re-signs whatever survives into the v2 identity tuple,
          # so a value left in place here would be attributed to an agent the
          # caller chose. Stripping it is what keeps the id a fact the platform
          # asserts rather than one a caller claims.
          X-Elitea-Execution-Id: ""

    redirect-to-app:
      redirectRegex:
        # The `(\\?.*)?` group is load-bearing. `redirectRegex` matches the whole
        # request URI, query string included, and traefik passes a request that
        # does not match straight to the next handler. With the regex anchored
        # at `/$`, a link of the form `https://<host>/?utm_source=x` therefore
        # skipped the redirect. The request reached the SPA container at path
        # `/`. Its nginx does not serve that path.
        regex: "^(https?://[^/]*)/(\\?.*)?$"
        replacement: "${1}/app/${2}"
        permanent: false

  services:
    elitea-main:
      loadBalancer:
        servers:
          - url: "http://elitea-main:8080"
    elitea-web:
      loadBalancer:
        servers:
          - url: "http://elitea-web:80"
    elitea-ui:
      loadBalancer:
        servers:
          - url: "http://elitea-ui:80"
