# Compose override for validating against a staging DB dump.
# Usage:
#   1. Set the vault key: export SECRETS_MASTER_KEY=<your staging Fernet key>
#      (issue #280 — a real-shaped key used to live in this file. Do not
#      reuse the old exposed value; get the current key from wherever the
#      team stores staging secrets.)
#   2. Load dump: bash deploy/scripts/load-staging-dump.sh ~/tmp/stagin-dump/saas-stage2_*.sql.gz
#   3. Start:     podman compose -f deploy/docker-compose.yml -f deploy/docker-compose.staging.yml up --build
#   4. Provision a login for one of the dumped users against the local mock
#      (issue #245 — this stack no longer talks to a remote OIDC provider,
#      see the elitea-main OIDC_CLIENT_ID note below) — pick an email that
#      exists in the loaded eliteadmstage2 dump:
#        curl -X PUT http://localhost:9400/users/<staging-user-email> \
#          -H 'Content-Type: application/json' -d '{"sub": "<staging-user-email>"}'
#      Then log in and enter that same email in the mock's "Subject" field.
services:
  elitea-main:
    environment:
      DATABASE_URL: "postgres://eliteausr:elitea@postgres:5432/eliteadmstage2?sslmode=disable"
      SKIP_MIGRATIONS: "true"
      APPLICATION_SECRET_KEY: "staging-secret-for-local-dev"
      # issue #280: this field held a committed, real-shaped Fernet key. The
      # field now requires the value from your shell environment. It decrypts
      # vault data from the loaded staging dump, so a placeholder cannot
      # replace it. Set SECRETS_MASTER_KEY before you start this stack.
      #
      # The line stays here because this file also runs against a DIFFERENT
      # database (the staging dump), and a reader needs to see which key opens
      # it. pylon-indexer used to read the same rows from the base compose
      # file's value; #339 deleted that service.
      SECRETS_MASTER_KEY: "${SECRETS_MASTER_KEY:?set in your environment}"
      # Inherits the local oidc-mock service from docker-compose.yml (issue
      # #245) — the remote oidc-mock.technicaldomain.xyz host with a
      # committed secret has been removed. The local mock starts with no
      # users provisioned; see the usage note above before logging in.
      OIDC_CLIENT_ID: "elitea-local"
      OIDC_CLIENT_SECRET: "elitea-local-secret"
      OIDC_REDIRECT_URI: "http://localhost/forward-auth/auth_oidc/callback"
      PUBLIC_PROJECT_ID: "1"

