# golangci-lint configuration for the elitea-platform Go workspace.
#
# Applied to every module go.work names — `scripts/go/workspace-run.sh lint`
# reads that list and passes this file by path, so the sentence above is a
# fact. Until #427 it was not: the ci-go.yml Lint job named two modules of
# nine, and `task lint` ran in one.
#
# services/elitea-llm-gateway is outside go.work on purpose (Go 1.27 series,
# GOWORK=off) and ci-gateway.yml lints it on its own, with a golangci-lint
# built with Go 1.27. workspace-run.sh names
# that module in every summary, so its absence here stays visible.
#
# All findings from these linters are fixed in-tree rather than excluded, so the
# error paths (DB Scan/Exec, json.Unmarshal, response writes) are handled
# explicitly per the AGENTS.md "typed, safe errors" guardrail.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  # govet is the workspace's only `go vet`: ci-go.yml has no standalone vet
  # step. With no settings it runs golangci-lint's default analyzer set, which
  # in v2.9.0 is `go tool vet help`'s Go 1.26 list (35 analyzers) minus
  # loopclosure, which golangci-lint drops because it reports nothing for a
  # file at go1.22 or later (every go.work module is at 1.26 and no file
  # lowers its version with a //go:build go1.N line). Do not narrow this set:
  # it is what keeps the coverage equal to `go vet ./...`.
  #
  # `go vet` also checks generated code, so govet has to see it too. That is
  # why `generated` is `disable` (it used to be `lax`, which hid every linter,
  # govet included, from these files) and the other linters skip them by
  # path instead. The paths match exactly the 92 files that carry the
  # `// Code generated ... DO NOT EDIT.` header today; the hand-written tests
  # in sqlcgen/ are linted in full. A new generator outside these paths fails
  # the lint loudly rather than hiding anything, so add its output here.
  exclusions:
    generated: disable
    rules:
      - path: '^libs/proto/gen/go/.*\.pb\.go$'
        linters: [errcheck, ineffassign, staticcheck, unused]
      - path: '^services/elitea-main/internal/db/sqlcgen/([^/]+\.sql|db|models|querier)\.go$'
        linters: [errcheck, ineffassign, staticcheck, unused]
      - path: '^services/elitea-main/internal/api/generated/api\.gen\.go$'
        linters: [errcheck, ineffassign, staticcheck, unused]
      - path: '^libs/go/faults/codes_gen\.go$'
        linters: [errcheck, ineffassign, staticcheck, unused]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
