# golangci-lint configuration for the elitea-platform Go workspace.
#
# Applied to every module go.work names — `scripts/go/workspace-run.sh lint`
# reads that list and passes this file by path, so the sentence above is a
# fact. Until #427 it was not: the ci-go.yml Lint job named two modules of
# nine, and `task lint` ran in one.
#
# services/elitea-llm-gateway is outside go.work on purpose (Go 1.27 series,
# GOWORK=off) and ci-gateway.yml lints it on its own, with a golangci-lint
# built with Go 1.27. workspace-run.sh names
# that module in every summary, so its absence here stays visible.
#
# All findings from these linters are fixed in-tree rather than excluded, so the
# error paths (DB Scan/Exec, json.Unmarshal, response writes) are handled
# explicitly per the AGENTS.md "typed, safe errors" guardrail.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
