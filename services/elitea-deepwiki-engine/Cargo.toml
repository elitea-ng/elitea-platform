[package]
name = "elitea-deepwiki-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "The Rust-native DeepWiki engine behind the sub-application host's engine sidecar socket (ADR-0026)."

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# The Authorization header value. Already in the tree (gix-transport,
# reqwest use the same version); a direct pin so the header is built here.
base64 = "=0.22.1"
# Repository ingest (ADR-0026 decision 7): HTTPS shallow clone in process,
# no git binary. The minimal feature set: the blocking reqwest transport
# with rustls (pulls reqwest 0.13 + rustls/aws-lc-rs, whose roots come
# from the platform store), checkout, SHA-1, and the parallel pack
# resolution. No default features (no status, blame, dirwalk, revparse,
# mailmap, archive). The ssh and file transports compile in with the
# blocking client but are unreachable: a CloneTarget holds only http(s).
gix = { version = "=0.88.0", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "worktree-mutation", "sha1", "max-performance-safe"] }
globset = "=0.4.20"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
indexmap = "=2.14.2"
rayon = "=1.12.0"
regex = "=1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
tree-sitter = "=0.27.0"
# The C# grammar `tree_sitter_language_pack` 1.16.1 builds (its
# language_definitions.json: master at this rev, 4 commits after v0.23.5 with
# C# 14 support; ABI 15, 8495 parse states, 26 fields, 545 node kinds). The
# 0.23.5 crate has 8053 states and 533 kinds, and no later crate exists.
tree-sitter-c-sharp = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp", rev = "9150f7d56bb47f1a809fa23623f1ba1413e93fa9" }
# The C++ grammar `tree_sitter_language_pack` 1.16.1 builds (its
# language_definitions.json: master at this rev, 40 commits after v0.23.4;
# ABI 15, 11734 parse states, 53 fields, 575 node kinds). The 0.23.4 crate
# has ABI 14, 8637 states, 50 fields and 543 kinds, and no later crate exists.
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "8b5b49eb196bec7040441bee33b2c9a4838d6967" }
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
# Credentials are zeroed on drop (ingest::secret). Already in the tree
# through rustls.
zeroize = "=1.9.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
