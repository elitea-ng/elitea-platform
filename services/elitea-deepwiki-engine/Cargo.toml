[package]
name = "elitea-deepwiki-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "The Rust-native DeepWiki engine behind the sub-application host's engine sidecar socket (ADR-0026)."

[dependencies]
# The engine sidecars' shared foundation (ADR-0027): errors, the NDJSON
# stream and stop flag, secrets, Python-compatible text.
elitea-engine-core = { path = "../../libs/rust/engine-core" }
elitea-code-parsers = { path = "../../libs/rust/code-parsers" }
elitea-model-client = { path = "../../libs/rust/model-client" }
# `testing::with_model_service`: the page gate's `StubModel`
# (`wiki::parity`, the `deepwiki-parity` tool and the golden tests) answers
# the model client over elitea.llm.v1.ModelService, as elitea-main does. The
# engine binary never calls it, so the bridge is dead code there.
elitea-model-rpc = { path = "../../libs/rust/model-rpc", features = ["testing"] }
# The agents' conversation and its summarisation (shared with Inventory).
elitea-conversation = { path = "../../libs/rust/conversation" }
elitea-repo-ingest = { path = "../../libs/rust/repo-ingest" }
# An artifact-folder source reads elitea.runtime.v1.ArtifactObjectService on
# the platform listener (#1359 U5), over the model calls' channel.
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc" }
elitea-engine-sidecar = { path = "../../libs/rust/engine-sidecar" }
elitea-graph-algos = { path = "../../libs/rust/graph-algos" }
elitea-pg-migrate = { path = "../../libs/rust/pg-migrate" }
# Dense vectors live in Qdrant behind elitea-vector (ADR-0031 D1-D3,
# #1359): the typed elitea.vector.v1 client, over mTLS with the callback
# identity and the invocation's callback bearer (`storage::dense`). TLS
# with aws-lc, the provider sqlx and reqwest already link here.
elitea-vector-index = { path = "../../libs/rust/vector-index", default-features = false, features = ["tls-aws-lc"] }
# elitea-vector's status codes (`storage::dense`); the sidecar tests read
# the refusals' codes too. Already in the tree through the gRPC clients.
tonic = { version = "=0.14.7", default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# The Mermaid sanitizer is ~150 transcribed Python regular expressions,
# several with look-around, which `regex` lacks. A backtracking engine
# with `sre`'s match preference. Already in the tree (tiktoken-rs uses it);
# this pins the same version as a direct dependency.
fancy-regex = "=0.20.0"
globset = "=0.4.20"
indexmap = "=2.14.2"
rayon = "=1.12.0"
regex = "=1.13.1"
# Substring search over the page index (`wiki::search`). Already in the
# tree (regex, gix, …); pinned to the locked version.
memchr = "=2.8.3"
# The model client (ADR-0026 decision 8): one small OpenAI-compatible client
# for embeddings and chat completions. reqwest 0.13.5 is the copy gix already
# pulls (with rustls/aws-lc-rs and the platform verifier), so the async
# client adds no TLS stack. No default features: no native-tls, no cookies,
# no decompression; `stream` is not needed (`Response::chunk` reads SSE).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
# The generation worker child (ADR-0026 decision 10): its own `RLIMIT_AS` /
# `RLIMIT_CPU`, the parent's SIGTERM-then-SIGKILL stop, and (Linux) a death
# signal when the parent goes away. Safe wrappers, so the crate keeps
# `unsafe_code = "forbid"`. Already in the tree (gix, tempfile); the exact
# pin the worker crate uses.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }
# The migration ledger checksum (`migrate.py`: SHA-256 hex). Already in
# the tree through sqlx-postgres.
sha2 = "=0.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
# The index storage (ADR-0026 decision 5): PostgreSQL only, no macros (no
# compile-time database), no migrate feature (the ledger is `migrate.py`'s,
# ported in `storage::migrate`). TLS through rustls with aws-lc-rs, the
# provider the tree already carries for gix/reqwest.
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
tracing = "=0.1.44"
# The DeepWiki namespace id: UUIDv5 of (project, wiki id)
# (`storage::dense::namespace_id`). elitea-vector-index already links uuid.
uuid = { version = "1", default-features = false, features = ["v5"] }
# NFKD for the sanitizer's node-id slug (`unicodedata.normalize`). Already
# in the tree through sqlx; pinned to the locked version.
unicode-normalization = "=0.1.26"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
# The model fakes served as elitea.llm.v1.ModelService over real gRPC
# (`testing::with_model_service`): the engine's model calls are gRPC.
elitea-model-rpc = { path = "../../libs/rust/model-rpc", features = ["testing"] }
# The artifact store served beside it (tests/native_generate.rs).
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc", features = ["testing"] }
# elitea-vector's in-process fake (`testing::FakeVector`): the remote dense
# backend is exercised over real gRPC without Qdrant.
elitea-vector-index = { path = "../../libs/rust/vector-index", default-features = false, features = ["tls-aws-lc", "test-server"] }

[features]
# TEST ONLY. In a debug build, a `repo_config` base URL of
# `http://127.0.0.1:<port>` or `http://localhost:<port>` clones over plain
# http, so the end-to-end tests can serve a repository with
# `git http-backend` to the worker CHILD process (which cannot be handed a
# pre-admitted target). A release build ignores the feature: the clone URL
# is always `https://` there. CI enables it through `--all-features`.
loopback-git-http = ["elitea-repo-ingest/loopback-git-http"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
