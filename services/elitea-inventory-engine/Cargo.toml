[package]
name = "elitea-inventory-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "The Rust-native Inventory engine behind the sub-application host's engine sidecar socket (ADR-0027)."

[dependencies]
# investigate's agent loop (adk-rust; the worker's version, without its
# patches, which only its durable history needs). No default features:
# no skills, artifacts or plugins.
adk-agent = { version = "=2.3.0", default-features = false }
adk-core = { version = "=2.3.0", default-features = false }
adk-runner = { version = "=2.3.0", default-features = false }
adk-session = { version = "=2.3.0", default-features = false }
# The engine sidecars' shared crates (ADR-0027): the error contract, the
# NDJSON stream and stop flag, Python-compatible text; the socket's gRPC
# server, the container probe and process tracing.
elitea-engine-core = { path = "../../libs/rust/engine-core" }
elitea-engine-sidecar = { path = "../../libs/rust/engine-sidecar" }
# Leiden for the communities stage.
elitea-graph-algos = { path = "../../libs/rust/graph-algos" }
# The content layer and document extraction (ADR-0028).
elitea-content-source = { path = "../../libs/rust/content-source" }
elitea-doc-extract = { path = "../../libs/rust/doc-extract" }
# The tree-sitter parsers of the parser stage.
elitea-code-parsers = { path = "../../libs/rust/code-parsers" }
# The graph, the store-free ingestion steps and the retrieval tools, shared
# with the desktop's local workspace index (ADR-0029 decision 7).
elitea-inventory-core = { path = "../../libs/rust/inventory-core" }
# adk's model over the gateway client.
elitea-adk-gateway = { path = "../../libs/rust/adk-gateway" }
# investigate's conversation and its summarisation (shared with DeepWiki).
elitea-conversation = { path = "../../libs/rust/conversation" }
elitea-model-client = { path = "../../libs/rust/model-client" }
elitea-pg-migrate = { path = "../../libs/rust/pg-migrate" }
elitea-repo-ingest = { path = "../../libs/rust/repo-ingest" }
# The graph's node and edge order is insertion order (graph.json, search ties).
# join_all for the per-file model calls.
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
# The wall-clock stamps graph metadata carries (embeddings_generated_at).
jiff = "=0.2.38"
# Repairing a model's malformed JSON answer.
jsonrepair = { version = "=0.1.0", default-features = false, features = ["serde"] }
# Entity ids are Python's md5 prefix; file hashes its sha256.
md-5 = "=0.11.0"
sha2 = "=0.11.1"
# investigate's source-tool calls: elitea.runtime.v1.InternalToolService's
# InvokeToolkit on the platform listener (#1359 U5), over the model calls'
# channel.
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc" }
# Entity vectors live in Qdrant behind elitea-vector (source inventory, the
# float32 exact family): the typed elitea.vector.v1 client, on aws-lc like
# every other TLS hop of this engine.
elitea-vector-index = { path = "../../libs/rust/vector-index", default-features = false, features = ["tls-aws-lc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
# The graph store (src/store.rs); the same stack the DeepWiki engine uses.
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
# Chunking a file for the model (by syntax where a grammar exists).
text-splitter = { version = "=0.33.1", features = ["code"] }
thiserror = "=2.0.21"
# The investigation's cancellation token (adk's runner takes one).
tokio-util = { version = "=0.7.20", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"

[features]
# PDF, Office, e-mail and e-book documents in a source (ADR-0028 D4; xberg,
# about +29 MB of binary). On by default: the engines ingest enterprise
# content, not only code.
default = ["documents"]
documents = ["elitea-doc-extract/documents"]
# TEST ONLY (debug builds): clone from an `http://` loopback server, for the
# ingestion tests' local git server. A release build ignores it.
loopback-git-http = ["elitea-repo-ingest/loopback-git-http"]

[dev-dependencies]
# The shared GraphStore conformance suite, run against the PostgreSQL store
# (tests/graph_store.rs).
elitea-inventory-core = { path = "../../libs/rust/inventory-core", features = ["test-support"] }
# The ingestion tests' local smart-HTTP git server (`git http-backend`).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
# The sidecar's refusals (tests/sidecar.rs): a status code and message.
tonic = { version = "=0.14.7", default-features = false }
# The model fakes served as elitea.llm.v1.ModelService over real gRPC
# (`testing::with_model_service`): the engine's model calls are gRPC.
elitea-model-rpc = { path = "../../libs/rust/model-rpc", features = ["testing"] }
# The platform's toolkit invocations, faked (tests/investigate.rs, native).
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc", features = ["testing"] }
# elitea-vector faked in process (`testing::FakeVector`): the entity vectors'
# upserts, searches and deletes over real gRPC.
elitea-vector-index = { path = "../../libs/rust/vector-index", default-features = false, features = ["tls-aws-lc", "test-server"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
