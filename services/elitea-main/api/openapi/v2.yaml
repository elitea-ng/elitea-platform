  # AI DRAFTS (#254 P1) — turn a plain-text description into a draft the
  # review form edits and submits.
  # ==========================================================================
  /elitea_core/generate_skill_draft/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: generateSkillDraft
      summary: Draft a skill from a plain-text description
      description: |
        These three draft routes stood in router.go's NOTE(#126) tombstone —
        registered behind a `RouterConfig.Predictor` nothing ever assigned, so
        they answered 404 in every deployment. They are pure LLM plays: one
        blocking turn through the same gateway hop `predict_llm` uses, no
        runtime and no task. The system prompt is in the Go source rather than
        in the service-prompt configuration store legacy read it from, so a
        deployment that has never seeded a service prompt still generates
        drafts.

        NOTE(#254): internal/api/v2/drafts/drafts.go GenerateSkillDraft.
        Gated on `models.applications.skills.create`, the permission legacy's
        own generate_skill_draft.py declares.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSkillDraftRequest'
      responses:
        '200':
          description: The generated skill draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDraft'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '413':
          description: The request body is above the 1 MiB bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The gateway hop worked and the generation is unusable — the model
            did not answer with JSON, was cut off mid-answer, or returned a
            draft that cannot be saved. Distinct from 502, which means the hop
            itself failed, and from 500, which would say this service is broken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >
            The LLM gateway is configured and did not complete the request.
            Distinct from 503, which means no gateway is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            No completion backend is composed because LLM_GATEWAY_URL is empty.
            The route is still registered on purpose, so an unconfigured
            deployment is distinguishable from a missing route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictLLMUnavailableResponse'

