openapi: "3.0.3"
info:
  title: Elitea Platform API
  version: "2.0.0"
  description: |
    External REST API for the Elitea Platform (elitea-main Go service).
    Wire-compatible drop-in replacement for pylon_main (Python/Flask).

    ## Response shape conventions
    - **Single resource**: returned directly at top level — `{"id": 42, "name": "..."}`
    - **General errors (4xx/5xx)**: `{"error": "message"}` (pkg/apierr/apierr.go:47-59
      and the handlers' inline `map[string]any{"error": ...}` writes). One
      documented shape deviates: the five social/handler.go 500 sites (Like
      :268, Unlike :301, Pin :321, Unpin :341, CreateFeedback :419) emit the
      pylon-era `{"ok": false, "error": ...}` envelope instead, modeled as
      the named `SocialActionErrorResponse` schema and referenced only on
      those specific operations. Five more UNDOCUMENTED sites of the same
      envelope remain on toolkits/handler.go (:286, 312, 324, 350, 362) —
      scope that shape there when those domains are spec'd.
    - **Rate limit (429)**: intentionally NOT documented. The Go RateLimit
      middleware is a pass-through stub (internal/api/middleware/ratelimit.go:9-14)
      and no elitea-main code emits a 429 body — documenting one would be contract
      fiction. Re-add per-operation 429 responses (pylon shape:
      `{"error": {"message", "type": "rate_limit_error", "code":
      "rate_limit_exceeded"}}`) when rate limiting becomes real.
    - Field names are **snake_case** unless the Go handler observably marshals
      otherwise (e.g. `lastModified` in the S3 listing, `DisplayName`/`ID` in the
      S3 owner block).

    ## NOTE(W2) — field-level enrichment conventions
    Every schema below is derived from the Go handler that actually marshals the
    response (UI reimplementation spec §5.1 / §9.3 unit W2). Evidence is recorded
    per schema in `NOTE(W2)` comments/descriptions with file:line references.
    Where a handler genuinely passes through arbitrary JSON (DB `jsonb` columns,
    echoed request bodies), the schema carries an
    `x-elitea-passthrough: "NOTE(W2): ..."` marker justifying the permissive
    `additionalProperties`. A permissive object WITHOUT that marker is a defect —
    `apps/elitea-web/scripts/check-contract-coverage.mjs` fails it, wired as the
    "Contract coverage (§5.1)" step of ci-web.yml's `gates` job.

servers:
  # DEFECT, fixed here: a first server `/api/v2/elitea_core` sat above this
  # one. Every path in this document already carries its own plugin prefix
  # (`/elitea_core/...`, `/admin/...`, `/artifacts/...`). That base joined
  # with any path produced a doubled segment — `/api/v2/elitea_core/
  # elitea_core/applications/prompt_lib/{id}`. The router never registers
  # that segment, and no compatibility shim rewrites it. A generator takes
  # `servers[0]` as its default base, so every operation of a generated
  # client answered 404. The single base below is correct for all of them:
  # the router mounts the whole surface under `/api/v2`
  # (internal/api/router.go).
  - url: /api/v2
    description: Elitea Platform API root (all operations)

security:
  - BearerAuth: []
  - ApiKeyAuth: []
  - SessionCookie: []

tags:
  - name: deepwiki
    description: |
      The DeepWiki provider service facade (ADR-0022). elitea-main is the only
      door: it resolves credentials, signs identity, and proxies to the
      provider over mTLS.
  - name: inventory
    description: |
      The Inventory provider service facade (ADR-0022, ADR-0023 H4c). It is the
      SECOND facade over the same provider SPI, and it mounts the same route
      table (internal/providerhost/routes/routes.go) behind the same mTLS hop
      and the same per-project permission guard.

      Inventory has no REST read surface. Every read is an invocation: the
      caller starts one, polls it, and reads the answer from the terminal poll.
  - name: admin
    description: User, role, and moderation management
  - name: analytics
    description: Usage analytics for prompts, tools, and agents
  - name: applications
    description: Application (agent/pipeline/skill) lifecycle management
  - name: artifacts
    description: Bucket and artifact (file) storage
  - name: auth
    description: Permissions
  - name: budgets
    description: Project and per-member LLM spend limits, and usage reporting
  - name: chat
    description: Conversational / webchat endpoints
  - name: configurations
    description: Runtime configuration management
  - name: notifications
    description: User notifications
  - name: resources
    description: Shared resources
  - name: search
    description: Search and filter options
  - name: secrets
    description: Secret / credential management
  - name: settings
    description: Entity and platform settings
  - name: skills
    description: Skill management
  - name: social
    description: Social features (likes, follows)
  - name: tags
    description: Tag management
  - name: toolkits
    description: Toolkit (integration) management
  - name: tracing
    description: OpenTelemetry trace ingest (collect/otlp proxy) and status

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SessionCookie:
      type: apiKey
      in: cookie
      name: elitea_session

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      description: Project identifier (extracted from URL path)
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 1000
      description: Maximum number of items to return
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip before starting to collect results
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Free-text search filter
    SortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field name to sort results by
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Start of date range (inclusive)
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
      description: End of date range (inclusive)

  schemas:
    DeepWikiSlots:
      type: object
      description: |
        Generation capacity, passed through from the provider verbatim.
        `can_start` and `canStart` are both present: the provider emits both
        and the vendored SPA reads the alias.
      properties:
        available: { type: integer }
        total: { type: integer }
        active: { type: integer }
        can_start: { type: boolean }
        canStart:
          type: boolean
          # The generator derives a Go field name from the JSON key, and
          # `can_start` and `canStart` derive the SAME one. Naming the alias
          # explicitly is what keeps both on the wire; dropping either would
          # change a frozen provider contract to suit a code generator.
          x-go-name: CanStartAlias
        mode:
          type: string
          description: '`subprocess` or `jobs`.'
        note: { type: string }
        namespace: { type: string }
        error:
          type: string
          description: |
            Present when capacity could not be determined. The provider answers
            `can_start: false` in that case rather than reporting per-pod
            numbers, so an outage cannot read as healthy capacity.
      required: [available, total, active, can_start, mode]
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the provider's /slots body is forwarded VERBATIM by
        internal/api/v2/deepwiki/proxy.go:127 — the facade is an mTLS hop and
        rewrites nothing on this route. The properties above are the shape the
        recorded fixture pins
        (conformance/provider/fixtures/deepwiki/spi/slots.get.json), and
        the permissive tail exists because the provider's own
        `_normalize_slots_payload` adds mode-dependent keys (`namespace` in
        jobs mode, `note` in subprocess mode) and may add more without this
        spec changing. Constraining it would make the facade reject a body it
        does not interpret.

    DeepWikiInvokeRequest:
      type: object
      description: |
        The provider's invocation envelope. `configuration.parameters` carries
        the toolkit configuration and `parameters` the tool arguments; a tool
        argument overrides a configuration value only when it is truthy, which
        is the provider's own merge rule.

        Credentials are NOT supplied here. The facade resolves them from the
        project's stored configuration and injects them before proxying.
      properties:
        configuration:
          type: object
          properties:
            parameters:
              type: object
              additionalProperties: true
              x-elitea-passthrough: >-
                NOTE(W2): toolkit-level configuration, whose key set is the
                PROVIDER's descriptor and not this spec's. The facade reads
                exactly four names out of it — code_toolkit, llm_model,
                max_tokens and the repository/branch pair — and re-encodes the
                rest untouched
                (internal/api/v2/deepwiki/invoke.go:118-157). A closed shape
                here would drop a field the provider's own toolkit_config
                declares, which is a payload the caller wrote correctly and
                the facade silently truncated.
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the envelope around `parameters`. The facade replaces
            only that key and re-encodes every sibling verbatim
            (internal/api/v2/deepwiki/invoke.go:159-163), so a sibling the
            provider gains later travels without a change here.
        parameters:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the TOOL's own arguments, whose names come from the
            provider descriptor's args_schema (query, planner_type,
            exclude_tests for generate_wiki) and differ per tool. The facade
            forwards them untouched; only `configuration.parameters` is
            rewritten (internal/api/v2/deepwiki/invoke.go:145-151).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the provider's frozen invocation envelope. Unrecognised
        top-level keys are re-encoded verbatim rather than dropped
        (internal/api/v2/deepwiki/invoke.go:165-169), which is what makes this
        facade a proxy rather than a re-serialiser — the shape is recorded in
        conformance/provider/fixtures/deepwiki/spi/invoke.post.json.

    DeepWikiInvocationAccepted:
      type: object
      description: The invocation id to poll, and the literal status `Started`.
      properties:
        invocation_id: { type: string }
        status:
          type: string
          enum: [Started]
      required: [invocation_id, status]

    DeepWikiInvocationStatus:
      type: object
      description: |
        One of three provider shapes, passed through unchanged: pending
        (`Started`), running (`InProgress`, with any `custom_events` drained by
        this read), or terminal. A failed TOOL is HTTP 200 with
        `status: "Error"` plus `error_category` and `error_type`; only
        transport failures use the error envelope.
      properties:
        invocation_id: { type: string }
        status:
          type: string
          enum: [Started, InProgress, Completed, Error]
        result:
          type: string
          description: |
            A JSON *string* holding the list of result objects. It is a string
            on the wire, not an object — the provider's frozen contract.
        result_type:
          type: string
          enum: [String]
        error_category: { type: string }
        error_type: { type: string }
        custom_events:
          type: array
          description: |
            Progress events accumulated since the previous poll. Read-once: a
            caller that misses a poll does not see them again.
          items:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
      required: [status]
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the poll body is forwarded VERBATIM
        (internal/api/v2/deepwiki/proxy.go:127); this route does no rewriting
        at all. The three shapes are recorded in
        conformance/provider/fixtures/deepwiki/spi/invocations.get.json,
        and the permissive tail exists because the terminal projection varies
        by tool — `result_type` is absent while running, `custom_events`
        appears only on a poll that drained some, and a tool may add its own
        keys. Constraining it would make the facade reject a body it only
        relays.

    # ---- Inventory facade --------------------------------------------------
    # The second facade over the frozen provider SPI. The three schemas below
    # are deliberately NOT $refs to the DeepWiki ones: the two facades share a
    # route table, not a payload. Inventory's invoke body carries a `sources`
    # list the facade expands into credential material
    # (internal/api/v2/inventory/sources.go), which DeepWiki's does not, and a
    # shared schema would have to describe the union and pin neither.

    InventoryInvokeRequest:
      type: object
      description: |
        The provider's invocation envelope, as the browser writes it.
        `configuration.parameters` carries the Inventory toolkit's own settings
        (bucket, llm_model, embedding_model, sources) and `parameters` the
        tool's arguments; a tool argument overrides a configured value only
        when it is truthy, which is the provider's own merge rule
        (services/elitea-subapp-host/internal/apps/inventory/run/params.go:85).

        Credentials are NOT supplied here. For the three tools that name a
        source toolkit — run_ingestion, delta_update, remove_source_entities —
        the facade resolves that toolkit from the project, projects the fields
        one SDK loader reads, and injects them before proxying
        (internal/api/v2/inventory/sources.go:53, 172-190). The provider never holds a
        vault key.
      properties:
        configuration:
          type: object
          properties:
            parameters:
              type: object
              additionalProperties: true
              x-elitea-passthrough: >-
                NOTE(W2): toolkit-level configuration, whose key set is the
                PROVIDER's descriptor and not this spec's. The facade reads
                only `sources` and `source_configs` out of it and re-encodes
                every sibling untouched
                (internal/providerhost/material/source.go:191-247, wired at
                internal/api/v2/inventory/sources.go:172-190). A closed shape
                here would drop a field the provider's own toolkit_config
                declares, which is a payload the caller wrote correctly and
                the facade silently truncated.
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the envelope around `parameters`. The facade replaces
            only that key and re-encodes every sibling verbatim
            (internal/providerhost/material/source.go:237-247), so a sibling the
            provider gains later travels without a change here.
        parameters:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the TOOL's own arguments, whose names come from the
            provider descriptor's args_schema and differ per tool
            (toolkit_id and full_rebuild for run_ingestion, query for the
            read tools). The facade forwards them untouched; only
            `configuration.parameters` is rewritten
            (internal/providerhost/material/source.go:191-247).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the provider's frozen invocation envelope, recorded in
        conformance/provider/fixtures/inventory/invoke/run_ingestion.in.json.
        Unrecognised top-level keys are re-encoded verbatim rather than
        dropped, which is what makes this facade a proxy rather than a
        re-serialiser (internal/providerhost/material/invoke.go:121-223).

    InventoryInvocationAccepted:
      type: object
      description: |
        The invocation id to poll, and the literal status `Started`.

        Invocation is asynchronous for every Inventory tool, including the
        reads: the descriptor advertises `sync_invocation_supported` and the
        provider has never honoured it.
      properties:
        invocation_id: { type: string }
        status:
          type: string
          enum: [Started]
      required: [invocation_id, status]

    InventoryInvocationStatus:
      type: object
      description: |
        One of the provider's three shapes, passed through unchanged: pending
        (`Started`), running (`InProgress`, with any `custom_events` drained by
        this read), or terminal. A failed TOOL is HTTP 200 with
        `status: "Error"`; only transport failures use the error envelope.

        `custom_events` are read-once. An ingestion's progress lines reach the
        screen through this field alone, so a caller that misses a poll does
        not see those lines again.
      properties:
        invocation_id: { type: string }
        status:
          type: string
          enum: [Started, InProgress, Completed, Error, Stopped]
        result:
          type: string
          description: |
            A JSON *string* holding the list of result objects. It is a string
            on the wire, not an object — the provider's frozen contract.
        result_type:
          type: string
          enum: [String]
        error_category: { type: string }
        error_type: { type: string }
        custom_events:
          type: array
          description: |
            Progress events accumulated since the previous poll. Read-once.
          items:
            type: object
            properties:
              data:
                type: object
                properties:
                  message: { type: string }
      required: [status]
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the poll body is forwarded VERBATIM by the shared hop
        (internal/providerhost/proxy/proxy.go:145-170, reached from
        internal/providerhost/routes/routes.go:117-123); this route does no
        rewriting at all. The permissive tail exists because the terminal
        projection varies
        by tool — `result_type` is absent while running, `custom_events`
        appears only on a poll that drained some, and each of the eleven tools
        may add its own keys. Constraining it would make the facade reject a
        body it only relays.

    # NOTE(W2): the former `Struct` / `GenericResponse` / `PaginatedResponse` /
    # `AdminPaginatedResponse` / `ArrayResponse` generic shells and the
    # `Application`/`User`/`Role`/`Bucket`/`ApplicationVersion`/`Artifact`
    # allOf-Struct aliases were REMOVED (spec preflight fact P4). Every schema
    # below is field-level, sourced from the Go handler that marshals it.

    # ---- Error responses ---------------------------------------------------
    BudgetPeriodWindow:
      type: object
      description: |
        The calendar month a budget accrues over. Derived exactly as the LLM
        gateway derives it (first instant of the current month, UTC) — the
        accumulator's key includes the period start, so a period computed any
        other way would look up a row that does not exist and report zero spend
        against a real limit.
      required: [period, period_start, period_end, resets_at]
      properties:
        period:
          type: string
          description: The period tag, YYYYMM.
          example: "202608"
        period_start:
          type: string
          description: First day of the period, YYYY-MM-DD.
          example: "2026-08-01"
        period_end:
          type: string
          description: Last day of the period, YYYY-MM-DD.
          example: "2026-08-31"
        resets_at:
          type: string
          format: date-time
          description: When the accumulator rolls over to a new period row.

    BudgetState:
      description: |
        The five COST fields — monthly_limit, effective_limit, spend, remaining
        and currency — are deliberately NOT in `required`. Both project-scoped
        reads (`getProjectBudget`, `getProjectUsage`) REMOVE them for a caller
        whose `can_see_amounts` is false, so requiring them would make a
        correct redacted response fail its own schema. Everything that is not a
        cost figure — the percentage, the threshold, the period — is required,
        because redaction never removes those.
      allOf:
        - $ref: '#/components/schemas/BudgetPeriodWindow'
        - type: object
          required:
            - limit_source
            - enabled
            - warning_pct
            - percent_used
            - warning_active
            - spend_available
          properties:
            can_see_amounts:
              type: boolean
              description: |
                Present on the project-scoped reads only. False means the five
                cost fields were removed from this payload; percentages, the
                warning threshold and the period remain.

            monthly_limit:
              type: number
              nullable: true
              description: The AUTHORED ceiling in USD. Null means none was set.
            effective_limit:
              type: number
              nullable: true
              description: |
                The ENFORCED ceiling. Null when the scope is unlimited — which
                includes a scope that has a monthly_limit but is disabled.
            limit_source:
              type: string
              enum: [explicit, unlimited]
              description: |
                Where the enforced limit came from. The reference had a third
                value, `default`, for a platform-wide fallback; this platform
                has none.
            currency:
              type: string
              enum: [USD]
              description: |
                Always USD. The gateway compares limits against a nano-USD
                counter and nothing converts, so the write path rejects any
                other value rather than storing a label enforcement ignores.
            enabled:
              type: boolean
              description: |
                False marks the scope deliberately exempt: it stays unlimited
                whatever monthly_limit says. Stored separately from the
                enforcement flag so `enabled with no ceiling yet` and
                `deliberately exempt` do not read back as the same thing.
            warning_pct:
              type: integer
              description: Percent-of-limit at which this scope warns.
            spend:
              type: number
              description: USD accrued this period. Zero when nothing is recorded.
            remaining:
              type: number
              nullable: true
              description: Null when the scope is unlimited. Never negative.
            percent_used:
              type: number
              nullable: true
              description: Null when the scope is unlimited or the limit is zero.
            warning_active:
              type: boolean
              description: |
                True when `percent_used` has reached `warning_pct` — the
                soft-alert threshold this scope resolves, which is the
                project's own value, else the platform value an operator set
                through `PUT /admin/gateway/budget-alerts`, else 80.

                The server answers it rather than each client deriving it, so a
                warning banner and the percentage beside it cannot disagree,
                and so the comparison is made once against the same resolved
                threshold the gateway alerts on. False whenever there is
                nothing to warn about: an unlimited scope, a disabled one and a
                zero ceiling all report a null `percent_used`.

                It is not a cost figure and is never redacted: a member who may
                not see the amounts still learns the project is close to its
                limit.
            spend_available:
              type: boolean
              description: |
                Whether an accumulator row exists for this period at all, which
                is what separates "nothing billed yet" from "no usage data".

    ProjectBudget:
      allOf:
        - type: object
          required: [project_id, budget_period, nats_fail_mode]
          properties:
            project_id:
              type: integer
            budget_period:
              type: string
              enum: [monthly]
              description: |
                The STORED period, read back from the row rather than reported
                as a constant. `monthly` is the only accepted value: the gateway
                derives the billing window from the calendar month
                unconditionally, so any other value would be one nothing
                computes and nothing bills against.
            nats_fail_mode:
              type: string
              nullable: true
              enum: [tiered_hybrid, fail_open, fail_closed]
              description: |
                The per-project NATS-failure policy the gateway applies when the
                budget counter is unreachable.

                NULL means this project authors none and inherits the platform
                baseline (`LLM_BUDGET_NATS_FAIL_MODE`). That is a distinct state
                from any of the three modes, so it is reported as null rather
                than resolved to the baseline here — a client that showed the
                inherited value as if it were authored would make a later change
                to the baseline look like a change nobody made.
        - $ref: '#/components/schemas/BudgetState'

    MemberBudget:
      allOf:
        - type: object
          required: [project_id, user_id, enforced]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
            enforced:
              type: boolean
              description: |
                TRUE since issue #321: the gateway reads this limit on every
                LLM call that carries a member id, refuses an over-cap member
                with 402 `member_budget_exceeded`, and bills a member-scoped
                accumulator alongside the project one.

                It stays a field rather than a constant so a client renders
                what is true of the deployment it is talking to. A call that
                carries no resolvable member — a token-authenticated
                integration, a service account — has no member cap to apply and
                remains bounded by the project ceiling alone.
        - $ref: '#/components/schemas/BudgetState'

    BudgetWrite:
      type: object
      description: The write payload shared by the project and member budget PUTs.
      properties:
        monthly_limit:
          type: number
          nullable: true
          minimum: 0
          description: Ceiling in USD. Null, or absent, means no ceiling.
        enabled:
          type: boolean
          default: true
          description: |
            False marks the scope deliberately exempt, so it stays unlimited
            whatever monthly_limit says.
        currency:
          type: string
          enum: [USD]
          default: USD
          description: Anything other than USD is rejected with a 400.
        soft_alert_pct:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Percent-of-limit at which this scope warns. Omitted leaves the
            stored threshold untouched.

    ProjectBudgetWrite:
      description: |
        The project budget PUT payload: the shared fields plus the two policy
        columns that exist only at project scope.

        Neither extra field is accepted by the member PUT, which answers 400
        rather than storing it: `gateway.user_budget` has neither column, and
        the gateway reads a project's fail mode from the OWNING project's row on
        the member path too. A member accrues over the same calendar window for
        the same reason.
      allOf:
        - $ref: '#/components/schemas/BudgetWrite'
        - type: object
          properties:
            budget_period:
              type: string
              enum: [monthly]
              description: |
                Omitted leaves the stored period untouched. `monthly` is the
                only accepted value — see the response schema for why.
            nats_fail_mode:
              type: string
              nullable: true
              enum: [tiered_hybrid, fail_open, fail_closed]
              description: |
                The per-project NATS-failure policy override.

                This field has THREE inputs, not two. Omitted leaves the stored
                mode untouched, so an edit that changes only the limit does not
                silently reset a policy chosen earlier. An explicit `null`
                clears the override back to the platform baseline. A named mode
                sets it.

    ProjectBudgetRow:
      allOf:
        - type: object
          required: [project_id, name, display_name, owner_name, owner_email, is_personal]
          properties:
            project_id:
              type: integer
            name:
              type: string
            display_name:
              type: string
              description: |
                The owner's identity for a personal project, the project name
                otherwise — `project_user_<n>` is not a name anyone searches for.
            owner_name:
              type: string
            owner_email:
              type: string
            is_personal:
              type: boolean
        - $ref: '#/components/schemas/BudgetState'

    ProjectBudgetListing:
      type: object
      required: [rows, total, counts]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBudgetRow'
        total:
          type: integer
          description: The FILTERED total, which is what the pagination describes.
        counts:
          type: object
          description: |
            Unfiltered per-type counts, for the tab labels. Deliberately not
            narrowed by the filters: a tab whose count moved with the search box
            would be reporting how many rows the other tab currently shows.
          additionalProperties:
            type: integer

    MemberBudgetRow:
      allOf:
        - type: object
          required: [project_id, user_id, name, email, roles, enforced]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
            name:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
            enforced:
              type: boolean
              description: See MemberBudget.enforced.
        - $ref: '#/components/schemas/BudgetState'

    MemberBudgetListing:
      type: object
      required: [rows, total, warning_pct]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MemberBudgetRow'
        total:
          type: integer
        warning_pct:
          type: integer
          description: |
            The PROJECT's threshold, which labels the table. Each row carries
            its own.

    UsageReport:
      allOf:
        - type: object
          required: [project_id, user_id, scope]
          properties:
            project_id:
              type: integer
            user_id:
              type: integer
              nullable: true
              description: Null for scope=project.
            scope:
              type: string
              enum: [project, user]
            enforced:
              type: boolean
              description: Present for scope=user only. See MemberBudget.enforced.
            budget_period:
              type: string
              enum: [monthly]
              description: Present for scope=project only.
        - $ref: '#/components/schemas/UsageDimensions'
        - $ref: '#/components/schemas/BudgetState'

    UsageDimensions:
      type: object
      required: [usage_events_available]
      description: |
        The per-model, per-day and per-token views, from the per-request usage
        ledger (issue #320). Before that ledger existed the platform kept one
        accumulated figure per scope and period, and these views could not be
        populated at all.

        Every field except `usage_events_available` is ABSENT when the ledger
        holds no row for the scope in this period. Read the flag first.
      properties:
        usage_events_available:
          type: boolean
          description: |
            Whether the ledger holds any row for this scope in this period.
            FALSE means no data, which is NOT the same claim as no calls — the
            accumulated `spend` may still be non-zero for a period that began
            before the ledger did.
        prompt_tokens:
          type: integer
          format: int64
          description: Provider-reported prompt tokens for the period. Never estimated.
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        api_requests:
          type: integer
          format: int64
          description: Billed requests in the period.
        daily:
          type: array
          description: |
            One entry per day that had at least one call. Days with no calls are
            omitted rather than zero-filled: the period runs to the end of the
            calendar month, and a zero for a day nobody could have used yet is a
            claim about the future.
          items:
            $ref: '#/components/schemas/UsageDailyEntry'
        models:
          type: array
          description: One entry per (provider, model) billed in the period, ordered by spend.
          items:
            $ref: '#/components/schemas/UsageModelEntry'

    UsageDailyEntry:
      type: object
      required: [date, total_tokens, api_requests, prompt_tokens, completion_tokens]
      properties:
        date:
          type: string
          format: date
          description: The UTC calendar day, the zone billing periods are computed in.
        spend:
          type: number
          nullable: true
          description: |
            USD for the day. REMOVED for a caller who may not see amounts, like
            every other money field.
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        api_requests:
          type: integer
          format: int64

    UsageModelEntry:
      type: object
      required: [provider, model, total_tokens, api_requests, prompt_tokens, completion_tokens]
      properties:
        provider:
          type: string
        model:
          type: string
        spend:
          type: number
          nullable: true
          description: |
            USD for the model. REMOVED for a caller who may not see amounts.
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        api_requests:
          type: integer
          format: int64

    AnalyticsCostBreakdown:
      type: object
      description: |
        The cost view over gateway.llm_budget_accumulators. Its shape is the
        accumulator's own: money per (scope, scope_id, period). The per-model,
        per-agent, per-user and per-day views the pylon original carried are
        absent here because nothing in this architecture records those
        dimensions — see the operation description.
      required: [kpis, periods, by_scope, periods_truncated, date_from, date_to]
      properties:
        kpis:
          type: object
          required: [total_cost, currency, periods, spend_available, window_days]
          properties:
            total_cost:
              type: number
              description: >
                Sum of PROJECT-scope rows over the window, as an exact decimal.
                Narrower scopes are excluded so the same spend is not counted
                twice.
            currency:
              type: string
              description: Always USD; the money path converts nowhere.
            periods:
              type: integer
              description: How many project-scope accumulator rows were summed.
            spend_available:
              type: boolean
              description: >
                False when the write-back path has persisted nothing for this
                project in this window, so "no spend yet" stays distinguishable
                from "no data".
            window_days:
              type: integer
        periods:
          type: array
          description: >
            One entry per accumulator row overlapping the window, capped at 500
            rows with PROJECT-scope rows ordered first so a truncation never
            drops the rows behind the headline figure. See periods_truncated.
          items:
            $ref: '#/components/schemas/AnalyticsCostPeriod'
        by_scope:
          type: array
          description: >
            Roll-up per accumulator scope, summed by PostgreSQL over EVERY row
            in the window — including rows the capped `periods` array omits.
            Present so a narrower scope is visible without being summed into
            total_cost.
          items:
            type: object
            required: [scope, total_cost, rows]
            properties:
              scope: { type: string }
              total_cost: { type: number }
              rows:
                type: integer
                description: >
                  How many accumulator rows the sum covers, so a client can tell
                  that a scope contributed more rows than `periods` lists.
        periods_truncated:
          type: boolean
          description: >
            True when `periods` was capped and lists only the first 500 rows.
            No total is affected: every figure in this response is a SQL
            aggregate over the whole window, so a truncated response reports the
            same money as a complete one — what is missing is per-row detail.
        date_from:
          type: string
          format: date-time
        date_to:
          type: string
          format: date-time
        estimate:
          allOf:
            - $ref: '#/components/schemas/AnalyticsUsageEstimate'
          description: >
            The per-model, per-user and per-day view, read from the gateway
            request log rather than from the accumulator. Absent on a database
            that carries no request log.

    AnalyticsCostPeriod:
      type: object
      description: One gateway.llm_budget_accumulators row.
      required:
        [scope, scope_id, period_start, period_end, total_cost, last_updated,
         pending_reconciliation]
      properties:
        scope:
          type: string
          description: >
            The accumulator scope the gateway billed against. `project` is the
            only one its admission path writes today.
        scope_id:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        total_cost:
          type: number
          description: Accrued spend for this row, an exact decimal.
        last_updated:
          type: string
          format: date-time
        pending_reconciliation:
          type: boolean
          description: >
            True while the gateway's recovery goroutine still owns the row
            (outage_mode and not reconciled). The figure is the last durable
            one and not necessarily the current one.

    AnalyticsUsageEstimate:
      type: object
      description: |
        The dimensional half of the cost view, over gateway.llm_request_logs
        (shared migration 0099): one row per call, carrying the project, the
        user, the provider, the model, the clock and the token counts.

        Tokens here are RECORDED. Money here is DERIVED, by multiplying those
        tokens by the price catalogue in gateway.gateway_models, and it is
        therefore an estimate. It is published under its own key so it cannot
        be confused with kpis.total_cost, which is what the billing path
        accounted.
      required:
        [token_dimension_available, cost_dimension_available,
         cache_dimension_available, currency, priced_calls, unpriced_calls,
         totals, by_model, by_user, daily, by_model_truncated,
         by_user_truncated]
      properties:
        token_dimension_available:
          type: boolean
          description: >
            True whenever this block is present. Published so a client reads a
            flag instead of inferring an answer from a missing key.
        cost_dimension_available:
          type: boolean
          description: >
            False when no call in the window has a catalogue price. Every money
            field is then absent, because a cost of zero would render as "this
            project spent nothing", which is a different claim.
        cache_dimension_available:
          type: boolean
          description: >
            Always false. The request log records prompt and completion tokens
            and no cache counts, and no second source carries them.
        currency:
          type: string
          description: Always USD.
        priced_calls:
          type: integer
          format: int64
          description: Calls whose model the catalogue prices.
        unpriced_calls:
          type: integer
          format: int64
          description: >
            Calls whose model the catalogue does not price. They count their
            tokens and contribute no money, so a large value here says the
            money covers only part of the traffic.
        totals:
          $ref: '#/components/schemas/AnalyticsEstimateTotals'
        by_model:
          type: array
          description: One entry per provider and model, capped at 100 rows.
          items:
            $ref: '#/components/schemas/AnalyticsEstimateModel'
        by_user:
          type: array
          description: One entry per caller, capped at 200 rows.
          items:
            $ref: '#/components/schemas/AnalyticsEstimateUser'
        daily:
          type: array
          description: >
            One entry per UTC day that had traffic. A day with no call is
            absent rather than zero-filled.
          items:
            $ref: '#/components/schemas/AnalyticsEstimateDay'
        by_model_truncated:
          type: boolean
        by_user_truncated:
          type: boolean

    AnalyticsEstimateTotals:
      type: object
      required: [calls, prompt_tokens, completion_tokens, total_tokens]
      properties:
        calls:
          type: integer
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        input_cost:
          type: number
          description: >
            Prompt tokens at the catalogue rate, an exact decimal. Absent when
            cost_dimension_available is false.
        output_cost:
          type: number
          description: Completion tokens at the catalogue rate, an exact decimal.
        total_cost:
          type: number
          description: input_cost plus output_cost, added in the database.

    AnalyticsEstimateModel:
      type: object
      required:
        [provider, model, calls, prompt_tokens, completion_tokens,
         total_tokens, priced]
      properties:
        provider:
          type: string
        model:
          type: string
        calls:
          type: integer
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        priced:
          type: boolean
          description: >
            False when the catalogue carries no rate for this model. The row
            keeps its token counts and omits its money.
        input_cost:
          type: number
        output_cost:
          type: number
        total_cost:
          type: number

    AnalyticsEstimateUser:
      type: object
      required:
        [user_id, email, name, calls, prompt_tokens, completion_tokens,
         total_tokens, priced]
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
          description: >
            Empty when the identity corpus is not on this database. The row
            keeps its figures; only the display name is lost.
        name:
          type: string
        calls:
          type: integer
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        priced:
          type: boolean
        input_cost:
          type: number
        output_cost:
          type: number
        total_cost:
          type: number

    AnalyticsEstimateDay:
      type: object
      required: [date, calls, prompt_tokens, completion_tokens, total_tokens]
      properties:
        date:
          type: string
          description: The UTC day, as YYYY-MM-DD.
        calls:
          type: integer
          format: int64
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        input_cost:
          type: number
        output_cost:
          type: number
        total_cost:
          type: number

    MessageTraceListing:
      type: object
      required: [total, rows]
      properties:
        total:
          type: integer
          nullable: true
          description: Null unless include_total=true was requested.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/MessageTraceStep'

    MessageTraceStep:
      type: object
      description: >
        The light projection of a chat_message_trace_step row: what a resting
        chip draws, plus what orders it.
      required: [id, message_group_id, kind, is_error]
      properties:
        id: { type: integer, format: int64 }
        message_group_id: { type: integer, format: int64 }
        kind:
          type: string
          description: '`tool_call` or `thinking_step`.'
        tool_name: { type: string, nullable: true }
        parent_agent_name: { type: string, nullable: true }
        parent_agent_call_id: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        is_error: { type: boolean }
        step_type: { type: string, nullable: true }
        model_name: { type: string, nullable: true }
        finish_reason: { type: string, nullable: true }
        attrs:
          type: object
          nullable: true
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): DB jsonb column `chat_message_trace_step.attrs` is
            re-emitted verbatim as raw JSON
            (internal/api/v2/messagetraces/handler.go:246). It is the bounded
            display sidecar the runtime writes per step type — chip icon,
            display name, toolkit type — and has no fixed key set across step
            kinds; the writer is
            internal/infra/db/repos/agent_trace.go:1108-1116.

    MessageTraceStepDetail:
      allOf:
        - $ref: '#/components/schemas/MessageTraceStep'
        - type: object
          description: The heavy fields, fetched one step at a time.
          properties:
            tool_inputs:
              nullable: true
              x-elitea-passthrough: >-
                NOTE(W2): DB jsonb column
                `chat_message_trace_step.tool_inputs` is re-emitted verbatim as
                raw JSON (internal/api/v2/messagetraces/handler.go:296). Its
                shape is the invoked tool's own argument object, so it is
                untyped by construction; the writer is
                internal/infra/db/repos/agent_trace.go:1108-1116.
            tool_output: { type: string, nullable: true }
            text: { type: string, nullable: true }
            thinking: { type: string, nullable: true }

    ProjectQuota:
      type: object
      description: |
        centry.project_quota. `-1` is the unlimited sentinel; a null column was
        never configured. The vcu_* and storage_* triples are the only ones the
        PUT writes.
      required: [id, project_id]
      properties:
        id: { type: integer }
        project_id: { type: integer }
        data_retention_limit: { type: integer, nullable: true }
        test_duration_limit: { type: integer, nullable: true }
        cpu_limit: { type: integer, nullable: true }
        memory_limit: { type: integer, nullable: true }
        last_update_time:
          type: string
          nullable: true
          description: Start of the current 30-day quota window, UTC.
        dast_scans: { type: integer, nullable: true }
        sast_scans: { type: integer, nullable: true }
        vcu_hard_limit: { type: integer, nullable: true }
        vcu_soft_limit: { type: integer, nullable: true }
        vcu_limit_total_block: { type: boolean }
        storage_hard_limit:
          type: integer
          nullable: true
          description: Gigabytes.
        storage_soft_limit:
          type: integer
          nullable: true
          description: Gigabytes.
        storage_limit_total_block: { type: boolean }

    ProjectQuotaUpdate:
      type: object
      description: |
        Only the triple matching `usage_type` is read. An omitted field CLEARS
        its column.
      properties:
        vcu_hard_limit: { type: integer, nullable: true }
        vcu_soft_limit: { type: integer, nullable: true }
        vcu_limit_total_block: { type: boolean, default: false }
        storage_hard_limit: { type: integer, nullable: true }
        storage_soft_limit: { type: integer, nullable: true }
        storage_limit_total_block: { type: boolean, default: false }

    StatisticEntry:
      type: object
      required: [current, quota]
      properties:
        current:
          type: integer
          format: int64
        quota:
          type: integer
          format: int64
          nullable: true
          description: |
            Null where the quota table has no column for this metric, or where
            it holds the -1 unlimited sentinel.

    ProjectStatistics:
      type: object
      description: |
        One entry per metric. `storage_space` is in BYTES on both sides;
        `data_retention_limit` reports a current of 0, as the reference does,
        because nothing measures retention — only configures it.
      properties:
        performance_test_runs: { $ref: '#/components/schemas/StatisticEntry' }
        ui_performance_test_runs: { $ref: '#/components/schemas/StatisticEntry' }
        sast_scans: { $ref: '#/components/schemas/StatisticEntry' }
        dast_scans: { $ref: '#/components/schemas/StatisticEntry' }
        tasks_executions: { $ref: '#/components/schemas/StatisticEntry' }
        storage_space: { $ref: '#/components/schemas/StatisticEntry' }
        data_retention_limit: { $ref: '#/components/schemas/StatisticEntry' }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
      description: >
        NOTE(W2): wire truth from pkg/apierr/apierr.go:47-59 (apierr.Write
        encodes `{"error": message}`) and the handlers' inline
        `map[string]any{"error": ...}` writes. No operation documented in this
        spec emits the pylon `ok` field via THIS schema; the five
        social/handler.go 500 sites (:268, 301, 321, 341, 419) use the named
        `SocialActionErrorResponse` schema instead (see there), and five more
        UNDOCUMENTED sites remain on toolkits/handler.go (:286, 312, 324, 350,
        362).

    CapabilityUnavailableResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable refusal message.
        code:
          type: string
          description: >
            The machine-readable reason. One value per capability, stable
            across deployments, so a client branches on this and never on the
            message text.
          enum:
            - project_info_not_available
            - index_types_not_available
            - icon_storage_not_configured
        detail:
          type: string
          description: >
            The operator-facing half: it names the environment variable that
            turns the capability on.
      description: >
        NOTE(W2): the 501 body issue 615 gave the two capability-gated
        compatibility handlers — internal/api/v2/eliteacore/handler.go
        (ProjectInfo) and internal/api/v2/toolkits/handler.go (IndexTypes).
        Both write `{error, code, detail}`, which is WIDER than ErrorResponse:
        a client that must tell "this deployment does not run the capability"
        from "the request failed" reads `code`, and ErrorResponse carries no
        such field.

        WHY 501 AND NOT 500. An absent producer is the server's final answer,
        and it will be the final answer to the next identical request. See
        internal/api/v2/analytics/handler.go for the argument in full.

    ValidationFieldError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: { type: string }
          description: Field path, e.g. ["body", "version_name"]
        msg:
          type: string
        type:
          type: string
          description: pydantic-style error code, e.g. value_error.missing
      description: >
        NOTE(W2): pydantic-parity field error emitted by Publish/PublishValidate
        for a missing or malformed version_name
        (internal/api/v2/eliteacore/handler.go:455-474, 1202-1219).

    PublishBadRequestResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ValidationFieldError'
          description: >
            Either a plain message (e.g. "llm_not_shared",
            "pipeline_not_publishable") or a pydantic-style field error list.
        msg:
          type: string
          description: Present only alongside error="pipeline_not_publishable".
      description: >
        NOTE(W2): union of the 400 bodies written by Publish
        (internal/api/v2/eliteacore/handler.go:452, 456-461, 467-473, 486, 547,
        585) and PublishValidate (1197, 1203-1218).

    ValidationIssue:
      type: object
      properties:
        rule: { type: string }
        field: { type: string }
        issue: { type: string }
        source: { type: string }
        context:
          type: string
          nullable: true
          description: >
            Emitted as explicit JSON null in the cycle/depth FAIL issues
            (handler.go:985, 1003).
        message: { type: string }
        fix:
          type: string
          description: >
            Remediation text carried by the cycle/depth FAIL critical issues
            (handler.go:986, 1004).
        suggestion:
          type: string
          description: >
            The ONLY human-readable text on recommendation issues — they have
            no issue/message key (handler.go:1043).
      description: >
        NOTE(W2): issue maps assembled in runPublishValidation
        (internal/api/v2/eliteacore/handler.go:876, 885, 891, 981-1005 cycle/
        depth FAILs with fix + explicit-null context, 1043 recommendations
        with suggestion, 1107-1121, 1146-1151) and re-shaped in Publish's 422
        path (556-565: {rule, message}). Key set varies per rule; all keys
        optional by construction.

    PublishValidationResult:
      type: object
      properties:
        status:
          type: string
          enum: [PASS, WARN, FAIL]
        critical_issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        summary:
          type: string
        counts:
          type: object
          properties:
            critical: { type: integer }
            warnings: { type: integer }
            suggestions: { type: integer }
        ai_validation_available:
          type: boolean
        validation_token:
          type: string
          nullable: true
          description: >
            Hex token generated for non-FAIL results; null on FAIL
            (handler.go:1164-1169). Pass it to publishApplication to skip
            re-validation.
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
          description: >
            Present only in publishApplication's 422 body (handler.go:556-565)
            and in the deterministic short-circuit 422s (500-509, 518-527,
            610-618), where it may be the ONLY key.
      description: >
        NOTE(W2): built by runPublishValidation
        (internal/api/v2/eliteacore/handler.go:1155-1182). validateForPublish's
        own 200/422 always carries status..validation_token; the
        publishApplication 422 short-circuits carry only `issues`. No field is
        therefore marked required.

    PublishValidationFailedResponse:
      type: object
      required: [error, validation_result]
      properties:
        error:
          type: string
          enum: [validation_failed]
        validation_result:
          $ref: '#/components/schemas/PublishValidationResult'
      description: >
        NOTE(W2): 422 envelope written by Publish
        (internal/api/v2/eliteacore/handler.go:500-509, 518-527, 566-570,
        610-618).

    # NOTE(W2): the former RateLimitErrorDetail / RateLimitErrorResponse
    # schemas and every per-operation 429 response were REMOVED. The Go
    # RateLimit middleware is a pass-through stub
    # (internal/api/middleware/ratelimit.go:9-14) and nothing in elitea-main
    # emits a 429 body, so documenting one violated the wire-truth invariant.
    # Re-add them when rate limiting becomes real.

    # ---- Shared primitives ---------------------------------------------------
    BackgroundJob:
      type: object
      description: >
        One row of the admin Tasks table. `task_id`, `status`, `started_at`
        and `user` carry the legacy listing's names verbatim
        (legacy/plugins/admin/api/v2/tasks.py:94-108); the rest are new,
        because pylon had one kind of task, one project, no completion time,
        and a stop button it always offered.
      required: [task_id, kind, name, status, cancellable]
      properties:
        task_id:
          type: string
          description: >
            The execution id for a runtime job, the invocation id for a
            scheduled occurrence, the row id for an evaluation run.
        kind:
          type: string
          enum: [index, agent, toolkit, execution, schedule, eval]
        name:
          type: string
          description: >
            The capability id for a runtime job, the schedule job id for an
            occurrence, the agent id for an evaluation run.
        status:
          type: string
          description: >
            The source's own state vocabulary, plus one value no table holds -
            CANCELLING, for a runtime job that has been asked to stop and has
            not stopped yet.
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        project_id:
          type: integer
          format: int64
          nullable: true
          description: Null for a scheduled occurrence, which belongs to no project.
        user:
          type: string
          description: >
            The stored actor identifier, empty for a job with no interactive
            principal.
        cancellable:
          type: boolean
          description: >
            Whether the cancel route would accept THIS row. Computed per row,
            so the page renders the control only where it works.

    BackgroundJobListResponse:
      type: object
      required: [total, rows, truncated]
      properties:
        total:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundJob'
        truncated:
          type: boolean
          description: >
            The per-source scan window was full, so older rows exist that this
            page cannot reach.

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
      description: >
        NOTE(W2): `{"ok": true}` acknowledgements — SetDefaultVersion
        (internal/api/v2/applications/handler.go:981), BatchReplaceVersion
        (:994), UpdateAttachmentStorage
        (internal/api/v2/eliteacore/handler.go:1783), UpdateIcon (:1860),
        BatchUpdateEntitySettings
        (internal/api/v2/conversations/handler.go:675), and social/handler.go's
        UpdateAuthor (:133, 166), Like (:271, plus the no-op shortcuts at
        :253, 258), Unlike (:304, plus :288, 293), Pin (:324, plus :315), and
        Unpin (:344, plus :335).

    # ---- Tracing ingest (issue #250) -----------------------------------------
    TracingSpan:
      type: object
      properties:
        name:
          type: string
        duration_ms:
          type: number
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): client-authored span attributes, re-emitted verbatim as
            OTel span attributes prefixed `ui.*`
            (internal/api/v2/tracing/handler.go:221, 238). The single
            recognized key `error` sets the span's OTel status
            (handler.go:225).
      description: >
        internal/api/v2/tracing/handler.go's spanData — one child span within
        a TracingTraceBatch.

    TracingTraceBatch:
      type: object
      properties:
        trace_id:
          type: string
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): client-authored trace attributes, re-emitted verbatim as
            OTel span attributes prefixed `ui.*` (internal/api/v2/tracing/
            handler.go:211, 238); the recognized key `project_id` is used
            ONLY when the URL carries no {project_id} (handler.go:200).
        spans:
          type: array
          items:
            $ref: '#/components/schemas/TracingSpan'
      description: >
        internal/api/v2/tracing/handler.go's traceBatch — one entry of the
        `collect` request body's `traces` array. Port of legacy
        tracing/api/v2/collect.py's per-trace shape.

    TracingCollectRequest:
      type: object
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TracingTraceBatch'
      description: >
        internal/api/v2/tracing/handler.go's collectRequest (Collect). Each
        trace becomes a parent OTel span named `ui:<name>`, each nested span
        becomes a child span, both exported through the process
        TracerProvider (libs/go/observability) to the collector `otlp`
        proxies to.

    TracingCollectResponse:
      type: object
      required: [received, spans_created]
      properties:
        received:
          type: integer
          description: Number of trace batches in the request.
        spans_created:
          type: integer
          description: Total OTel spans created (parents + children).
      description: internal/api/v2/tracing/handler.go's Collect 200 response.

    TracingStatusResponse:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >
            Mirrors libs/go/observability's own kill switch
            (OTEL_SDK_DISABLED != "true").
        project_id:
          type: string
          description: Echoed back on the prompt_lib (project-scoped) read.
        config:
          type: object
          description: >
            Present only on the administration read
            (internal/api/v2/tracing/handler.go:StatusAdmin).
          properties:
            collector_endpoint:
              type: string
            service_name:
              type: string
      description: >
        internal/api/v2/tracing/handler.go's StatusProject/StatusAdmin. Port
        of legacy tracing/api/v2/status.py's PromptLibAPI/AdminAPI.

    Author:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
      description: >
        NOTE(W2): internal/domain/applications/types.go:5-9 (no omitempty on
        any field) and the inline author maps in
        internal/api/v2/applications/handler.go:451, 600, 790.

    # ---- DB-jsonb passthrough shells (each individually justified) ----------
    StoredConnectionCheckRow:
      type: object
      required: [id, success]
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          description: >
            The id as it was requested, echoed back unchanged and in the type
            it arrived as, so a client can match a row to its request.
        success: { type: boolean }
        message: { type: string }
        reason:
          type: string
          description: >
            The machine-readable verdict of a TOOLKIT credential probe
            (internal/api/v2/configurations/toolkit_check.go). Absent for an
            ai_credentials provider. unsupported_type means this build carries
            no probe for the type, which is NOT evidence that the credential is
            broken and must not be shown as one.
          enum: [ok, auth_failed, unreachable, unsupported_type]
        unsupported:
          type: boolean
          description: The configuration's type is not registered in this build.

    PredictLLMMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: >
            One of system, user or assistant. A history entry missing either
            field is dropped rather than forwarded, so one stray client entry
            cannot fail an otherwise complete turn
            (internal/api/v2/predict/handler.go buildMessages).
        content: { type: string }

    PredictLLMSettings:
      type: object
      description: >
        The model settings that take effect. Fields legacy accepted and this
        handler deliberately ignores are listed and documented as ignored
        rather than dropped from the schema, so a client sending them is not
        misled into thinking they apply.
      properties:
        model_name:
          type: string
          description: >
            The model to use. When empty, the gateway answers with its own
            model-resolution error; this service never guesses a model.
        temperature: { type: number }
        max_tokens: { type: integer }
        reasoning_effort:
          type: string
          description: One of low, medium or high, for reasoning models.
        model_project_id:
          type: integer
          description: >
            IGNORED. The model is resolved against the project in the path,
            which is the only project the caller's membership was checked
            against; honouring this field would let a caller spend another
            project's provider credentials.
        integration_uid:
          type: string
          description: IGNORED. The gateway resolves the credential itself.

    PredictLLMRequest:
      type: object
      required: [user_input]
      properties:
        user_input:
          type: string
          description: The message to send. Required and non-blank.
        instructions:
          type: string
          description: Optional system message, placed before the history.
        chat_history:
          type: array
          items:
            $ref: '#/components/schemas/PredictLLMMessage'
        llm_settings:
          $ref: '#/components/schemas/PredictLLMSettings'
        await_task_timeout:
          type: integer
          description: >
            This request's deadline in seconds, clamped to 5..180. Absent, zero
            or negative takes the 60 second default. It does NOT select an
            asynchronous mode here; see the operation description.
        return_chat_history:
          type: boolean
          description: >
            When true, the response repeats the full turn list with the
            assistant reply appended.

    PredictLLMResponse:
      type: object
      required: [content, messages]
      properties:
        content:
          type: string
          description: >
            The generated text. Never empty on a 200: a completion with no
            content is reported as 502, not as a successful empty answer.
        messages:
          type: array
          description: The same text in message form, one assistant entry.
          items:
            $ref: '#/components/schemas/PredictLLMMessage'
        chat_history:
          type: array
          description: Present only when the request set return_chat_history.
          items:
            $ref: '#/components/schemas/PredictLLMMessage'

    PredictLLMUnavailableResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message naming the missing configuration.
        code:
          type: string
          description: >
            Always llm_gateway_not_configured. A machine-readable code distinct
            from any upstream failure, so an operator can tell an unconfigured
            deployment from a broken one.

    # ------------------------------------------------------------------------
    # AI DRAFTS (#254 P1)
    # ------------------------------------------------------------------------

    DraftLlmSettings:
      type: object
      description: >
        The model override, the same subset predict_llm honours. When it is
        absent the gateway answers with its own model-resolution error rather
        than this service guessing a model on the caller's behalf.
      properties:
        model_name: { type: string }
        temperature: { type: number }
        max_tokens: { type: integer }
        reasoning_effort:
          type: string
          description: One of low, medium or high, for reasoning models.

    GenerateSkillDraftRequest:
      type: object
      required: [user_description]
      properties:
        user_description:
          type: string
          description: What the skill should do, in plain text. Required and non-blank.
        llm_settings:
          $ref: '#/components/schemas/DraftLlmSettings'
        skill_id:
          type: integer
          nullable: true
          description: >
            NOT SERVED. In legacy this selects edit mode, which rewrites a
            stored skill. A request carrying it is refused with 400 rather than
            silently answered with a from-scratch draft the caller would apply
            over their existing skill. An explicit null is not edit intent.
        version_id:
          type: integer
          nullable: true
          description: NOT SERVED. See skill_id.

    SkillDraft:
      type: object
      required: [name, description, instructions, tags]
      properties:
        name:
          type: string
          description: >
            Slugified to lowercase letters, digits and hyphens, at most 64
            characters. A model answer that cannot be salvaged into a valid
            slug - or that contains a reserved word - is a 422.
        description: { type: string }
        instructions: { type: string }
        tags:
          type: array
          description: Never null. An empty list when the model suggested none.
          items: { type: string }

    GenerateApplicationDraftRequest:
      type: object
      required: [user_description]
      properties:
        user_description:
          type: string
          description: What the agent should do, in plain text. Required and non-blank.
        llm_settings:
          $ref: '#/components/schemas/DraftLlmSettings'
        application_id:
          type: integer
          nullable: true
          description: >
            NOT SERVED, for the same reason as skill_id on the skill draft: it
            selects legacy's edit mode, which rewrites a stored agent version.
            A request carrying it is refused with 400.
        version_id:
          type: integer
          nullable: true
          description: NOT SERVED. See application_id.

    ApplicationDraft:
      type: object
      required: [name, description, instructions, welcome_message, conversation_starters]
      description: >
        The content half of legacy's draft. It deliberately does NOT carry
        suggested_toolkits / suggested_mcp / suggested_agents /
        suggested_pipelines / suggested_skills: legacy builds those by first
        reading the project's toolkit instances, agents, pipelines and skills
        and offering them to the model as candidates, and elitea-main composes
        no reader for toolkit instances. A model asked for suggestions with no
        candidate list invents ids that resolve to nothing, so the fields are
        absent rather than present and always empty.
      properties:
        name:
          type: string
          description: At most 32 characters.
        description:
          type: string
          description: At most 2304 characters.
        instructions:
          type: string
          description: The agent's system prompt, in Markdown.
        welcome_message:
          type: string
          description: At most 768 characters. Empty when the model suggested none.
        conversation_starters:
          type: array
          description: >
            At most four, each at most 768 characters. Blank entries are
            dropped rather than returned as empty chips.
          items: { type: string }

    GenerateProjectContextDraftRequest:
      type: object
      required: [user_description]
      properties:
        user_description:
          type: string
          description: What the project is, in plain text. Required and non-blank.
        current_project_background:
          type: string
          description: >
            The Project Background as it stands. When present the draft is
            generated in EDIT mode - the model refines this content instead of
            writing from nothing. This is the one edit mode that is served,
            because it carries its own prior content and needs no repository
            read.
        llm_settings:
          $ref: '#/components/schemas/DraftLlmSettings'

    ProjectContextDraft:
      type: object
      required: [project_background]
      properties:
        project_background:
          type: string
          description: >
            Markdown, truncated to 2500 characters - the cap on
            project_context.content, so a draft this route returns can always
            be saved.

    CanvasEditor:
      type: object
      required: [user_id, user_name, state]
      description: >
        One person with the canvas open. The field names are the reference's
        (legacy/plugins/elitea_core utils/participant_utils.py), so the SPA's
        existing `item_details.editors` patch path applies unchanged.
      properties:
        user_id:
          type: string
          description: >
            The server-derived principal id. ADDED to the reference shape, which
            matched editors by display-name string comparison alone — two people
            with the same display name defeat that.
        user_name:
          type: string
          description: >
            The principal's display name, falling back to the e-mail and then to
            the id, so no entry is ever nameless.
        user_avatar:
          type: string
          description: >
            ABSENT today. The reference fills it from the `social` plugin's
            avatar store, which elitea-main composes no reader for. The key is
            omitted rather than sent empty: an empty string is the different and
            wrong claim "this user has no avatar".
        state:
          type: string
          enum: [editing, viewing]
          description: >
            The last state this editor heartbeated. `left` never appears here —
            it removes the entry.

    CanvasPresenceRequest:
      type: object
      description: >
        The heartbeat body. Every field is optional; an empty body is a
        `viewing` beat.

        There is NO project or canvas field, deliberately. Both come from the
        gated mount pattern. The deleted socket prototype read
        `data["user_id"]` and a client-supplied room name off the wire, which is
        the defect issue 622 exists to not repeat.
      properties:
        state:
          type: string
          enum: [editing, viewing, left]
          default: viewing
          description: >
            `left` removes the caller from the roster now, rather than waiting a
            TTL. The SPA sends it on unmount and when the tab is hidden.
        message_group_uuid:
          type: string
          description: >
            ECHOED, never trusted. The server resolves the real message group
            from the canvas and publishes that one.

    CanvasPresence:
      type: object
      required: [project_id, entity_id, entity_type, action, canvas_uuid, message_group_uuid, editors, ttl_seconds]
      description: >
        The roster. This is BOTH the POST's answer and the payload of the
        `canvas.editors` event published on the project SSE channel
        (`project:{project_id}:events`, GET
        /elitea_core/events/prompt_lib/{project_id}), so a client parses one
        shape either way.
      properties:
        project_id: { type: string }
        entity_id:
          type: string
          description: The canvas uuid. Mirrors internal/events DomainEvent.
        entity_type:
          type: string
          description: >
            Always `canvas`. Left as a plain string rather than a single-member
            enum: oapi-codegen turns a one-value enum into a bare `Canvas`
            constant in the generated package, which claims a very general name
            for a very narrow fact.
        action:
          type: string
          description: Always `editors`. A plain string for the reason above.
        canvas_uuid: { type: string }
        message_group_uuid: { type: string }
        editors:
          type: array
          description: >
            Never null. An empty roster is `[]`, so a client can tell "nobody is
            editing" from "this server did not answer the field". The two
            service principals the reference filters in the UI
            (admin@centry.user, system@centry.user) are suppressed here instead.
          items: { $ref: '#/components/schemas/CanvasEditor' }
        ttl_seconds:
          type: integer
          description: >
            How long this beat is good for. The client resends at a third of it,
            so the interval is not a constant duplicated on both sides.

    LlmSettings:
      type: object
      properties:
        model_name: { type: string }
        model_project_id:
          oneOf:
            - type: string
            - type: integer
          description: >
            Stored as string or number depending on writer; ExportImportGet
            normalizes float64 to a numeric string
            (internal/api/v2/eliteacore/handler.go:2590-2597).
        temperature: { type: number }
        max_tokens: { type: integer }
        top_p: { type: number }
        reasoning_effort:
          type: string
          description: >
            One of none, low, medium or high. Mutually exclusive with
            temperature on the runtime profile: the native worker refuses a
            profile carrying both (services/elitea-worker-rust/src/agents/
            assembly.rs, parse_reasoning_effort), and the web write path
            encodes the same rule (apps/elitea-web/src/shared/api/
            agentLlmSettings.ts, selectEffortAndTemperature).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `application_versions.llm_settings` is
        decoded and re-emitted verbatim
        (internal/api/v2/applications/handler.go:215-220, 851-855, 906-917);
        the platform inspects model_name/model_project_id/temperature/
        max_tokens/top_p (internal/api/v2/conversations/handler.go:653-660,
        internal/api/v2/eliteacore/handler.go:544-551) and the runtime
        additionally honours reasoning_effort. Remaining keys are
        client-owned. Channel-B fixture recommended (M1).

    VersionMeta:
      type: object
      properties:
        step_limit:
          type: integer
          nullable: true
        icon_meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): stored verbatim from the UpdateIcon request body
            (internal/api/v2/eliteacore/handler.go:1849-1858); known keys
            url/width/height come from UploadIcon (:1828-1836).
        category: { type: string }
        source_version_id: { type: string }
        parent_entity_id: { type: string }
        parent_project_id: { type: string }
        parent_author_id: { type: string }
        variables:
          type: array
          items: { $ref: '#/components/schemas/VersionVariable' }
          description: >
            Written into meta on create when the request carries variables
            (applications/handler.go:430, 747-752).
        attachment_storage:
          type: object
          properties:
            toolkit_id: { type: string }
          description: >
            Written by UpdateAttachmentStorage as {"toolkit_id": "..."}
            (eliteacore/handler.go:1777-1781).
        internal_tools:
          type: array
          items: { type: string }
          description: >
            Identifiers of the agent's enabled internal tools (e.g.
            "internal_mcp"). Client-owned: elitea-main never inspects the key
            — UpdateVersion assigns the whole meta map it receives
            (applications/handler.go:826-828) — but the legacy UI writes it
            here and the replatformed edit page both reads and writes it, so
            it is modelled rather than left to the passthrough marker below.
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `application_versions.meta` round-trips
        through the handlers untyped
        (internal/api/v2/applications/handler.go:215-220;
        internal/api/v2/eliteacore/handler.go:592-607 overlays
        source_version_id/category; fork overlays parent_* keys, :2330-2349;
        Go-authored keys variables/attachment_storage typed above). A
        `trigger` key is deliberately NOT declared here: pipelines/handler.go
        writes the trigger blob to a DIFFERENT column,
        `application_versions.settings` (jsonb_set at :180-182, not `meta`),
        and no code path in elitea-main ever writes meta.trigger —
        scheduling/handler.go:44's own comment calls the meta->'trigger' read
        speculative ("may be stored ... on some deployments"). The real
        settings-backed trigger blob is documented on PipelineTrigger,
        surfaced by getPipelineTrigger/updatePipelineTrigger. Channel-B
        fixture recommended (M1).

    ConversationStarters:
      type: array
      items:
        x-elitea-passthrough: >-
          NOTE(W2): DB jsonb array `application_versions.conversation_starters`
          is stored from and returned to the client verbatim
          (internal/api/v2/applications/handler.go:741-746, 857-861); the
          round-trip is untyped (but see the schema description for the
          []string decode in runPublishValidation). Channel-B fixture
          recommended (M1).
      description: >
        NOTE(W2): opaque jsonb array round-trip — see items marker. One
        caveat to the "never inspects" claim: runPublishValidation decodes
        the column as []string (eliteacore/handler.go:1028-1029), so
        non-string elements are silently read as an empty list there
        (spurious "no conversation starters" warning); the store/return
        round-trip itself is untyped.

    PipelineSettings:
      type: object
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `application_versions.pipeline_settings`
        decoded and re-emitted verbatim, never inspected
        (internal/api/v2/applications/handler.go:193-220). Channel-B fixture
        recommended (M1).

    SelectedTools:
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb column `entity_tool_mapping.selected_tools` decoded
        into `any` and re-emitted verbatim
        (internal/api/v2/applications/handler.go:248-260). Shape varies by
        toolkit type. Channel-B fixture recommended (M1).
      description: Opaque selected-tools blob (object or null) — see marker.

    ToolSettings:
      x-elitea-passthrough: >-
        NOTE(W2): DB jsonb `elitea_tools.settings` / `application_tools.settings`
        decoded into `any` and re-emitted verbatim
        (internal/api/v2/applications/handler.go:251-269, 292-301). Keys are
        toolkit-type-specific. Channel-B fixture recommended (M1).
      description: Opaque tool/toolkit settings blob — see marker.

    # ---- Applications domain -------------------------------------------------
    Application:
      type: object
      required: [id, name, created_at, updated_at, owner_id, is_forked, meta,
                 has_interrupt, tags]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        icon: { type: string }
        tags:
          type: array
          items: { type: string }
          description: >
            Tag NAMES, deduplicated and sorted, taken from every version of
            the application (repos/applications.go List, tagsExpr). ALWAYS
            present: an application with no tags carries an empty array, not
            null and not an absent key (issue 841). Only the LIST response
            fills it; Get and Create build their own maps.
        folder_id: { type: string }
        status: { type: string }
        metadata:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `map[string]any` field on the domain struct
            (internal/domain/applications/types.go:21), emitted verbatim.
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: >
            When the agent last changed. ALWAYS present despite the omitempty
            tag — encoding/json never omits struct types. It used to be the
            zero sentinel "0001-01-01T00:00:00Z" on every row, because
            `applications` had no such column and nothing scanned one:
            migrations/tenant/0134 adds it and every write stamps it inside
            the statement that makes the change — a rename, a version save, a
            new version, a version delete and a default-version change
            (repos/applications.go). A request that changes nothing does not
            move it.
        created_by: { type: string }
        owner_id: { type: string }
        authors:
          type: array
          items: { $ref: '#/components/schemas/Author' }
        is_forked: { type: boolean }
        meta:
          type: object
          nullable: true
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): APP-level `applications.meta` jsonb blob
            (repos/applications.go:68 SELECT, :114-118 unmarshal) — a
            DIFFERENT column from the version-level
            application_versions.meta that VersionMeta documents; null when
            the Go map is nil. Channel-B fixture recommended (M1).
        has_interrupt: { type: boolean }
        agent_type: { type: string }
      description: >
        NOTE(W2): internal/domain/applications/types.go:15-50 — required set =
        json tags WITHOUT omitempty (id, name, tags, created_at, owner_id,
        is_forked, meta, has_interrupt) PLUS updated_at, whose omitempty is
        ineffective on a time.Time (always marshaled; zero sentinel when
        unscanned). Every other omitempty field is optional (absent when
        zero-valued).

    ApplicationList:
      type: object
      required: [rows, total, page, page_size, total_pages]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/Application' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
      description: >
        NOTE(W2): internal/domain/applications/types.go:86-92 (ListResponse),
        marshaled directly by List
        (internal/api/v2/applications/handler.go:101-107).

    ApplicationVersionSummary:
      type: object
      required: [id, name, status, agent_type, created_at]
      properties:
        id:
          type: string
          description: Numeric id serialized as string (strconv.Itoa).
        name: { type: string }
        status: { type: string }
        agent_type:
          type: string
          description: >
            Kept although pylon's ApplicationVersionListModel excluded it:
            apps/elitea-web reads it off the summary to shape the version
            dropdown (pages/agents/lib/editApplicationMappers.ts
            toVersionSummaries, and its pipeline twin).
        created_at: { type: string, format: date-time }
        instructions:
          type: string
          description: >
            The version's prompt text, always present as "" when the column is
            NULL (COALESCE in getVersions). Restored for issue 844 — the
            projection dropped it, so a client reading the prompt off the
            version LIST saw null on a response that otherwise looked complete.
        meta:
          allOf: [{ $ref: '#/components/schemas/VersionMeta' }]
          nullable: true
          description: >
            application_versions.meta, the same jsonb ApplicationVersionDetail
            carries. Restored for issue 844 alongside instructions; `{}` when
            the column is NULL.
        is_default:
          type: boolean
          description: >
            Derived, not stored: true when the owning application's
            meta.default_version_id names this row. Emitted since the
            default-version bar was wired, and read by
            apps/elitea-web/src/pages/{agents,pipelines}/lib/*Mappers.ts and
            features/agents/model/useVersionBarCommands.ts — it was simply
            absent from this schema, which is why those readers cast it off the
            wire.
      description: >
        NOTE(W2): getVersions row map,
        internal/api/v2/applications/handler.go:216-243. The handler emits ALL
        eight keys on every row; `required` lists only the five the schema
        carried before issue 844, so that adding the other three stays additive
        for the generated fixtures rather than invalidating every existing one.

    VersionToolRef:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: entity_tool_mapping.id or application_tools.id
        tool_id: { type: integer }
        entity_type: { type: string }
        selected_tools:
          $ref: '#/components/schemas/SelectedTools'
        name: { type: string }
        type: { type: string }
        config:
          $ref: '#/components/schemas/ToolSettings'
        settings:
          $ref: '#/components/schemas/ToolSettings'
        author_id: { type: string }
        project_id: { type: integer }
      description: >
        NOTE(W2): two row shapes merged into one `tools` array —
        entity_tool_mapping rows carry id/tool_id/entity_type/selected_tools,
        plus the joined elitea_tools payload under `config` in
        fetchVersionDetails (applications/handler.go:256-271) but under
        `settings` in GetVersionExpanded (:1101-1114) and
        publicApplicationDetail (eliteacore/handler.go:1411-1425);
        application_tools rows carry id/name/type/settings plus author_id in
        fetchVersionDetails (:295-301), author_id+project_id in
        GetVersionExpanded (:1140-1147), and project_id WITHOUT author_id in
        publicApplicationDetail (:1445-1451). Only `id` is common to all.
        The IMPORT and the FORK echoes carry a third shape: the import names
        each link it wrote with `id`, `name` and `type` taken from the toolkit
        it imported (eliteacore/handler.go, the link phase of
        ExportImportPost) — the two literals `"custom"` and `""` that stood
        there named no toolkit at all — and the fork writes an empty list,
        because it copies no toolkit. On that import path `id` is the
        `elitea_tools` row and it is serialized as a STRING, unlike the
        integer the read paths above emit.

    VersionVariable:
      type: object
      properties:
        name:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
      description: >
        NOTE(W2): DB-backed paths always emit both keys as strings
        (applications/handler.go:318-321; eliteacore ExportImportGet :2629).
        The echo paths do NOT guarantee that: CreateVersion returns the
        client's raw variables array verbatim (applications/handler.go:
        772-778, 797 — keys may be absent entirely) and Fork rebuilds entries
        from unvalidated client maps (eliteacore/handler.go:2421-2428 —
        "name"/"value" marshal as null when missing). Hence no required list
        and nullable on both.

    VersionTag:
      type: object
      properties:
        id:
          type: integer
          description: >
            NOTE(#345): the `tags` row this association points at. The
            applications handler emits it on every version-detail read
            (versionTags, internal/api/v2/applications/handler.go). The
            export and fork echoes project name and data only, so it is
            optional. A write ignores it: the handler matches a tag by name,
            the same way pylon does
            (legacy/plugins/elitea_core/utils/application_utils.py:219-226).
        name:
          type: string
          nullable: true
        data:
          x-elitea-passthrough: >-
            NOTE(W2): DB jsonb `tags.data` round-trip
            (internal/api/v2/eliteacore/handler.go:2643-2655; fork echo
            :2426-2433 may carry null).
      description: >
        NOTE(W2): tag entries emitted by ExportImportGet
        (eliteacore/handler.go:2650-2655 — name always a scanned string
        there) and Fork's response echo (:2431-2438), which builds entries
        from unvalidated client maps: a fork payload tag without a name
        yields {"name": null, ...}. Hence name is nullable and not required.
        NOTE(#345): the same shape is now also the WRITE shape — `tags` on
        VersionWriteRequest refs this schema, matching pylon's own
        PromptTagUpdateModel (name, optional data, optional id).

    ApplicationVersionDetail:
      type: object
      required: [id, application_id, name, status]
      properties:
        id:
          type: string
          description: Numeric id serialized as string.
        application_id: { type: string }
        name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        agent_type: { type: string }
        instructions: { type: string }
        welcome_message: { type: string }
        llm_settings: { $ref: '#/components/schemas/LlmSettings' }
        meta:
          allOf: [{ $ref: '#/components/schemas/VersionMeta' }]
          nullable: true
        conversation_starters: { $ref: '#/components/schemas/ConversationStarters' }
        pipeline_settings: { $ref: '#/components/schemas/PipelineSettings' }
        author_id: { type: string }
        author: { $ref: '#/components/schemas/Author' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/VersionToolRef' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/VersionTag' }
        variables:
          type: array
          items: { $ref: '#/components/schemas/VersionVariable' }
        is_forked: { type: boolean }
      description: >
        NOTE(W2): union of the version-detail maps the handlers emit. Field
        presence varies by endpoint (hence the minimal required set):
        fetchVersionDetails always adds created_at/agent_type/instructions/
        welcome_message/llm_settings/meta/conversation_starters/
        pipeline_settings/author_id/author/tools/tags/variables
        (internal/api/v2/applications/handler.go) — `author` is the same
        {id, email, name} object the write echo carries, joined from
        auth_core__user; the read used to answer author_id alone, so a
        version's author had a name until the editor reloaded it;
        CreateVersion adds
        author + is_forked but no pipeline_settings (:783-801); UpdateVersion
        emits the 10-key subset without created_at/author/tools (:913-919);
        Fork adds is_forked and omits pipeline_settings
        (eliteacore/handler.go:2440-2456, is_forked at :2452); the import
        detail map has NO is_forked and omits created_at, but DOES carry
        meta, variables and tags — it reports what the import actually
        persisted, since the import began writing the canonical variable
        and tag stores; publicApplicationDetail omits
        variables, created_at, author and is_forked (:1460-1475).
        Empty-vs-missing: instructions and welcome_message are always
        present as "" when the DB column is NULL (COALESCE / pointer deref
        to "" — applications/handler.go:222-229).

    AttachedSkill:
      type: object
      required: [skill_id, name, description, instructions]
      properties:
        skill_id: { type: integer }
        name: { type: string }
        description: { type: string }
        instructions:
          type: string
          description: The skill body `load_skill` serves on demand.
        icon_meta:
          type: object
          nullable: true
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): NOTE(#336) — the value of skill_versions.meta ->
            'icon_meta', a jsonb column versionAttachedSkills copies without
            inspecting it (internal/api/v2/applications/handler.go:1384). It is
            null when the mapping references no skill version.
      description: >
        NOTE(#336): one entry of the runtime skill registry the SDK binds
        `load_skill` against (elitea_sdk/runtime/tools/skill_tools.py:127-131).
        It is the five-key projection pylon's `resolve_runtime_skills` produces
        (legacy/plugins/elitea_core/utils/skill_utils.py:1570-1607);
        `skill_version_id` and `version_name` are deliberately absent.

    ApplicationVersionDetailExpanded:
      allOf:
        - $ref: '#/components/schemas/ApplicationVersionDetail'
        - type: object
          properties:
            icon_meta:
              type: object
              additionalProperties: true
              x-elitea-passthrough: >-
                NOTE(W2): NOTE(#336) — lifted verbatim from the version's `meta`
                jsonb under the `icon_meta` key, which
                internal/api/v2/applications/handler.go:1314 copies without
                inspecting it. An absent or falsy value becomes `{}`, which is
                what pylon's set_icon_meta produces.
            attached_skills:
              type: array
              items: { $ref: '#/components/schemas/AttachedSkill' }
      description: >
        NOTE(#336): the body-less PATCH response — the expanded,
        secret-resolved version detail elitea-sdk fetches through
        `get_app_version_details` (elitea_sdk/runtime/clients/client.py:681-688).
        It adds `icon_meta` and `attached_skills` to the shared version detail,
        and its `tools[].settings` carry configurations already resolved against
        the project secret vault.

    ApplicationDetail:
      type: object
      required: [id, name, description, icon, owner_id, created_at, versions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        owner_id:
          type: string
          description: Populated from applications.created_by.
        created_at: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ApplicationVersionSummary' }
        version_details:
          $ref: '#/components/schemas/ApplicationVersionDetail'
      description: >
        NOTE(W2): Get response map,
        internal/api/v2/applications/handler.go:121-139. version_details is
        present only when the application has at least one version whose
        detail row loads (:132-137).

    ApplicationCreatedResponse:
      type: object
      required: [id, name, description, type, icon, owner_id, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        icon: { type: string }
        owner_id: { type: string }
        created_at: { type: string, format: date-time }
        version_details:
          $ref: '#/components/schemas/ApplicationVersionDetail'
        versions:
          type: array
          items: { $ref: '#/components/schemas/ApplicationVersionDetail' }
      description: >
        NOTE(W2): Create response map,
        internal/api/v2/applications/handler.go:465-478. version_details and
        versions (a single-element echo of version_details) appear only when
        the request carried a `versions` array (:374-463).

    ApplicationUpdatedResponse:
      type: object
      required: [id, name, description, icon, owner_id, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        owner_id: { type: string }
        created_at: { type: string, format: date-time }
        version_details:
          $ref: '#/components/schemas/ApplicationVersionDetail'
      description: >
        NOTE(W2): Update response map,
        internal/api/v2/applications/handler.go:575-611.

    ApplicationCreateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string }
        icon: { type: string }
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionWriteRequest'
          description: >
            Only versions[0] is honoured; it seeds the first version
            (internal/api/v2/applications/handler.go:374-463).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): decoded into map[string]any; only the keys above are read
        (internal/api/v2/applications/handler.go:353-364, 374-463); unknown
        keys are silently ignored.

    ApplicationUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        version:
          type: object
          required: [application_id, id]
          properties:
            application_id:
              oneOf: [{ type: string }, { type: integer }]
            id:
              oneOf: [{ type: string }, { type: integer }]
            name: { type: string }
            instructions: { type: string }
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): decoded into map[string]any; only
            application_id/id/name/instructions are read
            (internal/api/v2/applications/handler.go:502-553, 585-609).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): decoded into map[string]any; only name/description/icon/
        version are read (internal/api/v2/applications/handler.go:495-567).

    VersionWriteRequest:
      type: object
      properties:
        name:
          type: string
          description: >
            Omit the key to leave the stored name alone. An explicit empty
            string is REFUSED with a 400 on the PUT: the column is NOT NULL
            and unique per application, and the create paths substitute the
            default version name for an empty value, so a blank name is not a
            state the platform can read back (issue 824).
        agent_type:
          type: string
          description: >
            Defaults to "openai" when empty on the CREATE paths
            (handler.go:398-400, 731-733). On the PUT, omit the key to leave
            the stored value alone; an explicit empty string is REFUSED with a
            400, for the same reason as `name` (issue 824).
        instructions:
          type: string
          description: >
            Omit the key to leave the stored text alone. An explicit empty
            string CLEARS the column — it is the clearing value, since the
            property is not nullable and a client must be able to erase the
            text it wrote (issue 824).
        welcome_message:
          type: string
          description: >
            Omit the key to leave the stored text alone. An explicit empty
            string CLEARS the column, exactly as for `instructions`
            (issue 824).
        llm_settings: { $ref: '#/components/schemas/LlmSettings' }
        conversation_starters: { $ref: '#/components/schemas/ConversationStarters' }
        variables:
          type: array
          items: { $ref: '#/components/schemas/VersionVariable' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/VersionTag' }
          description: >
            NOTE(#345): the version's topical tags. Send the key to replace
            the stored set; an empty array removes every association row.
            Omit the key to leave the stored set alone. Each entry is matched
            by `name`: an existing `tags` row is reused, a new name creates
            one. Only the PUT (UpdateVersion) writes them — the two create
            paths still ignore the key, unlike `meta`, which they store.
        meta:
          allOf: [{ $ref: '#/components/schemas/VersionMeta' }]
          description: >
            A PATCH on the PUT, not the whole object. `meta` is a bag of keys
            owned by different features — `step_limit` (the number the runtime
            admits an agent on), `icon_meta`, `internal_tools`, `variables`,
            and the three fork-provenance keys — and no client sends them all.
            Send the keys you are changing; the server merges them into the
            stored object and leaves every key you omit alone. A key you DO
            send replaces its own value outright, so an empty array clears the
            array it names. Omit the property entirely to leave the whole
            object untouched. On the two create paths there is nothing to
            merge into: the object is stored as sent, with a default
            `step_limit` added when it carries none and the top-level
            `variables` folded in.
        pipeline_settings:
          allOf: [{ $ref: '#/components/schemas/PipelineSettings' }]
          description: >
            Pipeline flow-graph layout ({nodes, edges, orientation,
            layout_version}). Written verbatim to the
            application_versions.pipeline_settings jsonb column; omit the key
            to leave the stored value untouched.
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): decoded into map[string]any; the handlers read
        name/agent_type/instructions/welcome_message/llm_settings/
        conversation_starters/variables/tags/meta/pipeline_settings and
        ignore the rest (internal/api/v2/applications/handler.go:700-781,
        828-887).

    SetDefaultVersionRequest:
      type: object
      properties:
        version_id:
          type: string
          description: >
            When present and non-empty, this OVERRIDES the path segment; the
            path {version_id} is only the fallback
            (internal/api/v2/applications/handler.go:963-970). A numeric
            value fails the string decode and silently falls back to the path.
      description: >
        NOTE(W2): decode struct at
        internal/api/v2/applications/handler.go:965-970 — the body is
        optional (decode errors are ignored) and exists for old-SPA
        compatibility; router.go:343 registers only the 3-segment route.

    # ---- Admin / users / roles -----------------------------------------------
    UserRecord:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          type: string
          description: Numeric id serialized as string (fmt.Sprintf("%d")).
        email: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { type: string }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:256-258.

    UserListResponse:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/UserRecord' }
        total: { type: integer }
      description: >
        Users response map, internal/api/v2/eliteacore/handler.go's Users.
        NOTE (issue #130): this used to be the response of POST/PUT/DELETE too —
        the router mounted all four verbs on the same listing handler, so every
        write echoed the member list and changed nothing. The write verbs now
        have their own handlers and their own response shapes below.

    UserInviteRequest:
      type: object
      required: [emails, roles]
      properties:
        emails:
          type: array
          items: { type: string }
          description: Addresses to invite. An address with no account is created.
        roles:
          type: array
          items: { type: string }
          description: >
            Project role NAMES (not ids) — they must exist in
            auth_core__project_role for this project or the whole request is
            rejected with 400.
      description: >
        Wire truth from legacy/plugins/admin/api/v2/users.py's post and the
        client that was ported from it
        (features/settings/lib/users/useUsersActions.ts's useInviteUsers).

    UserInviteResult:
      type: object
      required: [msg, status, email]
      properties:
        msg: { type: string }
        status:
          type: string
          enum: [ok, error]
        email: { type: string }
        id:
          type: string
          description: Numeric id of the invited user, present only when status is ok.
        invitation_delivered:
          type: boolean
          description: >
            True when an invitation e-mail went out for this address
            (ADR-0024 WP7); false without SMTP, on a relay refusal, or on an
            error row.
        outcome:
          type: string
          enum: [invited, already_member, invalid_email, failed]
          description: >
            The machine-readable half of `msg`. pylon carried these four cases
            only in free English prose, so the reference SPA could not tell
            them apart and showed one toast for a whole batch. `status` keeps
            its two pylon values, so this field is additive: an old client
            reads the response exactly as before.
      description: >
        One element of the per-address array pylon's invite returns. The
        response carries one of these per requested address, and the whole
        response is 400 when any of them failed. A 400 therefore still means
        that the `ok` rows landed — each address is written in its own
        transaction, and one bad address does not roll back the others.

    UserRolesUpdateRequest:
      type: object
      required: [roles]
      properties:
        userId:
          type: string
          description: >
            Target user id. A batch edit sends the selected ids COMMA-JOINED in
            this one string (entities/user/model/useEditUser.ts's
            useBatchEditUsers). `id` and `ids` are pylon's own spellings and are
            accepted too.
        id: { type: string }
        ids:
          type: array
          items: { type: integer }
        roles:
          type: array
          items: { type: string }
          description: >
            The role names the users must hold after the call. This REPLACES the
            existing project role set rather than adding to it; an empty array
            is rejected (use DELETE to remove a member).
      description: Wire truth from legacy/plugins/admin/api/v2/users.py's put.

    MessageResponse:
      type: object
      required: [msg]
      properties:
        msg: { type: string }
      description: >
        pylon's acknowledgement shape — a single `msg` string.

    Role:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Numeric id serialized as string.
        name: { type: string }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:283, with global
        defaults admin/editor/viewer when the project has no roles (:289-295).

    # DEFECT, fixed here: `ModerationStatusResponse` ({status}) and
    # `IgnoredRequestBody` described the RETIRED static stub. Both schemas are
    # replaced by the three below, which model what
    # internal/api/v2/moderation/requests.go really sends and accepts. The old
    # pair typed `entity_id` as an integer. The generated TypeScript client
    # therefore forced apps/elitea-web to hash its string catalogue keys into
    # numbers. A request filed there and a request filed by the legacy UI
    # addressed two different rows for one catalogue entry.
    ModerationRequestRow:
      type: object
      required: [id, user_id, user_email, project_id, issue_type, entity_id,
                 description, status, rejection_comment, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        user_id:
          type: integer
          format: int64
          description: The author. Taken from the authenticated principal, never from the request body.
        user_email:
          type: string
          description: >
            LEFT JOIN on the auth user, so a row whose author was deleted
            still lists, with an empty address.
        project_id: { type: integer, format: int64 }
        issue_type:
          type: string
          description: The label the requesting client showed for the catalogue entry.
        entity_id:
          type: string
          description: >
            The catalogue key, an arbitrary string — `centry.moderation_state.entity_id`
            is VARCHAR (migrations/001_initial.sql:243), e.g. "inventory".
        description:
          type: string
          description: The requester's own justification.
        status:
          type: string
          enum: [pending, approved, rejected]
        rejection_comment:
          type: string
          nullable: true
          description: Required when a moderator rejects, null otherwise.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      description: >
        NOTE(W2): one `centry.moderation_state` row as
        internal/api/v2/moderation/requests.go's `requestRow` marshals it
        (:163-175).

    ModerationRequestList:
      type: object
      required: [total, rows]
      properties:
        total:
          type: integer
          description: >
            On the per-entity route this is `len(rows)`, not a page total —
            the route answers with the caller's own rows for one entity and
            takes no paging parameters
            (internal/api/v2/moderation/requests.go:594).
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ModerationRequestRow'
          description: Newest first, so the current state is `rows[0]`.
      description: >
        NOTE(W2): internal/api/v2/moderation/requests.go:594 —
        `{"total": len(rows), "rows": rows}`.

    ModerationRequestCreate:
      type: object
      required: [issue_type, description]
      properties:
        issue_type:
          type: string
          maxLength: 256
          description: >
            The label of the catalogue entry. Required; a longer value is
            refused with 400 because the column is VARCHAR(256).
        description:
          type: string
          description: The requester's justification. Required.
        status:
          type: string
          enum: [pending]
          description: >
            Accepted only as "pending", and refused with 400 otherwise — a
            requester may not file an already-approved request. The value is
            never applied: the server always stores "pending"
            (internal/api/v2/moderation/requests.go:666-681).
      description: >
        NOTE(W2): the fields internal/api/v2/moderation/requests.go's
        `requestCreateBody` (:602-608) reads. Two more fields are decoded only
        so they can be refused, and neither is modeled here because no client
        should send one: `user_id` is refused with 400 (the author is the
        authenticated caller), and a non-empty `meta` is refused with 400 (an
        absent, null or empty one is tolerated for the two shipped clients).
        `project_id` and `entity_id` come from the path.

    PlatformSettings:
      type: object
      required: [chat_enabled, applications_enabled, skills_enabled,
                 toolkits_enabled, datasources_enabled, pipelines_enabled,
                 publishing_enabled, moderation_enabled, mcp_enabled,
                 support_chat_enabled]
      properties:
        chat_enabled: { type: boolean }
        applications_enabled: { type: boolean }
        skills_enabled: { type: boolean }
        toolkits_enabled: { type: boolean }
        datasources_enabled: { type: boolean }
        pipelines_enabled: { type: boolean }
        publishing_enabled: { type: boolean }
        moderation_enabled: { type: boolean }
        mcp_enabled: { type: boolean }
        support_chat_enabled: { type: boolean }
        mcp_in_menu_enabled:
          type: boolean
          description: >
            A14 (issue 200): the second half of the MCP switch pair. The reference's
            platform_settings returns `mcp_exposure_enabled` and
            `mcp_in_menu_enabled` (legacy elitea_core/api/v2/platform_settings.py:45-46)
            and every `useIsMcpVisible` hook in apps/elitea-web documents this
            key as the one it wanted and could not find. Now written by the
            admin Features page's MCP Configuration section and marshalled from
            `centry.platform_config`. Optional rather than required: it is
            always present in the response, but a client pinned to an older
            deployment must not fail validation on its absence.
        voice_features_enabled:
          type: boolean
          description: >
            A14 (issue 200): written by the admin Features page's Voice
            Features section and read by widgets/chat's VoiceButton, which is
            mounted on /chat through ChatBox's slot bundle. It replaced a
            module constant hardcoded to `true`, so the admin switch had no
            effect on the control it names. Optional for the same reason as
            mcp_in_menu_enabled.
        voice_features_temporarily_disabled:
          type: boolean
          description: >
            A14 (issue 200): the second voice flag. Leaves the control VISIBLE
            but non-interactive with an admin tooltip, which the button already
            renders (`tooltipAdminDisabled`) against a constant hardcoded to
            `false`.
        is_publish_blocked:
          type: boolean
          description: >
            The AGENT publishing guardrail, as authored on the admin Features
            page (Agent Publishing) and enforced by
            `POST /elitea_core/publish/prompt_lib/{project_id}/{version_id}`.
            Published so the product UI can gate its Publish control on the same
            answer the handler enforces, rather than rendering an enabled button
            into a 403. Optional for the same reason as mcp_in_menu_enabled.
        publish_whitelist_project_ids:
          type: array
          items:
            type: integer
          description: >
            The projects that may still publish agents while the switch above is
            on. An EMPTY list while blocked means nobody may publish — it is not
            "no restrictions" — which is why the list is published rather than a
            resolved boolean: a client that has it can also say why the control
            is off.
        is_skill_publish_blocked:
          type: boolean
          description: >
            The SKILL publishing guardrail, authored on the admin Features page
            (Skill Publishing) and enforced by
            `POST /elitea_core/publish_skill/...`. Independent of
            `is_publish_blocked`: the two are separate sections with separate
            switches, and freezing one does not freeze the other. Admin
            publishes from the public project itself are exempt from both.
        skill_publish_whitelist_project_ids:
          type: array
          items:
            type: integer
          description: >
            The projects that may still publish skills while the switch above is
            on, with the same empty-list-means-nobody rule as the agent
            whitelist.
        blocked_toolkits:
          type: array
          items:
            type: string
          description: >
            The guardrails blocklist, as canonical comparison keys (lowercased,
            every non-alphanumeric character stripped, so `GitHub`, `git_hub`
            and `github` are one key). Written by the admin Configuration
            page's Guardrails section and marshalled from
            `centry.platform_config`.


            It is published so the product UI can mark an EXISTING toolkit
            blocked. The server deliberately does not filter the toolkit
            instance list: an administrator who blocks `github` must still be
            able to see and delete the github toolkits that already exist, or
            their settings and vault references are stranded behind no surface
            at all. A client shown those rows needs to know which of them are
            blocked, or it renders a toolkit as usable that no agent will run.


            Canonical keys rather than the operator's raw strings, because the
            list is for COMPARISON and never for display. Sending the raw values
            would make correctness depend on the client repeating a
            normalisation rule it can only get wrong.


            Optional for the same reason as mcp_in_menu_enabled: it is always
            present in the response, but a client pinned to an older deployment
            must not fail validation on its absence.
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): the ten boolean defaults (always present) are overlaid with
        arbitrary keys from the project's environment_settings configuration
        row (internal/api/v2/eliteacore/handler.go:51-81, merge at :74-76).
        Channel-B fixture recommended (M1). Two keys are ALWAYS present and
        are objects rather than overlay values: `dedicated_banner` and
        `maintenance`, both written by handler.go:274 from
        internal/platformconfig. `maintenance` carries `enabled`, `title`,
        `message`, `html` and `bypass`; `html` is the operator's own splash
        body (empty unless authored) and every renderer sanitises it.
      description: >
        NOTE(W2): defaults at eliteacore/handler.go:52-63 — the ten booleans
        are built unconditionally and the DB overlay (:74-76) can only add or
        override, never delete, so they are always present (hence required).
        On the sole documented route (project-less) the DB branch is skipped
        entirely and the response is exactly the ten booleans.

    SupportAssistantConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >
            Whether the widget should render AT ALL. It is `true` only when the
            operator enabled the section, a hidden support project exists, and a
            support agent has been chosen — an assistant that cannot answer is
            reported as disabled rather than as enabled-and-broken.
        title: { type: string }
        welcome_message: { type: string }
        placeholder: { type: string }
        support_project_id:
          type: integer
          format: int64
          description: >
            The hidden project support conversations live in. It is an OUTPUT
            only, echoed so the widget can build the project-scoped execution
            event-stream URL; no support route accepts a project from a client.
        user:
          $ref: '#/components/schemas/SupportAssistantUser'
      description: >
        Only `enabled` is required. A disabled deployment answers `{"enabled":
        false}` and NOTHING ELSE — no project id, no operator strings, no
        identity — so a feature that is off is not also a disclosure channel.

    SupportAssistantUser:
      type: object
      description: The CALLER's own identity, for the avatar beside their messages.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatar:
          type: string
          description: Empty when the user has no avatar, or when the lookup failed.

    SupportConversation:
      type: object
      required: [id, uuid, name, author_id, source]
      properties:
        id: { type: integer, format: int64 }
        uuid: { type: string, format: uuid }
        name: { type: string }
        is_private: { type: boolean }
        author_id: { type: integer, format: int64 }
        source:
          type: string
          description: Always `support` on this surface.
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): DB jsonb column `chat_conversations.meta`, re-emitted
            verbatim (internal/api/v2/supportassistant/store.go:323). The
            support routes WRITE a fixed document into it — `is_hidden`,
            `conversation_type`, `internal_tools` — but the column is shared with
            the chat surface, which stores a context-strategy block and whatever
            else a conversation accumulates, so the key set is not fixed by this
            feature and typing it here would describe only the rows this feature
            created.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        message_groups_count: { type: integer }

    SupportConversationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupportConversation' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
      description: >
        The CALLER's conversations only. The support project is shared by every
        user on the platform, so the listing is predicated on `author_id`; a
        caller never sees another user's support transcript.

    SupportConversationDetails:
      allOf:
        - $ref: '#/components/schemas/SupportConversation'
        - type: object
          properties:
            message_groups:
              type: array
              description: >
                The transcript, in the same message-group shape the chat surface
                renders.
              items:
                type: object
                additionalProperties: true
                x-elitea-passthrough: >-
                  NOTE(W2): the chat surface's own message-group document,
                  produced verbatim by
                  internal/infra/db/repos/conversations.go:947 and passed
                  through unchanged. It is a map assembled per message
                  ITEM TYPE — text, tool call, canvas, thinking step — so it has
                  no fixed key set, and this facade deliberately does not
                  reshape it: a support transcript and a chat transcript are the
                  same rows, and a second schema for them would be a second
                  thing to keep in step with the message model.
            participants:
              type: array
              items:
                type: object
                additionalProperties: true
                x-elitea-passthrough: >-
                  NOTE(W2): internal/api/v2/conversations.Participant, produced
                  by internal/infra/db/repos/conversations.go:136 and passed
                  through unchanged. Its `entity_meta`, `meta` and
                  `entity_settings` are
                  jsonb columns whose contents differ per entity kind (user,
                  application, llm), so the row is open by construction.

    SupportAssistantContext:
      type: object
      description: >
        The page context the widget collects — which screen the user is on, and
        what they are looking at. Ported field-for-field from
        legacy/plugins/support_assistant/models/pd/support.py.
      properties:
        assistant_name: { type: string }
        assistant_version: { type: string }
        project_id: { type: integer, format: int64 }
        project_name: { type: string }
        current_page: { type: string }
        current_entity_type: { type: string }
        current_entity_id: { type: integer, format: int64 }
        current_entity_name: { type: string }
        selected_provider: { type: string }
        selected_model: { type: string }
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the reference's own free-form escape hatch
            (legacy/plugins/support_assistant/models/pd/support.py:5's
            `meta: Optional[Dict[str, Any]]`). It is CLIENT-SUPPLIED context
            that the server never interprets — it is serialised into the text
            the agent is given — so there is no key set to declare. Nothing is
            authorized on it.

    SupportPredictRequest:
      type: object
      required: [content, question_id]
      properties:
        content:
          type: string
          minLength: 1
        question_id:
          type: string
          format: uuid
          description: >
            A lowercase UUID identifying THIS TURN, generated by the client. It
            is required rather than server-generated because the execution
            pipeline derives the turn's message identifiers from it
            deterministically, which is what makes a retried POST resume the
            same turn instead of billing a second agent run.
        support_assistant_context:
          $ref: '#/components/schemas/SupportAssistantContext'
      description: >
        Carries NO project, NO agent and NO LLM settings. The assistant answers
        with the agent the OPERATOR chose; a client that could name one could run
        any application in the support project against platform credentials.

    SupportPredictResponse:
      type: object
      required: [execution_id, events_url]
      properties:
        task_id: { type: string }
        execution_id: { type: string }
        command_id: { type: string }
        response_message_id: { type: string }
        events_url:
          type: string
          description: >
            The SSE stream to subscribe to for this turn, identical in shape to
            the one the chat surface uses. The reference streamed this over
            socket.io (`sio/support.py`); this service has no socket.io server.
        created: { type: boolean }

    # ---- Analytics -------------------------------------------------------------
    AnalyticsKpis:
      type: object
      # NOTHING IS REQUIRED. Which figures a deployment can report depends on
      # what its corpus produces, and the whole point of the analytics rework
      # (issue #303, and the 0099 request log that made half of it answerable)
      # is that a figure with no producer is ABSENT rather than present and
      # zero. A required list here would force the server to publish a zero for
      # every gap, which is the defect the endpoint was rebuilt to stop making.
      # A client renders an absent key as "no data", never as 0.
      properties:
        ai_active_users:
          type: number
          description: >
            Distinct identities that called a model in the window, from
            gateway.llm_request_logs (shared migration 0099). CALLERS, not
            members: it includes a removed member, a global administrator and a
            service token, all of which are real usage and none of which appear
            in total_project_users. It is therefore NOT the numerator of
            adoption_rate — see active_project_members.
        active_project_members:
          type: number
          description: >
            The intersection of ai_active_users and the project's membership,
            and the numerator of adoption_rate. Absent whenever
            total_project_users is: the two are measured in one statement,
            because a numerator and a denominator taken from two snapshots can
            disagree.
        total_project_users:
          type: number
          description: >
            The project's distinct membership. ABSENT when the identity tables
            (public.auth_core__user_role / auth_core__project_role) are not
            present — they belong to another corpus, and an adoption rate over
            an invented denominator is a percentage of nothing.
        adoption_rate:
          type: number
          description: >
            active_project_members / total_project_users, as a percentage to one
            decimal. Absent whenever its denominator is, and for a project whose
            membership is zero. It cannot exceed 100 — its numerator is a subset
            of its denominator by construction, which the earlier
            ai_active_users / total_project_users form was not (a project with
            one member and three non-member callers reported 300).
        llm_calls:
          type: number
          description: >
            Requests the gateway served in the window. A real per-call count —
            NOT the budget accumulator's count of billing periods, which
            /analytics_costs is careful to publish as `rows`.
        total_tokens:
          type: number
          description: Prompt plus completion tokens, summed over the window.
        # DISCLOSURE-CHECK: present `INSERT INTO centry.audit_events` in services/elitea-main/internal/audit
        # DISCLOSURE-CHECK: absent `kpis["unique_users"]` in services/elitea-main/internal/api/v2/analytics
        unique_users:
          type: number
          description: >
            NO PRODUCER, and the reason changed. "Active in the project by any
            means" needs a source of non-LLM activity. centry.audit_events is
            no longer READ-ONLY from this service — issue 615 gave it a writer
            (internal/audit/postgres.go:23, driven by
            internal/api/middleware/audit.go) — but that writer records
            ADMINISTRATIVE and security-relevant requests only. It skips
            content CRUD, it skips every successful GET and it skips the /llm
            path, so a count over it measures administration, not project
            activity. Never emitted today.
        # DISCLOSURE-CHECK: absent `kpis["tool_runs"]` in services/elitea-main/internal/api/v2/analytics
        tool_runs:
          type: number
          description: >
            NO PRODUCER. p_<id>.chat_message_trace_step records a tool_name but
            no toolkit_id and covers chat turns only, so a count built from it
            would silently exclude every tool call made outside a chat. Never
            emitted today.
        # DISCLOSURE-CHECK: absent `kpis["chat_msgs"]` in services/elitea-main/internal/api/v2/analytics
        chat_msgs:
          type: number
          description: NO PRODUCER. Never emitted today.
        # DISCLOSURE-CHECK: absent `kpis["agent_runs"]` in services/elitea-main/internal/api/v2/analytics
        agent_runs:
          type: number
          description: >
            NO PRODUCER. It used to be emitted as a copy of llm_calls, which is
            a LARGER claim than zero: it asserts that every LLM call is an agent
            run. elitea_runtime.execution_jobs is project-scoped by two
            different columns and records no token or duration figures. Never
            emitted today.
        total_cost:
          type: number
          description: >
            NOT EMITTED BY THIS ENDPOINT. Money has one producer
            (gateway.llm_budget_accumulators) and one view of it
            (/analytics_costs), which carries the scope rules that stop it
            double-counting a user-scope row into its own project's total. A
            second view here could disagree with the first.
      description: >
        The overview KPI block. Every key present is a figure the server
        measured; every key absent is one nothing in this platform produces.
        Source: internal/api/v2/analytics/handler.go's Usage.

    ModelUsage:
      type: object
      required: [model, provider, prompt_tokens, completion_tokens, run_count]
      properties:
        model: { type: string }
        provider: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        run_count: { type: integer }
      description: >
        One (provider, model) pair's share of the window, from
        gateway.llm_request_logs. There is NO total_cost: the accumulator that
        holds money is keyed by (scope, scope_id, period) and carries no model
        dimension, so a per-model cost cannot be derived from anything this
        platform writes — and a zero would read as "this model was free".
        Requests that never resolved a model are counted in kpis.llm_calls and
        excluded here; a nameless bar on the chart is not something an operator
        can act on.

    AnalyticsHealth:
      type: object
      required: [requests, errors, error_rate, by_error_code, error_codes_truncated, by_model, daily]
      properties:
        requests:
          type: integer
          description: Requests the gateway served in the window, whatever happened to them.
        errors:
          type: integer
          description: >
            Requests that failed — status >= 400, the same predicate shared
            migration 0099's partial index idx_llm_request_logs_errors is built
            on. NOTHING ELSE IN THIS PLATFORM RECORDS THEM: the billing ledger
            (gateway.llm_usage_events) is written from a billing delta, and a
            delta rides only a BILLED request, so a call refused by a budget,
            rejected by a policy, addressed to an unresolvable model or failed
            upstream is absent from it entirely.
        error_rate:
          type: number
          description: >
            errors / requests, as a percentage to one decimal. 0 for a window
            with no traffic — nothing failed — rather than absent or NaN.
        by_error_code:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsErrorCodeCount' }
        error_codes_truncated:
          type: boolean
          description: >
            True when `by_error_code` was cut. It sits beside an UNCAPPED
            `errors` total, so a silent cut leaves an operator reconciling the
            two with failures belonging to no listed classification.
        by_model:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsModelHealth' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsDailyHealth' }
      description: >
        The Health tab's block, from gateway.llm_request_logs. Travels on the
        usage response because AnalyticsContainer fetches /analytics for the
        Overview and Health tabs alike. ABSENT — not empty — when the repository
        could not build it: a block with zero totals is the true report of an
        idle project, and reusing that shape for "we could not look" would make
        the two indistinguishable.

    AnalyticsErrorCodeCount:
      type: object
      required: [error_code, requests]
      properties:
        error_code:
          type: string
          description: >
            The gateway's OWN classification, never an upstream string — 0099
            has no column a provider's error text can reach, which is structural
            rather than a policy: upstream errors routinely quote the offending
            fragment of the request back, and a request is user-authored free
            text. `unclassified` covers a failure the gateway returned without
            assigning a code; those rows are reported rather than dropped, or
            the breakdown would not account for every error the headline counts.
        requests: { type: integer }

    AnalyticsModelHealth:
      type: object
      required: [provider, model, streaming, requests, errors, error_rate, avg_duration_ms, p95_duration_ms]
      properties:
        provider: { type: string }
        model: { type: string }
        streaming:
          type: boolean
          description: >
            PART OF THE KEY, not a column. 0099's own header records that a
            streamed and a buffered request of the same model have very
            different latency profiles and that averaging them makes both
            unreadable — a streamed duration is the whole stream, seconds where
            a buffered call is milliseconds. One row per model would report a
            number describing neither, moving whenever the mix moved rather than
            when the service did.
        requests: { type: integer }
        errors: { type: integer }
        error_rate: { type: number }
        avg_duration_ms:
          type: number
          description: Wall-clock milliseconds, handler start to response complete.
        p95_duration_ms:
          type: number
          description: >
            Reported alongside the mean because the mean is what hides the tail
            an operator investigating "chat feels slow" came to look at.
            percentile_cont, so a small group interpolates rather than jumping
            to its slowest member.
      description: >
        One (provider, model, streaming) triple's reliability and latency.
        Requests that never resolved a model are counted in the health totals
        and excluded here — real traffic, but not a model's, and a nameless row
        is not something an operator can act on.

    AnalyticsDailyHealth:
      type: object
      required: [date, requests, errors]
      properties:
        date: { type: string, description: 'UTC day, YYYY-MM-DD.' }
        requests: { type: integer }
        errors: { type: integer }
      description: >
        One UTC day of the window. Days with no traffic are absent rather than
        zero-filled, for the reason AnalyticsDailyPoint gives.

    AnalyticsDailyPoint:
      type: object
      required: [date, llm_calls, total_tokens, active_users]
      properties:
        date: { type: string, description: 'UTC day, YYYY-MM-DD.' }
        llm_calls: { type: integer }
        total_tokens: { type: integer }
        active_users: { type: integer }
      description: >
        One UTC day of the window. Days with no traffic are ABSENT rather than
        zero-filled — the client knows the window it asked for and can draw the
        gap itself, whereas a zero-filled day is indistinguishable from a day
        the server failed to read.

    ProjectAnalytics:
      type: object
      required: [kpis, top_ai_users, daily_activity, models, models_truncated]
      properties:
        kpis: { $ref: '#/components/schemas/AnalyticsKpis' }
        top_ai_users:
          type: array
          items: { $ref: '#/components/schemas/UserActivity' }
          description: The leaderboard, most calls first, capped at 10 rows.
        daily_activity:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsDailyPoint' }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelUsage' }
        models_truncated:
          type: boolean
          description: >
            True when `models` was cut to the busiest N (provider, model) pairs.
            Stated rather than implied because the client SUMS that array to
            normalise its share column: a cut it cannot see makes every share a
            percentage of the subset rather than of the project, adding to 100%
            over part of the traffic, beside a kpis.llm_calls figure carrying the
            real total.
        health:
          $ref: '#/components/schemas/AnalyticsHealth'
      description: >
        The Overview tab's response, and the Health tab's — one fetch serves
        both. Answers 501 with
        `{error, code: no_data_source, detail}` on a deployment whose gateway
        request log is absent — a FINAL status, not a 500, so a client that
        retries transient failures does not ask twice for an answer the server
        has already refused.

    AgentAnalytics:
      type: object
      required: [application_id, name, run_count, avg_duration_ms, total_tokens, error_rate]
      properties:
        application_id: { type: string }
        name: { type: string }
        run_count: { type: integer }
        avg_duration_ms: { type: number }
        total_tokens: { type: integer }
        error_rate: { type: number }
      description: NOTE(W2) internal/domain/analytics/types.go:22-29.

    ToolAnalytics:
      type: object
      required: [toolkit_id, toolkit_name, tool_name, run_count, error_count, avg_duration_ms, error_rate]
      properties:
        toolkit_id:
          type: string
          description: >
            EMPTY when the producer did not know one. The two producers know
            different halves of a toolkit's identity: an explicit tool run holds
            the saved toolkit's row id, and an agent turn holds only the toolkit
            NAME its tool metadata carried. A row with a name and no id is a real
            measurement, not a broken one — resolving the name to an id at write
            time would store a guess as a fact (issue 618).
        toolkit_name:
          type: string
          description: The toolkit as the producer knew it. Empty when it knew only an id.
        tool_name: { type: string }
        run_count:
          type: integer
          description: >
            Calls in the window, one per tool call. A call still running counts;
            a call re-projected by a streaming turn counts ONCE.
        error_count: { type: integer }
        avg_duration_ms:
          type: number
          description: >
            Averaged over the calls that FINISHED. A call still running has no
            duration, and counting it as zero would pull the average toward zero
            exactly when a tool has started hanging.
        error_rate: { type: number }
      description: >
        One row of the Tools tab, from elitea_runtime.tool_call_records (shared
        migration 0119) grouped by (toolkit_id, toolkit_name, tool_name).
        Source — internal/domain/analytics/types.go.

