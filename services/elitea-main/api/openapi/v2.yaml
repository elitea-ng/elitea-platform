  # ==========================================================================
  # APPLICATIONS — list / create
  # ==========================================================================
  /elitea_core/applications/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listApplications
      summary: List applications for a project
      description: |
        NOTE(W2): internal/api/v2/applications/handler.go:83-119 — the
        response is the domain ListResponse (types.go:105-111). The handler
        also reads query/search, tags, folder_id, agents_type.
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: query
          in: query
          schema: { type: string }
          description: Search text (preferred over `search` by the handler).
        - name: tags
          in: query
          schema: { type: string }
          description: >
            Comma-separated tag filter. Each entry matches a tag NAME or a tag
            ID. The entries combine with AND: a listed application carries
            every named tag on one of its versions. Blank entries are ignored
            (repos/applications.go splitTagFilter).
        - name: folder_id
          in: query
          schema: { type: string }
        - name: agents_type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createApplication
      summary: Create a new application shell
      description: |
        NOTE(W2): internal/api/v2/applications/handler.go:345-479 — responds
        201 (not 200) with the created shell; versions[0] in the body seeds
        the first version.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreatedResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/admin_published_agents/administration:
    get:
      operationId: listAdminPublishedAgents
      summary: List the agents this deployment has published
      description: |
        The admin dashboard's published-agents view — not the catalogue the
        product's Agents page reads. It reports every application in the PUBLIC
        project that has at least one `published` version, with those versions,
        who published each and when, newest first.

        Draft versions are excluded from `published_versions`, and an
        application with only drafts does not appear at all.

        `adoption` is null-valued unless the agent's `meta.adoption` has been
        written; see PublishedAgentAdoption for why it is not defaulted to
        zeroes.
      tags: [admin]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 1-based. A page past the end is an empty page.
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, name]
            default: created_at
          description: Always descending. Any other value falls back to created_at.
      responses:
        '200':
          description: Published agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedAgentsListing'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/public_applications/prompt_lib:
    get:
      operationId: listPublicApplications
      summary: List published applications visible without project membership
      description: |
        The public catalogue. Answers `{rows, total}` where `total` counts the
        FILTERED set, not the whole catalogue, so a client can page through it.

        Every parameter below is read by
        internal/api/v2/eliteacore/public_applications.go. A `sort_by`,
        `sort_order`, `agents_type` or `statuses` value outside its allowlist,
        or a `limit`/`offset` outside its range, is refused with 400 and a body
        naming the parameter — it is never silently ignored. The 400 is NOT
        declared as a response here: `eliteaFetch` throws on every non-2xx, so
        this codebase keeps generated response types 200-only (see
        apps/elitea-web/src/pages/agents/Latest.tsx).

        Trending (`trend_start_period`/`trend_end_period`) is the one pylon
        parameter still missing here.
      tags: [applications]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: category
          in: query
          schema: { type: string }
          description: >
            Marketplace category filter, matched against the published
            version's `meta.category`. The value `Other` also takes in every
            agent with no category at all.
        - name: query
          in: query
          schema: { type: string }
          description: >
            Case-insensitive substring search over the application name and
            description.
        - name: statuses
          in: query
          schema: { type: string }
          description: >
            Comma-separated version statuses (published, draft, on_moderation,
            rejected, embedded). The catalogue only holds published versions,
            so this narrows that set; a list without `published` answers no
            rows.
        - name: agents_type
          in: query
          schema:
            type: string
            default: all
          description: >
            One of `all`, `classic` or `pipeline`. `pipeline` keeps only
            pipeline agents, `classic` keeps everything else, `all` (the
            default) keeps both. Any other value is refused with 400.

            The allowed set is stated here rather than as an OpenAPI `enum`
            on purpose: an `enum` of `asc`/`desc` on a second operation makes
            oapi-codegen rename the FIRST operation's generated constants,
            which turns a two-parameter spec addition into a repository-wide
            generated diff. The handler's own allowlist
            (public_applications.go) is the enforcement point.
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
          description: >
            Sort key — one of `id`, `name`, `created_at` or `likes`. Ties
            break on the application id descending, so paging stays stable.
            Any other value is refused with 400.
        - name: sort_order
          in: query
          schema:
            type: string
            default: desc
          description: >
            `asc` or `desc`. Any other value is refused with 400.
        - name: my_liked
          in: query
          schema: { type: boolean }
          description: >
            Keep only the applications the CALLER has liked. A request with no
            user identity answers no rows rather than the generic list.
      responses:
        '200':
          description: Published applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicApplicationList'

