        not read. The document carries a top-level `skills` array when a
        version of the application is attached to a skill (:3535-3541).
      tags: [applications]
      parameters:
        - name: fork
          in: query
          schema: { type: boolean }
        - name: as_file
          in: query
          schema: { type: boolean }
          description: Serve as attachment (read at handler.go:3557).
        - name: follow_version_ids
          in: query
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
          description: Old-SPA parameter; accepted but not read.
        - name: format
          in: query
          schema:
            type: string
            enum: [json, md]
          description: >
            `md` renders the same document as markdown — one file for each
            version, zipped when there is more than one
            (eliteacore/handler.go:3552-3555; the renderer is
            eliteacore/export_markdown.go:649). It is checked BEFORE
            ?as_file=, which the markdown branch does not honour: a markdown
            export always carries a Content-Disposition. Every other value,
            and an absent parameter, emit JSON. The enum records what the SPA
            actually sends: `md`, not `markdown`
            (apps/elitea-ui/src/api/applications.js:592).
      responses:
        '200':
          description: Export document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationExportResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

