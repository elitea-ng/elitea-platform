  /elitea_core/analytics_agent_detail/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsAgentDetail
      summary: Detailed analytics for a specific agent within a project
      description: |
        NOTE(W2): same handler as listAnalyticsAgents; the detail envelope is
        returned only when ?application_id= or ?agent_id= is present
        (analytics/handler.go:75-88). The old SPA sends `entity_id`
        (apps/elitea-ui/src/[fsd]/features/analytics/api/analyticsApi.js:134),
        which the handler does NOT read — so the SPA's agent-detail call
        currently receives the {items} list shape. Live parity defect,
        recorded not fixed (N2 forbids handler changes); the new app should
        send application_id.
      tags: [analytics]
      parameters:
        - name: application_id
          in: query
          schema: { type: string }
          description: Dispatch parameter read by the handler (handler.go:75).
        - name: agent_id
          in: query
          schema: { type: string }
          description: Dispatch parameter read by the handler (handler.go:75).
        - name: entity_id
          in: query
          schema: { type: string }
          description: >
            What the old SPA actually sends (analyticsApi.js:134) — accepted
            but NOT read by the handler, so it does not select the detail
            envelope.
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: >
            Detail envelope when application_id/agent_id is present; the list
            shape otherwise — including for the old SPA's entity_id call.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AnalyticsDetailEnvelope'
                  - $ref: '#/components/schemas/AnalyticsAgentsList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/analytics_costs/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getAnalyticsCosts
      summary: LLM cost breakdown for a project
      description: |
        Reads gateway.llm_budget_accumulators — the rows elitea-scheduler's
        budgetwriteback consumer folds the gateway's GATEWAY_BUDGET_DELTAS
        stream into. That is the platform's single accounting path, and the
        same rows the usage and project-budget reads report, so the three
        cannot disagree about money.

        `total_cost` sums PROJECT-scope rows only. A narrower scope (a
        user-scope row for the same project) is a subset of the project's
        spend, so summing every row would count the same dollars twice; every
        scope present is still reported under `by_scope`.

        WHAT IS ABSENT, and deliberately not zero-filled: by_model, by_agent,
        by_user, a daily trend, token counts, a call count and an average cost
        per call. A budget delta carries only {event_id, scope, scope_id,
        project_id, org_id, period_start, period_end, delta_nano_usd}, so no
        producer records those dimensions; an empty array would read as "this
        project called no models", which is false. The pylon original answered
        them from a per-call audit-event ledger that no longer exists.

        Amounts are exact decimals produced by PostgreSQL NUMERIC and are never
        round-tripped through a float.
      tags: [analytics]
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: >
            Cost breakdown over the requested window. Accumulator periods
            OVERLAPPING the window are included, because a period is a whole
            billing month and the default seven-day window sits inside one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsCostBreakdown'
        '400':
          description: The project id was not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  # ==========================================================================
  # CHAT — execution-step traces
  # ==========================================================================
  /elitea_core/canvas/prompt_lib/{project_id}/{canvas_id}/presence:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: canvas_id
        in: path
        required: true
        schema: { type: string }
        description: >
          The canvas message item, by its integer row id OR by its uuid. Both
          forms reach this segment: the SPA carries `canvas_uuid`
          (shared/api/socket/rooms.ts) while the canvas READ is called with the
          row id.

    post:
      operationId: heartbeatCanvasPresence
      summary: Announce that this caller has a canvas open, and read the roster
      description: |
        Canvas editor presence WITHOUT a socket server (issue 622, decided in issue 615).
        Two people editing one canvas was last-write-wins and silent.

        This is a HEARTBEAT. The SPA calls it on mount, on a timer at a third of
        `ttl_seconds`, on `visibilitychange`, and once with `state: "left"` on
        unmount. The answer is the roster, and the same roster is published as a
        `canvas.editors` event on the project's existing SSE channel — the one
        GET /elitea_core/events/prompt_lib/{project_id} serves — so the other
        tabs learn about it without polling.

        THE CHANNEL NAME IS UNDERIVABLE FROM CLIENT INPUT. It is built from the
        `{project_id}` of this mount pattern, which
        `RequireResolvedPermissions` has already gated. The deleted socket
        prototype's room was `"canvas:" + canvas_id` with NO project component,
        and canvas ids are per-tenant-schema integers, so canvas 42 in project 1
        and canvas 42 in project 7 were the same room by construction.

        A PROJECT PREFIX ALONE IS NOT ENOUGH. `{canvas_id}` is resolved INSIDE
        `schema({project_id})` before anything is published; a canvas that does
        not live in this project is a 404 and publishes nothing.

        NOTE(issue 622): internal/api/v2/canvaspresence. Gated on
        `models.chat.canvas.details` — the string the canvas READ already takes,
        because announcing presence on a canvas is not a wider claim than
        opening it, and reusing it means this route needs no migration and 403s
        nobody who can already open the canvas.

        NOT A LOCK. The canvas WRITE route does not consult this roster. The SPA
        uses it to go read-only, which is what the reference user saw, but the
        server refuses no write on it — a lock enforced on one side only would
        be a control that looks live and never fires.
      tags: [chat]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanvasPresenceRequest'
      responses:
        '200':
          description: The live roster for this canvas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasPresence'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: >
            No canvas with this id inside this project's tenant schema. This is
            the cross-project refusal, not only a typo path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }


  # -------------------------------------------------------------------------
  # Agent Evaluation slice 2 (#617): the dataset, the run and the read-only
  # scorecard. Thirteen operations.
  #
  # The DIMENSION LIBRARY (slice 1) is deliberately NOT described here. Its four
  # routes are served (internal/api/v2/evaluation/dimension.go) and its client
  # is hand-written; describing them is a separate, purely additive change and
  # belongs with whoever moves that client onto the generated one.
  #
  # STILL UNBUILT AND THEREFORE ABSENT — not stubbed, not 200-with-nothing: the
  # suite and binding families, the dataset import, the conversation promote,
  # the human-score writes, the platform dimension catalogue and
  # `generate_eval_dimensions`. Twelve of the reference's thirty-eight
  # operations are here plus the run cancel; the rest answer 404, which is what
  # an unbuilt route should answer.
  # -------------------------------------------------------------------------
  /elitea_core/eval_datasets/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listEvalDatasets
      summary: List this project's evaluation datasets
      description: |
        "Project-wide datasets, plus this agent's" when `agent_id` is sent, and
        the project-wide ones alone when it is not. It is NOT "everything in the
        schema": a dataset authored on another agent is that agent's, and
        listing it here would put every agent's evaluation cases in every other
        agent's editor.

        NOTE(#617): internal/api/v2/evaluation. Gated on
        `models.applications.evaluation.dataset.read`, granted by
        migrations/shared/0116_evaluation_dataset_run_permissions.sql.
      tags: [applications]
      parameters:
        - name: agent_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: The dataset listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDatasetList'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: createEvalDataset
      summary: Create an evaluation dataset
      description: |
        Answers the row that was STORED, including every server-applied
        default, so a client's cache after a create is what a reload would show.
        A create that echoed the request body back would report success for
        whatever the database silently altered.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalDatasetWriteRequest'
      responses:
        '201':
          description: The stored dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDataset'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_dataset/prompt_lib/{project_id}/{dataset_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: dataset_id
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getEvalDataset
      summary: Read one dataset with a page of its cases
      description: |
        An out-of-range `limit` is REFUSED and not clamped: a silent clamp
        answers 200 with a page the caller did not ask for, and a client paging
        by `offset += limit` would then skip rows it never saw.
      tags: [applications]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The dataset and one page of its cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDatasetDetail'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: >
            No dataset with this id inside this project's tenant schema. This is
            the cross-project refusal, not only a typo path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: updateEvalDataset
      summary: Rename or re-describe a dataset
      description: |
        `application_id` is NOT writable. Scope is set once, at authoring:
        moving a dataset between agents after runs have been scored against it
        would re-file that history under an agent it never ran on.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalDatasetWriteRequest'
      responses:
        '200':
          description: The stored dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDataset'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: deleteEvalDataset
      summary: Delete a dataset and its cases
      description: |
        REFUSES with 409 while a run references the dataset. The table gives
        `eval_runs.dataset_id` an ON DELETE CASCADE — it has to, or an agent
        carrying an evaluated dataset becomes undeletable — so this refusal is
        the only thing between a casual tidy-up and the loss of every score.
      tags: [applications]
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: >
            A run is scored against this dataset. The body names the count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_dataset_cases/prompt_lib/{project_id}/{dataset_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: dataset_id
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: addEvalDatasetCase
      summary: Append one case to a dataset
      description: |
        A dataset holds at most ten cases, and the count and the insert are ONE
        statement so two concurrent writers cannot both see room. The cap is not
        cosmetic: a run performs two model calls per case, so it is what stands
        between a large paste and a bill nobody authorised. The refusal is a 409
        naming the limit, never a silent truncation — a dataset that reads as
        complete and is not would score an agent on a question it never saw.

        A CASE WRITE takes the dataset UPDATE permission, not one of its own.
        The reference declares no case permission, and a caller who may not edit
        a dataset must not be able to change what it asks.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalDatasetCaseWriteRequest'
      responses:
        '201':
          description: The stored case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDatasetCase'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No dataset with this id in this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The dataset is at its case cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_dataset_case/prompt_lib/{project_id}/{dataset_id}/{case_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: dataset_id
        in: path
        required: true
        schema: { type: string }
      - name: case_id
        in: path
        required: true
        schema: { type: string }

    put:
      operationId: updateEvalDatasetCase
      summary: Rewrite one case
      description: |
        `dataset_id` is in the storage predicate and not only in the path.
        Without it, a caller who knows any case id could edit it through any
        dataset's path and the 404 would never fire.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalDatasetCaseWriteRequest'
      responses:
        '200':
          description: The stored case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalDatasetCase'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: deleteEvalDatasetCase
      summary: Remove one case from a dataset
      tags: [applications]
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_runs/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listEvalRuns
      summary: List evaluation runs, newest first
      description: |
        Newest first is not cosmetic: the reference's run-history panel computes
        a delta against the nearest OLDER scored run, so the order is what makes
        "the previous run" mean the same thing to the client and to a reader.
      tags: [applications]
      parameters:
        - name: application_id
          in: query
          required: false
          schema: { type: integer }
        - name: dataset_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The run listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunList'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: startEvalRun
      summary: Start an evaluation run over one dataset
      description: |
        Freezes a SNAPSHOT of the named dimensions onto the run and queues a
        bounded background job inside elitea-main. The row is written FIRST and
        queued second: if the process dies between the two, the recovery sweep
        finds a `created` row and runs it, where queueing first would leave a
        job with no row for a worker to claim.

        THE SNAPSHOT IS NOT A CACHE. A dimension is editable, and the score
        normalisation divides by the scale range and flips on polarity, so a
        scorecard that re-read the live library would silently re-scale a
        finished run.

        ENGINES ARE RESTRICTED TO `ai`. A dimension that allows only `code` or
        `human` is refused with 501 and a named reason: there is no code sandbox
        in elitea-main, and a code validation that silently passed would be the
        most dangerous fallback in the feature.

        NOTE(#617): gated on `models.applications.evaluation.run.create`. There
        is no `run.cancel` string in the product's vocabulary, so the cancel
        route takes this same permission — the right that started a run is the
        right that stops it.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunStartRequest'
      responses:
        '201':
          description: The queued run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '501':
          description: >
            A named dimension cannot be scored by this release. The body says
            which engine it needs and why this release does not serve it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_run/prompt_lib/{project_id}/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: run_id
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getEvalRun
      summary: Read one run, with its progress
      description: |
        THIS IS THE PROGRESS FEED. The reference follows a run over a socket
        namespace; there is no socket server here (#126 deleted it and #615
        recorded the decision), so the client POLLS this route. `progress`
        carries `{done, total}` and the status vocabulary tells it when to stop.
      tags: [applications]
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_run_cancel/prompt_lib/{project_id}/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: run_id
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: cancelEvalRun
      summary: Stop a run
      description: |
        The ROW is written first and the in-process goroutine is signalled
        second. The write is what makes the cancel durable: a signal reaches
        only the replica executing the run, and a queued run has no goroutine at
        all. The worker's own finish refuses to move a row that is already
        terminal, so a cancellation cannot be overwritten by the walk that was
        already in flight.

        A run that has already finished answers 409, not 404: the run exists,
        and telling the caller it does not sends them looking for a missing row.
      tags: [applications]
      responses:
        '200':
          description: The cancelled run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRun'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: The run is already finished, errored or cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/eval_results/prompt_lib/{project_id}/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: run_id
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getEvalScorecard
      summary: Read a run's scorecard
      description: |
        READ-ONLY. There is no human-score write in this release, and the
        response OMITS `human_scores` rather than answering `[]` — an empty
        array tells a client "there are none" where the truth is "this
        deployment cannot have any". `unavailable` names each omission with its
        reason.

        `total` is a separate count and never `results.length`. The reference's
        pager uses `total`, `offset` and the page length together to decide
        whether it has covered every case, so a total that was really the page
        size would make a truncated scorecard claim to be complete.
      tags: [applications]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: The run, its results and what this release cannot serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalScorecard'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/message_traces/prompt_lib/{project_id}/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: listMessageTraces
      summary: Trace steps for a conversation — the pin strip under each answer
      description: |
        The LIGHT projection: labels, ordering and the bounded `attrs` display
        sidecar. The heavy fields (tool_inputs, tool_output, text, thinking)
        are detail-only and are fetched one step at a time through
        getMessageTrace, so rendering a conversation's chips never detoasts
        them.

        Rows are ordered by (started_at, id) with null timestamps last. Blank
        thinking steps — transition markers the runtime emits with an action
        but no text — are excluded, because the client draws a pin for every
        row it receives.

        `total` is null unless include_total=true, so "not counted" stays
        distinguishable from "counted zero".
      tags: [chat]
      parameters:
        - name: message_group_id
          in: query
          required: false
          schema: { type: integer }
          description: >
            Scope to a single message group. A value that is not a positive
            integer is a 400 rather than an ignored filter — dropping it would
            return the whole conversation to a caller that asked for one
            message. Omit the parameter to ask for the whole conversation.
        - name: message_group_ids
          in: query
          required: false
          schema: { type: string }
          description: >
            Comma-separated loaded message-group ids, at most 200. Duplicates
            are collapsed; a non-integer member is a 400.
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: >
            Filter by step kind. Allowed values are `tool_call` and
            `thinking_step`; anything else is a 400 rather than an empty page.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 2000, maximum: 2000 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: include_total
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Trace steps for the conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTraceListing'
        '400':
          description: >
            An unsupported kind, a malformed message_group_id, or a malformed
            message-group id list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/message_trace/prompt_lib/{project_id}/{step_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: step_id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getMessageTrace
      summary: One trace step in full, fetched on pin expand
      description: |
        The light projection plus the heavy fields.

        `message_group_id` is REQUIRED and is matched together with the step
        id: it is what confines a numeric step id to the message the caller is
        reading, so a step from elsewhere is a 404 rather than a body.
      tags: [chat]
      parameters:
        - name: message_group_id
          in: query
          required: true
          schema: { type: integer }
          description: The owning message group, from the trace-list row.
      responses:
        '200':
          description: The full trace step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTraceStepDetail'
        '400':
          description: message_group_id was missing or not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such step within that message group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  # ==========================================================================
  # PREDICT — one stateless LLM turn
  # ==========================================================================
  /elitea_core/predict_llm/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: predictLLM
      summary: Send one message straight to a model, with no agent and no tools
      description: |
        Runs a single stateless completion: no agent, no tools, no version id
        and no conversation. The turn is composed of the optional
        `instructions` as a system message, then `chat_history`, then
        `user_input` last, and is performed by the LLM gateway
        (services/elitea-llm-gateway), which resolves the project's provider
        credentials and model definitions itself.

        BLOCKING ONLY. Legacy's handler had a second, asynchronous mode
        (`await_task_timeout: 0`) that answered with a task id and delivered
        the tokens over a socket.io event. That mode is not part of this
        contract and no field selects it: every accepted request is answered
        synchronously with the generated text in the response body.
        `await_task_timeout` is honoured only as this request's deadline in
        seconds, clamped to 5..180, defaulting to 60.

        NOTE(W2): internal/api/v2/predict/handler.go PredictLLM — responds
        `{"content", "messages"}`, plus `chat_history` when the request asks
        for it.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictLLMRequest'
      responses:
        '200':
          description: The completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictLLMResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '413':
          description: The request body is above the 4 MiB bound.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >
            The LLM gateway is configured and did not complete the request.
            Distinct from 503, which means no gateway is configured at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            No completion backend is composed because LLM_GATEWAY_URL is empty.
            The route is still registered on purpose, so an unconfigured
            deployment is distinguishable from a missing route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictLLMUnavailableResponse'

