          type: integer
          minimum: 1000
        preserve_recent_messages:
          type: integer
          minimum: 1
          maximum: 99
        enable_context_editing: { type: boolean }
      description: >
        The user's default context-management settings, stored in
        centry.social_users.default_context_management (jsonb) and edited by
        Settings > Memory. Every property is optional: absent means "the user
        has no opinion", which resolves to the platform default, and is a
        different answer from an explicit false or zero. Ranges are enforced on
        write (internal/domain/contextsettings); an out-of-range value is
        refused with {"error", "field"}. `enable_context_editing` is not in
        pylon's ContextManagementModel but IS read out of the same dict by
        set_context_strategy, and the Memory page has always sent it.

