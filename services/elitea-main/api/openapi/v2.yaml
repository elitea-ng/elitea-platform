  # ==========================================================================
  # TRACING (issue #250)
  #
  # Port of legacy/plugins/tracing/api/v2/{collect,otlp,status}.py —
  # internal/api/v2/tracing/handler.go. Option (a) of the two the issue
  # offers: elitea-main proxies collect/otlp to an OTEL collector rather than
  # pointing clients straight at a collector service (see that file's package
  # doc comment for the full rationale).
  # ==========================================================================
  /tracing/collect/prompt_lib:
    post:
      operationId: collectTracesUngated
      summary: Collect UI/worker trace spans (no project context)
      description: >
        internal/api/v2/tracing/handler.go's Collect, mounted without a
        {project_id} — legacy collect.py's PromptLibAPI.post(project_id=None)
        equivalent, for callers that have not resolved a project yet.
        Authenticated only.
      tags: [tracing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracingCollectRequest'
      responses:
        '200':
          description: Spans created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracingCollectResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '503':
          description: Tracing is disabled (OTEL_SDK_DISABLED=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracing/collect/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: collectTraces
      summary: Collect UI/worker trace spans for a project
      description: >
        internal/api/v2/tracing/handler.go's Collect. Gated by
        apimw.RequireProjectAccess (project membership), the same gate
        internal/api/v2/social's plugin routes use — see the handler
        package's doc comment for why this does not reuse legacy's
        `models.monitoring.tracing.collect` permission.
      tags: [tracing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracingCollectRequest'
      responses:
        '200':
          description: Spans created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracingCollectResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: >
            Tracing is disabled, or project authorization is unavailable
            (nil connection pool)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracing/otlp/prompt_lib:
    post:
      operationId: proxyOtlpTracesUngated
      summary: Reverse-proxy an OTLP/HTTP trace payload to the collector (no project context)
      description: >
        internal/api/v2/tracing/handler.go's OTLP. Byte-for-byte reverse
        proxy of the request body to
        `<OTEL_EXPORTER_OTLP_ENDPOINT>/v1/traces`, avoiding a
        browser-to-collector CORS hop — port of legacy otlp.py's proxy to
        Jaeger. Authenticated only.
      tags: [tracing]
      requestBody:
        content:
          application/x-protobuf: {}
          application/json: {}
      responses:
        '200':
          description: Relayed collector response (status/body/content-type passed through)
        '401': { $ref: '#/components/responses/401' }
        '503':
          description: Tracing is disabled, or the collector is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Collector request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracing/otlp/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: proxyOtlpTraces
      summary: Reverse-proxy an OTLP/HTTP trace payload to the collector
      description: >
        internal/api/v2/tracing/handler.go's OTLP, project-scoped variant.
        Same RequireProjectAccess gate as the collect route above.
      tags: [tracing]
      requestBody:
        content:
          application/x-protobuf: {}
          application/json: {}
      responses:
        '200':
          description: Relayed collector response (status/body/content-type passed through)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: >
            Tracing is disabled, the collector is unreachable, or project
            authorization is unavailable (nil connection pool)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Collector request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracing/status/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getTracingStatusForProject
      summary: Tracing ingest status (project-scoped)
      description: >
        internal/api/v2/tracing/handler.go's StatusProject. Port of legacy
