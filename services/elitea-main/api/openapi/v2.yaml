    ProjectIconMeta:
      type: object
      nullable: true
      properties:
        name:
          type: string
          nullable: true
          description: The stored file name, or null.
        url:
          type: string
          nullable: true
          description: The stored URL, or null. Nothing here invents one.
      description: >
        NOTE(W2): the exact object internal/api/v2/eliteacore/handler.go's
        normalizeProjectIconMeta produces — the two keys `name` and `url`, each
