      type: object
      required: [id, type, name, description, settings, meta, created_at, author_id]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        description: { type: string }
        settings:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `p_{project_id}.elitea_tools.settings` jsonb, decoded
            decoded from `p_{project_id}.elitea_tools.settings` and redacted
            before response. Keys whose names contain secret, token, password,
