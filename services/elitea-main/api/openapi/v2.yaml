    # ---- Icon galleries (issue 36, items 1 and 5) ------------------------------
    IconRef:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          description: The stored file name. It is also the DELETE path segment.
        url:
          type: string
          description: >
            The path the browser loads the icon from, `/icons/{project}/{name}`.
            That route is served OUTSIDE the authenticated group, because an
            `<img src>` carries no Authorization header.
      description: >
        NOTE(W2): one row of a gallery listing —
        internal/api/v2/eliteacore/skill_icon.go:160-166 and
        internal/api/v2/eliteacore/handler.go (ListProjectIcons).

    IconGalleryPage:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/IconRef'
        total:
          type: integer
          description: >
            Every icon in the project, NOT the length of this page.
            social/rpc/icons.py:get_icons_list computes it before it slices, and
            a client paging on it needs the full figure.
      description: >
        NOTE(W2): the `{rows, total}` shape both galleries answer —
        internal/api/v2/eliteacore/skill_icon.go:168-171 and
        internal/api/v2/eliteacore/handler.go (ListProjectIcons). It is `rows`
        and not `items`: an `items` key is a 200 that renders an empty gallery,
        which this family has already shipped once.

    IconMeta:
      type: object
      required: [name, url, size, initial_file_size, resulting_file_size]
      properties:
        name:
          type: string
          description: >
            The GENERATED file name, never the uploaded one. It becomes a path
            segment of a public URL, so its extension comes from an allowlist.
        url:
          type: string
        size:
          type: string
          description: >
            The requested thumbnail box as `WxH`. It is what the CLIENT asked
            for, clamped — this service re-encodes nothing, so it is not a
            promise about the stored pixels.
        initial_file_size:
          type: string
          description: The uploaded size, formatted by social/utils/image_utils.py's sizeof_fmt.
        resulting_file_size:
          type: string
          description: The stored size, in the same format.
      description: >
        NOTE(W2): the object social/rpc/process_image.py:save_image returns and
        both upload routes answer —
        internal/api/v2/eliteacore/skill_icon.go:311-317 and
        internal/api/v2/eliteacore/handler.go (CreateProjectIcon). A caller PUTs
        this back, unchanged, to bind the icon to an entity.

    IconUploadForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The image. 512 KB is the cap for both families.
        width:
          type: integer
          description: >
            The requested box width. 64 by default. It is clamped to 64 for
            skill icons and to 512 for project icons — project_icon.py's
            MAX_DIMENSION really is different from upload_skill_icon.py's.
        height:
          type: integer
          description: The requested box height. Same defaults and clamps as width.
      description: >
        NOTE(W2): the multipart form both upload routes read —
        internal/api/v2/eliteacore/skill_icon.go:245-283 and
        internal/api/v2/eliteacore/handler.go (CreateProjectIcon). The file part
