        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # APPLICATIONS — project info (issue 621)
  #
  # TWO handlers serve the GET, and the deployment chooses which; the PUT has
  # only one. ELITEA_PROJECT_INFO_ENABLED=true composes the reviewed reader
  # (internal/api/v2/projectinfo, CurrentProjectInfoRoute), which
  # production_router.go registers on the root router for GET ONLY. chi prefers
  # that explicit registration over the nested compatibility group, so the
  # reviewed reader answers 200 there.
  #
  # The variable is "false" in the shipped chart, so a default install reaches
  # the compatibility handler, and that handler REFUSES the GET with 501 and a
  # machine-readable `code` (issue 615, internal/api/v2/eliteacore/handler.go,
  # ProjectInfo). It used to answer 200 with a literal null `icon_meta` on both
  # branches and no `teammates_count` at all, and the web client rendered the
  # absent key as "Teammates: 0" — a counted figure the server never counted.
  #
  # The PUT is NOT capability-gated. production_router.go registers no reviewed
  # replacement for it, so internal/api/v2/eliteacore/handler.go's
  # UpdateProjectInfo answers it in every deployment.
  #
  # The app calls both through a hand-written client today
  # (apps/elitea-web/src/entities/project/api/projectContextApi.ts). The two
  # operations are described here so a generated client exists to migrate that
  # file onto, and so the 501 is visible to anyone generating from this
  # document.
  /elitea_core/project_info/prompt_lib/{project_id}/project-info:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectInfo
      summary: Read a project's teammate count and icon
      description: |
        NOTE(W2): 200 comes from internal/api/v2/projectinfo/handler.go
        (CurrentProjectInfo) — `teammates_count` counts DISTINCT members of
        public.auth_core__project_user_role, excluding the
        `system_user_<id>@centry.user` account, and `icon_meta` is read from
        the tenant `configuration` row (type='project_icon').

        501 comes from internal/api/v2/eliteacore/handler.go (ProjectInfo)
        when ELITEA_PROJECT_INFO_ENABLED is off. `code` is
        `project_info_not_available`. It is FINAL, not transient.
      tags: [applications]
      responses:
        '200':
          description: Project info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '501':
          description: >
            Project info is not available on this deployment.
            `code` is `project_info_not_available`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityUnavailableResponse'

    put:
      operationId: updateProjectInfo
      summary: Rename a project, set its icon, or both
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go (UpdateProjectInfo).

        BOTH BODY FIELDS ARE OPTIONAL, AND ABSENT IS NOT NULL. An absent
        `icon_meta` leaves the icon alone; an explicit null CLEARS it. A PUT
        with neither field is a no-op that answers `{"ok": true}`.

        The response echoes only what it wrote: `name` appears when the project
        was renamed, `icon_meta` when the icon was written. A failed write is
        reported as a failure — this route used to discard every database error
        and still answer `{"ok": true}`.
      tags: [applications]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInfoUpdateRequest'
      responses:
        '200':
          description: What was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfoUpdateResponse'
        '400':
          description: >
            `icon_meta` is neither null nor an object with string
            `name`/`url`. `code` is `invalid_icon_meta`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: >
            The write failed. `code` is `project_info_write_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # APPLICATIONS — project icons (issue 36, item 5)
  # internal/api/v2/eliteacore/handler.go (ListProjectIcons,
  # CreateProjectIcon, DeleteProjectIcon), registered in
  # internal/api/router.go under `models.project_context.view` for the read
  # and `.edit` for the two writes.
  #
  # These share the `icons` bucket with the agent and skill icons and are told
  # apart by the `pi_` FILENAME prefix, for the same reason the skill family
  # uses `skill_`: the only route that serves an icon to a browser takes ONE
  # path segment for the file name.
  #
  # All three answer 501 `icon_storage_not_configured` when the deployment
  # composes no object store. That is a property of the deployment, identical
  # for every retry, so it is 501 and not 500 — and it is not an empty 200,
  # which is what this family used to answer for all three verbs.
  # ==========================================================================
  /elitea_core/project_icon/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listProjectIcons
      summary: List the icons uploaded to a project
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go (ListProjectIcons).

        `total` counts every uploaded icon, not the rows on this page. The rows
        are sorted by name before the slice, so a page is stable between two
        calls.

        Both parameters used to be accepted and DISCARDED, so a project with
        more icons than one backend page could never reach the rest of them:
        every request answered page one and reported it as the whole set.
      tags: [applications]
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        '200':
          description: One page of the project's uploaded icons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IconGalleryPage'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: >
            The object store could not be listed. `code` is `icon_list_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: >
            No object store is composed. `code` is
            `icon_storage_not_configured`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityUnavailableResponse'

    post:
      operationId: uploadProjectIcon
      summary: Store a project icon
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go (CreateProjectIcon).

        The multipart field is `file`; `width` and `height` are optional and
        are clamped to project_icon.py's MAX_DIMENSION of 512 — NOT the 64 the
        agent and skill icons use, because a project icon is rendered larger.

        The response is the whole icon_meta object. It used to carry `name` and
        `url` only, and the project-info PUT stores whatever the picker hands
        back, so the stored icon_meta stopped describing the file.

        The stored name is GENERATED, never taken from the upload: it becomes a
        path segment of a public, unauthenticated URL, and the extension
        allowlist is what keeps that route from serving attacker-chosen content
        types from the app's own origin.
      tags: [applications]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IconUploadForm'
      responses:
        '200':
          description: The stored icon's metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IconMeta'
        '400':
          description: >
            No `file` part (`code` is `missing_file`), or the file is larger
            than 512 KB (`code` is `icon_too_large`). The cap is enforced
            against the declared part size AND the measured stored size, and an
            object that gets past the first check is removed rather than left
            for the listing to advertise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: >
            The object store refused the write. `code` is `icon_write_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: >
            No object store is composed. `code` is
            `icon_storage_not_configured`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityUnavailableResponse'

  /elitea_core/project_icon/prompt_lib/{project_id}/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: The stored file name, as the listing reports it.

    delete:
      operationId: deleteProjectIcon
      summary: Remove a project icon
      description: |
        NOTE(W2): internal/api/v2/eliteacore/handler.go (DeleteProjectIcon).

        204 for an object that was already absent is deliberate — the object
        store's delete is documented idempotent — but a store that could not be
        reached is reported, because "gone" and "we could not tell" are
        different answers. This route used to answer 204 and do nothing at all,
        so a deleted icon reappeared on the next listing.
      tags: [applications]
      responses:
        '204':
          description: The icon is gone.
        '400':
          description: The icon name is not a usable path segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: >
            The object store refused the delete. `code` is
            `icon_delete_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: >
            No object store is composed. `code` is
            `icon_storage_not_configured`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityUnavailableResponse'

  # ==========================================================================
  # ARTIFACTS — buckets, objects, transfer grants
  # docs/plans/storage-migration-plan.md S7. Replaces the retired legacy
  # surface (ADR-0016 §7) outright — no data migration, no old-shape
  # compatibility. All 13 operations below live under the default /api/v2
  # server (no per-path override): unlike the old /artifacts/s3 surface this
  # replaces, none of this is root-mounted.
  #
  # Every 404 below is written by the handler, not by a middleware, so it
  # carries the nested `Error` envelope {"error":{"code","message"}} from
  # internal/api/v2/artifacts/handler.go writeError. It does NOT carry the
  # flat ErrorResponse {"error": "..."} of #/components/responses/404. The
  # 401 and the plain 403 stay on the shared components: the project
  # authorization middleware writes those, and it does emit the flat shape.
  # ==========================================================================
  /artifacts/buckets/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listBuckets
      summary: List every non-deleted bucket in a project
      tags: [artifacts]
      responses:
        '200':
          description: Bucket listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createBucket
      summary: Create a new bucket
      description: >
        The bucket name is validated against ^[a-z][a-z0-9-]{1,62}$ and
        rejected, never normalised, when it does not already match (S8).
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '200':
          description: Bucket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid bucket name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: A bucket with this name already exists in the project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/buckets/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getBucket
      summary: Get one bucket
      tags: [artifacts]
      responses:
        '200':
          description: The bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    patch:
      operationId: updateBucket
      summary: Update a bucket's pin state, retention, and/or tags
      description: >
        is_pinned, retention_days, and tags are all optional and
        independently settable (S8). A retention_days above the project's
        policy ceiling (project_storage_policy.retention_max_days, not
        retention_default_days) is rejected with 403 QuotaExceeded.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketRequest'
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            Forbidden, or requested retention_days exceeds the project's
            policy ceiling (code QuotaExceeded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      operationId: deleteBucket
      summary: Delete a bucket and every object in it
      description: >
        Deletes objects via ObjectStore.DeleteBatch over a prefix listing,
        then soft-deletes the bucket metadata row (S8).
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/objects/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: listObjects
      summary: List objects in a bucket
      tags: [artifacts]
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - name: delimiter
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Object listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListObjectsResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      operationId: uploadObject
      summary: Stream-upload one object
      description: >
        Streaming multipart upload, field `file` (S9). The server derives
        the storage key from the bucket and the supplied display name — a
        caller never supplies a storage path directly.
      tags: [artifacts]
      parameters:
        - name: overwrite
          in: query
          schema: { type: boolean, default: false }
          description: >
            A collision with overwrite=false (the default) returns 409
            AlreadyExists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Key already exists and overwrite=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Object exceeds the project's max_object_bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/objects/{projectID}/{bucket}:batchDelete:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: batchDeleteObjects
      summary: Delete a batch of objects by key in one request
      description: >
        A JSON body, not repeated query parameters (S9). An empty `keys`
        array is 400 InvalidArgument — it never means "delete the bucket".
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteObjectsRequest'
      responses:
        '200':
          description: Per-key results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteObjectsResponse'
        '400':
          description: Empty keys array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/objects/{projectID}/{bucket}/{key}:
    # The router registers the three operations below on a trailing chi `/*`
    # wildcard, not a single-segment {key} param — chi v5.1.0 has no
    # multi-segment named-param syntax, and S1's own key grammar allows `/`
    # inside a key (S7/S9). segmentsMatch treats a trailing `*` in the router
    # pattern as matching any spec path remainder unconditionally, so this
    # still resolves against the wildcard registration.
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }
      - name: key
        in: path
        required: true
        schema: { type: string }
        description: May itself contain `/` characters.

    get:
      operationId: downloadObject
      summary: Download an object, with optional byte-range support
      tags: [artifacts]
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Full object
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content (Range honoured)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    head:
      operationId: statObject
      summary: Fetch object metadata as headers only, no body
      tags: [artifacts]
      responses:
        '200':
          description: Metadata headers (Content-Length, Content-Type, ETag, Last-Modified)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      operationId: deleteObject
      summary: Delete a single object
      tags: [artifacts]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{bucket}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: bucket
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: createTransferGrant
      summary: Create a short-lived presigned transfer grant
      description: >
        S15. Falls back to the streaming facade URL, not an error, when
        Capabilities().Presign is false for the configured backend.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferGrantRequest'
      responses:
        '200':
          description: The grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferGrantResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:commit:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: commitTransferGrant
      summary: Verify and commit a presigned upload, making it listable
      description: >
        Verifies size, digest, and media type against the grant row (S15).
        Media type verification is mandatory — ContentType is not part of
        the signed presigned-PUT payload. A digest or media-type mismatch
        deletes the uploaded object and returns 409; an object that exceeds
        the grant's max_bytes, or a commit that would push the project past
        its storage quota, deletes the uploaded object and returns 413.
      tags: [artifacts]
      responses:
        '200':
          description: Committed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            Uploaded object exceeds the grant's max_bytes, or committing it
            would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}/parts/{partNumber}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }
      - name: partNumber
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1, maximum: 10000 }

    post:
      operationId: presignUploadPart
      summary: Presign one part of a native multipart upload
      description: >
        S16. grantID must be a grant CreateTransferGrant started as native
        multipart (its response carried upload_id, not url) — a single-shot
        grant, a GET grant, or a grant belonging to a different project
        cannot be used here.
      tags: [artifacts]
      responses:
        '200':
          description: A presigned PUT URL for this part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignUploadPartResponse'
        '400':
          description: Invalid part number, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:completeMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: completeMultipartUpload
      summary: Finish a native multipart upload, making it listable
      description: >
        S16. Applies the identical size/digest/media-type/quota
        verification commitTransferGrant does — completing via multipart is
        not a lesser-verified path. See commitTransferGrant's own
        description for what each response code means; they are shared.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultipartRequest'
      responses:
        '200':
          description: Completed — the object is now listable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadObjectResponse'
        '400':
          description: Invalid request, or grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Digest or media-type mismatch, or the grant was already consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: The grant has expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: >
            The completed object exceeds the grant's max_bytes, or
            completing it would exceed the project's storage quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/grants/{projectID}/{grantID}:abortMultipart:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: grantID
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: abortMultipartUpload
      summary: Cancel a native multipart upload
      description: >
        S16. Unlike presignUploadPart/completeMultipartUpload, an expired
        grant may still be aborted — cleaning up an abandoned upload session
        is not itself subject to the grant's own TTL.
      tags: [artifacts]
      responses:
        '204':
          description: Aborted
        '400':
          description: grantID is not a multipart grant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            grantID belongs to a different project — see AccessDenied in
            components/schemas/Error.code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The grant was already committed or aborted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /artifacts/bucket_permissions/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listBucketPermissions
      summary: List the per-bucket access exceptions in a project
      description: >
        The access model is EXCEPTIONS to a default of full access, which is
        legacy's own model (legacy/plugins/artifacts utils/utils.py:99-132):
        a member with no entry for a bucket may read and write it. An entry
        with an empty permission list means no access. The route answers every
        exception in the project, per member, not the exceptions for one
        bucket.
      tags: [artifacts]
      responses:
        '200':
          description: The project's exceptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPermissionListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: setBucketPermissions
      summary: Replace one member's bucket access exceptions
      description: >
        REPLACES the member's whole map, which is what the reference does
        (rpc/s3_credentials.py:362). Removing one exception means sending the
        map without that key.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBucketPermissionsRequest'
      responses:
        '200':
          description: The stored exceptions for that member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BucketPermissionRow'
        '400':
          description: >
            user_id or bucket_permissions is missing, a bucket name is
            invalid, or a permission is not read or write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    delete:
      operationId: deleteBucketPermission
      summary: Remove one member's exception for one bucket
      description: >
        The subject travels in the body, as it does in the reference
        (api/v2/bucket_permissions.py:130-163). 404 when there was no
        exception to remove.
      tags: [artifacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBucketPermissionRequest'
      responses:
        '204':
          description: Removed (no content)
        '400':
          description: user_id or bucket is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No exception for this member and bucket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ==========================================================================
  # AUTH — permissions
  # ==========================================================================
  /auth/permissions/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: permissionList
      summary: List permissions for a project (authenticated)
      description: |
        NOTE(W2): PLAIN ARRAY of {name, enabled} — static defaults today,
        internal/api/v2/eliteacore/handler.go:2993-3018; [] when the request
        carries no user identity.
      tags: [auth]
      responses:
        '200':
          description: Permission array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # NOTE(W1): the former /auth/permissions/prompt_lib/public/{public_project_id}
  # entry (publicPermissionList) was spec-only drift — no such /public/ segment
  # exists in the router, and the UI requests the public project's permissions
  # through the plain path above with the public project id
  # (src/api/auth.js:19: '/permissions/prompt_lib/' + PUBLIC_PROJECT_ID).

  # ==========================================================================
  # AUTH — personal access tokens (issue 36, item 6)
  # internal/api/v2/auth/tokens.go, mounted at /auth by internal/api/router.go.
  #
  # Every operation below is scoped to the CALLING user. There is no route that
  # reads or deletes another user's key, and the repository takes the owner id
  # from the request context rather than from any parameter.
  #
  # The secret is shown ONCE. The create answers the full signed token; every
  # read answers `"..." + the last seven characters`, which is a display hint
  # and not a credential.
  # ==========================================================================
  /auth/token/:
    get:
      operationId: listPersonalTokens
      summary: List the calling user's personal access tokens
      description: |
        NOTE(W2): internal/api/v2/auth/tokens.go:306 (TokenList).

        A PLAIN ARRAY, not a paged envelope. `token` on every row is the masked
        form.

        503 when the deployment composes no token repository or no signing key.
        A deployment that cannot sign a token cannot honestly list one either,
        and answering an empty array would read as "you have no keys".
      tags: [auth]
      responses:
        '200':
          description: The caller's tokens, masked
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalAccessToken'
        '401': { $ref: '#/components/responses/401' }
        '503':
          description: The token service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createPersonalToken
      summary: Mint a personal access token
      description: |
        NOTE(W2): internal/api/v2/auth/tokens.go:430 (TokenCreate).

        THE ONLY RESPONSE THAT CARRIES THE SECRET. `token` here is the full
        signed value; every later read masks it. The response also sets
        `Cache-Control: no-store`.

        `name` is required and may be JSON null — an absent key is a 400, an
        explicit null is stored and returned as null. `expires` absent or null
        means the key never expires. `project_id` is optional: absent or null
        mints an UNBOUND key, which is the default; any other shape (a string,
        a float, zero, a negative number, a value the integer column cannot
        hold) is refused rather than silently falling back to unbound, because
        a caller that typed a project must not receive a key that bills
        somewhere else.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalAccessTokenCreateRequest'
      responses:
        '200':
          description: The new token, with its secret shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessToken'
        '400':
          description: >
            The body is not one complete JSON document, `name` is absent or too
            long, `expires` names no value or an unknown measure, or
            `project_id` is not a positive integer (`code` is
            `invalid_project_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            The token owner is not a member of the requested project. `code` is
            `project_forbidden`. The message names only the project the caller
            supplied, and is the same whether that project exists, is
            suspended, or was never created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The token service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/token/{token_uuid}:
    parameters:
      - name: token_uuid
        in: path
        required: true
        schema: { type: string }
        description: >
          The token's UUID, exactly 36 characters in the canonical hyphenated
          hexadecimal form. Any other shape is a 400 and never reaches a query.

    get:
      operationId: getPersonalToken
      summary: Read one of the calling user's tokens
      description: |
        NOTE(W2): internal/api/v2/auth/tokens.go:332 (TokenGet). `token` is
        masked.

        A token that does not exist and a token belonging to somebody else are
        the SAME 400 here. The lookup is scoped to the caller, so the two cases
        are not distinguishable and a probing caller learns nothing.
      tags: [auth]
      responses:
        '200':
          description: The token, masked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessToken'
        '400':
          description: The UUID is malformed, or names no token this caller owns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '503':
          description: The token service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deletePersonalToken
      summary: Revoke one of the calling user's tokens
      description: |
        NOTE(W2): internal/api/v2/auth/tokens.go:528 (TokenDelete). 204 with no
        body.
      tags: [auth]
      responses:
        '204':
          description: The token is revoked.
        '400':
          description: The UUID is malformed, or names no token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: The token belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The token service is not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # CHAT
  # ==========================================================================
  # NOTE(#126, re-checked for issue 254 P2): webchatSync (POST
  # /elitea_core/webchat/prompt_lib/{project_id}/{version_id}) was removed. It
  # was gated on RouterConfig.Predictor — the prototype indexer transport — and
  # 404'd in every deployment.
  #
  # It is NOT coming back, and it was never a chat surface. The pylon module
  # (legacy/plugins/elitea_core/api/v2/webchat.py) is an unauthenticated
  # Microsoft Bot Framework webhook stub: it echoes the caller's own text back
  # to a connector URL taken from the request body, carries the literal
  # placeholder strings 'MICROSOFT-APP-ID' and 'MICROSOFT-APP-PASSWORD' as its
  # credentials, and marks its missing permission gate with `# FIXME: auth`. It
  # never predicts and never reads its own {version_id}. A public chat entry
  # point is a NEW feature; issue 254 carries the finding and a bounded design.
  # See #93 for the chat dispatch migration.

  # NOTE(#126/#194): getChatConfig (GET
  # /elitea_core/chat_config/prompt_lib/{project_id}) was removed here when the
  # prototype eliteacore registration — which sat inside the never-assigned
  # ChatService gate and so answered 404 in every deployment — was deleted.
  #
  # The path IS served again as of #194, but by the CURRENT implementation
  # (internal/api/v2/promptcontextreads, vault-backed, with its own auth and
  # models.chat.conversation.details permission resolution), returning the
  # five-key {chat_max_upload_count, chat_max_upload_size_mb,
  # chat_max_file_upload_size_mb, chat_max_image_upload_count,
  # chat_max_image_upload_size_mb} object — NOT the prototype's
  # {models, default_model}. The operation is deliberately still absent from
  # this document: its only client is the hand-written
  # apps/elitea-web/src/features/artifacts/api/chatConfigApi.ts, and declaring
  # it here would have orval generate a second, competing hook for the same
  # path. Re-add it here only together with removing that hand-written client.

  # ==========================================================================
  # CONFIGURATIONS (issue 36, items 9 and 11)
  #
  # The header used to read "TODO: Enumerate endpoints when inventory is
  # available". The inventory has been available since the Wave-2 census, and
  # the TODO outlived it: four elitea-web slices had each hand-written the same
  # two reads independently, and the parity census carries them as
  # `credentials.getConfigurationsList`, `getConfigurationsByType`,
  # `getConfigurationsBySection` and `credentials.listModels`.
  #
  # The two reads below are described here. The rest of the domain is described
  # under the stored-credential checks, further down.
  #
  # TWO HANDLERS SERVE EACH OF THESE PATHS, AND THE TWO SHAPES DIFFER.
  # ELITEA_CONFIGURATIONS_ENABLED=true composes the reviewed service
  # (internal/application/configurations), which production_router.go registers
  # on the root router; chi prefers it. The shipped chart leaves the variable
  # off, so a default install reaches the compatibility handler
  # (internal/api/v2/configurations/handler.go). Every field below states which
  # of the two emits it. A client must read the union — this is the whole
  # reason the two compatibility structs were forced to emit `project_id` as a
  # NUMBER (handler.go, Configuration and Model): one deployment gave a string
  # and another a number, and a client comparing with `===` broke on exactly
  # one of them.
  #
  # The `{mode}` twins of both paths are registered for pylon URL parity and
  # are deliberately absent from this document: the mode segment is decoration
  # on this surface, one handler serves both forms, and no client in the
  # workspace calls the mode-ful URL.
  # ==========================================================================
  /configurations/configurations/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: section
        in: query
        required: false
        description: >
          Repeatable. The client fires ONE request per section, and this filter
          used to be ignored: every section received the whole table, so one
          credential rendered under all seven headings.
        schema:
          type: array
          items: { type: string }
      - name: type
        in: query
        required: false
        description: Repeatable credential-type filter, for example `sharepoint`.
        schema:
          type: array
          items: { type: string }
      - name: query
        in: query
        required: false
        description: >
          Label search. A value longer than 1024 characters is refused with
          400. It is not truncated.
        schema: { type: string }
      - name: limit
        in: query
        required: false
        description: Page size. The default is 20 and the clamp is 200.
        schema: { type: integer, default: 20, maximum: 200 }
      - name: offset
        in: query
        required: false
        schema: { type: integer, default: 0, minimum: 0 }
      - name: sort_by
        in: query
        required: false
        schema: { type: string }
      - name: sort_order
        in: query
        required: false
        schema: { type: string, enum: [asc, desc] }
      - name: include_shared
        in: query
        required: false
        description: >
          Adds the `shared` block, read from the PUBLIC project's schema and
          never from the caller's own. Without a configured public project the
          block stays empty. That is the honest answer: the caller's own schema
          is a wrong answer, not a fallback.
        schema: { type: boolean, default: false }
      - name: shared_offset
        in: query
        required: false
        schema: { type: integer, default: 0, minimum: 0 }
      - name: shared_limit
        in: query
        required: false
        schema: { type: integer, default: 20, maximum: 200 }

    get:
      operationId: listConfigurations
      summary: List a project's stored credentials and integrations
      description: |
        NOTE(W2): internal/api/v2/configurations/handler.go, List
        (compatibility) and internal/application/configurations/crud.go
        (reviewed). The page carries every row the project OWNS, shared or
        not. The old `shared = false` predicate hid a shared credential from
        its own project.

        A project whose tenant schema does not exist yet answers 200 with an
        empty page. Every OTHER database error answers 500. An empty page
        reports a timeout as a project that holds no credentials, and the user
        then creates a credential that already exists.

        The app calls this through a hand-written client today
        (apps/elitea-web/src/features/credentials/api/configurations.ts). It is
        described here so a generated client exists to migrate onto.
      tags: [configurations]
      responses:
        '200':
          description: One page of configurations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationListResponse'
        '400':
          description: >
            A filter is out of bounds: more than 64 values, a value longer than
            128 characters, or a `query` longer than 1024 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }
        '503':
          description: The configuration store is not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /configurations/models/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: section
        in: query
        required: false
        schema: { type: string }
      - name: include_shared
        in: query
        required: false
        schema: { type: boolean, default: false }

    get:
      operationId: listConfigurationModels
      summary: List the models a project can select
      description: |
        NOTE(W2): internal/api/v2/configurations/handler.go, ListModels
        (compatibility) and internal/application/configurations/models.go
        (reviewed). The compatibility handler reads the five model rows of the
        tenant `configuration` table: llm_model, embedding_model, asr_model,
        tts_model and image_generation_model. It reads at most 1000 rows.

        THE ROWS CARRY NO SERVER-ASSIGNED `id` ON THE REVIEWED ROUTE. The
        shipped client synthesises one from `project_id` and `name`
        (apps/elitea-web/src/features/credentials/api/configurationConnections.ts,
        withModelId). Do not read `id` as an identifier the server assigned.

        The app calls this through a hand-written client today, and four
        separate slices re-derived that client independently. It is described
        here so one generated client replaces all four.
      tags: [configurations]
      responses:
        '200':
          description: The model catalogue for this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationModelListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  # ==========================================================================
  # NOTIFICATIONS
  # NOTE(issue 621): the header used to read "TODO: Enumerate endpoints when
  # inventory is available". The inventory is available. The TODO was stale.
  #
  # The routes exist. internal/api/router.go registers GET
  # /elitea_core/notifications/prompt_lib/{projectID}, and PUT and DELETE on
  # both that path and /elitea_core/notification/prompt_lib/{projectID}/{id}.
  # internal/api/v2/notifications carries the reviewed copy of the same surface.
  #
  # They stay undescribed for ONE reason, and the inventory is not it: the
  # domain's sixth endpoint is an SSE stream (`notifications.eventStream`),
  # which no generated client models. Describing five of the six here splits
  # one feature's client across two mechanisms. Describe the domain when the
  # stream has an agreed contract, and delete the five allowlist lines in
  # internal/api/oapiserver/testdata/reverse_check_allowlist.txt at the same
  # time.
  # ==========================================================================

  # ==========================================================================
  # RESOURCES (issue 36, item 7)
  # NOTE(issue 621): the header used to read "TODO: Enumerate endpoints when
  # inventory is available". The inventory is available. The TODO was stale.
  #
  # It then said the one route here stays undescribed because no elitea-web
  # client calls it. That reason has expired: the Help Center reads it, and the
  # route is described below.
  #
  # The SECOND route the Help Center's data comes from, GET
  # /admin/system_info/prompt_lib, is described under ADMIN — system info. It
  # answers 501 in every deployment and no first-party page calls it; it is in
  # this document so a generated client carries the refusal rather than
  # inventing a shape for it.
  # ==========================================================================
  /admin/plugin_config_values/prompt_lib/resources:
    get:
      operationId: getResourcesConfigValues
      summary: Read the Help Center's administrator-owned links and version label
      description: |
        NOTE(W2): internal/api/v2/admin/config_values.go:175
        (PromptLibResourcesValues).

        THE ONLY CONFIG SECTION A NON-ADMINISTRATOR MAY READ, and it is
        restricted by being a ROUTE rather than a parameter: there is no section
        id a caller could substitute. pylon restricts it the same way
        (`_PUBLIC_SECTIONS = {"resources"}`).

        The answer merges the section's declared defaults with whatever an
        administrator saved on Admin › Configuration › Resources, so a key is
        always present even when nothing was ever stored.

        There is no `fields_meta` here. That key is an authoring concern for the
        admin form, and this response is consumed by the product UI.

        This route used to answer 200 with chat and upload limits
        (`max_file_size`, `max_context_length`, …) under no `values` wrapper —
        a handler answering a different question than the page asked, which is
        why every Help Center card rendered "No links configured".
      tags: [resources]
      responses:
        '200':
          description: The resources section's effective values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigValues'
        '401': { $ref: '#/components/responses/401' }
        '500':
          description: The platform configuration store could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # ADMIN — system info (issue 36, item 7)
  #
  # DESCRIBED AS A REFUSAL, deliberately. internal/api/v2/admin/handler.go:170
  # answers 501 unconditionally, in every deployment, and the comment above it
  # states why: in pylon this route reports the versions of six named plugins,
  # collected from the pylons that announced themselves on the Arbiter bus in
  # the last 60 seconds. This service loads no plugins and has no such bus, and
  # AGENTS.md names both as things the target architecture does not preserve.
  # The route used to invent a hardcoded elitea_core/auth version map instead.
  #
  # NO FIRST-PARTY CLIENT CALLS IT, and none should while the answer can only
  # be a refusal: apps/elitea-web's useResourcesConfig returns an empty plugin
  # list on purpose rather than putting a 501 in the network log of every Help
  # Center visit. It is described here so that anyone generating a client from
  # this document gets the refusal, not an invented shape — and so the day this
  # service has a real build version to report, the operation already exists.
  # ==========================================================================
  /admin/system_info/prompt_lib:
    get:
      operationId: getSystemInfo
      summary: Report the platform's component versions (not available here)
      description: |
        NOTE(W2): internal/api/v2/admin/handler.go:170 (SystemInfo). It answers
        501 and nothing else. There is no 200 to describe: this service reports
        no per-plugin versions because it loads no plugins.
      tags: [admin]
      responses:
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '501':
          description: >
            System information has no equivalent in this service. The body is
            the flat `{"error": "..."}` shape, with no `code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # SEARCH
  # NOTE(W1): the former /elitea_core/search/prompt_lib/{project_id} entry was
  # spec-only drift — the router serves /search_options/prompt_lib/{projectID}
  # and the UI calls only that shape (src/api/search.js:37). Re-add under the
  # real path when the search domain is spec'd in W2.
  # ==========================================================================

  # ==========================================================================
  # SECRETS
  # NOTE(issue 621): the header used to read "TODO: Enumerate endpoints when
  # inventory is available", and it was FALSE, not merely stale. Issue 151
  # described the whole domain: six operations over
  # /secrets/{secrets,secret,hide}/{mode}/{projectID}, further down this
  # document. Read the section headed "SECRETS (issue 151)". Nothing about this
  # domain is pending here.
  # ==========================================================================

  # ==========================================================================
  # SETTINGS
  # ==========================================================================
  /elitea_core/entity_settings/prompt_lib/{project_id}/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        schema: { type: integer }

    # NOTE(W1): a PUT (replaceEntitySettings) on this 2-segment path was
    # spec-only drift — the router serves PATCH here and PUT only on the
    # 3-segment {participant_id} path; the UI (chat.api.js) matches the router.
    patch:
      operationId: patchEntitySettings
      summary: Batch update of per-participant settings
      description: |
        NOTE(W2): BatchUpdateEntitySettings,
        internal/api/v2/conversations/handler.go:663-676 — the body is a
        JSON ARRAY of settings maps; responds {"ok": true}.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchEntitySettingsRequest'
      responses:
        '200':
          description: Settings stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/entity_settings/prompt_lib/{project_id}/{conversation_id}/{participant_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: conversation_id
        in: path
        required: true
        schema: { type: integer }
      - name: participant_id
        in: path
        required: true
        schema: { type: integer }

    put:
      operationId: replaceParticipantSettings
      summary: Replace settings for a specific participant
      description: |
        NOTE(W2): UpdateEntitySettings,
        internal/api/v2/conversations/handler.go:585-625 — arbitrary settings
        map; llm_settings may be validated/stripped for non-published agents
        (:596-618); responds {"entity_settings": <stored body>}.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantSettingsRequest'
      responses:
        '200':
          description: Stored settings echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySettingsUpdateResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    # NOTE(W1): a PATCH (patchParticipantSettings) on this 3-segment path was
    # spec-only drift — the router serves PUT here and PATCH only on the
    # 2-segment conversation path; the UI (chat.api.js) matches the router.

  # NOTE: /elitea_core/platform_settings/prompt_lib is defined above under ADMIN.
  # The settings domain aliases to the same path (tagged [settings] in the UI).

  # ==========================================================================
  # SKILLS
  # ==========================================================================
  /elitea_core/application_skills/prompt_lib/{project_id}/{app_version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: app_version_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listApplicationSkills
      summary: List skills attached to an agent version
      description: |
        Returns only the skills attached to app_version_id, read from
        entity_skill_mapping.

        NOTE(#367): this route used to point at the project skills List
        handler, which never read app_version_id and answered with every
        skill in the project, at 200. The five published keys are unchanged —
        a client sees the same shape and different, correct contents. A
        malformed app_version_id is now refused with 400 instead of being
        coerced.

        NOTE(issue 621): the response schema is ApplicationSkillsList, not
        SkillsList. It is SkillsList plus the `skills` and `max_skills` keys
        the reviewed handler also emits (issue 395). SkillsList itself stays
        as it is, because the project-skills List operation shares it and
        emits neither key.
      tags: [skills]
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSkillsList'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/skills/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listSkills
      summary: Paginated list of skills for a project
      description: |
        NOTE(W2): internal/api/v2/skills/handler.go:61-78 — {items, total,
        page, page_size, total_pages}; pagination via ?page/?page_size
        (limit/offset accepted but not read).
      tags: [skills]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: Pagination parameter the handler actually reads.
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
          description: Pagination parameter the handler actually reads.
      responses:
        '200':
          description: Skills list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createSkill
      summary: Create a skill
      description: |
        NOTE(W2): internal/api/v2/skills/handler.go:92-107 — responds 201
        with the created Skill record.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreateRequest'
      responses:
        '201':
          description: Created skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # NOTE(W1): the former 2-segment /elitea_core/skills/prompt_lib entry
  # (listPublicSkills/createPublicSkill) was spec-only drift — the router only
  # serves /skills/{mode}/{projectID} (3 segments; chi will not match a
  # 2-segment path to it) and the UI has no call site for the 2-segment shape.

  # ==========================================================================
  # SKILLS — icons (issue 36, item 1)
  # internal/api/v2/eliteacore/skill_icon.go, registered in
  # internal/api/router.go beside the agent icon family under the
  # `models.applications.skills.upload_icon.*` permissions.
  #
  # The bytes live in the project's reserved `icons` bucket and are told apart
  # from the agent icons by the `skill_` FILENAME prefix, not by a key
  # directory: the only route that serves an icon back to a browser is
  # `GET /icons/{projectID}/{filename}`, whose last segment is ONE path
  # segment, so a key with a separator could not be addressed through it.
  #
  # WHAT THIS FAMILY DOES NOT DO, stated here because a client can observe it:
  # pylon decodes the upload through Pillow, refuses an image smaller than the
  # requested box, and re-encodes every icon to PNG at at most 64x64. There is
  # no image codec in this service, so the bytes are stored as uploaded and
  # `size` reports the box the CLIENT asked for. An icon may therefore be
  # served at its original pixel size.
  # ==========================================================================
  /elitea_core/upload_skill_icon/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listSkillIcons
      summary: List the skill icons uploaded to a project
      description: |
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:142 (ListSkillIcons).

        `total` is the count of EVERY skill icon in the project, not the length
        of the page — social/rpc/icons.py:get_icons_list computes it before it
        slices, and a client paging on it needs the full figure. The rows are
        sorted by name before the slice, so a page is stable between two calls.

        A storage backend that cannot list (storage.ErrNotSupported) answers an
        empty gallery rather than a 500: "this deployment stores no listable
        icons" is what such a deployment truly has to show.
      tags: [skills]
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
          description: >
            Rows to drop from the front. A value past the end is an empty page,
            never an error.
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
          description: >
            Rows to return. A non-positive value means "everything from skip".
            A missing or non-numeric value is the default, not a 400.
      responses:
        '200':
          description: One page of the project's skill icons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IconGalleryPage'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: uploadSkillIcon
      summary: Store a skill icon
      description: |
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:245 (UploadSkillIcon).

        The multipart field is `file`. A request that names no file is a 400,
        NOT the agent route's accepted no-op: this family has a listing to keep
        honest, and a 200 for an upload that stored nothing is the
        success-without-persistence shape the port refuses.

        The response IS the icon_meta object, unchanged, and is what a caller
        PUTs back to bind the icon to a skill version later.
      tags: [skills]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IconUploadForm'
      responses:
        '200':
          description: The stored icon's metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IconMeta'
        '400':
          description: >
            No `file` part, or the file is larger than 512 KB. The cap is
            enforced against the declared part size AND the measured stored
            size, and an object that gets past the first check is removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/upload_skill_icon/prompt_lib/{project_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: uploadSkillIconForVersion
      summary: Store a skill icon and bind it to one skill version
      description: |
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:245 (UploadSkillIcon,
        the registration carrying the optional trailing segment).

        The same upload as the two-segment POST, plus the bind, in one request.
        The two-call shape stays available and is what the picker uses for an
        icon that is already stored.

        The bind is reported. A version id that matches no row is a 404, not a
        200 for a skill that still has no icon.
      tags: [skills]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IconUploadForm'
      responses:
        '200':
          description: The stored icon's metadata, bound to the version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IconMeta'
        '400':
          description: No `file` part, or the file is larger than 512 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: >
            No skill version with this id. The body is
            `{"ok": false, "msg": "There is no such version id N"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillIconBindRefusal'
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: bindSkillIcon
      summary: Bind an already-stored icon to a skill version, or clear it
      description: |
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:353
        (UpdateSkillIcon).

        The body is the icon_meta object the upload answered. `name` and `url`
        are REQUIRED strings — pylon parses the body through a model that
        declares them so, and a payload missing either is a 400 here rather
        than an icon_meta the read path cannot render. Empty strings in both
        reset the version to the default icon.

        A version id that matches no row is a 404. That refusal is the
        load-bearing half: a blind UPDATE matching no row would answer "saved"
        for a skill that still has no icon.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillIconBindRequest'
      responses:
        '200':
          description: The version now wears this icon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedResponse'
        '400':
          description: >
            The body is not an object, or `name` or `url` is missing or not a
            string, or the project id is not a tenant this service can address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: >
            No skill version with this id. The body is
            `{"ok": false, "msg": "There is no such version id N"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillIconBindRefusal'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/upload_skill_icon/prompt_lib/{project_id}/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: The stored file name, as the listing reports it.

    delete:
      operationId: deleteSkillIcon
      summary: Remove a skill icon and unlink every version wearing it
      description: |
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:405
        (DeleteSkillIcon).

        The unlink runs FIRST and its failure is reported. Deleting the bytes
        while leaving the rows pointing at them is how a gallery ends up full
        of broken images with no way back.

        An object that was already absent still answers `{"ok": true}` — the
        object store's delete is documented idempotent.
      tags: [skills]
      responses:
        '200':
          description: The icon is gone and no version references it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: The project id or the icon name is not a usable segment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillIconDeleteRefusal'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500':
          description: The unlink or the object delete failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillIconDeleteRefusal'

  # ==========================================================================
  # SKILLS — publishing (#249)
  # internal/api/v2/skillpublish, registered in internal/api/router.go beside
  # the application publish block. The publish/unpublish/validate trio mirrors
  # the application-level one; the catalog reads serve the PUBLIC project's
  # schema (PUBLIC_PROJECT_ID, default 1) and expose published versions only.
  # ==========================================================================
  /elitea_core/publish_skill/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: publishSkill
      summary: Publish a skill version to the public skill catalog
      description: |
        Snapshots the version into a new source version named `version_name`
        and copies it into the public project as a twin skill's published
        version. Publishing from the public project itself publishes in place.
        Requires the version to pass pre-publish validation; call
        /publish_skill_validate first to receive a `validation_token` that
        skips re-validation.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_name]
              properties:
                version_name:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]{1,50}$'
                validation_token:
                  type: string
                  description: Token issued by /publish_skill_validate for this exact content.
                category:
                  type: string
                  description: One of /skill_categories; an omitted category falls back to "Other".
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
                  public_skill_id: { type: integer }
                  public_version_id: { type: integer }
                  version_name: { type: string }
                  source_version_id: { type: integer }
        '400':
          description: |
            Bad request. `error` is one of `invalid_category`,
            `version_name_exists`, `version_name_conflict`, `limit_reached`, or
            `validation_token_invalid` — the last carrying `validation_result`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          $ref: '#/components/schemas/SkillFieldError'
                    description: >-
                      A refusal code, or the pydantic-style field-error list
                      the version_name checks emit
                      (internal/api/v2/skillpublish/publish.go:66-80).
                  msg: { type: string }
                  validation_result:
                    $ref: '#/components/schemas/SkillValidationResult'
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Publishing is blocked for this project by platform policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  msg: { type: string }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/unpublish_skill/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: unpublishSkill
      summary: Remove a published skill version from the public catalog
      description: |
        Deletes the catalog copy and reverts the source version to draft. A
        twin skill left with no published versions is removed with it; an
        in-place original keeps its drafts.
      tags: [skills]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Unpublished
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
                  status: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/publish_skill_validate/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    post:
      operationId: validateSkillForPublish
      summary: Validate a skill version before publishing
      description: |
        Runs the deterministic pre-publish checks. 200 on PASS/WARN (with a
        `validation_token`), 422 on FAIL. `ai_validation_available` is always
        false in this stack — the AI half of the reference's gate has no
        transport here (issues 126 and 194).
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version_name: { type: string }
                category: { type: string }
      responses:
        '200':
          description: Validation PASS or WARN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillValidationResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '422':
          description: Validation FAIL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillValidationResult'

  /elitea_core/public_skills/prompt_lib:
    get:
      operationId: listPublicSkills
      summary: List published skills in the public catalog
      description: |
        Reads the public project's schema; only skills with a published
        version appear. `my_liked` and the trend window are not implemented
        (they depend on the social like store).
      tags: [skills]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: query
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: tags
          in: query
          description: Comma-separated tag ids; a skill must carry ALL of them.
          schema: { type: string }
        - name: sort_by
          in: query
          description: created_at (default) or name.
          schema: { type: string }
        - name: sort_order
          in: query
          description: asc or desc (default).
          schema: { type: string }
      responses:
        '200':
          description: Published skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicSkillListItem'

  /elitea_core/public_skill/prompt_lib/{skill_id}:
    parameters:
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getPublicSkill
      summary: Retrieve one public catalog skill and its newest published version
      tags: [skills]
      responses:
        '200':
          description: Public skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSkillDetail'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/public_skill/prompt_lib/{skill_id}/{version_name}:
    parameters:
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_name
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: getPublicSkillVersion
      summary: Retrieve one public catalog skill pinned to a published version name
      tags: [skills]
      responses:
        '200':
          description: Public skill detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSkillDetail'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/attach_public_skill/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: attachPublicSkill
      summary: Fork a published skill into a project and attach it to agent versions
      description: |
        Forks the published (skill, version) into this project once, reusing an
        existing local copy when one exists, then writes one
        entity_skill_mapping row per agent version. Partial success is carried
        per agent in `results`, not in the HTTP status.
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_skill_id, public_version_id, agent_version_ids]
              properties:
                public_skill_id: { type: integer }
                public_version_id: { type: integer }
                agent_version_ids:
                  type: array
                  items: { type: integer }
                entity_type:
                  type: string
                  default: agent
                  description: >-
                    Only "agent" is accepted; pylon's SkillEntityTypes enum has
                    no other member
                    (internal/api/v2/skillpublish/attach.go:66-72).
      responses:
        '200':
          description: Per-agent attach outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_version_id: { type: integer }
                        ok: { type: boolean }
                        http_status: { type: integer }
                        error: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/skill_categories/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listSkillCategories
      summary: List the skill categories available for publishing
      description: |
        The nine predefined categories plus any an administrator added on the
        admin Features page (Skill Publishing -> Skill Categories), with
        "Other" always last. `is_default` marks the built-ins, which cannot be
        removed. Deduplication is case-insensitive and the first-seen spelling
        wins, so re-typing a built-in does not create a second bucket.
      tags: [skills]
      responses:
        '200':
          description: Skill categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        is_default: { type: boolean }
        '400': { $ref: '#/components/responses/400' }

  /elitea_core/skill_export_fork/prompt_lib/{project_id}/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: exportSkillFork
      summary: Build the JSON fork payload for a skill's default version
      description: |
        Distinct from /skill_export, which downloads Markdown. The copied
        version is always emitted as the target's single 'base' version.
      tags: [skills]
      responses:
        '200':
          description: Fork payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillForkPayload'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/skill_export_fork/prompt_lib/{project_id}/{skill_id}/{version_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema: { type: integer }
      - name: version_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: exportSkillVersionFork
      summary: Build the JSON fork payload for a specific skill version
      tags: [skills]
      responses:
        '200':
          description: Fork payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillForkPayload'
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/skill/prompt_lib/{project_id}/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer

    patch:
      operationId: setSkillRelation
      summary: Attach or detach a skill on one agent version
      description: |
        The URL is overloaded: the same PATCH (and PUT) also serves the plain
        skill update, and the body selects the operation. A body that carries
        `has_relation` attaches (`true`, 201) or detaches (`false`, 200) the
        skill on the agent version named by `entity_version_id`; any other body
        is the plain update, which this document does not describe
        (`skills.updateSkill` stays on the reverse-check allowlist). This is the
        convention apps/elitea-ui's `updateSkillRelation` already calls and the
        toolkit twin implements (internal/api/v2/skills/handler.go Update).
      tags: [skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [has_relation, entity_version_id]
              properties:
                has_relation:
                  type: boolean
                  description: true attaches, false detaches. Non-boolean values are refused.
                entity_version_id:
                  type: integer
                  description: The agent VERSION the relation belongs to.
                skill_version_id:
                  type: integer
                  description: The skill version to attach; required when has_relation is true.
      responses:
        '200':
          description: Detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '201':
          description: Attached
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                x-elitea-passthrough: >-
                  NOTE(W2): the SkillAttachment row as the repository returns
                  it (internal/api/v2/skills/handler.go:395, AttachSkill) —
                  the writer owns the shape.
        '400': { $ref: '#/components/responses/400' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  /elitea_core/agents_with_skill/prompt_lib/{project_id}/{skill_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: skill_id
        in: path
        required: true
        schema:
          type: integer
          description: The PUBLIC catalog skill id, not a local one.

    get:
      operationId: listAgentsWithSkill
      summary: List agent versions in this project that use a public skill
      description: |
        Reverse lookup through the fork lineage: every local copy of the public
        skill (`parent_project_id` + `parent_entity_id` in the version meta),
        then every agent version mapped to one.
      tags: [skills]
      responses:
        '200':
          description: Agent versions using the skill
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        application_id: { type: integer }
                        name: { type: string }
                        entity_version_id: { type: integer }
                        icon_meta:
                          type: object
                          nullable: true
                          additionalProperties: true
                          x-elitea-passthrough: >-
                            NOTE(W2): applications.meta->'icon_meta', forwarded
                            as stored
                            (internal/api/v2/skillpublish/attach.go:281-287) —
                            the icon payload's shape is owned by the writer, not
                            by this route.
        '400': { $ref: '#/components/responses/400' }

  # ==========================================================================
  # SOCIAL
  # NOTE(W2): internal/api/v2/social/handler.go, mounted at router.go:606
  # `r.Mount("/social", v2social.NewHandler(cfg.Pool).Routes())`. CORRECTION
  # to a prior assumption that this sits under /elitea_core/social/...: by
  # indentation, `r.Mount("/social", ...)` (router.go:606, 3 tabs) is a
  # SIBLING of `r.Route("/elitea_core", ...)` (router.go:327, also 3 tabs,
  # whose own body is one tab deeper starting :328) — both are direct
  # children of the outer `r.Route("/api/v2", ...)` (router.go:235), NOT
  # nested inside each other. Every /social/* path below is therefore
  # `/api/v2/social/...`, NOT `/api/v2/elitea_core/social/...`. This is the
  # same sibling-mount pattern this file's own pre-existing
  # `/artifacts/buckets/...` paths already reflect (router.go:609
  # `r.Route("/artifacts", ...)` is the very next sibling after /social, and
  # those paths correctly carry no /elitea_core prefix either) — confirmed,
  # not assumed, by reading router.go's actual brace nesting rather than
  # its comments. The router also registers a trailing-slash duplicate
  # (`/author/`) onto the identical GET/PUT handlers; documented once here,
  # per this file's `/support_assistant/config` precedent for the same
  # pattern.
  # ==========================================================================
