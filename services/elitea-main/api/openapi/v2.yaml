      required: [id, name, description, owner_id, webhook_secret, versions,
                 version_details]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner_id:
          type: string
          description: Target project id (quirk — not a user id).
        webhook_secret:
          nullable: true
          x-elitea-passthrough: >-
            NOTE(W2): hardwired nil in the fork result
            (internal/api/v2/eliteacore/handler.go:3380) — always null today,
            future shape unknown on the Go side.
          description: Always null today (handler.go:3380).
        versions:
          type: array
          items:
            type: object
            required: [id, application_id, name, status]
            properties:
              id: { type: string }
              application_id: { type: string }
              name: { type: string }
              status: { type: string }
        version_details:
          allOf: [{ $ref: '#/components/schemas/ApplicationVersionDetail' }]
          nullable: true
          description: >
            Key ALWAYS present (null when no versions were created) —
            unconditionally set in the agentResult map (handler.go:3375-3383).
        version_id: { type: string }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:3375-3387 —
        version_details is required+nullable (always marshaled); only
        version_id is genuinely conditional (:3384-3386).

    ForkResponse:
      type: object
      required: [result, errors]
      properties:
        result:
          type: object
          required: [agents, toolkits, skills]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ForkAgentResult' }
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportedToolkit' }
              description: >
                ALWAYS present, and ALWAYS empty: a fork writes no toolkit.
                The channel is still carried, because the import wizard reads
                `result[item.entity]` for every row it sent with no guard, so
                a channel the answer leaves out is `undefined` at that call
                and the dialog stops with no message at all. The set of three
                is the legacy set, seeded from ENTITY_IMPORT_MAPPER
                (internal/api/v2/eliteacore/export_import.go:676-723, applied
                at handler.go:3406).
            skills:
              type: array
              items: { $ref: '#/components/schemas/ImportedSkill' }
              description: >
                One entry for each entry of the request's `skills` array that
                the fork wrote
                (internal/api/v2/eliteacore/handler.go:3073-3079). Present and
                empty when the request carried no skill.
        errors:
          type: object
          required: [agents, toolkits, skills]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
              description: >
                index/name/msg, which is the shape the import already writes
                and the wizard already maps
                (internal/api/v2/eliteacore/handler.go:3099-3102). The earlier
                name/error entries threw inside the wizard, because it reads
                selectedData[item.index] with no guard (issue #505).
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
              description: >
                ALWAYS present, and ALWAYS empty, for the reason
                `result.toolkits` gives
                (internal/api/v2/eliteacore/handler.go:3407).
            skills:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
              description: >
                Two faults report here, and every entry indexes ONE list: the
                `applications` the request sent, followed by its `skills`.
                That is the legacy numbering — `fork.py` concatenates the two
                arrays into one entity list, and `_wrap_import_error` numbers
                each entry by its position in that concatenation.

                A `skills` entry the fork could not write carries
                `len(applications)` plus its own position in the `skills`
                array
                (internal/api/v2/eliteacore/handler.go:3045-3048). A `skills`
                reference on a version that the fork could not attach carries
                the index of the AGENT that holds the reference (:3306-3322).

                Each entry used to carry the constant 0, which named an
                application and never the skill that failed. A client resolves
                this index against the same concatenation, and must tolerate
                an index it cannot resolve.
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:3403-3408 (the normal
        path) and :2975-2980 (the empty-input fast path). BOTH answers build
        the same three channels on BOTH envelopes, through one helper
        (internal/api/v2/eliteacore/export_import.go:711-723), so no answer of
        this route can leave a channel out. The fast path used to send
        `datasources` and `prompts` in place of `toolkits` and `skills`. Those
        two keys are in no entity mapper, no path of this route can put an
        entry in them, and they are gone.

        The fast path fires only when `applications` is an array with no entry
        (handler.go:2975). A body with no `applications` array is refused with
        400 (:2970-2973), and a handler with no pool answers 500
        (:2948-2952). Status on the normal path is 201 when everything was
        forked, 207 when part of it was, and 400 when nothing was
        (:3390-3401).

    AgentCategoriesResponse:
      type: object
      required: [categories, total]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [name, is_default]
            properties:
              name: { type: string }
              is_default: { type: boolean }
        total: { type: integer }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2960-2991 — nine
        static defaults merged with publishing_guardrail extras.

