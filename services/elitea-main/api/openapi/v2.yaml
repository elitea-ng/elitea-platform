    CreateTransferGrantRequest:
      type: object
      required: [method, content_type, max_bytes]
      properties:
        method:
          type: string
          enum: [PUT]
          description: >
            Upload only. "GET" used to be accepted and was removed: a grant
            derives its storage key from a newly generated grant id and no
            field names an existing object, so a download grant always
            presigned an empty key and answered 404. Download an object with
            GET /artifacts/objects/{projectID}/{bucket}/{key} instead.
        display_name:
          type: string
          description: >
            The server derives the storage key; the caller never supplies
            one directly (S9/S15).
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }
        digest_alg:
          type: string
          description: >
            Required alongside digest for media types where integrity
            matters; commit cannot verify a digest that was never declared
            at grant time (S15).
        digest:
          type: string
          description: Hex-encoded digest, algorithm named by digest_alg.
      description: >
        PUT grants are single-use. Default TTL 15 minutes, maximum 60 (S15).
        A PUT request above 64 MiB on a backend whose Capabilities() reports
        NativeMultipart starts a native multipart upload instead of a
        single-shot grant (S16) — see TransferGrantResponse.upload_id.

    TransferGrantResponse:
      type: object
      required: [grant_id, method, expires_at, content_type, max_bytes]
      properties:
        grant_id: { type: string }
        url:
          type: string
          description: >
            Never the physical bucket, backend URL, or a credential — a
            complete, ready-to-use presigned (or facade) URL (S15). Absent
            when upload_id is present (S16) — a native multipart upload has
            no single URL for the whole object, only per-part ones obtained
            via POST .../grants/{projectID}/{grantID}/parts/{partNumber}.
        method:
          type: string
          enum: [PUT]
          description: Always "PUT" — see CreateTransferGrantRequest.method.
        expires_at: { type: string, format: date-time }
        content_type: { type: string }
        max_bytes: { type: integer, format: int64 }
        upload_id:
          type: string
          description: >
            Present only for a native multipart upload (S16) — mutually
            exclusive with url. Exchange it for part-level presigned URLs,
            then finish with :completeMultipart or cancel with
            :abortMultipart.

    PresignUploadPartResponse:
      type: object
      required: [part_number, url, expires_at]
      description: >
        Response for POST .../grants/{projectID}/{grantID}/parts/{partNumber}
        (S16).
      properties:
        part_number: { type: integer, format: int32 }
        url:
          type: string
          description: A presigned PUT URL for this part only.
        expires_at:
          type: string
          format: date-time
          description: >
            Never later than the parent grant's own expires_at — a part URL
            cannot outlive the upload session it belongs to.

    CompletedPart:
      type: object
      required: [part_number, etag]
      properties:
        part_number: { type: integer, format: int32 }
        etag:
          type: string
          description: The ETag the backend returned for this part's upload.

    CompleteMultipartRequest:
