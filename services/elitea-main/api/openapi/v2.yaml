  # ---------------------------------------------------------------------------
  # BUDGETS & USAGE (issue #246)
  #
  # Ported from legacy/plugins/elitea_core/api/v2/{project_budget,
  # project_budgets,user_budget,user_budgets,usage}.py. The `prompt_lib` and
  # `administration` segments are LITERAL, not a `{mode}` placeholder: the mode
  # selects which handler and which permission gate runs, and the per-member
  # read differs between the two by more than its gate.
  # ---------------------------------------------------------------------------
  /elitea_core/project_budget/prompt_lib/{project_id}/budget:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectBudget
      summary: A project's own monthly budget and current-period spend
      description: |
        The limit an operator authored, the spend accrued against it this
        calendar month, and the derived remaining/percent figures.

        `limit_source` says where the enforced limit came from: `explicit` when
        one is set and enabled for this project, `unlimited` otherwise. The
        reference had a third value, `default`, for a platform-wide fallback
        limit; this platform has none — gateway.project_budget is the only
        limit there is.

        `spend_available` distinguishes "no calls billed yet this period" from
        "no usage data": the accrued figure comes from the budget write-back
        consumer, and its absence is a fact about the pipeline, not about the
        project.

        Token counts and the per-model / per-day breakdown the reference served
        from LiteLLM are ABSENT, not zero: the write-back path persists one
        accumulated USD figure per scope and period, and zero-filling them
        would read as "this project made no calls".

        Available to project members. A member who is neither a project admin nor
        the owner of a personal project receives the same payload with
        `monthly_limit`, `effective_limit`, `spend`, `remaining` and `currency`
        REMOVED and `can_see_amounts: false` — the same rule `getProjectUsage`
        applies, because the two serve the same figures behind the same gate and
        redacting only one of them would leave the other as a way around it.

        The administration-mode twin below serves platform administrators
        regardless of membership and never redacts.
      tags: [budgets]
      responses:
        '200':
          description: Budget state and current-period spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/project_budget/administration/{project_id}/budget:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectBudgetAdmin
      summary: Any project's budget and current-period spend (admin)
      description: |
        The same payload as the project-scoped read, for a platform
        administrator who is not a member of the project.
      tags: [budgets]
      responses:
        '200':
          description: Budget state and current-period spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: setProjectBudget
      summary: Set a project's monthly budget (admin)
      description: |
        Creates or replaces the project's limit. The write lands on the row the
        LLM gateway reads on every call, so it takes effect on the next call
        rather than at the next period.

        The response is the resulting state, which can differ from what was
        sent: a null `monthly_limit` or `enabled: false` leaves the project
        unlimited, so `effective_limit` and `limit_source` are the fields worth
        reading back.

        `currency` other than `USD` is rejected rather than stored. Nothing in
        the money path converts, so an accepted label would sit on a limit the
        gateway still enforces in dollars.

        `budget_period` and `nats_fail_mode` are settable here and nowhere else.
        Both are columns the gateway reads and nothing in the platform used to
        write.
      tags: [budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBudgetWrite'
      responses:
        '200':
          description: Budget state after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudget'
        '400':
          description: |
            Negative or non-numeric limit, unsupported currency, out-of-range
            threshold, or an unsupported `budget_period` / `nats_fail_mode`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: clearProjectBudget
      summary: Clear a project's budget back to the platform default (admin)
      description: |
        Removes the authored row, so the project inherits the platform's
        soft-alert threshold and NATS-failure policy again and is unlimited.

        This is NOT the same as `enabled: false`. That stores "deliberately
        exempt" — an authored decision that keeps the old ceiling on the screen
        and pins the threshold that was chosen with it. A cleared project has no
        authored budget at all and follows the platform as it changes.

        The response is the resulting state, for the same reason the PUT's is:
        after a clear the effective figures are the inherited ones, and a 204
        would leave the caller to guess them.

        Clearing a project that has no budget succeeds. The endpoint states an
        intent that is already true, so a retry after a lost response is not a
        failure. Current-period spend is untouched.
      tags: [budgets]
      responses:
        '200':
          description: Budget state after the clear
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/project_budgets/administration:
    get:
      operationId: listProjectBudgets
      summary: Every project's budget and current-period spend (admin)
      description: |
        Backs Admin → Budgets. `counts` labels the team/personal tabs and is
        computed over ALL projects; `total` describes the filtered set the rows
        come from.

        Only `name` and `id` are orderable. Limit, spend and utilisation are
        per-row derivations, so ordering by them would sort the page that was
        already fetched rather than the table; an unsupported `sort_by` falls
        back to `name`.

        A personal project is reported with its owner's identity as
        `display_name`, since `project_user_<n>` is not a name anyone searches
        for.
      tags: [budgets]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Matches project name, project id, or the owner's name or email.
        - name: project_type
          in: query
          required: false
          schema: { type: string, enum: [team, personal] }
        - name: sort_by
          in: query
          required: false
          schema: { type: string, enum: [name, id], default: name }
        - name: sort_order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: One page of project budgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudgetListing'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/user_budget/prompt_lib/{project_id}/user_budget/{user_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: user_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getMemberBudget
      summary: One member's budget within a project
      description: |
        A member may read only their OWN row; asking for another member's
        returns 403 unless the caller is an admin of the project.

        `enforced` is FALSE, and that is a statement about the platform, not
        this project: the gateway's admission check is project-scoped only, so
        a per-member limit is an authored intention that nothing currently
        blocks a call on. Render it as authored-but-inactive.
      tags: [budgets]
      responses:
        '200':
          description: The member's budget state and current-period spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: The caller asked for another member's budget and is not a project admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/user_budget/administration/{project_id}/user_budget/{user_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: user_id
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: getMemberBudgetAdmin
      summary: Any member's budget within any project (admin)
      tags: [budgets]
      responses:
        '200':
          description: The member's budget state and current-period spend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: setMemberBudget
      summary: Set one member's budget within a project (admin)
      description: |
        Caps a single member's share without changing the project's own limit.

        ENFORCED since issue #321: see `enforced` on the response.

        `budget_period` and `nats_fail_mode` are REFUSED with a 400 rather than
        ignored. Both are project-scoped, and a 200 over a discarded field is
        indistinguishable from one that took effect.
      tags: [budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetWrite'
      responses:
        '200':
          description: The member's budget state after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudget'
        '400':
          description: |
            Negative or non-numeric limit, unsupported currency, out-of-range
            threshold, or a project-scoped `budget_period` / `nats_fail_mode`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: clearMemberBudget
      summary: Clear one member's budget back to the project default (admin)
      description: |
        Removes the member's authored cap, so they are bounded by the project
        ceiling alone.

        It matters more here than at project scope, because a member cap is
        enforced: the gateway refuses an over-cap member with 402
        `member_budget_exceeded`. Without this route the only way to lift a cap
        set by mistake was `enabled: false`, which stores the different fact
        "this member is deliberately exempt" and leaves the wrong number beside
        it.

        Clearing a member who has no cap succeeds, and the member's
        current-period spend is untouched.
      tags: [budgets]
      responses:
        '200':
          description: The member's budget state after the clear
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudget'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/user_budgets/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listMemberBudgets
      summary: Per-member budgets and spend for a project
      description: |
        Backs the Members section of Settings → Usage.

        Restricted to admins OF THIS PROJECT: an ordinary member may see their
        own usage and not their colleagues', so the whole table is admin-only
        and other members receive 403.
      tags: [budgets]
      responses:
        '200':
          description: One row per project member, plus the project's warning threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudgetListing'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: The caller is not an admin of this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/user_budgets/administration/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listMemberBudgetsAdmin
      summary: Per-member budgets and spend for any project (admin)
      tags: [budgets]
      responses:
        '200':
          description: One row per project member, plus the project's warning threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBudgetListing'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/usage/prompt_lib/{project_id}/usage:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectUsage
      summary: Current-period usage against the applicable budget
      description: |
        Backs Settings → Usage. The period is the current calendar month and is
        reported back in `period_start`, `period_end` and `resets_at`, so no
        date range is accepted.

        `scope=project` reports the whole project; `scope=user` reports only the
        calling member's own budget within it.

        The dimensional views — `daily`, `models` and the token totals — come
        from the per-request usage ledger added by issue #320. They are ABSENT,
        not empty, when the ledger holds no row for the scope in this period:
        an empty series reads as "no calls were made", which is a different and
        wrong claim about a deployment upgraded part-way through a period.
        `usage_events_available` says which case the payload is in, exactly as
        `spend_available` distinguishes "no spend yet" from "no data".

        A member who may not see platform cost figures receives the same payload
        with `monthly_limit`, `effective_limit`, `spend`, `remaining` and
        `currency` REMOVED and `can_see_amounts: false`; the `spend` inside each
        `daily` and `models` row is removed too, because leaving the same money
        in a per-day series would make the control decorative. Percentages, the
        warning threshold, the period and the token counts are still present, so
        the usage bar and the charts still render. Project admins, and the owner
        of a personal project, see the amounts.
      tags: [budgets]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [project, user], default: project }
      responses:
        '200':
          description: Usage and budget state for the requested scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          description: scope was neither 'project' nor 'user'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

