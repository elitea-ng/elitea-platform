            `already_member`. The response is still 200 — the batch is a
            report, and a 400 would say nothing landed when something did.
        role:
          type: string
          description: The role that was requested, echoed back.
        requested:
          type: integer
          description: >
            The size of the cross product after duplicate and non-positive ids
            were dropped, so it can differ from the submitted array lengths.
        added: { type: integer }
        skipped:
          type: integer
          description: Pairs whose account was already a member with that role.
        failed: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/BulkInviteResult' }

    UserProjectRoleMap:
      type: object
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:99-110 —
        role name → its sorted permission names, for the first personal project.
      additionalProperties:
        type: array
        items: { type: string }

    PermissionMatrixRow:
      type: object
      required: [name]
      description: >
        NOTE(W2): internal/api/v2/admin/roles.go:139-147 — one permission and
        one boolean column per role.
      properties:
        name:
          type: string
          description: The permission name.
      additionalProperties:
        type: boolean

    PermissionMatrix:
      type: object
      required: [total, rows]
      description: >
        NOTE(W2): internal/api/v2/admin/roles.go:148-152. `total` counts the
        permission CATALOGUE; this endpoint is never paginated.
      properties:
        total: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PermissionMatrixRow' }

    UserProjectPermissionsUpdate:
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:373-420 —
        both shapes the reference accepts: the role map, or the matrix rows the
        GET returns with ?old_format.
      oneOf:
        - $ref: '#/components/schemas/UserProjectRoleMap'
        - type: array
          items: { $ref: '#/components/schemas/PermissionMatrixRow' }

    UserProjectPermissionsResult:
      type: object
      required: [role_map, projects, roles_created, granted, revoked, roles_assigned]
      description: >
        NOTE(W2): internal/api/v2/admin/user_project_permissions.go:180-187.
        `role_map` is the reference's own response field; the counters are what
        make a no-op distinguishable from a save.
      properties:
        role_map: { $ref: '#/components/schemas/UserProjectRoleMap' }
        projects:
          type: integer
          description: How many projects the save was applied to.
        roles_created: { type: integer }
        granted: { type: integer }
        revoked: { type: integer }
        roles_assigned:
          type: integer
          description: Role assignments added to existing members by ?append_user_role.

    ProjectGroup:
      type: object
      required: [id, name]
      description: >
        NOTE(W2): internal/api/v2/projects/handler.go — the Group struct.
      properties:
        id: { type: integer }
        name: { type: string }

    ProjectWithGroups:
      type: object
      required: [id, name, owner_id, plugins, keycloak_groups, create_success, suspended, groups]
      description: >
        NOTE(W2): two producers write this body. The three group writes return
        it from internal/api/v2/projects/groups.go:295-330. The project listing
        returns an array of it from internal/api/v2/projects/handler.go:134-143
        (the Project struct) assembled at :226-251. Both mirror the reference's
        ProjectListModel, so a client re-renders the group chips without
        re-fetching. The struct has no `status`, `description` or `role` field:
        handler_test.go:145-150 pins the eight-key golden body and fails on a
        non-baseline key.
      properties:
        id: { type: integer }
        name: { type: string }
        owner_id: { type: integer }
        plugins:
          type: array
          items: { type: string }
        keycloak_groups:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/projects/groups.go:310 — the column is
            copied out as raw JSON and never interpreted by this service; its
            shape belongs to the Keycloak integration.
        create_success: { type: boolean }
        suspended: { type: boolean }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ProjectGroup' }

    ProjectGroupCreate:
      type: object
      required: [name]
      description: >
        NOTE(W2): internal/api/v2/projects/groups.go:57-59. `no_group` is
        rejected: it is the sentinel the listing uses for "no group at all".
      properties:
        name: { type: string }

    PublishedAgentVersion:
      type: object
      required: [version_id, version_name, published_at, published_by]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:40-45.
      properties:
        version_id: { type: integer }
        version_name: { type: string }
        published_at:
          type: string
          nullable: true
          description: The version's creation timestamp, `YYYY-MM-DDTHH:MM:SS`.
        published_by:
          nullable: true
          description: >
            `meta.published_by` of the version, verbatim. Unconstrained because
            it is whatever the publishing path stored there.
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:44 —
            copied straight out of the version's meta JSON.

    PublishedAgentAdoption:
      type: object
      required: [conversation_count, project_count]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:47-54.
        Both counters are NULL when the agent's `meta.adoption` is absent —
        nothing in this stack writes that key. The reference defaults them to
        0, which renders as "nobody uses this" rather than "this platform does
        not measure that".
      properties:
        conversation_count:
          type: integer
          nullable: true
        project_count:
          type: integer
          nullable: true

    PublishedAgent:
      type: object
      required:
        [public_agent_id, name, description, author_project_id, published_versions,
         total_published_versions, adoption, created_at]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:56-65.
      properties:
        public_agent_id: { type: integer }
        name: { type: string }
        description: { type: string }
        author_project_id:
          type: integer
          nullable: true
          description: >
            `applications.shared_owner_id` — the project the agent was published
            FROM. Null for a row published without one.
        published_versions:
          type: array
          items: { $ref: '#/components/schemas/PublishedAgentVersion' }
        total_published_versions: { type: integer }
        adoption: { $ref: '#/components/schemas/PublishedAgentAdoption' }
        created_at:
          type: string
          nullable: true

    PublishedAgentsListing:
      type: object
      required: [items, total, page, page_size]
      description: >
        NOTE(W2): internal/api/v2/eliteacore/admin_published_agents.go:110-115.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublishedAgent' }
        total:
          type: integer
          description: Published agents in the public project, before paging.
        page: { type: integer }
        page_size: { type: integer }

    # ---- Author detail (eliteacore) ---------------------------------------
    AuthorDetail:
      type: object
      properties:
        id:
          type: integer
          description: >
            `strconv.Atoi` of the `{author_id}` path parameter
            (handler.go:428); silently 0 if the path segment isn't numeric
            (the parse error is ignored).
        name: { type: string }
        email: { type: string }
        avatar: { type: string }
        title:
          type: string
          description: Always "" — hardcoded (handler.go:431).
        description: { type: string }
        total_conversations:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:432).
        public_conversations:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:432).
        public_applications:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:433).
        total_applications:
          type: integer
          description: >
            Real `COUNT(*)` of non-pipeline applications owned by this
            author, summed across every project schema the author belongs to
            (handler.go:397-421, query at :414).
        public_pipelines:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:434).
        total_pipelines:
          type: integer
          description: Real COUNT(*) of pipeline-type applications (handler.go:417).
        total_toolkits:
          type: integer
          description: Real COUNT(*) of elitea_tools rows authored (handler.go:420).
        public_collections:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:435).
        total_collections:
          type: integer
          description: Real COUNT(*) of prompt_collections rows authored (handler.go:423).
        rewards:
          type: integer
          description: Always 0 — hardcoded stub (handler.go:436).
      description: >
        NOTE(W2): eliteacore.Author
        (internal/api/v2/eliteacore/handler.go:380-438, fields at :429-437) —
        NOT internal/api/v2/social's ListAuthors/GetAuthor, a different
        handler/package despite the similar name. BUG-FOR-BUG: on
        no-matching-author or any DB error, the handler writes a bare `{}`
        with 200 (:392-395) instead of a 404 — every property above is
        therefore genuinely optional (no `required` list); a real author
        response always includes all of them.

    # ---- Secrets (v2/secrets) ---------------------------------------------
    SecretListItem:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/handler.go's SecretListItem —
        the list element AND the body returned by create and update. It
        NEVER carries a value; the plaintext is reachable only through the
        single-secret GET.
      properties:
        name:
          type: string
          description: The secret's canonical name (the vault map key).
        secret_name:
          type: string
          description: The `{{secret.<name>}}` placeholder, for display.
        is_default:
          type: boolean
          description: >
            BUG-FOR-BUG: always false from the Go handler. pylon sets it
            from elitea_core's `default_secret_keys` config
            (legacy/plugins/secrets/api/v2/secrets.py), which elitea-main
            does not read.
      required: [name, secret_name, is_default]

    SecretDetail:
      type: object
      description: >
        The single-secret GET response — the ONLY endpoint in this domain
        that returns plaintext.
      properties:
        name: { type: string }
        secret_name: { type: string }
        is_default: { type: boolean }
        is_hidden:
          type: boolean
          description: True when the secret was found in `hidden_secrets`.
        value:
          type: string
          description: The plaintext secret value.
      required: [name, secret_name, is_default, is_hidden, value]

    SecretCreateRequest:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
      required: [name, value]

    SecretUpdateRequest:
      type: object
      description: >
        `name` is the NEW name — sending a different one renames the secret
        addressed by the `{name}` path parameter. Omitting it (or sending
        "") keeps the path name (handler.go's Update).
      properties:
        name: { type: string }
        value: { type: string }
      required: [value]

    # ---- Secrets, administration mode (the GLOBAL vault) -------------------
    #
    # The administration handler is a SECOND handler over a different store
    # (internal/api/v2/secrets/admin.go, vault row id "admin"). It ignores the
    # {projectID} segment, and its bodies are pylon's admin bodies, not the
    # project ones above.
    AdminSecretListItem:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/admin.go:116-127 — one row of
        the administration listing. `secret` is always the literal mask
        "******"; the listing never carries plaintext.
      properties:
        name: { type: string }
        secret:
          type: string
          description: Always the literal mask "******".
      required: [name, secret]

    AdminSecretValue:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/admin.go:190-209 — the
        administration single-secret GET. An unknown name is `{"secret": null}`
        with 200, as in pylon.
      properties:
        secret:
          type: string
          nullable: true
          description: The plaintext value, or null when the name is unknown.
      required: [secret]

    AdminSecretCreateRequest:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/admin.go:227-235 — the body of
        the administration-mode create. The name comes from the path.
      properties:
        secret: { type: string }
      required: [secret]

    AdminSecretUpdateRequest:
      type: object
      description: >
        NOTE(issue 151): internal/api/v2/secrets/admin.go:129-135 — the NESTED
        body pylon's admin PUT takes. `old_name` selects the entry to replace
        and the path `{name}` is what it becomes, so a rename is
        `old_name != name`. An empty `old_name` means the path name.
      properties:
        secret:
          type: object
          properties:
            old_name: { type: string }
            value: { type: string }
          required: [value]
      required: [secret]

    AdminMessageResponse:
      type: object
      description: >
        NOTE(issue 151): every administration-mode message and error body is
        `{"message": "..."}` (internal/api/v2/secrets/admin.go), NOT the
        `{"error": "..."}` of ErrorResponse.
      properties:
        message: { type: string }
      required: [message]

    SecretsModeErrorBody:
      description: >
        NOTE(issue 151): the error body of a mode-ful /secrets route. `default`
        writes {"error": "..."}; `administration` writes {"message": "..."}.
        The two modes are separate handlers, so the envelope follows the mode.
      oneOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - $ref: '#/components/schemas/AdminMessageResponse'

    # -----------------------------------------------------------------------
    # Agent Evaluation slice 2 — dataset, run, result (#617).
    #
    # The vocabulary is the reference UI's, not this repository's usual one:
    # the run status set is `created | running | finished | errored |
    # cancelled` rather than queued/done/failed, because `isRunTerminal` and
    # `isRunActive` in the reference's own helpers switch on those exact five
    # strings and a status the client does not know renders as a blank chip.
    # -----------------------------------------------------------------------
    EvalDataset:
      type: object
      description: >
        A named set of evaluation cases. `case_count` is the STORED count and
        never the length of a page: the detail read is paged, so a client that
        counted the page would report a dataset of 900 cases as having 200.
      properties:
        id: { type: string }
        uuid: { type: string }
        name: { type: string }
        description: { type: string }
        application_id:
          type: integer
          nullable: true
          description: >
            The agent this dataset was authored for. `null` is a project-wide
            dataset. It is `application_id` and not the reference's `agent_id`
            because every agent reference in this schema is an `applications`
            row; the QUERY PARAMETER stays `agent_id`.
        is_shared: { type: boolean }
        case_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
      required: [id, name, description, application_id, is_shared, case_count]

    EvalDatasetDetail:
      description: >
        One dataset plus a page of its cases. `cases` is ALWAYS present, empty
        or not: a missing key reads as "not loaded yet" and a client waits for
        a load that already happened. The LIST answers `EvalDataset`, which
        carries no `cases` key at all, because `cases: []` on every row of a
        listing tells a client that a dataset with ten cases has none.
      allOf:
        - $ref: '#/components/schemas/EvalDataset'
        - type: object
          properties:
            cases:
              type: array
              items: { $ref: '#/components/schemas/EvalDatasetCase' }
            cases_truncated:
              type: boolean
              description: >
                The page is short of the dataset. Computed from the stored count
                and the window, NOT from `len(cases) == limit` — the two differ
                on the exact boundary.
          required: [cases, cases_truncated]

    EvalDatasetList:
      type: object
      description: >
        The `{rows,total}` envelope every /elitea_core project listing uses.
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/EvalDataset' }
        total: { type: integer }
      required: [rows, total]

    EvalDatasetCase:
      type: object
      description: >
        One evaluation case: what the agent is asked, the template variables it
        is asked with, and the answer the author expected if they stated one.
      properties:
        id: { type: string }
        dataset_id: { type: string }
        input: { type: string }
        variables:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the case's template variables, an arbitrary string-keyed
            map the author writes and the judge prompt reads verbatim
            (internal/api/v2/evaluation/dataset.go:116, Variables map[string]any).
          description: >
            Substituted into `input` as `{{name}}`. Never null: the client
            spreads this object.
        expected_output:
          type: string
          nullable: true
          description: >
            `null` means the author stated no expected answer, which is NOT the
            same as an expected answer of "". A judge told to compare against
            "" marks every non-empty answer wrong.
        source_type:
          type: string
          enum: [manual, import, conversation]
        order_index: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
      required: [id, dataset_id, input, variables, expected_output, source_type, order_index]

    EvalDatasetWriteRequest:
      type: object
      description: >
        Unknown fields are REFUSED, not dropped. The reference's own dataset
        body carries `isShared` in camelCase while this API is snake_case
        throughout, and a lenient decoder would answer 201 for a setting it
        never stored.
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string }
        application_id: { type: integer, nullable: true }
        is_shared: { type: boolean }
      required: [name]
      additionalProperties: false

    EvalDatasetCaseWriteRequest:
      type: object
      properties:
        input: { type: string }
        variables:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the case's template variables, an arbitrary string-keyed
            map the author writes and the judge prompt reads verbatim
            (internal/api/v2/evaluation/dataset.go:116, Variables map[string]any).
        expected_output: { type: string, nullable: true }
      required: [input]
      additionalProperties: false

    EvalRunSnapshotDimension:
      type: object
      description: >
        One dimension AS IT WAS when the run started. The scorecard normalises
        against these numbers and not against the library row: a dimension is
        editable, and the normalisation divides by the scale range and flips on
        polarity, so an edit would re-scale a finished run with no record.
      properties:
        name: { type: string }
        description:
          type: string
          description: The rubric, which is also the AI judge's prompt.
        scale_type: { type: string, enum: [binary, ordinal, continuous] }
        scale_min: { type: number }
        scale_max: { type: number }
        polarity: { type: string, enum: [higher_better, lower_better] }

    EvalRunSnapshotBinding:
      type: object
      description: >
        What a suite table will hold when one exists. This release builds one
        per requested dimension from that dimension's own defaults, which is
        why no binding table is needed yet.
      properties:
        dimension_id: { type: string }
        engine:
          type: string
          enum: [ai, human, code]
          description: >
            Always `ai` in this release. Stored rather than implied, so a later
            `code` or `human` binding is distinguishable from these instead of
            every historical row claiming the newest default.
        weight: { type: number }
        target: { type: number, nullable: true }
        target_operator: { type: string }
        order_index: { type: integer }

    EvalRunSnapshot:
      type: object
      properties:
        cases:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              order_index: { type: integer }
        dimensions:
          type: object
          additionalProperties: { $ref: '#/components/schemas/EvalRunSnapshotDimension' }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/EvalRunSnapshotBinding' }

    EvalRun:
      type: object
      properties:
        id: { type: string }
        uuid: { type: string }
        dataset_id: { type: string }
        application_id: { type: integer, nullable: true }
        application_version_id: { type: integer, nullable: true }
        trigger_type: { type: string, enum: [on_demand, offline_batch] }
        created_by: { type: integer, nullable: true }
        status:
          type: string
          enum: [created, running, finished, errored, cancelled]
        execution_mode:
          type: string
          enum: [predict_blocking, runtime_plane]
          description: >
            WHAT ACTUALLY RAN. `predict_blocking` is ONE blocking LLM turn per
            case, built from the agent version's instructions and the case
            input: no tools, no toolkits, no conversation memory. It is
            returned on every read so a score cannot claim to have measured
            what it did not, and so a later runtime-plane run is distinguishable
            from these rather than silently re-labelling them.
        snapshot: { $ref: '#/components/schemas/EvalRunSnapshot' }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
          required: [done, total]
        headline_score:
          type: number
          nullable: true
          description: >
            The mean of the run's `ok` normalised scores, or `null` when
            nothing was scored. NOT zero — zero is a real and very bad score.
        error: { type: string }
        created_at: { type: string }
        started_at: { type: string }
        finished_at: { type: string }
      required: [id, dataset_id, status, execution_mode, progress, headline_score]

    EvalRunList:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/EvalRun' }
        total: { type: integer }
      required: [rows, total]

    EvalRunStartRequest:
      type: object
      description: >
        No `suite_id`: there is no suite table in this release, so the
        dimensions are named directly and the server freezes their own defaults
        into the run's snapshot.
      properties:
        dataset_id: { type: string }
        application_id: { type: integer, nullable: true }
        application_version_id:
          type: integer
          description: >
            Required. The version carries the instructions the agent turn is
            built from, and defaulting to "the latest" would make a run's
            meaning depend on when it was read.
        dimension_ids:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 5
        trigger_type: { type: string, enum: [on_demand, offline_batch] }
      required: [dataset_id, application_version_id, dimension_ids]
      additionalProperties: false

    EvalRunResult:
      type: object
      description: >
        One score per (run, dataset case, dimension). `error` is what a judge
        that did not answer in the score schema produces — never `ok` with a
        score of 0, which would drag a headline down with a number nobody
        measured.
      properties:
        id: { type: string }
        run_id: { type: string }
        dataset_case_id: { type: string }
        dimension_id: { type: string }
        status:
          type: string
          enum: [ok, error, pending_human, skipped]
        native_score: { type: number, nullable: true }
        normalized_score: { type: number, nullable: true }
        target_met: { type: boolean, nullable: true }
        verdict:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the judge's parsed JSON object stored as returned
            (internal/api/v2/evaluation/run.go:181, Verdict map[string]any);
            the dimension prompt owns its shape.
          description: >
            `{score, reason}` on success; `{error, raw}` when the judge did not
            answer in schema. The RAW model text is kept because a judge failure
            is a prompt problem, and a prompt problem cannot be diagnosed from
            the word "error".
        evidence:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): engine evidence for the score, free-form per engine
            (internal/api/v2/evaluation/run.go:182, Evidence map[string]any).
          description: '`{input, output, expected_output}` — what was scored.'
        created_at: { type: string }
      required: [id, run_id, dataset_case_id, dimension_id, status, native_score, normalized_score]

    EvalScorecard:
      type: object
      description: >
        The READ-ONLY scorecard. `human_scores` is DELIBERATELY ABSENT: this
        release has no human-score surface, and answering `[]` would tell a
        client "there are none" where the truth is "this deployment cannot have
        any". `unavailable` names each omission with its reason — the shape
        internal/api/v2/budgets/usage_dimensions.go established.
      properties:
        run: { $ref: '#/components/schemas/EvalRun' }
        results:
          type: array
          items: { $ref: '#/components/schemas/EvalRunResult' }
        headline_score: { type: number, nullable: true }
        total: { type: integer }
        offset: { type: integer }
        unavailable:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              reason: { type: string }
            required: [key, reason]
      required: [run, results, headline_score, total, offset, unavailable]

    # ── Pipeline triggers and schedules (issues 192, 193) ──────────────────
    #
    # NOTE(W2): every field below is marshalled by
    # services/elitea-main/internal/api/v2/pipelinetriggers/triggers.go
    # (triggerView, :52-70) and .../schedules.go (scheduleView, :63-81). Both
    # structs are CLOSED — no map, no jsonb passthrough — so neither schema
    # carries an x-elitea-passthrough marker and neither is permissive.
    PipelineInboundTrigger:
      type: object
      description: >
        One pipeline version's inbound trigger. `configured: false` with no
        other field is the answer for a pipeline that has none, and is a 200
        rather than a 404 because "no trigger yet" is the normal state of
        almost every pipeline (triggers.go GetTrigger, :96-115).
      required: [configured]
      additionalProperties: false
      properties:
        configured:
          type: boolean
          description: Whether this pipeline version has a trigger row at all.
        token_id:
          type: string
          description: >
            The PUBLIC half of the credential, and the only part in the inbound
            URL path. It is unguessable on its own account so an inbound caller
            cannot enumerate a deployment's pipelines.
        url:
          type: string
          description: >
            The inbound URL WITHOUT the secret. Present on every read.
        secret:
          type: string
          description: >
            The credential itself. Present ONLY on the create/rotate response
            and on the reveal response, both of which require the write
            permission. Absent — not empty — everywhere else.
        secret_url:
          type: string
          description: >
            `url` with the secret in the `token` query parameter, which is the
            complete thing a person copies. The header form is preferred and is
            what the trigger documentation shows first: a URL is written to
            proxy logs, and a credential in one outlives the request.
        created_by:
          type: integer
          format: int64
          description: >
            The user an inbound run executes as. Their project permission is
            re-resolved on EVERY inbound call, so a trigger grants no more than
            its creator still has.
        created_at: { type: string, format: date-time }
        rotated_at:
          type: string
          format: date-time
          description: When the credential was last replaced. Absent if never.
        revoked_at:
          type: string
          format: date-time
          description: >
            When the trigger was revoked. The row is kept rather than deleted so
            "was this live last Tuesday" has an answer; the inbound path refuses
            any row where this is set.
        last_used_at:
          type: string
          format: date-time
          description: When an inbound call last presented a correct secret.

    PipelineSchedule:
      type: object
      description: >
        One pipeline version's cron schedule (schedules.go scheduleView).
        `configured: false` is the answer for a pipeline with no schedule.
      required: [configured, active]
      additionalProperties: false
      properties:
        configured: { type: boolean }
        cron:
          type: string
          description: >
            A FIVE-FIELD cron expression. Names such as `@daily` are refused:
            the parser that validates this write is the same one that fires the
            row, and an expression it cannot parse would silently never fire.
        active:
          type: boolean
          description: Whether the platform scheduler will fire this row.
        input:
          type: string
          description: The text a scheduled run puts in front of the pipeline.
        author_id:
          type: integer
          format: int64
          description: >
            Who a scheduled run executes as. Re-validated at FIRE time, not at
            save time. Saving the schedule sets it to the caller, so a person
            cannot retarget somebody else's identity onto a new time.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_run:
          type: string
          format: date-time
          description: >
            Stamped ONLY on a real dispatch. A maintenance window or a skipped
            overlap leaves it alone, so the row is due exactly once when the
            reason clears rather than once per missed minute.
        last_result:
          type: string
          description: The outcome of the most recent fire attempt.
          enum: [dispatched, skipped_overlap, skipped_unauthorized, skipped_missing_version, failed]
        last_result_detail:
          type: string
          description: One sentence saying why, for every non-dispatch outcome.
        last_result_at: { type: string, format: date-time }
        last_execution_id:
          type: string
          description: The execution the last dispatch admitted.
        next_run:
          type: string
          format: date-time
          description: >
            COMPUTED, not stored, and computed with the parser that will fire
            the row — so the preview cannot disagree with the behaviour. Absent
            when the stored expression cannot be parsed.

    PipelineScheduleUpdate:
      type: object
      description: >
        The accepted schedule write (schedules.go scheduleBody, :126-130).
        There is deliberately no `author_id` and no `last_*` field: the author
        is the authenticated caller, and the outcome columns belong to the
        runner.
      required: [cron]
      additionalProperties: false
      properties:
        cron: { type: string }
        active: { type: boolean }
        input: { type: string }

    PipelineInboundTriggerRunRequest:
      type: object
      description: >
        The inbound call's body (inbound.go inboundBody, :70-73). It may be
        empty, and an unparseable body is accepted as an empty input: a webhook
        sender's payload format is not this service's contract.
      additionalProperties: false
      properties:
        input:
          type: string
          description: The text placed in front of the pipeline.

    PipelineInboundTriggerRunAccepted:
      type: object
      description: >
        The inbound call's answer (inbound.go Trigger, :195-201). It reports
        that the run was ADMITTED; the run has not finished and will not finish
        inside this request.
      required: [execution_id, conversation_id, project_id, version_id, events_url]
      additionalProperties: false
      properties:
        execution_id: { type: string }
        conversation_id:
          type: string
          description: The transcript the run is recorded in.
        project_id: { type: integer, format: int64 }
        version_id: { type: integer, format: int64 }
        events_url:
          type: string
          description: >
            The durable event stream for this execution — the same path the
            browser subscribes to. Poll or subscribe to follow the run.


  responses:
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    # The mode-ful /secrets routes serve two handlers with two error envelopes.
    # `default` writes {"error": "..."}; `administration` writes
    # {"message": "..."} (internal/api/v2/secrets/admin.go).
    SecretsModeError:
      description: Error, in the envelope the selected mode's handler writes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SecretsModeErrorBody'

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ==========================================================================
  # ADMIN — users
  # NOTE(#130): the router used to wire GET/POST/PUT/DELETE all onto eliteacore
  # Users, which does no method branching — every verb returned the same
  # {rows,total} listing, so Invite / Edit role / Remove reported success and
  # wrote nothing. The three write verbs now reach real handlers
  # (internal/api/v2/eliteacore/users_write.go) that speak pylon's contract
  # (legacy/plugins/admin/api/v2/users.py) and are each gated on the matching
  # `configuration.users.users.*` permission.
  #
  # This path template pins mode=default. `administration` mode addresses the
  # global scope, not a project membership, and answers 501.
  # ==========================================================================
  /admin/users/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: userList
      summary: List users for a project
      description: |
        UserList returns a paginated list of users for a project.
        NOTE(W2): response from internal/api/v2/eliteacore/handler.go:190-263.
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: userCreate
      summary: Invite users into a project by email
      description: |
        Adds each address to the project with the given role names, creating an
        auth_core__user row for an address that has no account yet (that is what
        makes an invite an invite; the OIDC provisioning path links the provider
        on first login). An address that is already a member is reported as an
        error element and makes the whole response 400.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInviteRequest'
      responses:
        '200':
          description: Every address was added.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserInviteResult' }
        '400':
          description: >
            Malformed request, an unknown role name, or at least one address
            that could not be added (already a member / invalid). Carries the
            per-address results when the failure was per-address.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/UserInviteResult' }
                  - $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    put:
      operationId: userUpdate
      summary: Replace the project roles of one or more users
      description: |
        REPLACES the users' project role set with `roles` — unchecked boxes in
        the Edit-roles dialog have to mean something. An empty `roles` array is
        rejected rather than treated as "remove from project"; DELETE is the
        verb for that.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRolesUpdateRequest'
      responses:
        '200':
          description: Roles updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

    delete:
      operationId: userDelete
      summary: Remove one or more users from a project
      description: |
        Clears the users' rows in auth_core__project_user_role for this project.
        The auth_core__user account survives — the person may be a member of
        other projects, and "remove from project" is not "delete the account"
        (parity with pylon's remove_users_from_project).
      tags: [admin]
      parameters:
        - name: id[]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
          description: >
            IDs of the users to delete. The old SPA sends ONE occurrence with
            the ids comma-joined — `?id[]=1,2,3`
            (apps/elitea-ui/src/api/admin.js:120), hence explode:false. The new
            client does the same (getUserDeleteUrl stringifies the array), and
            the handler splits on commas as well as accepting repeated keys.
      responses:
        '200':
          description: Users removed from the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  # ==========================================================================
  # ADMIN — roles
  # ==========================================================================
  # ==========================================================================
  # ADMIN & TENANCY PARITY (issue 255)
  #
  # `administration` is a STATIC segment on all three, not a {mode} parameter:
  # each pylon original registers `mode_handlers = {'administration': AdminAPI}`
  # and nothing else, so another mode has no handler to reach. A {mode} route
  # would have to answer something plausible for a mode that does not exist.
  # ==========================================================================
  /admin/modes/administration:
    get:
      operationId: listUserModeRoles
      summary: List every central role assignment, across all modes
      description: |
        Which user holds which CENTRAL role in which pylon mode — the registry
        behind the admin console's Modes table. Each row carries the composite
        `<user_id>:<mode>:<role>` id the DELETE below consumes.

        The reference walks its runtime mode registry and asks for every
        (user, mode) pair over RPC; this is one join over the assignment table,
        so the modes reported are the modes that have roles.
      tags: [admin]
      responses:
        '200':
          description: Every central assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleListing'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: assignUserModeRole
      summary: Assign a user to a role in a mode
      description: |
        SINGLE-ROLE-PER-MODE: every assignment the user holds in that mode is
        dropped before the new one is written, in one transaction — the rule
        auth_core's assign_user_to_role enforces. A role the deployment does
        not define in that mode is a 400 and leaves the user's current role
        alone, rather than revoking it and granting nothing.

        Granting or revoking `super_admin` additionally requires the caller to
        hold `admin.auth.users.super_admin`: this endpoint writes the same
        table /admin/auth_users does, so without the guard it would be a
        second, unguarded route to the platform's highest role.

        `default` mode is refused. Default-mode roles are project membership,
        which has no meaning without a project id.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeRoleAssignRequest'
      responses:
        '200':
          description: The assignment now exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleAssignResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: >
            The caller lacks `modes.users`, or is assigning/revoking
            `super_admin` without `admin.auth.users.super_admin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      operationId: removeUserModeRole
      summary: Remove a user from a role in a mode
      description: |
        Takes the composite id the listing produces. The reference's handler is
        a `# TODO` that answers `{"ok": true}` having deleted nothing; this one
        deletes, and answers 404 when the triple names no assignment rather
        than reporting a removal that did not happen.
      tags: [admin]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: '`<user_id>:<mode>:<role>`, as returned by the listing.'
      responses:
        '200':
          description: The assignment was removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeRoleRemoveResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such assignment — nothing was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /admin/user_invite/administration:
    post:
      operationId: inviteUserGlobally
      summary: Create a platform user record for an address
      description: |
        The platform-level counterpart of the project invite
        (`POST /admin/users/{mode}/{project_id}`): it creates an
        `auth_core__user` row for an address that has never logged in, with no
        project and no role, so the console can then place them. The address is
        resolved by email on first login.

        An invitation e-mail is sent when outbound e-mail is configured
        (SMTP_HOST; ADR-0024 WP7), branded with the deployment's pack and
        linking to the deployment's public URL — the account is resolved by
        e-mail on first login, so the link carries no token.
        `invitation_delivered` reports whether it went out and
        `invitation_delivery` why not; answering a bare `{"ok": true}` would
        be rendered by a console as "invitation sent".

        Inviting an address that already has an account is not an error and is
        not a rename: `created` is false and the stored name is untouched.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalUserInviteRequest'
      responses:
        '200':
          description: The platform user record exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalUserInviteResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /admin/invites_bulk/administration:
    post:
      operationId: bulkInviteMembers
      summary: Add many users to many projects with one role
      description: |
        The admin cross-project bulk membership invite. Every listed account is
        added to every listed project with the one named role, and every
        (user, project) pair reports its own outcome.

        It replaces two pylon console pages —
        `legacy/plugins/admin/api/v2/invites_bulkusers.py` ("add every user to
        one project") and `invites_bulkprojects.py` ("add one user to many
        projects") — which are the same cross product with one side pinned.
        Both declare their own permission, and this route accepts either.

        Four differences from pylon are deliberate and are recorded in
        `internal/api/v2/admin/invites_bulk.go`:

        - The role set is ADDED to, never replaced. pylon's write replaces
          every role the account holds in the project, which run over "all
          users" demotes every existing project admin.
        - Per-pair outcomes, not one English log blob.
        - Ids and one typed role name, not comma-separated free text.
        - A personal project is refused: it is one account's own space and a
          bulk form may not place a stranger in it.

        One transaction per pair, so a project that does not define the role
        cannot roll back the pairs that succeeded. Re-running the same batch is
        safe: the second run reports `already_member` for every pair.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInviteRequest'
      responses:
        '200':
          description: >
            The per-pair report. 200 even when `ok` is false — read `failed`
            and each result's `outcome`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkInviteSummary'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /admin/background_jobs/administration:
    get:
      operationId: listBackgroundJobs
      summary: List the platform's background jobs
      description: >
        The admin Tasks page. It unions the runtime plane
        (elitea_runtime.execution_jobs, whose capability_id gives the kind),
        the scheduler's due work (elitea_runtime.scheduled_occurrences) and
        every project's evaluation runs. It is NOT the pylon Arbiter task node
        that /admin/tasks/{mode} answers 501 for. The rows keep the legacy
        listing's task_id, status, started_at and user keys. `truncated`
        reports that the per-source scan window was full, so older rows exist
        that this page cannot reach.
      tags: [admin]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [index, agent, toolkit, execution, schedule, eval]
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: One page of the union
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundJobListResponse'
        '400':
          description: project_id is not a positive integer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: This deployment has no background-job store configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/background_jobs/administration/{kind}/{jobID}:cancel:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [index, agent, toolkit, execution, schedule, eval]
      - name: jobID
        in: path
        required: true
        description: The row's task_id.
        schema: { type: string }
      - name: project_id
        in: query
        required: false
        description: >
          Required for kind=eval and ignored otherwise. A run id is unique only
          within its own project schema. It travels in the query rather than in
          a composite path id because the route's own `:cancel` suffix already
          claims the colon.
        schema: { type: integer, format: int64 }

    post:
      operationId: cancelBackgroundJob
      summary: Stop one background job
      description: >
        Delegates per kind. A runtime job stops by its durable desired state,
        the same primitive the per-kind cancels use; an evaluation run stops
        through the evaluation repository's own CancelRun; a scheduled
        occurrence cannot be stopped, because the next occurrence is already
        computed from the same schedule row - disable the schedule instead.
      tags: [admin]
      responses:
        '200':
          description: The job was asked to stop
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400':
          description: Unknown kind, or a malformed evaluation run id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '409':
          description: >
            The job has already settled, is already stopping, or is a
            scheduled occurrence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: This deployment has no store for this job kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/branding/administration:
    # ADR-0024 decision 5: the typed editor of the brand pack's DATABASE
    # layer. The same rows the generic Configuration page's `branding`
    # section edits through plugin_config_values, plus the facts that page
    # cannot show: which layers contribute, the effective merged pack and
    # its ETag. Gated on `configuration.branding` (shared migration 0109).
    get:
      operationId: getBrandingSettings
      summary: Read the brand pack's database layer and the effective pack
      description: |
        Returns the `branding` section's declared keys with stored values
        overlaid on the schema defaults (an empty string or 0 means "inherit
        from the layer below"), which of the two operator layers contribute to
        the served pack, the merged pack `GET /branding/bootstrap.js` serves
        right now (null when nothing is served), and its unquoted ETag.
      tags: [admin]
      responses:
        '200':
          description: The branding state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingSettings'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }
    put:
      operationId: saveBrandingSettings
      summary: Write the brand pack's database layer
      description: |
        Stores the supplied keys in one transaction (unknown keys are refused
        with 400, as are a hue that is not six hex digits, a link that is not
        an absolute http(s) URL and an asset that is not a path on this
        origin), invalidates the resolver's cache so the next bootstrap
        request on this replica serves the new brand, and answers with a
        fresh read of the same shape as GET with `saved: true`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingSettingsSave'
      responses:
        '200':
          description: The branding state after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingSettings'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /admin/branding/assets/{kind}:
    post:
      operationId: uploadBrandingAsset
      summary: Upload one brand asset (logo, mark, favicon, login art, e-mail logo, font)
      description: |
        ADR-0024 decision 3. A multipart form with one `file` part. The bytes
        are sniffed against the extension, capped per kind (images 512 KiB,
        favicon 64 KiB, WOFF2 fonts 300 KiB) and an SVG that could execute or
        fetch in this origin is refused with the reason named. The stored
        object is content-addressed; the answer's `path` is the value the
        branding section's asset fields and `font_faces[].url` take. Gated on
        `configuration.branding`.
      tags: [admin]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [logo-full, logo-mark, logo-email, favicon, login-art, font] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The stored asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingAsset'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '413':
          description: The file exceeds the kind's byte cap.
        '415':
          description: The extension or the content is not one the kind accepts.
        '503':
          description: No object store is configured on this deployment.

  /admin/branding/test_email/administration:
    post:
      operationId: sendBrandingTestEmail
      summary: Send one branded test e-mail
      description: |
        ADR-0024 WP7. Renders the test template against the resolved brand
        pack and sends it to `to`, so an administrator can see the e-mail
        brand without inviting anyone. 503 when no SMTP is configured or
        sending is suppressed, 400 for an address that is not a plain
        addr-spec, 502 when the relay refused (the reason is in `error`).
        Gated on `configuration.branding`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        '200':
          description: The message was accepted by the relay.
          content:
            application/json:
              schema:
                type: object
                required: [sent, to]
                properties:
                  sent: { type: boolean }
                  to: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '502':
          description: The mail relay refused the message.
        '503':
          description: Outbound e-mail is not configured on this deployment.

  /admin/branding/package/administration:
    # ADR-0024 decision 9: the branding package — a zip an administrator
    # downloads, restyles offline and uploads back. Gated on
    # configuration.branding.
    get:
      operationId: exportBrandingPackage
      summary: Download the current brand as a branding package (zip)
      description: |
        manifest.json, brand-pack.json (asset fields point at assets/…), the
        asset files, a JSON Schema, a README, and previews: the login page
        and the e-mails rendered under this brand, and preview/app.html, an
        offline previewer with the pack inlined. Byte-exact with what the
        platform serves; a fresh deployment exports the product default.
      tags: [admin]
      responses:
        '200':
          description: The package
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: Branding packages are not available on this deployment.
    post:
      operationId: importBrandingPackage
      summary: Import a branding package, with a dry run
      description: |
        A multipart form with one `file` part (the zip, at most 4 MiB). The
        package is read strictly — entry allowlist, zip-slip protection,
        per-kind asset caps and sniffers, the pack schema — and every problem
        is reported with the entry named. With `dry_run=true` the answer is
        the report and a field-by-field diff against the current brand and
        nothing changes. Without it the assets are stored, every branding key
        is set from the pack in one transaction, the resolver is invalidated,
        and the package is kept for rollback (the last five are kept).
      tags: [admin]
      parameters:
        - name: dry_run
          in: query
          required: false
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: The report; `applied` says whether the brand changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingPackageReport'
        '400':
          description: The package was refused; `problems` names every entry and reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingPackageReport'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '413':
          description: The upload exceeds 4 MiB.
        '503':
          description: Branding packages are not available on this deployment.

  /admin/branding/package/administration/versions:
    get:
      operationId: listBrandingPackageVersions
      summary: List the kept branding packages, newest first
      tags: [admin]
      responses:
        '200':
          description: The kept packages
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrandingPackageVersion'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: Branding packages are not available on this deployment.

  /admin/branding/package/administration/versions/{digest}/restore:
    post:
      operationId: restoreBrandingPackageVersion
      summary: Re-import a kept branding package
      description: The stored package is applied exactly as an import would be; it is not stored again.
      tags: [admin]
      parameters:
        - name: digest
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingPackageReport'
        '400':
          description: The stored package no longer passes the import rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingPackageReport'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '503':
          description: Branding packages are not available on this deployment.

  /admin/user_project_permissions/administration:
    get:
      operationId: getUserProjectPermissions
      summary: Read the permission matrix personal projects grant
      description: |
        The default every ordinary project gets, as opposed to the named scopes
        `/admin/permissions/{scope}/{mode}` edits. Read from the FIRST personal
        project (`project_user_<id>`); with no personal project at all the
        answer is 400, as it is in the reference.

        Default body is role → sorted permission names. `?old_format` returns
        the matrix rows instead — one row per permission in the catalogue, one
        boolean column per role — which is also the shape the PUT accepts back.
        Either body can be PUT back unchanged; both include the `system` role,
        which the PUT ignores rather than rejects.

        The grants reported are the project's OWN overrides, falling back to the
        central `default` matrix only when it has none. The reference reports
        the central matrix either way, so a project with overrides reads back
        as something its members do not have.
      tags: [admin]
      parameters:
        - name: old_format
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: Presence (not value) switches to the matrix-row shape.
      responses:
        '200':
          description: >
            The personal-project matrix. The schema shown is the DEFAULT body;
            with `?old_format` the body is a PermissionMatrix instead — the two
            are not modelled as a `oneOf` because the generated mock for a
            map-shaped `oneOf` branch does not type-check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectRoleMap'
        '400':
          description: This deployment has no personal projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: updateUserProjectPermissions
      summary: Apply a permission matrix across every personal or team project
      description: |
        REPLACES each named role's permission set — the submitted set is the
        whole set, so a permission left out is revoked — across every personal
        project, or with `?team_projects` across every project that is neither
        personal nor the public one.

        Everything runs in ONE transaction. The reference walks projects on
        autocommitting sessions and deletes a role's permissions before
        re-inserting them, so an interruption leaves part of the estate on the
        old matrix and can leave a role granting nothing at all.

        Revocation is bounded by the body's shape. The role map IS the role's
        whole permission set, so anything absent from it is revoked. The MATRIX
        shape revokes only within the permission rows it carries, so a filtered
        or paged view of the matrix cannot silently revoke what it never showed
        — the same rule the /admin/permissions PUT applies to the identical
        body.

        A role name that any target project does not define is a 400 unless
        `?create_role_if_not_exist` asks for it to be created; the reference
        silently skips it FOR THAT PROJECT and reports success for the whole
        estate. An unknown permission name is always a 400. The `system` role is
        neither written nor rejected: it appears in every body the GET produces,
        so rejecting it would make that body unsavable.
      tags: [admin]
      parameters:
        - name: team_projects
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: >
            Presence targets every SHARED project (excluding the public one)
            instead of the personal ones.
        - name: create_role_if_not_exist
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: Presence creates roles the target projects do not define.
        - name: append_user_role
          in: query
          schema: { type: boolean }
          allowEmptyValue: true
          description: >
            Presence also grants each named role to every existing member of the
            target projects who does not already hold it. It only ever adds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProjectPermissionsUpdate'
      responses:
        '200':
          description: What the save changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProjectPermissionsResult'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /admin/roles/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: roleList
      summary: List roles for a project
      description: |
        RoleList returns the project's roles as a PLAIN ARRAY.
        NOTE(W2): internal/api/v2/eliteacore/handler.go:266-298 — the UI's
        roleList maps over a bare array; limit/offset are accepted but not
