        the handler package's doc comment.
      tags: [tracing]
      responses:
        '200':
          description: Tracing status and configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracingStatusResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # ==========================================================================
  # TAGS
  # ==========================================================================
  /elitea_core/tags/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listTags
      summary: Get all tags for a project
      description: |
        NOTE(W2): {rows, total} envelope (NOT a bare array),
        internal/api/v2/tags/handler.go.
      tags: [tags]
      parameters:
        - name: entity_coverage
          in: query
          required: false
          schema:
            type: string
            enum: [all, application, pipeline, skill]
          description: >
            Narrows the list to the tags one KIND of entity carries. A
            project's `tags` table is shared by everything that can be
            tagged, so "the tags in this project" and "the tags I can filter
            agents by" are different sets. `application` is the tags of
            agents (applications with no pipeline version), `pipeline` the
            tags of pipelines, `skill` the tags of skill versions. An absent
            value — or `all` — answers every tag row the project holds,
            INCLUDING one that nothing carries yet, which is the only way a
            freshly created tag is visible. A value outside the enum is
            refused with 400; the legacy implementation answered an empty
            list, which reads exactly like a project with no tags.
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsList'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createTag
      summary: Create a tag in the project
      description: |
        Answers the STORED row, with the id the database chose.

        It is idempotent on the NAME: `tags.name` is unique per tenant schema
        and one name is one row shared by every version that carries it, so a
        second create of the same name answers the row that already exists
        rather than a second row or a conflict. `data` is written when the row
        is new and left alone when it is not — the blob belongs to every
        entity using the tag.

        This verb used to echo the request back with 201 and an `id` of 0,
        touching no table: a tag created here was in no list and its id
        addressed nothing.
      tags: [tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagWriteRequest'
      responses:
        '201':
          description: The stored tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /elitea_core/tags/prompt_lib/{project_id}/{tag_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: tag_id
        in: path
        required: true
        schema: { type: integer }

    delete:
      operationId: deleteTag
      summary: Remove a tag from the project
      description: |
        Removes the tag row and every association pointing at it, so the tag
        leaves the project's list and every entity that carried it.

        A tag the project does not hold answers 404 rather than the 204 a real
        delete answers: this verb used to write 204 and return, so a caller
        could not remove a tag at all and could not tell that it had not.
      tags: [tags]
      responses:
        '204':
          description: Deleted (no content)
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  # ==========================================================================
  # TOOLKITS
  # ==========================================================================
  /elitea_core/toolkits/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listToolkits
      summary: Toolkit-type settings schemas
      description: |
        NOTE(W2): the router points /toolkits/ at ListTypeSchemas
        (internal/api/router.go:375 → toolkits/handler.go:231-233) — the
        response is a MAP of toolkit type name to a JSON-Schema-shaped
        settings descriptor, not an instance array.
      tags: [toolkits]
      responses:
        '200':
          description: Toolkit type schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitTypeSchemas'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # NOTE(W2): "tools" (plural), NOT "toolkits" — a different, real, mounted
  # route (internal/api/router.go:369 `r.Get("/tools/prompt_lib/{projectID}",
  # toolkitHandler.List)`), sitting in the same toolkitHandler mount as the
  # already-spec'd /elitea_core/tool/prompt_lib/{project_id}/{tool_id}
  # (deleteApplicationTool, above) — same singular/plural prefix convention,
  # just the plural segment. Do not confuse this with listToolkits above,
  # which is ListTypeSchemas (a type-name → JSON-Schema map, not an instance
  # list) — hence this operation is named listToolkitInstances, not
  # listToolkits.
  /elitea_core/tools/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listToolkitInstances
      summary: List toolkit (tool) instances for a project
      description: |
        NOTE(W2): internal/api/v2/toolkits/handler.go:512-535 (List) calling
        pgRepo.ListToolkits (:811-860). limit/offset are read from the query
        string with their OWN clamp — out-of-[1,100] resets to 20
        (handler.go:518-520), narrower than the shared Limit parameter's
        documented [1,1000]/default 20; offset<0 resets to 0 (:521-523).
        The caller must be a member of {project_id} (or a super-admin), and a
        repository failure is returned as a safe 500 error.
      tags: [toolkits]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Toolkit instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitInstanceListResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

    post:
      operationId: createToolkit
      summary: Create a toolkit instance
      description: |
        NOTE(1c): internal/api/v2/toolkits/handler.go:538-563 (Create) calling
        pgRepo.CreateToolkit (:891+). Registered at router.go:647/672.

        `author_id` is NOT accepted from the client: the handler overwrites
        `body["_author_id"]` from the authenticated principal, defaulting to
        "1" when the context carries no user (:541-544). Sending it has no
        effect.

        Type-specific validation lives in `validateToolkitCreate` (:565-584)
        and currently covers exactly ONE type: `github` requires
        `settings.repository` (non-empty) and `settings.github_configuration`
        (present). Every other type passes validation with any settings, so
        `settings` is modelled open rather than as a per-type discriminated
        union — the union would encode a constraint the backend does not
        enforce. Violations return 400 {"error": "<reason>"}.

        Returns 201 with the created record.
      tags: [toolkits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolkitCreateRequest'
      responses:
        '201':
          description: Created toolkit instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitInstance'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  # NOTE(#440): the TOOL CATALOGUE of a toolkit — two reads that answer
  # "which tools may this toolkit run?". Both routes have always been mounted
  # (internal/api/router.go:1911-1914, behind the
  # `models.applications.tool.details` permission). Until issue #440 no client
  # called either one, and this document did not describe them, so
  # `apps/elitea-web` reaches them through the hand-written
  # `src/entities/toolkit/api/toolkitToolsApi.ts` and records both in
  # `src/shared/api/endpoints.manifest.json`.
  #
  # THE TWO ARE NOT INTERCHANGEABLE. `toolkit_available_tools` takes a saved
  # toolkit INSTANCE id and reads the rows mapped to it. `toolkit_discover_tools`
  # takes a toolkit TYPE name and reads every row of that type in the project.
  # A tool picker uses the first when the toolkit is saved, and the second
  # while the toolkit is still being created and has no id.
  /elitea_core/toolkit_available_tools/prompt_lib/{project_id}/{toolkit_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: toolkit_id
        in: path
        required: true
        schema: { type: string }
        description: >
          The saved toolkit instance. The handler reads the segment and passes
          it straight to the query as `entity_version_id`
          (internal/api/v2/toolkits/handler.go:513, 1086-1101), so it is a
          string here, like the `{toolkitID}` chi placeholder it fills.

    get:
      operationId: listToolkitAvailableTools
      summary: List the tools that one toolkit instance has
      description: |
        NOTE(#440): internal/api/v2/toolkits/handler.go:511-523
        (AvailableTools) calling pgRepo.AvailableTools (:1086-1101). The query
        joins `entity_tool_mapping` to `elitea_tools` on the toolkit id.
        Registered at internal/api/router.go:1911-1912.

        GUARDRAILS FILTER THE RESULT. `filterBlockedTools`
        (internal/api/v2/toolkits/guardrails.go:120-132) drops every row whose
        TYPE this deployment blocks. The response stays 200 and the count
        follows the filtered list, because a blocked type is not a tool the
        caller may run.

        A LOST READ IS NOT AN EMPTY CATALOGUE (#381). Any repository fault —
        a dead pool, a missing tenant schema, a bad row, a row set that ends
        early — gives 500 with `{"error": "available tools read failed"}`. The
        driver detail goes to the log only. A toolkit with no tools gives 200
        and an empty array.
      tags: [toolkits]
      responses:
        '200':
          description: The tools this toolkit instance has
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolsPayload'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/toolkit_discover_tools/prompt_lib/{project_id}/{toolkit_type}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: toolkit_type
        in: path
        required: true
        schema: { type: string }
        description: >
          A toolkit type name, for example `github` or `openapi`. The handler
          matches it against the `type` column exactly
          (internal/api/v2/toolkits/handler.go:1105-1116). An unknown type is
          not an error: it selects no rows and gives an empty list.

    post:
      operationId: discoverToolkitTools
      summary: List the tools that one toolkit type offers in a project
      description: |
        NOTE(#440): internal/api/v2/toolkits/handler.go:527-545 (DiscoverTools)
        calling pgRepo.DiscoverTools (:1105-1116). Registered at
        internal/api/router.go:1913-1914.

        POST WITH NO BODY. The handler reads both arguments from the URL and
        never opens the request body. pylon declares the verb, so the route
        keeps it. Send no payload; the handler discards one.

        A BLOCKED TYPE IS REFUSED, NOT EMPTIED. The type sits in the URL, so
        `refuseBlockedToolkitType`
        (internal/api/v2/toolkits/guardrails.go:82-97) answers 403 and NAMES
        the type: `{"error": "toolkit type \"<name>\" is blocked by this
        deployment's guardrails"}`. "This deployment blocks this type" and
        "this project holds no toolkit of this type" are different facts, and
        an operator who reads a bare 403 goes to the roles page instead of the
        guardrail rule. `filterBlockedTools` then drops any surviving blocked
        row from the list, exactly as it does for the read above.

        A LOST READ IS NOT AN EMPTY CATALOGUE (#381). A repository fault gives
        500 with `{"error": "discover tools read failed"}`, for the same reason
        `listToolkitAvailableTools` does.
      tags: [toolkits]
      responses:
        '200':
          description: The tools of this type that the project holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolsPayload'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /elitea_core/test_tool/prompt_lib/{project_id}/{tool_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: tool_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: >
          The SAVED toolkit instance whose tool runs. It is parsed as a positive
          integer and refused with 400 otherwise
          (internal/api/v2/toolkits/handler.go:761-766). Naming it here is what
          lets the body carry only the tool and its arguments: the settings and
          the credentials come from this row.

    post:
      operationId: testToolkitTool
      summary: Run one tool of a saved toolkit and answer with what it returned
      description: |
        NOTE(W2): internal/api/v2/toolkits/handler.go:719-721 (TestTool) into
        the shared body at :737-781, which maps the outcome through
        internal/api/v2/toolkitrun/response.go. Registered at
        internal/api/router.go:2445-2446, gated on
        `models.applications.tool.patch` — pylon declares only
        `test_toolkit_tool.py`, so both verbs that run a tool take the string
        that module declares.

        THE OUTCOME IS THE STATUS CODE. `ToolkitToolRunResult` lists the six
        branches and why a tool that RAISED is 200. Read that schema before
        writing a caller: `ok: false` at 200 is a completed run, not a
        transport failure.

        THIS IS THE ROUTE THAT IS ALWAYS REACHABLE. Its sibling,
        `POST /elitea_core/test_toolkit_tool/prompt_lib/{project_id}`, names the
        toolkit in the body and shares its path with the index-start route, so
        chi resolves the index handler ahead of it wherever a runtime is
        composed; it answers only in a runtime-less deployment. The route
        decision is recorded in
        internal/application/toolkitcalltool/doc.go. `index_data` is therefore
        not run through this operation — it keeps the streaming index-start
        path.

        A DEPLOYMENT WITH NO WORKER ANSWERS 503, unchanged. Where no runtime is
        composed the handler writes the same
        `{"ok": false, "error": "indexer service not available"}` it wrote
        before this capability existed (toolkitrun.WriteUnavailable), because a
        new sentence there would read as a new failure rather than the same
        absence.

        THE BODY IS BOUNDED to 1 MiB (toolkitrun.MaxRequestBodyBytes). Arguments
        are caller content of unbounded size, and the bound that would otherwise
        refuse them sits inside the bundle factory, too late for the caller to
        see why.
      tags: [toolkits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolkitToolRunRequest'
      responses:
        '200':
          description: >
            The run settled. `ok: true` carries the tool's result; `ok: false`
            carries the tool's own error, and is still a completed run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '400':
          description: >
            The project id, the toolkit id or the body could not be read
            (handler.go:748-772, toolkitrun.WriteInvalidRequest). The envelope
            is the `ok: false` one, not the flat `{"error": ...}` shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: >
            The toolkit is not visible to this caller in this project
            (toolkitrun.WriteError on ErrToolkitNotVisible).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '422':
          description: >
            The run was refused before any provider work: `reason` is
            `unsupported_toolkit` (this image cannot build that toolkit type) or
            `unknown_tool` (the toolkit has no tool by that name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '500':
          description: >
            A runtime fault, with `reason: runtime_failure` and a safe message.
            The cause is logged and never put on the wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '503':
          description: >
            No runtime is composed in this deployment, or the toolkit settings
            could not be resolved. Both write the `ok: false` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
        '504':
          description: >
            The bounded wait passed. The execution named by `task_id` is STILL
            RUNNING and durable — poll it rather than re-sending the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolkitToolRunResult'
  # ==========================================================================
  # MCP (issue 252)
  #
  # Three REST endpoints. The MCP PROTOCOL endpoints this change also adds —
  # GET|POST /app/{project_id}/mcp and its category/resource variants — are
  # deliberately NOT in this document: they carry JSON-RPC 2.0 envelopes whose
  # request and response shapes are selected by a `method` string, so a
  # generated typed client for them would be one operation returning a union of
  # every MCP result. The protocol they speak is the Model Context Protocol
  # specification, and internal/api/v2/mcp/server.go is the implementation note.
  #
  # `mode` is pylon's dispatch key, not decoration: tools_call registers
  # `default` only and internal_mcp_pat_status registers `prompt_lib` only, so
  # those are the literal segments here rather than a {mode} parameter.
  #
  # tools_list registers TWO paths on the same handler (router.go:2040-2041):
  # `/tools_list/{projectID}` and `/tools_list/default/{projectID}`. The
  # mode-less form is the one the Python SDK calls. Only the `default` form is
  # documented, because both forms serve the same body and a second operation
  # would give the generated clients a duplicate.
  # ==========================================================================
  /elitea_core/tools_list/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: listRegisteredMcpServers
      summary: List MCP servers registered into the project by an MCP client
      description: |
        Lists the MCP servers an Elitea MCP CLIENT has registered INTO the
        project. This endpoint does NOT list this platform's own tools — that
        is the MCP server at /app/{project_id}/mcp.

        Issue 335 replaced the earlier 501 with a durable read. The listing
        comes from elitea_mcp.registered_servers and elitea_mcp.registered_tools
        (shared migration 0073), unioned with the caller's personal project. A
        personal entry wins a name collision. A server a user registers in their
        own project therefore follows them into every project they work in
        (internal/api/v2/mcp/registry.go:116-129).

        The body is a bare array, which is pylon's shape. An empty array is now
        an honest read of the rows: it means the project has no registered
        server. A read failure answers 503 instead, because reporting an empty
        toolset would make an agent answer without its tools.
      tags: [toolkits]
      responses:
        '200':
          description: Registered MCP servers (an empty array means none is registered)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/McpRegisteredServer'
        '400':
          description: The project id in the path is not a positive integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: |
            MCP exposure is switched off for this deployment
            (centry.platform_config mcp_configuration.mcp_enabled), or the
            caller has no role in the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            The registry is not composed, or a registry read failed. The reason
            is in `error` (internal/api/v2/mcp/registry.go:99,111,123).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /elitea_core/tools_call/default/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: callRegisteredMcpServerTool
      summary: Invoke a tool on an MCP server registered into the project
      description: |
        Always answers 501 with a stated reason — the same reason
        /elitea_core/tools_list gives, because it is the same absent registry.
        Dispatch in the reference implementation is a blocking socket.io call
        back down the websocket the client registered on.

        The request body is documented because it is what the reference
        accepts, but it is not read: a 400 for a malformed body would imply
        that a well-formed one would be dispatched somewhere, and none is.
      tags: [toolkits]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpToolCallRequest'
      responses:
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: |
            MCP exposure is switched off for this deployment, or the caller has
            no role in the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Not implemented, with the reason in `error`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /elitea_core/internal_mcp_pat_status/prompt_lib/{project_id}/{toolkit_type}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: toolkit_type
        in: path
        required: true
        schema: { type: string }
        description: |
          Toolkit TYPE, not a toolkit id. Only types beginning `mcp_` can be
          internal.

    get:
      operationId: getInternalMcpPatStatus
      summary: Report the caller's personal-access-token state for an internal MCP toolkit
      description: |
        NOTE(W2): internal/api/v2/mcp/patstatus.go:74 (InternalMCPPATStatus).

        An INTERNAL Elitea MCP toolkit points back at this platform's own MCP
        endpoint and authenticates with the executing user's personal access
        token, which is injected at dispatch time and never stored. Without a
        live token the toolkit fails inside an agent run, as an authentication
        error against a URL the user never typed; this endpoint lets the
        toolkit UI say so first.

        A type is internal when it begins `mcp_` AND the project holds at least
        one toolkit of that type whose settings URL points at this platform's
        own MCP endpoint — `/app/<project id>/mcp/...`, with the project id
        either left as the `{project_id}` marker or already resolved to an
        integer. Both forms count: the marker is written only by the reference
        implementation's prebuilt-config machinery, which has no counterpart
        here, so matching it alone would leave this endpoint unable to report
        anything but VALID.

        `state` is reported only about the CALLER's own tokens and is one of
        VALID (at least one unexpired token; a token with no expiry never
        expires), EXPIRED (tokens exist, all past their expiry) or MISSING (no
        tokens). A non-internal type answers `{"internal": false, "state":
        "VALID"}` — there is no token requirement to report on. The token value
        is never returned and is never read.
      tags: [toolkits]
      responses:
        '200':
          description: Token state for this toolkit type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalMcpPatStatus'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: The toolkit or token lookup could not be performed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # SECRETS (issue 151)
  #
  # pylon serves /api/v2/<plugin>/<resource-module>/<mode>/<params>. The
  # plugin is `secrets`; its resource modules are
  # legacy/plugins/secrets/api/v2/{secrets,secret,hide}.py — hence the
  # doubled first segment, which is the REAL legacy shape and not the
  # double-mount bug issue 137 took it for. Every consumer agrees: the pinned
  # baseline client (apps/elitea-ui/src/api/secrets.js:3), elitea-sdk
  # (runtime/clients/{client,sandbox_client}.py), admin_ui
  # (frontend/src/api/secretsApi.js) and qa/elitea-api-testing
  # (utils/utils.py:322).
  #
  # This domain was absent from this spec entirely until issue 151, which is why
  # nothing generated or contract-tested caught the divergence.
  #
  # `mode` is a real dispatch key, not decoration: pylon's
  # APIBase.proxy_method looks it up in mode_handlers and abort(404)s on a
  # miss. Only two modes exist — `default` (project vault) and
  # `administration` (the GLOBAL vault). elitea-main implements BOTH, and any
  # other mode is a 404. See withModes in internal/api/v2/secrets/handler.go.
  #
  # The two modes are separate handlers over separate stores with separate
  # bodies. `administration` reads and writes the global vault (row id
  # "admin", internal/api/v2/secrets/admin.go) and IGNORES the {projectID}
  # segment, so admin_ui sends the placeholder `0` there. Each operation below
  # therefore states both shapes.
  #
  # ONE administration branch stays unimplemented: POST
  # /secrets/{mode}/{projectID}, which replaces the whole global vault in a
  # single call. It has no caller in the workspace, so it answers 501.
  # ==========================================================================
  /secrets/secrets/{mode}/{projectID}:
    parameters:
      - name: mode
        in: path
        required: true
        schema: { type: string, enum: [default, administration] }
      - name: projectID
        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listSecrets
      summary: List secret names
      description: >
        Values are never returned here. `default` returns
        `{{secret.<name>}}` placeholders; `administration` returns the
        literal mask "******" in each row's `secret`. A vault that does not
        exist yet returns `[]` with 200, not a 404 (handler.go's List,
        admin.go's AdminList).
      tags: [secrets]
      responses:
        '200':
          description: Secret names
          content:
            application/json:
              schema:
                # Use anyOf here. An empty array satisfies both branches.
                # A vault that does not exist yet returns [], and oneOf rejects it.
                anyOf:
                  - type: array
                    items: { $ref: '#/components/schemas/SecretListItem' }
                    description: '`default` mode — the project vault.'
                  - type: array
                    items: { $ref: '#/components/schemas/AdminSecretListItem' }
                    description: '`administration` mode — the global vault.'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '500': { $ref: '#/components/responses/SecretsModeError' }

    post:
      operationId: createSecret
      summary: Create a project secret
      description: >
        A duplicate name is a 400, never an overwrite (handler.go's
        Create). Returns the created item WITHOUT its value.
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretListItem' }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }
        '501':
          description: >
            `administration` mode. This ONE branch is not implemented: it
            replaces the whole global vault in a single call and has no
            caller in the workspace (handler.go's notImplementedBulkReplace).
            Create global secrets one at a time through
            POST /secrets/secret/administration/{projectID}/{name}.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /secrets/secret/{mode}/{projectID}/{name}:
    parameters:
      - name: mode
        in: path
        required: true
        schema: { type: string, enum: [default, administration] }
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: name
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: showSecret
      summary: Read one secret, including its plaintext value
      description: >
        `default` returns the full SecretDetail. `administration` returns only
        `{"secret": "<value>"}`, and answers 200 with `{"secret": null}` for an
        unknown name (admin.go's AdminGet).
      tags: [secrets]
      responses:
        '200':
          description: The secret
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SecretDetail'
                  - $ref: '#/components/schemas/AdminSecretValue'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '500': { $ref: '#/components/responses/SecretsModeError' }

    post:
      operationId: createSecretInMode
      summary: Create one secret — administration mode only
      description: >
        NOTE(issue 151): internal/api/v2/secrets/handler.go registers this POST
        with an administration branch only (admin.go's AdminCreate). `default`
        answers 405, because pylon's project API defines only get/put/delete on
        this path. The name comes from the path and must match
        `^[A-Za-z0-9_]+$`. A duplicate name is a 400, never an overwrite.
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSecretCreateRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMessageResponse' }
        '400':
          description: Invalid name, missing value, or a name that already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMessageResponse' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '405':
          description: '`default` mode — the project vault has no create on this path.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: The global vault is unreadable, or the write failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMessageResponse' }

    put:
      operationId: updateSecret
      summary: Rename and/or re-value a secret
      description: >
        BUG-FOR-BUG: a missing secret is a 400, not a 404 (handler.go's
        Update). A rename to a name that the project vault already holds, in
        `secrets` or in `hidden_secrets`, is refused with 400: the vault is one
        encrypted blob with no history, so an overwrite there is unrecoverable.

        The two modes take DIFFERENT bodies. `default` takes the flat
        SecretUpdateRequest. `administration` takes the nested
        AdminSecretUpdateRequest, where `old_name` selects the entry to
        replace (admin.go's AdminUpdate). `administration` also answers 404
        for a missing secret, where `default` answers 400.
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SecretUpdateRequest'
                - $ref: '#/components/schemas/AdminSecretUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SecretListItem'
                  - $ref: '#/components/schemas/AdminMessageResponse'
        '400': { $ref: '#/components/responses/SecretsModeError' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '500': { $ref: '#/components/responses/SecretsModeError' }

    delete:
      operationId: deleteSecret
      summary: Delete a secret
      description: >
        Idempotent in BOTH modes: deleting a name that does not exist — or a
        vault that does not exist at all — is still a 204 (handler.go's
        Delete, admin.go's AdminDelete). `default` removes the name from both
        `secrets` and `hidden_secrets`.
      tags: [secrets]
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '500': { $ref: '#/components/responses/SecretsModeError' }

  /secrets/hide/{mode}/{projectID}/{name}:
    parameters:
      - name: mode
        in: path
        required: true
        schema: { type: string, enum: [default, administration] }
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: name
        in: path
        required: true
        schema: { type: string }

    post:
      operationId: hideSecret
      summary: Move a secret into hidden_secrets
      description: >
        `default` mode only. A hidden secret disappears from the list
        endpoint but is still readable by name through the single-secret GET,
        which reports `is_hidden: true`. BUG-FOR-BUG: a missing secret is a
        400, not a 404 (handler.go's Hide) — matching pylon's hide.py.

        `administration` mode ALWAYS answers 401. The global vault has no
        hidden section, so pylon refuses the call with that sentence and
        admin.go's AdminHide reproduces it. The admin page renders no hide
        control at all.
      tags: [secrets]
      responses:
        '200':
          description: Hidden (`default` mode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        '400': { $ref: '#/components/responses/400' }
        '401':
          description: >
            Unauthenticated, OR `administration` mode, which always refuses
            with {"message": "There are no hidden secrets in administration
            mode"} (admin.go's AdminHide).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretsModeErrorBody' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/SecretsModeError' }
        '500': { $ref: '#/components/responses/SecretsModeError' }

  /secrets/secret/{projectID}/{name}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema: { type: integer }
      - name: name
        in: path
        required: true
        schema: { type: string }

    get:
      operationId: showSecretWithoutMode
      summary: Read one secret — the mode-less legacy form
      description: >
        pylon's api_tools.with_modes registers the mode-less URL alongside
        the mode-ful one for every resource, and proxy_method defaults
        `mode` to "default", so this is the project handler under another
        URL. It is spelled out here because elitea-sdk is a live caller:
        elitea_sdk/runtime/clients/client.py:108 and sandbox_client.py:237
        build {api_v2}/secrets/secret/{project_id} and append /{name}.
        pylon serves the mode-less form of the other five routes too;
        elitea-main does not, because nothing in the workspace calls them.
      tags: [secrets]
      responses:
        '200':
          description: The secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretDetail' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }

  # ── The stored-credential checks and the revalidation ──────────────────
  #
  # These three are described here rather than added to
  # internal/api/oapiserver/testdata/reverse_check_allowlist.txt, which is the
  # list of endpoints the new UI calls and this document does not describe: the
  # allowlist may only shrink (spec §5.3), and it is at its pinned size.
  #
  # THEY ARE NOT THE SAME AS /check_connection. That route checks a payload the
  # caller SENDS. These read the SAVED row: since the compatibility write path
  # seals every schema-declared password into the project vault, the stored
  # `data` object holds a `{{secret.NAME}}` reference and no client can send
  # the key back. See services/elitea-main/internal/api/v2/configurations/
  # stored_check.go.
  #
  # Each also has a `{mode}` twin the router registers for pylon URL parity
  # (`/check_stored_connection/{mode}/{project_id}/{config_id}`, and so on).
  # The twins are deliberately absent from this document, as they are for every
  # other configurations route: the mode segment is decoration on this surface,
  # one handler serves both forms, and no client in the workspace calls the
  # mode-ful URL.
  /configurations/check_stored_connection/{project_id}/{config_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: config_id
        in: path
        required: true
        schema: { type: string }
        description: The stored configuration's numeric id or its uuid.
    post:
      operationId: checkStoredConfigurationConnection
      summary: Test a SAVED credential against its provider
      description: |
        Reads the credential from the row, redeems its sealed secret through
        the project vault, and forwards the resolved payload to the LLM
        gateway's check endpoint. THE REQUEST CARRIES NO BODY: the client does
        not hold the api_key and must not need to.

        It PERSISTS NOTHING. `status_ok` records that the platform accepted the
        row — its references expand and its secrets redeem — and nothing in
        that decision contacts a provider, so a provider outage must not
        withdraw a project's credentials from the gateway. Re-running that
        decision is POST /configurations/revalidate/{project_id}/{config_id}.

        A configuration id belonging to another project answers 404: every
        statement reads the schema the {project_id} names.
      tags: [configurations]
      responses:
        '200':
          description: The provider accepted the credential.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    description: Always true on this response.
                  message: { type: string }
                  reason:
                    type: string
                    description: >
                      The machine-readable verdict of a TOOLKIT credential
                      probe: one of ok, auth_failed, unreachable,
                      unsupported_type (internal/api/v2/configurations/
                      toolkit_check.go). Absent for an ai_credentials
                      provider, whose own reason vocabulary is already
                      collapsed into message by the gateway path. Read message
                      for the text; switch on this only where it is present.
                    enum: [ok, auth_failed, unreachable, unsupported_type]
        '400':
          description: >
            The provider rejected the credential, the type has no working check
            yet, the row did not resolve, or the check is not available in this
            build. The body is the legacy {success,message} shape, NOT the
            ErrorResponse every other 400 in this document uses: the browser
            keys its toast off the status and reads `message` for the text.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    description: Always false on this response.
                  message: { type: string }
                  reason:
                    type: string
                    description: >
                      The machine-readable verdict of a TOOLKIT credential
                      probe: one of ok, auth_failed, unreachable,
                      unsupported_type (internal/api/v2/configurations/
                      toolkit_check.go). Absent for an ai_credentials
                      provider, whose own reason vocabulary is already
                      collapsed into message by the gateway path. Read message
                      for the text; switch on this only where it is present.
                    enum: [ok, auth_failed, unreachable, unsupported_type]
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such configuration in this project.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    description: Always false on this response.
                  message: { type: string }

  /configurations/check_stored_connections/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: batchCheckStoredConfigurationConnections
      summary: Test many SAVED credentials in one request
      description: |
        The batch form of the route above. It ALWAYS answers 200 with one
        result object per requested id, in request order, because the credential
        screen marks every credential invalid when this request fails — a 4xx
        would paint a healthy project red.

        `unsupported` marks a type this build has never heard of. A KNOWN type
        with no working check yet carries the "not supported yet" message
        instead, which is the same distinction the unsaved batch check draws.
        Ids above the item cap report "could not verify" rather than failing the
        request.
      tags: [configurations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configuration_ids]
              properties:
                configuration_ids:
                  type: array
                  maxItems: 200
                  items:
                    oneOf:
                      - type: string
                      - type: integer
                    description: >
                      A stored configuration's numeric id or its uuid — the
                      same two forms the path parameter takes. Both a JSON
                      string and a JSON number are accepted; the shipped
                      client sends strings.
                  description: The ids to check, at most 200 of them.
      responses:
        '200':
          description: One result per requested id, in request order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoredConnectionCheckRow' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /configurations/revalidate/{project_id}/{config_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: config_id
        in: path
        required: true
        schema: { type: string }
        description: The stored configuration's numeric id or its uuid.
    post:
      operationId: revalidateConfiguration
      summary: Re-derive a stored configuration's status_ok
      description: |
        Re-runs the ADMISSION decision for one saved row and persists the
        result: do its declared references still expand, do its hidden secrets
        still redeem, and does policy still admit the project to own it.

        NOTHING CONTACTS A PROVIDER. The live provider round trip is
        POST /configurations/check_stored_connection/{project_id}/{config_id},
        and that route stores nothing. The two are separate on purpose: a
        provider outage must not withdraw every credential in a project from the
        gateway, and a credential whose vault secret has been deleted must not
        stay usable because the provider still answers.

        It writes `status_ok` and NO field of the row — no data, no meta, no
        updated_at. An unmanaged row (a generic configuration, or an imported
        model with no ai_credentials) keeps the status its writer stored.
      tags: [configurations]
      responses:
        '200':
          description: The row as it now stands, in the detail route's shape.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, type, section, status_ok]
                properties:
                  id: { type: integer }
                  uuid: { type: string }
                  project_id:
                    type: integer
                    description: >
                      The owning project's numeric id. This route re-emits the
                      detail route's Configuration projection
                      (internal/api/v2/configurations/handler.go), whose
                      ProjectID is a Go int, so the value on the wire is a JSON
                      number. The spec declared a string, and the generated web
                      client turned that into `zod.string()`; a zod parse of a
                      correct answer threw.
                  label: { type: string }
                  name: { type: string }
                  type: { type: string }
                  section: { type: string }
                  data:
                    type: object
                    additionalProperties: true
                    x-elitea-passthrough: >-
                      NOTE(W2): DB jsonb column `configuration.data`,
                      re-emitted verbatim by the detail projection this route
                      reuses
                      (internal/api/v2/configurations/revalidate.go:131);
                      the revalidation writes status_ok only and never
                      inspects these keys, which stay client/section-owned.
                  meta:
                    type: object
                    additionalProperties: true
                    x-elitea-passthrough: >-
                      NOTE(W2): DB jsonb column `configuration.meta`, same
                      verbatim re-emit
                      (internal/api/v2/configurations/revalidate.go:131) and
                      same section ownership as `data` above.
                  shared: { type: boolean }
                  status_ok: { type: boolean }
                  status_logs: { type: string }
                  source: { type: string }
                  author_id: { type: integer }
                  created_at: { type: string }
                  updated_at: { type: string }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '503':
          description: >
            This build composed no admission decision, so it cannot revalidate.
            It answers this rather than 200 with the unchanged row: the two are
            indistinguishable to a client, and the second is a control that
            reports success while doing nothing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /deepwiki/slots/{project_id}:
    get:
      operationId: getDeepWikiSlots
      summary: Report DeepWiki generation capacity
      description: |
        Proxies `GET /slots` on the DeepWiki provider service (ADR-0022).

        The UI reads this before offering to start a generation, so it is a
        read with no side effect and the lightest permission on the surface.

        The provider answers with both `can_start` and its camelCase alias
        `canStart`; both are passed through unchanged, because the vendored SPA
        reads the alias and the frozen provider contract emits both.
      tags: [deepwiki]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Capacity, as the provider reports it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeepWikiSlots' }
        '403':
          description: Caller lacks the DeepWiki permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            DeepWiki is not enabled in this deployment, or the provider service
            is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /deepwiki/tools/{project_id}/{toolkit_name}/{tool_name}/invoke:
    post:
      operationId: invokeDeepWikiTool
      summary: Start a DeepWiki tool invocation
      description: |
        Proxies `POST /tools/{toolkit_name}/{tool_name}/invoke` on the provider
        service over mTLS, with HMAC-signed identity headers (ADR-0022
        decision 5). elitea-main is the only door: the provider refuses
        non-mTLS traffic and strips any identity header a client supplies.

        Invocation is asynchronous and unconditionally so — the provider's
        descriptor advertises `sync_invocation_supported` on every tool and has
        never honoured it. The response is an invocation id to poll.

        The request body is the provider's own invocation envelope
        (`configuration.parameters` plus `parameters`). The facade resolves and
        injects the toolkit's credentials into it before proxying, so a caller
        neither sees nor supplies them.
      tags: [deepwiki]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeepWikiInvokeRequest' }
      responses:
        '200':
          description: Accepted; poll the invocation id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeepWikiInvocationAccepted' }
        '400':
          description: Malformed invocation envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller lacks the DeepWiki permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: DeepWiki is not enabled, or the provider is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /deepwiki/invocations/{project_id}/{toolkit_name}/{tool_name}/{invocation_id}:
    get:
      operationId: getDeepWikiInvocation
      summary: Poll a DeepWiki invocation
      description: |
        Proxies the provider's
        `GET /tools/{toolkit_name}/{tool_name}/invocations/{invocation_id}`.

        The path carries the toolkit and tool segments because the provider's
        does: that is the wire path the legacy service served and the form its
        SPI OpenAPI declares.

        Three body shapes are possible and all are passed through unchanged,
        because they are the provider's frozen contract:
        `{"status": "Started"}` while pending, `{"status": "InProgress"}` while
        running with any `custom_events` accumulated since the previous poll,
        and the terminal result once complete. A failed TOOL is HTTP 200 with
        `status: "Error"`; only transport failures use the error envelope.

        `custom_events` are drained by reading. A caller that misses a poll
        does not see those events again.
      tags: [deepwiki]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
        - name: invocation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invocation status, or its terminal result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeepWikiInvocationStatus' }
        '403':
          description: Caller lacks the DeepWiki permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            No such invocation. An unknown toolkit, an unknown tool and an
            unknown id are indistinguishable here, as they are on the provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: DeepWiki is not enabled, or the provider is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: cancelDeepWikiInvocation
      summary: Cancel a DeepWiki invocation
      description: |
        Proxies the provider's `DELETE` on the same path. Cancellation is
        cooperative: it sets a stop flag that the running work observes at its
        next checkpoint, and answers 204 immediately. The invocation reaches a
        terminal error state shortly afterwards; it does not vanish.
      tags: [deepwiki]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
        - name: invocation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Cancellation requested
        '403':
          description: Caller lacks the DeepWiki permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No such invocation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: DeepWiki is not enabled, or the provider is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---- Inventory facade (ADR-0022, ADR-0023 H4c) --------------------------
  # Three of the facade's four routes. `GET /inventory/slots/{project_id}` is
  # mounted (production_router.go:172) and is deliberately NOT described: no
  # client calls it, and this document describes the surface the app uses.
  #
  # These operations were hand-called through `eliteaFetch` while the document
  # stayed silent about them, which made the reverse conformance check fail:
  # the app's endpoint manifest named three endpoints v2.yaml did not cover,
  # and the allowlist that would otherwise absorb them may only shrink.

  /inventory/tools/{project_id}/{toolkit_name}/{tool_name}/invoke:
    post:
      operationId: invokeInventoryTool
      summary: Start an Inventory tool invocation
      description: |
        Proxies `POST /tools/{toolkit_name}/{tool_name}/invoke` on the Inventory
        provider service over mTLS, with HMAC-signed identity headers. The
        provider refuses non-mTLS traffic and strips any identity header a
        client supplies, so elitea-main is the only door.

        EVERY Inventory read is an invocation. The provider serves no REST read
        surface, so "which types does this graph hold" is this call followed by
        polling until a terminal status.

        Two toolkit families answer here: `inventory`, which owns and ingests
        the graph, and `inventory_search`, the read-only face other agents get.

        For run_ingestion, delta_update and remove_source_entities the facade
        resolves the named source toolkit's credentials and injects them before
        proxying (internal/api/v2/inventory/sources.go:53). The other eight
        tools forward unrewritten.

        Guarded by `models.applications.inventory.invoke` in the `default`
        permission mode. This is also the only one of the four routes the
        admission hook can refuse: what is already running must stay pollable
        and cancellable after a provider is turned off.
      tags: [inventory]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInvokeRequest' }
      responses:
        '200':
          description: Accepted; poll the invocation id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryInvocationAccepted' }
        '400':
          description: |
            Malformed invocation envelope, or a source this facade cannot
            expand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: |
            Caller lacks the Inventory invoke permission for this project, the
            named toolkit is not one of this Inventory toolkit's configured
            sources, or this deployment may not clone from that repository
            host.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: |
            Inventory is not enabled in this deployment, the provider is
            unreachable, or the source credentials could not be resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /inventory/invocations/{project_id}/{toolkit_name}/{tool_name}/{invocation_id}:
    get:
      operationId: getInventoryInvocation
      summary: Poll an Inventory invocation
      description: |
        Proxies the provider's
        `GET /tools/{toolkit_name}/{tool_name}/invocations/{invocation_id}`.

        The path carries the toolkit and tool segments because the provider's
        does: that is the form its SPI declares
        (conformance/provider/spi/contract.json).

        The body is forwarded verbatim in all its shapes. A failed TOOL is
        HTTP 200 with `status: "Error"`; only transport failures use the error
        envelope. `custom_events` are drained by reading, so an ingestion's
        progress lines reach a caller once and only once.

        Guarded by `models.applications.inventory.read`. Polling and cancelling
        share this path and do NOT share a permission: polling is a read.
      tags: [inventory]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
        - name: invocation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invocation status, or its terminal result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryInvocationStatus' }
        '403':
          description: Caller lacks the Inventory read permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: |
            No such invocation. An unknown toolkit, an unknown tool and an
            unknown id are indistinguishable here, as they are on the provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Inventory is not enabled, or the provider is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: cancelInventoryInvocation
      summary: Cancel an Inventory invocation
      description: |
        Proxies the provider's `DELETE` on the same path. Cancellation is
        cooperative: it sets a stop flag the running work observes at its next
        checkpoint. The invocation does not vanish — the next poll reports it
        as stopped.

        Guarded by `models.applications.inventory.invoke`, not by the read
        permission the poll uses.
      tags: [inventory]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: toolkit_name
          in: path
          required: true
          schema: { type: string }
        - name: tool_name
          in: path
          required: true
          schema: { type: string }
        - name: invocation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Cancellation requested
        '403':
          description: Caller lacks the Inventory invoke permission for this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No such invocation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Inventory is not enabled, or the provider is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ==========================================================================
  # PIPELINE TRIGGERS AND SCHEDULES — the two unattended ways to start a
  # pipeline (issues 192 and 193).
  #
  # Legacy had both and this stack had neither; the three `/pipeline_trigger/`
  # routes deleted with issue 126 were the API surface of the legacy
  # subsystem, gated behind a nil runner and 404 in every deployment.
  #
  # Seven of the eight operations below are ordinary session-authenticated,
  # project-gated routes. The eighth — POST /pipeline_trigger/{project_id}/
  # {token_id} — is the one entry point in this document whose only credential
  # is a per-pipeline secret. Read its description before changing anything
  # about it.
  # ==========================================================================

  /pipeline_triggers/prompt_lib/{project_id}/{version_id}:
    get:
      operationId: getPipelineInboundTrigger
      summary: Read a pipeline version's inbound trigger
      description: |
        Reports whether this pipeline version has an inbound trigger, when it
        was made, when it was last used, and whether it is revoked.

        The URL it returns does NOT carry the secret. Handing back a live
        credential is a different act and has its own operation with the write
        permission on it, so a person with view-only access cannot copy a
        working webhook URL for a pipeline they cannot edit.

        A pipeline with no trigger answers 200 with `configured: false`, not
        404: having no trigger is the normal state of almost every pipeline,
        and a 404 would make the settings tab render an error for it.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The trigger's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineInboundTrigger' }
        '403':
          description: Caller lacks models.applications.version.details in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: rotatePipelineInboundTrigger
      summary: Create or rotate a pipeline version's inbound trigger
      description: |
        Mints a credential and returns it ONCE in `secret` and `secret_url`.

        Create and rotate are ONE operation on purpose. They differ only in
        whether a row was already there, they have the same permission, and
        they have the same effect on any holder of the previous secret. Two
        operations would be two chances to implement the rotation half
        differently from the creation half.

        Rotation is immediate and total: the previous secret stops working the
        moment this returns, and its vault entry is removed. That is what
        "rotate" has to mean for a credential somebody else holds.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The trigger, WITH the new credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineInboundTrigger' }
        '403':
          description: Caller lacks models.applications.version.update in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No such pipeline version in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The credential store is not available on this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: revokePipelineInboundTrigger
      summary: Revoke a pipeline version's inbound trigger
      description: |
        Makes the credential unusable and KEEPS the row. A revoked trigger is
        evidence: an operator asking "was this webhook still live last
        Tuesday?" gets an answer from a row that is present and revoked, and no
        answer at all from a row that is gone. The inbound endpoint refuses any
        row whose `revoked_at` is set.

        The stored secret is deleted, so it cannot be revealed again after
        revocation.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The revoked trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineInboundTrigger' }
        '403':
          description: Caller lacks models.applications.version.update in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: This pipeline has no trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /pipeline_triggers/secret/prompt_lib/{project_id}/{version_id}:
    get:
      operationId: revealPipelineInboundTrigger
      summary: Reveal a pipeline version's trigger credential
      description: |
        Returns the live credential so the settings tab can show the webhook URL
        again after the dialog that created it was closed.

        It is a GET carrying the WRITE permission, which is deliberate. Folding
        it into the plain read would put a credential into the response of the
        call the settings tab makes on every open, where it would sit in the
        browser's query cache and in any exported HAR — and would let a
        view-only member copy a working URL.

        A 409 means the row exists and its stored secret cannot be read. That is
        reported as "rotate it" rather than as a server error, because rotation
        is the only repair a person can perform and it always works.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The trigger, WITH the credential
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineInboundTrigger' }
        '403':
          description: Caller lacks models.applications.version.update in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The stored credential could not be read; rotate the trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The credential store is not available on this deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /pipeline_schedules/prompt_lib/{project_id}/{version_id}:
    get:
      operationId: getPipelineSchedule
      summary: Read a pipeline version's schedule
      description: |
        Reports the cron expression, whether it is enabled, the computed next
        run, and the outcome of the last fire attempt.

        `last_result` is the tenant-visible half of failure visibility: an audit
        event answers "what happened on this platform" and is what an operator
        reads, while this column answers "is MY schedule working" and is what
        the person who made it can see.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The schedule's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineSchedule' }
        '403':
          description: Caller lacks models.applications.version.details in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: savePipelineSchedule
      summary: Create or replace a pipeline version's schedule
      description: |
        Saving SETS the schedule's author to the caller, and the author is who
        an unattended run executes as. Leaving the original author in place
        while someone else edited the cron would let a caller retarget another
        person's identity onto a new time.

        The author's permission is re-resolved at every FIRE, not here: a
        schedule whose author later loses access stops firing and records
        `skipped_unauthorized`, without anybody having to remember to disable
        it.

        The cron expression is validated with the parser that will run it. Five
        fields are required and names such as `@daily` are refused, because an
        expression the runner cannot parse would not error at run time — it
        would silently never fire, which on an unattended job looks exactly like
        a job with nothing to do.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineScheduleUpdate' }
      responses:
        '200':
          description: The saved schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineSchedule' }
        '400':
          description: The cron expression cannot be parsed, or the input is too long
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller lacks models.applications.version.update in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No such pipeline version in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deletePipelineSchedule
      summary: Remove a pipeline version's schedule
      description: |
        The row is DELETED rather than tombstoned, unlike a revoked trigger. The
        two are not symmetric: a trigger is a credential somebody outside holds,
        so "when did it stop working" is a question about a third party, while a
        schedule is configuration its own author can re-create, and every fire
        it ever made is already an audit row.
      tags: [applications]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: version_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The schedule is gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineSchedule' }
        '403':
          description: Caller lacks models.applications.version.update in this project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: This pipeline has no schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /pipeline_trigger/{project_id}/{token_id}:
    post:
      operationId: runPipelineInboundTrigger
      summary: Start a pipeline run from an external caller
      description: |
        The inbound trigger — issue 192. An external system calls this URL and
        one pipeline version runs.

        ## This route has NO SESSION

        It is mounted above the API's authentication group, beside the anonymous
        shared-chat routes. Its ONLY credential is the per-pipeline secret,
        presented as `Authorization: Bearer <secret>`, as
        `X-Elitea-Trigger-Token`, or as the `token` query parameter. The header
        forms are preferred: a URL is written to proxy and browser logs, and a
        credential in one outlives the request.

        ## Nothing the caller sends selects a tenant

        `project_id` says WHERE TO LOOK and nothing more. What runs comes out of
        the stored row: the application, the version and the identity are read
        from the database and never from the request. A caller who guesses
        another project's id finds no row holding their token's digest and gets
        the same 401 as a caller who guessed nothing.

        ## Every refusal is the same refusal

        Unknown token, wrong secret, revoked trigger, wrong project, deleted
        version, and a creator who has lost the run permission all answer 401
        with one sentence. A refusal that named which one it was would be an
        oracle for enumerating a deployment's pipelines. An operator debugging
        their own webhook reads the audit row, which records the same request
        with the reason attached.

        ## The run is the same run a person would have started

        Admission goes through the chat composer's own use case, over a
        conversation and participants shaped exactly as a typed turn's, so
        budgets, governance, tracing, cancel and the transcript are unchanged.
        The answer is 202 and an events URL: the run has not finished and will
        not finish inside this request.
      tags: [applications]
      security: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: integer }
        - name: token_id
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: false
          description: >
            The secret, for senders that cannot set a header. Least preferred of
            the three carriers; see the description.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineInboundTriggerRunRequest' }
      responses:
        '202':
          description: The run was admitted; follow it on the events URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineInboundTriggerRunAccepted' }
        '400':
          description: The run input is too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: This trigger cannot be used. One answer for every cause.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: The request body is too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: This deployment cannot run pipelines, or the trigger could not be checked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
