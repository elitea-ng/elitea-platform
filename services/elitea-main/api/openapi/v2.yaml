      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go, UpdateProjectInfo —
        the body is decoded into a map and only these two keys are read.

    ProjectInfoUpdateResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Always true on a 200. A failure answers 4xx/5xx instead.
        name:
          type: string
