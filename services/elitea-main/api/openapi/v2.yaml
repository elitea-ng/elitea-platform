      type: object
      required: [user_id, email, run_count, total_tokens, last_active_at]
      properties:
        user_id: { type: string }
        email:
          type: string
          description: >
            EMPTY when the identity tables are absent. The row is still
            reported: "user 41 made 900 calls" is useful without a display name,
            and dropping it because a decoration could not be joined would
            silently shrink the leaderboard.
        name: { type: string }
        run_count: { type: integer }
        total_tokens: { type: integer }
        last_active_at: { type: string, format: date-time }
      description: >
        One member's LLM usage in the window, from gateway.llm_request_logs
        grouped by user_id. Rows whose user_id is NULL — requests that resolved
        no member — are excluded.

