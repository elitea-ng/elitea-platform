    # ---- Configurations ----------------------------------------------------------
    # Issue 36 items 9 and 11. Two handlers serve each of the two paths, and the
    # deployment picks one with ELITEA_CONFIGURATIONS_ENABLED, so every schema
    # here is the UNION of the two projections and each field says which handler
    # emits it. `compat` is internal/api/v2/configurations/handler.go; `reviewed`
    # is internal/application/configurations.
    ConfigurationRow:
      type: object
      required: [type, section, project_id, shared, status_ok, source, created_at]
      properties:
        id:
          type: integer
          description: The `configuration` row id. BOTH handlers emit it.
        uuid:
          type: string
          description: >
            BOTH. `compat` omits the key when the column is empty; `reviewed`
            emits an empty string instead.
        project_id:
          type: integer
          description: >
            BOTH, and a NUMBER on both. It was a string on `compat` until the
            two were aligned, and a client comparing the two routes with `===`
            broke on exactly one deployment.
        elitea_title:
          type: string
          description: >
            BOTH. The row's stored title, and the name every reader resolves a
            credential by: a toolkit stores the reference
            `{"github_configuration": {"elitea_title": …}}`, and the credential
            picker builds its options from this field. `compat` served the
            column as `name` alone until the two were aligned, so against that
            handler the picker offered nothing to link.
        name:
          type: string
          description: >
            `compat` only, and the same column it also serves as
            `elitea_title`. Kept for the clients that already read it.
        label:
          type: string
          nullable: true
          description: >
            BOTH. `compat` omits the key when the column is empty; `reviewed`
            emits null.
        type:
          type: string
          description: The credential type, for example `sharepoint`.
        section:
          type: string
          description: >
            The catalogue section the type belongs to. The list is filtered on
            it, one request per section.
        data:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the `data` jsonb column, forwarded verbatim
            (internal/api/v2/configurations/handler.go:575, in
            scanConfigurationRows).
            Its keys are the credential TYPE's own schema, which the registry
            snapshot owns and this document does not repeat. Every
            schema-declared password field is replaced by a `{{secret.NAME}}`
            reference before the row is stored, so no key value reaches a
            client.
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the `meta` jsonb column, forwarded verbatim
            (internal/api/v2/configurations/handler.go:578, in
            scanConfigurationRows).
            Per-type bookkeeping with no fixed key set.
        shared:
          type: boolean
          description: BOTH. True when the row is published to the public project.
        status_ok:
          type: boolean
          description: >
            BOTH. The admission verdict for the row. It is NOT a live
            connection check.
        status_logs:
          type: string
          nullable: true
          description: BOTH. Why `status_ok` is what it is.
        source:
          type: string
          description: BOTH. Which writer created the row.
        author_id:
          type: integer
          nullable: true
          description: BOTH.
        created_at:
          type: string
          description: BOTH.
        updated_at:
          type: string
          nullable: true
          description: BOTH.
        is_pinned:
          type: boolean
          description: '`reviewed` only.'
        options:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `reviewed` only, and omitted unless the type declares
            options — internal/api/v2/configurations/dto.go:31,
            `Options *map[string]any` with `omitempty`. The key set is the
            credential type's own.
      description: >
        NOTE(W2): the union of internal/api/v2/configurations/handler.go's
        Configuration (compat) and internal/api/v2/configurations/dto.go's
        CurrentConfigurationDTO (reviewed).

    ConfigurationSharedPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationRow' }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
      description: >
        NOTE(W2): the `shared` block, read from the PUBLIC project's schema.
        `compat` always emits the block and leaves it empty when no public
        project is configured; `reviewed` omits the key instead.

    ConfigurationListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationRow' }
        total:
          type: integer
          description: >
            Rows that match the filter, not rows in this page. It is counted
            before the page is read, so it survives a page that comes back
            short.
        offset: { type: integer }
        limit: { type: integer }
        shared:
          allOf: [{ $ref: '#/components/schemas/ConfigurationSharedPage' }]
          description: >
            Present only when `include_shared=true`. `compat` emits an empty
            block rather than omitting the key.
      description: >
        NOTE(W2): internal/api/v2/configurations/handler.go, ListResponse
        (compat) and dto.go, CurrentConfigurationListDTO (reviewed).

    ConfigurationModelItem:
      type: object
      required: [name, project_id]
      properties:
        id:
          type: integer
          description: >
            `compat` only, and it is the CONFIGURATION row id, not a model id.
            `reviewed` emits no id at all, and the shipped client synthesises
            one from `project_id` and `name`.
        name:
          type: string
          description: BOTH. The model name a caller selects.
        display_name:
          type: string
          nullable: true
          description: '`reviewed` only.'
        type:
          type: string
          description: >
            `compat` only. One of llm_model, embedding_model, asr_model,
            tts_model, image_generation_model.
        project_id:
          type: integer
          description: BOTH, and a NUMBER on both, for the reason ConfigurationRow gives.
        section:
          type: string
          description: '`compat` only.'
        shared:
          type: boolean
          description: '`reviewed` only.'
        is_default:
          type: boolean
          description: >
            `compat` only, and it is ALWAYS false: that handler does not read
            the project default. Read `default_model_name` on the envelope
            instead.
        default:
          type: boolean
          description: '`reviewed` only. The project default.'
        config_id:
          type: integer
          description: '`compat` only. A copy of `id`.'
        config_name:
          type: string
          description: '`compat` only. A copy of `name`.'
        context_window:
          type: integer
          nullable: true
          description: '`reviewed` only.'
        max_output_tokens:
          type: integer
          nullable: true
          description: '`reviewed` only.'
        supports_reasoning:
          type: boolean
          nullable: true
          description: '`reviewed` only.'
        supports_vision:
          type: boolean
          nullable: true
          description: '`reviewed` only.'
        low_tier:
          type: boolean
          nullable: true
          description: '`reviewed` only.'
        high_tier:
          type: boolean
          nullable: true
          description: '`reviewed` only.'
        openai_compatible:
          type: boolean
          nullable: true
          description: '`reviewed` only.'
        data:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): `compat` only. The `data` jsonb column of the model's
            configuration row, forwarded verbatim
            (internal/api/v2/configurations/handler.go:1529, in ListModels).
            The key set is the model type's own.
      description: >
        NOTE(W2): the union of internal/api/v2/configurations/handler.go's
        Model (compat) and internal/application/configurations/models.go's
        CurrentModelCatalogItem (reviewed).

    ConfigurationModelListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationModelItem' }
        total: { type: integer }
        default_model_name:
          type: string
          nullable: true
          description: >
            `reviewed` only. `compat` emits neither this key nor the one below,
            and its `is_default` is always false, so a client reading a default
            model from a compat deployment gets nothing rather than a wrong
            answer.
        default_model_project_id:
          type: integer
          nullable: true
          description: '`reviewed` only.'
        low_tier_default_model_name:
          type: string
          nullable: true
          description: '`reviewed` only, and omitted when unset.'
        low_tier_default_model_project_id:
          type: integer
          nullable: true
          description: '`reviewed` only, and omitted when unset.'
        high_tier_default_model_name:
          type: string
          nullable: true
          description: '`reviewed` only, and omitted when unset.'
        high_tier_default_model_project_id:
          type: integer
          nullable: true
          description: '`reviewed` only, and omitted when unset.'
      description: >
        NOTE(W2): internal/api/v2/configurations/handler.go, ListModels
        (compat) and internal/application/configurations/models.go,
        CurrentModelCatalog (reviewed).

    # ---- Artifacts ---------------------------------------------------------------
    # docs/plans/storage-migration-plan.md S7. Replaces the retired
    # legacy/pseudo-S3 surface (ADR-0016 §7) — no data migration, no wire
    # compatibility with the shapes this block used to document.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - NotFound
                - AlreadyExists
                - AccessDenied
                - InvalidArgument
                - InvalidKey
                - TooLarge
                - QuotaExceeded
                - PreconditionFailed
                - NotImplemented
                - Internal
                - DigestMismatch
                - MediaTypeMismatch
            message: { type: string }
            details:
              type: object
              properties:
                cleanup_error:
                  type: string
                  description: >-
                    The only diagnostic key any artifact handler emits. Set
                    solely by rejectCommit
                    (internal/api/v2/artifacts/grants.go:333-343), when a
                    commitTransferGrant verification failure (TooLarge /
                    MediaTypeMismatch / DigestMismatch / QuotaExceeded — its
                    five call sites at grants.go:438, 450, 462, 468, 504) is
                    followed by a FAILED cleanup delete of the just-uploaded
                    object; the value is that delete's error string. Every
                    other error response goes through writeError
                    (internal/api/v2/artifacts/handler.go:100-104), which
                    emits code+message only and no details member at all.
              description: >
                Closed set — one optional key. Not an open map: `details` is
                populated at exactly one site in the service
                (internal/api/v2/artifacts/grants.go:339), so it is typed
                here rather than carrying an x-elitea-passthrough marker.
                Widen this schema, do not re-open it, if a future handler
                adds a second diagnostic key.
      description: >
        The artifact API's error envelope. Distinct from the legacy
        ErrorResponse ({"error": "message"} — a plain string) used by every
        other operation in this spec; this is a deliberately richer, typed
        shape scoped to the new artifact operations only.

    Bucket:
      type: object
      required:
        - name
        - type
        - is_pinned
        - tags
        - retention_days
        - expires_at
        - size_bytes
        - object_count
        - created_at
        - updated_at
      properties:
        name: { type: string }
        type:
          type: string
          enum: [system, autogenerated, local]
          description: Wire name for the elitea_storage.buckets.bucket_type column.
        is_pinned: { type: boolean }
        tags:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): caller-owned opaque JSON, round-tripped verbatim. The
            handler never parses it: Bucket.Tags is json.RawMessage, not a
            typed struct (internal/api/v2/artifacts/handler.go:31), and
            bucketFromRow copies row.Tags straight through, substituting `{}`
            only when the column is empty
            (internal/api/v2/artifacts/handler.go:124-140). The repository is
            equally opaque — BucketRow.Tags is json.RawMessage
            (internal/infra/db/repos/artifact_buckets.go:30) filled by a
            direct cast off the sqlc row
            (internal/infra/db/repos/artifact_buckets.go:46) — and the column
            is a bare JSONB with no shape constraint
            (migrations/shared/0057_artifact_storage.sql:10). No key in this
            map is read by any Go code, so there is no closed set to
            enumerate; the shape is whatever the client last wrote.
        retention_days:
          type: integer
          nullable: true
          description: Null means no expiry.
        expires_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          description: Sum of its objects' byte lengths (S6 SumBucketBytes).
        object_count:
          type: integer
          format: int64
          description: S6 CountBucketObjects.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BucketListResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'

    BucketPermissionMap:
      type: object
      description: >
        The per-bucket exception map, keyed by BUCKET NAME. An absent key
        means no exception, so the member keeps full access to that bucket. A
        key whose value is an empty array means no access. The two are not
        interchangeable.
      additionalProperties:
        type: array
        items:
          type: string
          enum: [read, write]
