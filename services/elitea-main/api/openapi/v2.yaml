    # ---- Export / import / fork ------------------------------------------------
    ExportedSkillReference:
      type: object
      required: [import_uuid, entity_type]
      properties:
        import_uuid:
          type: string
          description: >
            Names one entry of the document's top-level `skills` array. A
            reference cannot name a skill by id: `skills.id` belongs to the
            project the file came from, and an import writes into a different
            project. The export reads the id and swaps the key for the uuid
            once it has read the skills
            (internal/api/v2/eliteacore/export_import.go:413-427).
        entity_type:
          type: string
          enum: [agent]
          description: >
            The `entity_skill_mapping.entity_type` of the attachment, and a
            CLOSED set of one member. The import refuses every other value and
            reports it on `errors.skills`
            (internal/api/v2/eliteacore/import_skills.go:433-437), because the
            sibling write route answers 400 for anything else
            (internal/api/v2/skills/handler.go:423-441) and both reads filter
            on the literal — so a row with another value is a row nothing
            reads. The export writes the column out as it stands
            (internal/api/v2/eliteacore/export_import.go:371-374), and every
            writer of that column in this service writes `agent`
            (internal/api/v2/skills/handler.go:104).
        version_name:
          type: string
          description: >
            The skill version the attachment pins. The key is ABSENT when the
            source row holds a NULL `skill_version_id`
            (internal/api/v2/eliteacore/export_import.go:375-381). An absent
            key tells the import to attach the skill's `base` version
            (internal/api/v2/eliteacore/import_skills.go:115-127).
      description: >
        NOTE(W2): one skill attachment of one agent version, in the EXPORT
        direction. Both required keys are always written
        (internal/api/v2/eliteacore/export_import.go:371-374, with
        `import_uuid` swapped in at :413-427). SkillReferenceInput is the
        REQUEST twin of this schema, and it requires `import_uuid` only.

    SkillReferenceInput:
      type: object
      required: [import_uuid]
      properties:
        import_uuid:
          type: string
          description: >
            Names one entry of the request's top-level `skills` array. A
            reference that names an entry the request did not carry, or one
            whose own import failed, is reported on `errors.skills`
            (internal/api/v2/eliteacore/import_skills.go:403-411).
        entity_type:
          type: string
          enum: [agent]
          description: >
            OPTIONAL here, which is the one difference from the export
            direction: an absent or empty value becomes `agent`
            (internal/api/v2/eliteacore/import_skills.go:429-432). Every other
            value is refused and reported (:433-437).
        version_name:
          type: string
          description: >
            The skill version to pin. An absent key attaches the skill's
            `base` version, and then the skill's first version
            (internal/api/v2/eliteacore/import_skills.go:115-127).
      description: >
        NOTE(W2): one skill attachment that a fork or an import request asks
        for, read at
        internal/api/v2/eliteacore/import_skills.go:397-437. It is the REQUEST
        twin of ExportedSkillReference. The two are separate schemas because
        `entity_type` is written on every exported reference and is optional
        on every requested one. One schema that required the key would make
        the generated client refuse a body this service accepts.

    SkillVersionExport:
      type: object
      required: [id, name, instructions, author_id, meta, tags]
      properties:
        id:
          type: integer
          description: >
            The source `skill_versions.id`. It is a NUMBER and not a string:
            the export writes the raw column value
            (internal/api/v2/eliteacore/export_import.go:580-583). The import
            ignores it and uses the id of the row it writes.
        name:
          type: string
          description: >
            The version name a reference pins with `version_name`. An empty
            name is written as "base" on import
            (internal/api/v2/eliteacore/import_skills.go:229-232).
        instructions: { type: string }
        author_id:
          type: integer
          description: >
            The source `skill_versions.author_id`. It is a NUMBER and not a
            string. The import ignores it and writes the caller
            (internal/api/v2/eliteacore/import_skills.go:251-257).
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the `skill_versions.meta` jsonb column. The export
            copies it without inspecting it
            (internal/api/v2/eliteacore/export_import.go:571-583) and the
            import writes it back verbatim
            (internal/api/v2/eliteacore/import_skills.go:234-237, 251-257). It
            is `{}` when the column is NULL.
        tags:
          type: array
          items:
            type: object
            required: [name, data]
            properties:
              name: { type: string }
              data:
                x-elitea-passthrough: >-
                  NOTE(W2): the `tags.data` jsonb column. The export copies it
                  without inspecting it
                  (internal/api/v2/eliteacore/export_import.go:655-662) and it
                  is `{}` when the column is NULL. The import reads the tag
                  name only, and accepts a plain string in place of this
                  object (internal/api/v2/eliteacore/import_skills.go:338-346).
      description: >
        NOTE(W2): one version of an exported skill,
        internal/api/v2/eliteacore/export_import.go:580-583, with `tags` added
        at :481-490. `status` is absent on purpose. It records whether the
        SOURCE project holds a twin of the version in the public project,
        which can never hold for the project the file is imported into
        (:552-557). Only the versions the attachments name are exported. A
        selection that matches nothing keeps the whole history, because a
        skill with no version cannot be imported (:601-616).

    SkillExport:
      type: object
      required: [entity, id, import_uuid, name, description, owner_id, meta,
                 versions]
      properties:
        entity:
          type: string
          description: >
            Always the literal "skills". The export stamps the key so that a
            document sent to the import route unchanged names its own entities
            (internal/api/v2/eliteacore/export_import.go:526-531).
        id:
          type: string
          description: >
            The source `skills.id`. The import ignores it, because that id
            belongs to the project the file came from.
        import_uuid:
          type: string
          description: >
            The key every version reference uses. It is `skills.uuid`, or
            `skill-<id>` when the row holds no uuid
            (internal/api/v2/eliteacore/export_import.go:516-523).
        name: { type: string }
        description:
          type: string
          description: >
            The import writes the name into the column when this value is
            empty, because `skills.description` is NOT NULL
            (internal/api/v2/eliteacore/import_skills.go:143-148).
        owner_id:
          type: string
          description: >
            The SOURCE project id, and not a user id. The import ignores it
            and writes the destination project
            (internal/api/v2/eliteacore/import_skills.go:213-217).
        meta:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): the `skills.meta` jsonb column. The export copies it
            without inspecting it
            (internal/api/v2/eliteacore/export_import.go:509-515, written at
            :537) and the import writes it back with `import_uuid` added
            (internal/api/v2/eliteacore/import_skills.go:278-292). It is `{}`
            when the column is NULL.
        versions:
          type: array
          items: { $ref: '#/components/schemas/SkillVersionExport' }
          description: >
            ALWAYS an array, and never null. A skill needs no version row, and
            an agent can be attached to a skill that has none, so this value
            was the nil version list of such a skill; the export now writes
            `[]` there, which is the shape every sibling array of the document
            already has
            (internal/api/v2/eliteacore/export_import.go:617-619).

            The import adds a `base` clone of the first entry when the array
            names no version called `base`, because every skills read of this
            service joins on that name
            (internal/api/v2/eliteacore/import_skills.go:304-326). The clone
            is additive, so a reference that pins another version still finds
            it. Every imported version is written with status `draft`
            (:251-257). An entry whose array is empty is refused and reported
            on errors.skills (:164-167).
      description: >
        NOTE(W2): one entry of the export document's top-level `skills` array,
        internal/api/v2/eliteacore/export_import.go:525-539. The same object
        is what the import route accepts as an entity with entity "skills",
        and what the fork request carries in its own `skills` array.

    ApplicationVersionExport:
      type: object
      required: [id, name, status, application_id, author_id, agent_type,
                 instructions, welcome_message, llm_settings,
                 conversation_starters, meta, tools, variables, tags, skills,
                 is_forked]
      properties:
        id: { type: string }
