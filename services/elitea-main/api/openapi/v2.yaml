        intentionally selects only those migrated columns.

    ToolkitInstanceListResponse:
      type: object
      required: [rows, total]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/ToolkitInstance' }
        total: { type: integer }
      description: >
        NOTE(W2): `{rows, total}` envelope
        (internal/api/v2/toolkits/handler.go:526-534). Repository failures are
        returned as a safe 500 error rather than an indistinguishable empty
        successful listing.

    ToolkitTool:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string }
      description: >
        NOTE(#440): one row of the two tool-catalogue reads. The Go type is
        `toolkits.Tool` (internal/api/v2/toolkits/handler.go:21-28). Both
        queries select the same four columns of `p_{project_id}.elitea_tools`:
        `id`, `name`, `type` and `COALESCE(description, '')` (:1086-1116).
        `id` is a JSON string because the struct field is a string. The column
        itself is the table's `id SERIAL`
        (internal/infra/db/migrations/001_initial.sql:435-447).

        `description` is optional. The struct tag carries `omitempty`, so an
        empty column value removes the key.

        TWO STRUCT FIELDS ARE ABSENT ON PURPOSE. `toolkits.Tool` also declares
        `owner_id` and `settings`. `scanTools` (:1121-1135) assigns neither,
        and both tags carry `omitempty`, so neither key can reach a client of
        these two operations. Do not add them here: a contract that promises a
        key the handler never writes sends the client to look for data that
        does not exist. The other producer of the same struct is `ForkToolkit`,
        which this document does not describe.

    ToolkitToolsPayload:
      type: object
      required: [tools, total]
      properties:
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolkitTool' }
        total: { type: integer }
      description: >
        NOTE(#440): the `{tools, total}` envelope that both tool-catalogue
        reads write (internal/api/v2/toolkits/handler.go:522, 544). `total` is
        `len(tools)` of the SAME response, not a page count: neither operation
        pages. Both keys are always present, so an absent `tools` key is a
        transport fault, not an empty catalogue.

        AN EMPTY LIST IS A RESULT, NOT A FAULT (#381). A failed read gives 500
        and a named reason. Only a toolkit with no tools gives 200 and an empty
        array. Render the two apart.

    ToolkitToolRunRequest:
      type: object
      required: [tool_name]
      description: >
        NOTE(W2): the body `toolkitrun.DecodeRequest` reads
        (internal/api/v2/toolkitrun/response.go:78-118). It is pylon's
        `TestToolkitToolInputModel` minus the fields this platform refuses to
        take from a caller.

        NO SETTINGS AND NO CREDENTIALS ARE ACCEPTED. pylon takes
        `toolkit_config.settings` from the request and runs the tool against
        them, which is how its own UI tests unsaved form values. This operation
        names the toolkit in the URL and reads the SAVED row instead, because a
        caller that can supply settings can supply credentials — the same rule
        internal/api/v2/indexing/start_handler.go already states for
        `index_data`. The stated cost: unsaved settings cannot be tested through
        this route, so the toolkit must be saved first. A `toolkit_config` key
        is accepted for wire compatibility and IGNORED here; the route segment
        wins, because the route is what the permission gate resolved
        (response.go:86-95).
      properties:
        tool_name:
          type: string
          description: >
            The tool to run, spelled as `toolkit_available_tools` names it. The
            value is trimmed and then required to be non-empty
            (response.go:101-116), so a blank name is 400 and not an empty run.
        tool_params:
          type: object
          additionalProperties: true
          description: >
            The tool's own arguments. An absent or empty value means `{}`.
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/toolkitrun/response.go:96-99 keeps this
            value as raw JSON and hands it to the worker unread. The key set is
            the TOOL's own args_schema, which differs per tool and per toolkit
            type, so no closed shape here could be right for every tool.

    ToolkitToolRunResult:
      type: object
      required: [ok]
      description: >
        NOTE(W2): the one body `toolkitrun.WriteOutcome` and
        `toolkitrun.WriteError` write for every settled and every refused run
        (internal/api/v2/toolkitrun/response.go:145-241). THE STATUS CODE
        CARRIES THE OUTCOME; there is no status string to read:

        200 with `ok: true` — the run reached the tool and the tool returned.
        200 with `ok: false` — the run reached the tool and the tool RAISED.
        422 with `reason: unsupported_toolkit` — this image cannot build that
        toolkit type.
        422 with `reason: unknown_tool` — the toolkit has no tool by that name.
        504 with `reason: timeout` — the bounded wait passed. The run is STILL
        GOING and durable; `task_id` names it.
        500 with `reason: runtime_failure` — a server fault, reported with a
        safe message and no cause.

        A TOOL THAT RAISED IS 200 ON PURPOSE. The run completed, and "it raised,
        and here is why" is the answer to "does this tool work against my saved
        settings". pylon could not tell these conditions apart, because the SDK
        handed it one dict.
      properties:
        ok:
          type: boolean
          description: >
            True only on the 200 branch where the tool returned a result. Every
            other branch, including a tool that raised, is `false`.
        task_id:
          type: string
          description: >
            The execution this run wrote. On 504 it is the handle to poll, which
            is why that branch is 504 and not pylon's 400: the request gave up,
            the run did not (response.go:205-215). Absent on a refusal that
            happened before admission, because nothing was written and nothing
            ran.
        tool_name:
          type: string
          description: The tool the run resolved, echoed back.
        toolkit_type:
          type: string
          description: >
            Present once the run resolved the toolkit far enough to know its
            type. Absent on a refusal that happened before that point.
        result:
          description: >
            Whatever the tool returned, verbatim. Present only on the 200
            `ok: true` branch, and absent there when `truncated` is true.
          x-elitea-passthrough: >-
            NOTE(W2): internal/api/v2/toolkitrun/response.go:159-172 relays the
            worker's canonical JSON without reading it, and relays the raw
            string where the encoding is not the JSON the worker promised. The
            shape belongs to the tool, so this document cannot close it.
        truncated:
          type: boolean
          description: >
            The worker DROPPED an oversized result rather than cutting it, so
            there is no `result` key at all (response.go:155-163). Half a JSON
            document reads as a corrupt result, and an absent one does not.
        error:
          type: string
          description: >
            The tool's own sentence on the 200 `ok: false` branch, and the
            refusal's own sentence on every other branch. The 500 branch never
            relays an internal message: it is a server fault, not the caller's.
        reason:
          type: string
          description: >
            Why the run did not answer with a result. Absent on both 200
            branches, present on every other. The values are
            `unsupported_toolkit`, `unknown_tool`, `timeout` and
            `runtime_failure`, written verbatim by response.go:176-197 and
            :205-215. It is not modelled as an enum: a caller must treat an
            unknown value as a plain failure rather than as a shape it can
            switch on.
