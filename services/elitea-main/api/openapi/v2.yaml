      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        avatar: { type: string }
        likes: { type: integer }
      description: >
        NOTE(W2): social.TrendingAuthors row shape
        (internal/api/v2/social/handler.go:202-237, fields at :230-233) —
        ranks social authors by their like activity in the authorized project
        schema (social/handler.go:206-240). The handler reads
