        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Role array (global defaults admin/editor/viewer when none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # ==========================================================================
  # ADMIN — moderation
  # ==========================================================================
  /admin/moderation_status/default/{project_id}/{entity_id}:
    # DEFECT, fixed here: both operations described the retired static stub —
    # `entity_id` typed integer, a POST body "accepted but ignored", and a
    # 200 {"status":"approved"} from both. The live handlers are
    # internal/api/v2/moderation/requests.go (router.go mounts Requests and
    # RequestCreate here): the GET answers {total, rows}, the POST answers 201
    # with the created row and REQUIRES issue_type and description. The
    # integer `entity_id` was the costly part: the generated client typed the
    # path parameter as a number. apps/elitea-web therefore hashed its string
    # catalogue keys ("inventory") into integers, while the legacy UI sent the
    # key itself. One catalogue entry got two rows, and neither client saw the
    # other's request.
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
        description: >
          The catalogue key, an arbitrary string. Read with chi.URLParam and
          stored in a VARCHAR column
          (internal/api/v2/moderation/requests.go:578, 622).

    get:
      operationId: moderationStatus
      summary: List the caller's own moderation requests for an entity
      description: |
        NOTE(W2): internal/api/v2/moderation/requests.go:561-595. Scoped to
        the authenticated caller in SQL — the answer is "what have I asked
        for", never "what has anyone asked for". Rows come newest first, so
        the current state is `rows[0]`. The optional `issue_type` query
        parameter narrows the list to one label.
      tags: [admin]
      parameters:
        - name: issue_type
          in: query
          required: false
          schema:
            type: string
          description: Narrow the list to one issue type.
      responses:
        '200':
          description: The caller's requests for this entity, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationRequestList'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

    post:
      operationId: createModerationRequest
      summary: File a moderation request for an entity
      description: |
        NOTE(W2): internal/api/v2/moderation/requests.go:612-664. Creates one
        `centry.moderation_state` row and answers 201 with it. The row is
        always authored by the authenticated caller and always starts
        `pending`; a body that sets `user_id`, a `status` other than
        "pending", or a non-empty `meta` is refused with 400.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequestCreate'
      responses:
        '201':
          description: The created request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationRequestRow'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  # ==========================================================================
  # ADMIN — platform settings & support assistant
  # ==========================================================================
  /elitea_core/platform_settings/prompt_lib:
    get:
      operationId: getPlatformSettings
      summary: Retrieve platform-wide settings for the prompt library
      description: |
        NOTE(W2): defaults + environment_settings overlay,
        internal/api/v2/eliteacore/handler.go:51-81. On this project-less
        route only the ten defaults are returned.
      tags: [admin]
      responses:
        '200':
          description: Platform feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '401': { $ref: '#/components/responses/401' }

  # ---- Support assistant ------------------------------------------------------
  #
  # The in-app support widget. Served by internal/api/v2/supportassistant, which
  # is a thin facade over the chat stack scoped to ONE HIDDEN PROJECT resolved
  # from centry.platform_config.
  #
  # NO ROUTE BELOW TAKES A PROJECT. That is the surface's defining property: the
  # project comes from operator configuration, never from the caller, which is
  # what makes it impossible to aim a support route at another tenant. The
  # conversation routes are additionally predicated on the caller being the
  # conversation's author, because the project is shared by everybody.
  /support_assistant/config:
    get:
      operationId: getSupportAssistantConfig
      summary: Retrieve support assistant configuration
      description: |
        The widget's first call on every page load, and the only route on this
        surface with no permission gate.

        It answers 200 with `{"enabled": false}` for an unauthenticated caller
        and for every deployment that cannot serve the assistant. A 401 here
        would be indistinguishable from a session expiry to a widget that mounts
        in the app shell before a session necessarily exists, and there is
        nothing to withhold: the disabled body is one boolean.
      tags: [chat]
      responses:
        '200':
          description: Support assistant configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportAssistantConfig'

  /support_assistant/conversations/:
    get:
      operationId: listSupportConversations
      summary: List the caller's support conversations
      tags: [chat]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: q
          in: query
          description: Case-insensitive substring match on the conversation name.
          schema: { type: string }
      responses:
        '200':
          description: The caller's support conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationList'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '503':
          description: >
            The assistant is disabled, has no hidden project, or has no agent
            chosen. Which of the three is deliberately not distinguished.
    post:
      operationId: createSupportConversation
      summary: Open a new support conversation
      tags: [chat]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '201':
          description: The created conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversation'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }

  /support_assistant/conversation/{conversationUUID}:
    parameters:
      - name: conversationUUID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSupportConversation
      summary: Read one support conversation and its transcript
      description: |
        Answers 404 both when the conversation does not exist and when it belongs
        to another user. Distinguishing them would confirm that a UUID names a
        real support conversation belonging to a real other person.
      tags: [chat]
      responses:
        '200':
          description: The conversation and its transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationDetails'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
  /support_assistant/predict/{conversationUUID}:
    parameters:
      - name: conversationUUID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: startSupportTurn
      summary: Ask the support assistant one question
      description: |
        Attaches the operator-chosen agent to the conversation as a participant
        if it is not already there, then starts one agent run and answers with
        the SSE `events_url` to subscribe to.

        This is the REST replacement for the reference's socket.io
        `support_predict` event: this service streams over SSE, so the turn is
        started over HTTP and answered on the same durable execution stream the
        chat surface already consumes.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportPredictRequest'
      responses:
        '200':
          description: The run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportPredictResponse'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '502':
          description: The agent execution pipeline refused to start the run.
        '503':
          description: The assistant is not configured to answer.

  /branding/assets/{kind}/{file}:
    # Served OUTSIDE the auth group like bootstrap.js: <img src>, <link
    # rel="icon"> and @font-face fetches carry no credential. The path is a
    # content address (kind/<sha256>.<ext>) and the route admits no other
    # shape; every response carries nosniff, a sandboxing CSP and an
    # attachment disposition (internal/api/v2/branding/assets.go).
    get:
      operationId: getBrandingAsset
      summary: Download one uploaded brand asset
      tags: [admin]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [logo-full, logo-mark, logo-email, favicon, login-art, font] }
        - name: file
          in: path
          required: true
          description: "<sha256 hex>.<ext>"
          schema: { type: string }
      responses:
        '200':
          description: The asset bytes, immutable for a year.
          headers:
            Cache-Control:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/x-icon:
              schema: { type: string, format: binary }
            font/woff2:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/404' }

  /branding/bootstrap.js:
    # NOTE(W3): served OUTSIDE the auth group — the SPA shell loads this
    # script before a session exists (UI reimplementation spec §4.3 delivery
    # channel C, §9.3 W3; route registered at internal/api/router.go, root
    # level). The `servers:` override that used to sit here only escaped the
    # bogus `/api/v2/elitea_core` default base; the root server is now
    # correct for this path too.
    get:
      operationId: getBrandingBootstrap
      summary: Branding bootstrap script (window.elitea_brand)
      description: |
        GetBrandingBootstrap serves the deployment-level brand pack as an
        executable script of the form `window.elitea_brand = {...};` where
        `{...}` is a JSON brand pack conforming to
        https://elitea.ai/schemas/brand-pack/1.json (spec §4.2). The endpoint
        never fails: a missing or invalid pack file degrades to the built-in
        default pack. Unauthenticated by design.

        Caching (spec §4.3 channel C): the response carries a strong `ETag`
        (content hash). Without `?v=` the body is served with
        `Cache-Control: no-cache` (revalidate via `If-None-Match` → 304).
        With `?v=` equal to the current unquoted ETag value the body is
        served with `Cache-Control: public, max-age=31536000, immutable`.
        A stale `?v=` mismatch answers `302 Found` to the current-version
        URL so an immutable content-addressed URL never serves stale bytes.
      responses:
        '200':
          description: Bootstrap script assigning window.elitea_brand.
          headers:
            ETag:
              description: Strong entity tag (quoted SHA-256 hex of the body).
              schema: { type: string }
            Cache-Control:
              description: >-
                `no-cache` on the bare URL; `public, max-age=31536000,
                immutable` when `?v=` matches the current ETag value.
              schema: { type: string }
          content:
            application/javascript:
              schema:
                type: string
                description: JavaScript statement `window.elitea_brand = {...};`
                example: 'window.elitea_brand = {"$schema":"https://elitea.ai/schemas/brand-pack/1.json","id":"default","version":"1.0.0"};'
        '302':
          description: >-
            The `?v=` token does not match the current ETag value; Location
            points at the current-version URL.
          headers:
            Location:
              schema: { type: string }
        '304':
          description: If-None-Match matched the current strong ETag.
          headers:
            ETag:
              schema: { type: string }
    parameters:
      - name: v
        in: query
        required: false
        schema: { type: string }
        description: >-
          Content version token — the current ETag value without quotes.
          Matching requests are cached as immutable; mismatches are
          redirected to the current version.

  # ==========================================================================
  # ANALYTICS
  # NOTE(W2): all seven ops are served by internal/api/v2/analytics/handler.go.
  # The *_detail routes hit the same handlers as their list siblings; the
  # handler switches to the detail envelope only when the id query param it
  # actually reads (user_id / tool_id|toolkit_id / application_id|agent_id) is
  # present. Old-SPA alignment differs per route
  # (apps/elitea-ui/src/[fsd]/features/analytics/api/analyticsApi.js):
  #   user detail  — SPA sends user_id (:56)    → MATCHES → detail envelope
