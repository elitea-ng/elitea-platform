            they create
            (internal/api/v2/eliteacore/import_skills.go:397-461).
        is_forked: { type: boolean }
        import_version_uuid:
          type: string
          description: Present only when the version row has a uuid.
      description: >
        NOTE(W2): ExportImportGet version entry,
        internal/api/v2/eliteacore/export_import.go:176-188.

    ApplicationExport:
      type: object
      required: [id, name, description, type, import_uuid, versions]
      properties:
        id: { type: string }
        name: { type: string }
