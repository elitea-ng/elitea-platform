    AuthorUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        avatar: { type: string }
        personalization:
          nullable: true
          x-elitea-passthrough: >-
            NOTE(W2): marshaled verbatim into
            centry.social_users.personalization jsonb, defaulting to JSON
            null when the key is absent or not JSON-encodable
            (internal/api/v2/social/handler.go:159, jsonVal helper at
            :442-448).
          description: Arbitrary user-defined personalization payload.
        default_context_management:
          $ref: '#/components/schemas/MemoryContextManagement'
        default_summarization:
          $ref: '#/components/schemas/MemorySummarization'
      description: >
        NOTE(W2): decoded into map[string]any
        (internal/api/v2/social/handler.go, UpdateAuthor); every property is
        optional, and any key not listed here is silently ignored. A missing
