        url:
          type: string
        size:
          type: string
        initial_file_size:
          type: string
        resulting_file_size:
          type: string
      description: >
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:353-380
        (UpdateSkillIcon). The body is decoded as a free map and stored verbatim
        as meta.icon_meta, but `name` and `url` must both be strings or the
        request is a 400 — pylon's model declares them required, and an
        icon_meta without them is one the read path cannot render.

    SkillIconBindRefusal:
      type: object
      required: [ok, msg]
      properties:
        ok:
          type: boolean
          description: Always false on this body.
        msg:
          type: string
          description: '`There is no such version id N`.'
      description: >
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:333-336 and :392-395
        — the 404 both binding routes answer. It is NOT the flat
        `{"error": "..."}` shape; pylon answers `{ok, msg}` here and the port
