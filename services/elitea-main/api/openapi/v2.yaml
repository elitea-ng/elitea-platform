      summary: Detailed analytics for a specific user within a project
      description: |
        NOTE(W2): same handler as listAnalyticsUsers
        (internal/api/router.go:543-544 → analytics/handler.go:117-139). The
        detail envelope is returned when ?user_id= is present (:125-137),
        which is exactly what the old SPA sends
        (apps/elitea-ui/src/[fsd]/features/analytics/api/analyticsApi.js:56,
        `params.set('user_id', String(userId))`) — so the SPA's detail calls
        DO receive the detail envelope. Without user_id the handler falls
