    UpdatedResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean
      description: >
        NOTE(W2): internal/api/v2/eliteacore/skill_icon.go:399
        (UpdateSkillIcon's success body).

    # ---- Personal access tokens (issue 36, item 6) -----------------------------
    PersonalAccessToken:
      type: object
      required: [id, uuid, expires, user_id, name, project_id, token]
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          nullable: true
          description: The identifier the GET and the DELETE address the token by.
        expires:
          type: string
          format: date-time
          nullable: true
          description: Null means the key never expires.
        user_id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
          description: >
            Null is a real stored value here, distinct from an absent key: the
            create refuses a body with no `name` and accepts an explicit null.
        project_id:
          type: integer
          format: int64
          nullable: true
          description: >
            The project this key bills, or null when the key is unbound. It is
            reported WITHOUT omitempty so a client can tell "unbound" from "a
            server that does not know about bindings".
        token:
          type: string
          description: >
            THE FULL SIGNED VALUE ON THE CREATE RESPONSE, AND ONLY THERE. Every
            read masks it to `"..."` plus the last seven characters, which is a
            display hint and not a credential.
      description: >
        NOTE(W2): internal/api/v2/auth/tokens.go:41-52 (the `Token` struct) and
        :575-600 (presentToken, which decides whether `token` is revealed).

    PersonalAccessTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          nullable: true
          description: >
            Required as a KEY. An absent `name` is a 400; an explicit null is
            stored and read back as null. Longer than 768 bytes is a 400.
        expires:
          allOf: [{ $ref: '#/components/schemas/TokenExpiration' }]
          nullable: true
          description: Absent or null mints a key that never expires.
        project_id:
          type: integer
          format: int64
          nullable: true
          description: >
            Absent or null mints an UNBOUND key, which is the default. Every
            other shape — a JSON string, a float, a boolean, zero, a negative
            number, a value the integer column cannot hold — is refused rather
            than falling back to unbound, because a caller that typed a project
            must not receive a key that bills somewhere else.
      description: >
        NOTE(W2): internal/api/v2/auth/tokens.go:360-368
        (tokenCreateRequest) and :375-400 (resolveTokenProjectID).

    TokenExpiration:
      type: object
      required: [measure, value]
      properties:
        measure:
          type: string
          enum: [seconds, minutes, hours, days, weeks]
          description: Any other value is a 400, not a silent default.
        value:
          type: integer
          format: int64
          nullable: true
          description: >
            Null is a 400 ("expires must have value"). A value large enough to
            overflow the duration arithmetic is a 400 as well, not a wrapped
            date in the past.
      description: >
        NOTE(W2): internal/api/v2/auth/tokens.go:410-413 (tokenExpiration) and
        :636-659 (resolve). The expiry is computed from the server's clock at
        creation, so the client sends an OFFSET and never an instant.

