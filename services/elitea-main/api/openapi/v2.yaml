        skills:
          type: array
          items: { $ref: '#/components/schemas/SkillExport' }
          description: >
            The content of every skill that a version of the exported
            application is attached to. The key is OMITTED when the
            application has no skill attachment, because the import wizard
            turns each top-level array into a group the user selects, and an
            empty group has nothing to select
            (internal/api/v2/eliteacore/handler.go:3535-3541). The array is
            built after the `?fork=true` branch drops the versions it does not
            export, so it names only the skills the exported versions use
            (:3490-3499).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:3530-3541. With
        ?as_file=true the same JSON is sent with a Content-Disposition
        attachment header (:3557-3570), and with ?format=md it is rendered as
        markdown instead (:3552-3555). A handler that holds no database pool
        answers 500 and no document at all (:3416-3420).

    ExportConverterResponse:
      type: object
      required: [ok, converted]
      properties:
        ok: { type: boolean }
        converted:
          nullable: true
          x-elitea-passthrough: >-
            NOTE(W2): echo of the request body, whatever it was
            (internal/api/v2/eliteacore/handler.go:3575-3579); null when the
            body was absent/malformed.
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:3575-3579 — the
        "converter" is currently an echo stub.

    ExportConverterRequest:
      type: object
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): arbitrary legacy payload; decoded into map[string]any and
        echoed back unchanged (internal/api/v2/eliteacore/handler.go:3575-3579).

    ImportEntity:
      type: object
      properties:
        entity:
          type: string
          description: >
            "toolkits" routes to the toolkit import and "skills" routes to the
            skill import. Every other value is an agent
            (internal/api/v2/eliteacore/handler.go:2439-2450). A "skills"
            entry had no branch of its own, so every skill entry the wizard
            sent became an agent named after the skill (#611).
        import_uuid: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        settings:
          type: object
          additionalProperties: true
          x-elitea-passthrough: >-
            NOTE(W2): toolkit settings persisted verbatim after import_uuid
            resolution (internal/api/v2/eliteacore/handler.go:2698-2734).
        versions:
          type: array
          items: { $ref: '#/components/schemas/VersionWriteRequest' }
          description: >
            On THIS route `versions[].agent_type` accepts `openai`, `react`,
            `dial`, `pipeline`, `agent` and the empty string, and nothing else;
            `versions[0]` decides, and any other value is refused on the agents
            error channel with "invalid agent_type"
            (internal/api/v2/eliteacore/handler.go, storedAgentType).

            `agent` and the empty string are both STORED as `openai`. `agent`
            is accepted because the platform's own markdown export writes it
            for a stored `openai` agent (export_markdown.go,
            markdownAgentType, mirroring pylon's _application_to_md), so
            without the mapping an exported `.agent.md` file was not importable
            through this API — only through a web client, which renames the
            value in its own file parser (issue 845).
      additionalProperties: true
      x-elitea-passthrough: >-
        NOTE(W2): entities are handled as map[string]any. The import reads
        entity/import_uuid (handler.go:2439-2446), an agent's
        name/description/versions (:2519-2522) and a toolkit's
        name/type/settings (:2688-2698), each version's import_version_uuid
        (:2618-2621, load-bearing — it resolves toolkit
        settings.application_version_id at :2718-2721), tools' import_uuid and
        selected_tools (:2805, :2828, persisted to entity_tool_mapping at
        :2835-2838), and toolkit settings.import_uuid /
        settings.import_version_uuid (:2713, :2718). It ALSO reads, for an
        entity with entity "skills", that entity's versions[].name,
        versions[].instructions, versions[].meta and versions[].tags
        (import_skills.go:224-268), and, for an agent entity, each version's
        `skills` array of SkillReferenceInput (import_skills.go:470-473,
        written to entity_skill_mapping at :397-461). The rest is ignored. The
        versions items ref VersionWriteRequest, whose additionalProperties
        admits the round-trip keys (import_version_uuid, tools, skills) that
        its named properties do not declare.

    ImportWizardRequest:
      oneOf:
        - type: array
          items: { $ref: '#/components/schemas/ImportEntity' }
        - type: object
          required: [applications]
          properties:
            applications:
              type: array
              items: { $ref: '#/components/schemas/ImportEntity' }
      description: >
        NOTE(W2): the handler accepts a bare entity array (import_wizard) or a
        {"applications": [...]} envelope
        (internal/api/v2/eliteacore/handler.go:2349-2378). An envelope with no
        `applications` array is refused with 400 (:2372-2376).

    ImportError:
      type: object
      required: [index, name, msg]
      properties:
        index:
          type: integer
          description: >
            The position of the failed entity. The two routes count over
            different lists, and a client must know which one it is reading.

            The IMPORT channel indexes the single flat entity array the
            request sent — the bare array, or the `applications` array of the
            envelope (internal/api/v2/eliteacore/handler.go:2430-2450).

            The FORK channel indexes the CONCATENATION of the request's
            `applications` array and its `skills` array, in that order, which
            is the legacy numbering. An agent-attributed error therefore keeps
            the position it had, and a skill-attributed error carries
            `len(applications)` plus its position in the `skills` array
            (:3045-3048). See ForkResponse.errors.skills.
        name: { type: string }
        msg: { type: string }
      description: >
        NOTE(W2): all 35 emit sites write the three keys — 17 in the import
        (internal/api/v2/eliteacore/handler.go:2433, 2469, 2500, 2524, 2532,
        2544, 2562, 2589, 2610, 2701, 2723, 2736, 2746, 2759, 2873, 2880,
        2887) and 18 in the fork (:3051, 3063, 3090, 3099, 3115, 3130, 3149,
        3162, 3170, 3181, 3208, 3226, 3251, 3269, 3283, 3294, 3311, 3318).

    ImportedAgent:
      type: object
      required: [id, name, description, owner_id, versions, version_details]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner_id:
          type: string
          description: Target project id (quirk — not a user id).
        versions:
          type: array
          items:
            type: object
            required: [id, application_id, name, status]
            properties:
              id: { type: string }
              application_id: { type: string }
              name: { type: string }
              status: { type: string }
        version_details:
          allOf: [{ $ref: '#/components/schemas/ApplicationVersionDetail' }]
          nullable: true
          description: >
            Key ALWAYS present in the marshaled map — null only when every
            version insert failed (versionDetails stays nil,
            handler.go:2555).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2663-2670 —
        version_details unconditionally present (hence required+nullable).

    ImportedToolkit:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2757.

    ImportedSkill:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: The id of the skill row the import or the fork wrote.
        name:
          type: string
          description: >
            The name of the skill. The import carries the entry's own `name`,
            which is never empty because an entry with no name is refused
            (internal/api/v2/eliteacore/handler.go:2487-2489). The fork
            carries the same name, and falls back to "skills entry <n>" when
            the entry has none (:3058-3060).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2483-2489 (import) and
        :3073-3079 (fork). Two keys only — the skill import returns no
        version list.

    ImportWizardResponse:
      type: object
      required: [result, errors]
      properties:
        result:
          type: object
          required: [agents, toolkits, skills]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ImportedAgent' }
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportedToolkit' }
            skills:
              type: array
              items: { $ref: '#/components/schemas/ImportedSkill' }
              description: >
                One entry for each entity with entity "skills" that the import
                wrote (internal/api/v2/eliteacore/handler.go:2483-2489).
        errors:
          type: object
          required: [agents, toolkits, skills]
          properties:
            agents:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
            toolkits:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
            skills:
              type: array
              items: { $ref: '#/components/schemas/ImportError' }
              description: >
                Two faults report here, and both carry an index into the flat
                entity array the request sent. A skill entity the import could
                not write carries the index of that entity
                (internal/api/v2/eliteacore/handler.go:2466-2503). A `skills`
                reference on an agent version that the import could not attach
                carries the index of the AGENT, because that is the entity the
                user selected (:2886-2891, with the message text from
                import_skills.go:397-461).
      description: >
        NOTE(W2): internal/api/v2/eliteacore/handler.go:2907-2910 (the
        writeJSON of the {result, errors} envelope) and :2380-2385 (the
        empty-input fast path). BOTH answers build the same three channels on
        BOTH envelopes, through one helper
        (internal/api/v2/eliteacore/export_import.go:711-723), so no answer of
        this route can leave a channel out. The fast path used to carry the
        `agents` key alone. Status is 201 when all entities imported, 207 on
        partial failure, 400 when all failed (handler.go:2895-2905).

    Permission:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
      description: >
