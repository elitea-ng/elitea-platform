        in: path
        required: true
        schema: { type: integer }

    get:
      operationId: listProjects
      summary: List projects accessible to the caller
      description: |
        NOTE(W2): PLAIN ARRAY of ProjectWithGroups. The route is
        internal/api/v2/projects/handler.go:157 (GetCurrentProjectList), which
        calls getCurrentProjects at :161. The Project struct is at :134-143.
        assembleProjects at :227-252 collapses the joined rows into one item
        per project.

        The handler reads `check_public_role` as presence only. Any value, also
        `false`, sets the flag true. The flag reaches the query, which then
        hides the public project from a caller who is not an admin of it.
      tags: [applications]
      parameters:
        - name: check_public_role
          in: query
          schema: { type: boolean }
          description: >
            Presence-only flag. The handler ignores the value, so
            `check_public_role=false` also switches the check on.
      responses:
        '200':
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectWithGroups'
        '401': { $ref: '#/components/responses/401' }

  /projects/groups/prompt_lib:
    get:
      operationId: listGroups
      summary: List all prompt-lib groups
      description: |
        NOTE(W2): {items, total} envelope (NOT a bare array),
        internal/api/v2/projects/handler.go:109-130.
      tags: [applications]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsListResponse'
        '401': { $ref: '#/components/responses/401' }

  /projects/group/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    post:
      operationId: addProjectGroup
      summary: Create a group if needed and attach it to a project
      description: |
        Creates the `centry.project_group` row when the name is new and attaches
        it to the project, in one transaction — so a rejected create cannot
        leave a group row behind with nothing attached to it. An existing name
        is REUSED rather than duplicated: the column is unique, and two projects
        in the same group is the point.

        `no_group` is rejected: it is the sentinel the listing uses for a
        project with no group at all.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupCreate'
      responses:
        '201':
          description: The project, with its groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithGroups'
        '400':
          description: Unvalidatable body, reserved name, or unknown project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  /projects/group/prompt_lib/{project_id}/{group_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: group_id
        in: path
        required: true
        schema: { type: integer }

    delete:
      operationId: removeProjectGroup
      summary: Detach a group from a project
      description: |
        Removes the ASSOCIATION. The group row survives — it may be attached to
        other projects, and it belongs to the deployment rather than to the
        project detaching from it.

        A group that is not attached to this project is a 404. The reference
        answers 204, having swallowed the error its list removal raises, so
        "detached" and "nothing happened" were indistinguishable.
      tags: [applications]
      responses:
        '204':
          description: Detached.
        '400':
          description: Unknown project or unknown group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: The group is not attached to this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /projects/groups/prompt_lib/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    put:
      operationId: putProjectGroups
      summary: Replace a project's group membership
      description: |
        REPLACES the project's groups with the named ones, creating any that do
        not exist yet; a group left out of the list is detached. An empty list
        detaches everything and deletes no group rows. Both statements run in
        one transaction, so an interrupted save cannot leave the project with no
        groups at all.

        Until issue 255 this handler decoded the body and echoed it back as the
        200 response without touching a table, so every group edit reported
        success and changed nothing.
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupsUpdate'
      responses:
        '200':
          description: The project, with its groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectWithGroups'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '500': { $ref: '#/components/responses/500' }

  # ---------------------------------------------------------------------------
  # PROJECT QUOTA & STATISTICS (issue #246)
  #
  # legacy/plugins/projects/api/v2/{quota,statistics}.py. Neither carries a
  # `{mode}` segment — both are plain flask_restful Resources with
  # `url_params = ['<int:project_id>']`.
  # ---------------------------------------------------------------------------
  /projects/quota/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectQuota
      summary: A project's resource quota, or one quota check
      description: |
        Without `quota`, answers the project's whole quota row. With it, answers
        the bare JSON boolean "is this project still under that ceiling?".

        `-1` is the quota tables' unlimited sentinel.

        The `quota` form also ROLLS THE WINDOW OVER when it is due: after 30
        days it advances `last_update_time` by one window and zeroes the
        per-window counters. That is a write on a read, and it is the reference's
        behaviour — it is the only thing that ever resets those counters, so
        without it a project that hit its ceiling would be denied forever.
      tags: [applications]
      parameters:
        - name: quota
          in: query
          required: false
          schema: { type: string, enum: [dast_scans, sast_scans] }
          description: |
            Check one ceiling instead of returning the row. Only metrics that
            exist in BOTH the quota table and the counter table are checkable;
            the reference raises KeyError on anything else.
      responses:
        '200':
          description: The quota row, or the bare boolean result of one check
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProjectQuota'
                  - type: boolean
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such project, or the project has no quota row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

    put:
      operationId: setProjectQuota
      summary: Update a project's VCU or storage limits
      description: |
        `usage_type` selects which triple of columns the body writes; the other
        triple is untouched. An omitted field CLEARS its column rather than
        leaving it alone, matching the reference's `update_*_limits` — the form
        always sends all three, and treating omission as "leave alone" would
        make a limit impossible to clear.

        The reference answers 500 for a missing `usage_type` (it calls `.lower()`
        on None) and a bodiless 200 for an unknown one; both are 400 here.
      tags: [applications]
      parameters:
        - name: usage_type
          in: query
          required: true
          schema: { type: string, enum: [vcu, storage] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectQuotaUpdate'
      responses:
        '200':
          description: The quota row after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectQuota'
        '400':
          description: Missing or unknown usage_type, or an unvalidatable body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: The project has no quota row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

  /projects/statistics/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'

    get:
      operationId: getProjectStatistics
      summary: A project's usage counters against its quota
      description: |
        One `{current, quota}` pair per metric.

        `quota` is NULL where the quota table has no column for that metric.
        The reference indexes the quota row with every counter's name and raises
        KeyError on the first one that is missing, so this endpoint cannot run
        there at all; reporting null is the deliberate replacement.

        `tasks_count` is NOT reported. The reference resolves it through a
        `tasks_count` RPC that no plugin registers, and nothing in this platform
        counts tasks.

        `storage_space` is measured live from the artifact store, in BYTES on
        both sides. The reference reported megabytes on the current side and
        paired them with a gigabyte quota column that does not exist.
      tags: [applications]
      responses:
        '200':
          description: Counters and their ceilings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatistics'
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: No such project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/500' }

