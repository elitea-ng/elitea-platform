{{define "base"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:{{.Colors.Ground}};color:{{.Colors.Ink}};font-family:{{.FontFamily}};">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{.Colors.Ground}};">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:{{.Colors.Surface}};border-radius:{{.Radius}}px;border:1px solid {{.Colors.Rule}};">
            <tr>
              <td style="padding:28px 32px 8px;text-align:left;">
                {{if .LogoURL}}<img src="{{.LogoURL}}" alt="{{.ProductName}}" height="40" style="display:block;height:40px;max-width:220px;border:0;">{{else}}<p style="margin:0;font-size:18px;font-weight:700;color:{{.Colors.Ink}};">{{.ProductName}}</p>{{end}}
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px;font-size:16px;line-height:1.5;">
                {{template "content" .}}
              </td>
            </tr>
            {{if .ActionURL}}
            <tr>
              <td style="padding:0 32px 28px;">
                <a href="{{.ActionURL}}" style="display:inline-block;padding:12px 20px;border-radius:{{.Radius}}px;background:{{.Colors.Brand}};color:{{.Colors.OnBrand}};font-weight:600;text-decoration:none;">{{.ActionLabel}}</a>
              </td>
            </tr>
            {{end}}
            <tr>
              <td style="padding:16px 32px 24px;border-top:1px solid {{.Colors.Rule}};font-size:12px;line-height:1.5;color:{{.Colors.Muted}};">
                {{.ProductName}}{{if .SupportEmail}} · Need help? <a href="mailto:{{.SupportEmail}}" style="color:{{.Colors.Brand}};">{{.SupportEmail}}</a>{{end}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>{{end}}
