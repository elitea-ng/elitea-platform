<!doctype html>
<html lang="en">
  <head>
    {{template "head" .}}
    <title>{{.Brand.ProductName}} login</title>
  </head>
  <body class="auth-login-page" data-auth-form="form">
    {{template "backdrop"}}
    <div class="auth-shell">
      {{template "brand" .Brand}}
      <main class="card card-signin" aria-labelledby="sign-in-title">
        <div class="form-signin">
          <h1 id="sign-in-title">Sign in</h1>
          <p class="lede">Continue to {{.Brand.ProductName}}</p>
          <form class="password-form" action="/auth/form/authorize" method="post">
            <div class="field">
              <label class="field-label" for="login">Login</label>
              <input class="form-control" type="text" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="field">
              <label class="field-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <input type="hidden" name="target" value="{{.Target}}">
            <button class="sign-in-button" type="submit">Sign in</button>
            {{if .Error}}<p class="login-error" role="alert">{{template "error-icon"}}<span>Invalid login or password</span></p>{{end}}
          </form>
        </div>
      </main>
    </div>
    {{template "theme-toggle"}}
  </body>
</html>
