[package]
name = "elitea-vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "The platform's vector facade: the only Qdrant client, with project scope injection (ADR-0031)."

[dependencies]
# Atomic swap of the reloaded certificates.
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
# Process tracing and OTLP span export, shared with the engines.
elitea-engine-sidecar = { path = "../../libs/rust/engine-sidecar" }
# The introspection cache: a bounded LRU with single-flight misses.
moka = { version = "=0.12.16", default-features = false, features = ["future"] }
prost = "=0.14.4"
# The Qdrant gRPC client, matched to the server (qdrant/qdrant:v1.19.2).
# `serde` converts payload values to and from JSON; no snapshot download.
qdrant-client = { version = "=1.19.0", default-features = false, features = ["serde"] }
# The process crypto provider (ring), chosen explicitly: the OTLP exporter's
# reqwest also links aws-lc-rs, and with two providers rustls picks none.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
# The TLS acceptor of the gRPC listener (a reloading certificate resolver).
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tonic = { version = "=0.14.6", features = ["tls-ring", "tls-connect-info"] }
tonic-prost = "=0.14.6"
tracing = "=0.1.44"
uuid = { version = "=1.18.1", features = ["v5"] }
x509-parser = { version = "=0.18.1", default-features = false }

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
rcgen = "=0.14.5"
tokio = { version = "=1.53.2", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
