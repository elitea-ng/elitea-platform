[package]
name = "elitea-code-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process", "fs"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["io-util", "io-std", "macros", "process", "rt", "signal", "time"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std", "display"] }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "elitea-code-execute"
path = "src/execute.rs"

[[bin]]
name = "elitea-code-rust"
path = "src/rust_execute.rs"

[[bin]]
name = "elitea-code-rust-prepare"
path = "src/rust_prepare.rs"
