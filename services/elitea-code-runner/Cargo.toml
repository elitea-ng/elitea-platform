[package]
name = "elitea-code-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt", "time"] }

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "elitea-code-execute"
path = "src/execute.rs"

[[bin]]
name = "elitea-code-rust"
path = "src/rust_execute.rs"
