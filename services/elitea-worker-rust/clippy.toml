# Untrusted YAML must go through crate::bounded_yaml, which bounds anchor/alias expansion.
disallowed-methods = [
    { path = "serde_yaml_ng::from_str", reason = "use bounded_yaml::from_str" },
    { path = "serde_yaml_ng::from_slice", reason = "use bounded_yaml::from_str" },
    { path = "serde_yaml_ng::from_reader", reason = "use bounded_yaml::from_str" },
    { path = "serde_yaml_ng::Deserializer::from_str", reason = "use bounded_yaml::from_str" },
    { path = "serde_yaml_ng::Deserializer::from_slice", reason = "use bounded_yaml::from_str" },
    { path = "serde_yaml_ng::Deserializer::from_reader", reason = "use bounded_yaml::from_str" },
]
