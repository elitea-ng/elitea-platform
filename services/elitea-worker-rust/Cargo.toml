[package]
name = "elitea-worker-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "elitea-worker-rust"

[[bin]]
name = "elitea-sandbox-supervisor"
path = "src/sandbox_main.rs"
required-features = ["sandbox-supervisor"]

[features]
# Container access belongs to the dedicated supervisor, never the default worker.
sandbox-supervisor = ["dep:adk-sandbox", "dep:x509-parser", "dep:kube", "dep:k8s-openapi", "dep:futures-util", "dep:bollard"]
# Benchmark entry points only; never enabled in an image and never a gate.
graph-shaping-bench = []

[dependencies]
adk-anthropic = "=2.2.0"
adk-sandbox = { version = "=2.2.0", optional = true, default-features = false, features = ["workspace-docker"] }
adk-runner = { version = "=2.2.0", default-features = false, features = ["context-compaction"] }
adk-rust = { version = "=2.2.0", default-features = false, features = ["agents", "runner", "sessions", "models", "anthropic", "graph", "tools", "mcp-http"] }
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "kv", "ring", "server_2_10", "server_2_11", "server_2_12"] }
async-stream = "=0.3.6"
async-trait = "=0.1.92"
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
# The /llm caller contract shared with the engines' model client (routes,
# headers, refusal codes, the SSE splitter, chunk and tool-call readers).
# It enables no serde_json feature: the worker's own `arbitrary_precision`
# without `preserve_order` (its canonical hashes) stays what Cargo unifies.
elitea-llm-wire = { path = "../../libs/rust/llm-wire" }
# The model calls themselves: elitea.llm.v1.ModelService on elitea-main's
# platform listener, over the facade's mTLS channel (#1359 U2).
elitea-model-rpc = { path = "../../libs/rust/model-rpc" }
# The artifact store (Office host, artifact index source) and the internal
# MCP tool categories: elitea.runtime.v1 services on the same listener and
# channel (#1359 U5).
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc" }
# The pure agent runtime shared with the desktop host (ADR-0029). Its own
# serde_json uses default features; its digests are order-explicit
# (`canonical`), so neither this crate's `arbitrary_precision` nor a
# `preserve_order` from elsewhere changes them.
# `toolkit-sql`: the worker serves the `sql` toolkit family (sqlx postgres +
# mysql), which the desktop host never links.
elitea-agent-runtime = { path = "../../libs/rust/agent-runtime", features = ["toolkit-sql", "toolkit-office", "toolkit-data-analysis"] }
# ADR-0032: the Office families run in this process; the worker also reads
# `elitea_office_core::health()` and drains and exits when a library call will
# not give its thread back (production.rs, `office_core_stuck`).
elitea-office-core = { path = "../../libs/rust/office-core" }
# ADR-0030 I1: the index.ingest.v1 handler. The connectors over this crate's
# reqwest 0.12 (rustls on ring), the shared extension table, extraction and
# the SDK-default chunkers, and the elitea-vector client with the SDK search
# semantics. vector-index is taken WITHOUT `sdk-key-order`: that feature is
# serde_json `preserve_order`, which this crate's canonical digests forbid
# (see elitea-agent-runtime above).
#
# doc-extract is taken WITHOUT `documents` (xberg: PDF, Office, e-mail). Its
# `xberg-native-pdf` 1.3.6 requires `smallvec ^1.16`, while `kube-client`
# 4.2.0 (the `sandbox-supervisor` feature) pins `serde-saphyr ^0.0.29`, which
# caps smallvec `< 1.16`; one lock file cannot hold both and no kube release
# lifts the cap yet. Those formats are read by services/elitea-doc-extractor,
# a separate process with its own lock, which an index run reaches over a
# Unix socket (`extractor_socket` in the runtime document,
# src/transport/extractor_client.rs); without one such a document is
# reported skipped `unsupported_type`. Text, markdown, HTML, JSON and code
# are extracted and chunked here.
elitea-connectors = { path = "../../libs/rust/connectors", default-features = false, features = ["providers", "content-source", "reqwest-012"] }
elitea-content-source = { path = "../../libs/rust/content-source" }
# ADR-0030 I4 part B: fit a large picture under the gateway's inline image
# budget (decode, downscale, re-encode) and rasterise BMP. Only the formats
# the vision step reads; pure Rust, no system library, no default features
# (no rayon, no avif/exr/tiff codecs).
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
elitea-doc-chunk = { path = "../../libs/rust/doc-chunk" }
elitea-doc-extract = { path = "../../libs/rust/doc-extract", features = ["html"] }
elitea-vector-index = { path = "../../libs/rust/vector-index" }
# ADR-0034: the cloud executor's bundle codec. Without `rest`: the worker
# reaches the store over its gRPC runtime plane, never the desktop routes.
elitea-workspace-store = { path = "../../libs/rust/workspace-store" }
# The turn's commit is written as loose objects into the quarantine the
# store crate verified the segment into (src/workspace_run/gix_codec.rs).
gix-hash = { version = "=0.28.1", features = ["sha1"] }
gix-object = { version = "=0.66.1", features = ["sha1"] }
gix-odb = { version = "=0.87.0", features = ["sha1"] }
# The segment is verified from a file on disk: the pack is indexed from a
# buffered stream (never one 200 MB buffer), and the turn's segment is written
# to a file object by object (src/workspace_run/gix_codec.rs). Same versions
# and features as the store crate's, already in the lock.
gix-pack = { version = "=0.77.0", default-features = false, features = ["streaming-input", "sha1"] }
gix-features = { version = "=0.50.0", default-features = false, features = ["progress"] }
flate2 = "=1.1.10"
# The end-of-turn scan for harvested env values in files (already locked).
memchr = "=2.8.3"
# ADR-0034 workspace runs on Docker (src/sandbox/workspace_run_docker.rs);
# the version adk-sandbox already locks.
bollard = { version = "=0.18.1", optional = true }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["io"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
hmac = "=0.13.0"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
kube = { version = "=4.2.0", optional = true, default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "=0.28.0", optional = true, features = ["v1_32"] }
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "fuel", "serde"] }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
percent-encoding = "=2.3.2"
prost = "=0.14.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["http2", "json", "multipart", "rustls-tls-native-roots", "stream"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
ring = "=0.17.14"
rmcp = { version = "=3.5.0", default-features = false, features = ["auth"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
serde_yaml_ng = "=0.10.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "chrono", "bigdecimal", "json", "uuid"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.6", features = ["tls-ring"] }
tonic-prost = "=0.14.6"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "smallvec", "std", "tracing-log"] }
# Already locked through adk-runner, which names root invocations `inv-<uuid v4>`; nested
# agent children use the same scheme so an invocation id never repeats across processes.
uuid = { version = "=1.24.0", default-features = false, features = ["v4"] }
x509-parser = { version = "=0.18.1", optional = true, default-features = false }
zeroize = "=1.9.0"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[[bench]]
name = "graph_shaping"
harness = false
required-features = ["graph-shaping-bench"]

[dev-dependencies]
elitea-agent-runtime = { path = "../../libs/rust/agent-runtime", features = ["test-support", "toolkit-sql", "toolkit-office", "toolkit-data-analysis"] }
# The in-process fake of elitea-vector the index handler's tests run against.
elitea-vector-index = { path = "../../libs/rust/vector-index", features = ["test-server"] }
http-body = "=1.1.0"
# The model facade tests serve an HTTP-shaped fake as a real ModelService
# over a loopback gRPC channel (#1359 U2).
axum = { version = "=0.8.9", default-features = false, features = ["http2", "tokio"] }
elitea-model-rpc = { path = "../../libs/rust/model-rpc", features = ["testing"] }
# The fake artifact store and internal tool service (#1359 U5).
elitea-platform-rpc = { path = "../../libs/rust/platform-rpc", features = ["testing"] }
# A throwaway runtime CA and workload certificates for the content-listener
# and sandbox code-owner TLS tests (#1359 U4).
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
# Keep optimized frame names and source lines for operator diagnostics.
# Line tables omit local-variable debug data.
debug = "line-tables-only"
strip = "none"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false

# Pinned ADK 2.2.0 history-retention and sandbox extensions, shared with
# every consumer of elitea-agent-runtime (ADR-0029 decision 2): the libs/rust
# workspace applies the same patches. See ../../libs/rust/vendor/README.md.
[patch.crates-io]
adk-agent = { path = "../../libs/rust/vendor/adk-agent" }
adk-runner = { path = "../../libs/rust/vendor/adk-runner" }
adk-sandbox = { path = "../../libs/rust/vendor/adk-sandbox" }
# The zavora-slide fixes of ADR-0032 (vendor/README.md), as in the libs/rust workspace.
zavora-slide = { path = "../../libs/rust/vendor/zavora-slide" }
zavora-slide-render = { path = "../../libs/rust/vendor/zavora-slide-render" }
zavora-slide-pdf = { path = "../../libs/rust/vendor/zavora-slide-pdf" }
