[package]
name = "elitea-worker-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
adk-anthropic = "=2.2.0"
adk-runner = { version = "=2.2.0", default-features = false, features = ["context-compaction"] }
adk-rust = { version = "=2.2.0", default-features = false, features = ["agents", "runner", "sessions", "models", "anthropic", "graph", "tools", "mcp-http"] }
async-stream = "=0.3.6"
async-trait = "=0.1.92"
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
hmac = "=0.12.1"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "http2", "native-tokio", "ring"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
md-5 = "=0.10.6"
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "fuel", "serde"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
percent-encoding = "=2.3.2"
prost = "=0.14.4"
redis = { version = "=1.6.0", default-features = false, features = ["streams", "tokio-comp"] }
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["http2", "json", "multipart", "rustls-tls-native-roots", "stream"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
ring = "=0.17.14"
rmcp = { version = "=3.1.2", default-features = false, features = ["auth"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "=0.8.4"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
serde_yaml_ng = "=0.10.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "chrono", "bigdecimal", "json", "uuid"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-stream = "=0.1.19"
tonic = { version = "=0.14.6", features = ["tls-ring"] }
tonic-prost = "=0.14.6"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "smallvec", "std", "tracing-log"] }
zeroize = "=1.9.0"

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-prost-build = "=0.14.6"

[dev-dependencies]
http-body = "=1.1.0"
tokio = { version = "=1.53.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
