[dependencies.adk-core]
version = "2.2.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.bollard]
version = "0.18"
optional = true

[dependencies.futures]
version = "0.3"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.tar]
version = "0.4"
optional = true

[dependencies.tempfile]
version = "3.10"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1.40"
features = [
    "process",
    "time",
    "io-util",
    "fs",
    "rt",
]
default-features = false

[dependencies.tracing]
version = "0.1"

[dependencies.uuid]
version = "1.23"
features = [
    "v4",
    "serde",
]
optional = true

[dependencies.wasmtime]
version = "46"
optional = true

[dependencies.wasmtime-wasi]
version = "46"
optional = true

[dev-dependencies.proptest]
version = "1.4"

[dev-dependencies.tokio]
version = "1.40"
features = [
    "rt",
    "macros",
    "test-util",
]
default-features = false

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(windows)".dependencies.find-msvc-tools]
version = "0.1.9"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Foundation",
]
optional = true
