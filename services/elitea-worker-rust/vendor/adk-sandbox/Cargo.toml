[[test]]
name = "policy_serialization_property_tests"
path = "tests/policy_serialization_property_tests.rs"

[[test]]
name = "process_enforcement_tests"
path = "tests/process_enforcement_tests.rs"

[[test]]
name = "process_integration"
path = "tests/process_integration.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[[test]]
