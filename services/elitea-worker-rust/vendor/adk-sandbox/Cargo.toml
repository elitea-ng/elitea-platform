[package]
edition = "2024"
rust-version = "1.95"
name = "adk-sandbox"
version = "2.2.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Isolated code execution runtime for ADK agents"
homepage = "https://www.zavora.ai"
documentation = "https://docs.rs/adk-sandbox"
readme = "README.md"
keywords = [
    "adk",
    "sandbox",
    "code-execution",
    "wasm",
    "isolation",
]
categories = [
    "development-tools",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"

[features]
default = ["process"]
process = []
sandbox-linux = []
sandbox-macos = []
sandbox-native = [
    "sandbox-macos",
    "sandbox-linux",
    "sandbox-windows",
]
sandbox-windows = ["dep:windows-sys"]
wasm = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
]
workspace = [
    "dep:tar",
    "dep:uuid",
]
workspace-docker = [
    "workspace",
    "dep:bollard",
    "dep:futures",
]

[lib]
name = "adk_sandbox"
path = "src/lib.rs"

[[test]]
