[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "elitea-worker-python"
version = "0.1.0"
description = "Standalone language-neutral ELITEA runtime reference worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Raised from >=48.0.1 for CVE-2026-69247 (fixed in 50.0.0) and
  # CVE-2026-69249 (fixed in 49.0.0). The lock records the exact wheel digest
  # for each architecture, so the floor and the lock move together (#554).
  "cryptography>=50.0.1,<51",
  "elitea-sdk==0.9.8",
  "elitea-runtime-proto==0.1.0",
  "grpcio>=1.76,<2",
  "h2>=4.2,<5",
  "httpx>=0.27,<1",
  # Imported by the worker's callback boundary and by the SDK configuration
  # registry's lightweight tools package initializer. Keep these aligned with
  # the pinned SDK runtime extra without installing the full indexing stack in
  # the configuration-validation worker image.
  #
  # Raised from 1.2.7 for CVE-2026-34070 (fixed in 1.2.22) and CVE-2026-44843
  # (fixed in 1.3.3). 1.3.3 is also the floor langchain-classic 1.0.7 states,
  # so one version answers both (#554).
  "langchain-core==1.3.3",
  # langsmith 0.12.0 moved its HTTP stack from httpx to httpx2/httpcore2, which
  # requires h11>=0.16 — and httpx<1 above resolves httpcore 1.0.7, which
  # requires h11<0.15. The two cannot coexist, so every image build failed with
  # ResolutionImpossible the moment 0.12.0 was published.
  #
  # langsmith is TRANSITIVE (langchain-core requires langsmith>=0.3.45,<1.0.0),
  # so nothing here named it and nothing here bounded it. This is the same
  # class the mcp pin below was written for, and the same remedy: state the
  # boundary explicitly so a clean build cannot silently cross it.
  #
  # MEASURED, not guessed: 0.11.2 requires httpx<1,>=0.23.0 and 0.12.0 requires
  # httpx2<3,>=2 (PyPI metadata). Lift this when the SDK's own stack moves to
  # httpx2 — not before, or the conflict simply returns.
  "langsmith>=0.3.45,<0.12",
  "langgraph==1.0.7",
  "protobuf>=5.29,<7",
  "pydantic>=2.10,<3",
  "redis>=6.2,<8.2",
]

[project.optional-dependencies]
agent-current = [
  # Current SDK/LangGraph durable checkpoint implementation. Keep this exact
  # until the asynchronous SDK phase replaces the synchronous agent adapter.
  # Flat-scope delegated toolkit authorization currently imports the SDK MCP
  # bridge directly from the worker runtime. Keep this aligned with the SDK's
  # admitted range until the worker owns the orchestration logic itself.
  "langchain-mcp-adapters>=0.1.14,<0.2.0",
  # MCP 2.x moved its HTTP stack to httpx2/httpcore2 and requires h11>=0.16,
  # which conflicts with the current SDK's admitted httpcore==1.0.7/h11<0.15.
  # Pin the current deployed baseline explicitly so clean image builds cannot
  # silently cross that incompatible major-version boundary.
  #
  # Raised from 1.27.1 for CVE-2026-52869 and CVE-2026-52870 (fixed in 1.27.2)
  # and CVE-2026-59950 (fixed in 1.28.1). MEASURED: 1.28.1 still declares
  # httpx<1.0.0 and starlette>=0.27 on Python 3.12, so it stays inside the SDK
  # boundary above (#554).
  "mcp==1.28.1",
  # Raised from 2.0.21 with langgraph-checkpoint below: CVE-2025-64439 is fixed
  # in langgraph-checkpoint 3.0.0, and 2.0.21 states langgraph-checkpoint<3.0.0.
  # The two versions must move together. langgraph 1.0.7 admits
  # langgraph-checkpoint>=2.1.0,<5.0.0, so it does not need to move.
  "langgraph-checkpoint-postgres==3.0.0",
  # The four third-party API clients elitea_sdk.tools imports for the
  # google_places, rally, service_now and slack toolkit types. The admitted
  # SDK 0.9.8 pins these exact versions in its own `tools` extra
  # (elitea_sdk/pyproject.toml); pin the same versions here rather than
  # re-deriving a compatible range, since the SDK's toolkit code is written
  # against them. Their absence from this image is #869: the four types are
  # registered in the toolkit catalogue and materialize on the Rust worker,
  # but elitea_sdk.tools.FAILED_IMPORTS records all four here because none of
  # these four packages were part of the measured extras set (#811).
  "googlemaps==4.10.0",
  "pyral==1.6.0",
  "pysnc==1.1.10",
  "slack_sdk==3.35.0",
]
indexing-current = [
  # Exact current-baseline indexing closure. This intentionally replaces
  # elitea-sdk[all]: provider, browser, cloud, analytics and developer stacks
  # that the standalone index worker cannot reach are not installed.
  "anthropic==0.76.0",
  "aiofiles==25.1.0",
  "atlassian-python-api==4.0.7",
  # msrest imports azure.core exceptions at runtime for all four ADO indexing
  # families, so this cannot be removed from the admitted image.
  "azure-core==1.38.0",
  "azure-devops==7.1.0b4",
  "backoff==2.2.1",
  "beautifulsoup4==4.12.2",
  "cairocffi==1.7.1",
  "charset-normalizer==3.3.2",
  "click==8.3.1",
  "docx2txt==0.8",
  "emoji==2.15.0",
  "FigmaPy==2018.1.0",
  "filetype==1.2.0",
  "gensim==4.3.3",
  "html5lib==1.1",
  "isodate==0.7.2",
  "joblib==1.5.3",
  "langchain==1.2.6",
  "langchain-anthropic==1.3.1",
  # Raised from 1.0.1 for CVE-2026-45134. 1.0.7 states langchain-core>=1.3.3
  # and langchain-text-splitters>=1.1.2, which is why those two move with it.
  "langchain-classic==1.0.7",
  "langchain-community==0.4.1",
  "langchain-openai==1.1.7",
  "langchain-postgres==0.0.16",
  "langchain-text-splitters==1.1.2",
  # Raised from 2.1.2 for CVE-2025-64439. It carries
  # langgraph-checkpoint-postgres to 3.0.0; see the note in agent-current.
  "langgraph-checkpoint==3.0.0",
  "langgraph-prebuilt==1.0.7",
  "langdetect==1.0.9",
  # Raised from 5.2.2 for CVE-2026-41066.
  "lxml==6.1.0",
  "mammoth==1.9.0",
  "markdownify==1.1.0",
  "msrest==0.7.1",
  "numpy==1.26.4",
  "oauthlib==3.3.1",
  "openpyxl==3.1.5",
  # Raised from 3.10.0 for CVE-2026-79675, CVE-2026-71513, CVE-2026-72818 and
  # CVE-2026-78680. CVE-2026-81726 has no fixed version and stays.
  "nltk==3.10.3",
  "nest-asyncio==1.6.0",
  "pandas==2.2.3",
  "pdf2image==1.16.3",
  "pgvector==0.2.5",
  # PINNED BY THE SDK, NOT BY THIS FILE. elitea-sdk 0.9.8 declares
  # `pillow~=11.1.0`, so 11.1.0 is the only version this image can install.
  # It carries 13 HIGH findings whose fixes start at pillow 12.1.1. They are
  # the largest part of what keeps elitea-worker-python in
  # .github/image-scan-exempt.txt, and they end with an elitea-sdk release,
  # not with a change here (#554).
  "pillow==11.1.0",
  "psutil==7.1.3",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pytesseract==0.3.13",
  "pymupdf==1.24.9",
  # Raised from 4.3.1 for CVE-2026-59935 and CVE-2026-59936.
  "pypdf==6.14.2",
  "pypdfium2==5.8.0",
  "PyGithub==2.3.0",
  "python-iso639==2026.7.23",
  "python-magic==0.4.27",
  "python-oxmsg==0.0.2",
  "python-gitlab==4.5.0",
  "python-graphql-client==0.4.3",
  "python-docx==1.1.2",
  "python-pptx==1.0.2",
  "qtest-swagger-client==0.0.3",
  "rapidfuzz==3.14.5",
  "reportlab==4.2.5",
  "requests==2.34.0",
  # toolkit.available_tools.v1 is advertised by this image and the current
  # OpenAPI toolkit imports this exact SDK tools-extra dependency.
  "requests_openapi==1.0.5",
  "requests-oauthlib==2.0.0",
  "rlpycairo==0.3.0",
  "scipy==1.13.1",
  "scikit-learn==1.7.0",
  # The SDK still imports distutils through setuptools. 83.0.0 removes the
  # vulnerable vendored jaraco.context and carries wheel 0.46.3.
  "setuptools==83.0.0",
  "six==1.17.0",
  "svglib==1.5.1",
  "testrail-api==1.13.4",
  "threadpoolctl==3.6.0",
  "tree-sitter==0.20.2",
  "tree-sitter-languages==1.10.2",
  "typing-extensions==4.15.0",
  # QTest and other document families share the SDK Markdown parser. Keep the
  # parser and its client on the current Pylon-compatible pair and verify the
  # actual parser path before the worker opens its command stream.
  # Raised from 0.16.23 for CVE-2025-64712. CVE-2026-71428 needs 0.24.0, which
  # states beautifulsoup4>=4.14.3, psutil>=7.2.2 and charset-normalizer>=3.4.4.
  # Those three are shared by every current indexing family, so that step waits
  # for a parity run (#554).
  "unstructured==0.18.18",
  "unstructured-client==0.39.1",
  "xlrd==1.2.0",
]
test = [
  "pytest>=8.3,<10",
]

[project.scripts]
elitea-worker = "elitea_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elitea_worker"]

[tool.hatch.build.targets.wheel.force-include]
"elitea-sdk.lock.json" = "elitea_worker/elitea-sdk.lock.json"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
