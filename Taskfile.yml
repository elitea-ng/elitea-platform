version: "3"

vars:
  SERVICE: services/elitea-main
  PY_SERVICE: services/pylon-indexer
  WORKER_SERVICE: services/elitea-worker-python
  CENTRY_DIR: '{{.CENTRY_DIR | default "../centry"}}'

tasks:
  # ── Go ────────────────────────────────────────────────────────────────────────
  build:
    desc: Build elitea-main and replatform support binaries
    dir: "{{.SERVICE}}"
    cmds:
      - go build -o bin/elitea-main ./cmd/elitea-main
      - go build -o bin/elitea-migrate ./cmd/elitea-migrate
      - go build -o bin/cutover-ctl ./cmd/cutover-ctl
      - go build -o bin/elitea-auth-validate ./cmd/elitea-auth-validate
      - go build -o bin/index-v2-preflight ./cmd/index-v2-preflight
      # The runtime material installer (issue #404). It ships in the same image
      # and runs as the init container of the elitea-main pod.
      - go build -o bin/elitea-runtime-material ./cmd/elitea-runtime-material
      # The authentication material installer (issue #444). Same image, same
      # mechanism, and a second init container of the same pod.
      - go build -o bin/elitea-auth-material ./cmd/elitea-auth-material

  test:
    desc: Run all Go tests across the workspace
    cmds:
      # The loop that used to live here took the exit status of its LAST
      # iteration, so a failed module followed by a passed module read as a
      # pass (#409). The script runs every module, records every status, names
      # every failure, and exits non-zero if any module failed.
      - bash scripts/go/workspace-run.sh test

  coverage:
    desc: Run Go tests with a coverage profile per module (generated code excluded)
    cmds:
      # Same module aggregation as `test`, plus the profile CI produces. The
      # strip step drops generated files (oapi-codegen, sqlc) from the profile
      # — they are compiled and instrumented like any package, and counting
      # ~3.4k blocks nobody tests makes the number a function of the last
      # regeneration rather than of the tests. The script reads the `go test`
      # status BEFORE the strip step, so the strip step can no longer overwrite
      # a test failure (#409).
      - bash scripts/go/workspace-run.sh coverage

  lint:
    desc: Run golangci-lint across the workspace
    cmds:
      # This task used to run in `{{.SERVICE}}` only, so it linted one module of
      # nine and `task all` then reported "all checks" (#427). Same aggregation
      # as `test` and `vet`: every module runs, every failed module is named,
      # and the modules this command does NOT cover are named as well.
      - bash scripts/go/workspace-run.sh lint

  vet:
    desc: Run go vet across the workspace
    cmds:
      # Same aggregation as `test`: the old inline loop reported the status of
      # its last module only (#409).
      - bash scripts/go/workspace-run.sh vet

  run:
    desc: Run elitea-main locally
    dir: "{{.SERVICE}}"
    cmds:
      - go run ./cmd/elitea-main

  sqlc:
    desc: Regenerate sqlc query bindings
    dir: "{{.SERVICE}}"
    cmds:
      - sqlc generate

  proto:
    desc: Lint and generate protobuf stubs (Go + Python)
    cmds:
      - buf lint libs/proto
      - scripts/contract/generate_proto.sh

  contract:check:
    desc: Validate checked-in runtime-v1 bindings and byte vectors
    cmds:
      - buf format --diff --exit-code libs/proto
      - buf lint libs/proto
      - buf build libs/proto
      - python3 scripts/contract/generate_configuration_validation_fixtures.py --check
      - python3 scripts/contract/check_configuration_validation_contract.py

  worker:test:
    desc: Run the standalone Python worker test suite
    cmds:
      - python -m pytest "{{.WORKER_SERVICE}}/tests"

  worker:conformance:
    desc: Execute the standalone worker against runtime-v1 byte vectors
    cmds:
      - ELITEA_CONFORMANCE_ROOT="{{.ROOT_DIR}}/testdata/proto/runtime/v1" elitea-worker conformance --suite runtime-v1

  openapi:
    desc: Generate OpenAPI server interface for elitea-main
    dir: "{{.SERVICE}}"
    cmds:
      - mkdir -p internal/api/generated
      - oapi-codegen --config api/openapi/oapi-codegen.yaml api/openapi/v2.yaml

  generate:
    desc: Run all code generation (sqlc + proto + openapi)
    cmds:
      - task: sqlc
      - task: proto
      - task: openapi

  # ── UI ────────────────────────────────────────────────────────────────────────
  ui:build:
    desc: Build EliteaUI SPA
    cmds:
      - cd apps/elitea-ui && npm ci && npm run build

  ui:lint:
    desc: Lint EliteaUI
    cmds:
      - cd apps/elitea-ui && npm run lint

  # ── Pylon Indexer ─────────────────────────────────────────────────────────────
  pylon:validate:
    desc: Validate pylon-indexer YAML configs
    dir: "{{.PY_SERVICE}}"
    cmds:
      - python -c "import yaml, pathlib; [yaml.safe_load(f.read_text()) for f in pathlib.Path('.').rglob('*.yml')]"

  # ── Local Environment ─────────────────────────────────────────────────────────
  up:
    desc: Start full local environment (postgres, redis, all services)
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml up --build

  up:detach:
    desc: Start local environment in background
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml up --build -d

  up:full:
    desc: Start with model cache pre-download (requires S3 access)
    cmds:
      - git submodule update --init --recursive
      - podman compose -f deploy/docker-compose.yml --profile full up --build

  down:
    desc: Stop local environment
    cmds:
      - podman compose -f deploy/docker-compose.yml down

  down:clean:
    desc: Stop local environment and remove volumes
    cmds:
      - podman compose -f deploy/docker-compose.yml down -v

  logs:
    desc: Tail logs from all services
    cmds:
      - podman compose -f deploy/docker-compose.yml logs -f --tail=50

  standalone:up:
    desc: Bring up the standalone full stack (Go + Bifrost gateway, no pylon) — see README's "Standalone full stack"
    cmds:
      - deploy/scripts/standalone-stack.sh certs
      - deploy/scripts/standalone-stack.sh up

  standalone:down:
    desc: Tear down the standalone full stack
    cmds:
      - deploy/scripts/standalone-stack.sh down

  hybrid:config:
    desc: Validate the mixed Centry and selected Go-slice deployment
    # deploy:check-edge runs first, and `hybrid:up` depends on this task. The
    # PoV launcher deploy/centry-hybrid/compose.sh already calls the same gate
    # (#368). The foundation stack had no such call, and that is the stack
    # #378 broke: it mounted a whole directory and loaded routers whose
    # forward-auth endpoint it never registers. `docker compose config`
    # accepts that model, because the defect is in the edge YAML.
    deps: ["deploy:check-edge"]
    cmds:
      - >-
        ELITEA_PLATFORM_DIR="{{.ROOT_DIR}}"
        docker compose
        --project-directory "{{.CENTRY_DIR}}"
        --env-file "{{.CENTRY_DIR}}/envs/default.env"
        --env-file "{{.CENTRY_DIR}}/envs/override.env"
        -f "{{.CENTRY_DIR}}/docker-compose.yml"
        -f "{{.ROOT_DIR}}/deploy/centry-hybrid/docker-compose.yml"
        config --quiet

  hybrid:up:
    desc: Start Centry with the selected Go slices behind the hybrid gateway
    deps: ["hybrid:config"]
    cmds:
      - >-
        ELITEA_PLATFORM_DIR="{{.ROOT_DIR}}"
        docker compose
        --project-directory "{{.CENTRY_DIR}}"
        --env-file "{{.CENTRY_DIR}}/envs/default.env"
        --env-file "{{.CENTRY_DIR}}/envs/override.env"
        -f "{{.CENTRY_DIR}}/docker-compose.yml"
        -f "{{.ROOT_DIR}}/deploy/centry-hybrid/docker-compose.yml"
        up -d --build

  hybrid:pov:prepare:
    desc: Provision ignored local Auth/runtime material for the full mixed PoV
    cmds:
      - deploy/centry-hybrid/compose.sh prepare "{{.CENTRY_DIR}}"

  hybrid:pov:config:
    desc: Validate the full Auth, Configurations, LiteLLM and indexing PoV model
    cmds:
      - deploy/centry-hybrid/compose.sh config "{{.CENTRY_DIR}}"

  hybrid:pov:up:
    desc: Build and start the reproducible full mixed PoV
    cmds:
      - deploy/centry-hybrid/compose.sh up "{{.CENTRY_DIR}}"

  hybrid:pov:ps:
    desc: Show status for the full mixed PoV
    cmds:
      - deploy/centry-hybrid/compose.sh ps "{{.CENTRY_DIR}}"

  hybrid:pov:preflight:
    desc: Re-run the observational index-v1 drain gate
    cmds:
      - deploy/centry-hybrid/compose.sh preflight "{{.CENTRY_DIR}}"

  hybrid:pov:logs:
    desc: Follow the full mixed PoV logs
    cmds:
      - deploy/centry-hybrid/compose.sh logs "{{.CENTRY_DIR}}"

  # ── Container Images ──────────────────────────────────────────────────────────
  images:
    desc: Build all container images
    cmds:
      - task: images:go
      - task: images:scheduler
      - task: images:gateway
      - task: images:ui
      - task: images:web
      - task: images:pylon
      # images:worker is deliberately absent: it is the one target that compiles
      # a Python dependency closure from source, so folding it into `task
      # images` would turn a minutes-long build into a tens-of-minutes one.

  images:go:
    desc: Build Go service image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-main:dev -f services/elitea-main/Containerfile .

  images:scheduler:
    desc: Build elitea-scheduler image
    cmds:
      # Repo root, not services/elitea-scheduler: the Containerfile COPYs
      # libs/go/observability (issue #250's local replace target) from there.
      - podman build -t ghcr.io/eliteaai/elitea-scheduler:dev -f services/elitea-scheduler/Containerfile .

  images:gateway:
    desc: Build elitea-llm-gateway image
    cmds:
      # Repo root, not services/elitea-llm-gateway: the Containerfile COPYs
      # libs/go/egresslib, the module's local `replace` target.
      - podman build -t ghcr.io/eliteaai/elitea-llm-gateway:dev -f services/elitea-llm-gateway/Containerfile .

  images:ui:
    desc: Build UI image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-ui:dev -f deploy/docker/Containerfile.elitea-ui .

  images:web:
    desc: Build elitea-web image
    cmds:
      - podman build -t ghcr.io/eliteaai/elitea-web:dev -f apps/elitea-web/Containerfile .

  images:pylon:
    desc: Build pylon-indexer image
    cmds:
      - podman build -t ghcr.io/eliteaai/pylon-indexer:dev -f services/pylon-indexer/Containerfile services/pylon-indexer

  images:worker:
    desc: Build elitea-worker-python image
    cmds:
      # Repo root, not the service directory: the Containerfile COPYs
      # libs/proto and testdata/proto/runtime/v1. Expect this to be the slowest
      # image here by some margin — it compiles a Python dependency closure and
      # clones the SDK at a digest-verified revision.
      - podman build -t ghcr.io/eliteaai/elitea-worker-python:dev -f services/elitea-worker-python/Containerfile .

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:check-edge:
    desc: Check the middleware, the service and the forward-auth target of every Traefik router
    cmds:
      # -count=1 is required. The gate reads YAML from deploy/, which is
      # outside the module, so the Go test cache does not notice an edit to
      # those files and can serve a stale pass.
      - cd services/elitea-main && go test -count=1 ./tests/deployedge/...

  # ── Helm ──────────────────────────────────────────────────────────────────────
  helm:lint:
    desc: Lint all Helm charts
    cmds:
      # Same defect as the Go loops above (#409). A bare loop reports the
      # status of its LAST chart, so a broken early chart read as a pass. A
      # glob that matches nothing is also a failure here, not an empty loop
      # that passes.
      - |
        failed=""
        found=0
        for chart in deploy/helm/*/Chart.yaml; do
          [ -f "$chart" ] || continue
          found=$((found + 1))
          dir="$(dirname "$chart")"
          if ! helm lint "$dir"; then
            failed="$failed $dir"
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "helm:lint: no chart matched deploy/helm/*/Chart.yaml" >&2
          exit 1
        fi
        if [ -n "$failed" ]; then
          echo "helm:lint: these charts failed:$failed" >&2
          exit 1
        fi
        echo "helm:lint: $found chart(s) passed"
      - task: helm:capabilities
      - task: helm:llmpath
      - task: helm:bf02b

  helm:capabilities:
    desc: Check that the elitea-main chart renders the capability flags the composition root reads
    cmds:
      # `helm lint` proves the chart is well formed. It does not read the
      # rendered environment, so it stayed green for as long as the chart set
      # no capability flag at all and a Kubernetes install ran with the runtime
      # plane dark (#382). This gate asserts the RENDERED YAML instead, and it
      # reads the required runtime names out of the Go source, so a new one
      # fails here until the chart renders it.
      - bash deploy/helm/tests/render-capabilities.sh

  helm:llmpath:
    desc: Check that the charts do not ship the LLM path off, and that the gateway guards refuse
    cmds:
      # #473 wrote this script for issues #463, #467, #458 and #464, and no job
      # ran it. It asserts both directions: the charts render the LLM path ON,
      # and the gateway chart REFUSES an empty guard variable. Without this
      # step, a deleted guard leaves every other Helm gate green (#497).
      # Needs yq on PATH.
      - bash deploy/helm/tests/render-llm-path.sh

  helm:bf02b:
    desc: Check the NATS profiles, the KV/stream bootstrap, the gateway Service and the ArgoCD sync-wave order
    cmds:
      # It was `deploy/test_bf0_2b.sh`, and no workflow, task or script called
      # it (#485). Two defects came out on the first run: the gateway chart has
      # refused an empty guard since #467/#473 and the script rendered it with
      # no values, and the ArgoCD assertion read a path that moved in #265.
      # Needs helm, python3 and PyYAML.
      - bash deploy/helm/tests/render-bf0-2b.sh

  migrations:check:
    desc: Check that each added migration number is above the highest on the base branch
    summary: |
      Reads the base branch as origin holds it NOW, not the branch under test.
      Give the base branch name, for example:

        task migrations:check -- main

      Two authors can each read the branch head, each find a number free, and
      still collide when both merge (#520). This finds the collision early. It
      does not renumber: the rename at merge time stays with the merge queue,
      because only the queue knows the order in which pull requests land.
    cmds:
      - bash scripts/database/check-migration-version.sh {{.CLI_ARGS}}

  # ── All ───────────────────────────────────────────────────────────────────────
  all:
    desc: Run all checks (Go + UI + Pylon + Helm)
    cmds:
      - task: vet
      - task: lint
      - task: test
      - task: pylon:validate
      - task: helm:lint
