[project]
name = "elitea-deepwiki-conformance"
version = "0.1.0"
description = "Golden fixtures for the DeepWiki provider-service port (ADR-0022 phase P0)"
requires-python = ">=3.11"

# Intentionally empty: replaying the committed fixtures needs nothing but the
# standard library, so CI can run the fixture tests without installing anything.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
