# DRAFT fixture: load_mysql, the MySQL branch of gold_build (ACCEPTANCE-ETL.md §2.3).
# Task: gold_build.load_request (JSON text). Answer (JSON text): {dialect, run_id, fact_rows, sum_qty, net_amount_usd}.
# load_postgres.yaml is the same flow in PostgreSQL syntax; keep the two in step. MySQL 8.4 with TLS required
# (require_secure_transport) and the Worker verifying the server identity (VerifyIdentity).
#
# Loop: read up to 3 silver files per visit (read_multiple_files stops at 200,000 characters in total; a silver file
# is < 64 KiB characters), stage them in one write transaction keyed by (run_id, batch_no, order_seq), until done.
# A repeated visit after a crash re-stages the same keys: a no-op ON DUPLICATE KEY UPDATE plus the effect marker make it a
# no-op (never INSERT IGNORE: it turns data errors into warnings) (T-5E §3.3: marker present -> committed, never re-run).
# Schema: ../warehouse/mysql/init/020_schema.sql.
state:
  input: {type: str}
  messages: {type: list}
  run_id: {type: str}
  request: {type: dict}
  customers_path: {type: str}
  customers_text: {type: str}
  customers_json: {type: str}
  current_group: {type: list}
  group_files: {type: dict}
  group_index: {type: int}
  done: {type: bool}
  stage_rows: {type: str}
  stage_batches: {type: str}
  stage_receipt: {type: dict}
  merge_receipt: {type: dict}
  gold_receipt: {type: dict}
  fact_totals: {type: dict}
entry_point: parse_request
nodes:
  - id: parse_request
    type: code
    language: python
    code:
      type: fixed
      value: |
        import json
        request = json.loads(elitea_state['input'])
        {'request': request, 'run_id': request['run_id'], 'group_index': 0, 'done': False,
         'current_group': request['silver_files'][:3],
         'customers_path': f"/{request['bucket']}/{request['customers']}"}
    input: [input]
    output: [request, run_id, group_index, done, current_group, customers_path]
    transition: read_customers

  - id: read_customers
    type: toolkit
    toolkit_name: ETL artifacts
    tool: read_file
    input_mapping:
      filepath: {type: variable, value: customers_path}
    input: [customers_path]
    output: [customers_text]
    transition: prep_customers

  - id: prep_customers
    type: code
    language: python
    code:
      type: fixed
      value: |
        import csv, io, json
        rows = list(csv.reader(io.StringIO(elitea_state['customers_text'])))
        if rows[0] != ['customer_id', 'name', 'country', 'segment', 'created_at']:
            raise ValueError('etl.customers_header: unexpected customers.csv header')
        json.dumps(rows[1:], separators=(',', ':'))
    input: [customers_text]
    output: [customers_json]
    transition: read_group

  # TODO(2.4): pin the read_multiple_files answer shape (a map of path to content) against the live toolkit.
  - id: read_group
    type: toolkit
    toolkit_name: ETL artifacts
    tool: read_multiple_files
    input_mapping:
      file_paths: {type: variable, value: current_group}
    input: [current_group]
    output: [group_files]
    transition: to_rows

  # Silver CSV -> stage rows (JSON arrays, compact: a Code result is <= 256 KiB); global duplicates dropped.
  - id: to_rows
    type: code
    language: python
    code:
      type: fixed
      value: |
        import csv, io, json, re
        request = elitea_state['request']
        drops = {(d['batch_no'], d['order_seq']) for d in request['drops']}
        rows, batches = [], []
        for path, text in sorted(elitea_state['group_files'].items()):
            batch_no = int(re.search(r'batch-(\d{4})\.csv$', path).group(1))
            reader = csv.reader(io.StringIO(text))
            next(reader)
            count = 0
            for f in reader:
                if (batch_no, int(f[1])) in drops:
                    continue
                rows.append([batch_no] + f[:10] + [f[10] or None] + f[11:])
                count += 1
            batches.append([batch_no, count])
        files = request['silver_files']
        index = elitea_state['group_index'] + 1
        {'stage_rows': json.dumps(rows, separators=(',', ':')), 'stage_batches': json.dumps(batches),
         'group_index': index, 'current_group': files[index * 3:index * 3 + 3], 'done': index * 3 >= len(files)}
    input: [request, group_files, group_index]
    output: [stage_rows, stage_batches, group_index, current_group, done]
    transition: stage

  # TODO(1.12): DB node admitted (5e-3); write mode, rule warehouse_mysql.load; confirm the json parameter cap.
  - id: stage
    type: db
    operation: warehouse_mysql.load
    mode: write
    statements:
      - sql: >-
          INSERT INTO staging_orders (run_id, batch_no, order_id, order_seq, customer_id, country, currency,
          amount, discount_pct, net_amount_usd, ordered_at, order_month, ship_date, channel, sku, qty)
          SELECT ?, j.batch_no, j.order_id, j.order_seq, j.customer_id, j.country, j.currency, j.amount,
          j.discount_pct, j.net_amount_usd, STR_TO_DATE(j.ordered_at, '%Y-%m-%dT%H:%i:%sZ'), j.order_month,
          j.ship_date, j.channel, j.sku, j.qty
          FROM JSON_TABLE(?, '$[*]' COLUMNS (batch_no INT PATH '$[0]', order_id VARCHAR(16) PATH '$[1]',
          order_seq INT PATH '$[2]', customer_id VARCHAR(16) PATH '$[3]', country CHAR(2) PATH '$[4]',
          currency CHAR(3) PATH '$[5]', amount DECIMAL(14,2) PATH '$[6]', discount_pct DECIMAL(5,1) PATH '$[7]',
          net_amount_usd DECIMAL(14,2) PATH '$[8]', ordered_at VARCHAR(20) PATH '$[9]',
          order_month CHAR(7) PATH '$[10]', ship_date DATE PATH '$[11]', channel VARCHAR(16) PATH '$[12]',
          sku VARCHAR(32) PATH '$[13]', qty INT PATH '$[14]')) AS j
          ON DUPLICATE KEY UPDATE run_id = staging_orders.run_id
        params:
          - {from: run_id, type: text}
          - {from: stage_rows, type: json}
      - sql: >-
          INSERT INTO staging_batches (run_id, batch_no, `rows`)
          SELECT ?, b.batch_no, b.n FROM JSON_TABLE(?, '$[*]' COLUMNS (batch_no INT PATH '$[0]', n INT PATH '$[1]')) AS b
          ON DUPLICATE KEY UPDATE run_id = staging_batches.run_id
        params:
          - {from: run_id, type: text}
          - {from: stage_batches, type: json}
    result: {mode: affected_counts}
    input: [run_id, stage_rows, stage_batches]
    output: [stage_receipt]
    transition: more_groups

  - id: more_groups
    type: router
    condition: "{% if done %}merge_fact{% else %}read_group{% endif %}"
    routes: [read_group, merge_fact]
    default_output: merge_fact
    input: [done]

  # One transaction: dim_customer SCD1 upsert, staging -> fact_orders upsert, run marker. Commit.
  # TODO(1.12): as stage.
  - id: merge_fact
    type: db
    operation: warehouse_mysql.load
    mode: write
    statements:
      - sql: >-
          INSERT INTO dim_customer (customer_id, name, country, segment, created_at, updated_run_id)
          SELECT * FROM (SELECT c.customer_id, c.name, c.country, c.segment, c.created_at, ? AS updated_run_id
          FROM JSON_TABLE(?, '$[*]' COLUMNS (customer_id VARCHAR(16) PATH '$[0]', name VARCHAR(64) PATH '$[1]',
          country CHAR(2) PATH '$[2]', segment VARCHAR(16) PATH '$[3]', created_at DATE PATH '$[4]')) AS c) AS src
          ON DUPLICATE KEY UPDATE name = src.name, country = src.country, segment = src.segment,
          created_at = src.created_at, updated_run_id = src.updated_run_id
        params:
          - {from: run_id, type: text}
          - {from: customers_json, type: json}
      - sql: >-
          INSERT INTO fact_orders (run_id, order_id, order_seq, customer_id, country, currency, amount, discount_pct,
          net_amount_usd, ordered_at, order_month, ship_date, channel, sku, qty)
          SELECT run_id, order_id, order_seq, customer_id, country, currency, amount, discount_pct, net_amount_usd,
          ordered_at, order_month, ship_date, channel, sku, qty FROM staging_orders AS s WHERE s.run_id = ?
          ON DUPLICATE KEY UPDATE order_seq = s.order_seq, customer_id = s.customer_id, country = s.country,
          currency = s.currency, amount = s.amount, discount_pct = s.discount_pct,
          net_amount_usd = s.net_amount_usd, ordered_at = s.ordered_at, order_month = s.order_month,
          ship_date = s.ship_date, channel = s.channel, sku = s.sku, qty = s.qty
        params:
          - {from: run_id, type: text}
      - sql: >-
          INSERT INTO etl_runs (run_id, status) VALUES (?, 'merged') ON DUPLICATE KEY UPDATE status = 'merged'
        params:
          - {from: run_id, type: text}
    result: {mode: affected_counts}
    input: [customers_json, run_id]
    output: [merge_receipt]
    transition: gold_aggregates

  # Gold tables rebuilt for this run inside one transaction.
  # TODO(1.12): as stage.
  - id: gold_aggregates
    type: db
    operation: warehouse_mysql.load
    mode: write
    statements:
      - sql: "DELETE FROM gold_sales_daily WHERE run_id = ?"
        params: [{from: run_id, type: text}]
      - sql: >-
          INSERT INTO gold_sales_daily (run_id, order_date, orders, qty, net_amount_usd)
          SELECT ?, DATE(ordered_at), COUNT(*), SUM(qty), SUM(net_amount_usd)
          FROM fact_orders WHERE run_id = ? GROUP BY DATE(ordered_at)
        params: [{from: run_id, type: text}, {from: run_id, type: text}]
      - sql: "DELETE FROM gold_sales_by_country WHERE run_id = ?"
        params: [{from: run_id, type: text}]
      - sql: >-
          INSERT INTO gold_sales_by_country (run_id, country, orders, qty, net_amount_usd)
          SELECT ?, country, COUNT(*), SUM(qty), SUM(net_amount_usd) FROM fact_orders WHERE run_id = ?
          GROUP BY country
        params: [{from: run_id, type: text}, {from: run_id, type: text}]
      - sql: "DELETE FROM gold_sales_by_channel WHERE run_id = ?"
        params: [{from: run_id, type: text}]
      - sql: >-
          INSERT INTO gold_sales_by_channel (run_id, channel, orders, qty, net_amount_usd)
          SELECT ?, channel, COUNT(*), SUM(qty), SUM(net_amount_usd) FROM fact_orders WHERE run_id = ?
          GROUP BY channel
        params: [{from: run_id, type: text}, {from: run_id, type: text}]
    result: {mode: affected_counts}
    input: [run_id]
    output: [gold_receipt]
    transition: read_totals

  # TODO(1.12): read mode, rule warehouse_mysql.read.
  - id: read_totals
    type: db
    operation: warehouse_mysql.read
    mode: read
    statements:
      - sql: >-
          SELECT COUNT(*) AS fact_rows, SUM(qty) AS sum_qty, CAST(SUM(net_amount_usd) AS CHAR) AS net_amount_usd
          FROM fact_orders WHERE run_id = ?
        params: [{from: run_id, type: text}]
    result: {mode: first_row}
    input: [run_id]
    output: [fact_totals]
    transition: emit

  - id: emit
    type: code
    language: python
    code:
      type: fixed
      value: |
        import json
        json.dumps(dict(elitea_state['fact_totals'], dialect='mysql', run_id=elitea_state['run_id']),
                   sort_keys=True)
    input: [fact_totals, run_id]
    output: [messages]
    transition: END
