# Source-level dependency scanning.
#
# WHAT THIS CLOSES. Before this file, a dependency vulnerability was caught in
# exactly one place: trivy in ci-image-scan.yml (now nightly-image-scan.yml,
# against the published `latest`), which runs against a BUILT
# IMAGE. That means nothing was scanned until it was packaged, nothing that is
# not packaged was scanned at all (every library module, the tools, the test
# harnesses), and the report arrived with no route to a fix — trivy names a
# package, not the manifest that pins it.
#
# CodeQL does not fill that gap. It runs as GitHub's default setup, which is
# why there is no CodeQL config file here, and it analyses THIS repository's
# source. A vulnerable version of a third-party crate or module is not a
# finding it can make.
#
# HOW THE ECOSYSTEMS ARE SPLIT. ONE ENTRY PER ECOSYSTEM, listing every
# manifest directory under `directories`, and EVERY entry that opens pull
# requests joins the one multi-ecosystem group `nightly` with `patterns: ["*"]`.
# That makes dependabot keep ONE pull request open for the whole
# repository — actions, Go, Cargo, pip and npm together — so CI runs once on
# the combined change instead of once per ecosystem against the free plan's
# 20-job cap. (Before: one grouped PR per ecosystem, five a week; before that,
# an entry per directory and 20.) The directories are listed rather than
# globbed so that a new module is a deliberate addition here, and
# scripts/ci/check-dependabot-coverage.sh refuses a manifest this file does
# not name.
#
# THE COST OF ONE PULL REQUEST: one red bump holds every other one. Fix it on
# the branch — adopt the bump (a major's code changes belong there too) or, if
# it truly cannot land yet, pin it back with a reason and an `ignore` entry
# below — never by merging the PR red.
#
# SECURITY UPDATES ARE OFF, AND THAT IS A REPOSITORY SETTING, NOT THIS FILE.
# GitHub opens a security-update PR per alert per directory, outside every
# group and on no schedule: on 2026-10-28 one zip/rustls/seroval/node-forge
# advisory burst opened six of them at once next to the grouped PR, each with
# its full CI matrix. So "Dependabot security updates" is disabled
# (Settings → Code security, or `gh api -X DELETE
# repos/elitea-ng/elitea-platform/automated-security-fixes`); Dependabot ALERTS
# stay on. A patched version reaches main through the nightly group, which
# bumps to latest, majors included, unless the package is under `ignore`
# below. Do not turn the setting back on to "get the fix faster": it brings
# back one PR per advisory per directory.
#
# MAJORS ARE IN, ON PURPOSE (owner, 2026-10-28). The group takes ALL update
# levels — major, minor, patch, and the breaking 0.x minors — and nothing is
# held back for being a major: the PR is reviewed and the code adopted on its
# branch before merge, so a pin that only says "this major needs work" just
# hides the work. What `ignore` still holds is narrower: a release known to be
# BROKEN (a regression upstream, measured, with the lift condition stated) and
# a package an ADR says moves only by hand. Do not add a major-only ignore to
# make the PR green; do the migration on the branch.
#
# SCHEDULE. The group's: nightly at 03:00 Europe/Warsaw, outside working
# hours and outside the 20-job concurrency window a daytime push competes for.
# With `open-pull-requests-limit: 1` a night with new releases refreshes the
# one open PR rather than opening a second. An entry inside the group carries
# no schedule of its own (the group's wins).
#
# WHAT DEPENDABOT CANNOT DO HERE, stated so the next reader does not assume
# coverage that is absent:
#
#   - go.work.sum. The workspace members share one checksum file that no
#     single-module bump updates. A Go bump can therefore turn ci-go.yml red
#     with a checksum mismatch, and the fix is `go work sync` on the branch.
#     This is a known cost of the workspace layout, not a reason to skip the
#     scanning.
#   - The Debian base layers. Those are the majority of every image-scan
#     finding, and they move with the Containerfile's FROM line.
#   - The Rust toolchain, deliberately. There is no `docker` and no
#     `rust-toolchain` entry, so neither the `rust:<version>-trixie@sha256:`
#     images nor the rust-toolchain.toml files are ever bumped one at a time.
#     They are ONE value (scripts/ci/check-rust-toolchain.sh holds all nine
#     toolchain files, every Rust image stage and its digest, and every
#     crate's rust-version together), so a bump is a single reviewed change
#     that follows that script's "HOW TO RAISE THE VERSION". Adding either
#     ecosystem here would open per-file PRs the gate must refuse.
version: 2

multi-ecosystem-groups:
  nightly:
    schedule:
      interval: daily
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 1

updates:
  # Bumps `uses:` refs only. The Helm a step installs is azure/setup-helm's
  # `version:` input, which this never reads: scripts/ci/check-helm-version.mjs
  # holds those pins together, and dependency-scanning.yml fails daily when a
  # newer Helm 4 or Helm 3 is out.
  - package-ecosystem: github-actions
    # `/` covers .github/workflows only; each composite action under
    # .github/actions/ is its own directory to dependabot (they held
    # actions/cache@v4 and bake-action@v6 on Node 20 long after the workflows
    # had moved on). Listed, not globbed, like every other entry; the coverage
    # gate counts an action.yml as a manifest.
    directories:
      - /
      - /.github/actions/build-stack-images
      - /.github/actions/build-stack-images/cap-saved-mounts
      - /.github/actions/ci-scripts-deps
      - /.github/actions/go-cache
      - /.github/actions/main-write-cache
      - /.github/actions/npm-cache
      - /.github/actions/pull-stack-images
      - /.github/actions/stack-images
    multi-ecosystem-group: nightly
    patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /services/elitea-llm-gateway
      - /services/elitea-main
      - /services/elitea-scheduler
      - /services/elitea-subapp-host
      - /services/elitea-egress-proxy
      - /libs/go/authlib
      - /libs/go/egresslib
      - /libs/go/eventslib
      - /libs/go/natsconn
      - /libs/go/observability
      - /libs/go/routines
      - /libs/go/rpclib
      - /libs/proto/gen/go
      - /conformance/nativeclient
      - /conformance/governed
      - /deploy/governed-mocks
    multi-ecosystem-group: nightly
    patterns: ["*"]

  # CARGO IS THREE ENTRIES, NOT ONE, and all three stay in the `nightly` group,
  # so it is still one pull request. Each entry is one Dependabot job, and a
  # job is cancelled at ~55 minutes: the single ten-directory entry ran 43-46
  # min when it finished and was cancelled mid-resolution on 2026-10-23,
  # 10-24 and three times on 10-28 (once majors were unlocked), and a
  # cancelled ecosystem means the multi-ecosystem PR is never opened. The
  # split balances lockfile size (~1.6-1.8k packages per entry). A new crate
  # directory goes into the lightest entry, never a fourth unrelated list.
  - package-ecosystem: cargo
    directories:
      - /libs/rust
      - /services/elitea-worker-rust
      - /services/elitea-code-runner
      - /services/elitea-code-runner/adapters/rust
    multi-ecosystem-group: nightly
    patterns: ["*"]
    ignore:
      # libs/rust/office-core pins zavora-slide, zavora-docx and zavora-xlsx
      # exactly, and its sub-crates move only with them (ADR-0032 decision 5):
      # a bump is a reviewed PR that reruns the hostile corpus, never a scanner
      # PR. tests/isolation.rs asserts the locked version of every zavora-*.
      # Repeated in all three cargo entries: every workspace that path-depends
      # on libs/rust carries zavora-* in its own lock.
      - dependency-name: "zavora-*"

  - package-ecosystem: cargo
    directories:
      - /services/elitea-inventory-engine
      - /services/elitea-deepwiki-engine
      - /services/elitea-doc-extractor
    multi-ecosystem-group: nightly
    patterns: ["*"]
    ignore:
      # libs/rust/office-core pins zavora-slide, zavora-docx and zavora-xlsx
      # exactly, and its sub-crates move only with them (ADR-0032 decision 5):
      # a bump is a reviewed PR that reruns the hostile corpus, never a scanner
      # PR. tests/isolation.rs asserts the locked version of every zavora-*.
      # Repeated in all three cargo entries: every workspace that path-depends
      # on libs/rust carries zavora-* in its own lock.
      - dependency-name: "zavora-*"

  - package-ecosystem: cargo
    directories:
      - /apps/elitea-desktop/src-tauri
      # The desktop's document extractor: xberg in a lockfile of its own.
      - /apps/elitea-desktop/doc-extract-sidecar
      - /services/elitea-vector
    multi-ecosystem-group: nightly
    patterns: ["*"]
    ignore:
      # libs/rust/office-core pins zavora-slide, zavora-docx and zavora-xlsx
      # exactly, and its sub-crates move only with them (ADR-0032 decision 5):
      # a bump is a reviewed PR that reruns the hostile corpus, never a scanner
      # PR. tests/isolation.rs asserts the locked version of every zavora-*.
      # Repeated in all three cargo entries: every workspace that path-depends
      # on libs/rust carries zavora-* in its own lock.
      - dependency-name: "zavora-*"

  - package-ecosystem: pip
    directories:
      - /libs/proto
    multi-ecosystem-group: nightly
    patterns: ["*"]

  # /scripts/ci is the CI checks' one dependency (`yaml`, exact pin), installed
  # with `npm ci --prefix scripts/ci` for the runner's node.
  - package-ecosystem: npm
    directories:
      - /apps/elitea-web
      - /apps/elitea-desktop
      - /apps/elitea-docs
      - /scripts/ci
    multi-ecosystem-group: nightly
    patterns: ["*"]
    ignore:
      # orval 8.34.0 regressed multipart `format: binary` fields: every
      # `file: zod.instanceof(File)` it used to emit became `file: zod.unknown()`.
      # Two consequences across the six upload operations (branding package
      # import, branding asset, application icon, social avatar, artifact object,
      # skill import):
      #   - `formData.append(..., body.file)` and the generated MSW mocks stop
      #     type-checking — 13 TS2769/TS2740 errors, the whole `tsc --noEmit`
      #     gate red;
      #   - the runtime zod schema stops asserting a File at all, which is the
      #     quieter half: `zod.unknown()` validates anything.
      # 8.33.0 is the last version that emits `zod.instanceof(File)`, and the
      # rest of this group is green on it. Lift when orval restores the binary
      # mapping; the generated client is regenerated with
      # `node scripts/check-generated-client.mjs --write`.
      - dependency-name: orval
        versions: [">= 8.34.0"]
      # jsdom 30.1.0 breaks 382 of the 15 242 unit tests (30.0.1 is green on the
      # same tree — measured by swapping only this package). Two signatures:
      #   - `TypeError: nodeToRestore.current.focus is not a function` — MUI's
      #     modal focus-restore path, so every Dialog/Menu-driven test dies;
      #   - `Cannot read properties of undefined (reading '_buffer')` inside
      #     FormData/Blob, which takes out every multipart upload test
      #     (application icon, skill import, attachments, branding assets).
      # Both are environment regressions, not app defects: the same sources pass
      # under 30.0.1 and in a real browser (the storybook suite, which runs in
      # chromium rather than jsdom, is green on 30.1.0).
      # Lift when jsdom restores element focus() on the restore node and the
      # FormData internals; re-run `npm run test:unit` to confirm.
      - dependency-name: jsdom
        versions: [">= 30.1.0"]
      # playwright 1.63.0 stops exposing the body of a response the PAGE has
      # consumed as a Blob. `Response.text()` returns "" where 1.62.1 returns the
      # document, so chat.sharing S4/S5 — which read the conversation_export
      # answer to prove the export is THIS conversation and not an empty file
      # that merely answered 200 — fail 3/3.
      #
      # Measured on one journeys stack built from this branch, swapping ONLY the
      # Playwright client (same app bundle, same elitea-main, same server):
      #   server, via request context : status=200 len=320 hasName=true
      #   same URL fetched in-page    : status=200 len=321
      #   observed by Playwright 1.62.1: len=321 hasName=true  → S4/S5 PASS
      #   observed by Playwright 1.63.0: len=0                 → S4/S5 FAIL
      # The export path itself is correct; only the harness's view of it changed.
      # Working around it in the spec would mean no longer reading the response,
      # which is the one assertion that makes "it exported" mean anything (the
      # spec says so in its own header), so the harness is pinned instead.
      #
      # This also keeps mcr.microsoft.com/playwright:v1.62.1-noble — the runner
      # image and the library must move together (check-playwright-image-tag).
      # Lift when Playwright restores the body, or when the spec is rewritten to
      # verify the saved download instead of the response.
      - dependency-name: "@playwright/test"
        versions: [">= 1.63.0"]
      - dependency-name: playwright
        versions: [">= 1.63.0"]
