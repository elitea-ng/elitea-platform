# Source-level dependency scanning.
#
# WHAT THIS CLOSES. Before this file, a dependency vulnerability was caught in
# exactly one place: trivy in ci-image-scan.yml, which runs against a BUILT
# IMAGE. That means nothing was scanned until it was packaged, nothing that is
# not packaged was scanned at all (every library module, the tools, the test
# harnesses), and the report arrived with no route to a fix — trivy names a
# package, not the manifest that pins it.
#
# CodeQL does not fill that gap. It runs as GitHub's default setup, which is
# why there is no CodeQL config file here, and it analyses THIS repository's
# source. A vulnerable version of a third-party crate or module is not a
# finding it can make.
#
# HOW THE ECOSYSTEMS ARE SPLIT. ONE ENTRY PER ECOSYSTEM, listing every
# manifest directory under `directories`, with ONE group over every package.
# That is what makes dependabot open ONE pull request per ecosystem per week —
# five at most — instead of one per directory: a group is scoped to its entry,
# and an entry per directory (the previous shape) meant 20 grouped pull
# requests that each fired the full CI matrix. The directories are listed
# rather than globbed so that a new module is a deliberate addition here, and
# scripts/ci/check-dependabot-coverage.sh refuses a manifest this file does
# not name.
#
# GROUPING IS DELIBERATE. Each group takes ALL update levels (major, minor,
# patch) into the same pull request. A major bump landing alongside minor and
# patch ones needs the same review either way, so splitting it out only
# doubled the PR count without buying a safer default. What the groups do NOT
# take are the packages under `ignore`, each with the reason it is pinned by
# something dependabot cannot see (a toolchain floor, a frozen runtime
# profile, a peer constraint in another manifest). The 2026-09-02 burst — ten
# grouped bumps merged with their CI cancelled, main red for an evening — is
# the measurement behind every one of those entries.
#
# NOT SCANNED: services/elitea-worker-python. Its pins are a FROZEN runtime
# capability profile (elitea-sdk.lock.json: 80 verified distributions for the
# indexing profile, 6 for the agent profile), checked at image build and at
# worker start. A bump there is incompatible by construction; the profile is
# regenerated deliberately, not by a scanner. The coverage gate carries the
# matching exemption.
#
# SCHEDULE. Every ecosystem on Saturday 03:00 Europe/Warsaw: one burst of at
# most five pull requests, outside working hours and outside the free plan's
# 20-job concurrency window that a weekday push competes for.
#
# WHAT DEPENDABOT CANNOT DO HERE, stated so the next reader does not assume
# coverage that is absent:
#
#   - go.work.sum. The workspace members share one checksum file that no
#     single-module bump updates. A Go bump can therefore turn ci-go.yml red
#     with a checksum mismatch, and the fix is `go work sync` on the branch.
#     This is a known cost of the workspace layout, not a reason to skip the
#     scanning.
#   - services/elitea-worker-python/elitea-sdk.lock.json. The SDK revision is
#     pinned there by digest, and the gateway asserts the same digest in
#     internal/sdkpin/sdk-pin.json. Dependabot does not read either file, so
#     the SDK is NOT covered by this configuration and stays a manual bump.
#   - The Debian base layers. Those are the majority of every image-scan
#     finding, and they move with the Containerfile's FROM line.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /services/elitea-llm-gateway
      - /services/elitea-main
      - /services/elitea-scheduler
      - /services/elitea-subapp-host
      - /libs/go/authlib
      - /libs/go/egresslib
      - /libs/go/eventslib
      - /libs/go/observability
      - /libs/go/rpclib
      - /gen/go
      - /libs/proto/gen/go
      - /tools/uictl
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    groups:
      go-all:
        patterns: ["*"]
    ignore:
      # bifrost core 1.8 requires Go 1.27; the gateway ships on golang:1.26-alpine
      # with GOTOOLCHAIN=local and is tested on the 1.26 series
      # (scripts/ci/check-gateway-toolchain.sh). Moving the toolchain is a
      # deliberate change of image, runner and gate, not a dependency bump (#653).
      - dependency-name: github.com/maximhq/bifrost/core
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /services/elitea-worker-rust
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    groups:
      cargo-all:
        patterns: ["*"]
    ignore:
      # sqlx 0.x minors change the query/executor associated types the SQL
      # client and the checkpointer are written against (0.9 broke both, #661).
      - dependency-name: sqlx
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The DeepWiki and Inventory packages carry byte-frozen copies of their
  # analysis engines (COPY_MANIFEST.json), each resolved against a pinned
  # closure in the `engine` extra. A bump anywhere inside that closure makes
  # the extra ResolutionImpossible and the engine image unbuildable — and no
  # CI job builds those images, so only the weekly real-engine run notices.
  # Eight such bumps (#677, #678, #679, #757–#761) did exactly that. The pins
  # move together with a re-copy of the engine, never one at a time; the SPI
  # shell's own dependencies are ranges and need no bumping. Security alerts
  # still show in the repository's Dependabot tab.
  - package-ecosystem: pip
    directories:
      - /services/elitea-deepwiki
      - /services/elitea-inventory
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: pip
    directories:
      - /libs/proto
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    groups:
      pip-all:
        patterns: ["*"]
    ignore:
      # libs/proto is installed next to the python worker, which requires
      # protobuf < 7; a major here cannot resolve with it (#667).
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /apps/elitea-web
      - /tools/parity-extract
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    groups:
      npm-all:
        patterns: ["*"]
    ignore:
      # Babel 8 plugins need @babel/core 8, and the web app is on core 7 (#682).
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
