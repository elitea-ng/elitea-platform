name: CI — DeepWiki native engine

# ADR-0026: the Rust-native DeepWiki engine behind the engine sidecar socket.
#
# One job, on purpose: the repository's Actions plan runs 20 jobs at a time,
# and every check here needs the same compiled dependency graph.
#
#   * fmt, Clippy (all + pedantic, deny), rustdoc with warnings denied;
#   * the crate's tests, which run the sidecar on a REAL Unix socket and
#     the index storage against a REAL PostgreSQL with pgvector (the
#     `postgres` service): the retrieval parity gate over the P0 fixtures,
#     the publish transaction under concurrent readers, the reconciliation
#     and the migration ledger, Phase 2's store over the build space, and
#     the native runner end to end (tests/native_generate.rs: the worker
#     child, a repository served by `git http-backend` — git is on the
#     runner — a mock gateway, this database; it needs the test-only
#     `loopback-git-http` feature, which --all-features turns on).
#     DEEPWIKI_REQUIRE_POSTGRES=1 turns their "no database → skip" into a
#     failure here;
#   * the shared engine crates in libs/rust (ADR-0027) — fmt, Clippy,
#     rustdoc and their own tests — in this job rather than one of their
#     own, because the engine compiles the same crates and a separate job
#     would spend a slot of the 20 on a duplicate dependency build;
#   * the release binary, and then the Go sub-application host's own tests
#     against it (internal/apps/deepwiki/run, native_engine_test.go): the
#     host's sidecar client, composition and upload over the Rust engine.
#     ELITEA_REQUIRE_NATIVE_ENGINE=1 turns their "no binary → skip" into a
#     failure here, so a broken path to the binary cannot pass as a run that
#     never happened. ci-go.yml builds no Rust; it declares the skip.

on:
  pull_request:
    paths:
      - "services/elitea-deepwiki-engine/**"
      - "libs/rust/**"
      # The /llm caller contract both Rust callers assert (worker, engine model client).
      - "conformance/llm-caller/**"
      # The agent runtime's SDK schema gate reads both
      # (libs/rust/agent-runtime/src/toolkits/sdk_conformance.rs).
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_rust_worker_toolkit_capability_snapshot.json"
      - "services/elitea-subapp-host/internal/engine/**"
      - "services/elitea-subapp-host/internal/apps/deepwiki/**"
      - "conformance/provider/fixtures/deepwiki/**"
      - ".github/workflows/ci-deepwiki-engine.yml"
      - "scripts/go/declared-skips.txt"
  push:
    branches:
      - main
    paths:
      - "services/elitea-deepwiki-engine/**"
      - "libs/rust/**"
      # The /llm caller contract both Rust callers assert (worker, engine model client).
      - "conformance/llm-caller/**"
      # The agent runtime's SDK schema gate reads both
      # (libs/rust/agent-runtime/src/toolkits/sdk_conformance.rs).
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_rust_worker_toolkit_capability_snapshot.json"
      - "services/elitea-subapp-host/internal/engine/**"
      - "services/elitea-subapp-host/internal/apps/deepwiki/**"
      - "conformance/provider/fixtures/deepwiki/**"
      - ".github/workflows/ci-deepwiki-engine.yml"
      - "scripts/go/declared-skips.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine — lint, test, and the Go host against the binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The index storage tests' database (ADR-0026 decision 5).
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: deepwiki
          POSTGRES_PASSWORD: deepwiki
          POSTGRES_DB: deepwiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepwiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/elitea-deepwiki-engine
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Read everywhere, write on main only: a pull request's target
      # directory duplicated per branch would crowd the 10 GB Actions cache.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            services/elitea-deepwiki-engine
            libs/rust

      - name: Shared crates — formatting, Clippy, rustdoc, tests
        working-directory: libs/rust
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo doc --locked --workspace --no-deps --all-features
          cargo test --locked --workspace --all-targets --all-features

      # The workspace run above links serde_json `preserve_order` (other
      # members enable it), which is how a desktop binary would link the
      # agent runtime. Built alone with `toolkit-sql`, the runtime has it off
      # and links sqlx, which is how the worker links it (the desktop build
      # drops `toolkit-sql`). Its digest tests pin the same values both ways
      # (ADR-0029 decision 2); the explicit feature run asserts the feature
      # really reaches serde_json, with `toolkit-sql` so the SQL family's
      # encodings are covered too.
      - name: Agent runtime — digests with and without preserve_order
        working-directory: libs/rust
        run: |
          cargo test --locked -p elitea-agent-runtime --all-targets --features toolkit-sql
          cargo test --locked -p elitea-agent-runtime --all-targets --features test-preserve-order,toolkit-sql

      # engine-core and code-parsers keep `preserve_order` and
      # `float_roundtrip` in their dev-dependencies only, so the desktop host
      # can link them (ADR-0029 decisions 2 and 7); every engine binary turns
      # both on in its own manifest. Their own tests above need both (pyjson's
      # float repr, the JS/TS/Rust parser goldens compared as text), so the
      # order-off run is their normal build: linted alone, without
      # dev-dependencies, and the resolved features checked, since a feature
      # one of them turned back on would otherwise pass unnoticed.
      - name: Engine core and code parsers — normal build without preserve_order
        working-directory: libs/rust
        run: |
          cargo clippy --locked -p elitea-engine-core -p elitea-code-parsers --lib -- -D warnings
          features=$(cargo tree --locked -p elitea-engine-core -p elitea-code-parsers \
            -e normal,features -i serde_json --prefix none)
          echo "$features"
          if ! grep -q '^serde_json feature "std"' <<<"$features"; then
            echo "cargo tree listed no serde_json features: the check below would check nothing" >&2
            exit 1
          fi
          if grep -E '^serde_json feature "(preserve_order|float_roundtrip|arbitrary_precision)"' <<<"$features"; then
            echo "a normal dependency of engine-core or code-parsers turns on a serde_json feature the desktop host must not link" >&2
            exit 1
          fi

      # elitea-inventory-core (ADR-0029 decision 7) runs its retrieval goldens
      # in both serde_json builds: in the workspace (other members turn
      # `preserve_order` on, as the Inventory engine does) every answer is the
      # Python engine's byte for byte; built alone (as the desktop links it)
      # a map's keys come out sorted, and the goldens are compared with that
      # order taken out, against a recorded list of the handlers whose text
      # depends on it (ORDER_DEPENDENT in tests/retrieval_*.rs).
      # INVENTORY_CORE_SERDE_ORDER makes each run fail in the other build
      # rather than pass checking the wrong thing.
      - name: Inventory core — retrieval goldens with and without preserve_order
        working-directory: libs/rust
        run: |
          INVENTORY_CORE_SERDE_ORDER=preserve cargo test --locked -p elitea-inventory-core -p elitea-engine-sidecar --all-targets --all-features
          INVENTORY_CORE_SERDE_ORDER=sorted cargo test --locked -p elitea-inventory-core --all-targets --all-features
          cargo clippy --locked -p elitea-inventory-core --all-targets --all-features -- -D warnings

      # The workspace Clippy run above uses --all-features, which turns on
      # `test-support`, and that switches off the crate's
      # deny(clippy::expect_used, panic, unwrap_used, ...) guard. Lint the
      # two production feature sets with the guard on: the worker's
      # (`toolkit-sql`) and the desktop host's (no features).
      - name: Agent runtime — production feature sets (panic guard on)
        working-directory: libs/rust
        run: |
          cargo clippy --locked -p elitea-agent-runtime --all-targets --features toolkit-sql -- -D warnings
          cargo clippy --locked -p elitea-agent-runtime --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Run the crate's tests
        env:
          DEEPWIKI_TEST_DSN: postgresql://deepwiki:deepwiki@127.0.0.1:5432/deepwiki
          DEEPWIKI_REQUIRE_POSTGRES: "1"
        run: cargo test --locked --all-targets --all-features

      - name: Build the release binary
        run: cargo build --locked --release

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: services/elitea-subapp-host/go.sum

      - name: Run the Go host's sidecar tests against the binary
        working-directory: services/elitea-subapp-host
        env:
          ELITEA_DEEPWIKI_NATIVE_ENGINE_BIN: ${{ github.workspace }}/services/elitea-deepwiki-engine/target/release/elitea-deepwiki-engine
          ELITEA_REQUIRE_NATIVE_ENGINE: "1"
        run: go test -race -count=1 -run 'Native' -v ./internal/apps/deepwiki/run
