name: CI — Rust lint

# Formatting and Clippy for every Rust workspace, in the FAST tier of ci.yml.
#
# They used to be steps of the 20-35 minute test jobs, so a lint error reached
# a pull request after the build had spent its runner, and the same Clippy of
# libs/rust ran again in each workflow that links it. Now one leg per Cargo
# workspace fails in minutes, and the test chains (heavy tier) start only when
# this has passed. The legs lint `--locked --all-targets -D warnings` with each
# leg's `features`: `--all-features` for every workspace but the worker, and for
# the worker the two sets its images build, one leg each (no features: the
# worker image; `sandbox-supervisor`: the supervisor image). `--all-features`
# on the worker adds its bench-only features and hid the default build's dead
# code; scripts/ci/check-worker-feature-sets.mjs refuses it. The desktop and the
# platform-specific crates keep their own Clippy (windows, macOS) in
# ci-desktop.yml, ci-desktop-control.yml and ci-browser-session.yml, and the
# shared-crate `-p` runs whose point is feature unification stay in
# ci-deepwiki-engine.yml.
on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run lints main; it writes no cache (this workflow has none).
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-rust-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (${{ matrix.name }})
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shared crates
            git-db: "true"
            dir: libs/rust
            doc: --workspace
            features: --all-features
          # The worker image: `cargo auditable build` with no feature flag.
          - name: worker
            git-db: "true"
            dir: services/elitea-worker-rust
            doc: --
            features: ""
            benches: "true"
          # The supervisor image: `--features sandbox-supervisor`.
          # Same directory as `worker`: its formatting is checked there.
          - name: worker, sandbox supervisor
            git-db: "true"
            dir: services/elitea-worker-rust
            doc: --
            features: --features sandbox-supervisor
            fmt: "false"
          - name: code runner
            dir: services/elitea-code-runner
            jobs: "1"
            features: --all-features
          - name: deepwiki engine
            git-db: "true"
            dir: services/elitea-deepwiki-engine
            doc: --
            features: --all-features
          - name: inventory engine
            git-db: "true"
            dir: services/elitea-inventory-engine
            doc: --
            features: --all-features
          - name: vector
            dir: services/elitea-vector
            doc: --
            features: --all-features
          - name: doc extractor
            dir: services/elitea-doc-extractor
            doc: --
            features: --all-features
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs || '4' }}
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and rustup (none in
      # its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          rust: "true"

      - name: Assert the pinned toolchain
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      - name: Free runner disk for the build
        # Hosted only: the pool builds on its 80 GiB work volume, and has no sudo.
        if: runner.environment == 'github-hosted'
        # The jobs this replaces freed this space before a build on top of a
        # restored target/ (ENOSPC, PR #1547). Bounded and NON-FATAL: a refused
        # rm only warns, and the build then fails honestly on ENOSPC.
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            || echo "::warning::could not remove every preinstalled toolchain; continuing"
          df -h / | tail -1

      # No target or registry cache here (scripts/ci/cache-budget.json, measured
      # 2026-11-20): a registry-only entry is 0.3-0.6 GiB of the 10 GB cap and
      # saves about the time cargo takes to fetch the crates. The legs that
      # lock code-parsers' two tree-sitter grammars (`git-db`) restore cargo's
      # git database, trimmed to the pinned commits, that ci-rust-shared.yml
      # saves (a few MB; the full clone was 4 min of every cold job). Same key
      # and literal path as its writer.
      - name: Restore cargo's git database
        if: matrix.git-db == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/git/db
          key: cargo-git-db-v1-${{ runner.os }}-${{ hashFiles('libs/rust/code-parsers/Cargo.toml') }}
          restore-keys: cargo-git-db-v1-${{ runner.os }}-

      - name: Check formatting
        if: matrix.fmt != 'false'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          # Unquoted on purpose: "" is no argument, `--features X` is two.
          # shellcheck disable=SC2086
          cargo clippy --locked --all-targets ${FEATURES} -- -D warnings

      # The worker's two benches need their bench-only features, which no
      # image builds and no other gate passes (never `--all-features`), so
      # they are linted here, bench targets only: a refactor that breaks
      # them fails CI. The features add no dependency, so this reuses the
      # leg's dependency build. check-worker-feature-sets.mjs allows a bench
      # feature only on such a `--benches` run, and never counts one as the
      # lint of an image set.
      - name: Lint the worker's benches
        if: matrix.benches
        run: cargo clippy --locked --benches --features graph-shaping-bench,node-settings-bench -- -D warnings

      # rustdoc, deny warnings: the `cargo doc` each test workflow used to run in
      # its heavy job, here beside Clippy so a broken doc link fails in minutes.
      # `doc` is the leg's extra argument (`--workspace` for libs/rust, `--` for
      # none); the code runner had no rustdoc gate and gets none.
      - name: rustdoc (deny warnings)
        if: matrix.doc
        env:
          RUSTDOCFLAGS: "-D warnings"
          DOC_ARGS: ${{ matrix.doc }}
          FEATURES: ${{ matrix.features }}
        run: |
          # Unquoted FEATURES: "" is no argument, `--features X` is two.
          # shellcheck disable=SC2086
          if [ "$DOC_ARGS" = -- ]; then
            cargo doc --locked --no-deps ${FEATURES}
          else
            cargo doc --locked --no-deps ${FEATURES} "$DOC_ARGS"
          fi

      # The workspace run above uses --all-features, which turns on
      # `test-support`, and that switches off the agent runtime's
      # deny(clippy::expect_used, panic, unwrap_used, ...) guard. Lint the two
      # production feature sets with the guard on: the worker's (exactly the
      # list services/elitea-worker-rust/Cargo.toml's [dependencies] entry
      # names: `toolkit-sql`, `toolkit-office`, `toolkit-data-analysis`,
      # `toolkit-delta-lake`) and the desktop host's (no features). The
      # `data_analysis` module compiles only under `toolkit-data-analysis`, so
      # without it here that shipped code was linted with the guard off only.
      - name: Agent runtime — production feature sets (panic guard on)
        if: matrix.dir == 'libs/rust'
        run: |
          cargo clippy --locked -p elitea-agent-runtime --all-targets --features toolkit-sql,toolkit-office,toolkit-data-analysis,toolkit-delta-lake -- -D warnings
          cargo clippy --locked -p elitea-agent-runtime --all-targets -- -D warnings
