name: No Binaries

# Repo-wide guard: fail if any tracked file is a binary blob or exceeds the size
# ceiling. A local `go build` at a module root emits a ~37MB executable that got
# swept in by `git add <dir>` (twice) before this gate existed. Unlike
# ci-gateway.yml this is NOT path-filtered — it must see the whole tree on every
# change so a binary added anywhere is caught.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
    inputs:
      go_runs:
        description: >-
          ci.yml: true when ci-go runs in the same run. Its test shards run
          `./internal/api/` (shard api-core) and `./tests/deployedge/...`
          (shard infra-suites) with -race, so this workflow does not run them again.
        type: boolean
        default: false
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "3 1 * * *"
  workflow_dispatch:

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a nightly run on main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: no-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repo-gates:
    name: Repository gates
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the working tree + HEAD to scan; no full history required.
          fetch-depth: 1
      # eng-runner: caches and TMPDIR on the work volume, and node (none in
      # its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"

      # ── No committed binaries ─────────────────────────────────────────────────
      - name: Scan for binary / oversize tracked files
        if: ${{ !cancelled() }}
        run: bash scripts/no-binaries-check.sh
      # Upgrade notes are one file per change, so open pull requests never
      # conflict over a shared list (docs/upgrading/README.md).
      - name: Upgrade notes are one file per change
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-upgrading-notes.mjs
      # What's new entries are one file per change too: what-is-new.mdx holds
      # no section, each entry is apps/elitea-docs/src/content/whats-new/*.md.
      - name: What's new entries are one file per change
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-whats-new.mjs
      # The upgrade note of ADR-0059 R1.2b lists every critical action of the
      # administration action table (its golden), generated; a registry
      # change that adds or drops one fails here until the note is
      # regenerated with --write.
      - name: The critical-actions upgrade note matches the registry
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-critical-actions-note.mjs
      # One Rust version everywhere (PR #1297): every rust-toolchain.toml, every
      # `FROM rust:` image (same digest in every stage) and every crate's
      # rust-version, held to the repository-root pin. This workflow has no
      # path filter, so the gate runs on whatever file moved. The second
      # command proves the gate red, once per assertion, on a broken copy.
      # check-rust-toolchain.mjs reads the YAML files with the `yaml` package.
      - name: Install the toolchain check's one dependency
        if: ${{ !cancelled() }}
        uses: ./.github/actions/ci-scripts-deps
      - name: One Rust toolchain across cargo, CI and images
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci/check-rust-toolchain.sh
          bash scripts/ci/check-rust-toolchain-test.sh
      # One zip everywhere (PR #1546): the zip-9 CVE pin, and the five
      # `[patch.crates-io]` entries that carry it, held across every tracked
      # Cargo.lock. dependency-scanning.yml runs the gate itself; the self-test
      # runs here, beside the toolchain one, because it needs no network and
      # this workflow has no path filter. It breaks one input per case and
      # requires the gate to name it.
      - name: The zip pin gate is proved red
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check-zip-pin-test.sh
      # One Helm in CI (v4, every azure/setup-helm step) plus the one Helm 3
      # render Argo CD needs (helm-lint.yml, id helm3). Dependabot bumps the
      # action but never its `version:` input; dependency-scanning.yml runs
      # the same check with --latest every day, so a newer Helm turns it red.
      # The test step counts its scenarios: a suite that collects nothing
      # exits 0.
      - name: One Helm version across CI, and the Helm 3 render
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/ci/check-helm-version.mjs
          # check-chart-deps.mjs is the vendored-dependency gate helm-lint.yml
          # and publish.yml run; its parser is tested here, where no Helm is.
          # check-vendor-manifest-notes.mjs is the vendored-crate manifest gate
          # of dependency-scanning.yml; its scenarios need only node.
          # browser-bakeoff-report.mjs applies the ADR-0049 admission rule
          # in browser-bakeoff.yml; its rule is tested here on every PR.
          # brand-output-scan.mjs is the sample-brand output gate of ci-web,
          # ci-mobile and ci-desktop (ADR-0052 W4); its rules are tested here.
          # check-upgrading-notes.mjs keeps upgrade notes one file per change
          # (docs/upgrading/) and docs/UPGRADING.md closed; it runs above.
          # check-whats-new.mjs does the same for the docs What's new page
          # (apps/elitea-docs/src/content/whats-new/); it runs above too.
          # brand-template tests the brand repository template (ADR-0052 W5,
          # docs/brand-template/) against this tree: its brand passes
          # brand-check, its secrets match the packaging actions.
          # check-sunset.mjs is the ADR-0059 sunset check (history-gates runs
          # it); sunset-reminder.mjs is the decision of sunset-reminder.yml.
          # check-critical-actions-note.mjs holds the R1.2b upgrade note to the
          # action table; it runs above.
          # action-archive-list.mjs is the action set eng-runner-image.yml
          # bakes into the pool image (the codeload 429 fix); its reader and
          # the runner's cache layout are tested here.
          for t in check-helm-version check-chart-deps check-vendor-manifest-notes browser-bakeoff-report check-upgrading-notes check-whats-new brand-output-scan brand-template check-sunset sunset-reminder check-critical-actions-note action-archive-list; do
            expected="$(grep -c '^test(' "scripts/ci/${t}.test.mjs")"
            status=0
            output="$(node --test --test-reporter=tap "scripts/ci/${t}.test.mjs" 2>&1)" || status=$?
            printf '%s\n' "${output}"
            ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
            if [ "${status}" -ne 0 ] || [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
              echo "::error::${t}.test.mjs holds ${expected} scenario(s); node --test passed ${ran:-none} (exit ${status})"
              exit 1
            fi
          done
      # Every tracked shell file must at least parse. That is worth little on
      # its own, and it is worth having for EVERY tracked shell file: launchers
      # used to get this check one at a time, and the set they belong to grew
      # past them.
      #
      # This step measures syntax, not behaviour. It is not a substitute for a
      # caller. The floor turns a glob that stopped matching into a red job.
      - name: Every tracked shell file parses
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          scripts_found=0
          failed=""
          for file in $(git ls-files '*.sh'); do
            scripts_found=$((scripts_found + 1))
            if ! bash -n "$file"; then
              failed="$failed $file"
            fi
          done
          if [ "$scripts_found" -lt 35 ]; then
            echo "::error::found ${scripts_found} tracked .sh file(s), expected at least 35 — the glob stopped matching, so this step checked nothing"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::these shell files do not parse:$failed"
            exit 1
          fi
          echo "shell syntax: ${scripts_found} file(s) parse"
      # Issue #534. Three guards STATED the number of assertions they make.
      # A stated number is correct when its author writes it and true only
      # when the pull request MERGES, so a merge that added an assertion, and
      # left the number alone, made the floor under-count in silence for ever.
      #
      # Each of those guards derives its floor from its own source now. This
      # step holds the property that correction depends on: add a site and the
      # floor rises, remove a site and it falls, and no guard states a literal
      # count. It finds the guards in the tree and reads each guard's OWN
      # pattern, so it cannot hold a stale list or a stale pattern.
      #
      # It needs no stack, no cluster and no network, and it takes about a
      # second. It lives here because this workflow has no path filter, and
      # the guards it reads sit in three different trees.
      - name: The derived assertion floors move with their assertions
        if: ${{ !cancelled() }}
        run: bash scripts/lib/assertion-floor-test.sh
      # This gate lives here, and not only in ci-go.yml, because ci-go.yml is
      # path-filtered and does not select deploy/gateway-api/**, the compose
      # files or the chart values. A pull request that edits only an edge file
      # would not run it there. It drives elitea-main's compose edge for real
      # and reads the Gateway API HTTPRoute and the chart strip list (#338,
      # #568, #1359).
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (read only, one writer per key)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-cache
        with:
          # Restores only: one writer per key (scripts/ci/check-cache-budget.mjs).
          save: "false"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      # -count=1 is required, not tidiness. The gate reads YAML from deploy/,
      # which is outside this module, so the Go test cache does not notice an
      # edit to those files and can serve a stale pass.
      - name: Validate the browser edges
        # Skipped when ci-go runs the same package (input go_runs): this
        # workflow has no path filter, so the gate still runs on every
        # change ci-go's filter does not select.
        if: ${{ !cancelled() && !inputs.go_runs }}
        working-directory: services/elitea-main
        run: go test -count=1 ./tests/deployedge/...
      # The permission-grant gate lives here for the same reason as the step
      # above. A route gated on a permission that no migration grants answers
      # 403 to every caller on a clean database, and every seeded database
      # hides it (#354, #359). The gate must run on a pull request that
      # touches a router file OR a migration. ci-go.yml selects
      # services/elitea-main/** and covers both today, but a path filter is a
      # second thing to keep correct, and this repository has already shipped a
      # gate that stopped running when a file moved (#157). This workflow has
      # no path filter at all, so the gate cannot be switched off by accident.
      #
      # The whole package runs, with no -run filter. `go test -run NoSuchName`
      # exits 0 and reports "no tests to run", so a renamed test would turn this
      # step into a silent no-op — the same "nothing found, therefore OK" trap.
      #
      # -count=1 removes any dependency on the Go test cache. The gate reads
      # migrations/shared and every source file under internal/, all outside this
      # package. A local check shows the cache does track those reads today and
      # does invalidate on a migration edit, so this is insurance rather than a
      # repair: the tracking is best-effort, this test opens more than a thousand
      # files, and a stale pass here hides the exact defect the gate exists for.
      # The run takes about ten seconds, so the insurance is nearly free.
      - name: Validate that every gated permission has a grant
        # Skipped when ci-go runs the same package (input go_runs): this
        # workflow has no path filter, so the gate still runs on every
        # change ci-go's filter does not select.
        if: ${{ !cancelled() && !inputs.go_runs }}
        working-directory: services/elitea-main
        run: go test -count=1 ./internal/api/

      # Issue #424. Gate scripts that validated checked-in evidence were called by
      # no workflow, Taskfile task or other script. A gate that nothing calls
      # cannot fail, and its presence in the tree reads as coverage.
      #
      # The remaining checks are the database catalog contract
      # (scripts/database/check_legacy_catalog_contract.py, over testdata/postgres)
      # and the ETL fixture isolation guard (scripts/security/, over deploy/ and
      # scripts/acceptance/etl). They live here, and not in a path-filtered
      # workflow, for the reason the header of this file gives: their subjects
      # are spread over several trees, and this repository has twice shipped a
      # gate that stopped running because a filter or a path stopped matching
      # (#157, #426). This workflow has no path filter at all.
      #
      # The scripts are a separate job, not more steps in the job above, so a
      # failing evidence check does not hide the binary scan and the reverse.
      # ── Checked-in evidence baselines ─────────────────────────────────────────
      - uses: actions/setup-python@v7
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"
      # Every check reads only the standard library and the committed JSON, so
      # there is nothing to install.
      - name: Validate the checked-in security and database evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(scripts/security/check_*.py scripts/database/check_*.py)
          # The list comes from the tree, not from a written-down set of names.
          # A renamed or deleted script therefore changes the count, and the
          # floor below turns that into a red job instead of a shorter loop
          # that still says "passed".
          if [ "${#checks[@]}" -lt 2 ]; then
            echo "::error::found ${#checks[@]} evidence check scripts, expected at least 2 — the glob stopped matching, so this job would pass without checking anything"
            exit 1
          fi
          for check in "${checks[@]}"; do
            echo "== ${check}"
            python "${check}"
          done
      - name: Install the test runner
        if: ${{ !cancelled() }}
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      # pytest exits 5 when it collects nothing, so an empty run is red rather
      # than green. The glob floor covers the narrower case where one file of
      # the set is renamed and the rest still collect. scripts/database/test_*.py
      # are deliberately not here: they test one-off migration procedures
      # pinned to the manifest through 0123 and fail on any later tree.
      - name: Run the evidence checker unit tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/security/test_*.py)
          if [ "${#tests[@]}" -lt 1 ]; then
            echo "::error::found ${#tests[@]} test files under scripts/security/, expected at least 1 — the glob stopped matching"
            exit 1
          fi
          python -m pytest -q "${tests[@]}"
      # Every image build that compiles Rust into a shared BuildKit target
      # cache must touch its sources first, or a stale binary ships under a
      # fresh tag. It reads only the committed Containerfiles.
      - name: Rust image builds compile the checked-out source
        if: ${{ !cancelled() }}
        run: python -m pytest -q scripts/contract/test_cargo_target_cache_freshness.py

      # No workflow starts on a push (owner decision, 2026-10-22): a merge to main
      # starts no pipeline. Pull requests run their gates; main runs on a schedule
      # (the nightly cache writers, publish.yml's nightly pre-release) and by
      # dispatch (a release, a dev pre-release). This job holds that rule for every
      # workflow, in each spelling `on:` takes.
      #
      # It lives here, and not in a path-filtered workflow, for the reason the
      # header of this file gives: a path filter is a second thing to keep correct,
      # and a gate about triggers must not itself depend on one.
      # The same check refuses `pull_request_target` (blocked by GitHub from
      # 2026-12-02, and never an event for the self-hosted pool).
      # ── No workflow starts on a push ──────────────────────────────────────────
      - name: No workflow names the push or pull_request_target event
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-no-push-triggers.test.mjs
          node scripts/ci/check-no-push-triggers.mjs

      # Only our own jobs reach the self-hosted pool `eng-runner`, through the
      # one routing condition, and only jobs that can run there (no container,
      # services, docker or root). docs/contributing/ci.md#runners. The hook's
      # tests run here too: it is the pool's real guard (deploy/ci-runners/).
      - name: Jobs reach eng-runner only through the routing condition
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-runner-routing.test.mjs scripts/ci/eng-runner-hook.test.mjs
          node scripts/ci/check-runner-routing.mjs

      # The worker is linted and tested with exactly the feature sets its
      # images build (none, and `sandbox-supervisor`), never `--all-features`:
      # that hid the default build's dead code (docs/contributing/ci.md, Rust).
      # The suite's count is pinned: a suite that collects nothing exits 0.
      - name: The worker is linted and tested with its images' feature sets
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' scripts/ci/check-worker-feature-sets.test.mjs)"
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/check-worker-feature-sets.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ "${status}" -ne 0 ] || [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::check-worker-feature-sets.test.mjs holds ${expected} scenario(s); node --test passed ${ran:-none} (exit ${status})"
            exit 1
          fi
          node scripts/ci/check-worker-feature-sets.mjs

      # The supervisor that runs a compose stack as processes on the pool
      # (scripts/e2e/native-stack.mjs; the native E2E legs). Its tests start
      # tiny fake services (node one-liners, sleep) on 127.0.0.1 and check the
      # start order, health waits, one-shots, a crash seen by ps, and teardown.
      # node's standard library only. The suite's count is pinned, so a test
      # that stopped being collected fails the step.
      - name: The native stack supervisor starts, waits for and stops services in order
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' scripts/e2e/native-stack.test.mjs)"
          status=0
          output="$(node --test --test-reporter=tap scripts/e2e/native-stack.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ "${status}" -ne 0 ] || [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::native-stack.test.mjs holds ${expected} scenario(s); node --test passed ${ran:-none} (exit ${status})"
            exit 1
          fi

      # docs/client-feature-parity.md is how new client work lands on web, desktop
      # and mobile together; the checker holds the table's shape (every row has a
      # status for each client in one of the three forms). Here rather than in
      # ci-web.yml: a table-only edit is a documentation change, and the web
      # pipeline it used to start is the most expensive one in the repository.
      # This workflow has no path filter, so the table is checked on every change.
      # It reads only node's standard library (the runner's node).
      # ── Client feature-parity table is well formed ────────────────────────────
      - name: Every feature has a status for web, desktop and mobile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-client-feature-parity.test.mjs
          node scripts/ci/check-client-feature-parity.mjs

      # The brand guide (brand/, published to GitHub Pages at /brand/ by
      # docs-pages.yml). Its build reads client-core's tokens.json, the logo SVGs
      # and the web app's vendored fonts, so a change to any of them can break
      # it: here, where there is no path filter, rather than behind ci-web's.
      # The build recomputes every contrast pair and fails below its minimum.
      # Node's standard library only. The test count is asserted because a
      # suite that collects nothing exits 0.
      # ── Brand guide builds, its links resolve, brand manifests pass ───────────
      - name: Build the brand guide and test it
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' brand/test/build.test.mjs)"
          status=0
          output="$(node --test --test-reporter=tap brand/test/build.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ "${status}" -ne 0 ] || [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::brand/test/build.test.mjs holds ${expected} test(s); node --test passed ${ran:-none} (exit ${status})"
            exit 1
          fi
          node brand/scripts/build.mjs --out "${RUNNER_TEMP}/brand"
      # The brand manifests (ADR-0052 decisions 2 and 11): brand/elitea and
      # brand/sample pass brand-check, and the unit tests of the schema, the
      # loader, the CLI, the sample's placeholders and brand/elitea's sync
      # with the copies the apps ship. Here, unfiltered, because the sync test
      # reads files outside brand/ (the mobile and desktop icons, the web
      # default pack). Node's standard library only. The passed count must
      # equal the tests the files declare (top-level `test(` calls plus one
      # per row of elitea-sync's COPIES table, which builds its tests in a
      # loop), because a suite that collects nothing exits 0.
      - name: Brand manifests pass brand-check and their tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/brand-check.mjs brand/elitea brand/sample
          declared="$(cat scripts/brand-check.test.mjs scripts/brand/*.test.mjs | grep -c '^test(')"
          copies="$(sed -n '/^const COPIES = {/,/^};/p' scripts/brand/elitea-sync.test.mjs | grep -c "^  '")"
          expected=$((declared + copies))
          status=0
          output="$(node --test --test-reporter=tap scripts/brand-check.test.mjs scripts/brand/*.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          failed="$(printf '%s\n' "${output}" | sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p')"
          if [ "${status}" -ne 0 ] || [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ] || [ "${failed:-1}" -ne 0 ]; then
            echo "::error::brand manifest tests: ${ran:-none} passed, ${failed:-unknown} failed (exit ${status}); the files declare ${expected}"
            exit 1
          fi

      # Issue #485. `docker/model-cache-init/test_entrypoint.sh` holds the
      # assertions on the model-cache entrypoint, and no workflow, Taskfile task or
      # script called it. The image cannot run it either, because
      # `docker/model-cache-init/.dockerignore` excludes it from the build context.
      # Running it here needs no image at all: the suite states that it runs without
      # Docker, against a temporary directory.
      #
      # It runs in this workflow because no other workflow selects
      # `docker/model-cache-init/**`, and this one has no path filter. About 15
      # seconds.
      #
      # Issue #529 adds the second half of that directory. `validate-manifest.sh`
      # had no caller either, and `manifest-schema.json` had no reader at all. The
      # validator reads the schema now, so the step below measures both files.
      # ── Model cache entrypoint suite and manifest ─────────────────────────────
      - name: Run the entrypoint assertions
        if: ${{ !cancelled() }}
        run: |
          set +e
          set -uo pipefail
          output="$(bash docker/model-cache-init/test_entrypoint.sh 2>&1)"
          status=$?
          printf '%s\n' "$output"
          line="$(printf '%s\n' "$output" | grep -E '^=== Results: [0-9]+ passed, [0-9]+ failed; [0-9]+ of [0-9]+ expected assertions reported a result ===$')"
          if [ -z "$line" ]; then
            echo "::error::the suite printed no result line, so the number of assertions it made was never reported"
            exit 1
          fi
          ran="$(printf '%s' "$line" | sed -E 's/.*; ([0-9]+) of ([0-9]+) .*/\1/')"
          expected="$(printf '%s' "$line" | sed -E 's/.*; ([0-9]+) of ([0-9]+) .*/\2/')"
          if [ "$expected" -lt 1 ]; then
            echo "::error::the suite derived ${expected} assertion site(s); a floor of zero passes every run"
            exit 1
          fi
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::${ran} of ${expected} assertions reported a result; an assertion that reports nothing is not a passed assertion"
            exit 1
          fi
          echo "model cache entrypoint: ${ran} of ${expected} assertions reported a result"
          exit "$status"
      # jq and the aws CLI are both on ubuntu-latest. A missing aws CLI turns
      # this step RED on purpose (#429): every URL in the manifest is an s3://
      # URL, and a host that cannot look at one has measured nothing about it.
      # The bucket is private, so the answer itself is a counted warning and not
      # an error, and the step does not depend on a credential.
      # The eng-runner image has no aws CLI, so the pool installs one (v1,
      # pinned, into the setup-python interpreter above; `aws s3 ls
      # --no-sign-request` is all the script asks of it).
      - name: The aws CLI (eng-runner only; ubuntu-latest ships it)
        if: ${{ !cancelled() && runner.environment != 'github-hosted' }}
        run: |
          python -m pip install --quiet --disable-pip-version-check "awscli==1.46.2"
          aws --version
      - name: Validate the model cache manifest against its schema
        if: ${{ !cancelled() }}
        run: bash docker/model-cache-init/validate-manifest.sh docker/model-cache-init/manifest.json

      # The 10 GB Actions cache. Measured 2026-10-16 it held 10.7 GB in 809
      # entries, GitHub evicted entries within minutes, and the largest writers
      # were PULL REQUESTS: setup-go caches of 0.3-1.2 GB per pull request and
      # ~2.9 GB of pull-request BuildKit blobs, every one of them evicting the
      # main-branch entry each pull request should have been reading. The rule
      # since then is "pull requests read, a run on main writes"; this job holds
      # it, for every workflow and composite action, with the negative cases in
      # scripts/ci/check-workflow-cache-writes.test.mjs.
      #
      # actionlint over EVERY workflow runs here too: no other job lints the
      # whole directory, and a cache condition that does not parse is a cache
      # condition that never gates. The binary is pinned by version and checksum.
      #
      # It lives here because this workflow has no path filter: a cache step can
      # be added to any workflow in any pull request.
      # ── Workflow caches are written from main only ────────────────────────────
      - name: The PyYAML-compatible YAML read the node checks share
        if: ${{ !cancelled() }}
        run: node --test scripts/ci/ci-compat.test.mjs
      # Read the COUNT of scenarios, not the exit status alone: a suite that
      # collects nothing exits 0 (#534).
      - name: The checker still refuses every pull-request writer it exists for
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' scripts/ci/check-workflow-cache-writes.test.mjs)"
          if [ "${expected}" -lt 30 ]; then
            echo "::error::found ${expected} scenario(s) in the suite, expected at least 30 — the pattern stopped matching, so this step checked nothing"
            exit 1
          fi
          # Capture the status: under `set -e` a failing command substitution
          # exits at the assignment and the output is never printed.
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/check-workflow-cache-writes.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::the suite file holds ${expected} scenario(s) and node --test passed ${ran:-none}"
            exit 1
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::node --test check-workflow-cache-writes.test.mjs exited ${status}"
            exit "${status}"
          fi
          echo "cache-write checker: ${ran} of ${expected} scenarios passed"
      - name: No workflow cache step writes from a pull request
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-workflow-cache-writes.mjs
      # ci-web-e2e.yml builds each stack image once and the lanes pull it by
      # digest: scripts/ci/stack-images.mjs is the contract between the two
      # halves (it refuses an image nobody built, or one built from another
      # variant), and the CI-only `ci-*` images must stay out of everything
      # that ships. And a cache restore matches an entry only when its `path:`
      # strings are the ones the entry was saved with (the version is their
      # hash): until 2026-11-20 every pull-request restore of main's Go and npm
      # caches missed, the readers spelling `/home/runner/...` and the writers
      # `~/...` (scripts/ci/check-cache-path-parity.mjs, run in the next step).
      # Counted like the suite above: a suite that collects nothing exits 0.
      - name: The build-once contract, the CI-image prune policy and cache path parity hold
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for suite in stack-images.test.mjs stack-image-hash.test.mjs prune-actions-caches.test.mjs prune-ci-images.test.mjs prune-prereleases.test.mjs prune-releases.test.mjs check-cache-path-parity.test.mjs; do
            expected="$(grep -c '^test(' "scripts/ci/${suite}")"
            [ "${expected}" -ge 5 ] || { echo "::error::${suite}: found ${expected} scenario(s), expected at least 5"; exit 1; }
            # Capture the status: under `set -e` a failing command substitution
            # exits at the assignment and the output is never printed.
            status=0
            output="$(node --test --test-reporter=tap "scripts/ci/${suite}" 2>&1)" || status=$?
            printf '%s\n' "${output}"
            ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
            if [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
              echo "::error::${suite} holds ${expected} scenario(s) and node --test passed ${ran:-none}"
              exit 1
            fi
            if [ "${status}" -ne 0 ]; then
              echo "::error::node --test ${suite} exited ${status}"
              exit "${status}"
            fi
          done
      - name: Every cache restore spells its writer's paths
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-cache-path-parity.mjs
      - name: CI-only images are referenced only by CI
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-ci-image-references.test.mjs
          node scripts/ci/check-ci-image-references.mjs
      - name: The legacy runtime is named nowhere
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-legacy-runtime-name.test.mjs
          node scripts/ci/check-legacy-runtime-name.mjs
      - name: The E2E workflow starts on every input of its stack
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-e2e-paths.test.mjs
          node scripts/ci/check-e2e-paths.mjs
      # #2958: no deploy/**/*.yml gives a signing secret, the vault master
      # key or the unwrapped opt-out a literal value; the stack scripts
      # generate them (deploy/scripts/lib/stack-secrets.sh).
      - name: No deploy file carries a literal signing secret
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-deploy-signing-secrets.test.mjs
          node scripts/ci/check-deploy-signing-secrets.mjs
      # The pool runs the E2E stack as processes from a hand-kept table
      # (deploy/native/). Every compose environment key, depends_on edge,
      # healthcheck and one-shot must have its counterpart there, and every
      # address must be the pod's name map (deploy/ci-runners/README.md), or a
      # variable added to the compose file would be silently missing natively.
      - name: The native E2E stack runs what its compose file runs
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-native-stack-parity.test.mjs
          node scripts/ci/check-native-stack-parity.mjs
      # ci.yml's two tiers: every heavy job is gated on a ready PR and the
      # fast tier, ci-gate lists every job, and no workflow runs untiered.
      - name: The CI tiers are complete and ci-gate lists every job
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-tiering.test.mjs scripts/ci/ci-gate.test.mjs scripts/ci/runner-acquired.test.mjs scripts/ci/cargo-deny.test.mjs scripts/ci/govulncheck.test.mjs scripts/ci/check-cache-budget.test.mjs scripts/ci/trim-cargo-cache.test.mjs
          node scripts/ci/check-cache-budget.mjs
          node scripts/ci/check-tiering.mjs
      - name: The real-model preset copy matches the pinned image
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --test scripts/ci/check-real-llm-preset.test.mjs
          node scripts/ci/check-real-llm-preset.mjs
      - name: actionlint over every workflow
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          # actionlint runs shellcheck over every `run:` script. Pinned too:
          # the runner image's shellcheck moves on its own schedule, and a new
          # release once reported a finding (SC2015) no local run could see.
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Through the API (`gh release download`), not the github.com
          # download link: that one has answered 504 for every repository
          # for long stretches while the API served the same asset.
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint \
            --pattern "${archive}" --output "${RUNNER_TEMP}/${archive}" --clobber
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          sc="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          gh release download "v${SHELLCHECK_VERSION}" --repo koalaman/shellcheck \
            --pattern "${sc}" --output "${RUNNER_TEMP}/${sc}" --clobber
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${sc}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${sc}" -C "${RUNNER_TEMP}"
          shellcheck="${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "${shellcheck}" --version | grep -q "version: ${SHELLCHECK_VERSION}" \
            || { echo "::error::the downloaded shellcheck is not ${SHELLCHECK_VERSION}"; exit 1; }
          count="$(find .github/workflows -name '*.yml' -o -name '*.yaml' | wc -l)"
          [ "${count}" -ge 10 ] || { echo "::error::found ${count} workflow file(s); the glob stopped matching"; exit 1; }
          # .github/actionlint.yaml ignores service `command`/`entrypoint` for
          # 1.7.12 only (rhysd/actionlint#645 is unreleased there); a newer
          # pin must drop the ignore so those keys are linted again.
          if [ "${ACTIONLINT_VERSION}" != "1.7.12" ] && grep -q 'for "services" section' .github/actionlint.yaml; then
            echo "::error::actionlint ${ACTIONLINT_VERSION} lints service command/entrypoint; delete that ignore from .github/actionlint.yaml"
            exit 1
          fi
          "${RUNNER_TEMP}/actionlint" -color -shellcheck "${shellcheck}"
          echo "actionlint: ${count} workflow file(s) clean"
          # The brand repository template's workflows (docs/brand-template/):
          # linted as the repository they become, so its own paths resolve.
          template="${RUNNER_TEMP}/brand-template"
          rm -rf "${template}" && cp -R docs/brand-template "${template}"
          git -C "${template}" init -q
          (cd "${template}" && "${RUNNER_TEMP}/actionlint" -color -shellcheck "${shellcheck}")
          echo "actionlint: the brand template's workflows are clean"

  history-gates:
    name: History gates
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The landed-line walk needs the trunk, and the checker REFUSES a
          # shallow clone rather than reporting a short walk as a pass.
          fetch-depth: 0
      # eng-runner: caches and TMPDIR on the work volume, and node (none in its
      # image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"

      # Issue #520. A migration states its version number when an author writes it.
      # The number is only true when the pull request MERGES. Pull requests #369 and
      # #388 both claimed 0072; #495 and #516 both claimed 0084. In each case both
      # authors read the branch head, both found the number free, and neither made
      # an error. A repeated version makes LoadManifest fail and a deployment stops.
      #
      # The check reads the BASE BRANCH as origin holds it at the time it runs, not
      # the pull request's own tree. A check that reads its own tree cannot see the
      # collision.
      #
      # It runs here rather than in ci-go.yml because this workflow has no path
      # filter. ci-go.yml selects `services/elitea-main/**` and would cover the
      # migration directory today, but a filter is a second thing to keep correct.
      # ── Migration version is free on the base branch ──────────────────────────
      # Only a pull request has a base branch. A push has already merged, and the
      # duplicate version is then a LoadManifest failure that ci-go.yml reports.
      - name: The added migration numbers are above the base head
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        env:
          MIGRATION_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/database/check-migration-version.sh

      # Issue #541. A squash merge writes whole files. A squash from a branch that
      # was cut before an earlier pull request landed therefore DELETES that pull
      # request's work, and it leaves the deleted pull request in the history.
      # Pull request #502 corrected the logout flight and its journey. Pull request
      # #516 merged four hours later and wrote the five files back to their
      # pre-#502 copies, byte for byte. This repository still holds both blobs, and
      # they show it: logout.ts is object da9ba899 before #502, c2f5564a after it,
      # and da9ba899 again at #516.
      #
      # The check that cleared it was `git merge-base --is-ancestor`, and it
      # answered "true". That answer is correct and it is not evidence. Ancestry
      # reports the commit. It says nothing about the content. Three agents then
      # cleared a red journey by calling it "pre-existing on staging". Each was
      # right, and the reason it was pre-existing was this deletion, so the
      # reasoning closed on itself.
      #
      # This job reads content. It walks the trunk, takes the diff of each merged
      # pull request against its own base, and looks for the lines that pull
      # request added. It names BOTH pull requests, and the one that deleted the
      # work is the one to fix.
      #
      # It reads the BASE branch head on a pull request, never the proposed tree. A
      # pull request may rewrite lines an earlier pull request added, and that is
      # ordinary work, so a gate that read its own tree would be red on most of
      # them. The measurement is about what ALREADY merged. On a push it reads the
      # new trunk head, so a bad merge turns red within minutes of landing.
      #
      # It lives here, and not in a path-filtered workflow, for the reason the
      # header of this file gives. A deletion of this kind can land in any tree.
      # ── A merged pull request's work is still in the tree ─────────────────────
      - name: The checker still sees the deletion it exists for
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' scripts/ci/check-landed-line-survival.test.mjs)"
          if [ "${expected}" -lt 8 ]; then
            echo "::error::found ${expected} scenario(s) in the suite, expected at least 8 — the pattern stopped matching, so this step checked nothing"
            exit 1
          fi
          # Capture the status: under `set -e` a failing command substitution
          # exits at the assignment and the output is never printed.
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/check-landed-line-survival.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ -z "${ran}" ]; then
            echo "::error::node --test printed no pass line, so the number of scenarios it ran was never reported"
            exit 1
          fi
          if [ "${ran}" -ne "${expected}" ]; then
            echo "::error::the suite file holds ${expected} scenario(s) and node --test passed ${ran}; a scenario that does not run is not a passed scenario"
            exit 1
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::node --test check-landed-line-survival.test.mjs exited ${status}"
            exit "${status}"
          fi
          echo "line-survival checker: ${ran} of ${expected} scenarios ran"
      - name: The lines the last merged pull requests added are still on the trunk
        if: ${{ !cancelled() }}
        env:
          # A pull request measures its BASE. A push measures the new head.
          SURVIVAL_TIP: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tip="${SURVIVAL_TIP}"
          if ! git rev-parse -q --verify "${tip}^{commit}" >/dev/null 2>&1; then
            # A force-push to the base branch can retire the recorded sha. On a
            # pull request the checkout is the merge commit, so its first
            # parent IS the base.
            echo "::notice::${tip} is not in this clone; reading the first parent of HEAD instead"
            tip="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)"
          fi
          # A pull request can target a FEATURE branch (a stacked PR). Its base
          # head then sits on unmerged feature commits, none of which name a
          # pull request, and the walk refuses with "measured nothing" - a
          # false alarm about the subject format. The trunk this check audits
          # is the default branch, so fold the tip down to the last trunk
          # commit underneath it. On a pull request into the default branch the
          # base head already sits on the trunk and the fold is the identity.
          trunk="origin/${DEFAULT_BRANCH}"
          if git rev-parse -q --verify "${trunk}^{commit}" >/dev/null 2>&1; then
            folded="$(git merge-base "${tip}" "${trunk}")" || folded="${tip}"
            if [ "${folded}" != "${tip}" ]; then
              echo "::notice::${tip} is not on ${trunk}; auditing the trunk beneath it at ${folded}"
              tip="${folded}"
            fi
          fi
          node scripts/ci/check-landed-line-survival.mjs --tip "${tip}"

      # ADR-0059 decision 2 (#2590). The legacy administration items end on a
      # date: the removal must not merge before SunsetAfter (or before two
      # stable minors follow the release that shipped the replacements), and
      # from 14 days after it nothing else merges. The check reads the commit
      # under test (the pull request's merge commit; the trunk head on the
      # nightly run), its committer date and the stable tags reachable from
      # it, never the wall clock. It runs here, not in repo-gates, because the
      # release floor needs the full history and the tags. Its scenarios run
      # in the repo-gates loop.
      # -- The legacy items keep to the sunset date --
      - name: The legacy administration items keep to the sunset date
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-sunset.mjs --sha HEAD
      # The same script on a released commit: a rebuild of an old tag gives
      # the answer it gave on the day the tag was cut.
      - name: The sunset check still passes on the v7.6.0 release
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-sunset.mjs --sha v7.6.0
