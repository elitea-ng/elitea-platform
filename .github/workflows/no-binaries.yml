name: No Binaries

# Repo-wide guard: fail if any tracked file is a binary blob or exceeds the size
# ceiling. A local `go build` at a module root emits a ~37MB executable that got
# swept in by `git add <dir>` (twice) before this gate existed. Unlike
# ci-gateway.yml this is NOT path-filtered — it must see the whole tree on every
# change so a binary added anywhere is caught.

on:
  pull_request:
  push:
    branches:
      - main

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a push to main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-binaries:
    name: No committed binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the working tree + HEAD to scan; no full history required.
          fetch-depth: 1
      - name: Scan for binary / oversize tracked files
        run: bash scripts/no-binaries-check.sh
      - name: Validate tracked mixed-deployment launchers
        run: |
          bash -n deploy/centry-hybrid/compose.sh
          bash -n deploy/centry-hybrid/prepare-runtime.sh
          test -s deploy/centry-hybrid/pov-compose.yml
          test -s deploy/centry-hybrid/traefik/index-routes.yml
          test -s deploy/centry-hybrid/rollback/index-v1.yml
      # Issue #339. cutover-rehearsal.sh walks the index-plane cutover against a
      # live stack, and its whole value is that it REFUSES: it stops at the
      # first stage that does not hold. A script like that fails in one
      # direction only — by refusing nothing — and every run then reads as a
      # successful rehearsal. `bash -n` above cannot see that.
      #
      # The suite drives the dry-run plan and each refusal, against a COPY of
      # the hybrid directory that it edits, so a case that must fail is produced
      # rather than assumed. It needs no stack, no network and no Centry
      # checkout. It lives here because no workflow has a path filter that
      # selects deploy/centry-hybrid/**, and this one has no path filter at all.
      #
      # The suite carries its own floor on the number of assertions that
      # reported a result, so a copy that stopped running its cases is red here
      # rather than reporting "0 failed".
      - name: The index cutover rehearsal still refuses what it must
        run: bash deploy/centry-hybrid/scripts/cutover-rehearsal-test.sh
      # Issue #485. `services/elitea-main/tests/reliability/index_5681/run.sh` is
      # an operator wrapper, and NO workflow can run it: it demands 29
      # environment variables that name the legacy centry stack
      # (ELITEA_CENTRY_DIR and its compose files), and that stack is not in this
      # repository. It refuses with exit 2 rather than reporting a passing skip,
      # so it can never become a green no-op, and `scripts/go/declared-skips.txt`
      # already records it as the owner of the production-scale gate. The Python
      # half of that directory runs in ci-go.yml, with a count floor.
      #
      # So the only continuous check this repository can honestly make on it is
      # that it still parses. That is worth little on its own, and it is worth
      # having for EVERY tracked shell file: the two launchers above got the
      # same check one at a time, and the set they belong to grew past them.
      #
      # This step measures syntax, not behaviour. It is not a substitute for a
      # caller. The floor turns a glob that stopped matching into a red job.
      - name: Every tracked shell file parses
        run: |
          set -euo pipefail
          scripts_found=0
          failed=""
          for file in $(git ls-files '*.sh'); do
            scripts_found=$((scripts_found + 1))
            if ! bash -n "$file"; then
              failed="$failed $file"
            fi
          done
          if [ "$scripts_found" -lt 35 ]; then
            echo "::error::found ${scripts_found} tracked .sh file(s), expected at least 35 — the glob stopped matching, so this step checked nothing"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::these shell files do not parse:$failed"
            exit 1
          fi
          echo "shell syntax: ${scripts_found} file(s) parse"
      # Issue #534. Three guards STATED the number of assertions they make.
      # A stated number is correct when its author writes it and true only
      # when the pull request MERGES, so a merge that added an assertion, and
      # left the number alone, made the floor under-count in silence for ever.
      #
      # Each of those guards derives its floor from its own source now. This
      # step holds the property that correction depends on: add a site and the
      # floor rises, remove a site and it falls, and no guard states a literal
      # count. It finds the guards in the tree and reads each guard's OWN
      # pattern, so it cannot hold a stale list or a stale pattern.
      #
      # It needs no stack, no cluster and no network, and it takes about a
      # second. It lives here because this workflow has no path filter, and
      # the guards it reads sit in three different trees.
      - name: The derived assertion floors move with their assertions
        run: bash scripts/lib/assertion-floor-test.sh
      # This gate lives here, and not only in ci-go.yml, because ci-go.yml is
      # path-filtered and does not select deploy/centry-hybrid/**. A pull
      # request that edits only the edge YAML would not run it there. Traefik
      # drops a router that names an unknown middleware and keeps serving, so
      # the fault reaches production as a silent fallback to pylon rather than
      # as an error (#338).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: services/elitea-main/go.sum
      # -count=1 is required, not tidiness. The gate reads YAML from deploy/,
      # which is outside this module, so the Go test cache does not notice an
      # edit to those files and can serve a stale pass.
      - name: Validate the Traefik edge middleware references
        working-directory: services/elitea-main
        run: go test -count=1 ./tests/deployedge/...
      # The permission-grant gate lives here for the same reason as the step
      # above. A route gated on a permission that no migration grants answers
      # 403 to every caller on a clean database, and every seeded database
      # hides it (#354, #359). The gate must run on a pull request that
      # touches a router file OR a migration. ci-go.yml selects
      # services/elitea-main/** and covers both today, but a path filter is a
      # second thing to keep correct, and this repository has already shipped a
      # gate that stopped running when a file moved (#157). This workflow has
      # no path filter at all, so the gate cannot be switched off by accident.
      #
      # The whole package runs, with no -run filter. `go test -run NoSuchName`
      # exits 0 and reports "no tests to run", so a renamed test would turn this
      # step into a silent no-op — the same "nothing found, therefore OK" trap.
      #
      # -count=1 removes any dependency on the Go test cache. The gate reads
      # migrations/shared and every source file under internal/, all outside this
      # package. A local check shows the cache does track those reads today and
      # does invalidate on a migration edit, so this is insurance rather than a
      # repair: the tracking is best-effort, this test opens more than a thousand
      # files, and a stale pass here hides the exact defect the gate exists for.
      # The run takes about ten seconds, so the insurance is nearly free.
      - name: Validate that every gated permission has a grant
        working-directory: services/elitea-main
        run: go test -count=1 ./internal/api/

  # Issue #424. Six gate scripts validated the checked-in evidence snapshots
  # under testdata/, and no workflow, Taskfile task or other script called any
  # of them. A gate that nothing calls cannot fail, and its presence in the
  # tree reads as coverage.
  #
  # They live here, and not in a path-filtered workflow, for the reason the
  # header of this file gives. Their subjects are spread over three trees
  # (testdata/baseline, testdata/legacy, testdata/postgres) plus the scripts
  # themselves, so a path-filtered home would need four more filters to keep
  # correct — and this repository has twice shipped a gate that stopped running
  # because a filter or a path stopped matching (#157, #426). This workflow has
  # no path filter at all.
  #
  # The scripts are a separate job, not more steps in the job above, so a
  # failing evidence check does not hide the binary scan and the reverse.
  evidence-baselines:
    name: Checked-in evidence baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Every check reads only the standard library and the committed JSON, so
      # there is nothing to install.
      - name: Validate the checked-in security and database evidence
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(scripts/security/check_*.py scripts/database/check_*.py)
          # The list comes from the tree, not from a written-down set of names.
          # A renamed or deleted script therefore changes the count, and the
          # floor below turns that into a red job instead of a shorter loop
          # that still says "passed".
          if [ "${#checks[@]}" -lt 6 ]; then
            echo "::error::found ${#checks[@]} evidence check scripts, expected at least 6 — the glob stopped matching, so this job would pass without checking anything"
            exit 1
          fi
          for check in "${checks[@]}"; do
            echo "== ${check}"
            python "${check}"
          done
      - name: Install the test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      # pytest exits 5 when it collects nothing, so an empty run is red rather
      # than green. The glob floor covers the narrower case where one file of
      # the set is renamed and the rest still collect.
      - name: Run the evidence checker unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/security/test_*.py)
          if [ "${#tests[@]}" -lt 4 ]; then
            echo "::error::found ${#tests[@]} test files under scripts/security/, expected at least 4 — the glob stopped matching"
            exit 1
          fi
          python -m pytest -q "${tests[@]}"

  # Issue #518. The wiring is a separate artifact from the gate, and only the
  # gate feels like the work. `helm-lint.yml` was correct in its own file and
  # its push arm named `main` only, so it could not start on the branch it
  # guards. A measurement on 2026-08-18 gives the size of the hole: for EVERY
  # workflow in this repository, `actions/runs?branch=<staging>&event=push`
  # returned `total_count: 0`. No push run has ever started on the staging
  # branch.
  #
  # This job holds the wiring itself. It reads .github/staging-branch.txt and
  # the push arm of each workflow, and it fails when a workflow that names
  # `main` does not also name the staging branch — or when a workflow names a
  # branch the file does not.
  #
  # It lives here, and not in a path-filtered workflow, for the reason the
  # header of this file gives: a path filter is a second thing to keep correct,
  # and a gate about triggers must not itself depend on one.
  workflow-branch-coverage:
    name: Workflow triggers reach the staging branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The check asks `origin` whether the branch it names still exists, so the
      # authenticated remote that actions/checkout leaves behind is required.
      # It reads only the standard library; there is nothing to install.
      - name: Every push arm that names main also names the staging branch
        run: python scripts/ci/check_workflow_branch_coverage.py

  # Issue #520. A migration states its version number when an author writes it.
  # The number is only true when the pull request MERGES. Pull requests #369 and
  # #388 both claimed 0072; #495 and #516 both claimed 0084. In each case both
  # authors read the branch head, both found the number free, and neither made
  # an error. A repeated version makes LoadManifest fail and a deployment stops.
  #
  # The check reads the BASE BRANCH as origin holds it at the time it runs, not
  # the pull request's own tree. A check that reads its own tree cannot see the
  # collision.
  #
  # It runs here rather than in ci-go.yml because this workflow has no path
  # filter. ci-go.yml selects `services/elitea-main/**` and would cover the
  # migration directory today, but a filter is a second thing to keep correct.
  migration-version:
    name: Migration version is free on the base branch
    # Only a pull request has a base branch. A push has already merged, and the
    # duplicate version is then a LoadManifest failure that ci-go.yml reports.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check runs `git ls-tree` against the base branch, so it needs a
          # repository with a remote it can fetch that ref from. The script
          # fetches the single ref it needs at depth 1.
          fetch-depth: 1
      - name: The added migration numbers are above the base head
        env:
          MIGRATION_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/database/check-migration-version.sh

  # Issue #485. `docker/model-cache-init/test_entrypoint.sh` holds the
  # assertions on the model-cache entrypoint, and no workflow, Taskfile task or
  # script called it. The image cannot run it either, because
  # `docker/model-cache-init/.dockerignore` excludes it from the build context.
  # Running it here needs no image at all: the suite states that it runs without
  # Docker, against a temporary directory.
  #
  # It runs in this workflow because no other workflow selects
  # `docker/model-cache-init/**`, and this one has no path filter. About 15
  # seconds.
  #
  # Issue #529 adds the second half of that directory. `validate-manifest.sh`
  # had no caller either, and `manifest-schema.json` had no reader at all. The
  # validator reads the schema now, so the step below measures both files.
  model-cache-init:
    name: Model cache entrypoint suite and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read the COUNT, not the exit status (#529). The suite already exits
      # non-zero on a shortfall, and a job that reads the status alone believes
      # whatever the suite reports about itself. This step reads the result
      # line, so a suite that stops printing one is red here as well.
      #
      # It states NO number of its own. The floor is derived inside the suite
      # (#534), and a number restated here would put the same stale count in a
      # second place.
      - name: Run the entrypoint assertions
        run: |
          set +e
          set -uo pipefail
          output="$(bash docker/model-cache-init/test_entrypoint.sh 2>&1)"
          status=$?
          printf '%s\n' "$output"
          line="$(printf '%s\n' "$output" | grep -E '^=== Results: [0-9]+ passed, [0-9]+ failed; [0-9]+ of [0-9]+ expected assertions reported a result ===$')"
          if [ -z "$line" ]; then
            echo "::error::the suite printed no result line, so the number of assertions it made was never reported"
            exit 1
          fi
          ran="$(printf '%s' "$line" | sed -E 's/.*; ([0-9]+) of ([0-9]+) .*/\1/')"
          expected="$(printf '%s' "$line" | sed -E 's/.*; ([0-9]+) of ([0-9]+) .*/\2/')"
          if [ "$expected" -lt 1 ]; then
            echo "::error::the suite derived ${expected} assertion site(s); a floor of zero passes every run"
            exit 1
          fi
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::${ran} of ${expected} assertions reported a result; an assertion that reports nothing is not a passed assertion"
            exit 1
          fi
          echo "model cache entrypoint: ${ran} of ${expected} assertions reported a result"
          exit "$status"
      # jq and the aws CLI are both on ubuntu-latest. A missing aws CLI turns
      # this step RED on purpose (#429): every URL in the manifest is an s3://
      # URL, and a host that cannot look at one has measured nothing about it.
      # The bucket is private, so the answer itself is a counted warning and not
      # an error, and the step does not depend on a credential.
      - name: Validate the model cache manifest against its schema
        run: bash docker/model-cache-init/validate-manifest.sh docker/model-cache-init/manifest.json

  # Issue #541. A squash merge writes whole files. A squash from a branch that
  # was cut before an earlier pull request landed therefore DELETES that pull
  # request's work, and it leaves the deleted pull request in the history.
  # Pull request #502 corrected the logout flight and its journey. Pull request
  # #516 merged four hours later and wrote the five files back to their
  # pre-#502 copies, byte for byte. This repository still holds both blobs, and
  # they show it: logout.ts is object da9ba899 before #502, c2f5564a after it,
  # and da9ba899 again at #516.
  #
  # The check that cleared it was `git merge-base --is-ancestor`, and it
  # answered "true". That answer is correct and it is not evidence. Ancestry
  # reports the commit. It says nothing about the content. Three agents then
  # cleared a red journey by calling it "pre-existing on staging". Each was
  # right, and the reason it was pre-existing was this deletion, so the
  # reasoning closed on itself.
  #
  # This job reads content. It walks the trunk, takes the diff of each merged
  # pull request against its own base, and looks for the lines that pull
  # request added. It names BOTH pull requests, and the one that deleted the
  # work is the one to fix.
  #
  # It reads the BASE branch head on a pull request, never the proposed tree. A
  # pull request may rewrite lines an earlier pull request added, and that is
  # ordinary work, so a gate that read its own tree would be red on most of
  # them. The measurement is about what ALREADY merged. On a push it reads the
  # new trunk head, so a bad merge turns red within minutes of landing.
  #
  # It lives here, and not in a path-filtered workflow, for the reason the
  # header of this file gives. A deletion of this kind can land in any tree.
  landed-line-survival:
    name: A merged pull request's work is still in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The walk needs the trunk. The checker REFUSES a shallow clone
          # rather than reporting a short walk as a pass.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The suite builds throwaway bare repositories with git plumbing. It
      # reads only the standard library, so there is nothing to install.
      #
      # Read the COUNT of scenarios, not the exit status alone. `unittest`
      # exits 0 when it collects nothing, so a renamed file or a renamed method
      # would turn this step into a silent no-op (#534). The number comes from
      # the suite file itself, so adding a scenario raises it.
      - name: The checker still sees the deletion it exists for
        run: |
          set -euo pipefail
          expected="$(grep -c '^    def test_' scripts/ci/test_check_landed_line_survival.py)"
          if [ "${expected}" -lt 8 ]; then
            echo "::error::found ${expected} scenario(s) in the suite, expected at least 8 — the pattern stopped matching, so this step checked nothing"
            exit 1
          fi
          output="$(python -m unittest discover -s scripts/ci -p 'test_check_landed_line_survival.py' -v 2>&1)"
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p')"
          if [ -z "${ran}" ]; then
            echo "::error::unittest printed no result line, so the number of scenarios it ran was never reported"
            exit 1
          fi
          if [ "${ran}" -ne "${expected}" ]; then
            echo "::error::the suite file holds ${expected} scenario(s) and unittest ran ${ran}; a scenario that does not run is not a passed scenario"
            exit 1
          fi
          echo "line-survival checker: ${ran} of ${expected} scenarios ran"
      - name: The lines the last merged pull requests added are still on the trunk
        env:
          # A pull request measures its BASE. A push measures the new head.
          SURVIVAL_TIP: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tip="${SURVIVAL_TIP}"
          if ! git rev-parse -q --verify "${tip}^{commit}" >/dev/null 2>&1; then
            # A force-push to the base branch can retire the recorded sha. On a
            # pull request the checkout is the merge commit, so its first
            # parent IS the base.
            echo "::notice::${tip} is not in this clone; reading the first parent of HEAD instead"
            tip="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)"
          fi
          # A pull request can target a FEATURE branch (a stacked PR). Its base
          # head then sits on unmerged feature commits, none of which name a
          # pull request, and the walk refuses with "measured nothing" - a
          # false alarm about the subject format. The trunk this check audits
          # is the default branch, so fold the tip down to the last trunk
          # commit underneath it. On a pull request into the default branch the
          # base head already sits on the trunk and the fold is the identity.
          trunk="origin/${DEFAULT_BRANCH}"
          if git rev-parse -q --verify "${trunk}^{commit}" >/dev/null 2>&1; then
            folded="$(git merge-base "${tip}" "${trunk}")" || folded="${tip}"
            if [ "${folded}" != "${tip}" ]; then
              echo "::notice::${tip} is not on ${trunk}; auditing the trunk beneath it at ${folded}"
              tip="${folded}"
            fi
          fi
          python scripts/ci/check_landed_line_survival.py --tip "${tip}"
