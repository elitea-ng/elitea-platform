name: CI — Rust worker

on:
  pull_request:
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      - ".github/workflows/ci-rust.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, Clippy, docs, and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Build the release binary
        run: cargo build --locked --release

  test:
    name: Test with PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Run all targets and features
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: cargo test --locked --all-targets --all-features

      - name: Verify sandbox phase deadlines with PostgreSQL
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: cargo test --locked --lib --all-features sandbox::docker_supervisor::deadline_tests -- --ignored
