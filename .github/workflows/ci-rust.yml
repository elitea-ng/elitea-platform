name: CI — Rust worker

on:
  pull_request:
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-code-runner/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      - ".github/workflows/ci-rust.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-code-runner/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  code-runner:
    name: Code runner format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/elitea-code-runner
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-code-runner

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all targets and features
        run: cargo test --locked --all-targets --all-features

  quality:
    name: Format, Clippy, docs, and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Build the release binary
        run: cargo build --locked --release

  test:
    name: Test with PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Run all targets and features
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_REQUIRE_POSTGRES_RECEIPT_TESTS: "1"
          ELITEA_TEST_DATABASE_GUARD: "disposable-pg18"
        run: cargo test --locked --all-targets --all-features

      - name: Verify sandbox phase deadlines with PostgreSQL
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: cargo test --locked --lib --all-features sandbox::docker_supervisor::deadline_tests -- --ignored

      - name: Verify Python preparation and final hydration with PostgreSQL
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_TEST_BUNDLE_TLS: "${{ runner.temp }}/elitea-python-bundle-tls"
        run: |
          umask 077
          mkdir -p "$ELITEA_TEST_BUNDLE_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=Disposable Python bundle CA" -addext "basicConstraints=critical,CA:TRUE" \
            -keyout "$ELITEA_TEST_BUNDLE_TLS/ca.key" -out "$ELITEA_TEST_BUNDLE_TLS/ca.pem"
          openssl req -new -newkey rsa:2048 -nodes -subj "/CN=python-bundle.test" \
            -keyout "$ELITEA_TEST_BUNDLE_TLS/client.key" -out "$ELITEA_TEST_BUNDLE_TLS/client.csr"
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=clientAuth\nsubjectAltName=DNS:python-bundle.test\n' > "$ELITEA_TEST_BUNDLE_TLS/client.ext"
          openssl x509 -req -days 1 -in "$ELITEA_TEST_BUNDLE_TLS/client.csr" \
            -CA "$ELITEA_TEST_BUNDLE_TLS/ca.pem" -CAkey "$ELITEA_TEST_BUNDLE_TLS/ca.key" -CAcreateserial \
            -extfile "$ELITEA_TEST_BUNDLE_TLS/client.ext" -out "$ELITEA_TEST_BUNDLE_TLS/client.pem"
          cat "$ELITEA_TEST_BUNDLE_TLS/client.pem" "$ELITEA_TEST_BUNDLE_TLS/client.key" > "$ELITEA_TEST_BUNDLE_TLS/client-combined.pem"
          cargo test --locked --lib --all-features sandbox::docker_supervisor::preparation::tests -- --ignored
          cargo test --locked --lib --all-features sandbox::docker_supervisor::hydration::deadline_tests -- --ignored
