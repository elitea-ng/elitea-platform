name: CI — Rust worker

on:
  pull_request:
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-code-runner/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      # elitea-llm-wire (the /llm caller contract) and elitea-agent-runtime
      # (the runtime shared with the desktop host, ADR-0029), path dependencies,
      # and the patched adk crates in libs/rust/vendor; they inherit package
      # fields and lints from the libs/rust workspace.
      - "libs/rust/**"
      # The workspace-run Docker proofs create the egress network with it.
      - "deploy/docker/workspace-egress.sh"
      # ...and run the real egress proxy for the proxy-mode proof.
      - "services/elitea-egress-proxy/**"
      - "libs/go/egresslib/**"
      # The /llm caller contract both Rust callers assert (worker, engine model client).
      - "conformance/llm-caller/**"
      # The SDK schema gate reads both (libs/rust/agent-runtime/src/toolkits/sdk_conformance.rs;
      # the worker's artifact suite asserts it through `test-support`).
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_rust_worker_toolkit_capability_snapshot.json"
      - "services/elitea-main/internal/rustonly/rust_only_toolkit_tools.json"
      # The live command-bus test runs the worker against the NATS chart's
      # own permission table and the real bootstrap (docs/runtime-command-bus.md).
      - "deploy/helm/nats/**"
      - "deploy/helm/nats-bootstrap/**"
      - "scripts/nats/**"
      - "libs/go/natsconn/**"
      - "docs/runtime-command-bus.md"
      - ".github/workflows/ci-rust.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-worker-rust/**"
      - "services/elitea-code-runner/**"
      - "services/elitea-main/migrations/agentstate/**"
      - "libs/proto/**"
      # elitea-llm-wire (the /llm caller contract) and elitea-agent-runtime
      # (the runtime shared with the desktop host, ADR-0029), path dependencies,
      # and the patched adk crates in libs/rust/vendor; they inherit package
      # fields and lints from the libs/rust workspace.
      - "libs/rust/**"
      # The workspace-run Docker proofs create the egress network with it.
      - "deploy/docker/workspace-egress.sh"
      # ...and run the real egress proxy for the proxy-mode proof.
      - "services/elitea-egress-proxy/**"
      - "libs/go/egresslib/**"
      # The /llm caller contract both Rust callers assert (worker, engine model client).
      - "conformance/llm-caller/**"
      # The SDK schema gate reads both (libs/rust/agent-runtime/src/toolkits/sdk_conformance.rs;
      # the worker's artifact suite asserts it through `test-support`).
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_rust_worker_toolkit_capability_snapshot.json"
      - "services/elitea-main/internal/rustonly/rust_only_toolkit_tools.json"
      # The live command-bus test runs the worker against the NATS chart's
      # own permission table and the real bootstrap (docs/runtime-command-bus.md).
      - "deploy/helm/nats/**"
      - "deploy/helm/nats-bootstrap/**"
      - "scripts/nats/**"
      - "libs/go/natsconn/**"
      - "docs/runtime-command-bus.md"
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  code-runner:
    name: Code runner format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/elitea-code-runner
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-code-runner

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all targets and features
        run: cargo test --locked --all-targets --all-features

  quality:
    name: Format, Clippy, docs, and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Build the release binary
        run: cargo build --locked --release

  test:
    name: Test with PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      # Both jobs below used to do a COLD build of the whole 418-crate
      # dependency graph on every Rust PR — twice per PR, once here and once in
      # the other job, with nothing carried between runs. Nothing in this
      # workflow cached ~/.cargo or target/.
      #
      # `workspaces` is repo-relative (the `defaults.run.working-directory`
      # above applies to `run:` steps, not to `uses:`), and points at the
      # Cargo.toml this workflow builds.
      #
      # CARGO_INCREMENTAL=0 above stays. rust-cache is designed for CI with
      # incremental off — it caches the registry, the git checkouts and the
      # dependency artefacts in target/, none of which are incremental state —
      # and it deliberately does not cache the workspace crates themselves.
      #
      # The two jobs get separate cache entries (rust-cache keys on the job),
      # which is correct: `quality` builds --release and docs, `test` builds
      # test targets, and one shared entry would thrash between them.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          # Read everywhere, write on main only: a pull request's target directory
          # is ~1 GB of the repository's 10 GB Actions cache, duplicated per branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      # The live command-bus test (src/execution/nats_live_tests.rs) runs the
      # worker's real NATS transport as elitea-worker against a secured
      # nats-server built from the NATS chart's own rendered nats.conf and the
      # real bootstrap.sh (natstest-serve), then greps the server log for
      # permission violations. Steps in this job, not a new job: the plan's
      # concurrent-job cap. ELITEA_REQUIRE_NATS_SECURE_TEST=1 turns a missing
      # environment into a FAILURE: a skipped permission test reads exactly
      # like a passing one.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            libs/go/*/go.sum

      - name: Provision the secured NATS permission test
        working-directory: .
        run: bash scripts/nats/ci-secure-test-env.sh

      - name: Start the secured NATS test server
        working-directory: .
        run: |
          env_file="${RUNNER_TEMP}/natsenv.json"
          nohup go run ./libs/go/natsconn/natstest/cmd/natstest-serve -out "$env_file" \
            > "${RUNNER_TEMP}/natstest-serve.log" 2>&1 &
          for _ in $(seq 1 180); do
            [ -s "$env_file" ] && break
            sleep 1
          done
          if [ ! -s "$env_file" ]; then
            echo "natstest-serve did not write $env_file" >&2
            cat "${RUNNER_TEMP}/natstest-serve.log" >&2
            exit 1
          fi
          echo "ELITEA_TEST_NATS_SECURE_ENV=$env_file" >> "$GITHUB_ENV"

      - name: Run all targets and features
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_REQUIRE_POSTGRES_RECEIPT_TESTS: "1"
          ELITEA_TEST_DATABASE_GUARD: "disposable-pg18"
          ELITEA_REQUIRE_NATS_SECURE_TEST: "1"
        run: cargo test --locked --all-targets --all-features

      - name: Show the NATS test server log on failure
        if: failure()
        working-directory: .
        run: cat "${RUNNER_TEMP}/natstest-serve.log" || true

      - name: Verify sandbox phase deadlines with PostgreSQL
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: cargo test --locked --lib --all-features sandbox::docker_supervisor::deadline_tests -- --ignored

      - name: Verify Python preparation and final hydration with PostgreSQL
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_TEST_BUNDLE_TLS: "${{ runner.temp }}/elitea-python-bundle-tls"
        run: |
          umask 077
          mkdir -p "$ELITEA_TEST_BUNDLE_TLS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=Disposable Python bundle CA" -addext "basicConstraints=critical,CA:TRUE" \
            -keyout "$ELITEA_TEST_BUNDLE_TLS/ca.key" -out "$ELITEA_TEST_BUNDLE_TLS/ca.pem"
          openssl req -new -newkey rsa:2048 -nodes -subj "/CN=python-bundle.test" \
            -keyout "$ELITEA_TEST_BUNDLE_TLS/client.key" -out "$ELITEA_TEST_BUNDLE_TLS/client.csr"
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=clientAuth\nsubjectAltName=DNS:python-bundle.test\n' > "$ELITEA_TEST_BUNDLE_TLS/client.ext"
          openssl x509 -req -days 1 -in "$ELITEA_TEST_BUNDLE_TLS/client.csr" \
            -CA "$ELITEA_TEST_BUNDLE_TLS/ca.pem" -CAkey "$ELITEA_TEST_BUNDLE_TLS/ca.key" -CAcreateserial \
            -extfile "$ELITEA_TEST_BUNDLE_TLS/client.ext" -out "$ELITEA_TEST_BUNDLE_TLS/client.pem"
          cat "$ELITEA_TEST_BUNDLE_TLS/client.pem" "$ELITEA_TEST_BUNDLE_TLS/client.key" > "$ELITEA_TEST_BUNDLE_TLS/client-combined.pem"
          cargo test --locked --lib --all-features sandbox::docker_supervisor::preparation::tests -- --ignored
          cargo test --locked --lib --all-features sandbox::docker_supervisor::hydration::deadline_tests -- --ignored

  # ADR-0034 decision 9: the cloud executor's workspace runs on the real
  # Docker runtime. The runner image is built HERE (never locally) and pushed
  # to a throwaway registry so the run can name it by digest, as production
  # does. Two opt-in proofs run against it
  # (src/sandbox/workspace_run_docker_tests.rs):
  #   * the supervisor bridge end to end: launcher, gRPC, the supervisor's
  #     service and its Docker backend, the real runner (start, unpack, serve,
  #     pack, destroy);
  #   * the egress proof: network on reaches public HTTPS and DNS and NOT
  #     RFC 1918, 169.254.169.254 or a service on the host (the stand-in for
  #     Main); network off has no network and no DNS.
  #   * the proxy proof (host-allowlist mode): on the internal proxy network,
  #     with a run token for example.com, the real elitea-egress-proxy lets
  #     the run reach example.com and refuses www.iana.org (off the
  #     allowlist), a direct connection, DNS, and a fronted tunnel (CONNECT
  #     example.com, SNI www.iana.org); the proxy's log must show the
  #     host-not-allowed and sni-mismatch refusals.
  # ELITEA_REQUIRE_WORKSPACE_DOCKER_TESTS=1 turns a missing variable into a
  # failure: a skipped proof must not read as a passing one.
  workspace-run-docker:
    name: Workspace runs on Docker (bridge and egress proof)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    defaults:
      run:
        working-directory: services/elitea-worker-rust
    steps:
      - uses: actions/checkout@v7

      - name: Show pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: services/elitea-worker-rust

      - name: Build and push the workspace runner image
        working-directory: .
        run: |
          set -euo pipefail
          docker build -f libs/rust/workspace-runner/Containerfile \
            -t localhost:5000/elitea-workspace-runner:ci .
          docker push localhost:5000/elitea-workspace-runner:ci
          image="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/elitea-workspace-runner:ci)"
          case "$image" in *@sha256:*) ;; *) echo "::error::no digest for the runner image: $image"; exit 1 ;; esac
          echo "ELITEA_WORKSPACE_RUNNER_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Create the workspace egress network
        working-directory: .
        run: |
          set -euo pipefail
          sudo ELITEA_WORKSPACE_EGRESS_DNS="1.1.1.1 9.9.9.9" bash deploy/docker/workspace-egress.sh
          echo "ELITEA_WORKSPACE_EGRESS_NETWORK=elitea-workspace-egress" >> "$GITHUB_ENV"
          echo "ELITEA_WORKSPACE_EGRESS_DNS=1.1.1.1,9.9.9.9" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Start the egress proxy on the proxy network
        working-directory: .
        run: |
          set -euo pipefail
          keys="${RUNNER_TEMP}/egress-keys"
          # A throwaway key pair and one token for example.com (test tool;
          # production tokens are minted by elitea-main).
          go run ./libs/go/egresslib/cmd/egress-test-token -keys-dir "$keys" \
            -execution ci-proxy-proof -project 1 -allow example.com -ttl 30m > "${RUNNER_TEMP}/egress-token"
          chmod 0644 "$keys/test.pem"
          docker build -f services/elitea-egress-proxy/Containerfile -t elitea-egress-proxy:ci .
          docker run -d --name egress-proxy --network bridge \
            -e ELITEA_EGRESS_PROXY_PUBLIC_KEYS=/keys \
            -e ELITEA_EGRESS_PROXY_DENY_CIDRS=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16 \
            -v "$keys:/keys:ro" elitea-egress-proxy:ci
          docker network connect --ip 172.31.251.2 elitea-workspace-proxy egress-proxy
          for _ in $(seq 1 30); do
            docker logs egress-proxy 2>&1 | grep -q egress_proxy.started && break
            sleep 1
          done
          docker logs egress-proxy 2>&1 | grep -q egress_proxy.started
          {
            echo "ELITEA_WORKSPACE_PROXY_NETWORK=elitea-workspace-proxy"
            echo "ELITEA_WORKSPACE_PROXY_URL=http://172.31.251.2:3128"
            echo "ELITEA_WORKSPACE_PROXY_TOKEN_FILE=${RUNNER_TEMP}/egress-token"
          } >> "$GITHUB_ENV"

      - name: Start a stand-in for Main on the host
        run: |
          set -euo pipefail
          nohup python3 -m http.server 18080 --bind 0.0.0.0 > "${RUNNER_TEMP}/platform.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:18080/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/ >/dev/null
          gateway="$(docker network inspect elitea-workspace-egress --format '{{(index .IPAM.Config 0).Gateway}}')"
          echo "ELITEA_WORKSPACE_EGRESS_PLATFORM_URL=http://${gateway}:18080/" >> "$GITHUB_ENV"

      - name: Run the Docker workspace-run proofs
        env:
          ELITEA_REQUIRE_WORKSPACE_DOCKER_TESTS: "1"
        run: cargo test --locked --lib --all-features sandbox::workspace_run_docker_tests -- --ignored --test-threads=1

      - name: The proxy refused the off-allowlist host and the fronted tunnel
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          docker logs egress-proxy > "${RUNNER_TEMP}/egress-proxy.log" 2>&1 || true
          for reason in host-not-allowed sni-mismatch; do
            if ! grep -q "\"reason\":\"$reason\"" "${RUNNER_TEMP}/egress-proxy.log"; then
              echo "::error::the egress proxy logged no $reason refusal"
              tail -50 "${RUNNER_TEMP}/egress-proxy.log"
              exit 1
            fi
          done
          # The token never reaches the proxy's log.
          if grep -qF "$(cat "${RUNNER_TEMP}/egress-token")" "${RUNNER_TEMP}/egress-proxy.log"; then
            echo "::error::the run token is in the egress proxy's log"; exit 1
          fi
