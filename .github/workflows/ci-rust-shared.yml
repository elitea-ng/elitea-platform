name: CI — Rust shared crates

# The libs/rust workspace's own gate: the tests of every member (the engine
# cores, the agent runtime, llm-wire, the vendored adk crates), plus the agent
# runtime as the worker links it (serde_json order off, the SQL family on).
#
# Moved out of ci-deepwiki-engine.yml's `engine` job (2026-10-20), with the
# same commands and flags. There it ran on every DeepWiki-only change, took
# 22 min cold, and sat on the engine's critical path: on PR #1329 the job
# hit its 45-min timeout before the Go host tests ran (job 118778015092).
# Here it runs when the workspace, or something its tests read, changes —
# and in parallel with the engine jobs when both are touched.
#
# FOUR LEGS, split along the dependency graph (2026-11-23). One job ran it all
# in sequence and was the critical path of a Rust pull request: 36 min in run
# 45075137150 (job 137376497651) on a 4-CPU pool pod with no cache. Of that,
# 4m10s was cargo cloning two tree-sitter grammars' full git history (240 MB,
# below), 14 min compiling 941 crates, 7 min running the tests (office-core's
# hostile, gate, review and corpus suites alone 4 min) and 10 min building the
# agent runtime twice more for its two feature-set runs. Each leg below builds
# only its own part of the graph, on its own pod:
#   agent hosts      the agent runtime with every feature and the crates
#                    built on it (local tools, workspace runner, local index);
#   agent runtime    the runtime as the worker links it;
#   engines          every other member;
#   office core      its own slow suites, beside a 224-crate closure.
# The runtime's second feature-set run (`test-preserve-order` plus the
# toolkits) is gone: `--all-features` in `agent hosts` is that set plus
# `test-support` and `toolkit-data-analysis`, and every `test-support` gate in
# the runtime reads `any(test, feature = "test-support")`, on in a test build
# anyway. So it compiled the runtime a third time to run the same tests.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main tests main and writes the one cache below
  # (scripts/ci/check-cache-budget.mjs: one writer per key); staggered ahead
  # of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-rust-shared-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  shared-crates:
    name: Shared crates — ${{ matrix.name }}
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    # 36 min for all four in one job, cold; each leg builds a part of that.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent hosts
            args: >-
              -p elitea-agent-runtime -p elitea-local-tools -p elitea-workspace-runner -p elitea-local-index
              --all-targets --all-features
          # Built alone with the worker's features (its Cargo.toml), the
          # runtime has serde_json `preserve_order` off and links sqlx, which
          # is how the worker links it (the desktop build drops `toolkit-sql`).
          # Its digest tests pin the same values both ways (ADR-0029 decision
          # 2); `agent hosts` runs them with the order on. Until 2026-11-23 the
          # run left out `toolkit-data-analysis`, so the data-analysis tools
          # were never tested with the order off, as the worker runs them.
          - name: agent runtime (worker features)
            args: -p elitea-agent-runtime --all-targets --features toolkit-sql,toolkit-office,toolkit-data-analysis,toolkit-delta-lake
          - name: engines
            args: >-
              --workspace --exclude elitea-agent-runtime --exclude elitea-local-tools
              --exclude elitea-workspace-runner --exclude elitea-local-index --exclude elitea-office-core
              --all-targets --all-features
            # The one writer of the cargo git cache below.
            git-db-writer: "true"
          - name: office core
            args: -p elitea-office-core --all-targets --all-features
    defaults:
      run:
        working-directory: libs/rust
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and rustup (none in
      # its image). Does nothing on a hosted runner.
      # node for the writer leg's trim script (none in the pool's image).
      - uses: ./.github/actions/eng-runner-env
        with:
          rust: "true"
          node: "true"

      - name: Assert the pinned toolchain
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      - name: Free runner disk for the all-features build
        # Hosted only: the pool builds on its 80 GiB work volume, and has no sudo.
        if: runner.environment == 'github-hosted'
        # The all-features build of the workspace on top of main's restored
        # target/ ran the runner out of disk (ENOSPC in xberg-native-pdf,
        # PR #1561: a dependency refresh rebuilds most of the graph beside
        # the cached copy). Bounded and NON-FATAL, as in ci-rust.yml: a
        # refused rm only warns, and the build then fails honestly on ENOSPC.
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            || echo "::warning::could not remove every preinstalled toolchain; continuing"
          df -h / | tail -1

      # No target cache here: the cache budget has no room for one
      # (scripts/ci/cache-budget.json). What it does hold is cargo's git
      # database. code-parsers pins two tree-sitter grammars by git rev, and
      # cargo clones each repository's whole history to read one commit: 240 MB,
      # 4m10s of every cold libs/rust job (job 137376497651). Trimmed to the
      # pinned commits (scripts/ci/trim-cargo-cache.mjs) it is a few MB, and
      # cargo then finds the rev in it and fetches nothing. The key is the
      # manifest that pins the revs; a prefix restore still holds every commit
      # that did not move. The path is literal and `~/`, as every reader spells
      # it (scripts/ci/check-cache-path-parity.mjs); on eng-runner ~/.cargo is
      # the link eng-runner-env makes to CARGO_HOME.
      - name: Restore cargo's git database
        id: gitdb
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/git/db
          key: cargo-git-db-v1-${{ runner.os }}-${{ hashFiles('libs/rust/code-parsers/Cargo.toml') }}
          restore-keys: cargo-git-db-v1-${{ runner.os }}-

      # Every lockfile that links code-parsers locks the commits its manifest
      # pins (the key hashes that manifest), so a restored database holds
      # them. A git fetch after a restore means it did not: a warning, since
      # the leg is then only as slow as it was.
      - name: Fetch the crates and the git dependencies
        env:
          RESTORED: ${{ steps.gitdb.outputs.cache-matched-key }}
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo fetch --locked 2>&1 | tee "${RUNNER_TEMP}/cargo-fetch.log"
          echo "cargo fetch: $(( $(date +%s) - start ))s; git database restored from: ${RESTORED:-nothing}"
          if [ -n "${RESTORED}" ] && grep -q 'Updating git repository' "${RUNNER_TEMP}/cargo-fetch.log"; then
            echo "::warning::cargo cloned a git dependency although its database was restored from ${RESTORED}; see scripts/ci/trim-cargo-cache.mjs"
          fi

      - name: Tests
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # Unquoted on purpose: the leg's package and feature flags.
          # shellcheck disable=SC2086
          cargo test --locked ${ARGS}

      # Main only, after the tests whatever they did: the git database is as
      # good after a red test as after a green one.
      - name: Trim cargo's git database to the pinned commits
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.git-db-writer == 'true' && steps.gitdb.outputs.cache-hit != 'true' }}
        working-directory: .
        run: node scripts/ci/trim-cargo-cache.mjs --lock libs/rust/Cargo.lock
      - name: Save cargo's git database
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.git-db-writer == 'true' && steps.gitdb.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/git/db
          key: cargo-git-db-v1-${{ runner.os }}-${{ hashFiles('libs/rust/code-parsers/Cargo.toml') }}
