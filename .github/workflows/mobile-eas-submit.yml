# Manual EAS Submit of a finished apps/elitea-mobile production build to TestFlight
# (iOS) and the Play internal testing track (Android),
# apps/elitea-mobile/docs/release.md "Submit".
#
# Needs the EXPO_TOKEN repository secret, and on EAS: the App Store Connect API
# key and the Google Play service account key (`eas credentials`), plus
# submit.production.ios.ascAppId in eas.json once the App Store Connect app exists.
name: Mobile EAS submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, all]
        default: ios
      build_id:
        description: "EAS build id to submit (empty: the latest production build of each platform)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-eas-submit-${{ inputs.platform }}
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: 24.12.0

jobs:
  submit:
    name: EAS submit (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/elitea-mobile
    steps:
      - name: Require the EXPO_TOKEN secret
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is not set (apps/elitea-mobile/docs/release.md, 'GitHub Actions secret')."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # Stated, not defaulted (scripts/ci/check-workflow-cache-writes.mjs).
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: ${{ env.EAS_CLI_VERSION }}
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Project is linked and the stores are configured
        env:
          PLATFORM: ${{ inputs.platform }}
        run: node scripts/eas-preflight.mjs submit "$PLATFORM"

      - name: Submit
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [ -n "$BUILD_ID" ]; then
            if ! [[ "$BUILD_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "::error::build_id must be an EAS build id (UUID)."
              exit 1
            fi
            if [ "$PLATFORM" = "all" ]; then
              echo "::error::A build id belongs to one platform: pick ios or android."
              exit 1
            fi
            target=(--id "$BUILD_ID")
          else
            target=(--latest)
          fi
          eas submit --profile production --platform "$PLATFORM" "${target[@]}" --non-interactive
