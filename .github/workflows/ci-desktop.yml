name: CI — Desktop client

# apps/elitea-desktop (ADR-0029 decision 9): the Tauri host and the elitea-web
# `desktop` build mode it bundles. ONE job on macOS (the first platform), plus
# `pane-drivers` (Windows and Linux: the browser pane's drivers, #1593) and
# `windows-host` (the host and the local tools on Windows, #1828): the
# organisation is on the GitHub free plan with a 20-concurrent-job cap, and a
# macOS minute costs ten Linux ones, so this is deliberately a single cached job
# that does the cheap, decisive work — Rust format, lint and tests for the host,
# the web unit tests that pin the desktop transport, and the desktop web build
# the host embeds. It does NOT build a signed bundle; that is a release step
# (apps/elitea-desktop/README.md, "Release signing").
#
# Path-filtered (scripts/ci/tier-paths.json `ci-desktop`): the host, the Rust
# libraries it links, the brand, the toolchain, and of elitea-web only what the
# host itself reads: the desktop entry (its i18n catalogues are read by the
# host's tests), the desktop transport, and the lockfile (the tsc that compiles
# the page scripts). The rest of apps/elitea-web/src, vite.config.ts and
# libs/ts/client-core reach the desktop only through the bundle, and ci-web.yml
# `build` builds that bundle on every web change (ELITEA and brand/sample) on
# the self-hosted pool. Before 2026-11-23 every web change also started this
# workflow's four hosted jobs (macOS, two Windows, one Linux) to build the same
# bundle; four of the five macOS jobs GitHub never acquired that day were
# web-only changes.
#
# A macOS job GitHub never gives a runner gets ONE second attempt
# (`host-runner`, `desktop-second-attempt`), and `verdict` is what ci-gate
# reads (docs/contributing/ci.md, "A job GitHub never acquired").

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
    outputs:
      verdict:
        description: >-
          `pass` when every job passed, or the macOS host was never acquired
          by a runner and its second attempt ran and passed; `fail`
          otherwise; empty when the verdict job did not run. ci.yml's ci-gate
          reads it (scripts/ci/ci-gate.mjs).
        value: ${{ jobs.verdict.outputs.verdict }}
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Host (fmt, clippy, tests) + desktop web build
    runs-on: macos-latest
    # The same commit takes 18 to 35 minutes on macOS runners, and a cold
    # rust-cache (a pull request that changes Cargo.lock) takes longer. A 40
    # minute cap cancelled a green run mid-compile (PR #1545). The cap costs
    # nothing on a fast run.
    timeout-minutes: 60
    # No debug info in the dev profile: the dev-profile target is what the
    # cache below keeps, and debug info is most of its size. Measured
    # 2026-11-20, the two targets' dependencies compressed: 2.29 GiB with line
    # tables, 1.17 GiB without (11.8 to 7.0 GiB on disk). A
    # failed assertion still names its file and line (that is the panic's
    # location, not debug info); only a backtrace loses its line numbers. desktop-package.yml's pull-request dry run sets the same
    # value, because the CARGO_* environment is part of the rust-cache key.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      # Before rust-cache: its key hashes `rustc -vV`, so the pinned toolchain
      # must be the one installed when it computes the key (as in
      # desktop-package.yml, the reader of this entry).
      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # Read everywhere, write on main only: this workflow's nightly is the one
      # writer. The entry keeps the dev-profile target (registry, git and the
      # compiled dependencies), so Clippy, the tests, the WebKit run and the
      # sample-brand build start warm. desktop-package.yml's pull-request
      # dry run restores the same entry (shared-key `desktop-host`); its size is
      # counted in scripts/ci/cache-budget.json. It restores before the web
      # steps: its key is the lockfiles, the toolchain and the CARGO_*
      # environment, none of which they change.
      - name: Cache cargo registry and build artefacts
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          # v1 (2026-11-23): the trim step at the end of this job runs only on
          # a run that saves, and an exact hit never saves, so the untrimmed
          # v0 entry would have stayed for as long as Cargo.lock did. The new
          # prefix makes the next nightly write a trimmed entry; the v0 one is
          # deleted. desktop-package.yml's reader spells the same prefix.
          prefix-key: v1-rust
          shared-key: desktop-host
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/elitea-desktop/src-tauri
            apps/elitea-desktop/doc-extract-sidecar

      # The web bundle, the brand overlay, fmt, Clippy, the tests, the
      # serde_json guard and the document sidecar: one definition for both
      # attempts.
      - uses: ./.github/actions/desktop-host-checks

      # The browser driver against a real WKWebView (#1589): the conformance
      # kit, a cross-origin frame, the driver world's isolation from the page
      # and the untrusted-input refusal. It opens one window; the macOS
      # runner has a logged-in session for it.
      - name: Browser driver on WebKit
        working-directory: apps/elitea-desktop/src-tauri
        timeout-minutes: 5
        # -p on purpose: the driver alone, without the `tauri` feature the host
        # turns on, so this also proves that build (a small rebuild of the driver).
        run: cargo test --locked -p elitea-browser-driver-macos --test webkit -- --ignored

      # The last step, on a run that saves (main, no exact hit): rust-cache's
      # post step saves what is left. Cargo's git database goes down to the
      # commits the two lockfiles pin (the tree-sitter grammars' histories,
      # ~0.23 GiB of this entry), and the build scripts' object files go
      # (scripts/ci/trim-cargo-cache.mjs says why both are safe).
      - name: Trim the cache entry before rust-cache saves it
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: >-
          node scripts/ci/trim-cargo-cache.mjs
          --lock apps/elitea-desktop/src-tauri/Cargo.lock apps/elitea-desktop/doc-extract-sidecar/Cargo.lock
          --target apps/elitea-desktop/src-tauri/target apps/elitea-desktop/doc-extract-sidecar/target

  # GitHub gives a hosted job three tries at a runner, five minutes apart, and
  # then ends it as cancelled with "The job was not acquired by Runner of type
  # hosted even after multiple attempts" and no step run. On 2026-11-23 that
  # ended the macOS host five times (the macOS arm64 pool, by GitHub's own
  # notice "Due to capacity constraints, jobs targeting macOS arm64 runners may
  # experience longer queue times"), while none of our macOS jobs was running.
  # That is not a result: nothing ran. This job reads the API and says whether
  # it happened (scripts/ci/runner-acquired.mjs: no runner, no step, and that
  # annotation). A job that ran and failed, timed out, or was cancelled by a
  # newer push is not "never acquired", and gets no second attempt.
  #
  # `always()`, not `!cancelled()`, on this job and the two below: GitHub ends
  # the never-acquired job as CANCELLED, and whether `cancelled()` then reads
  # true for the run is not documented. Run cancellation (a newer push) is
  # told apart by the probe instead: that job's annotation is "Canceling since
  # a higher priority waiting request ... exists", so `not-acquired` is false
  # and no second attempt starts.
  host-runner:
    name: Was the macOS host job ever given a runner?
    needs: [desktop]
    if: ${{ always() && (needs.desktop.result == 'failure' || needs.desktop.result == 'cancelled') }}
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      # This run's jobs, and the annotations of the host's check run.
      actions: read
      checks: read
    outputs:
      not-acquired: ${{ steps.probe.outputs.not-acquired }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The local action below must be in the checkout too.
          sparse-checkout: |
            scripts/ci
            .github/actions/eng-runner-env
          persist-credentials: false
      # eng-runner: caches and TMPDIR on the work volume, and node (none in its
      # image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      - id: probe
        run: node scripts/ci/runner-acquired.mjs probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The desktop job's name; in a called workflow the API prefixes it with the caller's job.
          JOB_NAME: Host (fmt, clippy, tests) + desktop web build

  # The second and last attempt, only when the first was never acquired. The
  # same steps (.github/actions/desktop-host-checks and the WebKit run), the
  # same cache entry read, never written (one writer per key:
  # scripts/ci/check-cache-budget.mjs). It holds a macOS slot only in place of
  # the one the first attempt never got.
  desktop-second-attempt:
    name: Host (fmt, clippy, tests) + desktop web build — second attempt (the first got no runner)
    needs: [host-runner]
    if: ${{ always() && needs.host-runner.outputs.not-acquired == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
      - name: Restore the cargo registry and build artefacts (the first attempt's entry)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: desktop-host
          save-if: false
          workspaces: |
            apps/elitea-desktop/src-tauri
            apps/elitea-desktop/doc-extract-sidecar
      - uses: ./.github/actions/desktop-host-checks
      - name: Browser driver on WebKit
        working-directory: apps/elitea-desktop/src-tauri
        timeout-minutes: 5
        run: cargo test --locked -p elitea-browser-driver-macos --test webkit -- --ignored

  # This workflow's verdict for ci.yml's ci-gate (the `verdict` output). A job
  # GitHub never acquired leaves the workflow's own result failed even when its
  # second attempt passed, so the gate reads this instead: `pass` only when
  # every job passed, or the macOS host was never acquired and its second
  # attempt ran and passed. Never `pass` for a job that did not run. `needs`
  # lists every other job of this workflow (runner-acquired.test.mjs holds it).
  verdict:
    name: Desktop verdict
    needs: [desktop, host-runner, desktop-second-attempt, pane-drivers, windows-host]
    if: ${{ always() }}
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The local action below must be in the checkout too.
          sparse-checkout: |
            scripts/ci
            .github/actions/eng-runner-env
          persist-credentials: false
      # eng-runner: caches and TMPDIR on the work volume, and node (none in its
      # image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      - id: verdict
        run: node scripts/ci/runner-acquired.mjs verdict
        env:
          NEEDS: ${{ toJSON(needs) }}

  # The browser pane's Windows and Linux drivers (ADR-0048 decision 6,
  # #1593). The macOS job above is the one that builds and tests the whole
  # host; this job checks that the host and its pane drivers BUILD on the
  # other two systems (clippy on the workspace on Linux; on Windows the pane
  # driver crates only, see the matrix), runs the pane's unit tests there, and runs each system's real-engine conformance run: the WebView2
  # bridge with the cloud CdpDriver on Windows, WebKitGTK under xvfb (X11, so
  # the XTEST trusted-input fallback is on) on Linux. Not the full host suite:
  # that is the macOS job's, and the host's other modules are unchanged here.
  # The web bundle is a stub (the tests render nothing); `npm ci` is for the
  # pinned tsc the page scripts are compiled with (browser-driver-dom). It
  # builds with no brand overlay: the neutral tauri.conf.json, brand/sample
  # (ADR-0052 decision 4), so the sample brand compiles in CI as well.
  pane-drivers:
    name: Browser pane drivers — ${{ matrix.os }} (clippy, tests, real engine)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows lints and tests the pane driver crates only here: the
        # `windows-host` job below lints and tests the host and the local
        # tools on Windows (#1828). Linux builds the whole host.
        include:
          - os: windows-latest
            clippy: -p elitea-browser-driver-dom -p elitea-browser-driver-windows
            tests: -p elitea-browser-driver-dom -p elitea-browser-driver-windows
            host_tests: false
            engine_run: cargo test --locked -p elitea-browser-driver-windows --test webview2 -- --ignored
          - os: ubuntu-latest
            clippy: --workspace
            tests: -p elitea-browser-driver-dom -p elitea-browser-driver-windows -p elitea-browser-driver-linux
            host_tests: true
            engine_run: xvfb-run -a cargo test --locked -p elitea-browser-driver-linux --test webkitgtk -- --ignored
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      # Linux only: on Windows `npm config get cache` answers a backslash
      # path, which main-write-cache's literal-path guard (written for
      # $HOME/.npm) refuses. The cache only speeds `npm ci` up; Windows runs it
      # cold rather than teaching the shared guard a second path spelling.
      - name: Restore the npm cache (pull requests read, main writes)
        if: runner.os == 'Linux'
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      - name: Install web (locked, for tsc)
        working-directory: apps/elitea-web
        # The npm-cache step sets these for Linux; Windows fetches cold, so it
        # needs the same patience with the registry.
        env:
          NPM_CONFIG_FETCH_RETRIES: "6"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: npm ci

      - name: The embedded web bundle is a stub (the tests render nothing)
        run: |
          mkdir -p apps/elitea-web/dist-desktop
          printf '<!doctype html><title>stub</title>' > apps/elitea-web/dist-desktop/index.html

      - name: Host build dependencies (Tauri on Linux, and a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config xvfb

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # No cargo cache here (scripts/ci/cache-budget.json, measured 2026-11-20): a
      # registry-only entry is 0.3-0.6 GiB of the 10 GB cap and saves about the
      # time cargo takes to fetch the crates. The budget goes to target caches.

      - name: Run Clippy (Linux the host and every pane driver, Windows its drivers)
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo clippy --locked ${{ matrix.clippy }} --all-targets -- -D warnings

      - name: Pane driver tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked ${{ matrix.tests }}

      - name: The host's pane tests
        if: matrix.host_tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked -p elitea-desktop --lib browser_

      # The conformance kit, the rules' reads and a page that takes real
      # input only, against the system's own engine. It opens one window.
      - name: Pane driver on the system's engine
        working-directory: apps/elitea-desktop/src-tauri
        timeout-minutes: 10
        run: ${{ matrix.engine_run }}

  # The host and the local tools on Windows (#1828): the OS layer of
  # elitea-local-tools (src/sys: Job Objects, ConPTY, no mode bits) and the
  # host's Windows paths (the toast AUMID, no owner checks). Clippy for the
  # host and for local-tools, local-index and workspace-store in the libs
  # workspace, then their tests. The tests that need Unix files (mode bits,
  # symlinks, /bin/sh, git hooks) are Unix-only; the macOS job and
  # ci-local-tools-macos.yml run them. Windows has no OS sandbox here: a
  # confined command is refused (crate::sandbox), so no test runs one. The
  # web bundle is a stub and the build has no brand overlay, as pane-drivers.
  windows-host:
    name: Host + local tools — windows-latest (clippy, tests)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install web (locked, for tsc)
        working-directory: apps/elitea-web
        env:
          NPM_CONFIG_FETCH_RETRIES: "6"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: npm ci

      - name: The embedded web bundle is a stub (the tests render nothing)
        run: |
          mkdir -p apps/elitea-web/dist-desktop
          printf '<!doctype html><title>stub</title>' > apps/elitea-web/dist-desktop/index.html

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # No cargo cache here (scripts/ci/cache-budget.json, measured 2026-11-20): a
      # registry-only entry is 0.3-0.6 GiB of the 10 GB cap and saves about the
      # time cargo takes to fetch the crates. The budget goes to target caches.

      - name: Run Clippy (host)
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo clippy --locked -p elitea-desktop --all-targets -- -D warnings

      - name: Run Clippy (local tools, local index, workspace store)
        working-directory: libs/rust
        run: >
          cargo clippy --locked -p elitea-local-tools --features handoff
          -p elitea-local-index -p elitea-workspace-store --all-targets -- -D warnings

      - name: Run tests (host)
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked -p elitea-desktop --all-targets

      - name: Run tests (local tools, local index, workspace store)
        working-directory: libs/rust
        run: >
          cargo test --locked -p elitea-local-tools --features handoff
          -p elitea-local-index -p elitea-workspace-store --all-targets
