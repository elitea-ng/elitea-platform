name: CI — Desktop client

# apps/elitea-desktop (ADR-0029 decision 9): the Tauri host and the elitea-web
# `desktop` build mode it bundles. ONE job on macOS (the first platform), plus
# `pane-drivers` (Windows and Linux: the browser pane's drivers, #1593): the
# organisation is on the GitHub free plan with a 20-concurrent-job cap, and a
# macOS minute costs ten Linux ones, so this is deliberately a single cached job
# that does the cheap, decisive work — Rust format, lint and tests for the host,
# the web unit tests that pin the desktop transport, and the desktop web build
# the host embeds. It does NOT build a signed bundle; that is a release step
# (apps/elitea-desktop/README.md, "Release signing").
#
# Path-filtered: the desktop bundle embeds the whole elitea-web app (the shell
# imports `App`), so any change under apps/elitea-web/src can break it; the filter
# covers all of it, still as one job. ci-web.yml gates the same files for the web.

on:
  pull_request:
    paths:
      # The pin every cargo step asserts (scripts/ci/assert-rust-toolchain.sh).
      - "rust-toolchain.toml"
      - "scripts/ci/assert-rust-toolchain.sh"
      - "apps/elitea-desktop/**"
      # The brand the build is made for (ADR-0052 decision 4): its manifest and
      # assets, and the loader the overlay generator reads them with.
      - "brand/**"
      - "scripts/brand/**"
      - "scripts/ci/brand-output-scan.mjs"
      # The host links the shared runtime, the local tools and the /llm
      # contract (ADR-0029 D0), and their path dependencies.
      - "libs/rust/agent-runtime/**"
      - "libs/rust/local-tools/**"
      - "libs/rust/workspace-store/**"
      - "libs/rust/llm-wire/**"
      - "libs/rust/content-source/**"
      # The browser tool contract the pane driver implements (ADR-0048).
      - "libs/rust/browser-tools/**"
      # The cloud browser's CDP driver the Windows pane drives WebView2 with
      # (ADR-0048 decision 6, #1593).
      - "libs/rust/browser-session/**"
      # The desktop control driver the computer toolset drives (ADR-0047)
      # and the vendored agent-desktop crates it is built on.
      - "libs/rust/desktop-control/**"
      - "libs/rust/vendor/agent-desktop/**"
      # The runtime's internal tool client (#1359): platform-rpc and the
      # contracts its build.rs compiles.
      - "libs/rust/platform-rpc/**"
      - "libs/proto/elitea/runtime/v1/artifact_object.proto"
      - "libs/proto/elitea/runtime/v1/internal_tool.proto"
      # The agent runtime compiles in the tool category contract (ADR-0041
      # decision 5).
      - "libs/proto/contracts/**"
      # The provider clients the toolkit families share (ADR-0030 decision 3).
      - "libs/rust/connectors/**"
      - "libs/rust/doc-extract/**"
      # The local workspace index (ADR-0029 decision 7) links the Inventory
      # core's parsers and Python-compatible text; both crates keep
      # `preserve_order` out of their normal dependencies for this host.
      - "libs/rust/engine-core/**"
      - "libs/rust/code-parsers/**"
      - "libs/rust/inventory-core/**"
      - "libs/rust/local-index/**"
      # The index tools mirror the cloud Inventory descriptor; a drift test reads it.
      - "services/elitea-subapp-host/internal/apps/inventory/descriptor.json"
      - "libs/rust/vendor/adk-agent/**"
      - "libs/rust/vendor/adk-runner/**"
      - "apps/elitea-web/src/**"
      - "apps/elitea-web/vite.config.ts"
      - "apps/elitea-web/package.json"
      - "apps/elitea-web/package-lock.json"
      # The shared client package the web bundle compiles from source.
      - "libs/ts/client-core/**"
      - ".github/workflows/ci-desktop.yml"
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Host (fmt, clippy, tests) + desktop web build
    runs-on: macos-latest
    # The same commit takes 18 to 35 minutes on macOS runners, and a cold
    # rust-cache (a pull request that changes Cargo.lock) takes longer. A 40
    # minute cap cancelled a green run mid-compile (PR #1545). The cap costs
    # nothing on a fast run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # The desktop web build comes first: `tauri::generate_context!` embeds
      # `frontendDist` (apps/elitea-web/dist-desktop) at compile time, so the
      # Rust steps below cannot even compile without it. The macOS browser
      # driver's build.rs compiles js/driver.ts with this install's tsc
      # (apps/elitea-web/node_modules/.bin/tsc), so a type error there fails
      # Clippy and the tests below; no JavaScript is committed to diff.
      - name: Install web (locked)
        working-directory: apps/elitea-web
        run: npm ci

      - name: Desktop transport unit tests (bearer, refresh, fetch SSE, host bridge)
        working-directory: apps/elitea-web
        run: >
          npx vitest run --config vitest.config.ts --project node
          src/shared/desktop src/shared/api/http src/shared/api/sse

      - name: Build the desktop web bundle
        working-directory: apps/elitea-web
        run: npm run build:desktop

      # The ELITEA build (ADR-0052 decision 4): the brand overlay, exported as
      # TAURI_CONFIG for every cargo step below (tauri-build and
      # generate_context! read it). The pane-drivers job builds without it, so
      # the neutral tauri.conf.json (brand/sample) compiles and passes too.
      - name: Brand overlay (brand/elitea) and its tests
        working-directory: apps/elitea-desktop
        run: |
          npm run test:scripts
          node scripts/tauri-brand.mjs --github-env

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # Read everywhere, write on main only: a pull request's target directory
      # is a large part of the repository's 10 GB Actions cache, duplicated per
      # branch (the same policy as ci-rust.yml).
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/elitea-desktop/src-tauri
            apps/elitea-desktop/doc-extract-sidecar

      - name: Check formatting
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: apps/elitea-desktop/src-tauri
        # --workspace: the macOS browser driver (browser-driver-macos) is a
        # member of this workspace, not the default member.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The flow tests bind loopback ports and run an in-process deployment; the
      # keychain is a mock, so a runner with no login keychain is fine.
      - name: Run tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked --workspace --all-targets

      # The browser driver against a real WKWebView (#1589): the conformance
      # kit, a cross-origin frame, the driver world's isolation from the page
      # and the untrusted-input refusal. It opens one window; the macOS
      # runner has a logged-in session for it.
      - name: Browser driver on WebKit
        working-directory: apps/elitea-desktop/src-tauri
        timeout-minutes: 5
        run: cargo test --locked -p elitea-browser-driver-macos --test webkit -- --ignored

      # The host never links the document extractor: xberg turns on
      # serde_json `preserve_order` (ADR-0029 decision 2). A feature in the
      # host's own graph would fail the guard test above at runtime; this
      # fails it at the source, naming the dependent. `-e normal` leaves out
      # build dependencies (tauri-build and a grammar's build script turn the
      # feature on for themselves; none of that is linked into the app).
      - name: The host does not turn on serde_json preserve_order
        working-directory: apps/elitea-desktop/src-tauri
        run: |
          tree="$(cargo tree --locked -e normal,features -i serde_json)"
          if printf '%s\n' "$tree" | grep -q 'preserve_order'; then
            printf '%s\n' "$tree"
            echo "::error::serde_json/preserve_order is enabled in the desktop host's graph; documents are extracted by apps/elitea-desktop/doc-extract-sidecar"
            exit 1
          fi

      # The document sidecar (ADR-0029 decision 4): its own workspace and
      # lockfile, so its xberg stays out of the host. Built and tested here;
      # the release job bundles it as the app's externalBin.
      - name: Document sidecar (fmt, clippy, tests)
        working-directory: apps/elitea-desktop/doc-extract-sidecar
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      # The local workspace index the host links (ADR-0029 decision 7): its
      # own tests (the shared GraphStore conformance suite over SQLite, the
      # folder source, owner-only files) run in the libs workspace, built
      # alone so serde_json's `preserve_order` stays off as in the host.
      - name: Local index (fmt, clippy, tests)
        working-directory: libs/rust
        run: |
          cargo fmt -p elitea-local-index -- --check
          cargo clippy --locked -p elitea-local-index --all-targets -- -D warnings
          cargo test --locked -p elitea-local-index --all-targets

      # ADR-0052 W4: built for brand/sample, the host binary (read through its
      # strings, a debug build: the cache above is warm for it) and its overlay
      # show no ELITEA word or identifier (scripts/ci/brand-output-scan.mjs).
      # Last, because it rebuilds the web bundle and the overlay for the sample
      # brand. No sidecar: only tauri.sidecar.conf.json (the release) names it.
      - name: Sample-brand output scan (host binary + overlay)
        env:
          ELITEA_BRAND: sample
        run: |
          set -euo pipefail
          npm --prefix apps/elitea-web run build:desktop
          (cd apps/elitea-desktop && node scripts/tauri-brand.mjs)
          cd apps/elitea-desktop/src-tauri
          TAURI_CONFIG="$(cat tauri.brand.json)" cargo build --locked -p elitea-desktop --bin elitea-desktop
          node "${GITHUB_WORKSPACE}/scripts/ci/brand-output-scan.mjs" --lane desktop target/debug/elitea-desktop tauri.brand.json

  # The browser pane's Windows and Linux drivers (ADR-0048 decision 6,
  # #1593). The macOS job above is the one that builds and tests the whole
  # host; this job checks that the host and its pane drivers BUILD on the
  # other two systems (clippy on the workspace on Linux; on Windows the pane
  # driver crates only, see the matrix), runs the pane's unit tests there, and runs each system's real-engine conformance run: the WebView2
  # bridge with the cloud CdpDriver on Windows, WebKitGTK under xvfb (X11, so
  # the XTEST trusted-input fallback is on) on Linux. Not the full host suite:
  # that is the macOS job's, and the host's other modules are unchanged here.
  # The web bundle is a stub (the tests render nothing); `npm ci` is for the
  # pinned tsc the page scripts are compiled with (browser-driver-dom). It
  # builds with no brand overlay: the neutral tauri.conf.json, brand/sample
  # (ADR-0052 decision 4), so the sample brand compiles in CI as well.
  pane-drivers:
    name: Browser pane drivers — ${{ matrix.os }} (clippy, tests, real engine)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows lints and tests the pane driver crates only: the host links
        # elitea-local-tools, which is Unix-only today (PTY sessions, file
        # descriptors, rustix), so the host itself does not build on Windows
        # until the Windows desktop build (#1697) ports it. Linux builds the
        # whole host.
        include:
          - os: windows-latest
            clippy: -p elitea-browser-driver-dom -p elitea-browser-driver-windows
            tests: -p elitea-browser-driver-dom -p elitea-browser-driver-windows
            host_tests: false
            engine_run: cargo test --locked -p elitea-browser-driver-windows --test webview2 -- --ignored
          - os: ubuntu-latest
            clippy: --workspace
            tests: -p elitea-browser-driver-dom -p elitea-browser-driver-windows -p elitea-browser-driver-linux
            host_tests: true
            engine_run: xvfb-run -a cargo test --locked -p elitea-browser-driver-linux --test webkitgtk -- --ignored
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      # Linux only: on Windows `npm config get cache` answers a backslash
      # path, which main-write-cache's literal-path guard (written for
      # $HOME/.npm) refuses. The cache only speeds `npm ci` up; Windows runs it
      # cold rather than teaching the shared guard a second path spelling.
      - name: Restore the npm cache (pull requests read, main writes)
        if: runner.os == 'Linux'
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      - name: Install web (locked, for tsc)
        working-directory: apps/elitea-web
        # The npm-cache step sets these for Linux; Windows fetches cold, so it
        # needs the same patience with the registry.
        env:
          NPM_CONFIG_FETCH_RETRIES: "6"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
        run: npm ci

      - name: The embedded web bundle is a stub (the tests render nothing)
        run: |
          mkdir -p apps/elitea-web/dist-desktop
          printf '<!doctype html><title>stub</title>' > apps/elitea-web/dist-desktop/index.html

      - name: Host build dependencies (Tauri on Linux, and a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config xvfb

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: apps/elitea-desktop/src-tauri
          prefix-key: pane-drivers

      - name: Run Clippy (Linux the host and every pane driver, Windows its drivers)
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo clippy --locked ${{ matrix.clippy }} --all-targets -- -D warnings

      - name: Pane driver tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked ${{ matrix.tests }}

      - name: The host's pane tests
        if: matrix.host_tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked -p elitea-desktop --lib browser_

      # The conformance kit, the rules' reads and a page that takes real
      # input only, against the system's own engine. It opens one window.
      - name: Pane driver on the system's engine
        working-directory: apps/elitea-desktop/src-tauri
        timeout-minutes: 10
        run: ${{ matrix.engine_run }}
