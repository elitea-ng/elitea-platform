name: CI — Desktop client

# apps/elitea-desktop (ADR-0029 decision 9): the Tauri host and the elitea-web
# `desktop` build mode it bundles. ONE job on macOS (the first platform): the
# organisation is on the GitHub free plan with a 20-concurrent-job cap, and a
# macOS minute costs ten Linux ones, so this is deliberately a single cached job
# that does the cheap, decisive work — Rust format, lint and tests for the host,
# the web unit tests that pin the desktop transport, and the desktop web build
# the host embeds. It does NOT build a signed bundle; that is a release step
# (apps/elitea-desktop/README.md, "Release signing").
#
# Path-filtered: the desktop bundle embeds the whole elitea-web app (the shell
# imports `App`), so any change under apps/elitea-web/src can break it; the filter
# covers all of it, still as one job. ci-web.yml gates the same files for the web.

on:
  pull_request:
    paths:
      # The pin every cargo step asserts (scripts/ci/assert-rust-toolchain.sh).
      - "rust-toolchain.toml"
      - "scripts/ci/assert-rust-toolchain.sh"
      - "apps/elitea-desktop/**"
      # The host links the shared runtime, the local tools and the /llm
      # contract (ADR-0029 D0), and their path dependencies.
      - "libs/rust/agent-runtime/**"
      - "libs/rust/local-tools/**"
      - "libs/rust/workspace-store/**"
      - "libs/rust/llm-wire/**"
      - "libs/rust/content-source/**"
      # The runtime's internal tool client (#1359): platform-rpc and the
      # contracts its build.rs compiles.
      - "libs/rust/platform-rpc/**"
      - "libs/proto/elitea/runtime/v1/artifact_object.proto"
      - "libs/proto/elitea/runtime/v1/internal_tool.proto"
      # The agent runtime compiles in the tool category contract (ADR-0041
      # decision 5).
      - "libs/proto/contracts/**"
      # The provider clients the toolkit families share (ADR-0030 decision 3).
      - "libs/rust/connectors/**"
      - "libs/rust/doc-extract/**"
      # The local workspace index (ADR-0029 decision 7) links the Inventory
      # core's parsers and Python-compatible text; both crates keep
      # `preserve_order` out of their normal dependencies for this host.
      - "libs/rust/engine-core/**"
      - "libs/rust/code-parsers/**"
      - "libs/rust/inventory-core/**"
      - "libs/rust/local-index/**"
      # The index tools mirror the cloud Inventory descriptor; a drift test reads it.
      - "services/elitea-subapp-host/internal/apps/inventory/descriptor.json"
      - "libs/rust/vendor/adk-agent/**"
      - "libs/rust/vendor/adk-runner/**"
      - "apps/elitea-web/src/**"
      - "apps/elitea-web/vite.config.ts"
      - "apps/elitea-web/package.json"
      - "apps/elitea-web/package-lock.json"
      # The shared client package the web bundle compiles from source.
      - "libs/ts/client-core/**"
      - ".github/workflows/ci-desktop.yml"
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Host (fmt, clippy, tests) + desktop web build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # The desktop web build comes first: `tauri::generate_context!` embeds
      # `frontendDist` (apps/elitea-web/dist-desktop) at compile time, so the
      # Rust steps below cannot even compile without it.
      - name: Install web (locked)
        working-directory: apps/elitea-web
        run: npm ci

      - name: Desktop transport unit tests (bearer, refresh, fetch SSE, host bridge)
        working-directory: apps/elitea-web
        run: >
          npx vitest run --config vitest.config.ts --project node
          src/shared/desktop src/shared/api/http src/shared/api/sse

      - name: Build the desktop web bundle
        working-directory: apps/elitea-web
        run: npm run build:desktop

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # Read everywhere, write on main only: a pull request's target directory
      # is a large part of the repository's 10 GB Actions cache, duplicated per
      # branch (the same policy as ci-rust.yml).
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            apps/elitea-desktop/src-tauri
            apps/elitea-desktop/doc-extract-sidecar

      - name: Check formatting
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # The flow tests bind loopback ports and run an in-process deployment; the
      # keychain is a mock, so a runner with no login keychain is fine.
      - name: Run tests
        working-directory: apps/elitea-desktop/src-tauri
        run: cargo test --locked --all-targets

      # The host never links the document extractor: xberg turns on
      # serde_json `preserve_order` (ADR-0029 decision 2). A feature in the
      # host's own graph would fail the guard test above at runtime; this
      # fails it at the source, naming the dependent. `-e normal` leaves out
      # build dependencies (tauri-build and a grammar's build script turn the
      # feature on for themselves; none of that is linked into the app).
      - name: The host does not turn on serde_json preserve_order
        working-directory: apps/elitea-desktop/src-tauri
        run: |
          tree="$(cargo tree --locked -e normal,features -i serde_json)"
          if printf '%s\n' "$tree" | grep -q 'preserve_order'; then
            printf '%s\n' "$tree"
            echo "::error::serde_json/preserve_order is enabled in the desktop host's graph; documents are extracted by apps/elitea-desktop/doc-extract-sidecar"
            exit 1
          fi

      # The document sidecar (ADR-0029 decision 4): its own workspace and
      # lockfile, so its xberg stays out of the host. Built and tested here;
      # the release job bundles it as the app's externalBin.
      - name: Document sidecar (fmt, clippy, tests)
        working-directory: apps/elitea-desktop/doc-extract-sidecar
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      # The local workspace index the host links (ADR-0029 decision 7): its
      # own tests (the shared GraphStore conformance suite over SQLite, the
      # folder source, owner-only files) run in the libs workspace, built
      # alone so serde_json's `preserve_order` stays off as in the host.
      - name: Local index (fmt, clippy, tests)
        working-directory: libs/rust
        run: |
          cargo fmt -p elitea-local-index -- --check
          cargo clippy --locked -p elitea-local-index --all-targets -- -D warnings
          cargo test --locked -p elitea-local-index --all-targets
