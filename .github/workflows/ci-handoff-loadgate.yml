name: CI — Handoff load gate

# ADR-0034 decision 15: 1,000 cloud turns publishing to the workspace store
# show a p99 publish time under 50 ms, no growth in Main's database
# connections and no lock waits between threads. GATED at 300 publishes per
# second (owner decision 2026-10-15): one thread per project, same-thread
# contention, and 20 threads per project. Run and logged to the job summary,
# not gated: 1,000 per second and the all-at-once burst. The test is behind
# the `loadgate` build tag (a measurement, not a unit test), so ci-go.yml
# never runs it; this job does, against a real PostgreSQL.
#
# The job fails when the tests did not RUN: a missing ELITEA_TEST_DATABASE_URL
# makes them t.Skip, and a skip must not read as a pass.

on:
  pull_request:
    paths:
      - "services/elitea-main/internal/application/workspacestore/**"
      - "services/elitea-main/internal/application/workspacehandoff/**"
      - "services/elitea-main/internal/infra/db/repos/workspace_*"
      - "services/elitea-main/migrations/shared/**"
      - ".github/workflows/ci-handoff-loadgate.yml"
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "59 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-handoff-loadgate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loadgate:
    name: Handoff publish load gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Plain PostgreSQL 18 (Debian 13), the server every deployment runs:
        # the repos package's migrated template needs no extension.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      # The shared runner's disk stalls on WAL fsync (LWLock:WALWrite and
      # IO:WALSync dominate the failed runs, with no lock or pool waits), so
      # the gate measured the runner, not the code. This container only, never
      # a production setting: commits stop waiting for the flush; the locks,
      # the pool and the queries under test are unchanged.
      - name: Commit without waiting for the WAL flush (this job's database only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "SELECT pg_reload_conf()"
          test "$(psql -h localhost -U postgres -Atc 'SHOW synchronous_commit')" = off

      - name: Run the load gate
        working-directory: services/elitea-main
        env:
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          # Main's pool size for the gate (ELITEA_DATABASE_MAX_CONNS allows
          # 1-64).
          ELITEA_LOADGATE_MAX_CONNS: "32"
          GOFLAGS: -count=1
        run: |
          set -uo pipefail
          # The step shell runs with -e: capture the status explicitly, or a
          # failing test exits the step before its output is printed.
          status=0
          go test -tags loadgate -run 'TestLoadGate' -v -timeout 15m ./internal/infra/db/repos/ > loadgate.log 2>&1 || status=$?
          cat loadgate.log
          # The numbers of every case, gated or not, go to the job summary,
          # pass or fail.
          {
            echo '### Handoff publish load gate'
            echo 'Gated at 300/s: p99 < 50 ms, no row lock waits between threads, no pool growth.'
            echo 'Logged, not gated: 1,000/s and the all-at-once burst.'
            echo '```'
            grep -E 'n=[0-9]+ wall=|pool in window|non-lock waits' loadgate.log | sed -E 's/^.*_test\.go:[0-9]+: //'  || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # Every case must have RUN and passed; a skip is a failure here.
          for name in 'TestLoadGatePublishesAcrossThreads/sustained_300_cold' 'TestLoadGatePublishesAcrossThreads/sustained_300' 'TestLoadGatePublishesAcrossThreads/sustained_1000' 'TestLoadGatePublishesAcrossThreads/burst' 'TestLoadGateSameThreadContention' 'TestLoadGateSameProjectQuota'; do
            if ! grep -q -- "--- PASS: ${name} " loadgate.log; then
              echo "::error::${name} did not run and pass"
              exit 1
            fi
          done
          if grep -q -- '--- SKIP' loadgate.log; then
            echo "::error::a load gate case was skipped"
            exit 1
          fi
