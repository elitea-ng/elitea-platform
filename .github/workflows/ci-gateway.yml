name: CI — Gateway

# elitea-llm-gateway is a STANDALONE Go module, deliberately excluded from the
# root go.work. It therefore needs its own CI job, built with GOWORK=off so the
# workspace is never consulted. Since 2026-10 it is also on a DIFFERENT Go series
# from the workspace: github.com/maximhq/bifrost/core 1.13 requires go 1.27.3,
# while go.work and every other module stay on 1.26 (floor 1.26.9).
#
# THE PIN BELOW IS THE SERIES `1.27`, NOT A PATCH SUCH AS `1.27.3` (#506).
#
# services/elitea-llm-gateway/Containerfile builds from `golang:1.27-trixie`, so
# the released image takes each 1.27 patch. An exact patch pin here once tested
# the gateway on a toolchain the image no longer used: the scan in
# ci-image-scan.yml reported 9 HIGH findings against stdlib v1.26.4, all fixed
# in 1.26.6. A standard-library change that alters behaviour then reaches the
# release and never reaches the tests.
#
# `go 1.27.3` in go.mod states the MINIMUM the module needs. It is not a
# maximum. actions/setup-go reads "1.27" as the newest 1.27 patch, which is what
# the Containerfile does. scripts/ci/check-gateway-toolchain.sh holds the
# workflow, the Containerfile and go.mod together, and runs in the lint job.

on:
  pull_request:
    paths:
      - "services/elitea-llm-gateway/**"
      - ".github/workflows/ci-gateway.yml"
      # The toolchain gate below reads this workflow and the gateway
      # Containerfile. Both subjects are already named above; this line adds
      # the gate's OWN file, so an edit to the checker runs the checker (#518).
      - "scripts/ci/check-gateway-toolchain.sh"
      # The secured NATS permission test (#1076): the gateway imports
      # libs/go/natsconn through a replace, and its test runs the gateway's
      # real NATS client against the nats.conf the NATS chart renders, after
      # the real bootstrap.sh. A change to any of them must run it.
      - "libs/go/natsconn/**"
      # The bundled NATS server's permission table and the bootstrap script.
      - "deploy/helm/elitea/values.yaml"
      - "deploy/helm/elitea/values-nats-ha.yaml"
      - "deploy/helm/elitea/templates/nats/**"
      - "deploy/helm/elitea/Chart.lock"
      - "deploy/helm/elitea/build-deps.sh"
      - "deploy/helm/elitea/files/nats-bootstrap.sh"
      - "scripts/nats/**"
      # The guarded write-back UPSERT both writers must equal
      # (budget-writeback-guarded-upsert-v1.sql); the gateway half of the
      # parity gate must run on a contract-only change.
      - "libs/proto/contracts/**"
      # The GatewayService contract and its generated Go code (#1359): the
      # gateway imports libs/proto/gen/go through a replace.
      - "libs/proto/elitea/gateway/**"
      - "libs/proto/gen/go/**"
      # The shipped DDL the gateway's Postgres integration tests apply.
      - "services/elitea-main/migrations/shared/**"
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "11 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Standalone module: never resolve the parent workspace.
  GOWORK: "off"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/elitea-llm-gateway
    steps:
      - uses: actions/checkout@v7

      # The gateway must be TESTED on the toolchain it SHIPS (#506). The pin
      # below and services/elitea-llm-gateway/Containerfile are two files that
      # nothing compared, so they drifted: this workflow asked for the exact
      # patch 1.26.4 while the image had already moved to golang:1.26-alpine (now 1.27-trixie).
      # This step is the comparison. It runs BEFORE setup-go, so a disagreement
      # is reported instead of installed, and it needs no toolchain of its own.
      - name: The workflow pin matches the shipped toolchain
        working-directory: .
        run: bash scripts/ci/check-gateway-toolchain.sh

      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version: "1.27"
          # The series, at its latest patch: go.mod sets the floor (1.27.3,
          # bifrost/core's minimum), and the runner cache can lag behind it.
          check-latest: true
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-llm-gateway/go.sum
      # PINNED, as ci-go.yml pins it: `version: latest` made this gate a moving
      # target, and a new release redded main and every open gateway PR on
      # code nobody had touched (errcheck on `<-done`, 2026-10-16). Raise it
      # deliberately, together with ci-go.yml, after reading the release notes.
      #
      # THIS PIN DIFFERS FROM ci-go.yml ON PURPOSE. golangci-lint refuses a
      # module whose `go` directive is newer than the Go it was built with:
      # v2.9.0 is built with go1.26.0 and fails here with "the Go language
      # version (go1.26) used to build golangci-lint is lower than the targeted
      # Go version (1.27.3)". v2.15.0 is built with go1.27.0. The workspace
      # stays on 1.26, so ci-go.yml keeps v2.9.0 until it is raised on its own.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          # No `golangci-lint config verify`: it validates against a JSON
          # schema it downloads from golangci-lint.run at run time, so an
          # outage of that site redded this gate on code nobody had touched
          # (#1359). The lint run below loads the same .golangci.yml and
          # refuses a configuration it cannot load (malformed YAML, an
          # unknown linter or formatter); ci-go.yml's workspace lint applies
          # the same file without the schema step.
          verify: false
          # Reads the lint cache everywhere, saves it only on a run on main
          # (the rule in .github/actions/main-write-cache).
          skip-save-cache: ${{ !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request') }}
          working-directory: services/elitea-llm-gateway

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/elitea-llm-gateway
    # The Postgres integration tests (internal/failmode TestPostgres_*, the
    # healthy write and the outage recovery against the shipped DDL, and
    # cmd/elitea-llm-gateway's budget-probe test) skip without a database.
    # They ran nowhere in CI until this service; ELITEA_REQUIRE_GATEWAY_POSTGRES_TEST
    # below turns their skip into a failure, so losing the service cannot
    # read as green (ci-go.yml's #423 pattern). Plain PostgreSQL 18 (Debian
    # 13), the server every deployment runs: the gateway's DDL needs no
    # extension.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version: "1.27"
          # The series, at its latest patch: go.mod sets the floor (1.27.3,
          # bifrost/core's minimum), and the runner cache can lag behind it.
          check-latest: true
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-llm-gateway/go.sum

      - name: Go vet
        run: go vet ./...

      # internal/infra/nats/secured_test.go runs the gateway's real NATS client
      # (Connect, the bind, every counter, KV and publish) as its certificate
      # identity on a nats-server started from the NATS chart's own rendered
      # nats.conf, after the real bootstrap.sh (#1076). The script renders the
      # config, fetches the pinned nats CLI and the nats-server binary, and
      # sets ELITEA_REQUIRE_NATS_SECURE_TEST so a missing piece FAILS the test
      # rather than skipping it.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Provision the secured NATS permission test
        working-directory: .
        run: bash scripts/nats/ci-secure-test-env.sh

      - name: Run tests
        env:
          ELITEA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          ELITEA_REQUIRE_GATEWAY_POSTGRES_TEST: "1"
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage floor — enforcement packages
        # Fails if the budget-gate / governance / fail-mode / cost packages
        # regress below their current coverage. These are the money+correctness
        # core; a silent coverage drop there is how untested gaps slip in.
        run: ./scripts/coverage-floor.sh coverage.out

      - name: Env-drift gate — code env reads vs Helm chart
        # Fails if the code reads a required env var (os.Getenv, no default) that
        # the Helm chart cannot set. This class of bug (NATS_URL vs
        # GATEWAY_NATS_URL; missing GATEWAY_TLS_*) recurred twice in review and
        # no unit test catches it. yq is needed to read values.yaml.
        run: |
          command -v yq >/dev/null || { sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
          ./scripts/env-drift-check.sh

      - name: Generate llmproxy cobertura coverage (BF0.6t gate)
        # Emits internal/llmproxy/coverage.xml consumed by the BF0.6t
        # `type: coverage` validator (>=85%). Uses a pinned go-run tool so the
        # gateway go.mod is not modified.
        run: ./scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: gateway-coverage
          path: |
            services/elitea-llm-gateway/coverage.out
            services/elitea-llm-gateway/internal/llmproxy/coverage.xml
      # The former `build` job is gone: `go vet ./...` above type-checks
      # cmd/elitea-llm-gateway too, so a main that stops compiling already
      # fails here. Production images are built from the Containerfile.
