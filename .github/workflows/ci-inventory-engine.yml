name: CI — Inventory native engine

# ADR-0027: the Rust-native Inventory engine behind the engine sidecar socket.
#
# One job, on purpose: the repository's Actions plan runs 20 jobs at a time,
# and every check here needs the same compiled dependency graph.
#
#   * fmt, Clippy (all + pedantic, deny), rustdoc with warnings denied;
#   * the crate's tests: the graph against the Python engine's own
#     (tests/fixtures/graph_store, written by the Python KnowledgeGraph) and
#     through a REAL, plain PostgreSQL (the `postgres` service; the store's
#     migrations, save/load, tenancy; no pgvector — the entity vectors are in
#     elitea-vector, #1359, and the upgrade test stands in for the extension
#     the released 0004 created). INVENTORY_REQUIRE_POSTGRES=1 turns
#     their "no database → skip" into a failure;
#   * the fixture runner against every Inventory golden
#     (conformance/provider/fixtures/inventory — the files the Go and Rust
#     fixture runners are held to), the tool table against the descriptor
#     the host serves, and the engine over a REAL Unix socket;
#   * the release binary, and then the Go sub-application host's own tests
#     against it (internal/apps/inventory/run, native_engine_test.go): the
#     host's sidecar client, composition and upload over the Rust engine,
#     answering what the host's own fixture runner answers.
#     ELITEA_REQUIRE_NATIVE_ENGINE=1 turns their "no binary → skip" into a
#     failure here. ci-go.yml builds no Rust; it declares the skip.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main tests main. The caches it may write follow
  # scripts/ci/check-cache-budget.mjs (one writer per key); staggered ahead
  # of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-inventory-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine — lint, test, and the Go host against the binary
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]') && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/elitea-inventory-engine
    # eng-runner has no container engine. There every image below is empty, so
    # GitHub creates no service, and .github/actions/native-services runs the
    # same servers as processes at the same ports and credentials
    # (scripts/ci/check-runner-routing.mjs poolEmptyImage; it checks the two agree).
    services:
      postgres:
        # Plain PostgreSQL 18 (Debian 13), as every deployment runs.
        image: ${{ !(vars.ENG_RUNNER == 'on' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]') && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and rustup (none in
      # its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          rust: "true"
      # eng-runner: the services block's PostgreSQL as a process.
      # Does nothing on a hosted runner, where the services block runs them.
      - name: Start the services as processes (eng-runner)
        uses: ./.github/actions/native-services
        with:
          postgres: "true"
          postgres-user: inventory
          postgres-password: inventory
          postgres-db: inventory

      - name: Assert the pinned toolchain
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      - name: Free runner disk for the engine build
        # Hosted only: the pool builds on its 80 GiB work volume, and has no sudo.
        if: runner.environment == 'github-hosted'
        # The engine build on top of the restored target/ ran the runner out
        # of disk (PR #1574: a shared-crate change rebuilds most of the graph
        # beside the cached copy). Copied from ci-rust.yml: bounded and
        # NON-FATAL; a refused rm only warns, and the build then fails
        # honestly on ENOSPC.
        working-directory: .
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            || echo "::warning::could not remove every preinstalled toolchain; continuing"
          df -h / | tail -1

      # No cargo cache here (scripts/ci/cache-budget.json, measured 2026-11-20): a
      # registry-only entry is 0.3-0.6 GiB of the 10 GB cap and saves about the
      # time cargo takes to fetch the crates. The budget goes to target caches.

      # Formatting and Clippy for this crate run in ci-rust-lint.yml (fast
      # tier), so they fail in minutes and before this job's build.

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Run the crate's tests
        env:
          INVENTORY_TEST_DSN: postgresql://inventory:inventory@127.0.0.1:5432/inventory
          INVENTORY_REQUIRE_POSTGRES: "1"
        run: cargo test --locked --all-targets --all-features

      - name: Build the release binary
        run: cargo build --locked --release

      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (read only, one writer per key)
        uses: ./.github/actions/go-cache
        with:
          # Restores only: one writer per key (scripts/ci/check-cache-budget.mjs).
          save: "false"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      # The module download on its own step, with a bounded retry: on run
      # 39461870673 proxy.golang.org reset one stream ("stream error ...
      # INTERNAL_ERROR; received from peer") and `go test` failed in setup,
      # before any test ran. A transient proxy fault now costs a retry, and
      # a real one still fails here, under a name that says it was the fetch.
      - name: Download the Go host's modules (bounded retry)
        working-directory: services/elitea-subapp-host
        run: |
          for attempt in 1 2 3 4; do
            go mod download && exit 0
            echo "::warning::go mod download failed (attempt ${attempt}/4); retrying"
            sleep $(( attempt * 10 ))
          done
          exit 1

      - name: Run the Go host's sidecar tests against the binary
        working-directory: services/elitea-subapp-host
        env:
          ELITEA_INVENTORY_NATIVE_ENGINE_BIN: ${{ github.workspace }}/services/elitea-inventory-engine/target/release/elitea-inventory-engine
          ELITEA_REQUIRE_NATIVE_ENGINE: "1"
        run: go test -race -count=1 -run 'NativeEngine' -v ./internal/apps/inventory/run

      # eng-runner: the logs of the services native-services started, when
      # anything in the job failed. Does nothing on a hosted runner.
      - name: Upload the service logs (eng-runner)
        if: failure()
        uses: ./.github/actions/native-services-logs
