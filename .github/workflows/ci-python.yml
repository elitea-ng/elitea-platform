name: CI — SDK contract

# The Python left in CI after the Python worker was removed: the gateway's
# elitea-sdk compatibility gates and the contract tests under scripts/contract/.
#
#   tier 1  scripts/contract/test_sdk_budget_contract.py reads the SDK's budget
#           reader and the gateway's refusal constants from source.
#   tier 2  services/elitea-llm-gateway/scripts/sdk-conformance/run.sh drives the
#           installed SDK against the real gateway router (REAL 402s).
#
# Neither tier needs a worker. The SDK revision comes from
# services/elitea-llm-gateway/internal/sdkpin/elitea-sdk.lock.json, the file
# internal/sdkpin/pin_test.go compares the gateway's pin against.

on:
  pull_request:
    paths:
      - ".github/workflows/ci-python.yml"
      - "scripts/contract/**"
      - "services/elitea-llm-gateway/**"
      # test_cargo_target_cache_freshness.py reads every Containerfile.
      - "**/Containerfile*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-python.yml"
      - "scripts/contract/**"
      - "services/elitea-llm-gateway/**"
      - "**/Containerfile*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-contract:
    name: SDK contract (tiers 1 and 2) and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          cache: false
          check-latest: true
          go-version: "1.26"
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-llm-gateway/go.sum
      - name: Check out the pinned SDK source
        run: |
          set -euo pipefail
          lock=services/elitea-llm-gateway/internal/sdkpin/elitea-sdk.lock.json
          read_lock() { python3 -c 'import json,sys; print(eval("d"+sys.argv[2], {"d": json.load(open(sys.argv[1]))}))' "$lock" "$1"; }
          repo="$(read_lock '["source"]["repository"]')"
          revision="$(read_lock '["source"]["revision"]')"
          archive_sha="$(read_lock '["source"]["git_archive_sha256"]')"
          git clone --filter=blob:none --no-checkout "$repo" /tmp/elitea-sdk-current
          git -C /tmp/elitea-sdk-current checkout --detach "$revision"
          test "$(git -C /tmp/elitea-sdk-current rev-parse HEAD)" = "$revision"
          test "$(git -C /tmp/elitea-sdk-current archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" = "$archive_sha"
          # The patches apply with --no-commit, so HEAD stays the pinned revision,
          # which is what run.sh and the tier 1 test compare against.
          python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["source"]["patch_revisions"]))' "$lock" |
            while read -r patch; do
              git -C /tmp/elitea-sdk-current cat-file -e "${patch}^{commit}"
              git -C /tmp/elitea-sdk-current cherry-pick --no-commit "$patch"
            done
      - name: Install the pinned SDK and the test tools
        run: |
          # The checkout path is stable across runs. Do not let pip reuse a
          # wheel built from an older revision of the same file:// URL.
          python -m pip install --no-cache-dir "elitea-sdk @ file:///tmp/elitea-sdk-current" pytest
          python -m pip check
      - name: Contract tests (tier 1 and the Containerfile cache test)
        env:
          ELITEA_SDK_SOURCE_ROOT: /tmp/elitea-sdk-current
        run: |
          set -euo pipefail
          # Name every required gate, so a deleted file fails this step instead
          # of quietly measuring less.
          required=(
            scripts/contract/test_sdk_budget_contract.py
            scripts/contract/test_cargo_target_cache_freshness.py
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is missing; it is a named gate"; exit 1; }
          done
          python -m pytest -q -rA scripts/contract/test_*.py
      - name: elitea-sdk conformance — the SDK against the real gateway router (tier 2)
        env:
          ELITEA_SDK_SOURCE_ROOT: /tmp/elitea-sdk-current
          GOWORK: "off"
        run: bash services/elitea-llm-gateway/scripts/sdk-conformance/run.sh
