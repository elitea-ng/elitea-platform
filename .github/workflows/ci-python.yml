name: CI — Python

on:
  pull_request:
    paths:
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"
      # The "Runtime worker" job reads the files below. It compares each
      # committed projection with the SDK that the worker lock selects.
      # Start this workflow when one of these files changes. The worker lock
      # is in the services/elitea-worker-python/ directory. The entry above
      # covers the lock.
      - "scripts/contract/**"
      - "services/elitea-main/internal/runtimecomposition/current_index_types_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      # The catalogue snapshot is the SECOND projection of the same registry
      # read: sync_toolkit_schema_snapshot.py writes and checks both files in
      # one run, so a change to either must start this workflow.
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_catalogue_snapshot.json"
      # The Python worker toolkit capability snapshot records which SDK
      # toolkits THIS image can import. Its gate is a worker unit test, which
      # runs in the job below with the image's own extras installed.
      - "services/elitea-main/internal/runtimecomposition/current_python_worker_toolkit_capability_snapshot.json"
      - "services/elitea-main/internal/api/v2/indextypes/testdata/current_index_types_ui_response.json"
      # Issue #424. sync_current_available_sdk.py --check and
      # sync_worker_sdk_catalog.py --check now run in the "Runtime worker" job.
      # Each one compares a committed projection with the locked SDK. Add the
      # path of each projection. Without the path the gate cannot start for the
      # file that it protects — the defect that kept this workflow off the
      # branch until #448.
      - "services/elitea-main/internal/application/configurations/current_available_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_sdk_configuration_catalog_snapshot.json"
      # ── The elitea-sdk compatibility gates ─────────────────────────────────
      # Tier 1 (scripts/contract/test_sdk_budget_contract.py) reads the gateway
      # Go source. Tier 2 (the "elitea-sdk conformance" step below) mounts the
      # gateway's real router and drives the installed SDK against it. Both
      # therefore FAIL on a gateway change, and until this path existed neither
      # could START on one — the #429/#518 shape: the gate that exists to catch
      # a change cannot run on the change.
      #
      # The whole module is named rather than the two files tier 1 parses,
      # because tier 2 mounts the real handler and any gateway source change can
      # break it. The cost is real: a gateway pull request now also runs the
      # Python worker job. That is the price of the gate, and it is cheaper than
      # the alternative, which is a compatibility claim nothing re-measures.
      - "services/elitea-llm-gateway/**"
      # Tier 3 (deploy/scripts/sdk-client-check.*) is operator-run — see the
      # "elitea-sdk tier 3 wiring" step in the validate job for why. These paths
      # start the static half of it, which is the half CI can honestly run.
      - "deploy/scripts/sdk-client-check.py"
      - "deploy/scripts/sdk-client-check.sh"
      - "deploy/scripts/standalone-stack.sh"
  push:
    branches:
      - main
    paths:
      - "services/elitea-worker-python/**"
      - "libs/proto/gen/python/**"
      - "libs/proto/pyproject.toml"
      - "testdata/proto/runtime/v1/**"
      - ".github/workflows/ci-python.yml"
      - "scripts/contract/**"
      - "services/elitea-main/internal/runtimecomposition/current_index_types_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_schema_snapshot.json"
      # The catalogue snapshot is the SECOND projection of the same registry
      # read: sync_toolkit_schema_snapshot.py writes and checks both files in
      # one run, so a change to either must start this workflow.
      - "services/elitea-main/internal/runtimecomposition/current_toolkit_catalogue_snapshot.json"
      # The Python worker toolkit capability snapshot records which SDK
      # toolkits THIS image can import. Its gate is a worker unit test, which
      # runs in the job below with the image's own extras installed.
      - "services/elitea-main/internal/runtimecomposition/current_python_worker_toolkit_capability_snapshot.json"
      - "services/elitea-main/internal/api/v2/indextypes/testdata/current_index_types_ui_response.json"
      - "services/elitea-main/internal/application/configurations/current_available_snapshot.json"
      - "services/elitea-main/internal/runtimecomposition/current_sdk_configuration_catalog_snapshot.json"
      # The elitea-sdk compatibility gates. Same reasoning as the pull_request
      # arm above; a push arm that omits a path the pull_request arm names is
      # its own #518 defect.
      - "services/elitea-llm-gateway/**"
      - "deploy/scripts/sdk-client-check.py"
      - "deploy/scripts/sdk-client-check.sh"
      - "deploy/scripts/standalone-stack.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  # This job used to be the pylon-indexer config validator, and the tier 3
  # wiring check was a second step inside it. #339 deleted that service, so the
  # validator went with it and the wiring check stayed — it never read anything
  # under services/pylon-indexer, which is why it always carried
  # `working-directory: ${{ github.workspace }}`.
  #
  # The job keeps its name and its id. Renaming it would rename a required
  # check on every open pull request, which is a branch-protection edit
  # disguised as a workflow edit.
  validate:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: elitea-sdk tier 3 wiring
        # TIER 3 (deploy/scripts/sdk-client-check.sh) STAYS OPERATOR-RUN, and
        # this step is the honest half of it.
        #
        # WHY IT IS NOT RUN HERE. It drives the SDK inside the RUNNING worker
        # container of a full standalone stack, because that image is the only
        # one in the stack carrying the SDK. Running it in CI means building
        # that image — the most expensive build in the repository — and bringing
        # up the whole standalone compose. Only one standalone stack can be up
        # per host (oidc-mock's 9400 cannot be remapped; the issuer comes from
        # the Host header), so it cannot share a runner with the two journeys in
        # ci-web-e2e.yml and would need a third full-stack job. And its own
        # docstring says its budget arm CANNOT run there: that stack sets no
        # GATEWAY_NATS_URL, so Handler.budgetGate stays nil and no request can
        # be refused with 402. Tier 2 above produces that refusal for real.
        # A third full-stack job would therefore buy the model-catalogue and
        # credential-isolation arms and nothing else.
        #
        # WHAT THIS STEP DOES BUY. An operator-run script that nothing starts
        # rots, and the way it rots here is silently: `standalone-stack.sh
        # check` is the only caller, and a caller that is deleted leaves a file
        # that still looks maintained. So: both files must still parse, and the
        # call site must still exist.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          check_sh=deploy/scripts/sdk-client-check.sh
          check_py=deploy/scripts/sdk-client-check.py
          caller=deploy/scripts/standalone-stack.sh
          for f in "$check_sh" "$check_py" "$caller"; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          # The caller runs the script directly rather than through `bash`, so a
          # lost execute bit is a runtime failure in an operator's terminal and
          # nothing else would report it.
          [ -x "$check_sh" ] || { echo "::error::$check_sh is not executable; $caller invokes it directly"; exit 1; }
          bash -n "$check_sh"
          python3 -m py_compile "$check_py"
          # The call site. COMMENT lines are excluded before counting: the
          # caller's own header prose names the script, so counting every
          # mention would report a healthy wiring for a file whose only real
          # invocation had been deleted — the check passing because it looked at
          # the wrong line.
          # Count OCCURRENCES, not matching lines: `grep -c` reports 1 for a
          # line that names the script twice, so the "exactly one call site"
          # rule below was not enforced for that shape.
          # `|| true` is load-bearing, NOT redundant: grep exits 1 on no match and
          # `set -o pipefail` propagates that, so without it the ZERO-call-site
          # case dies at this assignment and the step fails printing nothing at
          # all — the one case whose diagnostic matters most.
          calls="$(grep -v '^[[:space:]]*#' "$caller" | grep -o 'deploy/scripts/sdk-client-check\.sh' | wc -l | tr -d ' ' || true)"
          if [ "$calls" != "1" ]; then
            echo "::error::$caller INVOKES sdk-client-check.sh $calls time(s) outside comments, expected exactly 1."
            echo "::error::Zero means tier 3 is now unreachable: nothing else starts it, and the file would keep looking maintained."
            echo "::error::More than one means two call sites, where the assertion budget in \`standalone-stack.sh check\` assumes one."
            exit 1
          fi
          # The link from the wrapper to the python. The wrapper mounts the .py
          # into the worker container and runs it as the entrypoint; rename the
          # .py or edit the -v line and the .py still exists and still compiles,
          # so every check above stays green while an operator run dies at the
          # mount. Count outside comments, for the same reason as the call site.
          # Match the HOST path specifically. A bare 'sdk-client-check.py'
          # also matches the container side of the -v mount and the entrypoint
          # argument, so renaming only the host path left the count unchanged
          # and this check passed a wrapper that could no longer find the file
          # (measured). The host path is the half that must match the tree.
          mounts="$(grep -v '^[[:space:]]*#' "$check_sh" | grep -c "$check_py" || true)"
          if [ "$mounts" -lt 1 ]; then
            echo "::error::$check_sh does not name $check_py outside comments, so the -v mount no longer points at the file in the tree."
            echo "::error::The .py existing and compiling does not mean the wrapper still runs it."
            exit 1
          fi
          # A gutted script passes every structural check above: replace
          # sdk-client-check.sh with '#!/usr/bin/env bash' + 'exit 0' and it is
          # present, executable, parses, and keeps its one call site — the step
          # reported OK for a tier 3 that asserts nothing. The operator path
          # does not catch it either, because the wrapper counts as one
          # assertion in standalone-stack.sh's total. So: require the assertion
          # body to still be there. These floors are deliberately far below the
          # real counts; they catch removal, not editing.
          ok_calls="$(grep -c 'result\.ok(' "$check_py" || true)"
          if [ "$ok_calls" -lt 10 ]; then
            echo "::error::$check_py records $ok_calls passing assertion(s) via result.ok(), expected at least 10."
            echo "::error::Tier 3 has been emptied. A script that asserts nothing cannot fail, and CI would keep calling its wiring healthy."
            exit 1
          fi
          if ! grep -q '^EXPECTED_ASSERTIONS' "$check_py"; then
            echo "::error::$check_py no longer declares EXPECTED_ASSERTIONS, the floor that stops a partial run from reporting success."
            exit 1
          fi
          sh_body="$(grep -vc '^[[:space:]]*\(#.*\)\?$' "$check_sh" || true)"
          if [ "$sh_body" -lt 20 ]; then
            echo "::error::$check_sh has $sh_body non-comment line(s), expected at least 20. It looks emptied rather than edited."
            exit 1
          fi
          echo "elitea-sdk tier 3 wiring OK (operator-run; started by $caller): ${ok_calls} assertions, ${mounts} host-path reference(s) to the python, ${sh_body} lines of wrapper."

  runtime-worker:
    name: Runtime worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/proto/pyproject.toml
            services/elitea-worker-python/pyproject.toml

      # Tier 2 of the elitea-sdk compatibility gates builds and runs a Go test
      # server from services/elitea-llm-gateway. Go lives HERE rather than the
      # SDK living in ci-gateway.yml, and the reason is cost: importing
      # EliteAClient pulls the whole LangChain/LangGraph runtime plus the
      # indexing closure, which is the same install this job already performs
      # and the most expensive one in the repository. actions/setup-go adds
      # seconds; a second copy of the SDK install would add minutes AND fork the
      # clone-verify-cherry-pick recipe into two files that drift.
      #
      # The version MUST match ci-gateway.yml: the gateway is a standalone
      # module on the Go 1.26 series, deliberately outside the root go.work.
      # Name the SERIES, not the patch. go.mod states a floor, and the image
      # builds from `golang:1.26-alpine`, which moves with the series.
      # scripts/ci/check-gateway-toolchain.sh holds this pin, the Containerfile
      # tag and ci-gateway.yml together.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: services/elitea-llm-gateway/go.sum

      - name: Install current binary indexing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            tesseract-ocr

      # #872: the pyodide internal tool needs `deno` on PATH exactly as the
      # admitted image will have it. One script (also run by the Containerfile)
      # is the single source of the pinned version and per-arch digest, so this
      # runner and the shipped image can never pin two different binaries.
      - name: Install the pinned deno binary the sandbox internal tool needs
        run: |
          sudo python3 services/elitea-worker-python/scripts/install_pinned_deno.py \
            --target-arch amd64 \
            --dest /usr/local/bin/deno
          deno --version

      - name: Check out the exact worker-locked SDK source
        env:
          SDK_REVISION: b5113a129329b85d23c2d5c2bf55f18e307414ec
          SDK_ARCHIVE_SHA256: df398b4a378e7b88ea3b72511e31de13a17a02159c69fbada6f0b948a0ecf2d7
          SDK_MCP_PREFLIGHT_PATCH: 5c9409779ac0a55f8bf74f6ef438977089187a14
          SDK_MCP_HARD_TIMEOUT_PATCH: 07ddc5cd67a0c747f83ca0e26421cde71bd97d9d
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/EliteaAI/elitea-sdk.git \
            /tmp/elitea-sdk-current
          git -C /tmp/elitea-sdk-current checkout --detach "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current rev-parse HEAD)" = "${SDK_REVISION}"
          test "$(git -C /tmp/elitea-sdk-current archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" = "${SDK_ARCHIVE_SHA256}"
          git -C /tmp/elitea-sdk-current cat-file -e "${SDK_MCP_PREFLIGHT_PATCH}^{commit}"
          git -C /tmp/elitea-sdk-current cat-file -e "${SDK_MCP_HARD_TIMEOUT_PATCH}^{commit}"
          git -C /tmp/elitea-sdk-current cherry-pick --no-commit "${SDK_MCP_PREFLIGHT_PATCH}"
          git -C /tmp/elitea-sdk-current cherry-pick --no-commit "${SDK_MCP_HARD_TIMEOUT_PATCH}"

      - name: Install the pinned worker and protocol packages
        run: |
          # The SDK source is checked out at a fixed revision, but the checkout
          # path is stable across runs. Do not let pip reuse a wheel built from
          # an older revision of that same file:// URL.
          python -m pip install --no-cache-dir \
            "elitea-sdk @ file:///tmp/elitea-sdk-current" \
            ./libs/proto \
            "./services/elitea-worker-python[agent-current,indexing-current,test]"
          python -m pip check

      # #872: vendor the SDK's patched Pyodide sandbox entrypoint at the SAME
      # path the Containerfile bakes it to, and pre-warm its module graph the
      # same way the image build does, so the worker's own default
      # (elitea_worker.agents.internal_tools._DEFAULT_PYODIDE_SANDBOX_PKG)
      # resolves here with no extra test-only wiring and the unit suite
      # exercises a REAL sandbox execution rather than a mock.
      - name: Pre-warm the pyodide sandbox entrypoint for the worker tests
        run: |
          sudo mkdir -p /opt/elitea/sandbox
          sudo cp /tmp/elitea-sdk-current/infra/data/sandbox/main.ts /opt/elitea/sandbox/main.ts
          sudo DENO_DIR=/opt/elitea/sandbox/deno-cache \
            deno cache --node-modules-dir=auto /opt/elitea/sandbox/main.ts
          sudo chmod -R a+rwX /opt/elitea/sandbox

      - name: Unit and byte-conformance tests
        env:
          ELITEA_CONFORMANCE_ROOT: ${{ github.workspace }}/testdata/proto/runtime/v1
          ELITEA_SDK_SOURCE_ROOT: /tmp/elitea-sdk-current
          # Matches the Containerfile's own ENV: without this, the sandbox
          # test's DENO_DIR default would be an empty per-run /tmp directory,
          # and it would need the network access the pre-warm step above
          # exists to remove.
          DENO_DIR: /opt/elitea/sandbox/deno-cache
        run: |
          # Every test_*.py under scripts/contract/ runs. A named list stops
          # covering a file the day somebody adds one, and two files had sat
          # unrun since they were written (#424). The shell glob is the whole
          # point: it derives the list from the tree.
          contract_tests=(scripts/contract/test_*.py)
          # The glob keeps covering new files automatically. A COUNT alone does
          # not keep covering the existing ones: the floor was -lt 4 while the
          # directory held 5, so deleting one gate left 4 and this step stayed
          # green. Name the files that must be present, so a delete or a bad
          # merge fails here instead of passing quietly.
          # Name them ALL. A count alone cannot tell "five files" from "the
          # four that were not deleted plus a new one", and a floor of 1 would
          # let three of these disappear quietly.
          required_contract_tests=(
            scripts/contract/test_sdk_budget_contract.py
            scripts/contract/test_sync_current_available_sdk.py
            scripts/contract/test_sync_index_types_snapshot.py
            scripts/contract/test_sync_toolkit_schema_snapshot.py
            scripts/contract/test_sync_worker_sdk_catalog.py
          )
          for required in "${required_contract_tests[@]}"; do
            if [ ! -f "$required" ]; then
              echo "::error::$required is missing. It is a named compatibility gate, so its absence fails this step rather than reducing what is measured."
              exit 1
            fi
          done
          if [ "${#contract_tests[@]}" -lt "${#required_contract_tests[@]}" ]; then
            echo "::error::found ${#contract_tests[@]} test files under scripts/contract/, expected at least ${#required_contract_tests[@]} — the glob stopped matching, so this step would prove nothing"
            exit 1
          fi
          python -m pytest \
            /tmp/elitea-sdk-current/tests/runtime/test_mcp_discovery_hang.py \
            services/elitea-worker-python/tests \
            "${contract_tests[@]}"
          elitea-worker conformance --suite runtime-v1

      - name: elitea-sdk conformance — the SDK against the real gateway router
        # TIER 2. Tier 1 (the contract test in the step above) compares the SDK
        # source with the gateway source. It cannot see a defect the two sources
        # agree on and the wire does not, and it cannot see a defect in which
        # constant a call site USES: swap budgetErrorType for budgetCodeMember
        # at the refusal and every tier 1 assertion still passes, because the
        # constants themselves are unchanged. That is the shipped defect exactly.
        #
        # This step mounts the gateway's own chi router over the real llmproxy
        # handler, produces REAL 402s from the real budget gate, and hands them
        # to the installed SDK's own budget_exceeded_from. It also drives chat,
        # embeddings and the Anthropic dialect end to end.
        #
        # It runs in THIS job because the SDK is already installed here. The
        # script itself verifies that the checkout is the revision the gateway
        # pin names, and that the INSTALLED package is that same tree, so a run
        # against some other revision fails instead of reporting a compatibility
        # claim it never measured.
        env:
          ELITEA_SDK_SOURCE_ROOT: /tmp/elitea-sdk-current
          # The gateway is a standalone module; the parent workspace must never
          # be consulted. run.sh exports this too — belt and braces, because a
          # workspace resolution failure here reads as a missing package.
          GOWORK: "off"
        run: bash services/elitea-llm-gateway/scripts/sdk-conformance/run.sh

      - name: Compile Python sources
        run: python -m compileall -q services/elitea-worker-python/src libs/proto/gen/python

      - name: Verify source-backed SDK projections
        env:
          # sync_current_available_sdk.py refuses to run when
          # elitea_sdk/configurations holds an uncommitted or untracked file.
          # The projections above import that package straight out of the
          # checkout, so the interpreter would drop __pycache__ directories in
          # it and the next check would report a dirty SDK source. Write no
          # bytecode instead.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Schema projection imports the complete current SDK registry. Keep
          # its build-only dependencies after the runtime tests so they cannot
          # conceal a missing dependency in the indexing worker profile.
          python -m pip install --no-cache-dir \
            "elitea-sdk[all] @ file:///tmp/elitea-sdk-current"
          python scripts/contract/sync_index_types_snapshot.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          python scripts/contract/sync_toolkit_schema_snapshot.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          # Issue #424. These two --check modes ran in no workflow. Each one
          # reads the same locked SDK source as the two calls above and
          # compares a committed projection with it. The trigger list carries
          # the path of each projection.
          python scripts/contract/sync_current_available_sdk.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check
          python scripts/contract/sync_worker_sdk_catalog.py \
            --sdk-root /tmp/elitea-sdk-current \
            --check

  redis-runtime-worker:
    name: Real Redis Python lifecycle integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the focused Redis lifecycle test dependencies
        run: >-
          python -m pip install
          ./libs/proto
          "./services/elitea-worker-python[test]"

      - name: Exercise atomic Python XACK and XDEL retirement
        env:
          ELITEA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          python -m pytest -q
          services/elitea-worker-python/tests/service/test_redis_commands_service.py
