name: CI — UI

on:
  pull_request:
    paths:
      - "apps/elitea-ui/**"
      - ".github/workflows/ci-ui.yml"
  push:
    branches:
      - main
    paths:
      - "apps/elitea-ui/**"
      # This workflow's own file. The pull_request arm above names it and this
      # arm did not, so a push that edited only the gate could not start the
      # gate it edited (#518).
      - ".github/workflows/ci-ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: elitea-ui
            path: apps/elitea-ui
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The elitea-ui submodule .gitignores its package-lock.json, so there is
      # no committed lockfile to key the npm cache on or to run `npm ci` against.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm install --no-audit --no-fund

      # Linting the UI source belongs to the EliteaUI repo's own CI (AGENTS.md:
      # "make UI changes in its owning repository"). This monorepo gate only
      # needs to confirm the pinned submodule builds.
      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-dist
          path: ${{ matrix.app.path }}/dist/
          retention-days: 7
