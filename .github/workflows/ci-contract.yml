name: CI — Contract Tests

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main tests main. The caches it may write follow
  # scripts/ci/check-cache-budget.mjs (one writer per key); staggered ahead
  # of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "55 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  # ── The package's self-contained suites: S19's TestArtifact* conformance
  #    suite (gated on ELITEA_TEST_DATABASE_URL / S3_ENDPOINT_URL, which this
  #    job supplies via the same RustFS + Postgres emulator stack ci-go.yml's
  #    test job wires for S4, so it runs here rather than only skipping) and
  #    the agent-execution protocol contract. ──
  compile:
    name: Compile & Run
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]') && 'eng-runner' || 'ubuntu-latest' }}
    # eng-runner has no container engine. There every image below is empty, so
    # GitHub creates no service, and .github/actions/native-services runs the
    # same servers as processes at the same ports and credentials
    # (scripts/ci/check-runner-routing.mjs poolEmptyImage; it checks the two agree).
    services:
      postgres:
        image: ${{ !(vars.ENG_RUNNER == 'on' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]') && 'postgres:18-trixie' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and node for Azurite. Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      # eng-runner: the services block's PostgreSQL and the storage-test emulators
      # as processes (in place of the compose steps below).
      # Does nothing on a hosted runner, where the services block runs them.
      - name: Start the services as processes (eng-runner)
        uses: ./.github/actions/native-services
        with:
          postgres: "true"
          storage: "true"

      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (read only, one writer per key)
        uses: ./.github/actions/go-cache
        with:
          # Restores only: one writer per key (scripts/ci/check-cache-budget.mjs).
          save: "false"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      - name: Vet contract tests
        run: |
          cd services/elitea-main
          go vet ./tests/contract/

      # Mirrors ci-go.yml's own S4 emulator wiring — see
      # deploy/docker-compose.storage-test.yml for why each healthcheck is
      # more involved than a bare wget.
      - name: Start storage emulators
        if: runner.environment == 'github-hosted'
        run: docker compose -f deploy/docker-compose.storage-test.yml up -d --wait

      - name: Run contract tests
        env:
          S3_ENDPOINT_URL: "http://127.0.0.1:19000"
          S3_ACCESS_KEY: "testaccesskey"
          S3_SECRET_KEY: "testsecretkey"
          S3_REGION: "us-east-1"
          S3_FORCE_PATH_STYLE: "true"
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: |
          cd services/elitea-main
          go test -v -count=1 -timeout=180s ./tests/contract/

      - name: Stop storage emulators
        if: runner.environment == 'github-hosted' && always()
        run: docker compose -f deploy/docker-compose.storage-test.yml down -v

      # eng-runner: the logs of the services native-services started, when
      # anything in the job failed. Does nothing on a hosted runner.
      - name: Upload the service logs (eng-runner)
        if: failure()
        uses: ./.github/actions/native-services-logs
