name: CI — Contract Tests

on:
  pull_request:
    paths:
      - "services/elitea-main/tests/contract/**"
      - "services/elitea-main/api/openapi/**"
      - ".github/workflows/ci-contract.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/tests/contract/**"
      - "services/elitea-main/api/openapi/**"
      # This workflow's own file. The pull_request arm above names it and this
      # arm did not, so a push that edited only the gate could not start the
      # gate it edited (#518).
      - ".github/workflows/ci-contract.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  # ── The package's self-contained suites: S19's TestArtifact* conformance
  #    suite (gated on ELITEA_TEST_DATABASE_URL / S3_ENDPOINT_URL, which this
  #    job supplies via the same RustFS + Postgres emulator stack ci-go.yml's
  #    test job wires for S4, so it runs here rather than only skipping) and
  #    the agent-execution protocol contract. ──
  compile:
    name: Compile & Run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-main/go.sum

      - name: Vet contract tests
        run: |
          cd services/elitea-main
          go vet ./tests/contract/

      # Mirrors ci-go.yml's own S4 emulator wiring — see
      # deploy/docker-compose.storage-test.yml for why each healthcheck is
      # more involved than a bare wget.
      - name: Start storage emulators
        run: docker compose -f deploy/docker-compose.storage-test.yml up -d --wait

      - name: Run contract tests
        env:
          S3_ENDPOINT_URL: "http://127.0.0.1:19000"
          S3_ACCESS_KEY: "testaccesskey"
          S3_SECRET_KEY: "testsecretkey"
          S3_REGION: "us-east-1"
          S3_FORCE_PATH_STYLE: "true"
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
        run: |
          cd services/elitea-main
          go test -v -count=1 -timeout=180s ./tests/contract/

      - name: Stop storage emulators
        if: always()
        run: docker compose -f deploy/docker-compose.storage-test.yml down -v
