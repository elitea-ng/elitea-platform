name: Release & Publish

# THREE CHANNELS, NONE OF THEM A MERGE. A merge to main starts no run of this
# workflow (nor of any other: scripts/ci/check-no-push-triggers.mjs). Releasing
# on every merge cut a release per pull request — v4.66.0 to v6.0.0 in two
# days — so a release is now a decision:
#
#   release   workflow_dispatch from main. semantic-release, exactly as before:
#             the conventional commits since the last stable tag decide the
#             bump, and it creates the tag and the GitHub release. Moves
#             `latest` and `<major>.<minor>`. Nothing releasable: no-op.
#   nightly   the schedule below, from main. A pre-release
#             `<next>-nightly.<yyyymmdd>.<run>`. Skipped when HEAD already
#             carries a release or nightly tag (no commits since the last one).
#   dev       workflow_dispatch from ANY branch. A pre-release `<next>-dev.<run>`.
#
# `<next>` is the version semantic-release would cut from that ref now (a dry
# run with the ref as its only branch), so a pre-release always sorts BEFORE the
# release it previews. With nothing releasable since the last stable tag it is
# that tag's patch + 1. Pre-release tags never feed the bump: semantic-release
# ignores pre-release versions when it looks for the last release of `main`.
#
# A pre-release builds, scans, signs and publishes the same images, charts and
# signed macOS app (the `desktop` job) a release does, under its own version only — the manifest step never gives a
# version with a `-` the moving tags. The `prune` job keeps the newest
# PRERELEASE_KEEP of each pre-release channel and deletes the rest.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: >-
          release — a stable release from main (semantic-release decides the
          version). dev — a pre-release `<next>-dev.<run>` of the dispatched
          ref, any branch. nightly — what the schedule runs, by hand.
        type: choice
        options:
          - release
          - dev
          - nightly
        default: release
  schedule:
    - cron: "7 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Read by the chart job. Pinned, not "latest" — an unpinned third-party
  # download is a hard dependency of every release.
  YQ_VERSION: v4.44.6
  # Pre-releases kept per channel (nightly, dev) by the `prune` job.
  PRERELEASE_KEEP: "14"

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ── Job 1: Version — decide the version, create the tag & GitHub release ────
  #
  # Every later job reads only these three outputs, whichever channel set them.
  release:
    name: Version (${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }})
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.stable.outputs.new_release_published || steps.pre.outputs.published }}
      new_release_version: ${{ steps.stable.outputs.new_release_version || steps.pre.outputs.version }}
      new_release_git_tag: ${{ steps.stable.outputs.new_release_git_tag || steps.pre.outputs.git_tag }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          channel="$INPUT"
          if [ "$EVENT" = "schedule" ]; then channel=nightly; fi
          case "$channel" in
            release|nightly)
              # A stable release, and the nightly preview of the next one, come
              # from main only. A dev pre-release is the one channel for a branch.
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::the ${channel} channel runs from main; dispatch it on main, or pick dev for ${GITHUB_REF_NAME}"
                exit 1
              fi ;;
            dev) ;;
            *) echo "::error::unknown channel '${channel}'"; exit 1 ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          # semantic-release EVALUATES the `branches` input as JavaScript, so
          # the branch name reaches it as a JSON string literal, never raw.
          echo "branches=$(jq -cn --arg b "$GITHUB_REF_NAME" '[$b]')" >> "$GITHUB_OUTPUT"
          echo "### Channel: ${channel} (${GITHUB_REF_NAME} @ ${GITHUB_SHA::12})" >> "$GITHUB_STEP_SUMMARY"

      # Nothing new since the last nightly (or release): no nightly. A nightly
      # per quiet night would only be a copy of the one before it.
      - name: Nightly — anything new since the last one?
        id: fresh
        if: steps.channel.outputs.channel == 'nightly'
        run: |
          set -euo pipefail
          held="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-nightly\..+)?$' || true)"
          if [ -n "$held" ]; then
            echo "HEAD already carries ${held//$'\n'/, }; no nightly." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          # semantic-release runs from npx; nothing here wants a cache.
          package-manager-cache: false

      - name: Semantic Release (release channel)
        id: stable
        if: steps.channel.outputs.channel == 'release'
        uses: cycjimmy/semantic-release-action@v8
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same analysis, as a dry run on the dispatched ref: it publishes
      # nothing and reports the version a release would cut, and its notes.
      - name: Semantic Release dry run (pre-release channels)
        id: next
        if: steps.channel.outputs.channel == 'dev' || steps.fresh.outputs.fresh == 'true'
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: true
          branches: ${{ steps.channel.outputs.branches }}
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the pre-release tag and GitHub pre-release
        id: pre
        if: steps.next.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          NEXT: ${{ steps.next.outputs.new_release_version }}
          LAST: ${{ steps.next.outputs.last_release_version }}
          NOTES: ${{ steps.next.outputs.new_release_notes }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base="$NEXT"
          if [ -z "$base" ]; then
            # Nothing releasable since the last stable tag: preview its patch.
            last="${LAST:-0.0.0}"
            IFS=. read -r major minor patch <<< "${last%%-*}"
            base="${major}.${minor}.$((patch + 1))"
          fi
          case "$CHANNEL" in
            nightly) version="${base}-nightly.$(date -u +%Y%m%d).${RUN}" ;;
            dev)     version="${base}-dev.${RUN}" ;;
          esac
          tag="v${version}"

          {
            echo "${CHANNEL} pre-release of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
            echo
            if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES"; else echo "No releasable commits since v${LAST:-0.0.0}."; fi
          } > "$RUNNER_TEMP/notes.md"

          # --target creates the tag on GitHub at this commit; the later jobs
          # check it out by name.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"

          {
            echo "published=true"
            echo "version=${version}"
            echo "git_tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Pre-release **${tag}**" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Build each image on its native runner ────────────────────────────
  #
  # VULNERABILITY SCAN — WHERE IT RUNS (issues #433 and #501)
  #
  #   The images below are scanned TWICE, by two gates with different subjects.
  #
  #   1. .github/workflows/nightly-image-scan.yml scans what each image's
  #      `latest` tag resolves to, by digest, every night at 05:17 UTC, and
  #      keeps one issue per vulnerable image. It reports a CVE published
  #      against an image that is already out. (Until 2026-10-20 this was
  #      ci-image-scan.yml, a rebuild-and-scan on every pull request.)
  #
  #   2. The `publish-image` job below scans the image THIS RELEASE PUSHED,
  #      before the manifest step in that same job creates the `latest` tag.
  #      That gate guards the release.
  #
  #   WHY BOTH. Gate 2 is the only one that STOPS anything: a release whose
  #   image fails it never gets `latest`. Gate 1 watches what already shipped,
  #   against tomorrow's vulnerability DB. Issue #501 held the gap gate 2 closes.
  #
  #   WHICH IMAGE GATE 2 READS. It pulls the tag this workflow pushed, so it
  #   reads the artefact the release publishes and not a rebuild of it. The
  #   alternative — build every image a second time to scan it — costs a second
  #   build of every image and still scans a different artefact.
  #
  #   The image list below is not free-form. scripts/ci/image-matrix.sh
  #   (image-matrix.yml, on every pull request that touches it) holds every
  #   matrix here to docker-bake.hcl, so a new entry cannot arrive unscanned in
  #   silence, and nightly-image-scan.yml READS the `scan` matrix rather than
  #   carrying a copy of its own.
  #
  # Meanwhile compose declares this service mandatory for agent execution —
  # "without this service an admitted run streams nothing and ends in a
  # terminal failure" — so the one service the platform cannot execute an agent
  # without was the one service nobody could pull.
  build:
    name: Build ${{ matrix.image.name }} / ${{ matrix.platform.suffix }}
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: elitea-main
            context: .
            dockerfile: ./services/elitea-main/Containerfile
            # The Containerfile is multi-target (hybrid / e2e / final). Name the
            # shipping one instead of relying on "last stage wins", so adding a
            # stage can never silently change what is released.
            target: final
          - name: elitea-scheduler
            # Repo root, not ./services/elitea-scheduler: the Containerfile
            # COPYs libs/go/observability (issue #250's local replace target)
            # from there.
            context: .
            dockerfile: ./services/elitea-scheduler/Containerfile
          - name: elitea-subapp-host
            context: .
            dockerfile: ./services/elitea-subapp-host/Containerfile
          # Repo ROOT context: the module replaces libs/go/egresslib.
          - name: elitea-egress-proxy
            context: .
            dockerfile: ./services/elitea-egress-proxy/Containerfile
            target: final
          # New UI (spec §7.3, issue #244): mirrors the elitea-web bake target
          # in docker-bake.hcl so the image bake produces actually reaches
          # ghcr.io instead of only ever being built locally/in CI.
          - name: elitea-web
            context: .
            dockerfile: ./apps/elitea-web/Containerfile
          # Standalone module outside go.work. Its Containerfile builds from
          # golang:1.26-trixie and carries its own toolchain, so no runner-image
          # bump is required here. scripts/ci/check-gateway-toolchain.sh holds
          # that tag and the ci-gateway.yml pin together (#506).
          #
          # Repo ROOT context, like elitea-main: the module replaces
          # libs/go/egresslib, so the service directory is not a valid context.
          # go.work is still not copied into the image, and the build sets
          # GOWORK=off, so the wider context changes no toolchain.
          - name: elitea-llm-gateway
            context: .
            dockerfile: ./services/elitea-llm-gateway/Containerfile
          # The native Rust worker, and the chart's DEFAULT worker.runtime.
          # Repo ROOT context: the Containerfile COPYs
          # libs/proto from outside the service directory.
          #
          # It had a Containerfile, a CI workflow and a compose overlay naming
          # `ghcr.io/eliteaai/elitea-worker-rust:standalone` long before it had
          # this entry, so the tag the overlay names had never been pushed and
          # `docker pull` of it has never worked. Only a local `--build` run
          # produced that image. The chart cannot default to a worker nobody
          # can pull, so the image is built and signed here with the rest.
          - name: elitea-worker-rust
            context: .
            dockerfile: ./services/elitea-worker-rust/Containerfile
          # The cloud executor's sandbox supervisor (ADR-0034): the
          # `supervisor` stage of the worker Containerfile, built with
          # `--features sandbox-supervisor`. The chart pins it by digest
          # (sandboxKubernetes.supervisor.image), so it must be pullable.
          - name: elitea-sandbox-supervisor
            context: .
            dockerfile: ./services/elitea-worker-rust/Containerfile
            target: supervisor
          # The Rust-native Inventory engine (ADR-0027): the only Inventory
          # engine sidecar. It replaced the Python elitea-inventory image,
          # which is no longer published. Repo ROOT context: the
          # Containerfile COPYs services/elitea-inventory-engine, libs/proto and
          # the shared libs/rust crates from there.
          - name: elitea-inventory-engine
            context: .
            dockerfile: ./services/elitea-inventory-engine/Containerfile
          # The Rust-native DeepWiki engine (ADR-0026 phase 7): the only
          # engine sidecar the chart runs. It replaced the Python
          # elitea-deepwiki image, which is no longer published. Repo ROOT
          # context: the Containerfile COPYs services/elitea-deepwiki-engine,
          # libs/proto and libs/rust from there. No `target:` — the shipping stage is the last one.
          - name: elitea-deepwiki-engine-native
            context: .
            dockerfile: ./services/elitea-deepwiki-engine/Containerfile
          # elitea-vector (ADR-0031), the only Qdrant client. Repo ROOT
          # context: the Containerfile COPYs services/elitea-vector,
          # libs/proto and libs/rust from there.
          - name: elitea-vector
            context: .
            dockerfile: ./services/elitea-vector/Containerfile
          # elitea-doc-extractor (ADR-0030 I1): the Rust worker's document
          # extraction sidecar. Repo ROOT context for the same reason: the
          # Containerfile COPYs services/elitea-doc-extractor, libs/proto and
          # libs/rust from there.
          - name: elitea-doc-extractor
            context: .
            dockerfile: ./services/elitea-doc-extractor/Containerfile
          # elitea-workspace-runner (ADR-0034 decision 9): the cloud
          # executor's workspace sandbox. Repo ROOT context: the Containerfile
          # COPYs libs/rust.
          - name: elitea-workspace-runner
            context: .
            dockerfile: ./libs/rust/workspace-runner/Containerfile
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
            suffix: linux-amd64
          # GitHub-hosted arm64 runner (free for public repos). Pinned to the
          # 24.04 image rather than a floating `-arm` alias so an image rollover
          # can't silently change the build environment under us. There is no
          # self-hosted runner fleet for this repo — do not reintroduce
          # `[self-hosted, arm64]`, the job will queue forever.
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform-specific image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          # Empty for single-target images, which build their last stage.
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ needs.release.outputs.new_release_version }}-${{ matrix.platform.suffix }}
          # No matrix entry passes build-args since the Python DeepWiki image
          # (EXTRAS) was removed. One that needs them adds a `build_args` key
          # to its entry and a line here.
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.new_release_version }}
          platforms: ${{ matrix.platform.arch }}
          # The registry layer cache (the public ghcr.io/elitea-ng/ci-cache-<image>
          # package), not `type=gha`: the Actions cache is capped at 10 GB and
          # a mode=max export of twenty platform builds is what kept it at the
          # cap. `release-<platform>` is this job's own ref, written by a run
          # from main only (a dev pre-release of a branch reads it; mode=max
          # because the builder stages are most of each build). The second read is ci-web-e2e.yml's
          # build-once cache of the same Containerfile (amd64), so a release
          # starts from main's latest CI layers. The cache is a cache: nothing
          # a release ships is a ci-* image (scripts/ci/check-ci-image-references.mjs).
          cache-from: |
            type=registry,ref=ghcr.io/elitea-ng/ci-cache-${{ matrix.image.name }}:release-${{ matrix.platform.suffix }}
            type=registry,ref=ghcr.io/elitea-ng/ci-cache-${{ matrix.image.name }}:${{ matrix.platform.suffix }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/elitea-ng/ci-cache-{0}:release-{1},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', matrix.image.name, matrix.platform.suffix) || '' }}

  # ── Job 3: Scan, manifest and sign each image this release pushed ────────────
  #
  # ONE JOB, THREE STAGES, IN THE ORIGINAL ORDER (scan → manifest → sign).
  #
  # WHY IT IS ONE JOB. This was three matrix jobs of ten — thirty runner slots
  # for three commands that each take about twenty seconds, and thirty runner
  # setups (checkout, buildx, GHCR login) to pay for them. The org is on the
  # GitHub free plan: 20 concurrent jobs for the whole account. Those thirty
  # slots queued behind this workflow's own 20 platform builds and behind every
  # other workflow on the same push, so the release finished later than the work
  # in it takes.
  #
  # NOTHING IS LOST BY FOLDING THEM. The three jobs were strictly sequential
  # already — `manifest` needed `scan`, `sign` needed `manifest` — so there was
  # no parallelism between them to give up. Only the per-job overhead goes.
  #
  # THE GATE IS STRICTLY STRONGER, NOT WEAKER. `needs: scan` used to be what
  # stopped a refused image getting a `latest` tag. Now the scan is the step
  # BEFORE the manifest step in the same job, and a failed step aborts the job:
  # the manifest is not created, and `latest` / `<major>.<minor>` never exist for
  # an image this gate refused. Same guarantee, expressed by ordering instead of
  # by a dependency edge.
  #
  # THE STEP NAMES CARRY THE OLD JOB NAMES ("Scan …", "Manifest …", "Sign …") so
  # the evidence in a release log stays findable by the words a reader knows.
  #
  # FAIL-FAST. The three jobs disagreed: `scan` was fail-fast: false ("one red
  # image must not hide the state of the other nine"), `manifest` was true,
  # `sign` was false. The merged job takes FALSE, which is the scan's rule,
  # because the scan is the stage whose verdict a reader needs for every image
  # and it now runs first in every leg. `rollback` runs on failure() however the
  # matrix ends, so a complete report still costs nothing.
  #
  # ── the scan stage (issue #501) ─────────────────────────────────────────────
  #
  # This workflow pushed images that no job in it scanned. The merge gate had
  # scanned main at most 24 hours earlier, so a CVE published inside that window
  # shipped and the daily run reported it after the fact.
  #
  # IT READS THE PUSHED IMAGE, NOT A REBUILD. The tag below is the one the build
  # job pushed minutes ago, pulled back from the registry. The step prints the
  # digest it scanned, so the log states which artefact the verdict is about.
  #
  # ONE PLATFORM. The report reads Go build metadata and OS package databases,
  # and neither depends on the architecture; the two platform tags come from one
  # source tree. nightly-image-scan.yml scans linux/amd64 for the same reason.
  #
  # THE RULE LIVES IN ONE SCRIPT. scripts/ci/image-scan-gate.sh decides which
  # report blocks, and nightly-image-scan.yml runs that same file. It has three
  # failures: no report, a report that never reached the application content,
  # and any HIGH or CRITICAL finding. The first two block for EVERY image, the
  # exempt ones included — a dead scan must not look like a clean scan.
  # scripts/ci/image-scan-gate-test.sh drives every one of those arms with
  # synthetic reports, so this gate is proved red rather than asserted.
  #
  # THE MATRIX IS NOT FREE-FORM, AND IT IS THE ONLY COPY. nightly-image-scan.yml
  # reads its name, expect_type and blocking fields, so the nightly scan cannot
  # disagree with the release about an image. scripts/ci/image-matrix.sh --verify
  # holds the NAMES in this matrix, the build matrix, the IMAGES cleanup array
  # and docker-bake.hcl together, and holds `blocking: false` here to
  # .github/image-scan-exempt.txt.

  scan:
    name: Scan ${{ matrix.image.name }} (${{ matrix.image.blocking && 'blocking' || 'exempt, reports only' }})
    # Its own job again, and that is the point: `publish-image` below
    # `needs` this WHOLE matrix, so one refused image stops every manifest.
    # Folded into the manifest job, a red scan on elitea-main only aborted
    # its own leg while the other nine advanced `latest` and `<major>.<minor>`
    # to a release the gate refused — and rollback deletes neither moving
    # tag. This job also pushes nothing, so it needs no write token: the
    # least-privilege point the old layout made, kept.
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      # See FAIL-FAST above.
      fail-fast: false
      matrix:
        image:
          # `expect_type` is the trivy Result.Type the report MUST hold. Each
          # value names the APPLICATION content, so a scan that reads the base
          # layers and stops short fails instead of reading as clean. The values
          # are MEASURED, and nightly-image-scan.yml reads them from here.
          #
          # `blocking: false` reports the finding count and does not stop the
          # release. It never relaxes the threshold and never relaxes the
          # dormancy guards. `.github/image-scan-exempt.txt` records the cause
          # of each exemption and the issue that ends it.
          - name: elitea-main
            expect_type: gobinary
            blocking: true
          - name: elitea-scheduler
            expect_type: gobinary
            blocking: true
          - name: elitea-subapp-host
            expect_type: gobinary
            blocking: true
          - name: elitea-egress-proxy
            expect_type: gobinary
            blocking: true
          - name: elitea-web
            expect_type: alpine
            blocking: true
          - name: elitea-llm-gateway
            expect_type: gobinary
            blocking: true
          # `rustbinary`, not `debian`: the Containerfile builds with
          # cargo-auditable so trivy can see the crate graph, and this value is
          # what makes a report that only reached the distroless base FAIL
          # instead of reading as clean.
          #
          # blocking: true — measured on the built image, the base contributes
          # 29 findings and NONE are HIGH or CRITICAL, and the Rust binary
          # itself reports zero. There is nothing here to exempt, so it is held
          # to the same threshold as the Go images.
          - name: elitea-worker-rust
            expect_type: rustbinary
            blocking: true
          # The sandbox supervisor: the worker Containerfile's `supervisor`
          # stage, the same distroless base and cargo-auditable build, so
          # `rustbinary` and blocking for the worker's reasons.
          - name: elitea-sandbox-supervisor
            expect_type: rustbinary
            blocking: true
          # The Inventory provider engine (ADR-0023 H4c), scanned as it is
          # RELEASED: no build-args, so the engine closure is not in the image
          # under test either.
          # The Rust-native Inventory engine (ADR-0027): `rustbinary` and
          # blocking, as the DeepWiki engine below, for the same distroless
          # base and cargo-auditable build.
          - name: elitea-inventory-engine
            expect_type: rustbinary
            blocking: true
          # The Rust-native DeepWiki engine (ADR-0026 phase 7). `rustbinary`
          # for elitea-worker-rust's reason: the Containerfile builds with
          # cargo-auditable, and this value makes a report that only reached
          # the distroless base FAIL instead of reading as clean. Blocking,
          # on distroless base-nossl-debian13 plus libgcc_s (no system
          # OpenSSL to scan); nothing here is exempt.
          - name: elitea-deepwiki-engine-native
            expect_type: rustbinary
            blocking: true
          # elitea-vector (ADR-0031): the same distroless base and
          # cargo-auditable build as the engines, so `rustbinary` and
          # blocking for the same reason.
          - name: elitea-vector
            expect_type: rustbinary
            blocking: true
          # elitea-doc-extractor (ADR-0030 I1): the same distroless base and
          # cargo-auditable build, so `rustbinary` and blocking too.
          - name: elitea-doc-extractor
            expect_type: rustbinary
            blocking: true
          # elitea-workspace-runner (ADR-0034 decision 9): a Debian 13 userland
          # with git and a build toolchain (the agent builds the user's
          # project in it), so trivy reports a `debian` Result, and the image
          # is exempt for the Debian base's unfixed findings
          # (.github/image-scan-exempt.txt).
          - name: elitea-workspace-runner
            expect_type: debian
            blocking: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Scan <image> (was job `scan`) ─────────────────────────────────────────
      #
      # A pull that fails FAILS the job. "The image was not there" must never
      # reach the gate as an empty report, which would read as a clean scan.
      - name: Scan ${{ matrix.image.name }} — pull the image this release pushed
        id: pull
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ needs.release.outputs.new_release_version }}-linux-amd64"
          docker pull "$REF"
          DIGEST="$(docker image inspect "$REF" --format '{{index .RepoDigests 0}}')"
          if [ -z "$DIGEST" ]; then
            echo "::error::pulled ${REF} and read no repository digest from it — the gate could not state which artefact it scanned"
            exit 1
          fi
          echo "Scanning the pushed artefact ${DIGEST}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "- \`${{ matrix.image.name }}\` scanned at \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      # exit-code 0 on purpose: this step collects the report, and the step
      # below is the gate. Splitting them lets the gate print every finding.
      - name: Scan ${{ matrix.image.name }} — trivy the pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Used only if trivy resolves the reference from the registry instead
          # of the local daemon copy the step above pulled.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.pull.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "0"

      # THIS STEP IS THE RELEASE GATE. It runs BEFORE the manifest step below,
      # so a red scan stops before any `latest` or `<major>.<minor>` tag exists.
      # `rollback` needs this job, so the platform tags the build job already
      # pushed are deleted along with the release and the git tag. The images a
      # consumer can resolve by a moving tag are therefore never images this
      # gate refused.
      - name: Scan ${{ matrix.image.name }} — gate on HIGH and CRITICAL findings
        run: |
          bash scripts/ci/image-scan-gate.sh \
            trivy-report.json \
            "${{ matrix.image.name }}" \
            "${{ matrix.image.expect_type }}" \
            "${{ matrix.image.blocking }}"

      # ── Manifest <image> (was job `manifest`) ────────────────────────────────
      #
      # Merge the two platform digests into a single multi-arch manifest. Only
      # reachable when the gate step above passed.

  publish-image:
    name: Publish ${{ matrix.image.name }}
    # Manifest, then sign, for one image — after EVERY image's scan passed
    # (`needs: scan` is the whole scan matrix). This is the job that writes
    # to the registry and mints the keyless signature, so it alone carries
    # `packages: write` and `id-token: write`.
    needs: [release, build, scan]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      # See FAIL-FAST above.
      fail-fast: false
      matrix:
        image:
          # `expect_type` is the trivy Result.Type the report MUST hold. Each
          # value names the APPLICATION content, so a scan that reads the base
          # layers and stops short fails instead of reading as clean. The values
          # are MEASURED, and nightly-image-scan.yml reads them from here.
          #
          # `blocking: false` reports the finding count and does not stop the
          # release. It never relaxes the threshold and never relaxes the
          # dormancy guards. `.github/image-scan-exempt.txt` records the cause
          # of each exemption and the issue that ends it.
          - name: elitea-main
            expect_type: gobinary
            blocking: true
          - name: elitea-scheduler
            expect_type: gobinary
            blocking: true
          - name: elitea-subapp-host
            expect_type: gobinary
            blocking: true
          - name: elitea-egress-proxy
            expect_type: gobinary
            blocking: true
          - name: elitea-web
            expect_type: alpine
            blocking: true
          - name: elitea-llm-gateway
            expect_type: gobinary
            blocking: true
          # `rustbinary`, not `debian`: the Containerfile builds with
          # cargo-auditable so trivy can see the crate graph, and this value is
          # what makes a report that only reached the distroless base FAIL
          # instead of reading as clean.
          #
          # blocking: true — measured on the built image, the base contributes
          # 29 findings and NONE are HIGH or CRITICAL, and the Rust binary
          # itself reports zero. There is nothing here to exempt, so it is held
          # to the same threshold as the Go images.
          - name: elitea-worker-rust
            expect_type: rustbinary
            blocking: true
          # The sandbox supervisor: the worker Containerfile's `supervisor`
          # stage, the same distroless base and cargo-auditable build, so
          # `rustbinary` and blocking for the worker's reasons.
          - name: elitea-sandbox-supervisor
            expect_type: rustbinary
            blocking: true
          # The Inventory provider engine (ADR-0023 H4c), scanned as it is
          # RELEASED: no build-args, so the engine closure is not in the image
          # under test either.
          # The Rust-native Inventory engine (ADR-0027): `rustbinary` and
          # blocking, as the DeepWiki engine below, for the same distroless
          # base and cargo-auditable build.
          - name: elitea-inventory-engine
            expect_type: rustbinary
            blocking: true
          # The Rust-native DeepWiki engine (ADR-0026 phase 7). `rustbinary`
          # for elitea-worker-rust's reason: the Containerfile builds with
          # cargo-auditable, and this value makes a report that only reached
          # the distroless base FAIL instead of reading as clean. Blocking,
          # on distroless base-nossl-debian13 plus libgcc_s (no system
          # OpenSSL to scan); nothing here is exempt.
          - name: elitea-deepwiki-engine-native
            expect_type: rustbinary
            blocking: true
          # elitea-vector (ADR-0031): the same distroless base and
          # cargo-auditable build as the engines, so `rustbinary` and
          # blocking for the same reason.
          - name: elitea-vector
            expect_type: rustbinary
            blocking: true
          # elitea-doc-extractor (ADR-0030 I1): the same distroless base and
          # cargo-auditable build, so `rustbinary` and blocking too.
          - name: elitea-doc-extractor
            expect_type: rustbinary
            blocking: true
          # elitea-workspace-runner (ADR-0034 decision 9): a Debian 13 userland
          # with git and a build toolchain (the agent builds the user's
          # project in it), so trivy reports a `debian` Result, and the image
          # is exempt for the Debian base's unfixed findings
          # (.github/image-scan-exempt.txt).
          - name: elitea-workspace-runner
            expect_type: debian
            blocking: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Scan <image> (was job `scan`) ─────────────────────────────────────────
      #
      # A pull that fails FAILS the job. "The image was not there" must never
      # reach the gate as an empty report, which would read as a clean scan.
      - name: Manifest ${{ matrix.image.name }}
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image.name }}"

          # An array, not a "--tag a --tag b" string split by an unquoted
          # expansion: the same argv, and no element can be split or globbed.
          tags=(--tag "${IMAGE}:${VERSION}")
          if [[ "$VERSION" != *"-"* ]]; then
            MAJOR_MINOR="${VERSION%.*}"
            tags+=(--tag "${IMAGE}:latest" --tag "${IMAGE}:${MAJOR_MINOR}")
          fi

          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${VERSION}-linux-amd64" \
            "${IMAGE}:${VERSION}-linux-arm64"

      # ── Sign <image> (was job `sign`) ────────────────────────────────────────
      #
      # Installed here rather than with the other setup actions at the top: an
      # image the scan refuses never reaches this line, so it never pays for the
      # download.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign ${{ matrix.image.name }} — keyless cosign on the multi-arch manifest
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          IMAGE="${{ env.REGISTRY }}/${{ matrix.image.name }}"

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')

          cosign sign --yes "${IMAGE}@${DIGEST}"

  # ── Job 4: Package and push the Helm charts to the GHCR OCI registry ────────
  # The images are only half of a release. Until this job existed, a consumer
  # could `docker pull ghcr.io/elitea-ng/elitea-main:1.2.3` but had no way to
  # obtain the chart that deploys it other than cloning this repository at the
  # matching tag — which is not a distribution channel, it is a workaround.
  #
  # `needs: publish-image` on purpose, not `needs: release`. A chart whose values
  # point at an image tag that does not exist yet is a chart that cannot install,
  # so the charts go out strictly after the manifests they reference are pushed
  # and signed. `publish-image` is the job that now creates AND signs those
  # manifests (it was `sign`), so this edge means exactly what it did before.
  #
  # No `latest` chart tag, unlike the image manifests above: an OCI chart
  # reference resolves by SemVer version, `helm pull --version latest` is not
  # a thing, and a non-SemVer tag in a chart repository is a foot-gun for
  # every tool that enumerates it. Consumers pin `--version`.

  chart:
    name: Chart ${{ matrix.chart }}
    needs: [release, publish-image]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE chart for the platform, NATS JetStream and Qdrant included (the
          # upstream nats and qdrant charts are Chart.lock dependencies, built
          # before packaging and carried in the package). It ships every first-party image, so no
          # single `image:` names it — `platformImageTag` below stamps the one
          # top-level `image.tag` every component resolves from instead. Without
          # that a chart published at a release number would install `latest`
          # for all of them.
          - chart: elitea
            image: ""
            platformImageTag: true
          # The optional sandbox runtime installer (ADR-0034): a node-level
          # chart kept apart from `elitea`, which never touches nodes. Its
          # image is a pinned third-party Debian 13 digest, so nothing is
          # stamped.
          - chart: elitea-sandbox-runtime
            image: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Pinned for the same reason ci-helm pins it: an unpinned third-party
      # download is a hard dependency of every release. The runner image
      # usually ships yq already, so this normally downloads nothing.
      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      # TWO logins, because two tools read two different credential stores and
      # only one of them is Helm's.
      #
      # `helm registry login` writes ~/.config/helm/registry/config.json. cosign
      # resolves credentials through the Docker keychain — ~/.docker/config.json
      # — which it never sees. So the first run of this job pushed every chart
      # and then failed to sign a single one, with GHCR answering the signature
      # upload "UNAUTHORIZED: unauthenticated: User cannot be authenticated with
      # the token provided" while the push seconds earlier had succeeded.
      #
      # Every other job in this workflow already uses docker/login-action, which
      # is why image signing works and chart signing did not.
      - name: Log in to GHCR (Docker keychain — used by cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm registry config — used by helm push)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Chart.yaml and values.yaml are BOTH edited, rather than passing
      # `helm package --version/--app-version`. Those flags exist in Helm 3 and
      # were dropped in Helm 4, so a routine bump of the pinned Helm above
      # would turn this job red — or, if a future edit ever drops the pin,
      # publish every chart at the placeholder 0.1.0. yq works on both.
      #
      # The working tree keeps the placeholder 0.1.0; only the packaged
      # artifact carries a release number.
      #
      # values.yaml matters just as much as the version: a chart published at
      # 1.2.3 whose default `image.tag` is still "latest" installs whatever a
      # node happens to have cached — the exact trap the elitea-web values.yaml
      # comment already warns operators about.
      #
      # Every edit is read back. An unstamped chart that publishes and reports
      # success is worse than a failed release, and a values.yaml that reshapes
      # its image block is the way that happens quietly.
      - name: Stamp the release version into the chart
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          CHART="deploy/helm/${{ matrix.chart }}/Chart.yaml"
          VALUES="deploy/helm/${{ matrix.chart }}/values.yaml"

          yq -i ".version = \"${VERSION}\"" "$CHART"
          got="$(yq -r '.version' "$CHART")"
          if [ "$got" != "$VERSION" ]; then
            echo "::error file=${CHART}::version is '${got}', expected '${VERSION}'"
            exit 1
          fi

          # appVersion tracks the platform release ONLY for a chart that ships
          # an image from this repository. For a chart that deploys a
          # third-party image it keeps the deliberate upstream pin already
          # written in Chart.yaml (NATS 2.12.0, otel-collector 0.114.0) — a
          # release number means nothing to those images' registries.
          if [ -n "${{ matrix.image }}" ]; then
            yq -i ".appVersion = \"${VERSION}\"" "$CHART"
            got="$(yq -r '.appVersion' "$CHART")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${CHART}::appVersion is '${got}', expected '${VERSION}'"
              exit 1
            fi

            before="$(yq -r '.image.tag' "$VALUES")"
            if [ "$before" = "null" ]; then
              echo "::error file=${VALUES}::no .image.tag to stamp — the chart's image block moved"
              exit 1
            fi
            yq -i ".image.tag = \"${VERSION}\"" "$VALUES"
            got="$(yq -r '.image.tag' "$VALUES")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${VALUES}::image.tag is '${got}', expected '${VERSION}'"
              exit 1
            fi

            # The image the stamped tag names must be one this workflow
            # actually pushed. A repository that drifted from the build matrix
            # produces a chart pointing at a tag that will never exist.
            repo="$(yq -r '.image.repository' "$VALUES")"
            if [ "$repo" != "${REGISTRY}/${{ matrix.image }}" ]; then
              echo "::error file=${VALUES}::image.repository is '${repo}', expected '${REGISTRY}/${{ matrix.image }}'"
              exit 1
            fi

            echo "stamped ${VALUES}: image.tag ${before} -> ${VERSION}"
          fi

          # The platform chart has no single image of its own: it templates every
          # component from one top-level `image.tag`, whose working-tree value is
          # the placeholder `latest`. That one tag is what turns the package into
          # a coherent release, so it is stamped and read back exactly like the
          # per-component image.tag above — and its ABSENCE is an error, because
          # a silently unstamped tag is a chart that publishes at a release
          # number and installs `latest` for every component.
          if [ "${{ matrix.platformImageTag }}" = "true" ]; then
            before="$(yq -r '.image.tag' "$VALUES")"
            if [ "$before" = "null" ]; then
              echo "::error file=${VALUES}::no .image.tag to stamp — the platform chart's top-level image block moved"
              exit 1
            fi
            yq -i ".image.tag = \"${VERSION}\"" "$VALUES"
            got="$(yq -r '.image.tag' "$VALUES")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${VALUES}::image.tag is '${got}', expected '${VERSION}'"
              exit 1
            fi
            yq -i ".appVersion = \"${VERSION}\"" "$CHART"
            got="$(yq -r '.appVersion' "$CHART")"
            if [ "$got" != "$VERSION" ]; then
              echo "::error file=${CHART}::appVersion is '${got}', expected '${VERSION}'"
              exit 1
            fi
            echo "stamped ${VALUES}: image.tag ${before} -> ${VERSION}"
          fi

          yq '{"version": .version, "appVersion": .appVersion}' "$CHART"

      # The elitea chart's dependencies (the upstream nats and qdrant charts
      # and our elitea-sandbox-runtime) are not committed: build them from
      # Chart.lock, then prove every one resolved (`ok` only; an unknown status fails too,
      # scripts/ci/check-chart-deps.mjs). `helm package` puts them in the
      # published chart, so an OCI install needs nothing built.
      - name: Build the chart dependencies
        run: |
          CHART_DIR="deploy/helm/${{ matrix.chart }}"
          if [ -f "${CHART_DIR}/build-deps.sh" ]; then bash "${CHART_DIR}/build-deps.sh"; fi
          node scripts/ci/check-chart-deps.mjs "$CHART_DIR"

      - name: Package chart
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          helm package "deploy/helm/${{ matrix.chart }}" --destination /tmp/charts
          ls -l "/tmp/charts/${{ matrix.chart }}-${VERSION}.tgz"

      - name: Push chart and sign it
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          TGZ="/tmp/charts/${{ matrix.chart }}-${VERSION}.tgz"

          # `helm push` prints the pushed digest ("Digest: sha256:..."; Helm 3
          # on stderr, Helm 4 on stdout, so both streams). Capture it here
          # rather than re-resolving the tag afterwards, so the signature is
          # bound to the artifact this job pushed and not to whatever the tag
          # points at by the time the next step runs.
          # `bash -e` — the default shell here — takes the exit status of the
          # LAST command in a pipeline, so `helm push | tee` would report
          # success for a push that failed. pipefail for the push itself, then
          # off again so the digest grep below reaches its own error message
          # instead of aborting the step silently.
          set -o pipefail
          helm push "$TGZ" "oci://${REGISTRY}/charts" 2>&1 | tee /tmp/push.log
          set +o pipefail

          DIGEST="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          if [ -z "$DIGEST" ]; then
            echo "::error::helm push printed no digest — refusing to sign an unknown artifact"
            exit 1
          fi

          cosign sign --yes "${REGISTRY}/charts/${{ matrix.chart }}@${DIGEST}"

      # A push that reported success and a chart a consumer can actually pull
      # are different claims. This asserts the second one, from the registry.
      - name: The published chart is pullable
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          helm show chart "oci://${REGISTRY}/charts/${{ matrix.chart }}" --version "$VERSION"

  # ── Job 5: Desktop — the signed, notarised macOS app (Apple silicon) ────────
  #
  # Every channel ships it, attached to the GitHub release the `release` job
  # created: `Elitea_<version>_aarch64.dmg` and the `.app` as a zip. A job here
  # and not a tag-triggered workflow: a tag created with GITHUB_TOKEN starts no
  # workflow, and no workflow here may start on a push at all.
  #
  # THE VERSION IS STAMPED, NOT COMMITTED, as the chart's is. Cargo.toml takes
  # the full version, so `X-Client-Version` (CARGO_PKG_VERSION; the
  # deployment's 426 gate, SemVer with pre-release) says exactly which build
  # this is. tauri.conf.json takes the numeric `X.Y.Z`, because it becomes
  # CFBundleShortVersionString, which macOS reads as three integers;
  # CFBundleVersion is the run number, which only ever grows.
  #
  # NOT IN ROLLBACK'S `needs`. The images and charts are the release; a failed
  # notarisation (Apple's service, an expired certificate) must not delete
  # them. Re-run this job alone: the upload uses --clobber.
  #
  # Signing never degrades in silence: with any signing secret missing the job
  # fails, and an unsigned app is never attached to a release.
  desktop:
    name: Desktop (macOS arm64)
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          persist-credentials: false

      - name: Signing secrets are all present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::repository secrets not set: ${missing[*]} (apps/elitea-desktop/README.md, Release signing)"
            exit 1
          fi
          [ "$(uname -m)" = "arm64" ] || { echo "::error::runner is $(uname -m), the release is Apple silicon only"; exit 1; }

      - name: Stamp the release version into the app
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          BUILD: ${{ github.run_number }}
        working-directory: apps/elitea-desktop
        run: |
          set -euo pipefail
          base="${VERSION%%-*}"
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.argv[1];
            c.bundle.macOS.bundleVersion = process.argv[2];
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$base" "$BUILD"
          # The [package] version is the first `version =` line of Cargo.toml.
          sed -i '' -E "1,/^version = /s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml

          got_conf="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          got_cargo="$(sed -nE 's/^version = "(.*)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [ "$got_conf" != "$base" ] || [ "$got_cargo" != "$VERSION" ]; then
            echo "::error::stamped tauri.conf.json ${got_conf} (want ${base}) and Cargo.toml ${got_cargo} (want ${VERSION})"
            exit 1
          fi
          echo "stamped: Cargo.toml ${VERSION}, tauri.conf.json ${base} (build ${BUILD})"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # `tauri build` runs the web desktop build first (beforeBuildCommand).
      - name: Install web and desktop (locked)
        run: |
          npm ci --prefix apps/elitea-web
          npm ci --prefix apps/elitea-desktop

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # Restore only: a release run's target directory is not one a pull
      # request reads (ci-desktop.yml's nightly run is that writer).
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: apps/elitea-desktop/src-tauri

      - name: Prepare the notarisation key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The Tauri CLI imports the certificate into a temporary keychain, signs
      # with the hardened runtime, notarises and staples the app.
      - name: Build, sign and notarise
        working-directory: apps/elitea-desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      # Proven, not assumed: Gatekeeper accepts the app and the ticket is stapled.
      - name: The app is signed, notarised and stapled
        working-directory: apps/elitea-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 macos/Elitea.app
          spctl --assess --type execute --verbose=4 macos/Elitea.app
          xcrun stapler validate macos/Elitea.app

      - name: Attach the app to the release
        working-directory: apps/elitea-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.new_release_git_tag }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          zip_name="Elitea_${VERSION}_aarch64.app.zip"
          dmg_name="Elitea_${VERSION}_aarch64.dmg"
          # ditto keeps the code signature and the stapled ticket; zip(1) does not.
          ditto -c -k --keepParent macos/Elitea.app "$RUNNER_TEMP/$zip_name"
          dmg="$(ls dmg/*.dmg)"
          cp "$dmg" "$RUNNER_TEMP/$dmg_name"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/$dmg_name" "$RUNNER_TEMP/$zip_name"
          echo "Attached ${dmg_name} and ${zip_name} to ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the notarisation key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # ── Job 6: Docs — deploy the docs site for a stable release ─────────────────
  #
  # A merge no longer deploys the docs (docs-pages.yml has no push arm), so the
  # site moves with the stable release, built from its tag. Not in rollback's
  # `needs`: a failed docs deploy leaves a release that is otherwise complete,
  # and docs-pages.yml can be re-dispatched on its own.
  docs:
    name: Docs
    needs: [release, chart]
    if: needs.release.outputs.new_release_published == 'true' && needs.release.outputs.channel == 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      ref: ${{ needs.release.outputs.new_release_git_tag }}

  # ── Job 7: Prune — keep the newest PRERELEASE_KEEP pre-releases per channel ──
  #
  # Runs after a pre-release published, so the one just cut is counted among
  # the kept. Deletes each older pre-release with its tag, its images (the
  # manifest and both platform tags) and its charts; the desktop app goes with
  # the GitHub release it is attached to:
  # scripts/ci/prune-prereleases.mjs, unit-tested in no-binaries.yml.
  prune:
    name: Prune old pre-releases
    needs: [release, chart]
    if: needs.release.outputs.new_release_published == 'true' && needs.release.outputs.channel != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned to the v9.0.0 commit, as ci-image-cleanup.yml pins it: this
      # step holds packages: write.
      - name: Prune
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANNEL: ${{ needs.release.outputs.channel }}
          ORG: ${{ github.repository_owner }}
        with:
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/prune-prereleases.mjs`);
            const code = await main({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              org: process.env.ORG,
              channel: process.env.CHANNEL,
              keep: Number(process.env.PRERELEASE_KEEP),
            });
            if (code !== 0) core.setFailed(`scripts/ci/prune-prereleases.mjs exited ${code}`);

  # ── Job 8: Rollback — delete release, tag, and images on failure ────────────
  rollback:
    name: Rollback
    # `publish-image` is on this list so a refused image is rolled back, not left
    # in the registry. That job carries the release scan (it was the `scan` job,
    # folded together with `manifest` and `sign`). The build job pushed
    # `<version>-linux-amd64` and `<version>-linux-arm64` before the scan ran,
    # and the step below deletes both. Without this line the release would keep
    # the platform tags of an image the release gate refused (#501).
    needs: [release, build, scan, publish-image, chart]
    if: failure() && needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.new_release_git_tag }}"
          REPO="${{ github.repository }}"

          echo "Deleting release for tag ${TAG}..."
          RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE "repos/${REPO}/releases/${RELEASE_ID}"
            echo "Release deleted."
          fi

          echo "Deleting tag ${TAG}..."
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG#v}" 2>/dev/null || \
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" 2>/dev/null || true
          echo "Tag deleted."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete pushed images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          # Must list exactly the images the `build` matrix pushes.
          #
          # This comment used to say the rule was "held by the same gate in
          # helm-lint.yml". It was not: that gate cross-checks the CHART matrix
          # and the CHARTS rollback array and says nothing about images, so this
          # array could drift from the build matrix with nothing to catch it —
          # and a reader who added an image had been told otherwise.
          #
          # scripts/ci/image-matrix.sh --verify is the real gate, and it holds
          # all six copies of the image list against docker-bake.hcl.
          IMAGES=("elitea-main" "elitea-scheduler" "elitea-subapp-host" "elitea-egress-proxy" "elitea-web" "elitea-llm-gateway" "elitea-worker-rust" "elitea-sandbox-supervisor" "elitea-inventory-engine" "elitea-deepwiki-engine-native" "elitea-vector" "elitea-doc-extractor" "elitea-workspace-runner")
          SUFFIXES=("linux-amd64" "linux-arm64")
          ORG="${{ github.repository_owner }}"

          for img in "${IMAGES[@]}"; do
            # Delete platform-specific tags
            for suffix in "${SUFFIXES[@]}"; do
              TAG="${VERSION}-${suffix}"
              echo "Deleting ${img}:${TAG}..."
              # Get version ID by tag and delete
              VERSION_ID=$(gh api "orgs/${ORG}/packages/container/${img}/versions" \
                --jq ".[] | select(.metadata.container.tags[] == \"${TAG}\") | .id" 2>/dev/null || true)
              if [ -n "$VERSION_ID" ]; then
                gh api -X DELETE "orgs/${ORG}/packages/container/${img}/versions/${VERSION_ID}" 2>/dev/null || true
              fi
            done

            # Delete multi-arch manifest tag
            echo "Deleting ${img}:${VERSION} manifest..."
            VERSION_ID=$(gh api "orgs/${ORG}/packages/container/${img}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${VERSION}\") | .id" 2>/dev/null || true)
            if [ -n "$VERSION_ID" ]; then
              gh api -X DELETE "orgs/${ORG}/packages/container/${img}/versions/${VERSION_ID}" 2>/dev/null || true
            fi
          done

          echo "Image rollback complete."

      # The charts are pushed under a `charts/` path prefix, so their GHCR
      # package names are `charts/<chart>` and the API path segment must be
      # URL-encoded (`charts%2F<chart>`). Without this the release would roll
      # back its images and leave a chart published at a version whose images
      # no longer exist — a chart that installs into a permanent ImagePullBackOff.
      - name: Delete pushed charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.new_release_version }}"
          # Must list exactly the charts the `chart` job pushes. It listed the
          # per-service charts long after #598 replaced them with the single
          # `elitea` chart, so a rollback warned about six charts that no longer
          # exist and left the one chart this release actually published in
          # place — pointing at images the step above had just deleted.
          CHARTS=("elitea" "elitea-sandbox-runtime")
          ORG="${{ github.repository_owner }}"

          # Report what could not be deleted. Every call here used to end in
          # `2>/dev/null || true`, so a refused delete looked exactly like a
          # successful one — and the charts from the two failed 1.18.0 releases
          # stayed in the registry, at a version whose images this same job had
          # already removed. That is the precise state the comment above says
          # this step exists to prevent, and nothing reported it.
          #
          # Still non-fatal: this job runs BECAUSE something already failed, and
          # aborting it half way would leave more behind, not less.
          failed=0
          for chart in "${CHARTS[@]}"; do
            echo "Deleting chart ${chart}:${VERSION}..."
            VERSION_ID=$(gh api "orgs/${ORG}/packages/container/charts%2F${chart}/versions" \
              --jq ".[] | select(.metadata.container.tags[] == \"${VERSION}\") | .id" 2>/dev/null || true)
            if [ -z "$VERSION_ID" ]; then
              echo "  no ${VERSION} version found (nothing pushed, or the listing was refused)"
              continue
            fi
            if gh api -X DELETE "orgs/${ORG}/packages/container/charts%2F${chart}/versions/${VERSION_ID}"; then
              echo "  deleted"
            else
              echo "::warning::could not delete chart ${chart}:${VERSION} — it stays published at a version whose images were just removed. Delete it by hand."
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "::warning::rollback left at least one chart behind; see the warnings above"
          fi

          echo "Rollback complete."
