name: CI — Helm

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "deploy/argocd/**"
      - ".github/workflows/helm-lint.yml"
      # The capability gate below reads the required runtime names straight out
      # of runtimecomposition/config.go. Without this path a pull request that
      # adds a new `required("ELITEA_RUNTIME_X")` and touches nothing under
      # deploy/helm/ never runs the gate that exists to catch it — the same
      # false green as a workflow that never triggers at all (#429).
      - "services/elitea-main/internal/runtimecomposition/**"
      # The LLM-path gate below compares the charts with the standalone compose
      # file. A change to that file alone must run the gate that reads it.
      - "deploy/docker-compose.standalone-full.yml"
      # The publish-coverage gate below reads the chart matrix out of
      # publish.yml. Without this path a pull request that drops a chart from
      # that matrix and touches nothing under deploy/helm/ never runs the gate
      # that exists to catch it — the #429/#518 shape again.
      - ".github/workflows/publish.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"
      - "deploy/argocd/**"
      - "services/elitea-main/internal/runtimecomposition/**"
      - "deploy/docker-compose.standalone-full.yml"
      - ".github/workflows/publish.yml"
      # This workflow's own file. The pull_request arm above names it and this
      # arm did not, so a push that edited only the gate could not start the
      # gate it edited (#518).
      - ".github/workflows/helm-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  # Read by the LLM-path gate below. Pinned, not "latest".
  YQ_VERSION: v4.44.6
  # CRD schemas (argoproj.io Application, cert-manager Certificate) come from
  # the datreeio catalog. PINNED to a release tag, not `main`: an unpinned
  # third-party branch is a hard dependency of every deploy PR, so a rename
  # upstream would redden CI with no change in this repo. Bump deliberately.
  CRD_SCHEMAS: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/v0.0.12/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      # A bare loop takes the status of its LAST iteration, so a broken early
      # chart read as a pass. `bash -e` hides that today by stopping the step on
      # the first failure — but that is a property of the caller, not of the
      # loop, and the loop is what gets copied. #409 gave `task helm:lint` the
      # collecting form; this is the same shape (#429).
      #
      # A glob that matches nothing is a failure too. Zero charts linted is not
      # "all charts pass"; it means the charts moved and this gate stopped
      # measuring anything.
      - name: Lint charts
        run: |
          failed=""
          found=0
          for chart in deploy/helm/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=$((found + 1))
            dir="$(dirname "$chart")"
            echo "Linting $dir..."
            if ! helm lint "$dir"; then
              failed="$failed $dir"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no chart matched deploy/helm/*/Chart.yaml — this gate linted nothing"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::these charts failed helm lint:$failed"
            exit 1
          fi
          echo "helm lint: $found chart(s) passed"

      # `helm lint` proves a chart is well formed. It never reads the rendered
      # environment, so it stayed green for as long as the elitea-main chart
      # set no capability flag at all — and a Kubernetes install therefore ran
      # with the runtime plane dark while the same image on compose ran it
      # (#382). This gate asserts the rendered YAML, and it reads the required
      # runtime names straight out of internal/runtimecomposition/config.go, so
      # a newly required name fails here until the chart renders it.
      - name: Capability flags reach the container environment
        run: bash deploy/helm/tests/render-capabilities.sh

      # The runner image ships yq, so this usually downloads nothing. The
      # version is PINNED for the same reason as KUBECONFORM_VERSION and
      # CRD_SCHEMAS above: an unpinned third-party download is a hard
      # dependency of every deploy pull request.
      - name: Install yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      # The LLM-path gate (#463, #467, #458, #464). It asserts both directions:
      # the charts render the LLM path ON, and the gateway chart REFUSES an
      # empty guard variable.
      #
      # #473 wrote this script and no job ran it. So the refusal that the
      # template job below now satisfies had no test that it still fires. Delete
      # the guard and every gate in this file stays green; only this step goes
      # red (#497).
      - name: The charts do not ship the LLM path off, and the guards refuse
        run: bash deploy/helm/tests/render-llm-path.sh

      # The liveness path at the chart's own edge (#569). On the cluster,
      # /healthz sat in the HTTPRoute rule that carries the forward-auth
      # ExtensionRef while the policy did not name it, so every probe of the
      # public hostname got a 302 to the login form. This step reads the
      # RENDERED HTTPRoute and Ingress: both reach /healthz, and no ExtensionRef
      # stands in front of it. The Go half — the policy admits the path — is
      # tests/deployedge/edge_public_policy_test.go in the No Binaries workflow.
      - name: The chart edge publishes /healthz with no authenticating filter
        run: bash deploy/helm/tests/render-edge-healthz.sh

      # The worker templates were rendered by NOTHING before this step: every
      # other render script here, and the template matrix below, set
      # `worker.enabled=false`, and `helm lint` does not enter a body its
      # condition excludes. That was tolerable with one worker image. It stopped
      # being tolerable when `worker.implementation` arrived and the default
      # became the Rust worker, whose argument list the Python shape does not
      # satisfy — a mismatch that reaches an operator as a CrashLoopBackOff and
      # not as a configuration error.
      #
      # It needs PyYAML like render-bf0-2b.sh does, and installs it the same way.
      # The DeepWiki component (ADR-0022 P3). Both directions, for the reason
      # the LLM-path step above records: a chart that renders the feature is
      # half the claim, and the half that rots silently is the refusal. Delete
      # either guard and every other gate in this file stays green.
      #
      # It also asserts the migration Job overrides the image ENTRYPOINT. The
      # image starts the SERVER by default, so a Job that forgets the override
      # runs a second copy of the service instead of migrating, and Helm waits
      # for it forever.
      # The PostgreSQL connection ceiling (O1a). Both directions: the guard
      # refuses an over-budget topology AND permits one inside the budget — a
      # one-directional check cannot tell a working guard from a template that
      # refuses everything.
      - name: The connection budget is enforced, and permits a sane topology
        run: bash deploy/helm/tests/render-connection-budget.sh

      # The workload session that expires and the CronJob that is the only
      # thing stopping it (O2b). Both directions, and the assertions turn the
      # worker ON — these guards live inside `if .Values.worker.enabled`, which
      # is false in the shipped defaults, so a suite that forgot would pass
      # against a guard that never ran.
      - name: Workload-session renewal cannot be switched off silently
        run: bash deploy/helm/tests/render-workload-session.sh

      # Every worker replica must get its own Redis consumer name (O2a). The
      # mechanism has three parts and one of them fails invisibly: if the
      # worker mounts the ConfigMap instead of the rendered document, every
      # replica reads a consumer name containing the literal placeholder —
      # identical across the fleet, with nothing in any log saying so. The
      # suite also runs the substitution the manifest carries, so that wiring
      # which looks right but substitutes nothing is caught too.
      - name: Every worker replica gets its own Redis consumer name
        run: bash deploy/helm/tests/render-worker-consumer-identity.sh

      # The worker's KEDA autoscaling (O2c). The refusal is the important half:
      # this chart already shipped an autoscaler that could not scale, so
      # `worker.autoscaling.enabled=true` on a cluster with no KEDA must fail
      # the install rather than create an object no controller reads. The suite
      # also proves the scaler watches the same stream and group the worker
      # consumes — a scaler on the wrong queue reports zero depth, and zero
      # depth scales the fleet DOWN while the backlog grows.
      - name: The worker's autoscaling refuses when it cannot work
        run: bash deploy/helm/tests/render-worker-autoscaling.sh

      # The shared provider shape (templates/_provider.tpl). Every invariant
      # here is one several templates have to agree on, and every disagreement
      # is silent: a migration Job pointed at a different database migrates it
      # successfully and leaves the real schema untouched; an mTLS volume with
      # no mount serves plain HTTP while believing it requires a client
      # certificate; a Job with only Helm's ordering annotation is unordered
      # under Argo.
      - name: The shared provider shape holds together
        run: bash deploy/helm/tests/render-provider-shape.sh

      - name: The DeepWiki component renders, and its guards refuse
        run: bash deploy/helm/tests/render-deepwiki.sh

      # The SECOND provider, and its own suite rather than a case added to
      # DeepWiki's: what has to be asserted is mostly what is DIFFERENT — no
      # migration Job, no provider-side allowlist, and a facade that mounts
      # with no callback origin. A shared suite would have to branch on the
      # provider for half its assertions, and the branches nobody reads are
      # where a guard stops meaning anything.
      - name: The Inventory component renders, and its guards refuse
        run: bash deploy/helm/tests/render-inventory.sh

      - name: The agent worker renders for both implementations
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash deploy/helm/tests/render-worker.sh

      # The BF0.2b render assertions (#485). This file was `deploy/test_bf0_2b.sh`
      # and no workflow, Taskfile task or script called it. Wiring it found two
      # defects on the first run:
      #
      #   1. It could not render the gateway chart at all. The chart has refused
      #      an empty `env.GATEWAY_SELF_LLM_ORIGINS` since #467/#473, and the
      #      script still called `helm template` with no values. It now supplies
      #      the same render-only postures the template matrix supplies.
      #   2. Its ArgoCD sync-wave assertion read `deploy/argocd/nats.yaml`. The
      #      children moved into `deploy/argocd/applications/` with the
      #      app-of-apps layout (#265), so the assertion raised
      #      FileNotFoundError. With no caller, nothing printed it.
      #
      # It covers what no other step here covers: the two NATS profiles, the KV
      # and stream bootstrap, the gateway Service shape and its SSE autoscaling
      # metric, and the sync-wave ORDER (the argocd job below asserts only that a
      # wave annotation is present).
      - name: The NATS and gateway render assertions (BF0.2b)
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash deploy/helm/tests/render-bf0-2b.sh

      # `helm lint` covers every chart. The `template` job below covers only the
      # charts its matrix names, and a chart in neither list is never rendered
      # and never schema-checked, with nothing reporting the hole.
      # otel-collector was exactly that chart until #429: the matrix comment
      # excused nats/ and nats-bootstrap/ by name and said nothing about it.
      #
      # This step reads the matrix out of this file, so adding a chart
      # directory fails here until somebody either templates it or writes down
      # why it cannot be templated.
      - name: Every chart is templated or excluded on purpose
        run: |
          # Charts `helm template` cannot cover on this runner, with the reason:
          # nats/ vendors an upstream subchart, so templating it needs
          # `helm dependency build` and network access to the upstream repo,
          # and nats-bootstrap/ is its companion hook chart.
          excluded="nats nats-bootstrap"
          matrix="$(grep -oE '^ +- chart: [a-z0-9-]+' .github/workflows/helm-lint.yml \
                      | awk '{print $3}' | tr '\n' ' ')"
          if [ -z "$matrix" ]; then
            echo "::error::read no chart name out of the template matrix — this check measured nothing"
            exit 1
          fi
          found=0
          missing=""
          for chart in deploy/helm/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=$((found + 1))
            name="$(basename "$(dirname "$chart")")"
            case " $matrix $excluded " in
              *" $name "*) ;;
              *) missing="$missing $name" ;;
            esac
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no chart matched deploy/helm/*/Chart.yaml — this check measured nothing"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::these charts are neither in the template matrix nor excluded:$missing"
            exit 1
          fi
          echo "chart coverage: $found chart(s), all templated or excluded on purpose"

      # A chart that no release publishes is a chart nobody outside this
      # repository can install. `helm lint` and the template matrix both stay
      # green for it, because neither one asks whether the chart is
      # distributed — the same "absence reads as correctness" shape the two
      # coverage checks above exist for.
      #
      # This reads the chart matrix out of publish.yml, so adding a chart
      # directory fails here until somebody either publishes it or writes down
      # why it must not be published.
      - name: Every chart is published or excluded on purpose
        run: |
          # Charts deliberately not pushed to the OCI registry, with the
          # reason. Empty today: all three charts are published.
          excluded=""
          published="$(grep -oE '^ +- chart: [a-z0-9-]+' .github/workflows/publish.yml \
                        | awk '{print $3}' | tr '\n' ' ')"
          if [ -z "$published" ]; then
            echo "::error::read no chart name out of publish.yml — this check measured nothing"
            exit 1
          fi
          found=0
          missing=""
          for chart in deploy/helm/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=$((found + 1))
            name="$(basename "$(dirname "$chart")")"
            case " $published $excluded " in
              *" $name "*) ;;
              *) missing="$missing $name" ;;
            esac
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no chart matched deploy/helm/*/Chart.yaml — this check measured nothing"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::these charts are published by no release:$missing"
            exit 1
          fi
          echo "publish coverage: $found chart(s), all published or excluded on purpose"

      # The check above runs one way only: every chart directory is in the
      # publish matrix. It cannot see the two other ways the same three lists
      # drift apart, and both had already happened by the time it was written:
      #
      #   * The publish matrix names a chart with no directory. #598 replaced
      #     six per-service charts with one, and a matrix left behind would
      #     fail the release at `helm package` on a path that does not exist.
      #
      #   * The ROLLBACK array in publish.yml disagrees with the matrix. This
      #     one was real and silent for twelve releases: after #598 the array
      #     still listed the six deleted charts and did NOT list `elitea`, so a
      #     failed release deleted its images, warned about six charts that no
      #     longer exist, and left the one chart it had actually published
      #     pointing at images it had just removed — a chart that installs into
      #     a permanent ImagePullBackOff, which is the precise state the
      #     rollback step's own header says it exists to prevent. Nothing was
      #     red. The array is the only hardcoded chart list left in this
      #     repository that no glob derives, so it is the only one that can go
      #     stale without a file being deleted, and it is checked here.
      #
      # deploy/helm/*/Chart.yaml is the single source. Both lists in publish.yml
      # are compared against it, and against each other.
      - name: The publish matrix and the rollback array both match deploy/helm
        run: |
          # Must hold the same entries as `excluded` in the step above: a chart
          # that no release publishes on purpose is also a chart no rollback
          # deletes. Empty today.
          excluded=""
          dirs=""
          found=0
          for chart in deploy/helm/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=$((found + 1))
            name="$(basename "$(dirname "$chart")")"
            case " $excluded " in
              *" $name "*) continue ;;
            esac
            dirs="$dirs $name"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no chart matched deploy/helm/*/Chart.yaml — this check measured nothing"
            exit 1
          fi

          published="$(grep -oE '^ +- chart: [a-z0-9-]+' .github/workflows/publish.yml \
                        | awk '{print $3}' | tr '\n' ' ')"
          if [ -z "$published" ]; then
            echo "::error::read no chart name out of the publish matrix — this check measured nothing"
            exit 1
          fi

          # The rollback array is a single bash line: CHARTS=("a" "b" "c").
          # Anchored on the assignment so a chart name in a comment nearby
          # cannot be mistaken for a member of it.
          rollback="$(grep -oE '^ +CHARTS=\(.*\)' .github/workflows/publish.yml \
                        | sed -E 's/^ +CHARTS=\(//; s/\)$//; s/"//g')"
          if [ -z "$rollback" ]; then
            echo "::error::read no chart name out of the rollback CHARTS array — this check measured nothing"
            exit 1
          fi

          # Compare as sorted sets: order in either list is not a defect.
          normalise() { printf '%s\n' $1 | sort -u | tr '\n' ' '; }
          dirs="$(normalise "$dirs")"
          published="$(normalise "$published")"
          rollback="$(normalise "$rollback")"

          status=0
          if [ "$published" != "$dirs" ]; then
            echo "::error::publish matrix is [${published}], deploy/helm holds [${dirs}]"
            status=1
          fi
          if [ "$rollback" != "$published" ]; then
            echo "::error::rollback CHARTS array is [${rollback}], publish matrix is [${published}] — a failed release would leave a published chart behind, or warn about a chart that does not exist"
            status=1
          fi
          [ "$status" -eq 0 ] || exit 1
          echo "chart lists agree: [${dirs}]"

  template:
    name: Helm Template (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One chart, two passes. The postures are supplied because the LLM
          # gateway is a component of it and REFUSES to render without them —
          # render-only values, `.invalid` reserved by RFC 2606.
          - chart: elitea
            values: -f deploy/helm/elitea/values-staging.yaml --set-string 'llmGateway.env.GATEWAY_SELF_LLM_ORIGINS=https://ci-render-only.example.invalid/llm/v1' --set-string 'llmGateway.egressPosture=public-unrestricted'
            # The runtime plane on, which is the configuration that serves chat
            # and the one whose absence this chart exists to stop shipping
            # silently. Also the non-default branches the pass above skips.
            toggles: -f deploy/helm/elitea/values-standalone.yaml --set-string 'llmGateway.env.GATEWAY_SELF_LLM_ORIGINS=https://ci-render-only.example.invalid/llm/v1' --set-string 'llmGateway.egressPosture=allowlist' --set-string 'llmGateway.env.GATEWAY_EGRESS_ALLOWLIST=ci-render-only.example.invalid:8000' --set main.autoscaling.enabled=false --set main.podDisruptionBudget.enabled=false --set web.autoscaling.enabled=true --set otelCollector.enabled=false
          # nats/ and nats-bootstrap/ are excluded on purpose: nats vendors an
          # upstream subchart, so templating it needs `helm dependency build`
          # and network access to the upstream repo. `helm lint` above still
          # covers them. The "Every chart is templated or excluded on purpose"
          # step in the lint job holds this list and the matrix together, so a
          # new chart cannot quietly join neither.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # `helm template` on a chart with unvendored dependencies fails with
      # "found in Chart.yaml, but missing in charts/ directory" — it does not
      # resolve them itself. The umbrella's dependencies are all file:// paths
      # in this repository, so this needs no network; charts that declare none
      # skip it, exactly as the publish workflow's equivalent step does.
      # Keyed on the tracked Chart.lock rather than parsing Chart.yaml, so this
      # step needs no yq — which this job, unlike the publish workflow, does not
      # install.
      - name: Build chart dependencies
        run: |
          CHART_DIR="deploy/helm/${{ matrix.chart }}"
          if [ -f "${CHART_DIR}/Chart.lock" ]; then
            helm dependency build "$CHART_DIR"
          else
            echo "no dependencies declared"
          fi

      - name: helm template (default values)
        run: |
          helm template ci-release "deploy/helm/${{ matrix.chart }}" \
            ${{ matrix.values }} --debug > "/tmp/${{ matrix.chart }}.yaml"

      # `helm template` only proves the chart RENDERS. kubeconform proves the
      # rendered objects are valid Kubernetes against the real API schemas.
      #
      # Why not `kubectl apply --dry-run=client`, which issue #240 names? That
      # command still needs API discovery from a live cluster to resolve
      # kind -> resource; on a runner with no cluster it fails with
      # "couldn't get current server API group list", so it would gate nothing
      # (or, worse, be neutered with a flag until it gated nothing). kubeconform
      # is the offline equivalent and is strictly stronger: -strict rejects
      # fields the schema does not define, which client dry-run does not.
      - name: kubeconform (default values)
        run: |
          kubeconform -strict -summary -verbose \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            "/tmp/${{ matrix.chart }}.yaml"

      # The pylon-free capability set (#382). It renders objects no other pass
      # produces — the runtime material volume and the three runtime listener
      # ports on both the Deployment and the Service — so a schema error in
      # them is invisible everywhere else.
      - name: helm template + kubeconform (standalone capability values)
        if: matrix.chart == 'elitea'
        run: |
          helm template ci-release deploy/helm/elitea \
            -f deploy/helm/elitea/values-standalone.yaml \
            --set-string 'llmGateway.env.GATEWAY_SELF_LLM_ORIGINS=https://ci-render-only.example.invalid/llm/v1' \
            --set-string 'llmGateway.egressPosture=public-unrestricted' \
            > /tmp/elitea-main-standalone.yaml
          kubeconform -strict -summary -verbose \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            /tmp/elitea-main-standalone.yaml

      # The auth-minimal capability set. It is the combination NO other pass
      # renders: production authentication and the Configurations write path ON
      # with the runtime plane OFF, plus a runtimeRedis that no worker reads.
      #
      # That combination is exactly the one templates/guards.yaml could grow an
      # edge against by accident — worker->runtime and worker->runtimeRedis are
      # guarded, runtimeRedis->runtime deliberately is not — so a guard added
      # without this pass would break the cheapest supported install with every
      # other gate in this file still green.
      - name: helm template + kubeconform (auth-minimal capability values)
        if: matrix.chart == 'elitea'
        run: |
          helm template ci-release deploy/helm/elitea \
            -f deploy/helm/elitea/values-auth-minimal.yaml \
            --set-string 'llmGateway.env.GATEWAY_SELF_LLM_ORIGINS=https://ci-render-only.example.invalid/llm/v1' \
            --set-string 'llmGateway.egressPosture=public-unrestricted' \
            > /tmp/elitea-main-auth-minimal.yaml
          kubeconform -strict -summary -verbose \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            /tmp/elitea-main-auth-minimal.yaml

      # A values file this job never renders is a shipped install shape nothing
      # checks — the same "absence reads as correctness" hole the two chart
      # coverage steps in the lint job exist for. `helm lint` does not read
      # these files at all, so it stays green for every one of them.
      #
      # This reads the file names out of THIS workflow, so adding a
      # values-*.yaml beside the chart fails here until somebody either renders
      # it or writes down why it cannot be rendered.
      - name: Every values file is rendered by some pass
        if: matrix.chart == 'elitea'
        run: |
          # values files deliberately not rendered here, with the reason.
          # Empty today: all three are rendered by a pass in this job.
          excluded=""
          rendered="$(grep -oE 'deploy/helm/elitea/values-[a-z0-9-]+\.yaml' \
                        .github/workflows/helm-lint.yml | sort -u | tr '\n' ' ')"
          if [ -z "$rendered" ]; then
            echo "::error::read no values file name out of this workflow — this check measured nothing"
            exit 1
          fi
          found=0
          missing=""
          for file in deploy/helm/elitea/values-*.yaml; do
            [ -f "$file" ] || continue
            found=$((found + 1))
            case " $rendered $excluded " in
              *" $file "*) ;;
              *) missing="$missing $file" ;;
            esac
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no file matched deploy/helm/elitea/values-*.yaml — this check measured nothing"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::these values files are rendered by no pass in this job:$missing"
            exit 1
          fi
          echo "values coverage: $found file(s), all rendered or excluded on purpose"

      # Toggled-off/on paths (HPA, PVC, optional Services and probes, hook Jobs)
      # render zero objects in the default pass, so a break in them is invisible
      # there.
      - name: helm template + kubeconform (non-default toggles)
        run: |
          helm template ci-release "deploy/helm/${{ matrix.chart }}" \
            ${{ matrix.values }} ${{ matrix.toggles }} > "/tmp/${{ matrix.chart }}-toggles.yaml"
          kubeconform -strict -summary -verbose \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            "/tmp/${{ matrix.chart }}-toggles.yaml"

  argocd:
    name: ArgoCD Applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # Validated against the REAL argoproj.io Application CRD schema (from the
      # CRDs-catalog), with -strict — so a misspelled spec field fails here
      # instead of silently doing nothing in the cluster. See the note in the
      # template job for why this replaces `kubectl apply --dry-run=client`.
      - name: Validate every Application against the Argo CD CRD schema
        run: |
          kubeconform -strict -summary -verbose \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            deploy/argocd/app-of-apps.yaml deploy/argocd/applications/*.yaml

      # Schema validity is not the failure mode that actually bites. These are:
      # a child that the app-of-apps root will never render, and a source.path
      # that points at a chart which does not exist — both of which produce a
      # perfectly valid manifest and a service that is simply never deployed.
      - name: Structural checks on the app-of-apps layout
        run: |
          fail=0

          # 1. Only the root may sit directly in deploy/argocd/; anything else
          #    there is invisible to the root (it renders applications/ only).
          for f in deploy/argocd/*.yaml; do
            if [ "$f" != "deploy/argocd/app-of-apps.yaml" ]; then
              echo "::error file=$f::stray manifest — children belong in deploy/argocd/applications/"
              fail=1
            fi
          done

          # 2. Every manifest in applications/ must BE an Application: the root
          #    includes "*.yaml" indiscriminately and would apply anything else
          #    straight into the argocd namespace.
          for f in deploy/argocd/applications/*.yaml; do
            kind=$(grep -m1 '^kind:' "$f" | awk '{print $2}')
            if [ "$kind" != "Application" ]; then
              echo "::error file=$f::kind is '$kind', expected 'Application'"
              fail=1
            fi
          done

          # 3. Every in-repo source.path must exist and, for a chart path,
          #    contain a Chart.yaml. A typo here syncs nothing, forever.
          for f in deploy/argocd/app-of-apps.yaml deploy/argocd/applications/*.yaml; do
            path=$(grep -m1 '^    path:' "$f" | awk '{print $2}')
            if [ -z "$path" ]; then
              echo "::error file=$f::no spec.source.path"
              fail=1
              continue
            fi
            if [ ! -d "$path" ]; then
              echo "::error file=$f::spec.source.path '$path' does not exist in this repo"
              fail=1
            elif case "$path" in deploy/helm/*) true ;; *) false ;; esac && [ ! -f "$path/Chart.yaml" ]; then
              echo "::error file=$f::spec.source.path '$path' has no Chart.yaml"
              fail=1
            fi
          done

          # 4. Every child must carry a sync-wave. The default is 0, which
          #    would silently co-schedule a new service with the gateway
          #    instead of after the migrations it depends on.
          for f in deploy/argocd/applications/*.yaml; do
            if ! grep -q 'argocd.argoproj.io/sync-wave:' "$f"; then
              echo "::error file=$f::no argocd.argoproj.io/sync-wave annotation"
              fail=1
            fi
          done

          exit $fail
