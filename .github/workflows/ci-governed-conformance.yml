name: CI — Governed-profile conformance

# ADR-0039 P6b (issue #1124): the governed credential profile, end to end, on
# the full standalone stack with deploy/docker-compose.governed.yml (OpenBao
# with TLS and cas_required KV v2, the Entra/Jira/Graph doubles in
# deploy/governed-mocks, the inbound MCP issuer, the NATS tap).
# deploy/scripts/governed-conformance.sh owns the lifecycle: it walks one
# stack through the flag-off, flag-on, old-worker, restored and rollback
# phases, runs conformance/governed against each (GOV-001 to GOV-010 and the
# rollback test), holds every skip to scripts/go/declared-skips.txt, and ends
# with the secret canary scan over the NATS tap, every database dump, every
# container log (the OTLP collector's debug export included) and the audit
# outbox. The scan's negative self-test runs first, so a blind scanner fails.
#
# Its own workflow rather than a lane in ci-web-e2e.yml: the governed overlay
# adds an image the build-once jobs do not build (governed-mocks), the run is
# long, and it is wanted nightly and on demand rather than on every stack
# change. Pull requests run it only when they touch the suite or its stack.
#
# The stack images: on a pull request ci.yml runs ci-build-once.yml first and
# passes its results in, and the `stack` job pulls the images it pushed by
# digest (.github/actions/stack-images). It builds them itself, reading the
# shared cache and writing none, only when nothing was built for it: a fork's
# or Dependabot's pull request, or its own schedule or dispatch.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
    inputs:
      web-images:
        description: ci-build-once.yml's `web-images` output (the job result); empty when nothing was built for this run.
        type: string
        default: ""
      stack-images:
        description: ci-build-once.yml's `stack-images` output.
        type: string
        default: ""
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-governed-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The parts that need no stack: the canary scanner and its negative
  # self-test, the declared-skip checker, the flag-off golden-vector pin
  # (GOV-001's unit leg), and a compile of the tagged suite and the mocks.
  unit:
    name: Scanner, skip ledger, golden vectors
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    env:
      # The pod's cgroup gives 4 CPU while the node reports 8; hosted runners have 4.
      GOMAXPROCS: "4"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume (does nothing on hosted).
      - uses: ./.github/actions/eng-runner-env
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (read only, one writer per key)
        uses: ./.github/actions/go-cache
        with:
          # Restores only: one writer per key (scripts/ci/check-cache-budget.mjs).
          save: "false"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - name: Vet and test the suite module
        working-directory: conformance/governed
        run: |
          go vet ./...
          go vet -tags conformance ./...
          go build -tags conformance ./...
          go test -count=1 ./...
      - name: Canary scanner negative self-test
        working-directory: conformance/governed
        run: go run ./cmd/canary-scan -selftest
      - name: Vet and build the governed mocks
        working-directory: deploy/governed-mocks
        run: |
          go vet ./...
          go build ./...

  stack:
    name: Governed profile on the standalone stack
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      # success: pull. skipped or empty: build here. Anything else is a build
      # that failed for this commit, and the stack cannot be what it tests.
      - name: The build-once images for this commit did not fail
        env:
          WEB: ${{ inputs.web-images }}
          STACK: ${{ inputs.stack-images }}
        run: |
          for result in "$WEB" "$STACK"; do
            case "$result" in
              "" | success | skipped) ;;
              *) echo "::error::ci-build-once.yml did not build this commit's images (web-images: ${WEB}, stack-images: ${STACK})"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (read only, one writer per key)
        uses: ./.github/actions/go-cache
        with:
          # Restores only: one writer per key (scripts/ci/check-cache-budget.mjs).
          save: "false"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - name: Free runner disk for the stack images
        # The stack images and their Go module downloads filled the runner's
        # disk (ENOSPC in go mod download, PR #1545). Bounded and NON-FATAL,
        # as in deepwiki-real-engine.yml: a refused rm only warns, and the
        # build then fails honestly on ENOSPC.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            || echo "::warning::could not remove every preinstalled toolchain; continuing"
          df -h / | tail -1
      - name: Stack images (pulled by digest; built here when nothing was built for this run)
        # The base stack only: governed-mocks is not a bake target, and the
        # script builds it (STANDALONE_SKIP_BUILD=1 builds that one image).
        # Built ONCE per commit by ci-build-once.yml (the same compose files
        # and Containerfiles); the fallback build reads the shared cache and
        # writes none.
        uses: ./.github/actions/stack-images
        with:
          built: ${{ inputs.web-images == 'success' && inputs.stack-images == 'success' }}
          compose-files: |
            docker-compose.standalone-full.yml
            docker-compose.standalone-rust-agent.yml
          cache-hcl: |
            ci/bake-cache.hcl
            ci/bake-cache-rust.hcl
          targets: standalone-rust
          mount-cache-suffix: rust
      - name: Run the governed conformance phases and the canary scan
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          STANDALONE_SKIP_BUILD: "1"
          STANDALONE_WORKER: rust
          STANDALONE_PROJECT: elitea-governed-conformance-ci
          STANDALONE_PORT: "8094"
          ELITEA_GOVERNED_EVIDENCE_DIR: ${{ github.workspace }}/.governed-evidence
        run: bash deploy/scripts/governed-conformance.sh run
      - name: Upload the run's evidence (test logs and the scan's inputs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governed-conformance-evidence
          # The canary list is uploaded with the rest: every value in it is a
          # random test string that authenticates nothing outside this run.
          path: .governed-evidence/
          # The directory itself is hidden, and upload-artifact skips hidden
          # paths unless told otherwise, so nothing was ever uploaded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
