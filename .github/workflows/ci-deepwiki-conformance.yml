name: CI — Provider conformance fixtures

# The published provider contract (conformance/provider): the phase-P0 golden
# fixtures DeepWiki was ported against, the legacy v0 bundle, and the DeepWiki
# descriptor revision guard (tests/test_descriptor_revision.py, which keeps
# the Go host's served descriptor equal to the generated legacy-v1 fixture).
# It installs nothing but pytest — replaying the committed fixtures needs only
# the standard library. Fixtures that nothing replays are dead weight that
# reads as coverage.
#
# The Python DeepWiki service and its service, storage-parity and image jobs
# were removed with services/elitea-deepwiki; the Rust engine's gates are in
# ci-deepwiki-engine.yml, and the Go host replays the same fixtures in
# ci-go.yml. Re-recording the fixtures from the legacy deepwiki_plugin
# checkout (conformance/provider/tools/record_*.py) is a local step — the
# legacy plugin is not available to CI.

on:
  pull_request:
    paths:
      - "conformance/provider/**"
      - "libs/provider/**"
      - "scripts/provider/**"
      # The descriptor guard compares the fixture with the copy the Go host
      # serves.
      - "services/elitea-subapp-host/internal/apps/deepwiki/descriptor.json"
      - ".github/workflows/ci-deepwiki-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "conformance/provider/**"
      - "libs/provider/**"
      - "scripts/provider/**"
      # The descriptor guard compares the fixture with the copy the Go host
      # serves.
      - "services/elitea-subapp-host/internal/apps/deepwiki/descriptor.json"
      - ".github/workflows/ci-deepwiki-conformance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixtures:
    name: Fixture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8.0"

      - name: Replay fixtures
        working-directory: conformance/provider
        run: python -m pytest -q

      # The vendored legacy v0 schema documents are byte-identical to what the
      # bundle manifest declares. They describe what legacy providers ALREADY
      # EMIT in the field, so editing one does not change any provider — it
      # changes what this platform believes providers emit, and the two then
      # disagree with nothing reporting it.
      - name: The legacy v0 bundle has not drifted
        run: bash scripts/provider/verify-legacy-bundle.sh
