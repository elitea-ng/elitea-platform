name: CI — Image scan

# Every image publish.yml pushes is scanned here for HIGH and CRITICAL
# vulnerabilities.
#
# WHY THIS WORKFLOW EXISTS (#433)
#
# The scan used to be a `FROM aquasec/trivy:latest AS scanner` stage inside a
# Containerfile. No stage copied from it, so a builder pruned it from the build
# graph and the scan never ran. #224 recorded that for elitea-main and PR #432
# moved that one scan into ci-go.yml. services/elitea-llm-gateway carried the
# identical dead stage, and elitea-scheduler, elitea-web, elitea-ui and
# pylon-indexer had no scan of any kind.
#
# WHY IT IS NOT IN ci-go.yml
#
# GitHub path filters are per workflow, not per job. Teaching ci-go.yml to
# trigger on apps/elitea-web/** would run its Postgres service, its storage
# emulators and the whole workspace test suite on every front-end change. A gate
# that does not trigger on the file it guards is a false green, and a gate that
# drags an unrelated suite behind it gets switched off by the next person. One
# workflow whose subject is "the published images" answers both.
#
# WHAT KEEPS IT HONEST
#
#   1. The image list is checked against publish.yml. An image that gets
#      published without a scan fails the `coverage` job by name. The old
#      hand-written matrix could not report what it left out — that is exactly
#      how two of nine modules read as "the Go code is linted" (#427).
#   2. Each scan states the target type it must find. A report that holds no
#      such target fails. "Found nothing" and "did not really run" have to look
#      different, because looking the same is how the dead stage survived.
#   3. The threshold is HIGH,CRITICAL for every image. There is no ignore file,
#      no `--ignore-unfixed`, and no waiver.
#   4. The gate itself is proved red. `scripts/ci/image-scan-gate-test.sh`
#      drives every arm of the gate with synthetic reports, and the
#      `gate-selftest` job runs it here.
#
# THE RELEASE RUNS THIS SAME GATE (#501)
#
# This workflow scans a REBUILD of each image, on every pull request, on every
# push to main and daily. That left one window open: a CVE published between
# the last scan of main and a release shipped, and the daily run reported it
# after the fact. publish.yml now scans the image the release PUSHED, before
# the manifest job creates the `latest` tag.
#
# Both read one rule, `scripts/ci/image-scan-gate.sh`. A second copy of "which
# report blocks" drifts, and a release gate that is a little more forgiving
# than the merge gate is worse than no release gate: it reports the same words
# for a weaker test. The `coverage` job fails when the two matrices disagree
# about an image, its expected target type, or whether it blocks.
#
# TWO IMAGES DO NOT BLOCK, AND THEY SAY SO
#
# `pylon-indexer` and `elitea-worker-python` are scanned, report their full
# finding counts, and do NOT fail the merge. Every other image blocks.
#
# They are exempt for different reasons, and the difference is the point.
# pylon-indexer's 604 findings are ALL upstream. elitea-worker-python's are
# mixed: 50 come from a Debian base with no fix available, and 30 are its own
# pinned packages, which is why #554 exists to fix those 30 and end the
# exemption. `.github/image-scan-exempt.txt` records both, and its criteria
# were widened in the same change rather than stretched in silence.
#
#   WHY: all 604 findings come from `ghcr.io/eliteaai/pylon:1.2.25`. This
#   repository does not build that image; `services/pylon-indexer/Containerfile`
#   copies three config files on top of it. Issue #509 holds the finding list.
#   Issue #339 retires the image: the index plane moves to index v2 and
#   pylon-indexer is deleted.
#
#   WHY NOT LET IT BLOCK: a job that is red on every branch, for a cause no
#   branch can fix, teaches every reader to ignore this workflow. That would
#   cost the other five scans their meaning.
#
#   WHAT THE EXEMPTION DOES NOT COVER: the threshold is unchanged, no CVE is
#   suppressed, and the dormancy guards still BLOCK for this image. A missing
#   report, or a report without a `python-pkg` target, fails the job like any
#   other. Only the finding count is downgraded, from an error to a warning.
#
#   HOW IT ENDS: delete the `pylon-indexer` entry when #339 deletes the image.
#   Until then the job FAILS if the image ever reports zero findings, because an
#   exemption that outlives its cause is the next stale gate.
#
#   Two files must agree before an image stops blocking: the `blocking` field in
#   the matrix below, and `.github/image-scan-exempt.txt`. The `coverage` job
#   fails when they differ. So one edit cannot quietly exempt a second image,
#   and a pull request that adds an exemption changes a file whose only subject
#   is exemptions.

on:
  pull_request:
    paths:
      # Sources of the shipped binaries and assets.
      - "services/elitea-main/**"
      - "services/elitea-worker-python/**"
      - "services/elitea-worker-rust/**"
      - "services/elitea-scheduler/**"
      - "services/elitea-subapp-host/**"
      - "services/elitea-llm-gateway/**"
      - "services/pylon-indexer/**"
      - "apps/elitea-web/**"
      # The elitea-ui image builds the apps/elitea-ui submodule, so a submodule
      # pointer bump changes the image without changing a file in this tree.
      - "apps/elitea-ui"
      - "deploy/docker/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-image-scan.yml"
      # The exemption register. An edit to it must run the check that reads it.
      - ".github/image-scan-exempt.txt"
      # The coverage job below reads publish.yml's image list. A new image added
      # there must run this workflow, or the gap it opens stays unreported.
      # publish.yml also carries the RELEASE scan (#501), whose matrix this
      # workflow holds in agreement with its own.
      - ".github/workflows/publish.yml"
      # The gate rule, and the test that proves it goes red. Both workflows run
      # the first file; an edit to either must run the test (#518's rule).
      - "scripts/ci/image-scan-gate.sh"
      - "scripts/ci/image-scan-gate-test.sh"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/**"
      - "services/elitea-worker-python/**"
      - "services/elitea-worker-rust/**"
      - "services/elitea-scheduler/**"
      - "services/elitea-subapp-host/**"
      - "services/elitea-llm-gateway/**"
      - "services/pylon-indexer/**"
      - "apps/elitea-web/**"
      - "apps/elitea-ui"
      - "deploy/docker/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "gen/go/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-image-scan.yml"
      # The exemption register. An edit to it must run the check that reads it.
      - ".github/image-scan-exempt.txt"
      - ".github/workflows/publish.yml"
      - "scripts/ci/image-scan-gate.sh"
      - "scripts/ci/image-scan-gate-test.sh"
  # A commit-triggered scan only measures the day the commit landed. A CVE
  # published tomorrow against code that did not change is invisible to it, and
  # that is most CVEs. The daily run scans what main ships today.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Is every published image scanned? ───────────────────────────────────────
  coverage:
    name: Every published image has a scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          command -v yq >/dev/null || { sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }

      # Reads both matrices out of the YAML. An empty read is a FAILURE, not an
      # empty set difference: a renamed job or a changed key would otherwise
      # compare nothing with nothing and report full coverage.
      - name: Compare the scan matrix with the publish matrix
        run: |
          set -euo pipefail
          indent() { while IFS= read -r line; do printf '  %s\n' "$line"; done; }

          published="$(yq -r '.jobs.build.strategy.matrix.image[].name' .github/workflows/publish.yml | sort -u)"
          scanned="$(yq -r '.jobs.scan.strategy.matrix.image[].name' .github/workflows/ci-image-scan.yml | sort -u)"

          if [ -z "$published" ]; then
            echo "::error::read no image name from publish.yml — the comparison below would pass on an empty set"
            exit 1
          fi
          if [ -z "$scanned" ]; then
            echo "::error::read no image name from this workflow — the comparison below would pass on an empty set"
            exit 1
          fi

          echo "published by publish.yml:"; echo "$published" | indent
          echo "scanned by this workflow:"; echo "$scanned" | indent

          missing="$(comm -23 <(echo "$published") <(echo "$scanned"))"
          if [ -n "$missing" ]; then
            echo "::error::publish.yml ships image(s) that no scan covers:"
            echo "$missing" | indent
            exit 1
          fi

          # The other direction is a defect too, in the other costume: a scan
          # of an image nobody ships spends CI time and reads as coverage.
          extra="$(comm -13 <(echo "$published") <(echo "$scanned"))"
          if [ -n "$extra" ]; then
            echo "::error::this workflow scans image(s) that publish.yml does not ship:"
            echo "$extra" | indent
            exit 1
          fi

          echo "Every published image has a scan."

      # The second half of the exemption control. `blocking: false` in the scan
      # matrix stops an image failing the merge; `.github/image-scan-exempt.txt`
      # is the register of images allowed to carry it. TWO FILES must agree, so
      # one edit cannot quietly exempt a second image, and a pull request that
      # adds an exemption touches a file whose only subject is exemptions.
      #
      # This step also proves the check above still bites. Removing an exempt
      # image from the matrix does NOT make this workflow green: the image is
      # still in publish.yml, so the comparison above reports it as missing.
      - name: Check that only the registered image is exempt
        run: |
          set -euo pipefail
          indent() { while IFS= read -r line; do printf '  %s\n' "$line"; done; }

          register=.github/image-scan-exempt.txt
          if [ ! -f "$register" ]; then
            echo "::error::${register} is missing — the exemption register must exist, even when it is empty"
            exit 1
          fi
          registered="$(grep -vE '^[[:space:]]*(#|$)' "$register" | sort -u || true)"

          total="$(yq -r '.jobs.scan.strategy.matrix.image | length' .github/workflows/ci-image-scan.yml)"
          with_field="$(yq -r '[.jobs.scan.strategy.matrix.image[] | select(has("blocking"))] | length' .github/workflows/ci-image-scan.yml)"
          if [ "$total" -eq 0 ]; then
            echo "::error::read no image from the scan matrix — this check would pass on an empty set"
            exit 1
          fi
          if [ "$total" != "$with_field" ]; then
            echo "::error::${with_field} of ${total} scan matrix entries carry a blocking field; every entry must state it"
            exit 1
          fi

          exempt="$(yq -r '.jobs.scan.strategy.matrix.image[] | select(.blocking == false) | .name' .github/workflows/ci-image-scan.yml | sort -u)"

          if [ "$exempt" != "$registered" ]; then
            echo "::error::the scan matrix and ${register} disagree about which images are exempt."
            echo "registered in ${register}:"
            echo "${registered:-(none)}" | indent
            echo "marked blocking: false in the scan matrix:"
            echo "${exempt:-(none)}" | indent
            echo "::error::an image stops blocking only when BOTH files say so. Record the findings issue and the retirement issue in ${register}."
            exit 1
          fi

          echo "Exempt — scanned, reported, does not block:"
          echo "${exempt:-(none)}" | indent
          echo "Every other published image blocks on a HIGH or CRITICAL finding."

      # The release path scans the images it PUSHED, before the manifest job
      # creates the `latest` tag (#501). Its matrix states the same three
      # values this one does: the image name, the target type the report must
      # hold, and whether a finding blocks.
      #
      # THREE files must now agree. Without this step a release could exempt an
      # image that this workflow blocks, or expect a target type the image
      # never reports, and the release gate would read as green while measuring
      # less. An empty read on either side FAILS: comparing nothing with
      # nothing reports full agreement.
      - name: The release scan states the same rule as this one
        run: |
          set -euo pipefail
          indent() { while IFS= read -r line; do printf '  %s\n' "$line"; done; }

          # Both files name the job `scan`; in publish.yml it is the job the
          # manifest job `needs`, so one refused image stops every manifest. The
          # signature are one job so a release costs 10 runner slots instead of
          # 30. The MATRIX FIELDS being compared are identical, which is what
          # this step is about.
          fields='.name + "|" + .expect_type + "|" + (.blocking | tostring)'
          here="$(yq -r ".jobs.scan.strategy.matrix.image[] | $fields" .github/workflows/ci-image-scan.yml | sort -u)"
          release="$(yq -r ".jobs.scan.strategy.matrix.image[] | $fields" .github/workflows/publish.yml | sort -u)"

          if [ -z "$here" ]; then
            echo "::error::read no scan entry from this workflow — the comparison below would pass on an empty set"
            exit 1
          fi
          if [ -z "$release" ]; then
            echo "::error::read no scan entry from publish.yml. Either the release scan job (\`scan\`) was renamed or deleted (#501), or its matrix key changed. A release that scans nothing must not read as a release that scanned everything."
            exit 1
          fi

          if [ "$here" != "$release" ]; then
            echo "::error::the merge scan and the release scan disagree. Each line is name|expect_type|blocking."
            echo "this workflow:"; echo "$here" | indent
            echo "publish.yml:";  echo "$release" | indent
            echo "::error::both read scripts/ci/image-scan-gate.sh, so a difference here is a difference in what the release measures."
            exit 1
          fi

          echo "The release scans the same images, for the same target types, with the same blocking rule:"
          echo "$here" | indent

  # ── Build each published image and scan it ──────────────────────────────────
  scan:
    # The check name states the mode. A reader who sees only the check list must
    # be able to tell which images gate the merge and which one does not.
    # Neither arm of the expression is an empty string: `x && '' || y` always
    # returns y, because '' is falsy.
    name: Scan ${{ matrix.image.name }} (${{ matrix.image.blocking && 'blocking' || 'exempt, reports only' }})
    runs-on: ubuntu-latest
    # fail-fast is off on purpose. One red image must not hide the state of the
    # other five — a partial report tells the reader less than a complete one.
    strategy:
      fail-fast: false
      matrix:
        image:
          # `context`, `dockerfile` and `target` mirror publish.yml exactly. If
          # they drift, this job scans something the release does not ship.
          #
          # `expect_type` is the trivy Result.Type this image MUST report. It is
          # the dormancy guard, and each value is MEASURED, not guessed.
          # The key holds an underscore, not a hyphen: a GitHub expression reads
          # `matrix.image.expect-type` as a subtraction.
          #   gobinary    the Go binary in a distroless image;
          #   alpine      the package database of the nginx runtime image;
          #   python-pkg  the site-packages of the pylon base image.
          # Each value names the APPLICATION content, not only the operating
          # system, so a scan that reads the base layers and stops short still
          # fails. A report without that type means the scan did not reach what
          # the image ships, and it fails instead of reading as clean.
          #
          # `blocking: false` means the FINDING COUNT is reported and does not
          # fail the merge. It never relaxes the threshold and it never relaxes
          # the dormancy guards. Read the header for the one image that carries
          # it, and for the two files that must agree before a second one does.
          - name: elitea-main
            context: .
            dockerfile: ./services/elitea-main/Containerfile
            target: final
            expect_type: gobinary
            blocking: true
          - name: elitea-scheduler
            context: .
            dockerfile: ./services/elitea-scheduler/Containerfile
            target: ""
            expect_type: gobinary
            blocking: true
          - name: elitea-subapp-host
            context: .
            dockerfile: ./services/elitea-subapp-host/Containerfile
            target: ""
            expect_type: gobinary
            blocking: true
          # Repo ROOT context, not the module directory: the module replaces
          # libs/go/egresslib, which the Containerfile must COPY from outside
          # services/elitea-llm-gateway.
          - name: elitea-llm-gateway
            context: .
            dockerfile: ./services/elitea-llm-gateway/Containerfile
            target: final
            expect_type: gobinary
            blocking: true
          - name: elitea-ui
            context: .
            dockerfile: ./deploy/docker/Containerfile.elitea-ui
            target: ""
            expect_type: alpine
            blocking: true
          - name: elitea-web
            context: .
            dockerfile: ./apps/elitea-web/Containerfile
            target: ""
            expect_type: alpine
            blocking: true
          # Retired by #339. Findings recorded in #509. See the header.
          - name: pylon-indexer
            context: ./services/pylon-indexer
            dockerfile: ./services/pylon-indexer/Containerfile
            target: ""
            expect_type: python-pkg
            blocking: false
          # Exemption recorded in #553 (findings) and #554 (what ends it).
          # See the header: this is the mixed case, not an upstream-only one.
          #
          # expect_type is MEASURED, not guessed: trivy reports a `debian`
          # Result for the python:3.12-slim base and a `python-pkg` Result for
          # site-packages. python-pkg is the application half, so a scan that
          # reads only the OS layers fails the dormancy guard instead of
          # reading as clean.
          - name: elitea-worker-python
            # context/dockerfile mirror publish.yml exactly — repo root,
            # because the Containerfile COPYs libs/proto and testdata/proto.
            context: .
            dockerfile: ./services/elitea-worker-python/Containerfile
            target: ""
            expect_type: python-pkg
            blocking: false
          # Repo root for the same reason: the Containerfile COPYs libs/proto
          # from outside the service directory. `expect_type: rustbinary` is
          # readable ONLY because that Containerfile builds with
          # cargo-auditable — read the comment there before changing either.
          - name: elitea-worker-rust
            context: .
            dockerfile: ./services/elitea-worker-rust/Containerfile
            target: ""
            expect_type: rustbinary
            blocking: true
          # The DeepWiki provider service (ADR-0022 P3). Repo ROOT context: the
          # Containerfile COPYs services/elitea-deepwiki from there.
          #
          # Built WITHOUT the engine extra, exactly as publish.yml releases it.
          # Scanning the engine image instead would report on a multi-GB ML
          # closure nobody publishes, which is a scan of something that does not
          # ship — the shape this gate exists to avoid in the other direction.
          #
          # EXEMPT, and the exemption is measured rather than assumed.
          #
          # It was written `blocking: false` with no register entry, which the
          # coverage check refused; it then ran as `blocking: true`, and THAT
          # is the run that produced the numbers. 73 HIGH/CRITICAL, every one
          # from the Debian base and none from this project's own packages.
          #
          # The base then moved from python:3.12.10-slim (Debian 12.11) to
          # 3.12.14-slim (trixie), taking it to 19, and the three that had a
          # published fix are closed by an --only-upgrade in the Containerfile.
          # The remaining 16 have no fixed version in Debian at all, which is
          # criterion 1 of .github/image-scan-exempt.txt exactly.
          #
          # Findings #635, retirement #636. Both files must agree, and the
          # coverage job fails when they do not.
          - name: elitea-deepwiki
            context: .
            dockerfile: ./services/elitea-deepwiki/Containerfile
            target: ""
            build_args: |
              EXTRAS=[storage-postgres]
            expect_type: python-pkg
            blocking: false

    steps:
      - uses: actions/checkout@v7
        with:
          # The elitea-ui image builds apps/elitea-ui, which is a submodule.
          submodules: recursive

      - uses: docker/setup-buildx-action@v4
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      # One platform. The scan reads Go module metadata and OS package
      # databases, and neither depends on the architecture.
      - name: Build the shipping image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          # Empty for single-target images, which build their last stage. Same
          # expression publish.yml uses.
          target: ${{ matrix.image.target }}
          # Empty for every image but elitea-deepwiki, which needs its storage
          # extra to be the image publish.yml actually releases. Scanning a
          # different build than the one that ships is a scan of nothing.
          build-args: ${{ matrix.image.build_args }}
          push: false
          load: true
          tags: ${{ matrix.image.name }}:ci-scan
          platforms: linux/amd64
          # ONE content-addressed layer cache per image, named after the
          # platform it holds — NOT a private `-ci-scan` scope.
          #
          # This step builds linux/amd64 from the same Containerfile, the same
          # context and the same build-args as publish.yml's amd64 `build` leg,
          # so its layers ARE that build's layers. Under the old scope name the
          # same image was cached three times per push under three unrelated
          # keys (nothing in ci-web-e2e.yml, `<name>-ci-scan` here,
          # `<name>-linux-amd64` in publish.yml), so every one of them was cold
          # for work another job on the same commit had already done, and the
          # 10 GB GHA cache was spent holding three copies.
          #
          # Sharing the scope is safe precisely because the cache is
          # content-addressed: a layer is keyed by its inputs, so a job that
          # builds something different simply misses instead of reading a wrong
          # entry. It is a hit rate, never a source of truth — the scan still
          # builds and reads the image it is given.
          cache-from: type=gha,scope=${{ matrix.image.name }}-linux-amd64
          # mode=max on a PUSH to main, mode=min otherwise — the daily schedule
          # also carries the main ref and must not export every layer nightly.
          # The same write policy as .github/actions/build-stack-images.
          cache-to: type=gha,mode=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'max' || 'min' }},scope=${{ matrix.image.name }}-linux-amd64

      # exit-code 0 on purpose: this step collects the report, and the step
      # below is the gate. Splitting them lets the gate print every finding.
      - name: Scan the shipping image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:ci-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "0"

      # Three failures, not one:
      #   - no report at all: the scan did not run;
      #   - a report without the expected target type: the scan ran but never
      #     reached what the image ships;
      #   - any HIGH or CRITICAL finding, with the list.
      #
      # The first two BLOCK for every image, including the exempt ones. The
      # exemption covers a known finding set that this repository cannot fix. It
      # does not cover a scan that stopped running.
      #
      # The rule lives in scripts/ci/image-scan-gate.sh, not here, because
      # publish.yml runs the SAME rule against the image a release pushed
      # (#501). Two copies of "which report blocks" drift, and a release gate
      # that is a little more forgiving than the merge gate is worse than none:
      # it reports the same words for a weaker test.
      - name: Gate on HIGH and CRITICAL findings
        run: |
          bash scripts/ci/image-scan-gate.sh \
            trivy-report.json \
            "${{ matrix.image.name }}" \
            "${{ matrix.image.expect_type }}" \
            "${{ matrix.image.blocking }}"

  # ── Does the gate itself go red? ────────────────────────────────────────────
  #
  # The gate above and the release gate in publish.yml both read one script.
  # This job drives that script with synthetic trivy reports and checks each
  # arm: a clean report passes, a HIGH finding fails, a CRITICAL finding fails,
  # a missing or unparsable report fails, a report that never reached the
  # application content fails EVEN WITH NO FINDING, and an exempt image with
  # zero findings fails because its exemption is then stale.
  #
  # It needs no image, no registry and no trivy, so it costs seconds. #501 asks
  # for the release gate to be PROVED red rather than asserted; this is where
  # that proof runs on every change.
  gate-selftest:
    name: The scan gate goes red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drive every arm of the gate with synthetic reports
        run: bash scripts/ci/image-scan-gate-test.sh
