name: CI — Web

# apps/elitea-web's FAST quality gates (spec §7.6, unit F2). Replaces ci-ui.yml
# at cutover step 8 — until then both run side by side. Every job here is
# node-only (plus go for `parity`), runs in a couple of minutes, and blocks
# PRs: quality (typecheck + lint), storybook, the sharded unit-test + coverage
# jobs, the gate-* family, build, parity.
#
# JOB COUNT IS A BUDGET. The organisation is on the GitHub free plan: 20
# concurrent jobs for the WHOLE org. This workflow used to start 37 runner jobs
# per push — ten unit shards plus twenty-three separate jobs that each spent
# ~1 min on runner setup and ~0.4 min on `npm ci` in order to run one node
# script for 10–60 s. On a busy main push those jobs queued 25–42 minutes for a
# slot, so the wall-clock cost of the suite was dominated by queueing, not by
# the gates. The same gates, the same commands and the same artifacts now run
# in ~12 jobs: the single-script gates are grouped behind ONE checkout +
# `npm ci` (`gates-static`), typecheck and lint share a job (`quality`), the
# post-merge coverage checks are steps of `coverage-merge`, and the unit matrix
# is 5 shards rather than 10. Each gate keeps its own step, named after the job
# it used to be, so the evidence stays legible in the Checks UI.
#
# The heavy containerised suites are NOT here (issue #157):
#   • e2e + visual        → .github/workflows/ci-web-e2e.yml
#   • mutation spot-check → .github/workflows/ci-web-mutation.yml
# The split is mechanical — when each of those fires is unchanged, and is
# documented in the file that now owns it.
#
# npm ci works here because the lockfile is committed (fixes the old D4);
# the npm cache is keyed on that lockfile.

on:
  # The backend / compose / bake paths below were added when the E2E job still
  # lived in this file, and are kept unchanged by the #157 split: narrowing them
  # would change when these gates fire, which is out of that issue's scope.
  # ci-web-e2e.yml carries the same list for the reason it was written — the
  # E2E stack runs elitea-main alongside elitea-web, so a backend change can
  # break a journey while touching nothing under apps/elitea-web.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "deploy/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "deploy/**"
      - ".github/workflows/ci-web.yml"
    # NO `tags: v*` — issue #309, Gate 2. publish.yml cuts release tags with
    # `secrets.GITHUB_TOKEN`, and GitHub does not start workflow runs for refs
    # created by GITHUB_TOKEN. Measured: `gh api .../actions/runs` returns zero
    # runs on any `v1.*` ref, for any workflow. A tag trigger here was never a
    # release gate, only the appearance of one.
    # scripts/check-ci-dormancy.mjs fails the build if one is added back.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/elitea-web

jobs:
  quality:
    # Was two jobs, `typecheck` and `lint`. Both are one npm script over the
    # same installed tree, and each spent more time on runner setup + `npm ci`
    # than on its own work. They are steps here; a failure still names the step.
    name: Quality (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (oxlint + tsgolint + elitea/* + i18next bridge)
        # --deny-warnings: every rule is pinned error today; the flag is a
        # tripwire so a future warn-severity rule can never pass CI silently
        # (package.json is F1's, so the flag rides the CI invocation).
        run: npm run lint -- --deny-warnings

  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    # This job keeps its own runner because of the job-level `container:`
    # below — it cannot be folded into `quality` or `gates-static`, which run
    # on the bare runner.
    #
    # @storybook/addon-vitest launches a real headless Chromium for every
    # story's interaction/a11y test (independently of the plain vitest
    # `browser` project, which this job never runs — see package.json's
    # test:unit script). `npx playwright install --with-deps chromium` used
    # to provide it and cost up to 20 minutes: the browser download is
    # ~14s, the rest is `apt-get` fetching ~114 MB of system libraries onto a
    # runner that then throws them away, and on a slow/rate-limited mirror
    # that apt run is what stretched to 20 minutes.
    #
    # `mcr.microsoft.com/playwright:vX.Y.Z-noble` ships Chromium AND those
    # system libraries pre-installed, so running the whole job inside it
    # removes the install step instead of caching around it (caching
    # ~/.cache/ms-playwright only recovers the ~14s download, not the apt
    # cost). This is the same mechanism ci-web-e2e.yml's `e2e`/`chat-stream`/
    # `index-stream` jobs use — see their "No `npx playwright install
    # --with-deps`" comments — except THIS job can use a job-level
    # `container:` where those can't: they reach a compose stack on the
    # HOST's network, which a job container doesn't share, while this job
    # talks to nothing outside itself (vitest's own browser-mode server).
    #
    # `--ipc=host`: Playwright's documented Docker recommendation, avoids
    # Chromium running out of /dev/shm. No `--user`: playwright-core adds
    # `--no-sandbox` for Chromium automatically when it detects uid 0.
    #
    # The tag is kept honest by scripts/check-playwright-image-tag.mjs, which
    # scans EVERY workflow and asserts each
    # `mcr.microsoft.com/playwright:vX.Y.Z-noble` matches the pinned
    # @playwright/test — so this reference is gated automatically.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Storybook tests
        # Issue #483, the fourth gate of the same shape. This step read
        # `if [ -d .storybook ] … else echo "storybook project pending"`. The
        # comment describing the stub outlived the stub: `.storybook/` and the
        # vitest `storybook` project both exist, so the else arm was a green
        # tick waiting for a rename.
        #
        # The directory is not the subject. The STORIES are: addon-vitest turns
        # each story into a test, so a `stories` glob in .storybook/main.ts that
        # stops matching leaves the directory in place and the suite empty. The
        # count comes from that glob's own root, and it is printed. `vitest run`
        # leaves `passWithNoTests` at false, which is a second line of defence
        # rather than the measurement.
        #
        # `shell: bash` — GitHub defaults job-container steps to `sh` (dash),
        # not bash, unlike steps on a bare `runs-on` runner. dash rejects
        # `set -o pipefail` outright ("Illegal option -o pipefail"), which
        # failed this step before it reached its own logic. The pinned
        # Playwright image is Ubuntu-based and ships bash.
        shell: bash
        run: |
          set -euo pipefail
          test -d .storybook || {
            echo "::error::apps/elitea-web/.storybook is missing, so the Storybook suite cannot run. Restore the directory under its old name, or point this job at the new one. Do not let the job pass."
            exit 1
          }
          stories=$(find src/shared/ui -name '*.stories.ts' -o -name '*.stories.tsx' | grep -c '' || true)
          echo "${stories} story file(s) under src/shared/ui — the .storybook/main.ts glob root"
          if [ "${stories}" -eq 0 ]; then
            echo "::error::no *.stories.ts(x) file under apps/elitea-web/src/shared/ui, so the Storybook suite would run nothing. Move the glob in .storybook/main.ts with the stories. Do not let the job pass."
            exit 1
          fi
          npm run test:storybook

  unit-tests:
    name: Unit tests (sharded + coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5 shards, not 10. Each shard costs ~1 min of runner setup and ~0.4
        # min of `npm ci` before it runs a single test, so ten shards spent
        # ~14 runner-minutes on overhead to save ~1.5 min of wall clock — and
        # on a 20-job org budget they were also what pushed every other job
        # into the queue. The shard artifacts are consumed by pattern
        # (`coverage-shard-*`), and merge-coverage.mjs discovers them by
        # directory prefix, so nothing downstream knows the count.
        shardIndex: [1, 2, 3, 4, 5]
        shardCount: [5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Unit tests (coverage shard)
        env:
          VITEST_SKIP_COVERAGE_THRESHOLDS: true
        # Issue #421, item 4. A pipeline decided whether coverage ran at all:
        # `find … | grep -q .`.
        #
        # The status of a pipeline is the status of its last element. GitHub's
        # default shell does not set `pipefail`. So a failing `find` gave no
        # output, `grep` reported no match, and the else arm ran the suite
        # without --coverage. The shard then uploaded no artifact. The merge,
        # the coverage validation and the mutator gate had nothing to read.
        #
        # This step captures the `find` status and tests it on its own. The
        # else arm is gone with it. That arm was written before the first unit
        # test landed. The tree holds 1126 unit test files today. An empty
        # result must fail here. It must not downgrade the run silently.
        run: |
          if ! unit_tests=$(find src \( -name '*.test.*' -o -name '*.spec.*' \) \
               ! -path 'src/smoke/*' ! -path 'src/test/*'); then
            echo "FAIL: find could not scan src/ for unit tests"
            exit 1
          fi
          if [ -z "$unit_tests" ]; then
            echo "FAIL: no unit test files under src/ — the coverage shard would be vacuous"
            exit 1
          fi
          echo "$(grep -c '' <<< "$unit_tests") unit test file(s) found — §6.6 coverage thresholds armed"
          npm run test:unit -- --run --shard=${{ matrix.shardIndex }}/${{ matrix.shardCount }} --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage-shards/shard-${{ matrix.shardIndex }} --coverage.clean=false --coverage.thresholds.lines=0 --coverage.thresholds.statements=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.perFile=false
      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shardIndex }}
          path: apps/elitea-web/coverage-shards/shard-${{ matrix.shardIndex }}/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  coverage-merge:
    # This job absorbed the two jobs that used to `needs: [coverage-merge]` and
    # carry `if: always() && needs.coverage-merge.result == 'success'`:
    # `coverage-validation` and `gate-mutator-coverage`. Both did nothing but
    # re-download the artifact this job had just produced, on a fresh runner,
    # after a fresh `npm ci`. As steps they read `coverage/` directly, and the
    # "only when the merge succeeded" semantics of their `if:` are automatic:
    # a failed merge step ends the job before they run. The artifact names are
    # unchanged (`elitea-web-coverage`), and so are the commands.
    name: Coverage merge + validation
    runs-on: ubuntu-latest
    needs:
      - unit-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: apps/elitea-web/coverage-shards/
      - name: Merge coverage (no validation — thresholds checked by the step below)
        # Issue #421, item 3. This step ended with
        # `echo "merged=$?" >> $GITHUB_OUTPUT`. The upload below then read
        # `steps.merge.outputs.merged == '0'`.
        #
        # GitHub runs each `run:` block with `bash -e`. A non-zero `node`
        # status ends the step before the echo. So the output could hold only
        # `0` or nothing. The guard read as a check on the merge. It tested
        # nothing. A failed merge ends this step, this job, and every step
        # after it. That is the behaviour the guard described.
        run: node scripts/merge-coverage.mjs --no-validate
      - name: Upload merged coverage
        # Uploaded BEFORE the two checks below, so a threshold failure still
        # leaves the merged report attached to the run for inspection — which
        # is what the separate-jobs layout gave.
        uses: actions/upload-artifact@v7
        with:
          name: elitea-web-coverage
          path: apps/elitea-web/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Coverage validation
        # merge-coverage.mjs enforces thresholds by default (exits non-zero on
        # failure). It re-reads the same shard files the merge step used — the
        # separate job downloaded the merged artifact into coverage/ and hit
        # the script's prior-merge fallback instead; both paths measure the
        # same numbers, and the script refuses to report success with nothing
        # to measure either way (issue #421, item 5).
        run: node scripts/merge-coverage.mjs
      - name: Generated-client mutator coverage
        # mutator.ts is hand-written, not orval output. See its own header. It
        # is the `eliteaFetch` adapter that every generated hook calls, so it
        # carries a real coverage floor. The numbers come from the merged
        # coverage/ directory the merge step above wrote. This step starts no
        # vitest run of its own.
        #
        # This gate held its rules as an inline `node -e` program. It carried
        # three of issue #421's defects:
        #   • `pct(totalStmts, totalStmts)` divided a count by itself. The
        #     statement percentage read 100 on every run. `if (sp < 90)` was
        #     dead code.
        #   • `if (totalStmts === 0) … process.exit(0)` fired on every run.
        #     vitest.config.ts excluded the whole generated directory from
        #     coverage, so the gate never saw its target.
        #   • A `file.includes("mutator.test.ts")` filter let the test file's
        #     own near-100% score into the module's numbers.
        #
        # The rules live in scripts/lib/mutator-coverage-core.mjs now. The
        # "Gate-script decision-logic coverage" gate holds that file at 100%.
        # Each rule has a RED case and a GREEN case.
        run: node scripts/check-mutator-coverage.mjs

  gates-static:
    # The seventeen single-script gates that need nothing but a checkout and
    # the installed node_modules. Each was its own job, each paid ~1.4 min of
    # runner setup + `npm ci` to run a script for 10–60 s, and together they
    # were the bulk of this workflow's 20-slot appetite. They are steps here,
    # in their old order, each named after the job it replaces so a red run
    # still points at the gate by name. Nothing carries `continue-on-error`:
    # a failing gate fails this job.
    #
    # `submodules: recursive` — gen-brand-tokens.mjs reads the pinned
    # apps/elitea-ui palettes; it was the one gate in this group that needed
    # them. Four of these gates need no dependency at all (generated
    # artifacts, playwright image tag, wave-2 partition, visual coverage) and
    # used to skip `npm ci` for that reason; they now ride the shared install,
    # which costs the job nothing extra because the other thirteen need it.
    name: Static gates (node scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # gen-brand-tokens reads the pinned apps/elitea-ui palettes
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        # `id` so every gate below can run when an EARLIER gate failed but
        # the install did not: `!cancelled() && steps.install.outcome ==
        # 'success'`. One pull request then reports every red gate at once,
        # as the old one-job-per-gate layout did, instead of one per push.
        id: install
        run: npm ci

      # ── Rule-layer self-test ────────────────────────────────────────────
      - name: Rule-layer self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-gates-selftest.mjs

      # Issue #309. Fails when a workflow declares a trigger or a step guard
      # that can never fire (a `v*` tag cut by GITHUB_TOKEN starts no run), or
      # when a coverage exclusion matches nothing or waives code that something
      # imports without a dated, owned entry in scripts/coverage-exclusions.json.
      # It reads .github/workflows, so it covers every workflow in the
      # repository, not only this one.
      - name: Gate-dormancy check (workflow triggers + coverage exclusions)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-ci-dormancy.mjs

      # ── Gate-script decision-logic coverage ─────────────────────────────
      - name: Gate-script decision-logic coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Run a focused scripts coverage run, then read the JSON back and
        # re-check the numbers independently.
        #
        # The scripts project's *-core.test.mjs files DO import their
        # scripts/lib/*-core.mjs modules, and v8 instruments them: measured
        # coverage is 712/712 statements, 431/431 branches, 155/155 functions,
        # 607/607 lines — 100% on all four (#73). The pre-#73 version of this
        # step claimed the opposite ("coverage data is always 0") and set every
        # threshold to 0. It also filtered the report with
        # `file.startsWith("scripts/lib/")` while v8 writes ABSOLUTE path keys,
        # so the filter matched nothing, `statements` stayed 0, and the
        # short-circuit below it exited 0. The step could never fail — the
        # coverage numbers were fine all along, the gate reading them was not.
        #
        # coverage.all=true (was false): a new scripts/lib module that NO test
        # imports must count as 0%, not vanish from the report.
        run: |
          npx vitest run --config vitest.config.ts --project scripts \
            --coverage.enabled=true --coverage.all=true \
            --coverage.include='scripts/lib/**/*.mjs' \
            --coverage.exclude='scripts/lib/**/*.test.mjs' \
            --coverage.reporter=json --coverage.reporter=text \
            --coverage.reportsDirectory=coverage-scripts \
            --coverage.thresholds.lines=100 \
            --coverage.thresholds.functions=100 \
            --coverage.thresholds.branches=100 \
            --coverage.thresholds.statements=100
          node -e '
            const path = require("path");
            let data;
            try { data = require("./coverage-scripts/coverage-final.json"); } catch {
              console.error("FAIL: no coverage-scripts/coverage-final.json — the coverage run produced nothing to gate on");
              process.exit(1);
            }
            let lines = 0, functions = 0, branches = 0, statements = 0, files = 0;
            for (const [abs, f] of Object.entries(data)) {
              // Keys are absolute; relativise against cwd (apps/elitea-web).
              const rel = path.relative(process.cwd(), abs).split(path.sep).join("/");
              if (!rel.startsWith("scripts/lib/")) continue;
              files += 1;
              const s = Object.values(f.s || {});
              const b = Object.values(f.b || {});
              const fn = Object.values(f.f || {});
              lines += s.filter((v) => v > 0).length;
              statements += s.length;
              for (const row of b) { branches += row.filter((v) => v > 0).length; }
              functions += fn.filter((v) => v > 0).length;
            }
            if (files === 0 || statements === 0) {
              console.error("FAIL: coverage report contains no scripts/lib files (" + files + " files, " + statements + " statements) — the gate would be vacuous");
              process.exit(1);
            }
            // Only statements is re-derivable from coverage-final.json alone
            // (b/f hold hit counts, not totals-vs-covered); the other three
            // metrics are enforced by the --coverage.thresholds.* flags above.
            const sp = (lines / statements) * 100;
            console.log("Gate-script coverage over " + files + " scripts/lib files — statements: " + sp.toFixed(2) + "% (" + lines + "/" + statements + "), functions covered: " + functions + ", branches covered: " + branches);
            if (sp < 100) { console.error("FAIL: statements below the 100% threshold (" + sp.toFixed(2) + "%)"); process.exit(1); }
            console.log("OK — 100% statement threshold met");
          '

      # ── Complexity budgets ──────────────────────────────────────────────
      - name: Complexity budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-budgets.mjs

      # ── Generated client matches the spec ───────────────────────────────
      # Regenerates from services/elitea-main/api/openapi/v2.yaml and fails if
      # the committed client differs. A stale client fails OPEN — it keeps
      # exporting operations the API no longer has, so callers of removed
      # endpoints keep type-checking while failing against a real server.
      # Not hypothetical: four dead artifact operations shipped that way and
      # were caught only when an unrelated regeneration broke the build. See
      # the script's own header for the full incident.
      - name: Generated client matches the spec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-generated-client.mjs

      # ── Route-wiring map matches the routes ─────────────────────────────
      # parity/route-wiring-map.json is generated: its mechanical fields are
      # re-derived from src/routes/** on every run. `--check` fails when the
      # committed map no longer matches, so the tracker cannot silently drift
      # from the routes it claims to describe. The flag existed since the map
      # was introduced but was never wired into CI.
      - name: Route-wiring map matches the routes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/build-route-wiring-map.mjs --check

      # ── Generated artifacts match their generators ──────────────────────
      # Issue #490. Three generators in apps/elitea-web/scripts/ write files that
      # the repository COMMITS, and nothing compared the committed copy with a
      # fresh run. A hand edit, or an input that moved on after the last
      # regeneration, survived every pull request.
      #
      # gen-brand-tokens.mjs states the rule in its own header — "both committed;
      # regenerate and diff, never hand-edit". These steps are what perform the
      # diff. They are the same shape as the two drift checks above (generated
      # client, route-wiring map): regenerate in memory, compare bytes, name the
      # file that differs.
      #
      # Each `--check` mode fails when the committed file is ABSENT and when the
      # generator renders nothing, not only when the two differ (#426: a check
      # that finds no subject must fail, not pass). The shared rule lives in
      # scripts/lib/generated-drift.mjs, which the gate-script coverage step
      # above holds at 100%.
      #
      # gen-socket-contract.mjs was the FOURTH generator #490 names. It is now
      # GONE, not merely absent from this gate. Its server-side input,
      # services/elitea-main/internal/api/socketio/server.go, was deleted with
      # the prototype indexer transport (commit f12b59f8, issue #126), so the
      # generator exited 2 on a missing file before it rendered anything and
      # its --check drift guard could not run at all. Its two outputs,
      # src/shared/api/socket/{events,messages}.ts, are hand-maintained source
      # now; their own unit tests are the drift guard in its place. A drift
      # check here would have nothing left to compare.
      - name: Generated artifacts — route export drift (parity/new-app-routes.json)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/export-routes.mjs --check
      - name: Generated artifacts — brand token drift (default.pack.json + palette.augment.d.ts)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Runs even when the step above failed, so one pull request reports
        # every stale artifact instead of one per push.
        run: node scripts/gen-brand-tokens.mjs --check --baseline ../elitea-ui
      - name: Generated artifacts — hue preview drift (parity/brand-hue-preview.html)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/gen-hue-preview.mjs --check

      # ── Endpoint manifest ───────────────────────────────────────────────
      # Issue #426. Both the checker and the manifest it reads are in the tree,
      # so the "pending" branch that let this gate pass with neither is gone.
      # A missing file is now a red step with the name of the file in it.
      - name: Endpoint manifest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          for subject in scripts/check-endpoint-manifest.mjs src/shared/api/endpoints.manifest.json; do
            test -f "${subject}" || {
              echo "::error::apps/elitea-web/${subject} is missing, so the endpoint manifest gate cannot check anything. Restore the file under its old name, or point this job at the new one. Do not let the job pass."
              exit 1
            }
          done
          node scripts/check-endpoint-manifest.mjs

      # ── MSW handler hygiene ─────────────────────────────────────────────
      # Issue #426. The script is in the tree. The "pending" branch made this
      # gate a green no-op on the day somebody renamed it.
      - name: MSW handler hygiene
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -f scripts/check-handlers.mjs || {
            echo "::error::apps/elitea-web/scripts/check-handlers.mjs is missing, so the MSW handler hygiene gate cannot check anything. Restore the file under its old name, or point this job at the new one. Do not let the job pass."
            exit 1
          }
          node scripts/check-handlers.mjs

      # ── i18n en.json sync ───────────────────────────────────────────────
      # Issue #426. Same shape as the gate above, same repair.
      - name: i18n en.json sync (issue #44)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -f scripts/i18n-backfill.mjs || {
            echo "::error::apps/elitea-web/scripts/i18n-backfill.mjs is missing, so the en.json sync gate cannot check anything. Restore the file under its old name, or point this job at the new one. Do not let the job pass."
            exit 1
          }
          node scripts/i18n-backfill.mjs --check

      # ── Fixture freshness ───────────────────────────────────────────────
      # Issue #426. Same shape as the two gates above, same repair.
      - name: Fixture freshness
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -f scripts/check-fixture-freshness.mjs || {
            echo "::error::apps/elitea-web/scripts/check-fixture-freshness.mjs is missing, so the fixture freshness gate cannot check anything. Restore the file under its old name, or point this job at the new one. Do not let the job pass."
            exit 1
          }
          node scripts/check-fixture-freshness.mjs

      # ── Layer + cycle gate ──────────────────────────────────────────────
      # Issue #528. The gate used to run `npx depcruise src` and read the exit
      # code. A cruise that resolves zero modules reports zero violations and
      # exits 0, so a green tick could cover an empty run. The wrapper states
      # `summary.totalCruised` and fails under a floor. It also computes the
      # verdict itself: `depcruise --output-type json` exits 0 even with
      # errors, measured on the bad depcruise fixture.
      - name: Layer + cycle gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-layer-cycle.mjs

      # ── Dead code gate ──────────────────────────────────────────────────
      # Issue #528. `npx knip --max-issues 0` passed whether knip analysed
      # 3967 files or none of them: zero files give zero issues. The wrapper
      # counts what knip.json's `project` and `entry` globs match, states both
      # numbers, and refuses to run knip over an empty subject set. knip still
      # owns the verdict.
      - name: Dead code gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-dead-code.mjs

      # ── Playwright image tag ────────────────────────────────────────────
      # Runs on every PR, unlike the `visual` job that consumes the tag (release
      # tags only). A drift introduced on a PR must not lie dormant until a
      # release, when it would surface as an unexplained wall of snapshot diffs.
      - name: Playwright image tag
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-playwright-image-tag.mjs

      # ── Wave-2 partition ────────────────────────────────────────────────
      # Issue #424. check-partition.mjs says "Exit code 0 = partition valid,
      # non-zero = violation" and ran in no workflow, so no exit code was ever
      # read. Its subject, apps/elitea-web/parity/wave2-partition.json, sits
      # under apps/elitea-web/**, which this workflow's trigger already selects.
      - name: Wave-2 partition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-partition.mjs

      # ── Visual coverage ─────────────────────────────────────────────────
      # The `visual` job passing means "no snapshot changed". It says nothing
      # about how many screens have a snapshot at all — 5 covered routes and 29
      # covered routes produce the identical green tick. This gate is what makes
      # that number blocking: it fails when a route the screenshot index marks
      # `wiringStatus: wired` has no `@covers` spec in e2e/visual/, and it fails
      # when the committed baselines exceed their size budget.
      #
      # It lives HERE, not in ci-web-e2e.yml, on purpose: the script reads
      # parity/screenshot-index.json, the spec sources and the baseline file
      # sizes off disk. It needs no stack, no browser and no container, so it
      # belongs with the fast node-only gates and gives its verdict in seconds
      # rather than behind a seven-service compose stand-up.
      #
      # Until this gate existed the script ran in NO workflow (issue #174) —
      # `check-visual-coverage.mjs` appeared in none of .github/workflows/. It
      # reported `11/63 indexed shots … 11/15 wired` to nobody, which is the same
      # defect class as the `visual` job that had never executed (#159) and the
      # mutation spot-check whose every exit was `exit(0)` (#160): a check that
      # cannot influence anything.
      - name: Visual coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-visual-coverage.mjs

      # ── Theme gate ──────────────────────────────────────────────────────
      - name: Theme gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run theme-gate

      # ── Contract coverage ───────────────────────────────────────────────
      - name: Contract coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-contract-coverage.mjs

      # ── Stale disclosures ───────────────────────────────────────────────
      # Issue 621. A "NOT PORTED" / "NO PRODUCER" / "never emitted today"
      # comment is a claim about the corpus at a moment in time, and nothing
      # re-checked one when the corpus changed: auditing the port inventory in
      # issue 615 disproved thirteen such rows. Every claim in
      # scripts/stale-disclosure-scope.txt must carry a DISCLOSURE-CHECK probe
      # that a machine can run. It reads services/, like the two gates above.
      - name: Stale disclosures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-stale-disclosure.mjs

  build:
    # `build` and the old `gate-bundle-secret` job both ran `npm run build` on
    # their own runner and then read `dist/`. One build now feeds both checks.
    name: Build (three entries + bundle budget + bundle secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Build (app + admin + maintenance)
        run: npm run build
      # Issue #426. This step used to ask whether lighthouserc.json existed and
      # print "lhci bundle budget pending" when it did not. Neither that file
      # nor .lighthouserc.json has ever been in the tree, so the step was a
      # green tick for a budget that nothing measured.
      #
      # check-bundle-budget.mjs measures the build output that the step above
      # just produced. It derives the target list from dist/, the initial set
      # from each target's own HTML, and the route-chunk set from the rest, so
      # a renamed output directory or a changed chunking strategy moves the
      # subject with it. Every count has a floor and the budget file must be
      # present: a run that finds nothing fails.
      - name: Bundle budget (§3.5 — 300 KB initial, 250 KB per route chunk)
        run: node scripts/check-bundle-budget.mjs
      - name: Bundle secrets gate
        run: node scripts/check-bundle-secrets.mjs
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: elitea-web-dist
          path: apps/elitea-web/dist/
          retention-days: 7

  parity:
    # Keeps its own job: it needs go, `submodules: recursive` and
    # `fetch-depth: 0`, and none of the node gates want that checkout cost.
    name: Parity (uictl routes + manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # apps/elitea-ui is the pinned parity baseline
          # The DeepWiki census anchors resolve through parity/deepwiki-ui.pin —
          # a commit `git show` must be able to reach. A shallow checkout has
          # only the head, and the audit reported every anchor missing.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # uictl has no external deps (no go.sum); key on the workspace sum.
          cache-dependency-path: go.work.sum
      # Decision record, "CI parity-gate phasing": on PR this job blocks on
      # parity-routes + parity-manifest --validate; --require-must runs in the
      # SAME job but blocks only release tags and cutover/* branches.
      - name: Route + manifest parity (PR-blocking)
        working-directory: .
        run: |
          go run ./tools/uictl parity-routes --baseline apps/elitea-ui
          go run ./tools/uictl parity-manifest --validate
      - name: Require-must parity (cutover gate)
        # This release-readiness audit deliberately remains outside normal PR
        # validation until the migration register's priority:must items are
        # complete. Route + manifest parity above remains PR-blocking.
        #
        # The `refs/tags/v` half of this condition is GONE (issue #309, Gate 2)
        # and its removal changes no behaviour, which is the point: publish.yml
        # cuts tags with GITHUB_TOKEN, GitHub starts no run for such a ref, and
        # measurement confirms zero runs on any `v1.*` ref. Written as a
        # release gate, it was never one.
        #
        # It is NOT simply switched on for releases instead, and that is a
        # decision rather than an omission: `uictl parity-manifest
        # --require-must` currently exits 1 with "694 priority:must item(s) not
        # verified" (measured on this branch). Wiring it into the release path
        # today would make every release run red on a known, tracked backlog —
        # a second kind of signal nobody can act on. `cutover/*` is a branch
        # that really does fire, and is where the audit is meant to bite.
        if: startsWith(github.ref, 'refs/heads/cutover/')
        working-directory: .
        # Scoped to the domain the branch names (cutover/<domain>): the audit
        # is meant to bite on the domain being cut over; the rest of the
        # backlog is tracked, not blocked on, here.
        run: go run ./tools/uictl parity-manifest --require-must --domain "${GITHUB_REF_NAME#cutover/}"
