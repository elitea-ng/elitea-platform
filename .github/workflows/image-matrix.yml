name: Image Matrix

# The published image list has one source, and every copy of it agrees.
#
# NOT path-filtered on the workflow files alone, deliberately: a new bake target
# is a change to docker-bake.hcl and to nothing else, and that is precisely the
# case this catches.
#
# It also holds the PR-time half of the image scan. The scan itself is
# nightly, of the published `latest` images (nightly-image-scan.yml), and the
# release scan in publish.yml gates `latest`; what a pull request can break —
# the image list, the exemption register, the gate rule, the issue script —
# is checked here in seconds, with no image built.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:

permissions:
  contents: read

jobs:
  image-matrix:
    name: Every copy of the image list agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No buildx: the check reads docker-bake.hcl's target declarations
      # directly. See the script's header for why `bake --print` is not used.
      - name: Cross-check the image lists
        run: bash scripts/ci/image-matrix.sh --verify
      - name: docker-bake.hcl evaluates
        # `--print` resolves every target (contexts, dockerfiles, args, tags)
        # without building. It is the only PR-time evaluation of the bake file
        # now that no PR job bakes elitea-web or the workers;
        # without it a broken target first fails in publish.yml
        # at release time.
        run: docker buildx bake --print > /dev/null
      # #2954: elitea-web's Containerfile ends on a non-root USER, and the code
      # runner's rust-runtime stage puts no writable toolchain on PATH. From
      # the Containerfiles; the built images are checked in ci-build-once.yml.
      # The COUNT is read: a suite that collects nothing exits 0.
      - name: Images that ran as root stay unprivileged
        run: |
          set -euo pipefail
          node scripts/ci/check-image-users.mjs
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/check-image-users.test.mjs 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then echo "::error::check-image-users.test.mjs exited ${status}"; exit 1; fi
          ran="$(printf '%s\n' "$output" | sed -n 's/^# pass //p')"
          if [ "${ran:-0}" -lt 3 ]; then echo "::error::check-image-users.test.mjs passed ${ran:-none} test(s), expected 3"; exit 1; fi

  # The gate publish.yml and nightly-image-scan.yml both run goes red: driven
  # with synthetic trivy reports, every arm (clean, HIGH, CRITICAL, missing,
  # unparsable, wrong target type, exempt, stale exemption). #501's rule.
  gate-selftest:
    name: The scan gate goes red
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume (does nothing on hosted).
      - uses: ./.github/actions/eng-runner-env
      - name: Drive every arm of the gate with synthetic reports
        run: bash scripts/ci/image-scan-gate-test.sh

  # The nightly issue script, against two REAL trimmed trivy reports and a
  # fake github-script client. The COUNT is read, not only the exit status:
  # a suite that collects nothing exits 0 (#534). Only node built-ins: the
  # runner's node, nothing to install.
  issue-script:
    name: The nightly scan's issue script opens, updates and closes
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and node (none in its
      # image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      - name: Run every scenario
        run: |
          set -euo pipefail
          expected="$(grep -c '^test(' scripts/ci/image-scan-issue.test.mjs)"
          if [ "${expected}" -lt 15 ]; then
            echo "::error::found ${expected} scenario(s), expected at least 15 — the pattern stopped matching"
            exit 1
          fi
          # Capture the status: under `set -e` a failing command substitution
          # exits at the assignment and the output is never printed.
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/image-scan-issue.test.mjs 2>&1)" || status=$?
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p')"
          if [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::the suite holds ${expected} scenario(s) and node --test passed ${ran:-none}"
            exit 1
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::node --test image-scan-issue.test.mjs exited ${status}"
            exit "${status}"
          fi
