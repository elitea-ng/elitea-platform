name: Image Matrix

# The published image list has one source, and every copy of it agrees.
#
# NOT path-filtered on the workflow files alone, deliberately: a new bake target
# is a change to docker-bake.hcl and to nothing else, and that is precisely the
# case this catches.
#
# It also holds the PR-time half of the image scan. The scan itself is
# nightly, of the published `latest` images (nightly-image-scan.yml), and the
# release scan in publish.yml gates `latest`; what a pull request can break —
# the image list, the exemption register, the gate rule, the issue script —
# is checked here in seconds, with no image built.

on:
  pull_request:
    paths:
      - "docker-bake.hcl"
      - ".github/workflows/publish.yml"
      - ".github/workflows/nightly-image-scan.yml"
      - ".github/image-scan-exempt.txt"
      - "scripts/ci/image-matrix.sh"
      # The scan gate both scans run, the nightly issue script, and their tests.
      - "scripts/ci/image-scan-gate.sh"
      - "scripts/ci/image-scan-gate-test.sh"
      - "scripts/ci/image_scan_issue.py"
      - "scripts/ci/test_image_scan_issue.py"
      - "scripts/ci/testdata/trivy-*.json"
      - ".github/workflows/image-matrix.yml"
  push:
    branches:
      - main
    paths:
      - "docker-bake.hcl"
      - ".github/workflows/publish.yml"
      - ".github/workflows/nightly-image-scan.yml"
      - ".github/image-scan-exempt.txt"
      - "scripts/ci/image-matrix.sh"
      # The scan gate both scans run, the nightly issue script, and their tests.
      - "scripts/ci/image-scan-gate.sh"
      - "scripts/ci/image-scan-gate-test.sh"
      - "scripts/ci/image_scan_issue.py"
      - "scripts/ci/test_image_scan_issue.py"
      - "scripts/ci/testdata/trivy-*.json"
      - ".github/workflows/image-matrix.yml"

permissions:
  contents: read

jobs:
  image-matrix:
    name: Every copy of the image list agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No buildx: the check reads docker-bake.hcl's target declarations
      # directly. See the script's header for why `bake --print` is not used.
      - name: Cross-check the image lists
        run: bash scripts/ci/image-matrix.sh --verify
      - name: docker-bake.hcl evaluates
        # `--print` resolves every target (contexts, dockerfiles, args, tags)
        # without building. It is the only PR-time evaluation of the bake file
        # now that no PR job bakes elitea-web, elitea-ui or the workers;
        # without it a broken target first fails in publish.yml
        # at release time.
        run: docker buildx bake --print > /dev/null

  # The gate publish.yml and nightly-image-scan.yml both run goes red: driven
  # with synthetic trivy reports, every arm (clean, HIGH, CRITICAL, missing,
  # unparsable, wrong target type, exempt, stale exemption). #501's rule.
  gate-selftest:
    name: The scan gate goes red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Drive every arm of the gate with synthetic reports
        run: bash scripts/ci/image-scan-gate-test.sh

  # The nightly issue script, against two REAL trimmed trivy reports and a
  # fake `gh`. The COUNT is read, not only the exit status: `unittest` exits 0
  # when it collects nothing (#534).
  issue-script:
    name: The nightly scan's issue script opens, updates and closes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run every scenario
        run: |
          set -euo pipefail
          expected="$(grep -c '^    def test_' scripts/ci/test_image_scan_issue.py)"
          if [ "${expected}" -lt 15 ]; then
            echo "::error::found ${expected} scenario(s), expected at least 15 — the pattern stopped matching"
            exit 1
          fi
          output="$(python3 -m unittest discover -s scripts/ci -p 'test_image_scan_issue.py' -v 2>&1)"
          printf '%s\n' "${output}"
          ran="$(printf '%s\n' "${output}" | sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p')"
          if [ -z "${ran}" ] || [ "${ran}" -ne "${expected}" ]; then
            echo "::error::the suite holds ${expected} scenario(s) and unittest ran ${ran:-none}"
            exit 1
          fi
