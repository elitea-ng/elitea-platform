name: CI — elitea-vector

# ADR-0031: elitea-vector, the only Qdrant client.
#
# One job, on purpose: the repository's Actions plan runs 20 jobs at a time,
# and every check here needs the same compiled dependency graph.
#
#   * fmt, Clippy (all + pedantic, deny), rustdoc with warnings denied;
#   * the unit tests;
#   * the isolation conformance suite (ADR-0031 Verification 1,
#     tests/isolation.rs) over real mTLS against a REAL Qdrant (the `qdrant`
#     service, the version the chart and compose run).
#     ELITEA_VECTOR_REQUIRE_QDRANT=1 turns its "no Qdrant → skip" into a
#     failure. The suite gates every elitea-vector change.
#
# elitea-main's side (the introspection service) is Go and runs in
# ci-go.yml.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main tests main. The caches it may write follow
  # scripts/ci/check-cache-budget.mjs (one writer per key); staggered ahead
  # of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-vector-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  vector:
    name: elitea-vector — lint, test, and the isolation suite on Qdrant
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/elitea-vector
    # eng-runner has no container engine. There every image below is empty, so
    # GitHub creates no service, and .github/actions/native-services runs the
    # same servers as processes at the same ports and credentials
    # (scripts/ci/check-runner-routing.mjs poolEmptyImage; it checks the two agree).
    services:
      qdrant:
        # Keep in step with deploy/docker-compose.standalone-full.yml and
        # the chart's vector.qdrant.internal.image.
        image: ${{ !(vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'qdrant/qdrant:v1.19.2' || '' }}
        ports:
          - 6334:6334
        # The image has no curl; bash's /dev/tcp checks that the HTTP port
        # listens. The suite's first request also waits for gRPC.
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and rustup (none in
      # its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          rust: "true"
      # eng-runner: the services block's Qdrant as a process.
      # Does nothing on a hosted runner, where the services block runs them.
      - name: Start the services as processes (eng-runner)
        uses: ./.github/actions/native-services
        with:
          qdrant: "true"

      - name: Assert the pinned toolchain
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # No cargo cache here (scripts/ci/cache-budget.json, measured 2026-11-20): a
      # registry-only entry is 0.3-0.6 GiB of the 10 GB cap and saves about the
      # time cargo takes to fetch the crates. The budget goes to target caches.

      # Formatting and Clippy for this crate run in ci-rust-lint.yml (fast
      # tier), so they fail in minutes and before this job's build.

      # rustdoc (deny warnings) runs beside Clippy in ci-rust-lint.yml (fast tier).

      - name: Run the unit tests and the isolation suite
        env:
          ELITEA_VECTOR_TEST_QDRANT_URL: http://127.0.0.1:6334
          ELITEA_VECTOR_REQUIRE_QDRANT: "1"
        run: cargo test --locked --all-targets --all-features

      # No release build: nothing here ran it. The release build (no
      # features, cargo-auditable) is the image's, in ci-build-once.yml, which
      # runs on every pull request that touches Rust.

      # eng-runner: the logs of the services native-services started, when
      # anything in the job failed. Does nothing on a hosted runner.
      - name: Upload the service logs (eng-runner)
        if: failure()
        uses: ./.github/actions/native-services-logs
