name: CI Image Cleanup

# Prunes the CI-only `ci-*` container packages ci-build-once.yml pushes: one
# `ci-<image>:<sha>` version per image per commit, and the untagged manifests
# each nightly run on main strands in `ci-cache-<image>`. The policy, and the rule that
# no other package is ever touched, live in scripts/ci/prune-ci-images.mjs,
# run through actions/github-script.
#
# WHEN. Daily, and on dispatch — from main only. Never on a pull request: a
# change to the policy is held by scripts/ci/prune-ci-images.test.mjs in the
# static gates (no-binaries.yml), and a dispatch with dry_run shows what it
# would delete before anything is.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Delete CI image versions older than this many days.
        type: number
        default: 7
      dry_run:
        description: List what would be deleted, delete nothing.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: Prune CI-only images older than the window
    # A dispatch from another branch would run another branch's policy.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Deletes versions of the ci-* packages, which this repository's
      # workflow created and therefore administers.
      packages: write
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and node for the node
      # scripts (none in its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      - name: The policy still refuses what it must
        run: node --test --test-reporter=spec scripts/ci/prune-ci-images.test.mjs
      # Pinned to the v9.0.0 commit, as cancel-merged-pr-runs.yml pins it:
      # this step holds packages: write.
      - name: Prune
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DAYS: ${{ inputs.days || 7 }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          ORG: ${{ github.repository_owner }}
        with:
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/prune-ci-images.mjs`);
            const code = await main({
              github,
              org: process.env.ORG,
              days: process.env.DAYS,
              dryRun: process.env.DRY_RUN === "true",
            });
            if (code !== 0) core.setFailed(`scripts/ci/prune-ci-images.mjs exited ${code}`);

  # The repository's Actions cache (10 GB cap, LRU eviction). scripts/ci/prune-actions-caches.mjs
  # says why and how: no pull-request copies, one entry per key family, and the
  # least recently used entries out above 9 GiB, so what GitHub would evict
  # blindly is chosen instead. After the nightly cache writers (00:05-01:07 UTC).
  actions-cache:
    name: Keep the Actions cache under its cap
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists and deletes this repository's cache entries.
      actions: write
    steps:
      - uses: actions/checkout@v7
      # eng-runner: caches and TMPDIR on the work volume, and node for the node
      # scripts (none in its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          node: "true"
      - name: The policy still decides what it must
        run: node --test --test-reporter=spec scripts/ci/prune-actions-caches.test.mjs
      # Pinned to the v9.0.0 commit, as the prune above pins it: this step holds actions: write.
      - name: Prune
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/prune-actions-caches.mjs`);
            const code = await main({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              dryRun: process.env.DRY_RUN === "true",
            });
            if (code !== 0) core.setFailed(`scripts/ci/prune-actions-caches.mjs exited ${code}`);
      # The plan (scripts/ci/cache-budget.json, derived by check-cache-budget.mjs)
      # against what main's entries actually hold after the prune, by key family.
      # A drift of more than 1 GiB is a warning: the measured sizes need
      # updating (2026-11-20 the plan said 0.1 GiB per registry-only Rust entry
      # and they held 0.4). Main's entries over the 8 GiB budget FAIL the job:
      # that is a real overrun, and LRU eviction of the entries pull requests
      # restore is next (2026-11-23: 8.33 GiB held against a plan of 7.71, and
      # no warning had been read). A report that cannot run stays a warning.
      - name: Install scripts/ci dependencies (the YAML reader)
        id: deps
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/ci-scripts-deps
      - name: The cache plan matches the cache, and main is within its budget
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let report = null;
            try {
              const { reportDrift } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/check-cache-budget.mjs`);
              report = await reportDrift({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                root: process.env.GITHUB_WORKSPACE,
                log: (line) => core.info(line),
                warn: (line) => core.warning(line),
              });
            } catch (error) {
              core.warning(`the cache drift report could not run: ${error.message}`);
            }
            if (report?.overrun) core.setFailed(report.overrun);
