name: Docs and brand guide — GitHub Pages

# Publishes the docs site (apps/elitea-docs, Astro Starlight) to GitHub
# Pages, and the brand guide
# (brand/, `node brand/scripts/build.mjs`) beside it at /brand/. They are
# separate sites with separate sources: the docs describe the product, the
# brand guide its identity, and neither links into the other's build. They
# share one deployment only because a repository has one Pages site, and every
# deployment replaces the whole site, so both must be in each artifact. This is a SEPARATE
# deployment target from the `/docs/` nginx location ci-docs.yml's build
# proves — Pages has no server, so this build sets DOCS_BASE to the repo's
# Pages subpath instead of `/docs/`, and the two are never the same artifact.
#
# One job, not two: this repo's org is on the GitHub free plan's 20-concurrent-
# job cap (see ci-web.yml's own header), and the standard build/deploy split
# exists for workflows that fan a build out to multiple deploy targets. This
# has exactly one.
#
# WHEN. A stable release deploys it: publish.yml's `docs` job calls this
# workflow with the release tag, so the site describes a version someone can
# install. A merge to main deploys nothing (no workflow has a push arm,
# scripts/ci/check-no-push-triggers.mjs). workflow_dispatch deploys the
# dispatched ref by hand.
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to build the docs from (the release tag).
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    # Pages deployments must not race each other — a slower run finishing after
    # a faster, more recent one would publish stale content. Job level, not
    # workflow level: under workflow_call a workflow-level group would be read
    # in the CALLER's context.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/elitea-docs
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty under workflow_dispatch: the dispatched ref.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-docs/package-lock.json
          prefix-fallback: "false"
      - name: Install (locked)
        run: npm ci --no-audit --no-fund
      - name: Build docs (DOCS_BASE=/elitea-platform/)
        # The repo's Pages site is served at https://<org>.github.io/elitea-platform/,
        # so every page, link and asset URL the build emits must be rooted
        # there, unlike the web image's /docs/ (ci-docs.yml builds that one).
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          DOCS_BASE: /elitea-platform/
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
      - name: Build the brand guide into /brand/
        # Zero dependencies (node's standard library); every URL it emits is
        # relative, so the same build works under /elitea-platform/brand/.
        working-directory: .
        run: node brand/scripts/build.mjs --out apps/elitea-docs/dist/brand
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/elitea-docs/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
