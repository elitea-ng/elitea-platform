name: CI — Web E2E

# The heavy, containerised half of apps/elitea-web's CI, split out of
# ci-web.yml (issue #157).
#
# These two jobs share a runtime surface that nothing in ci-web.yml has: they
# build two container images from source, stand up the seven-service compose
# stack in deploy/docker-compose.e2e-standalone.yml (postgres, redis, rustfs,
# an OIDC mock, traefik, elitea-main, elitea-web) and drive real browsers at
# it. Six-to-seven minutes per E2E leg, and a failure mode set that has nothing
# in common with a lint error. Keeping them here means:
#   • `gh workflow run ci-web-e2e.yml` exercises the stack without dragging the
#     25 node-only gate jobs along with it (and vice versa);
#   • either half can be re-run on its own;
#   • a red square in the checks list says which half broke.
#
# WHEN THEY FIRE:
#   e2e     — every PR matching the paths below, pushes to main, `v*` tags,
#             and workflow_dispatch. No job-level `if:` (issue #158).
#   visual  — the same set, and for the same reason (issue #159). It used to
#             carry `if: startsWith(github.ref, 'refs/tags/v')`, which — with
#             no `v*` tag ever cut — meant it had never run at all. Its very
#             first execution failed on a real defect, so "dormant but
#             presumed correct" was never true.
#
# The mutation spot-check is NOT here. It lives in its own
# .github/workflows/ci-web-mutation.yml, which is the canonical copy (see the
# decision recorded in that file).

on:
  # Same trigger set as ci-web.yml, deliberately: the E2E stack builds and runs
  # elitea-main alongside elitea-web, so a change to the BACKEND or to the
  # compose/build definitions can break a journey while touching nothing under
  # apps/elitea-web. The `on:` block must also remain a superset of what the
  # per-job `if:` guards admit (`refs/tags/v`), or those jobs become
  # unreachable — the exact mistake that made the E2E job unrunnable before
  # (PR #82 validation, blocker 4).
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: >-
          Regenerate the @visual baselines inside the pinned Playwright
          container and upload them as the `visual-baselines` artifact, instead
          of comparing against the committed ones. A run in this mode PASSES BY
          CONSTRUCTION and is never evidence that the UI is unchanged — it is a
          way to produce a reviewable baseline that was rasterised by the
          pinned container rather than by somebody's laptop. Download the
          artifact, look at the PNGs, commit the ones you meant to change.
        type: boolean
        default: false
      live_toolkits:
        description: >-
          Run the LIVE lanes (`toolkits-live`, `image-live`) against real
          provider credentials taken from this repository's secrets. These are
          the legacy public suite's credential-bound cases — the ones no mock
          can answer — ported under apps/elitea-web/e2e/live. With no secrets
          configured the job still runs: it asserts that both live projects
          list ZERO tests, prints which E2E_LIVE_* variables were missing, and
          passes. That is deliberate and it is not vacuous — a project that
          listed zero tests because it was BROKEN rather than unconfigured
          fails the same assertion the moment a secret is added.
        type: boolean
        default: false
      full_visual_refresh:
        description: >-
          Rewrite EVERY @visual baseline (--update-snapshots=all) instead of
          only the ones that fail. Requires update_visual_baselines. Use this to
          find drift that the maxDiffPixels budget has been absorbing: a
          snapshot that passes is never rewritten, so a baseline that moved less
          than the budget stays wrong indefinitely and a green run cannot tell
          you. Issue #238 is the worked example — a dropdown arrow moved 11 px
          in the light scheme against a 20 px budget, so 7 baselines went on
          matching an image with no arrow in it, and no regeneration touched
          them until they were deleted. The run prints a pixel-level comparison
          (scripts/compare-visual-baselines.mjs) so the artifact is reviewable:
          a full rewrite re-encodes all of them, and a byte diff calls every
          file changed.
        type: boolean
        default: false
  pull_request:
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "services/elitea-deepwiki/**"
      - "services/elitea-subapp-host/**"
      # The `chat-stream-rust` job runs the journeys against the native Rust
      # runtime, so a change to it can break a browser journey while touching
      # nothing under apps/elitea-web. Without this path the job that exists to
      # catch that drift would not start on the change that caused it.
      - "services/elitea-worker-rust/**"
      # The real-model lane's own subjects: the gateway's SSE relay, the
      # python worker's SDK path, and the shared build action every stack
      # job here uses. The `model-path-changes` job names these; a prefix it
      # names must also START this workflow, or the lane silently never runs
      # for the change it exists to catch.
      - "services/elitea-llm-gateway/**"
      - "services/elitea-worker-python/**"
      - ".github/actions/**"
      - "deploy/**"
      - "docker-bake.hcl"
      - ".github/workflows/ci-web-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "apps/elitea-web/**"
      - "tools/uictl/**"
      - "services/elitea-main/**"
      - "services/elitea-deepwiki/**"
      - "services/elitea-subapp-host/**"
      # The `chat-stream-rust` job runs the journeys against the native Rust
      # runtime, so a change to it can break a browser journey while touching
      # nothing under apps/elitea-web. Without this path the job that exists to
      # catch that drift would not start on the change that caused it.
      - "services/elitea-worker-rust/**"
      # The real-model lane's own subjects: the gateway's SSE relay, the
      # python worker's SDK path, and the shared build action every stack
      # job here uses. The `model-path-changes` job names these; a prefix it
      # names must also START this workflow, or the lane silently never runs
      # for the change it exists to catch.
      - "services/elitea-llm-gateway/**"
      - "services/elitea-worker-python/**"
      - ".github/actions/**"
      - "deploy/**"
      - "docker-bake.hcl"
      - ".github/workflows/ci-web-e2e.yml"
    # NO `tags: v*` — issue #309, Gate 2; see the identical note in ci-web.yml.
    # A GITHUB_TOKEN-created tag starts no workflow run, so this arm has never
    # fired. Both jobs below reach every PR, every push to main and
    # workflow_dispatch on their own, which is what has actually been running
    # them; removing the dead arm changes no execution, only the claim.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

# Load-bearing: every `run:` below assumes apps/elitea-web as cwd, except the
# image-build step, which overrides it with `working-directory: ${{ github.workspace }}`.
defaults:
  run:
    working-directory: apps/elitea-web

jobs:
  e2e:
    name: E2E (${{ matrix.leg }})
    # Runs on pull requests (issue #158). It previously carried
    #   if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # which skipped it on every PR — confirmed on runs 31335173296 and
    # 31331494389. A 30-journey suite that only executes on a release tag
    # cannot block the regression it exists to catch, and the tag build is
    # the worst possible place to first learn a journey broke. ~6-7 min per
    # engine leg is affordable on every PR; both legs stay in the matrix
    # below so chromium and webkit are each still validated (§6.6/§7.6).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Both engines are validated independently. Issue #60 requires chromium AND
      # webkit; the job used to run whatever `npm run e2e` defaulted to, so half
      # the acceptance was never checked. `fail-fast: false` keeps a webkit-only
      # regression from hiding chromium's result (and vice versa).
      fail-fast: false
      # webkit is sharded in two: its Playwright run measured 7.6 min against
      # chromium's 3.3 for the same suite (2026-09-02), and once the image
      # build stopped costing 3 min it was the longest thing on a pull request.
      # `leg` names the artifacts and the job; `shard` is passed straight to
      # `playwright test --shard`.
      matrix:
        include:
          - engine: chromium
            leg: chromium
            shard: ""
          - engine: webkit
            leg: webkit-1of2
            shard: "1/2"
          - engine: webkit
            leg: webkit-2of2
            shard: "2/2"
    # E2E needs Docker + docker-compose for the stack.
    # GitHub-hosted ubuntu-latest has Docker and docker compose (v2 plugin) pre-installed.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container (background)
        # Network-bound, so it overlaps the CPU-bound bake below. Started with
        # nohup and left running: the runner does not reap a step's background
        # processes, and the test step's `docker run` pulls the image itself if
        # this has not finished, so a slow or failed pull costs the overlap and
        # never the run. Bounded so a stalled pull cannot outlive the job.
        run: |
          nohup timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.1-noble >/tmp/playwright-pull.log 2>&1 &
      - name: Build elitea-main:e2e, elitea-web:e2e and elitea-subapp-host:e2e
        # Through the shared action rather than three plain `docker build`s:
        # buildx bake over the SAME compose file the stack runs, one
        # content-addressed layer cache per image shared with the release and
        # the image scan, the dependency cache mounts carried across runs, and
        # — the guard this job has always had — an assertion that every image
        # compose would build is in the local store before compose runs. The
        # action's own header carries the history (issue #154, and why a
        # content-addressed cache cannot serve a stale fix).
        #
        # elitea-main uses the `e2e` target, which builds the admin SPA from
        # apps/elitea-web/src/entries/admin — the same bundle the shipping
        # `final` stage carries, since `final` derives from `e2e`.
        uses: ./.github/actions/build-stack-images
        with:
          compose-files: |
            docker-compose.e2e-standalone.yml
          cache-hcl: |
            ci/bake-cache.hcl
          targets: e2e
          mount-cache-suffix: e2e
      - name: Bring up E2E stack
        # e2e-stack.sh uses deploy/docker-compose.e2e-standalone.yml which references
        # elitea-main:e2e and elitea-web:e2e (both built and asserted above).
        # The script auto-detects `docker compose` (CI) vs `podman compose` (local).
        # E2E_PORT=8080 is free on ubuntu-latest (no centry stack); 8082 is the local default.
        env:
          COMPOSE_BIN: docker compose
          E2E_PORT: "8080"
        run: |
          test -d e2e || { echo "release tag without an e2e suite (unit V1) — refusing"; exit 1; }
          bash scripts/e2e-stack.sh up
      - name: Seed E2E users
        env:
          COMPOSE_BIN: docker compose
          E2E_PORT: "8080"
        run: bash scripts/e2e-stack.sh seed
      - name: Playwright against the real stack (pinned container, host network)
        # No `npx playwright install --with-deps` step. That step cost 57s on the
        # chromium leg and 82s on the webkit leg, and the browser downloads were
        # only ~14s of it — the other ~67s was apt fetching 114 MB of system
        # libraries onto a runner that then throws them away. Caching
        # ~/.cache/ms-playwright, the usual advice, would have recovered the 14s
        # and left the 67s untouched.
        #
        # `mcr.microsoft.com/playwright:v1.62.1-noble` ships both browsers AND
        # those system libraries pre-installed, so the whole install disappears;
        # what remains is the image pull, already paid for in the background of
        # the build step above. This is the same mechanism the `visual` job below
        # uses, for a different reason (font-stack determinism) — here it is
        # purely about not rebuilding a browser environment that exists as a
        # published image.
        #
        # The image tag is kept honest by scripts/check-playwright-image-tag.mjs,
        # which scans EVERY workflow and asserts each
        # `mcr.microsoft.com/playwright:vX.Y.Z-noble` matches the pinned
        # @playwright/test — so this second reference is gated automatically.
        #
        # `--network host`, not a job `container:`: the stack was brought up on
        # the HOST by e2e-stack.sh, and GitHub job containers do not share the
        # runner's network namespace, so localhost:8080 would not reach it (the
        # same constraint documented on the visual job).
        #
        # E2E_REUSE_STACK=1, not the `!CI` default: the stack is already up from
        # the steps above, and with CI set `reuseExistingServer` would be false —
        # Playwright would try to start it a second time, from inside a container
        # that has no container runtime.
        #
        # `--project` is explicit rather than `npm run e2e` so that (a) each
        # matrix leg reports one engine's result, and (b) the `visual` project
        # stays out of this job — its snapshots are the `visual` job's business.
        #
        # E2E_TZ pins the browser's timezone, and the seed step above anchors its
        # calendar-day fixtures in the SAME zone (issue #214). UTC on both sides
        # by default, so this line changes nothing today. It is here so that
        # setting E2E_TZ on the job cannot move the seed's day boundary while
        # leaving the browser on the runner's, which is the disagreement that
        # made journey 29 fail after midnight.
        run: |
          docker run --rm --network host \
            -v "$PWD":/work -w /work \
            -e CI=true \
            -e E2E_REUSE_STACK=1 \
            -e E2E_PORT=8080 \
            -e PLAYWRIGHT_BASE_URL=http://localhost:8080 \
            -e E2E_TZ="${E2E_TZ:-UTC}" \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            npx playwright test --project=${{ matrix.engine }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      - name: Give the report back to the runner user
        # The container runs as root, so playwright-results/ and
        # playwright-report/ come back root-owned. upload-artifact can still READ
        # them (0644), but a root-owned tree in the workspace is a trap for any
        # later step that wants to write there, and the failure would be a
        # baffling EACCES far from its cause.
        #
        # ORDER IS LOAD-BEARING: this must run BEFORE "Collect the stack's own
        # logs". That step writes playwright-results/stack-logs.txt as the
        # runner user, and with the chown after it the write failed on every
        # run, `|| true` hid it, and "0 line(s) collected" was green (#859).
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Collect the stack's own logs
        # ONLY ON FAILURE, AFTER the chown above, and BEFORE the teardown below
        # removes the stack.
        #
        # A journey failed with "Failed to load users." on screen after a write.
        # The job captured a screenshot, a video and an accessibility tree, and
        # none of them can say whether the listing answered 500, timed out, or
        # was refused — only the server can. The stack was torn down in the next
        # step and the answer went with it.
        #
        # A failure nobody can diagnose gets retried until it passes, which is
        # how a real defect becomes "flaky". `continue-on-error`, not `|| true`:
        # a diagnostic that fails the job it is diagnosing replaces one
        # unexplained failure with another, so the job's outcome stays what the
        # journeys made it — but the script exits non-zero when it collected
        # nothing (unwritable file, zero log lines), and a step that is visibly
        # failed in the run view is how that gets noticed instead of hidden
        # behind a green tick (#859).
        if: failure()
        continue-on-error: true
        working-directory: apps/elitea-web
        env:
          COMPOSE_BIN: docker compose
        run: bash scripts/e2e-stack.sh logs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per-engine name: upload-artifact v7 rejects a duplicate name, so a
          # shared one would fail the second matrix leg to finish.
          name: playwright-report-${{ matrix.leg }}
          # BOTH paths, and the second one is the point.
          #
          # `playwright-results/` is the raw output directory: per-test folders
          # of `*-actual.png`, `*-diff.png`, videos and traces. Uploading only
          # that is what this step used to do, and it left a reviewer with a
          # heap of loose PNGs whose file names encode the test id and nothing
          # else — enough to prove a failure happened, not enough to review it.
          #
          # `playwright-report/` is the HTML reporter's output (configured in
          # playwright.config.ts, `['html', { open: 'never' }]`). It is written
          # on every CI run and, until now, thrown away with the runner: it is
          # the report that renders expected/actual/diff side by side with a
          # slider, embeds the trace viewer, and links each attachment to the
          # test that produced it. Costing nothing to keep and being the only
          # artifact anyone can actually read, it is now kept.
          path: |
            apps/elitea-web/playwright-results/
            apps/elitea-web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failed test video recordings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failed-videos-${{ matrix.leg }}
          path: apps/elitea-web/playwright-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down E2E stack
        if: always()
        env:
          COMPOSE_BIN: docker compose
        run: bash scripts/e2e-stack.sh down

  chat-stream:
    name: Chat definition-of-done journey (#284)
    # The product core loop, end to end through the UI: send → SSE stream →
    # rendered answer → persisted after a reload. It runs on PRs for the same
    # reason the journeys do — the 2026-08-12 audit found Send silently no-op
    # with every unit suite green, and this is the only job that can catch that
    # class of regression.
    #
    # A separate job from `e2e` because it needs a DIFFERENT stack: the full
    # standalone compose (runtime plane + agent worker + mock LLM). The E2E
    # stack cannot run an agent turn at all, so this journey would fail there
    # for a reason that has nothing to do with the change under test.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container (background)
        # Started with nohup and left running while the bake below uses the
        # CPU: the runner does not reap a step's background processes, and
        # compose / the test step pull inline if this has not finished, so a
        # slow pull costs the overlap and never the run.
        run: |
          nohup bash -c 'timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.1-noble' >/tmp/prepull.log 2>&1 &
      - name: Build the stack images (shared cache)
        # Replaces the script's own `compose build` (STANDALONE_SKIP_BUILD=1
        # below): every `build:` service of the compose file(s) the stack runs,
        # baked with one shared layer cache per image and the cargo/Go/pip
        # cache mounts restored from the previous run, then asserted present.
        # Measured before this: 5.3 min (python worker) to 10.6 min (Rust
        # worker, 9.6 of it one sequential cargo chain) of every such job.
        uses: ./.github/actions/build-stack-images
        with:
          compose-files: |
            docker-compose.standalone-full.yml
          cache-hcl: |
            ci/bake-cache.hcl
          targets: standalone
          mount-cache-suffix: python
      - name: Run the journey against a fresh standalone stack
        # The script owns the whole lifecycle: runtime PKI, compose up, the
        # three seed steps, then Playwright. It uses its own compose project so
        # it can never disturb another stack, and tears down on exit.
        #
        # COMPOSE_BIN is docker on the runner; the script auto-detects podman
        # locally. MOCK_LLM_CHUNK_DELAY_MS makes the partial-render assertion
        # deterministic rather than a race against a one-paint reply.
        #
        # PLAYWRIGHT_CONTAINER_IMAGE makes the script run `npx playwright test`
        # inside the pinned container (--network host) instead of on the host.
        # The tag is written HERE and not in the script on purpose:
        # scripts/check-playwright-image-tag.mjs only scans .github/workflows/
        # when it asserts every container tag matches the pinned
        # @playwright/test, so this reference is gated automatically and one
        # inside the script would not be.
        #
        # No Playwright flags are passed from here, and the `--workers=1` that
        # keeps this project's specs off each other's execution-stream budget
        # is NOT one of them: it lives on the script's own `playwright test`
        # line, which is the single entry point this job and `chat-stream-rust`
        # both go through. See the script's note — the project's
        # `fullyParallel: false` does not serialise separate spec files.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          STANDALONE_SKIP_BUILD: "1"
          CHAT_STREAM_PROJECT: elitea-chatstream-ci
          CHAT_STREAM_PORT: "8084"
          MOCK_LLM_CHUNK_DELAY_MS: "120"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
        run: bash apps/elitea-web/scripts/chat-stream-e2e.sh
      - name: Give the report back to the runner user
        # The container runs as root, so playwright-report/ comes back
        # root-owned — same trap and same fix as the `e2e` job's copy of this
        # step.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chat-stream
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  chat-stream-rust:
    name: Chat journey on the native Rust runtime
    # The SAME journeys as `chat-stream`, against the OTHER worker.
    #
    # `STANDALONE_WORKER=rust` swaps `elitea-worker` for the native Rust agent
    # runtime (deploy/docker-compose.standalone-rust-agent.yml). Nothing in the
    # UI selects a worker, which is exactly why this job exists: the two
    # runtimes validate a stored agent version differently, and a change that
    # one admits and the other refuses is invisible to every unit suite and to
    # the `chat-stream` job. Three such defects reached this branch — a version
    # meta the runtime refused, a participant with no version id, and an
    # `agent_type` the runtime did not recognise — and all three presented as a
    # turn that was admitted and then produced nothing.
    #
    # A separate job rather than a matrix leg on `chat-stream`: the two stacks
    # both publish the fixed oidc-mock port 9400 and cannot share a host, and a
    # matrix would also hide which runtime failed behind one job name.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container (background)
        # Started with nohup and left running while the bake below uses the
        # CPU: the runner does not reap a step's background processes, and
        # compose / the test step pull inline if this has not finished, so a
        # slow pull costs the overlap and never the run.
        run: |
          nohup bash -c 'timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.1-noble' >/tmp/prepull.log 2>&1 &
      - name: Build the stack images (shared cache)
        # Replaces the script's own `compose build` (STANDALONE_SKIP_BUILD=1
        # below): every `build:` service of the compose file(s) the stack runs,
        # baked with one shared layer cache per image and the cargo/Go/pip
        # cache mounts restored from the previous run, then asserted present.
        # Measured before this: 5.3 min (python worker) to 10.6 min (Rust
        # worker, 9.6 of it one sequential cargo chain) of every such job.
        uses: ./.github/actions/build-stack-images
        with:
          compose-files: |
            docker-compose.standalone-full.yml
            docker-compose.standalone-rust-agent.yml
          cache-hcl: |
            ci/bake-cache.hcl
            ci/bake-cache-rust.hcl
          targets: standalone
          mount-cache-suffix: rust
      - name: Run the journeys against a fresh Rust-runtime stack
        # The Rust worker is compiled from source by the stack's own `build`
        # step, which is why this job's budget is larger than `chat-stream`'s.
        #
        # The compose project and port differ from `chat-stream`'s so the two
        # can never collide, even though they run on separate runners today.
        #
        # Same script, so the same `--workers=1` pin applies here — see the
        # `chat-stream` job's copy of this note.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          STANDALONE_SKIP_BUILD: "1"
          STANDALONE_WORKER: rust
          CHAT_STREAM_PROJECT: elitea-chatstream-rust-ci
          # NOT 8085: that is the stack's own gateway debug port
          # (STANDALONE_GATEWAY_PORT defaults to 8085 in
          # deploy/docker-compose.standalone-full.yml), so traefik's bind on
          # the same host port raced the gateway's and lost.
          CHAT_STREAM_PORT: "8086"
          MOCK_LLM_CHUNK_DELAY_MS: "120"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
        run: bash apps/elitea-web/scripts/chat-stream-e2e.sh
      - name: Give the report back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chat-stream-rust
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  model-path-changes:
    name: Does this change reach the model path?
    # Decides whether the real-model lane runs on a pull request. The lane's
    # signal — the gateway's SSE relay against a vendor's real chunks, and a
    # tool call the model chose — changes only when the gateway, a worker,
    # the execution plane, the chat surface, the E2E harness or the stack
    # itself changes. A pull request that touches none of those gets the mock
    # lanes, which already prove the product's own code paths, and skips this
    # one. Every push to main and every dispatch runs it.
    #
    # A plain `git diff` against the pull request's base, not a third-party
    # path-filter action: the list below is the whole mechanism, and it needs
    # no extra token scope.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reaches-model: ${{ steps.filter.outputs.reaches-model }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "reaches-model=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: the real-model lane runs"
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
          pattern='^(services/elitea-llm-gateway/|services/elitea-worker-rust/|services/elitea-worker-python/|services/elitea-main/internal/api/v2/executions/|services/elitea-main/internal/llmproxy/|services/elitea-main/internal/runtimecomposition/|apps/elitea-web/src/features/chat-|apps/elitea-web/e2e/|apps/elitea-web/scripts/chat-stream-e2e\.sh|apps/elitea-web/playwright\.config\.ts|deploy/docker-compose\.standalone-(full|rust-agent)\.yml|deploy/scripts/|deploy/ci/|\.github/actions/|\.github/workflows/ci-web-e2e\.yml)'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "reaches-model=true" >> "$GITHUB_OUTPUT"
            echo "model path touched:"; printf '%s\n' "$changed" | grep -E "$pattern"
          else
            echo "reaches-model=false" >> "$GITHUB_OUTPUT"
            echo "no model-path file changed; the real-model lane is skipped on this pull request"
          fi

  chat-stream-real:
    name: Chat journeys against a real model
    needs: model-path-changes
    if: needs.model-path-changes.outputs.reaches-model == 'true'
    # The structural chat journeys against a REAL model — Qwen3-0.6B under
    # llama.cpp, baked into an image built and smoke-tested in
    # github.com/elitea-ng/elitea-e2e-llm and pinned by digest in the compose
    # file (the `llm-real` service, `real-llm` profile). Next to the mock
    # lanes, never instead of them: the mock is what makes `chat.stop`,
    # `chat.hitl`, the toolkit sentinels and the journal-reading specs
    # assertable at all, and none of those run here.
    #
    # What this job alone can catch: the gateway's SSE relay against a
    # vendor's real chunk shapes (a `reasoning_content` field, a trailing
    # usage chunk, real finish reasons) and a tool call the model chose from
    # the schema the runtime presented — as opposed to one a prompt marker
    # forced. Every assertion in the `chat-stream-real` Playwright project is
    # semantic or structural for that reason; an exact-text assertion here
    # would be a flake by construction.
    #
    # On the NATIVE runtime (STANDALONE_WORKER=rust): three of the seven
    # specs in the project are the pipeline journeys, which author the Rust
    # runtime's graph shapes and skip themselves on the python leg. The
    # python leg would run four specs for the same stack cost.
    #
    # A separate job for the same reason `chat-stream-rust` is: the stacks
    # share the fixed oidc-mock port and cannot coexist on one host, and one
    # job name per lane keeps the failing lane legible.
    #
    # Measured in the image's own CI on this runner class: 25–43 tok/s
    # generation, so a capped 256-token turn is ~10 s; the Rust lane it
    # mirrors takes ~15 min. The timeout below is the thing that turns a
    # wedged model into minutes rather than the six-hour default, and every
    # job in this workflow now carries one; this is the one whose upstream
    # can hang.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Pre-pull the pinned Playwright container and the model image (background)
        # Started with nohup and left running while the bake below uses the
        # CPU: the runner does not reap a step's background processes, and
        # compose / the test step pull inline if this has not finished, so a
        # slow pull costs the overlap and never the run.
        working-directory: ${{ github.workspace }}
        run: |
          nohup bash -c 'timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.1-noble ; timeout 900 docker compose -f deploy/docker-compose.standalone-full.yml --profile real-llm pull -q llm-real' >/tmp/prepull.log 2>&1 &
      - name: Build the stack images (shared cache)
        # Replaces the script's own `compose build` (STANDALONE_SKIP_BUILD=1
        # below): every `build:` service of the compose file(s) the stack runs,
        # baked with one shared layer cache per image and the cargo/Go/pip
        # cache mounts restored from the previous run, then asserted present.
        # Measured before this: 5.3 min (python worker) to 10.6 min (Rust
        # worker, 9.6 of it one sequential cargo chain) of every such job.
        uses: ./.github/actions/build-stack-images
        with:
          compose-files: |
            docker-compose.standalone-full.yml
            docker-compose.standalone-rust-agent.yml
          cache-hcl: |
            ci/bake-cache.hcl
            ci/bake-cache-rust.hcl
          targets: standalone
          mount-cache-suffix: rust
      - name: Run the journeys against a fresh real-model stack
        # The same script and lifecycle as `chat-stream`. What differs is the
        # environment: the profile that starts `llm-real`, the LLM_* variables
        # `seed-llm` reads to point the gateway at it (LLM_EMBEDDING_MODEL
        # carries the `vllm/` prefix itself — see resolve_embedding_model),
        # the Playwright project that holds only the structural specs, and
        # E2E_CHAT_MODEL so those specs expect the seeded row's name.
        #
        # No MOCK_LLM_CHUNK_DELAY_MS: the mock is up for `check` but answers
        # no journey here, and a real model paces itself.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          STANDALONE_SKIP_BUILD: "1"
          STANDALONE_WORKER: rust
          COMPOSE_PROFILES: real-llm
          LLM_PROVIDER: vllm
          LLM_API_BASE: http://llm-real:8090
          LLM_MODEL: qwen3-0.6b
          LLM_EMBEDDING_MODEL: vllm/nomic-embed-text-v1.5
          PLAYWRIGHT_PROJECT: chat-stream-real
          E2E_CHAT_MODEL: vllm/qwen3-0.6b
          CHAT_STREAM_PROJECT: elitea-chatstream-real-ci
          # Not 8085 (the gateway's debug port) and not 8086 (the Rust lane's),
          # so the three lanes can never collide even on one host.
          CHAT_STREAM_PORT: "8087"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
        run: bash apps/elitea-web/scripts/chat-stream-e2e.sh
      - name: Give the report back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chat-stream-real
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  live-toolkits:
    name: Live toolkit and image lanes (real credentials)
    # workflow_dispatch ONLY, and only when asked for. These journeys create
    # rows in a real GitHub/Jira/GitLab/Bitbucket/Confluence account and spend
    # a real provider's quota; nothing about a pull request should do that on
    # its own.
    if: github.event_name == 'workflow_dispatch' && inputs.live_toolkits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Mapped by NAME so `apps/elitea-web/e2e/live/liveEnv.ts` sees exactly
      # what a developer's shell would set. A secret this repository does not
      # hold expands to the EMPTY STRING here, which liveEnv reads as absent —
      # that equivalence is pinned by scripts/live-env.test.mjs, because a lane
      # that treated '' as configured would arm itself on every run and fail
      # against a provider with an empty token.
      E2E_LIVE_GITHUB_TOKEN: ${{ secrets.E2E_LIVE_GITHUB_TOKEN }}
      E2E_LIVE_GITHUB_REPOSITORY: ${{ secrets.E2E_LIVE_GITHUB_REPOSITORY }}
      E2E_LIVE_GITHUB_BASE_URL: ${{ secrets.E2E_LIVE_GITHUB_BASE_URL }}
      E2E_LIVE_GITHUB_BRANCH: ${{ secrets.E2E_LIVE_GITHUB_BRANCH }}
      E2E_LIVE_JIRA_BASE_URL: ${{ secrets.E2E_LIVE_JIRA_BASE_URL }}
      E2E_LIVE_JIRA_USERNAME: ${{ secrets.E2E_LIVE_JIRA_USERNAME }}
      E2E_LIVE_JIRA_API_KEY: ${{ secrets.E2E_LIVE_JIRA_API_KEY }}
      E2E_LIVE_JIRA_PROJECT_KEY: ${{ secrets.E2E_LIVE_JIRA_PROJECT_KEY }}
      E2E_LIVE_GITLAB_URL: ${{ secrets.E2E_LIVE_GITLAB_URL }}
      E2E_LIVE_GITLAB_PRIVATE_TOKEN: ${{ secrets.E2E_LIVE_GITLAB_PRIVATE_TOKEN }}
      E2E_LIVE_GITLAB_REPOSITORY: ${{ secrets.E2E_LIVE_GITLAB_REPOSITORY }}
      E2E_LIVE_GITLAB_BRANCH: ${{ secrets.E2E_LIVE_GITLAB_BRANCH }}
      E2E_LIVE_BITBUCKET_URL: ${{ secrets.E2E_LIVE_BITBUCKET_URL }}
      E2E_LIVE_BITBUCKET_USERNAME: ${{ secrets.E2E_LIVE_BITBUCKET_USERNAME }}
      E2E_LIVE_BITBUCKET_TOKEN: ${{ secrets.E2E_LIVE_BITBUCKET_TOKEN }}
      E2E_LIVE_BITBUCKET_PROJECT: ${{ secrets.E2E_LIVE_BITBUCKET_PROJECT }}
      E2E_LIVE_BITBUCKET_REPOSITORY: ${{ secrets.E2E_LIVE_BITBUCKET_REPOSITORY }}
      E2E_LIVE_BITBUCKET_BRANCH: ${{ secrets.E2E_LIVE_BITBUCKET_BRANCH }}
      E2E_LIVE_CONFLUENCE_BASE_URL: ${{ secrets.E2E_LIVE_CONFLUENCE_BASE_URL }}
      E2E_LIVE_CONFLUENCE_USERNAME: ${{ secrets.E2E_LIVE_CONFLUENCE_USERNAME }}
      E2E_LIVE_CONFLUENCE_API_KEY: ${{ secrets.E2E_LIVE_CONFLUENCE_API_KEY }}
      E2E_LIVE_CONFLUENCE_SPACE: ${{ secrets.E2E_LIVE_CONFLUENCE_SPACE }}
      E2E_LIVE_CONFLUENCE_LABEL: ${{ secrets.E2E_LIVE_CONFLUENCE_LABEL }}
      E2E_LIVE_IMAGE_MODEL: ${{ secrets.E2E_LIVE_IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Ask Playwright what the live lanes actually hold
        id: lanes
        # `--list` needs no stack: the gate is computed at config load from the
        # environment. The counts are taken per PROJECT PREFIX rather than from
        # the "Total:" line, because the `setup` project is a dependency of
        # both and contributes three rows to it — a total-line reading would
        # report a fully unconfigured machine as holding three live tests.
        run: |
          set -euo pipefail
          npx playwright test --list --project=toolkits-live --project=image-live \
            > /tmp/live-list.txt 2>&1 || true
          toolkits=$(grep -c '^\s*\[toolkits-live\]' /tmp/live-list.txt || true)
          images=$(grep -c '^\s*\[image-live\]' /tmp/live-list.txt || true)
          echo "toolkits=${toolkits}" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          {
            echo "### Live lanes"
            echo
            echo "| project | tests listed |"
            echo "|---|---|"
            echo "| toolkits-live | ${toolkits} |"
            echo "| image-live | ${images} |"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=""
          for name in E2E_LIVE_GITHUB_TOKEN E2E_LIVE_GITHUB_REPOSITORY \
                      E2E_LIVE_JIRA_BASE_URL E2E_LIVE_JIRA_USERNAME \
                      E2E_LIVE_JIRA_API_KEY E2E_LIVE_JIRA_PROJECT_KEY \
                      E2E_LIVE_GITLAB_PRIVATE_TOKEN E2E_LIVE_GITLAB_REPOSITORY \
                      E2E_LIVE_BITBUCKET_USERNAME E2E_LIVE_BITBUCKET_TOKEN \
                      E2E_LIVE_BITBUCKET_PROJECT E2E_LIVE_BITBUCKET_REPOSITORY \
                      E2E_LIVE_CONFLUENCE_BASE_URL E2E_LIVE_CONFLUENCE_USERNAME \
                      E2E_LIVE_CONFLUENCE_API_KEY E2E_LIVE_CONFLUENCE_SPACE \
                      E2E_LIVE_IMAGE_MODEL; do
            if [ -z "${!name:-}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            {
              echo
              echo "Repository secrets not set:${missing}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # THE ASSERTION THAT KEEPS THE PASS HONEST. A lane with no secret must
          # list ZERO tests; a lane with every secret must list some. Either way
          # the count is checked against the environment rather than accepted,
          # so "0 tests, green" can never mean "the project is broken".
          if [ -n "${E2E_LIVE_GITHUB_TOKEN:-}" ] && [ "${toolkits}" -eq 0 ]; then
            echo "::error::a GitHub credential is configured but toolkits-live listed 0 tests" >&2
            cat /tmp/live-list.txt >&2
            exit 1
          fi
          if [ -z "${E2E_LIVE_GITHUB_TOKEN:-}" ] && [ -z "${E2E_LIVE_JIRA_API_KEY:-}" ] \
             && [ "${toolkits}" -ne 0 ]; then
            echo "::error::no toolkit credential is configured, yet toolkits-live listed ${toolkits} tests" >&2
            exit 1
          fi
          if [ -n "${E2E_LIVE_IMAGE_MODEL:-}" ] && [ "${images}" -eq 0 ]; then
            echo "::error::an image model is configured but image-live listed 0 tests" >&2
            exit 1
          fi
          if [ -z "${E2E_LIVE_IMAGE_MODEL:-}" ] && [ "${images}" -ne 0 ]; then
            echo "::error::no image model is configured, yet image-live listed ${images} tests" >&2
            exit 1
          fi
          if [ "${toolkits}" -eq 0 ] && [ "${images}" -eq 0 ]; then
            echo "No live credential is configured for this repository."
            echo "Both live projects listed 0 tests, which is what an unconfigured"
            echo "machine must produce — see apps/elitea-web/e2e/live/README.md for"
            echo "the variables to add as repository secrets."
          fi
      - name: Build the stack images (shared cache)
        if: steps.lanes.outputs.toolkits != '0'
        uses: ./.github/actions/build-stack-images
        with:
          compose-files: |
            docker-compose.standalone-full.yml
            docker-compose.standalone-rust-agent.yml
          cache-hcl: |
            ci/bake-cache.hcl
            ci/bake-cache-rust.hcl
          targets: standalone
          mount-cache-suffix: rust
      - name: Run the live toolkit journeys against a real-model stack
        if: steps.lanes.outputs.toolkits != '0'
        # The same stack and the same script as `chat-stream-real` — every live
        # journey drives a real chat turn, so it needs the real model as well
        # as the real credential. The script forwards every E2E_LIVE_* name
        # into the Playwright container; see its own note.
        #
        # `image-live` is NOT run here. Its prerequisite is an image-capable
        # provider CONFIGURED ON THE STACK, which the `real-llm` profile
        # (llama.cpp, text only) is not and a repository secret cannot make it.
        # The lane is driven against a deployment that has one; the step above
        # still reports its listed count, so the pair stays legible.
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          STANDALONE_SKIP_BUILD: "1"
          STANDALONE_WORKER: rust
          COMPOSE_PROFILES: real-llm
          LLM_PROVIDER: vllm
          LLM_API_BASE: http://llm-real:8090
          LLM_MODEL: qwen3-0.6b
          LLM_EMBEDDING_MODEL: vllm/nomic-embed-text-v1.5
          PLAYWRIGHT_PROJECT: toolkits-live
          E2E_CHAT_MODEL: vllm/qwen3-0.6b
          CHAT_STREAM_PROJECT: elitea-live-toolkits-ci
          # Not 8085/8086/8087 — the three chat lanes' ports — so this stack can
          # never collide with one of them on a shared host.
          CHAT_STREAM_PORT: "8088"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
        run: bash apps/elitea-web/scripts/chat-stream-e2e.sh
      - name: Give the report back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-toolkits
          path: apps/elitea-web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

