  index-stream:
    name: Index definition-of-done journey (#93)
    # Issue #485. `apps/elitea-web/scripts/index-stream-e2e.sh` ran in no
    # workflow, and neither did `deploy/scripts/embedding-path-check.sh`, which
    # it calls. That second script is the reference honest validator in this
    # repository — it counts its assertions and exits non-zero when fewer than
    # 13 run — and no continuous-integration job could reach it. Its only two
    # callers were `standalone-stack.sh check` and this journey, and neither
    # ran anywhere.
    #
