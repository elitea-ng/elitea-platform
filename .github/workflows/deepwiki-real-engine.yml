name: CI — DeepWiki real engine

# DWIKI-014/014b — the REAL DeepWiki analysis engine driven through the product,
# by `apps/elitea-web/scripts/deepwiki-real-engine.sh`, on one of two engines
# (the `engine` matrix axis):
#
#   legacy — the standalone stack plus deploy/docker-compose.deepwiki-real-engine.yml,
#     which puts the Python `-engine` image behind the Go sub-app host, serves
#     the repository under analysis from a git daemon, and answers the
#     engine's model calls with a deterministic stub;
#   native — the Rust-native engine (ADR-0026): the standalone stack plus
#     deploy/docker-compose.deepwiki-native.yml and
#     deploy/docker-compose.deepwiki-native-real-engine.yml (the bake target
#     `elitea-deepwiki-engine-native`, the same stub). The native clone speaks
#     HTTPS only and reads no git configuration, so the git daemon cannot
#     serve it: the repository under analysis is the public
#     github.com/kharkevich-engineering-lab/floe (its owner agreed to this
#     use), allowlisted as github.com. The product clones a branch or tag
#     head, never a commit, so a pin (`native_commit`) is CHECKED by the
#     runner script before anything is built, and the journey requires the
#     published manifest to name it. A dispatch pins by default (the input
#     default below), so a hand-run proof is reproducible; dispatch with
#     `native_commit=none` to take the head. The weekly run takes floe's
#     current `main` head (`none`): floe is a live repository, and a pin
#     there would turn the weekly native leg red the first time `main`
#     moves, which says nothing about the engine. Its manifest still names
#     the commit it analysed.
#
# The weekly run covers BOTH engines (two matrix jobs on separate runners,
# well inside the 20-job cap); a dispatch runs the one `engine` it names.
#
# ── WHY THIS IS NOT ON `pull_request` OR `push` ──────────────────────────────
#
# The `deepwiki-stack` job in ci-web-e2e.yml is the per-change gate: it runs the
# same product surface against the provider's FIXTURE engine, and it is what
# must stay green on every PR. This workflow swaps one thing out — the fixture
# engine for the real one — and that one thing costs:
#
#   * the `-engine` image is the deepwiki image plus a ~92-package ML closure
#     (torch, transformers, faiss-cpu, tree-sitter grammars), ~2 GB. ADR-0022
#     keeps it out of the default bake group and out of the release for the same
#     reason, and scripts/ci/image-matrix.sh records it as built-but-unpublished;
#   * a cold build of it is tens of minutes, and a GHA-cached one still has to
#     export and load ~2 GB before the stack can start;
#   * on top of that comes the full standalone stack, the seeds, and a real
#     embedding + generation pass over a real repository.
#
# Put on `pull_request` that is minutes of runner time added to every change,
# most of which cannot affect the engine at all, and a cache miss (a base image
# rollover, a dependency bump) turns into a queue-blocking build. The value it
# adds over `deepwiki-stack` is drift between the fixture engine and the real
# one, which appears on the scale of weeks, not commits.
#
# So: a weekly cadence plus `workflow_dispatch`, the same shape and for the same
# reason as ci-web-mutation.yml. Dispatch it deliberately when a change touches
# services/elitea-deepwiki/src/elitea_deepwiki/engine/** or the engine extras
# (engine=legacy), or services/elitea-deepwiki-engine/** (engine=native):
#
#   gh workflow run deepwiki-real-engine.yml --ref <branch> -f engine=native
#
# There is no push arm at all, which the workflow-branch-coverage gate
# (scripts/ci/check_workflow_branch_coverage.py) requires to be a recorded
# decision rather than a silence — the entry for this file is in that script's
# EXEMPT_WORKFLOWS table.

on:
  schedule:
    # Sundays, 04:23 UTC. Deliberately far from ci-web-mutation.yml's Wednesday
    # 08:47 and from ci-image-scan.yml's daily 05:17, so the three heavy cadence
    # jobs never contend for the same runner window.
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      engine:
        description: >-
          Which engine to run: `legacy` (the Python -engine image over the git
          daemon fixture) or `native` (the Rust engine over
          github.com/kharkevich-engineering-lab/floe). The weekly run covers both.
        type: choice
        options:
          - legacy
          - native
        default: legacy
      native_ref:
        description: >-
          Native only: the floe branch or tag the product clones (it clones a
          head, never a commit).
        type: string
        required: false
        default: main
      native_commit:
        description: >-
          Native only: the commit `native_ref` must be at; the run stops before
          building anything when it is not, and the published wiki must name
          it. `none` analyses whatever the head is (the wiki must still name
          the head the runner resolved).
        type: string
        required: false
        default: 89c2197fa88a910c9b8344ae3c4dd06618ed28ae
      engine_image:
        description: >-
          Optional: an already-built engine image (of the selected `engine`) to
          run instead of building one here (for example a tag pushed by hand,
          or a previous run's). When set
          the image is PULLED and the bake step is skipped, so a run in this mode
          says nothing about whether the engine still builds from this revision.
          Leave blank for the normal path.
        type: string
        required: false
        default: ""

concurrency:
  # One at a time. Two of these on the same ref would each want the fixed
  # oidc-mock port 9400, and both would want the whole runner's disk.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed by the failure-tier incident escalation below (issue #62's pattern,
  # see ci-web-mutation.yml). Paired with GITHUB_TOKEN on that step — the
  # permission alone does nothing.
  issues: write

jobs:
  real-engine:
    name: DeepWiki journeys against the real engine (DWIKI-014, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    # A cold engine build plus the stack plus a real analysis pass. Generous,
    # because a run that is killed at the default 360 min tells us nothing, and
    # this job has no PR to hold up.
    timeout-minutes: 120
    strategy:
      # One engine's failure says nothing about the other's.
      fail-fast: false
      matrix:
        # A dispatch runs the engine it names; the weekly `schedule` run (whose
        # `inputs` context is null) runs both.
        engine: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.engine) || '["legacy","native"]') }}
    env:
      DEEPWIKI_REAL_ENGINE: ${{ matrix.engine }}
      # At JOB level, not on the journey step alone: the third-party pull step
      # resolves the overlays with `compose config`, and without this the
      # overlay's own default tag (which no step builds) reads as an image to
      # PULL, fails five attempts and fails the job. The bake below writes
      # exactly these tags (TAG=local, the bake file's default REGISTRY).
      DEEPWIKI_ENGINE_IMAGE: ${{ inputs.engine_image || (matrix.engine == 'native' && 'ghcr.io/eliteaai/elitea-deepwiki-engine-native:local' || 'ghcr.io/eliteaai/elitea-deepwiki:local-engine') }}
      DEEPWIKI_BAKE_TARGET: ${{ matrix.engine == 'native' && 'elitea-deepwiki-engine-native' || 'elitea-deepwiki-engine' }}
      # Native only (the legacy runner ignores them). On `schedule` the inputs
      # are null and the fallbacks apply; keep the commit in step with the
      # input default above.
      DEEPWIKI_NATIVE_REF: ${{ inputs.native_ref || 'main' }}
      DEEPWIKI_NATIVE_COMMIT: ${{ github.event_name == 'schedule' && 'none' || inputs.native_commit || '89c2197fa88a910c9b8344ae3c4dd06618ed28ae' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The engine, main, web and worker images all build from repo-root
          # context, and the stack scripts read git metadata.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/elitea-web/package-lock.json

      - name: Install (locked)
        working-directory: apps/elitea-web
        run: npm ci

      - name: Make room for the engine image
        # The `-engine` closure plus the standalone stack's own images does not
        # fit comfortably beside the runner's preinstalled toolchains. Bounded
        # and NON-FATAL: if a path is already gone, or `rm` is refused, the run
        # continues and the build fails honestly on ENOSPC rather than on this
        # step. Reported either way so a future disk failure is not a mystery.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            || echo "::warning::could not remove every preinstalled toolchain; continuing"
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v4
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Pre-pull the pinned Playwright container
        # Bounded and NON-FATAL: a single attempt here is purely an overlap
        # optimisation with the engine build below, not the last word on the
        # image being present. This job delegates to chat-stream-e2e.sh
        # (deepwiki-real-engine.sh -> chat-stream-e2e.sh), which waits for
        # this pull's result and retries with a bounded backoff immediately
        # before its `docker run` — what an unretried inline pull racing the
        # registry does not get (the mcr.microsoft.com timeout that killed
        # PR #1001's index-stream job).
        run: |
          timeout 600 docker pull -q mcr.microsoft.com/playwright:v1.62.1-noble \
            || echo "::warning::pull of the pinned Playwright image failed or timed out; the journey step will retry it"

      - name: Build the engine image (bake, GHA layer cache)
        # `docker buildx bake <target>` rather than a bare `docker build`: the
        # bake target is the ONE definition of the engine build
        # (`elitea-deepwiki-engine`: EXTRAS=[engine,storage-postgres];
        # `elitea-deepwiki-engine-native`: the Rust binary on distroless) and it
        # already declares its `type=gha` cache scope, which is the cache the
        # publish matrix uses for every other image. A second copy of the build
        # line here would be free to drift from what a release would produce.
        #
        # TAG=local makes bake write `ghcr.io/eliteaai/elitea-deepwiki:local-engine`
        # (legacy) or `ghcr.io/eliteaai/elitea-deepwiki-engine-native:local`
        # (native) — byte for byte DEEPWIKI_ENGINE_IMAGE above, which the
        # overlays and the runner script read, so nothing has to be retagged.
        # `--set '*.platform=linux/amd64'` also narrows the native target's
        # two-platform list to the runner's own.
        #
        # `--load` is load-bearing and is the bug ci-web-e2e.yml's image step
        # records: a bake without it leaves the result in the BUILDER's cache
        # only, `docker images` never sees the tag, and compose falls through to
        # a registry pull that is denied.
        # `!inputs.…` rather than `inputs.… == ''`: on a `schedule` run the whole
        # `inputs` context is null, and `null == ''` is FALSE — the comparison
        # form would skip the build on exactly the runs nobody is watching.
        if: ${{ !inputs.engine_image }}
        env:
          TAG: local
        run: docker buildx bake --set '*.platform=linux/amd64' --load "$DEEPWIKI_BAKE_TARGET"

      - name: Pull the supplied engine image
        # The dispatch override. Pulling here (rather than letting compose do it)
        # keeps the failure attached to a step whose name says what happened.
        if: ${{ inputs.engine_image }}
        run: docker pull "${{ inputs.engine_image }}"

      - name: Pull third-party images with retry
        # This job never goes through .github/actions/build-stack-images (the
        # engine image is baked directly, above), so it needs its own copy of
        # the same bounded-retry pull the other stack-bringing jobs get from
        # that action — same script, the same two compose files
        # deepwiki-real-engine.sh assembles (standalone-full plus this
        # workflow's real-engine overlay) before it delegates to
        # chat-stream-e2e.sh for `compose up`.
        #
        # The overlay list is the one deepwiki-real-engine.sh assembles for the
        # engine of this leg.
        run: |
          case "$DEEPWIKI_REAL_ENGINE" in
            native)
              overlays="deploy/docker-compose.deepwiki-native.yml deploy/docker-compose.deepwiki-native-real-engine.yml" ;;
            *)
              overlays="deploy/docker-compose.deepwiki-real-engine.yml" ;;
          esac
          # The overlay list is deliberately word-split.
          # shellcheck disable=SC2086
          bash scripts/ci/pull-third-party-images.sh \
            deploy/docker-compose.standalone-full.yml $overlays

      - name: Run the DeepWiki journeys against the real engine
        # The script owns the whole lifecycle — it applies the real-engine
        # overlay, then delegates to chat-stream-e2e.sh for the PKI, compose up,
        # the seeds and Playwright, and tears down on exit. Its own compose
        # project and port keep it off the other stacks' state.
        #
        # DEEPWIKI_ENGINE_IMAGE (job env) is set unconditionally so the value
        # this job ran is visible in the log, and so the script's "is it
        # already built?" probe finds the image the step above produced instead
        # of rebuilding it. DEEPWIKI_REAL_ENGINE (job env) selects the engine;
        # on `native` the script first checks floe's DEEPWIKI_NATIVE_REF
        # against DEEPWIKI_NATIVE_COMMIT (`git ls-remote`, network).
        #
        # PLAYWRIGHT_CONTAINER_IMAGE runs the specs inside the pinned container.
        # The tag is written HERE and not in the script on purpose:
        # apps/elitea-web/scripts/check-playwright-image-tag.mjs only scans
        # .github/workflows/, so a reference in this file is gated against the
        # pinned @playwright/test and one inside the script would not be.
        env:
          COMPOSE_BIN: docker compose
          CI: "true"
          DEEPWIKI_REAL_PROJECT: elitea-deepwiki-real-ci
          # NOT 8087: that is `deepwiki-stack`'s port in ci-web-e2e.yml. They run
          # on separate runners today; keeping the numbers distinct means that
          # stays true if they ever do not.
          DEEPWIKI_REAL_PORT: "8088"
          PLAYWRIGHT_CONTAINER_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble
        run: bash apps/elitea-web/scripts/deepwiki-real-engine.sh

      - name: Give the report back to the runner user
        # The Playwright container runs as root, so playwright-report/ comes back
        # root-owned — the same trap and the same fix as the ci-web-e2e.yml jobs.
        if: always()
        working-directory: apps/elitea-web
        run: sudo chown -R "$(id -u):$(id -g)" playwright-results playwright-report 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # The legacy leg keeps the artifact name it always had.
          name: playwright-report-deepwiki-real-engine${{ matrix.engine == 'native' && '-native' || '' }}
          path: |
            apps/elitea-web/playwright-report/
            apps/elitea-web/playwright-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: File an incident issue on failure
        # This job runs unattended (weekly cron), same as ci-web-mutation.yml,
        # and for the same reason carries the same escalation: a red run here
        # would otherwise sit in the Actions tab until someone happens to look.
        # De-duplicated by title — see scripts/lib/github-issue.mjs — so a
        # second bad Sunday comments on the existing issue instead of opening
        # another one.
        if: failure()
        working-directory: apps/elitea-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deepwiki-real-engine-incident.mjs
