name: Desktop — package for device management

# The desktop app's packages (ADR-0052 decisions 4, 6 and 8; W2b): an Apple silicon
# (arm64) macOS app signed with the brand owner's Developer ID, notarised and stapled,
# in a signed `.pkg` that installs silently and refuses an Intel Mac (Intel is not
# supported, owner decision 2026-11-20) and in a styled, signed `.dmg` (the direct
# download, owner decision 2026-11-22); and an x64 MSI (Intune, SCCM, msiexec) and
# MSIX (the Store, Intune) for Windows; and an x86_64 AppImage and .deb for Linux
# (#3034, on the self-hosted pool, with no code signature).
#
# THE DMG. Opening it shows one fixed window: the brand's background
# (brand/<id>/assets/macos/dmg-background{,@2x}.png, or one drawn from the brand's
# hue), the app on the left, an Applications alias on the right and an arrow between;
# the volume, and so the window's title, is `<Brand> <version>`, with the brand's
# icon, and no window bars. scripts/macos-dmg.sh lays it out through Finder, retries,
# turns every window bar off (ds-store.mjs), and reads the
# .DS_Store back (dmg-verify.mjs); the action mounts the finished image and checks it
# again. Signed: codesigned with the Developer ID Application identity, notarised,
# stapled, and accepted by `spctl -a -t open --context context:primary-signature`.
#
# ATTACHED TO EVERY RELEASE (owner decision 2026-11-22, amending ADR-0052 decision
# 10, which kept them off the release). Called from publish.yml with
# `upload_release_assets`, each job stages its packages under their release names
# (`<Brand>-<version>-<os>-<arch>[-unsigned].<ext>`, desktop-package.mjs assetName)
# and uploads them as a one-day workflow artifact; publish.yml `desktop-assets`
# attaches them, with SHA256SUMS, to the GitHub release (stable and nightly).
#   macOS     signed and notarised, ALWAYS (`require_signed_macos`): the .dmg (the
#             download people drag to Applications) and the .pkg (device management).
#   Windows   UNSIGNED until a Windows signer's secrets exist (`require_signed_windows`
#             is false), named `-unsigned`. Once a signer's full set is set, the same
#             run signs. The unsigned MSIX installs only on a recent Windows 11
#             (Developer Mode, `Add-AppxPackage -AllowUnsigned`); the MSI shows a SmartScreen warning.
#   Linux     the AppImage and the .deb, with no code signature and no `-unsigned` in
#             their names (no Linux signer exists or is planned); SHA256SUMS.
#
# SECRETS BY FIXED NAME (scripts/desktop-package.mjs `SECRETS`, the list W5
# publishes). All of a platform's secrets: sign and verify. None: an unsigned build
# with a notice, so forks and pull requests stay green (and, for Windows, the
# release ships unsigned). Some: a failure, always. `require_signed_<os>`: none is a
# failure too. A pull request is ALWAYS a dry run: its code must not run with the
# certificates.
#
# WHEN.
#   pull_request        through ci.yml (heavy tier), only when the desktop app, its
#                       Tauri config, the packaging scripts and actions or the
#                       vendored agent-desktop change (scripts/ci/tier-paths.json,
#                       held exact by scripts/ci/check-tiering.mjs): an unsigned
#                       DEBUG dry run that restores ci-desktop.yml's cached debug
#                       target (key `desktop-host`, written by its nightly on main).
#                       It builds brand/sample and is also the desktop lane of
#                       the ADR-0052 W4 output scan (scripts/ci/brand-output-scan.mjs):
#                       the packaged host binary, its overlay and the disk image's
#                       settings (volume name) carry no ELITEA literal; the unsigned
#                       styled .dmg is built and its layout checked. The Windows job builds the ELITEA brand in full
#                       (release profile, unsigned): `tauri build`, the sidecar,
#                       the MSI and makeappx, and stages the release asset names.
#                       The Linux job does the same for the AppImage and the .deb
#                       (ELITEA, release profile), smoke-tests the AppImage under
#                       xvfb, and keeps both as the `desktop-linux` artifact.
#                       Main and releases build the ELITEA brand.
#   workflow_call       publish.yml, on main: the nightly pre-release (its schedule)
#                       and every release. The full release build, macOS signed and
#                       verified, Windows signed when a signer exists; the
#                       packages go to the release (`upload_release_assets`).
#   workflow_dispatch   by hand, with the version to stamp: a package to hand to device management (macOS
#                       signed, the .pkg and the .dmg; Windows as the release builds it).
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to build (the release tag); empty builds the caller's own ref (ci.yml).
        type: string
        required: false
        default: ""
      version:
        description: The full release version to stamp (X.Y.Z or X.Y.Z-pre); empty on a pull request (a dry run).
        type: string
        required: false
        default: ""
      require_signed_macos:
        description: Fail unless the macOS app and package are signed and notarised (the release check).
        type: boolean
        default: true
      require_signed_windows:
        description: >-
          Fail unless the Windows packages are signed. False until a Windows signer
          exists (owner decision 2026-11-22): the release ships them unsigned. A
          half-configured signer fails either way.
        type: boolean
        default: false
      upload_release_assets:
        description: >-
          Stage the packages under their release names and upload them as one-day
          workflow artifacts (desktop-release-<os>) for publish.yml `desktop-assets`.
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_INSTALLER_SIGNING_IDENTITY: { required: false }
      APPLE_API_KEY: { required: false }
      APPLE_API_ISSUER: { required: false }
      APPLE_API_PRIVATE_KEY: { required: false }
      WINDOWS_PUBLISHER: { required: false }
      AZURE_CLIENT_ID: { required: false }
      AZURE_CLIENT_SECRET: { required: false }
      AZURE_TENANT_ID: { required: false }
      AZURE_SIGNING_ENDPOINT: { required: false }
      AZURE_SIGNING_ACCOUNT: { required: false }
      AZURE_SIGNING_PROFILE: { required: false }
      WINDOWS_CERTIFICATE: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }
  workflow_dispatch:
    inputs:
      # Required: a package handed to device management carries a real version (the
      # .dmg's volume and window read `<Brand> <version>`, the app's bundle version
      # too), never the development 0.1.0 an empty version stamps. The action's first
      # steps refuse anything but X.Y.Z or X.Y.Z-pre (stamp-version.mjs), before any build.
      version:
        description: The version to stamp (X.Y.Z or X.Y.Z-pre), e.g. the release the package is for.
        type: string
        required: true
      keep_artifacts:
        description: Keep the packages as workflow artifacts (7 days) for device management.
        type: boolean
        default: false

concurrency:
  group: desktop-package-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS Apple Silicon (.dmg, .pkg)
    # Apple silicon: the package is built for the runner's own architecture.
    runs-on: macos-latest
    # A pull request's debug dry run restores the host's cached target; the
    # signed release build (fat LTO, one codegen unit) starts cold and then
    # waits for three notarisations in turn: the app, the .pkg and the .dmg (up
    # to 30 minutes per notarytool submit).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 150 }}
    # The same value as ci-desktop.yml's macOS host job: it is part of the
    # rust-cache key, so the pull-request dry run restores that job's entry.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      # A pull request's dry run builds the sample brand (the output scan below);
      # empty is the default brand, ELITEA (scripts/brand/load.mjs).
      ELITEA_BRAND: ${{ github.event_name == 'pull_request' && 'sample' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # A pull request's dry run is a debug build, so it reuses the macOS host
      # job's target: the same shared-key, workspaces, cache-targets and CARGO_*
      # environment as ci-desktop.yml `desktop`, the one writer (its nightly on
      # main). scripts/ci/check-cache-budget.mjs fails a restore-only step whose
      # key no scheduled writer saves. A release build cannot use a debug target,
      # so the signed runs skip the restore.
      # rust-cache keys on `rustc -vV`: the pinned toolchain is installed first, as
      # in the writer.
      - name: Assert the pinned toolchain
        if: github.event_name == 'pull_request'
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
      - name: Restore the macOS host's cargo cache (pull requests)
        if: github.event_name == 'pull_request'
        uses: Swatinem/rust-cache@v2
        with:
          # The writer's (ci-desktop.yml desktop) prefix, character for character.
          prefix-key: v1-rust
          shared-key: desktop-host
          save-if: false
          workspaces: |
            apps/elitea-desktop/src-tauri
            apps/elitea-desktop/doc-extract-sidecar

      # The build itself is .github/actions/desktop-macos-package, which brand
      # repositories run from a release tag (ADR-0052 W5, docs/brand-template/).
      - name: Build, sign and verify (or dry run)
        id: package
        uses: ./.github/actions/desktop-macos-package
        with:
          version: ${{ inputs.version }}
          build-number: ${{ github.run_number }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          debug: ${{ github.event_name == 'pull_request' }}
          # A kept package goes to device management: it must be signed.
          require-signed: ${{ inputs.require_signed_macos == true || inputs.keep_artifacts == true }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-installer-signing-identity: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      # ADR-0052 W4, desktop lane: the host binary the dry run packaged (debug,
      # brand/sample), its overlay and the disk image's settings (the volume name
      # and window title) show no ELITEA word or identifier. Not the sidecar: only
      # tauri.sidecar.conf.json (the release) names it.
      - name: Sample-brand output scan (host binary, overlay, disk image settings)
        if: github.event_name == 'pull_request'
        env:
          DMG_SETTINGS: ${{ steps.package.outputs.dmg-settings }}
        run: >
          node scripts/ci/brand-output-scan.mjs --lane desktop
          "${DESKTOP_BUNDLE}/${DESKTOP_APP}/Contents/MacOS/elitea-desktop"
          apps/elitea-desktop/src-tauri/tauri.brand.json
          "$DMG_SETTINGS"

      - name: Keep the packages (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.keep_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-pkg
          path: |
            ${{ steps.package.outputs.package-dir }}/*.pkg
            ${{ steps.package.outputs.package-dir }}/*.dmg
          retention-days: 7
          if-no-files-found: error
          # A .pkg and a .dmg are compressed already.
          compression-level: 0

      # The release names (desktop-package.mjs assetName), staged on EVERY run so a
      # pull request's dry run proves them too (`-unsigned` there): the .dmg (stapled,
      # so it opens offline) and the .pkg.
      - name: Stage the release assets
        id: assets
        env:
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.package.outputs.signed }}
          PACKAGE_DIR: ${{ steps.package.outputs.package-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          script=apps/elitea-desktop/scripts/desktop-package.mjs
          brand="$(node -p 'require("./apps/elitea-desktop/src-tauri/tauri.brand.json").productName')"
          version="${VERSION:-$DESKTOP_VERSION}"
          out="$RUNNER_TEMP/release-assets"
          rm -rf "$out" && mkdir -p "$out"
          for ext in dmg pkg; do
            files=("$PACKAGE_DIR"/*."$ext")
            if [ "${#files[@]}" -ne 1 ]; then echo "::error::want one .$ext in $PACKAGE_DIR, found ${#files[@]}"; exit 1; fi
            cp "${files[0]}" "$out/$(node "$script" asset-name macos "$ext" "$brand" "$version" "$SIGNED")"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # One day: publish.yml `desktop-assets` attaches them to the release in the same run.
      - name: Upload the release assets (publish.yml attaches them)
        if: inputs.upload_release_assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-macos
          path: ${{ steps.assets.outputs.dir }}/*
          retention-days: 1
          if-no-files-found: error
          # A .dmg and a .pkg are compressed already.
          compression-level: 0

  # ON IN EVERY RELEASE (owner decision 2026-11-22, #1699). No repository variable gates
  # it any more: DESKTOP_WINDOWS_PACKAGE was never set, so the job never ran, and a kill
  # switch that defaults on is a state nobody tests. A broken Windows build fails this
  # job red and leaves the release (and its macOS assets) in place: publish.yml's
  # rollback does not wait on `desktop`, and `desktop-assets` attaches what was built.
  # The pull request's dry run (ci.yml heavy tier, DESKTOP_PACKAGE_PATHS) runs it in
  # full: `tauri build` in the release profile, the sidecar, the MSI and makeappx.
  #
  # The MSI's Start Menu shortcut sets System.AppUserModel.ID to the brand's desktop
  # identifier (Tauri's WiX template), the id the host's toasts use; the MSIX build reads
  # `<PackageFamilyName>!App` (src/aumid.rs).
  #
  # An MSI (Tauri's WiX bundle: Intune, SCCM, `msiexec /i … /qn`) and an MSIX (makeappx:
  # the Store, Intune). UNSIGNED until a signer exists (`require_signed_windows: false`
  # in publish.yml): the files are named `-unsigned`, and the MSIX Publisher carries the
  # unsigned OID (windows-package.mjs msixPublisher). With one signer's full set of
  # secrets, the host, the sidecar, the MSI and the MSIX are all signed with Azure
  # Artifact Signing or a code-signing certificate (PFX), timestamped, then verified.
  windows:
    name: Windows (.msi, .msix)
    runs-on: windows-latest
    timeout-minutes: 90
    # `npm ci` fetches cold (no npm cache on Windows, below): one ECONNRESET
    # with npm's default 2 retries would fail the job.
    env:
      NPM_CONFIG_FETCH_RETRIES: "6"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # No npm cache: on Windows `npm config get cache` answers a backslash path,
      # which main-write-cache's literal-path guard (written for $HOME/.npm)
      # refuses, as in ci-desktop.yml `windows-host`. `npm ci` runs cold, with the
      # registry patience the npm-cache action sets elsewhere (the job's env).
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Build, sign and verify (or dry run)
        id: package
        uses: ./.github/actions/desktop-windows-package
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          # Not keep_artifacts: a kept Windows package is what the release ships,
          # unsigned until a signer exists. A half-configured signer still fails.
          require-signed: ${{ inputs.require_signed_windows == true }}
          windows-publisher: ${{ secrets.WINDOWS_PUBLISHER }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-signing-endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          azure-signing-account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          azure-signing-profile: ${{ secrets.AZURE_SIGNING_PROFILE }}
          windows-certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          windows-certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Said, not silent: a kept unsigned package must not pass for a signed one.
      - name: Say a kept Windows package is unsigned
        if: github.event_name == 'workflow_dispatch' && inputs.keep_artifacts && steps.package.outputs.signed != 'true'
        run: echo "::warning::the kept .msi and .msix are UNSIGNED (no Windows signer's secrets); SmartScreen warns on the MSI and the MSIX needs Developer Mode"

      - name: Keep the packages (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.keep_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            ${{ steps.package.outputs.package-dir }}/*.msi
            ${{ steps.package.outputs.package-dir }}/*.msix
          retention-days: 7
          if-no-files-found: error

      # The release names, staged on every run (the pull request proves them too).
      - name: Stage the release assets
        id: assets
        env:
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.package.outputs.signed }}
          PACKAGE_DIR: ${{ steps.package.outputs.package-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          script=apps/elitea-desktop/scripts/desktop-package.mjs
          brand="$(node -p 'require("./apps/elitea-desktop/src-tauri/tauri.brand.json").productName')"
          version="${VERSION:-$DESKTOP_VERSION}"
          out="$RUNNER_TEMP/release-assets"
          rm -rf "$out" && mkdir -p "$out"
          for ext in msi msix; do
            files=("$PACKAGE_DIR"/*."$ext")
            if [ "${#files[@]}" -ne 1 ]; then echo "::error::want one .$ext in $PACKAGE_DIR, found ${#files[@]}"; exit 1; fi
            cp "${files[0]}" "$out/$(node "$script" asset-name windows "$ext" "$brand" "$version" "$SIGNED")"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the release assets (publish.yml attaches them)
        if: inputs.upload_release_assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows
          path: ${{ steps.assets.outputs.dir }}/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  # LINUX, x86_64 (#3034): an AppImage (the download for any distribution with
  # glibc 2.39 or later) and a .deb, from one `tauri build` of the ELITEA brand in
  # the release profile, on every call like the other two (no `if:`). No code
  # signature: the files carry no `-unsigned` (Linux never signs,
  # desktop-package.mjs ASSET_KINDS) and are checked against SHA256SUMS.
  #
  # ON THE POOL, not a hosted runner (owner rule: hosted only where needed). Its
  # image carries the Tauri build libraries and xvfb (deploy/ci-runners/image/);
  # the job installs nothing with apt there. No FUSE in the pods: linuxdeploy and
  # the AppImage run extracted (the action sets APPIMAGE_EXTRACT_AND_RUN). Not
  # arm64: the pool is amd64 only, and a hosted arm64 job would hold one of the
  # 20 hosted slots on every desktop pull request.
  #
  # The smoke test (in the action): the AppImage answers `--version` with the
  # stamped version, starts under xvfb and is still up after 30 s; its .desktop
  # entry names the product; the .deb depends on WebKitGTK and recommends
  # bubblewrap.
  #
  # A pull request KEEPS the packages (7 days, `desktop-linux`): nothing signs
  # them, so the dry run's files are what a release ships, and they can be tried.
  linux:
    name: Linux x86_64 (.AppImage, .deb)
    runs-on: ${{ (vars.ENG_RUNNER == 'on' && github.repository == 'elitea-ng/elitea-platform' && github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && 'eng-runner' || 'ubuntu-latest' }}
    # A cold release build (fat LTO, one codegen unit) of the host and the
    # sidecar on the pod's 4 CPUs, like the Windows job's cold build.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # eng-runner: caches and TMPDIR on the work volume, and rustup (none in
      # its image). Does nothing on a hosted runner.
      - uses: ./.github/actions/eng-runner-env
        with:
          rust: "true"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # A hosted fallback (ENG_RUNNER off) has none of the pool image's
      # libraries; the pool needs no install and cannot run one (no root).
      - name: Tauri build libraries and xvfb (hosted runners only)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config xvfb

      - name: Build and smoke test
        id: package
        uses: ./.github/actions/desktop-linux-package
        with:
          version: ${{ inputs.version }}

      - name: Stage the release assets
        id: assets
        env:
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.package.outputs.signed }}
          PACKAGE_DIR: ${{ steps.package.outputs.package-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          script=apps/elitea-desktop/scripts/desktop-package.mjs
          brand="$(node -p 'require("./apps/elitea-desktop/src-tauri/tauri.brand.json").productName')"
          version="${VERSION:-$DESKTOP_VERSION}"
          out="$RUNNER_TEMP/release-assets"
          rm -rf "${out:?}" && mkdir -p "$out"
          for ext in AppImage deb; do
            files=("$PACKAGE_DIR"/*."$ext")
            if [ "${#files[@]}" -ne 1 ]; then echo "::error::want one .$ext in $PACKAGE_DIR, found ${#files[@]}"; exit 1; fi
            cp "${files[0]}" "$out/$(node "$script" asset-name linux "$ext" "$brand" "$version" "$SIGNED")"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Keep the packages (pull requests, and by hand)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.keep_artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: ${{ steps.assets.outputs.dir }}/*
          retention-days: 7
          if-no-files-found: error
          # An AppImage (squashfs) and a .deb are compressed already.
          compression-level: 0

      - name: Upload the release assets (publish.yml attaches them)
        if: inputs.upload_release_assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-linux
          path: ${{ steps.assets.outputs.dir }}/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
