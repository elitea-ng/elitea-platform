name: Desktop — package for device management

# The desktop app's MDM packages (ADR-0052 decisions 4, 6 and 8; W2b): a universal
# (Apple silicon + Intel) macOS app signed with the brand owner's Developer ID,
# notarised and stapled, in a signed `.pkg` that installs silently; and (once the
# host builds on Windows, #1828) an MSI for Intune and an MSIX for the Store.
#
# NOTHING IS ATTACHED TO A RELEASE (owner decision 10). ELITEA's desktop app reaches
# clients only through their device management. The packages stay WORKFLOW
# ARTIFACTS, and only on a run the brand owner starts by hand (workflow_dispatch)
# with `keep_artifacts`: a public repository's artifacts are downloadable, so the
# release check (publish.yml) never keeps them.
#
# SECRETS BY FIXED NAME (scripts/desktop-package.mjs `SECRETS`, the list W5
# publishes). All of a platform's secrets: sign and verify. None: an unsigned dry
# run with a notice, so forks and pull requests stay green. Some: a failure. A
# pull request is ALWAYS a dry run: its code must not run with the certificates.
#
# WHEN.
#   pull_request        the packaging files changed: the unsigned dry run.
#   workflow_call       publish.yml's release check, signed (`require_signed`).
#   workflow_dispatch   by hand: a signed package to hand to device management.
on:
  pull_request:
    paths:
      - ".github/workflows/desktop-package.yml"
      - "apps/elitea-desktop/scripts/desktop-package.mjs"
      - "apps/elitea-desktop/scripts/macos-pkg.sh"
      - "apps/elitea-desktop/scripts/windows-package.mjs"
      - "apps/elitea-desktop/scripts/stamp-version.mjs"
      - "apps/elitea-desktop/src-tauri/tauri.conf.json"
      - "apps/elitea-desktop/src-tauri/tauri.sidecar.conf.json"
  workflow_call:
    inputs:
      ref:
        description: The git ref to build (the release tag).
        type: string
        required: true
      version:
        description: The full release version to stamp (X.Y.Z or X.Y.Z-pre).
        type: string
        required: true
      require_signed:
        description: Fail unless every package is signed (the release check).
        type: boolean
        default: true
    secrets:
      APPLE_CERTIFICATE: { required: false }
      APPLE_CERTIFICATE_PASSWORD: { required: false }
      APPLE_SIGNING_IDENTITY: { required: false }
      APPLE_INSTALLER_SIGNING_IDENTITY: { required: false }
      APPLE_API_KEY: { required: false }
      APPLE_API_ISSUER: { required: false }
      APPLE_API_PRIVATE_KEY: { required: false }
      WINDOWS_PUBLISHER: { required: false }
      AZURE_CLIENT_ID: { required: false }
      AZURE_CLIENT_SECRET: { required: false }
      AZURE_TENANT_ID: { required: false }
      AZURE_SIGNING_ENDPOINT: { required: false }
      AZURE_SIGNING_ACCOUNT: { required: false }
      AZURE_SIGNING_PROFILE: { required: false }
      WINDOWS_CERTIFICATE: { required: false }
      WINDOWS_CERTIFICATE_PASSWORD: { required: false }
  workflow_dispatch:
    inputs:
      keep_artifacts:
        description: Keep the packages as workflow artifacts (7 days) for device management.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal (.app, .pkg)
    runs-on: macos-latest
    # A universal build compiles the host twice (arm64 and x86_64).
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Sign or dry run
        id: plan
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
          # A kept package goes to device management: it must be signed.
          REQUIRE_SIGNED: ${{ inputs.require_signed == true || inputs.keep_artifacts == true }}
        run: |
          flags=(--github-output)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          [ "$REQUIRE_SIGNED" = true ] && flags+=(--require-signed)
          node apps/elitea-desktop/scripts/desktop-package.mjs macos "${flags[@]}"

      - name: Stamp the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
        run: node apps/elitea-desktop/scripts/stamp-version.mjs "$VERSION" "$BUILD"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # The npm cache is .github/actions/npm-cache below.
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json

      # `tauri build` runs the web desktop build first (beforeBuildCommand).
      - name: Install web and desktop (locked)
        run: |
          npm ci --prefix apps/elitea-web
          npm ci --prefix apps/elitea-desktop

      - name: Assert the pinned toolchain, with both macOS targets
        working-directory: apps/elitea-desktop/src-tauri
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Restore only: ci-desktop.yml's nightly run writes the host cache.
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: apps/elitea-desktop/src-tauri

      # The document extractor (ADR-0029 decision 4) is the app's externalBin. A
      # universal app needs a universal sidecar named for the universal triple.
      - name: Build the document sidecar (universal)
        run: |
          set -euo pipefail
          cd apps/elitea-desktop/doc-extract-sidecar
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t"
          done
          mkdir -p ../src-tauri/binaries
          # tauri build compiles each architecture on its own, and each compile's
          # build script wants the sidecar for ITS triple; the bundle takes the
          # universal one.
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "target/$t/release/elitea-doc-extract-sidecar" "../src-tauri/binaries/elitea-doc-extract-sidecar-$t"
          done
          lipo -create -output ../src-tauri/binaries/elitea-doc-extract-sidecar-universal-apple-darwin \
            target/aarch64-apple-darwin/release/elitea-doc-extract-sidecar \
            target/x86_64-apple-darwin/release/elitea-doc-extract-sidecar

      - name: Prepare the notarisation key
        if: steps.plan.outputs.sign == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Signed: the Tauri CLI imports the certificate into a temporary keychain, signs
      # with the hardened runtime, notarises and staples. Unsigned: the same build with
      # no APPLE_* in its environment (Tauri then signs nothing).
      - name: Build the universal app (${{ steps.plan.outputs.sign == 'true' && 'signed, notarised' || 'unsigned' }})
        working-directory: apps/elitea-desktop
        env:
          APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail
          # Tauri reads an empty APPLE_SIGNING_IDENTITY as an identity: unset the empty ones.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "${!name}" ] || unset "$name"
          done
          node scripts/tauri-brand.mjs
          npx tauri build --target universal-apple-darwin --bundles app \
            --config src-tauri/tauri.brand.json --config src-tauri/tauri.sidecar.conf.json
          {
            echo "DESKTOP_APP=$(node -p 'require("./src-tauri/tauri.brand.json").productName').app"
            echo "DESKTOP_ID=$(node -p 'require("./src-tauri/tauri.brand.json").identifier')"
            echo "DESKTOP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          } >> "$GITHUB_ENV"

      - name: Both architectures are in the app
        working-directory: apps/elitea-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          set -euo pipefail
          bin="${DESKTOP_APP}/Contents/MacOS/elitea-desktop"
          # `lipo -archs` (not -verify_arch, whose argument rules differ between Xcode
          # releases): each binary holds exactly arm64 and x86_64.
          for f in "$bin" "${DESKTOP_APP}/Contents/MacOS/elitea-doc-extract-sidecar"; do
            archs="$(lipo -archs "$f" | tr ' ' '\n' | sort | xargs)"
            if [ "$archs" != "arm64 x86_64" ]; then
              echo "::error::$(basename "$f") holds \"$archs\", not arm64 and x86_64"; exit 1
            fi
            echo "$(basename "$f"): $archs"
          done

      # A component package that installs into /Applications with no UI: Jamf, Intune
      # for macOS, Kandji and `sudo installer -pkg … -target /` install it silently.
      - name: Build the installer package (${{ steps.plan.outputs.sign == 'true' && 'signed' || 'unsigned' }})
        working-directory: apps/elitea-desktop
        env:
          INSTALLER_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_INSTALLER_SIGNING_IDENTITY || '' }}
          APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          bash scripts/macos-pkg.sh \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/${DESKTOP_APP}" \
            "$DESKTOP_ID" "$DESKTOP_VERSION" "$RUNNER_TEMP/out"

      # Proven, not assumed: Gatekeeper accepts the app and the package, and both
      # carry a stapled ticket.
      - name: The app and the package are signed, notarised and stapled
        if: steps.plan.outputs.sign == 'true'
        run: |
          set -euo pipefail
          app="apps/elitea-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/${DESKTOP_APP}"
          pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vv --type execute "$app"
          xcrun stapler validate "$app"
          pkgutil --check-signature "$pkg"
          pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
          if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
            echo "::error::the package payload carries AppleDouble ._ files"; exit 1
          fi
          spctl -a -vv --type install "$pkg"
          xcrun stapler validate "$pkg"

      - name: The unsigned package is well formed
        if: steps.plan.outputs.sign != 'true'
        run: |
          set -euo pipefail
          pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
          # Listed once into a file: `pkgutil | grep -q` under pipefail fails on SIGPIPE.
          pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
          grep -qx "./Applications/${DESKTOP_APP}/Contents/MacOS/elitea-desktop" "$RUNNER_TEMP/payload.txt"
          # Extended attributes would install as AppleDouble `._` files next to the app.
          if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
            echo "::error::the package payload carries AppleDouble ._ files"; exit 1
          fi
          echo "::notice::unsigned dry run: $(basename "$pkg") built; signing and notarisation skipped"

      - name: Keep the package (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.keep_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-pkg
          path: ${{ runner.temp }}/out/*.pkg
          retention-days: 7
          if-no-files-found: error

      - name: Remove the notarisation key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # OFF UNTIL THE HOST BUILDS ON WINDOWS (#1828): local-tools and the host are Unix-only
  # today (process groups, PTYs, the sandbox), so `tauri build` fails on windows-latest.
  # #1828 sets the repository variable DESKTOP_WINDOWS_PACKAGE=true once it lands; the
  # inputs (signing overlay, MSIX manifest) are tested now in windows-package.test.mjs.
  #
  # An MSI (Tauri's WiX bundle: Intune, SCCM, `msiexec /i … /qn`) and an MSIX (makeappx:
  # the Store, Intune), the host, the sidecar, the MSI and the MSIX all signed with Azure
  # Artifact Signing or a code-signing certificate (PFX), timestamped, then verified.
  windows:
    name: Windows (.msi, .msix)
    if: vars.DESKTOP_WINDOWS_PACKAGE == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Sign or dry run
        id: plan
        env:
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
          # A kept package goes to device management: it must be signed.
          REQUIRE_SIGNED: ${{ inputs.require_signed == true || inputs.keep_artifacts == true }}
        run: |
          flags=(--github-output)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          [ "$REQUIRE_SIGNED" = true ] && flags+=(--require-signed)
          node apps/elitea-desktop/scripts/desktop-package.mjs windows "${flags[@]}"

      - name: Stamp the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node apps/elitea-desktop/scripts/stamp-version.mjs "$VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Restore the npm cache (pull requests read, main writes)
        uses: ./.github/actions/npm-cache
        with:
          cache-dependency-path: apps/elitea-web/package-lock.json
      - name: Install web and desktop (locked)
        run: |
          npm ci --prefix apps/elitea-web
          npm ci --prefix apps/elitea-desktop

      - name: Assert the pinned toolchain
        working-directory: apps/elitea-desktop/src-tauri
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          workspaces: apps/elitea-desktop/src-tauri

      - name: Build the document sidecar
        run: |
          set -euo pipefail
          cd apps/elitea-desktop/doc-extract-sidecar
          cargo build --release --locked --target x86_64-pc-windows-msvc
          mkdir -p ../src-tauri/binaries
          cp target/x86_64-pc-windows-msvc/release/elitea-doc-extract-sidecar.exe \
            ../src-tauri/binaries/elitea-doc-extract-sidecar-x86_64-pc-windows-msvc.exe

      # PFX: the certificate goes into CurrentUser\My and is used by thumbprint, so no
      # password reaches a file or a command line.
      - name: Import the code-signing certificate
        id: pfx
        if: steps.plan.outputs.signer == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          # A .pfx may carry its chain: the signing certificate is the one with the key.
          $certs = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          Remove-Item $pfx
          $leaf = @($certs | Where-Object { $_.HasPrivateKey })
          if ($leaf.Count -ne 1) { throw "WINDOWS_CERTIFICATE holds $($leaf.Count) certificates with a private key (want 1)" }
          "thumbprint=$($leaf[0].Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Install the Artifact Signing client
        if: steps.plan.outputs.signer == 'trusted'
        env:
          # Pinned: this job holds the Azure signing credentials. Bump deliberately.
          ARTIFACT_SIGNING_CLI_VERSION: "0.12.0"
        run: cargo install --locked artifact-signing-cli --version "=${ARTIFACT_SIGNING_CLI_VERSION}"

      - name: Build the MSI (${{ steps.plan.outputs.sign == 'true' && 'signed' || 'unsigned' }})
        working-directory: apps/elitea-desktop
        env:
          SIGNER: ${{ steps.plan.outputs.signer }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.pfx.outputs.thumbprint }}
          AZURE_CLIENT_ID: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_PROFILE || '' }}
        run: |
          set -euo pipefail
          node scripts/tauri-brand.mjs
          node scripts/windows-package.mjs overlay "$SIGNER"
          npx tauri build --bundles msi \
            --config src-tauri/tauri.brand.json --config src-tauri/tauri.sidecar.conf.json --config src-tauri/tauri.windows.json
          echo "DESKTOP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')" >> "$GITHUB_ENV"

      # The MSIX: the same signed host and sidecar, packed by makeappx with a manifest
      # whose Publisher is the certificate subject (WINDOWS_PUBLISHER).
      - name: Build the MSIX (${{ steps.plan.outputs.sign == 'true' && 'signed' || 'unsigned' }})
        working-directory: apps/elitea-desktop
        env:
          SIGNER: ${{ steps.plan.outputs.signer }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.pfx.outputs.thumbprint }}
          AZURE_CLIENT_ID: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ steps.plan.outputs.signer == 'trusted' && secrets.AZURE_SIGNING_PROFILE || '' }}
        run: |
          set -euo pipefail
          kits=("/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64); kit="${kits[-1]}"
          release=src-tauri/target/release
          layout="$RUNNER_TEMP/msix"
          mkdir -p "$layout/Assets" "$RUNNER_TEMP/out"
          cp "$release/elitea-desktop.exe" "$release/elitea-doc-extract-sidecar.exe" "$layout/"
          icon="$(node -p 'require("./src-tauri/tauri.brand.json").bundle.icon[1]')"
          for name in StoreLogo Square150x150Logo Square44x44Logo; do cp "src-tauri/$icon" "$layout/Assets/$name.png"; done
          node scripts/windows-package.mjs manifest "$layout" "$DESKTOP_VERSION"
          msix="$RUNNER_TEMP/out/elitea-desktop-${DESKTOP_VERSION}-x64.msix"
          "$kit/makeappx.exe" pack -d "$layout" -p "$msix" -o
          case "$SIGNER" in
            pfx) "$kit/signtool.exe" sign -sha1 "$WINDOWS_CERT_THUMBPRINT" -fd sha256 -tr http://timestamp.acs.microsoft.com -td sha256 "$msix" ;;
            trusted) artifact-signing-cli -e "$AZURE_SIGNING_ENDPOINT" -a "$AZURE_SIGNING_ACCOUNT" -c "$AZURE_SIGNING_PROFILE" "$msix" ;;
            *) echo "::notice::unsigned dry run: $(basename "$msix") built; signing skipped" ;;
          esac
          cp src-tauri/target/release/bundle/msi/*.msi "$RUNNER_TEMP/out/"

      - name: The host, the MSI and the MSIX are signed and timestamped
        if: steps.plan.outputs.sign == 'true'
        run: |
          set -euo pipefail
          kits=("/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64); kit="${kits[-1]}"
          for f in apps/elitea-desktop/src-tauri/target/release/elitea-desktop.exe "$RUNNER_TEMP"/out/*.msi "$RUNNER_TEMP"/out/*.msix; do
            "$kit/signtool.exe" verify -pa -v "$f"
          done

      - name: Keep the packages (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.keep_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            ${{ runner.temp }}/out/*.msi
            ${{ runner.temp }}/out/*.msix
          retention-days: 7
          if-no-files-found: error

      - name: Remove the code-signing certificate
        if: always() && steps.pfx.outputs.thumbprint != ''
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.pfx.outputs.thumbprint }}
        run: Remove-Item -Path "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey
