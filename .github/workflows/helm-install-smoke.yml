name: CI — Helm install smoke

# The chart INSTALLED, not only rendered.
#
# helm-lint.yml lints the charts and pipes `helm template` through
# kubeconform, which catches a malformed manifest and nothing that happens
# after `kubectl apply`: a hook Job that runs before the ServiceAccount it
# names exists, a Deployment that crash-loops on a bucket nobody created, a
# registrar that never arms because a public project is not configured. Every
# one of those was found by hand on deploy/kind (see its README, "What `up`
# does") and none of them is visible to a render.
#
# This job installs THIS repository's chart into a kind cluster on the runner
# through deploy/kind/kind-stack.sh — the same script an engineer runs
# locally, driven with docker instead of podman — on the chart's SHIPPED
# DEFAULTS (S10): the runtime plane, elitea-vector with the bundled Qdrant
# subchart over TLS, DeepWiki and Inventory, every runtime-CA certificate
# issued by cert-manager. Its `verify` asserts every pod Ready (Qdrant,
# elitea-vector and Inventory included), the DeepWiki provider pod's two
# containers with the runners the chart sets, the facade's provider
# registration row healthy over the mTLS hop, and a fixture generation
# completing through the facade, and (S11) the bundled KEDA: keda.enabled
# installs KEDA in the same release, DeepWiki and Inventory autoscale on
# their invocation stores through KEDA's postgresql trigger, and each
# ScaledObject — created by a post-install hook on this FIRST install, since
# the CRDs arrive with it — must turn Ready=True. Last, `helm uninstall` must
# return and leave no ScaledObject and no KEDA CRD in Terminating (the
# pre-delete hook, templates/keda-cleanup.yaml). The worker, the LLM gateway, the web UI and
# the scheduler stay off for weight, as they do in that stack: this proves
# the chart, not the product.
#
# Runs on changes to the chart, the kind stack and the composition code the
# chart's values reach into; weekly otherwise, so a drift in a third-party
# image or cert-manager is seen within a week rather than on the next chart
# edit.

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
    inputs:
      web-images:
        description: ci-build-once.yml's `web-images` output (the job result); empty when nothing was built for this run.
        type: string
        default: ""
      stack-images:
        description: ci-build-once.yml's `stack-images` output.
        type: string
        default: ""
  schedule:
    # Sunday 05:23 UTC, after the Saturday Dependabot slot and its merges.
    - cron: "23 5 * * 0"
  workflow_dispatch:

concurrency:
  group: helm-install-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install:
    name: Chart installs into kind and verifies
    runs-on: ubuntu-latest
    # A cold run is a kind cluster, cert-manager, five image builds warmed by
    # the shared layer cache, the side-loads, the chart's hook Jobs and one
    # fixture generation. Measured on the first green run (2026-09-03):
    # the whole job in under 15 min with three images warm from the shared
    # cache. S10 added the Inventory engine and elitea-vector (two more Rust
    # builds, both cached by ci-web-e2e.yml) and Qdrant. Warm, the whole job
    # takes 22-30 min. Fully COLD (a change that touches every Go module and a
    # shared Rust crate, #1406) the image bake alone took 47 min, and a PR
    # writes no cache, so a rerun is just as cold: 50 min cancelled it in the
    # side-load step. 80 leaves room for that case and still ends a hang.
    timeout-minutes: 80
    # The images: on a pull request ci.yml runs ci-build-once.yml first, and
    # this job PULLS the five by digest and tags them for kind-stack.sh. It
    # bakes them itself only when nothing was built for it (a fork's or
    # Dependabot's pull request, the weekly schedule, a dispatch). The pull
    # asserts that what Build once built is what this bake would build: the
    # bake spec (`docker buildx bake --print`, the same targets and `set`)
    # goes through scripts/ci/stack-images.mjs `resolve`, which refuses an
    # image built from another context, Containerfile, target or build args.
    #
    # The cache policy of that bake: READ ONLY, on every event. Each image reads the
    # registry layer cache ci-web-e2e.yml's build-once jobs write for the
    # same Containerfile and stage (ghcr.io/elitea-ng/ci-cache-<image>:
    # linux-amd64, public, written by a run on main only), and an empty
    # `<target>.cache-to=` clears any export. That ref has ONE writer: a
    # second writer of a mode=max cache replaces the first's manifest, so the
    # smoke writing it too would cost the E2E stacks their layers on every
    # weekly run. (Until 2026-10-20 this wrote `type=gha,mode=max` from main,
    # into the 10 GB Actions cache that kept evicting it.)
    env:
      # success on both: pull. Empty (no caller passed them) or skipped: bake.
      BUILT: ${{ inputs.web-images == 'success' && inputs.stack-images == 'success' }}
    steps:
      # Anything but success, skipped or empty is a build that failed for this
      # commit; baking here instead would hide it.
      - name: The build-once images for this commit did not fail
        env:
          WEB: ${{ inputs.web-images }}
          STACK: ${{ inputs.stack-images }}
        run: |
          for result in "$WEB" "$STACK"; do
            case "$result" in
              "" | success | skipped) ;;
              *) echo "::error::ci-build-once.yml did not build this commit's images (web-images: ${WEB}, stack-images: ${STACK})"; exit 1 ;;
            esac
          done

      - uses: actions/checkout@v7

      # Build once pushed them: the same digest-map download the lanes do
      # (.github/actions/pull-stack-images), with its one retry.
      - name: Download the digest maps for this commit
        if: env.BUILT == 'true'
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: stack-image-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/stack-image-digests
      - name: Download the digest maps for this commit (retry)
        if: env.BUILT == 'true' && steps.digests.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          pattern: stack-image-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/stack-image-digests

      - name: Pull the five images by digest and tag them for kind-stack.sh
        if: env.BUILT == 'true'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # The spec the bake step below would build (the same targets and the
          # same `elitea-main.target=e2e`), as a compose-shaped config whose
          # images carry kind-stack.sh's names (KIND_IMAGE_TAG default `kind`).
          docker buildx bake -f docker-bake.hcl --print --set elitea-main.target=e2e \
            elitea-main elitea-subapp-host elitea-deepwiki-engine-native elitea-inventory-engine elitea-vector \
            > "${RUNNER_TEMP}/helm-bake.json"
          # shellcheck disable=SC2016 # the ${...} below are JavaScript template literals
          node -e '
            const fs = require("fs");
            const [file, workspace] = process.argv.slice(1);
            const services = {};
            for (const [name, t] of Object.entries(JSON.parse(fs.readFileSync(file, "utf8")).target)) {
              const image = t.tags[0].split("/").pop().split(":")[0];
              services[name] = {
                image: `ghcr.io/elitea-ng/${image}:kind`,
                build: { context: t.context.startsWith("/") ? t.context : `${workspace}/${t.context}`, dockerfile: t.dockerfile, target: t.target, args: t.args ?? {} },
              };
            }
            if (Object.keys(services).length !== 5) throw new Error(`bake printed ${Object.keys(services).length} targets, expected 5`);
            process.stdout.write(JSON.stringify({ services }));
          ' "${RUNNER_TEMP}/helm-bake.json" "$GITHUB_WORKSPACE" > "${RUNNER_TEMP}/helm-config.json"
          # Fails, naming the image, when Build once built it from another spec.
          node scripts/ci/stack-images.mjs resolve \
            "${RUNNER_TEMP}/helm-config.json" "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/stack-image-digests" \
            > "${RUNNER_TEMP}/helm-pulls.tsv"
          [ "$(wc -l < "${RUNNER_TEMP}/helm-pulls.tsv")" -eq 5 ] || { echo "::error::expected 5 images, resolved $(wc -l < "${RUNNER_TEMP}/helm-pulls.tsv")"; exit 1; }
          while IFS=$'\t' read -r local remote; do
            for attempt in 1 2 3 4; do
              if docker pull -q "$remote"; then break; fi
              [ "$attempt" -lt 4 ] || { echo "::error::could not pull $remote"; exit 1; }
              echo "pull of $remote failed (attempt $attempt), retrying"
              sleep $((attempt * 10))
            done
            docker tag "$remote" "$local"
            digests="$(docker image inspect --format '{{join .RepoDigests " "}}' "$local")"
            [[ " $digests " == *"@${remote##*@} "* ]] || { echo "::error::$local is not $remote (has: $digests)"; exit 1; }
            echo "  ✓ $local = $remote"
          done < "${RUNNER_TEMP}/helm-pulls.tsv"

      # No disk-clearing step: the five images (the engines and elitea-vector
      # are distroless Rust binaries), the pinned third-party images and a
      # kind node are ~4 GB against the runner's ~21 GB free. The first version
      # purged $AGENT_TOOLSDIRECTORY — the whole /opt/hostedtoolcache on
      # GitHub's runners — and helm/kind-action, which installs INTO it, died.

      - uses: docker/setup-buildx-action@v4
        if: env.BUILT != 'true'
        id: buildx
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build the five images the chart installs (shared layer cache)
        # Only when nothing was built for this run (the job's `BUILT`).
        if: env.BUILT != 'true'
        # Under the tags kind-stack.sh looks for (KIND_IMAGE_TAG default
        # `kind`), so its own build step finds them present and skips; the
        # tags and the `e2e` target restate deploy/kind/kind-stack.sh's
        # defaults and must move with them. The layer cache the E2E stacks
        # write (read only here; the policy is on the job above). The native
        # engine compiles ~420 crates cold, so that cache is what keeps a
        # pull request's run warm.
        uses: docker/bake-action@v7
        with:
          source: .
          builder: ${{ steps.buildx.outputs.name }}
          files: docker-bake.hcl
          targets: |
            elitea-main
            elitea-subapp-host
            elitea-deepwiki-engine-native
            elitea-inventory-engine
            elitea-vector
          load: true
          provenance: false
          set: |
            *.platform=linux/amd64
            elitea-main.target=e2e
            elitea-main.tags=ghcr.io/elitea-ng/elitea-main:kind
            elitea-main.cache-from=type=registry,ref=ghcr.io/elitea-ng/ci-cache-elitea-main:linux-amd64
            elitea-main.cache-to=
            elitea-subapp-host.tags=ghcr.io/elitea-ng/elitea-subapp-host:kind
            elitea-subapp-host.cache-from=type=registry,ref=ghcr.io/elitea-ng/ci-cache-elitea-subapp-host:linux-amd64
            elitea-subapp-host.cache-to=
            elitea-deepwiki-engine-native.tags=ghcr.io/elitea-ng/elitea-deepwiki-engine-native:kind
            elitea-deepwiki-engine-native.cache-from=type=registry,ref=ghcr.io/elitea-ng/ci-cache-elitea-deepwiki-engine-native:linux-amd64
            elitea-deepwiki-engine-native.cache-to=
            elitea-inventory-engine.tags=ghcr.io/elitea-ng/elitea-inventory-engine:kind
            elitea-inventory-engine.cache-from=type=registry,ref=ghcr.io/elitea-ng/ci-cache-elitea-inventory-engine:linux-amd64
            elitea-inventory-engine.cache-to=
            elitea-vector.tags=ghcr.io/elitea-ng/elitea-vector:kind
            elitea-vector.cache-from=type=registry,ref=ghcr.io/elitea-ng/ci-cache-elitea-vector:linux-amd64
            elitea-vector.cache-to=

      - name: Pin Helm to the version helm-lint renders with
        # Same pin as helm-lint.yml, so the chart is INSTALLED by the Helm
        # that RENDERED it; the runner image's bundled helm is whatever it is.
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: The runtime-material minting needs python3 'cryptography'
        # deploy/scripts/gen-runtime-certs.sh mints Ed25519 keys with it and
        # exits with a pip hint when it is missing — after the cluster and
        # the images, which is the wrong moment to learn it. Probed, not
        # assumed: the runner image ships it today.
        # `--break-system-packages`: the runner's interpreter is PEP 668
        # externally-managed, and a bare pip would refuse on the one day the
        # fallback is needed.
        run: python3 -c "import cryptography" 2>/dev/null || python3 -m pip install --quiet --break-system-packages cryptography

      - name: Create the kind cluster
        # The cluster name is the script's default, so its `ensure_cluster`
        # finds it and does not create a second one.
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: elitea-kind
          wait: 180s

      - name: Install the chart (kind-stack.sh up)
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh up

      - name: Verify the installed stack (kind-stack.sh verify)
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh verify

      - name: Describe what is not Ready
        if: failure()
        env:
          KIND_ENGINE: docker
        run: |
          kubectl --context kind-elitea-kind -n elitea get pods -o wide || true
          kubectl --context kind-elitea-kind -n elitea get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl --context kind-elitea-kind -n elitea get scaledobjects,triggerauthentications,hpa -o wide || true
          for pod in $(kubectl --context kind-elitea-kind -n elitea get pods -o name 2>/dev/null); do
            echo "== $pod"; kubectl --context kind-elitea-kind -n elitea logs --all-containers --tail=80 "$pod" 2>&1 || true
          done

      - name: Delete the cluster
        if: always()
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh down || true
