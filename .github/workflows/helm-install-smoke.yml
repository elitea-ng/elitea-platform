name: CI — Helm install smoke

# The chart INSTALLED, not only rendered.
#
# helm-lint.yml lints the charts and pipes `helm template` through
# kubeconform, which catches a malformed manifest and nothing that happens
# after `kubectl apply`: a hook Job that runs before the ServiceAccount it
# names exists, a Deployment that crash-loops on a bucket nobody created, a
# registrar that never arms because a public project is not configured. Every
# one of those was found by hand on deploy/kind (see its README, "What `up`
# does") and none of them is visible to a render.
#
# This job installs THIS repository's chart into a kind cluster on the runner
# through deploy/kind/kind-stack.sh — the same script an engineer runs
# locally, driven with docker instead of podman — and runs its `verify`: every
# pod Ready, the provider pod's two containers with the runners the chart
# sets, the facade's provider registration row healthy over the mTLS hop, and
# a fixture generation completing through the facade. The runtime plane, the
# workers and the LLM gateway stay off, as they do in that stack: this proves
# the chart, not the product.
#
# Runs on changes to the chart, the kind stack and the composition code the
# chart's values reach into; weekly otherwise, so a drift in a third-party
# image or cert-manager is seen within a week rather than on the next chart
# edit.

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      # Render scripts and prose are helm-lint's business, not an install's.
      - "!deploy/helm/tests/**"
      - "!deploy/helm/**/*.md"
      - "deploy/kind/**"
      - "deploy/scripts/gen-runtime-certs.sh"
      - "services/elitea-main/internal/runtimecomposition/**"
      # The two images this job builds and whose containers `verify` asserts.
      - "services/elitea-subapp-host/**"
      - "services/elitea-deepwiki-engine/**"
      - "libs/rust/**"
      # The bake step reads its targets and contexts from here.
      - "docker-bake.hcl"
      - ".github/workflows/helm-install-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"
      - "!deploy/helm/tests/**"
      - "!deploy/helm/**/*.md"
      - "deploy/kind/**"
      - "deploy/scripts/gen-runtime-certs.sh"
      - "services/elitea-main/internal/runtimecomposition/**"
      # The two images this job builds and whose containers `verify` asserts.
      - "services/elitea-subapp-host/**"
      - "services/elitea-deepwiki-engine/**"
      - "libs/rust/**"
      - "docker-bake.hcl"
      - ".github/workflows/helm-install-smoke.yml"
  schedule:
    # Sunday 05:23 UTC, after the Saturday Dependabot slot and its merges.
    - cron: "23 5 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Chart installs into kind and verifies
    runs-on: ubuntu-latest
    # A cold run is a kind cluster, cert-manager, three image builds warmed by
    # the shared layer cache, six side-loads, the chart's hook Jobs and one
    # fixture generation. Measured on the first green run (2026-09-03):
    # the whole job in under 15 min with the three images warm from the
    # shared cache, seven side-loads (three built, four third-party).
    timeout-minutes: 40
    env:
      # The cache-write policy, stated once: a push to main exports every
      # layer, everything else (pull requests, the weekly schedule — which
      # also carries the main ref — and a dispatch) exports final layers only.
      # Same rule as .github/actions/build-stack-images' `cache-write` input.
      LAYER_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'max' || 'min' }}
    steps:
      - uses: actions/checkout@v7

      # No disk-clearing step: the three images (the engine sidecar is one
      # distroless Rust binary), four pinned third-party images and a
      # kind node are ~3 GB against the runner's ~21 GB free. The first version
      # purged $AGENT_TOOLSDIRECTORY — the whole /opt/hostedtoolcache on
      # GitHub's runners — and helm/kind-action, which installs INTO it, died.

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          # The builder image from the org's own mirror (mirror-buildkit.yml), by
          # digest: no anonymous Docker Hub pull per job.
          driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build the three images the chart installs (shared layer cache)
        # Under the tags kind-stack.sh looks for (KIND_IMAGE_TAG default
        # `kind`), so its own build step finds them present and skips; the
        # tags and the `e2e` target restate deploy/kind/kind-stack.sh's
        # defaults and must move with them. The same scopes the E2E stacks,
        # the image scan and the release share; the write mode is LAYER_MODE
        # above. The native engine compiles ~420 crates cold, so its own
        # scope is what keeps a pull request's run warm.
        uses: docker/bake-action@v7
        with:
          source: .
          builder: ${{ steps.buildx.outputs.name }}
          files: docker-bake.hcl
          targets: |
            elitea-main
            elitea-subapp-host
            elitea-deepwiki-engine-native
          load: true
          provenance: false
          set: |
            *.platform=linux/amd64
            elitea-main.target=e2e
            elitea-main.tags=ghcr.io/elitea-ng/elitea-main:kind
            elitea-main.cache-from=type=gha,scope=elitea-main-linux-amd64
            elitea-main.cache-to=type=gha,mode=${{ env.LAYER_MODE }},scope=elitea-main-linux-amd64
            elitea-subapp-host.tags=ghcr.io/elitea-ng/elitea-subapp-host:kind
            elitea-subapp-host.cache-from=type=gha,scope=elitea-subapp-host-linux-amd64
            elitea-subapp-host.cache-to=type=gha,mode=${{ env.LAYER_MODE }},scope=elitea-subapp-host-linux-amd64
            elitea-deepwiki-engine-native.tags=ghcr.io/elitea-ng/elitea-deepwiki-engine-native:kind
            elitea-deepwiki-engine-native.cache-from=type=gha,scope=elitea-deepwiki-engine-native-linux-amd64
            elitea-deepwiki-engine-native.cache-to=type=gha,mode=${{ env.LAYER_MODE }},scope=elitea-deepwiki-engine-native-linux-amd64

      - name: Pin Helm to the version helm-lint renders with
        # Same pin as helm-lint.yml, so the chart is INSTALLED by the Helm
        # that RENDERED it; the runner image's bundled helm is whatever it is.
        uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: The runtime-material minting needs python3 'cryptography'
        # deploy/scripts/gen-runtime-certs.sh mints Ed25519 keys with it and
        # exits with a pip hint when it is missing — after the cluster and
        # the images, which is the wrong moment to learn it. Probed, not
        # assumed: the runner image ships it today.
        # `--break-system-packages`: the runner's interpreter is PEP 668
        # externally-managed, and a bare pip would refuse on the one day the
        # fallback is needed.
        run: python3 -c "import cryptography" 2>/dev/null || python3 -m pip install --quiet --break-system-packages cryptography

      - name: Create the kind cluster
        # The cluster name is the script's default, so its `ensure_cluster`
        # finds it and does not create a second one.
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: elitea-kind
          wait: 180s

      - name: Install the chart (kind-stack.sh up)
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh up

      - name: Verify the installed stack (kind-stack.sh verify)
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh verify

      - name: Describe what is not Ready
        if: failure()
        env:
          KIND_ENGINE: docker
        run: |
          kubectl --context kind-elitea-kind -n elitea get pods -o wide || true
          kubectl --context kind-elitea-kind -n elitea get events --sort-by=.lastTimestamp | tail -60 || true
          for pod in $(kubectl --context kind-elitea-kind -n elitea get pods -o name 2>/dev/null); do
            echo "== $pod"; kubectl --context kind-elitea-kind -n elitea logs --all-containers --tail=80 "$pod" 2>&1 || true
          done

      - name: Delete the cluster
        if: always()
        env:
          KIND_ENGINE: docker
        run: bash deploy/kind/kind-stack.sh down || true
