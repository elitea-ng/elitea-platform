name: CI — elitea-doc-extractor

# ADR-0030 I1: the Rust indexing worker's document extraction sidecar.
#
# One job, on purpose: the repository's Actions plan runs 20 jobs at a time,
# and every check here needs the same compiled dependency graph (xberg and
# its PDF backend are most of it).
#
#   * fmt, Clippy (all + pedantic, deny), rustdoc with warnings denied;
#   * the crate's tests: the service over a REAL Unix socket with generated
#     PDF/DOCX/XLSX/PPTX fixtures, every skip reason, the protocol refusals;
#   * the reason this crate exists, held as a gate: its lock resolves
#     `smallvec >= 1.16` (the PDF backend's floor), which the worker's lock
#     cannot (kube-client caps it `< 1.16`). A future dependency that drags
#     kube or serde-saphyr into this crate would fail here, not in a
#     mysterious resolver error later;
#   * the release binary.

on:
  pull_request:
    paths:
      # The pin every cargo step asserts (scripts/ci/assert-rust-toolchain.sh).
      - "rust-toolchain.toml"
      - "scripts/ci/assert-rust-toolchain.sh"
      - "services/elitea-doc-extractor/**"
      - "libs/proto/elitea/extract/**"
      # The crates it links, and the workspace they inherit package fields
      # and lints from.
      - "libs/rust/doc-extract/**"
      - "libs/rust/content-source/**"
      - "libs/rust/engine-sidecar/**"
      - "libs/rust/Cargo.toml"
      # Read by the Containerfile's runtime verification; a change there is a
      # change to what this crate ships.
      - "libs/rust/scripts/**"
      # The smallvec gate below reads the WORKER's lock: a bump there must
      # re-run it.
      - "services/elitea-worker-rust/Cargo.lock"
      - ".github/workflows/ci-doc-extractor.yml"
  push:
    branches:
      - main
    paths:
      # The pin every cargo step asserts (scripts/ci/assert-rust-toolchain.sh).
      - "rust-toolchain.toml"
      - "scripts/ci/assert-rust-toolchain.sh"
      - "services/elitea-doc-extractor/**"
      - "libs/proto/elitea/extract/**"
      - "libs/rust/doc-extract/**"
      - "libs/rust/content-source/**"
      - "libs/rust/engine-sidecar/**"
      - "libs/rust/Cargo.toml"
      - "libs/rust/scripts/**"
      - "services/elitea-worker-rust/Cargo.lock"
      - ".github/workflows/ci-doc-extractor.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  extractor:
    name: elitea-doc-extractor — lint, test, the smallvec floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/elitea-doc-extractor
    steps:
      - uses: actions/checkout@v7

      - name: Assert the pinned toolchain
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-rust-toolchain.sh"

      # Read everywhere, write on main only: a pull request's target
      # directory duplicated per branch would crowd the 10 GB Actions cache.
      - name: Cache cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Registry and git only. Measured 2026-10-20: the target directory
          # made this entry 1.31 GB and saved ~2 minutes on a cached run
          # (~11 -> ~9 min), the worst minutes-per-GB of any Rust job;
          # in a 10 GB cache it evicted entries worth far more.
          cache-targets: false
          workspaces: services/elitea-doc-extractor

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Run the tests
        run: cargo test --locked --all-targets --all-features

      # The PDF backend's floor, and the worker's ceiling, in one gate. The
      # second half reads the WORKER's lock so the two statements that justify
      # this crate are both measured: if the worker's lock ever holds smallvec
      # 1.16, the sidecar's reason for being a separate process is gone and
      # someone should read this file.
      - name: The lock holds the smallvec floor the worker's cannot
        run: |
          set -euo pipefail
          here="$(cargo tree --locked -i smallvec --depth 0 --prefix none | head -1)"
          echo "elitea-doc-extractor: ${here}"
          case "${here}" in
            "smallvec v1."[0-9]"."*|"smallvec v1.1"[0-5]"."*)
              echo "::error::the extractor's lock resolves ${here}, under the PDF backend's floor (>= 1.16)"; exit 1 ;;
            "smallvec v1."*|"smallvec v2."*) ;;
            *) echo "::error::cargo tree printed '${here}', not a smallvec line — this gate measured nothing"; exit 1 ;;
          esac
          if grep -q 'name = "kube' Cargo.lock; then
            echo "::error::the extractor's lock names a kube crate; that is the constraint this crate exists to escape"; exit 1
          fi
          worker="$(grep -A1 '^name = "smallvec"$' ../elitea-worker-rust/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          echo "elitea-worker-rust: smallvec v${worker}"
          case "${worker}" in
            1.1[0-5].*|1.[0-9].*) ;;
            "") echo "::error::read no smallvec version out of the worker's lock — this gate measured nothing"; exit 1 ;;
            *) echo "::warning::the worker's lock resolves smallvec v${worker} (>= 1.16): the sidecar's reason for a separate lock may be gone; see services/elitea-doc-extractor/README.md" ;;
          esac

      - name: Build the release binary
        run: cargo build --locked --release

      - name: The binary answers --version and refuses an unknown command
        run: |
          set -euo pipefail
          bin=target/release/elitea-doc-extractor
          "$bin" --version | grep -q '^elitea-doc-extractor '
          if "$bin" bogus 2>/dev/null; then
            echo "::error::an unknown command exited 0"; exit 1
          fi
