name: CI — Go

on:
  pull_request:
    paths:
      - "services/elitea-main/**"
      - "services/elitea-scheduler/**"
      - "services/elitea-subapp-host/**"
      - "services/elitea-egress-proxy/**"
      - "libs/go/**"
      - "libs/proto/**"
      # The native client conformance module (ADR-0025 WP7) is in go.work, so
      # its helpers' unit tests, vet and lint run here; the suite itself is
      # behind the `conformance` tag and runs in ci-web-e2e.yml.
      - "conformance/nativeclient/**"
      # The governed-profile conformance module and its provider doubles
      # (ADR-0039 P6b) are in go.work too: their unit tests, vet and lint run
      # here; the stack suite runs in ci-governed-conformance.yml.
      - "conformance/governed/**"
      - "deploy/governed-mocks/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
      # S17: the env-drift job below checks elitea-main's Go env reads
      # against this chart, so a chart-only change (no Go diff at all) must
      # still trigger it — the whole point is catching drift introduced from
      # either side.
      - "deploy/helm/elitea-main/**"
      - "deploy/helm/elitea/**"
      - "services/elitea-llm-gateway/scripts/env-drift-check.sh"
      # The secured NATS permission tests (#1076) run elitea-main's and the
      # scheduler's real NATS paths against the nats.conf the elitea chart's
      # bundled NATS renders, after the real bootstrap.sh. A change to the permission
      # table, the bootstrap or the render script must run them.
      # The bundled NATS server's permission table and the bootstrap script.
      - "deploy/helm/elitea/values.yaml"
      - "deploy/helm/elitea/values-nats-ha.yaml"
      - "deploy/helm/elitea/templates/nats/**"
      - "deploy/helm/elitea/Chart.lock"
      - "deploy/helm/elitea/build-deps.sh"
      - "deploy/helm/elitea/files/nats-bootstrap.sh"
      - "scripts/nats/**"
      # internal/transport/commandbus pins its constants to the command bus
      # contract document.
      - "docs/runtime-command-bus.md"
      # The vet and test steps below run scripts/go/workspace-run.sh. A change
      # to that script, or to the Taskfile that calls it, must run this
      # workflow. A gate that does not trigger on the file it guards is the
      # same false green in another costume (#409).
      - "scripts/go/**"
      # The Test plan job splits the Go tests into shards with this script
      # (scripts/go/test-shards.json is under scripts/go/** above).
      - "scripts/ci/go-test-shards.mjs"
      - "scripts/ci/go-test-shards.test.mjs"
      - "scripts/contract/check_compiled_snapshots_postgres.sh"
      - "scripts/contract/generate_proto.sh"
      - "scripts/coverage/**"
      - "Taskfile.yml"
  # No push arm: a merge starts no run (scripts/ci/check-no-push-triggers.mjs).
  # The nightly run on main is the one that WRITES the caches pull requests
  # read (scripts/ci/check-workflow-cache-writes.mjs); staggered with the
  # other cache writers, ahead of publish.yml's 02:07 nightly pre-release.
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  proto:
    name: Protobuf contracts (lint, breaking, generated drift)
    runs-on: ubuntu-latest
    # #1359 D3: libs/proto is the one protobuf tree (the legacy proto/ +
    # gen/ were deleted), and every internal hop is gRPC, so a contract edit
    # is a wire change. Three gates, run only when the contracts, their
    # generator or this workflow changed:
    #   - buf lint (libs/proto/buf.yaml);
    #   - buf breaking against the base commit (FILE rules) — a rolling
    #     deploy runs old and new peers side by side;
    #   - the checked-in Go and Python stubs equal a fresh
    #     scripts/contract/generate_proto.sh run with the pinned toolchain
    #     (libs/proto/toolchain.lock; the script refuses any other version).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did the contracts change?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, a force push) runs every gate.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; running the contract gates."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            BASE="$(git rev-parse HEAD~1)"
          elif git diff --quiet "$BASE" HEAD -- libs/proto scripts/contract/generate_proto.sh .github/workflows/ci-go.yml; then
            echo "Contracts unchanged since ${BASE}; the gates have nothing to check."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          cache: false
          go-version-file: go.work
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: "3.12"
      # Dependabot bumps grpcio, grpcio-tools and protobuf in pyproject.toml
      # only. The generator and this job install from toolchain.lock, so a
      # bump that skips the lock would pass here with stubs from the old
      # version. Both files must name the same versions.
      - name: pyproject.toml pins match toolchain.lock
        if: steps.changes.outputs.changed == 'true'
        run: |
          lock=libs/proto/toolchain.lock
          status=0
          for pin in grpcio grpcio-tools protobuf; do
            key="$pin"
            [ "$pin" = protobuf ] && key=protobuf-python
            want="$(jq -r --arg key "$key" '.[$key]' "$lock")"
            got="$(grep -oE "\"${pin}==[^\"]+\"" libs/proto/pyproject.toml | sed -E 's/.*==([^"]+)"/\1/')"
            if [ "$got" != "$want" ]; then
              echo "::error file=libs/proto/pyproject.toml::${pin} is ${got:-unpinned} in pyproject.toml but ${want} in toolchain.lock. Set toolchain.lock (and grpcio-tools-protoc to the protoc that grpcio-tools bundles) to the new version, then run scripts/contract/generate_proto.sh and commit the stubs."
              status=1
            fi
          done
          exit "$status"
      - name: Install the pinned protobuf toolchain
        if: steps.changes.outputs.changed == 'true'
        run: |
          lock=libs/proto/toolchain.lock
          tools="$RUNNER_TEMP/proto-tools"
          GOBIN="$tools" GOWORK=off go install "github.com/bufbuild/buf/cmd/buf@v$(jq -r '.buf' "$lock")"
          GOBIN="$tools" GOWORK=off go install "google.golang.org/protobuf/cmd/protoc-gen-go@v$(jq -r '."protoc-gen-go"' "$lock")"
          GOBIN="$tools" GOWORK=off go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v$(jq -r '."protoc-gen-go-grpc"' "$lock")"
          python -m pip install --quiet --target "$RUNNER_TEMP/proto-tools-py" \
            "grpcio-tools==$(jq -r '."grpcio-tools"' "$lock")" \
            "protobuf==$(jq -r '."protobuf-python"' "$lock")"
          {
            echo "ELITEA_PROTO_GO_TOOLS=$tools"
            echo "ELITEA_PROTO_PYTHON_TOOLS=$RUNNER_TEMP/proto-tools-py"
            echo "ELITEA_PROTO_PYTHON=$(command -v python)"
            echo "BUF_CACHE_DIR=$RUNNER_TEMP/buf-cache"
          } >> "$GITHUB_ENV"
      - name: buf lint and format
        if: steps.changes.outputs.changed == 'true'
        run: |
          "$ELITEA_PROTO_GO_TOOLS/buf" lint libs/proto
          "$ELITEA_PROTO_GO_TOOLS/buf" format --diff --exit-code libs/proto
      - name: buf breaking against the base commit
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: '"$ELITEA_PROTO_GO_TOOLS/buf" breaking libs/proto --against ".git#ref=${BASE},subdir=libs/proto"'
      - name: Generated stubs match the contracts
        if: steps.changes.outputs.changed == 'true'
        run: |
          scripts/contract/generate_proto.sh
          git diff --exit-code -- libs/proto
          untracked="$(git status --porcelain --untracked-files=all -- libs/proto)"
          if [ -n "$untracked" ]; then
            echo "generate_proto.sh produced files that are not checked in:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  sqlc:
    name: Reproduce SQLC queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: Generate and vet type-safe SQL
        working-directory: services/elitea-main
        run: |
          sqlc generate
          sqlc vet
          git diff --exit-code -- internal/db/sqlcgen

  env-drift:
    name: Env-drift gate — elitea-main code env reads vs Helm chart
    runs-on: ubuntu-latest
    # S17: ci-gateway.yml already runs this same script (no-args form, both
    # services) but only triggers on services/elitea-llm-gateway/** paths —
    # an elitea-main-only or chart-only change never touches that workflow at
    # all, so elitea-main's own coverage was previously never exercised in
    # practice despite the script's own header claiming otherwise. Runs the
    # single-target form here instead of duplicating the gateway's own check.
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          command -v yq >/dev/null || { sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
      - name: Check elitea-main env vars are settable by its Helm chart
        run: |
          # elitea-main is a component of the one platform chart now, so its
          # env and secrets maps live under the `main` key rather than at the
          # values root.
          CHART_VALUES_PREFIX=main \
          services/elitea-llm-gateway/scripts/env-drift-check.sh \
            elitea-main deploy/helm/elitea deploy/helm/elitea/env-drift-allowlist.txt \
            services/elitea-main/internal services/elitea-main/cmd

  lint:
    name: Lint (workspace)
    runs-on: ubuntu-latest
    # Issue #427. This job used to carry a hand-written matrix of two modules,
    # `services/elitea-main` and `services/elitea-scheduler`, while go.work
    # named many more (twelve today). The libs/go modules, libs/proto/gen/go
    # and the other services were never linted, and this workflow triggers on
    # `libs/go/**` — so it ran on their changes and looked at none of them.
    #
    # A hand-written matrix cannot report what it left out. The module list is
    # read from go.work at run time instead, by the same script the vet and
    # test steps use, and that script prints the Go modules on disk that the
    # run did NOT cover (services/elitea-llm-gateway, which ci-gateway.yml
    # lints on its own Go release).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          # This job lints every go.work module, so the cache key reads every
          # module that has a go.sum. The block below is a literal string, so a
          # comment inside it would become a path.
          cache-dependency-path: |
            services/elitea-main/go.sum
            services/elitea-scheduler/go.sum
            services/elitea-subapp-host/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
            conformance/nativeclient/go.sum

      # golangci-lint-action installs AND runs in one step, and it runs in one
      # working directory. Nine directories therefore need the binary on its
      # own. The version is PINNED: `version: latest` made the gate a moving
      # target, so a new release could red an untouched branch, and the local
      # run that proves a change can never match what CI will do. Raise this
      # value deliberately, and read the release notes when you do.
      # Through the API, not the github.com release download link (504s),
      # and checked against the release's checksums file.
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: "2.9.0"
          GOLANGCI_LINT_SHA256: 493aaaca2eba6c8bcef847d92716bbd91bbac4b22cdbb0ab5b6a581b32946091
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          gh release download "v${GOLANGCI_LINT_VERSION}" --repo golangci/golangci-lint \
            --pattern "${archive}" --output "/tmp/${archive}" --clobber
          echo "${GOLANGCI_LINT_SHA256}  /tmp/${archive}" | sha256sum -c -
          bin="$(go env GOPATH)/bin"
          mkdir -p "$bin"
          tar -xzf "/tmp/${archive}" -C "$bin" --strip-components=1 "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/golangci-lint" version

      # The script fails when the binary is absent, so a broken install above
      # cannot turn into a green "nothing to report" below.
      - name: golangci-lint (workspace)
        run: bash scripts/go/workspace-run.sh lint

  # ── The Go tests: a plan, one job per shard, and the "Test" result ─────────
  #
  # The tests ran in ONE job, named Test. On main that job took 20 to 40
  # minutes (2026-11-02: 06:02:41 to 06:35:39; the test step alone 27.7 min).
  # The services/elitea-main module took 22.8 min of that. Its package
  # internal/infra/db/repos ran for 6 to 10 minutes, and it started LAST, so
  # for the last 4 minutes one package ran on a 4-core runner. Go vet ran 3.5
  # minutes before the first test, in series.
  #
  # Now the work is in parallel jobs:
  #
  #   test-plan    reads scripts/go/test-shards.json and the go tool's package
  #                list, and FAILS if a package is in no shard or in two
  #                (scripts/ci/go-test-shards.mjs). Its output is the matrix.
  #   test-checks  the checks that run one time: Go vet, the generated OpenAPI
  #                server, the static API contract.
  #   test-shard   one job per shard, each with its own PostgreSQL and NATS,
  #                and the storage emulators only where the shard sets
  #                `storage`. Each shard runs the skip ledger with
  #                ELITEA_REQUIRE_DECLARED_SKIPS=1, so an undeclared skip
  #                fails that shard.
  #   test         named "Test", as before. It needs all of the above and
  #                fails unless each one succeeded. It also joins the shard
  #                coverage profiles into the one `coverage` artifact.
  test-plan:
    name: Test plan (Go shards)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # `go list -find` reads directories only. It needs no module cache.
          cache: false
          go-version-file: go.work
      # The scenario count is compared with the pass count, so a scenario
      # that does not run cannot read as a pass.
      - name: Shard script scenarios
        run: |
          set -uo pipefail
          expected="$(grep -c '^test(' scripts/ci/go-test-shards.test.mjs)"
          status=0
          output="$(node --test --test-reporter=tap scripts/ci/go-test-shards.test.mjs 2>&1)" || status=$?
          echo "$output"
          ran="$(printf '%s\n' "$output" | sed -n 's/^# pass \([0-9]*\)$/\1/p' | tail -1)"
          if [ "$status" -ne 0 ]; then
            echo "::error::node --test go-test-shards.test.mjs exited ${status}"
            exit 1
          fi
          if [ "${ran:-}" != "$expected" ]; then
            echo "::error::the suite holds ${expected} scenario(s) and node --test passed ${ran:-none}"
            exit 1
          fi
      - name: Assign every package to exactly one shard
        id: plan
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/go-test-shards.mjs matrix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test-checks:
    name: Test checks (vet, generated code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            services/elitea-scheduler/go.sum
            services/elitea-subapp-host/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
            conformance/nativeclient/go.sum

      - name: Verify generated OpenAPI server is current
        run: |
          cd services/elitea-main
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2 \
            --config api/openapi/oapi-codegen.yaml api/openapi/v2.yaml
          git diff --exit-code -- internal/api/generated/api.gen.go

      # The response SHAPE each listed handler writes, against what the SPA
      # reads. It parses Go source and starts no server, so it costs a second.
      #
      # It ran in no workflow until #428. That mattered twice over: the script
      # also turned every unreadable assertion into a warning and exited 0, so
      # even a manual run reported success after measuring nothing. It now fails
      # on a skipped assertion and prints how many of the 17 ran. #424 tracks the
      # other gates that still have no caller.
      - name: Static API contract (handler response shapes)
        run: bash services/elitea-main/scripts/validate_contract_static.sh

      # One aggregation for CI and for `task vet`. The inline loop that used to
      # live here reported the status of its LAST module only (#409). It ran
      # in series before the tests (3.5 minutes); here it runs beside them.
      - name: Go vet (workspace)
        run: bash scripts/go/workspace-run.sh vet

  test-shard:
    name: Test (${{ matrix.name }})
    needs: test-plan
    runs-on: ubuntu-latest
    strategy:
      # Each shard reports. One red shard does not cancel the others, so a
      # run names every failure, as workspace-run.sh does for modules.
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    # Backs ELITEA_TEST_DATABASE_URL below. Without this, every Postgres
    # integration test across the workspace (internal/infra/db/repos,
    # internal/runtimecomposition, internal/application/artifactbootstrap,
    # ...) silently t.Skips — this test job ran green for a long time while
    # that entire class of test provided zero actual coverage. Each test
    # provisions its own isolated CREATE DATABASE against this one shared
    # server instance, so a single service container is enough.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Many test packages apply the full shared migration chain at the
        # same time, each in its own database. With the default of 64 locks
        # per transaction the shared lock table runs out ("out of shared
        # memory", SQLSTATE 53200).
        command: postgres -c max_locks_per_transaction=512
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # Backs ELITEA_TEST_NATS_URL below: elitea-main's live-update plane
      # (internal/api/v2/canvaspresence's JetStream KV store and the boot
      # path in cmd/elitea-main). The -alpine tag because the plain image is
      # scratch, with no shell for a health command; its entrypoint passes
      # flag arguments to nats-server. The undeclared-skip gate fails the run
      # if those tests skip, so losing this container cannot read as green.
      nats:
        image: nats:2.12.0-alpine
        command: -js -m 8222
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd="wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            services/elitea-scheduler/go.sum
            services/elitea-subapp-host/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
            conformance/nativeclient/go.sum

      # The same function as the plan job, on the same commit, so the shard
      # and the plan cannot disagree. It fails again on a bad split.
      - name: Select the packages of this shard
        env:
          SHARD: ${{ matrix.name }}
        run: node scripts/ci/go-test-shards.mjs select "$SHARD" "${RUNNER_TEMP}/go-shard-packages.tsv"

      # Three suites need a database with NOTHING in it: they create the
      # legacy `centry` schema and the `auth_core__*` tables themselves, then
      # roll back. They cannot share one database, because two of them would
      # then race on `CREATE SCHEMA centry`, and they cannot use the shared
      # `postgres` database, because their own emptiness check would skip them
      # again — the second-order silent skip that hid behind the first (#423).
      #
      # `psql -c` on a name this script controls, so no injection surface.
      - name: Create the isolated test databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for database in elitea_legacy_rbac_test elitea_projects_test elitea_social_authors_test; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE ${database}"
          done

      # internal/api/clientcontract compares this change's client-contract
      # locks with the BASE branch's: the other gates read the lock from the
      # same tree as the spec, so breaking the spec and hand-editing the lock
      # to match passed all of them. The checkout above is shallow, so fetch
      # the base tip; ELITEA_REQUIRE_CLIENT_CONTRACT_BASE (below) makes a
      # missing base a failure rather than a skip. Every shard fetches it (one
      # second), so a move of that package to another shard cannot lose it.
      - name: Fetch the base branch for the client-contract lock comparison
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Emulator stack for internal/infra/storage/conformance (S4) and the
      # other packages that read S3_ENDPOINT_URL. Only a shard with
      # `storage: true` in scripts/go/test-shards.json starts it. A storage
      # test in another shard cannot pass in silence: the S3/Azure/GCS
      # variables below stay set, so it fails to connect. --wait blocks until
      # every service's healthcheck passes (see the compose file for why each
      # healthcheck is more involved than a bare wget).
      - name: Start storage emulators
        if: matrix.storage
        run: docker compose -f deploy/docker-compose.storage-test.yml up -d --wait

      # The secured NATS permission tests (#1076): libs/go/natsconn/natstest
      # starts nats-server on the nats.conf `helm template deploy/helm/elitea`
      # renders and runs elitea-main's and the scheduler's real NATS paths as
      # their certificate identities, after the real bootstrap.sh. The script
      # renders that config (helm + the upstream subchart), fetches the pinned
      # nats CLI the bootstrap runs, and sets ELITEA_REQUIRE_NATS_SECURE_TEST,
      # so a missing piece fails those tests instead of skipping them. The
      # nats service container still backs the plaintext suites. Packages in
      # every shard use natstest, so every shard provisions it.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      # The server binary out of the nats service container, so the restart
      # test (TestNATSStoreFollowsTheBucketAcrossAServerRestart owns its
      # server's process) and natstest run the same build as the service, on
      # one pin. Set explicitly on both consumers below.
      - name: Copy nats-server out of the nats service container
        env:
          NATS_CONTAINER: ${{ job.services.nats.id }}
        run: |
          set -euo pipefail
          docker cp "${NATS_CONTAINER}:/usr/local/bin/nats-server" "${RUNNER_TEMP}/nats-server"
          "${RUNNER_TEMP}/nats-server" --version

      - name: Provision the secured NATS permission tests
        env:
          # The chart dependency fallback and the nats CLI fetch use the API.
          GH_TOKEN: ${{ github.token }}
          ELITEA_TEST_NATS_SERVER_BIN: "${{ runner.temp }}/nats-server"
        run: bash scripts/nats/ci-secure-test-env.sh

      - name: Run tests (shard)
        env:
          # The packages of this shard (the select step above). With it,
          # workspace-run.sh runs only these packages and names each module
          # it leaves to another shard.
          ELITEA_GO_PACKAGES_FILE: "${{ runner.temp }}/go-shard-packages.tsv"

          S3_ENDPOINT_URL: "http://127.0.0.1:19000"
          S3_ACCESS_KEY: "testaccesskey"
          S3_SECRET_KEY: "testsecretkey"
          S3_REGION: "us-east-1"
          S3_FORCE_PATH_STYLE: "true"
          AZURE_STORAGE_ACCOUNT: "devstoreaccount1"
          AZURE_STORAGE_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
          AZURE_STORAGE_ENDPOINT: "http://127.0.0.1:10000/devstoreaccount1"
          GCS_ENDPOINT: "http://127.0.0.1:4443/storage/v1/"
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          # The sub-application host's durable invocation store (ADR-0023
          # H2b): its tests apply the DeepWiki engine's migration
          # (services/elitea-deepwiki-engine/migrations/0002) into a
          # throwaway schema of this database and skip loudly without it.
          ELITEA_SUBAPP_HOST_TEST_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_AGENTSTATE_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

          # ---- #423: the variables no workflow used to set -----------------
          #
          # Each name below was a guard that called t.Skip, so `go test`
          # compiled the suite, ran nothing, and printed `ok`. The skip ledger
          # at the end of workspace-run.sh now names every remaining skip, and
          # ELITEA_REQUIRE_DECLARED_SKIPS below turns an undeclared one into a
          # failure.

          # An ADMIN DSN, not a test database: identityrepo, authsvc and
          # api/v2/auth each run CREATE DATABASE and work in their own.
          ELITEA_AUTH_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

          # One empty database each — see the creation step above.
          ELITEA_LEGACY_RBAC_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_legacy_rbac_test?sslmode=disable"
          ELITEA_PROJECTS_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_projects_test?sslmode=disable"
          ELITEA_SOCIAL_AUTHORS_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_social_authors_test?sslmode=disable"

          # The legacy-RBAC and prompt-context guards each accept a "require"
          # flag that turns their own skips into failures. With the databases
          # above provisioned, a skip here means the provisioning broke, and
          # that must read as a failure rather than as silence.
          ELITEA_REQUIRE_LEGACY_RBAC_POSTGRES_TEST: "true"
          ELITEA_REQUIRE_PROMPT_CONTEXT_POSTGRES_TEST: "true"

          # The nats service container, and its binary (copied above).
          ELITEA_TEST_NATS_URL: "nats://127.0.0.1:4222"
          ELITEA_TEST_NATS_SERVER_BIN: "${{ runner.temp }}/nats-server"

          # Opt-in real-service reliability tests. Each needs only the
          # PostgreSQL service and the secured NATS server (natstest, on the
          # chart's own permissions) this job already provisions. Measured
          # locally: backlog 19 s, visibility repair 3 s, three JetStream
          # capacity rounds under 10 s.
          ELITEA_RUNTIME_POSTGRES_RELIABILITY_TEST: "1"
          ELITEA_RUNTIME_VISIBILITY_REPAIR_TEST: "1"
          ELITEA_RUNTIME_NATS_RELIABILITY_ROUNDS: "3"

          # tests/system/index_v2_preflight_binary_system_test.go starts its
          # own PostgreSQL container and secured NATS server and builds the shipped
          # binaries, so it needs no service from this job. It is the only one
          # of the tests/system files that CI can run; the rest want the
          # Python SDK, and
          # scripts/go/declared-skips.txt names each with its reason.
          ELITEA_INDEX_V2_PREFLIGHT_SYSTEM_TEST: "1"

          # The step above fetched it; a missing base must fail, not skip.
          CLIENT_CONTRACT_BASE_REF: origin/${{ github.base_ref || 'main' }}
          ELITEA_REQUIRE_CLIENT_CONTRACT_BASE: "1"

          # A skip that nothing declares FAILS this shard. Locally the ledger
          # only reports, so a developer with no PostgreSQL or NATS can still
          # run `task test`. A declaration for a package of another shard
          # reads as STALE here; skip-gate.py does not fail on STALE.
          ELITEA_REQUIRE_DECLARED_SKIPS: "1"
        # One aggregation for CI and for `task test`. The inline loop that used
        # to live here reported the status of its LAST module, and it ended
        # each subshell with `[ -f coverage.out ] && strip-generated.sh`, which
        # could own the status of a failed `go test` (#409). The script runs
        # every module, records every status, names every failed module, and
        # exits non-zero if any module failed. It also names the modules that
        # this run did NOT cover, so a green step cannot be read as
        # "the whole repository was tested".
        run: bash scripts/go/workspace-run.sh coverage --race

      - name: Stop storage emulators
        if: always() && matrix.storage
        run: docker compose -f deploy/docker-compose.storage-test.yml down -v

      # The profiles are written INSIDE each module directory. The collect
      # step copies them to <dir>/<module>/coverage.out, so the artifact keeps
      # the module path and the "Test" job can join the shards. It FAILS when
      # it finds no profile: an empty artifact reads exactly like a passing
      # one (#409).
      - name: Collect coverage
        run: node scripts/ci/go-test-shards.mjs collect-coverage "${RUNNER_TEMP}/go-coverage"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go-${{ matrix.name }}
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: error

      # The former `build` job is gone: `go vet ./...` in the lint job
      # type-checks every package including cmd/, so a main that stops
      # compiling already fails there, and a link-stage failure for a
      # pure-Go CGO_ENABLED=0 binary is not a case this repository has seen.
      # Production images are built from the Containerfiles, not here.

  # The one result named "Test", as before the split. No branch rule names a
  # required check today (2026-11-03: main has no branch protection, and its
  # ruleset requires no status check), but people and tools read this name.
  # `if: always()` makes this job run when a shard fails, so it can report
  # the failure. A skipped or cancelled job is a failure here too.
  test:
    name: Test
    if: always()
    needs: [test-plan, test-checks, test-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and check passed
        env:
          PLAN: ${{ needs.test-plan.result }}
          CHECKS: ${{ needs.test-checks.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          echo "test-plan: ${PLAN}; test-checks: ${CHECKS}; test-shard (all shards): ${SHARDS}"
          for result in "$PLAN" "$CHECKS" "$SHARDS"; do
            if [ "$result" != "success" ]; then
              echo "::error::a Go test job did not succeed (plan ${PLAN}, checks ${CHECKS}, shards ${SHARDS})"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-go-*
          path: ${{ runner.temp }}/go-coverage-shards
      # One `coverage` artifact with <module>/coverage.out, as the single job
      # uploaded. The shards hold different packages, so the join is exact.
      - name: Merge coverage
        run: node scripts/ci/go-test-shards.mjs merge-coverage "${RUNNER_TEMP}/go-coverage-shards" "${RUNNER_TEMP}/go-coverage"
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ runner.temp }}/go-coverage
          if-no-files-found: error

  editor-lifecycle:
    name: Editor Test lifecycle (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The editor guard rejects the broad Test job's PG16 listener and DSN.
    # Run this fixture in its own process and database. Do not use product settings.
    services:
      editor-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: editor_fixture
          POSTGRES_DB: elitea_it_editor_lifecycle_20261002
        ports:
          - "127.0.0.1:15444:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d elitea_it_editor_lifecycle_20261002"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - name: Check the editor fixture CI gate
        run: python3 -m unittest discover -s scripts/go/tests -p 'test_editor_lifecycle_ci.py' -v
      - name: Run required editor PostgreSQL acceptance
        env:
          ELITEA_EDITOR_TEST_DATABASE_URL: "postgres://postgres:editor_fixture@127.0.0.1:15444/elitea_it_editor_lifecycle_20261002?sslmode=disable"
          ELITEA_REQUIRE_EDITOR_POSTGRES_TEST: "true"
          ELITEA_EDITOR_TEST_ARTIFACT_DIR: ${{ runner.temp }}/editor-lifecycle
        run: bash scripts/go/editor-lifecycle-postgres.sh
      - name: Upload editor PostgreSQL acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-lifecycle-postgres
          path: ${{ runner.temp }}/editor-lifecycle
          if-no-files-found: error

  secretstore-openbao:
    name: SecretStore KV v2 against OpenBao (#1113)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Vault/OpenBao adapter's integration tests need a real KV v2 server.
    # OpenBao dev mode with TLS, the same fixture (entrypoint, command, user)
    # as deploy/docker-compose.secretstore.yml; the test provisions its own
    # mounts, JWT auth, policy and role through the root token. The adapter
    # refuses plain http, so the server needs -dev-tls. The entrypoint is
    # bao itself: the image's script drops to the openbao user, which cannot
    # write the root-owned host directory -dev-tls fills. vault-ca.pem comes
    # out mode 0444, so the test reads it from the host. A service definition
    # cannot read the runner context, so the directory is per run under /tmp
    # instead of $RUNNER_TEMP.
    services:
      openbao:
        image: quay.io/openbao/openbao:2.4.1
        entrypoint: bao
        command: >-
          server -dev -dev-tls -dev-tls-cert-dir=/tls
          -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=elitea-secretstore-it-root
        ports:
          - 127.0.0.1:8210:8200
        volumes:
          - /tmp/openbao-tls-${{ github.run_id }}-${{ github.run_attempt }}:/tls
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd="bao status -address=https://127.0.0.1:8200 -ca-cert=/tls/vault-ca.pem"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
      - name: Run the OpenBao integration tests
        working-directory: services/elitea-main
        env:
          ELITEA_TEST_OPENBAO_ADDR: https://127.0.0.1:8210
          ELITEA_TEST_OPENBAO_CA_FILE: /tmp/openbao-tls-${{ github.run_id }}-${{ github.run_attempt }}/vault-ca.pem
          ELITEA_TEST_OPENBAO_ROOT_TOKEN: elitea-secretstore-it-root
          ELITEA_REQUIRE_OPENBAO_TEST: "true"
        run: go test -race -count=1 -run 'TestOpenBao' ./internal/secretstore/vault/

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-main/go.sum
      - name: Run database integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://elitea:elitea@localhost:5432/elitea?sslmode=disable
        run: |
          cd services/elitea-main
          go test -count=1 -timeout=120s ./tests/integration/

  # The `container-scan` job that PR #432 added here (issue #224) now lives in
  # .github/workflows/ci-image-scan.yml (since 2026-10-20 the nightly scan of
  # the published `latest`, nightly-image-scan.yml), together with the five other published
  # images that had no scan at all (#433). Nothing about the elitea-main scan
  # changed — same `target: final` build, same HIGH,CRITICAL threshold, same
  # "a report with no Go binary is a failure" guard.
  #
  # It moved because path filters are per workflow. elitea-web is a published
  # image too, and adding apps/elitea-web/** to this workflow's
  # triggers would run the Postgres service, the storage emulators and the whole
  # Go test suite on every front-end change.

  compiled-snapshots-postgres:
    name: Compiled snapshots (required isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Plain PostgreSQL 18 (Debian 13): the compiled-snapshot tests need no
        # extension.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elitea_compiled_fixture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d elitea_compiled_fixture_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The cache is .github/actions/go-cache below: setup-go's own
          # saves from every ref, and pull-request copies evicted main's.
          cache: false
          go-version-file: services/elitea-main/go.mod
      - name: Restore the Go cache (pull requests read, main writes)
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-main/go.sum
      - name: Check compiled snapshot publication and recovery
        env:
          ELITEA_COMPILED_SNAPSHOT_PG_FIXTURE_DSN: "postgres://postgres:postgres@127.0.0.1:5432/elitea_compiled_fixture_ci?sslmode=disable"
          ELITEA_COMPILED_SNAPSHOT_PG_DISPOSABLE_ACK: "isolated_fixture_only"
        run: bash scripts/contract/check_compiled_snapshots_postgres.sh
