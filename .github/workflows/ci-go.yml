name: CI — Go

on:
  pull_request:
    paths:
      - "services/elitea-main/**"
      - "services/elitea-scheduler/**"
      - "services/elitea-subapp-host/**"
      - "services/elitea-worker-python/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
      # S17: the env-drift job below checks elitea-main's Go env reads
      # against this chart, so a chart-only change (no Go diff at all) must
      # still trigger it — the whole point is catching drift introduced from
      # either side.
      - "deploy/helm/elitea-main/**"
      - "services/elitea-llm-gateway/scripts/env-drift-check.sh"
      # The vet and test steps below run scripts/go/workspace-run.sh. A change
      # to that script, or to the Taskfile that calls it, must run this
      # workflow. A gate that does not trigger on the file it guards is the
      # same false green in another costume (#409).
      - "scripts/go/**"
      - "scripts/contract/check_compiled_snapshots_postgres.sh"
      - "scripts/coverage/**"
      - "Taskfile.yml"
  push:
    branches:
      - main
    paths:
      - "services/elitea-main/**"
      - "services/elitea-scheduler/**"
      - "services/elitea-subapp-host/**"
      - "services/elitea-worker-python/**"
      - "libs/go/**"
      - "libs/proto/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-go.yml"
      - "deploy/helm/elitea-main/**"
      - "services/elitea-llm-gateway/scripts/env-drift-check.sh"
      # The vet and test steps below run scripts/go/workspace-run.sh. A change
      # to that script, or to the Taskfile that calls it, must run this
      # workflow. A gate that does not trigger on the file it guards is the
      # same false green in another costume (#409).
      - "scripts/go/**"
      - "scripts/contract/check_compiled_snapshots_postgres.sh"
      - "scripts/coverage/**"
      - "Taskfile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope — these jobs only read the checked-out repo.
permissions:
  contents: read

jobs:
  sqlc:
    name: Reproduce SQLC queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: Generate and vet type-safe SQL
        working-directory: services/elitea-main
        run: |
          sqlc generate
          sqlc vet
          git diff --exit-code -- internal/db/sqlcgen

  env-drift:
    name: Env-drift gate — elitea-main code env reads vs Helm chart
    runs-on: ubuntu-latest
    # S17: ci-gateway.yml already runs this same script (no-args form, both
    # services) but only triggers on services/elitea-llm-gateway/** paths —
    # an elitea-main-only or chart-only change never touches that workflow at
    # all, so elitea-main's own coverage was previously never exercised in
    # practice despite the script's own header claiming otherwise. Runs the
    # single-target form here instead of duplicating the gateway's own check.
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          command -v yq >/dev/null || { sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
      - name: Check elitea-main env vars are settable by its Helm chart
        run: |
          # elitea-main is a component of the one platform chart now, so its
          # env and secrets maps live under the `main` key rather than at the
          # values root.
          CHART_VALUES_PREFIX=main \
          services/elitea-llm-gateway/scripts/env-drift-check.sh \
            elitea-main deploy/helm/elitea deploy/helm/elitea/env-drift-allowlist.txt \
            services/elitea-main/internal services/elitea-main/cmd

  lint:
    name: Lint (workspace)
    runs-on: ubuntu-latest
    # Issue #427. This job used to carry a hand-written matrix of two modules,
    # `services/elitea-main` and `services/elitea-scheduler`, while go.work
    # names nine. gen/go, libs/go/authlib, libs/go/eventslib,
    # libs/go/observability, libs/go/rpclib, libs/proto/gen/go and tools/uictl
    # were never linted, and this workflow triggers on `libs/go/**` — so it ran
    # on their changes and looked at none of them.
    #
    # A hand-written matrix cannot report what it left out. The module list is
    # read from go.work at run time instead, by the same script the vet and
    # test steps use, and that script prints the Go modules on disk that the
    # run did NOT cover (services/elitea-llm-gateway, which ci-gateway.yml
    # lints on its own Go release).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # This job lints nine modules now, so the cache key reads every module
          # that has a go.sum. tools/uictl has none — it declares no external
          # dependency. The block below is a literal string, so a comment
          # inside it would become a path.
          cache-dependency-path: |
            services/elitea-main/go.sum
            services/elitea-scheduler/go.sum
            services/elitea-subapp-host/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
            gen/go/go.sum

      # golangci-lint-action installs AND runs in one step, and it runs in one
      # working directory. Nine directories therefore need the binary on its
      # own. The version is PINNED: `version: latest` made the gate a moving
      # target, so a new release could red an untouched branch, and the local
      # run that proves a change can never match what CI will do. Raise this
      # value deliberately, and read the release notes when you do.
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.9.0
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The script fails when the binary is absent, so a broken install above
      # cannot turn into a green "nothing to report" below.
      - name: golangci-lint (workspace)
        run: bash scripts/go/workspace-run.sh lint

  test:
    name: Test
    runs-on: ubuntu-latest
    # Backs ELITEA_TEST_DATABASE_URL below. Without this, every Postgres
    # integration test across the workspace (internal/infra/db/repos,
    # internal/runtimecomposition, internal/application/artifactbootstrap,
    # ...) silently t.Skips — this test job ran green for a long time while
    # that entire class of test provided zero actual coverage. Each test
    # provisions its own isolated CREATE DATABASE against this one shared
    # server instance, so a single service container is enough.
    services:
      postgres:
        # pgvector, not plain postgres: the projectprovisioning tests run
        # CREATE EXTENSION vector, and four other tests skip themselves on a
        # server without it. Same PG major and same credentials, so the DSN
        # below is unchanged. The four projectprovisioning tests DO carry a
        # skip guard now — without one they reported the missing extension as
        # a code defect on every developer's stock postgres — but this job
        # sets ELITEA_REQUIRE_PGVECTOR_POSTGRES_TEST below, which turns that
        # guard into a t.Fatal. Losing the image here fails the job; it can
        # never turn it green with zero execution.
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # Backs ELITEA_TEST_REDIS_ADDR below (#423). Twelve tests across
      # internal/transport/redisdispatch, internal/infra/db/repos,
      # internal/infra/authsvc and internal/infra/redis want a real Redis.
      # Every one of them skipped itself on every run, so the transport that
      # carries every worker command had no service-backed coverage at all.
      # A Redis container costs a few seconds.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            services/elitea-scheduler/go.sum
            services/elitea-subapp-host/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum

      # Three suites need a database with NOTHING in it: they create the
      # legacy `centry` schema and the `auth_core__*` tables themselves, then
      # roll back. They cannot share one database, because two of them would
      # then race on `CREATE SCHEMA centry`, and they cannot use the shared
      # `postgres` database, because their own emptiness check would skip them
      # again — the second-order silent skip that hid behind the first (#423).
      #
      # `psql -c` on a name this script controls, so no injection surface.
      - name: Create the isolated test databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for database in elitea_legacy_rbac_test elitea_projects_test elitea_social_authors_test; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE ${database}"
          done

      - name: Verify generated OpenAPI server is current
        run: |
          cd services/elitea-main
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2 \
            --config api/openapi/oapi-codegen.yaml api/openapi/v2.yaml
          git diff --exit-code -- internal/api/generated/api.gen.go

      # The response SHAPE each listed handler writes, against what the SPA
      # reads. It parses Go source and starts no server, so it costs a second.
      #
      # It ran in no workflow until #428. That mattered twice over: the script
      # also turned every unreadable assertion into a warning and exited 0, so
      # even a manual run reported success after measuring nothing. It now fails
      # on a skipped assertion and prints how many of the 17 ran. #424 tracks the
      # other gates that still have no caller.
      - name: Static API contract (handler response shapes)
        run: bash services/elitea-main/scripts/validate_contract_static.sh

      # One aggregation for CI and for `task vet`. The inline loop that used to
      # live here reported the status of its LAST module only (#409).
      - name: Go vet (workspace)
        run: bash scripts/go/workspace-run.sh vet

      # Emulator stack for internal/infra/storage/conformance (S4). --wait
      # blocks until every service's healthcheck passes (see the compose
      # file for why each healthcheck is more involved than a bare wget).
      - name: Start storage emulators
        run: docker compose -f deploy/docker-compose.storage-test.yml up -d --wait

      - name: Run tests (workspace)
        env:
          S3_ENDPOINT_URL: "http://127.0.0.1:19000"
          S3_ACCESS_KEY: "testaccesskey"
          S3_SECRET_KEY: "testsecretkey"
          S3_REGION: "us-east-1"
          S3_FORCE_PATH_STYLE: "true"
          AZURE_STORAGE_ACCOUNT: "devstoreaccount1"
          AZURE_STORAGE_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
          AZURE_STORAGE_ENDPOINT: "http://127.0.0.1:10000/devstoreaccount1"
          GCS_ENDPOINT: "http://127.0.0.1:4443/storage/v1/"
          ELITEA_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          # The sub-application host's durable invocation store (ADR-0023
          # H2b): its tests apply the Python package's migration into a
          # throwaway schema of this database and skip loudly without it.
          ELITEA_SUBAPP_HOST_TEST_DSN: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
          ELITEA_AGENTSTATE_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

          # ---- #423: the variables no workflow used to set -----------------
          #
          # Each name below was a guard that called t.Skip, so `go test`
          # compiled the suite, ran nothing, and printed `ok`. The skip ledger
          # at the end of workspace-run.sh now names every remaining skip, and
          # ELITEA_REQUIRE_DECLARED_SKIPS below turns an undeclared one into a
          # failure.

          # An ADMIN DSN, not a test database: identityrepo, authsvc and
          # api/v2/auth each run CREATE DATABASE and work in their own.
          ELITEA_AUTH_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"

          # One empty database each — see the creation step above.
          ELITEA_LEGACY_RBAC_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_legacy_rbac_test?sslmode=disable"
          ELITEA_PROJECTS_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_projects_test?sslmode=disable"
          ELITEA_SOCIAL_AUTHORS_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/elitea_social_authors_test?sslmode=disable"

          # The legacy-RBAC and prompt-context guards each accept a "require"
          # flag that turns their own skips into failures. With the databases
          # above provisioned, a skip here means the provisioning broke, and
          # that must read as a failure rather than as silence.
          ELITEA_REQUIRE_LEGACY_RBAC_POSTGRES_TEST: "true"
          ELITEA_REQUIRE_PROMPT_CONTEXT_POSTGRES_TEST: "true"

          # Same shape, for the four projectprovisioning tests that run
          # CREATE EXTENSION vector. They t.Skip on a server without pgvector
          # so a local stock postgres does not read as a code defect; this
          # service HAS pgvector, so a skip here would mean the image changed
          # under us. That must read as a failure, not as silence (#423).
          ELITEA_REQUIRE_PGVECTOR_POSTGRES_TEST: "true"

          # The Redis service above.
          ELITEA_TEST_REDIS_ADDR: "localhost:6379"

          # Opt-in real-service reliability tests. Each needs only the
          # PostgreSQL and Redis services this job already runs. Measured
          # locally: backlog 19 s, visibility repair 41 s, three Redis
          # capacity rounds under 2 s.
          ELITEA_RUNTIME_POSTGRES_RELIABILITY_TEST: "1"
          ELITEA_RUNTIME_VISIBILITY_REPAIR_TEST: "1"
          ELITEA_RUNTIME_REDIS_RELIABILITY_ROUNDS: "3"

          # tests/system/index_v2_preflight_binary_system_test.go starts its
          # own PostgreSQL and TLS Redis containers and builds the shipped
          # binaries, so it needs no service from this job. It is the only one
          # of the nine tests/system files that CI can run; the rest want a
          # bootstrapped Centry compose profile or the Python SDK, and
          # scripts/go/declared-skips.txt names each with its reason.
          ELITEA_INDEX_V2_PREFLIGHT_SYSTEM_TEST: "1"

          # A skip that nothing declares FAILS this job. Locally the ledger
          # only reports, so a developer with no PostgreSQL or Redis can still
          # run `task test`. Same shape as CONTRACT_REQUIRE_PARITY.
          ELITEA_REQUIRE_DECLARED_SKIPS: "1"
        # One aggregation for CI and for `task test`. The inline loop that used
        # to live here reported the status of its LAST module, and it ended
        # each subshell with `[ -f coverage.out ] && strip-generated.sh`, which
        # could own the status of a failed `go test` (#409). The script runs
        # every module, records every status, names every failed module, and
        # exits non-zero if any module failed. It also names the modules that
        # this run did NOT cover, so a green step cannot be read as
        # "the whole repository was tested".
        run: bash scripts/go/workspace-run.sh coverage --race

      # Split out of the step above on purpose. Two different suites in one
      # step give one step name for two different failures, and a step name
      # that does not match the thing that failed costs real diagnosis time.
      #
      # `python3 -m unittest discover` exits 0 when it discovers NOTHING. A
      # renamed directory or a changed pattern would therefore turn this gate
      # into a green no-op. The count is asserted first (#409).
      - name: Run index reliability tests (Python)
        run: |
          python3 - <<'PY'
          import sys, unittest

          start = "services/elitea-main/tests/reliability/index_5681"
          suite = unittest.defaultTestLoader.discover(start, pattern="test_*.py", top_level_dir=start)
          count = suite.countTestCases()
          print(f"discovered {count} test(s) in {start}")
          if count == 0:
              sys.exit(f"no test discovered in {start}; the gate would pass without running anything")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: Stop storage emulators
        if: always()
        run: docker compose -f deploy/docker-compose.storage-test.yml down -v

      # `path: coverage.out` collected nothing. The profiles are written INSIDE
      # each module directory, and no module is the repository root, so the
      # root holds no coverage.out. The default `if-no-files-found: warn` kept
      # the step green while it uploaded an empty artifact (#409).
      #
      # `error` is deliberate: an upload that finds no file must fail, because
      # an empty artifact reads exactly like a passing one.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/coverage.out"
          if-no-files-found: error

      # The former `build` job is gone: `go vet ./...` in the lint job
      # type-checks every package including cmd/, so a main that stops
      # compiling already fails there, and a link-stage failure for a
      # pure-Go CGO_ENABLED=0 binary is not a case this repository has seen.
      # Production images are built from the Containerfiles, not here.

  editor-lifecycle:
    name: Editor Test lifecycle (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The editor guard rejects the broad Test job's PG16 listener and DSN.
    # Run this fixture in its own process and database. Do not use product settings.
    services:
      editor-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: editor_fixture
          POSTGRES_DB: elitea_it_editor_lifecycle_20261002
        ports:
          - "127.0.0.1:15444:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d elitea_it_editor_lifecycle_20261002"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
            gen/go/go.sum
      - name: Check the editor fixture CI gate
        run: python3 -m unittest discover -s scripts/go/tests -p 'test_editor_lifecycle_ci.py' -v
      - name: Run required editor PostgreSQL acceptance
        env:
          ELITEA_EDITOR_TEST_DATABASE_URL: "postgres://postgres:editor_fixture@127.0.0.1:15444/elitea_it_editor_lifecycle_20261002?sslmode=disable"
          ELITEA_REQUIRE_EDITOR_POSTGRES_TEST: "true"
          ELITEA_EDITOR_TEST_ARTIFACT_DIR: ${{ runner.temp }}/editor-lifecycle
        run: bash scripts/go/editor-lifecycle-postgres.sh
      - name: Upload editor PostgreSQL acceptance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-lifecycle-postgres
          path: ${{ runner.temp }}/editor-lifecycle
          if-no-files-found: error

  integration:
    name: Integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie
        env:
          POSTGRES_USER: elitea
          POSTGRES_PASSWORD: elitea
          POSTGRES_DB: elitea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitea -d elitea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: services/elitea-main/go.sum
      - name: Run database integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://elitea:elitea@localhost:5432/elitea?sslmode=disable
        run: |
          cd services/elitea-main
          go test -count=1 -timeout=120s ./tests/integration/

  # The `container-scan` job that PR #432 added here (issue #224) now lives in
  # .github/workflows/ci-image-scan.yml, together with the five other published
  # images that had no scan at all (#433). Nothing about the elitea-main scan
  # changed — same `target: final` build, same HIGH,CRITICAL threshold, same
  # "a report with no Go binary is a failure" guard.
  #
  # It moved because path filters are per workflow. elitea-web and elitea-ui are
  # published images too, and adding apps/elitea-web/** to this workflow's
  # triggers would run the Postgres service, the storage emulators and the whole
  # Go test suite on every front-end change.

  compiled-snapshots-postgres:
    name: Compiled snapshots (required isolated PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elitea_compiled_fixture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d elitea_compiled_fixture_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/elitea-main/go.mod
          cache-dependency-path: services/elitea-main/go.sum
      - name: Check compiled snapshot publication and recovery
        env:
          ELITEA_COMPILED_SNAPSHOT_PG_FIXTURE_DSN: "postgres://postgres:postgres@127.0.0.1:5432/elitea_compiled_fixture_ci?sslmode=disable"
          ELITEA_COMPILED_SNAPSHOT_PG_DISPOSABLE_ACK: "isolated_fixture_only"
        run: bash scripts/contract/check_compiled_snapshots_postgres.sh
