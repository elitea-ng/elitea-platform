name: Cancel runs of a merged PR

# A pull request may merge before every workflow on it has finished — merging
# is deliberately NOT blocked on the slow lanes. The runs left behind still
# hold slots. The org is on the GitHub free plan (20 concurrent jobs for the
# whole account) and the merge itself starts ~100 jobs on main, so a PR run
# that can no longer change anything competes with the gates that can.
#
# On merge this workflow cancels every unfinished `pull_request` run that
# belongs to THIS pull request, in every non-completed state (queued,
# requested, waiting, pending, in_progress). It asks politely first, so
# `if: always()` cleanup steps get to run, then force-cancels whichever of
# those same runs is still alive after a grace period — a run stuck on an
# `always()` step or a wedged runner ignores a plain cancel.
#
# A run belongs to the pull request when its event is `pull_request` AND it
# is either linked to this PR number, or — for a fork, where GitHub links no
# PR — its head sha is one of this PR's commits. The branch name is only the
# listing key, never the match: a release PR whose head is `main` must not
# cancel the push runs (ci-*, publish.yml) a merge starts on `main`, and a
# second open PR from the same branch must keep its checks.
#
# pull_request_target, not pull_request: a Dependabot or fork PR gets a
# read-only GITHUB_TOKEN under pull_request, and cancelling needs
# `actions: write`. This is safe here because the workflow never checks out
# or executes anything from the PR — it only calls the Actions API with ids.

on:
  pull_request_target:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel:
    name: Cancel unfinished runs
    # A PR closed without merging keeps its runs: someone may reopen it.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel, then force-cancel, this pull request's unfinished runs
        uses: actions/github-script@v9
        env:
          GRACE_SECONDS: "60"
        with:
          # Retries 5xx and secondary rate limits. A listing that failed must
          # fail the job, never come back short and read as "nothing to cancel".
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headRepo = pr.head.repo.full_name;
            const graceMs = Number(process.env.GRACE_SECONDS) * 1000;

            // Every sha this PR ever pointed at, for fork runs that carry no
            // PR link. The endpoint caps at 250 commits; a PR that size has
            // its older runs long finished.
            const shas = new Set(
              (await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100,
              })).map((c) => c.sha),
            );

            const belongsToPr = (run) =>
              run.head_repository?.full_name === headRepo &&
              (run.pull_requests.some((p) => p.number === pr.number) ||
                (run.pull_requests.length === 0 && shas.has(run.head_sha)));

            // The runs API filters on ONE status per call.
            const runs = new Map();
            for (const status of ['queued', 'requested', 'waiting', 'pending', 'in_progress']) {
              const page = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, branch: pr.head.ref, event: 'pull_request', status, per_page: 100,
              });
              for (const run of page.filter(belongsToPr)) runs.set(run.id, run);
            }

            const label = `PR #${pr.number} (${headRepo}:${pr.head.ref})`;
            if (runs.size === 0) {
              core.info(`${label}: no unfinished runs`);
              return;
            }
            core.info(`${label}: ${runs.size} unfinished run(s)`);
            for (const run of runs.values()) core.info(`  ${run.id} ${run.status} ${run.name}`);

            // A 409 means the run already finished, which is the outcome we
            // want. Anything else (403 missing scope, 404) is a real failure.
            const failures = [];
            const post = async (action, run) => {
              try {
                await github.request(`POST /repos/{owner}/{repo}/actions/runs/{run_id}/${action}`, {
                  owner, repo, run_id: run.id,
                });
                core.info(`${action}: ${run.id} ${run.name}`);
              } catch (err) {
                if (err.status === 409) {
                  core.info(`${action}: ${run.id} ${run.name} already finished`);
                } else {
                  failures.push(`${action} of ${run.id} ${run.name}: ${err.status} ${err.message}`);
                }
              }
            };

            for (const run of runs.values()) await post('cancel', run);

            // Only the runs listed above are escalated: anything that appeared
            // since is not ours to force-cancel without a polite cancel first.
            await new Promise((resolve) => setTimeout(resolve, graceMs));
            for (const run of runs.values()) {
              const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              if (data.status !== 'completed') await post('force-cancel', run);
            }

            if (failures.length > 0) core.setFailed(failures.join('\n'));
