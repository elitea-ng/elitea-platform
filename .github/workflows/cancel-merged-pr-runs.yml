name: Cancel runs of a merged PR

# A pull request may merge before every workflow on it has finished — merging
# is deliberately NOT blocked on the slow lanes. The runs left behind still
# hold slots. The org is on the GitHub free plan (20 concurrent jobs for the
# whole account) and the merge itself starts ~100 jobs on main, so a PR run
# that can no longer change anything competes with the gates that can.
#
# On merge this workflow cancels every unfinished run on the PR's head branch,
# in every non-completed state (queued, requested, waiting, pending,
# in_progress). It asks politely first, so `if: always()` cleanup steps get to
# run, then force-cancels whatever is still alive after a grace period — a run
# stuck on an `always()` step or a wedged runner ignores a plain cancel.
#
# pull_request_target, not pull_request: a Dependabot or fork PR gets a
# read-only GITHUB_TOKEN under pull_request, and cancelling needs
# `actions: write`. This is safe here because the workflow never checks out
# or executes anything from the PR — it only calls the Actions API with ids.

on:
  pull_request_target:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel unfinished runs
    # A PR closed without merging keeps its runs: someone may reopen it.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel, then force-cancel, every unfinished run on the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The head branch name alone is ambiguous: a fork's `main` is not
          # this repository's `main`. Every run is matched on the head
          # repository too, so a fork PR named after a trunk branch can never
          # cancel the merge's own push runs on main.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELF_RUN_ID: ${{ github.run_id }}
          GRACE_SECONDS: "60"
        run: |
          set -euo pipefail

          # The runs API filters on ONE status per call, so ask once per
          # non-completed status and merge the answers.
          list_unfinished() {
            for status in queued requested waiting pending in_progress; do
              gh api --paginate \
                -X GET "repos/${REPO}/actions/runs" \
                -f branch="${HEAD_REF}" \
                -f status="${status}" \
                -f per_page=100 \
                --jq ".workflow_runs[]
                      | select(.id != ${SELF_RUN_ID})
                      | select(.head_repository.full_name == \"${HEAD_REPO}\")
                      | [.id, .status, .event, .name] | @tsv"
            done | sort -u -k1,1n
          }

          runs="$(list_unfinished)"
          if [ -z "${runs}" ]; then
            echo "PR #${PR_NUMBER} (${HEAD_REPO}:${HEAD_REF}): no unfinished runs"
            exit 0
          fi

          echo "PR #${PR_NUMBER} (${HEAD_REPO}:${HEAD_REF}): unfinished runs"
          printf '%s\n' "${runs}"

          # A 409 means the run finished between the listing and the call,
          # which is the outcome we wanted, so it is not an error.
          while IFS=$'\t' read -r id status event name; do
            if gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" --silent 2>/dev/null; then
              echo "cancel requested: ${id} ${name} (${event}, ${status})"
            else
              echo "::notice::cancel of ${id} ${name} refused; it may have just finished"
            fi
          done <<< "${runs}"

          deadline=$(( $(date +%s) + GRACE_SECONDS ))
          remaining="${runs}"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            sleep 10
            remaining="$(list_unfinished)"
            [ -z "${remaining}" ] && break
          done

          if [ -z "${remaining}" ]; then
            echo "every run stopped within ${GRACE_SECONDS}s of the cancel request"
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r id status event name; do
            if gh api -X POST "repos/${REPO}/actions/runs/${id}/force-cancel" --silent 2>/dev/null; then
              echo "force-cancelled: ${id} ${name} (${event}, ${status})"
            else
              # Re-read before calling it a failure: it may have stopped on
              # its own in the meantime.
              state="$(gh api "repos/${REPO}/actions/runs/${id}" --jq .status)"
              if [ "${state}" = "completed" ]; then
                echo "already stopped: ${id} ${name}"
              else
                echo "::warning::could not force-cancel ${id} ${name} (still ${state})"
                failed=1
              fi
            fi
          done <<< "${remaining}"
          exit "${failed}"
