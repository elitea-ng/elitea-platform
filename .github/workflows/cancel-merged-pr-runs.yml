name: Cancel runs of a merged PR

# A pull request may merge before every workflow on it has finished — merging
# is deliberately NOT blocked on the slow lanes. The runs left behind still
# hold slots. The org is on the GitHub free plan (20 concurrent jobs for the
# whole account) and the merge itself starts ~100 jobs on main, so a PR run
# that can no longer change anything competes with the gates that can.
#
# On merge this workflow cancels every unfinished `pull_request` run that
# belongs to THIS pull request, in every non-completed state (queued,
# requested, waiting, pending, in_progress). It asks politely first, so
# `if: always()` cleanup steps get to run, then force-cancels whichever of
# those same runs is still alive after a grace period — a run stuck on an
# `always()` step or a wedged runner ignores a plain cancel.
#
# A run belongs to the pull request when its event is `pull_request` and its
# head sha is one of this PR's commits (plus the head repository, when it
# still exists). The branch name is only the listing key, never the match: a
# release PR whose head is `main` must not cancel the push runs (ci-*,
# publish.yml) a merge starts on `main`. A run GitHub links to another PR and
# not to this one is left alone, so a second open PR from the same branch
# keeps its checks. Accepted limit: fork runs carry no PR link, so two open
# PRs from the same fork branch at the same sha cannot be told apart.
#
# A second job deletes the PR ref's Actions caches when the PR closes, merged
# or not (see the job's comment).
#
# `pull_request: [closed]`, not `pull_request_target` (GitHub blocks that by
# default from 2026-12-02; scripts/ci/check-no-push-triggers.mjs refuses it).
# Under `pull_request` a fork PR, and a run Dependabot triggers, get a
# read-only GITHUB_TOKEN whatever `permissions:` asks for, so the close-time
# pass logs a notice and does nothing for them. The HOURLY sweep (schedule,
# on main, with the write token) does that work instead: it cancels the
# unfinished runs of every pull request merged in the last SWEEP_HOURS, and
# deletes the caches of every closed pull request's ref. A fork PR's close
# event still waits for approval like any fork run: do not approve it, the
# sweep covers it. The workflow never checks out or executes anything from
# the PR — it only calls the Actions API with ids.

on:
  pull_request:
    types:
      - closed
  # Hourly: the merged PRs the close-time pass could not touch (fork,
  # Dependabot), and PR-ref caches written AFTER the close-time pass (a run of
  # a closed-unmerged PR is not cancelled and may still export when it ends).
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel:
    name: Cancel unfinished runs
    # A PR closed without merging keeps its runs: someone may reopen it.
    if: github.event_name == 'schedule' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel, then force-cancel, merged pull requests' unfinished runs
        # Pinned to the v9.0.0 commit: this job holds `actions: write`, so a
        # moved tag must not change the code it runs.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GRACE_SECONDS: "60"
          # Longer than the hourly cron, so a late or skipped sweep still sees
          # every merge once.
          SWEEP_HOURS: "6"
        with:
          # Retries 5xx and secondary rate limits. A listing that failed must
          # fail the job, never come back short and read as "nothing to
          # cancel". 409 ("already finished") is an answer, not a fault.
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const { owner, repo } = context.repo;
            const graceMs = Number(process.env.GRACE_SECONDS) * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            // Which merged pull requests this run handles.
            let prs;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const fork = pr.head.repo?.full_name !== `${owner}/${repo}`;
              if (fork || context.actor === 'dependabot[bot]') {
                core.notice(`PR #${pr.number}: this run's token is read-only (${fork ? 'fork' : 'Dependabot'}); the hourly sweep cancels its runs`);
                return;
              }
              prs = [pr];
            } else {
              const since = Date.now() - Number(process.env.SWEEP_HOURS) * 3600 * 1000;
              prs = [];
              // Most recently updated first; stop at the first page that
              // reaches past the window.
              for await (const { data } of github.paginate.iterator(github.rest.pulls.list, {
                owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
              })) {
                prs.push(...data.filter((p) => p.merged_at && Date.parse(p.merged_at) >= since));
                if (data.length === 0 || Date.parse(data[data.length - 1].updated_at) < since) break;
              }
              core.info(`sweep: ${prs.length} pull request(s) merged in the last ${process.env.SWEEP_HOURS} h`);
            }

            // The unfinished runs of one pull request.
            const runsOf = async (pr) => {
              // head.repo is null when the fork was deleted; the sha match
              // alone still identifies the PR's runs.
              const headRepo = pr.head.repo?.full_name ?? null;
              // Every sha this PR ever pointed at. The endpoint caps at 250
              // commits; a PR that size has its older runs long finished.
              const shas = new Set(
                (await github.paginate(github.rest.pulls.listCommits, {
                  owner, repo, pull_number: pr.number, per_page: 100,
                })).map((c) => c.sha),
              );
              const belongsToPr = (run) =>
                run.status !== 'completed' &&
                shas.has(run.head_sha) &&
                (headRepo === null || run.head_repository?.full_name === headRepo) &&
                (run.pull_requests.length === 0 ||
                  run.pull_requests.some((p) => p.number === pr.number));
              // ONE listing with no status filter, keeping everything not
              // completed. Listing per status misses a run that moves from one
              // status to another between the calls.
              const listed = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, branch: pr.head.ref, event: 'pull_request', per_page: 100,
              });
              const runs = listed.filter(belongsToPr);
              const label = `PR #${pr.number} (${headRepo ?? 'deleted fork'}:${pr.head.ref})`;
              core.info(`${label}: ${runs.length === 0 ? 'no' : runs.length} unfinished run(s)`);
              for (const run of runs) core.info(`  ${run.id} ${run.status} ${run.name}`);
              return runs;
            };

            const runs = new Map();
            for (const pr of prs) for (const run of await runsOf(pr)) runs.set(run.id, run);
            if (runs.size === 0) return;

            // 409 means the run already finished, which is the outcome we
            // want. Anything else (403 missing scope, 404) is a real failure.
            const failures = [];
            const post = async (action, run) => {
              try {
                await github.request(`POST /repos/{owner}/{repo}/actions/runs/{run_id}/${action}`, {
                  owner, repo, run_id: run.id,
                });
                core.info(`${action}: ${run.id} ${run.name}`);
                return true;
              } catch (err) {
                if (err.status === 409) {
                  core.info(`${action}: ${run.id} ${run.name} already finished`);
                } else {
                  failures.push(`${action} of ${run.id} ${run.name}: ${err.status} ${err.message}`);
                }
                return false;
              }
            };

            // A run counts as still alive unless a status read says it has
            // completed or no longer exists; an unreadable status is reported,
            // and the run stays in line for the force-cancel.
            const stillAlive = async (run) => {
              try {
                const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                return data.status !== 'completed';
              } catch (err) {
                if (err.status === 404) return false;
                core.warning(`status of ${run.id} ${run.name}: ${err.status} ${err.message}`);
                return true;
              }
            };

            let pending = [];
            for (const run of runs.values()) {
              if (await post('cancel', run)) pending.push(run);
            }

            // Only the runs listed above are escalated: anything that appeared
            // since is not ours to force-cancel without a polite cancel first.
            // Poll so the job frees its own runner as soon as they stop.
            const deadline = Date.now() + graceMs;
            while (pending.length > 0 && Date.now() < deadline) {
              await sleep(5000);
              const alive = [];
              for (const run of pending) {
                if (await stillAlive(run)) alive.push(run);
              }
              pending = alive;
            }

            for (const run of pending) await post('force-cancel', run);

            if (failures.length > 0) core.setFailed(failures.join('\n'));

  delete-caches:
    name: Delete closed pull requests' Actions caches
    # On close (merged or not) for this PR, after the cancel job settled its
    # runs; hourly for every closed PR whose ref still holds entries. The
    # repository cache is capped at 10 GB and evicts the least recently used
    # entries first, so PR-ref entries nothing will read again push main's
    # warm layers out and make BuildKit exports fail mid-write ("cache entry
    # no longer exists").
    needs: cancel
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete every cache entry scoped to a closed PR's refs/pull/<n>/merge
        # Same pin and the same reason as above.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          # 404 is an answer (already evicted), never retried.
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const { owner, repo } = context.repo;
            let refs;
            if (context.payload.pull_request) {
              const pr = context.payload.pull_request;
              const fork = pr.head.repo?.full_name !== `${owner}/${repo}`;
              if (fork || context.actor === 'dependabot[bot]') {
                core.notice(`PR #${pr.number}: this run's token is read-only (${fork ? 'fork' : 'Dependabot'}); the hourly sweep deletes its caches`);
                return;
              }
              refs = [`refs/pull/${pr.number}/merge`];
            } else {
              // Sweep: every PR ref that holds entries, kept only when its PR is closed.
              const all = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, per_page: 100 });
              const numbers = [...new Set(all.map((c) => c.ref.match(/^refs\/pull\/(\d+)\/merge$/)?.[1]).filter(Boolean))];
              refs = [];
              for (const n of numbers) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: Number(n) });
                if (data.state === 'closed') refs.push(`refs/pull/${n}/merge`);
              }
            }
            const failures = [];
            let deleted = 0, gone = 0, bytes = 0;
            for (const ref of refs) {
              const caches = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, ref, per_page: 100 });
              for (const c of caches) {
                try {
                  await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', { owner, repo, cache_id: c.id });
                  deleted += 1;
                  bytes += c.size_in_bytes;
                } catch (err) {
                  if (err.status === 404) gone += 1;
                  else failures.push(`${ref} ${c.id} ${c.key}: ${err.status} ${err.message}`);
                }
              }
            }
            core.info(`${refs.length} closed PR ref(s): deleted ${deleted} entries (${(bytes / 1048576).toFixed(0)} MiB), ${gone} already evicted, ${failures.length} failed`);
            if (failures.length > 0) core.setFailed(failures.join('\n'));
