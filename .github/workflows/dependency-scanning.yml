name: Dependency Scanning

# Guards .github/dependabot.yml against the tree it claims to cover.
#
# NOT path-filtered, on purpose. The failure this catches is a module added
# somewhere with no dependabot entry, and a path filter naming the places
# modules live would have to be edited by exactly the change it is meant to
# catch. no-binaries.yml is unfiltered for the same reason.
#
# ── THE SECOND JOB, AND WHY IT LIVES HERE ───────────────────────────────────
#
# `engine-closures` resolves the two FROZEN analysis-engine closures
# (services/elitea-deepwiki and services/elitea-inventory `engine` extras).
# The full reasoning is in scripts/ci/check-engine-closures.sh; the placement
# reasoning is this:
#
#   * ci-deepwiki-conformance.yml was the obvious alternative and it does not
#     fit. Its triggers cover services/elitea-deepwiki/** and the provider
#     conformance tree, and NOTHING about services/elitea-inventory — so half
#     of what this gate exists to protect would never start it. It also has no
#     schedule arm, and half of this gate's value is the run that happens with
#     no pull request at all.
#   * this workflow is already "the dependabot configuration versus the tree it
#     claims to cover". A closure dependabot is deliberately SILENT on
#     (`ignore: "*"`, `open-pull-requests-limit: 0` for both packages) is the
#     same subject: the manifest nobody is watching. Putting it here also means
#     no new workflow file, and so no new decision to record in
#     scripts/ci/check_workflow_branch_coverage.py's exemption table.
#   * it inherits this workflow's unfiltered `pull_request` arm, which is
#     STRONGER than the path filter the two pyproject files would give it. The
#     input that broke these closures without touching either pyproject is the
#     outside world: a new `elitea-sdk` release, a yanked distribution, an
#     advisory-driven re-pin somewhere upstream. A path filter cannot see any
#     of those.
#
# The schedule arm is new and it is for the same reason: with dependabot
# silenced on both packages, a world change reaches these closures with no pull
# request to attach a gate to. Daily, so "it broke on Tuesday" is answerable.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 06:41 UTC daily. Deliberately away from ci-image-scan.yml's 05:17,
    # deepwiki-real-engine.yml's Sunday 04:23 and the Saturday 02:00 UTC
    # dependabot burst, so the cadence jobs do not contend for the free plan's
    # 20-job concurrency window.
    - cron: "41 6 * * *"
  workflow_dispatch:

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a push to main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-coverage:
    name: Every manifest is scanned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The script reads git ls-files, so it needs the index, not history.
      - name: Check dependabot coverage
        run: bash scripts/ci/check-dependabot-coverage.sh

  engine-closures:
    name: The frozen engine closures still resolve
    runs-on: ubuntu-latest

    # It RESOLVES, it does not install and it does not build. The DeepWiki
    # `-engine` image is ~2 GB and needs >35 GB of disk and tens of minutes,
    # which is exactly why its build is not a per-change gate — and why ten
    # bumps inside these closures reached main with nothing to report them.
    # A resolver answers the same question in seconds without fetching torch.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # 3.12 because both packages declare requires-python ">=3.12,<3.13" and
      # pip resolves for the interpreter it runs on. The script refuses any
      # other version rather than resolving a different set and calling it a
      # pass.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve both engine extras
        run: bash scripts/ci/check-engine-closures.sh
