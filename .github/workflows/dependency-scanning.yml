name: Dependency Scanning

# Guards .github/dependabot.yml against the tree it claims to cover.
#
# NOT path-filtered, on purpose. The failure this catches is a module added
# somewhere with no dependabot entry, and a path filter naming the places
# modules live would have to be edited by exactly the change it is meant to
# catch. no-binaries.yml is unfiltered for the same reason.
#

on:
  pull_request:
  schedule:
    # 06:41 UTC daily. Deliberately away from nightly-image-scan.yml's 05:17,
    # deepwiki-real-engine.yml's Sunday 04:23 and the nightly dependabot run
    # (03:00 Europe/Warsaw, 01:00/02:00 UTC), so the cadence jobs do not contend
    # for the free plan's 20-job concurrency window.
    - cron: "41 6 * * *"
  workflow_dispatch:

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a nightly run on main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependabot-coverage:
    name: Every manifest is scanned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The script reads git ls-files, so it needs the index, not history.
      - name: Check dependabot coverage
        run: bash scripts/ci/check-dependabot-coverage.sh

  # PR #1546 moved every Rust build graph onto zip 9.1.3, which clears
  # CVE-2026-115905 (CRITICAL) and CVE-2026-115907/115908/115909 (HIGH). The
  # fix rests on five `[patch.crates-io]` path entries. Cargo DROPS a patch
  # that no dependant accepts and only prints a warning, so the fix can undo
  # itself with every test still green, and the nightly image scan is the next
  # thing that notices. This gate reads every tracked Cargo.lock and fails on a
  # zip that is not the pin, on a patched crate that resolved from the registry
  # and on a run that read nothing.
  #
  # Unfiltered, like the job above: the change that breaks this is a manifest
  # or a lock anywhere in the tree. scripts/ci/check-zip-pin-test.sh proves the
  # gate red, case by case, in no-binaries.yml.
  zip-pin:
    name: The zip CVE pin holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The script reads git ls-files, so it needs the index, not history. It
      # needs no cargo, no node and no network.
      - name: One zip everywhere, and the zip-9 patches applied
        run: bash scripts/ci/check-zip-pin.sh

  # Dependabot cannot see `azure/setup-helm`'s `version:` input, so it never
  # proposes a newer Helm. This compares the pins (scripts/ci/check-helm-version.mjs)
  # with the newest Helm 4 and Helm 3 releases and fails when either is behind.
  # Daily and on demand only: a new Helm release is not a pull request's fault.
  helm-version-current:
    name: The Helm pins are the latest releases
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the checker's one dependency
        uses: ./.github/actions/ci-scripts-deps
      - name: Compare the pins with the latest Helm releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-helm-version.mjs --latest
