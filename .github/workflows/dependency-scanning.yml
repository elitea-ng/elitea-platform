name: Dependency Scanning

# Guards .github/dependabot.yml against the tree it claims to cover.
#
# NOT path-filtered, on purpose. The failure this catches is a module added
# somewhere with no dependabot entry, and a path filter naming the places
# modules live would have to be edited by exactly the change it is meant to
# catch. no-binaries.yml is unfiltered for the same reason.
#

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # 06:41 UTC daily. Deliberately away from ci-image-scan.yml's 05:17,
    # deepwiki-real-engine.yml's Sunday 04:23 and the Saturday 02:00 UTC
    # dependabot burst, so the cadence jobs do not contend for the free plan's
    # 20-job concurrency window.
    - cron: "41 6 * * *"
  workflow_dispatch:

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a push to main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot-coverage:
    name: Every manifest is scanned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The script reads git ls-files, so it needs the index, not history.
      - name: Check dependabot coverage
        run: bash scripts/ci/check-dependabot-coverage.sh
