name: Dependency Scanning

# Guards .github/dependabot.yml against the tree it claims to cover.
#
# NOT path-filtered, on purpose. The failure this catches is a module added
# somewhere with no dependabot entry, and a path filter naming the places
# modules live would have to be edited by exactly the change it is meant to
# catch. no-binaries.yml is unfiltered for the same reason.
#

on:
  # Called by ci.yml, which owns the PR tiers and the path filter
  # (scripts/ci/tier-paths.json); no `pull_request` arm of its own.
  workflow_call:
  schedule:
    # 06:41 UTC daily. Deliberately away from nightly-image-scan.yml's 05:17,
    # deepwiki-real-engine.yml's Sunday 04:23 and the nightly dependabot run
    # (03:00 Europe/Warsaw, 01:00/02:00 UTC), so the cadence jobs do not contend
    # for the free plan's 20-job concurrency window.
    - cron: "41 6 * * *"
  workflow_dispatch:

# A new push cancels the queued previous run of THIS workflow on the same ref.
# This does not narrow what the gate sees: it still runs unfiltered on every
# push and pull_request (see above), it just stops N superseded copies of the
# same commit range sitting in the queue. The org is on the GitHub free plan —
# 20 concurrent jobs for the whole account — and a nightly run on main starts ~100
# jobs, so a queued run that can never report on current code is a slot another
# gate needs.
concurrency:
  group: dependency-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    name: Dependency scanning
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The vendored-manifest gate's three-dot diff needs the merge base.
          fetch-depth: 0

      # ── Every manifest is scanned ─────────────────────────────────────────────
      - name: Check dependabot coverage
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check-dependabot-coverage.sh

      # PR #1546 moved every Rust build graph onto zip 9.1.3, which clears
      # CVE-2026-115905 (CRITICAL) and CVE-2026-115907/115908/115909 (HIGH). The
      # fix rests on five `[patch.crates-io]` path entries. Cargo DROPS a patch
      # that no dependant accepts and only prints a warning, so the fix can undo
      # itself with every test still green, and the nightly image scan is the next
      # thing that notices. This gate reads every tracked Cargo.lock and fails on a
      # zip that is not the pin, on a patched crate that resolved from the registry
      # and on a run that read nothing.
      #
      # Unfiltered, like the job above: the change that breaks this is a manifest
      # or a lock anywhere in the tree. scripts/ci/check-zip-pin-test.sh proves the
      # gate red, case by case, in no-binaries.yml.
      # ── The zip CVE pin holds ─────────────────────────────────────────────────
      - name: One zip everywhere, and the zip-9 patches applied
        if: ${{ !cancelled() }}
        run: bash scripts/ci/check-zip-pin.sh

      # PR #1547 (a Dependabot nightly group) bumped quick-xml inside the vendored
      # libs/rust/vendor/calamine/Cargo.toml, reached through a path dependency.
      # The copy no longer compiled. A vendored manifest moves only in a re-vendor
      # that records the change in libs/rust/vendor/README.md. This gate fails a
      # pull request that edits one without a README line naming the crate.
      # dependabot.yml excludes the vendor directory; this is the check that
      # does not depend on Dependabot honouring that for a path dependency.
      # Scenarios: scripts/ci/check-vendor-manifest-notes.test.mjs, run in
      # no-binaries.yml.
      # ── A vendored manifest changes only with its patch note ──────────────────
      - name: Each changed vendored manifest has a README note
        if: ${{ !cancelled() && (github.event_name == 'pull_request') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci/check-vendor-manifest-notes.mjs "origin/${BASE_REF}"

      # Dependabot cannot see `azure/setup-helm`'s `version:` input, so it never
      # proposes a newer Helm. This compares the pins (scripts/ci/check-helm-version.mjs)
      # with the newest Helm 4 and Helm 3 releases and fails when either is behind.
      # Daily and on demand only: a new Helm release is not a pull request's fault.
      # ── The Helm pins are the latest releases ─────────────────────────────────
      - name: Install the checker's one dependency
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: ./.github/actions/ci-scripts-deps
      - name: Compare the pins with the latest Helm releases
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-helm-version.mjs --latest

      # ── Code-level scanners (#2246) ────────────────────────────────────────────
      # Steps of this job, not jobs of their own: each is minutes of work that a
      # change to neither Go nor Cargo manifests never needs. The nightly run
      # (and a dispatch) scans everything: changed-paths.mjs answers true there.
      - name: Which scanners does this change reach?
        id: reach
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          node scripts/ci/changed-paths.mjs go '**/*.go' '**/go.mod' '**/go.sum' go.work go.work.sum \
            scripts/ci/govulncheck.mjs scripts/ci/govulncheck-allowlist.json .github/workflows/dependency-scanning.yml
          node scripts/ci/changed-paths.mjs rust '**/Cargo.lock' '**/Cargo.toml' deny.toml \
            scripts/ci/cargo-deny.mjs .github/workflows/dependency-scanning.yml

      # ── govulncheck: go.work's modules, and the gateway with GOWORK=off ──────────
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        with:
          # The cache is .github/actions/go-cache below: setup-go's own saves
          # from every ref (scripts/ci/check-workflow-cache-writes.mjs).
          cache: false
          # go.work's own toolchain: the Go cache key includes the Go version,
          # so only this version hits the entry ci-go.yml writes.
          go-version-file: go.work
      - name: Restore the Go cache (pull requests read, main writes)
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: |
            services/elitea-main/go.sum
            libs/go/*/go.sum
            libs/proto/gen/go/go.sum
          # Read-only: ci-go.yml owns the entry for this key.
          save: "false"
      - name: Install govulncheck
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        # Pinned, as ci-go.yml pins golangci-lint: a moving scanner reddens
        # main and every open PR with no change in this repository.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: govulncheck over go.work's modules
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        env:
          GOVULN_SCOPE: workspace
        run: node scripts/ci/govulncheck.mjs
      # The gateway needs Go 1.27 (its go.mod floor): its own leg, its own cache.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        with:
          cache: false
          go-version: "1.27"
          check-latest: true
      - name: Restore the gateway's Go cache (pull requests read, main writes)
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        uses: ./.github/actions/go-cache
        with:
          cache-dependency-path: services/elitea-llm-gateway/go.sum
          save: "false"
      - name: govulncheck over the gateway (GOWORK=off)
        if: ${{ !cancelled() && steps.reach.outputs.go == 'true' }}
        env:
          GOVULN_SCOPE: gateway
        run: |
          # The binary installed above was built with go.work's toolchain; the gateway leg needs the 1.27 stdlib in the loader.
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          node scripts/ci/govulncheck.mjs

      # ── cargo-deny: every Cargo.lock, one deny.toml ──────────────────────────────
      - name: Install cargo-deny (prebuilt binary)
        if: ${{ !cancelled() && steps.reach.outputs.rust == 'true' }}
        env:
          CARGO_DENY_VERSION: "0.20.2"
          # cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz, from the release
          # download; no compile (the scanner needs none).
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/cargo-deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/cargo-deny.tgz" -C "${RUNNER_TEMP}" "${archive}/cargo-deny"
          sudo install -m 0755 "${RUNNER_TEMP}/${archive}/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version
      - name: cargo-deny over every Cargo.lock
        if: ${{ !cancelled() && steps.reach.outputs.rust == 'true' }}
        run: node scripts/ci/cargo-deny.mjs
