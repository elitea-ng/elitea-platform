name: Build stack images
description: >-
  Builds every `build:` service of the given compose files with buildx bake,
  loads the results into the runner's image store, carries the BuildKit cache
  mounts (cargo, Go, pip) across runs, and asserts every image is present so
  compose can never fall through to a registry pull.
#
# ── Why this exists (measured 2026-09-02) ───────────────────────────────────
#
# Eight runners per pull request built the same images from source with no
# cache of any kind: 10.6 of the 15.2 minutes of a Rust-runtime lane was
# `compose build`, and 9.6 of those were one sequential cargo chain. Every
# Containerfile mounts a dependency cache (`--mount=type=cache`), and every one
# of those mounts died with the runner. A push to main then built the same
# images twice more, under two unrelated GHA cache scopes.
#
# This action makes the three consumers share ONE content-addressed layer
# cache per image (scope `<image>-linux-amd64`, the name publish.yml's amd64
# build already uses) and persists the cache mounts through actions/cache.
#
# ── What it does NOT change ─────────────────────────────────────────────────
#
# The image the stack runs is still built from THIS commit's source. A layer
# is reused only when every input to it is byte-identical — that is what a
# content-addressed cache means — so a cached layer cannot carry a fix it
# does not contain. The failure the previous "no cache" rule was written
# against (#154) was buildx leaving the result in the builder and compose
# then pulling from the registry and getting `denied`. That is a loading
# problem, not a caching problem, and the last step here is the guard for it:
# every image a compose file would build must exist in the local store, or
# the job fails HERE, with the image named, before compose runs.
inputs:
  compose-files:
    description: >-
      Newline-separated compose files RELATIVE TO deploy/, in the order compose
      would take them. bake and the assertion run from deploy/ so the files'
      relative `context:` paths (`..`, `./mock-llm`) resolve as compose resolves
      them; bake resolves them against its working directory, not the file,
      which is how the first run failed with `path "mock-mcp" not found`.
    required: true
  cache-hcl:
    description: Newline-separated bake HCL files, relative to deploy/, carrying the per-target cache scopes and the `standalone` / `e2e` groups.
    required: true
  targets:
    description: The bake group or targets to build (a group name from the cache HCL).
    required: true
  mount-cache-suffix:
    description: Extra suffix for the cache-mount key, so lanes with different mount contents (python vs rust worker) keep separate entries.
    required: false
    default: ""
  cache-write:
    description: >-
      Whether this run may WRITE caches: export every layer (mode=max) and save
      the cargo/Go/pip mounts. Defaults to "on main"; a caller that runs on the
      main ref without being a push to main (a scheduled workflow) passes
      "false" so intent lives with the caller, not with the ref.
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}
runs:
  using: composite
  steps:
    # Third-party (non-`build:`) images the compose files reference — postgres,
    # redis, pgvector, rustfs, traefik, the oidc-mock base, otel, etc. — pulled
    # up front with a bounded retry, before buildx even starts.
    #
    # Why: three CI runs in one day died before any test ran with a Docker Hub
    # connection reset while `compose up` pulled a base image (redis:7-alpine,
    # postgres:18) inline, on the chat-stream shards of ci-web-e2e.yml. Every
    # caller of this action hands compose-files here in the same order and
    # relative-to-deploy/ spelling it later hands to the stack script's `up`,
    # so pulling from the SAME set here means a flaky pull fails loud, with
    # retries, on a step named for it — not silently, minutes later, inside
    # `compose up`.
    #
    # Deliberately excludes anything the `build:` guard below checks: pulling
    # a build-tagged image here would paper over a #154 guard failure with a
    # stale registry tag instead of failing loud.
    - name: Pull third-party images with retry
      shell: bash
      working-directory: ${{ github.workspace }}/deploy
      env:
        COMPOSE_FILES: ${{ inputs.compose-files }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r f; do
          [ -n "$f" ] && args+=("$f")
        done <<< "$COMPOSE_FILES"
        bash "${GITHUB_WORKSPACE}/scripts/ci/pull-third-party-images.sh" "${args[@]}"

    - uses: docker/setup-buildx-action@v4
      id: buildx
      with:
        # v0.37.1: v0.37.0 derives the docker-container driver's readiness
        # wait from the builder container's StartedAt instead of the request
        # time (docker/buildx#4050, fixed in #4058-era v0.37.1). A client
        # request arriving late in that fixed window inherits only
        # milliseconds of wait and fails with `DeadlineExceeded: context
        # deadline exceeded while waiting for connections to become ready`
        # even though the builder is healthy — exactly the failure on run
        # 35673640989: buildkit-cache-dance's 6th sequential inject build
        # (pip), ~16-20s after the container started, got the tail end of
        # the window while the first 5 didn't. Pin past the bug rather than
        # paper over it with retries.
        version: v0.37.1
        # The builder image from the org's own mirror (mirror-buildkit.yml), by
        # digest: no anonymous Docker Hub pull per job.
        driver-opts: image=ghcr.io/elitea-ng/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

    # Belt-and-suspenders for the same class of race: `setup-buildx-action`
    # already runs `buildx inspect --bootstrap` once, but the cache-dance step
    # below makes several MORE `docker buildx build` calls against this same
    # builder in quick succession (one per cache-mount entry), and none of
    # them re-check readiness first. Confirm the builder answers before that
    # step starts, with a bounded retry, so a slow-to-settle container never
    # reaches the dance at all instead of failing partway through it.
    - name: Wait for the builder to be ready
      shell: bash
      env:
        BUILDER: ${{ steps.buildx.outputs.name }}
      run: |
        set -uo pipefail
        deadline=$((SECONDS + 60))
        attempt=0
        until docker buildx inspect --bootstrap --builder "$BUILDER" >/tmp/buildx-inspect.log 2>&1; do
          attempt=$((attempt + 1))
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::builder $BUILDER did not become ready within 60s (attempt $attempt)"
            cat /tmp/buildx-inspect.log
            exit 1
          fi
          echo "builder $BUILDER not ready yet (attempt $attempt), retrying..."
          cat /tmp/buildx-inspect.log
          sleep 3
        done
        echo "builder $BUILDER is ready after $attempt retr$([ "$attempt" = 1 ] && echo y || echo ies)"

    # ── What a run may write, and why (the 10 GB cap) ─────────────────────
    #
    # The repository's Actions cache holds 10 GB, evicted least-recently-used.
    # Measured 2026-09-03: 10.7 GB in 213 entries, 5.9 GB on main and the rest
    # duplicated under four open pull-request branches — a cache entry is
    # scoped to the branch that wrote it, and a pull request can READ main's
    # entries but its own writes are copies main never uses. One pull request
    # held a 1.15 GB cargo target directory of its own.
    #
    # So: every run READS everything (main's layers, main's mounts). Main
    # WRITES everything — every layer (mode=max) and the cargo/Go/pip mounts.
    # A pull request writes only what its second push can profit from and
    # nothing that duplicates main: the final image layers (mode=min), never
    # the mounts. A pull request that changes the Rust worker therefore
    # compiles it cold on its first push and again on its second; that is the
    # trade for keeping the cache under the cap, and main pays it once.
    - name: Decide what this run may write
      id: policy
      shell: bash
      env:
        WRITE: ${{ inputs.cache-write }}
        # The mount-cache key, computed ONCE: a writer and a reader that
        # spelled it separately could drift apart and never hit each other.
        #
        # ── `-v2-`, AND WHY A CACHE KEY NEEDED A GENERATION NUMBER ──────────
        #
        # MEASURED on run 35606872334, `Chat journey on the native Rust
        # runtime`:
        #
        #   Cache hit for: buildkit-mounts-Linux-rust-8ffbe7a7f70e…
        #   Received 391394 of 391394 (100.0%)
        #   Cache Size: ~0 MB (391394 B)
        #
        # 391 KB. The cargo registry, the cargo git checkouts and the whole
        # /cargo-target directory, in 391 KB — i.e. six empty directories. The
        # python lane's entry, for comparison, restores 395 MB and is real.
        #
        # That empty entry was IMMORTAL, and the immortality is the defect.
        # `actions/cache` does not overwrite an existing key: the writer on
        # main hit the key exactly, `skip-extraction` went true because
        # `cache-hit` was true, the dance therefore extracted nothing, and the
        # post step then declined to save because the key already existed. The
        # entry could never be replaced by a populated one, so every Rust
        # build since compiled all 418 crates from an empty registry — 371 s
        # of the 499 s bake, in three shards, on every pull request, for a
        # cache that reported a hit each time. This is the failure mode this
        # action's own header warns about, one layer up: the key exists, so
        # the hit is real, so the miss is invisible.
        #
        # THE FIX IS THE RUN-SCOPED WRITER KEY BELOW, not the generation
        # number — a writer whose key is unique per run never hits exactly, so
        # it always extracts and always saves, and an empty entry can never
        # become permanent again. `-v2-` is only what abandons the poisoned
        # `buildkit-mounts-Linux-rust-…` entry that is already out there; it
        # will be evicted by LRU on its own.
        MOUNT_BASE: buildkit-mounts-v2-${{ runner.os }}-${{ inputs.mount-cache-suffix }}-${{ hashFiles('services/elitea-worker-rust/Cargo.lock', 'services/elitea-main/go.sum', 'services/elitea-llm-gateway/go.sum', 'services/elitea-subapp-host/go.sum', 'services/elitea-worker-python/pyproject.toml', 'services/elitea-deepwiki/pyproject.toml') }}
        MOUNT_PREFIX: buildkit-mounts-v2-${{ runner.os }}-${{ inputs.mount-cache-suffix }}-
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        echo "mount-base=$MOUNT_BASE" >> "$GITHUB_OUTPUT"
        echo "mount-prefix=$MOUNT_PREFIX" >> "$GITHUB_OUTPUT"
        # Writers save under a key no run has used before, so the save always
        # happens; readers never name it and fall through to the prefix.
        echo "mount-write-key=$MOUNT_BASE-$RUN_ID" >> "$GITHUB_OUTPUT"
        if [ "$WRITE" = "true" ]; then
          echo "write-mounts=true" >> "$GITHUB_OUTPUT"; echo "layer-mode=max" >> "$GITHUB_OUTPUT"
        else
          echo "write-mounts=false" >> "$GITHUB_OUTPUT"; echo "layer-mode=min" >> "$GITHUB_OUTPUT"
        fi

    # The BuildKit cache MOUNTS (not layers): cargo registry + git + target,
    # Go module + build cache, pip. Keyed on the lockfiles so a dependency bump
    # writes a new entry, with a prefix fallback so a miss still restores the
    # closest older entry and the build is incremental rather than cold.
    #
    # ORDER IS LOAD-BEARING. buildkit-cache-dance injects the mounts in its
    # main step and EXTRACTS them back to `.buildkit-mounts` only in its POST
    # step. A save that runs as a main step therefore uploads six empty
    # directories, the key then exists, and every later run hits it, skips
    # extraction and never populates it (measured on the first version of this
    # action). So a writer uses the full `actions/cache@v4` — whose save is a
    # post step — registered BEFORE the dance: post steps run in reverse, the
    # dance extracts first, the cache saves second. Readers restore only.
    # The cost, stated: actions/cache saves only when the JOB succeeds, so a
    # main run whose journey flakes after a good bake saves nothing and the
    # next main run rebuilds the mounts cold. Accepted — the alternative was
    # an entry that was never populated at all.
    - name: Restore and later save BuildKit cache mounts (writers)
      if: steps.policy.outputs.write-mounts == 'true'
      id: mounts-rw
      uses: actions/cache@v4
      with:
        path: .buildkit-mounts
        # RUN-SCOPED, so this key CANNOT already exist and the post-step save
        # therefore always runs. The previous spelling was the lockfile key
        # itself, which a writer hit exactly — and an exact hit makes both the
        # extraction (below) and the save no-ops, so whatever the entry held
        # the first time it was written is what it holds for ever. See the
        # policy step's note for the 391 KB it held on the Rust lane.
        #
        # The restore side still wants the closest OLDER entry, so the
        # lockfile-keyed prefix comes first and the suffix-only prefix second:
        # same dependencies beats different dependencies beats nothing.
        key: ${{ steps.policy.outputs.mount-write-key }}
        restore-keys: |
          ${{ steps.policy.outputs.mount-base }}-
          ${{ steps.policy.outputs.mount-prefix }}
    - name: Restore BuildKit cache mounts (readers)
      if: steps.policy.outputs.write-mounts != 'true'
      id: mounts-ro
      uses: actions/cache/restore@v4
      with:
        path: .buildkit-mounts
        # Deliberately NOT a key any writer uses: readers want the newest
        # entry under the prefix, and naming an exact key that happens to
        # exist would pin them to one run's snapshot for ever.
        key: ${{ steps.policy.outputs.mount-base }}-
        restore-keys: |
          ${{ steps.policy.outputs.mount-base }}-
          ${{ steps.policy.outputs.mount-prefix }}

    # Injects the restored directories into the builder's cache mounts before
    # the build and, only when this run will save them, extracts them back
    # after it (a post step). Mount ids default to their target path, which is
    # how every Containerfile in this repository declares them.
    - name: Inject cache mounts into the builder
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.buildx.outputs.name }}
        # `cache-hit` is now structurally false on a writer (the key carries
        # the run id), so this reduces to "readers do not extract" — which is
        # the whole rule. It is spelled with both halves because the second
        # one is what USED to make a writer skip extraction after an exact
        # hit, and a reader of this file should be able to see that it can no
        # longer fire rather than have to reason about it.
        skip-extraction: ${{ steps.policy.outputs.write-mounts != 'true' || steps.mounts-rw.outputs.cache-hit == 'true' }}
        cache-map: |
          {
            ".buildkit-mounts/cargo-registry": "/usr/local/cargo/registry",
            ".buildkit-mounts/cargo-git": "/usr/local/cargo/git",
            ".buildkit-mounts/cargo-target": "/cargo-target",
            ".buildkit-mounts/go-mod": "/go/pkg/mod",
            ".buildkit-mounts/go-build": "/root/.cache/go-build",
            ".buildkit-mounts/pip": "/root/.cache/pip"
          }

    # The write side of the layer cache, derived from the read side so the two
    # cannot name different scopes: every `cache-from` line in the HCL becomes
    # a `cache-to` line with this run's mode.
    - name: Derive the cache-to overlay for this run
      id: overlay
      shell: bash
      working-directory: ${{ github.workspace }}/deploy
      env:
        CACHE_HCL: ${{ inputs.cache-hcl }}
        MODE: ${{ steps.policy.outputs.layer-mode }}
      run: |
        set -euo pipefail
        out="ci/.bake-cache-to.generated.hcl"
        : > "$out"
        n_from=0
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          this=$(grep -c 'cache-from = \["type=gha,scope=' "$f" || true)
          # Per FILE, not only in total: a file that contributes zero scopes
          # lowers both counts equally and the total check below stays green
          # while that file's image builds with no layer cache at all.
          [ "$this" -gt 0 ] || { echo "::error::$f declares no cache-from scope; nothing to derive a cache-to from"; exit 1; }
          n_from=$(( n_from + this ))
          # One `target "<name>" { cache-to = [...] }` block per cache-from line,
          # named after the target block the line sits in.
          awk -v mode="$MODE" '
            /^target "/ { name = $2 }
            /cache-from = \["type=gha,scope=/ {
              sub(/.*scope=/, ""); sub(/".*/, "")
              printf "target %s {\n  cache-to = [\"type=gha,mode=%s,scope=%s\"]\n}\n", name, mode, $0
            }' "$f" >> "$out"
        done <<< "$CACHE_HCL"
        n_to=$(grep -c 'cache-to = ' "$out" || true)
        # Sanity: one cache-to per cache-from, or the derivation silently
        # produced a read-only bake and this step proved nothing.
        [ "$n_to" -eq "$n_from" ] && [ "$n_to" -gt 0 ] || { echo "::error::derived $n_to cache-to lines from $n_from cache-from lines"; exit 1; }
        echo "layer cache: mode=$MODE, $n_to scope(s)"
        echo "file=$out" >> "$GITHUB_OUTPUT"

    # bake reads the compose files as its definition, merges the HCL's
    # per-target cache scopes onto the same-named services, and `load: true`
    # writes every result into the runner's image store (the #154 guard).
    # `source: .` builds from the checked-out tree, not from a fresh git
    # context; `workdir: deploy` puts bake where the compose files are, so their
    # relative contexts resolve as compose resolves them.
    - name: Bake the stack images
      uses: docker/bake-action@v6
      with:
        source: .
        workdir: deploy
        builder: ${{ steps.buildx.outputs.name }}
        files: |
          ${{ inputs.compose-files }}
          ${{ inputs.cache-hcl }}
          ${{ steps.overlay.outputs.file }}
        targets: ${{ inputs.targets }}
        load: true
        provenance: false
        set: |
          *.platform=linux/amd64

    # The guard. Reads the image tags compose would build from the SAME files
    # and requires each to exist locally. A tag that is missing here would
    # otherwise surface as a registry `denied` from compose, minutes later,
    # with the wrong name on it.
    - name: Every image compose would build is in the local store
      shell: bash
      # Explicit: a calling workflow's `defaults.run.working-directory` must
      # not move this off the repository root the compose paths are relative to.
      working-directory: ${{ github.workspace }}/deploy
      env:
        COMPOSE_FILES: ${{ inputs.compose-files }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r f; do
          [ -n "$f" ] && args+=(-f "$f")
        done <<< "$COMPOSE_FILES"
        images="$(docker compose "${args[@]}" config --format json 2>/dev/null \
          | jq -r '.services[] | select(.build != null) | .image' | sort -u)"
        if [ -z "$images" ]; then
          echo "::error::the compose files declare no build: services — the assertion would be vacuous"
          exit 1
        fi
        missing=0
        while IFS= read -r img; do
          if id="$(docker image inspect --format '{{.Id}}' "$img" 2>/dev/null)"; then
            echo "  ✓ $img $id"
          else
            echo "::error::$img was not loaded into the local image store; compose would now try to PULL it (issue #154)"
            missing=1
          fi
        done <<< "$images"
        exit "$missing"
