name: Cache (pull requests read, main writes)
description: >-
  actions/cache with the write side gated on a run on main (the nightly schedule or a
  dispatch; no workflow runs on a push). Every run restores (exact key, then
  the restore-keys prefixes); only a run on main saves.
#
# ── Why (measured 2026-10-16) ───────────────────────────────────────────────
#
# The repository's Actions cache is capped at 10 GB and evicted
# least-recently-used. It held 10.7 GB in 809 entries, and the largest writers
# were pull-request refs: one `setup-go` entry of 1155 MB for
# refs/pull/1298/merge, six of 11–656 MB for refs/pull/1296/merge. A pull
# request can READ main's entries, but its own writes are copies main never
# uses — and each one evicted something main had written, so main held ZERO
# Go caches at the time of the measurement and every run was cold.
#
# So the rule is the one this action encodes: a pull request reads, a push to
# main writes. Pull-request entries already in the cache age out on their own
# (7 days without an access); nothing needs deleting.
#
# ── How ─────────────────────────────────────────────────────────────────────
#
# A composite action cannot declare a post step of its own, but the actions it
# uses keep theirs. The writer therefore uses the full `actions/cache@v6`,
# whose save runs as a post step after the job's own steps; the reader uses
# `actions/cache/restore@v6`, which never saves. One of the two runs (neither
# on a self-hosted runner; see below).
#
# The write condition is spelled literally on the writer step, not passed in:
# an input would let a caller turn writing on from a pull request, and
# scripts/ci/check-workflow-cache-writes.mjs reads this literal.
#
# An exact-key hit makes the writer's save a no-op (actions/cache never
# overwrites a key). That is the same behaviour actions/setup-go and
# actions/setup-node had, and it is what keeps main's footprint at one entry
# per key rather than one per push.
#
# ── Why the writer PATH is a literal, one writer step per slot ──────────────
#
# Measured 2026-11-03: main held NO go-v1-* and NO node-cache-* entry. Every
# Go and npm job ran cold. The save never happened. The post step of the
# writer logged `Input required and not supplied: path` and stopped.
#
# The cause is a runner limit. At job end the runner evaluates the `with:` of
# a post step again, and for an action inside a composite action it does that
# WITHOUT the composite's `inputs` and `steps` contexts. So `path:
# ${{ inputs.path }}` became empty. (actions/cache reads the KEY from the
# state it saved in its main step, so only the inputs it reads again in post,
# `path` first, are lost.) .github/actions/build-stack-images saves its mounts
# with the same actions/cache, and it works, because its path is the literal
# `.buildkit-mounts`.
#
# So each writer step here has a LITERAL path, one step per slot:
#
#   slot  path                              the caller makes the tool use it
#   go    ~/.cache/go-build, ~/go/pkg/mod   go-cache sets GOCACHE, GOMODCACHE
#   npm   ~/.npm                            npm-cache sets NPM_CONFIG_CACHE
#
# The caller still passes `path`, the directories its tool really uses. The
# claim step below FAILS when that path is not the literal path of the slot,
# so the directory that is saved is always the directory that is restored. A
# new slot needs a new writer step, a new reader step with the same literal
# path, and a new line in the claim step.
#
# ── Why the reader PATH is the writer's, character for character ──────────
#
# Measured 2026-11-20: main held node-cache-Linux-x64-npm-955ed20c… and a
# pull request restoring that exact key reported a MISS. An entry's VERSION
# is sha256 of the `path:` lines AS WRITTEN, joined with `|`, plus the
# compression method and "1.0" (@actions/cache getCacheVersion), and a
# restore matches only when key AND version match. The writer saved `~/.npm`
# (version c242501c…); the reader passed `${{ inputs.path }}`, which the
# caller had resolved to `/home/runner/.npm` (version 04d00cc6…). So no pull
# request ever restored a Go or npm cache main wrote.
#
# So the readers spell the writers' literal `~/...` paths too. The tilde
# form also gives the same version on Linux and macOS (`/home/runner` vs
# `/Users/runner`), and @actions/cache expands it at run time.
# check-cache-path-parity.mjs (No Binaries) fails when any restore of a key
# family spells its paths differently from its writer.
#
# ── GitHub-hosted runners only ──────────────────────────────────────────────
#
# The tar inside an entry holds paths RELATIVE TO GITHUB_WORKSPACE: on a
# hosted runner `~/.npm` is saved as `../../../.npm` (workspace
# /home/runner/work/<repo>/<repo>, HOME /home/runner). A self-hosted runner
# with another layout extracts that to wherever `../../..` of ITS workspace
# is, not to its $HOME, so the tool runs cold while the restore fills a
# directory nothing reads; and a self-hosted writer would save its own layout
# under the shared key. Both slots therefore restore and save on
# GitHub-hosted runners only; elsewhere the steps are skipped (a cold run, the
# same result the absolute reader path gave there). On eng-runner
# (.github/actions/eng-runner-env) HOME is /home/runner/_work/_home and the
# workspace /home/runner/_work/<repo>/<repo>, so a hosted `../../../.npm`
# would land in /home/runner/.npm: the container's 10 GiB ephemeral disk,
# which no tool there reads. Only pull requests are routed there; every
# writer (a run on main) stays hosted.
#
# One slot can be used ONE time in a job. Two uses would register two saves of
# the same directory under two keys. The claim step records each slot in
# GITHUB_ENV and FAILS on a second use in the same job.
# scripts/ci/check-workflow-cache-writes.mjs refuses a full actions/cache step
# in a composite action whose path is an expression.
inputs:
  slot:
    description: >-
      The literal-path slot of this cache: `go` or `npm`. See the table in
      the header of this file.
    required: true
  path:
    description: >-
      Newline-separated directories the tool of the job uses (`go env GOCACHE`,
      `npm config get cache`). The claim step checks they are the slot's
      paths, with `~` written as the home directory or as `~`. The restore and
      the save use the slot's LITERAL paths, never this input.
    required: true
  key:
    description: The exact key.
    required: true
  restore-keys:
    description: Newline-separated key prefixes to fall back to on a miss.
    required: false
    default: ""
  save:
    description: >-
      `false` makes a run on main restore only, like a pull request. It can
      only turn writing OFF: the main-run gate stays literal on the writer
      steps, so no value of this input lets a pull request write.
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "'true' on an exact-key hit."
    value: ${{ steps.writer-go.outputs.cache-hit || steps.writer-npm.outputs.cache-hit || steps.reader-go.outputs.cache-hit || steps.reader-npm.outputs.cache-hit }}
  cache-matched-key:
    description: The key that was restored, empty on a miss.
    value: ${{ steps.writer-go.outputs.cache-matched-key || steps.writer-npm.outputs.cache-matched-key || steps.reader-go.outputs.cache-matched-key || steps.reader-npm.outputs.cache-matched-key }}
runs:
  using: composite
  steps:
    - name: Claim the cache slot (one use per job, literal path)
      shell: bash
      env:
        SLOT: ${{ inputs.slot }}
        PATHS: ${{ inputs.path }}
        KEY: ${{ inputs.key }}
      run: |
        set -euo pipefail
        # The literal paths of the writer steps below, in the same order.
        case "$SLOT" in
          go) expected="$HOME/.cache/go-build"$'\n'"$HOME/go/pkg/mod" ;;
          npm) expected="$HOME/.npm" ;;
          *) echo "::error::main-write-cache: unknown slot '$SLOT' (go or npm); a new slot needs its own literal writer step"; exit 1 ;;
        esac
        given=""
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"; line="${line%"${line##*[![:space:]]}"}"
          [ -n "$line" ] || continue
          case "$line" in "~/"*) line="$HOME/${line#"~/"}" ;; esac
          given="${given:+$given$'\n'}${line%/}"
        done <<< "$PATHS"
        if [ "$given" != "$expected" ]; then
          echo "::error::main-write-cache: slot '$SLOT' saves its literal path, but the caller restores a different one."
          printf 'restored:\n%s\nsaved:\n%s\n' "$given" "$expected"
          exit 1
        fi
        marker="ELITEA_MAIN_WRITE_CACHE_SLOT_$(printf '%s' "$SLOT" | tr '[:lower:]' '[:upper:]')"
        if [ -n "${!marker:-}" ]; then
          echo "::error::main-write-cache: slot '$SLOT' is already used in this job (key ${!marker}). One slot saves one directory set; a second use would save it again under a second key."
          exit 1
        fi
        echo "${marker}=${KEY}" >> "$GITHUB_ENV"
    - name: Restore, and save at job end (run on main) — go slot
      id: writer-go
      if: inputs.slot == 'go' && runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.save != 'false'
      uses: actions/cache@v6
      with:
        # LITERAL: the post step evaluates this again without `inputs`.
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: Restore, and save at job end (run on main) — npm slot
      id: writer-npm
      if: inputs.slot == 'npm' && runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.save != 'false'
      uses: actions/cache@v6
      with:
        # LITERAL: the post step evaluates this again without `inputs`.
        path: ~/.npm
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    # The readers spell the SAME literal paths as the writers above, character
    # for character. See "Why the reader PATH is the writer's" in the header.
    - name: Restore only (pull requests and every other run) — go slot
      id: reader-go
      if: ${{ inputs.slot == 'go' && runner.environment == 'github-hosted' && !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.save != 'false') }}
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: Restore only (pull requests and every other run) — npm slot
      id: reader-npm
      if: ${{ inputs.slot == 'npm' && runner.environment == 'github-hosted' && !(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.save != 'false') }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.npm
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: Report the cache result
      shell: bash
      env:
        HIT: ${{ steps.writer-go.outputs.cache-hit || steps.writer-npm.outputs.cache-hit || steps.reader-go.outputs.cache-hit || steps.reader-npm.outputs.cache-hit }}
        MATCHED: ${{ steps.writer-go.outputs.cache-matched-key || steps.writer-npm.outputs.cache-matched-key || steps.reader-go.outputs.cache-matched-key || steps.reader-npm.outputs.cache-matched-key }}
        KEY: ${{ inputs.key }}
        WRITES: ${{ runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.save != 'false' }}
        HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        if [ "$HOSTED" != "true" ]; then
          echo "cache: SKIPPED for key '$KEY' on a self-hosted runner (the entries are GitHub-hosted ones; see main-write-cache)"
        elif [ -n "$MATCHED" ]; then
          echo "cache: restored '$MATCHED' (exact hit: ${HIT:-false}) for key '$KEY'; this run writes: $WRITES"
        else
          echo "cache: MISS for key '$KEY'; this run writes: $WRITES"
        fi
