name: Desktop macOS package
description: >-
  The universal (Apple silicon + Intel) desktop app and its silent .pkg for device
  management (ADR-0052 W2b), signed with the brand owner's Developer ID, notarised and
  stapled, or an unsigned dry run when no signing secret is set. Used by this
  repository's desktop-package.yml and, from a checkout of a release tag, by brand
  repositories (ADR-0052 W5, docs/brand-template/). The caller checks out the tree,
  sets up Node and restores caches; ELITEA_BRAND selects the brand.

inputs:
  root:
    description: The ELITEA source tree (`.` here; `elitea` in a brand repository).
    default: "."
  version:
    description: The release version to stamp (X.Y.Z or X.Y.Z-pre); empty keeps the tree's.
    default: ""
  build-number:
    description: CFBundleVersion with a version (the run number).
    default: ""
  dry-run:
    description: "`true`: never sign (a pull request)."
    default: "false"
  require-signed:
    description: "`true`: fail unless every signing secret is set."
    default: "false"
  apple-certificate: { description: "Secret APPLE_CERTIFICATE (base64 .p12)", default: "" }
  apple-certificate-password: { description: "Secret APPLE_CERTIFICATE_PASSWORD", default: "" }
  apple-signing-identity: { description: "Secret APPLE_SIGNING_IDENTITY (Developer ID Application)", default: "" }
  apple-installer-signing-identity: { description: "Secret APPLE_INSTALLER_SIGNING_IDENTITY (Developer ID Installer)", default: "" }
  apple-api-key: { description: "Secret APPLE_API_KEY (App Store Connect key id)", default: "" }
  apple-api-issuer: { description: "Secret APPLE_API_ISSUER", default: "" }
  apple-api-private-key: { description: "Secret APPLE_API_PRIVATE_KEY (base64 .p8)", default: "" }

outputs:
  signed:
    description: "`true` when the app and the package are signed and notarised."
    value: ${{ steps.plan.outputs.sign }}
  package-dir:
    description: The folder holding the .pkg.
    value: ${{ steps.paths.outputs.out }}

runs:
  using: composite
  steps:
    - name: Paths
      id: paths
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        root="$(cd "$ROOT" && pwd)"
        echo "ELITEA_ROOT=$root" >> "$GITHUB_ENV"
        echo "out=$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"

    - name: Sign or dry run
      id: plan
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.apple-certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        APPLE_INSTALLER_SIGNING_IDENTITY: ${{ inputs.apple-installer-signing-identity }}
        APPLE_API_KEY: ${{ inputs.apple-api-key }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
        APPLE_API_PRIVATE_KEY: ${{ inputs.apple-api-private-key }}
        DRY_RUN: ${{ inputs.dry-run }}
        REQUIRE_SIGNED: ${{ inputs.require-signed }}
      run: |
        flags=(--github-output)
        [ "$DRY_RUN" = true ] && flags+=(--dry-run)
        [ "$REQUIRE_SIGNED" = true ] && flags+=(--require-signed)
        node "$ELITEA_ROOT/apps/elitea-desktop/scripts/desktop-package.mjs" macos "${flags[@]}"

    - name: Stamp the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD: ${{ inputs.build-number }}
      run: node "$ELITEA_ROOT/apps/elitea-desktop/scripts/stamp-version.mjs" "$VERSION" "$BUILD"

    # `tauri build` runs the web desktop build first (beforeBuildCommand).
    - name: Install web and desktop (locked)
      shell: bash
      run: |
        npm ci --prefix "$ELITEA_ROOT/apps/elitea-web"
        npm ci --prefix "$ELITEA_ROOT/apps/elitea-desktop"

    - name: Assert the pinned toolchain, with both macOS targets
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop/src-tauri
      run: |
        bash "$ELITEA_ROOT/scripts/ci/assert-rust-toolchain.sh"
        rustup target add aarch64-apple-darwin x86_64-apple-darwin

    # Restore only: ci-desktop.yml's nightly run writes the host cache here; a
    # brand repository starts cold.
    - name: Restore the cargo cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: false
        workspaces: ${{ inputs.root }}/apps/elitea-desktop/src-tauri

    # The document extractor (ADR-0029 decision 4) is the app's externalBin. A
    # universal app needs a universal sidecar named for the universal triple.
    - name: Build the document sidecar (universal)
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop/doc-extract-sidecar
      run: |
        set -euo pipefail
        bash "$ELITEA_ROOT/scripts/ci/assert-rust-toolchain.sh"
        rustup target add aarch64-apple-darwin x86_64-apple-darwin
        for t in aarch64-apple-darwin x86_64-apple-darwin; do
          cargo build --release --locked --target "$t"
        done
        mkdir -p ../src-tauri/binaries
        # tauri build compiles each architecture on its own, and each compile's
        # build script wants the sidecar for ITS triple; the bundle takes the
        # universal one.
        for t in aarch64-apple-darwin x86_64-apple-darwin; do
          cp "target/$t/release/elitea-doc-extract-sidecar" "../src-tauri/binaries/elitea-doc-extract-sidecar-$t"
        done
        lipo -create -output ../src-tauri/binaries/elitea-doc-extract-sidecar-universal-apple-darwin \
          target/aarch64-apple-darwin/release/elitea-doc-extract-sidecar \
          target/x86_64-apple-darwin/release/elitea-doc-extract-sidecar

    - name: Prepare the notarisation key
      if: steps.plan.outputs.sign == 'true'
      shell: bash
      env:
        APPLE_API_PRIVATE_KEY: ${{ inputs.apple-api-private-key }}
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/AuthKey.p8"
        printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key"
        chmod 600 "$key"
        echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

    # Signed: the Tauri CLI imports the certificate into a temporary keychain, signs
    # with the hardened runtime, notarises and staples. Unsigned: the same build with
    # no APPLE_* in its environment (Tauri then signs nothing).
    - name: Build the universal app
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop
      env:
        APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate || '' }}
        APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate-password || '' }}
        APPLE_SIGNING_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-signing-identity || '' }}
        APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-key || '' }}
        APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-issuer || '' }}
      run: |
        set -euo pipefail
        # Tauri reads an empty APPLE_SIGNING_IDENTITY as an identity: unset the empty ones.
        for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
          [ -n "${!name}" ] || unset "$name"
        done
        node scripts/tauri-brand.mjs
        npx tauri build --target universal-apple-darwin --bundles app \
          --config src-tauri/tauri.brand.json --config src-tauri/tauri.sidecar.conf.json
        {
          echo "DESKTOP_APP=$(node -p 'require("./src-tauri/tauri.brand.json").productName').app"
          echo "DESKTOP_ID=$(node -p 'require("./src-tauri/tauri.brand.json").identifier')"
          echo "DESKTOP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')"
        } >> "$GITHUB_ENV"

    - name: Both architectures are in the app
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
      run: |
        set -euo pipefail
        bin="${DESKTOP_APP}/Contents/MacOS/elitea-desktop"
        # `lipo -archs` (not -verify_arch, whose argument rules differ between Xcode
        # releases): each binary holds exactly arm64 and x86_64.
        for f in "$bin" "${DESKTOP_APP}/Contents/MacOS/elitea-doc-extract-sidecar"; do
          archs="$(lipo -archs "$f" | tr ' ' '\n' | sort | xargs)"
          if [ "$archs" != "arm64 x86_64" ]; then
            echo "::error::$(basename "$f") holds \"$archs\", not arm64 and x86_64"; exit 1
          fi
          echo "$(basename "$f"): $archs"
        done

    # A component package that installs into /Applications with no UI: Jamf, Intune
    # for macOS, Kandji and `sudo installer -pkg … -target /` install it silently.
    - name: Build the installer package
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop
      env:
        INSTALLER_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-installer-signing-identity || '' }}
        APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate || '' }}
        APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate-password || '' }}
        APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-key || '' }}
        APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-issuer || '' }}
      run: |
        bash scripts/macos-pkg.sh \
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/${DESKTOP_APP}" \
          "$DESKTOP_ID" "$DESKTOP_VERSION" "$RUNNER_TEMP/out"

    # Proven, not assumed: Gatekeeper accepts the app and the package, and both
    # carry a stapled ticket.
    - name: The app and the package are signed, notarised and stapled
      if: steps.plan.outputs.sign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        app="$ELITEA_ROOT/apps/elitea-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/${DESKTOP_APP}"
        pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
        codesign --verify --deep --strict --verbose=2 "$app"
        spctl -a -vv --type execute "$app"
        xcrun stapler validate "$app"
        pkgutil --check-signature "$pkg"
        pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
        if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
          echo "::error::the package payload carries AppleDouble ._ files"; exit 1
        fi
        spctl -a -vv --type install "$pkg"
        xcrun stapler validate "$pkg"

    - name: The unsigned package is well formed
      if: steps.plan.outputs.sign != 'true'
      shell: bash
      run: |
        set -euo pipefail
        pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
        # Listed once into a file: `pkgutil | grep -q` under pipefail fails on SIGPIPE.
        pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
        grep -qx "./Applications/${DESKTOP_APP}/Contents/MacOS/elitea-desktop" "$RUNNER_TEMP/payload.txt"
        # Extended attributes would install as AppleDouble `._` files next to the app.
        if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
          echo "::error::the package payload carries AppleDouble ._ files"; exit 1
        fi
        echo "::notice::unsigned dry run: $(basename "$pkg") built; signing and notarisation skipped"

    - name: Remove the notarisation key
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/AuthKey.p8"
