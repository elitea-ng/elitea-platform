name: Desktop macOS package
description: >-
  The Apple silicon (arm64) desktop app, its silent .pkg for device management
  (ADR-0052 W2b) and its styled .dmg for a direct download (owner decision
  2026-11-22), signed with the brand owner's Developer ID, notarised and stapled,
  or an unsigned dry run when no signing secret is set. Intel Macs are not supported
  (owner decision, 2026-11-20): the package refuses to install on one. Used by this
  repository's desktop-package.yml and, from a checkout of a release tag, by brand
  repositories (ADR-0052 W5, docs/brand-template/). The caller checks out the tree,
  sets up Node and restores caches; ELITEA_BRAND selects the brand. It runs on an
  Apple silicon runner (macos-latest) and builds for that host.

inputs:
  root:
    description: The ELITEA source tree (`.` here; `elitea` in a brand repository).
    default: "."
  version:
    description: The release version to stamp (X.Y.Z or X.Y.Z-pre); empty keeps the tree's.
    default: ""
  build-number:
    description: CFBundleVersion with a version (the run number).
    default: ""
  dry-run:
    description: "`true`: never sign (a pull request)."
    default: "false"
  debug:
    description: >-
      `true`: a debug build of the app and the sidecar (only with dry-run: a pull
      request's check reuses ci-desktop.yml's cached debug target). A signed package
      is always a release build.
    default: "false"
  require-signed:
    description: "`true`: fail unless every signing secret is set."
    default: "false"
  apple-certificate: { description: "Secret APPLE_CERTIFICATE (base64 .p12)", default: "" }
  apple-certificate-password: { description: "Secret APPLE_CERTIFICATE_PASSWORD", default: "" }
  apple-signing-identity: { description: "Secret APPLE_SIGNING_IDENTITY (Developer ID Application)", default: "" }
  apple-installer-signing-identity: { description: "Secret APPLE_INSTALLER_SIGNING_IDENTITY (Developer ID Installer)", default: "" }
  apple-api-key: { description: "Secret APPLE_API_KEY (App Store Connect key id)", default: "" }
  apple-api-issuer: { description: "Secret APPLE_API_ISSUER", default: "" }
  apple-api-private-key: { description: "Secret APPLE_API_PRIVATE_KEY (base64 .p8)", default: "" }

outputs:
  signed:
    description: "`true` when the app and the package are signed and notarised."
    value: ${{ steps.plan.outputs.sign }}
  package-dir:
    description: The folder holding the .pkg and the .dmg.
    value: ${{ steps.paths.outputs.out }}
  dmg:
    description: The styled disk image's path.
    value: ${{ steps.dmg.outputs.path }}
  dmg-settings:
    description: The disk image's settings.json (volume name, layout), from the brand.
    value: ${{ steps.dmg.outputs.settings }}

runs:
  using: composite
  steps:
    - name: Paths
      id: paths
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        DRY_RUN: ${{ inputs.dry-run }}
        DEBUG: ${{ inputs.debug }}
      run: |
        set -euo pipefail
        root="$(cd "$ROOT" && pwd)"
        if [ "$DEBUG" = true ] && [ "$DRY_RUN" != true ]; then
          echo "::error::debug: true needs dry-run: true (a package that may be signed is a release build)"; exit 1
        fi
        profile=release
        [ "$DEBUG" = true ] && profile=debug
        {
          echo "ELITEA_ROOT=$root"
          echo "DESKTOP_PROFILE=$profile"
          echo "DESKTOP_BUNDLE=$root/apps/elitea-desktop/src-tauri/target/$profile/bundle/macos"
        } >> "$GITHUB_ENV"
        echo "out=$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"

    - name: Sign or dry run
      id: plan
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ inputs.apple-certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.apple-certificate-password }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        APPLE_INSTALLER_SIGNING_IDENTITY: ${{ inputs.apple-installer-signing-identity }}
        APPLE_API_KEY: ${{ inputs.apple-api-key }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}
        APPLE_API_PRIVATE_KEY: ${{ inputs.apple-api-private-key }}
        DRY_RUN: ${{ inputs.dry-run }}
        REQUIRE_SIGNED: ${{ inputs.require-signed }}
      run: |
        flags=(--github-output)
        [ "$DRY_RUN" = true ] && flags+=(--dry-run)
        [ "$REQUIRE_SIGNED" = true ] && flags+=(--require-signed)
        node "$ELITEA_ROOT/apps/elitea-desktop/scripts/desktop-package.mjs" macos "${flags[@]}"

    - name: Stamp the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD: ${{ inputs.build-number }}
      # No build number: stamp the version alone (an empty argument is not one).
      run: node "$ELITEA_ROOT/apps/elitea-desktop/scripts/stamp-version.mjs" "$VERSION" ${BUILD:+"$BUILD"}

    # `tauri build` runs the web desktop build first (beforeBuildCommand).
    - name: Install web and desktop (locked)
      shell: bash
      run: |
        npm ci --prefix "$ELITEA_ROOT/apps/elitea-web"
        npm ci --prefix "$ELITEA_ROOT/apps/elitea-desktop"

    # The package is built for the runner's own architecture, with no --target:
    # an Intel runner would build an Intel app, so the host triple is asserted.
    - name: Assert the pinned toolchain on Apple silicon
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop/src-tauri
      run: |
        set -euo pipefail
        bash "$ELITEA_ROOT/scripts/ci/assert-rust-toolchain.sh"
        host="$(rustc -vV | sed -n 's/^host: //p')"
        if [ "$host" != aarch64-apple-darwin ]; then
          echo "::error::the macOS package is Apple silicon only; this runner's host is $host (use macos-latest)"; exit 1
        fi

    # The document extractor (ADR-0029 decision 4) is the app's externalBin, named
    # for the host triple as Tauri expects.
    - name: Build the document sidecar
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop/doc-extract-sidecar
      run: |
        set -euo pipefail
        bash "$ELITEA_ROOT/scripts/ci/assert-rust-toolchain.sh"
        flags=(--locked)
        [ "$DESKTOP_PROFILE" = release ] && flags+=(--release)
        cargo build "${flags[@]}"
        mkdir -p ../src-tauri/binaries
        cp "target/$DESKTOP_PROFILE/elitea-doc-extract-sidecar" ../src-tauri/binaries/elitea-doc-extract-sidecar-aarch64-apple-darwin

    - name: Prepare the notarisation key
      if: steps.plan.outputs.sign == 'true'
      shell: bash
      env:
        APPLE_API_PRIVATE_KEY: ${{ inputs.apple-api-private-key }}
      run: |
        set -euo pipefail
        key="$RUNNER_TEMP/AuthKey.p8"
        printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$key"
        chmod 600 "$key"
        echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

    # Signed: the Tauri CLI imports the certificate into a temporary keychain, signs
    # with the hardened runtime, notarises and staples. Unsigned: the same build with
    # no APPLE_* in its environment (Tauri then signs nothing).
    - name: Build the app
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop
      env:
        APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate || '' }}
        APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate-password || '' }}
        APPLE_SIGNING_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-signing-identity || '' }}
        APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-key || '' }}
        APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-issuer || '' }}
      run: |
        set -euo pipefail
        # Tauri reads an empty APPLE_SIGNING_IDENTITY as an identity: unset the empty ones.
        for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
          [ -n "${!name}" ] || unset "$name"
        done
        node scripts/tauri-brand.mjs
        flags=(--bundles app --config src-tauri/tauri.brand.json --config src-tauri/tauri.sidecar.conf.json)
        [ "$DESKTOP_PROFILE" = debug ] && flags+=(--debug)
        npx tauri build "${flags[@]}"
        {
          echo "DESKTOP_APP=$(node -p 'require("./src-tauri/tauri.brand.json").productName').app"
          echo "DESKTOP_ID=$(node -p 'require("./src-tauri/tauri.brand.json").identifier')"
          echo "DESKTOP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')"
        } >> "$GITHUB_ENV"

    - name: The app is Apple silicon only
      shell: bash
      run: |
        set -euo pipefail
        cd "$DESKTOP_BUNDLE"
        # `lipo -archs` names every slice: exactly arm64, no x86_64 and no universal binary.
        for f in "${DESKTOP_APP}/Contents/MacOS/elitea-desktop" "${DESKTOP_APP}/Contents/MacOS/elitea-doc-extract-sidecar"; do
          archs="$(lipo -archs "$f")"
          if [ "$archs" != arm64 ]; then
            echo "::error::$(basename "$f") holds \"$archs\", not arm64 alone"; exit 1
          fi
          echo "$(basename "$f"): $archs"
        done

    # A component package that installs into /Applications with no UI: Jamf, Intune
    # for macOS, Kandji and `sudo installer -pkg … -target /` install it silently.
    - name: Build the installer package
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop
      env:
        INSTALLER_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-installer-signing-identity || '' }}
        APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate || '' }}
        APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate-password || '' }}
        APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-key || '' }}
        APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-issuer || '' }}
      run: |
        bash scripts/macos-pkg.sh "${DESKTOP_BUNDLE}/${DESKTOP_APP}" "$DESKTOP_ID" "$DESKTOP_VERSION" "$RUNNER_TEMP/out"

    # The direct download (owner decision 2026-11-22): a styled disk image, the app on
    # the left and an Applications alias on the right over the brand's background, the
    # volume named `<Brand> <version>` with the brand's icon. Every brand input comes
    # from scripts/dmg-settings.mjs (ELITEA_BRAND); scripts/macos-dmg.sh lays the
    # window out through Finder, checks the .DS_Store it wrote (dmg-verify.mjs) and,
    # signed, codesigns the image with the Developer ID Application identity,
    # notarises and staples it.
    - name: Build the disk image
      id: dmg
      shell: bash
      working-directory: ${{ inputs.root }}/apps/elitea-desktop
      env:
        DMG_SIGNING_IDENTITY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-signing-identity || '' }}
        APPLE_CERTIFICATE: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate || '' }}
        APPLE_CERTIFICATE_PASSWORD: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-certificate-password || '' }}
        APPLE_API_KEY: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-key || '' }}
        APPLE_API_ISSUER: ${{ steps.plan.outputs.sign == 'true' && inputs.apple-api-issuer || '' }}
      run: |
        set -euo pipefail
        inputs="$RUNNER_TEMP/dmg-inputs"
        node scripts/dmg-settings.mjs "$inputs" "$DESKTOP_VERSION"
        dmg="$RUNNER_TEMP/out/${DESKTOP_APP%.app}-${DESKTOP_VERSION}-arm64.dmg"
        bash scripts/macos-dmg.sh "${DESKTOP_BUNDLE}/${DESKTOP_APP}" "$inputs" "$dmg"
        {
          echo "path=$dmg"
          echo "settings=$inputs/settings.json"
        } >> "$GITHUB_OUTPUT"

    # Proven on the finished, compressed image, not only on the writable one it was
    # styled in: mounted read-only, the layout files and records are all there.
    - name: The disk image is styled
      shell: bash
      env:
        DMG: ${{ steps.dmg.outputs.path }}
        SETTINGS: ${{ steps.dmg.outputs.settings }}
      run: |
        set -euo pipefail
        hdiutil verify -quiet "$DMG"
        mnt="$RUNNER_TEMP/dmg-mount"
        rm -rf "$mnt" && mkdir -p "$mnt"
        hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$DMG" >/dev/null
        status=0
        node "$ELITEA_ROOT/apps/elitea-desktop/scripts/dmg-verify.mjs" "$mnt" "$SETTINGS" || status=$?
        ls -la "$mnt"
        hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force -quiet
        [ "$status" -eq 0 ] || { echo "::error::$(basename "$DMG") is not laid out as the brand's settings say"; exit 1; }
        echo "$(basename "$DMG"): \"$(node -p 'require(process.argv[1]).volumeName' "$SETTINGS")\", $(du -h "$DMG" | cut -f1)"

    # The installer refuses an Intel Mac: the product's distribution names arm64
    # as its only host architecture (scripts/macos-pkg.sh).
    - name: The package installs on Apple silicon only
      shell: bash
      run: |
        set -euo pipefail
        pkg="$(ls "$RUNNER_TEMP"/out/*-arm64.pkg)"
        dist="$RUNNER_TEMP/distribution"
        rm -rf "$dist" && mkdir -p "$dist"
        (cd "$dist" && xar -xf "$pkg" Distribution)
        if ! grep -q 'hostArchitectures="arm64"' "$dist/Distribution"; then
          cat "$dist/Distribution"
          echo "::error::$(basename "$pkg") does not limit its host architecture to arm64"; exit 1
        fi
        echo "$(basename "$pkg"): hostArchitectures=arm64"

    # Proven, not assumed: Gatekeeper accepts the app, the package and the disk
    # image, and each carries a stapled ticket.
    - name: The app, the package and the disk image are signed, notarised and stapled
      if: steps.plan.outputs.sign == 'true'
      shell: bash
      run: |
        set -euo pipefail
        app="${DESKTOP_BUNDLE}/${DESKTOP_APP}"
        pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
        codesign --verify --deep --strict --verbose=2 "$app"
        spctl -a -vv --type execute "$app"
        xcrun stapler validate "$app"
        pkgutil --check-signature "$pkg"
        pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
        if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
          echo "::error::the package payload carries AppleDouble ._ files"; exit 1
        fi
        spctl -a -vv --type install "$pkg"
        xcrun stapler validate "$pkg"
        dmg="$(ls "$RUNNER_TEMP"/out/*.dmg)"
        codesign --verify --strict --verbose=2 "$dmg"
        spctl -a -t open --context context:primary-signature -v "$dmg"
        xcrun stapler validate "$dmg"

    - name: The unsigned package is well formed
      if: steps.plan.outputs.sign != 'true'
      shell: bash
      run: |
        set -euo pipefail
        pkg="$(ls "$RUNNER_TEMP"/out/*.pkg)"
        # Listed once into a file: `pkgutil | grep -q` under pipefail fails on SIGPIPE.
        pkgutil --payload-files "$pkg" > "$RUNNER_TEMP/payload.txt"
        grep -qx "./Applications/${DESKTOP_APP}/Contents/MacOS/elitea-desktop" "$RUNNER_TEMP/payload.txt"
        # Extended attributes would install as AppleDouble `._` files next to the app.
        if grep -q '/\._' "$RUNNER_TEMP/payload.txt"; then
          echo "::error::the package payload carries AppleDouble ._ files"; exit 1
        fi
        echo "::notice::unsigned dry run ($DESKTOP_PROFILE build): $(basename "$pkg") and $(basename "$(ls "$RUNNER_TEMP"/out/*.dmg)") built; signing and notarisation skipped"

    - name: Remove the notarisation key
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/AuthKey.p8"
