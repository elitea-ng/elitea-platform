name: Job environment on the self-hosted pool
description: >-
  On eng-runner (deploy/ci-runners/README.md) gives a job the hosted runner's
  cache paths on the 80 GiB work volume, and optionally installs node or
  rustup. On a GitHub-hosted runner it does nothing. Every job routed to
  eng-runner uses it straight after its checkout (check-runner-routing.mjs
  refuses one that does not).
  Why: the runner container has an ephemeral-storage limit of 10 GiB, and only
  /home/runner/_work is a separate volume. The pod template mounts ~/.npm,
  ~/.cache and ~/go from that volume (_homecache/*), so HOME stays
  /home/runner, as on a hosted runner, and the Go and npm caches sit at the
  hosted paths: an actions/cache entry main saved restores here unchanged
  (the cache version hashes the path strings). This action points GOCACHE,
  GOMODCACHE, XDG_CACHE_HOME and the npm cache back at those paths (the image
  ENV names _work/_cache), checks the mounts are there, and keeps TMPDIR,
  CARGO_HOME, RUSTUP_HOME and the tool cache under _work.

inputs:
  node:
    description: >-
      "true" installs node on the pool, for a job that runs node scripts
      without a setup-node step of its own (the pool's image has no node).
    required: false
    default: "false"
  rust:
    description: >-
      "true" installs rustup on the pool (the image has none; hosted runners
      ship it), with no toolchain. The job's assert-rust-toolchain.sh step
      then installs the toolchain rust-toolchain.toml pins, as on a hosted
      runner. check-runner-routing.mjs requires it on a routed job that runs
      cargo, rustc or rustup.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Per-user caches and TMPDIR on the work volume
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        # The tools the routed jobs take from the image
        # (deploy/ci-runners/image/Containerfile). A pod on an image without
        # one fails here, by name, not halfway through a build.
        missing=""
        for tool in cc c++ make cmake pkg-config zstd git jq curl unzip gh helm yq shellcheck mountpoint; do
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "::error::eng-runner-env: this pod's image lacks:$missing. The routed jobs need the eng-runner image (deploy/ci-runners/image/); set ENG_RUNNER to off until the pool runs it."
          exit 1
        fi
        # The pod template mounts these from the work volume (_homecache/*).
        # Without them a Go or npm cache would fill the 10 GiB ephemeral disk.
        for dir in "$HOME/.npm" "$HOME/.cache" "$HOME/go"; do
          if ! mountpoint -q "$dir"; then
            echo "::error::eng-runner-env: $dir is not a mount; the pool's pod template must mount ~/.npm, ~/.cache and ~/go from the work volume (deploy/ci-runners/README.md). Set ENG_RUNNER to off until it does."
            exit 1
          fi
        done
        {
          # The hosted runner's paths (the image ENV names _work/_cache): the
          # go-cache and npm-cache restores then match main's entries.
          echo "XDG_CACHE_HOME=$HOME/.cache"
          echo "GOPATH=$HOME/go"
          echo "GOMODCACHE=$HOME/go/pkg/mod"
          echo "GOCACHE=$HOME/.cache/go-build"
          echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint"
          echo "npm_config_cache=$HOME/.npm"
          # CARGO_HOME and RUSTUP_HOME stay where the image ENV puts them, under
          # _work: a toolchain and a registry are gigabytes, and nothing
          # restores them from a hosted cache.
          echo "TMPDIR=$RUNNER_TEMP"
          # The pod's cgroup gives 4 CPU while nproc reports the node's 8.
          # Every routed job gets the pin here, on the pool only; a job's own
          # `env:` (CARGO_BUILD_JOBS "1" in code-runner) still wins.
          echo "GOMAXPROCS=4"
          echo "CARGO_BUILD_JOBS=4"
          echo "RUST_TEST_THREADS=4"
        } >> "$GITHUB_ENV"
        echo "eng-runner: hosted cache paths on the mounted work volume; TMPDIR, cargo and rustup under _work"
    - uses: actions/setup-node@v7
      if: runner.environment != 'github-hosted' && inputs.node == 'true'
      with:
        node-version: "26"
        # Nothing to install: no automatic cache (check-workflow-cache-writes).
        package-manager-cache: false
    # The rustup-init release binary, not the sh.rustup.rs script: a pinned
    # version, checked against the SHA-256 the release publishes beside it
    # (rustup-init.sha256). The DEFAULT toolchain is the repository pin: a
    # hosted runner has a default (stable), and cargo run from a directory with
    # no rust-toolchain.toml uses it. With none, such a cargo exits at once
    # ("no default toolchain"): local-tools' run_tests fixture runs `cargo test`
    # in a temporary directory and read 0 tests (#2721). Inside the repository
    # rust-toolchain.toml still picks, so nothing else changes.
    # Bump: read the version from static.rust-lang.org/rustup/release-stable.toml
    # and the hash from .../archive/<version>/x86_64-unknown-linux-gnu/rustup-init.sha256.
    - name: rustup on the work volume
      if: runner.environment != 'github-hosted' && inputs.rust == 'true'
      shell: bash
      env:
        RUSTUP_VERSION: "1.29.3"
        RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
      run: |
        set -euo pipefail
        # The image ENV puts it under _work; unset, rustup would install into
        # ~/.cargo on the 10 GiB ephemeral disk.
        case "${CARGO_HOME:-}" in /home/runner/_work/*) ;; *) echo "::error::eng-runner-env: CARGO_HOME (${CARGO_HOME:-unset}) is not under /home/runner/_work; the pool must run the eng-runner image"; exit 1 ;; esac
        [ "$(uname -m)" = x86_64 ] || { echo "::error::eng-runner-env: the rustup pin is x86_64, this pod is $(uname -m)"; exit 1; }
        init="$RUNNER_TEMP/rustup-init"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-all-errors -o "$init" \
          "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
        echo "${RUSTUP_INIT_SHA256}  $init" | sha256sum -c -
        chmod +x "$init"
        "$init" -y --no-modify-path --profile minimal --default-toolchain none
        rm -f -- "$init"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        "$CARGO_HOME/bin/rustup" --version
        pin="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*$/\1/p' "$GITHUB_WORKSPACE/rust-toolchain.toml")"
        [ -n "$pin" ] || { echo "::error::eng-runner-env: read no 'channel = \"X.Y.Z\"' from rust-toolchain.toml; run this after the checkout"; exit 1; }
        for attempt in 1 2 3; do
          if "$CARGO_HOME/bin/rustup" default "$pin"; then break; fi
          [ "$attempt" -lt 3 ] || { echo "::error::eng-runner-env: rustup default $pin failed three times"; exit 1; }
          sleep $((attempt * 10))
        done
        # A process started with a cleared env (local-tools' shell keeps PATH
        # and HOME, not CARGO_HOME/RUSTUP_HOME) falls back to ~/.cargo and
        # ~/.rustup. HOME is /home/runner now, so point those at the _work
        # copies, or rustup finds no default toolchain there.
        for pair in "$CARGO_HOME:$HOME/.cargo" "$RUSTUP_HOME:$HOME/.rustup"; do
          target="${pair%%:*}" link="${pair#*:}"
          [ "$target" = "$link" ] && continue
          if [ -L "$link" ] || [ ! -e "$link" ]; then
            ln -sfn -- "$target" "$link"
          else
            echo "::error::eng-runner-env: $link exists and is not a link; the toolchain lives in $target"
            exit 1
          fi
        done
