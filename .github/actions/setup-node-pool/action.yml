name: Node on the self-hosted pool
description: >-
  Installs node on eng-runner, whose image has none (deploy/ci-runners/README.md),
  and does nothing on a GitHub-hosted runner, which ships one. For jobs that
  run node scripts without a setup-node step of their own; check-runner-routing.mjs
  refuses a routed job that runs node without it.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      if: runner.environment != 'github-hosted'
      with:
        node-version: "26"
        # Nothing to install: no automatic cache (check-workflow-cache-writes).
        package-manager-cache: false
